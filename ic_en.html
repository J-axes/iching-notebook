er).","The second line, divided, shows the minister of the king struggling with difficulty on difficulty, and not with a view to his own advantage. The second line, undivided, shows its subject catch, in hunting, three foxes, and obtain the yellow (= golden) arrows. With firm correctness there will be good fortune. The second line, undivided, shows that it will be advantageous for its subject to maintain a firm correctness, and that action on his part will be evil. He can give increase (to his correlate) without taking from himself.","The third line, undivided, shows its subject advancing, (but only) to (greater) difficulties. He remains stationary, and returns (to his former associates), The third line, divided, shows a porter with his burden, (yet) riding in a carriage. He will (only) tempt robbers to attack him. However firm and correct he may (try to) be, there will be cause for regret. The third line, divided, shows how of three men walking together, the number is diminished by one; and how one, walking, finds his friend.","The fourth line, divided, shows its subject advancing, (but only) to (greater) difficulties. He remains stationary, and unites (with the subject of the line above). (To the subject of) the fourth line, undivided, (it is said), ‘ Remove your toes. Friends will (then) come, between you and whom there will be mutual confidence.’ The fourth line, divided, shows its subject diminishing the ailment under which he labours by making (the subject of the first line) hasten (to his help), and make him glad. There will be no error.","The fifth line, undivided, shows its subject struggling with the greatest difficulties, while friends are coming to help him. The fifth line, divided, shows (its subject), the superior man (=the ruler), executing his function of removing (whatever is injurious to the idea of the hexagram), in which case there will be good fortune, and confidence in him will be shown even by the small men. The fifth line, divided, shows parties adding to (the stores of) its subject ten pairs of tortoise shells, and accepting no refusal. There will be great good fortune. removing all that is contrary to the peace and good order of the kingdom. It will be his duty to remove especially all the small men represented by the divided lines, which he can do with the help of his strong correlate in 2. Then even the small men will change their ways, and repair to him.","The topmost line, divided, shows its subject going forward, (only to increase) the difficulties, with him, and head of some branch of the descendants of the royal house. It is as easy for 5, so supported, to deal with the disunion of the time, as to bite through a picce of skin. In the sixth line, divided, we see a feudal prince (with his bow) shooting at a falcon on the top of a high wall, and hitting it. (The effect of his action) will be in every way advantageous. XL. Xiehis the symbol of loosing,—untying a knot or unravelling a complication; and as the name of this hexagram, it denotes a condition in which the obstruction and difficulty indicated by the preceding Kien have been removed. The object of the author is to show, as if from the lines of the figure, how this new and better state of the kingdom is to be dealt with. See what is said on the The topmost line, undivided, shows its subject giving increase to others without taking from himself. There will be no error. With firm correctness there will be good fortune. There will be advantage in every movement that shall be made. He will find ministers more than can be counted by their clans. XLI. The interpretation of this hexagram is encompassed with great difficulties. Sun is the symbol for the idea of diminishing or diminution; and what is said in Appendix I has made it to be accepted as teaching the duty of the subject to take of what is his and contribute to his ruler, or the expenses of the government under which he lives; in other words, readily and cheerfully to pay his taxes. P. Regis says, ‘Sun seu (vectigalis causa) minuere.... est valde utile ;’ and Canon McClatchie in translating"]},{"num":40,"name":"Deliverance","sequence":"010100","symbol":"䷧","short_name":"Xie","ci":["In (the state indicated by) Xiè advantage will be found in the south-west. If no (further) operations be called for, there will be good fortune in coming back (to the old conditions). If some operations be called for, there will be good fortune in the early conducting of them.","The first line, divided, shows that its subject will commit no error.","The second line, undivided, shows its subject catch, in hunting, three foxes, and obtain the yellow (= golden) arrows. With firm correctness there will be good fortune.","The third line, divided, shows a porter with his burden, (yet) riding in a carriage. He will (only) tempt robbers to attack him. However firm and correct he may (try to) be, there will be cause for regret.","(To the subject of) the fourth line, undivided, (it is said), \"Remove your toes. Friends will (then) come, between you and whom there will be mutual confidence.\"","The fifth line, divided, shows (its subject), the superior man (= the ruler), executing his function of removing (whatever is injurious to the idea of The Judgment), in which case there will he good fortune, and confidence in him will be shown even by the small men.","In the sixth line, divided, we see a feudal prince (with his bow) shooting at a falcon on the top of a high wall, and hitting it. (The effect of his action) will be in every way advantageous."]},{"num":41,"name":"Decrease","sequence":"110001","symbol":"䷨","short_name":"Sun","ci":["In (what is denoted by) Sǔn, if there be sincerity (in him who employs it), there will be great good fortune:--freedom from error; firmness and correctness that can be maintained; and advantage in every movement that shall be made. In what shall this (sincerity in the exercise of Sǔn) be employed? (Even) in sacrifice two baskets of grain, (though there friend. I cannot lay hold of any thread of reason in this.","The second line, divided, shows parties adding to the stores of its subject ten pairs of tortoise shells whose oracles cannot be opposed. Let him persevere in being firm and correct, and there will be good fortune. Let the king, (having the virtues thus distinguished), employ them in presenting his offerings to God, and there will be good fortune.","The third line, divided, shows increase given to its subject by means of what is evil, so that he shall (be led to good), and be without blame. Let him be sincere and pursue the path of the Mean, (so shall he secure the recognition of the ruler, like) an officer who announces himself to his prince by the symbol of his rank.","The fourth line, divided, shows its subject pursuing the due course. His advice to his prince is followed. He can with advantage be relied on in such a movement as that of removing the capital.","The fifth line, undivided, shows its subject with sincere heart seeking to benefit (all below). There need be no question about it; the result will be great good fortune. (All below) will with sincere heart acknowledge his goodness.","In the sixth line, undivided, we see one to whose increase none will contribute, while many will seek to assail him. He observes no regular rule in the ordering of his heart. There will be evil. XLII. Yi has the opposite meaning to Sun, and is the symbol of addition or increasing. What king W4n had in his mind, in connexion with the hexagram, was a ruler or a government operating"]},{"num":43,"name":"Break-through","sequence":"111110","symbol":"䷪","short_name":"Guai","ci":["Kwai requires (in him who would fulfil its meaning) the exhibition (of the culprit’s guilt) in the royal court, and a sincere and earnest appeal (for symso as to dispense benefits to, and increase the resources of all the people. Two indications are evident in the lines ;—the strong line in the ruler’s seat, or the fifth line, and the weak line in the correlative place of 2. Whether there be other indications in the figure or its component trigrams will be considered in dealing with the Appendixes. The writer might well say, on general grounds, of the ruler whom he had in mind, that he would be successful in his enterprises and overcome the ‘greatest difficulties. Line 1 is strong, but its low position might seem to debar its subject from any great enterprise. Favoured as he is, however, according to the general idea of the hexagram, and specially responding to the proper correlate in 4, it is natural that he should make a movement ; and great success will make his rashness be forgotten. With paragraph 2 compare paragraph 5 of the preceding hexagram. Line 2 is weak, but in the centre, and is the correlate of 5. Friends give its subject the valuable gifts mentioned; ‘that is,’ says Kwo Yung (Sung dynasty), ‘men benefit him; the oracles of the divination are in his favour,—spirits, that is, benefit him; and finally, when the king sacrifices to God, He accepts. Heaven confers benefit from above.’ Line 3 is weak, neither central, nor in its correct position. It would seem therefore that its subject should have no increase given to him. But it is the time for giving increase, and the idea of his receiving it by means of evil things is put into the line. That such things serve for reproof and correction is well known to Chinese moralists. But the paragraph goes on also to caution and admonish. Line 4 is the place for a minister, near to that of the ruler. Its subject is weak, but his place is appropriate, and as he follows the pathy and support), with a consciousness of the peril (involved in cutting off the criminal). He should. (also) make announcement in his own city, and show that it will not be well to have recourse at once to arms. (In this way) there will be advantage in whatever he shall go forward to.","The first line, undivided, shows its subject in (the pride of) strength advancing with his toes. He goes forward, but will not succeed. There will be ground for blame.","The second line, undivided, a T its subject full of apprehension and appealing (for sympathy and help). Late at night hostile measures may be (taken against him), but he need not be anxious about them.","The third line, undivided, shows its subject (about to advance) with strong (and determined) looks. There will be evil. (But) the superior man, bent on cutting off (the criminal), will walk alone and encounter the rain, (till he be hated by his proper associates) as if he were contaminated (by the others). (In the end) there will be no blame against him. due course, his ruler will listen to him, and he will be a support in the most critical movements. Changing the capital from place to place was frequent in the feudal times of China. That of Shang, which preceded Au, was changed five times.","The fourth line, undivided, shows one from whose buttocks the skin has been stripped, and who walks slowly and with difficulty. (If he could act) like a sheep led (after its companions), occasion for repentance would disappear. But though he hear these words, he will not believe them.","The fifth line, undivided, shows (the small men like) a bed of purslain, which ought to be uprooted with the utmost determination. (The subject of the line having such determination), his action, in harmony with his central position, will lead to no error or blame.","The sixth line, divided, shows its subject without any (helpers) on whom to call. His end will be evil. XLIII. In Kwai we have the hexagram of the third month, when the last remnant, cold and dark, of winter, represented by the sixth line, is about to disappear before the advance of the warm and bright days of the approaching summer. In the yin line at the top king Wan saw the symbol of a small or bad man, a feudal prince or high minister, lending his power to maintain a corrupt government, or, it might be, a dynasty that was waxen old and ready to vanish away; and in the five undivided lines he saw the representatives of good order, or, it might be, the dynasty which was to supersede the other. This then is the subject of the hexagrami.—how bad men, statesmen corrupt and yet powerful, are to be put out of the way. And he who would accomplish the task must do so by the force of his character more than by force of arms, and by producing a general sympathy on his side. The Thwan says that he must openly denounce the criminal in the court, seek to awaken general sympathy, and at the same time go about his enterprise, conscious of its difficulty and danger."]},{"num":44,"name":"Coming to Meet","sequence":"011111","symbol":"䷫","short_name":"Gou","ci":["KAu shows a female who is bold and strong. It will not be good to marry (such) a female. the enterprise is too early, and the preparation too small to make victory certain. Its subject had better not take the field. Line 2 is strong, and central, and its subject is possessed with the determination to do his part in the work of removal. But his eagerness is tempered by his occupancy of an even place; and he is cautious, and no attempts, however artful, to harm him will take effect. Line 3 is strong, and its subject displays his purpose too eagerly. Being beyond the central position, moreover, gives an indication of evil. Lines 3 and 6 are also proper correlates; and, as elsewhere in the Yi, the meeting of yin and yang lines is associated with falling rain. The subject of 3, therefore, communicates with 6, in a way that annoys his associates ; but nevertheless he commits no error, and, in the end, incurs no blame. Line 4 is not in the centre, nor in an odd place, appropriate to it as undivided. Its subject therefore will not be at rest, nor able to do anything to accomplish the idea of the hexagram. He is symbolised by a culprit, who, according to the ancient and modern custom of Chinese courts, has been bastinadoed till he presents the appearance in the Text. Alone he can do nothing; if he could follow others, like a sheep led along, he might accomplish something, but he will not listen to advice. Purslain grows in shady places, and hence we find it here in close contiguity to the topmost line, which is yin. As 5 is the ruler’s seat, evil may come to him from such contiguity, and strenuous efforts must be made to prevent such an evil. The subject of the line, the ruler in the central place, will commit no error. It must be allowed that the symbolism in this line is not easily managed. The subject of the 6th line, standing alone, may be easily disposed of.","The first line, divided, shows how its subject should be kept (like a carriage) tied and fastened to a metal drag, in which case with firm correctness there will be good fortune. (But) if he move in any direction, evil will appear. He will be (like) a lean pig, which is sure to keep jumping about. The first line, divided, shows its subject with a sincere desire (for union), but unable to carry it out, so that disorder is brought into the sphere of his union. If he cry out (for help to his proper correlate), all at once (his tears) will give place subject ofline 1. It has come into the possession of the subject of 2, by virtue of the meaning of the name Ku, which I have pointed out. With his strength therefore he can repress the advance of 1. The first line, divided, shows its subject advancing upwards with the welcome (of those above him). There will be great good fortune.","The second line, undivided, shows its subject with a wallet of fish. There will be no error. But it will not be well to let (the subject of the first line) go forward to the guests. The second line, divided, shows its subject led forward (by his correlate). There will be good fortune, and freedom from error. There is entire sincerity, and in that case (even the small offerings of) the vernal sacrifice are acceptable. The second line, undivided, shows its subject with that sincerity which will make even the (small) offerings of the vernal sacrifice acceptable. There will be no error.","The third line, undivided, shows one from whose buttocks the skin has been stripped so that he walks with difficulty. The position is perilous, but there will be no great error. The third line, divided, shows its subject striving after union and seeming to sigh, yet nowhere finding any advantage. If he go forward, he will not err, though there may be some small cause for regret. The third line, undivided, shows its subject ascending upwards (as into) an empty city.","The fourth line, undivided, shows its subject with his wallet, but no fish in it. This will give rise to evil. The fourth line, undivided, shows its subject in such a state that, if he be greatly fortunate, he will receive no blame. The fourth line, divided, shows its subject employed by the king to present his offerings on mount Ai. There will be good fortune; there will be no mistake.","The fifth line, undivided, (shows its subject as) a medlar tree overspreading the gourd (beneath it). If he keep his brilliant qualities concealed, (a good issue) will descend (as) from Heaven. The fifth line, undivided, shows the union (of all) under its subject in the place of dignity. There will be no error. If any do not have confidence in him, let him see to it that (his virtue) be great, longcontinued, and firmly correct, and all occasion for repentance will disappear. The fifth line, divided, shows its subject firmly correct, and therefore enjoying good fortune. He ascends the stairs (with all due ceremony).","The sixth line, undivided, shows its subject receiving others on his horns. There will be occasion for regret, but there will be no error. XLIV. The single, divided, line at the top of Kwai, the hexagram of the third month, has been displaced, and Kien has ruled over the fourth month of the year. But the innings of the divided line commence again; and here we have in K4u the hexagram of the fifih month, when light and heat are supposed both to begin to be less. In that divided line Win saw the symbol of the small or unworthy man, beginning to insinuate himself into the government XLV. Tue 3H8u1 HEXAGRAM. In (the state denoted by) 3hui, the king will repair to his ancestral temple. It will be advanof the country. His influence, if unchecked, would go on to grow, and he would displace one good man after another, and fill the vacant seats with others like-minded with himself. The object of Wan in his Thwan, therefore, was to enjoin resistance to the encroachment of this bad man. K 4u is defined as giving the idea of suddenly and casually encountering or meeting with. So does the divided line appear all at once in the figure. And this significance of the name rules in the interpzetation of the lines, so as to set on one side the more common interpretation of them according to the correlation ; showing how the meaning of the figures was put into them from the minds of Wan and Tan in the first place. The sentiments of the The topmost line, divided, shows its subject sighing and weeping; but there will be no error. XLV. 3hui denotes collecting together, or things so collected ; and hence this hexagram concerns the state of the kingdom when a happy union prevails between the sovereign and his ministers, between high and low ; and replies in a vague way to the question how this state is to be preserved; by the influence of religion, and the great man, who is a sage upon the throne. The sixth line, divided, shows its subject advancing upwards blindly. Advantage will be found in a ceaseless maintenance of firm correctness. its subject there may be expected the full realisation of the idea of the hexagram."]},{"num":45,"name":"Gathering Together","sequence":"000110","symbol":"䷬","short_name":"Cui","ci":["In (the state denoted by) Cuì, the king will repair to his ancestral temple. It will be advantageous (also) to meet with the great man; and then there will be progress and success, though the advantage must come through firm correctness. The use of great victims will conduce to good fortune; and in whatever direction movement is made, it will be advantageous.","The first line, divided, shows its subject with a sincere desire (for union), but unable to carry it out, so that disorder is brought into the sphere of his union. If he cry out (for help to his proper correlate), all at once (his tears) will give place to smiles. He need not mind (the temporary difficulty); as he goes forward, there will be no error.","The second line, divided, shows its subject led forward (by his correlate). There will be good fortune, and freedom from error. There is entire sincerity, and in that case (even the small offerings of) the vernal sacrifice are acceptable.","The third line, divided, shows its subject striving after union and seeming to sigh, yet nowhere finding any advantage. If he go forward, he will not err, though there may be some small cause for regret.","The fourth line, undivided, shows its subject in such a state that, if he be greatly fortunate, he will receive no blame.","The fifth line, undivided, shows the union (of all) under its subject in the place of dignity. There will be no error. If any do not have confidence in him, let him see to it that (his virtue) be great, long-continued, and firmly correct, and all occasion for repentance will disappear.","The topmost line, divided, shows its subject sighing and weeping; but there will be no error."]},{"num":46,"name":"Pushing Upward","sequence":"011000","symbol":"䷭","short_name":"Sheng","ci":["Shēng indicates that (under its conditions) there will be great progress and success. Seeking by (the qualities implied in it) to meet with the great man, its subject need have no anxiety. Advance to the south will be fortunate.","The first line, divided, shows its subject advancing upwards with the welcome (of those above him). There will be great good fortune.","The second line, undivided, shows its subject with that sincerity which will make even the (small) offerings of the vernal sacrifice acceptable. There will be no error.","The third line, undivided, shows its subject ascending upwards (as into) an empty city.","The fourth line, divided, shows its subject employed by the king to present his offerings on mount Khî. There will be good fortune; there will be no mistake.","The fifth line, divided, shows its subject firmly correct, and therefore enjoying good fortune. He ascends the stairs (with all due ceremony).","The sixth line, divided, shows its subject advancing upwards blindly. Advantage will be found in a ceaseless maintenance of firm correctness."]},{"num":47,"name":"Oppression","sequence":"010110","symbol":"䷮","short_name":"Kun(Oppression)","ci":["In (the condition denoted by) Khw&n there may (yet be) progress and success. For the firm and hexagram, it shows him to be possessed of modesty and force. Then the ruler’s seat, the fifth place, is occupied by a divided line, indicating that he will welcome the advance of 2. The officer therefore both has the qualities that fit him to advance, and a favourable opportunity to do so. The result of his advance will be fortunate. It is said that after he has met with the ruler, ‘the great man’ in 5, ‘advance to the south will be fortunate.’ AQ Hsi and other critics say that ‘advancing to the south’ is equivalent simply to ‘advancing forwards.’ The south is the region of brightness and warmth; advance towards it will be a joyful progress. As P. Regis explains the phrase, the traveller will proceed ‘ via recta simillima illi qua itur ad austrates felicesque plagas.’ Line 1 is weak, where it should be strong; its subject, that is, is humble and docile. Those above him, therefore, welcome his advance. Another interpretation of the line is suggested by Appendix I; which deserves consideration. As the first line of Sun, moreover, it may be supposed to concentrate in itself its attribute of docility, and be the lord of the trigram. See on the second line efit of it. common sympathy, the subject of 5 will have a measure of success. So the symbolism of this line has been explained,—not very satisfactorily. Line 5 is repressed by 6, and pressed on by 4. Above and below its subject is wounded. Especially is he straitened by the minister in 4, with his scarlet knee-covers. But the upper trigram is Tui, with the quality of complacent satisfaction. And this indicates, it is said, that the subject of 5 gets on notwithstanding his straits, especially by his sincerity. This explanation is not more satisfactory than the last.","The fourth line, undivided, shows its subject proceeding very slowly (to help the subject of the first line), who is straitened by the carriage adorned with metal in front of him. There will be occasion for regret, but the end will be good. K/hi, at the foot of which was the capital of the lords of Kau, seems to take the paragraph out of the sphere of symbolism into that of history. ‘The king’ in it is the last sovereign of Shang; the feudal prince in it is Wan. The fourth line, divided, shows a well, the lining of which is well laid. There will be no error.","The fifth line, undivided, shows its subject with his nose and feet cut off. He is straitened by (his ministers in their) scarlet aprons. He is leisurely in his movements, however, and is satisfied. It will be well for him to be (as sincere) as in sacrificing (to spiritual beings). The fifth line, undivided, shows a clear, limpid well, (the waters from) whose cold spring are (freely) drunk.","The sixth line, divided, shows its subject straitened, as if bound with creepers; or in a high and dangerous position, and saying (to himself), ‘If | move, I shall repent it.’ If he do repent of former errors, there will be good fortune in his going forward. SNE XLVII. The character Khw4n presents us with the picture of a tree within an enclosure; ‘a plant,’ according to Williams, ‘ fading for want of room;’ ‘a tree,’ according to Tai Tung, ‘not allowed to sp  trigram of elegance. When an officer was travelling abroad in ancient times, his gift of introduction at any feudal court was a pheasant. The traveller here emblemed is praised by his attached friends, and exalted to a place of dignity by the ruler to whom he is acceptable. It will be seen how the idea of the fifth line being the ruler’s seat is dropt here as being alien from the idea of the hexagram, so arbitrary is the interpretation of the symbolism.","The sixth line, undivided, shows the representative of penetration beneath a couch, and having lost the axe with which he executed his decisions. However firm and correct he may (try to) be, there will be evil. LVII. With Sun as the fifth of the Fd-hsi trigrams we have become familiar. It symbolises both wind and wood; and has the attributes of flexibility (nearly allied to docility) and penetration. In this hexagram we are to think of it as representing wind with its penetrating power, finding its way into every corner and cranny."]},{"num":58,"name":"The Joyous","sequence":"110110","symbol":"䷹","short_name":"Dui","ci":["Tui intimates that (under its conditions) there will be progress and attainment. (But) it will be advantageous to be firm and correct. correct and improve. Such as it is, however, it requires the operation of the strong and virtuous,‘ the great man.’ Even all this criticism is not entirely satisfactory. Line 1 is weak, where it should be strong. The movements of its subject are expressive of perplexity. He wants vigour and decision. Line 2 is strong, and in the right place, and has a good auspice. Things are placed or hidden beneath a couch or bed; and the subject of the line appears as searching for them. He calls in divination to assist his judgment, and exorcists to expel for him what is bad. The work is great and difficult, so that he appears almost distracted by it; but the issue is good. For this successful explanation of the line, I am indebted to the Khang-hsi? editors. The writer of the  and the advantage of firm correctness is insisted on. With this all will be right.’ With the concluding sentence compare the conclusion of the Thwan of hexagram 18. The topmost line, undivided, shows its subject disposing of (what may be called) its bloody wounds, and going and separating himself from its anxious fears. There will be no error. LIX. Hwé4n, the name of this hexagram, denotes a state of dissipation or dispersion. It is descriptive primarily of men’s minds alienated from what is right and good. This alienation is sure to go on to disorder in the commonwealth; and an attempt is made to show how it should be dealt with and remedied. The topmost line, divided, shows its subject enacting regulations severe and difficult. Even with firmness and correctness there will be evil. But though there will be cause for repentance, it will (by and by) disappear. LX. The primary application of the character Xieh was to denote the joints of the bamboo; it is used also for the joints of the human frame; and for the solar and other terms of the year. Whatever makes regular division may be denominated a Xieh; there enter into it the ideas of regulating and restraining; and the subject of this hexagram is the regulations of government enacted for the guidance and control of the people. How the constituent trigrams are supposed to suggest or indicate this meaning will be seen in Appendix II. A‘ Hsi anticipates that symbolism in trying to account for the statement that the figure gives the promise of success and attainment; but the ground of this is generally made out by referring to the equal division of the undivided and divided lines and our having in 2 and 5, the central places, two undivided lines. An"]},{"num":59,"name":"Dispersion","sequence":"010011","symbol":"䷺","short_name":"Huan","ci":["Huàn intimates that (under its conditions) there will be progress and success. The king goes to his ancestral temple; and it will be advantageous to cross the great stream. It will nd success.","The fifth line, undivided, shows its subject sweetly and acceptably enacting his regulations. There will be good fortune. The onward progress with them will afford ground for admiration.","The topmost line, divided, shows its subject enacting regulations severe and difficult. Even with firmness and correctness there will be evil. But though there will be cause for repentance, it will (by and by) disappear."]},{"num":61,"name":"Inner Truth","sequence":"110011","symbol":"䷼","short_name":"Zhong Fu","ci":["Kung Fd (moves even) pigs and fish, and leads to good fortune. There will be advantage in crossimportant point concerning ‘ regulations’ is brought out in the conclusion of the Thwan,—that they must be adapted to circumstances, and not made too strict and severe. Line 1 is strong, and in its correct place. Its subject therefore would not be wanting in power to make his way. But he is supposed to be kept in check by the strong 2, and the correlate 4 is the first line in the trigram of peril. The course of wisdom therefore is to keep still. The character here rendered door is that belonging to the inner apartments, leading from the hall into which entrance is found by the outer gate, mentioned under line 2. The courtyard outside the door and that inside the gate is one and the same. ‘The ‘Daily Lecture’ says that the paragraph tells an officer not to take office rashly, but to exercise a cautious judgment in his measures. 2 Line 2 is strong, in the wrong place; nor has it a proper correlate. Its subject keeps still, when he ought to be up and doing. There will be evil. Line 3 should be strong, but it is weak. It is neither central nor correct. It has no proper correlate, and it is the topmost line in the trigram of complacent satisfaction. Its subject will not receive the yoke of regulations; and he will find out his mistake, when it is too late. Line 4 is weak, as it ought to be, and its subject has respect to the authority of the strong ruler in 5. Hence o Kwo indicates that (in the circumstances which it implies) there will be progress and attainsubject of the ‘Doctrine of the Mean’ from the 21st chapter onwards, where Remusat rendered it by ‘la perfection,’ ‘la perfection morale,’ and Intorcetta and his coadjutors by ‘vera solidaque perfectio.’ The lineal figure has suggested to the Chinese commentators, from the author of the first Appendix, two ideas in it which deserve to be pointed out. There are two divided lines in the centre and two undivided below them and above them. The divided lines in the centre are held to represent the heart or mind free from all pre-occupation, without any consciousness of self; and the undivided lines, on each side of it, in the centre. of the constituent trigrams are held to denote the solidity of the virtue of one so free from selfishness. There is no unreality in it, not a single flaw. The ‘ Daily Lecture’ at the conclusion of its paraphrase of the Thwan refers to the history of the ancient Shun, and the wonderful achievements of his virtue. The authors give no instance of the affecting of ‘pigs and fishes’ by sincerity, and say that these names are symbolical of men, the rudest and most unsusceptible of being acted on. The Text says that the man thus gifted with sincerity will succeed in the most difficult enterprises. Remarkable is the concluding sentence that he must be firm and correct. Here, as elsewhere throughout the Yi, there comes out the practical character which has distinguished the Chinese people and their best teaching all along the line of history. The translation of paragraph 1 is according to the view approved by the Khang-hsi editors. The ordinary view makes the other to whom the subject of line 1 looks or might look to be the subject of 4; but they contend that, excepting in the case of 3 and 6, the force of correiation should be discarded from the study of this ment. But it will be advantageous to be firm and correct. (What the name denotes) may be done in small affairs, but not in great affairs. (It is like) the notes that come down from a bird on the wing ;—to descend is better than to ascend. There will (in this way) be great good fortune.","The first line, divided, suggests (the idea of) a bird flying, (and ascending) till the issue is evil.","The second line, divided, shows its subject passing by his grandfather, and meeting with his hexagram; for the virtue of sincerity is all centred in itself, thence derived and thereby powerful. For paragraph 2, see Appendix III, Section i, 42. It is in rhyme, and I have there rendered it in rhyme. The ‘young ones of the crane’ are represented by line 1. In the third and fourth sentences we have the symbolism of two men brought together by their sympathy in virtue. The subject of the paragraph is the effect of sincerity.","The third line, undivided, shows its subject taking no extraordinary precautions against danger; and some in consequence finding opportunity to assail and injure him. There will be evil.","The fourth line, undivided, shows its subject falling into no error, but meeting (the exigency of his situation), without exceeding (in his natural course). If he go forward, there will be peril, and he must be cautious. There is no occasion to be using firmness perpetually.","The fifth line, civided, (suggests the idea) of dense clouds, but no rain, coming from our borders in the west. It also (shows) the prince shooting his arrow, and taking the bird in a cave.","The sixth line, divided, shows its subject not meeting the exigency of his situation), and exceeding (his proper course). (It suggests the idea of) a bird flying far aloft. There will be evil. The case is what is called one of calamity and selfproduced injury. LXII. The name Hsido Kwo is explained both by reference to the lines of the hexagram, and to the meaning of the characters."]},{"num":63,"name":"After Completion","sequence":"101010","symbol":"䷾","short_name":"Ji Ji","ci":["Ki 31 intimates progress and success in small matters. There will be advantage in being firm had in his mind our distinction of essentials and non-essentials. Is it ever good to deviate from what is recognised as the established course of procedure? The reply is—never in the matter of right ; but in what is conventional and ceremonial—in what is nonessential—the deviation may be made, and will be productive of good. The form may be given up, but not the substance. But the thing must be done very carefully—humbly and reverently, and in small matters. The symbolism of the bird is rather obscure. The whole of it is intended to teach humility. It is better for the bird to descend, keeping near to where it can perch and rest, than to hold on ascending into the homeless regions of the air. Line 1 is weak, in an odd place, and possessed by the ‘idea of exceeding,’ which belongs to the hexagram. Its correlate is the strong 4, belonging to the trigram X4n, the attribute of which is movement. There is nothing to repress the tendency of 1; rather it is stimulated ; and hence the symbolism. Line 2 is weak, but in its proper place, and in the centre. Its correlate is 5, which is also a weak line. The lines 3 and 4 between them are both strong; and are supposed to represent the father and grandfather of the subject of 2; but he or she goes past them, and meets with the grandmother in5. Again, 5 isthe ruler’s seat. The subject of 2 moves on to him, but not as an enemy; but humbly and loyally, as his minister according to the attributes of a weak line in the central place. It must be allowed that this view of the symbolism and its interpretation is obscure and strained. The subject of line 3 is too confident in his own strength, and too defiant of the weak and small enemies that seek his hurt. RRR or OR eed 8 RSLS ld and correct. There has been good fortune in the beginning; there may be disorder in the end.","The first line, undivided, (shows its subject as a driver) who drags back his wheel, (or as a fox) which ows its subject, with (the state of things) not yet remedied, advancing on; which will lead to evil. But there will be advantage in (trying to) cross the great stream.","The fourth line, undivided, shows its subject by firm correctness obtaining good fortune, so that all occasion for repentance disappears. Let him stir himself up, as if he were invading the Demon region, where for three years rewards will come to him (and his troops) from the great kingdom.","The fifth line, divided, shows its subject by firm correctness obtaining good fortune, and having no occasion for repentance. (We see in him) the brightness of a superior man, and the possession of sincerity. There will be good fortune.","The topmost line, undivided, shows its subject full of confidence and therefore feasting (quietly). There will be no error. (If he) cherish this confidence, till he (is like the fox who) gets his head immersed, it will fail of what is right."]}]};
const _EMBEDDED_HEX = {"111111":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/001.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Strength in Qian, weakness in Kun we find.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): When there were heaven and earth, then afterwards all things were produced. What fills up (the space) between heaven and earth are (those) all things. Hence (Qian and Kun) are followed by Zhun.**","text.tab3":"&0&\n**Creative (Qian): Kh ie n (represents) what is great and originating, penetrating, advantageous, correct and firm.**\n**Great Symbol: Heaven, in its motion, (gives the idea of) strength. The superior man, in accordance with this, nerves himself to ceaseless activity.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Vast is the ‘ great and originating (power) ’ indicated by Azien! All things owe to it their beginning :—it contains all the meaning belonging to (the name) heaven. 2. The clouds move and the rain is distributed ; the various things appear in their developed forms. 3. (The sages) grandly understand (the connexion between) the end and the beginning, and how (the indications of) the six lines (in the hexagram) are accomplished, (each) in its season. (Accordingly) they mount (the carriage) drawn by those six dragons at the proper times, and drive through the sky. 4. The method of Aien is to change and transform, so that everything obtains its correct nature as appointed (by the mind of Heaven); and (thereafter the conditions of) great harmony are preserved in union. The result is ‘what is advantageous, and correct and firm.’ 5. (The sage) appears aloft, high above all things,\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: In the first (or lowest) line, undivided, (we see its subject as) the dragon lying hid (in the deep). It is not the time for active doing.\n\n##### Symbol: ‘The dragon lies hid in the deep ;—it is not the time for active doing :'—(this appears from) the strong-and undivided line’s being in the lowest place.\n\n/1&\n\n&2&\n##### Line 2, Undivided: In the second line, undivided, (we see its subject as) the dragon appearing in the field. It will be advantageous to meet with the great man.\n\n##### Symbol: ‘The dragon appears in the field :'—the diffusion of virtuous influence has been wide.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows its subject taking no extraordinary precautions against danger; and some in consequence finding opportunity to assail and injure him. There will be evil.\n\n##### Symbol: \"Some in consequence find opportunity to assail and injure him. There will be evil:\"--how great will it be!\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows its subject falling into no error, but meeting (the exigency of his situation), without exceeding (in his natural course). If he go forward, there will be peril, and he must be cautious. There is no occasion to be using firmness perpetually.\n\n##### Symbol: \"He meets the exigency (of his situation), without exceeding (the proper course):\"—(he does so), the position being inappropriate (for a strong line).\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, (suggests the idea) of dense clouds, but no rain, coming from our borders in the west. It also (shows) the prince shooting his arrow, and taking the bird in a cave.\n\n##### Symbol: \"There are dense clouds, but no rain:\"—(the line) is in too high a place.\n\n/5&\n\n&6&\n##### Top Line, Divided: The topmost line, divided, shows its subject not meeting (the exigency of his situation), and exceeding (his proper course). (It suggests the idea of) a bird flying far aloft. There will be evil. The case is what is called one of calamity and self-produced injury.\n\n##### Symbol: \"He does not meet the exigency (of his situation), and exceeds (his proper course):\"—(the position indicates) the habit of domineering.\n\n/6&\n\n&7&\n##### Special, Undivided: (The lines of this hexagram are all strong and undivided, as appears from) the use of the number nine. If the host of dragons (thus) appearing were to divest themselves of their heads, there would be good fortune.\n\n##### Symbol: ‘The same undivided line is used’ (in all the places of this hexagram), but the attribute of heaven (thereby denoted) should not (always) take the foremost place.\n\n/7&\n\n\n#### Wen Yan\n\nChapter I. 1. What is called (under Kien) ‘the great and originating’ is (in man) the first and chief quality of goodness ; what is called ‘ the penetrating ’ is the assemblage of excellences ; what is called ‘the advantageous’ is the harmony of all that is right; and what is called ‘the correct and firm’ is the faculty of action.\n\n2. The superior man, embodying benevolence, is fit to preside over men; presenting the assemblage of excellences, he is fit to show in himself the union of all propriety; benefiting (all) creatures, he is fit to exhibit the harmony of all that is right; correct and firm, he is fit to manage (all) affairs.\n\n3. The fact that the superior man practises these four virtues justifies the application to him of the words—‘ Ahien represents what is great and origin- ating, penetrating, advantageous, correct and firm.’\n\nChapter II. 4. What is the meaning of the words under the first line undivided, ‘The dragon lies hid (in the deep) ;—it is not the time for active doing ?’ The Master said :—‘ There he is, with the powers of the dragon, and yet lying hid. The influence of the world would make no change in him; he would do nothing (merely) to secure his fame. He can live, withdrawn from the world, without regret; he can experience disapproval without trouble of mind. Rejoicing (in opportunity), he carries his principles into action; sorrowing (for want of opportunity), he keeps with them in retirement. Yes, he is not to be torn from his root (in himself).’ This is ‘the dragon lying hid.’\n\n5. What is the meaning of the words under the second line, ‘The dragon shows himself and is in the field ;—it will be advantageous to see the great man?’ The Master said :—‘ There he is, with the dragon’s powers, and occupying exactly the central place. He is sincere (even) in his ordinary words, and earnest in his ordinary conduct. Guarding against depravity, he preserves his sincerity. His goodness is recognised in the world, but he does not boast of it. His virtue is extensively displayed, and transformation ensues. The language of the Yi, “The dragon shows himself and is in the field ;—it will be advantageous to see the great man,” refers to a ruler’s virtue.’\n\n6. What is the meaning of the words under the third line, ‘The superior man is active and vigilant all the day, and in the evening (still) careful and apprehensive ;—the position is dangerous, but there will be no mistake ?’ The Master said :—‘The superior man advances in virtue, and cultivates all the sphere of his duty. His leal-heartedness and good faith are the way by which he advances in virtue. His attention to his words and establishing his sincerity are the way by which he occupies in his sphere. He knows the utmost point to be reached, and reaches it, thus showing himself in accord with the first springs (of things); he knows the end to be rested in, and rests in it, thus preserving his righteousness in accordance with that end. Therefore he occupies a high position without pride, and a low position without anxiety. Thus it is that, being active and vigilant, and careful (also) and apprehensive as the time requires, though his position be perilous, he will make no mistake.’\n\n7. What is the meaning of the words under the fourth line, ‘He is as if he were leaping up, (but still) is in the deep;—there will be no mistake ?’ The Master said :—‘ He finds no permanent place either above or below, but he does not commit the error (of advancing). He may advance or recede ;— there is no permanent place for him: but he does not leave his fellows. The superior man, advancing in virtue and cultivating the sphere of his duty, yet wishes (to advance only) at the (proper) time, and therefore there is no mistake.’ |\n\n8. What is the meaning of the words under the fifth line, ‘The dragon is on the wing in the sky ;— it will be advantageous to see the great man?’ The Master said :—‘ Notes of the same key respond to one another; creatures of the same nature seek one another; water flows towards the place that is (low and) damp; fire rises up towards what is dry; clouds follow the dragon, and winds follow the tiger :— (so) the sage makes his appearance, and all men look tohim. Things that draw their origin from heaven move towards what is above; things that draw their origin from the earth cleave to what is below :—so does everything follow its kind.’\n\n9. What is the meaning of the words under the topmost line, ‘The dragon exceeds the proper limits ;—there will be occasion for repentance ?’ The Master said :—‘ The position is noble, but it is not that of office; (its occupant) dwells on high, but he has no people (to rule); and the men of talent and virtue in the positions below will give him no aid;—should he move in such a case, there will be occasion for repentance.’\n\nChapter III. ro. ‘ The dragon lies hid ;—it is not the time for active doing :’—the position is (too) low.\n\n11. ‘The dragon shows himself and is in the field :’—the time (requires him still) to be unem- ployed.\n\n12. ‘All the day active and vigilant :—(he now) does his (proper) business.\n\n13. ‘He is as if he were leaping up, (but still) is in the deep :—he is making trial of himself.\n\n14. ‘The dragon is on the wing in the sky :’— (the subject of the line) is on high and ruling.\n\n15. ‘The dragon exceeds the proper limit, and there will be occasion for repentance :'—when things have been carried to extremity, calamity ensues.\n\n16. Undivided lines appear in all these representations of the great and originating power denoted by Khien :—(what follows in the Y4o tells us how) all under the sky there will be good order.\n\nChapter IV. 17. ‘The dragon lies hid in the deep;—it is not the time for active doing:’—the energy denoted by the undivided line is laid up and hid away as in the deep.\n\n18. ‘The dragon appears in the field :’—all under heaven (begins to be) adorned and brightened.\n\n19. ‘All the day active and vigilant :’—continu- ally, as the time passes and requires, does he act.\n\n20. ‘He is as if he were leaping up, (but still) is in the deep :'—a change is taking place in the method indicated by (this) X Zien diagram.\n\n21. ‘The dragon is on the wing in the sky :’— this shows that his place is based on his heavenly virtue.\n\n22. ‘The dragon exceeds the (proper) limit ;— there will be occasion for repentance :'—the time is come to an end, and so also is his opportunity.\n\n23. Undivided lines appear in all these repre- sentations of the great and originating power denoted by Aien:—and (from what follows in the Y4o) we see the model (of action) afforded by heaven.\n\nChapter V. 24. The ‘greatness’ and ‘ originating’ represented by A Zien refer to it as (the symbol of) what gives their beginning (to all things), and (also) secures their growth and development.\n\n25. ‘The advantageousness and the correctness and firmness’ refer to its nature and feelings (as seen in all the resulting things).\n\n26. Khien, (thus) originating, is able with its admirable benefits to benefit all under the sky. We are not told how its benefits are conferred; but how great is (its operation) !\n\n27. How great is (what is emblemed by) KZien!— strong, vigorous, undeflected, correct, and (in all these qualities) pure, unmixed, exquisite !\n\n28. The six lines, as explained (by the duke of Kau), bring forth and display (its meaning), and everything about it is (thus) indirectly exhibited.\n\n29. (The great man) at the proper time drives with these six dragons through the sky. The clouds move, and the rain is distributed; all under heaven enjoys repose.\n\nChapter VI. 30. In the superior man his conduct is (the fruit of) his perfected virtue, which might be seen therefore in his daily course; but the force of that phrase, ‘lying hid,’ requires him to keep re- tired, and not yet show himself, nor proceed to the full development of his course. While this is the case, the superior man (knows that) it is not the time for active doing.\n\n31. The superior man learns and accumulates the results of his learning; puts questions, and discrimi- nates among those results; dwells magnanimously and unambitiously in what he has attained to; and Carries it into practice with benevolence. What the Yi says,‘The dragon appears in the field :—it will be advantageous to meet with the great man,’ has reference to the virtuous qualities of a ruler (as thus described).\n\n32. In the third line there is a twofold (symbol of) strength, but (the position) is not central. (Its occupant) is not in heaven above, nor is he in the field beneath. Therefore there must be active vigilance and cautious apprehension as the time requires; and though (the position be) perilous, there will be no mistake.\n\n33. In the fourth line there is (the symbol of) strength, but (the position) is not central. (Its Occupant) is not in heaven above, nor is he in the field beneath, nor is he in the place of man inter- mediate. Hence he is in perplexity; and being so, he has doubts about what should be his movements, and so will give no occasion for blame.\n\n34. The great man is he who is in harmony, in his attributes, with heaven and earth; in his bright- ness, with the sun and moon; in his orderly pro- cedure, with the four seasons; and in his relation to what is fortunate and what is calamitous, in har- mony with the spirit-like operations (of Providence). He may precede Heaven, and Heaven will not act in opposition to him; he may follow Heaven, but will act (only) as Heaven at the time would do. If Heaven will not act in opposition to him, how much less will men! how much less will the spirit-like operation (of Providence) !\n\n35. The force of that phrase—‘exceeding the proper limits’s—indicates the knowing to advance but not to retire; to maintain but not to let perish ; to get but not to lose.\n\n36. He only is the sage who knows to advance and to retire, to maintain and to let perish ; and that with- out ever acting incorrectly. Yes, he only is the sage!"},"000000":{"text.tab1":"#### Image\n![local image rendering preview(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/002.jpg)\n\ntext formatting preview\n\nReceptive (Kun): Khwă n (represents) what is great and originating, penetrating, advantageous, correct and having the firmness of a mare.\n\n(**)\n**Receptive (Kun): Khwă n (represents) what is great and originating, penetrating, advantageous, correct and having the firmness of a mare.**\n\n（####）\n#### Receptive (Kun): Khwă n (represents) what is great and originating, penetrating, advantageous, correct and having the firmness of a mare.\n\n（#####）\n##### Receptive (Kun): Khwă n (represents) what is great and originating, penetrating, advantageous, correct and having the firmness of a mare.\n\n（•）\n• 一、Receptive (Kun):\n• 1. Khwă n (represents) what is great and originating, penetrating, advantageous, correct and having the firmness of a mare.\n\n（>）\n> Receptive (Kun): Khwă n (represents) what is great and originating, penetrating, advantageous, correct and having the firmness of a mare.\n\nlink text preview:\n[https://example.com](https://example.com)\n\n![online image rendering preview https://picsum.photos/1200/300](https://picsum.photos/1200/300)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Strength in Qian, weakness in Kun we find.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): When there were heaven and earth, then afterwards all things were produced. What fills up (the space) between heaven and earth are (those) all things. Hence (Qian and Kun) are followed by Zhun.**","text.tab3":"&0&\n**Receptive (Kun): Khwă n (represents) what is great and originating, penetrating, advantageous, correct and having the firmness of a mare. When the superior man (here intended) has to make any movement, if he take the initiative, he will go astray; if he follow, he will find his (proper) lord. The advantageousness will be seen in his getting friends in the south-west, and losing friends in the north-east. If he rest in correctness and firmness, there will be good fortune.**\n**Great Symbol: The (capacity and sustaining) power of the earth is what is denoted by Khwan. The superior man, in accordance with this, with his large virtue supports (men and) things.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Complete is the ‘great and originating (capacity)’ indicated by Khwan! All things owe to it their birth ;—it receives obediently the influences of Heaven. 2. KhwéAn, in its largeness, supports and contains all things. Its excellent capacity matches the unlimited power (of Kien). Its comprehension is wide, and its brightness great. The various things obtain (by it) their full development. 3. The mare is a creature of earthly kind. Its (power of) moving on the earth is without limit; it is mild and docile, advantageous and firm :—such Is the course of the superior man.\n\n#### Lines\n\n&1&\n##### Line 1, Divided: In the first line, divided, (we see its subject) treading on hoarfrost. The strong ice will come (by and by).\n\n##### Symbol: ‘He is treading on hoarfrost;—the strong ice will come (by and by):’—the cold (air) has begun to take form. Allow it to go on quietly according to its nature, and (the hoarfrost) will come to strong ice.\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, (shows the attribute of) being straight, square, and great. (Its operation), without repeated efforts, will be in every respect advantageous.\n\n##### Symbol: The movement indicated by the second line, divided, is ‘from the straight (line) to the square.’ ‘(Its operation), without repeated effort, in every way advantageous,’ shows the brilliant result of the way of earth.\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, (shows its subject) keeping his excellence under restraint, but firmly maintaining it. If he should have occasion to engage in the king's service, though he will not claim the success (for himself), he will bring affairs to a good issue.\n\n##### Symbol: ‘He keeps his excellence under restraint, but firmly maintains it:’—at the proper time he will manifest it. ‘He may have occasion to engage in the king’s service:—great is the glory of his wisdom.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, (shows the symbol of) a sack tied up. There will be no ground for blame or for praise.\n\n##### Symbol: ‘A sack tied up;—there will be no error :’—\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, (shows) the yellow lower garment. There will be great good fortune.\n\n##### Symbol: ‘The yellow lower-garment ;—there will be great good fortune :’—this follows from that ornamental (colour’s) being in the right and central place.\n\n/5&\n\n&6&\n##### Top Line, Divided: The sixth line, divided, (shows) dragons fighting in the wild. Their blood is purple and yellow.\n\n##### Symbol: ‘The dragons fight in the wild :’—the (onward) course (indicated by Khw&n) is pursued to extremity.\n\n/6&\n\n&7&\n##### Special, Divided: (The lines of this hexagram are all weak and divided, as appears from) the use of the number six. If those (who are thus represented) be perpetually correct and firm, advantage will arise.\n\n##### Symbol: ‘(The lines are all weak and divided, as appears from) the use of the number six:’—but (those who are thus represented) becoming perpetually correct and firm, there will thereby be a great consummation.\n\n/7&\n\n\n#### Wen Yan (文言)\n\nChapter I. 1. (What is indicated by) Khwan is most gentle and weak, but, when put in motion, is hard and strong; it is most still, but is able to give every definite form.\n\n2. ‘By following, it obtains its (proper) lord,’ and pursues its regular (course).\n\n3. It contains all things in itself, and its transforming (power) is glorious.\n\n4. Yes, what docility marks the way of Khwan! It receives the influences of heaven, and acts at the proper time.\n\nChapter II. 5. The family that accumulates goodness is sure to have superabundant happiness, and the family that accumulates evil is sure to have superabundant misery. The murder of a ruler by his minister, or of his father by a son, is not the result of the events of one morning or one evening. The causes of it have gradually accumulated,—through the absence of early discrimination. The words of the Yi, ‘He treads on the hoar-frost; the strong ice will come (by and by),’ show the natural (issue and growth of things).\n\n6. ‘Straight’ indicates the correctness (of the internal principle), and ‘square, the righteousness (of the external act). The superior man, (thus represented), by his self-reverence maintains the inward (correctness), and in righteousness adjusts his external acts. His reverence and righteousness being (thus) established, his virtues are not solitary instances or of a single class. ‘Straight, square, and great, working his operations, without repeated efforts, in every respect advantageous :’'—this shows how (such a one) has no doubts as to what he does.\n\n7. Although (the subject of) this divided line has excellent qualities, he (does not display them, but) keeps them under restraint. ‘If he engage with them in the service of the king, and be successful, he will not claim that success for himself :’—this is the way of the earth, of a wife, of a minister. The way of the earth is—‘not to claim the merit of achievement, but on behalf (of heaven) to bring things to their proper issue.\n\n8. Through the changes and transformations produced by heaven and earth, plants and trees grow luxuriantly. If (the reciprocal influence of) heaven and earth were shut up and restrained, we should have (a state that might suggest to us) the case of men of virtue and ability lying in obscurity. The words of the Yi, ‘A sack tied up:—there will be no ground for blame or for praise,’ are in reality a lesson of caution.\n\n9. The superior man (emblemed here) by the ‘yellow’ and correct (colour), is possessed of comprehension and discrimination. He occupies the correct position (of supremacy), but (that emblem) is on (the lower part of) his person. His excellence is in the centre (of his being), but it diffuses a complacency over his four limbs, and is manifested in his (conduct of) affairs :—this is the perfection of excellence.\n\n10. (The subject of) the yin (or divided line) thinking himself equal to the (subject of the) yang, or undivided line, there is sure to be ‘a contest.’ As if indignant at there being no acknowledgment of the (superiority of the subject of the) yang line, (the text) uses the term ‘dragons,’ But still the (subject of neither line) can leave his class, and hence we have ‘the blood’ mentioned. The mention of that as being (both) ‘azure and yellow’ indicates the mixture of heaven and earth. Heaven’s (colour) is azure and earth’s is yellow.\n\n#### Notes\n> Supplementary to the Thwan and Wen Yan on the first and second Hexagrams, and showing how they may be interpreted of man’s nature and doings."},"100010":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/003.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Zhun manifests itself, yet keeps its place; mid darkness still, to light Meng sets its face.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Zhun denotes filling up. Zhun is descriptive of things on their first production. When so produced, they are sure to be in an undeveloped condition. Hence Zhun is followed by Meng.**","text.tab3":"&0&\n**Difficult Beginning (Zhun): K u n (indicates that in the case which it presupposes) there will be great progress and success, and the advantage will come from being correct and firm. (But) any movement in advance should not be (lightly) undertaken. There will be advantage in appointing feudal princes.**\n**Great Symbol: (The trigram representing) clouds and (that representing) thunder form Aun. The superior man, in accordance with this, (adjusts his measures of government) as in sorting the threads of the warp and woof.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Aun we have the strong (Kien) and the weak (Khw4an) commencing their intercourse, and difficulties arising. 2. Movement in the midst of peril gives rise to ‘great progress and success, (through) firm correctness. 3. By the action of the thunder and rain, (which\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows the difficulty (its subject has) in advancing. It will be advantageous for him to abide correct and firm; advantageous (also) to be made a feudal ruler.\n\n##### Symbol: Although ‘there is a difficulty in advancing,’ the mind (of the subject of the line) is set on doing what is correct. While noble, he humbles himself to the mean, and grandly gains the people.\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows (its subject) distressed and obliged to return; (even) the horses of her chariot (also) seem to be retreating. (But) not by a spoiler (is she assailed), but by one who seeks her to be his wife. The young lady maintains her firm correctness, and declines a union. After ten years she will be united, and have children.\n\n##### Symbol: The difficulty (to the subject of) the second line, divided, arises from its place over the undivided line below it. ‘The union and children after ten years’ shows things resuming their regular course.\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows one following the deer without (the guidance of) the forester, and only finding himself in the midst of the forest. The superior man, acquainted with the secret risks, thinks it better to give up the chase. If he went forward, he would regret it.\n\n##### Symbol: ‘One pursues the deer without the (guidance of the) forester :’'—(he does so) in (his eagerness to) follow the game. ‘The superior man gives up the chase, (knowing that) if he go forward he will regret it :'—he would be reduced to extremity.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows (its subject as a lady), the horses of whose chariot appear in retreat. She seeks, however, (the help of) him who seeks her to be his wife. Advance will be fortunate; all will turn out advantageously.\n\n##### Symbol: ‘Going forward after such a search (for a helper)’ shows intelligence.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows the difficulties in the way of (its subject's) dispensing the rich favours that might be expected from him. With firmness and correctness there will be good fortune in small things; (even) with them in great things there will be evil.\n\n##### Symbol: ‘Difficulty is experienced (by the subject of the fifth line) in bestowing his rich favours :’—the extent to which they reach will not yet be conspicuous.\n\n/5&\n\n&6&\n##### Top Line, Divided: The topmost line, divided, shows (its subject) with the horses of his chariot obliged to retreat, and weeping tears of blood in streams.\n\n##### Symbol: ‘He weeps tears of blood in streams :—how can the state (thus emblemed) continue long ?\n\n/6&"},"010001":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/004.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Zhun manifests itself, yet keeps its place; mid darkness still, to light Meng sets its face.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Meng is descriptive of what is undeveloped,—the young of creatures and things. These in that state require to be nourished. Hence Meng is followed by Xu.**","text.tab3":"&0&\n**Youthful Folly (Meng): Măn g (indicates that in the case which it presupposes) there will be progress and success. I do not (go and) seek the youthful and inexperienced, but he comes and seeks me. When he shows (the sincerity that marks) the first recourse to divination, I instruct him. If he apply a second and third time, that is troublesome; and I do not instruct the troublesome. There will be advantage in being firm and correct.**\n**Great Symbol: (The trigram representing) a mountain, and beneath it that for a spring issuing forth form Man g. The superior man, in accordance with this, strives to be resolute in his conduct and nourishes his Virtue.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Mang we have (the trigram for) a mountain, and below it that of a rugged defile with a stream in it. The conditions of peril and arrest\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, (has respect to) the dispelling of ignorance. It will be advantageous to use punishment (for that purpose), and to remove the shackles (from the mind). But going on in that way (of punishment) will give occasion for regret.\n\n##### Symbol: ‘It will be advantageous to use punishment :’—\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, (shows its subject) exercising forbearance with the ignorant, in which there will be good fortune; and admitting (even the goodness of women, which will also be fortunate. (He may be described also as) a son able to (sustain the burden of) his family.\n\n##### Symbol: ‘A son able to (sustain the burden of) his family:’—as appears from the reciprocation between this strong line and the weak (fifth line).\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, (seems to say) that one should not marry a woman whose emblem it might be, for that, when she sees a man of wealth, she will not keep her person from him, and in no wise will advantage come from her.\n\n##### Symbol: ‘A woman (such as is here represented) should not be taken in marriage:’—her conduct is not agreeable to what is right.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, (shows its subject as if) bound in chains of ignorance. There will be occasion for regret.\n\n##### Symbol: ‘The regret arising from ignorance bound in chains’ is due to the special distance of (the subject of this line) from the solidity (shown in lines 2 and 6).\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows its subject as a simple lad without experience. There will be good fortune.\n\n##### Symbol: ‘The good fortune belonging to the simple lad without experience’ comes from his docility going on to humility.\n\n/5&\n\n&6&\n##### Top Line, Undivided: In the topmost line, undivided, we see one smiting the ignorant (youth). But no advantage will come from doing him an injury. Advantage would come from warding off injury from him.\n\n##### Symbol: ‘Advantage will come from warding off injury:’'—(the subject of this line) above and (the ignorant) below, all do and are done to in accordance with their nature.\n\n/6&"},"111010":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/005.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Xu shows its subject making no advance; in Song we seek in vain a friendly glance; and Da Guo's overthrown with sad mischance.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Xu is descriptive of the way in which meat and drink (come to be supplied). Over meat and drink there are sure to be contentions. Hence Xu is followed by Song.**","text.tab3":"&0&\n**Waiting (Xu): Hs ü intimates that, with the sincerity which is declared in it, there will be brilliant success. With firmness there will be good fortune; and it will be advantageous to cross the great stream.**\n**Great Symbol: (The trigram for) clouds ascending over that**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Hsii denotes waiting. (The figure) shows peril in front ; but notwithstanding the firmness and strength (indicated by the inner trigram), its subject does not allow himself to be involved (in the dangerous defile);—it is right he should not be straitened or reduced to extremity. 2. When it is said that, ‘with the sincerity declared in Hsii, there will be brilliant success, and with firmness there will be good fortune,’ this is shown by the position (of the fifth line) in the place assigned by Heaven, and its being the correct position for it, and in the centre. ‘It will be advantageous to go through the great stream ;'—that is, going forward will be followed by meritorious achievement.\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows its subject waiting in the distant border. It will be well for him constantly to maintain (the purpose thus shown), in which case there will be no error.\n\n##### Symbol: ‘He is waiting in the (distant) border :’—he makes no movement to encounter rashly the difficulties (of the situation). ‘It will be advantageous for him constantly to maintain (the purpose thus shown), in which case there will be no error :’—he will not fail to pursue that regular course.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows its subject waiting on the sand (of the mountain stream). He will (suffer) the small (injury of) being spoken (against), but in the end there will be good fortune.\n\n##### Symbol: ‘He is waiting on the sand:’—he occupies his position in the centre with a generous forbearance. Though ‘he suffer the small injury of being spoken (against),’ he will bring things to a good issue.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows its subject in the mud (close by the stream). He thereby invites the approach of injury.\n\n##### Symbol: ‘He is waiting in the mud :’—calamity is (close at hand, and as it were) in the outer (trigram). ‘He himself invites the approach of injury:’—if he be reverent and careful, he will not be worsted.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows its subject waiting in (the place of) blood. But he will get out of the cavern.\n\n##### Symbol: ‘He is waiting in (the place of) blood:’—he accommodates himself (to the circumstances of the time), and hearkens to (its requirements).\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows its subject waiting amidst the appliances of a feast. Through his firmness and correctness there will be good fortune.\n\n##### Symbol: ‘The appliances of a feast, and the good fortune through being firm and correct, are indicated by (the position in) the central and correct place.\n\n/5&\n\n&6&\n##### Top Line, Divided: The topmost line, divided, shows its subject entered into the cavern. (But) there are three guests coming, without being urged, (to his help). If he receive them respectfully, there will be good fortune in the end.\n\n##### Symbol: ‘Guests come unurged (to give their help), and if (the subject of the line) receive them respectfully, there will be good fortune in the end:'—though the occupant and the place are not suited to each other, there has been no great failure (in what has been done).\n\n/6&"},"010111":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/006.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Xu shows its subject making no advance; in Song we seek in vain a friendly glance; and Da Guo's overthrown with sad mischance.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Song is sure to cause the rising up of the multitudes; and hence it is followed by Shi.**","text.tab3":"&0&\n**Conflict (Song): Sun g intimates how, though there is sincerity in one's contention, he will yet meet with opposition and obstruction; but if he cherish an apprehensive caution, there will be good fortune, while, if he must prosecute the contention to the (bitter) end, there will be evil. It will be advantageous to see the great man; it will not be advantageous to cross the great stream.**\n**Great Symbol: (The trigram representing) heaven and (that representing) water, moving away from each other, form Sung. The superior man, in accordance with this, in the transaction of affairs takes good counsel about his first steps.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): The upper portion of Sung is (the trigram representing) strength, and the lower (that representing) peril. (The coming together of) Strength and peril gives (the idea in) Sung. 2. ‘Sung intimates how, though there is sincerity in one’s contention, he will yet meet with Opposition and obstruction; but if he cherish an apprehensive caution, there will be good fortune :'— a strong (line) has come and got the central place (in the lower trigram).\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows its subject not perpetuating the matter about which (the contention is). He will suffer the small (injury) of being spoken against, but the end will be fortunate.\n\n##### Symbol: ‘IIe does not perpetuate the matter about which (the contention is):’—contention should not be prolonged. Although ‘he may suffer the small (injury) of being spoken against, his argument is clear.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows its subject unequal to the contention. If he retire and keep concealed (where) the inhabitants of his city are (only) three hundred families, he will fall into no mistake.\n\n##### Symbol: ‘He is unequal to the contention; he retires and keeps concealed, stealthily withdrawing from it: —for him from his lower place to contend with (the stronger one) above, would be to (invite) calamity, as if he brought it with his hand to himself.\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows its subject keeping in the old place assigned for his support, and firmly correct. Perilous as the position is, there will be good fortune in the end. Should he perchance engage in the king's business, he will not (claim the merit of) achievement.\n\n##### Symbol: ‘He confines himself to the support assigned\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows its subject unequal to the contention. He returns to (the study of Heaven's) ordinances, changes (his wish to contend), and rests in being firm and correct. There will be good fortune.\n\n##### Symbol: ‘He returns to (the study of Heaven’s) ordinances, changes (his wish to contend), and rests in being firm and correct:’—he does not fail (in doing what is right).\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows its subject contending;—and with great good fortune.\n\n##### Symbol: ‘He contends ;—and with great fortune:’— this is shown by his holding the due mean and being in the correct place.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The topmost line, undivided, shows how its subject may have the leathern belt conferred on him (by the sovereign), and thrice it shall be taken from him in a morning.\n\n##### Symbol: ‘He receives the robe through his contention: —but still he is not deserving of respect.\n\n/6&"},"010000":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/007.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Bi shows us joy, and Shi the anxious mind.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Shi has the signification of multitudes, and between multitudes there must be some bond of union. Hence it is followed by Bi.**","text.tab3":"&0&\n**The Army (Shi): Sz e
