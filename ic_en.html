<!DOCTYPE html>
<html lang="tc">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IC Notebook</title>
<style>
:root{
  /* ── 左欄佈局 ── */
  --panel-w:  240px; /* .yao-btn / .shibo-row / .msg / .tab-bar 的 width；.settings-panel 的 width */
  --yao-h:     44px; /* .yao-btn（六個爻位按鈕）的 height */
  --ctrl-h:    36px; /* .num-arrow / .num-input / .lock-btn / .search-btn / .settings-btn 的 height；也作 .msg min-height */
  --bit-sz:    32px; /* .bit-toggle（六個數位格）的 width 和 height（正方形） */
  --arrow-w:   24px; /* .num-arrow（序列號 ◀▶ 按鈕）的 width */
  --input-w:   88px; /* .num-input（序列號輸入框）的 width */
  --col-gap:    5px; /* .yao-col 的 gap，控制六個爻位按鈕與 bit-row 之間的垂直間距 */
  --row-gap:  7.5px; /* .bit-row 和 .num-ctrl 的 margin-top，距上方爻位列的距離 */
  --tab-gap:   10px; /* .tab-bar 的 margin-top 和 gap，控制頁籤列與上方元素距離及頁籤間距 */
  --shibo-gap:  8px; /* .shibo-row 的 gap，筮卜按鈕、設置按鈕、保存按鈕之間的水平間距 */
  --shibo-mt:   2px; /* .yao-bian-btn 和 .shibo-row 的 margin-top */
  --sep-m:      4px; /* .hex-sep（上下卦虛線分隔）的 margin-top 和 margin-bottom */
  --tab-pad:    6px; /* .tab-btn（圖占/地理/爻辭/卦象）的 padding-top 和 padding-bottom */
  --tab-outline-offset: 2px; /* .tab-btn 雙框線的間距，隨面板縮放 */
  /* ── 左欄結構 ── */
  --yao-pad:   18px; /* .yao-btn 的 padding-left 和 padding-right */
  --yao-gap:   14px; /* .yao-btn 內部 flex gap，分隔 .yao-lbl 標籤與 .line-wrap 爻線區域 */
  --lbl-w:     28px; /* .yao-lbl（初爻/二爻…上爻 文字標籤）的固定 width */
  --char-sz:   94px; /* .tri-bg-char（背景半透明卦名大字，如「坤」）的 font-size */
  --char-small:11px; /* .tri-bg-num（卦序號）和 .tri-bg-thing（物象，如「地」）的 font-size */
  --char-off:  55px; /* .tri-bg-num 和 .tri-bg-thing 距 .tri-bg-char 中心的垂直偏移（top calc） */
  --icon-sz:   20px; /* .search-btn / .lock-btn / .settings-btn 內部 SVG 圖示的大小 */
  /* ── 左欄字型 ── */
  --fs-ctrl: 14.4px; /* .yao-bian-btn / .shibo-btn / .tab-btn 的 font-size */
  --fs-msg:  13.6px; /* .msg（訊息欄）的 font-size */
  --fs-lbl:    12px; /* .yao-lbl（初爻…上爻）的 font-size */
  --fs-mono:   14px; /* monospace UI elements: bit-toggle, num-input, save-record-bits, rec-prop-rows */
  --fs-bitToggle:    16px; /* 6-digit bit-toggle display */
  --fs-tip: 11.52px; /* [data-tip]::after（tooltip 浮層）的 font-size */
  --fs-rec:    20px; /* .save-record 整列的基準 font-size（收藏星號繼承此值） */
  --fs-time:   10px; /* .save-record-time（日期時間戳）的 font-size */
  /* ── 右欄標題（.hex-header）── */
  --hdr-symbol-sz:60.8px; /* .hex-symbol（卦象符號 ☰☷☵…）的 font-size */
  --hdr-name-sz:  25.6px; /* .hex-name（卦名，如「坤」）的 font-size */
  --hdr-meta-sz:  13.6px; /* .hex-meta（卦序號、爻位數 meta 資訊）的 font-size */
  --hdr-btn-sz:   12.8px; /* .show-hex-btn（展示本卦／之卦切換按鈕）的 font-size */
  --hdr-arrow-sz:   64px; /* .hex-arrow（本卦→之卦的「→」符號）的 font-size */
  --hdr-lbl-sz:     16px; /* .hex-arrow-label（「本卦」「之卦」標籤）的 font-size */
  --hdr-title-sz:   32px; /* .guaxiang-title（卦象頁大標題）的 font-size */
  --hdr-gap:        16px; /* .hex-header 的 gap，分隔符號、卦名、meta、按鈕 */
  --hdr-mb:         16px; /* .hex-header 的 margin-bottom */
  --hdr-pb:         16px; /* .hex-header 的 padding-bottom（底部分隔線上方空間） */
  --hdr-btn-pv:      6px; /* .show-hex-btn 的 padding-top 和 padding-bottom */
  --hdr-btn-ph:     10px; /* .show-hex-btn 的 padding-left 和 padding-right */
  --hdr-dual-gap:   20px; /* .hex-header-dual（本卦/之卦雙欄 grid）的 gap */
  --hdr-unit-gap:    4px; /* .hex-unit（單卦符號+卦名縱向排列）的 gap */
  --hdr-title-mb:   12px; /* .guaxiang-title 的 margin-bottom */
  /* ── 右欄正文字型 ── */
  --body-sec-sz:  16px;    /* .sec-heading（一級段落標題，帶底線）的 font-size */
  --body-sub-sz:  14.88px; /* .sub-heading（二級子標題，帶虛線底線）的 font-size */
  --body-yao-sz:  14.08px; /* .yao-heading（爻辭左邊框標題）的 font-size */
  --body-item-sz: 14.72px; /* .content-item（帶左邊框的內容塊）和 .body-line 的 font-size */
  --body-jw-sz:   14.4px;  /* .guaxiang-jw-item（卦象頁吉凶判斷條目）的 font-size */
  --body-ann-sz:  10.56px; /* .annotation（注釋斜體文字塊）的 font-size */
  --body-tog-sz:  12px;    /* .section-toggle（折疊／展開切換按鈕）的 font-size */
  /* ── 設置／重置彈窗（.settings-panel）── */
  --sp-top:      90px;  /* .settings-panel 的 top（距視口頂部距離） */
  --sp-pad-v:    20px;  /* .settings-panel 的 padding-top */
  --sp-pad-h:    16px;  /* .settings-panel 的 padding-left / right / bottom */
  --sp-title-sz: 16px;  /* .settings-panel-title（「設置」「重置筮卜」標題）的 font-size */
  --sp-title-mb: 14px;  /* .settings-panel-title 的 margin-bottom */
  --sp-title-pb:  8px;  /* .settings-panel-title 的 padding-bottom（底線上方空間） */
  --sp-close-sz:17.6px; /* .settings-close（「×」關閉按鈕）的 font-size */
  --sp-close-t:  10px;  /* .settings-close 的 top 定位 */
  --sp-close-r:  12px;  /* .settings-close 的 right 定位 */
  --subsec-sz:   18px;  /* sub-section label font-size */
  --subsec-mt:   14px;  /* sub-section label margin-top */
  --subsec-mb:    6px;  /* sub-section label margin-bottom */
  --subsec-ls:    .2em;   /* sub-section label letter-spacing */
  --inp-fsz:      14px;  /* input field font-size（設置／設定面板通用） */
  --sp-row-pv:    3px;  /* .prob-row 的 padding-top 和 padding-bottom */
  --sp-pct-sz: 11.52px; /* .prob-pct（概率百分比數字）的 font-size */
  --sp-act-gap:   8px;  /* .settings-actions（取消／確認按鈕列）的 gap */
  --sp-act-mt:   14px;  /* .settings-actions 的 margin-top */
  --sp-act-pt:   10px;  /* .settings-actions 的 padding-top（頂部分隔線下方空間） */
  --sp-btn-pv:    5px;  /* .settings-btn-action 的 padding-top 和 padding-bottom */
  --sp-input-w:  40px;  /* .prob-input（概率輸入框）的 width */
  --sp-body-sz: 13.6px; /* .sp-body-text（重置確認說明文字）的 font-size */
  --sp-body-mb:  16px;  /* .sp-body-text 的 margin-bottom */
  --win-text-sz: 11px;  /* body text in all windows */
  --win-body-pt:  0px;  /* inner-container top padding in all windows */
  /* ── 保存記錄 dropdown（.save-dropdown）── */
  --dd-maxh: 272px; /* .save-dropdown 的 max-height（超出後出現滾動條） */
  --dd-pv:     3px; /* .save-record 的 padding-top 和 padding-bottom */
  --dd-ph:     3px; /* .save-record 的 padding-left 和 padding-right */
  --dd-gap:    6px; /* .save-record 內 flex gap，分隔收藏星、數列、時間戳 */
  --dd-ep:     3px; /* .save-dropdown-empty（無記錄提示）的 padding */
  --dd-cv-pv:  9px; /* .save-dd-confirm 的 padding-top 和 padding-bottom */
  --dd-cv-mt:  8px; /* .save-dd-confirm-actions 的 margin-top */
  --dd-cv-btn-pv: 4px; /* .save-dd-confirm-btn 的 padding-top 和 padding-bottom */
  --btn-ph:      10px; /* 通用有邊框按鈕的水平 padding */
  /* ── 命名 popup（#shiboNamePop / #saveNamePop）── */
  --pop-pv:  6px; /* popup 上下 padding */
  --pop-ph:  8px; /* popup 左右 padding */
  --pop-gap: 6px; /* input 與 confirm 按鈕之間的 gap */
  /* ── 色板（高頻色值，全域共用）── */
  --c-main:       #d4b870; /* 主正文色：body content / 卦象判斷條目 / 概率分數顯示 */
  --c-accent:     #c9a84c; /* 強調色：.hex-name / .sec-heading；config 欄位標籤、段落代號、欄位表頭；hover 文字色；active 邊框色 */
  --c-border:     #3a2a10; /* 控件邊框：.yao-btn / .bit-toggle / .num-arrow 等預設 border */
  --c-default:    #1e170a; /* 控件背景：所有按鈕、輸入框 background（非 active 狀態） */
  --c-gold:       #f0c040; /* 金色高亮：所有輸入框文字色；binary 0 / active 文字色；.hex-symbol；筮卜完成特效 */
  --c-dim:        #5a4020; /* 非活動暗色：binary 1 / bit-toggle OFF；✖ / ✚ / ★ 等操作按鈕預設色；settings-btn */
  --font-empty:  italic; /* 空狀態提示文字（下拉列表無記錄、佔位符）的 font-style */
  --c-subsec:     #7a6030; /* 次級標籤色：source-section-label / config-section-title / prob-section-label */
  --c-active:     #261e08; /* hover／active 背景：按鈕 hover 或選中時的 background */
  --c-opt:        #2a200e; /* 選項下拉框背景：select / option-style input */
  --c-sep:        #2a2010; /* 細分隔線：.hex-header / .divider / .settings-actions 的 border 色 */
  --c-inset:      #100d07; /* 內嵌容器背景：比 c-page 更深，用於面板內的凹陷區塊 */
  --c-page:       #16110a; /* 頁面最深底色：body background；stacked 模式右欄 overlay background */
  --c-leftBorder: #6a3f0a; /* 左側邊框深棕色：.ci-section-b / guaxiang 條目 / save 條目 / 圖片邊框 */
  /* ── 蓍草爻位文字色（CSS 與 JS PROB_COLORS 共用，單一來源）── */
  --y6-tx: #a0d0ff; /* 老陰（變爻）：.bit-toggle.y6 color；PROB_COLORS.quaternary['6'] */
  --y7-tx: #90e8a0; /* 少陽（靜爻）：.bit-toggle.y7 color；PROB_COLORS.quaternary['7'] */
  --y8-tx: #ffe060; /* 少陰（靜爻）：.bit-toggle.y8 color；PROB_COLORS.quaternary['8'] */
  --y9-tx: #ff9060; /* 老陽（變爻）：.bit-toggle.y9 color；PROB_COLORS.quaternary['9'] */
  /* ── config / settings 輸入框（JS PANEL_SIZES 同步縮放） ── */
  --cfg-input-h: 28px;
  --cfg-body-gap: 14px;  --cfg-sec-gap: 6px;
  --cfg-label-w: 60px;
  --cfg-inp-pv: 3px;     --cfg-inp-ph: 6px;
  --cfg-color-w: 32px;
  --cfg-color-pv: 1px;   --cfg-color-ph: 2px;
  --cfg-num-w: 52px;
  --cfg-rm-fsz: 11px;
  --cfg-cell-pv: 2px;    --cfg-cell-ph: 4px;
  --cfg-preset-pv: 6px;  --cfg-preset-ph: 8px;  --cfg-preset-gap: 5px;
  --cfg-tri-inp-w: 52px;
  --cfg-tri-wrap-pb: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  background:var(--c-page);color:#e8d5a3;
  height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:flex-start;padding:36px 36px 0;
}

/* ── 兩欄佈局 ── */
.page-layout{
  display:flex;gap:48px;align-items:flex-start;
  width:100%;
  flex:1;min-height:0;
}
.left-panel{flex-shrink:0;display:flex;flex-direction:column;align-items:center;position:relative;}
.right-panel{
  flex:1;min-width:0;
  align-self:stretch;overflow:hidden;
  display:flex;flex-direction:column;
}
*{--sb-c:#7a6030;--sb-c-hover:var(--c-accent,#c9a84c);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--sb-c);border-radius:3px;transition:background .4s;}
::-webkit-scrollbar-thumb:hover{background:var(--sb-c-hover);}
#contentArea{flex:1;overflow-y:auto;padding-bottom:48px;}

/* ── 左欄：yao-col + tri-buttons ── */
.yao-col{display:flex;flex-direction:column;align-items:center;gap:var(--col-gap);flex:1}
.tri-buttons{position:relative;display:flex;flex-direction:column;gap:var(--col-gap);}
.tri-bg-char,.tri-bg-num,.tri-bg-thing{
  position:absolute;
  left:calc(var(--yao-pad) + var(--lbl-w) + var(--yao-gap) + (var(--panel-w) - var(--yao-pad) * 2 - var(--lbl-w) - var(--yao-gap)) / 2);
  opacity:.25;pointer-events:none;user-select:none;
}
.tri-bg-char{
  top:50%;transform:translate(-50%,-50%);
  font-size:var(--char-sz);line-height:1;letter-spacing:0;
}
.tri-bg-num,.tri-bg-thing{
  font-size:var(--char-small);line-height:1;font-family:monospace;font-weight:bold;
}
.tri-bg-num{top:calc(50% - var(--char-off));transform:translate(-50%,-100%);}
.tri-bg-thing{top:calc(50% + var(--char-off));transform:translateX(-50%);}

/* ── 爻位按鈕 ── */
.yao-btn{
  width:var(--panel-w);height:var(--yao-h);
  border:1px solid color-mix(in srgb,var(--tri-color,#6a3a10) 30%,var(--c-page));
  background:color-mix(in srgb,var(--tri-color,var(--c-default)) 7%,var(--c-default));
  cursor:pointer;border-radius:6px;
  display:flex;align-items:center;
  padding:0 var(--yao-pad);gap:var(--yao-gap);
  transition:border-color .15s,background .15s;
}
.yao-btn:hover{
  border-color:color-mix(in srgb,var(--tri-color,var(--c-accent)) 65%,var(--c-accent));
  background:color-mix(in srgb,var(--tri-color,var(--c-active)) 12%,var(--c-active));
}
.yao-btn.yang{
  border-color:color-mix(in srgb,var(--tri-color,var(--c-accent)) 55%,var(--c-accent));
  background:color-mix(in srgb,var(--tri-color,var(--c-active)) 15%,var(--c-active));
}
.yao-lbl{font-size:var(--fs-lbl);width:var(--lbl-w);flex-shrink:0;letter-spacing:.05em;text-align:right;}
.yao-lbl.odd{color:rgba(255,255,255,0.38);}
.yao-btn.yang .yao-lbl.odd{color:#ffffff;}
.yao-lbl.even{color:#000000;}
.line-wrap{flex:1;display:flex;align-items:center;padding:0 4px}
.yang-bar{height:5px;flex:1;background:color-mix(in srgb,var(--tri-color,var(--c-gold)) 45%,var(--c-gold));border-radius:3px;box-shadow:0 0 8px rgba(240,192,64,.45);}
.yin-wrap{display:flex;flex:1}
.yin-h{height:5px;flex:1;background:color-mix(in srgb,var(--tri-color,var(--c-border)) 45%,var(--c-page));border-radius:3px}
.yin-gap{flex:1}

/* ── 上下卦分隔線 ── */
.hex-sep{width:100%;border-top:1px dashed var(--c-border);margin:var(--sep-m) 0;}

/* ── 6格數位 ── */
.bit-row{display:flex;gap:var(--col-gap);margin-top:var(--row-gap);}
.bit-toggle{
  width:var(--bit-sz);height:var(--bit-sz);
  border:1px solid var(--c-border);background:var(--c-default);
  border-radius:5px;cursor:pointer;
  color:var(--c-dim);font-size:var(--fs-bitToggle);font-family:monospace;
  transition:border-color .15s,background .15s,color .15s;
}
.bit-toggle.on{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}

/* ── 序列號控件，🔒，🔍── */
.num-ctrl{display:flex;align-items:center;gap:var(--shibo-gap);margin-top:var(--row-gap);}
.num-ctrl.disabled .num-arrow,.num-ctrl.disabled .num-input{opacity:.3;pointer-events:none;cursor:not-allowed;}
.num-arrow{
  width:var(--arrow-w);height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);
  color:var(--c-accent);font-size:var(--fs-mono);border-radius:5px;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.num-arrow:hover{border-color:var(--c-accent);background:var(--c-active);}
.num-input{
  width:var(--input-w);height:var(--ctrl-h);border:2.5px solid var(--c-border);background:var(--c-default);
  color:var(--c-gold);font-size:var(--fs-ctrl);font-family:monospace;
  text-align:center;border-radius:5px;
}
.num-input:focus{outline:none;border-color:var(--c-accent);}
.num-input::-webkit-inner-spin-button,
.num-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.num-input{appearance:textfield;}
.lock-btn{width:var(--ctrl-h);height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);color:var(--c-dim);border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s,color .15s;}
.lock-btn:hover{border-color:#6a4a20;color:var(--c-accent);}
.lock-btn.locked{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}
.btn-inverted{border-color:transparent!important;background:var(--c-accent)!important;color:var(--c-default)!important;}
.btn-inverted .show-hex-label{color:var(--c-page);}
.search-btn{width:var(--ctrl-h);height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);color:var(--c-dim);border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s,color .15s;}
.search-btn:hover{border-color:#6a4a20;color:var(--c-accent);}
.save-dropdown{position:absolute;width:var(--panel-w);left:50%;transform:translateX(-50%);max-height:var(--dd-maxh);overflow-y:auto;overflow-x:hidden;background:var(--c-default);border:1px solid #4a3010;border-radius:6px;z-index:300;display:none;box-shadow:0 4px 20px rgba(0,0,0,.65);font-family:monospace;}
.save-dropdown.open{display:block;}
.save-record{padding:var(--dd-pv) var(--dd-ph);cursor:default;border-bottom:1px solid #2a1e08;font-size:var(--fs-rec);display:flex;align-items:stretch;justify-content:flex-start;transition:background .1s;}
.save-record:last-child{border-bottom:none;}
.save-record:hover{background:var(--c-active);}
.save-record-icons{display:flex;align-items:center;gap:0.75em;flex:0 0 31.25%;border-right:1px solid var(--c-border);}
.save-record-name{display:flex;align-items:center;justify-content:center;flex:0 0 25%;border-right:1px solid var(--c-border);cursor:pointer;}
.save-record-name-inner{font-size:var(--fs-time);color:var(--c-accent);display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;word-break:break-all;text-align:center;}/* Name capture popup (shibo: above shibo-row; save: below save btn) */
.save-record-bits{font-size:var(--fs-mono);display:flex;align-items:center;justify-content:center;flex:0 0 30%;border-right:1px solid var(--c-border);cursor:pointer;}
.save-record-bits-inner{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;text-align:center;}
.save-record-time{color:#ffffff;font-size:var(--fs-time);text-align:right;flex:0 0 13.75%;cursor:pointer;}
.save-favo{cursor:pointer;color:var(--c-dim);transition:color .15s;flex-shrink:0;user-select:none;position:relative;top:-0.15em;transform:scale(1.5);}
.save-favo:hover{color:var(--c-accent);}
.save-favo.active{color:var(--c-gold);}
.save-dropdown-empty{padding:var(--dd-ep);color:#4a3830;font-size:var(--fs-rec);text-align:center;letter-spacing:.06em;font-style:var(--font-empty);}
/* Name record in save rows */
#shiboNamePop{position:absolute;top:100%;left:0;width:100%;box-sizing:border-box;background:var(--c-default);border:1px solid #4a3010;border-radius:6px;padding:var(--pop-pv) var(--pop-ph);gap:var(--pop-gap);z-index:350;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.55);}
#saveNamePop{position:absolute;width:var(--panel-w);left:50%;transform:translateX(-50%);background:var(--c-default);border:1px solid #4a3010;border-radius:6px;padding:var(--pop-pv) var(--pop-ph);gap:var(--pop-gap);z-index:350;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,.65);}
.name-pop-input{flex:1;min-width:0;height:var(--ctrl-h);background:var(--c-inset);border:1px solid var(--c-border);border-radius:4px;color:var(--c-gold);font-size:var(--fs-ctrl);font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;outline:none;padding:0 6px;box-sizing:border-box;}
.name-pop-input::placeholder{color:var(--c-dim);font-style:italic;}
.name-pop-confirm{flex-shrink:0;height:var(--ctrl-h);border:1px solid var(--c-border);border-radius:4px;background:var(--c-default);color:var(--c-dim);font-size:var(--fs-ctrl);cursor:default;padding:0 var(--btn-ph);white-space:nowrap;box-sizing:border-box;font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;transition:color .15s,border-color .15s;}
.name-pop-confirm:not(:disabled){border-color:var(--c-accent);color:var(--c-accent);cursor:pointer;}
.name-pop-confirm:not(:disabled):hover{background:var(--c-active);}
/* Cast-name badge shown below shibo-row while cast is in progress */
#shiboNameBadge{position:fixed;z-index:8999;background:#2a1e08;color:var(--c-accent);border:1px solid #4a3010;border-radius:4px;padding:3px 8px;font-size:var(--fs-tip);font-family:"PingFang SC","Noto Serif TC",serif;white-space:nowrap;letter-spacing:.06em;pointer-events:none;display:none;}
/* 图标按钮 tooltip */
#tip-overlay{position:fixed;z-index:9000;background:#2a1e08;color:var(--c-accent);border:1px solid #4a3010;border-radius:4px;padding:3px 8px;font-size:var(--fs-tip);font-family:"PingFang SC","Noto Serif TC",serif;white-space:nowrap;letter-spacing:.06em;pointer-events:none;opacity:0;transition:opacity .15s;}
#tip-overlay.visible{opacity:1;}

/* ── 爻變按鈕 ── */
.yao-bian-btn{
  width:var(--panel-w);height:var(--ctrl-h);margin-top:var(--shibo-mt);
  border:1px solid var(--c-border);background:var(--c-default);
  color:#7a6030;border-radius:6px;cursor:pointer;
  letter-spacing:.35em;font-size:var(--fs-ctrl);
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  transition:border-color .15s,background .15s,color .15s;
  position:relative;overflow:hidden;white-space:nowrap;
}
.yao-bian-btn:hover{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}
.yao-bian-btn.active{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}

/* ── 筮卜 + 設置按鈕行 ── */
.shibo-row{display:flex;gap:var(--shibo-gap);margin-top:var(--shibo-mt);width:var(--panel-w);position:relative;}
.shibo-btn{flex:1;height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);color:#7a6030;border-radius:6px;cursor:pointer;letter-spacing:.35em;font-size:var(--fs-ctrl);font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;transition:border-color .15s,background .15s,color .15s;position:relative;overflow:hidden;white-space:nowrap;}
.shibo-btn:hover{border-color:#6a4a20;color:var(--c-accent);}
.settings-btn{width:var(--ctrl-h);height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);color:var(--c-dim);border-radius:6px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s,color .15s;}
.settings-btn:hover{border-color:#6a4a20;color:var(--c-accent);}

/* ── 訊息欄 ── */
.msg{font-size:var(--fs-msg);min-height:var(--ctrl-h);flex:1;overflow:hidden;margin-top:var(--row-gap);letter-spacing:.05em;text-align:center;width:var(--panel-w);box-sizing:border-box;border:.25px solid var(--c-sep);border-radius:5px;padding:2px 6px;transition:border-color .15s,background .15s,color .15s,opacity 10s;display:flex;align-items:center;justify-content:center;}
.msg.msg--error{color:#e06060;border-color:#7a2020;background:#1e0a0a;}
.msg.msg--success{color:#d4cbb8;border-color:#7a7060;background:#1a1810;}
.msg.msg-fading{opacity:0;}

/* ── 頁面切換 ── */
.tab-bar{display:flex;gap:var(--tab-gap);margin-top:var(--tab-gap);width:var(--panel-w);}
.tab-btn{
  flex:1;padding:var(--tab-pad) 0;border:0.25px solid var(--c-border);background:var(--c-default);
  color:#7a6030;border-radius:5px;cursor:pointer;
  letter-spacing:.2em;font-size:var(--fs-ctrl);
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  transition:border-color .15s,background .15s,color .15s,outline-color .15s;
  outline:1px solid var(--c-border);outline-offset:var(--tab-outline-offset);
  overflow:hidden;white-space:nowrap;
}
.tab-btn.active{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);outline-color:var(--c-accent);}
.tab-btn:hover:not(.active):not(.tab-disabled){border-color:#6a4a20;color:var(--c-accent);outline-color:#6a4a20;}
.tab-btn.tab-disabled{opacity:.3;cursor:not-allowed;pointer-events:none;}



/* ── 右欄：結果標題 ── */
.hex-header{
  display:flex;align-items:center;gap:var(--hdr-gap);
  margin-bottom:var(--hdr-mb);padding-bottom:var(--hdr-pb);border-bottom:1px solid var(--c-sep);
}
.hex-header.guaxiang-layout{flex-direction:column;gap:var(--hdr-unit-gap);}
.hex-symbol{font-size:var(--hdr-symbol-sz);line-height:1;color:var(--c-gold);text-shadow:0 0 28px rgba(240,192,64,.3);flex-shrink:0;transition:color .3s,text-shadow .3s;}
.hex-name{font-size:var(--hdr-name-sz);letter-spacing:.35em;color:var(--c-accent);flex:1;text-align:center;transition:color .3s;}
.hex-name-input{font-size:inherit;color:inherit;text-align:center;background:transparent;border:none;border-bottom:1px solid currentColor;outline:none;width:90%;font-family:inherit;padding:0;letter-spacing:.35em;}
.hex-meta{font-size:var(--hdr-meta-sz);color:#7a6030;letter-spacing:.1em;flex-shrink:0;text-align:right;}
.show-hex-btn{background:var(--c-default);border:1px solid var(--c-border);border-radius:5px;color:#7a6030;cursor:default;opacity:.45;font-size:var(--hdr-btn-sz);letter-spacing:.2em;padding:var(--hdr-btn-pv) var(--hdr-btn-ph);font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;position:relative;overflow:hidden;transition:border-color .15s,background .15s,color .15s,opacity .15s;}
.show-hex-btn.show-hex-active{border-color:var(--c-border);background:var(--c-active);color:var(--c-gold);cursor:pointer;opacity:1;}
.show-hex-btn.show-hex-active:hover:not(.btn-inverted){border-color:#6a4a20;}
.show-hex-btn.btn-inverted{border-color:transparent;background:var(--c-accent);color:var(--c-default);}
.show-hex-btn.btn-inverted .show-hex-label{color:var(--c-page);}
.hex-header-dual{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--hdr-dual-gap);width:100%;}
.hex-unit{display:flex;flex-direction:column;align-items:center;gap:var(--hdr-unit-gap);min-width:0;}
.hex-arrow{font-size:var(--hdr-arrow-sz);font-weight:bold;color:var(--c-accent);}
.hex-arrow-label{font-size:var(--hdr-lbl-sz);color:var(--c-accent);letter-spacing:.1em;}
.hex-header-dual .hex-name{font-size:var(--hdr-name-sz);white-space:nowrap;}

/* ── 右欄：內容渲染 ── */
#contentArea{display:flex;flex-direction:column;gap:6px;}
.sec-heading{
  font-size:var(--body-sec-sz);color:var(--c-accent);letter-spacing:.35em;
  margin:20px 0 8px;padding-bottom:6px;
  border-bottom:1px solid var(--c-sep);
}
.sec-heading:first-child{margin-top:0;}
.sub-heading{
  font-size:var(--body-sub-sz);color:var(--c-accent);letter-spacing:.28em;
  margin:18px 0 6px;padding-bottom:4px;
  border-bottom:1px dashed var(--c-border);
}
.yao-heading{
  font-size:var(--body-yao-sz);color:var(--c-accent);letter-spacing:.18em;
  margin:12px 0 2px;padding-left:8px;
  border-left:2px solid var(--c-leftBorder);
}
.bold-title{
  font-size:var(--body-sec-sz);
  color:var(--c-gold);font-weight:bold;letter-spacing:.25em;
  text-align:center;padding:6px 0;
}
.content-item{
  background:var(--c-default);border-left:3px solid var(--c-leftBorder);
  padding:10px 14px;border-radius:0 6px 6px 0;
  font-size:var(--body-item-sz);line-height:1.75;color:var(--c-main);
}
.item-num{color:var(--c-accent);font-weight:bold;}
.body-line{
  font-size:var(--body-item-sz);line-height:1.85;color:var(--c-main);
}
.annotation{
  padding:3px 14px;
  border-left:3px solid var(--c-border);border-radius:0 6px 6px 0;
  font-size:var(--body-ann-sz);line-height:1.6;color:#8a7040;font-style:italic;
}
.annotation-label{color:#6a5030;font-style:normal;margin-right:4px;}
.sub-section-body a{color:inherit;text-decoration:underline;}
ruby{ruby-align:center;}
rt{font-size:0.55em;}
.sub-section .sub-heading{
  display:flex;align-items:center;justify-content:flex-start;
}
.section-toggle{
  flex-shrink:0;margin-left:8px;
  background:none;border:none;padding:0;
  color:var(--c-dim);font-size:var(--body-tog-sz);cursor:pointer;
  line-height:1;transition:color .15s;
  font-family:inherit;
}
.section-toggle:hover{color:var(--c-accent);}
.sub-section[data-mode="bold"]:not([data-jie]) .sub-section-body>:not(.bold-title):not(.yao-heading){display:none;}
.sub-section[data-mode="bold"][data-jie] .sub-section-body>.annotation{display:none;}
.sub-section[data-mode="hide"] .sub-section-body{display:none;}
.divider{border:none;border-top:1px solid var(--c-sep);margin:16px 0}
/* 查詢失敗時右欄所有非按鈕文字過渡到 disabled 色 */
.query-failed *:not(button):not(button *){color:#3a2e18 !important;text-shadow:none !important;transition:color .3s,text-shadow .3s;}
.guaxiang-title{font-size:var(--hdr-title-sz);font-weight:700;color:var(--c-gold);letter-spacing:.15em;text-align:center;margin-bottom:var(--hdr-title-mb);}
.guaxiang-dual-content{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
.guaxiang-col{display:flex;flex-direction:column;gap:8px;}
.guaxiang-col-single{max-width:480px;margin:0 auto;}
.guaxiang-jw-item{background:var(--c-default);border-left:3px solid var(--c-leftBorder);padding:10px 14px;border-radius:0 6px 6px 0;font-size:var(--body-jw-sz);line-height:1.75;color:var(--c-main);}
.guaxiang-jw-item.guaxiang-jw-a{border-left-color:var(--c-gold);color:var(--c-gold);box-shadow:0 0 14px rgba(240,192,64,.22),inset 0 0 8px rgba(240,192,64,.06);}
.guaxiang-jw-item.guaxiang-jw-dim{opacity:.22;}
.ci-section{border-left:3px solid transparent;padding-left:12px;margin-bottom:10px;}
.ci-section-a{border-left-color:var(--c-gold);box-shadow:0 0 14px rgba(240,192,64,.22),inset 0 0 8px rgba(240,192,64,.06);}
.ci-section-b{border-left-color:var(--c-leftBorder);}
.ci-section-dim{opacity:.22;}
.md-image{text-align:center;margin:10px 0;}
.md-image img{max-width:100%;border-radius:4px;border:2px solid var(--c-leftBorder);}
.md-image figcaption{font-size:.8em;color:#a07840;margin-top:4px;}
.md-pdf{width:100%;height:480px;border:1px solid var(--c-leftBorder);border-radius:4px;}
.media-missing{color:var(--c-dim);font-style:var(--font-empty);font-size:var(--body-item-sz);text-align:center;padding:8px 0;}

/* ── 響應式（由 JS 動態切換）──
   .stacked 由 fitLayout() 在 resize 時根據右欄實際渲染寬度動態加掛／移除，
   不使用 @media，因為左欄寬度會隨 scale 變動，無法用固定視口寬度計算臨界點。
   小螢幕保持 row 佈局：右欄以 position:fixed 藏於視口右側，#panelToggle 填滿空白區域；
   .show-right 時兩欄同時滑動換場。 */

/* 右欄退出至視口右側待機 */
.page-layout.stacked .right-panel{
  position:fixed;inset:36px;          /* 四邊各留 36px */
  background:var(--c-page);
  transform:translateX(100vw);        /* vw 確保完全退出，不受 inset 影響 */
  transition:transform .35s ease;
  z-index:50;
  overflow-y:auto;
  display:flex;flex-direction:column;
  border-radius:8px;
  border:1px solid var(--c-sep);
}
/* show-right：右欄滑入 */
.page-layout.stacked.show-right .right-panel{transform:translateX(0);}
/* 左欄平滑過渡；stacked 時水平置中 */
.page-layout.stacked{justify-content:center;}
.page-layout.stacked .left-panel{transition:transform .35s ease,opacity .35s ease;}
/* show-right：左欄向左滑出並淡出 */
.page-layout.stacked.show-right .left-panel{transform:translateX(calc(-100% - 36px));opacity:0;pointer-events:none;}

/* #panelToggle：fixed overlay，佔據左欄右側至右邊界的全部空白；left 由 JS 設置 */
#panelToggle{
  display:none;
  position:fixed;top:50%;right:0;transform:translateY(-50%);
  width:36px;height: 200px;
  /* left 動態注入 */
  align-items:center;justify-content:center;
  background:var(--c-default);border:none;border-left:1px solid var(--c-sep);
  cursor:pointer;z-index:10;writing-mode:vertical-rl;
  color:var(--c-dim);font-size:var(--body-sec-sz);letter-spacing:.15em;
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  transition:background .15s,color .15s;
}
#panelToggle:hover{background:var(--c-active);color:var(--c-accent);}
/* display 由 JS 的 updateToggle() 控制 */

/* #panelBack：fixed overlay，佔右欄左邊界至視口左側；right 由 JS 設置 */
#panelBack{
  display:none;
  position:fixed;top:50%;left:0;transform:translateY(-50%);
  width:36px;height:200px;
  align-items:center;justify-content:center;
  background:var(--c-default);border:none;border-right:1px solid var(--c-sep);
  cursor:pointer;z-index:10;
  color:var(--c-dim);font-size:var(--body-sec-sz);letter-spacing:.15em;
  writing-mode:vertical-rl;
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  transition:background .15s,color .15s;
}
#panelBack:hover{background:var(--c-active);color:var(--c-accent);}
/* display 由 JS 的 updateToggle() 控制 */

/* ── 設置彈窗 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;}
.modal-overlay.open{display:block;}
.settings-panel{
  position:fixed;
  top:var(--sp-top);
  left:36px;
  width:var(--panel-w);
  background:#1a1408;
  border:1px solid #4a3a18;
  border-radius:8px;
  padding:var(--sp-pad-v) var(--sp-pad-h) var(--sp-pad-h);
  z-index:101;
  box-shadow:0 4px 32px rgba(0,0,0,.65);
  color:#e8d5a3;
}
.settings-panel-title{font-size:var(--sp-title-sz);letter-spacing:.35em;color:var(--c-accent);margin-bottom:var(--sp-title-mb);padding-bottom:var(--sp-title-pb);border-bottom:1px solid var(--c-sep);}
.settings-close{position:absolute;top:var(--sp-close-t);right:var(--sp-close-r);background:none;border:none;color:var(--c-dim);font-size:var(--sp-close-sz);cursor:pointer;line-height:1;padding:2px 4px;transition:color .15s;font-family:inherit;}
.settings-close:hover{color:var(--c-accent);}
.prob-section-label{font-size:var(--subsec-sz);letter-spacing:var(--subsec-ls);color:var(--c-subsec);margin:var(--subsec-mt) 0 var(--subsec-mb);}
.prob-row{display:flex;align-items:center;padding:var(--sp-row-pv) 0;font-size:var(--inp-fsz);}
.prob-name{flex:0 0 50%;display:flex;align-items:center;overflow:hidden;color:var(--c-accent);letter-spacing:.1em;}
.prob-name-key{flex-shrink:0;font-family:monospace;}
.prob-name-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prob-pct-wrap{flex:0 0 25%;text-align:center;}
.prob-frac{flex:0 0 25%;text-align:right;}
.prob-frac{color:var(--c-main);font-family:"Menlo","Monaco","Courier New",monospace;letter-spacing:.05em;}
.prob-pct{font-family:monospace;font-size:var(--sp-pct-sz);letter-spacing:.03em;}
.prob-pct--glint{animation:pct-glint 3s ease-in-out infinite;}
@keyframes pct-glint{
  0%,78%,100%{opacity:.7;filter:none;}
  86%{opacity:1;filter:brightness(2.2) drop-shadow(0 0 5px currentColor);}
  92%{opacity:.85;filter:brightness(1.3) drop-shadow(0 0 2px currentColor);}
}
.prob-input{width:var(--sp-input-w);background:var(--c-page);border:1px solid var(--c-border);border-radius:4px;color:var(--c-gold);font-family:monospace;font-size:var(--inp-fsz);text-align:center;padding:1px 4px;height:var(--cfg-input-h);box-sizing:border-box;}
.prob-input:focus{outline:none;border-color:var(--c-accent);}
.prob-denom{color:#7a6030;font-family:monospace;font-size:var(--inp-fsz);}
.settings-actions{display:flex;gap:var(--sp-act-gap);margin-top:var(--sp-act-mt);padding-top:var(--sp-act-pt);border-top:1px solid var(--c-sep);}
.settings-btn-action{flex:1;padding:var(--sp-btn-pv) 0;border:1px solid var(--c-border);background:var(--c-default);color:#7a6030;border-radius:5px;cursor:pointer;font-size:var(--inp-fsz);letter-spacing:.15em;font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;transition:border-color .15s,background .15s,color .15s;overflow:hidden;white-space:nowrap;}
.sp-body-text{font-size:var(--sp-body-sz);color:#d4cbb8;line-height:1.7;margin-bottom:var(--sp-body-mb);}
.settings-btn-action:hover{border-color:#6a4a20;color:var(--c-accent);}
.settings-btn-action.primary{border-color:var(--c-accent);color:var(--c-gold);background:var(--c-active);}
.settings-btn-action.primary:hover{border-color:var(--c-gold);}
.settings-btn-action:disabled{opacity:0.4;cursor:default;pointer-events:none;}
.settings-btn-action.danger{color:#c05050;border-color:#c05050;}
.settings-btn-action.danger:hover{background:#3a1818;color:#e07070;}
.source-merge-row{display:flex;justify-content:center;margin-top:8px;}

/* ══ 特效 ══ */

/* 筮卜完成：爻按鈕、數位格、序列輸入框持續點亮 */
.shibo-lit{box-shadow:0 0 10px rgba(240,192,64,.75);}
/* 筮卜記錄（于dropdown）：向內發光 + 背景提亮 */
.save-record.shibo-lit{background:rgba(240,192,64,.1);box-shadow:inset 0 0 5px rgba(240,192,64,.25);}
.save-record.shibo-lit:hover{background:rgba(240,192,64,.2);}
/* 刪除按鈕 */
.save-del{cursor:pointer;color:var(--c-dim);transition:color .15s;flex-shrink:0;user-select:none;transform:scale(1.5);}
.save-del:hover{color:#e06040;}
.save-edit{cursor:pointer;color:var(--c-dim);flex-shrink:0;user-select:none;font-size:var(--fs-ctrl);transition:color .15s;transform:scale(1.5);}
.save-edit:hover{color:var(--c-accent);}
/* 刪除確認畫面 */
.save-dd-confirm{padding:var(--dd-cv-pv) var(--dd-ph);}
.save-dd-confirm-title{font-size:var(--fs-rec);color:var(--c-accent);letter-spacing:.08em;margin-bottom:var(--dd-gap);text-align:center;}
.save-dd-confirm-preview{pointer-events:none;border-bottom:none;cursor:default;}
.save-dd-confirm-preview:hover{background:transparent;}
.save-dd-confirm-actions{display:flex;gap:var(--dd-gap);margin-top:var(--dd-cv-mt);}
.save-dd-confirm-btn{flex:1;padding:var(--dd-cv-btn-pv) var(--btn-ph);border:1px solid var(--c-border);background:var(--c-default);color:#7a6030;border-radius:5px;cursor:pointer;font-size:var(--fs-ctrl);letter-spacing:.1em;font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;transition:border-color .15s,background .15s,color .15s;}
.save-dd-confirm-btn:hover{border-color:var(--c-accent);color:var(--c-accent);}
.save-dd-confirm-btn.danger{border-color:#6a2010;color:#c06040;}
.save-dd-confirm-btn.danger:hover{border-color:#e06040;background:#1e0a06;color:#e06040;}

.btn-flash{animation:btn-flash 2s ease-out forwards;}
@keyframes btn-flash{
  0%  {box-shadow:0 0 0 rgba(240,192,64,0);background:var(--c-default);color:var(--c-dim);border-color:var(--c-border);}
  12% {box-shadow:0 0 18px rgba(240,192,64,.7),inset 0 0 10px rgba(240,192,64,.15);background:var(--c-accent);color:var(--c-default);border-color:transparent;}
  100%{box-shadow:0 0 0 rgba(240,192,64,0);background:var(--c-default);color:var(--c-dim);border-color:var(--c-border);}
}
@keyframes shibo-glow{
  0%  {box-shadow:0 0 0 rgba(240,192,64,0);background:var(--c-active);color:var(--c-gold);border-color:var(--c-gold);}
  12% {box-shadow:0 0 22px rgba(240,192,64,.7),inset 0 0 12px rgba(240,192,64,.15);background:var(--c-accent);color:var(--c-default);border-color:transparent;}
  100% {background:var(--c-active);color:var(--c-gold);border-color:var(--c-gold);}

}

/* 通用斜線特效（爻變開啓、卦象按鈕、展示按鈕共用） */
.slash-fx{position:relative;overflow:hidden;}
.slash-fx::before,.yao-bian-btn.active::before,.show-hex-btn.show-hex-quat::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(45deg,transparent 0px,transparent 20px,currentColor 20px,currentColor 40px);background-size:57px 100%;animation:slash-scroll 2.5s linear infinite,slash-lum 5.0s ease-in-out infinite;}
@keyframes slash-scroll{
  from{background-position-x:0}
  to{background-position-x:57px}
}
@keyframes slash-lum{
  0%,100%{color:#000000;filter:drop-shadow(0 0 8px rgba(0,0,0,.90));}
  50%{color:#ffffff;filter:drop-shadow(0 0 8px rgba(255,255,255,.45));}
}

/* 爻位按鈕變爻特效 */
.yao-btn.y6{
  color:#ffffff;
  background-image:repeating-linear-gradient(
    45deg,transparent 0px,transparent 20px,currentColor 20px,currentColor 40px
  );
  background-size:57px 100%;
  animation:slash-scroll 2.5s linear infinite;
}
.yao-btn.y9{
  color:#000000;
  background-image:repeating-linear-gradient(
    45deg,transparent 0px,transparent 20px,currentColor 20px,currentColor 40px
  );
  background-size:57px 100%;
  animation:slash-scroll 2.5s linear infinite;
}

/* 數位按鈕變爻特效（y6=老陰 y7=陽靜 y8=陰靜 y9=老陽） */
.bit-toggle.y6{border-color:#5090e0;color:var(--y6-tx);background:#0a1428;position:relative;overflow:hidden;}
.bit-toggle.y7{border-color:#50b060;color:var(--y7-tx);background:#0a1e10;position:relative;overflow:hidden;}
.bit-toggle.y8{border-color:#e8c84c;color:var(--y8-tx);background:#2a1e04;position:relative;overflow:hidden;}
.bit-toggle.y9{border-color:#e87050;color:var(--y9-tx);background:#281008;position:relative;overflow:hidden;}
/* 靜爻（y7/y8）斜線慢速滾動，變爻（y6/y9）快速+色彩脈衝 */
.bit-toggle.y7::before,.bit-toggle.y8::before{
  content:'';
  position:absolute;inset:0;border-radius:4px;
  pointer-events:none;
  opacity:.50;
  background:repeating-linear-gradient(
    45deg,
    transparent 0px,transparent 20px,
    currentColor 20px,currentColor 40px
  );
  background-size:57px 100%;
  animation:slash-scroll 10.0s linear infinite;
}
.bit-toggle.y6::before,.bit-toggle.y9::before{
  content:'';
  position:absolute;inset:0;border-radius:4px;
  pointer-events:none;
  opacity:.50;
  background:repeating-linear-gradient(
    45deg,
    transparent 0px,transparent 20px,
    currentColor 20px,currentColor 40px
  );
  background-size:57px 100%;
}
.bit-toggle.y6::before{animation:slash-scroll 2.5s linear infinite,bit-lum-6 5.0s ease-in-out infinite;}
.bit-toggle.y9::before{animation:slash-scroll 2.5s linear infinite,bit-lum-9 5.0s ease-in-out infinite;}
@keyframes bit-lum-6{
  0%,100%{color:#80b8f8;filter:drop-shadow(0 0 4px rgba(128,184,248,.80));}
  50%    {color:#70d080;filter:drop-shadow(0 0 4px rgba(112,208,128,.80));}
}
@keyframes bit-lum-9{
  0%,100%{color:#f08050;filter:drop-shadow(0 0 4px rgba(240,128,80,.80));}
  50%    {color:var(--c-gold);filter:drop-shadow(0 0 4px rgba(240,192,64,.80));}
}

const _EMBEDDED_CONFIG  = {"trigrams":{"111":{"name":"乾","color":"#ffffff","sym":"☰","en":"Heaven","no":1,"ord":6,"obj":"Heaven","role":"Rule","upon":"Battles","act":"Strength","misc":"Horse, Head","dir":"Northwest","mem":"Father"},"110":{"name":"兌","color":"#ede3be","sym":"☱","en":"Lake","no":2,"ord":7,"obj":"Lake","role":"Joyful","upon":"Speaks","act":"Pleasure","misc":"Sheep, Mouth","dir":"West","mem":"Youngest Daughter"},"101":{"name":"離","color":"#d86040","sym":"☲","en":"Fire","no":3,"ord":9,"obj":"Fire","role":"Warm","upon":"Meet","act":"Catching","misc":"Pheasant, Eyes","dir":"South","mem":"Second Daughter"},"100":{"name":"震","color":"#3e9450","sym":"☳","en":"Thunder","no":4,"ord":3,"obj":"Thunder","role":"Motion","upon":"Comes Forth","act":"Movement","misc":"Dragon, Feet","dir":"East","mem":"Oldest Son"},"011":{"name":"巽","color":"#70c8a0","sym":"☴","en":"Wind","no":5,"ord":4,"obj":"Wind","role":"Scatter","upon":"Aligns","act":"Penetration","misc":"Fowl, Thighs","dir":"Southeast","mem":"Oldest Daughter"},"010":{"name":"坎","color":"#5090d0","sym":"☵","en":"Water","no":6,"ord":1,"obj":"Water","role":"Moisten","upon":"Toils","act":"Perilous","misc":"Pig, Ears","dir":"North","mem":"Second Son"},"001":{"name":"艮","color":"#7a5a28","sym":"☶","en":"Mountain","no":7,"ord":8,"obj":"Mountain","role":"Arrest","upon":"Completes","act":"Arrest","misc":"Dog, Hands","dir":"Northeast","mem":"Youngest Son"},"000":{"name":"坤","color":"#533c1a","sym":"☷","en":"Earth","no":8,"ord":2,"obj":"Earth","role":"Store","upon":"Serves","act":"Docility","misc":"Ox, Belly","dir":"Southwest","mem":"Mother"}},"tab_fields":{"tab1":["-","en"],"tab2":["dir","mem"],"tab3":["act","en"],"guaxiang":["role","en"]},"tab_names":{"tab1":"Image","tab2":"Notes","tab3":"Lines"},"shibo_probs":{"binary":{"0":1,"1":1},"quaternary":{"6":1,"7":3,"8":3,"9":1}},"shibo_presets":[{"name":"Equal Binary (Default)","mode":"binary","probs":{"0":1,"1":1}},{"name":"Three Coins (Default)","mode":"quaternary","probs":{"6":1,"7":3,"8":3,"9":1}},{"name":"Yarrow Stalk (Default)","mode":"quaternary","probs":{"6":1,"7":5,"8":7,"9":3}}],"hexagrams":[{"num":1,"name":"Creative","sequence":"111111","symbol":"䷀","short_name":"Qian","ci":["Kh ie n (represents) what is great and originating, penetrating, advantageous, correct and firm.","In the first (or lowest) line, undivided, (we see its subject as) the dragon lying hid (in the deep). It is not the time for active doing.","In the second line, undivided, (we see its subject as) the dragon appearing in the field. It will be advantageous to meet with the great man.","In the third line, undivided, (we see its subject as) the superior man active and vigilant all the day, and in the evening still careful and apprehensive. (The position is) dangerous, but there will be no mistake.","In the fourth line, undivided, (we see its subject as the dragon looking) as if he were leaping up, but still in the deep. There will be no mistake.","In the fifth line, undivided, (we see its subject as) the dragon on the wing in the sky. It will be advantageous to meet with the great man.","In the sixth (or topmost) line, undivided, (we see its subject as) the dragon exceeding the proper limits. There will be occasion for repentance.","(The lines of this hexagram are all strong and undivided, as appears from) the use of the number nine. If the host of dragons (thus) appearing were to divest themselves of their heads, there would be good fortune."]},{"num":2,"name":"Receptive","sequence":"000000","symbol":"䷁","short_name":"Kun","ci":["Khwă n (represents) what is great and originating, penetrating, advantageous, correct and having the firmness of a mare. When the superior man (here intended) has to make any movement, if he take the initiative, he will go astray; if he follow, he will find his (proper) lord. The advantageousness will be seen in his getting friends in the south-west, and losing friends in the north-east. If he rest in correctness and firmness, there will be good fortune.","In the first line, divided, (we see its subject) treading on hoarfrost. The strong ice will come (by and by).","The second line, divided, (shows the attribute of) being straight, square, and great. (Its operation), without repeated efforts, will be in every respect advantageous.","The third line, divided, (shows its subject) keeping his excellence under restraint, but firmly maintaining it. If he should have occasion to engage in the king's service, though he will not claim the success (for himself), he will bring affairs to a good issue.","The fourth line, divided, (shows the symbol of) a sack tied up. There will be no ground for blame or for praise.","The fifth line, divided, (shows) the yellow lower garment. There will be great good fortune.","The sixth line, divided, (shows) dragons fighting in the wild. Their blood is purple and yellow.","(The lines of this hexagram are all weak and divided, as appears from) the use of the number six. If those (who are thus represented) be perpetually correct and firm, advantage will arise."]},{"num":3,"name":"Difficult Beginning","sequence":"100010","symbol":"䷂","short_name":"Zhun","ci":["K u n (indicates that in the case which it presupposes) there will be great progress and success, and the advantage will come from being correct and firm. (But) any movement in advance should not be (lightly) undertaken. There will be advantage in appointing feudal princes.","The first line, undivided, shows the difficulty (its subject has) in advancing. It will be advantageous for him to abide correct and firm; advantageous (also) to be made a feudal ruler.","The second line, divided, shows (its subject) distressed and obliged to return; (even) the horses of her chariot (also) seem to be retreating. (But) not by a spoiler (is she assailed), but by one who seeks her to be his wife. The young lady maintains her firm correctness, and declines a union. After ten years she will be united, and have children.","The third line, divided, shows one following the deer without (the guidance of) the forester, and only finding himself in the midst of the forest. The superior man, acquainted with the secret risks, thinks it better to give up the chase. If he went forward, he would regret it.","The fourth line, divided, shows (its subject as a lady), the horses of whose chariot appear in retreat. She seeks, however, (the help of) him who seeks her to be his wife. Advance will be fortunate; all will turn out advantageously.","The fifth line, undivided, shows the difficulties in the way of (its subject's) dispensing the rich favours that might be expected from him. With firmness and correctness there will be good fortune in small things; (even) with them in great things there will be evil.","The topmost line, divided, shows (its subject) with the horses of his chariot obliged to retreat, and weeping tears of blood in streams."]},{"num":4,"name":"Youthful Folly","sequence":"010001","symbol":"䷃","short_name":"Meng","ci":["Măn g (indicates that in the case which it presupposes) there will be progress and success. I do not (go and) seek the youthful and inexperienced, but he comes and seeks me. When he shows (the sincerity that marks) the first recourse to divination, I instruct him. If he apply a second and third time, that is troublesome; and I do not instruct the troublesome. There will be advantage in being firm and correct.","The first line, divided, (has respect to) the dispelling of ignorance. It will be advantageous to use punishment (for that purpose), and to remove the shackles (from the mind). But going on in that way (of punishment) will give occasion for regret.","The second line, undivided, (shows its subject) exercising forbearance with the ignorant, in which there will be good fortune; and admitting (even the goodness of women, which will also be fortunate. (He may be described also as) a son able to (sustain the burden of) his family.","The third line, divided, (seems to say) that one should not marry a woman whose emblem it might be, for that, when she sees a man of wealth, she will not keep her person from him, and in no wise will advantage come from her.","The fourth line, divided, (shows its subject as if) bound in chains of ignorance. There will be occasion for regret.","The fifth line, divided, shows its subject as a simple lad without experience. There will be good fortune.","In the topmost line, undivided, we see one smiting the ignorant (youth). But no advantage will come from doing him an injury. Advantage would come from warding off injury from him."]},{"num":5,"name":"Waiting","sequence":"111010","symbol":"䷄","short_name":"Xu","ci":["Hs ü intimates that, with the sincerity which is declared in it, there will be brilliant success. With firmness there will be good fortune; and it will be advantageous to cross the great stream.","The first line, undivided, shows its subject waiting in the distant border. It will be well for him constantly to maintain (the purpose thus shown), in which case there will be no error.","The second line, undivided, shows its subject waiting on the sand (of the mountain stream). He will (suffer) the small (injury of) being spoken (against), but in the end there will be good fortune.","The third line, undivided, shows its subject in the mud (close by the stream). He thereby invites the approach of injury.","The fourth line, divided, shows its subject waiting in (the place of) blood. But he will get out of the cavern.","The fifth line, undivided, shows its subject waiting amidst the appliances of a feast. Through his firmness and correctness there will be good fortune.","The topmost line, divided, shows its subject entered into the cavern. (But) there are three guests coming, without being urged, (to his help). If he receive them respectfully, there will be good fortune in the end."]},{"num":6,"name":"Conflict","sequence":"010111","symbol":"䷅","short_name":"Song","ci":["Sun g intimates how, though there is sincerity in one's contention, he will yet meet with opposition and obstruction; but if he cherish an apprehensive caution, there will be good fortune, while, if he must prosecute the contention to the (bitter) end, there will be evil. It will be advantageous to see the great man; it will not be advantageous to cross the great stream.","The first line, divided, shows its subject not perpetuating the matter about which (the contention is). He will suffer the small (injury) of being spoken against, but the end will be fortunate.","The second line, undivided, shows its subject unequal to the contention. If he retire and keep concealed (where) the inhabitants of his city are (only) three hundred families, he will fall into no mistake.","The third line, divided, shows its subject keeping in the old place assigned for his support, and firmly correct. Perilous as the position is, there will be good fortune in the end. Should he perchance engage in the king's business, he will not (claim the merit of) achievement.","The fourth line, undivided, shows its subject unequal to the contention. He returns to (the study of Heaven's) ordinances, changes (his wish to contend), and rests in being firm and correct. There will be good fortune.","The fifth line, undivided, shows its subject contending;—and with great good fortune.","The topmost line, undivided, shows how its subject may have the leathern belt conferred on him (by the sovereign), and thrice it shall be taken from him in a morning."]},{"num":7,"name":"The Army","sequence":"010000","symbol":"䷆","short_name":"Shi","ci":["Sz e indicates how, in the case which it supposes, with firmness and correctness, and (a leader of) age and experience, there will be good fortune and no error.","The first line, divided, shows the host going forth according to the rules (for such a movement). If these be not good, there will be evil.","The second line, undivided, shows (the leader) in the midst of the host. There will be good fortune and no error. The king has thrice conveyed to him the orders (of his favour).","The third line, divided, shows how the host may, possibly, have many inefficient leaders. There will be evil.","The fourth line, divided, shows the host in retreat. There is no error.","The fifth line, divided, shows birds in the fields, which it will be advantageous to seize (and destroy). In that case there will be no error. If the oldest son leads the host, and younger men (idly occupy offices assigned to them), however firm and correct he may be, there will be evil.","The topmost line, divided, shows the great ruler delivering his charges, (appointing some) to be rulers of states, and others to undertake the headship of clans; but small men should not be employed (in such positions)."]},{"num":8,"name":"Holding Together","sequence":"000010","symbol":"䷇","short_name":"Bi","ci":["P î indicates that (under the conditions which it supposes) there is good fortune. But let (the principal party intended in it) re-examine himself, (as if) by divination, whether his virtue be great, unintermitting, and firm. If it be so, there will be no error. Those who have not rest will then come to him; and with those who are (too) late in coming it will be ill.","The first line, divided, shows its subject seeking by his sincerity to win the attachment of his object. There will be no error. Let (the breast) be full of sincerity as an earthenware vessel is of its contents, and it will in the end bring other advantages.","In the second line, divided, we see the movement towards union and attachment proceeding from the inward (mind). With firm correctness there will be good fortune.","In the third line, divided, we see its subject seeking for union with such as ought not to be associated with.","In the fourth line, divided, we see its subject seeking for union with the one beyond himself. With firm correctness there will be good fortune.","The fifth line, undivided, affords the most illustrious instance of seeking union and attachment. (We seem to see in it) the king urging his pursuit of the game (only) in three directions, and allowing the escape of all the animals before him, while the people of his towns do not warn one another (to prevent it). There will be good fortune.","In the topmost line, divided, we see one seeking union and attachment without having taken the first step (to such an end). There will be evil."]},{"num":9,"name":"Small Taming Power","sequence":"111011","symbol":"䷈","short_name":"Xiao Chu","ci":["Hsiâo Kh û indicates that (under its conditions) there will be progress and success. (We see) dense clouds, but no rain coming from our borders in the west.","The first line, undivided, shows its subject returning and pursuing his own course. What mistake should he fall into? There will be good fortune.","The second line, undivided, shows its subject, by the attraction (of the former line), returning (to the proper course). There will be good fortune.","The third line, undivided, suggests the idea of a carriage, the strap beneath which has been removed, or of a husband and wife looking on each other with averted eyes.","The fourth line, divided, shows its subject possessed of sincerity. The danger of bloodshed is thereby averted, and his (ground for) apprehension dismissed. There will be no mistake.","The fifth line, undivided, shows its subject possessed of sincerity, and drawing others to unite with him. Rich in resources, he employs his neighbours (in the same cause with himself).","The topmost line, undivided, shows how the rain has fallen, and the (onward progress) is stayed;—(so) must we value the full accumulation of the virtue (represented by the upper trigram). But a wife (exercising restraint), however firm and correct she may be, is in a position of peril, (and like) the moon approaching to the full. If the superior man prosecute his measures (in such circumstances), there will be evil."]},{"num":10,"name":"Treading","sequence":"110111","symbol":"䷉","short_name":"Lü","ci":["( L î suggests the idea of) one treading on the tail of a tiger, which does not bite him. There will be progress and success.","The first line, undivided, shows its subject treading his accustomed path. If he go forward, there will be no error.","The second line, undivided, shows its subject treading the path that is level and easy;—a quiet and solitary man, to whom, if he be firm and correct, there will be good fortune.","The third line, divided, shows a one-eyed man (who thinks he) can see; a lame man (who thinks he) can walk well; one who treads on the tail of a tiger and is bitten. (All this indicates) ill fortune. We have a (mere) bravo acting the part of a great ruler.","The fourth line, undivided, shows its subject treading on the tail of a tiger. He becomes full of apprehensive caution, and in the end there will be good fortune.","The fifth line, undivided, shows the resolute tread of its subject. Though he be firm and correct, there will be peril.","The sixth line, undivided, tells us to look at (the whole course) that is trodden, and examine the presage which that gives. If it be complete and without failure, there will be great good fortune."]},{"num":11,"name":"Peace","sequence":"111000","symbol":"䷊","short_name":"Tai","ci":["In Thâ i (we see) the little gone and the great come. (It indicates that) there will be good fortune, with progress and success.","The first line, undivided, suggests the idea of grass pulled up, and bringing with it other stalks with whose roots it is connected. Advance (on the part of its subject) will be fortunate.","The second line, undivided, shows one who can bear with the uncultivated, will cross the Ho without a boat, does not forget the distant, and has no (selfish) friendships. Thus does he prove himself acting in accordance with the course of the due Mean.","The third line, undivided, shows that, while there is no state of peace that is not liable to be disturbed, and no departure (of evil men) so that they shall not return, yet when one is firm and correct, as he realises the distresses that may arise, he will commit no error. There is no occasion for sadness at the certainty (of such recurring changes); and in this mood the happiness (of the present) may be (long) enjoyed.","The fourth line, divided, shows its subject fluttering (down);—not relying on his own rich resources, but calling in his neighbours. (They all come) not as having received warning, but in the sincerity (of their hearts).","The fifth line, divided, reminds us of (king) Tî-yî 's (rule about the) marriage of his younger sister. By such a course there is happiness and there will be great good fortune.","The sixth line, divided, shows us the city wall returned into the moat. It is not the time to use the army. (The subject of the line) may, indeed, announce his orders to the people of his own city; but however correct and firm he may be, he will have cause for regret."]},{"num":12,"name":"Standstill","sequence":"000111","symbol":"䷋","short_name":"Pi","ci":["In Ph î there is the want of good understanding between the (different classes of) men, and its indication is unfavourable to the firm and correct course of the superior man. We see in it the great gone and the little come.","The first line, divided, suggests the idea of grass pulled up, and bringing with it other stalks with whose roots it is connected. With firm correctness (on the part of its subject), there will be good fortune and progress.","The second line, divided, shows its subject patient and obedient. To the small man (comporting himself so) there will be good fortune. If the great man (comport himself) as the distress and obstruction require, he will have success.","The third line, divided, shows its subject ashamed of the purpose folded (in his breast).","The fourth line, undivided, shows its subject acting in accordance with the ordination (of Heaven), and committing no error. His companions will come and share in his happiness.","In the fifth line, undivided, we see him who brings the distress and obstruction to a close,—the great man and fortunate. (But let him say), 'We may perish! We may perish!' (so shall the state of things become firm, as if) bound to a clump of bushy mulberry trees.","The sixth line, undivided, shows the overthrow (and removal of) the condition of distress and obstruction. Before this there was that condition. Hereafter there will be joy."]},{"num":13,"name":"Fellowship","sequence":"101111","symbol":"䷌","short_name":"Tong Ren","ci":["Thung Z ă n (or 'Union of men') appears here (as we find it) in the (remote districts of the) country, indicating progress and success. It will be advantageous to cross the great stream. It will be advantageous to maintain the firm correctness of the superior man.","The first line, undivided, (shows the representative of) the union of men just issuing from his gate. There will be no error.","The second line, divided, (shows the representative of) the union of men in relation with his kindred. There will be occasion for regret.","The third line, undivided, (shows its subject) with his arms hidden in the thick grass, and at the top of a high mound. (But) for three years he makes no demonstration.","The fourth line, undivided, (shows its subject) mounted on the city wall; but he does not proceed to make the attack (he contemplates). There will be good fortune.","In the fifth line, undivided, (the representative of) the union of men first wails and cries out, and then laughs. His great host conquers, and he (and the subject of the second line) meet together.","The topmost line, undivided, (shows the representative of) the union of men in the suburbs. There will be no occasion for repentance."]},{"num":14,"name":"Great Possession","sequence":"111101","symbol":"䷍","short_name":"Da You","ci":["Tâ Y û indicates that, (under the circumstances which it implies), there will be great progress and success.","In the first line, undivided, there is no approach to what is injurious, and there is no error. Let there be a realisation of the difficulty (and danger of the position), and there will be no error (to the end).","In the second line, undivided, we have a large waggon with its load. In whatever direction advance is made, there will be no error.","The third line, undivided, shows us a feudal prince presenting his offerings to the Son of Heaven. A small man would be unequal (to such a duty).","The fourth line, undivided, shows its subject keeping his great resources under restraint. There will be no error.","The fifth line, divided, shows the sincerity of its subject reciprocated by that of all the others (represented in the hexagram). Let him display a proper majesty, and there will be good fortune.","The topmost line, undivided, shows its subject with help accorded to him from Heaven. There will be good fortune, advantage in every respect."]},{"num":15,"name":"Modesty","sequence":"001000","symbol":"䷎","short_name":"Qian(Modesty)","ci":["Kh ie n indicates progress and success. The superior man, (being humble as it implies), will have a (good) issue (to his undertakings).","The first line, divided, shows us the superior man who adds humility to humility. (Even) the great stream may be crossed with this, and there will be good fortune.","The second line, divided, shows us humility that has made itself recognised. With firm correctness there will be good fortune.","The third line, undivided, shows the superior man of (acknowledged) merit. He will maintain his success to the end, and have good fortune.","The fourth line, divided, shows one, whose action would be in every way advantageous, stirring up (the more) his humility.","The fifth line, divided, shows one who, without being rich, is able to employ his neighbours. He may advantageously use the force of arms. All his movements will be advantageous.","The sixth line, divided, shows us humility that has made itself recognised. The subject of it will with advantage put his hosts in motion; but (he will only) punish his own towns and state."]},{"num":16,"name":"Enthusiasm","sequence":"000100","symbol":"䷏","short_name":"Yu","ci":["Y ü indicates that, (in the state which it implies), feudal princes may be set up, and the hosts put in motion, with advantage.","The first line, divided, shows its subject proclaiming his pleasure and satisfaction. There will be evil.","The second line, divided, shows one who is firm as a rock. (He sees a thing) without waiting till it has come to pass; with his firm correctness there will be good fortune.","The third line, divided, shows one looking up (for favours), while he indulges the feeling of pleasure and satisfaction. If he would understand!—If he be late in doing so, there will indeed be occasion for repentance.","The fourth line, undivided, shows him from whom the harmony and satisfaction come. Great is the success which he obtains. Let him not allow suspicions to enter his mind, and thus friends will gather around him.","The fifth line, divided, shows one with a chronic complaint, but who lives on without dying.","The topmost line, divided, shows its subject with darkened mind devoted to the pleasure and satisfaction (of the time); but if he change his course even when (it may be considered as) completed, there will be no error."]},{"num":17,"name":"Following","sequence":"100110","symbol":"䷐","short_name":"Sui","ci":["Su i indicates that (under its conditions) there will be great progress and success. But it will be advantageous to be firm and correct. There will (then) be no error.","The first line, undivided, shows us one changing the object of his pursuit; but if he be firm and correct, there will he good fortune. Going beyond (his own) gate to find associates, he will achieve merit.","The second line, divided, shows us one who cleaves to the little boy, and lets go the man of age and experience.","The third line, divided, shows us one who cleaves to the man of age and experience, and lets go the little boy. Such following will get what it seeks; but it will be advantageous to adhere to what is firm and correct.","The fourth line, undivided, shows us one followed and obtaining (adherents). Though he be firm and correct, there will be evil. If he be sincere (however) in his course, and make that evident, into what error will he fall?","The fifth line, undivided, shows us (the ruler) sincere in (fostering all) that is excellent. There will be good fortune.","The topmost line, divided, shows us (that sincerity) firmly held and clung to, yea, and bound fast. (We see) the king with it presenting his offerings on the western mountain."]},{"num":18,"name":"Work on the Decayed","sequence":"011001","symbol":"䷑","short_name":"Gu","ci":["K û indicates great progress and success (to him who deals properly with the condition represented by it). There will be advantage in (efforts like that of) crossing the great stream. (He should weigh well, however, the events of) three days before the turning point, and those (to be done) three days after it.","The first line, divided, shows (a son) dealing with the troubles caused by his father. If he be an (able) son, the father will escape the blame of having erred. The position is perilous, but there will be good fortune in the end.","The second line, undivided, shows (a son) dealing with the troubles caused by his mother. He should not (carry) his firm correctness (to the utmost).","The third line, undivided, shows (a son) dealing with the troubles caused by his father. There may be some small occasion for repentance, but there will not be any great error.","The fourth line, divided, shows (a son) viewing indulgently the troubles caused by his father. If he go forward, he will find cause to regret it.","The fifth line, divided, shows (a son) dealing with the troubles caused by his father. He obtains the praise of using (the fit instrument for his work).","The sixth line, undivided, shows us one who does not serve either king or feudal lord, but in a lofty spirit prefers (to attend to) his own affairs."]},{"num":19,"name":"Approach","sequence":"110000","symbol":"䷒","short_name":"Lin","ci":["Li n (indicates that under the conditions supposed in it) there will be great progress and success, while it will be advantageous to be firmly correct. In the eighth month there will be evil.","The first line, undivided, shows its subject advancing in company (with the subject of the second line). Through his firm correctness there will be good fortune.","The second line, undivided, shows its subject advancing in company (with the subject of the first line). There will be good fortune; (advancing) will be in every way advantageous.","The third line, divided, shows one well pleased (indeed) to advance, (but whose action) will be in no way advantageous. If he become anxious about it (however), there will be no error.","The fourth line, divided, shows one advancing in the highest mode. There will be no error.","The fifth line, divided, shows the advance of wisdom, such as befits the great ruler. There will be good fortune.","The sixth line, divided, shows the advance of honesty and generosity. There will be good fortune, and no error."]},{"num":20,"name":"Contemplation","sequence":"000011","symbol":"䷓","short_name":"Guan","ci":["Kwâ n shows (how he whom it represents should be like) the worshipper who has washed his hands, but not (yet) presented his offerings;—with sincerity and an appearance of dignity (commanding reverent regard).","The first line, divided, shows the looking of a lad;—not blamable in men of inferior rank, but matter for regret in superior men.","The second line, divided, shows one peeping out from a door. It would be advantageous if it were (merely) the firm correctness of a female.","The third line, divided, shows one looking at (the course of) his own life, to advance or recede (accordingly).","The fourth line, divided, shows one contemplating the glory of the kingdom. It will be advantageous for him, being such as he is, (to seek) to be a guest of the king.","The fifth line, undivided, shows its subject contemplating his own life(-course). A superior man, he will (thus) fall into no error.","The sixth line, undivided, shows its subject contemplating his character to see if it be indeed that of a superior man. He will not fall into error."]},{"num":21,"name":"Biting Through","sequence":"100101","symbol":"䷔","short_name":"Shi He","ci":["Shih H o indicates successful progress (in the condition of things which it supposes). It will be advantageous to use legal constraints.","The first line, undivided, shows one with his feet in the stocks and deprived of his toes. There will be no error.","The second line, divided, shows one biting through the soft flesh, and (going on to) bite off the nose. There will be no error.","The third line, divided, shows one gnawing dried flesh, and meeting with what is disagreeable. There will be occasion for some small regret, but no (great) error.","The fourth line, undivided, shows one gnawing the flesh dried on the bone, and getting the pledges of money and arrows. It will be advantageous to him to realise the difficulty of his task and be firm,—in which case there will be good fortune.","The fifth line, divided, shows one gnawing at dried flesh, and finding the yellow gold. Let him be firm and correct, realising the peril (of his position). There will be no error.","The sixth line, undivided, shows one wearing the cangue, and deprived of his ears. There will be evil."]},{"num":22,"name":"Grace","sequence":"101001","symbol":"䷕","short_name":"Bi(Grace)","ci":["P î indicates that there should be free course (in what it denotes). There will be little advantage (however) if it be allowed to advance (and take the lead).","The first line, undivided, shows one adorning (the way of) his feet. He can discard a carriage and walk on foot.","The second line, divided, shows one adorning his beard.","The third line, undivided, shows its subject with the appearance of being adorned and bedewed (with rich favours). But let him ever maintain his firm correctness, and there will be good fortune.","The fourth line, divided, shows one looking as if adorned, but only in white. As if (mounted on) a white horse, and furnished with wings, (he seeks union with the subject of the first line), while (the intervening third pursues), not as a robber, but intent on a matrimonial alliance.","The fifth line, divided, shows its subject adorned by (the occupants of) the heights and gardens. He bears his roll of silk, small and slight. He may appear stingy; but there will be good fortune in the end.","The sixth line, undivided, shows one with white as his (only) ornament. There will be no error."]},{"num":23,"name":"Splitting Apart","sequence":"000001","symbol":"䷖","short_name":"Bo","ci":["P o indicates that (in the state which it symbolises) it will not be advantageous to make a movement in any direction whatever.","The first line, divided, shows one overturning the couch by injuring its legs. (The injury will go on to) the destruction of (all) firm correctness, and there will be evil.","The second line, divided, shows one overthrowing the couch by injuring its frame. (The injury will go on to) the destruction of (all) firm correctness, and there will be evil.","The third line, divided, shows its subject among the overthrowers; but there will be no error.","The fourth line, divided, shows its subject having overthrown the couch, and (going to injure) the skin (of him who lies on it). There will be evil.","The fifth line, divided, shows (its subject leading on the others like) a string of fishes, and (obtaining for them) the favour that lights on the inmates of the palace. There will be advantage in every way.","The topmost line, undivided, shows its subject (as) a great fruit which has not been eaten. The superior man finds (the people again) as a chariot carrying him. The small men (by their course) overthrow their own dwellings."]},{"num":24,"name":"Return","sequence":"100000","symbol":"䷗","short_name":"Fu","ci":["F û indicates that there will be free course and progress (in what it denotes). (The subject of it) finds no one to distress him in his exits and entrances; friends come to him, and no error is committed. He will return and repeat his (proper) course. In seven days comes his return. There will be advantage in whatever direction movement is made.","The first line, undivided, shows its subject returning (from an error) of no great extent, which would not proceed to anything requiring repentance. There will be great good fortune.","The second line, divided, shows the admirable return (of its subject). There will be good fortune.","The third line, divided, shows one who has made repeated returns. The position is perilous, but there will be no error.","The fourth line, divided, shows its subject moving right in the centre (among those represented by the other divided lines), and yet returning alone (to his proper path).","The fifth line, divided, shows the noble return of its subject. There will be no ground for repentance.","The topmost line, divided, shows its subject all astray on the subject of returning. There will be evil. There will be calamities and errors. If with his views he put the hosts in motion, the end will be a great defeat, whose issues will extend to the ruler of the state. Even in ten years he will not be able to repair the disaster."]},{"num":25,"name":"Innocence","sequence":"100111","symbol":"䷘","short_name":"Wu Wang","ci":["Wû Wan g indicates great progress and success, while there will be advantage in being firm and correct. If (its subject and his action) be not correct, he will fall into errors, and it will not be advantageous for him to move in any direction.","The first line, undivided, shows its subject free from all insincerity. His advance will be accompanied with good fortune.","The second line, divided, shows one who
