(function(){
  const el = document.getElementById('msgBox');
  let fadeTimer = null, clearTimer = null;
  function cancelTimers(){ clearTimeout(fadeTimer); clearTimeout(clearTimer); fadeTimer = clearTimer = null; }
  function fitError(){
    el.style.fontSize = '';
    if(!el.textContent.trim()) return;
    let size = 0.85;
    while(el.scrollHeight > el.clientHeight && size > 0.45){
      size = Math.round((size - 0.05) * 100) / 100;
      el.style.fontSize = size + 'rem';
    }
  }
  new MutationObserver(function(){
    cancelTimers();
    el.style.transition = 'none';
    el.classList.remove('msg-fading');
    el.offsetHeight; // force reflow — snaps opacity to 1 instantly
    el.style.transition = '';
    fitError();
    if(!el.textContent.trim()) return;
    fadeTimer = setTimeout(function(){
      el.classList.add('msg-fading');
      clearTimer = setTimeout(function(){
        el.className = 'msg'; // 重置至初始（移除 msg--success/error 及 msg-fading）
        el.textContent = '';
      }, 10000);
    }, 3000);
  }).observe(el, {childList:true, characterData:true, subtree:true});
})();

// quaternary 值語意：6=老陰（陰變陽）8=陰靜  →  本卦(state_0)為陰

// 之卦(state_1)：老陰/老陽翻轉，靜爻不變

  for(let i=0;i<6;i++){
    state_0[i] = (state[i] === 6 || state[i] === 8) ? 0 : 1;
    state_1[i] = (state[i] === 8 || state[i] === 9) ? 0 : 1;
  }
}

/* ── Markdown 渲染（處理自定義子集：###/####/#####標題、**粗體**、倪曰注釋、漢字序號條目） ── */
function _nameHtml(s){ return String(s ?? '?').replace(/\{([^|{}]+)\|([^|{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>'); }
function renderInline(s){
  return s
    .replace(/&&(.+?)\/&/g,'$1')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\{([^|{}]+)\|([^|{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function renderMD(text, statuses=null){
  if(!text) return '<p class="body-line" style="color:#5a4020;">'+T('content.empty')+'</p>';
  text = text.replace(/&&(.+?)\/&/g,'$1');
  let html = '';
  let inSub = false;
  let sectionOpen = false;
  function closeSub(){ if(inSub){ html += '</div></div>'; inSub=false; } }
  for(const raw of text.split('\n')){
    const line = raw.trim();
    if(!line){ html += '<br>'; continue; }
    if(line === '&N&'){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      if(statuses){
        html += '<div class="ci-section ci-section-dim">';
        sectionOpen = true;
      }
      continue;
    }
    const om = line.match(/^&(\d+)&$/);
    if(om){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      if(statuses){
        const st = statuses[parseInt(om[1])] || 'b';
        html += '<div class="ci-section ci-section-'+st+'">';
        sectionOpen = true;
      }
      continue;
    }
    if(line === '/N&' || /^\/\d+&$/.test(line)){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      continue;
    }
    if(line.startsWith('##### ')){
      html += '<div class="yao-heading">'+renderInline(line.slice(6))+'</div>';
    } else if(line.startsWith('#### ')){
      closeSub();
      const name = line.slice(5).trim();
      const jieAttr = name==='解' ? ' data-jie' : '';
      html += '<div class="sub-section" data-mode="full"'+jieAttr+'>';
      html += '<div class="sub-heading"><span>'+renderInline(name)+'</span>'
            + '<button class="section-toggle" onclick="toggleSection(this)">▼</button></div>';
      html += '<div class="sub-section-body">';
      inSub = true;
    } else if(line.startsWith('### ')){
      closeSub();
      html += '<div class="sec-heading">'+renderInline(line.slice(4))+'</div>';
    } else if(line.startsWith('**') && line.endsWith('**') && line.length > 4){
      html += '<div class="bold-title">'+renderInline(line.slice(2,-2))+'</div>';
    } else if(line.startsWith('> ') || line === '>'){
      const body = line.startsWith('> ') ? line.slice(2) : '';
      html += '<p class="annotation">'+(body.trim() ? renderInline(body) : '&nbsp;')+'</p>';
    } else if(line.startsWith('• ')){
      const rest = line.slice(2);
      const sep = rest.search(/[、.：:]/);
      if(sep !== -1){
        const label = rest.slice(0, sep + 1);
        const body  = rest.slice(sep + 1);
        html += '<div class="content-item"><span class="item-num">'+label+'</span>'+renderInline(body)+'</div>';
      } else {
        html += '<div class="content-item">'+renderInline(rest)+'</div>';
      }
    } else if(/^!\[([^\]]*)\]\(([^)]+)\)$/.test(line)){
      const im = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
      const alt = _esc(im[1]);
      const src = _esc(im[2]);
      const isPdf = /\.pdf(#|$)/i.test(im[2]);
      const media = isPdf
        ? '<p class="media-missing">'+src+'</p><iframe class="md-pdf" src="'+src+'" title="'+alt+'" onload="this.previousElementSibling.style.display=\'none\'"></iframe>'
        : '<img src="'+src+'" alt="'+alt+'" onerror="_mediaErr(this)">';
      html += '<figure class="md-image">'+media
            + (alt ? '<figcaption>'+alt+'</figcaption>' : '')
            + '</figure>';
    } else {
      html += '<p class="body-line">'+renderInline(line)+'</p>';
    }
  }
  closeSub();
  if(sectionOpen) html += '</div>';
  return html;
}



// 計算判定爻點亮：回傳 {s0,s1,n}。s0/s1 各 8 格：[0]=卦辭 [1~6]=初~上爻辭 [7]=用九/用六（乾坤專用）。
// yi=変爻索引（升序），nfi=非変爻索引（升序），n=変爻數。
// 點亮邏輯由 config 決定（見全域 HIGHLIGHT，由 cfg.lit_mode + cfg.table 組成）：
//   每個新 6 位四進位 state → 以其為鍵查 `table` → 命中且帶 primary/secondary（任一，空陣列亦算）
//   → 逐格套用 primary(a)/secondary(b)；否則（含無表、查無、命中但無規則）退回 `lit_mode`
//   指定的預設（'zhuxi7' 朱熹七則（預設）｜'readall' 純讀變爻·全變並重，見 HIGHLIGHT_PRESETS）。
//   `text` 獨立於規則：只要命中表就取用。
// 乾坤全變的 用九/用六 由 _presetWithTail 統一補上（命中表規則時例外：完全由表指定）。
function computeGuaxiangSlots(){
  const yi=[],nfi=[];
  for(let i=0;i<6;i++){
    if(state[i]===6||state[i]===9) yi.push(i);
    else nfi.push(i);
  }
  const n=yi.length;
  let s0, s1, text=null;
  const row = HIGHLIGHT && HIGHLIGHT.table && HIGHLIGHT.table[state.join('')];
  const hasRules = row && (Array.isArray(row.primary) || Array.isArray(row.secondary));
  if(hasRules){
    s0=Array(8).fill('dim'); s1=Array(8).fill('dim');
    (row.primary||[]).forEach(k=>{ if(k>=0&&k<8) s0[k]='a'; });
    (row.secondary||[]).forEach(k=>{ if(k>=0&&k<8) s0[k]='b'; });
  } else {
    ({s0,s1}=_presetWithTail((HIGHLIGHT&&HIGHLIGHT.fallback)||'zhuxi7', yi, nfi, n));   // 無規則（含無表、不在表中）→ 退回 fallback
  }
  text=(row && (row.text||'').trim())||null;   // 正文獨立於規則：於卦象頁 ci 下方以正文格式顯示
  return {s0,s1,n,text};
}

// 內置點亮預設（判定爻規則）。各回傳 {s0,s1}，8 格同上。
// 乾坤全變的第八辭（用九/用六）由 _presetWithTail 統一處理，預設本身不管。
const HIGHLIGHT_PRESETS = {
  // 朱熹七則（大衍變占）：與原邏輯一致，唯 6 變之乾坤特例移至尾巴
  zhuxi7(yi,nfi,n){
    const s0=Array(8).fill('dim'),s1=Array(8).fill('dim');
    if(n===0){ s0[0]='a'; }
    else if(n===1){ s0[1+yi[n-1]]='a'; }
    else if(n===2){ s0[1+yi[n-1]]='a'; s0[1+yi[0]]='b'; }
    else if(n===3){ s0[0]='a'; s1[0]='b'; }
    else if(n===4){ s1[1+nfi[0]]='a'; s1[1+nfi[1]]='b'; }
    else if(n===5){ s1[1+nfi[0]]='a'; }
    else{ s1[0]='a'; }   // 6 變非乾坤 → 之卦卦辭；乾坤由尾巴改為用九/用六
    return {s0,s1};
  },
  // 純讀變爻·全變並重（黃克孫式）：變幾爻點亮幾條本卦爻辭，皆 primary
  readall(yi,nfi,n){
    const s0=Array(8).fill('dim'),s1=Array(8).fill('dim');
    if(n===0){ s0[0]='a'; }
    else if(n>=1&&n<=5){ yi.forEach(i=>{ s0[1+i]='a'; }); }
    else{ s1[0]='a'; }   // 6 變 → 之卦卦辭；乾坤由尾巴改為用九/用六
    return {s0,s1};
  },
};

// 跑預設，再統一補乾坤全變的用九/用六：僅 currentData 有 ci[7] 且六爻全變時，改為只亮 slot 7。
function _presetWithTail(mode, yi, nfi, n){
  const fn = HIGHLIGHT_PRESETS[mode] || HIGHLIGHT_PRESETS.zhuxi7;
  let {s0,s1} = fn(yi,nfi,n);
  if(n===6 && currentData && currentData.ci && currentData.ci[7] && currentData.ci[7].trim()){
    s0=Array(8).fill('dim'); s1=Array(8).fill('dim'); s0[7]='a';
  }
  return {s0,s1};
}

function renderGuaxiang(){

// entries: [[tab, enabled], ...]  —— 只更新傳入的頁面，其餘不變
// 若當前頁面被禁用，自動切換到最近可用的；全無則報錯清空內容
function applyTabAvailability(entries){
  for(const [m, enabled] of entries){
    enabled ? tabDisabled.delete(m) : tabDisabled.add(m);
    document.getElementById(TAB_BTN[m]).classList.toggle('tab-disabled', !enabled);
  }
  if(!tabDisabled.has(currentTab)) return;
  const idx = TABS.indexOf(currentTab);
  let fallback = null;
  for(let d = 1; d < TABS.length && !fallback; d++){
    if(idx + d < TABS.length && !tabDisabled.has(TABS[idx + d])) fallback = TABS[idx + d];
    else if(idx - d >= 0     && !tabDisabled.has(TABS[idx - d])) fallback = TABS[idx - d];
  }
  if(fallback){
    setTab(fallback);
  } else {
    setMsg(T('msg.no_tab'), 'error');
    document.getElementById('contentArea').innerHTML = '';
  }
}

// 查詢本卦（及 quaternary 模式下的之卦），更新 currentData/currentData1 並重繪右欄（同步）

  if(_editMode) cancelTextEdit();
  hexViewMode = 'original';
  const bits0 = (bitRowMode === 'quaternary' ? state_0 : state).join("");
  document.querySelectorAll('.shibo-lit').forEach(el=>el.classList.remove('shibo-lit'));

  currentData = d;

  const numEl = document.getElementById("numDisplay");
  numEl.value = (bitRowMode === 'quaternary' && currentData1 && currentData1.num !== d.num)

// 加權隨機：依 {值: 權重} 字典抽取一個值
function weightedRandom(weights){
  const entries = Object.entries(weights);
  let r = Math.random() * entries.reduce((s,[,w])=>s+w, 0);
  for(const [val,w] of entries){ r-=w; if(r<=0) return parseInt(val); }
  return parseInt(entries[entries.length-1][0]);
}

function fmtPct(v, total){
  if(total <= 0) return '—';
  const pct = v / total * 100;
  const p4 = Number(pct.toPrecision(4));
  return (p4 === pct ? String(pct) : pct.toPrecision(4)) + '%';
}
function pctColor(mode, k){
  return PROB_COLORS[mode][k] || '#c9a84c';
}

function settingsRender(){
  const w = shiboProbWeights || shiboProbDefaults;
  let html = '';
  for(const mode of ['binary','quaternary']){
    const entries = Object.entries((w && typeof w==='object' && w[mode]) || _SHIBO_DEFAULT_PROBS[mode]);
    const total = entries.reduce((s,[,v])=>s+Number(v), 0);
    html += `<div class="prob-section-label" style="display:flex;justify-content:space-between;align-items:center;">
      <span>${mode === 'binary' ? T('settings.mode.binary') : T('settings.mode.quaternary')}</span>

    for(const [k, v] of entries){
      const rawLabel = PROB_LABELS[mode][k] || k;
      const sym  = rawLabel.slice(-1);
      const name = rawLabel.slice(0, -1).trimEnd();
      const color = pctColor(mode, k);
      const pct = fmtPct(Number(v), total);
      html += `<div class="prob-row">
        <span class="prob-name"><span class="prob-name-key">(${k})</span><span class="prob-name-lbl"> ${_esc(sym)} ${_esc(name)}</span></span>
        <span class="prob-pct-wrap"><span class="prob-pct${mode==='quaternary'?' prob-pct--glint':''}" id="pct_${mode}_${k}" style="color:${color};${mode==='quaternary'?'animation-delay:'+PROB_GLINT_DELAY[k]:''}">${pct}</span></span>
        <span class="prob-frac">${v}/${total}</span>

  html += `<div class="settings-actions">
    <button class="settings-btn-action" onclick="settingsShowPresets()">${T('btn.preset')}</button>

function renderSaveDropdown(records){
  _saveRecords = [...records].reverse();
  const dd = document.getElementById('saveDropdown');
  dd.innerHTML = `<div class="dd-title">${_esc(T('dd.history_title'))}</div><div class="dd-body"></div>`;
  const body = dd.querySelector('.dd-body');
  if(!_saveRecords.length){
    body.innerHTML = `<div class="save-dropdown-empty">${T('history.empty')}</div>`;
    return;
  }
  body.innerHTML = _saveRecords.map((rec, i) => {
    const bits = rec.digits;
    const isYarrow = bits.some(b => b > 1);
    const bitsStr = bits.map(b => {
      const c = isYarrow ? (PROB_COLORS.quaternary[String(b)] || '#c9a84c') : (PROB_COLORS.binary[String(b)] || '#c9a84c');
      return `<span style="color:${c}">${b}</span>`;
    }).join('');
    const ts = _relTime(rec.time);
    const favoClass = 'save-favo' + (rec.favo ? ' active' : '');
    return `<div class="save-record${rec.shibo ? ' shibo-lit' : ''}"><span class="save-record-icons"><span class="save-del" onclick="deleteRecord(${i},event)">✖</span><span class="save-edit" onclick="editRecord(${i},event)">✎</span><span class="${favoClass}" onclick="toggleFavo(${i},event)">${rec.favo ? '★' : '☆'}</span></span><span class="save-record-name" onclick="loadSaveRecord(${i})"><span class="save-record-name-inner">${_esc(rec.name||'')}</span></span><span class="save-record-bits" onclick="loadSaveRecord(${i})"><span class="save-record-bits-inner">${bitsStr}</span></span><span class="save-record-time" onclick="loadSaveRecord(${i})">${ts}</span></div>`;
  }).join('');
}

function _relTime(isoStr){
  const s = Math.floor((Date.now() - new Date(isoStr)) / 1000);
  if(s >= 86400 * 365) return T('time.years_ago', Math.floor(s / (86400 * 365)));
  if(s >= 86400)       return T('time.days_ago',  Math.floor(s / 86400));
  if(s >= 3600)        return T('time.hours_ago', Math.floor(s / 3600));
  return T('time.secs_ago', Math.max(0, s));
}

function _recordPreviewHTML(rec){
  const bits = rec.digits;
  const isYarrow = bits.some(b => b > 1);
  const bitsStr = bits.map(b => {
    const c = isYarrow ? (PROB_COLORS.quaternary[String(b)] || '#c9a84c') : (PROB_COLORS.binary[String(b)] || '#c9a84c');
    return `<span style="color:${c}">${b}</span>`;
  }).join(' ');
  const ts = _relTime(rec.time);
  const favoClass = 'save-favo'+(rec.favo?' active':'');
  return `<div class="save-record save-dd-confirm-preview${rec.shibo?' shibo-lit':''}"><span class="save-record-icons"><span class="${favoClass}">${rec.favo?'★':'☆'}</span></span><span class="save-record-name"><span class="save-record-name-inner">${_esc(rec.name||'')}</span></span><span class="save-record-bits"><span class="save-record-bits-inner">${bitsStr}</span></span><span class="save-record-time">${ts}</span></div>`;
}

function applyPanelScale(s) {
  const root = document.documentElement;
  for (const [k, base] of Object.entries(PANEL_SIZES)) {
    const v = PANEL_FS_KEYS.has(k) ? Math.max(base * s, BTN_FS_MIN) : base * s;
    root.style.setProperty(k, v + 'px');
  }
}

function fitLeftPanel() {
  const panel   = document.querySelector('.left-panel');
  const stacked = document.querySelector('.page-layout').classList.contains('stacked');
  panel.style.height = '';
  applyPanelScale(1);
  const rect  = panel.getBoundingClientRect();
  const avail = window.innerHeight - rect.top - PANEL_BOTTOM_MARGIN;
  let s = 1;
  if (stacked) {
    const scaleW = (window.innerWidth - 2 * PANEL_STACKED_H_MARGIN) / BASE_PANEL_W;
    const scaleH = avail / rect.height;
    s = Math.min(scaleW, scaleH);
  } else {
    if (rect.height > avail) s = avail / rect.height;
  }
  if (s !== 1) applyPanelScale(s);
  panel.style.height = avail + 'px';
  fitSourceOverlay();
}

function fitSourceOverlay() {
  const ov = document.getElementById('sourceOverlay');
  for (const k of Object.keys(PANEL_SIZES)) ov.style.removeProperty(k);
  if (!ov.classList.contains('open')) return;
  const avail    = document.querySelector('.left-panel').getBoundingClientRect().height;
  const body     = ov.querySelector('.source-body');
  const overflow = body.scrollHeight - body.offsetHeight;
  if (overflow <= 0) return;
  const s  = avail / (avail + overflow);
  const cs = getComputedStyle(document.documentElement);
  for (const k of Object.keys(PANEL_SIZES)) {
    const v = parseFloat(cs.getPropertyValue(k));
    if (!isNaN(v)) ov.style.setProperty(k, (v * s) + 'px');
  }
}

function fitRightHeader() {
  const root = document.documentElement;

  // ── 第一步：寬度 scale ──
  const panelW = document.querySelector('.right-panel').getBoundingClientRect().width;
  const s_w = Math.min(1, panelW / HDR_BASELINE_WIDTH);
  for (const [k, base] of Object.entries(HDR_SIZES))
    root.style.setProperty(k, _hdrVal(k, base * s_w) + 'px');

  // ── 第二步：高度 scale（header 底部不可超過視窗 1/2）──
  // getBoundingClientRect() 強制 style flush，確保第一步已套用
  const rect = document.getElementById('hexHeader').getBoundingClientRect();
  const budget = window.innerHeight / 2;
  if (rect.bottom > budget && rect.height > 0) {
    // header.top 不受 scale 影響；height 與 s 成正比
    // 目標：rect.top + rect.height × (s_final / s_w) = budget
    const s_final = s_w * (budget - rect.top) / rect.height;
    for (const [k, base] of Object.entries(HDR_SIZES))
      root.style.setProperty(k, _hdrVal(k, base * s_final) + 'px');
  }
}

function updateToggle() {
  const layout    = document.querySelector('.page-layout');
  const stacked   = layout.classList.contains('stacked');
  const showRight = layout.classList.contains('show-right');
  const toggle    = document.getElementById('panelToggle');
  const back      = document.getElementById('panelBack');

  toggle.style.display = (stacked && !showRight) ? 'flex' : 'none';
  back.style.display = (stacked && showRight) ? 'flex' : 'none';
  document.body.classList.toggle('stacked-right', stacked && showRight);
  document.body.classList.toggle('stacked-left',  stacked && !showRight);
}

  const w = document.querySelector('.right-panel').getBoundingClientRect().width;
  if (w < 200) layout.classList.add('stacked');

function fitBtnText(root) {
  (root || document).querySelectorAll('button:not(:has(svg)):not(.no-fit)').forEach(btn => {
    if (!btn.textContent.trim()) return;
    btn.style.fontSize = '';
    btn.style.whiteSpace = '';
    const w = btn.offsetWidth;
    if (!w) return;
    let fs = parseFloat(getComputedStyle(btn).fontSize);
    while (btn.scrollWidth > w + 0.5 && fs > BTN_FS_MIN) {
      fs -= 0.5;
      btn.style.fontSize = fs + 'px';
    }
    if (btn.scrollWidth > w + 0.5 && fs <= BTN_FS_MIN) btn.style.whiteSpace = 'normal';
  });
  (root || document).querySelectorAll('.prob-name').forEach(el => {
    el.style.fontSize = '';
    const row = el.closest('.prob-row');
    if (!row) return;
    let fs = parseFloat(getComputedStyle(el).fontSize);
    const nameW = el.offsetWidth; // fixed 50% of row
    while (el.scrollWidth > nameW + 0.5 && fs > BTN_FS_MIN) {
      fs -= 0.5;
      el.style.fontSize = fs + 'px';
    }
    // beyond font floor, CSS text-overflow:ellipsis on .prob-name-lbl handles the rest
  });
}

let _cfgBaseline = null;
let _cfgHexBaseline = null;
let _cfgHexNum = null;
let _cfgHexEdits = {};
function _cfgCheckDirty(){
  const btn = document.getElementById('cfgSaveBtn');
  if(!btn || _cfgBaseline === null) return;
  let dirty = false;
  try { dirty = JSON.stringify(configReadForm()) !== _cfgBaseline; } catch(e){ dirty = true; }
  if(!dirty && _cfgHexBaseline){
    const orig = _HEX_BY_NUM[_cfgHexBaseline.num] || {};
    const nameEl = document.getElementById('cfg-hex-name');
    const shortEl = document.getElementById('cfg-hex-short');
    const ciV = _cfgHexCiRead();
    if(nameEl && (nameEl.value !== (orig.name||'') || shortEl.value !== (orig.short_name||'')
       || (ciV !== null && ciV !== _cfgHexCiNorm((orig.ci||[]).join('\n')))))
      dirty = true;
    if(!dirty){
      const curN = _cfgHexBaseline.num;
      for(const [k, edit] of Object.entries(_cfgHexEdits)){
        if(parseInt(k) === curN) continue;
        const d = _HEX_BY_NUM[parseInt(k)] || {};
        if(edit.name !== (d.name||'') || edit.short_name !== (d.short_name||'') || edit.ci !== _cfgHexCiNorm((d.ci||[]).join('\n'))){ dirty = true; break; }
      }
    }
  }
  btn.disabled = !dirty;
  btn.classList.toggle('primary', dirty);
}
function configSave(){
  let cfg;
  try { cfg = configReadForm(); _validateCfg(cfg); }
  catch(e){ setMsg(e.message, 'error'); return; }
  const _cfgFormDirty = JSON.stringify(cfg) !== _cfgBaseline;
  if(_cfgFormDirty){
    _lsSaveConfig(cfg);
    _srcSetClean('cfg', false);
    _applyConfig(cfg);
    _cfgBaseline = JSON.stringify(cfg);
  }
  _cfgStashCurrentHexEdits();
  for(const [numStr, edit] of Object.entries(_cfgHexEdits)){
    const n = parseInt(numStr);
    const d = _HEX_BY_NUM[n];
    if(!d) continue;
    if(edit.name !== (d.name||'')){
      _lsApplyHexOv(n, 'name', edit.name);
      d.name = edit.name;
      if(d.sequence) _HEX_BY_SEQ[d.sequence].name = edit.name;
    }
    if(edit.short_name !== (d.short_name||'')){
      _lsApplyHexOv(n, 'short_name', edit.short_name);
      d.short_name = edit.short_name;
      if(d.sequence) _HEX_BY_SEQ[d.sequence].short_name = edit.short_name;
    }
    if(edit.ci !== undefined && edit.ci !== _cfgHexCiNorm((d.ci||[]).join('\n'))){
      _lsApplyHexOv(n, 'ci', edit.ci);
      const arr = edit.ci.split('\n');
      d.ci = arr;
      if(d.sequence) _HEX_BY_SEQ[d.sequence].ci = arr;
    }
  }
  _cfgHexEdits = {};
  if(currentData){ renderHeader(); renderContent(currentData); }
  setMsg(T('msg.config_saved'), 'success');
  const btn = document.getElementById('cfgSaveBtn');
  btn.disabled = true; btn.classList.remove('primary');
}

/// Config 互動介面 ///
const _CFG_TRIGRAMS = ['000','001','010','011','100','101','110','111'];
const _CFG_CORE_TRI = new Set(['name','color']);

function _secInner(i18nKey, varName=''){
  return varName
    ? `<div>${T(i18nKey)}</div><div class="config-subsec" style="margin-top:2px">${varName}</div>`
    : T(i18nKey);

}

// ci 讀取正規化：第 8 條起（用九/用六）為空 → 不寫入（config.json 精簡原則）。
// 前 7 條（卦辭＋六爻）按位置保留，空行不刪。
function _cfgHexCiNorm(text){
  const a = text.split('\n');
  while(a.length > 7 && !a[a.length-1].trim()) a.pop();
  // 全空（骨架卦無 ci 時的空表單）→ ''，與「無 ci」等值，避免空編輯被誤存
  if(a.every(s => !s.trim())) return '';
  return a.join('\n');
}
// 讀 8 個 ci 輸入框 → 正規化後的合併字串；表單未渲染 → null
function _cfgHexCiRead(){
  if(!document.getElementById('cfg-hex-ci-0')) return null;
  const a = [];
  for(let i=0;i<8;i++) a.push(document.getElementById('cfg-hex-ci-'+i).value);
  return _cfgHexCiNorm(a.join('\n'));
}

function _cfgStashCurrentHexEdits(){
  if(!_cfgHexBaseline) return;
  const n = _cfgHexBaseline.num;
  const nameEl = document.getElementById('cfg-hex-name');
  const shortEl = document.getElementById('cfg-hex-short');
  if(!nameEl) return;
  const orig = _HEX_BY_NUM[n] || {};
  // 兩側皆正規化比較：庫存資料本身帶空第 8 條時，未經編輯不得視為變更
  const origCi = _cfgHexCiNorm((orig.ci||[]).join('\n'));
  const ciRead = _cfgHexCiRead();
  const ciVal = ciRead === null ? origCi : ciRead;
  if(nameEl.value !== (orig.name||'') || shortEl.value !== (orig.short_name||'') || ciVal !== origCi){
    _cfgHexEdits[n] = { name: nameEl.value, short_name: shortEl ? shortEl.value : '', ci: ciVal };
  } else {
    delete _cfgHexEdits[n];
  }
}

function configHexNumChange(val){
  _cfgStashCurrentHexEdits();
  const n = Math.max(1, Math.min(64, parseInt(val) || 1));
  _cfgHexNum = n;
  const d = _HEX_BY_NUM[n] || {};
  _cfgHexBaseline = { num: n, name: d.name || '', short_name: d.short_name || '', ci: (d.ci||[]).join('\n') };
  const nameEl = document.getElementById('cfg-hex-name');
  const shortEl = document.getElementById('cfg-hex-short');
  const edit = _cfgHexEdits[n];
  if(nameEl) nameEl.value = edit ? edit.name : (d.name || '');
  if(shortEl) shortEl.value = edit ? edit.short_name : (d.short_name || '');
  const ciArr = edit ? edit.ci.split('\n') : (d.ci || []);
  for(let i=0;i<8;i++){
    const el = document.getElementById('cfg-hex-ci-'+i);
    if(el) el.value = ciArr[i] || '';
  }
}
function configHexStep(delta){
  const el = document.getElementById('cfg-hex-num');
  const n = Math.max(1, Math.min(64, (parseInt(el.value)||1) + delta));
  el.value = n;
  configHexNumChange(n);
}

/// table（查表）逐態編輯器 ///
let _cfgCustomTable = {};      // 編輯用的 table 副本（存檔時寫回 cfg.table）
let _cfgCustomKey = '777777';  // 目前導覽中的 6 位四進位 state 鍵
const _CFG_SLOT_CYCLE = { dim:'glow', glow:'normal', normal:'dim' };
const _cfgCustomValidKey = s => /^[6-9]{6}$/.test(s);

// 讀表單 → 一筆 entry。text 無獨立開關：非空即寫入、清空即移除；rules 開 → 寫 primary/secondary
// （空陣列亦寫，代表「明確不點亮」）。text 空且 rules 關 → null（刪除）；最終空物件 {} → null（不留死重量）。
function _cfgReadCustomForm(){
  const hasRules = document.getElementById('cfg-custom-rules').classList.contains('on');
  const e = {};
  const txt = document.getElementById('cfg-custom-text').value.trim();
  if(txt) e.text = txt;
  if(hasRules){
    const primary = [], secondary = [];
    for(let k=0;k<8;k++){
      const st = document.getElementById('cfg-custom-slot-'+k).dataset.st;
      if(st==='glow') primary.push(k);
      else if(st==='normal') secondary.push(k);
    }
    // 只寫非空陣列（穩定往返，不無故弄髒）；兩者皆空時寫一個空 primary 標記「有規則但不點亮」
    if(primary.length) e.primary = primary;
    if(secondary.length) e.secondary = secondary;
    if(!primary.length && !secondary.length) e.primary = [];
  }
  return Object.keys(e).length ? e : null;
}
function _cfgStashCustom(){
  const e = _cfgReadCustomForm();
  if(e) _cfgCustomTable[_cfgCustomKey] = e;
  else delete _cfgCustomTable[_cfgCustomKey];
}
const _CFG_SLOT_CLASS = {
  dim:    'cfg-slot cfg-slot-dim',
  glow:   'cfg-slot btn-inverted',                    // primary＝標準反白樣式
  normal: 'cfg-slot btn-inverted cfg-slot-normal',    // secondary＝反白樣式調暗覆蓋
};
function _cfgSetSlot(k, st){
  const b = document.getElementById('cfg-custom-slot-'+k);
  b.dataset.st = st;
  b.className = _CFG_SLOT_CLASS[st];   // 原子替換，仿 renderBtn；不可能殘留舊 state class
}
// text 無開關（空＝無此欄位）；rules 開關管 8 個 slot
function _cfgApplyCustomEnable(){
  const rules = document.getElementById('cfg-custom-rules').classList.contains('on');
  for(let k=0;k<8;k++) document.getElementById('cfg-custom-slot-'+k).disabled = !rules;
}
function _cfgLoadCustomEntry(){
  const row = _cfgCustomTable[_cfgCustomKey];
  const rulesBtn  = document.getElementById('cfg-custom-rules');
  document.getElementById('cfg-custom-text').value = (row && row.text) || '';
  const hasRules = !!(row && (Array.isArray(row.primary) || Array.isArray(row.secondary)));
  rulesBtn.classList.toggle('on', hasRules);
  const pr = (row && row.primary) || [], sc = (row && row.secondary) || [];
  for(let k=0;k<8;k++) _cfgSetSlot(k, pr.includes(k) ? 'glow' : sc.includes(k) ? 'normal' : 'dim');
  _cfgApplyCustomEnable();
}
function configCustomKeyChange(val){
  _cfgStashCustom();
  const s = String(val||'').trim();
  if(_cfgCustomValidKey(s)) _cfgCustomKey = s;
  document.getElementById('cfg-custom-key').value = _cfgCustomKey;  // 非法輸入 → 還原
  _cfgLoadCustomEntry();
}
function configCustomStep(delta){
  let idx = 0;
  for(const ch of _cfgCustomKey) idx = idx*4 + (ch.charCodeAt(0)-54);   // '6'→0 … '9'→3
  idx = mod(idx + delta, 4096);
  let key = '';
  for(let i=0;i<6;i++){ key = String.fromCharCode(54 + (idx & 3)) + key; idx >>= 2; }
  configCustomKeyChange(key);
}
function configCustomToggleRules(){
  const b = document.getElementById('cfg-custom-rules');
  if(b.disabled) return;
  b.classList.toggle('on');
  _cfgApplyCustomEnable();
  _cfgCheckDirty();
}
function configCustomSlotCycle(k){
  const b = document.getElementById('cfg-custom-slot-'+k);
  if(b.disabled) return;
  _cfgSetSlot(k, _CFG_SLOT_CYCLE[b.dataset.st]);
  _cfgCheckDirty();
}

function sourceLoadFile(type, inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      if(type === 'md'){
        const secs = _parseMdSections(e.target.result);
        if(Object.keys(secs).length === 0) throw new Error('No hexagram sections (## NN.) found');
        const ov = _lsGetHexOv();
        for(const [numStr, fields] of Object.entries(secs)){
          const n = parseInt(numStr);
          if(!ov[numStr]) ov[numStr] = {};
          Object.assign(ov[numStr], fields);
          const h = _HEX_BY_NUM[n]; if(!h) continue;
          Object.assign(h, fields);
          if(_HEX_BY_SEQ[h.sequence]) Object.assign(_HEX_BY_SEQ[h.sequence], fields);
        }
        localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
        if(currentData){ renderContent(currentData); }
        _srInvalidate();   // 匯入 text.md 已改寫內文，搜尋索引作廢
        _srcSetClean('md', true, file.name);
      } else if(type === 'cfg'){
        const cfg = JSON.parse(e.target.result);
        _validateCfg(cfg);
        const {hexagrams, overrides, ...cfgOnly} = cfg;
        _lsSaveConfig(cfgOnly); _applyConfig(cfgOnly);
        if(Array.isArray(hexagrams) && hexagrams.length > 0){
          for(const h of hexagrams){
            if(typeof h.num !== 'number') throw new Error(`Hexagram entry missing "num"`);
            if(typeof h.sequence !== 'string' || !/^[01]{6}$/.test(h.sequence)) throw new Error(`Hexagram ${h.num}: invalid "sequence" (expected 6 binary digits)`);
          }
          const IC_FIELDS = ['name','short_name','ci','symbol'];
          const ov = _lsGetHexOv();
          for(const h of hexagrams){
            const k = String(h.num); if(!_HEX_BY_NUM[h.num]) continue;
            if(!ov[k]) ov[k] = {};
            for(const f of IC_FIELDS) if(f in h){
              ov[k][f] = h[f]; _HEX_BY_NUM[h.num][f] = h[f];
              if(_HEX_BY_SEQ[h.sequence]) _HEX_BY_SEQ[h.sequence][f] = h[f];
            }
          }
          for(const [numStr, fields] of Object.entries(overrides || {})){
            const n = parseInt(numStr); if(!_HEX_BY_NUM[n]) continue;
            const h = _HEX_BY_NUM[n]; const k = String(n);
            if(!ov[k]) ov[k] = {};
            for(const f of IC_FIELDS) if(f in fields){
              ov[k][f] = fields[f]; h[f] = fields[f];
              if(_HEX_BY_SEQ[h.sequence]) _HEX_BY_SEQ[h.sequence][f] = fields[f];
            }
          }
          localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
          if(currentData){ currentData = _HEX_BY_NUM[currentData.num] || currentData; renderContent(currentData); renderHeader(); }
        }
        _srInvalidate();   // 匯入 config.json 可能改寫卦名/卦爻辭，搜尋索引作廢
        _srcSetClean('cfg', true, file.name);
      } else if(type === 'saves'){
        const records = JSON.parse(e.target.result);
        if(!Array.isArray(records)) throw new Error('saves.json must be a JSON array');
        localStorage.setItem(_LS_SAVES, JSON.stringify(records));
        _srcSetClean('saves', true, file.name);
      }
    } catch(err){ sourceErrOpen(err.message); }
    inputEl.value = '';
  };
  reader.readAsText(file);
}
function sourceDownload(type){
  let data, filename, mime = 'application/json';
  if(type === 'saves'){ data = JSON.stringify(_lsLoadSaves(), null, 2); filename = 'saves.json'; }
  else if(type === 'cfg'){
    // 鍵序固定：其餘 → hexagrams → lit_mode →（有才寫）table；undefined 值 JSON.stringify 自動略過
    const {lit_mode, table, ...rest} = _lsGetConfig();
    data = JSON.stringify({...rest, hexagrams: _reconstructIching(), lit_mode: lit_mode || 'zhuxi7', table}, null, 2);
    filename = 'config.json';
  }
  else if(type === 'md'){ data = _reconstructMd(); filename = 'text.md'; mime = 'text/markdown'; }
  else return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type: mime}));
  a.download = filename; a.click(); URL.revokeObjectURL(a.href);
}
function _reconstructMd(){
  return Object.values(_HEX_BY_NUM)
    .sort((a,b) => a.num - b.num)
    .map(h => `## ${String(h.num).padStart(2,'0')}.\n### _\n${h['text.tab1']||''}\n### _\n${h['text.tab2']||''}\n### _\n${h['text.tab3']||''}`)
    .join('\n\n');
}
function _reconstructIching(){
  return Object.values(_HEX_BY_NUM)
    .sort((a,b) => a.num - b.num)
    .map(({num,sequence,name,short_name,symbol,ci}) =>
      // 匯出時同樣去掉空的第 8 條起（用九/用六）——config.json 不帶空 ci 條目
      ({num,sequence,name,short_name,symbol,ci: _cfgHexCiNorm((ci||[]).join('\n')).split('\n')}));
}
function _parseMdSections(text){
  const SEC = ['text.tab1','text.tab2','text.tab3'];
  const result = {};
  let curNum = null, sections = [], curLines = null;
  for(const raw of text.split('\n')){
    const s = raw.trimEnd();
    const m = s.match(/^## (\d{2})\./);
    if(m){
      if(curNum !== null){
        if(curLines !== null) sections.push(curLines);
        result[String(curNum)] = Object.fromEntries(
          SEC.slice(0, sections.length).map((f,i) => [f, sections[i].join('\n').trim()])
        );
      }
      curNum = parseInt(m[1]); sections = []; curLines = null; continue;
    }
    if(curNum === null) continue;
    if(s.startsWith('### ')){ if(curLines !== null) sections.push(curLines); curLines = []; continue; }
    if(curLines !== null) curLines.push(s);
  }
  if(curNum !== null){
    if(curLines !== null) sections.push(curLines);
    result[String(curNum)] = Object.fromEntries(
      SEC.slice(0, sections.length).map((f,i) => [f, sections[i].join('\n').trim()])
    );
  }
  return result;
}

function _seqOpposite(seq){ return seq.split('').map(c=>c==='1'?'0':'1').join(''); }
function _seqInverse(seq){ return seq.split('').reverse().join(''); }
function _seqSwap(seq){ return seq[3]+seq[4]+seq[5]+seq[0]+seq[1]+seq[2]; }
function _seqNuclear(seq){ return seq[1]+seq[2]+seq[3]+seq[2]+seq[3]+seq[4]; }
function _relModeData(data, mode){
  if(!data || mode==='original' || mode==='zhi') return null;
  const seq = data.sequence;
  let rseq;
  if(mode==='opposite')      rseq = _seqOpposite(seq);
  else if(mode==='inverse')  rseq = _seqInverse(seq);
  else if(mode==='swap')     rseq = _seqSwap(seq);
  else if(mode==='nuclear')  rseq = _seqNuclear(seq);
  return rseq ? (_HEX_BY_SEQ[rseq] || null) : null;
}

function _bootCore(){
  const _hex = {};
  for (const h of JSON.parse(JSON.stringify(_EMBEDDED_CONFIG.hexagrams))) _hex[h.sequence] = h;
  if (_EMBEDDED_HEX) for (const [seq, txt] of Object.entries(_EMBEDDED_HEX)) if (_hex[seq]) Object.assign(_hex[seq], txt);
  const _ov  = _bootIgnoreStored ? {} : _lsGetHexOv();

(function(){
  const co = document.getElementById('configOverlay');
  if(co){
    const _navIds = new Set(['cfg-hex-num','cfg-custom-key']);   // 導覽輸入不算設定變更
    co.addEventListener('input', e => { if(!_navIds.has(e.target.id)) _cfgCheckDirty(); });
    co.addEventListener('change', e => { if(!_navIds.has(e.target.id)) _cfgCheckDirty(); });
  }
})();

(function(){
  let _t = null, _el = null;
  function _clear(el){ el.style.removeProperty('--sb-c'); el.style.removeProperty('--sb-c-hover'); }
  function _off(){ if(_el){ _clear(_el); _el = null; } }
  function _on(e){
    const el = e.target;
    if(el === document || el === document.documentElement) return;
    if(_el && _el !== el){ _clear(_el); }
    _el = el;
    el.style.setProperty('--sb-c','var(--c-gold)');
    el.style.setProperty('--sb-c-hover','var(--c-gold)');
    clearTimeout(_t);
    _t = setTimeout(_off, 400);
  }
  document.addEventListener('scroll', _on, true);
  document.addEventListener('mouseup', function(){ clearTimeout(_t); _off(); });
})();
(function(){
  const ov = document.getElementById('tip-overlay') || (() => { const d = document.createElement('div'); d.id = 'tip-overlay'; document.body.appendChild(d); return d; })();
  const GAP = 7, MARGIN = 4;
  function _vp(){ const vp = window.visualViewport; return vp ? {w:vp.width,h:vp.height,ox:vp.offsetLeft,oy:vp.offsetTop} : {w:window.innerWidth,h:window.innerHeight,ox:0,oy:0}; }
  function show(el){
    const text = el.dataset.tip;
    if(!text) return;
    ov.classList.remove('visible');
    ov.textContent = text;
    const ow = ov.offsetWidth, oh = ov.offsetHeight;
    const r = el.getBoundingClientRect();
    const vp = _vp();
    const below = el.classList.contains('tip-below');
    let x = r.left - vp.ox + r.width/2 - ow/2;
    x = Math.max(MARGIN, Math.min(vp.w - ow - MARGIN, x));
    let y = below ? r.bottom - vp.oy + GAP : r.top - vp.oy - oh - GAP;
    if( below && y + oh > vp.h - MARGIN) y = r.top - vp.oy - oh - GAP;
    if(!below && y < MARGIN)             y = r.bottom - vp.oy + GAP;
    y = Math.max(MARGIN, Math.min(vp.h - oh - MARGIN, y));
    ov.style.left = x + 'px';
    ov.style.top  = y + 'px';
    ov.classList.add('visible');
  }
  function hide(){ ov.classList.remove('visible'); }
  document.addEventListener('pointerover', function(e){
    const el = e.target.closest('[data-tip]');
    if(el) show(el);
  });
  document.addEventListener('pointerout', function(e){
    const el = e.target.closest('[data-tip]');
    if(el && !el.contains(e.relatedTarget)) hide();
  });
})();
</script>
