감감 험차침 입우감담 물용(來之坎坎，險且枕，入于坎窞，勿用) 오고가니 괴롭다. 위험하고 또 방해한다. 크고작은 구덩이에 들어간다. 쓰지말라","六四：준주궤이 용부 납약자유 종무구(樽酒簋貳，用缶，納約自牖，終无咎) 술통의 술과 제기 두개, 장군을 쓴다. 고생을 받고 스스로 깨우친다. 끝은 허물없다.","九五：감불영 지기평 무구(坎不盈，只既平，无咎) 구덩이가 차지않았다. 단지 이미 평평하다. 허물없다.","上六：계용휘묵 치어총극 삼세부득 흉(繫用徽纆，寘于叢棘，三歲不得，凶) 맴에 아름다운 노끈을 쓴다.  덩굴가시에 둔다. 삼년동안 얻지못한다. 흉하다."]},{"num":30,"name":"이위화(離爲火)","sequence":"101101","symbol":"䷝","short_name":"이(離)","ci":["리(離)  이정 형 휵목우 길(利貞，亨。畜牝牛，吉)","初九：리착연 경지무구(履錯然，敬之无咎) 착각해서 밟는다. 그것을 공경하니 허물이없다.","六二：황이 원길(黃離，元吉) 근심을 앓다. 본디 길하다.","九三：일측지리 불고결이가 즉대질지차 흉(日昃之離，不鼓缶而歌，則大耋之嗟，凶) 날이 기우니 헤어진다. 북이 아니고 그릇으로 노래한즉 아주 늙은이가 탄식한다. 흉하다.","九四：돌여기래여 분여 사여 기여(突如其來如，焚如，死如，棄如) 갑자기 그이후로  불사르고 죽고 버림 같다.","六五：출체타약 척차약 길(出涕沱若，戚嗟若，吉) 눈물이 나옴같고 근심하고 탄식함같다. 길하다.","上九：왕용출정 유가절수 획기비축 무구(王用出征，有嘉折首，獲其匪丑，无咎) 왕이 출정을 한다. 머리를 꺽으니 기쁨이 있다. 그 소아닌것을 잡으니 허물없다. 참고 *복상(卜商) 자하역전(子夏易傳) *우리말샘 *위키백과,위키낱말사전,위키낱말사전 주역하 (第31卦〜第64卦) 주역 상 : 第1卦~第30卦 주역 하 : 第31卦~第64卦"]},{"num":31,"name":"택산함(澤山咸)","sequence":"001110","symbol":"䷞","short_name":"함(咸)","ci":["함(咸)  형 이정 취녀길(亨，利貞，取女吉)","初六：함기무(咸其拇) 그 엄지손가락이 두루 미친다.","六二：함기비 흉 거길(咸其腓，凶，居吉) 그 장딴지가 두루미친다. 흉하다. 거하니 길하다.","九三：함기고 집기수 왕린(咸其股，執其隨，往吝) 그 넓적다리에 두루미치니 그 발꿈치를 잡는다. 감에 인색하다.","九四：정길회망 동동왕래 붕종이사(貞吉悔亡，憧憧往來，朋從爾思) 바르니 길하고 잊음을 후회한다. 동경하여 가고온다. 친구가 너의 생각을 쫓는다.","九五：함기매 무회(咸其脢，无悔) 그 등골뼈에 두루미치니 후회가 없다.","上六：함기보 협설(咸其輔，頰舌) 그 광대뼈에 두루미치니 뺨과 혀이다."]},{"num":32,"name":"뇌풍항(雷風恆)","sequence":"011100","symbol":"䷟","short_name":"항(恆)","ci":["항(恒)   형 무구 이정 이유유왕 (亨，无咎，利貞，利有攸往)","初六：준항 정흉 무유리(浚恒，貞凶，无攸利) 늘 깊으니 바르나 흉하다. 이로운바가없다.","九二：회망(悔亡) 잃음을 후회한다.","九三：불항기덕 혹승지수 정린(不恆其德，或承之羞，貞吝) 그덕이 늘 두루 미치지못하다. 혹 높음의 부끄러움으로 바르나 근심이다.","九四：전무금(田无禽) 전이 날짐승이 없다.","六五：항기덕 정 부인길 부자흉(恆其德，貞，婦人吉，夫子凶) 그덕이 두리미치다. 바르다. 부인이 길하다. 남편이 흉하다.","上六：진항 흉(振恒，凶) 항상 무리를 지어 날다. 흉하다."]},{"num":33,"name":"천산둔(天山遯)","sequence":"001111","symbol":"䷠","short_name":"둔(遯)","ci":["돈(遯)  형 소이정 (亨，小利貞)","初六：둔미 려 물용유유왕(遯尾，厲，勿用有攸往) 꼬리가 달아난다. 괴로우나 갈바가있음을 쓰지말라","六二：집지용황우지혁 막지승설(執之用黃牛之革，莫之勝說) 황소의 가죽을 씀을 잡는다. 승리를 기뻐하지 말아라","九三：계둔 유질려 축신첩길(系遯，有疾厲，畜臣妾吉) 달아남이 매이다. 신하와 시녀를 모으니 길하다.","九四：호둔군자길 소인비(好遯君子吉，小人否) 군자를 회피함을 좋아하니 길하다. 소인은 막힌다.","九五：가돈 정길(嘉遯，貞吉) 피하니 아름답다.  바르니 길하다.","上九：비돈 무불리(肥遯，无不利) 기름짐을 피한다. 이롭지않음이 없다."]},{"num":34,"name":"뇌천대장(雷天大壯)","sequence":"111100","symbol":"䷡","short_name":"대장(大壯)","ci":["대장(大壯) 이정(利貞)","初九：장우지 정흉 유부(壯于趾，征凶，有孚) 발이 씩씩하다. 먼길을 가나 흉하다.  믿음이 있다.","九二：정길(貞吉) 바르니 길하다.","九三：소인용장 군자용망 정려 저양촉번 리기각(小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角) 소인은 씩씩함을 쓴다. 군자는 속임을 쓴다. 바름에 힘쓴다. 숫향이 울타리에 닿았다. 그 뿔이 파리하다.","九四：정길회망 번결불리 장우대여지복(貞吉悔亡，藩決不羸，壯于大輿之輹) 바르니 길하나 잃음을 근심하다. 울타리가 터지니 괴로워하지않는다. 큰수레의 복토(伏兔)가 견고하다.","六五：상양우역 무회(喪羊于易，无悔) 바뀜에서 양을 잃다. 후회는없다.","上六：저양촉번 불능퇴 불능수 무유리 간즉길(羝羊觸藩，不能退，不能遂，无攸利，艱則吉) 숫양이 울타리에 닿았다. 물러날수없고 따를수도 없다. 이로운바가 없다. 어려운즉 길하다."]},{"num":35,"name":"화지진(火地晉)","sequence":"000101","symbol":"䷢","short_name":"진(晉)","ci":["진(晉)  강후용사마번서 획일삼접(康侯用錫馬蕃庶，晝日三接)","初六：진여 최여 정길 망부 유무구(晉如，摧如，貞吉。罔孚，裕无咎) 나아가는것같고 물러나는것같다. 바르니 길하다. 믿음을 엮는다. 넉넉하니 허물이없다.","六二：진여 추여 정길 수자개복 우기왕모(晉如，愁如，貞吉。受茲介福，于其王母) 억누르는것같고 괴롭히는것같다. 바르니 길하다.  그 왕모(王母)로부터 복(福) 사이에 끼여 더욱 받는다.","六三：중윤 회무(衆允，悔亡) 군신들이 미쁘다. 후회는 없다.","九四：진여석서 정려(晉如鼫鼠，貞厲) 사이에 끼임이 바위다람쥐같다.  바름이 괴롭다.","六五：회망 실득물휼 왕길무불리(悔亡，失得勿恤，往吉无不利) 잊음을 후회한다. 잃기도 하고 얻기도 하니 불쌍히 여기지말라 가는것이 이롭지않음이 없으니 길하다.","上九：진기각 유용용벌읍 려길무구 정린(晉其角，維用伐邑，厲吉无咎，貞吝) 그뿔를 억누른다. 오직 읍을침략함을 행한다. 힘쓰니 길하다. 허물이없다. 바르나 인색하다."]},{"num":36,"name":"지화명이(地火明夷)","sequence":"101000","symbol":"䷣","short_name":"명이(明夷)","ci":["명이 이간정(明夷  利艱貞)","初九：명이우비 수기익 군자우행 삼일불식 유유왕 주인유언(明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言) 날아오름에서 명이이다. 그날개를 드리운다. 행함에서 군자이다. 삼일동안 먹지않는다. 갈바가있다. 주인이 약속한다.","六二：명이(明夷) 이우좌고 용증마장 길(明夷，夷于左股，用拯馬壯，吉) 명이, 왼족 넓적다리에서 온화하다. 말이 씩식함을 도움을 행하다. 길하다.","九三：명이우남수 득기대수 불가질정(明夷于南狩，得其大首，不可疾貞) 명이(明夷)가 남쪽 임지(任地)에 있다.  그 큰머리를 얻다. 바름이 병일수없다.","六四：입우조복 획명이지심 출우문정(入于左腹，獲明夷之心，出于門庭) 왼쪽 배에 들어간다. 명이의 마음을 얻다. 문뜰에 나간다.","六五：기자지명이 이정(箕子之明夷，利貞) 기자(箕子)의 명이(明夷)이다. 바르니이롭다.","上六：불명회 초등우천 후입우지(不明晦，初登于天，后入于地) 그믐이 밝지않다. 처음 하늘에 오른다. 뒤에 땅에 들어간다."]},{"num":37,"name":"풍화가인(風火家人)","sequence":"101011","symbol":"䷤","short_name":"가인(家人)","ci":["가인 이여정(家人  利女貞)","初九：한유가 회망(閑有家，悔亡) 집에 있으니 한가롭다. 잊음을 후회한다.","六二：무유수 재중궤 정길(无攸遂，在中饋，貞吉) 따르는바가없다. 식사중에있다. 곧으니 길하다.","九三：가인엄효 회려길 부자희희 종린(家人嗃嗃，悔厲吉,婦子嘻嘻，終吝) 가인이 엄하고 큰소리로 외친다. 미워함을 후회하나 길하다. 부자가 화락하고 웃다. 끝은 인색하다.","六四：부가 대길(富家，大吉) 집이 부유하니 크게 길하다.","九五：왕격유가 물휼 길(王假有家，勿恤。吉) 왕이 집에 이르다. 근심하지말라 길하다.","上九：유부위여 종길(有孚威如，終吉) 믿음이 있으니 권세같다. 끝이 길하다."]},{"num":38,"name":"화택규(火澤睽)","sequence":"110101","symbol":"䷥","short_name":"규(睽)","ci":["규(睽)  소사길(小事吉)","初九：회망 상마물축 자복 견오인무구(悔亡，喪馬勿逐，自復,見惡人无咎) 잃음을 후회한다. 말을 잃으나 쫓지말라 스스로 돌아온다.  사람이 병들음을 보나 허물은 없다.","九二：우주우항 무구(遇主于巷，无咎) 문밖에서 주인을 만난다. 허물없다.","六三：견예예 기우체 기인천차의 무초유종(見輿曳，其牛掣，其人天且劓，无初有終) 수레를 끌어당김을 본다. 기소가 끈다. 그 사람이 묵형(墨刑)하고 또 의형(劓刑)한다. 시작은 없고 끝은 있다.","九四：계호 우원부 교부 려무구(睽孤，遇元夫，交孚，厲无咎) 부릅뜬 모양은 외롭다. 본디 저를 만난다. 믿음을 교제한다. 근심하나 허물은 없다.","六五：회망 궐종서부 왕하구(悔亡，厥宗噬膚，往何咎) 잃음을 뉘우친다. 그 제사에서 저민고기를 깨문다. 가니 어찌 잘못이겠는가?","上九：규호 견시부도 재귀일사 선장지호 후탈지호 비구혼구 왕우우즉길(睽孤， 見豕負涂，載鬼一車， 先張之弧，后說之弧，匪寇婚媾，往遇雨則吉) 반목하니 의지할데가없다. 진흙을 업은 돼지를 보다. 귀신을 한수레에 싣다. 먼저 활을 펼치고 뒤에 활을 벗는다. 도적이 혼사를 구한다. 가니 비를만난다. 즉 길하다."]},{"num":39,"name":"수산건(水山蹇)","sequence":"001010","symbol":"䷦","short_name":"건(蹇)","ci":["건(蹇) 이서남 불리동북 이견대인 정길(利西南，不利東北,利見大人，貞吉)","初六：왕건 래예(往蹇，來譽) 가는바가 굼뜨다. 명예가 온다.","六二：왕신건건 비궁지고(王臣蹇蹇，匪躬之故) 왕의 신하가 머무르고 교만하다. 몸의 연고가 아니다.","九三：완건 래반(往蹇,來反) 가서 고생한다. 되돌아온다.","六四：왕건래련(往蹇來連) 가서 머무르니 잇달아 온다.","九五：대건붕래(大蹇朋來) 크게 교만하니 무리가온다.","上六：왕건래석 길 이견대인(往蹇來碩，吉,利見大人) 가서 고생하니 차서온다. 길하다. 대인을 만나니 이롭다."]},{"num":40,"name":"뇌수해(雷水解)","sequence":"010100","symbol":"䷧","short_name":"해(解)","ci":["해(解)  이서남 무소왕 기래부길 유유왕 숙길(利西南，无所往，其來復吉。有攸往，夙吉)","初六：무구(无咎) 허물없다.","九二：전획삼호 득황시 정길(田獲三狐，得黃矢，貞吉) 전에서 세 마리 여우를 잡는다. 황(黃)화살을 얻는다. 바르니 길하다.","六三：부차승 치구질 정인(負且乘，致寇至，貞吝) 짐을 지고 또한 타니 도적이 이르러 덜렁대는 모양이다. 바르나 인색하다.","九四：해이무 붕지사부(解而拇，朋至斯孚) 엄지손가락을 핑계하나 친구가 이르러 믿음이 다한다.","六五：군자유유해 길 유부우소인(君子維有解，吉,有孚于小人) 군자는 풀어서 매니 길하다. 소인에게 믿음이 있다.","上六：공용석준 우고용지상 획지 무불리(公用射隼，于高墉之上，獲之，无不利) 공이 높은 담장 위에서 매를 맞힘을 행하고 그것을 잡으니 이롭지 않음이 없다."]},{"num":41,"name":"산택손(山澤損)","sequence":"110001","symbol":"䷨","short_name":"손(損)","ci":["손(損)   유부 원길 무구 가정 이유유왕 갈지용 이궤가용형(有孚，元吉，无咎，可貞，利有攸往。曷之用？二簋可用享)","初九：이사천왕 무구 작손지(已事遄往，无咎，酌損之) 이미 일이 빠르게 왔다. 허물이없다. 그것을 덜어 따른다.","九二：이정정흉 불손익지(利貞征凶，弗損益之) 나아가 흉한것을 바름으로 이롭게한다. 그것을 덜거나 더하지 않는다.","六三：삼인행 즉손일인 일인행 즉득기우(三人行，則損一人,一人行，則得其友) 세사람이 가면 한사람을 잃고 한사람이 가면 그 벗을 얻음이 있다.","六四：손기질 사천유희 무구(損其疾，使遄有喜，无咎) 그 병이 덜해지니 빠르게 기뻐진다. 허물이없다.","六五：혹익지 십붕지구불극위 원길(或益之，十朋之龜弗克違，元吉) 혹 그것을 더하면 열 무리의 거북이 균열함을 이기지못하니 본디 길하다.","上九：불손익지 무구 정길 이유유왕 득신무가(弗損益之，无咎，貞吉，利有攸往，得臣无家) 그것을 덜지도 더하지도 않는다. 허물이없다. 바르니 길하다. 갈바가있어 이롭다. 집이 없는 신하를 얻다."]},{"num":42,"name":"풍뢰익(風雷益)","sequence":"100011","symbol":"䷩","short_name":"익(益)","ci":["익(益) 이유유왕 이섭대천(利有攸往，利涉大川)","初九：이용위대작 원길 무구(利用為大作，元吉，无咎) 큰일을 하게함이 이롭다. 본디 길하고 허물이 없다.","六二：혹익지 십붕지구불극위 영정길 왕용형우제 길(或益之，十朋之龜弗克違，永貞吉。王用享于帝，吉) 혹 그것을 더하면 열마리의 거북이(등껍데기)가 균열을 이기지못한다. 길고바르니 길하다. 왕이 천제(天帝)에 형통하여 쓰니 길하다.","六三：익지용흉사 무구 유부중행 고공용규(益之用凶事，无咎。有孚中行，告公用圭) 그것을 더하여 쓰니 일이 흉하다. 허물은없다. 가운데로 가니 믿는바가있다. 공이 저울눈을 사용함을 고하다.","六四：중행 고공종 이용위의천국(中行，告公從。利用爲依遷國) 가운데로 가다. 공이 쫓음을 고하다. 그나라를 의지해 옮기니 이롭다.","九五：유부혜심 물문원길 유부혜아덕(有孚惠心，勿問元吉。有孚惠我德) 은혜를 믿는바가있다. 본디 길함을 묻지말라 내가베푼은혜를 믿는바가있다.","上九：막익지 혹격지 입심물항흉(莫益之，或擊之，立心勿恒凶) 그 더함이 없다. 혹 그것을 친다. 마음을 세우고 항상 근심하지 말라."]},{"num":43,"name":"택천쾌(澤天夬)","sequence":"111110","symbol":"䷪","short_name":"쾌(夬)","ci":["쾌(夬)  양우왕정 부호 유려 고자압 불리즉융 이유유왕(揚于王庭，孚號，有厲，告自邑，不利即戎，利有攸往)","初九：장우전지 왕불승위구(壯于前趾，往不勝爲咎) 앞터에서 씩씩하다. 이따금 허물이되 훌륭하지못하다.","九二：척호 막야유융 물휼(惕號，莫夜有戎，勿恤) 부름을 두려워하다. 조용한 밤에 오랑캐가 있다. 불쌍히 여기지말라.","九三：장우규 유흉 군자쾌쾌 독행우우 약유유온 무구(壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎) 광대뼈가 씩씩하다.  홀로 가다 비를 만난다. 젖었으나 따뜻함이 있다. 허물이 없다.","九四：둔무부 기행차차 견양회망 문언불신(臀无膚，其行次且。牽羊悔亡，聞言不信)","九五：현륙쾌쾌 중행무구(莧陸夬夬，中行无咎) 상륙(商陸)은 그 성질이 쾌히 하는바이다. 가운데를 가니 허물이없다.","上六：무호 종유흉(无號，終有凶) 부름이없다. 끝에 근심이 있다."]},{"num":44,"name":"천풍구(天風姤)","sequence":"011111","symbol":"䷫","short_name":"구(姤)","ci":["구(姤)  여장(女壯) 물용취녀(勿用取女)","初六：계우금니 정길 유유왕 견흉 리시지촉(系于金柅，貞吉，有攸往，見凶，羸豕踟躅) 수레바퀴 고동쇠에 매어놓다. 바르니길하다.  갈바가있으면 흉함을 본다. 파리한 돼지가 머뭇머뭇거린다.","九二：포유어 무구 불리빈(包有魚，无咎，不利賓) 물고기가 있어 포장한다. 허물이 없으나 물가는 이롭지 않다.","九三：둔무부 기행차저 려 무대구(臀无膚，其行次且，厲，无大咎) 볼기에 살이 없다. 그 행함에 또 머뭇거린다. 힘쓴다면 크게허물은 없다.","九四：포무어 기흉(包无魚，起凶) 포장한 물고기가 없다. 흉이 일어난다.","九五：이기포과 함장 유운자천(以杞包瓜，含章，有隕自天) 쟁기로 오이를 얻음는 본보기를 머금은바이다. 하늘에서 떨어진것이다.","上九：후기각 린무구(姤其角，吝无咎) 부딪쳐 만나니 인색하나 허물은 없다."]},{"num":45,"name":"택지췌(澤地萃)","sequence":"000110","symbol":"䷬","short_name":"췌(萃)","ci":["췌(萃)는 형(亨) 왕하유묘 이견대인 형 이정 용대생길 이유유왕(王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往)","初六：유부부종 내란내췌 약호일악위소 물휼왕무구(有孚不終，乃亂乃萃，若號一握為笑，勿恤，往无咎) 끝이아님을 믿는바가있다. 난리여도 모인다. 하나가 작다고 일컬어지고 웃겠으나  근심하지말라 갈바가 있음은 허물이 없겠다.","六二：인길무구 부내이용약(引吉，无咎，孚乃利用禴) 이끄니 길하고 허물이 없다. 약소를 알고 이로움을 믿는다.","六三：췌여차여 무유리 왕무구 소린(萃如，嗟如，无攸利，往无咎，小吝) 갑작스럽게 이르러 이로운바가없다. 갈바가있으니 허물은 없다. 약간은 인색하다.","九四：대길무구(大吉，无咎) 대길하고 무구하다.","九五：췌유위무구 비부원영정회망(萃有位，无咎。匪孚，元永貞，悔亡) 모이니 차례가있다. 허물없다. 믿지않는다. 본디 길고 바르다. 잊음을 후회한다.","上六：재자체이 무구(齎咨涕洟，无咎) 탄식하고탄식한다. 눈물 콧물이 흘른다. 허물이없다."]},{"num":46,"name":"지풍승(地風升)","sequence":"011000","symbol":"䷭","short_name":"승(升)","ci":["승(升) 원형(元亨)，용견대인(用見大人)，물휼(勿恤)，남정길(南征吉)","初六：윤승 대길(允升，大吉) 진실로 올라가는바는 크게 길하다.","九二：부내이용약 무구(孚乃利用禴，无咎) 믿는바 약소함을 씀이 이롭다. 허물없다.","九三：승허읍(升虛邑) 허한 읍에 나아가다.","六四：왕용형우기산 길 무구(王用亨于岐山，吉 无咎) 왕이 갈림길에 형통하여 쓴다. 길하고 허물없다.","六五：정길 승계(貞吉，升階) 바르고 길하다. 돌계단을 오른다.","上六：명승 이우불식지정(冥升，利于不息之貞) 날이 저물어도 오른다. 쉬지않는 곧음에서 이롭다."]},{"num":47,"name":"택수곤(澤水困)","sequence":"010110","symbol":"䷮","short_name":"곤(困)","ci":["곤(困)  형(亨)，정대인길 무구 유언불신(貞大人吉，无咎，有言不信)","初六：둔곤우주목 입우유곡 삼세불견(臀困于株木，入于幽谷，三歲不見) 엉덩이가 나무그루터기에 곤하다.  깊은 골짜기에 들어가 수년을 보지않는다.","九二：곤우주식 주불방래 이용형사 정흉 무구(困于酒食，朱紱方來，利用亨祀，征凶，无咎) 주식에 곤란하다. 주불(붉은색 제복)은 사방에서 찾아온다. 제사를 형통케 씀이 이롭다. 나아가면 흉하고 허물은없다.","六三：곤우석 거우질려 입우기궁 불견기처 흉(困于石，據于蒺藜，入于其宮，不見其妻，凶) 돌에 곤하다. 질려에 거한다. 그 집에 들어가 그 처를 만나지않는다. 흉이다.","九四：래서서 곤우금거 린 유종(來徐徐，困于金車，吝，有終) 서서히 오니  쇠수레에 곤하다. 인색하나 끝이 있다.","九五：의월 곤우적불 내서유설 이용제사(劓刖，困于赤紱，乃徐有說，利用祭祀) 코를 베고 발꿈치를 베는 형벌은 적불(붉은색 제복)에서 곤하다. 서서히 제사하니 제사를 쓰는 이로움있다.","上六：곤우갈류 우얼계 왈동회 유회 정길(困于葛藟，于臲甈，曰動悔。有悔，征吉) 칡덩쿨에서 곤하다. 위태하다. 왈, 움직임을 후회한다.  뉘우침이 있어  나아가면 길하다."]},{"num":48,"name":"수풍정(水風井)","sequence":"011010","symbol":"䷯","short_name":"정(井)","ci":["정(井)   개읍불개정 무상무득 왕래정 정흘 지역미상 유영기병 흉(改邑不改井，无喪无得，往來井。井汔，至亦未繘。井羸其瓶，凶)","初六：정니불식 구정무금(井泥不食，舊井无禽) 우물에 진흙이 있어 먹지않는다. 오래된 우물이 날짐승이 없다.","九二：정곡사부 옹폐루( 井谷射鮒，瓮敝漏) 우물계곡에서 붕어를 쏜다. 항아리가 깨져 물이 샌다.","九三：정설불식 위아별측 가용급 왕명 병수기복(井渫不食，為我民惻，可用汲，王明，并受其福) 먹지않는 우물을 준설한다. 내가 백성을 측은히여김이니 (이제) 물을 길을수있다. 왕이 밝으면  우물이 그 복을 받는다.","六四：정추 무구(井甃，无咎) 우물을 수리하니 허물이없다.","九五：정렬 한천식(井冽，寒泉食) 우물물이 맑으니 서늘한샘물을 먹는다.","上六：정수물막 유부무길(井收勿幕，有孚无吉) 물을 길으니 막지말라 믿음은 있으나 길함은 없다."]},{"num":49,"name":"택화혁(澤火革)","sequence":"101110","symbol":"䷰","short_name":"혁(革)","ci":["혁(革)  이일내부 원형 이정 회망(己日乃孚，元亨，利貞，悔亡)","初九：공용황우지혁(鞏用黃牛之革) 단단한 황소의 가죽을 사용한다.","六二：이일내혁지 정길 무구(已日乃革之，征吉，无咎) 그후얼마되지아니한 날에 그것을 고친다. 먼길로 나아가나 길하다. 허물없다.","九三：정흉 정려 혁언삼취 유부(征凶，貞厲，革言三就，有孚) 먼길로 나아가니 흉하다. 바름에 힘쓴다.  말을 고쳐 세번 취하니 믿는바가있다.","九四：회망 유부개명 길(悔亡，有孚改命，吉) 실망을 후회한다. 고친명령을 믿는바가있다. 길하다.","九五：대인호변 미점유부(大人虎變，未占有孚) 대인은 호랑이로 변한다. 아직 점하지않다 믿는바가 있다.","上六：군자표변 소인혁면 정흉 거정길(君子豹變，小人革面，征凶，居貞吉) 군자는 표범으로 변한다. 소인은 낯을 고친다. 먼길로 나아가니 흉하다. 거하고 바르니 길하다."]},{"num":50,"name":"화풍정(火風鼎)","sequence":"011101","symbol":"䷱","short_name":"정(鼎)","ci":["정(鼎)  원길 형(元吉，亨)","初六：정전지 이출부 득첩 이기자무구(鼎顛趾，利出否，得妾, 以其子无咎) 뒤집힌 솥발이다. 나가지않음이 이롭다. 첩을 얻으니 그아이로써 허물이없다.","九二：정유실 아구유질 불아능즉 길(鼎有實，我仇有疾，不我能即，吉) 솥이 실하다. 내짝은 지병이다. 내가할수있는바가 없는 즉 길하다.","九三：정이혁 기행색 치고불식 방우휴회 종길(鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉) 솥귀를 고치다. 그 행함이 막히다. 꿩이 기름지니 먹지않는다. 사방에서 비가오고 후회가 일그러진다. 끝이길하다.","九四：정절족 부공속 기형악 흉(鼎折足，覆公餗，其形渥，凶) 솥의발을 부러뜨리다. 다시 공이 죽을 쑤니 그형태가 두텁다 흉하다.","六五：정화이금현 이정(鼎黃耳金鉉，利貞) 솥의 귀와현이 황금이다. 바르니 이롭다.","上九：정옥현 대길 무불리(鼎玉鉉，大吉，无不利) 솥의 현이 옥이다. 크게길하다. 불리함이 없다."]},{"num":51,"name":"진위뢰(震爲雷)","sequence":"100100","symbol":"䷲","short_name":"진(震)","ci":["진(震)   형 진래색색 소은액액 진경백리 불상비창(亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯)","初九：진래색색 후소은액액 길(震來虩虩，后笑言啞啞，吉) 천둥이 치니 놀라고 두려워한다. 왕후의웃음은 화기애애 웃는다. 길하다.","六二：진래려 억상패 제우구릉 물축 칠일득(震來厲，億喪貝，躋于九陵，勿逐，七日得) 벼락이 빠르게온다.  아주 많이 재화를 잃는다. 구릉에 오르다. 쫓지말라 칠일후에야 얻는다.","六三：진소소 진행무생(震蘇蘇，震行无眚) 위세가 되살아난다. 우레가 행하니 흐림이없다.","九四：진수니(震遂泥) 우레는 진흙이 생장한다.","六五：진왕래려 억무상 유사(震往來厲，億无喪，有事) 우레가 빠르게 오고간다. 많은것을 잃음이 없다. 일이 있다.","上六：진색삭 시확확 정흉 진불우기궁 우기린 무구 혼구유언(震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎。婚媾有言) 진은 찾음이다. 쓸쓸함이다. 시는 두리번거림이다. 다급해하는모양이다. 먼길을 가는것은 흉하다. 진은 그몸이 크지않다. 그이웃이 광대하다. 허물없다. 혼구는 맹세의 말이 있다."]},{"num":52,"name":"간위산(艮爲山)","sequence":"001001","symbol":"䷳","short_name":"간(艮)","ci":["간(艮)은 간기배 불획기신 행기정 불견기인 무구(艮其背，不獲其身，行其庭，不見其人，无咎)","初六：간기지 무구 이영정(艮其趾，无咎，利永貞) 그 발이 견고하다. 허물없다. 길고 바르니 이롭다.","六二：간기비 불증기수 기심불쾌(艮其腓，不拯其隨，其心不快) 그 장딴지가  어긋난다.  그 발꿈치를 돕지못한다. 그 마음이 불쾌하다.","九三：간기한 렬기인 려훈심(艮其限，列其夤，厲薰心) 그 끝을 한정한다.  그 잇닿은바를 즐짓다. 향기로운 마음을 힘쓰다.","六四：간기신 무구(艮其身，无咎) 그 자신을 견고히하니 허물없다.","六五：간기보 언유서 회망(艮其輔，言有序，悔亡) 간은 그 돕는바이다.  말이 차례가 있다. 잃음이 없다.","上九：조은 길(敦艮，吉) 아로새긴 은이다. 길하다."]},{"num":53,"name":"풍산점(風山漸)","sequence":"001011","symbol":"䷴","short_name":"점(漸)","ci":["점(漸)  여귀길 이정 (女歸吉，利貞)","初六：홍점우간 소자려 유은 무구(鴻漸于干，小子厲，有言，无咎) 근본에서 점점 성하다. 어린이가 힘쓰니 화기애애하다.","六二：홍점우반 음식간간 길(鴻漸于磐，飲食衎衎，吉) 너럭바위에서 점점 성한다. 음식이 즐겁다. 길하다.","九三：홍점우륙 부정불복 귀잉불육 흉 이어구(鴻漸于陸，夫征不復，婦孕不育，凶,利御寇) 뭍에서 점점 넓어진다. 대저 먼길을 가니 돌아오지않는다. 여자가 분만하나 기르지못한다. 흉하다. 난리를 제어함이 이롭다.","六四：홍점우목 혹득기각 무구(鴻漸于木，或得其桷，无咎) 나무가 점점 크다. 혹 그 서까래를 얻는다. 허물없다.","九五：홍점우륙 부삼세불잉 종막지승 길(鴻漸于陵，婦三歲不孕，終莫之勝，吉) 뭍에서 점점 성한다. 여자가 삼년동안 잉태하지 않는다. 끝이없으니 이김에 도달한다. 길하다.","上九：홍점우규 기우가용위의 길(鴻漸于逵，其羽可用爲儀，吉) 길거리가 점점 넓어진다.  그 깃털이 의전에 쓰일수있다. 길하다."]},{"num":54,"name":"뇌택귀매(雷澤歸妹)","sequence":"110100","symbol":"䷵","short_name":"귀매(歸妹)","ci":["귀매 정흉 무유리(歸妹   征凶，无攸利)","初九：귀매이제 파능리 정길(歸妹以娣，跛能履，征吉) 손아래누이가 여자로 시집한다. 절룩거림을 겪을수있다. 가니 길하다.","九二：묘능시 이유인지정(眇能視，利幽人之貞) 보는 눈이 희미할수있다. 사람의 바름이 깊으니 이롭다.","六三：귀매이수 반귀이제(歸妹以須，反歸以娣) 시집간 여자가 결국 손아래누이로서 되돌아온다.","九四：귀매건기 지귀유시(歸妹愆期，遲歸有時) 귀매기약이 어그러지다. (귀매를) 지체하나 시간은 있다.","六五：제을귀매 기군지몌 불여기제지몌량 월궤망 길(帝乙歸妹，其君之袂，不如其娣之袂良，月几,望，吉) 제을이 누이를 돌려보낸다. 그 임금의 소매가 손아래누이의 소매가 좋은만 같지않다. 달의 왕성하니 바란다. 길하다.","上六：여승광무실 사규양무혈 무유리(女承筐无實，士刲羊无血，无攸利) 광주리에 열매가 없음을 여자가 잇는다. 남자가 흰양을 찌르나 붉은피가 없다. 이로운바가 없다."]},{"num":55,"name":"뇌화풍(雷火豐)","sequence":"101100","symbol":"䷶","short_name":"풍(豐)","ci":["풍(豐) 형 왕격지 물우 의일중 (亨。王假之，勿憂，宜日中)","初九：우기배주 수순무구 왕유상(遇其配主，雖旬无咎，往有尚) 그 걸맞은 주인을 만나니 비록 균일함이 허물이 없으나 가는것이 높임이있다.","六二：풍기부 일중견두 왕득의질 유부발약 길(豐其蔀，日中見斗，往得疑疾，有孚發若，吉) 그 덮개가 성하니 대낮에 북두칠성을 본다. 가는것이 괴로울까 의심을 얻는다. 믿는바가 이와같이 발한다. 길하다.","九三：풍기패 일중견매 절기우굉 무구(豐其沛，日中見昧，折其右肱，无咎) 만약 비가솓아짐이 성하면 대낮의 어두움을 본다. 그 오른팔뚝을 꺽는다. 허물없다.","九四：풍기부 일중견두 우기이주 길(豐其蔀，日中見斗，遇其夷主，吉) 그 덮게가 성하니 대낮에 북두칠성을 본다. 그 온화한 주인을 만난다. 길하다.","六五：래장 유경예 길(來章，有慶譽，吉) 드러나 온다. 경사로운 명예가 있다. 길하다.","上六：풍기악 부기가 규기호 격기무인 삼세불견 흉(豐其屋，蔀其家，窺其戶，闃其无人，三歲不見，凶) 그 휘장이 성하다. 그 집을 덮는다.   그 출입구를 엿본다.  그 사람이 없어 고요하다. 삼년을 보지않는다. 흉하다."]},{"num":56,"name":"화산려(火山旅)","sequence":"001101","symbol":"䷷","short_name":"려(旅)","ci":["여 소형 여정길(旅  小亨，旅貞吉)","初六：여쇄쇄 사기소취재(旅瑣瑣，斯其所取災) 무리가 자질구레하고 세분하다. 잠시 이미 재앙을 취하는 바이다.","六二：여즉차 회기자 득동복정(旅即次，懷其資，得童僕貞) 나그네는 머뭇거림이다. 그 도움을 따른다. 어린벗이 바름을 얻는다.","九三：려분기차 상기동복 정려(旅焚其次，喪其童僕，貞厲) 그 머무름을 불사르고  여행한다. 그 어린벗을 잃는다. 바르나 근심한다.","九四：려우처 득기자부 아심불쾌(旅于處，得其資斧，我心不快) 나그네가 처하니 그 돕는 도끼를 얻는다. 내마음이 불쾌하다.","六五：사치일시망 종이예명(射雉一矢亡，終以譽命) 꿩을 쏘니 화살한개를 잃는다. 명예로써 명이 끝난다.","上九：오분기소 려인선소후호도 상우우역 흉(鳥焚其巢，旅人先笑后號啕。喪牛于易，凶) 까마귀가 그 새집을 넘어뜨린다. 여인(旅人)이 먼저 웃고 뒤에 수다스럽게 떠든다. 바뀜에서 소를 잃는다. 흉하다."]},{"num":57,"name":"손위풍(巽爲風)","sequence":"011011","symbol":"䷸","short_name":"손(巽)","ci":["손 소형 이유왕 이견대인(巽  小亨，利攸往，利見大人)","初六：진퇴 이무인지정(進退，利,武人之貞) 진퇴는 이롭다. 무인의 바름이다.","九二：손재상하 용사무분약 길무구(巽在牀下，用史巫紛若，吉无咎) 손은 평상의아래에 있다. 무인이 역사를 행함은 번거로움같다. 길하고 허물이없다.","九三：빈손 린(頻巽，吝) 급히 공순하다. 인색하다.","六四：회무 전획삼품(悔亡，田獲三品) 후회가 없다. 전에서 삼품을 얻는다.","九五：정길회무 무불리 무초유종 선경삼일 후경삼일 길(貞吉悔亡，无不利。无初有終，先庚三日，后庚三日，吉) 바르고 길하다. 후회가 없다. 이롭지않은바가 없다. 처음은없고 끝은 있다. 삼일 먼저 바뀌고 삼일 뒤에 바뀐다. 길하다.","上九：손재상하 상기자부 정흉(巽在牀下，喪其資斧，貞凶) 평상아래에서 공순하다. 그 취한 도끼를 잃는다. 바르나 흉하다."]},{"num":58,"name":"태위택(兌爲澤)","sequence":"110110","symbol":"䷹","short_name":"태(兌)","ci":["태   형 이정(兌   亨，利貞)","初九：화태 길(和兌，吉) 어울려 기쁘니 길하다.","九二：부태 길 회무(孚兌，吉，悔亡) 통함을 믿는다. 길하다. 후회가 없다.","六三：래태 흉(來兌，凶) 오니 기쁘다. 흉하다.","九四：상태 미녕 개질유희(商兌，未寧，介疾有喜) 헤아리니 기쁘다. 아직 편안하지못하다. 빨리 사이에 드니 즐거움이 있다.","九五：부우박 유려(孚于剝，有厲) 벗김에서 믿는다. 힘씀이 있다.","上六：인태(引兌) 기쁨을 이끈다."]},{"num":59,"name":"풍수환(風水渙)","sequence":"010011","symbol":"䷺","short_name":"환(渙)","ci":["환(渙)   형 왕가유묘 이섭대천 이정(亨。王假有廟，利涉大川，利貞)","初六：용증마장 길(用拯馬壯，吉) 건장한 말을 취함을 쓴다. 길하다.","九二：환분기궤 회망(渙奔其机，悔亡) 그 책상을 급히 흐트린다. 잃음을 후회한다.","六三：환기궁 무회(渙其躬，无悔) 그 몸을 흐트리니 후회가 없다.","六四：환기군 원길 환유구 비이소아(渙其群，元吉。渙有丘，匪夷所思) 그 무리를 흐트리니 원래 길하다.  언던이있어 흩어진다. 비적이 생각하는바가있다.","九五：환한기대호 환왕거 무구(渙汗其大號，渙王居，无咎) 그 큰 부르짖음에 땀을 흘린다. 왕이 거함을 흐트린다. 허물없다.","上九：환기혈 거적출 무구(渙其血，去逖出，无咎) 그 피를 흘린다. 멀리 떠나가니 허물이 없다."]},{"num":60,"name":"수택절(水澤節)","sequence":"110010","symbol":"䷻","short_name":"절(節)","ci":["절(節) 형 고절부가정(亨。苦節不可貞)","初九：불출호정 무구(不出戶庭，无咎) 집뜰로 나아가지않는다. 허물없다.","九二：불출문정 흉(不出門庭，凶) 문뜰로 나아가지않는다. 흉하다.","六三：불절약 즉수약 무구(不節若，則嗟若，无咎) 절제하지않음같다. 즉 부끄러움같다. 허물없다.","六四：안절 형(安節，亨) 평안함을 절제한다. 형통하다.","九五：감절 길 왕유상(甘節，吉,往有尚) 만족함을 절제한다. 길하다. 가는바가 높다.","上六：고절 정흉 회망(苦節，貞凶，悔亡) 괴로움을 절제한다. 바르나 흉하다. 잃음을 후회한다."]},{"num":61,"name":"풍택중부(風澤中孚)","sequence":"110011","symbol":"䷼","short_name":"중부(中孚)","ci":["중부(中孚)   돈어길 이섭대천 이정(豚魚吉，利涉大川，利貞)","初九：우길 유타 불연(虞吉，有他, 不燕) 길함을 염려하다. 타인이있다. 편안하지않다.","九二：명학재음 기자화지 아유호작 오여이미지(鳴鶴在陰，其子和之，我有好爵，吾與爾靡之) 우는학이 그늘에 있다. 그 아이가 서로 응하여 간다. 내가 지위를 좋아함이 있다. 우리가 너와 더불어 가는것을 금지한다.","六三：득적 혹고혹파 혹읍혹가(得敵，或鼓或罷，或泣或歌) 적을 얻는다. 혹 휘두르고 혹 내치고 혹 울고 혹 노래부른다.","六四：월궤망 마필망 무구(月几望，馬匹亡，无咎) 달이 왕성하니 바란다. 말의 짝이 없다. 허물이없다.","九五：유부련여 무구(有孚攣如，无咎) 걸림같이 믿는바가있다. 허물없다.","上九：한음등우천 정흉(翰音登于天，貞凶) 깨끗하고 높은 소리가 하늘에 오른다. 바르나 흉하다."]},{"num":62,"name":"뇌산소과(雷山小過)","sequence":"001100","symbol":"䷽","short_name":"소과(小過)","ci":["소과(小過) 형 이정 가소사 불가대사 비조유지음 부의 상의하 대길 (亨，利貞，可小事，不可大事。飛鳥遺之音，不宜上宜下，大吉)","初六：비조이흉(飛鳥以凶) 새가 날아가니 흉하다.","六二：과기조 우기비 불급기군 우기신 무구(過其祖，遇其妣,不及其君，遇其臣,无咎) 지나는길에 할아버지를 들르니 우연히 그 할머니를 만난다. 그 임금과 함께하지않으니 그신하와 조우한다. 허물이없다.","九三：불과방지 종혹장지 흉(弗過防之，從或戕之，凶) 가서 필적하니 지나치지않다. 좇으니 촉 가서 죽인다. 흉하다.","九四：무구 불과우지 왕려필계 물용영정(无咎，弗過遇之。往厲必戒，勿用永貞) 허물이없다. 가서만나니 지나치지않다. 가서 힘쓰니 반드시 경계한다. 길게바르니 쓰지말라","六五：밀운불우 자아서교 공익취피재혈(密雲不雨，自我西郊，公弋取彼在穴) 구름이 밀집하나 비가 내리지않는다. 스스로내가 서쪽 들로간다. 공이 구멍에있는 상대를 빼앗아 취한다.","上六：불우과지 비조이지 흉 시위재생(弗遇過之，飛鳥離之，凶，是謂災眚) 지나쳐가니 만나지 못한다. 새가날아서 가니 헤어진다. 흉하다. 이것이 소위 재앙이다."]},{"num":63,"name":"수화기제(水火旣濟)","sequence":"101010","symbol":"䷾","short_name":"기제(旣濟)","ci":["기제(既濟)  형 소이정 초길종난(亨，小利貞，初吉終亂)","初九：예기륜 유기미 무구(曳其輪，濡其尾，无咎) 그 바퀴를 끌어당기니 그꼬리가 젖는다. 허물없다","六二：부상기불 물축 칠일득(婦喪其茀，勿逐，七日得) 부인이 그 머리꾸미개를 잃다. 쫓지마라. 칠일에 얻는다.","九三：고종벌귀방 삼년극지 소인물용(高宗伐鬼方，三年克之，小人勿用) 제사를 높이니 귀신을 사방에서 물리친다. 이김이 삼년간다. 소인은 쓰지마라","六四：수유의녀 종일계(繻有衣袽，終日戒) 명주옷이 해진다. 종일 경계한다.","九五：동린살우 불여서린지약제 실수기복(東鄰殺牛，不如西鄰之禴祭，實受其福) 동쪽이웃이 소를 죽이낟. 서쪽이웃의 봄제사같지않다. 실하니 그복을 받는다.","上六：유기수 려(濡其首，厲) 그머리를 감으니 염려한다."]},{"num":64,"name":"화수미제(火水未濟)","sequence":"010101","symbol":"䷿","short_name":"미제(未濟)","ci":["미제(未濟)  형 소호흘제 유기미 무유리( 亨。小狐汔濟，濡其尾，无攸利)","初六：유기미 린(濡其尾，吝) 그 꼬리가 젖는다. 곤란하다.","九二：예기륜 정길(曳其輪，貞吉) 그 바퀴를 끄니 바르고 길하다.","六三：미제 정흉 이섭대천(未濟，征凶，利涉大川) 아직 건너니 멀리 나가니 흉하다. 큰강을 건넘이 이롭다.","九四：정길 회망 진용벌귀방 삼년유상우대국(貞吉，悔亡，震用伐鬼方，三年有賞于大國) 바르니 길하다. 잊음을 후회한다. 위엄을 써서 사방의 귀신을 벌한다. 삼년있어야 대국에서 상준다.","六五：정길 무회 군자지광 유부 길(貞吉，无悔，君子之光，有孚，吉) 바르니길하다. 후회없다. 군자의 빛은 믿음에있다. 길하다.","上九：유부우음주 무구 유기수 유부실시(有孚于飲酒，无咎，濡其首，有孚失是) 음주에 믿음이있다. 허물없다. 그머리를 감으니 이것을 잃으나 믿음은 있다."]}],"lit_mode":"zhuxi7"};
const _EMBEDDED_HEX = {"111111":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/001.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 건(乾)은 강(剛)함이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 천지가 있고난 연후에 만물이 생겼도다. 천지간에 충만하게 채워지니 이것이 만물이다.**","text.tab3":"&0&\n**건위천(乾爲天): 건(乾) 원형이정(元亨利貞)**\n**대상 (大象): 하늘이 강전히 운행한다. 군자가 스스로 강인하기를 멈추지않는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 크도다 건원이여 만물의 본질로 시작한다. 이내 하늘을 통솔한다. 구름이 움직여 비를 내리고 기능이 형태를 결정한다.  끝나고 시작하는바를 크게 밝히고 육위가 때를 기다려 이룬다. 때에 타고 6룡이 하늘에서 논다. 건의 길은 변화이며 각각 성명을 바르게한다. 보전하고 합하여 크게 화합하니 이롭고 곧다. 머리가 여러 물질을 내고 만국이 다 안녕한다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九: 잠용물용(潛龍勿用) 용이 세상에 드러나지 않음은 쓰이지 않는 바가 있(기 때문이)다.\n\n##### 상왈: 양이 아래에 있는바이다.\n\n/1&\n\n&2&\n##### 九二: 견룡재전(見龍在田) , 이현대인(利見大人) 전(田)에 용이 드러난다.  대인을 뵈오니 이롭다.\n\n##### 상왈: 덕이 광대하게 베풀어진다.\n\n/2&\n\n&3&\n##### 九三: 군자종일건건 석척약려 무구(君子終日乾乾，夕惕若厲，无咎) 군자는 종일 힘쓴다， 힘씀에 끝마무리까지 염려한다. 허물이 없다.\n\n##### 상왈: 도는 계속해서 반복된다.\n\n/3&\n\n&4&\n##### 九四: 혹약재연 무구(或躍在淵，无咎) 혹 도약하더라도 연(淵)못이니 허물이 없다.\n\n##### 상왈: 나아감에 허물이 없다.\n\n/4&\n\n&5&\n##### 九五: 비룡재천(飛龍在天) 이견대인(利見大人) 뜻하는바를 펼친다. 대인을 만나니 이롭다.\n\n##### 상왈: 대인이 만드는바이다.\n\n/5&\n\n&6&\n##### 上九: 항룡유회(亢龍有悔) 항룡은 하늘과 더불어야하는 자신의 처지를 살피니 자신의 부족함을 뉘우친다.\n\n##### 상왈: 가득 차면 오래가지 못한다.\n\n/6&\n\n&7&\n##### 용구(用九) 현군룡무수(見羣龍無首) 길(吉) 양효(陽爻) 구(九)를 씀에，용의 무리를 만나 서로가 도우니，길하다.\n\n##### 상왈: 하늘의 덕은 머리가 될 수 없다.\n\n/7&\n\n\n#### 문언 (文言)\n\n문언왈: 원이라고하는것은 선한것의 우두머리다. 형이라고하는것은 아름다운바의 회통(會通)이다. 이로움이라고하는것은 옳은것들의 화합이다. 곧음이라고하는것은 일의 기틀인것이다. 군자는 인으로 몸을 삼아 인류를 보전함으로써 족하다. 아름다움을 이해하니 예에 합치하면 족하다. 사물을 이롭게하니 화합함에 족하다. 의가 바르면 일의 기틀이 곤고해짐으로 족하다. 군자의 행동거지는 이 4가지 덕이니 고로 왈, 건은 '원형이정(元亨利貞)이다'라고 한다. '잠룡물용'이란 무엇을 말하는가? 공자께서 말씀하시길, 용의 덕을 지니고도 숨어 있는 것이다. 세상에 휘둘리지 않고, 명예를 이루려 하지 않으며, 세상을 피해도 답답함이 없고, 인정받지 못해도 답답함이 없다. 즐거우면 행하고 근심스러우면 피하니, 확고하여 뽑을 수 없는 것이 잠룡이다. '견룡재전 이견대인'이란 무엇을 말하는가? 공자께서 말씀하시길, 용의 덕으로 정중한 자리에 있는 것이다. 평범한 말에도 신의가 있고, 평범한 행동에도 삼가며, 사특함을 막고 성실함을 보존하며, 세상을 선하게 하되 자랑하지 않고, 덕이 넓어 교화한다. '군자가 종일토록 건건하고 저녁에 두려워하여 위태로운 듯하니 허물이 없다'는 무엇을 말하는가? 공자께서 말씀하시길, 군자는 덕을 나아가게 하고 업을 닦는다. 충신은 덕을 나아가게 하는 바이고, 말을 닦고 성실을 세우는 것은 업에 거하는 바이다. '혹 뛰어올라 못에 있으니 허물이 없다'는 무엇을 말하는가? 공자께서 말씀하시길, 오르내림에 일정함이 없으나 사특함을 하는 것이 아니요, 나아가고 물러남에 항상함이 없으나 무리를 떠나는 것이 아니다. 군자가 덕을 나아가게 하고 업을 닦는 것은 때에 미치고자 함이니, 그러므로 허물이 없다. '나는 용이 하늘에 있으니 대인을 만남이 이롭다'는 무엇을 말하는가? 공자께서 말씀하시길, 같은 소리는 서로 응하고, 같은 기운은 서로 구한다. 물은 습한 곳으로 흐르고, 불은 마른 곳에 나아가며, 구름은 용을 따르고 바람은 범을 따른다. 성인이 일어나면 만물이 보게 되니, 하늘에 근본한 것은 위와 친하고 땅에 근본한 것은 아래와 친하니, 각각 그 종류를 따르는 것이다. '항룡유회'는 무엇을 말하는가? 공자께서 말씀하시길, 귀하나 자리가 없고, 높으나 백성이 없으며, 현인이 아래 자리에 있어 보필함이 없으니, 이에 움직이면 후회가 있다. 잠룡물용은 아래에 있음이요, 견룡재전은 때를 기다림이요, 종일건건은 일을 행함이요, 혹약재연은 스스로 시험함이요, 비룡재천은 위에서 다스림이요, 항룡유회는 궁극의 재앙이요, 건원용구는 천하를 다스림이다. 잠룡물용은 양기가 숨어 감춤이요, 견룡재전은 천하가 문명함이요, 종일건건은 때와 함께 행함이요, 혹약재연은 건도가 이에 변혁함이요, 비룡재천은 하늘의 덕에 자리함이요, 항룡유회는 때와 함께 극에 이름이요, 건원용구는 하늘의 법칙을 보임이다. 건원은 시작하여 형통함이요, 이정은 성정이요, 건이 시작하여 능히 아름다운 이로움으로 천하를 이롭게 하니, 이로움을 말하지 않음이 크도다. 크도다 건이여! 강건하고 중정하며 순수하고 정미하도다. 육효가 발휘하여 널리 정에 통하고, 때에 여섯 용을 타고 하늘을 다스리며, 구름이 행하고 비가 내려 천하가 평안하다. 군자는 덕을 이루어 행함이니, 날마다 볼 수 있는 행동이다. 잠(潛)이라는 말은 숨어 아직 나타나지 않음이요, 행하되 아직 이루지 못함이니, 이에 군자가 쓰지 않음이다. 군자는 배움으로 모으고, 물음으로 변별하며, 너그러움으로 거하고, 어짐으로 행한다. 역에서 말하길, 견룡재전 이견대인은 군자의 덕이다. 구삼은 중강(重剛)하나 중(中)에 있지 않아, 위로는 하늘에 있지 않고 아래로는 밭에 있지 않으니, 그러므로 건건하여 그 때에 따라 경계하니, 비록 위태로워도 허물이 없다. 구사는 중강하나 중에 있지 않아, 위로는 하늘에 있지 않고 아래로는 밭에 있지 않으며, 중간에도 사람의 자리에 있지 않으니, 그러므로 혹(或)이라 한다. 혹(或)이라는 것은 의심함이니, 그러므로 허물이 없다. 대저 대인이란 천지와 그 덕을 합하고, 일월과 그 밝음을 합하며, 사시와 그 질서를 합하고, 귀신과 그 길흉을 합한다. 하늘보다 앞서도 하늘이 어기지 않으며, 하늘을 따름에는 하늘의 때를 받드니, 하늘도 어기지 않거늘 하물며 사람이겠으며, 하물며 귀신이겠는가? 항(亢)이라는 말은 나아감을 알되 물러남을 모르고, 존재를 알되 멸망을 모르며, 얻음을 알되 잃음을 모름이다. 오직 성인만이 나아가고 물러나며 존재하고 멸망함을 알되 그 바름을 잃지 않는 자이니, 오직 성인만이 그러하다.\n\n#### 주석\n\n> 주역 하 계사 상 제3장 是故知幽明之故。原始反終，故知死生之說。이런까닭에 어둡고 밝음의 연고를 아는것이며 원시반종의 연유로 말미암아 사생(死生)의 (굴레를 넘어서) 기쁜 이치를 마주하게 되는것이다.\n\n> 貞(곧을 정)- 곧음은 바름이다. 마음이나 뜻이 흔들림 없이 바르다는것이다. 이것은 자신의 의지가 확고하다는것이 아니다. 나의 의지와 다른이의 의지가 서로 같은 방향을 향할수있다는것을 믿는다는 것이다. 이것은 다른이를 따른다는것이 아니다. 나 뿐만 아니라 누구나가 나아갈수있는 방향을 보고 그것을 믿는다는것이다. 그러기에 의지가 흔들림없이 바를수있다. 사람들을 도울수있는것이다. 이로써 곧음이 일의 기틀이 되는것이다라고 하는것이다.\n\n> 역의 의의는 하나에서 같은것의 양면성을 드러내어 이로써 계속해서 양면성을 보이는바로 다양성을 다시 드러낸다. 이어서 같으면서 다른 그리고 다르면서 (통하여) 같은 여러 다양성을 밝히고 인식하고자 하는것이다."},"000000":{"text.tab1":"#### 그림\n![로컬 이미지 출력(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/002.jpg)\n\n텍스트 및 이미지 출력 예시\n\n곤(坤)은원(元)하고형(亨)하니리(利)빈마지정(牝馬之貞)이라。\n\n(**)\n**곤(坤)은원(元)하고형(亨)하니리(利)빈마지정(牝馬之貞)이라。**\n\n（####）\n#### 곤(坤)은원(元)하고형(亨)하니리(利)빈마지정(牝馬之貞)이라。\n\n（#####）\n##### 곤(坤)은원(元)하고형(亨)하니리(利)빈마지정(牝馬之貞)이라。\n\n（•）\n• 一、곤(坤)은\n• 1. 원(元)하고형(亨)하니리(利)빈마지정(牝馬之貞)이라。\n\n（>）\n> 곤(坤)은원(元)하고형(亨)하니리(利)빈마지정(牝馬之貞)이라。\n\n[https://example.com](https://example.com)\n\n![온라인 이미지 출력 https://picsum.photos/1200/300](https://picsum.photos/1200/300)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 곤(坤)은 부드러움(柔)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 천지가 있고난 연후에 만물이 생겼도다. 천지간에 충만하게 채워지니 이것이 만물이다.**","text.tab3":"&0&\n**곤위지(坤爲地): 곤(坤)은 원형(元亨), 이빈마지정(利牝馬之貞) 군자유유왕(君子有攸往) 선미후득주리(先迷後得主利) 서남득붕(西南得朋) 동북상붕(東北喪朋) 안정길(安貞吉)**\n**대상 (大象): 땅의 형세가 곤이다. 군자는 덕을 두텁게 함으로써 사물을 시행한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 곤은 근원에서 비롯하여 이른것이니 만물이 성기고 생기는것을 돕는다. 이내 하늘을 따라 순응하고  곤이 너그러움을 만물에 실는다.  덕에 합치하니 경계의 끝이없고 드넓고 광대한 빛을 머금으니 사물의 성정이 형통한바로  감응한다 말을 내어 기르니 땅이 베푸는바요 땅의 행함은 무궁한다. 유순함은 곧으니 이롭고 군자는 행함에 이를 본받아 여유로이 행하니 유연하게 생각하는바이다. 시작은 미약하고 어리숙하나 끝은 순응함으로 마땅한바를 얻는다. 서남은 친구를 얻고 이내 동류와 함께 행하고 동북은 친구를 잃으나 끝내 마침으로 경사로운바가 있다. 곧음이 평안하니 길하다는것은 땅이 순응하는바가 무강하다는것이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六: 리상(履霜)，견빙지(堅冰至) 서리를 밟으나  얼음이 딱딱히 굳었다.\n\n##### 상왈: 서리를 밟으니 얼음이 굳었다는것은 음기가 한데 뭉치기 시작했다는것이다. 그도에 미치고 길들이면 얼어서 견고함에 이를는것이다.\n\n/1&\n\n&2&\n##### 六二: 직방대(直方大)，불습무불리(不習無不利) 곧고 떳떳한 바가 크니，배움이 없어도 불리하지 않다.\n\n##### 상왈: 육이의 움직임은 두루 곧바르다. 능하지 않아도 불리하지않다. 땅의 도는 빛인것이다.\n\n/2&\n\n&3&\n##### 六三: 함장가정(含章可貞) 혹종왕사(或從王事)，무성유종(無成有終) 절제하는 바로 바를 수 있다. 왕사를 쫓으나 이룸은 없고 끝은 있다.\n\n##### 상왈: 구별을 참고견디니 때를 기다려 발하면 곧을수있다.  혹여 큰일을 쫓으나 빛을 알면 훌륭한것이다.\n\n/3&\n\n&4&\n##### 六四: 괄낭(括囊)，무구무예(无咎无譽) 주머니를 동여메니 허물도 없고 명예도 없다.\n\n##### 상왈: 주머니를 동여메니 허물도 없고 명예도 없다. 삼가함으로 손해는 없다.\n\n/4&\n\n&5&\n##### 六五: 황상(黃裳),원길(元吉) 노랑색 치마는 길함의 근원이다.\n\n##### 상왈: 노랑색 치마는 길함의 근원이니 아름다움이 그안에 있는바이다.\n\n/5&\n\n&6&\n##### 上六: 용전어야(龍戰于野)，기혈현황(其血玄黃) 용은 하늘에 거하고  그 다툼으로 피는 땅이 받는다.\n\n##### 상왈: 용이 들판에서 싸우니 그 도가 궁한것이다.\n\n/6&\n\n&7&\n##### 용육(用六) 이영정(利永貞) 음효(陰爻) 육(六)을 씀에 이로움은 꾸준히 절제하기 때문이다.\n\n##### 상왈: 크게 마침으로써이다.\n\n/7&\n\n\n#### 문언 (文言)\n\n문언왈: 곤은 지극히 유하니 움직임에 강한바이다. 곤은 지극히 안정되니 덕이 사방이 이른다. 후에는 그 주요한바가 되니 항상 (떳떳한 바가) 있는것이다. 만물을 함양하여 빛나는바가 있다. 곤의 도는 그것이 순리에 순응하는것이기때문이다. 하늘에 응하여 때에 맞는다. 선을 쌓는 집안에는 반드시 경사의 여유가있는바인것이다. 선행을 행하지못하여 선이 쌓이지않으면 반드시 넘치는 재앙이 있는것이다. 신하가 윗사람을 시해하고 자식이 부모를 시해하는것이 어찌 하루아침의 연고이겠는가? 그 유래하는바가 점철되어 온것이 아니겠는가? 그 사연이 어제오늘의 일이 아닌것이다. 역왈, '서리를 밟으나 (이미) 그 굳음이 얼음처럼 단단함에 이르렀다'는것은 아마도 이를 (비유로써) 순화하여 말한것일것이다. 곧음은 그 바름이요, 모남은 그 옳음이다. 군자는 공경함으로써 안을 곧게 하고, 의로움으로써 밖을 방정하게 하나니, 공경함과 의로움이 서면 덕이 외롭지 않다. 곧고 방정하고 크니, 익히지 않아도 이롭지 않음이 없으니, 그 행하는 바를 의심치 않음이다. 음은 비록 아름다움이 있으나, 이를 머금고 임금의 일을 따르니 감히 공을 이루려 하지 않는다. 이는 지도(地道)이며, 처도(妻道)이며, 신도(臣道)이다. 지도는 스스로 이루는 것이 없고 대신 마침이 있을 뿐이다. 천지가 변화하면 초목이 번성하고, 천지가 닫히면 현인이 숨는다. 역에 '주머니를 묶어두면 허물도 없고 명예도 없다'고 하였으니, 대개 삼감을 말한 것이다. 군자는 중앙의 황색으로 이치에 통하고, 바른 위치에 거하여 몸을 지킨다. 아름다움이 그 안에 있어 사지에 통하고, 사업에서 발현되니, 아름다움의 지극함이다. 음이 양을 의심하면 반드시 싸우니, 양이 없는 것을 혐의함 때문이다. 그러므로 용이라고 칭한다. 오히려 그 무리에서 떠나지 못하였으므로 혈이라고 칭한다. 대저 현황이란 천지의 혼합이니, 하늘은 검고 땅은 누르다."},"100010":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/003.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 둔(屯)은 그 거함을 잃지않도록 지켜보는것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 고로 둔(屯)으로써 그것을 받는다. 둔은 찰 영인것이다. 둔은 사물의 처음 생겨나는바인것이다.**","text.tab3":"&0&\n**수뢰둔(水雷屯): 둔(屯)은  원형이정(元亨利貞) 물용유유왕(勿用有攸往) 이건후(利建侯)**\n**대상 (大象): 구름과 우뢰가 둔이니 군자가 벼리함의 일머리를 삼는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 둔은 강유가 처음 서로 사귀어 어지러이 생겨난것이다.  험난함중에 움직이고 크게 형통하여 바르다. 뇌우의 움직임으로 가득 채운다. 하늘이 어둑새벽에서 초목을 낸다. 제후를 세움이 마땅하나  (아직) 안녕하지못하다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九: 반환(磐桓) 이거정(利居貞) 이건후(利建侯) 머뭇거린다. 조신하게 거함이 이롭다. 대립(代立)이 이로움이 있다.\n\n##### 상왈: 비록 반석이 굳세어도  뜻이 바르게 행함이 중한바이다. 귀함으로써 천함에 아래에 처하니 크게 백성을 얻는바이다.\n\n/1&\n\n&2&\n##### 六二: 준여전여(屯如邅如) 승마반이(乘馬班如) 비구혼구(匪寇婚媾) 여자정부자(女子貞不字)십년내자(十年乃字) 둔(屯)은 어려움같다.  머뭇거림같다. 말을 타고 서성거린다. 도적이 아니면 혼사로 화친한다. 여자가 정(貞)하여 정(定)하지 않다가 십년 내에 정혼하다.\n\n##### 상왈: 육이의 어러움은 강함을 타는것이다. 오랜 세월이 지나도 늘 그러한바가 바뀔까 말까한다.\n\n/2&\n\n&3&\n##### 六三: 즉록무여(即鹿無虞) 유입어임중(惟入于林中) 군자기불여석(君子幾不如舍) 왕린(往吝) 사슴이 염려함이 없음은  산속에 오직 들어가 있음이다. 군가가 자세히 살펴 벌여놓지 않는다. 가는 바를 아낀다.\n\n##### 상왈: 사슴이 염려하지 않음은  날짐승이 따르는바이다. 군자가 집에 거하여 갈바가 궁색하다.\n\n/3&\n\n&4&\n##### 六四: 승마반이(乘馬班如) 구혼구왕(求婚媾往) 길무불리(吉無不利) 말을 타고 돌아온다. 혼사를 구하러 간다. 길하고 불리함이 없다.\n\n##### 상왈: 구해서 돌아오니 밝게 드러난다.\n\n/4&\n\n&5&\n##### 九五: 둔기고(屯其膏)소정길(小貞吉)대정흉(大貞凶) 둔은 장차 고약이다. 작은 것에서 길하고 큰 것에서 흉하다.\n\n##### 상왈: 그 살진 기름이 둔하니 아직 빛이 베풀기에 부족하다.\n\n/5&\n\n&6&\n##### 上六: 승마반이(乘馬班如) 읍혈련이(泣血漣如) 말을 타고 돌아온다. 피눈물을 흘린다.\n\n##### 상왈: 피눈물을 흘리듯이 어찌 길어지겠는가?\n\n/6&"},"010001":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/004.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 몽(蒙)은 어지러움속에서 드러남(著)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 생겨나면 반드시 그것이 (시작에서 어리니 이를) 몽(蒙)하다한다. 고로 몽으로써 그것을 받는다. 몽은 어두울 몽이다. 사물의 유치한바이다.**","text.tab3":"&0&\n**산수몽(山水蒙): 몽(蒙)은 형(亨)이다. 비아구동몽(匪我求童蒙) 동몽구아(童蒙求我)  초서고재삼독(初筮告再三瀆) 독즉불고(瀆則不告) 이정(利貞)**\n**대상 (大象): 산아래에서 샘물이 솟는다. 몽이다. 군자는 행함의 결과를 (성찰하여) 덕을 키운다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 몽은 산밑에 험함이 있는것이다. 험난하고 멈추었으니 몽이다. 몽은 형통한다. 형통함으로써 행한다. 때맞침인것이다. 내가 어린아이를 필요로하는것이 아니라 어린아이가 나를 필요로 하는것이다. 뜻이 서로 응한바이다. 처음 점이 고한바는 굳셈으로 중심이 있는것이다. 재차삼차 점치는것은 업신여기는것이다. 깔보면 (바르게)고할수없다. 더럽히고 업신여기는것은 어리석은바이다. (사리에)어두우나 바르게 키워나가면 거룩한 공덕을 이룰수있다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六: 발몽(發蒙)  ，이용형인(利用刑人)，용탈질곡(用說桎梏) 이왕린(以往吝) 사람이 모범을 따르게함이 이로운바는 교화이다. 마땅이 갈바를 어여삐여김에 법을 베푼다.\n\n##### 상왈: 사람이 모범을 따르게함이 이로운바가 바르게 드러난것이 법이다.\n\n/1&\n\n&2&\n##### 九二: 포몽길납부길자극가(包蒙吉，納婦吉，子克家) 아이를 감싸니 길하다. 아내를 받아들이니 길하다. 사람이 집을 다스린다.\n\n##### 상왈: 사람이 집안을 다스리는바는 강유를 절제한바이다.\n\n/2&\n\n&3&\n##### 六三: 물용취녀현금부불유궁무유리(勿用取女，見金夫，不有躬，无攸利) 여자는 취하는것이 아니다. 귀한사람을 맞이하는것이다. 스스로 하는바가 없으면 이로운바가 없다.\n\n##### 상왈: 여자는 취하는것이 아니다. 가지려고 한다면 순리에 어긋난다.\n\n/3&\n\n&4&\n##### 六四: 곤몽린(困蒙，吝) 어리석어 곤란하다. 주저한다.\n\n##### 상왈: 곤란하고 어리석음이여, 홀로 열매를 맺기란 요원한것이다.\n\n/4&\n\n&5&\n##### 六五: 동몽길(童蒙，吉) 어린아이와 같다 길하다.\n\n##### 상왈: 어린아이의 복됨은 바람처럼 순리에 순응하는것이다.\n\n/5&\n\n&6&\n##### 上九: 격몽불리위구이어구(擊蒙，不利為寇，利禦寇) (자신의)어리석은바를 맞딱뜨리다.  난리를 당하면 불리하나 제어하면 이롭다.\n\n##### 상왈: 난리를 당하면 불리하겠으나 (이또한) 제어하면 이로울수있다. 위아래가 서로 순응한다.\n\n/6&"},"111010":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/005.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 수(需) 나아가지않고 송(訟)은 친하지않는다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 유치한바는 (아직)양육을 공급받지못한바이다. 고로 양육함을 공급받는 수(需)로써 그것을 이어받는다. 공급받는것은 음식의 도인것이다.**","text.tab3":"&0&\n**수천수(水天需): 수(需)는  유부광형정길(有孚，光亨，貞吉) 이섭대천(利涉大川)**\n**대상 (大象): 구름이 하늘에 생겨남이 수이다. 군자는 음식연악으로 오는바를 윤택케할뿐이다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 쓰임은 그 마땅함이다. 수고로움이 따른다. 강건함으로 그 의를 삼으니 어긋나지 않는다. 곤궁하지 않는다. 주고받음의 쓰임은 문물의 아름다움을 믿는것이다. 바르니 형통하므로 길하다. 정중의 하늘의 높음에 위치한다. 큰강을 건너는바도 이롭다. 가는바 공이 있는것이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九: 수어교이용항무구(需于郊，利用恒，无咎) 공급은 경계에서 늘 이용되는바로 이롭다. 허물이없다.\n\n##### 상왈: 교외에서 서로 주고받음은  잘못된 행동인 바가  아니다. 늘 이것이  이롭다는것이 허물은 아니다. 아직 마땅한 바를 잃지 않았다.\n\n/1&\n\n&2&\n##### 九二: 수어사소유언종길(需于沙，小有言，終吉) 모래땅에서 주고받음은 말이 있으나 적고 끝은 길하다.\n\n##### 상왈: 물가에서 주고받음은 만연한 가운데 이른것이다. 비록 말이 적게는 있겠으나 끝내는 길하다.\n\n/2&\n\n&3&\n##### 九三: 수우니치구지(需于泥，致寇至) 진흙에서 주고받음은  난리(亂離)에 이른다.\n\n##### 상왈: 진흙탕에서 주고받음은 재앙이 다다른것이다. 내게 적이 이른것이다. 분함을 경계하면 패하지 않는다.\n\n/3&\n\n&4&\n##### 六四: 수어혈출자혈(需于血，出自穴) 다툼에서 주고받음은 스스로 안전한곳에서 나오는것이다.\n\n##### 상왈: 피를 흘리지 않으려면  듣고 응해줄수밖에 없다.\n\n/4&\n\n&5&\n##### 九五: 수어주식정길(需于酒食，貞吉) 주식에서 주고받음은 바르고 길하다.\n\n##### 상왈: 술과음식은 여러 지친 몸과 마음을 위로하고 평안히 한다.\n\n/5&\n\n&6&\n##### 上六: 입어혈유불속지객심인래경지종길(入于穴，有不速之客三人來，敬之終吉) 구멍으로 들어간다. 서두르지않는 손님3명이 올바가있다. 끝이 길함을 존중한다.\n\n##### 상왈: 로는 손님이 급하지 않으나 챙기는 바가 있으니 결국 길하다. 비록 마땅한 자리는 아니나 크게 잘못된것도 아니다.\n\n/6&"},"010111":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/006.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 수(需) 나아가지않고 송(訟)은 친하지않는다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): (음식의)먹을것에서는 반드시 (서로)다툼이 따른다. 이런까닭에 송사 송(訟)으로써 그것을 이어받는다.**","text.tab3":"&0&\n**천수송(天水訟): 송(訟)은 유부질척중길종흉(有孚，窒，惕，中吉，終凶) 이현대인불리섭대천(利見大人，不利涉大川)**\n**대상 (大象): 하늘이 물과 더불어 어긋나게 움직이는바가 송사이다. 군자는 일을 만들때 시초를 잘 살피지않을수없다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 송사는 위가 강하고 아래가 괴로워함이다. 위태로우나 능히 이를 튼튼히 할수있다. 송사인것이다. 송사에는 믿음이 있다. 막고 두려워하나 중심가운데에서 길하다. 강함이 오니 균형을 얻는것이다. 끝이 나쁘다는것은 송사가 제대로 이루어지지못함이다. 대인을 보아야 이롭다. 중정을 존중해야하는것이다. 큰강을 건넘에 물속 구덩이에 빠지니 이롭지않다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六: 불영소사 소유언 종길(不永所事，小有言，終吉) 일은 길지 않다. 말은 적다. 끝은 길하다.\n\n##### 상왈: 송사하는바가 길어지지않게 하는것은 일에 시간을 끌려고 하지 않음이다. 비록 간단한 말일지라도 그 판단을 분명케 할수있다.\n\n/1&\n\n&2&\n##### 九二: 불극송 귀이포 기읍인삼백호무생(不克訟，歸而逋，其邑人三百戶无眚) 송사를 참고견디지 않는다. 돌아오나 잡힌다. 그 마을사람 삼백호 인심을 얻으면 잘못됨은 없다.\n\n##### 상왈: 용납함을 참지못하고 돌이어 숨으려하나 붙잡힌다. 아래에서 위와 다투는것은 근심을 불러모으는것이다.\n\n/2&\n\n&3&\n##### 六三: 식구덕 정려 종길(食舊德，貞厲，終吉) 혹종왕사 무성(或從王事，无成) 음덕을 얻고 바름에 힘쓴다. 끝은 길하다. 혹 큰일을 쫓으려고하나 이루어지는것은 없다.\n\n##### 상왈: 옛것의 이로운바를 거저 얻으나 위를 따르므로 길하다.\n\n/3&\n\n&4&\n##### 九四: 불극송 복즉명유 안정길(不克訟，復即命渝，安貞吉) 송사를 참고견디지 않는다  다시 복귀하여 운명을 바꿀수있다.  평안하고 바르게하면 길하다.\n\n##### 상왈: 복귀하여 운명이 변한다.  평안하니 바르다 잃는것이 없다.\n\n/4&\n\n&5&\n##### 九五: 송 원길(訟，元吉) 송사가 바라는바는 근본은 길한것이다.\n\n##### 상왈: 송사는 본디 균형을 맞추려고하는바 길한것이다.\n\n/5&\n\n&6&\n##### 上九: 혹석지반대 종조삼치지(或錫之鞶帶，終朝三褫之) 혹 가죽주머니와 띠를 얻으면  여러번끝에 그것을 취한다.\n\n##### 상왈: 송사로나마 복종을 하게됨은 역시 존중이 부족한 탓이었다.\n\n/6&"},"010000":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/007.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 비(比)는 즐거움(樂)이다. 사(師)는 우려(憂)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 송사는 반드시 (편이 나뉘고 갈리어) 무리가 지어지니 뭇사람 사(師)로써 그것을 이어받는다. 사(師)는 뭇사람 무리들이다.**","text.tab3":"&0&\n**지수사(地水師): 사(師)는 정장인길(貞丈人吉)，무구(无咎)**\n**대상 (大象): 땅속에 물이 있다. 수인것이다. 군자가 백성을 포용함으로써 무르를 기른다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 뭇 사람들은 곧고 바른것이다. 무리로써 바르게 할수있다면 우두머리인것이다. 강한 가운데 응한다. 힘써 행하니 순응한다. 이로써 천하를 근심하니 백성이 그것을 따른다. 길하며 또한 어찌 허물이겠는가?**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六: 사출이율 부장 흉(師出以律，否臧，凶) 마땅한바를 갖추어 출사(出師)한다.  어짊이 아니면 흉하다.\n\n##### 상왈: 무리가 규율로 나아가나 규율을 잃는다. 흉한것이다.\n\n/1&\n\n&2&\n##### 九二: 재사중길 무구 왕삼석명(在師中吉，无咎,王三錫命) 사(師)가 길함중에 있으니 허물이없다.  왕이 신뢰함을 세번 보인다.\n\n##### 상왈: 무리가 길함가운데 있으니 하늘이 사랑하는이를 구원한다. 우두머리가 명을 내니 만방을 달랜다.\n\n/2&\n\n&3&\n##### 六三: 사역여시 흉(師或輿尸，凶) 사(師)에게 있어 혹여나 주검수레는 흉하다.\n\n##### 상왈: 출사는 혹 주검수렘와 같으니 대개 큰공을 바라지않는다.\n\n/3&\n\n&4&\n##### 六四: 사좌차 무구(師左次，无咎) 사(師)가 좌(左)를 차(次)로 하는바를 안다. 허물이 없다.\n\n##### 상왈: 왼쪽은 아직 쓰이지않은바이다. 명을 기다리니 아직 마땅한바를 잃지않았다.\n\n/4&\n\n&5&\n##### 六五: 전유금 이집언 무구(田有禽，利執言，无咎) 장자사사 제자여시 정흉(長子帥師，弟子輿尸，貞凶) 전(田)에있는 날짐승을 조심히 잡으니 이롭다. 장자는 군사를 거느리고 아우는 주검수레를 끄니 (이러한)바름은 흉하다(한다)\n\n##### 상왈: 장자는 군사를 거느린다는것은 균형 가운데 행하는바이다. 아우는 주검수레를 끈다는것은  부당함을 당한다는것이다.\n\n/5&\n\n&6&\n##### 上六: 대군유명 개국승가 소인물용(大君有命，開國承家，小人勿用) 큰 임금은 (하늘의)명을  받아 나라를 열고 가업을 승계한다.  소인을 이러한 바를 쓸줄모른다.\n\n##### 상왈: 큰자는 명을 바르게 살펴서 공을 이룬다.  소인을 쓰지말라는것은 반드시 나라에 우환이 생기기때문이다.\n\n/6&"},"000010":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/008.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 비(比)는 즐거움(樂)이다. 사(師)는 우려(憂)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 무리들은 반드시 서로 비교하여 견주니 이런까닭에 그것을 비(比)로써 받는다. 비는 견줄 비이다.**","text.tab3":"&0&\n**수지비(水地比): 비(比)는  길(吉)하다.  원서원영정 무구(原筮元永貞，无咎) 불녕방래 후부흉(不寧方來，後夫凶)**\n**대상 (大象): 땅위에 물이 있다. 비는 선왕이 여러나라를 건설함으로써 제후를 봉한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 비는 길한것이다. 맞는다는것은 돕는바이다. 아래가 순종하는것이다. 원래 점서는 본디 영원토록 곧다. 허물이 없다. 강건함으로 가운데 있는것이다. 사방에서 도래하여 평안하지않으면  상하가 응하는것이다. 후에는 그 도가 궁색해진다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六: 유부 비지 무구(有孚，比之，无咎) 유부영관 종래유타 길(有孚盈缶，終來有它，吉) 비교하는바로 믿음을 둔다면 허물이 없다.  충만한 믿음이  종래에는 그것에서 길함이 있다.\n\n##### 상왈: 초육과 그것을 비교하니 다름이 있어 길한것이다.\n\n/1&\n\n&2&\n##### 六二: 비지자내 정길(比之自內，貞吉) 그것을 비교하여 스스로 추스리니 바르고 길하다.\n\n##### 상왈: 그것을 비교하여 자성한다. 스스로 잃는바는 없게할수있다.\n\n/2&\n\n&3&\n##### 六三: 비지비인(比之匪人) 견줌에는 인정이 없다.\n\n##### 상왈: 비교하는바는 사람의 길로서 온전한것은 아니다. 따라서 역시 상처를 받을수밖에 없지않겠는가?\n\n/3&\n\n&4&\n##### 六四: 외비지 정길(外比之，貞吉) (행실이) 드러남을 고르게하니 바르고 길하다.\n\n##### 상왈: 현명함에서 객관적으로 비교하니 질서를 세우는것이다.\n\n/4&\n\n&5&\n##### 九五: 현비 왕용삼구실전금읍인불성 길(顯比, 王用三驅 失前禽 邑人不誡，吉) 비교하여 분명히 하니  왕이 쓰는바요, 사방중에 세방향에서 몰아갈때 앞에서 날아오는 날짐승은 놓아주어도  마을 사람은 (의심하여)경계하지않으니 길하다.\n\n##### 상왈: 비교하여 길함이 드러나니 정중에 위치한다. 역행을 버리고 순응을 선택하니 마주친 짐승은 잡지않는다. 읍인이 경계하지않고 위계가 균형을 맞춘다.\n\n/5&\n\n&6&\n##### 上六: 비지무수 흉(比之无首，凶) 두서없이 그것을 비교하는것은 흉이다.\n\n##### 상왈: 일머리없는바를 비교하니 끝나는곳이 없다.\n\n/6&"},"111011":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/009.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 소축(小畜)은 적고 리(履)는 처하지않는다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 견줌에는 반드시 축적하는바가 있다. 이런까닭에 작은 축적인 소축(小畜)으로써 그것을 이어받는다.**","text.tab3":"&0&\n**풍천소축(風天小畜): 소축(小畜)은 형(亨)하다. 밀운불우 자아서교(密雲不雨，自我西郊)**\n**대상 (大象): 바람이 하늘위에서 움직인다. 소축은 군자가  글을 아름답게함으로 덕이 깊어지는것이다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 소축은 유연함이 위를 얻어 상하가 서로 응하는바이다. 소축은 강건한 바람이다. 강함이 그 중에 있이니 뜻이 행하여진다. 이내 형통한다. 구름은 빽빽하나 비는 없다는것은 마땅히 갈바인것이다. 나에게서 들녘은 서쪽이다. 아직 시행하지않았다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九: 복자도 하기구 길(復自道，何其咎，吉) 다시 제자리를 찾아가니 어찌 그것이 허물이겠는가? 길하다.\n\n##### 상왈: 계속해서 스스로 제 갈길을 찾는다. 그 의의가 길한것이다.\n\n/1&\n\n&2&\n##### 九二: 견복 길(牽復，吉) 다시 이끄니 길하다.\n\n##### 상왈: 그 중심에서 거듭 이끄니 역시 스스로 잃는바는 없다.\n\n/2&\n\n&3&\n##### 九三: 여탈폭 부처반목(輿說輻，夫妻反目) 수레가 바퀴를 벗으니 부부가 반목한다.\n\n##### 상왈: 부부가 반목함은 실로 집안을 바르게 할수없다.\n\n/3&\n\n&4&\n##### 六四: 유부 혈거척출 무구(有孚，血去惕出，无咎) 믿음으로 피가 제거되고 두려움이 사라진다. 허물이없다.\n\n##### 상왈: 사랑한다는것은 믿음이 있다는것이다. 위와 그 뜻이 화합한것이다.\n\n/4&\n\n&5&\n##### 九五: 유부거여 부이기린(有孚攣如，富以其鄰) 믿음이 매이다. 그 이웃으로써 가멸다.\n\n##### 상왈: 믿음으로 이어지니 홀로 부요하지않다.\n\n/5&\n\n&6&\n##### 上九: 이우기처 상덕재 부정려 월기망 군자정흉(既雨既處，尚德載，婦貞厲，月幾望，君子征凶) 이미 비가 곳곳에 내리니 덕을 기리기 시작하고 여자는 바름을 힘쓰며 몇달에 걸쳐 그 조짐을 살핀연후에 군자는 흉을 정벌한다.\n\n##### 상왈: 이미 비가 곳곳에 내리니 덕이 쌓인것이다. 군자는 흉한것을 싫어함은 의혹이 있는(바를 아는)것이다.\n\n/6&"},"110111":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/010.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 소축(小畜)은 적고 리(履)는 처하지않는다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 물질이 축적된 연후에 예(禮)가 있게된다. 이런까닭에 이(履)로써 그것을 이어받는다.**","text.tab3":"&0&\n**천택리(天澤履): 리(履)는 호미 부질인 형(虎尾，不咥人，亨)**\n**대상 (大象): 위는 하늘 아래는 연못이니 밟는다는것은 행실이다. 군자가 상하에 두루 미친다. 백성이 뜻을 펼쳐 안정된다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 이는 부드럽게 밟으니 강해진다는것이다. 기뻐하며 건에 응한다. 이것이 호랑이 꼬리를 밟는다는 것이다. 사람을 깨물지 않으니 형통이다. 강함이 균형을 지킨다. 제위에 오르나  고생하지않으니 밝게 빛나는것이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九: 소리 왕무구(素履, 往无咎) 본디 밟는바는 가는바이니 허물은 없다.\n\n##### 상왈: 꾸밈없이 신을 신는것은 가고자하는바가 있다는것이다. 홀로 가는것을 원하는것이다.\n\n/1&\n\n&2&\n##### 九二: 이도탄탄 유인정길(履道坦坦，幽人貞吉) 밟는 길이 탄탄하다.  유인(幽人)인 바르고 길하다.\n\n##### 상왈: 차분한 사람은 곧으니 길하다는것은 균형을 지켜 스스로 어지럽히지않는다는것이다.\n\n/2&\n\n&3&\n##### 六三: 묘능시 파능이 이호미 질인 흉(眇能視，跛能履，履虎尾，咥人，凶) 무인위어대군(武人為于大君) 외눈이라도 볼수있고 다리를 절어도 밟을수있다. 호랑이 꼬리를 밟으니 사람을 문다. 흉하다.  무인이 대군이 된다.\n\n##### 상왈: 외눈이라도 밝다고해서 족하지는않는다. 절름발이라도 더불어 간다고해서 족하지는않는다. 사람을 질타하는것이 흉하다는것은 위치가 부당하다는것이다. 무인이 대군에게 행하게하는바가 있다는것은 뜻이 강하다는것이다.\n\n/3&\n\n&4&\n##### 九四: 이호미 색색종길(履虎尾，愬愬終吉) 호랑이 꼬리를 밟으나 두렵고두려우니 끝은 길하다.\n\n##### 상왈: 하소연하니 끝내 길한것은 뜻이 행하여진것이다.\n\n/4&\n\n&5&\n##### 九五: 쾌리 정려(夬履，貞厲) 터놓고 밟는다. 바름을 힘쓴다.\n\n##### 상왈: 터놓고 밟는다. 바름을 힘쓴다. 자리가 정당한것이다.\n\n/5&\n\n&6&\n##### 上九: 시리고상 기선원길(視履考祥，其旋元吉) 밟은바를 참고하고 조짐을 살핀다. 그 돌이키는바가  길하다.\n\n##### 상왈: 위에서 크게 길하다. 큰 경사가 있다.\n\n/6&"},"111000":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/011.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 비(否)、태(泰)는 그 반대의 종류이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 이는 (바른)행실을 이루어 이는 (덕으로) 크게 된다. (덕이 깊고 넓게 펼쳐지면)이런 연후에 평안해진다. 이런까닭에 클 태(泰)로써 이것을 이어받는다. 태는 통(通)하는것이다.**","text.tab3":"&0&\n**지천태(地天泰): 태(泰)는  소왕대래 길형(小往大來，吉亨)**\n**대상 (大象): 천지의 사귐이 태이다.  천지의 도를 이룬연후에 재물을 둔다. 천지의 마땅한바로 좌우의 백성을 서로 돕는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 태는 작은바가 가고 큰바가 온다. 길하고 형통하다. 즉 천지가 서로 사귀어 만물이 통하는바이다. 상하가 서로사귀어 그 뜻이  같은것이다. 안은 양이고 밖은 음이다. 안은 강건하고 밖은 순하다. 안은 군자요 그 밖은 소인이다. 군자의 길은 길고 소인의 길은 소멸한다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九: 발모여이기휘 정길(拔茅茹以其彙征,吉) 띠풀을 뜨으니 그들이  뭉쳐있는바로 취해진다. 길하다.\n\n##### 상왈: 띠풀을 뽑는것같이 나아가니 길하다. 뜻이 밖에까지 미친다.\n\n/1&\n\n&2&\n##### 九二: 포황 용빙하 불하유붕망 득상우중행(包荒, 用馮河，不遐遺朋亡 得尚于中行) 거칢을 포용한다.  강을 건너는바가 있다.  머지않아 친구가 업신여김 당함을 따른다.  가운데에서 행함에 높임을 받는다.\n\n##### 상왈: 포황은 행하는중에 높임을 얻는다.  빛남이 크다.\n\n/2&\n\n&3&\n##### 九三: 무평불피 무왕불복 간정무구(无平不陂，无往不復，艱貞无咎) 물휼기부 우식유복(勿恤其孚，于食有福) 평평함이 없으면 기울일수가 없고 가지않으면 돌아올바가 없다. 어렵게 바르니 허물이 없다. 그 믿는바를 근심하지말라 먹음에 복이있다.\n\n##### 상왈: 가는것이 없으면 돌아올것도 없다. 천지가 만난다.\n\n/3&\n\n&4&\n##### 六四: 편편 불부이기린 불계이부(翩翩，不富以其鄰, 不戒以孚) 펄럭펄럭 나부낌은  그이웃으로 부유하지않음이니 믿음으로 경계하지않은바이다. 내심바란다.\n\n##### 상왈: 펄럭임은 부당함이다. 모두 실함을 잃는다.\n\n/4&\n\n&5&\n##### 六五: 제을귀매이사 원길(帝乙歸妹以祉，元吉) 제을은 하늘이 내리는 행복으로 누이를 시집보낸다.   본디 길하다.\n\n##### 상왈: 행복은 근본이 길하다. 원하는바를행함는중에있다.\n\n/5&\n\n&6&\n##### 上六: 성부우황 물용사 자읍고명 정린(城復于隍，勿用師，自邑告命，貞吝) 성은 해자로 겹겹이다. 군사를 쓰지않는다. 읍에 명을 고한다. 곧음이 인색하다.\n\n##### 상왈: 성은 해자(垓子)가 겹겹이다. 그 명이 어지럽다.\n\n/6&"},"000111":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/012.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 비(否)、태(泰)는 그 반대의 종류이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): (우선) 사물은 마침내 (막힘에 도달한다) 통할수없다. 이런까닭에 막힐 비(否)로 이어받는다.**","text.tab3":"&0&\n**천지비(天地否): 비(否)는  지비인 불리군자정 대왕소래(之匪人，不利君子貞，大往小來)**\n**대상 (大象): 천지가 서로 사귀지않음이 비(否)이다.  군자가 덕을 검소하여 어지러움을 피한다. 녹(禄)으로 성(盛)할수없다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 비지비인 불리군자정 대왕소래(否之匪人，不利君子貞，大往小來) 즉 천지가 서로 사귀지 않음이다.이어서 만물이 통하지 않음이다. 상하가 사귀지않고 천하가 나라가 없음이다. 안은 음, 밖은양이고, 안은 유하고 밖은 강하다. 안은 소인,밖은 군자이다. 소인의 도가 길어지고 군자의 도가 소멸한다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六: 발모여이기휘 정길형(拔茅茹以其彙，貞吉亨) 모여서 뭉친 덩어리진 띠풀을 뽑는다. 바르니 길하고 형통하다.\n\n##### 상왈: 띠풀을 뽑는다. 바르니 길하고 형통하다. 뜻이 군자에게있다.\n\n/1&\n\n&2&\n##### 六二: 포승 소인길 대인비형(包承，小人吉，大人否亨) 이어짐을 포용한다.  소인은 길하고 대인은 막히나 (장차) 형통한다.\n\n##### 상왈: 대인은 비이나 형한다. 무리를 어지럽히지안음이다.\n\n/2&\n\n&3&\n##### 六三: 포수(包羞) 부끄러움을 포용한다.\n\n##### 상왈: 포수는 위치가 마땅치않음이다.\n\n/3&\n\n&4&\n##### 九四: 유명 무구 주리지(有命，无咎，疇離祉) 생명을 보존하니 허물은 없다.  무리가 그 복에 달라붙는다.\n\n##### 상왈: (따를)명이 있으니 허물이 없다. 뜻을 행한다.\n\n/4&\n\n&5&\n##### 九五: 휴비 대인길 기망기망 계우포상(休否，大人吉。其亡其亡，繫于苞桑) 막힘도 쉬어간다. 대인이 길함이 어찌 망하겠는가 어찌망하겠는가.  뽕나무(잎)를 싸맨다.\n\n##### 상왈: 대인의 길함이다. 위가 마땅히 바르다.\n\n/5&\n\n&6&\n##### 上九: 경부 선부후희(傾否，先否後喜) 기울어짐이 그친다. 먼저가 막힘이고 나중이 즐거워짐이다.\n\n##### 상왈: 막힘이 종국인즉 기운다. 어찌 길게가겠는가?\n\n/6&"},"101111":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/013.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 동인(同人)은 친함(親)이고 대유(大有)는 무리이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): (그러나 이어서) 사물은 마침내 (통하게 된다) 막힐수없는것이다. 이런까닭에 그것을 동인(同人)으로 이어받는다.**","text.tab3":"&0&\n**천화동인(天火同人): 동인(同人) 우야 형 이섭대천 이군자정(于野，亨. 利涉大川，利君子貞)**\n**대상 (大象): 하늘이 불과 함께한다. 동인은 군자가 그 동류로 사물을 변별한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 동인은 유함이 위치를 잡고 중심을 얻는다. 그리고 건에 응한다. 왈 동인이다. 동인왈, 같은이가 들녘에 있다. 형통한다. 큰강을 건넘이 이롭다. 건이 행하는것이다. 문명이 튼튼함으로써 중심이 바르게 응한다. 군자의 바름인것이다. 오직 군자만이 천하의 뜻을 통하게할수있다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：동인우문 무구(同人于門，無咎) 문을 나서 동인을 만나다. 허물이 없다.\n\n##### 상왈: 문밖으로 나가 사람과 함께하니 또 누가 허물이겠는가?\n\n/1&\n\n&2&\n##### 六二：동인우종 린(同人于宗，吝) 유유상종하니 인색하다.\n\n##### 상왈: 홀로 응해 무리를 지킴은 대체로 같을 수없다. 그 들녘의 의를 잃는다. 이미 애석할수있다.\n\n/2&\n\n&3&\n##### 九三：복벌우장 승기고릉 삼세불여(伏戎于莽，升其高陵，三歲不興) 광활한 숲에 오랑캐가 숨어있으니  그 고지(高地)를 점한다. 여러해동안 일어남이없다.\n\n##### 상왈: 광활한 숲에 오랑캐가 숨어있으니 적이 강한것이다. 여러해동안 일어나지않는것은 안전하게 행하는것이다.\n\n/3&\n\n&4&\n##### 九四：승기고 불극 공길(乘其墉，弗克，攻吉) 담장을 넘으려고하나 이김을 근심한다. 공격하면 길하다.\n\n##### 상왈: 담장을 넘으려고한다는것은 의가 곤고해 이기지못한다는것이다. 그것이 길하다는것은 곤고한즉 그것을 뒤집는것이다.\n\n/4&\n\n&5&\n##### 九五：동인 선호도이후소 대사극상우(同人，先號啕而后笑。大師克相遇) 동인이  시작은 울부짖으나 뒤에는 웃는다.  큰 군사가 서로만나 다툰다.\n\n##### 상왈: 동인의 우선은 중심에서 곧은것이다.  대사가 서로 만나 서로  이김을 말한다.\n\n/5&\n\n&6&\n##### 上九：동인우교 무회(同人于郊，無悔) 동인이 밖에서 만난다. 후회가 없다.\n\n##### 상왈: 함께할것을 구하나 더불어 함께할이가 없다. 뜻이 어찌 얻어지겠는가?\n\n/6&"},"111101":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/014.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 동인(同人)은 친함(親)이고 대유(大有)는 무리이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사람들과 더불어 함께 모여서 뭉친 한 동아리가 되는것은 사물이 반드시 되돌아가는바인것이다. 이런까닭에 그것을 대유(大有)로써 이어받는다.**","text.tab3":"&0&\n**화천대유(火天大有): 대유(大有) 원형(元亨)**\n**대상 (大象): 불이 하늘위에 있다.  대유는 군자가 악을 다하게하고  선을 드러내는바이다. 천성을 바르게 이끌고 생명을 아름답게한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 대유는 부드러움이 존귀한 자리를 얻어 거대함의 중심을 이루니 상하가 (제자리에서)그것을 응함이다. 왈 대유이다. 그 덕이 강건하다. 글이 (사물을) 밝게 밝히니 때에 맞게 행함으로서 하늘에 응한다. 이것이 크게 형통하는바이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：무교해 비구 난즉무구(无交害，匪咎，艱則无咎) 서로 해가없다. 허물이 아니다. 어려워도 허물없다.\n\n##### 상왈: 대유의 초구는 서로 (해됨과)해함이 없다.\n\n/1&\n\n&2&\n##### 九二：대거이재 유유왕 무구(大車以載，有攸往，无咎) 큰수레에 적재한다. 갈바가있다. 허물이없다.\n\n##### 상왈: 큰수레에 실으니 쌓는중에 무너지지않는다.\n\n/2&\n\n&3&\n##### 九三：공용형우천자 소인불극(公用亨于天子，小人弗克) 공용은 천자에게 통한다. 소인은 그러하지 않다.\n\n##### 상왈: 공의 자리는 천자에게 통하여 쓰는바이다. 소인은 (감당치못하니) 해롭다.\n\n/3&\n\n&4&\n##### 九四：비기팽 무구(匪其彭，无咎) 그 팽팽함이 아니다. 허물이없다.\n\n##### 상왈: 그 (크게됨에 허함이 있는) 팽팽함이 아니다. 허물이 없다. 밝게 분별하여 밝힌다.\n\n/4&\n\n&5&\n##### 六五：궐부교여 위여 길(厥孚交如，威如,吉) 그믿음이 서로 사귐과 같다. 위엄이있다. 길하다.\n\n##### 상왈: 믿음이 일어나 서로 사귀는것같이  믿음은 뜻으로써 발한다. 그 길함이 세(勢)같다. 쉽게 되어지니 (더이상) 꾸밈이없는것이다.\n\n/5&\n\n&6&\n##### 上九：자천우지 길무불리(自天佑之，吉无不利) 하늘은 스스로 하는자를 돕는다.  길하고 이롭지않은바가없다.\n\n##### 상왈: 대유는 아주 길하다. 하늘이 저절로 그것을 돕는것이다.\n\n/6&"},"001000":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/015.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 겸(謙)은 가볍고 예(豫)는 게으르다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 큰바가 있다는것은 가득채울수없을 정도로 크다는것이다. 이런까닭에 겸허할 겸(謙)으로써 이어받는다.**","text.tab3":"&0&\n**지산겸(地山謙): 겸(謙) 형(亨) 군자유종(君子有終)**\n**대상 (大象): 땅에는 산이있다. 겸손함은 군자가 많은것을 덜어 적은것을 더한다. 저울이 균형을 찾는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 겸은 형통하니 천도가 (위에서)아래로 도우니 빛이 밝힘이요 땅의도는 (이에 맞추어 )낮추니  위가 행하여진다. 천도는  차고넘침을 덜어 겸손함을 더하고 땅의도는 차고넘침을 변하여 겸손함으로 흐르게한다.귀신은 차고넘침을 해하여 겸손함이 복되게하고 사람의 도는 차고넘침을 미워함으로 겸손함을 좋아한다. 겸손함은 존귀함으로 빛나고 낮추나 구차하지않으니 군자의 마무리이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六： 겸겸군자 용섭대천 길(謙謙君子，用涉大川，吉) 겸손하도다 군자여, 큰강을 건너니 길하다.\n\n##### 상왈: 군자가 겸손하고 또 겸손하니  (스스로) 낮추어 자신을 이끈다.\n\n/1&\n\n&2&\n##### 六二：명겸 정길(鳴謙，貞吉) 겸손함이 드러나니 바르고 길하다.\n\n##### 상왈: 겸손함이 울리니 바르고 길하다는것은 중심이 잡힌것이다.\n\n/2&\n\n&3&\n##### 九三：노겸군자 유종길(勞謙君子，有終吉) 힘써 겸손한 군자는 끝이있고 길하다.\n\n##### 상왈: 군자가 겸손함에 수고하니 만민이 탄복한다.\n\n/3&\n\n&4&\n##### 六四：무불리 위겸(无不利，撝謙) 이롭지않은바가없다. 겸손을 돕는바이다.\n\n##### 상왈: 겸손하여 자기를 낮추니 이롭지않은바가 없다.  이치가 틀림이 없다.\n\n/4&\n\n&5&\n##### 六五：불부 이기린 이용침벌 무불리(不富, 以其鄰 利用侵伐，无不利) 부유하지않다. 그 이웃과 더불어 침벌함이 이롭다. 이롭지않은바가없다.\n\n##### 상왈: 침벌함이 이롭다는것은  불복함을 정벌한다는것이다.\n\n/5&\n\n&6&\n##### 上六：명겸 이용행사 정읍국(鳴謙，利用行師，征邑國) 겸손함이 울리니  군사를 행함이 이롭다. 고을과 나라를 정벌한다.\n\n##### 상왈: 겸손함이 울려퍼지나 뜻을 아직 얻지못한것이다.(그러나 얻은연후에는) 군사를 행하여 나라들을 정복하는데 쓸수있다.\n\n/6&"},"000100":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/016.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 겸(謙)은 가볍고 예(豫)는 게으르다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 큰바가있으니 겸손히 허(虛)할수있다는것은 미리(豫) 안다는것이다.**","text.tab3":"&0&\n**뇌지예(雷地豫): 예(豫) 이건후행사(利建侯行師)**\n**대상 (大象): 우뢰가 치니 (이에) 땅이 진동한다. 예(의 본)이다. 선왕들이 음악을 지어 이로써 덕을 숭상하는(데 이를 도운)바이다. 성대한 음악으로 상제에게 (제사)올리는 바를 (참작하여) 견줌으로써 이를 살펴 본받았다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 예는 강이 응하여 그 뜻을 행한다. 순응은 움직임으로써 예측한다.  예측은 움직임으로써 순응한다. 고로 천지가 그와 같다. 그러므로 하물며 제후를 세우고 군사를 행함에있어서는 어떠하겠는가？ 천지가  순리대로 움직인다. 고로 일월이 (서로) 지나침이없고 사계절이 (서로) 어긋남이 없다. 성인이 순리대로 움직인다고 하는것은  거스르는것을 형벌로 다스리니 백성이 복종하는바이다. 그 때를 미리 살핌은 그 의의가 매우 크지않은가?**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：명예 흉(鳴豫，凶) 미리 우니 흉하다는것이다.\n\n##### 상왈: 초육은 미리우는바이니 뜻이 아직 궁한데서 흉할수있다.\n\n/1&\n\n&2&\n##### 六二：개우석 불종일 정길(介于石，不終日，貞吉) 돌사이에 끼니 하루가 끝나지 않는다. 바르면 길하다.\n\n##### 상왈: 하루가 끝나지 않으니 (아직 시간이 있다) 중심에서 바르고자하면 곧고길할것이다.\n\n/2&\n\n&3&\n##### 六三：우예 회 누유회(盱豫，悔。遲有悔) 처다보고나서 예상하니 후회한다. 늦음을 후회한다.\n\n##### 상왈: 미리 처다보니 후회가 있다. 위치가 부당한것이다.\n\n/3&\n\n&4&\n##### 九四：유예 대유득 물의 붕개마(由豫，大有得。勿疑。朋盍簪) 연유로 예측하니 크게 얻는바가있다. 의심하지 말라 친구가 속히 덮는다.\n\n##### 상왈: 이유가있어 예상한다. 크게 얻음이 있다. 뜻이 크게행하여진다.\n\n/4&\n\n&5&\n##### 六五：정질 항불사(貞疾，恆不死) 병에 곧으니  항시 죽지않는다.\n\n##### 상왈: 육오는 바름이 급박한것이다. 강하게 오른다. 늘 죽는것은 아니다. 중심을 아직 잃지않았다.\n\n/5&\n\n&6&\n##### 上六：명예 성유유 무구(冥豫，成有渝，无咎) 어둠속에서 예측하니 변화하는것을 완성한다. 허물이없다.\n\n##### 상왈: 예상이 불분명하니 어찌 위에있어 장구할수있는가?\n\n/6&"},"100110":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/017.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 수(隨)는 까닭없음(無故)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 미리 알면 반드시 따른다. 이런까닭에 따를 수(隨)로써 그것을 이어받는다.**","text.tab3":"&0&\n**택뢰수(澤雷隨): 수(隨)  원형 이정 무구(元亨，利貞，无咎)**\n**대상 (大象): 택(澤)중에 뢰가있다. 수는 군자가 날이 저뭄을 보고 평안히 쉼을 받아들인다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 수, 강함이 오고 아래는 유(柔)하다. 움직이니 즐거워한다. 수(隨)이다. 크게 형하고 정하다. (이롭기도하고 바르기도하니)허물은 없다. 천하의 때를 따르니 때의 쫓음의 의의가 크지아니한가?**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：관유유 정길 출문교이공(官有渝，貞吉。出門交有功) 기관은 변함이 있다. 바르면 길하다. 문을 나서 사귐에 공이있다.\n\n##### 상왈: 관은 대신 맡아서 다스리는것이다. 관은 변화에 응하는것이다. 바르게하니 길하다. 문밖을 나서 일을함이 있으니 공이 있다.\n\n/1&\n\n&2&\n##### 六二：계소자 실장부(系小子，失丈夫) 소자를 이으나 장부를 잃는다.\n\n##### 상왈: 아이에게 매여 장부의 일을 놓는다.\n\n/2&\n\n&3&\n##### 六三：계장부 실소자 수유구득 이거정(系丈夫，失小子。隨有求得，利居貞) 장부를 이으나 소자를 잃는다. 수는 얻음을 구하는 바이다.  거함이 바르면 이롭다.\n\n##### 상왈: 장부의 일을 쫓으니 아이를 돌보지못한다. 수는 구하여 얻음이다.  거함이 바르면 이롭다.\n\n/3&\n\n&4&\n##### 九四：수유획 정흉 유부재도 이명 하구(隨有獲，貞凶。有孚在道，以明，何咎) 수에 획득함이있다. 바르려고하나 근심이있다.  길이 밝으니 믿는바가있다. 어찌 허물이겠는가?\n\n##### 상왈: 따르고 이에 획득한다. 그 의가 흉하다.  그 도에 믿음이있어 공을 밝힌다.\n\n/4&\n\n&5&\n##### 九五：부우가(孚于嘉，吉) 아름다운바를 믿는다 길하다.\n\n##### 상왈: 아름다움에서 믿는다는것은  그 중심이 잡혀 균형을 이룬것이(아름답다는것이)다.\n\n/5&\n\n&6&\n##### 上六：구게지 내종유지 왕용형우서산(拘系之，乃從維之。王用亨于西山) 그것을 매고 구속하니 이내 유지하고 따른다. 왕이 서산에서 형통하여 쓰는바이다.\n\n##### 상왈: 그것을 매고 구속한다. 아주 궁하다.\n\n/6&"},"011001":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/018.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 충(蠱) 즉 신칙(申飭)한것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 기쁘게 사람을 따른다는것은 반드시 섬기는 일이 있다. 이런까닭에 곡식(穀食)벌레 충(蠱)으로써 그것을 이어받는다. 충은 섬기는바 (즉 일)이다.**","text.tab3":"&0&\n**산풍고(山風蠱): 고(蠱) 원형 이섭대천 선갑삼일 후갑삼일 (元亨，利涉大川。先甲三日，後甲三日)**\n**대상 (大象): 산아래로 바람이 있다 충이다. 군자는  백성를 구휼함으로써 그 덕성를 함양한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 충(蠱)은 강이 위에 유가 아래이다. 바람이 멈춤이다. 충이다. 충은 본디 형통하니 천하(의 질서)가 바로 잡히는것이다. 큰강을 건넘에 이롭다. 일이있어 가는것이다. '제도의 시행에 앞서 삼일 그리고 제도의 폐지에 뒤로 삼일(先甲三日，後甲三日)'은 종즉유시(終則有始), 끝남이 있는곳에 시작이 있다. 이것이 하늘의 행하는바이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：간부지고 유자고 무구 려종길(幹父之蠱，有子考，无咎，厲終吉) 아버지의 주된 일을 자식이 있어 살피니 허물이 없다. 힘써 끝이 길하다.\n\n##### 상왈: 아버지의 주된 일은 생각으로 생각을 구원하는것이다.\n\n/1&\n\n&2&\n##### 九二：간모지고 북가정(幹母之蠱，不可貞) 어머지의 주된 일은 바를수없다. (어렵다.)\n\n##### 상왈: 어머지의 주된 일은 중도(中道)를 얻는것이다.\n\n/2&\n\n&3&\n##### 九三：간부지고 소유회 무대구(幹父之蠱，小有悔，无大咎) 아버지의 주된 일은 작은 후회는 있으나 큰 허물은 없다.\n\n##### 상왈: 아버지의 주된 일은 끝내는 허물이 없다.\n\n/3&\n\n&4&\n##### 六四：예부지고 왕견인(裕父之蠱，往見吝) 관대한 아버지의 일은 가보면 소중하다.\n\n##### 상왈: 관대한 아버지의 일은 가나 얻지못한다.\n\n/4&\n\n&5&\n##### 六五：간부지고 용예(幹父之蠱，用譽) 아버지의 주된일은 명예를 씀이다.\n\n##### 상왈: 아버지의 주된일은 명예를 씀이다. 덕으로써 구원한다.\n\n/5&\n\n&6&\n##### 上九：불사왕후 고상기사(不事王侯，高尚其事) 왕후를 섬기지않는다. 그일이 높이어 높다.\n\n##### 상왈: 왕후를 섬기지않는다함은 그 의지가 본이 될수있다.\n\n/6&"},"110000":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/019.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 임(臨)은 의(義)를 살핌(觀)이니 혹은 함께하고 혹은 구하는것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 섬기는바가 있는것은 후에는 크게될수있다는것이다. 이런까닭에 그것을 임(臨)으로써 이어받는다. 임은 중히 여긴다는것이다.**","text.tab3":"&0&\n**지택임(地澤臨): 임(臨) 원형 이정(元亨，利貞) 지우팔월유흉(至于八月有凶)**\n**대상 (大象): 연못위에 땅이 있다. 임은 군자가 그 가르침을 생각하니 궁함이없다. 또한 백성을 보존함이 끝이없다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 임은 강이 나아가니 길어진다.  기쁘니 순응한다. 강한중에 응한다.  바름으로써 크게형통한다. 하늘의 도이다. 팔월에 이르러 흉함이 있다. 소멸하여 오래가지못한다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：함임 정길(咸臨，貞吉) 임을 온전케하니 바르고 길하다.\n\n##### 상왈: 임이 (감응하여)두루미치니  곧고 길하다. 뜻이 바르게 행하여진다.\n\n/1&\n\n&2&\n##### 九二：함임 길무불리(咸臨，吉无不利) 임함에 다하니 길하다. 이롭지않는바가 없다.\n\n##### 상왈: 임함에 다하니 길하다. 이롭지않는바가 없다. 아직은 명(命)에 순응은 아니다.\n\n/2&\n\n&3&\n##### 六三：감임 무유리 기우지 무구(甘臨，无攸利。既憂之，无咎) 괜찮게 임하다. 이로운바는 없다. 이미 그것이 근심이다. 허물은 없다.\n\n##### 상왈: 괜찮게 임하나 위치가 부당하니 이미 그것을 근심한다. 즉 오래지않아 허물이다.\n\n/3&\n\n&4&\n##### 六四：지임 무구(至臨，无咎) 지극히 임하다. 허물은 없다.\n\n##### 상왈: 임에 이르다. 허물이 없다.\n\n/4&\n\n&5&\n##### 六五：지임 대군지의 길(知臨，大君之宜，吉) 임함을 알다. 대군의 알맞은 바이다.  길하다.\n\n##### 상왈: 대군의 마땅함이다. 그 (균형)가운데에서 행함을 말한다.\n\n/5&\n\n&6&\n##### 上六：돈임 길무구(敦臨，吉无咎) 임함에 힘쓴다. 길하고 허물없다. 임함에 힘쓰니 길하다. 뜻이 안에 있다.\n\n/6&"},"000011":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/020.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 임(臨)은 의(義)를 살핌(觀)이니 혹은 함께하고 혹은 구하는것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물의 중히여기는바를 안 연후에라야 살필수있다. 이런까닭에 그것을 관(觀)으로써 이어받는다.**","text.tab3":"&0&\n**풍지관(風地觀): 관(觀)  관이부천 유부옹야(盥而不荐，有孚顒若)**\n**대상 (大象): 바람이 땅위에서 운행한다. 관이다. 선왕이 사방을 성찰함으로써 백성을 살피고 가르침을 베푼다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 위에 있는 큰 살핌이 순리로 흐르니 손인것이다. (균형의)중심은 천하를 살펴서 바르게한다. 관이다. 대야로 씻어 깨끗히할뿐 (이것저것) 늘어놓지 않는다.  엄숙히 믿는바가있는것이다. 아래로 살펴서 화합하는것이다. 하늘의 신기한 도를 살펴보니 사계절이 (한치의 오차도 없이) 어긋나지않고 운행한다.  성인은 신묘한 도로써 가르침을 베풀고 천하가 이를 따르는것이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：동관 소인무구 군자린(童觀，小人无咎，君子吝) 어린아이가 본다. 소인은 허물이없다. 군자는 곤란하다.\n\n##### 상왈: 초육은 어린아이의 살핌이다. 소인의 도이다.\n\n/1&\n\n&2&\n##### 六二：규친 이여정(窺觀，利女貞) 엿보다. 여자가 바르니 이롭다.\n\n##### 상왈: 곧은 여자를 엿보니 이는 추할수있다.\n\n/2&\n\n&3&\n##### 六三：관아생 진퇴(觀我生，進退) 내가 살아있음을 본다. 나아가고 물러난다.\n\n##### 상왈: 나는 누구인가? 과거와 미래를 살핀다. 아직 이치를 잃지않았다.\n\n/3&\n\n&4&\n##### 六四：관국지광 이용빈우왕(觀國之光，利用賓于王) 나라의 빛을 본다. 왕에게 손님이 있으니 이롭다.\n\n##### 상왈: 나라의 영광을 보게된다. 손님을 극진히한다.\n\n/4&\n\n&5&\n##### 九五：관아생 군자무구(觀我生，君子无咎) 내가 살아있음을 본다. 군자가 허물이없다.\n\n##### 상왈: 내가 인생을 살펴본다. 백성을 살펴보는것이다.\n\n/5&\n\n&6&\n##### 上九：관기생 군자무구(觀其生，君子无咎) 그것이 살아있음을 본다. 군자는 허물이 없다.\n\n##### 상왈: 그 삶을 바라보니 (후회의 땅에서)뜻이 아직 평탄하지않다.\n\n/6&"},"100101":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/021.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 서합(噬嗑)은 먹음이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 실필수있는 연후라야 합하는바를 볼수 있다. 이런까닭에 그것을 서합(噬嗑)으로써 이어받는다. 서합은 합하는바이다.**","text.tab3":"&0&\n**화뢰서합(火雷噬嗑): 서합(噬嗑)은  형(亨)하다. 이용옥(利用獄)**\n**대상 (大象): 뢰전은 서합이다. 선왕이 법으로 단단히 타일러서 경계하고 벌로서 (이를)밝힌다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 턱사이에 사물이 있다. 왈, 서합이다. 서합은 형통한다. 강유가 나뉜다. 움직이니 (자세히) 명료(明瞭)하게 드러난다. 뢰전이 합하여 비춤이 (밝힘으로 위엄이) 있다. (은밀한것을 드러낸다.)  부드러움이 중심을 얻어 위로 행한다. 비록 위치가 마땅하지 않으나  옥으로 사용함이 이로운바가있다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：구교멸지(屨校滅趾) 무구(無咎) 구교멸지(屨校滅趾) 무구(無咎) :족쇄로 발을 묶는다. 허물이 없다.\n\n##### 상왈: 족쇄로 발을 묶는다. (잘못될것을 미루어 알아) 행하지 않는다.\n\n/1&\n\n&2&\n##### 六二：서부멸비(噬膚滅鼻) 무구(無咎) 살갗을 깨물어 코가 다한다. 허물은 없다.\n\n##### 상왈: 코는 냄새를 맡고 입은 고기를 씹는다. (음식을 먹기전에는 코로 냄새를 맡아 입에 침을 돋군다.)  (차근차근)그 강한바를 기다린다.\n\n/2&\n\n&3&\n##### 六三：서랍육(噬臘肉) 우독소린(遇毒小吝) 무구(無咎) 납일(臘日)납육(臘肉)을 씹는다.  근심을 만나나 인색함은 적다. 허물은 없다.\n\n##### 상왈: 근심을 만나고 위치는 적당치 않다.\n\n/3&\n\n&4&\n##### 九四：서건자득금시(噬乾胏得金矢) 이간정(利艱貞)  길(吉) (뼈가 붙은)마른고기를 씹다가 황금화살을 얻는다.  올바름에 힘쓰니 이롭다. 길(吉)하다.\n\n##### 상왈: 바르고 길함으로 간신히 길하나 아직 빛을 발하지않는다.\n\n/4&\n\n&5&\n##### 六五：서건육득황금(噬乾肉得黃金) 정려무구(貞厲無咎) 마른 고기를 씹으니 황금을 얻는다. 올바름 , 곧음에 힘쓰니 허물은 없다.\n\n##### 상왈: 바름에 힘쓰니 허물은 없다. 마땅함을 얻는다.\n\n/5&\n\n&6&\n##### 上九：하교멸이(何校滅耳) 흉(凶) 차꼬에 메이니 귀가 다한다. 흉(凶)하다.\n\n##### 상왈: 형구가 귀를 막으니 어떠한가? 들어도 (제대로 알아)들을수없다.\n\n/6&"},"101001":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/022.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 분(賁)은 색이 없는것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 합할수있을뿐 하나로 되어질수는없는것이다. 이런까닭에 그것을 비(賁)으로써 이어받는다. 비는 꾸미는것이다.**","text.tab3":"&0&\n**산화비(山火賁): 분(賁)은 형(亨)  소리유유왕(小利有攸往)**\n**대상 (大象): 산아래에 물이 있다. 비이다. 군자가 여러 법을 밝힘으로써  감히 송사를 꾸짖지않는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 비(賁)는 형통하다. 부드러움이 와 강함을 꾸며준다.  고로 형통하다한다. 강함이 위에서 나뉘어 부드러움을 꾸며준다. 고로 갈바가있음이 작은 이로움이다. 강과유가 서로 교착한다. 이로써 밝게 비추어 꾸며 빛낸다. 사람이 글을 얻은바이다. 시시각각의 변화를 살피니 천문을 보인다. 천하가 이루어져 돌아감으로 인간의 문명을 보게된다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：분기지 사거이도(賁其趾，舍車而徒) 그 발이 날래다.  수레를 버리고 보행한다.\n\n##### 상왈: 수레를 버리고 보행한다. (걸어야하는 상황이라면) 어찌 마땅히 수레를 타려하겠는가?\n\n/1&\n\n&2&\n##### 六二：비기수(賁其須) 그 수염을 꾸민다.\n\n##### 상왈: 그 수염을 꾸민다. 위와 더불어 흥한다.\n\n/2&\n\n&3&\n##### 九三：비여수여 영정길(賁如濡如，永貞吉) 꾸미니 온화하다. 바름이 길하고 오래간다.\n\n##### 상왈: 장구히 바르니 길하다는것은 끝내는 (침범하지못하니) 그것이 보존되는것이다.\n\n/3&\n\n&4&\n##### 六四：비여파여 백마간여 비구혼구(賁如皤如，白馬翰如，匪寇婚媾) 희게 꾸미니 흰말의 털같다. 비적이 아니면 혼사로 화친한다.\n\n##### 상왈: 육사는 위치가 마땅한지 의심하는것이다.  비적이 아니면 혼사로 화친한다. 끝내 허물은 없다.\n\n/4&\n\n&5&\n##### 六五：비어구원 속면잔잔 린 종길(賁於丘園，束帛戔戔，吝，終吉) 무덤을 꾸민다. 비단묶음이 남는다. 인색하나 끝에는 길하다.\n\n##### 상왈: 육오의 길함이다. 기쁨이 있다.\n\n/5&\n\n&6&\n##### 上九：백비 무구(白賁，无咎) 깨끗하게 꾸민다. 허물이 없다.\n\n##### 상왈: 깨끗하게 꾸민다. 허물이 없다. 위가 그 뜻한바를 얻는것이다.\n\n/6&"},"000001":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/023.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 박(剝)은 빛남(爛)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 장식한 연후에라야 형통할수있으니 다한것이다. 고로 그것을 박(剝)으로써 받는다. 박은 깍이는것이다.**","text.tab3":"&0&\n**산지박(山地剝): 박(剝)   불리유유왕(不利有攸往)**\n**대상 (大象): 산이 땅위에 붙여진다. 박이다. 위가 아래를 후하게 하니 집안이 평한하다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 박은 (줄어드는)깍임이다. 유가 변하여 강이다. 갈바가있으면 이롭지않다. 소인이 장성하는바이다. 순순히 그것이 멈춘다.  군자는 소식영허(천지 시운이 변하고 바뀜)를 존중한다. 하늘의 운행(천지자연의 섭리)이기 때문이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：박상이족 무정흉(剝牀以足衊 貞凶) 평상다리를 깍아 업신여김이다. 곧으나 흉하다.\n\n##### 상왈: 평상다리를 깍아 업신여김은 아래를 능멸하는것이다.\n\n/1&\n\n&2&\n##### 六二：박상이변 멸정흉(剝牀以辨，衊貞凶) 평상을 바로잡으려 깍으니 업신여김이다. 곧으나 흉하다.\n\n##### 상왈: 평상을 바로잡으려 깍으니 (아직)업신여김이다. 아직 더불어함께함이없다.\n\n/2&\n\n&3&\n##### 六三：박지 무구(剝之，无咎) 그것을 깍으나 허물이없다.\n\n##### 상왈: 그것을 깍으나 허물이없다. 위아래가 떠난다.\n\n/3&\n\n&4&\n##### 六四：박상이부 흉(剝牀以膚，凶) 평상을 깍으니 속살이다. 흉하다.\n\n##### 상왈: 평상을 깍으니 속살이 드러난다. 재앙이 절박히 가깝다.\n\n/4&\n\n&5&\n##### 六五：관어 이궁인총 무불리(貫魚，以宮人寵，无不利) 물고기를 꿰다. 집사람들이 총애를 받는다. 불리함이없다.\n\n##### 상왈: 집사람들이 총애를 받는다. 끝내 허물이없다.\n\n/5&\n\n&6&\n##### 上九：석과불식 군자득여 소인박려(碩果不食，君子得輿，小人剝廬) 큰열매를 먹지않는다. 군자가 가마를 얻었다. 소인이 그집을 깍는다.\n\n##### 상왈: 군자가 가마를 얻으니 백성이 싣는바이다. 소인이 그것을 깍으니 끝내 쓸수가 없다.\n\n/6&"},"100000":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/024.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 복(復)은 반(反)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 끝내는 다할수없는것이다. 위가 궁하고 깍이면 반대로 아래로 되는것이다. 고로 그것을 복(復)으로써 받는다.**","text.tab3":"&0&\n**지뢰복(地雷復): 복(復) 형 출입무질 붕래무구 번복기도 칠일래부 이유유왕(亨。出入无疾，朋來无咎。反復其道，七日來復，利有攸往)**\n**대상 (大象): 뢰가 땅속에있다. 복은 선왕이 동지와 하지에 관문을 폐했다.  상인과나그네가다니지못한다. 살피지않아 장차 뒤로미룬다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 복은 형통하다. 강함이 오히려 움직임으로 순리로 행한다. 이것이 출입함에 서두르지않음이다. 친구가 오니 허물이없다. 그 길을 되돌아간다. 칠일이후로 회복한다. 하늘의 운행이다. 갈바가있으니 이롭다. 강함이 장구하다. 다시 돌아감이 복이니 그 천지의 본성을 보는도다!**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：불복원 무지회 원길(不復遠，无只悔，元吉) 멀어서 돌아가지않는다. 다만 후회가 없다. 본디 길하다.\n\n##### 상왈: 머지않아 돌이킨다. 수신함으로써이다.\n\n/1&\n\n&2&\n##### 六二：휴복 길(休復，吉) 돌아가다 쉰다. 길하다.\n\n##### 상왈: 휴복이 길한것은 밑에서부터 인한것이다.\n\n/2&\n\n&3&\n##### 六三：빈부 려무구(頻復，厲无咎) 급히 거듭한다. 힘쓰니 허물없다.\n\n##### 상왈: 급히 실천함의 힘씀은 의로우니 허물이없다.\n\n/3&\n\n&4&\n##### 六四：중행 독복(中行 獨復) 가운데간다. 홀로 돌아간다.\n\n##### 상왈: 한쪽으로 치우치지 않은 바른 행실을  홀로 돌아간다. (중)도를 쫓는것이다.\n\n/4&\n\n&5&\n##### 六五：조복 무회(敦復，无悔) 돌아감을 아로새기니 후회없다.\n\n##### 상왈: 되돌아보아 아로새긴다. 후회가 없다. 스스로를 삼가함으로써 (균형의)중심을 잃지않는다.\n\n/5&\n\n&6&\n##### 上六：미복 흉 유재생 용행사 종유대패 이기국군 흉 지우십년 불극정(迷復，凶，有災眚。用行師，終有大敗，以其國君，凶,至于十年，不克征) 갈길을 헤매니 흉하다. 재앙이다. 행군을 하나 끝내 대패한다. 그나라임금때문에 흉하다. 십년이 다가도록 정복하지못한다.\n\n##### 상왈: 되돌아가는것에서 헤매니 흉하다. 군자의 도에 반하는것이다.\n\n/6&"},"100111":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/025.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 무망은 재앙아닌재앙이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 되돌아가는것은 허망할것이다. 고로 무망으로써 그것을 받는다.**","text.tab3":"&0&\n**천뢰무망(天雷无妄): 무망(无妄)  원형 이정 기비정유구 불리유유왕 (元亨，利貞。其匪正有眚，不利有攸往)**\n**대상 (大象): 하늘아래에서 뢰가 행한다.  사물이 무망과 함께한다. 선왕이 때에 응하여 힘씀으로써  만물을 생육한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 무망은 강함이 스스로 밖에서부터 와서 안에서 주가 된다. 움직여서 강건하고 강함이 중심에서 응한다. 바름으로서 크게 형통함이다.  우주의 섭리인것이다. 그것이 바르지않으니 잘못이 있다. 갈바가 있어 이롭지않다. 우주의 섭리가 돕지않는데도 행하겠는가?**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：무망 왕길(无妄，往吉) 허망하지않다. 가는바가 길하다.\n\n##### 상왈: 가는바가 허망하지않으니 뜻을 얻는것이다.\n\n/1&\n\n&2&\n##### 六二：불경획 불치여 즉이유유왕(不耕獲，不菑畬，則利有攸往) 경작을 제대로않했으나 얻는바가있다. 개간을 제대로하지않았는데 새밭인바가있다. 즉 가는바가있으면 이롭다는것이다.\n\n##### 상왈: 얻는바를 경작하지 않으니 아직 부유하지않은것이다.\n\n/2&\n\n&3&\n##### 六三：무망지재 혹계지우 행인지득 읍인지재(无妄之災，或系之牛，行人之得，邑人之災) 무망의 재앙은 혹 소가 매여 엮임과 같다. 행인이 얻는바가 될수있고 읍인의 재앙인바가될수있다.\n\n##### 상왈: 행인이 소를 얻는다. (망실)한 읍인의 재앙이다.\n\n/3&\n\n&4&\n##### 九四：가정무구(可貞，无咎) 바를수있으면 허물이 없겠다.\n\n##### 상왈: 바를수있으면 허물이 없겠다. (정직은 최선의 방책이다.) 견고함이 거기에 있다.\n\n/4&\n\n&5&\n##### 九五：무망지질 물락유희(无妄之疾，勿藥有喜) 무망의 병은 기쁜바가 있으니 약하지않는다.\n\n##### 상왈: 무망의 약은 사용할수없는것이다.\n\n/5&\n\n&6&\n##### 上九：무망 행유생 무유리(无妄，行有眚 无攸利) 무망은 행함에  잘못될수있다. 이로운바없다.\n\n##### 상왈: 무망(無妄)의  궁극에는 망(妄)으로 통할수있으니 재앙인것이다.\n\n/6&"},"111001":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/026.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 대축(大畜)은 때(時)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 허무함이있은 연후에라야 (비로서 진정한것을) 축적할수있다. 고로 그것을 대축(大畜)으로 받는다.**","text.tab3":"&0&\n**산천대축(山天大畜): 대축(大畜)  이정 불가식길 이섭대천(利貞，不家食吉，利涉大川)**\n**대상 (大象): 하늘이 산중에 있다. 대축이다. 군자가 다식함으로써 말함에 앞서 행동으로 보인다.(또는 언행일치한다.) 그것을 쌓으니 덕이다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 대축은 강건하니 독실함이 그 빛을 발한다. 매일매일 그 덕을 새롭게 한다. 강이 위에 있어 현명함이 높여진다. 능히 그 강건함을 멈출수있다.  크게 바른바이다. 집에서 먹는것은 음식만이 아니다. 현명함도 키우는것이니 길하다. 큰강을 건넘이 이롭다.  하늘에 감응한다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：유려이이(有厲利已) 벌써 이로움을 염려하는바가 있다.\n\n##### 상왈: 미리 이로운바(와 해로운바)를 두루 살피니 재앙이 범접하기 어렵다.\n\n/1&\n\n&2&\n##### 九二：여탈복(輿說輹) 수레가 (차여와 차축의) 복토가 벗겨지다. (수레가 짐을 쌓아 실을수없으니 이를 나를수없다.)\n\n##### 상왈: 수레가 바퀴살의 수고로움을 헤아려 감사하니 허물이 그 곳에는 없다.\n\n/2&\n\n&3&\n##### 九三：양마축 이간정 왈한여위 이유유왕(良馬逐，利艱貞。曰閑輿衛，利有攸往) 좋은말이 쫓는다 어렵게바르니 이롭다. 왈,한가히 수레를 지킨다. 가는바가있어 이롭다.\n\n##### 상왈: 가는바가있어 이롭다는것은 위와 뜻이 맞은것이다.\n\n/3&\n\n&4&\n##### 六四：동시지곡 원길(童牛之牿，元吉) 어린돼지를 기르다.  원래 길하다.\n\n##### 상왈: 육사는 본디 길하다. 기쁜바가있다.\n\n/4&\n\n&5&\n##### 六五：분시지아 길(豶豕之牙，吉) 불깐돼지어금니 길하다.\n\n##### 상왈: 육오의 길함은 다행인바가있다.\n\n/5&\n\n&6&\n##### 上九：하천지구 형(何天之衢，亨) 잠시 하늘의 네거리이다. 형통하다.\n\n##### 상왈: 하늘의 사거리에 해당한다. (하늘의 때가 도우니)도가 크게 행해진다.\n\n/6&"},"100001":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/027.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 이(頤)는 바르게 크는것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물을 간직한 연후에라야 먹이고 기를수있다. 고로 그것을 턱 이(頤)로써 받느다. 턱은 먹이고 기르는것이다.**","text.tab3":"&0&\n**산뢰이(山雷頤): 이(頤)  정길 관이 자구구실 (貞吉。觀頤，自求口實)**\n**대상 (大象): 산밑에 뢰가 있다.  턱이다. 군자는 언어에 신실하니 음식을 절제한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 턱은 바르고 길하다. 바른것을 양육한즉 길한것이다. 턱을 본다. 그 양육하는바를 보는것이다. 스스로 입에 음식을 구한다. 그 스스로 양육함을 보는것이다. 천지가 만물을 양육하고 성인이 현자를 양육한다. 현자를 통해서 만민을 양육함이 미친다.  턱의 의(義)가 시의(時宜)함이 크도다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：석이령구 관아염이 흉(舍爾靈龜，觀我朵頤，凶) 그 영묘한 거북이를 벌여놓고 내가 턱을 늘어트림을 본다. 흉하다.\n\n##### 상왈: 내가 턱을 늘어트림을 본다. 역시 귀함이 부족한것이다.\n\n/1&\n\n&2&\n##### 六二：전이 불경 우구이 정흉(顛頤，拂經，于丘頤，征凶) 꺼꾸로 기르다. 언덕에서 기르니 도리를 거스른다. 멀리나가나 흉하다.\n\n##### 상왈: 육이는 정벌함이 흉하다. 행함이 동류(同類)를 잃은것이다.\n\n/2&\n\n&3&\n##### 六三：불이 정흉 십년물용 무유리(拂頤，貞凶，十年勿用，无攸利) 기름을 거스르니 바르더라도 흉하다. 십년동안 쓰지말라 이로운바가 없다.\n\n##### 상왈: 십여년이나 쓰지 못하니 도가 크게 어지럽다.\n\n/3&\n\n&4&\n##### 六四：전이길 호시탐탐 기욕축축 무구(顚頤吉，虎視眈眈，其欲逐逐，无咎) 꺼꾸로 기르나 이롭다. 호시탐탐 그것이 쫓을려고한다. 허물없다.\n\n##### 상왈: 턱이 서로에게 이르니 길하다. 위에서 빛이 (빛나니 두루)널리 퍼진다.\n\n/4&\n\n&5&\n##### 六五：불경 거정길 불가섭대천(拂經，居貞吉，不可涉大川) 경과하여 다다르니  거함에 바르면 길하다. 큰강을 건널수없다.\n\n##### 상왈: 거함에 바르니 길함은  위를 따르고 순응하는것이다.\n\n/5&\n\n&6&\n##### 上九：요이 려길 이섭대천(由頤，厲吉，利涉大川) 웃는얼굴의 턱모양, 힘써노력하면 길하다. 큰강을 건너니 이롭다.\n\n##### 상왈: 턱의 연유는 힘쓰는바로 길하니 크게 (힘쓸수록 큰) 경사가 있다.\n\n/6&"},"011110":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/028.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 대과(大過)는 엎드러짐(顛)이고 구(姤)는 짝하는것(遇)이니 유(柔)가 강(剛)을 맞이하는것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 먹이고 기르지않으면 움직일수없다. 고로 대과(大過)로써 그것을 받는다.**","text.tab3":"&0&\n**택풍대과(澤風大過): 대과(大過)  동요 이유유왕 형(棟橈，利有攸往，亨)**\n**대상 (大象): 연못이 나무들을 멸한다. 대과이다. 군자는 홀로 섬을 두려워않는다. 세상이 (모른체하고)회피해도 답답해하지않는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 대과는 큰것이 지나감이다. 마룻대가 굽는다. 본말이 약한것이다. 강함이 가운데를 지나간다. 바람이 다님을 기뻐한다. 갈바가 있으니 이롭다. 이내 형통한다. 대과는 의(義)의 시의(時宜)함이 크도다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：자용백모 무구(藉用白茅，无咎) 하얀띠풀로 깔개에 쓴다. 허물없다.\n\n##### 상왈: 하얀띠풀을 깔개로 쓴다.  유(柔)함이 아래에 있는것이다.\n\n/1&\n\n&2&\n##### 九二：고양생제 노부득기여처 무불리(枯楊生稊，老夫得其女妻，无不利) 시든 버드나무 돌피를 자라게한다. 늙은이가 그여첩을 얻는다. 이롭지않음이없다.\n\n##### 상왈: 노부와 여첩이 서로 함께하니 (분수에) 넘친다.\n\n/2&\n\n&3&\n##### 九三：동요 흉(棟橈，凶) 지붕 용마루가 구분다. 흉하다.\n\n##### 상왈: 마룻대가 구불어지면 (더이상) 이를 도울수없다.\n\n/3&\n\n&4&\n##### 九四：동륭 길 유타린(棟隆，吉。有它吝) 마룻대가 높다. 길하다. 다른 근심이 있다.\n\n##### 상왈: 용마루가 융성하니 길하다. 아래가 굽어지지않는다.\n\n/4&\n\n&5&\n##### 九五：고양생화 노부득사부 무구무예(枯楊生華，老婦得士夫，无咎无譽) 시든 버드나무에 꽃이핀다.  할머니가 사부(士夫)를 얻는다. 허물도없고 명예도없다.\n\n##### 상왈: 고목 버드나무에 꽃이핀다. 어찌 오래일수있겠는가?  늙은여인이 사부(士夫)를 얻으니 역시 부끄러울수있다.\n\n/5&\n\n&6&\n##### 上六：과섭멸정 흉 무구(過涉滅頂，凶，无咎) 머리가 잠겨 건너지난다.  흉하다. 허물없다.\n\n##### 상왈: 과섭의 흉은 (위험한바이지) 허물은 아니다.\n\n/6&"},"010010":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/029.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 감(坎)은 아래로 임하는바이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물은 끝내 지나칠수없다.(미치는것이다.) 고로 감(坎)으로써 그것을 받는다. 감은 빠지는것이다.**","text.tab3":"&0&\n**감위수(坎爲水): 감(坎)  습감 유부유심 형 행유상(習坎，有孚維心，亨。行有尚)**\n**대상 (大象): 물이 드디어 이른다. 감을 익힌다. 군자는 항상 덕을 행한다. 일에서 배우기를 힘쓰는것이다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 늘 애태우니 거듭 위태로운것이다. 물이 흐르나 가득 차지않는다. 어렵게 행하나 그 믿는바를 잃지않는다. 오직 정성으로 형통한다. 강함으로 그 중심을 삼는다. 행동하는것은 우러를바가있고 가는것에는 공덕이있는것이다. 하늘이 험난하면 오를수없고 지형이 험난한것은 산천구릉인것이다. 왕과 공이 그 나라를 지킴에 험난함을 이용하여 힘입으니 감의 때를 사용한바가 크도다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：습감 입우감담 흉(習坎，入于坎窞，凶) 고생에 익숙하다. 크고작은 구덩이에 들어간다. 흉하다.\n\n##### 상왈: 고생에 익숙하다. 고생에 들어간다. 길을 잃고 흉하다.\n\n/1&\n\n&2&\n##### 九二：감유험 구소득(坎有險，求小得) 구덩이는 위험이 있다.  작은 얻음을 구한다.\n\n##### 상왈: 작은것을 구하고 얻는다. 아직 나아가지 않았다.\n\n/2&\n\n&3&\n##### 六三：래지감감 험차침 입우감담 물용(來之坎坎，險且枕，入于坎窞，勿用) 오고가니 괴롭다. 위험하고 또 방해한다. 크고작은 구덩이에 들어간다. 쓰지말라\n\n##### 상왈: 오고가니 괴롭다. 끝내는 공이 없다.\n\n/3&\n\n&4&\n##### 六四：준주궤이 용부 납약자유 종무구(樽酒簋貳，用缶，納約自牖，終无咎) 술통의 술과 제기 두개, 장군을 쓴다. 고생을 받고 스스로 깨우친다. 끝은 허물없다.\n\n##### 상왈: 술통의 술과 제기 두개, 강함과 부드러움이 서로 만나 사귄다.\n\n/4&\n\n&5&\n##### 九五：감불영 지기평 무구(坎不盈，只既平，无咎) 구덩이가 차지않았다. 단지 이미 평평하다. 허물없다.\n\n##### 상왈: 구덩이가 차지않았다. 중간이니 아직 크지않다.\n\n/5&\n\n&6&\n##### 上六：계용휘묵 치어총극 삼세부득 흉(繫用徽纆，寘于叢棘，三歲不得，凶) 맴에 아름다운 노끈을 쓴다.  덩굴가시에 둔다. 삼년동안 얻지못한다. 흉하다.\n\n##### 상왈: 상육이 도를 잃는다. 세해가 흉하다.\n\n/6&"},"101101":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/030.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 이(離)를 위로 임하는바이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): (몰입하여) 깊이 빠지는것은 아름답다. 고로 리(離)로써 그것을 받는다. 리는 아름다움인것이다.**","text.tab3":"&0&\n**이위화(離爲火): 리(離)  이정 형 휵목우 길(利貞，亨。畜牝牛，吉)**\n**대상 (大象): 밝음의 기능은 빛남에서 이루어진다. 대인은 밝음을 계승해서 사방을 비춘다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 이는 고운것이다. 아름다운것이다. 밝은것이다. 일월이 하늘에서 빛난다. 수많은 계곡에도 초목이 흙에서 돋아나는바이다. 바른것에서 빛남은 밝음의 중한바이다. 생기를 불어넣어 천하를 조화롭게 이룬다. 중심에서 바르다는것은 부드럽게 빛나는것이다. 고로 형통한다. 이것이  암컷 소를 기르는것이 길한바이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：리착연 경지무구(履錯然，敬之无咎) 착각해서 밟는다. 그것을 공경하니 허물이없다.\n\n##### 상왈: 번거로우나 그것을 존중하니 허물을 피한다.\n\n/1&\n\n&2&\n##### 六二：황이 원길(黃離，元吉) 근심을 앓다. 본디 길하다.\n\n##### 상왈: 황금빛은 본디 길하니 그 가운데에서 도를 얻는바이다.\n\n/2&\n\n&3&\n##### 九三：일측지리 불고결이가 즉대질지차 흉(日昃之離，不鼓缶而歌，則大耋之嗟，凶) 날이 기우니 헤어진다. 북이 아니고 그릇으로 노래한즉 아주 늙은이가 탄식한다. 흉하다.\n\n##### 상왈: 날이 기우는 빛이니 어찌 오래 갈수있겠는가?\n\n/3&\n\n&4&\n##### 九四：돌여기래여 분여 사여 기여(突如其來如，焚如，死如，棄如) 갑자기 그이후로  불사르고 죽고 버림 같다.\n\n##### 상왈: 돌연 그 오는바같으니 준비하는바가 없다.\n\n/4&\n\n&5&\n##### 六五：출체타약 척차약 길(出涕沱若，戚嗟若，吉) 눈물이 나옴같고 근심하고 탄식함같다. 길하다.\n\n##### 상왈: 육오의 길함은 왕과 신하가 서로 돕는바이다.\n\n/5&\n\n&6&\n##### 上九：왕용출정 유가절수 획기비축 무구(王用出征，有嘉折首，獲其匪丑，无咎) 왕이 출정을 한다. 머리를 꺽으니 기쁨이 있다. 그 소아닌것을 잡으니 허물없다. 참고 *복상(卜商) 자하역전(子夏易傳) *우리말샘 *위키백과,위키낱말사전,위키낱말사전 주역하 (第31卦〜第64卦) 주역 상 : 第1卦~第30卦 주역 하 : 第31卦~第64卦\n\n##### 상왈: 왕이 출정으로 천하의 여러 봉토를 평정한다.\n\n/6&"},"001110":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/031.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 함(咸)은 이름(速)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 천지가 있어 연후에 만물이 있다. 만물이 있고 연후에 남녀가 있다. 남녀가 있고 연후에 부부가 있다. 부부가 있고 연후에 부자가있다. 부자가 있고 연후에 군신이 있다. 군신이있고 연후에 상하가 있다. 상하가있고 연후에 예의를 갖추는바가 있다. 부부의 도는 장구하지않을수없다. 이런까닭에 항(恒)으로써 그것을 이어받는다.**","text.tab3":"&0&\n**택산함(澤山咸): 함(咸)  형 이정 취녀길(亨，利貞，取女吉)**\n**대상 (大象): 산위에 연못이 있다.  감이다. 군자는 비움으로써 사람을 받아들인다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 함은 감응이다. 유함이 위에 그리고 강함이 아래에 처한다. 두개의 기운이  서로 함께 감응한다.  멈추어 기쁨을 느낀다.  남자가 여자아래에 처한다. 이것이 형통함으로 곧아 이롭다는것이다. 여자를 취하니 길하다는것이다. 천지가 감응하고 만물이 화생한다. 성인이 인심에 감응하니 천하가 화평하다. 그 감응하는바를 살핀다. 이로써 천지만물의 정을 볼수있는것이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：함기무(咸其拇) 그 엄지손가락이 두루 미친다.\n\n##### 상왈: 그 엄지손가락이 두루 미친다는것은 뜻이 밖에 있다는것이다.\n\n/1&\n\n&2&\n##### 六二：함기비 흉 거길(咸其腓，凶，居吉) 그 장딴지가 두루미친다. 흉하다. 거하니 길하다.\n\n##### 상왈: 비록 흉하나 거하여 길한다. 순리는 (해를 막으니)해롭지않다.\n\n/2&\n\n&3&\n##### 九三：함기고 집기수 왕린(咸其股，執其隨，往吝) 그 넓적다리에 두루미치니 그 발꿈치를 잡는다. 감에 인색하다.\n\n##### 상왈: 그 넓적다리에 두루미치니 역시 처하지 않는다는것이다. 뜻은 사람들이 따는바에 있는것이다. 아래와 사귀는 바이다.\n\n/3&\n\n&4&\n##### 九四：정길회망 동동왕래 붕종이사(貞吉悔亡，憧憧往來，朋從爾思) 바르니 길하고 잊음을 후회한다. 동경하여 가고온다. 친구가 너의 생각을 쫓는다.\n\n##### 상왈: 곧고 길하니 후회를 잊는다.  아직 감응이 해롭지 않다. 동경하여 서로 따른다.  아직 빛이 크게 빛나지않는다.\n\n/4&\n\n&5&\n##### 九五：함기매 무회(咸其脢，无悔) 그 등골뼈에 두루미치니 후회가 없다.\n\n##### 상왈: 그 등골뼈에 두루미치니 뜻의 말미인것이다.\n\n/5&\n\n&6&\n##### 上六：함기보 협설(咸其輔，頰舌) 그 광대뼈에 두루미치니 뺨과 혀이다.\n\n##### 상왈: 그 광대뼈,뺨 그리고 혀에 두루미치니 입에서 말이 들끓는다.\n\n/6&"},"011100":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/032.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 항(恒) 지속(久)됨이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 항은 장구한것이다. 사물이 이런까닭에 둔(遯)으로써 그것을 이어받는다. 둔은 물러나는 것이다.**","text.tab3":"&0&\n**뇌풍항(雷風恆): 항(恒)   형 무구 이정 이유유왕 (亨，无咎，利貞，利有攸往)**\n**대상 (大象): 천둥과 바람이다. 恆이다. 군자는 서서 방향을 바꾸지 않는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 恒은 오래다. 강건함이 위에 있고 유순함이 아래에 있다. 천둥과 바람이 서로 주고받는다. 유순하고 움직인다. 강건함과 유순함이 모두 응한다. 恒이다. 恒이 형통하고 허물이 없다. 바름이 이롭다. 그 도에 오래하기 때문이다. 하늘과 땅의 도는 오래하여 그치지 않는다. 가는 것이 이롭다. 끝이 있으면 시작이 있기 때문이다. 해와 달이 하늘을 얻어 오래 비춘다. 사시가 변화하여 오래 이룬다. 성인이 그 도에 오래하여 천하가 감화하여 이룬다. 그 항상하는 바를 관찰하면 하늘과 땅과 만물의 정을 볼 수 있다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：준항 정흉 무유리(浚恒，貞凶，无攸利) 늘 깊으니 바르나 흉하다. 이로운바가없다.\n\n##### 상왈: 깊이 지속한다. 흉하다. 처음부터 깊이 들어간다.\n\n/1&\n\n&2&\n##### 九二：회망(悔亡) 잃음을 후회한다.\n\n##### 상왈: 후회가 사라진다. 능히 오래 중앙에 있다.\n\n/2&\n\n&3&\n##### 九三：불항기덕 혹승지수 정린(不恆其德，或承之羞，貞吝) 그덕이 늘 두루 미치지못하다. 혹 높음의 부끄러움으로 바르나 근심이다.\n\n##### 상왈: 그 덕을 항(恆)하지 않는다. 받아들일 곳이 없다.\n\n/3&\n\n&4&\n##### 九四：전무금(田无禽) 전이 날짐승이 없다.\n\n##### 상왈: 오래 그 자리가 아니다. 어찌 금(禽)을 얻겠는가.\n\n/4&\n\n&5&\n##### 六五：항기덕 정 부인길 부자흉(恆其德，貞，婦人吉，夫子凶) 그덕이 두리미치다. 바르다. 부인이 길하다. 남편이 흉하다.\n\n##### 상왈: 부인은 바르면 길하다. 하나를 따라 끝까지 간다. 부자는 의(義)를 제정한다. 부인을 따르면 흉하다.\n\n/5&\n\n&6&\n##### 上六：진항 흉(振恒，凶) 항상 무리를 지어 날다. 흉하다.\n\n##### 상왈: 위에서 항(恆)을 진동시킨다. 큰 공이 없다.\n\n/6&"},"001111":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/033.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 둔(遯) 즉 퇴(退)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 끝내는 물러날수없다. 이런까닭에 대장(大壯)으로써 그것을 이어받는다.**","text.tab3":"&0&\n**천산둔(天山遯): 돈(遯)  형 소이정 (亨，小利貞)**\n**대상 (大象): 하늘 아래에 산이 있다. 遯이다. 군자는 소인을 멀리하되 미워하지 않고 엄격하다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 遯이 형통한다. 물러나서 형통한다. 강건함이 자리에 맞고 응한다. 때와 함께 행한다. 작은 것에 바름이 이롭다. 스며들어 길어진다. 遯의 시의가 크도다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：둔미 려 물용유유왕(遯尾，厲，勿用有攸往) 꼬리가 달아난다. 괴로우나 갈바가있음을 쓰지말라\n\n##### 상왈: 물러남의 꼬리. 위험하다. 가면 이롭지 않다. 어떻게 재앙을 피하겠는가?\n\n/1&\n\n&2&\n##### 六二：집지용황우지혁 막지승설(執之用黃牛之革，莫之勝說) 황소의 가죽을 씀을 잡는다. 승리를 기뻐하지 말아라\n\n##### 상왈: 황소 가죽으로 묶는다. 뜻이 고정된다.\n\n/2&\n\n&3&\n##### 九三：계둔 유질려 축신첩길(系遯，有疾厲，畜臣妾吉) 달아남이 매이다. 신하와 시녀를 모으니 길하다.\n\n##### 상왈: 물러남에 묶인다. 질병이 있고 위험이 있다. 신하와 첩을 기르면 길하다. 큰 일을 할 수 없다.\n\n/3&\n\n&4&\n##### 九四：호둔군자길 소인비(好遯君子吉，小人否) 군자를 회피함을 좋아하니 길하다. 소인은 막힌다.\n\n##### 상왈: 군자는 좋은 물러남이다. 소인은 그렇지 않다.\n\n/4&\n\n&5&\n##### 九五：가돈 정길(嘉遯，貞吉) 피하니 아름답다.  바르니 길하다.\n\n##### 상왈: 아름다운 물러남이다. 바르면 길하다. 바름으로 뜻을 정한다.\n\n/5&\n\n&6&\n##### 上九：비돈 무불리(肥遯，无不利) 기름짐을 피한다. 이롭지않음이 없다.\n\n##### 상왈: 비옥한 물러남이다. 불리함이 없다. 의심할 바가 없다.\n\n/6&"},"111100":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/034.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 대장(大壯)즉 머무름(止)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 끝내는 씩씩할수없다. 고로 그것을 진(晉)으로 받는다. 진은 나아가는것이다.**","text.tab3":"&0&\n**뇌천대장(雷天大壯): 대장(大壯) 이정(利貞)**\n**대상 (大象): 천둥이 하늘 위에 있다. 大壯이다. 군자는 예가 아닌 것은 행하지 않는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 大壯은 큰 것이 장하다. 강건함으로 움직인다. 그러므로 장하다. 大壯에 바름이 이롭다. 큰 것이 바른 것이다. 바르고 크다. 이에 하늘과 땅의 정을 볼 수 있다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：장우지 정흉 유부(壯于趾，征凶，有孚) 발이 씩씩하다. 먼길을 가나 흉하다.  믿음이 있다.\n\n##### 상왈: 발에 큰 힘을 준다. 믿음이 있다. 그 믿음이 궁(窮)하다.\n\n/1&\n\n&2&\n##### 九二：정길(貞吉) 바르니 길하다.\n\n##### 상왈: 정직하면 길하다. 중앙에 있어도 허물이 없다.\n\n/2&\n\n&3&\n##### 九三：소인용장 군자용망 정려 저양촉번 리기각(小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角) 소인은 씩씩함을 쓴다. 군자는 속임을 쓴다. 바름에 힘쓴다. 숫향이 울타리에 닿았다. 그 뿔이 파리하다.\n\n##### 상왈: 소인은 힘을 사용한다. 군자는 힘을 사용하지 않는다.\n\n/3&\n\n&4&\n##### 九四：정길회망 번결불리 장우대여지복(貞吉悔亡，藩決不羸，壯于大輿之輹) 바르니 길하나 잃음을 근심하다. 울타리가 터지니 괴로워하지않는다. 큰수레의 복토(伏兔)가 견고하다.\n\n##### 상왈: 울타리가 열린다. 뿔이 얽히지 않는다. 뜻이 행해진다.\n\n/4&\n\n&5&\n##### 六五：상양우역 무회(喪羊于易，无悔) 바뀜에서 양을 잃다. 후회는없다.\n\n##### 상왈: 양을 잃는다. 위치가 부적절하다.\n\n/5&\n\n&6&\n##### 上六：저양촉번 불능퇴 불능수 무유리 간즉길(羝羊觸藩，不能退，不能遂，无攸利，艱則吉) 숫양이 울타리에 닿았다. 물러날수없고 따를수도 없다. 이로운바가 없다. 어려운즉 길하다.\n\n##### 상왈: 나아갈 수 없고 물러날 수 없다. 부적절하다. 어려움에 정직하면 길하다. 재앙이 길지 않다.\n\n/6&"},"000101":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/035.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 진(晉)은 낮(晝)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 진은 반드시 상처입는바가 있다. 이런까닭에 명이(明夷)로써 그것을 이어받는다. 이는 상처이다.**","text.tab3":"&0&\n**화지진(火地晉): 진(晉)  강후용사마번서 획일삼접(康侯用錫馬蕃庶，晝日三接)**\n**대상 (大象): 밝음이 땅 위에 나타난다. 晉이다. 군자는 스스로 밝은 덕을 밝힌다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 晉은 나아감이다. 밝음이 땅 위에 나타난다. 순하고 큰 밝음에 아름답다. 유순함이 나아가 위로 행한다. 이에 강후가 말을 하사받음을 번성하게 쓴다. 낮에 세 번 접견한다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：진여 최여 정길 망부 유무구(晉如，摧如，貞吉。罔孚，裕无咎) 나아가는것같고 물러나는것같다. 바르니 길하다. 믿음을 엮는다. 넉넉하니 허물이없다.\n\n##### 상왈: 진보가 막혔다. 정직하면 허물이 없다. 뜻이 행해지지 않는다.\n\n/1&\n\n&2&\n##### 六二：진여 추여 정길 수자개복 우기왕모(晉如，愁如，貞吉。受茲介福，于其王母) 억누르는것같고 괴롭히는것같다. 바르니 길하다.  그 왕모(王母)로부터 복(福) 사이에 끼여 더욱 받는다.\n\n##### 상왈: 진보가 슬프다. 중정(中正)이다.\n\n/2&\n\n&3&\n##### 六三：중윤 회무(衆允，悔亡) 군신들이 미쁘다. 후회는 없다.\n\n##### 상왈: 모두가 진보를 허용한다. 뜻이 행해진다.\n\n/3&\n\n&4&\n##### 九四：진여석서 정려(晉如鼫鼠，貞厲) 사이에 끼임이 바위다람쥐같다.  바름이 괴롭다.\n\n##### 상왈: 쥐와 같은 진보. 위치가 부적절하다.\n\n/4&\n\n&5&\n##### 六五：회망 실득물휼 왕길무불리(悔亡，失得勿恤，往吉无不利) 잊음을 후회한다. 잃기도 하고 얻기도 하니 불쌍히 여기지말라 가는것이 이롭지않음이 없으니 길하다.\n\n##### 상왈: 후회가 사라진다. 잃고 얻는다. 가면 이롭다. 중정(中正)이다.\n\n/5&\n\n&6&\n##### 上九：진기각 유용용벌읍 려길무구 정린(晉其角，維用伐邑，厲吉无咎，貞吝) 그뿔를 억누른다. 오직 읍을침략함을 행한다. 힘쓰니 길하다. 허물이없다. 바르나 인색하다.\n\n##### 상왈: 진보의 뿔을 사용한다. 정벌에 이롭다. 위에 있어서 궁(窮)하다.\n\n/6&"},"101000":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/036.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 명이(明夷)는 더는(誅)것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 상처는 바깥에서부터인것이다. 반드시 그 집으로 되돌아가는바이다. 고로 그것을 가인(家人)으로 받는다.**","text.tab3":"&0&\n**지화명이(地火明夷): 명이 이간정(明夷  利艱貞)**\n**대상 (大象): 밝음이 땅 속에 들어간다. 明夷이다. 군자는 대중을 다스리며 어둠을 사용하여 밝힌다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 밝음이 땅 속에 들어간다. 明夷이다. 안은 문명하고 밖은 유순하다. 이로써 큰 어려움을 이겨낸다. 문왕이 이를 사용하였다. 어려움에 바름이 이롭다. 그 밝음을 어둡게 한다. 안이 어렵되 능히 그 뜻을 바르게 한다. 기자가 이를 사용하였다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：명이우비 수기익 군자우행 삼일불식 유유왕 주인유언(明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言) 날아오름에서 명이이다. 그날개를 드리운다. 행함에서 군자이다. 삼일동안 먹지않는다. 갈바가있다. 주인이 약속한다.\n\n##### 상왈: 뜻이 행해지지 않는다.\n\n/1&\n\n&2&\n##### 六二：명이(明夷) 이우좌고 용증마장 길(明夷，夷于左股，用拯馬壯，吉) 명이, 왼족 넓적다리에서 온화하다. 말이 씩식함을 도움을 행하다. 길하다.\n\n##### 상왈: 순종하여 법칙을 따른다.\n\n/2&\n\n&3&\n##### 九三：명이우남수 득기대수 불가질정(明夷于南狩，得其大首，不可疾貞) 명이(明夷)가 남쪽 임지(任地)에 있다.  그 큰머리를 얻다. 바름이 병일수없다.\n\n##### 상왈: 큰 공을 얻는다.\n\n/3&\n\n&4&\n##### 六四：입우조복 획명이지심 출우문정(入于左腹，獲明夷之心，出于門庭) 왼쪽 배에 들어간다. 명이의 마음을 얻다. 문뜰에 나간다.\n\n##### 상왈: 그 마음을 얻는다.\n\n/4&\n\n&5&\n##### 六五：기자지명이 이정(箕子之明夷，利貞) 기자(箕子)의 명이(明夷)이다. 바르니이롭다.\n\n##### 상왈: 밝음을 멈출 수 없다.\n\n/5&\n\n&6&\n##### 上六：불명회 초등우천 후입우지(不明晦，初登于天，后入于地) 그믐이 밝지않다. 처음 하늘에 오른다. 뒤에 땅에 들어간다.\n\n##### 상왈: 처음에는 하늘에 올라가 사방 나라를 비춘다. 나중에는 땅에 들어가 법칙을 잃는다.\n\n/6&"},"101011":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/037.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 가인(家人)은 들어옴(內)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 집안의 도가 궁하면 반드시 어그러진다. 이런까닭에 규(睽)로써 그것을 이어받는다. 규는 어그러짐이다.**","text.tab3":"&0&\n**풍화가인(風火家人): 가인 이여정(家人  利女貞)**\n**대상 (大象): 바람이 불에서 나온다. 家人이다. 군자는 말에 내용이 있고 행동에 일관성이 있다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 여자가 안에서 바른 자리에 있고 남자가 밖에서 바른 자리에 있다. 남녀가 바른 것은 하늘과 땅의 큰 뜻이다. 家人에는 엄한 군주가 있다. 부모를 이르는 것이다. 아버지는 아버지답고, 자식은 자식답고, 형은 형답고, 아우는 아우답고, 남편은 남편답고, 아내는 아내다우면, 가도가 바르다. 집을 바르게 하면 천하가 안정된다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：한유가 회망(閑有家，悔亡) 집에 있으니 한가롭다. 잊음을 후회한다.\n\n##### 상왈: 가족에 경계를 한다. 뜻이 행해지지 않는다.\n\n/1&\n\n&2&\n##### 六二：무유수 재중궤 정길(无攸遂，在中饋，貞吉) 따르는바가없다. 식사중에있다. 곧으니 길하다.\n\n##### 상왈: 아무 곳으로 가도 이롭지 않다. 중정(中正)이다.\n\n/2&\n\n&3&\n##### 九三：가인엄효 회려길 부자희희 종린(家人嗃嗃，悔厲吉,婦子嘻嘻，終吝) 가인이 엄하고 큰소리로 외친다. 미워함을 후회하나 길하다. 부자가 화락하고 웃다. 끝은 인색하다.\n\n##### 상왈: 가족이 후회한다. 잃지 않는다. 여자와 아이들이 웃는다. 집을 잃는다.\n\n/3&\n\n&4&\n##### 六四：부가 대길(富家，大吉) 집이 부유하니 크게 길하다.\n\n##### 상왈: 부유한 가족. 큰 길함이다. 순종한다.\n\n/4&\n\n&5&\n##### 九五：왕격유가 물휼 길(王假有家，勿恤。吉) 왕이 집에 이르다. 근심하지말라 길하다.\n\n##### 상왈: 왕이 가족에게 이른다. 서로 사랑한다.\n\n/5&\n\n&6&\n##### 上九：유부위여 종길(有孚威如，終吉) 믿음이 있으니 권세같다. 끝이 길하다.\n\n##### 상왈: 위엄이 있다. 반드시 스스로 수정한다.\n\n/6&"},"110101":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/038.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 규(睽)는 떠남(外)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 어그러짐은 반드시 어지러워진다. 고로 그것을 건(蹇)으로 받는다. 건은 어지러워짐이다.**","text.tab3":"&0&\n**화택규(火澤睽): 규(睽)  소사길(小事吉)**\n**대상 (大象): 위는 불이고 아래는 호수이다. 睽이다. 군자는 같으면서도 다르다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 睽는 불이 움직여 위로 올라가고 호수가 움직여 아래로 내려간다. 두 여자가 함께 살되 그 뜻이 같이 행하지 않는다. 기쁘고 밝음에 아름답다. 유순함이 나아가 위로 행한다. 중앙을 얻고 강건함에 응한다. 이에 작은 일이 길하다. 하늘과 땅이 어긋나되 그 일이 같다. 남녀가 어긋나되 그 뜻이 통한다. 만물이 어긋나되 그 일이 비슷하다. 睽의 시용이 크도다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：회망 상마물축 자복 견오인무구(悔亡，喪馬勿逐，自復,見惡人无咎) 잃음을 후회한다. 말을 잃으나 쫓지말라 스스로 돌아온다.  사람이 병들음을 보나 허물은 없다.\n\n##### 상왈: 악한 사람을 보면 허물이 없다. 재앙을 피한다.\n\n/1&\n\n&2&\n##### 九二：우주우항 무구(遇主于巷，无咎) 문밖에서 주인을 만난다. 허물없다.\n\n##### 상왈: 수레를 보면 그 축이 당겨진다. 위치가 부적절하다. 처음에는 형벌을 받고 나중에는 이마에 문신을 받는다. 뜻이 행해진다.\n\n/2&\n\n&3&\n##### 六三：견예예 기우체 기인천차의 무초유종(見輿曳，其牛掣，其人天且劓，无初有終) 수레를 끌어당김을 본다. 기소가 끈다. 그 사람이 묵형(墨刑)하고 또 의형(劓刑)한다. 시작은 없고 끝은 있다.\n\n##### 상왈: 작은 골목에서 주인을 만난다. 잃지 않는다.\n\n/3&\n\n&4&\n##### 九四：계호 우원부 교부 려무구(睽孤，遇元夫，交孚，厲无咎) 부릅뜬 모양은 외롭다. 본디 저를 만난다. 믿음을 교제한다. 근심하나 허물은 없다.\n\n##### 상왈: 고립되고 만난다. 믿음이 있다. 뜻이 행해진다.\n\n/4&\n\n&5&\n##### 六五：회망 궐종서부 왕하구(悔亡，厥宗噬膚，往何咎) 잃음을 뉘우친다. 그 제사에서 저민고기를 깨문다. 가니 어찌 잘못이겠는가?\n\n##### 상왈: 종족이 물어뜯는다. 가면 이롭다. 위에서 순종한다.\n\n/5&\n\n&6&\n##### 上九：규호 견시부도 재귀일사 선장지호 후탈지호 비구혼구 왕우우즉길(睽孤， 見豕負涂，載鬼一車， 先張之弧，后說之弧，匪寇婚媾，往遇雨則吉) 반목하니 의지할데가없다. 진흙을 업은 돼지를 보다. 귀신을 한수레에 싣다. 먼저 활을 펼치고 뒤에 활을 벗는다. 도적이 혼사를 구한다. 가니 비를만난다. 즉 길하다.\n\n##### 상왈: 비를 만나면 길하다. 모든 의심이 사라진다.\n\n/6&"},"001010":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/039.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 건(蹇)은 난(難)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물은 끝내는 어지러울수없으니 이런까닭에 해(解)로써 그것을 이어받는다. 해는 원만함이다.**","text.tab3":"&0&\n**수산건(水山蹇): 건(蹇) 이서남 불리동북 이견대인 정길(利西南，不利東北,利見大人，貞吉)**\n**대상 (大象): 산 위에 물이 있다. 蹇이다. 군자는 반성하여 덕을 닦는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 蹇은 곤란이다. 위험이 앞에 있다. 위험을 보고 멈출 수 있다. 지혜롭도다. 蹇에 서남이 이롭다. 가면 중앙을 얻는다. 동북이 이롭지 않다. 그 도가 궁하다. 대인을 만남이 이롭다. 가면 공이 있다. 자리에 마땅하고 바름이 길하다. 나라를 바르게 하기 때문이다. 蹇의 시용이 크도다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：왕건 래예(往蹇，來譽) 가는바가 굼뜨다. 명예가 온다.\n\n##### 상왈: 곤란에 가면 곤란하다. 명예가 온다. 기다린다.\n\n/1&\n\n&2&\n##### 六二：왕신건건 비궁지고(王臣蹇蹇，匪躬之故) 왕의 신하가 머무르고 교만하다. 몸의 연고가 아니다.\n\n##### 상왈: 왕의 신하가 곤란에 빠진다. 끝에는 허물이 없다.\n\n/2&\n\n&3&\n##### 九三：완건 래반(往蹇,來反) 가서 고생한다. 되돌아온다.\n\n##### 상왈: 곤란에 가면 돌아온다. 안쪽이 기뻐한다.\n\n/3&\n\n&4&\n##### 六四：왕건래련(往蹇來連) 가서 머무르니 잇달아 온다.\n\n##### 상왈: 곤란에 가면 곤란하다. 위치가 실제이다.\n\n/4&\n\n&5&\n##### 九五：대건붕래(大蹇朋來) 크게 교만하니 무리가온다.\n\n##### 상왈: 큰 곤란에 친구가 온다. 중정(中正)으로 응한다.\n\n/5&\n\n&6&\n##### 上六：왕건래석 길 이견대인(往蹇來碩，吉,利見大人) 가서 고생하니 차서온다. 길하다. 대인을 만나니 이롭다.\n\n##### 상왈: 곤란에 가면 큰 곤란이 온다. 뜻이 안에 있다. 대인을 보면 이롭다. 위에서 순종한다.\n\n/6&"},"010100":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/040.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 해(解)는 느림(緩)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 원만함은 반드시 잃는바가있다. 고로 그것을 덜어짐(損)으로 받는다.**","text.tab3":"&0&\n**뇌수해(雷水解): 해(解)  이서남 무소왕 기래부길 유유왕 숙길(利西南，无所往，其來復吉。有攸往，夙吉)**\n**대상 (大象): 천둥과 비가 일어난다. 解이다. 군자는 과실을 용서하고 죄를 용서한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 解는 위험으로 움직인다. 움직여 위험에서 벗어난다. 解이다. 解에 서남이 이롭다. 가면 무리를 얻는다. 돌아오면 길하다. 이에 중앙을 얻는다. 가는 바가 있으면 일찍 길하다. 가면 공이 있다. 하늘과 땅이 해소되어 뇌우가 인다. 뇌우가 일어나 온갖 과일과 초목이 모두 갑이 터진다. 解의 시기가 크도다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：무구(无咎) 허물없다.\n\n##### 상왈: 강과 유(柔)가 교차한다.\n\n/1&\n\n&2&\n##### 九二：전획삼호 득황시 정길(田獲三狐，得黃矢，貞吉) 전에서 세 마리 여우를 잡는다. 황(黃)화살을 얻는다. 바르니 길하다.\n\n##### 상왈: 정직하면 길하다. 중정(中正)으로 얻는다.\n\n/2&\n\n&3&\n##### 六三：부차승 치구질 정인(負且乘，致寇至，貞吝) 짐을 지고 또한 타니 도적이 이르러 덜렁대는 모양이다. 바르나 인색하다.\n\n##### 상왈: 짐을 싣고 타고 가면 도적을 부른다. 또한 수치스럽다. 누가 허물이 있겠는가?\n\n/3&\n\n&4&\n##### 九四：해이무 붕지사부(解而拇，朋至斯孚) 엄지손가락을 핑계하나 친구가 이르러 믿음이 다한다.\n\n##### 상왈: 그 대지를 풀어준다. 뜻이 행해지지 않는다.\n\n/4&\n\n&5&\n##### 六五：군자유유해 길 유부우소인(君子維有解，吉,有孚于小人) 군자는 풀어서 매니 길하다. 소인에게 믿음이 있다.\n\n##### 상왈: 군자가 해방을 해주면 작은 사람이 믿는다. 중정(中正)이다.\n\n/5&\n\n&6&\n##### 上六：공용석준 우고용지상 획지 무불리(公用射隼，于高墉之上，獲之，无不利) 공이 높은 담장 위에서 매를 맞힘을 행하고 그것을 잡으니 이롭지 않음이 없다.\n\n##### 상왈: 공(公)이 새를 쏜다. 해결한다.\n\n/6&"},"110001":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/041.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 손익(損益)은 흥망성쇠의 단초들이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 덜어짐은 이후에 부득이 반드시 더하여진다. 이런까닭에 익(益)으로써 그것을 이어받는다.**","text.tab3":"&0&\n**산택손(山澤損): 손(損)   유부 원길 무구 가정 이유유왕 갈지용 이궤가용형(有孚，元吉，无咎，可貞，利有攸往。曷之用？二簋可用享)**\n**대상 (大象): 산 아래에 호수가 있다. 損이다. 군자는 분노를 징계하고 욕망을 막는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 損은 아래를 덜어 위를 더한다. 그 도가 위로 올라간다. 덜되 신의가 있다. 크게 길하다. 허물이 없다. 바를 수 있다. 가는 것이 이롭다. 어디에 쓰겠는가. 두 그릇으로 제사를 지낼 수 있다. 두 그릇은 때가 있어야 한다. 강건함을 덜고 유순함을 더하는 것은 때가 있다. 덜고 더하며 차고 비우는 것은 때와 함께 행한다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：이사천왕 무구 작손지(已事遄往，无咎，酌損之) 이미 일이 빠르게 왔다. 허물이없다. 그것을 덜어 따른다.\n\n##### 상왈: 일을 그만두고 가면 허물이 없다. 뜻이 행해진다.\n\n/1&\n\n&2&\n##### 九二：이정정흉 불손익지(利貞征凶，弗損益之) 나아가 흉한것을 바름으로 이롭게한다. 그것을 덜거나 더하지 않는다.\n\n##### 상왈: 정직하면 이롭다. 중정(中正)으로 뜻이 행해진다.\n\n/2&\n\n&3&\n##### 六三：삼인행 즉손일인 일인행 즉득기우(三人行，則損一人,一人行，則得其友) 세사람이 가면 한사람을 잃고 한사람이 가면 그 벗을 얻음이 있다.\n\n##### 상왈: 세 사람이 가면 한 사람을 잃는다. 한 사람이 가면 친구를 얻는다. 하나가 된다.\n\n/3&\n\n&4&\n##### 六四：손기질 사천유희 무구(損其疾，使遄有喜，无咎) 그
