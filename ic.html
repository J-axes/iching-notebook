曰：井渫不食，行惻也，求王明，受福也。\n\n九三之才居相位，陽剛又居高位，才必能濟世，如井之清水升而上，可助人之力大也，今不見人食，乃謂君明其賢不用其才，賢才之心必憂，如君能用其才，使其才能濟民，乃上下之共福也。\n\n井中水清澈而不食用，乃有才智之人，不見用，其無法遂行其志而憂懷，但求得遇明君而天下受其福澤。\n/3&\n\n&4&\n##### 六四：井甃，无咎。\n\n##### 象曰：井甃無咎，脩井也。\n\n陰柔之人居君王身側，才不足而任其位，若但求修治井口之磚砌，自守之，亦可無咎。\n\n修治井口 ，即令無功於天下，亦因其能守而不致招廢棄，亦可為功矣。\n/4&\n\n&5&\n##### 九五：井洌，寒泉食。\n\n##### 象曰：寒泉之食，中正也。\n\n九五君位之人，能如井中之泉，甘寒潔淨，為民所喜用，此井道之至善也。\n\n寒洌甘潔之泉水受人喜用，乃中正之道得用亦同。\n/5&\n\n&6&\n##### 上六：井收勿幕，有孚元吉。\n\n##### 象曰：元吉在上，大成也。\n\n井以水能上出為人所用為居功，使人汲取而不竭，其利必無窮無盡，其間之性為常此不變，始終如一，廣施其德於萬民，此乃井道之成也。\n\n##### 能以至善而居卦終，乃大成也。\n/6&"},"101110":{"text.tab1":"此卦彭越戰項王絶糧時，卜得之，遂能承恩改革也。\n\n#### 圖\n一人把柿全，一人把柿不全，一兔虎，官人推車，車上一印，在大路上 。\n\n**豹變爲虎之課**\n\n**改舊從新之象**\n\n#### 雜\n\n**雜卦曰：革去故也，鼎取新也。**\n\n#### 序\n\n**序卦曰：井道不可不革，故受之以革。**\n\n井之為用，在甘潔寒洌，如中有穢物，任其存之必敗，清之則必潔，此乃革之義，故井後，革為其序。此卦澤在上，火在下，乃水能滅火，火亦能涸水之象，人能外悦而內明，乃革之真義。\n\n#### 解\n• 一、一人把柿全，乃人肺腑之言。\n• 二、一人把柿不全，一人半真言也。\n• 三、一兔：躍進之象。\n• 四、一虎：威權之象，大人之象，肖虎也。\n• 五、官人推車有一印：如為武官，則訟至。今為文官帶印，主得掛印封帥，須力求變革，果必成。丈夫推車，乃求婚也，帶印必成。\n• 六、虎兔向山行：賢良大人退，後繼有人躍進同行。\n• 七、山頭四點：上位之人，黑暗不明之象。\n• 八、大路：轉變為新且順之象。","text.tab2":"• 一、 此女天生剛勇，且明事理。\n• 二、 感情困擾多。\n• 三、 婚姻比同時生人早二年，且比姊早婚。","text.tab3":"&0&\n**革：巳日乃孚，元亨利貞，悔亡。**\n革之道，在變其故舊，始初人必未能遽信，必俟至巳日乃人心信從。革之道在求變故後能亨通，但須誠正利於天下，乃能去故從新，不因有大變而生悔。\n/0&\n\n#### 彖\n\n**彖曰：革，水火相息，二女同居，其志不相得，曰革。**\n水火互息互滅，次女少女同居一室，其志不同，其所歸各異，如革也，有生變異之象。\n\n巳日乃孚，革而信之。文明以説，大亨以正，革而當，其悔乃亡。\n革之雖變，始初不令人信，但如以正道，日久乃信。能明且悦，則能盡事之理，無事不察，人心和順，必致大亨，此革之至當，必不生悔。\n\n天地革而四時成，湯武革命，順乎天而應乎人，革之時大矣哉！\n天地有變革後，乃能生成四時寒暑，萬物因其時節而生。王者之與，能上順天命，下應人心，改舊去新，得易之神，此革之時義大也。\n\n#### 象\n\n**象曰：澤中有火。革，君子以治歷明時。**\n\n水火相消滅，為革道，除舊佈新，君子觀革之象，乃知推演歷數，知日月星辰之變，以明四時之序，則終能合於天地。\n\n&1&\n##### 初九：鞏用黃牛之革。\n\n##### 象曰：鞏用黃牛，不可以有爲也。\n\n變革之事為大事，必有時機，有人才，有其地位，謀慮而後動，則可無侮矣。猶如用黃牛之皮來侷束，但求自固而守，不求任意妄動之義。\n\n初革之時，但求能自固守其位，不可妄求有功。\n/1&\n\n&2&\n##### 六二：巳日乃革之，征吉 ，无咎。\n\n##### 象曰：己日革之，行有嘉也。\n\n陰居陰位，乃得才適用之時，此際足以去天下之弊乃上輔於君，行其正道而革之，吉而無災也。\n\n時至人信乃革之，動則有喜慶。如時至而不動，則必無濟世之心，必因失時而生悔矣。\n/2&\n\n&3&\n##### 九三：征凶，貞厲。革言三就，有孚。\n\n##### 象曰：革言三就，又何之矣。\n\n九三相位，居下卦之上，上有君，於此以陽剛之勢而力革時，乃過於燥動，行之必有凶。\n但如慎戒敬懼，守貞正之道，知順從公論，行革不為人疑出於私利，則吉，因眾必孚服而順。\n\n革之道經再三察合，知順乎天理，乃事之至當，何須再往呢？\n/3&\n\n&4&\n##### 九四：悔亡，有孚，改命，吉。\n\n##### 象曰：改命之吉 ，信志也。\n\n此即以剛處柔位，近君側之人，剛柔互濟，於革之時，行以至誠，致令上信下順，其吉必矣。\n\n能改命致吉，必上下能順從信服方成，因至誠感召也。\n/4&\n\n&5&\n##### 九五：大人虎變，未占有孚。\n\n##### 象曰：大人虎變，其文炳也。\n\n九五至尊之君，能以中正之道，居革之時，乃能力革之，其必昭著天下，不須占決，知其行為之至當，天下必信。\n\n事理之明如虎紋之明盛，則天下無不信服。\n/5&\n\n&6&\n##### 上六：君子豹變，小人革面，征凶，居貞吉。\n\n##### 象曰：君子豹變，其文蔚也。小人革面，順以從君也。\n\n革之終時，君子必從革後而大變，於至善，小人昏愚難變，即令心智未化，但其面已改，從上之教導。天下之事於始革必艱難，至革成，則患無法自守，故於此須戒之守貞堅志，則果必吉 。\n\n君子變革後，其更精進，如文采之蔚盛。\n小人因於革，不敢為惡，唯外飾臣服，以從君道，此革道成功矣。\n/6&"},"011101":{"text.tab1":"此卦秦君卜得之，乃知得九鼎以象九州也。\n\n#### 圖\n雲中月現，鵲南飛，一子裹席帽，一人執刀，貴人端坐無畏，一鼠。\n\n**調和鼎鼐之課**\n\n**去故取新之象**\n\n#### 雜\n\n**雜卦曰：革去故也，鼎取新也。**\n\n#### 序\n\n**序卦曰：革物者，莫若鼎，故受之以鼎。**\n\n能使物分隔，為鼎，故鼎之用在能革物，能使水火不同之物相合，易生為熟，易堅為柔，使相合而不相害，此革物之功也，故鼎為革之序卦。此卦上火下風，乃木入火中，烹飪之象，鼎之象即此。為器之大用。\n\n#### 解\n• 一、雲中月現：顯象，撥雲見月之象，清明也。\n• 二、鵲南飛：冬至來臨，北人執政。\n• 三、一子裹席帽，不明之人，無知之人。果喜也。\n• 四、一人執刀：武官也，護衛將軍。\n• 五、貴人端坐無畏：君王，老闆等人，至公無私。\n• 六、一鼠：子年，暗謀之人，內有陰謀，肖鼠人也。","text.tab2":"此局最利未婚小姐，我常利用此局助人無數。\n• 一、 其必嫁貴夫。\n• 二、 果決剛斷，不易受惑。\n• 三、 婚比姊早婚，且冬天方成。\n• 四、 官運亨通，財不利。\n• 五、 鼠生人凶，不吉。\n• 六、 科甲吉，考試順利。","text.tab3":"&0&\n**鼎：元吉、亨。**\n鼎之道，能使不合之物相合，故必吉亨。\n/0&\n\n#### 彖\n\n**彖曰：鼎，象也。**\n鼎之為器，法自象也。古人以方代表實且正之象。兩耳對峙在上，三足分峙於下，周圓內外，皆有法而正，成安重之象。\n\n以木巽火，烹飪也。聖人亨以享上帝，而大亨以養聖賢。\n用木就火，烹飪之象，鼎器人賴以生，故聖人以鼎享上帝，用大亨以享聖人。\n\n巽而耳目聰明，柔進而上行，得中而應乎剛，是以元亨。\n人能如卦才，外明內順，上之頭面能中虛為明，乃耳聰目明之象，柔乃在下之物，能進上位，以明居尊，得乎中道，而陽剛之道相應，此乃元亨之因也。\n\n#### 象\n\n**象曰：木上有火，鼎，君子以正位凝命。**\n木之上有火，生火烹飪之象為鼎，君子觀象，知法象器，形體端正且安重，以正其位也\n\n&1&\n##### 初六：鼎顚趾，利出否。得妾以其子，无咎。\n\n##### 象曰：鼎顚趾，未悖也。利出否，以從貴也。\n\n初六乃最下之位，與四爻相應，今居鼎時，有如趾之向上，顛也。鼎覆則趾顛，此非順道，反道而行之理，利於天下敗壞之時，乃可為也。\n居卑下而從陽如妾，妾之從夫，則可無咎。\n\n鼎顛覆趾在上時，背道而行，只利天下敗壞之際，棄惡而從貴也。\n/1&\n\n&2&\n##### 九二：鼎有實，我仇有疾，不我能即，吉。\n\n##### 象曰：鼎有實，慎所之也。我仇有疾，終无尤也。\n\n二位為中位，以剛居中，乃鼎中有物之實象，但於陰位，有能才而密比於陰之意，居此當求己之守正，不求於人，使之能求於我，則不正亦终就之，此吉也。\n\n鼎之有實，猶人之有才，必慎擇趨向，如往之不慎，必有對立之事，於此能自求守正，則彼必不能影響我，亦可無過矣。\n/2&\n\n&3&\n##### 九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。\n\n##### 象曰：鼎耳革，失其義也。\n\n九三相位，陽剛居之，乃正位，然五位之柔君不能與合，不信用之，其行必阻塞，道必不行。有才而不能得君祿命任用之時，君子必內其德，守其正道，終必吉。\n\n有才居相位，與君之念不合，乃失其義也，但上能明時，下之才必有能用，故吉。\n/3&\n\n&4&\n##### 九四：鼎折足，覆公餗，其形渥，凶。\n\n##### 自私心作用。\n\n##### 象曰：覆公餗，信如何也。\n\n四為君側之位，與初下爻相應，乃示初陰柔之小人不可用；其不勝任而敗事，猶鼎足折也。居大臣之位，所用非人，至於覆敗，此不勝任，其凶可知。成因在於任不適之才，必來\n\n當大臣之人，須成天下之治，如任人之不當，以招不信，乃誤也。\n/4&\n\n&5&\n##### 六五：鼎黃耳，金鉉，利貞。\n\n##### 象曰：鼎黃耳，中以爲實也。\n\n鼎之主在耳，執耳之意，有陽剛之體，又得其位，才必充實，乃能為大用，至善矣。\n\n##### 能執鼎耳之才，乃由其得中道也。\n/5&\n\n&6&\n##### 上九：鼎玉鉉，大吉，无不利。\n\n##### 象曰：玉鉉在上，剛柔節也。\n\n鼎之終，功成也，玉為剛而温，居成功之項，唯小心善處，剛柔適用，動靜不可過，乃生大吉。無所不利也。\n\n鼎以能終為功成，致成功之地，以剛柔之並用，有法度之，無不利也。\n/6&"},"100100":{"text.tab1":"此卦是李靜天師遇龍母借宿，替龍行雨，卜得之，官至僕射。\n\n#### 圖\n人在岩上立，一樹開花，一文書，一人推車上有文字，一堆錢財者。\n\n**震驚百里之課**\n\n**有聲無形之象**\n\n#### 雜\n\n**雜卦曰：震起也，艮止也。**\n\n#### 序\n\n**序卦曰：主器者，莫若長子，故受之以震。震者，動也。**\n\n鼎，器也，能主器者，必賴長子，震為長男，取其主器之義，故次鼎為震也，此卦二震相重，有奮發震驚之象，二雷相繼，重雷也。長子繼位為君也。\n\n#### 解\n• 一、人立岩上：特立獨行，摇摇欲墜也。危險也。\n• 二、一樹開花：有果也，惜乎過於短暫，少部份之人。\n• 三、一文書：消息至，公文至。\n• 四、一人推車：轉變之象，執行命令象。\n• 五、上有文字：得官令也。\n• 六、一堆錢財者：錢財散於地狀，憂心也，喪事也，求財不利，占疾病凶。","text.tab2":"生局之中，此局很特殊，未經吾派之人改，自然居此局中人，其必天生好手，在家為貴子無疑。\n• 一、 有承繼祖業，發揚光大之實力。\n• 二、 科甲興旺，名列前茅。\n• 三、 官運通順，只限未婚前。\n• 四、 從商亦吉，但須為負責人。\n• 五、 婚姻按命中走，紅鸞星動之年，即成婚之年。\n• 六、 須注意此局只現在婚前，婚後必不見。惟天卦可繼續其運勢。","text.tab3":"&0&\n**震：亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。**\n震之道，能奮發，動而進，知懼而進修，皆足以亨。當震動之來，恐懼不寧不安狀，知所戒懼，則可保安，故笑言和適貌。震聲遠及百里，人無不懼而喪失，唯執宗廟祭祀之器者，不喪失不懼也。人間之至誠，莫如於祭祀時之堅心守正。\n/0&\n\n#### 彖\n\n**彖曰：震亨，震來虩虩，恐致福也。笑言啞啞，後有則也。**\n震來時能知恐懼，則無患而能亨矣。此因能有戒懼反為福也，必恐而知自修，不敢 違於常理法規，因震而生法度，必能致福安，故可笑言無憂。\n\n震驚百里，驚遠而懼邇也。出可以守宗廟社稷，以爲祭主也。\n雷之嚮震百里，遠受驚而近受懼，人能知戒懼不妄為，則出可以長守宗廟社稷，能如是，則必可守承國家。\n\n#### 象\n\n**象曰：洊雷，震。君子以恐懼修省。**\n洊為重意，上下同卦故為洊雷，形容威震之大也，君子觀之乃知恐懼自修，畏天威省思已過而改之，唯君子能如是。\n\n虩虩，後笑言啞啞，吉。 象曰：震來虩虩虩虩，恐致福也，笑言#### 初九：震來虩虩啞啞，後有則也。\n&1&\n##### 初九：居震之始，知震之來，能於始即知戒懼恐慎，不敢掉以輕心，終必安吉。\n\n雷震之來知懼進修，此因知恐而終有福吉。不違於常法，則可保平安也。\n/1&\n\n&2&\n##### 六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。\n\n##### 象曰：震來厲，乘剛也。\n\n六ニ乃柔居正位，善處震時之道也，雷震乃剛動而上，無人能禦其威猛，度量知其必喪全數之資，故能遠避以自守其中正，以不追隨而得，雖不能立，即防禦，但時過後，必可得\n/2&\n\n&3&\n##### 六三：震蘇蘇，震行无眚。\n\n震之至剛而來，如欲駕乘，乃自招危厄。\n\n此如能知己力之不足而求去，亦可無咎。\n\n三位為陽位，陰居之，乃不正位也。不正位之人於平日，尚且不安，更何況處於震時居\n\n##### 象曰：震蘇蘇，位不當也。\n/3&\n\n&4&\n##### 九四：震遂泥。\n\n##### 象曰：震遂泥，未光也。\n\n以剛居柔，不適位而失去剛健之道，無法震奮也，如泥之滯也。\n\n震之動必以剛為本，今動如滯泥，已失剛道，震之義，必無法光大也。\n/4&\n\n&5&\n##### 六五：震往來厲，億无喪有事。\n\n##### 象曰：震往來厲，危行也，其事在中，大无喪也。\n\n君位之人居震動之時，必不失中道，即令危亦不為凶矣。中道勝於正道，有中道之人必不違於正道，正道卻不必一定為中道。此其差異所在也。\n\n震之動不以中，往来皆有危，其危之生，乃因失中之道，居此時，以無喪失為至善。\n\n處不當位，即震來而不知戒，不知恐懼也。\n/5&\n\n&6&\n##### 上六：震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎，婚媾有言。\n陰柔之人居震之極，驚懼至甚，無志抖索狀，其視瞻亦不能安定而明，其於此時，若動，必招凶。乃不明而動之戒。震之戒在不及身而及於鄰時己生戒心，則終無咎，如婚事之初有爭言，則己生戒心，莫俟及於身，已不及矣。\n/6&"},"001001":{"text.tab1":"此卦是漢高祖困榮陽時，卜得知，只宜守舊。\n\n#### 圖\n猴上東北字，猴執文書，官吏執鏡，三人繩相繫縛\n\n**游魚避網之課**\n\n**積小成高之象**\n\n#### 雜\n\n**雜卦曰：震起也，艮止也。**\n\n#### 序\n\n**序卦曰：物不可以終動，(動必/_)止之，故受之以艮。艮者，止也。**\n\n震乃動也，物之動其終必止，艮，止也，故為震之序卦。此卦上下皆艮，艮為山，故有安重堅實之象，外內皆止，皆靜，此止於其所也。人能知安於止，則得艮之道也。\n\n#### 解\n• 一、堠上東北字：候也，停滯等候也，陳姓。\n• 二、猴執文書：候其時，待公文命令至也。\n• 三、官吏執鏡：清明之法官，政治清明。\n• 四、三人繩相繫縛：三人相牽連招訟事也。","text.tab2":"• 一、 科甲順利，必中理想之學校。\n• 二、 健康平安，為孝子。\n• 三、 婚姻順利，進入八字中紅鸞星之年必婚。\n• 四、 公職大利。\n• 五、 知進退，為天生受人喜歡之人。","text.tab3":"&0&\n**艮其背，不獲其身，行其庭，不見其人，无咎。**\n艮為止之道，人之不知止，乃私欲作為，背為不見之處，如不能見，則無欲以亂其心志人能忘我，則止矣，今人見利則欲據為己有，失止之道。知止之道，則可無咎也。\n/0&\n\n#### 彖\n\n**彖曰：艮，止也，時止則止，時行則行，動靜不失其時，其道光明。**\n艮之道，言止也，動靜之間不以時，失止之義也，君子貴乎時，時可行則行，時之義於君子，則重視之，人能不失時，知所進退，道乃光明。\n\n艮其止，止其所也。上下敵應，不相與也。\n艮止之道，其功在能止於適止之所，此唯聖人能成之。此卦上下二體皆為山，有因同而相敵應也，互相背而不相與也。\n\n是以不獲其身，行其庭不見其人，无咎也。\n相背而不見，行不見其人，則欲無處生則能止，能止則無咎也。\n\n#### 象\n\n**象曰：兼山，艮，君子以思不出其位。**\n上下皆山，故為兼山，乃重艮之象，君子觀艮止之道，知思安於所止，不越其本位。\n\n&1&\n##### 初六：艮其趾，无咎，利永貞。\n\n##### 象曰：艮其趾 ，未失正也。\n\n初六居最下，乃足趾之象，趾乃人動之最先，於始動即知止，必可無咎，且須患己之性陰柔，故戒之在堅心守道。\n\n##### 能止於始初，必易，乃不失正也。\n/1&\n\n&2&\n##### 六二：艮其腓，不拯其隨，其心不快。\n\n##### 象曰：不拯其隨，未退聽也。\n\n陰居陰位，得止之正道，然居二位為猶人之腿肌位，股動則肌動，二雖正道，然受三爻之影響，即中正之道，無法救助於上位時，唯勉而隨之，因言不聽道不隨，故其心不快。\n\n上位之人，未能從下意，不須救助之，唯隨之可也。\n/2&\n\n&3&\n##### 九三：艮其限，列其夤，厲薰心。\n\n##### 象曰：艮其限，危薰心也。\n\n九三陽剛居陽位，乃意其剛極而使上下分隔，不復進退，其堅強如此，則必造成獨限一隅，而世人不相與，故無法安定其心。故止之道，貴在時宜，行止之間必以時，則吉。\n\n堅固己之剛性，不能因時知進退，必有危懼生其心內也。\n/3&\n\n&4&\n##### 六四：艮其身，无咎。\n\n##### 善其身，必無可取也。\n\n居君側之人，位高權重，然於艮止之時，當止而不能止，乃因君位過陽剛，不能信孚於臣位之人，居此際，惟自止其身，可無咎，但如臨施政，則生咎矣。意即在上位之人只能獨\n\n##### 象曰：艮其身，止諸躬也。\n居大臣之位，卻只能獨善其身，不能行止之道，乃不適其位也。\n/4&\n\n&5&\n##### 六五：艮其輔，言有序，悔亡。\n\n##### 象曰：艮其輔，以中正也。\n\n人之所當止者，唯言與行，今陰柔居君位，於止之時，其才不足任此位，如此則須言行一致，不可脱序，古言：君無戲言，即此，故雖己之才不足任此位，但謹言慎行，亦可無慮於敗亡。\n\n君位之人能止於中道，言行不脱序於中正之道，即令無足之才能，亦可免禍故易示人之言行之重要如是。\n/5&\n\n&6&\n##### 上九：敦艮，吉。\n\n##### 象曰：敦艮之吉 ，以厚終也。\n\n以剛陽之性居艮之終極，可見其止之道，性之堅實如此。常人於止之時，難於持久，晚節不保等事常見，人能敦厚知止，如此堅心，此所以吉也。\n\n人常於始能行止之道，至終則無法堅持到底，始終如一是易之神，艮致终能吉，乃因其能終守不變。\n/6&"},"001011":{"text.tab1":"此卦齊晏子應舉，卜得之，後果為丞相也。\n\n#### 圖\n一望竽在爽高處，一藥爐在地，一官人登梯，一枝花在地上。\n\n#### 雜\n\n**雜卦曰：漸女歸待男行也，歸妹女之終也。**\n\n#### 序\n\n**序卦曰：物不可以終止，故受之以漸。漸者，進也。**\n\n高山植木之課 積小成大之象艮止之後，必有所生，其生乃因前之有止，故此生必渐進，故渐為艮之序。渐，有渐進緩進之意，其進能緩，必有序，而不踰越。此卦上「巽」下「艮」\n，巽為木，而生於山上，此木之高乃因在山之上，故渐之道在知高之因，在知進退消息之理據。\n\n#### 解\n• 一、一望竿在爽高處：家人望歸象。\n• 二、 一藥爐在地：平安，無災也。\n• 三、一官人登梯：升官之象，衣錦還鄉也，棺也。\n• 四、一枝花在地：落第象，不久之象。","text.tab2":"• 一、 科甲不順，缺臨門一腳。\n• 二、 工作心念不定，常思變動。\n• 三、 身體平安，災少。\n• 四、 對婚姻不采主動，婚事難成。\n• 五、 出任公、教職大利。\n此局變化多，隨時成之故學者須注意。","text.tab3":"&0&\n**漸：女歸吉，利貞。**\n渐之道，其有序，且緩進，吾人可於女之出嫁而見之，女歸時，以渐進有序，必吉，且始終如一，更吉。猶臣之入朝侍奉天子亦同，必當有序，如失序則為欺陵主上，必生禍害。\n/0&\n\n#### 彖\n\n**彖曰：漸之進也，女歸吉也。進得位，往有功也。**\n渐乃論進之道，知進必有序，猶如女之歸夫，必吉。進時能剛柔並濟，適得其位，此進必有功也。進以正，可以正邦也。其位，剛得中也。止而巽，動不窮也。以正道而進，可以興邦正德也。故凡進皆須稟持以正道則吉。正得其位之定義，必以剛中而得，方可謂得位。內止外順，其人之進如此，方可得吉，如進之以欲，乃生燥，必失渐道，阻力乃生，故能做到內無欲，而外和順，此進方可無窮無盡矣。\n\n#### 象\n\n**象曰：山上有木，漸.，君子以居賢德善俗。**\n木在山上，其高有自，故君子觀渐象，乃知居賢能正德，美化風俗，其能成功，皆歸之在渐，人之錯習，遽改生反，教化之於人，勢必以渐進方可入於人心，此渐之道也。\n\n&1&\n##### 初六：鴻漸于干，小子厲，有言，无咎。\n\n##### 象曰：小子之厲，義无咎也。\n\n鴻鳥之以時而遷動，又群聚而生且有序，此渐也。初陰居卑下，上又無援助，君子知時，故處之不疑。但小人及無知之人只能見眼前之事，不知患於未來，洞察事理，唯以剛而求進，失渐矣，進則生咎，不進無災。\n\n初始時，雖有小人之危懼不安之心，但因於義理仍合，故有無咎。\n/1&\n\n&2&\n##### 六二：鴻漸于磐，飲食衎衎，吉。\n\n衎衎，不素飽也。\n##### 象曰：飲食衎衎\n\n柔居柔位，得中位得當，居渐之時，進必不速，穩若磐石狀，其能安居如此，故可飲食和樂，其吉必然。\n\n中正之人，得正位，適居之狀，能飲食安樂，心志愉快，不光是飽食而已。\n/2&\n\n&3&\n##### 九三：鴻漸于陸，夫征不復，婦孕不育，凶，利禦寇。\n\n##### 象曰：夫征不復，離群醜也，婦孕不育，失其道也，利用禦寇，順相保也。\n\n九三陽剛居下卦之上，即將進入上卦，意言，人之將上進之時，理應守正道以得時至，萬不可以欲而進，以遂私志，此己失渐道，猶為求進而不顧於道之夫，婦人受孕不以正，亦不可育同義，此凶即致矣。惟可堅守正道，摒除邪念，可得吉。\n\n夫但知征而不知復，乃因欲而失正道，叛離群類，可醜也。婦人之孕乃不正，故不可育也。皆因失其正道，唯利在堅守正道，棄絶邪惡，可因順正道而保平安也。\n/3&\n\n&4&\n##### 六四：鴻漸于木，或得其桷，无咎。\n\n##### 象曰：或得其桷，順以巽也。\n\n此陰柔在高位，下有陽剛欲進之人，必不得安處，猶鴻鳥近於木，立木高處，必不安也，如能立在横枝上，自處安寧，則可無災。\n\n此意求平安自寧之道，惟有順於義，行乎正，能如此者，何處會不安呢？\n/4&\n\n&5&\n##### 九五：鴻漸于陵，婦三婦不孕，終莫之勝，吉。\n\n##### 象曰：終莫之勝吉，得所願也。\n\n鴻鳥所止於至高之地，象君之尊位，此渐之時至，乃知惟下二爻位，可與同心同德，居中之三，四位相隔，猶即令婦人三年不孕，亦無用於事，相隔正道之不正，其終必消，正道必合，惟時較久而已。終吉。\n\n君臣以中正之道相交，其終必合，所願必遂也。\n/5&\n\n&6&\n##### 上九：鴻漸于陸，其羽可用爲儀，吉。\n\n##### 象曰：其羽可用爲儀，吉，不可亂也。\n\n鴻能飛於天上，毫無阻礙，人之賢能如此，進至終極，又不失渐之道，其賢能通達之能可以為表率，猶鴻之羽，可以用禮儀一樣，必吉。\n\n君子之進，必有以渐，有序渐循之，乃可以為吉，此進因不失序，故吉，序亂招凶。故可以為禮法而遵循之。\n/6&"},"110100":{"text.tab1":"此卦舜娶堯二女，卜得之，乃知卑幼不寧也。\n\n#### 圖\n官人騎鹿指雲，小鹿子在後，望竿上有文字，人落刺中，一人拔出。\n\n#### 雜\n\n**雜卦曰：漸女歸待男行也，歸妹女之終也。**\n\n#### 序\n\n**序卦曰：進必有所歸，故受之以歸妹。**\n\n浮雲蔽日之課 陰陽不交之象渐乃進也，人進必有所歸，所以歸妹次渐也，少女，人所悦也，雷為動，今如人之動以悦，此因悦而動，必有所不正，此卦澤上有雷，雷震而澤動，相從之象，男動在外而女從之在內，有女嫁歸男之象。人之動须以明，明而後動，方不失正。\n\n#### 解\n• 一、官人騎鹿指雲：浮雲蔽日，乘亂而欲進。\n• 二、小鹿子在後：生意人，隨從狀。\n• 三、望竿上有文字：旦夕而亡，揭竿而起，正名也。\n• 四、人落刺中：如鲠在喉，去之不得。\n• 五、一人拔出：一人相救示寵狀。\n• 六、此卦問病凶，問財吉，問政凶。","text.tab2":"現代人為愛滋病所苦，目前醫學界雖仍無法認定其必由同性戀傳染來的，我也不否定其是否正確，但可以肯定的是，其行為必不為父母所能接受的，此局無人發現，自古以來因道德束縛力很強，家族同住，故較不易發生，史有明載其斷袖之癖即言同性戀，但不似今日之普遍，世界各國皆為此苦惱不已，其實易經中早已明確指出其從何而來？為何有人如此，有人不苟同？如何化解？男同性戀出歸妹卦，女同性戀出益卦、旅卦、漸卦、鼎卦等變化較多，其化解只須正位即可改變。\n• 一、 男同性戀，父母煩憂，終致離家出走。\n• 二、 委曲以求祿。\n• 三、 無婚。\n• 四、 諸事不順，但多才多藝，走藝術路線佳。","text.tab3":"&0&\n**歸妹，征凶，无攸利。**\n此動之以悦，必有不當，如動反招凶，所往必不利。\n/0&\n\n#### 彖\n\n**彖曰：歸妹，天地之大義也。**\n此言陰陽之道，男女之配，乃天地間之常理也。有男居上女在下，陰從陽動。\n\n天地不交而萬物不興，歸妹，人之終始也。\n天地如不交則萬物必不生，女之從男，為生生之道，人類從男女之交而生，其終必不窮\n\n説以動，所歸妹也，征凶，位不當也。无攸利，柔乘剛也。\n此動之因喜悦對方為少女，人如只因悦而動，必失明之道，動必凶至。此不以正道，而以悦道，故位不當也。男女尊卑，夫唱婦隨，人之常理，如不以常道，惟私欲作與，柔勝於剛，所以凶也，往必不利矣。\n\n#### 象\n\n**象曰：澤上有雷，歸妹，君子以永終知敝。**\n君子觀雷震於澤上，澤隨雷而動，猶男女相配，生生不息之象，其有永終之戒，因物久後必生敝壞，君子於始初乃知戒敝壞之理，故凡事之長久而吉，必於初始即生戒故謂永終之戒。\n\n&1&\n##### 初九：歸妹以娣，跛能履，征吉。\n\n##### 象曰：歸妹以娣，以恆也。跛能履吉，相承也。\n\n娣，有賢良正德之義，女之嫁歸能如此，又知處卑順，然因其位卑，即令有賢才亦只能助夫而已，獨善其身，猶跛之能行，必無法及遠，但往乃得吉。\n\n女嫁歸男，能自處卑順，且悦於內，持之以恆，即令跛者行路，亦可以有吉，其因乃其能相承相助也。\n/1&\n\n&2&\n##### 九二：眇能視，利幽人之貞。\n\n##### 象曰：利幽人之貞，未變常也。\n\n九二乃陽剛之賢居正位，於歸妹之時，乃意女之賢能所配不良之人，猶如目眇之人，其視必不能及遠，此時惟隱藏其賢，且堅心以正禮，可利也。\n\n守其隱於內之才，堅心不變，此不失夫婦常久之道也。\n/2&\n\n&3&\n##### 六三：歸妹以須，反歸以娣。\n\n##### 象曰：歸妹以須，未當也。\n\n六三乃相位居陰柔之人，於歸妹時，以悦而求上應，不以正道，故必不得其歸，無所適從。必當反歸求處卑下，則可吉矣。\n\n女歸嫁男，如求己之须，無法求外應合，必不當也。\n/3&\n\n&4&\n##### 九四：歸妹愆期，遲歸有時。\n\n##### 象曰：愆期之志，有待而行也。\n\n四柔陽剛居之，即意處柔乃婦人之常道，但內有剛明之賢，處歸妹之時，因賢明又居高位，人所願娶，但卻有遲嫁之象，非不嫁也，乃待時而動，有佳配而後行也，此遲歸有時。\n\n此之延期所由皆己，不由他人，因己之有賢，故能如是。\n/4&\n\n&5&\n##### 六五：帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉 。\n\n##### 象曰：帝乙歸妹，不如其娣之袂良也，其位在中，以貴行也。\n\n六五居尊位之人，柔性象女，示女之高貴者，今居歸妹之期，雖為帝女，於歸時，乃得屈而謙降，故女之歸以能謙降為美德，但求於禮，不求於外飾，故猶月陰之盛，而不至於盈滿，此乃能為吉。女子尊貴之道即此。\n\n此尚禮而不尚外飾，為帝乙歸妹之道，五為柔而居尊位，乃有尊貴而又知能行中道之人也。\n/5&\n\n&6&\n##### 上六：女承筐无實，士刲羊无血，无攸利。\n\n##### 象曰：上六无實，承虛筐也。\n\n女歸之終至極時，乃承繼祖先祭祀之職，但至極則無實可祭，猶士人之割取羊血以祭禮，如割羊無血無以祭，必不利繼往也。\n\n女歸嫁之極處，以柔居之，猶空筐之無實，必不可以承祭祀，女終不可承繼也，必主人人離絶也。\n/6&"},"101100":{"text.tab1":"此卦莊周説劍，臨行卜得之，果得劍也。\n\n#### 圖\n竹简灰起，龍蛇交錯者，官人著衣裳立，一合子，人吹笙竿，腳踏虎。\n\n**日麗中天之課**\n\n**藏暗向明之象**\n\n#### 雜\n\n**雜卦曰：豐多故也，親寡旅也。**\n\n#### 序\n\n**序卦曰：得其所歸者，必大，故受之以豐。豐者，大也。**\n\n萬物與人能適得所歸，必能成大，故歸妹之後，受之以豐，豐有盛大之義，此卦上震下離，有內明外動之象，能以明而動，動而能明，此為致豐之道，是故明而能照，動而能亨，可以致豐大也。\n\n#### 解\n• 一、竹简灰起：簡姓，竹有順象，堅節不變之象，灰起，中空之象。\n• 二、龍蛇交錯：辰巳之年，正邪相爭，蛇虺乃毒謀暗算也。\n• 三、官人著衣裳立：官人、倌人、丈夫也，藏於內也。\n• 四、一合子：先成後破。\n• 五、人吹笙竿：閒情逸志，主喜事臨門。\n• 六、腳踏虎：臨危不亂也，險在下也。\n• 七、旱沼之旁：心力交瘁也。\n• 八、池中無水：旱象，破財也。\n• 九、珠落盤中：先聚後散也。","text.tab2":"此卦常出現在兒子身上一、 未經本派之人指點，乃自然居此局中之人，其與同時生人不同，婚事必先成後破。\n• 二、 科甲考試順利。\n• 三、 性剛且堅，易與人爭，必為感情困擾。\n• 四、 從商必破財。\n• 五、 從官職吉。","text.tab3":"&0&\n**豐：亨，王假之，勿憂，宣日中。**\n豐之道，在能致亨通，能令天下百姓致豐，唯王者能。豐之道在令人民繁盛，事物豐發，有如日中之明，無所不照，則可以無憂。\n/0&\n\n#### 彖\n\n**彖曰：豐，大也，明以動，故豐。王假之，尚大也。**\n豐之道，在論如何盛大，能明而動，必能成豐盛且大也。王者所追求之，為能及天下之大，致人民以豐，必可永保其治世之道。\n\n勿憂宜日中，宜照天下也。\n致豐之道，能如日中之盛明，普照天下，無所不及，如此則可無憂，而能保其豐大及永久也。\n\n日中則昃，月盈則食，天地盈虛，與時消息，而況於人乎？況於鬼神乎？\n日正當中，也有暗時，月滿之後亦有缺虧，天地之盈虛，靠時為消息，更何况乎人？何沉\n\n乎鬼神？此君子戒之在盛，知盛時须戒，方可長久。\n\n#### 象\n\n**象曰：雷電皆至，豐，君子以折獄致刑。**\n電雷並行，乃明動相濟，成豐之象，君子觀明動之象，知用刑制法，在求明與威並行，君子能明則無折獄，慎於用刑。能立威則民服無怨。\n\n&1&\n##### 初九：遇其配主，雖旬无咎，往有尚。\n\n##### 象曰：雖旬无咎，過旬災也。\n\n初進之陽剛，居豐之時，知往有豐，雖非有君之對應，但有其左右高位之人能與同志，此往可吉也，所謂「同舟能共濟也」\n，此於豐之時，可得無咎也。\n\n聖人知時之所至，順時而為，能知降己以相求，若懷己之私意，必招患至。\n/1&\n\n&2&\n##### 六二：豐其蘚，日中見斗，往得疑疾，有孚發若，吉 。\n\n##### 則君之昏蒙可開，如此則吉矣。\n\n##### 象曰：有孚發君，信以發志也。\n\n六二乃柔將其位，又居明卦之中，為至明之才，但因所遇之君不明，而無法下求於己，若居豐時，意往而求其君能明己才，必招致猜妒疑惑。惟有盡己之至誠，以求其感而能發，\n\n用己之至誠孚實，以求發上之知信，如可成，則吉必至矣。\n/2&\n\n&3&\n##### 九三：豐其沛，日中見沫，折其右肱，无咎。\n\n##### 象曰：豐其沛，不可大事也，折其右肱，終不可用也。\n\n九三乃居相位有賢才之人，於豐時，卻不見明主之相應，其日之晦更甚於六二將位，故有如人之折肱無法於行，賢能之人有才，但無法發揮乃因君之不明，故無可歸咎也。\n\n豐之時，不見上用，無法成大事，猶人折其肱，終無法受重用。\n/3&\n\n&4&\n##### 九四：豐其薜，日中見斗，遇其夷主，吉。\n\n##### 象曰：豐其蔀，位不當也。日中見斗，幽不明也。遇其夷主，吉行也。\n\n九四為陽剛之人居君側大臣之位，遇君不明，其賢能陽剛受圍，如日中有缺晦，不得其用，亦無用也，故君子之才須得遇明主，方可有用能成濟世之功。\n\n有才能卻受圍困，無法致豐，乃位不適當也。豐之時，又有幽暗之處必因君不明，臣位又不適當而造成。惟求遇明主，吉乃可行。\n/4&\n\n&5&\n##### 六五：來章，有慶譽，吉。\n\n##### 象曰：六五之吉，有慶也。\n\n陰柔居君之尊位，己之才不足，但知用下位章美之才，必有福慶，且有美譽故吉。\n\n君位能吉，於豐之時，必可有吉慶及於天下。此因君能用才也。\n/5&\n\n&6&\n##### 上六：豐其屋，蔀其家，窺其户，闋其無人，三歲不覿，凶。\n\n##### 象曰：豐其屋，天際翔也，窺其户，闃其无人，自藏也。\n\n上六居丰極之時，因處動之終，必燥動，人於丰盛之時，必假謙虛方吉。如不知戒盛，外丰其居，內不明，暗藏其家，又目中無人，三年又不知變，一意孤行，终自招凶。\n\n人處豐之極，不知謙卑，目中無人，猶鳥之翔於天際，不知己才之不足，居高自傲，必招人棄絶，其致如此，乃不知自藏也。\n/6&"},"001101":{"text.tab1":"此卦陳後主得張麗華，卜得之，乃知先喜後悲。\n\n#### 圖\n三星者，貴人台上垂釣牽水畔人，一猴一羊，大溪者。\n\n**始鳥焚巢之課**\n\n**歡極哀生之象**\n\n#### 雜\n\n**雜卦曰：豐多故也，親寡旅也。**\n\n#### 序\n\n**序卦曰：窮大者，必失其居，故受之以旅。**\n\n豐至極時，不知戒盛，乃失其居，故序卦為旅。此卦「離」上「艮」下乃外明內止之象，山為止而不動，火行而不居，有不與同流之意。故為旅象，又人之旅，必外麗，亦旅象。\n\n#### 解\n• 一、三星者：三台貴人，相位之人。\n• 二、貴人台上垂釣：君主相求，老闆相求人才。\n• 三、牽水畔人：賢能之人，離野入朝封候。或慕權勢而變志。\n• 四、一猴一羊：肖猴，肖羊，候、楊姓人，未申年應之。\n• 五、大溪：脱險也，港口也，水側也。","text.tab2":"此局特殊，學者須識。\n• 一、 科甲興旺二、 女身男態三、 婚事不成，須逢肖羊、肖猴或于未、申之年方有成。\n• 四、 城府較深，終自取咎。","text.tab3":"&0&\n**旅：小亨、旅貞吉。**\n旅之時，此因不同流而旅，故有小亨，且得之堅心，必吉。切不可假旅之道而有私欲其中。\n/0&\n\n#### 彖\n\n**彖曰：旅，小亨，柔得中乎外而順乎剛，止而麗乎明，是以小亨，旅貞吉也。旅之時義大矣哉！**\n旅之時至而旅，乃有亨，人能知所進退，內有中道外又知順於剛，止之在能外麗而內明，是故有小亨，旅而堅貞其志，是故吉也。當旅不旅乃自求咎。故天下之事，當有時宜，因時而動，其義大也。\n\n#### 象\n\n**象曰：山上有火，旅。君子以明慎用刑，而不留獄。**\n火在山高處，其明及遠，旅之道也。君子觀此明照之象，知明慎以用刑，絶不依持己之明，必有戒慎恐懼之心而施於用刑。因火行不留，故有不留獄之志，獄乃不得已而設，故不求留獄，此觀火之行而體悟之。\n\n&1&\n##### 初六：旅瑣瑣，斯其所取災。\n\n##### 象曰：旅瑣瑣，志窮災也。\n\n陰柔無才之人，居卑下，居旅之時，因才質如此，故必畏畏瑣瑣，其必終自取其辱。\n\n意志因困窮時，而生變，乃自取其災也。\n/1&\n\n&2&\n##### 六二：旅即次，懷其資，得童僕貞。\n\n##### 象曰：得童僕貞，終无尤也。\n\n六二乃得適位之將才居旅時，因知中正處不失當，必能懷蓄財資，又能得僕人之忠心，故吉。\n\n旅行之人，所賴者為童僕，能得其忠心，必可無災。\n/2&\n\n&3&\n##### 九三：旅焚其次，喪其童僕，貞厲。\n\n##### 象曰：旅焚其次，亦以傷矣，以旅與下，其義喪也。\n\n旅之時，必以柔順謙下為吉，如今自處過剛，又居高，乃招致災困。必失僕人之忠，終有危厲來臨。\n\n居旅時以過剛自高，手下必喪失忠心，危之至矣。\n/3&\n\n&4&\n##### 九四：旅于處，得其資斧，我心不快。\n\n##### 象曰：旅于處，未得位也，得其資斧，必未快也。\n\n陽剛又居柔位，有用柔之象。人居旅時，能柔，得旅之道，必吉。此法居旅時可得財货之資助，但不能伸其大志，其心必不快。\n\n以剛居柔，合於旅之道，故旅時為善，但欲得行其志，卻不能也。心必不快。\n/4&\n\n&5&\n##### 六五：射雉，一矢亡，終以譽命。\n\n##### 象曰：終以譽命，上逮也。\n\n人於旅時，不可有錯，一但犯之，災禍立至。就如射雉，能一箭而中，不虛發即無過失，能如此，則於旅時，必可立名揚譽。\n\n旅之時，能令上下皆應，則可吉。其因旅之時乃困而未得其安之時為旅。\n/5&\n\n&6&\n##### 上九：鳥焚其巢，旅人先笑後號咷，喪牛于易，凶。\n\n##### 易於喪失，只一疏忽而己。故凶。\n\n旅時以過陽剛自處以高，不知謙卑，就如鳥高飛而自焚其巢，故終居無所安處，自負過剛，居旅時，始則可快意盡情，故生笑。繼而失安無居所，故後號咷。牛為順性之物，但也\n\n##### 象曰：以旅在上，其義焚也。喪牛于易，終莫之聞也。\n旅時以居高自處，必不能保安，猶鳥之焚巢，喪失順德極易，待凶至，乃不知自聞知也。\n/6&"},"011011":{"text.tab1":"此卦范蠡辭官入湖，卜得之，乃知越國不久也。\n\n#### 圖\n貴人賜衣，一人跪受，雲中雁傳書，人在虎下坐。一人射虎中箭，虎走。\n\n**風行草偃之課**\n\n**上行下放之象**\n\n#### 雜\n\n**雜卦曰：兌見而巽伏也。**\n\n#### 序\n\n**序卦曰：旅而無所容，故受之以巽。巽者，入也。**\n\n巽者，入也。處旅時，親人不在，惟能巽順，方可平安，無所不入。故巽次旅也。此卦一陰居二陽之下，乃有陰順於陽象。\n\n#### 解\n• 一、貴人賜衣：先破後成象。\n• 二、 一人跪受：貴綬也。如占疾病，則主壽衣，凶象。\n• 三、雲中雁傳書：意外喜訊。\n• 四、人在虎下坐：身處險而不知。\n• 五、一人射虎中箭：貴人相救。\n• 六、虎走：脱險，寅年也。\n<u>又虎乃有威望之人，利武官，主人在虎邊進退不得之時。亦言虎將須知功成身退，否則暗箭難防，以明哲保身為吉。</u>","text.tab2":"此局大利未婚女，吾每逢有未婚小姐來求教，都不厭其煩的希望他能住在此局中，必主婚姻幸福。\n• 一、 科甲興旺，考試必中。\n• 二、 逢凶化吉，災事不興。\n• 三、 婚姻必能嫁好夫婿，逢紅鸞即動。\n• 四、 性情穩定，處憂不懼。\n• 五、 健康平安之人。","text.tab3":"&0&\n**巽：小亨。利有攸往，利見大人。**\n巽順之道，得之可以小亨。故論柔之順性，能如此，利往進，可見貴人，必助。\n/0&\n\n#### 彖\n\n**彖曰：重巽以申命。剛巽乎中正而志行，柔皆順乎剛，是以小亨。利有攸往，利見大人。**\n巽之重卦，有上順下亦順象，苟能上順中道以出命，下順命而服從，則必吉。故君子申復命令，乃知巽也。能知順乎剛且中正，即令才不足亦可以小亨。能得巽順之道，必無往不入可出世見大人也。\n\n#### 象\n\n**象曰：隨風，巽。君子以申命行事。**\n物之隨風而動，巽之道也，君子觀巽象，乃知重復申令之重要，能有政令，上隨下以順服，上下皆順，即重巽之象，為始切實，故重申命令。\n\n&1&\n##### 初六：進退，利武人之貞。\n\n##### 象曰：進退志疑也，利武人之貞，志治也。\n\n居巽順之時，又處卑下，以陰柔之質，必畏而不安，無所適從，故此時惟利於武官，從武職之人，其巽赈必吉也。\n\n進退不知所安，其志必疑且懼，故堅心服從，利於武職之人，不生貳心。\n/1&\n\n&2&\n##### 九二：巽在床下，用史巫紛若，吉， 象曰：紛若之吉，得中也。\n无咎。\n九二乃示剛居陰位，外又有巽順之象，意即人有過於卑順之時，不是恐懼就是諂媚，皆非正也。但其雖非正禮，亦可遠恥辱，去怨隙，亦可為吉，就如同用誠意來通於神明之史巫，其誠意能通，亦可無過。\n\n人能得中道，亦以至誠，則人必信之，吉而無咎。\n/2&\n\n&3&\n##### 九三：頻巽，吝。\n\n##### 象曰：頻巽之吝，志窮也。\n\n九三為下卦之上極，剛居之，有剛亢之質，居巽順之時，非真能順，乃出於勉強為之，必有所失，失後又頻順，頻順又再失，亦可卑吝也。\n\n陽剛之才，本非能順巽，今處重巽之時，因勢不能遂志，又必須以順，故必有所失，其志必困窮。\n/3&\n\n&4&\n##### 六四：悔亡，田獲三品。\n\n##### 象曰：田獲三品，有功也。\n\n六四僅乃陰柔居陰，此位居下之上，乃居上位而知順下，人能如此善處，必可不慮亡。\n猶田之收獲能遍及上下，能如此，何慮悔亡更且有功。\n\n巽能通於上下，如田之獲，上下受惠，此巽順之功。\n\n必始終如一方可。\n/4&\n\n&5&\n##### 九五：貞吉，悔亡无不利，无初有終，先庚三日，後庚三日，吉。 象曰：九五之吉，位正中也。\n陽居陽位又處君位，此為巽之主，其命令，必合於中正之道，天下黎民莫不順從。能始終如此，必無往不利，如命令之出，有須變更時，改始之不善，成終之善，則可變更，其中道，\n\n九五之尊，能處之吉，乃因能得中正之道，過與不及皆不善。\n/5&\n\n&6&\n##### 上九：巽在床下，喪其資斧，貞凶。\n\n##### 象曰：巽在床下，上窮也，喪其資斧，正乎凶也。\n\n床，人之所安處也。今在床下，有過於安之義，九為巽極，乃過於柔順，乃喪失剛斷，必失居所，乃自失也，對正道而言為凶。\n\n居上之極本為陽剛，今卻過於巽順，必失正道，為凶道。\n/6&"},"110110":{"text.tab1":"此卦唐三藏去西天取經，卜得之，乃知必歸唐國。\n\n#### 圖\n人坐看一堆擔，月在天邊，秀才登梯，一女在合邊立，文字上箭。\n\n**江湖養物之課**\n\n**天峰雨澤之象**\n\n#### 雜\n\n**雜卦曰：兌見而巽伏也。**\n\n#### 序\n\n**序卦曰：入而後說之，故受之以兌。兌者，說也。**\n\n巽者，入也，物能相入，必有相悦方成，故兌為巽之序。\n\n#### 解\n• 一、人坐看一擔：任務完成狀，有人相助象，助人為樂之貴人。\n• 二、月在天邊：清明之治。\n• 三、秀才登梯：金榜登科象。\n• 四、一女在合邊立：女人介入，先成後破。\n• 五、文字上箭：得機而發，射：發象。","text.tab2":"• 一、 求婚事必不成，感情複雜又專一不二，如遇虎狼之人必傷害甚大。\n• 二、 有待婚中，夫凶之象，婚比同時生人，延後三年。\n• 三、 科甲順暢，多才藝之女。\n• 四、 公職順遂，但從商必主不利。\n• 五、 體健無災，母蔭重，有無父之虞。","text.tab3":"&0&\n**兌：亨，利、貞。**\n兌之道，可以致亨。人能悦於物，物亦相悦，必足以亨。然兌之道在貞正，求悦不以正道，必成邪吝，終致悔咎。\n/0&\n\n#### 彖\n\n**彖曰：兌，説也，剛中而柔外，説以利貞，是以順乎天而應乎人，説以先民，民忘其勞，説以犯難，民忘其死，説之大，民勸矣哉。**\n兑，悦也。外柔內剛，中心誠實之象，悦之道可亨，乃因其能貞正。上順天理，下應人心，能使民以悦，則民忘勞苦，且欣然為國犯難。忘其生死，此悦之道至極矣，民莫不信之。\n\n#### 象\n\n**象曰：麗澤，兌，君子以朋友講習。**\n兩兌相重，即兩澤互麗，交相浸潤，互有滋益之象，君子觀之乃知朋友講習，互相增益，為天下之大悦，有互相明益之象。\n\n&1&\n##### 初九：和兌，吉。\n\n##### 象曰：和兌之吉，行未疑也。\n\n初雖陽剛，但因居卑下，乃知卑下和順，此悦必無所偏私，此兌之正道，故吉。\n\n初位必隨時順處，心無所欲，惟求能和而已，是以吉也。其行必未有可疑。\n/1&\n\n&2&\n##### 九二：孚兌，吉，悔亡。\n\n##### 象曰：孚兌之吉，信志也。\n\n二位有剛中之德，內實孚信，雖近小人，但不失君子之道，悦而不失剛中之德，所以能吉而不慮亡矣。\n\n君子之悦，自心中之至誠，故必不失道，小人之悦，必忘形而自失不知。\n/2&\n\n&3&\n##### 六三：來兌，凶。\n\n##### 象曰：來兌之凶，位不當也。\n\n陰棄居陽剛之位，不適也，比得兌之道不以中正，為悦而求悦，人之有求必因私欲，己離正道，故凶。\n\n柔居陽剛，自處必不中正，和欲而求悦，必招凶。\n/3&\n\n&4&\n##### 九四：商兌未寧，介疾有喜。\n\n##### 象曰：九四之喜，有慶也。\n\n陽剛處陰位，居不中正，故有未決，未能定也。居兑之時，不為悦所惑，能知命守剛正，疾惡去仇，必能得君之信，而有喜也。\n\n九四君側之人能有喜慶，必来自君之信孚，得遂行其陽剛之志也。\n/4&\n\n&5&\n##### 九五：孚于剝，有厲。\n\n##### 故於此設戒。\n\n九五君位得中正之道，居悦時，乃可盡善，但聖人復設戒於有厲，即雖中正聖賢在上，天下仍有小人，為免惑於悦，小人之入而不自知，\n\n##### 象曰：孚于剝，位正當也。\n居悦知剝之戒，人於事始知戒，可以無災咎也。\n/5&\n\n&6&\n##### 上六：引兌\n\n##### 象曰：上六引兌，未光也。\n\n悦之至極則愈悦，故言引兌。天下萬事過之皆不宜,有凶至。\n\n悦之至極，已太過於事理，其果必不能更光也。\n/6&"},"010011":{"text.tab1":"此卦漢武帝，卜得之，乃知李夫還魂也。\n\n#### 圖\n山上有寺，一僧，一人隨後，一鬼在後，金甲人。\n\n**順水行舟之課**\n\n**大風吹物之象**\n\n#### 雜\n\n**雜卦曰：渙離也，節止也。**\n\n#### 序\n\n**序卦曰：說而後散之，故受之以渙。渙者，離也。**\n\n兌，悦也，人悦時，則必舒散，渙、散也，故渙為兌之序。人之性憂則結聚，悦則舒散。\n此卦上巽下水，乃風行水上，水遇風則渙散，故渙為散也。\n\n#### 解\n• 一、山上有寺：出家狀，對峙狀，寸土寸金象。\n• 二、僧：化外之人，光頭人，曾姓人。\n• 三、一人隨後：逃避，求助化外之人。\n• 四、一鬼在後：為禍追緝之象，內心有鬼，處事不明象。\n• 五、金甲人：正義之師，得民心也。\n• 六、寺，土頭人作對。等待時機也。","text.tab2":"渙局亦常見之，吾人利用風卦可立解。\n• 一、心在宗教，不想結婚，但易入邪道。\n• 二、心中有鬼，諸事不成。\n• 三、禍事連連，官非牢獄災難免。\n• 四、出家化解災厄，母親終日擔憂。","text.tab3":"&0&\n**渙：亨。王假有廟，利涉大川，利貞。**\n渙，散也。人會離散，本於中心一念，心離則散矣。故能治散，必從中入手，有能收拾人心，散可聚矣，故散之道論如何用散，故可以亨。君王能知立宗廟收人心，則必可前進無阻，故須堅心到底。\n/0&\n\n#### 彖\n\n**彖曰：渙，亨。剛來而不窮，柔得位乎外而上同。**\n渙之道所以可致亨，以卦來言，用陽剛之法，不可致極剛，以居下位，又得中道，柔位而得五君位之相應，故居渙時，能守其中，必不至於離散，所以能亨。\n\n王假有廟，王乃在中也。利涉大川，乘木有功也。\n君王能利用宗廟收拾人心，乃知用中道之妙，能如此可往天下，無處不阻也，自古以來，能得民者，必得其心，方可謂得民矣。\n\n#### 象\n\n**象曰：風行水上，渙。先王以享于帝立廟。**\n風行水上，渙散之象。先王觀渙之象知，救天下之散，惟有祭祀宗廟，收合人心，合心之道，莫大於此。\n\n&1&\n##### 初六：用拯馬壯，吉。\n\n##### 象曰：初六之吉，順也。\n\n初爻，為渙之始，陰柔居不正，又處卑下，故於始時即察知而拯，只須託於陽剛之人，即可整渙，故吉。\n\n初六之能吉，乃因於渙始即察知，始而拯，此得時也故吉。\n/1&\n\n&2&\n##### 九二：渙奔其機，悔亡。\n\n##### 象曰：渙本汁其機，得願也。\n\n外飾順，內實險憂，心已散。九二居坎險中位，乃意於渙散時，又居險中，其險可知，如能知機而奔往不猶豫，方可不慮亡也。\n\n渙之時居險，必以知機而親近之，乃可得願矣。\n/2&\n\n&3&\n##### 六三：渙其躬，无悔。\n\n##### 象曰：渙其躬，志在外也。\n\n六三相位，今才為陰質，不適居位，於渙散之時，必無法拯救他人，只能止於其身，可以無悔矣。\n\n渙時，以躬順求上同。可免己之災。\n/3&\n\n&4&\n##### 六四：渙其群，元吉。渙有丘，匪夷所思。\n\n##### 象曰：渙其群，元吉，光大也。\n\n六四乃大臣之位，今有九五君來同應，有君臣合力，以濟天下之渙散，能如此則有大功。\n方渙散之時，用剛則必不能使之懷附，用柔又不足使其依歸，故如能使大聚，此事必難，用必非常法，能成此大功，非聖賢何能如是乎？\n\n元吉謂大功德也，君臣合力於渙時，能群聚民眾，其功可光大也。\n/4&\n\n&5&\n##### 九五：渙汗其大號，渙王居，无咎。\n\n##### 象曰：王居无咎，正位也。\n\n九五君位，居渙之時，以陽剛正德又得巽之外順，此深得處渙之道，必能號令人民，民心信服而從矣，如汗之於體外，息息相關，民與君之關係能如此，則必能居王位而無咎。\n\n君位尊，而其才德又適其位，稱王可無咎，因合於正位。\n/5&\n\n&6&\n##### 上九：渙其血，去逖出，无咎。\n\n##### 象曰：渙其血，遠害也。\n\n渙至極時，仍能守巽順之道，即令有傷，亦仍可出險，遠離災害而無災矣。\n\n渙散至極，即令血出傷害。以堅守巽順之道，必遠離禍害也。\n/6&"},"110010":{"text.tab1":"此卦是孟姜女送寒衣，卜得之，知夫落亡不吉之兆。\n\n#### 圖\n大雨下，火中魚躍出，雞在屋上，犬在井中，屋門開著。\n\n#### 雜\n\n**雜卦曰：渙離也，節止也。**\n\n#### 序\n\n**序卦曰：物不可以終離，故受之以節。**\n\n船行風黃之課 寒暑有節之象渙者散也，物不可以終散，必當節止，故渙之後以節卦為序。此卦「澤」上有「水」\n，澤為有限之水地，如再置水，當滿不容，故有節制之象。\n\n#### 解\n• 一、大雨下：陰暗不明，凶象。\n• 二、火中魚躍：飛騰而徒勞無功，又餐飲業。\n• 三、雞在屋上：酉年肖雞人，解救之時與人。\n• 四、犬在井中：招陷，動彈不得，不知節制而招如此。\n• 五、屋門開著：仍可開張，须雞人來助大吉。","text.tab2":"• 一、本人肖雞，則必大貴。\n• 二、本人肖犬，則以小做大，招自陷。\n• 三、財無積餘，行險招兇。\n婚事不成，犬人遇雞則成，妻長一歲，與同時生人不同，且妻主大貴，助夫渡厄。","text.tab3":"&0&\n**節：亨，苦節，不可貞。**\n節之道，在有制，萬事如知節，必可亨。節之貴在中庸，如限制太過則苦，如節至於苦，必不可常久也，人事如此。\n/0&\n\n#### 彖\n\n**彖曰：節亨，剛柔分，而剛得中。**\n節之道能致亨通，乃因知剛柔並濟，能剛又且能適中，此節之能亨。\n\n苦節不可貞，其道窮也。\n如節之致於苦極，必無法堅固守志，則節道必招困窮也。\n\n説以行險，當位以節，中正以通。\n此以卦才言，外險內悦，以能悦且又知止，此為節之大義，常人於悦時不知止，遇艱險方思止。當位居尊之人如明節之道，必能中正且亨通矣。今人之權力欲望無盡，居尊不思止，悦而無限，終必至凶，乃不知節之道，明矣。\n\n天地節而四時成，節以制度，不傷財，不害民。\n天地之間有節道故四季分明，聖人觀之知立制度，以為節道，所以必不傷財害民，此法治觀念之始，聖人立此道，即因知人之欲望無限，故以節制之，免流於人治，必因私欲，而終致勞民傷財。\n\n#### 象\n\n**象曰：澤上有水，節，君子以制數度，議德行。**\n澤之容水有限，故節。君子觀之，知節以制度來限制，下定義來區分君子小人之行為。\n\n&1&\n##### 初九：不出户庭，无咎。\n\n##### 象曰：不出户庭，知通塞也。\n\n陽剛之性居節之初，必不能節，如居門庭之內，則可無咎。\n\n不出户庭可以無咎，但須知外之言與行，必以時來定進退之機。\n/1&\n\n&2&\n##### 九二：不出門庭，凶。\n\n##### 象曰：不出門庭凶，失時極也。\n\n剛陽之性，居陰柔之位，爻義為，處陰且不正之人居當節之時，不知節必合於中道，過與不及皆非節，如此即令不出門庭，亦會招凶。\n\n時之義在易中最為重要，不知節之義，又居節之時，失其時，因不合中道之節，過與不及皆不對，即令不出門庭，亦有凶矣。\n/2&\n\n&3&\n##### 六三：不節若，則嗟若，无咎。\n\n##### 象曰：不節之嗟，又誰咎也？\n\n三爻本剛，今陰柔居之，須剛斷而柔性之人居其位，因其柔順，且知自節乃可順於義行，亦可以無過。\n\n知節可以免過失，故不知自節而招禍，又能怪誰呢？\n/3&\n\n&4&\n##### 六四：安節，亨。\n\n##### 象曰：安節之亨，承上道也。\n\n陰居陰位，其正位，於節時，即居高位且有節之象，能安於此，則亨通。\n\n能行節之中道，且安居於此，必亨通義。\n/4&\n\n&5&\n##### 九五：節，吉，往有尚。\n\n##### 象曰：甘節之吉，居位中也。\n\n九五尊位，乃居節時之主位，能甘之如飴，盡節之道，必吉，功大矣。\n\n君王能知節道，用節且甘如飴，必成大功，因其居尊位故也。\n/5&\n\n&6&\n##### 上六：苦節，貞凶，悔亡。\n\n##### 象曰：苦節貞凶，其道窮也。\n\n上六乃居節之極，其必因節致苦，如堅守不改則必凶，終致亡而悔，易之節卦悔亡，與他卦之悔亡，辭同但意不同也。\n\n因節致苦，不知變，失易之神，其凶乃因道之窮盡。\n/6&"},"110011":{"text.tab1":"此卦辛君屯邊，卜得之，遂果得梅妃之信也。\n\n#### 圖\n望子上文書，人擊柝，貴人用繩牽鹿雁啣書。\n\n**鶴鳴子和之課**\n\n**事有定期之象**\n\n#### 雜\n\n**雜卦曰：小過過也，中孚信也。**\n\n#### 序\n\n**序卦曰：節而信之，故受之以中孚。**\n\n人有節，而後有信，故中孚次之。節本有節制，不可過越之意，人能信而後行之，上位知信守，下位知信從。此卦澤上有風，風行于澤上能感於水為中孚之象，此因一 、二爻位，五六爻位，皆實陽，而三、四爻位，為中虛之象，全卦有外實中虛之義，此中孚之象。\n\n#### 解\n• 一、望子上文書：科甲高中，刑法更吉。\n二 、人擊柝：預警也。\n• 三、貴人用繩牽鹿：守成，不可攻也。\n• 四、雁啣書：喜事將至，有南徙之象。\n• 五、人立庭中：蒞庭也，防官司或打官司保身也。","text.tab2":"有女每試必為狀元，即生此局之人\n• 一、科甲狀元，每考必中。\n• 二、武職大利，女中豪傑，今見有女司法官如此。\n• 三、雙喜同臨，常在婚姻中伴之而來金榜登科。\n• 四、喜事初不成，家中不同意，後成。但與同時生人延後三年。","text.tab3":"&0&\n**中孚：豚魚吉，利涉大川，利貞。**\n中孚之道，其中心之誠信，能使豚魚都有感，則無所不至矣。故利涉大川，週行無限也\n/0&\n\n#### 彖\n\n**彖曰：中孚，柔在内而剛得中。**\n中孚之中虛乃至誠之象。此示意剛之道能得中正，故吉。\n\n説而巽，孚乃化邦也。豚魚吉，信及豚魚也。\n上位以至誠而順從於下，下位以至誠以求上悦，由其中孚之至誠，必教化邦國，此信能令豚魚皆感，此道之至善也。\n\n利涉大川，乘木舟虛也。中孚以利貞，乃應乎天也。\n中孚道之吉，猶乘舟渡川，內無實物，不虞覆船，即處艱困，能以中孚則必可亨通，能堅守中孚之道，此天道之極至也。\n\n#### 象\n\n**象曰：澤上有風，中孚，君子以議獄緩死。**\n風在澤上，澤有感于風，因水體本虛，故風能入。君子觀之，知人心虛，則物必感之，此中孚之象，君子于議獄，本為盡忠而已。於決死之際，但求緩之，寬之。\n\n&1&\n##### 初九：虞吉。有它，不燕。\n\n##### 象曰：初九虞吉，志未變也。\n\n陽剛居始進，於中孚之道並非了解，人初志必不定，故如能以愚誠信之，且專一之志，若生異志，必不得安矣。\n\n始信之時，志未能從，但能愚誠專一至信，則吉矣，故吾人初始，必求能為己所信之道，方以愚誠，如此方不致迷。\n感之，能化邦國。\n/1&\n\n&2&\n##### 九二：鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。\n\n##### 其子和之，中心願也。\n\n內剛外柔，陽居陰位，中孚之感，因外柔必能感通，猶鶴鳴於幽谷，人不聞也，而其子必應和，乃心感通也。故能中心孚誠，千里能\n/2&\n\n&3&\n##### 六三：得敵，或鼓或罷，或泣或歌。\n\n子能與合，乃中心誠意能通故也。\n而不知吉凶，此非長才之君。\n\n柔居陽剛之位，居位高但才不能濟，故勢必唯所信而從，其外在之鼓張，罷廢悲泣，歡歌皆因導於內心之所信，因才不足，故只有信，\n\n##### 象曰：鼓鼓或罷，位不當也。\n/3&\n\n&4&\n##### 六四：月幾望，馬匹亡，无咎。\n\n##### 象曰：馬匹亡，絕類上也。\n\n近君之位，以柔順得信，其盛必如月之滿盈。即同類同屬亡失，亦可無咎。\n\n求上之孚信，即令同類亡，亦不顧而求，此所以吉也。\n/4&\n\n&5&\n##### 九五：有孚孿如，无咎。\n\n##### 象曰：有孚孿如，位正當也。\n\n君位之人，以中孚至誠之道，感通天下，民心之信服，固結如抽掣也。\n\n五居君位以陽剛，用中正之道，天下民心固結信服，其稱位如此，君之道乃能致極矣。\n/5&\n\n&6&\n##### 上九：翰音登于天，貞凶。\n\n##### 象曰：翰音登于天，何可長也？\n\n中誠孚信致於極，有信終則衰，華美其外，內無忠篤，猶翰音登天，不知止之，貞固如此，不知變，乃自招凶。孔子曰：好信不好學，此敝也贼。意即固守而不通也。\n\n守誠信至窮極而不知變，必不能長久？此固守不知變之戒，招凶至矣。\n\n居不適位，無所心主，惟能從於所信而已。\n/6&"},"001100":{"text.tab1":"此卦漢君有難，卜得之，後果脱險也。\n\n#### 圖\n明月當空，林下一人彈冠，人在網中。\n一人割網，猴子在山頭出。\n\n**飛鳥遺音之課**\n\n**上逆下順之象**\n\n#### 雜\n\n**雜卦曰：小過過也，中孚信也。**\n\n#### 序\n\n**序卦曰：有其信者，必行之，故受之以小過。**\n\n人之有信後必行，行則生過，故小過所以為中孚序也。此卦山上有雷，雷震於高處，其聲必過，故為小過。小過者，可說為小事過，亦可説為過之小也。\n\n#### 解\n• 一、明月當空：政清狀，入法庭，刑堂。\n• 二、林下一人：林姓人。\n• 三、人陷網中：不得脱身，受束縛。\n• 四、一人彈冠：求去之象，但求去為形，束縛為神，合則有表裡不一狀。\n• 五、一人割網：貴人解救，脱困狀。\n• 六、猴子在山頭：從新開始之課(候再出山)。","text.tab2":"此局很多，吾人常不自知陷於局中。\n• 一、感情困擾，擺脫不了情關，為情不顧一切，此小人也。\n• 二、肖猴，候姓人不忌。\n• 三、無法工作，神魂顛倒。\n• 四、常過失傷人，故婚事不成。","text.tab3":"&0&\n**小過：亨，利，貞。**\n過之意在過其正常也。如矯枉過正，此過為就正意。時不正，用過之道使正，此過之吉處，吾人須知過之道，知用過之時機方如是。\n\n可小事，不可大事，飛鳥遺之音，不宜上，宜下，大吉。\n用過之道，乃為求中正。其過之限，可用小事，於大事不可用過。故曰不宜上，宜下，順之則吉，乃過能順理，吉反更大也。\n/0&\n\n#### 彖\n\n**彖曰：小過，小者過而亨也。過以利貞，與時行也。**\n小過之道，在過之小，有時當過，過而能致亨，過之能吉矣。但用過之道，須配合時機，乃意當過則過，此非真過矣，此為以過養正也。\n\n柔得中，是以小事吉也，剛失位而不中，是以不可大事也，有飛鳥之象焉。\n小過之道，處小事之過，可得吉。但不可做大事，因剛失位又不得中，故不可以用在大事上，故有飛鳥之象，鳥飛之事小，過而餘音，但無災也。\n\n飛鳥遺之音，不宜上宜下，大吉，上逆而下順也。\n事之有過，當從其宜。如人之過恭，過哀，過儉，其太過，則不可。其過當如飛鳥之遺音，\n\n其聲出，而身己過，事之過當如是，則吉宜。此順道之過，故也。\n\n#### 象\n\n**象曰：山上有雷，小過。君子以行過乎恭，喪過乎哀，用過乎儉。**\n雷震於山上，其聲至，而雷已過，故為小過，君子觀象，知天下事，有時當過，但不可過甚。故為小過，當過而過，乃其宜也。\n\n&1&\n##### 初六：飛鳥以凶。\n\n##### 象曰：飛鳥以凶，不可如何也。\n\n陰柔居下位，為小人之象，小人本躁易動，今逢小過時，乃得理不饒人，其行為之過。必速且遠，救之莫及也，故凶。\n\n過之疾，如鳥之速，必救之不及，無有作為也。\n/1&\n\n&2&\n##### 六二：過其祖，遇其妣，不及其君，遇其臣，无咎。\n\n及過之太過，反凶。\n\n二與五爻位，其猶祖之象，今陰柔居其位，越過三，四位，直與五相應，有越位之戒，今逢該過之時，如過越位，仍不失臣道，亦可無咎。於其他之卦，越過本位凶，但今於小過，乃意當過之時，可過，無災，切忌失君臣之道，\n\n##### 象曰：不及其君，臣不可過也。\n下臣遇须過之時，可過越其上位，但不可至君位，至君前，則太過，過一爻可無咎。\n/2&\n\n&3&\n##### 九三：弗過防之，從或戕之，凶。\n\n##### 象曰：從或戕之，凶如何也。\n\n陽居正位，於小過之時，意味手下無能，又為陰之小人蒙蔽。此時須過防之。如不加強防範，必招害。君子防小人之道，以正己為先，堅守正道也。\n\n小人道盛，必害於君子。當防而不防，必傷矣。\n/3&\n\n&4&\n##### 九四：无咎，弗過遇之，往厲必戒，勿用永貞。\n\n##### 象曰：弗過遇之，位不當也，往厲必戒，終不可長也。\n\n剛居柔位，以剛而用柔，其剛必不過也。\n故無災咎。剛陽之道居小過時，須戒之隨宜，不可固守不變，故君子隨時順處，不固守其常也。\n\n陽剛居柔位，不當位時，於當過之時，能不過剛反柔，乃得其宜，於自保可也，但終不可成長至盛，故往則有危，須戒之。\n/4&\n\n&5&\n##### 六五：密雲不雨，自我西郊，公弋取彼在穴。\n\n##### 象曰：密雲不雨，已上也。\n\n此陰柔居君位，居當過之時，乃不夠陽剛，故雖欲過，但不能成功。故猶如密雲而不成雨，其不成功，即令越過其位向二爻相應，三、四爻位不應，亦如同密雲集中，而無法成雨\n\n陽下陰上，合則成雨，今陰已在上，即令雲再密，無陽而不成雨，終無功也。\n/5&\n\n&6&\n##### 上六：弗遇過之，飛鳥離之，凶，是謂災眚。\n\n##### 象曰：弗遇過之，已亢也。\n\n六居小過之極，居過之極，不顧正理，必違常道，遠矣，故凶，必招人為災害也，此於天理人事皆同。\n\n居過之終，失正理之甚，乃過至亢極，故招凶致。\n/6&"},"101010":{"text.tab1":"此卦季布在周家潛藏，卜得之，遂遇高皇帝\n\n#### 圖\n人在岸上一船來，一堆錢，雲中雨下，二小兒在雨中行，文書一策。\n\n**舟楫濟川之課**\n\n**陰陽配合之象**\n\n#### 雜\n\n**雜卦曰：既濟定也，未濟男之窮也。**\n\n#### 序\n\n**序卦曰：有過物者，必濟，故受之以既濟。**\n\n小過乃過於物，能過於物，必能相濟，故受之以既濟。此卦，水在上，火在下，火水相交，則能為用，能互為用，即為既濟，此卦言，天下萬事，己互濟之時也。\n\n#### 解\n• 一、人在岸上：泣也，等待也，無目的也。\n• 二、一船來：接引至也。\n• 三、一堆錢：財祿無用也，憂心忡忡也，有竊象，抄家之象。\n• 四、雲中雨下：陰中有果也，夜間至凌晨時。\n• 五、二小兒：主喜也，二人也，二人雨中行也。\n• 六、文書一策：證件，命令也，資料也。","text.tab2":"此局吾常用於化解困卦之局一、不重財貨，天性如此。\n• 二、官運人吉，從商亦得財，故財官雙美。\n• 三、科甲亦吉，利考試。\n• 四、先有子，後有婚，如加上命中有妾，則必主正房一子，偏房一子。\n• 五、婚姻會比同時生人慢八年，也常先有妾後有婚。\n故吾人知如此，常俟事業安定後，用雷卦化解婚姻問題。","text.tab3":"&0&\n**既濟：亨小，利貞，初吉，終亂。**\n既濟之時大事必能亨通，然須知小事亦须亨通，方可為吉，必須所有事皆吉，否則濟至極時，終亂。\n/0&\n\n#### 彖\n\n**彖曰：既濟亨，小者亨也。利貞，剛柔正而位當也。**\n陰陽能皆得位，故為既濟，但須無所不亨，乃可也，且貞固守之。\n\n初吉，柔得中也。終止則亂，其道窮也。\n其以柔順文明之中道，故可成既濟之功，至既濟之極，若不知變通，必生亂，其亂之生乃因道至盡窮。\n\n#### 象\n\n**象曰：水在火上，既濟，君子以思患而豫防之。**\n水火即交，各有其用，為互濟，時當既濟，君子觀象知於既濟之時，必先思慮患害之生，使不至成禍患也。自古以來，天下由治而亂，乃皆因居治不思亂時之戒。\n\n&1&\n##### 初九：曳其輪，濡其尾，无咎。\n\n##### 象曰：曳其輪，義无咎也。\n\n倒曳輪，使不再進。獸之涉水，必舉高其尾，使尾不濕方可進，無災至。\n\n於既濟大吉之時，能知止進，則必不至極時，故必無咎也。\n/1&\n\n&2&\n##### 六二：婦喪其茀，勿逐，七日得。\n\n##### 象曰：七日得，以中道也。\n\n陰居正位，得五君位應，其志必得遂行，但中正之道，不可廢也，猶婦人出門用茀遮己今喪其茀，則不行，能自守不失，道必復也。\n待時之至。\n\n因中正之道非不可用，乃時之未至，於此時自守其中，俟時至必能行矣。\n/2&\n\n&3&\n##### 九三：高宗伐鬼方，三年克之，小人勿用。\n\n##### 象曰：三年克之，憊也。\n\n以剛居剛位，居既濟時，其君主威武必令民心服。但若專肆威武，必令民心忿而不服，殘害人民，貪人民之富，故有小人勿用之戒，因惟小人其威武必為滿足其私欲，君子戒之。\n\n既濟之時，必濟天下，於高宗可也，乃因其心為民，道必正，如為己之私欲，則三年民必疲憊而終忿矣。\n/3&\n\n&4&\n##### 六四：繻有衣袽，終日戒。\n\n##### 象曰：終日戒，有所疑也。\n\n四近君位，陰柔居之，乃適其任，當既濟之時，須如行舟，戒之滲漏，始漏則塞以衣物，且終日戒懼不怠，則必可免患。\n\n當既濟之時，必疑其患之將至，其戒懼之心如此，謹慎如此。\n/4&\n\n&5&\n##### 九五：柬鄰殺牛，不如西鄰之禴祭，實受其福。\n\n##### 時，方可得易之神明矣。\n\n九五至尊君位，陽剛人居此，當既濟之時，必以至誠信孚如祭祀之誠，則即令薄禮之祭，也可勝於豐厚之祭，由其至誠之心使然也。易之不重形，而重神，此明而顯矣，故論易須知\n/5&\n\n&6&\n##### 上六：濡其首，厲。\n\n##### 象曰：東鄰殺牛，不如西鄰之時也，實受其福，吉大來也。\n既濟之時，能得時者，即令薄祭，亦可有大吉之福至，此言時之可貴也。\n\n##### 象曰：濡其首厲，何可久也。\n\n既濟至極時，必不安而危，今陰柔居之，居坎險之上，即既濟之終，小人居之，其敗壞必立可見矣。\n\n藭盡之須以水淋其首，其必不可長久也。\n/6&"},"010101":{"text.tab1":"此卦孔子穿九曲明珠未徹，卜得之，乃遇二女方始得穿也。\n\n#### 圖\n一人提刀斧，一虎坐，一旗卓在山上，一人取旗，梯子有到字。\n\n**碣火求珠之課**\n\n**憂中望喜之象**\n\n#### 雜\n\n**雜卦曰：既濟定也，未濟男之窮也。**\n\n#### 序\n\n**序卦曰：物不可窮也，故受之以未濟終焉。**\n\n物必不會終盡，故以未濟為易卦之終。既濟為物之終，易為變易而不盡，有生生之意，故未濟為其序。未濟為未窮盡也，此卦，上離下坎，火在水上，互不為用，為未濟之時義。\n\n#### 解\n• 一、一人提刀斧：劉姓，武官，手有生殺之權。\n• 二、一虎坐：肖虎人，王姓，虎坐乃無威之象。\n• 三、一旗卓在山上：揭竿而起，正義之師。\n• 四、一人取旗：代替也，高姓，宋姓，其人取代之象。\n• 五、梯子有至字：無刀日至，桎梏受困象。\n• 六、（附註：峪：谷姓。旗揚：楊姓。)有谷、楊合乃招凶象。","text.tab2":"• 一、女身男態，性剛易怒。\n• 二、肖虎女子，必枯坐無成。\n• 三、劉、宋、高等姓人從武吉。\n• 四、婚事必不成，與同時生人婚時不同。\n• 五、從商求財是非多，甚而官司、爭執不下。","text.tab3":"&0&\n**未濟：亨。小狐汔濟，濡其尾，无攸利。**\n未濟之時，亦有亨通之道。假如小狐不知慎，逞其壯勇，渡河不知慎，其終必不能濟，故無所利矣。\n/0&\n\n#### 彖\n\n**彖曰：未濟亨，柔得中也。小狐汔濟，未出中也。**\n未濟之時，能亨通，乃因其柔居中得其時，慎處之於未濟時，可以亨通也。如小狐之果敢於渡河，如不憂其尾濕，必不可脱險也。\n\n濡其尾，无攸利，不續終也。雖不當位，剛柔應也。\n其進雖勇，因尾濡而不能進，故不利往也。若能慎重處之，剛柔並濟則雖不當位，亦有可濟之理處。\n\n#### 象\n\n**象曰：火在水上，未濟，君子以愼辨物居方。**\n火在水上，互不相交，此為未濟，君子觀象知，乃處不當之象，應慎處事物，辨其所當，各居其位，止於其所。\n\n&1&\n##### 初六：濡其尾，吝。\n\n##### 象曰：濡其尾，亦不知極也。\n\n陰柔居下位，居未濟之時，求力進猶獸之渡河，必揭其尾，方可渡，此言人不度量其才而進，終必不濟，終招吝鄙也。\n\n不度其才而力進，乃不知至極點也。\n/1&\n\n&2&\n##### 九二：曳其輪，貞吉。\n\n##### 象曰：九二貞吉，中以行正也。\n\n陽剛居將位，有欲動之象，今居未濟之時，有以剛凌柔水來勝火之象，故須知止，如曳車之輪使其止進，如此可吉。戒之在剛過，如此則犯上，其終必凶。\n\n九二能吉，乃因其能得中道，行之正，不過剛，犯上，故也。\n/2&\n\n&3&\n##### 六三：未濟，征凶，利涉大川。\n\n##### 象曰：未濟征凶，位不當也。\n\n居未濟之時，柔居相位，在下卦之上，有領導之象，但才不足濟，居險而無才足以出險，如此而行，其必招凶致。惟俟時至，俟上位之才相應，再涉險而出，乃可出險。\n\n陰柔無能之才居領導之相位，處未濟時，動必有凶，仍因其位不適。\n/3&\n\n&4&\n##### 九四：貞吉 ，悔亡，震用伐鬼方，三年有賞于大國。\n\n##### 象曰：貞吉悔亡，志行也。\n\n陽剛之賢才，居於君側，上為中虛明順之君，故能濟天下之艱困，能伐鬼方示其力之大，三年後乃有大功受國封賞。\n\n賢相之才，能與時合，且貞固心志，必能吉而不慮悔亡也。\n/4&\n\n&5&\n##### 六五：貞吉 ，无悔，君子之光，有孚，吉。\n中虛而明之才居君之尊位，能虛其心任剛賢之相為輔佐，且信任之而不悔，此處之至善，即令己才不足，但亦由中心孚誠，終必大吉。\n\n##### 象曰：君子之光，其暉吉也。\n/5&\n\n&6&\n##### 上九：有孚于飲酒，无咎，濡其首，有孚失是。\n陽剛居極，在中虛卦之上，乃示其剛且明，能如此，則必不生燥，決之以明，明能洞察事理，剛能行事，然居未濟之時，因無可濟之理，故成樂天順命而已，可以無災。如過於禮法，濡其首，亂如是，其必不知反省，則示不安於所居也。\n\n君子之能如是，則其功之光必明且亮，其光盛而吉也。\n\n##### 象曰：飲酒濡首，亦不知節也。\n飲酒而至於弄濕其首，乃過樂也，必不能安於命，此不知命節制，必失其常理，人能安處劣勢，必能守其心志。此理之至然。\n/6&"}};

/// standalone localStorage utilities ///
const _LS_SAVES = 'yc_saves', _LS_CFG = 'yc_config', _LS_HEX_OV = 'yc_hex_ov';
function _lsLoadSaves(){
  const s = localStorage.getItem(_LS_SAVES);
  if(s !== null) return JSON.parse(s);
  localStorage.setItem(_LS_SAVES, JSON.stringify(_EMBEDDED_SAVES));
  return JSON.parse(JSON.stringify(_EMBEDDED_SAVES));
}
function _lsSave(entry){ const r=_lsLoadSaves(); r.push(entry); localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsFavo(time,favo){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){x.favo=favo;break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsDelete(time){ localStorage.setItem(_LS_SAVES,JSON.stringify(_lsLoadSaves().filter(r=>r.time!==time))); _srcSetClean('saves',false); }
function _lsGetConfig(){ const s=localStorage.getItem(_LS_CFG); if(s) return JSON.parse(s); const {hexagrams,...cfg}=_EMBEDDED_CONFIG; return JSON.parse(JSON.stringify(cfg)); }
function _lsSaveConfig(cfg){ localStorage.setItem(_LS_CFG,JSON.stringify(cfg)); }
function _lsGetHexOv(){ const s=localStorage.getItem(_LS_HEX_OV); return s?JSON.parse(s):{}; }
function _lsApplyHexOv(num,field,text){
  const val = field==='ci' ? text.split('\n') : text;
  const ov = _lsGetHexOv(); const k = String(num);
  if(!ov[k]) ov[k]={};
  ov[k][field] = val;
  localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
  _srcSetClean(['text.tab1','text.tab2','text.tab3'].includes(field)?'md':'cfg', false);
}
const _SRC_CANONICAL = {md:'text.md',cfg:'config.json',saves:'saves.json'};
function _esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function _validateCfg(cfg){
  if(typeof cfg !== 'object' || cfg === null || Array.isArray(cfg)) throw new Error('config.json must be a JSON object');
  const ti = cfg.trigram_info;
  if(typeof ti !== 'object' || ti === null || Array.isArray(ti)) throw new Error('Missing "trigram_info"');
  for(const k of ['000','001','010','011','100','101','110','111']){
    const t = ti[k];
    if(!t) throw new Error(`trigram_info missing key "${k}"`);
    if(typeof t.name !== 'string') throw new Error(`trigram_info["${k}"] missing "name"`);
    if(typeof t.sym  !== 'string') throw new Error(`trigram_info["${k}"] missing "sym"`);
    if(typeof t.color!== 'string') throw new Error(`trigram_info["${k}"] missing "color"`);
  }
  const tn = cfg.tab_names;
  if(typeof tn !== 'object' || tn === null || Array.isArray(tn)) throw new Error('Missing "tab_names"');
  for(const k of ['tab1','tab2','tab3']){ if(typeof tn[k] !== 'string') throw new Error(`tab_names missing "${k}"`); }
  const sp = cfg.shibo_probs;
  if(typeof sp !== 'object' || sp === null || Array.isArray(sp)) throw new Error('Missing "shibo_probs"');
  const bin = sp.binary;
  if(typeof bin !== 'object' || bin === null || Array.isArray(bin)) throw new Error('shibo_probs missing "binary"');
  for(const k of ['0','1']){ if(typeof bin[k] !== 'number') throw new Error(`shibo_probs.binary missing key "${k}"`); }
  const quat = sp.quaternary;
  if(typeof quat !== 'object' || quat === null || Array.isArray(quat)) throw new Error('shibo_probs missing "quaternary"');
  for(const k of ['6','7','8','9']){ if(typeof quat[k] !== 'number') throw new Error(`shibo_probs.quaternary missing key "${k}"`); }
}
function _srcStatus(){

  const mode = bitRowMode === 'quaternary' ? 'quaternary' : 'binary';

  setMsg(T('msg.shibo_progress', done), 'success');

    for(let i=0;i<6;i++) state[i] = shiboBuffer[i];
    if(bitRowMode === 'quaternary') deriveState01();
    renderAll();
    const _savedBits = [...shiboBuffer];
    doQuery().then(()=>{
      _lsSave({ bits: _savedBits, time: new Date().toISOString(), shibo: true, favo: false });
      flashBtn('btnSave');
      setMsg(T('msg.shibo_done', _savedBits.join(' ')), 'success');

      updateSettingsBtn();

function updateTrigrams(){

  const lower=src.slice(0,3).join(""), upper=src.slice(3,6).join("");

function setBitRowMode(m){

    for(let i=0;i<6;i++) state[i] = state[i] ? 7 : 8;

(function(){
  const el = document.getElementById('msgBox');
  let fadeTimer = null, clearTimer = null;
  function cancelTimers(){ clearTimeout(fadeTimer); clearTimeout(clearTimer); fadeTimer = clearTimer = null; }
  function fitError(){
    el.style.fontSize = '';
    if(!el.textContent.trim()) return;
    let size = 0.85;
    while(el.scrollHeight > el.clientHeight && size > 0.45){
      size = Math.round((size - 0.05) * 100) / 100;
      el.style.fontSize = size + 'rem';
    }
  }
  new MutationObserver(function(){
    cancelTimers();
    el.style.transition = 'none';
    el.classList.remove('msg-fading');
    el.offsetHeight; // force reflow — snaps opacity to 1 instantly
    el.style.transition = '';
    fitError();
    if(!el.textContent.trim()) return;
    fadeTimer = setTimeout(function(){
      el.classList.add('msg-fading');
      clearTimer = setTimeout(function(){
        el.className = 'msg'; // 重置至初始（移除 msg--success/error 及 msg-fading）
        el.textContent = '';
      }, 10000);
    }, 3000);
  }).observe(el, {childList:true, characterData:true, subtree:true});
})();

// 之卦(state_1)：老陰/老陽翻轉，靜爻不變

}

/* ── Markdown 渲染（處理自定義子集：###/####/#####標題、**粗體**、倪曰注釋、漢字序號條目） ── */
function renderInline(s){
  return s
    .replace(/&&(.+?)\/&/g,'$1')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\{([^|{}]+)\|([^|{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function renderMD(text, statuses=null){
  if(!text) return '<p class="body-line" style="color:#5a4020;">'+T('content.empty')+'</p>';
  text = text.replace(/&&(.+?)\/&/g,'$1');
  let html = '';
  let inSub = false;
  let sectionOpen = false;
  function closeSub(){ if(inSub){ html += '</div></div>'; inSub=false; } }
  for(const raw of text.split('\n')){
    const line = raw.trim();
    if(!line){ html += '<br>'; continue; }
    if(line === '&N&'){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      if(statuses){
        html += '<div class="ci-section ci-section-dim">';
        sectionOpen = true;
      }
      continue;
    }
    const om = line.match(/^&(\d+)&$/);
    if(om){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      if(statuses){
        const st = statuses[parseInt(om[1])] || 'b';
        html += '<div class="ci-section ci-section-'+st+'">';
        sectionOpen = true;
      }
      continue;
    }
    if(line === '/N&' || /^\/\d+&$/.test(line)){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      continue;
    }
    if(line.startsWith('##### ')){
      html += '<div class="yao-heading">'+renderInline(line.slice(6))+'</div>';
    } else if(line.startsWith('#### ')){
      closeSub();
      const name = line.slice(5).trim();
      const jieAttr = name==='解' ? ' data-jie' : '';
      html += '<div class="sub-section" data-mode="full"'+jieAttr+'>';
      html += '<div class="sub-heading"><span>'+renderInline(name)+'</span>'
            + '<button class="section-toggle" onclick="toggleSection(this)">▼</button></div>';
      html += '<div class="sub-section-body">';
      inSub = true;
    } else if(line.startsWith('### ')){
      closeSub();
      html += '<div class="sec-heading">'+renderInline(line.slice(4))+'</div>';
    } else if(line.startsWith('**') && line.endsWith('**') && line.length > 4){
      html += '<div class="bold-title">'+renderInline(line.slice(2,-2))+'</div>';
    } else if(line.startsWith('> ') || line === '>'){
      const body = line.startsWith('> ') ? line.slice(2) : '';
      html += '<p class="annotation">'+(body.trim() ? renderInline(body) : '&nbsp;')+'</p>';
    } else if(line.startsWith('• ')){
      const rest = line.slice(2);
      const sep = rest.search(/[、.：:]/);
      if(sep !== -1){
        const label = rest.slice(0, sep + 1);
        const body  = rest.slice(sep + 1);
        html += '<div class="content-item"><span class="item-num">'+label+'</span>'+renderInline(body)+'</div>';
      } else {
        html += '<div class="content-item">'+renderInline(rest)+'</div>';
      }
    } else if(/^!\[([^\]]*)\]\(([^)]+)\)$/.test(line)){
      const im = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
      const alt = _esc(im[1]);
      const src = _esc(im[2]);
      const isPdf = /\.pdf(#|$)/i.test(im[2]);
      const media = isPdf
        ? '<p class="media-missing">'+src+'</p><iframe class="md-pdf" src="'+src+'" title="'+alt+'" onload="this.previousElementSibling.style.display=\'none\'"></iframe>'
        : '<img src="'+src+'" alt="'+alt+'" onerror="_mediaErr(this)">';
      html += '<figure class="md-image">'+media
            + (alt ? '<figcaption>'+alt+'</figcaption>' : '')
            + '</figure>';
    } else {
      html += '<p class="body-line">'+renderInline(line)+'</p>';
    }
  }
  closeSub();
  if(sectionOpen) html += '</div>';
  return html;
}



// 根據変爻數決定哪條爻辭為「斷（a）」哪條為「參考（b）」，其餘 dim
// s0/s1 各有 8 格：[0]=卦辭 [1~6]=初~上爻辭 [7]=用九/用六（乾坤專用）
// yi=変爻索引（升序），nfi=非変爻索引（升序）
// 決定規則（來自占卜筮数文件）：
//   0変 → a=本卦卦辭
//   1変 → a=本卦 該変爻辭
//   2変 → a=本卦 上変爻辭，b=本卦 下変爻辭
//   3変 → a=本卦卦辭，b=之卦卦辭
//   4変 → a=之卦 最低非変爻辭，b=之卦 次低非変爻辭
//   5変 → a=之卦 唯一非変爻辭
//   6変 → 乾/坤：a=本卦用九/用六；其他卦：a=之卦卦辭
function computeGuaxiangSlots(){
  const yi=[],nfi=[];
  for(let i=0;i<6;i++){
    if(state[i]===6||state[i]===9) yi.push(i);
    else nfi.push(i);
  }
  const n=yi.length;
  const s0=Array(8).fill('dim'),s1=Array(8).fill('dim');
  if(n===0){ s0[0]='a'; }
  else if(n===1){ s0[1+yi[n-1]]='a'; }
  else if(n===2){ s0[1+yi[n-1]]='a'; s0[1+yi[0]]='b'; }
  else if(n===3){ s0[0]='a'; s1[0]='b'; }
  else if(n===4){ s1[1+nfi[0]]='a'; s1[1+nfi[1]]='b'; }
  else if(n===5){ s1[1+nfi[0]]='a'; }
  else{
    // 乾（全陽）或坤（全陰）才有 ci[7]（用九/用六）
    const qk=state_0.every(v=>v===1)||state_0.every(v=>v===0);
    if(qk) s0[7]='a'; else s1[0]='a';
  }
  return {s0,s1,n};
}

function applyTabAvailability(entries){
  for(const [m, enabled] of entries){
    enabled ? tabDisabled.delete(m) : tabDisabled.add(m);
    document.getElementById(TAB_BTN[m]).classList.toggle('tab-disabled', !enabled);
  }
  if(!tabDisabled.has(currentTab)) return;
  const idx = TABS.indexOf(currentTab);
  let fallback = null;
  for(let d = 1; d < TABS.length && !fallback; d++){
    if(idx + d < TABS.length && !tabDisabled.has(TABS[idx + d])) fallback = TABS[idx + d];
    else if(idx - d >= 0     && !tabDisabled.has(TABS[idx - d])) fallback = TABS[idx - d];
  }
  if(fallback){
    setTab(fallback);
  } else {
    setMsg(T('msg.no_tab'), 'error');
    document.getElementById('contentArea').innerHTML = '';
  }
}

// 加權隨機：依 {值: 權重} 字典抽取一個值
function weightedRandom(weights){
  const entries = Object.entries(weights);
  let r = Math.random() * entries.reduce((s,[,w])=>s+w, 0);
  for(const [val,w] of entries){ r-=w; if(r<=0) return parseInt(val); }
  return parseInt(entries[entries.length-1][0]);
}

let PROB_LABELS = { binary:{}, quaternary:{} };
const _gv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const PROB_COLORS = {
  binary: { '0':_gv('--c-dim'), '1':_gv('--c-gold') },
  quaternary: { '6':_gv('--y6-tx'), '7':_gv('--y7-tx'), '8':_gv('--y8-tx'), '9':_gv('--y9-tx') }
};
const PROB_GLINT_DELAY = { '6':'0s', '7':'1s', '8':'2s', '9':'3s' };
function fmtPct(v, total){
  if(total <= 0) return '—';
  const pct = v / total * 100;
  const p4 = Number(pct.toPrecision(4));
  return (p4 === pct ? String(pct) : pct.toPrecision(4)) + '%';
}
function pctColor(mode, k){
  return PROB_COLORS[mode][k] || '#c9a84c';
}

function settingsRender(editing){
  if (editing) _editSessionSnapshot = JSON.parse(JSON.stringify(shiboProbWeights || shiboProbDefaults));

  let html = '';
  for(const mode of ['binary','quaternary']){
    const entries = Object.entries(w[mode]);
    const total = entries.reduce((s,[,v])=>s+Number(v), 0);
    const keys = entries.map(([k])=>k).join(',');
    html += `<div class="prob-section-label" style="display:flex;justify-content:space-between;align-items:center;">

      ${editing ? `<span class="prob-denom">${T('settings.total')}<span id="total_${mode}">${total}</span></span>` : ''}
    </div>`;
    for(const [k, v] of entries){
      const label = PROB_LABELS[mode][k] || k;
      const color = pctColor(mode, k);
      const pct = fmtPct(Number(v), total);
      html += `<div class="prob-row">
        <span style="display:flex;align-items:center;gap:6px;">
          <span class="prob-name">${label}<span style="font-family:monospace">（${k}）</span></span>

        </span>`;
      if(editing){
        html += `<input class="prob-input" id="prob_${mode}_${k}" type="text" inputmode="numeric" value="${v}"
          oninput="settingsUpdateTotal('${mode}','${keys}')">`;
      } else {
        html += `<span class="prob-frac">${v}/${total}</span>`;
      }
      html += `</div>`;
    }
  }
  html += `<div class="settings-actions">`;
  if(editing){
    html += `<button class="settings-btn-action" onclick="settingsRender(false)">${T('btn.cancel')}</button>
             <button class="settings-btn-action" onclick="settingsReset(true)">${T('btn.confirm_reset')}</button>
             <button class="settings-btn-action primary" onclick="settingsSave()">${T('btn.save_action')}</button>`;
  } else {
    html += `<button class="settings-btn-action" onclick="settingsRender(true)">${T('btn.edit')}</button>
             <button class="settings-btn-action" onclick="settingsShowPresets()">${T('btn.preset')}</button>`;
  }
  html += `</div>`;
  const _sc = document.getElementById('settingsContent');
  _sc.innerHTML = html;
  fitBtnText(_sc);
}

function settingsSelectPreset(idx) {
  const p = shiboProbPresets[idx];
  if (!p) return;
  const w = JSON.parse(JSON.stringify(shiboProbWeights || shiboProbDefaults));
  w[p.mode] = Object.fromEntries(Object.entries(p.probs).map(([k,v])=>[k, Number(v)]));
  shiboProbWeights = w;
  settingsRender(false);
  setMsg(T('msg.preset_applied', p.name), 'success');
}

function settingsUpdateTotal(mode, keys){
  const ks = keys.split(',');
  const total = ks.reduce((s,k)=>{
    const el = document.getElementById(`prob_${mode}_${k}`);
    return s + (parseInt(el.value) || 0);
  }, 0);
  document.getElementById(`total_${mode}`).textContent = total;
  for(const k of ks){
    const el = document.getElementById(`prob_${mode}_${k}`);
    const v = parseInt(el.value) || 0;
    const pctEl = document.getElementById(`pct_${mode}_${k}`);
    if(pctEl){
      pctEl.textContent = fmtPct(v, total);
      pctEl.style.color = pctColor(mode, k);
    }
  }
}

function renderSaveDropdown(records){
  _saveRecords = [...records].reverse();
  const dd = document.getElementById('saveDropdown');
  if(!_saveRecords.length){
    dd.innerHTML = `<div class="save-dropdown-empty">${T('history.empty')}</div>`;
    return;
  }
  dd.innerHTML = _saveRecords.map((rec, i) => {
    const bits = rec.bits;
    const isYarrow = bits.some(b => b > 1);
    const bitsStr = bits.map(b => {
      const c = isYarrow ? (PROB_COLORS.quaternary[String(b)] || '#c9a84c') : (PROB_COLORS.binary[String(b)] || '#c9a84c');
      return `<span style="color:${c}">${b}</span>`;
    }).join('');
    const ts = _relTime(rec.time);
    const favoClass = 'save-favo' + (rec.favo ? ' active' : '');
    return `<div class="save-record${rec.shibo ? ' shibo-lit' : ''}"><span class="save-del" onclick="deleteRecord(${i},event)">✖</span><span class="${favoClass}" onclick="toggleFavo(${i},event)">${rec.favo ? '★' : '☆'}</span><span class="save-record-bits" onclick="loadSaveRecord(${i})">${bitsStr}</span><span class="save-record-time">${ts}</span></div>`;
  }).join('');
}

function _relTime(isoStr){
  const s = Math.floor((Date.now() - new Date(isoStr)) / 1000);
  if(s >= 86400 * 365) return T('time.years_ago', Math.floor(s / (86400 * 365)));
  if(s >= 86400)       return T('time.days_ago',  Math.floor(s / 86400));
  if(s >= 3600)        return T('time.hours_ago', Math.floor(s / 3600));
  return T('time.secs_ago', Math.max(0, s));
}

function _recordPreviewHTML(rec){
  const bits = rec.bits;
  const isYarrow = bits.some(b => b > 1);
  const bitsStr = bits.map(b => {
    const c = isYarrow ? (PROB_COLORS.quaternary[String(b)] || '#c9a84c') : (PROB_COLORS.binary[String(b)] || '#c9a84c');
    return `<span style="color:${c}">${b}</span>`;
  }).join(' ');
  const ts = _relTime(rec.time);
  const favoClass = 'save-favo'+(rec.favo?' active':'');
  return `<div class="save-record save-dd-confirm-preview${rec.shibo?' shibo-lit':''}"><span class="${favoClass}">${rec.favo?'★':'☆'}</span><span class="save-record-bits">${bitsStr}</span><span class="save-record-time">${ts}</span></div>`;
}

function applyPanelScale(s) {
  const root = document.documentElement;
  for (const [k, base] of Object.entries(PANEL_SIZES))
    root.style.setProperty(k, (base * s) + 'px');
}

function fitLeftPanel() {
  const panel = document.querySelector('.left-panel');
  panel.style.height = '';
  applyPanelScale(1);
  const rect  = panel.getBoundingClientRect();
  const avail = window.innerHeight - rect.top - PANEL_BOTTOM_MARGIN;
  if (rect.height > avail) applyPanelScale(avail / rect.height);
  panel.style.height = avail + 'px';
  fitSourceOverlay();
}

function fitSourceOverlay() {
  const ov = document.getElementById('sourceOverlay');
  for (const k of Object.keys(PANEL_SIZES)) ov.style.removeProperty(k);
  if (!ov.classList.contains('open')) return;
  const avail    = document.querySelector('.left-panel').getBoundingClientRect().height;
  const body     = ov.querySelector('.source-body');
  const overflow = body.scrollHeight - body.offsetHeight;
  if (overflow <= 0) return;
  const s  = avail / (avail + overflow);
  const cs = getComputedStyle(document.documentElement);
  for (const k of Object.keys(PANEL_SIZES)) {
    const v = parseFloat(cs.getPropertyValue(k));
    if (!isNaN(v)) ov.style.setProperty(k, (v * s) + 'px');
  }
}

  '--hdr-dual-gap':  20,   '--hdr-unit-gap':  4,  '--hdr-title-mb':12,
};
const HDR_BASELINE_WIDTH = 480;

function fitRightHeader() {
  const root = document.documentElement;

  // ── 第一步：寬度 scale ──
  const panelW = document.querySelector('.right-panel').getBoundingClientRect().width;
  const s_w = Math.min(1, panelW / HDR_BASELINE_WIDTH);
  for (const [k, base] of Object.entries(HDR_SIZES))
    root.style.setProperty(k, (base * s_w) + 'px');

  // ── 第二步：高度 scale（header 底部不可超過視窗 1/2）──
  // getBoundingClientRect() 強制 style flush，確保第一步已套用
  const rect = document.getElementById('hexHeader').getBoundingClientRect();
  const budget = window.innerHeight / 2;
  if (rect.bottom > budget && rect.height > 0) {
    // header.top 不受 scale 影響；height 與 s 成正比
    // 目標：rect.top + rect.height × (s_final / s_w) = budget
    const s_final = s_w * (budget - rect.top) / rect.height;
    for (const [k, base] of Object.entries(HDR_SIZES))
      root.style.setProperty(k, (base * s_final) + 'px');
  }
}

// 快取左欄右邊界（在無 transform 狀態下量測，避免 transition 中途讀到錯誤值）
let _leftPanelRight = 0;

// 同步 #panelToggle / #panelBack 的 display 和位置
function updateToggle() {
  const layout    = document.querySelector('.page-layout');
  const stacked   = layout.classList.contains('stacked');
  const showRight = layout.classList.contains('show-right');
  const toggle    = document.getElementById('panelToggle');
  const back      = document.getElementById('panelBack');

  toggle.style.display = (stacked && !showRight) ? 'flex' : 'none';
  back.style.display = (stacked && showRight) ? 'flex' : 'none';
}

// 根據右欄寬度決定是否啓用 stacked 模式，並更新 toggle 顯示狀態
function fitLayout() {
  const layout = document.querySelector('.page-layout');
  layout.classList.remove('stacked', 'show-right');
  const w = document.querySelector('.right-panel').getBoundingClientRect().width;
  if (w < 200) layout.classList.add('stacked');
  // 在無 transform 狀態下量測並快取左欄右邊界
  _leftPanelRight = document.querySelector('.left-panel').getBoundingClientRect().right;
  updateToggle();
}

function fitBodyText() {
  const w = window.innerWidth;
  const s = w >= BODY_IPAD_W ? 1
    : Math.max(BODY_MOBILE_S,
        BODY_MOBILE_S + (w - BODY_MOBILE_W) / (BODY_IPAD_W - BODY_MOBILE_W) * (1 - BODY_MOBILE_S));
  const root = document.documentElement;
  for (const [k, base] of Object.entries(BODY_SIZES))
    root.style.setProperty(k, (base * s) + 'px');
}

function fitBtnText(root) {
  (root || document).querySelectorAll('button:not(:has(svg))').forEach(btn => {
    if (!btn.textContent.trim()) return;
    btn.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(btn).fontSize);
    while (btn.scrollWidth > btn.offsetWidth + 0.5 && fs > 8) {
      fs -= 0.5;
      btn.style.fontSize = fs + 'px';
    }
  });
  (root || document).querySelectorAll('.prob-name').forEach(el => {
    el.style.fontSize = '';
    const row = el.closest('.prob-row');
    if (!row) return;
    let fs = parseFloat(getComputedStyle(el).fontSize);
    const maxW = row.offsetWidth * 0.5;
    while ((el.scrollWidth > maxW || row.scrollWidth > row.offsetWidth + 0.5) && fs > 8) {
      fs -= 0.5;
      el.style.fontSize = fs + 'px';
    }
  });
}

function configPresetHtml(p){
  const mode = p.mode || 'binary';
  const keys = mode === 'binary' ? ['0','1'] : ['6','7','8','9'];
  const labels = PROB_LABELS[mode];
  let ph = `<div class="config-preset cfg-preset-row">`;
  ph += `<div class="config-row"><span class="config-label">name</span><input class="config-input cfg-preset-name" type="text" value="${_esc(p.name||'')}">`;
  ph += `<button class="rm-btn" onclick="configRemovePreset(this)">✖</button></div>`;
  ph += `<div class="config-row"><span class="config-label">mode</span>`;
  ph += `<select class="config-input cfg-preset-mode" onchange="configPresetModeChange(this)">`;
  ph += `<option value="binary"${mode==='binary'?' selected':''}>binary</option>`;
  ph += `<option value="quaternary"${mode==='quaternary'?' selected':''}>quaternary</option>`;
  ph += `</select></div>`;
  ph += `<div class="cfg-preset-probs">`;
  for(const k of keys)
    ph += `<div class="config-row"><span class="config-label">${labels[k]} (${k})</span><input class="config-input config-input--num cfg-preset-prob" data-key="${k}" type="number" min="0" value="${(p.probs||{})[k]??0}"></div>`;
  ph += `</div></div>`;
  return ph;
}

function sourceLoadFile(type, inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      if(type === 'md'){
        const secs = _parseMdSections(e.target.result);
        if(Object.keys(secs).length === 0) throw new Error('No hexagram sections (## NN.) found');
        const ov = _lsGetHexOv();
        for(const [numStr, fields] of Object.entries(secs)){
          const n = parseInt(numStr);
          if(!ov[numStr]) ov[numStr] = {};
          Object.assign(ov[numStr], fields);
          const h = _HEX_BY_NUM[n]; if(!h) continue;
          Object.assign(h, fields);
          if(_HEX_BY_SEQ[h.sequence]) Object.assign(_HEX_BY_SEQ[h.sequence], fields);
        }
        localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
        if(currentData){ renderContent(currentData); }
        _srcSetClean('md', true, file.name);
      } else if(type === 'cfg'){
        const cfg = JSON.parse(e.target.result);
        _validateCfg(cfg);
        const {hexagrams, overrides, ...cfgOnly} = cfg;
        _lsSaveConfig(cfgOnly); _applyConfig(cfgOnly);
        if(Array.isArray(hexagrams) && hexagrams.length > 0){
          for(const h of hexagrams){
            if(typeof h.num !== 'number') throw new Error(`Hexagram entry missing "num"`);
            if(typeof h.sequence !== 'string' || !/^[01]{6}$/.test(h.sequence)) throw new Error(`Hexagram ${h.num}: invalid "sequence" (expected 6 binary digits)`);
          }
          const IC_FIELDS = ['name','short_name','ci','symbol'];
          const ov = _lsGetHexOv();
          for(const h of hexagrams){
            const k = String(h.num); if(!_HEX_BY_NUM[h.num]) continue;
            if(!ov[k]) ov[k] = {};
            for(const f of IC_FIELDS) if(f in h){
              ov[k][f] = h[f]; _HEX_BY_NUM[h.num][f] = h[f];
              if(_HEX_BY_SEQ[h.sequence]) _HEX_BY_SEQ[h.sequence][f] = h[f];
            }
          }
          for(const [numStr, fields] of Object.entries(overrides || {})){
            const n = parseInt(numStr); if(!_HEX_BY_NUM[n]) continue;
            const h = _HEX_BY_NUM[n]; const k = String(n);
            if(!ov[k]) ov[k] = {};
            for(const f of IC_FIELDS) if(f in fields){
              ov[k][f] = fields[f]; h[f] = fields[f];
              if(_HEX_BY_SEQ[h.sequence]) _HEX_BY_SEQ[h.sequence][f] = fields[f];
            }
          }
          localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
          if(currentData){ currentData = _HEX_BY_NUM[currentData.num] || currentData; renderContent(currentData); renderHeader(); }
        }
        _srcSetClean('cfg', true, file.name);
      } else if(type === 'saves'){
        const records = JSON.parse(e.target.result);
        if(!Array.isArray(records)) throw new Error('saves.json must be a JSON array');
        localStorage.setItem(_LS_SAVES, JSON.stringify(records));
        _srcSetClean('saves', true, file.name);
      }
    } catch(err){ sourceErrOpen(err.message); }
    inputEl.value = '';
  };
  reader.readAsText(file);
}
function sourceDownload(type){
  let data, filename, mime = 'application/json';
  if(type === 'saves'){ data = JSON.stringify(_lsLoadSaves(), null, 2); filename = 'saves.json'; }
  else if(type === 'cfg'){
    data = JSON.stringify({..._lsGetConfig(), hexagrams: _reconstructIching()}, null, 2);
    filename = 'config.json';
  }
  else if(type === 'md'){ data = _reconstructMd(); filename = 'text.md'; mime = 'text/markdown'; }
  else return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type: mime}));
  a.download = filename; a.click(); URL.revokeObjectURL(a.href);
}
function _reconstructMd(){
  return Object.values(_HEX_BY_NUM)
    .sort((a,b) => a.num - b.num)
    .map(h => `## ${String(h.num).padStart(2,'0')}.\n### _\n${h['text.tab1']||''}\n### _\n${h['text.tab2']||''}\n### _\n${h['text.tab3']||''}`)
    .join('\n\n');
}
function _reconstructIching(){
  return Object.values(_HEX_BY_NUM)
    .sort((a,b) => a.num - b.num)
    .map(({num,sequence,name,short_name,symbol,ci}) => ({num,sequence,name,short_name,symbol,ci}));
}
function _parseMdSections(text){
  const SEC = ['text.tab1','text.tab2','text.tab3'];
  const result = {};
  let curNum = null, sections = [], curLines = null;
  for(const raw of text.split('\n')){
    const s = raw.trimEnd();
    const m = s.match(/^## (\d{2})\./);
    if(m){
      if(curNum !== null){
        if(curLines !== null) sections.push(curLines);
        result[String(curNum)] = Object.fromEntries(
          SEC.slice(0, sections.length).map((f,i) => [f, sections[i].join('\n').trim()])
        );
      }
      curNum = parseInt(m[1]); sections = []; curLines = null; continue;
    }
    if(curNum === null) continue;
    if(s.startsWith('### ')){ if(curLines !== null) sections.push(curLines); curLines = []; continue; }
    if(curLines !== null) curLines.push(s);
  }
  if(curNum !== null){
    if(curLines !== null) sections.push(curLines);
    result[String(curNum)] = Object.fromEntries(
      SEC.slice(0, sections.length).map((f,i) => [f, sections[i].join('\n').trim()])
    );
  }
  return result;
}

function _seqOpposite(seq){ return seq.split('').map(c=>c==='1'?'0':'1').join(''); }
function _seqInverse(seq){ return seq.split('').reverse().join(''); }
function _seqSwap(seq){ return seq[3]+seq[4]+seq[5]+seq[0]+seq[1]+seq[2]; }
function _seqNuclear(seq){ return seq[1]+seq[2]+seq[3]+seq[2]+seq[3]+seq[4]; }
function _relModeData(data, mode){
  if(!data || mode==='original' || mode==='zhi') return null;
  const seq = data.sequence;
  let rseq;
  if(mode==='opposite')      rseq = _seqOpposite(seq);
  else if(mode==='inverse')  rseq = _seqInverse(seq);
  else if(mode==='swap')     rseq = _seqSwap(seq);
  else if(mode==='nuclear')  rseq = _seqNuclear(seq);
  return rseq ? (_HEX_BY_SEQ[rseq] || null) : null;
}

function _hasH3(text){ return /^#{2,3}(?!#)/m.test(text); }

async function saveTextEdit(){
  if(!_editMode || !currentData) return;
  try{
    // block ### (section-level heading) — only #### and deeper are allowed
    const textsToCheck = _editDual
      ? [document.getElementById('textEditorArea0').value,
         document.getElementById('textEditorArea1').value]
      : [document.getElementById('textEditorArea').value];
    if(textsToCheck.some(_hasH3)){ setMsg(T('msg.edit_has_h3'), 'error'); return; }

    const upd = (num, field, text) => {
      _lsApplyHexOv(num, field, text);
      return Promise.resolve({ok: true});
    };

    // ── content ──────────────────────────────────────────────────────
    const contentJobs = [];
    if(_editDual){
      const t0 = document.getElementById('textEditorArea0').value;
      const t1 = document.getElementById('textEditorArea1').value;
      const jobs = [];
      if(t0 !== _editOrigText0) jobs.push(upd(currentData.num,'ci',t0).then(r=>{ if(!r.ok) throw new Error(); _HEX_BY_SEQ[currentData.sequence].ci=t0.split('\n'); _HEX_BY_NUM[currentData.num].ci=t0.split('\n'); }));
      if(t1 !== _editOrigText1) jobs.push(upd(currentData1.num,'ci',t1).then(r=>{ if(!r.ok) throw new Error(); _HEX_BY_SEQ[currentData1.sequence].ci=t1.split('\n'); _HEX_BY_NUM[currentData1.num].ci=t1.split('\n'); }));
      await Promise.all(jobs);
    } else {
      const d = _activeHex();
      const text = document.getElementById('textEditorArea').value;
      if(text !== _editOrigText){
        const r = await upd(d.num, _editField, text);
        if(!r.ok){ setMsg(T('msg.save_fail'),'error'); return; }
        const val = _editField === 'ci' ? text.split('\n') : text;
        _HEX_BY_SEQ[d.sequence][_editField] = val;
        _HEX_BY_NUM[d.num][_editField] = val;
      }
    }

    // ── meta: hexagram name ───────────────────────────────────────────
    const d = _editDual ? currentData : _activeHex();
    const nameEl  = document.getElementById('teNameInput');
    const shortEl = document.getElementById('teShortInput');
    const metaJobs = [];
    if(nameEl  && nameEl.value  !== (d.name       || '')) metaJobs.push(upd(d.num, 'name',       nameEl.value ).then(r=>{ if(r.ok){ _HEX_BY_SEQ[d.sequence].name       = nameEl.value;  _HEX_BY_NUM[d.num].name       = nameEl.value;  } }));
    if(shortEl && shortEl.value !== (d.short_name || '')) metaJobs.push(upd(d.num, 'short_name', shortEl.value).then(r=>{ if(r.ok){ _HEX_BY_SEQ[d.sequence].short_name = shortEl.value; _HEX_BY_NUM[d.num].short_name = shortEl.value; } }));

    await Promise.all(metaJobs);

    cancelTextEdit(); renderContent(currentData); renderHeader();
  } catch(e){ setMsg(T('msg.save_fail'), 'error'); }
}

    const below = el.classList.contains('tip-below');
    let x = r.left + r.width/2 - ow/2;
    x = Math.max(MARGIN, Math.min(window.innerWidth  - ow - MARGIN, x));
    let y = below ? r.bottom + GAP : r.top - oh - GAP;
    if( below && y + oh > window.innerHeight - MARGIN) y = r.top   - oh - GAP;
    if(!below && y < MARGIN)                           y = r.bottom + GAP;
    y = Math.max(MARGIN, Math.min(window.innerHeight - oh - MARGIN, y));
    ov.style.left = x + 'px';
    ov.style.top  = y + 'px';
    ov.classList.add('visible');
  }
  function hide(){ ov.classList.remove('visible'); }
  document.addEventListener('pointerover', function(e){
    const el = e.target.closest('[data-tip]');
    if(el) show(el);
  });
  document.addEventListener('pointerout', function(e){
    const el = e.target.closest('[data-tip]');
    if(el && !el.contains(e.relatedTarget)) hide();
  });
})();
</script>
</body>
</html>
