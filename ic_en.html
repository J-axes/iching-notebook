lling into peril.**","text.tab3":"&0&\n**Great Preponderance (Da Guo): Tâ Kw o suggests to us a beam that is weak. There will be advantage in moving (under its conditions) in any direction whatever; there will be success.**\n**Great Symbol: (The trigram representing) trees hidden beneath that for the waters of a marsh forms Ta Kwo. The superior man, in accordance with this, stands up alone and has no fear, and keeps retired from the world without regret. ‘He places mats of the white m4) grass under Binks set on the ground :’—he feels his weakness and his being in the lowest place, (and uses extraordinary care).**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): T& Kwo shows the great ones (=the undivided lines) in excess. 2. In ‘the beam that is weak’ we see weakness both in the lowest and the topmost (lines). 3. The strong lines are in excess, but (two of them) are in the central positions. The action (of the hexagram is represented by the symbols of) flexibility and satisfaction. (Hence it is said), ‘There will be advantage in moving in any direction whatever ; yea, there will be success.’ 4. Great indeed is (the work to be done in) this very extraordinary time.\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows one placing mats of the white mâ o grass under things set on the ground. There will be no error.\n\n##### Symbol: ‘An old husband and a young wife :’—such association is extraordinary.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows a decayed willow producing shoots, or an old husband in possession of his young wife. There will be advantage in every way.\n\n##### Symbol: ‘The evil connected with the beam that is weak’ arises from this, that no help can be given (to the condition thus represented).\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows a beam that is weak. There will be evil.\n\n##### Symbol: ‘The good fortune connected with the beam curving upwards’ arises from this, that it does not bend towards what is below.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows a beam curving upwards. There will be good fortune. If (the subject of it) looks for other (help but that of line one), there will be cause for regret.\n\n##### Symbol: ‘A decayed willow produces flowers :’— but how can this secure its long continuance? ‘An old\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows a decayed willow producing flowers, or an old wife in possession of her young husband. There will be occasion neither for blame nor for praise.\n\n##### Symbol: ‘Evil follows wading with (extraordinary) boldness (through the stream) :’—but (the act) affords no ground for blame.\n\n/5&\n\n&6&\n##### Top Line, Divided: The topmost line, divided, shows its subject with extraordinary (boldness) wading through a stream, till the water hides the crown of his head. There will be evil, but no ground for blame.\n\n##### Symbol: \"Evil follows wading with (extraordinary) boldness (through the stream):\"--but (the act) affords no ground for blame.\n\n/6&"},"010010":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/029.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Fire mounts in Li; water in Kan descends.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): When one falls into peril, he is sure to attach himself to some person or thing; and hence Kan is followed by Li. Li denotes being attached, or adhering, to.**","text.tab3":"&0&\n**The Abysmal (Kan): Kha n , here repeated, shows the possession of sincerity, through which the mind is. penetrating. Action (in accordance with this) will be of high value.**\n**Great Symbol: (The representation of) water flowing on continuously forms the repeated Khan. The superior man, in accordance with this, maintains constantly the virtue (of his heart) and (the integrity of) his conduct, and practises the business of instruction.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Khan repeated shows us one defile succeeding another. 2. This is the nature of water;—it flows on, without accumulating its volume (so as to overflow); it pursues its way through a dangerous defile, without losing its true (nature). 3. That ‘the mind is penetrating’ is indicated by the strong (line) in the centre. That ‘action (in accordance with this) will be of high value’ tells us that advance will be followed by achievement. 4. The dangerous (height) of heaven cannot be ascended ; the difficult places of the earth are moun-\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows its subject in the double defile, and (yet) entering a cavern within it. There will be evil.\n\n##### Symbol: ‘In the double defile, he enters a cavern within it :'—he has missed his (proper) way, and there will be evil.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows its subject in all the peril of the defile. He will, however, get a little (of the deliverance) that he seeks.\n\n##### Symbol: ‘He will get a little (of the deliverance) that he seeks :'—he will not yet escape from his environed position.\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows its subject, whether he comes or goes (=descends or ascends), confronted by a defile. All is peril to him and unrest. (His endeavours) will lead him into the cavern of the pit. There should be no action (in such a case).\n\n##### Symbol: ‘Whether he comes or goes, he is confronted by a defile :’—he will never (in such circumstances) achieve any success.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows its subject (at a feast), with (simply) a bottle of spirits, and a subsidiary basket of rice, while (the cups and bowls) are (only) of earthenware. He introduces his important lessons (as his ruler's) intelligence admits. There will in the end be no error.\n\n##### Symbol: ‘(Nothing but) a bottle of spirits and a subsidiary basket of rice:’ (these describe) the meeting at this point of (those who are represented by) the strong and weak lines.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows the water of the defile not yet full, (so that it might flow away); but order will (soon) be brought about. There will be no error.\n\n##### Symbol: ‘The water in the defile is not full (so as to flow away):’—(the virtue indicated by) the central situation is not yet, (sufficiently) great.\n\n/5&\n\n&6&\n##### Top Line, Divided: The topmost line, divided, shows its subject bound with cords of three strands or two strands, and placed in the thicket of thorns. But in three years he does not learn the course for him to pursue. There will be evil.\n\n##### Symbol: ‘The sixth line, divided, shows its subject missing his (proper) course :’—‘there will be evil for three years.’ :\n\n/6&"},"101101":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/030.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Fire mounts in Li; water in Kan descends.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Li denotes being attached, or adhering, to.**","text.tab3":"&0&\n**The Clinging (Li): L î indicates that, (in regard to what it denotes), it will be advantageous to be firm and correct, and that thus there will be free course and success. Let (its subject) also nourish (a docility like that of) the cow, and there will be good fortune.**\n**Great Symbol: (The trigram for) brightness, repeated, forms Lt. The great man, in accordance with this, cultivates more and more his brilliant (virtue), and diffuses its brightness over the four quarters (of the land).**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Li means being attached to. The sun and moon have their place in the sky. All the grains, grass, and trees have their place on the earth. The double brightness (of the two trigrams) adheres to what is correct, and the result is the transforming and perfecting all under the sky. 2. The weak (second line) occupies the middle and correct position, and gives the indication of ‘a free and successful course ;’ and, moreover, ‘ nourishing (docility like that of) the cow’ will lead to good\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows one ready to move with confused steps. But he treads at the same time reverently, and there will be no mistake.\n\n##### Symbol: ‘The reverent attention directed to his confused steps’ is the way by which error is avoided.\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows its subject in his place in yellow. There will be great good fortune.\n\n##### Symbol: ‘The great good fortune (from the subject of the second line) occupying his place in yellow’ is owing to his holding the course of the due mean.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows its subject in a position like that of the declining sun. Instead of playing on his instrument of earthenware, and singing to it, he utters the groans of an old man of eighty. There will be evil.\n\n##### Symbol: ‘A position like that of the declining sun :’— how can it continue long ?\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows the manner of its subject's coming. How abrupt it is, as with fire, with death, to be rejected (by all)!\n\n##### Symbol: ‘How abrupt is the manner of his coming! ’— none can bear with him.\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows its subject as one with tears flowing in torrents, and groaning in sorrow. There will be good fortune.\n\n##### Symbol: ‘The good fortune attached to the fifth line,\n\n/5&\n\n&6&\n##### Top Line, Undivided: The topmost line, undivided, shows the king employing its subject in his punitive expeditions. Achieving admirable (merit), he breaks (only) the chiefs (of the rebels). Where his prisoners were not their associates, he does not punish. There will be no error.\n\n##### Symbol: “The king employs him in his punitive expeditions :'—the object is to bring the regions to a correct state.\n\n/6&"},"001110":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/031.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Effect quick answering cause in Xian appears; while Heng denotes continuance for years.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Heaven and earth existing, all (material) things then got their existence. All (material) things having existence, afterwards there came male and female. From the existence of male and female there came afterwards husband and wife. From husband and wife there came father and son. From father and son there came ruler and minister. From ruler and minister there came high and low. When (the distinction of) high and low had existence, afterwards came the arrangements of propriety and righteousness. The rule for the relation of husband and wife is that it should be long-enduring. Hence Xian is followed by Heng.**","text.tab3":"&0&\n**Influence (Xian): Hsie n indicates that, (on the fulfilment of the conditions implied in it), there will be free course and success. Its advantageousness will depend on the being firm and correct, (as) in marrying a young lady. There will be good fortune.**\n**Great Symbol: (The trigram representing) a mountain and above it that for (the waters of) a marsh form Hsien. The superior man, in accordance with this, keeps his mind free from pre-occupation, and open to receive (the influences of) others.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Hsien is here used in the sense of Kan, meaning (mutually) influencing. 2. The weak (trigram) above, and the strong one below ; their two influences moving and responding to each other, and thereby forming a union; the repression (of the one) and the satisfaction (of the other); (with their relative position), where the male is placed below the female:— al] these things convey the notion of ‘a free and successful course (on the fulfilment of the conditions), while the advantage will depend on being firm and correct, as in marrying a young lady, and there will be good fortune.’ 3. Heaven and earth exert their influences, and there ensue the transformation and production of all things. The sages influence the minds of men, and the result is harmony and peace all under the sky. If we look at (the method and issues) of those influences, the true character of heaven and earth and of all things can be seen.\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows one moving his great toes.\n\n##### Symbol: ‘He moves his great toe:’—his mind is set on what is beyond (himself).\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows one moving the calves of his leg. There will be evil. If he abide (quiet in his place), there will be good fortune.\n\n##### Symbol: Though ‘there would be evil; yet, if he abide (quiet) in his place, there will be good fortune ;’— through compliance (with the circumstances of his condition and place) there will be no injury.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows one moving his thighs, and keeping close hold of those whom he follows. Going forward (in this way) will cause regret.\n\n##### Symbol: ‘He moves his thighs:—he still does not (want to) rest in his place. His will is set on ‘following others :—what he holds in his grasp is low.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows that firm correctness which will lead to good fortune, and prevent all occasion for repentance. If its subject be unsettled in his movements, (only) his friends will follow his purpose.\n\n##### Symbol: ‘Firm correctness will lead to good fortune,\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows one moving the flesh along the spine above the heart. There will be no occasion for repentance.\n\n##### Symbol: ‘He (tries to) move the flesh along the spine above the heart :'—his aim is trivial.\n\n/5&\n\n&6&\n##### Top Line, Divided: The sixth line, divided, shows one moving his jaws and tongue.\n\n##### Symbol: ‘He moves his jaws and tongue :’—he (only) talks with loquacious mouth.\n\n/6&"},"011100":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/032.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Effect quick answering cause in Xian appears; while Heng denotes continuance for years.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Heng denotes long enduring. Things cannot long abide in the same place; and hence Heng is followed by Dun.**","text.tab3":"&0&\n**Duration (Heng): Hang indicates successful progress and no error (in what it denotes). But the advantage will come from being firm and correct; and movement in any direction whatever will be advantageous.**\n**Great Symbol: (The trigram representing) thunder and that for wind form Hang. The superior man, in accordance with this, stands firm, and does not change his method (of operation).**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Hang denotes long continuance. The strong (trigram) is above, and the weak one below; (they are the symbols of) thunder and wind,\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows its subject deeply (desirous) of long continuance. Even with firm\n\n##### Symbol: ‘The evil attached to the deep desire for long continuance (in the subject of the first line)’ arises from the deep seeking for it at the commencement (of things).\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows all occasion for repentance disappearing.\n\n##### Symbol: ‘All occasion for repentance on the part of the subject of the second line, undivided, disappears :’— he can abide long in the due mean.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows one who does not continuously maintain his virtue. There are those who will impute this to him as a disgrace. However firm he may be, there will be ground for regret.\n\n##### Symbol: ‘He does not continuously maintain his virtue :—nowhere will he be borne with.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows a field where there is no game.\n\n##### Symbol: (Going) for long to what is not his proper place, how can he get game?\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows its subject continuously maintaining the virtue indicated by it. In a wife this will be fortunate; in a husband, evil.\n\n##### Symbol: ‘Such firm correctness in a wife will be fortunate :'—it is hers to the end of life to follow with an unchanged mind. The husband must decide what is right, and lay down the rule accordingly :— for him to follow (like) a wife is evil.\n\n/5&\n\n&6&\n##### Top Line, Divided: The topmost line, divided, shows its subject exciting himself to long continuance. There will be evil. move them is inauspicious. Its subject, however, the line being strong, and in an odd place, will wish to move, and follows the subject of 4, which is understood to be the seat of the mind. He exercises his influence therefore with a mind and purpose, which is not good.\n\n##### Symbol: \"The subject of the topmost line is exciting himself to long continuance:\"--far will he be from achieving merit.\n\n/6&"},"001111":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/033.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Da Zhuang stops here as right; withdraws Dun there.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Dun denotes withdrawing. Things cannot be for ever withdrawn; and hence Dun is succeeded by Da Zhuang.**","text.tab3":"&0&\n**Retreat (Dun): Thun indicates successful progress (in its circumstances). To a small extent it will (still) be advantageous to be firm and correct.**\n**Great Symbol: (The trigram representing) the sky and below it that for a mountain form Thun. The superior man, in accordance with this, keeps small men at a distance, not by showing that he hates them, but by his own dignified gravity.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): ‘Thun indicates successful progress :'—that is, in the very retiring which Thun denotes there is such progress. The strong (line) is in the ruling place, (the fifth), and is’ properly responded to (by the second line). The action takes place according to (the requirement of) the time. 2. ‘To a small extent it will (still) be advantageous to be firm and correct :’'—(the small men) are gradually encroaching and advancing. 3. Great indeed is the significance of (what is required to be done in) the time that necessitates retiring.\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, divided, shows a retiring tail. The position is perilous. No movement in any direction should be made. being. The sixth Appendix makes it a sequel of the previous figure. As that treats, it is said, of the relation between husband and wife, so this treats of the continuous observance of their respective duties. Hsien, we saw, is made up of Kan, the symbol of the youngest son, and Tui, the symbol of the youngest daughter, attraction and influence between the sexes being strongest in youth. Hang consists of Sun, ‘the oldest daughter,’ and Aan, the oldest son. The couple are more staid. The wife occupies the lower place; and the relation between them is marked by her submission. This is sound doctrine, especially from a Chinese point of view ; but I doubt whether such application of his teaching was in the mind of king Wan. Given two parties, an inferior and superior in correlation. If both be continuously observant of what is correct, the inferior being also submissive, and the superior firm, good fortune and progress may be predicated of their course. Line 1 has a proper correlate in 4; but between them are two strong lines; and it is itself weak. These two conditions are against its subject receiving much help from the subject of 4. He should be quiet, and not forward for action. The first line, undivided, shows its subject manifesting his strength in his toes. But advance will lead to evil,—most certainly. The first line, divided, shows one wishing to advance, and (at the same time) kept back. Let him be firm and correct, and there will be good fortune. If trust be not reposed in him, let him maintain a large and generous mind, and there will be no error.\n\n##### Symbol: There is ‘the perilousness of the position shown by the retiring tail :'—but if ‘no movement’ be made, what disaster can there be?\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, divided, shows its subject holding (his purpose) fast as if by a (thong made from the) hide of a yellow ox, which cannot be broken. The second line, undivided, shows that with firm correctness there will be good fortune. The second line, divided, shows its subject with the appearance of advancing, and yet of being sorrowful, If he be firm and correct, there will be good fortune. He will receive this great blessing from his grandmother.\n\n##### Symbol: ‘He holds it as by (a thong from the hide of) a yellow ox :’—his purpose is firm.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows one retiring but bound,—to his distress and peril. (If he were to deal with his binders as in) nourishing a servant or concubine, it would be fortunate for him. The third line, undivided, shows, in the case of a small man, one using all his strength ; and in the case of a superior man, one whose rule is not to do so. Even with firm correctness the position would be perilous. (The exercise of strength in it might be compared to the case of) a ram butting against a fence, and getting his horns entangled. The third line, divided, shows its subject trusted by all (around him). All occasion for repentance will disappear.\n\n##### Symbol: ‘The peril connected with the case of one retiring, though bound,’ is due to the (consequent) distress and exhaustion. ‘If he were (to deal as in) nourishing a servant or concubine, it would be fortunate for him:’—but a great affair cannot be dealt with in this way.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows its subject retiring notwithstanding his likings. In a superior man this will lead to good fortune; a small man cannot attain to this. The fourth line, undivided, shows (a case in which) firm correctness leads to good fortune, and occasion for repentance disappears. (We see) the fence opened without the horns being entangled. The strength is like that in the wheel-spokes of a large waggon. The fourth line, undivided, shows its subject with the appearance of advancing, but like a marmot. However firm and correct he may be, the position is one of peril.\n\n##### Symbol: ‘A superior man retires notwithstanding his likings; a small man cannot attain to this.’\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows its subject retiring in an admirable way. With firm correctness there will be good fortune. The fifth line, divided, shows one who loses his ram(-like strength) in the ease of his position. (But) there will be no occasion for repentance. The fifth line, divided, shows how all occasion for repentance disappears (from its subject). (But) let him not concern himself about whether he shall fail or succeed. To advance will be fortunate, and in every way advantageous.\n\n##### Symbol: ‘He retires in an admirable way, and with firm correctness there will be good fortune :’'—this is due to the rectitude of his purpose.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, shows its subject retiring in a noble way. It will be advantageous in every respect. the attraction of his correlate in 6, he is supposed to be ready to abandon his place and virtue. He may try to be firm and correct, but circumstances are adverse to him. The sixth line, divided, shows (one who may be compared to) the ram butting against the fence, and unable either to retreat, or to advance as he would fain do. There will not be advantage in any respect; but if he realise the difficulty (of his position), there will be good fortune. XXXIV. The strong lines predominate in T& Awang. It suggested to king W&n a state or condition of things in which there was abundance of strength and vigour. Was strength alone enough for the conduct of affairs? No. He saw also in the figure that which suggested to him that strength should be held in subordination to the idea of right, and exerted only in harmony with it, In 3in we see a prince who secures the tranquillity (of the people) presented on that account with numerous horses (by the king), and three times in a day received at interviews. The topmost line, undivided, shows one advancing his horns. But he only uses them to punish the (rebellious people of his own) city. The position direct it. All that is said about him is that he will give no occasion for repentance.\n\n##### Symbol: ‘He retires in a noble way, and his doing so will be advantageous in every respect:—he who does so has no doubts about his course.\n\n/6&"},"111100":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/034.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Da Zhuang stops here as right; withdraws Dun there.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Things cannot remain forever (simply) in the state of vigour; and hence Da Zhuang is succeeded by Jin.**","text.tab3":"&0&\n**Power of the Great (Da Zhuang): Tâ Kwang indicates that (under the conditions which it symbolises) it will be advantageous to be firm and correct.**\n**Great Symbol: (The trigram representing) heaven and above it that for thunder form TA K wang. The superior man, in accordance with this, does not take a step which is not according to propriety.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Ta Awang we see that which is great becoming strong. We have the (trigram) denoting strength directing that which denotes movement, and hence (the whole) is expressive of vigour. 2. ‘T& Kwang indicates that it will be advantageous to be firm and correct :'—that which is great (should be) correct. Given correctness and greatness (in their highest degree), and the character and tendencies of heaven and earth can be seen.\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘He manifests his vigour in his toes :’—this will certainly lead to exhaustion.\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘The second line, undivided, shows that with firm correctness there will be good fortune :’—this is due to its being in the centre, (and its subject exemplifying the due mean).\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘The small man uses all his strength; in the case of the superior man it is his rule not to do so.’\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘The fence is opened and the horns are not entangled :’—(the subject of the line) still advances.\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘He loses his ram and hardly perceives it :’— he is not in his appropriate place.\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘He is unable either to retreat or to advance :'— this is owing to his want of care: ‘If he realise the difficulty (of his position), there will be good fortune :'—his error will not be prolonged.\n\n/6&"},"000101":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/035.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Above in Jin the sun shines clear and bright; but in Ming Yi 'tis hidden from the sight.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Jin denotes advancing. (But) advancing is sure to lead to being wounded; and hence Jin is succeeded by Ming Yi.**","text.tab3":"&0&\n**Progress (Jin): In Jìn we see a prince who secures the tranquillity (of the people) presented on that account with numerous horses (by the king) and three times in a day received at interviews.**\n**Great Symbol: (The trigram representing) the earth and that for the bright (sun) coming forth above it form 3in. The superior man, according to this, gives himself to make more brilliant his bright virtue.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): 3in denotes advancing. 2. (In 3in we have) the bright (sun) appearing above the earth; (the symbol of) docile submission cleaving to that of the Great brightness; and the weak line advanced and moving above :—all these things give us the idea of ‘a prince who secures the tranquillity (of the people), presented on that account with numerous horses (by the king), and three times in a day received at interviews.’\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘He appears wishing to advance, but (at the same time) being kept back :’—all-alone he pursues the correct course. ‘Let him maintain a large and generous mind, and there will be no error :’—he has not yet received an official charge.\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘He will receive this great blessing :'—for he is in the central place and the correct position for him.\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘All (around) trust him :'—their (common) aim is to move upwards and act.\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘(He advances like) a marmot. However firm and correct he may be, his position is one of peril :'—his place is not that appropriate for him.\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘Let him not concern himself whether he fails or succeeds :’'—his movement in advance will afford ground for congratulation.\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘He uses his horns only to punish (the rebel-\n\n/6&"},"101000":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/036.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Above in Jin the sun shines clear and bright; but in Ming Yi 'tis hidden from the sight.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Yi denotes being wounded. He who is wounded abroad will return to his home; and hence Ming Yi is followed by Jia Ren.**","text.tab3":"&0&\n**Darkening of the Light (Ming Yi): Ming f indicates that (in the circumstances which it denotes) it will be advantageous to realise the the great blessing. The ‘New Digest of Comments on the Yi (1686),’ in its paraphrase of the line, has, ‘ He receives at last this great blessing from the mild and compliant ruler.” I am not sure that ‘ motherly king’ would not be the best and fairest translation of the phrase. Canon McClatchie has a very astonishing note on the name, which he renders ‘Imperial Mother’ (p. 164) :—‘ That is, the wife of Imperial Heaven (Juno), who occupies the “ throne of the diagram,” viz. the fifth stroke, which is soft and therefore feminine. She is the Great Ancestress of the human race. See Imp. Ed. vol. iv, Sect. v, p. 25, Com.’ Why such additions to the written word? Line 3 is weak, and in an odd place; but the subjects of 1 and 2 are possessed by the same desire to advance as the subject of this. A common trust and aim possess them; and hence the not unfavourable auspice. Line 4 is strong, but it is in an even place, nor is it central. It suggests the idea of a marmot (? or rat), stealthily advancing. Nothing could be more opposed to the ideal of the feudal lord in the hexagram. In line 5 that lord and his intelligent sovereign meet happily. He holds on his right course, indifferent as to results, but things are so ordered that he is, and will continue to be, crowned with success. Line 6 is strong, and suggests the idea of its subject to the last continuing his advance, and that not only with firm correctness, but with strong force. The ‘horns’ are an emblem of threatening strength, and though he uses them only in his own state, and against the rebellious there, that such a prince should have any occasion to use force is matter for regret. A clitficulty (of the position), and maintain firm correctness.**\n**Great Symbol: (The trigram representing) the earth and that for the bright (sun) entering within it form Ming The superior man, in accordance with this, conducts his management of men ;—he shows his intelligence by keeping it obscured.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): (The symbol of) the Earth and that of Brightness entering into the midst of it give the idea of Ming I (Brightness wounded or obscured). 2. The inner (trigram) denotes being accomplished and bright; the outer, being pliant and submissive. The case of king Wan was that of one\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows its subject, (in the condition indicated by) Ming {, flying, but with drooping wings. When the superior man (is revolving) his going away, he may be for three days without eating. Wherever he goes, the people there may speak (derisively of him). The first line, undivided, shows its subject establishing restrictive regulations in his household. Occasion for repentance will disappear. The first line, undivided, shows that (to its subject) occasion for repentance will disappear. He has lost his horses, but let him not seek for them; —they will return of themselves. Should he meet with bad men, he will not err (in communicating with them).\n\n##### Symbol: ‘The superior man (is revolving his) going away : —(in such a case) he feels it right not to eat.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, divided, shows its subject, (in the condition indicated by) Ming I, wounded in the left thigh. He saves himself by the strength of a (swift) horse; and is fortunate. The second line, divided, shows its subject taking nothing on herself, but in her central place attending to the preparation of the food. Through her firm correctness there will be good fortune. The second line, undivided, shows its subject happening to meet with his lord in a bye-passage. There will be no error.\n\n##### Symbol: ‘The good fortune of (the subject of) the second line, divided,’ is due to the proper fashion of his acting according to his circumstances.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows its subject, (in the condition indicated by) Ming I, hunting in the south, and taking the great chief (of the darkness). He should not be eager to make (all) correct (at once). The third line, undivided, shows its subject (treating) the members of the household with stern severity. There will be occasion for repentance, there will be peril, (but) there will (also) be good fortune. If the wife and children were to be smirking and chattering, in the end there would be occasion for regret. In the third line, divided, we see one whose carriage is dragged back, while the oxen in it are pushed back, and he is himself subjected to the shaving of his head and the cutting off of his nose. There is no good beginning, but there will be a good end.\n\n##### Symbol: With the aim represented by ‘hunting in the south’ a great achievement is accomplished.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, divided, shows its subject (just) entered into the left side of the belly (of the dark land). (But) he is able to carry out the mind appropriate (in the condition indicated by) Ming ], quitting the gate and courtyard (of the lord of darkness). The fourth line, divided, shows its subject line becomes a hunter pursuing his game, and successfully. The good officer will be successful in his struggle; but let him not be over eager to put all things right at once. The fourth line, undivided, shows its subject solitary amidst the (prevailing) disunion. (But) he meets with the good man (represented by the first\n\n##### Symbol: ‘ He has (just) entered into the left side of the belly (of the dark land):’—he is still able to carry out the idea in his (inner) mind.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, divided, shows how the count of Ki fulfilled the condition indicated by Ming |. It will be advantageous to be firm and correct. The fifth line, undivided, shows the influence of the king extending to his family. There need be no anxiety; there will be good fortune. The fifth line, divided, shows that (to its subject) occasion for repentance will disappear. With his relative (and minister he unites closely and readily) as if he were biting through a piece of skin. When he goes forward (with this help), what error can there be ?\n\n##### Symbol: ‘With the firm correctness of the count of Ai, his brightness could not be (quite) extinguished.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, divided, shows the case where there is no light, but (only) obscurity. (Its subject) had at first ascended to (the top of) the sky; his future shall be to go into the earth. XXXVI, In this hexagram we have the representation of a good and intelligent minister or officer going forward in the service of his country, notwithstanding the occupancy of the throne by a weak XXXVII. Tue ArA ZAn HExacram. For (the realisation of what is taught in) Aia Zan, (or for the regulation of the family), what is and unsympathising sovereign. Hence comes its name of Ming |, or ‘Intelligence Wounded,’ that is, injured and repressed. Thie treatment of the subject shows how such an officer will conduct himself, and maintain his purpose. The symbolism of the figure is treated of in the same way in the first and second Appendixes. The topmost line, undivided, shows its subject possessed of sincerity and arrayed in majesty. In the end there will be good fortune. XXXVII. Aia Zan, the name of the hexagram, simply means ‘a household,’ or ‘the members of a family.’ The subject of the essay based on the figure, however, is the regulation of the family, effected mainly by the co-operation of husband and wife in their several spheres, and only needing to become universal to secure the good order of the kingdom. The important place occupied by the wife in the family is seen in the short sentence of the Thwan. The topmost line, undivided, shows its subject solitary amidst the (prevailing) disunion. (In the subject of the third line, he seems to) see a pig bearing on its back a load of mud, (or fancies) there is a carriage full of ghosts. He first bends his bow against him, and afterwards unbends it, (for he discovers) that he is not an assailant to injure, but a near relative. Going forward, he shall meet with (genial) rain, and there will be good fortune. XXXVIII. Khwei denotes a social state in which division and mutual alienation prevail, and the hexagram teaches how in small matters this condition may be healed, and the way prepared for the cure of the whole system. The writer or writers of Appendixes I and II point out the indication in the figure of division and disunion according to their views. In Appendix VI those things appear as a necessary sequel to the regulation of the family ; while it is impossible to discover any allusion to the family in the Text. Line 1 is strong, and in an odd place. A successful course might be auspiced for its subject ; but the correlate in line 4 is also strong; and therefore disappointment and repentance are likely to ensue. In the condition, however, indicated by Khwei, where people have a common virtue, they will help one another.\n\n##### Symbol: ‘He had at first ascended to (the top of) the sky:'—he might have enlightened the four quarters\n\n/6&"},"101011":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/037.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Kui looks on others as beyond its care; Jia Ren all includes within its sphere.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): When the right administration of the family is at an end, misunderstanding and division will ensue; and hence Jia Ren is followed by Kui.**","text.tab3":"&0&\n**The Family (Jia Ren): For (the realisation of what is taught in) Jiā Rén, (or for the regulation of the family), what is most advantageous is that the wife be firm and correct.**\n**Great Symbol: (The trigram representing) fire, and that for wind coming forth from it, form Xia Zan. The superior man, in accordance with this, orders his words according to (the truth of) things, and his conduct so that it is uniformly consistent.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Kia Zan the wife has her correct place in the inner (trigram), and the man his correct place in the outer. That man and woman occupy their correct places is the great righteousness shown (in the relation and positions of) heaven and earth. 2. In Kia Zan we have the idea of an authoritative ruler;—that, namely, represented by the parental authority. 3. Let the father be indeed father, and the son son; let the elder brother be indeed elder brother, and the younger brother younger brother; let the husband be indeed husband, and the wife wife :— then will the family be in its normal state. Bring\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘He establishes restrictive regulations in his household :’—(he does so), before any change has taken place in their wills. ‘He meets with bad men (and communicates with them) :’—(he does so), to avoid the evil of their condemnation.\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘The good fortune attached to the second line, divided, is due to the docility (of its subject), operating with humility. ‘He happens to meet with his lord in a byepassage:’'—but he has not deviated (for this meeting) from the (proper) course.\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: When ‘the members of the household are treated with stern severity, there has been no (great) failure (in the regulation of the family). When ‘wife and children are smirking and chat- ‘We see his carriage dragged back:’—this is indicated by the inappropriateness of the position (of the line).\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘The family is enriched, and there is great ‘They blend their sincere desires together, and there will be no error:’—their (common) aim is carried into effect.\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘The influence of the king extends to his family:’—the intercourse between them is that of mutual love. ‘With his hereditary minister (he unites closely and easily) as if he were biting through a piece of skin:’—his going forward will afford ground for congratulation.\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘The good fortune connected with the display ‘The good fortune symbolised by meeting with (genial) rain’ springs from the passing away of all doubts.\n\n/6&"},"110101":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/038.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Kui looks on others as beyond its care; Jia Ren all includes within its sphere.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Kui denotes misunderstanding and division; and such a state is sure to give rise to difficulties and complications. Kui therefore is followed by Jian.**","text.tab3":"&0&\n**Opposition (Kui): Kuí indicates that, (notwithstanding the condition of things which it denotes), in small matters there will (still) be good success.**\n**Great Symbol: The application here of the Symbolism is correct, but neither of them comes up to the idea of disunion which is in Khwei. The various paragraphs seem to need no illustration beyond what may be found in the notes on the Text.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Khwei we have (the symbol of) Fire, which, when moved, tends upwards, and that of a Marsh, whose waters, when moved, tend downwards. We have (also the symbols of) two sisters living together, but whose wills do not move in the same direction. 2. (We see how the inner trigram expressive of) harmonious satisfaction is attached to (the outer expressive of) bright intelligence; (we see) the weak line advanced and acting above, and how it occupies the central place, and is responded to by the strong (line below). These indications show that ‘in small matters there will (still) be good fortune.’ 3. Heaven and earth are separate and apart, but the work which they do is the same. Male and female are separate and apart, but with a common will they seek the same object. There is diversity between the myriad classes of beings, but there is an analogy between their several operations. Great indeed are the phenomena and the results of this condition of disunion and separation.\n\n#### Lines\n\n&1&\n##### Line 1: The first NINE, undivided, shows that (to its subject) occasion for repentance will disappear. He has lost his horses, but let him not seek for them;--they will return of themselves. Should he meet with bad men, he will not err (in communicating with them).\n\n##### Symbol: \"He meets with bad men (and communicates with them):\"--(he does so), to avoid the evil of their condemnation.\n\n/1&\n\n&2&\n##### Line 2: The second NINE, undivided, shows its subject happening to meet with his lord in a bye-passage. There will be no error.\n\n##### Symbol: \"He happens to meet with his lord in a bye-passage:\"--but he has not deviated (for this meeting) from the (proper) course.\n\n/2&\n\n&3&\n##### Line 3: In the third SIX, divided, we see one whose carriage is dragged back, while the oxen in it are pushed back, and he is himself subjected to the shaving of his head and the cutting off of his nose. There is no good beginning, but there will be a good end.\n\n##### Symbol: \"We see his carriage dragged back:\"--this is indicated by the inappropriateness of the position (of the line). \"There is no (good) beginning, but there will be a (good) end:\"--this arises from his meeting with the strong (subject of the topmost line).\n\n/3&\n\n&4&\n##### Line 4: The fourth NINE, undivided, shows its subject solitary amidst the (prevailing) disunion. (But) he meets with the good man (represented by the first line), and they blend their sincere desires together. The position is one of peril, but there will be no mistake.\n\n##### Symbol: \"They blend their sincere desires together, and there will be no error:\"--their (common) aim is carried into effect.\n\n/4&\n\n&5&\n##### Line 5: The fifth SIX, divided, shows that (to its subject) occasion for repentance will disappear. With his relative (and minister he unites closely and readily) as if he were biting through a piece of skin. When he goes forward (with this help), what error can there be?\n\n##### Symbol: \"With his hereditary minister (he unites closely and easily) as if he were biting through a piece of skin:\"--his going forward will afford ground for congratulation.\n\n/5&\n\n&6&\n##### Line 6: The topmost NINE, undivided, shows its subject solitary amidst the (prevailing) disunion. (In the subject of the third line, he seems to) see a pig bearing on its back a load of mud, (or fancies) there is a carriage full of ghosts. He first bends his bow against him, and afterwards unbends it, (for he discovers) that he is not an assailant to injure, but a near relative. Going forward, he shall meet with (genial) rain, and there will be good fortune.\n\n##### Symbol: \"The good fortune symbolised by meeting with (genial) rain\" springs from the passing away of all doubts.\n\n/6&"},"001010":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/039.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Relief and ease with Jie are sure to come; hard toil and danger have in Jian their home.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Jian denotes difficulties; but things cannot remain for ever in such a state. Jian therefore is followed by Jie.**","text.tab3":"&0&\n**Obstruction (Jian): In (the state indicated by) Kien advantage will be found in the south-west, and the contrary in the north-east. It will be advantageous (also) to meet may overcome their evil, and at least it will help to silence their slanderous tongues. Line 5 is weak, and its subject is the proper correlate of the strong 2. They might meet openly; but for the separation and disunion that mark the time. A casual, as it were a stolen, interview, as in a bye-lane or passage, however will be useful, and may lead on to a better understanding. Line 3 is weak, where it ought to be strong. Its correlate, however, in 6 is strong, and the relation between them might seem what it ought to be. But the weak 3 is between the strong lines in 2 and 4; and in a time of disunion there ensue the checking and repulsion emblemed in the Text. At the same time the subject of line 6 inflicts on that of 3 the punishments which are mentioned. It is thus bad for 3 at first, but we are told that in the end it will be well with him ; and this will be due to the strength of the sixth line. The conclusion grows out of a conviction in the mind of the author that what is right and good is destined to triumph over what is wrong and bad. Disorder shall in the long run give place to order, and disunion to union. Line 4 has no proper correlate, and might seem to be solitary. But, as we saw on line 1, in this hexagram, correlates of the same class help each other. Hence the subjects of 4 and 1, meeting together, work with good will and success. The place of 5 is odd, but the line itsclf is weak, so that there might arise occasion for repentance. But the strong 2 is a proper correlate to the weak 5. Five being the sovereign’s place, the subject of 2 is styled the sovereign’s relative, of the same surname [42 TIE YI KING. TEXT. nt C7) OR eee with the great man. (In these circumstances), with firmness and correctness, there will be good fortune.**\n**Great Symbol: (The trigram representing) a mountain, and above it that for water, form Kien. The superior man, in accordance with this, turns round (and examines) himself, and cultivates his virtue.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): The upper or front trigram is Kh4n, the attribute of which is perilousness; the lower is K&an, of which the arresting, actively or passively, of movement or advance is the attribute. We can understand how the union of these attributes gives the ideas of difficulty and prudent caution. The explanations in paragraph 2 of the phraseology of the Thwan ee ten SRN LIE VCR Le Oe ere\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: From the first line, divided, we learn that advance (on the part of its subject) will lead to (yreater) difficulties, while remaining stationary will afford ground for praise. The first line, divided, shows that its subject will commit no error. The first line, undivided, shows. its subject suspending his own affairs, and hurrying away (to help the subject of the fourth line). He will commit no error, but let him consider how far he should contribute of what is his (for the other).\n\n##### Symbol: ‘Advancing will conduct to (greater) difficulties, while remaining stationary will afford ground for praise :'—the proper course is to wait.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, divided, shows the minister of the king struggling with difficulty on difficulty, and not with a view to his own advantage. The second line, undivided, shows its subject catch, in hunting, three foxes, and obtain the yellow (= golden) arrows. With firm correctness there will be good fortune. The second line, undivided, shows that it will be advantageous for its subject to maintain a firm correctness, and that action on his part will be evil. He can give increase (to his correlate) without taking from himself.\n\n##### Symbol: ‘The minister of the king struggles with diff-\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows its subject advancing, (but only) to (greater) difficulties. He remains stationary, and returns (to his former associates), The third line, divided, shows a porter with his burden, (yet) riding in a carriage. He will (only) tempt robbers to attack him. However firm and correct he may (try to) be, there will be cause for regret. The third line, divided, shows how of three men walking together, the number is diminished by one; and how one, walking, finds his friend.\n\n##### Symbol: ‘He advances, (but only) to (greater) difficulty; he remains stationary, and returns to his former associates :’—they, (represented in) the inner (trigram), rejoice in him.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, divided, shows its subject advancing, (but only) to (greater) difficulties. He remains stationary, and unites (with the subject of the line above). (To the subject of) the fourth line, undivided, (it is said), ‘ Remove your toes. Friends will (then) come, between you and whom there will be mutual confidence.’ The fourth line, divided, shows its subject diminishing the ailment under which he labours by making (the subject of the first line) hasten (to his help), and make him glad. There will be no error.\n\n##### Symbol: ‘To advance will (only be to) encounter (greater) difficulties; he remains stationary, and unites (with the subject of the line above):’—that is in its proper place and has the solidity (due to it in that position).\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows its subject struggling with the greatest difficulties, while friends are coming to help him. The fifth line, divided, shows (its subject), the superior man (=the ruler), executing his function of removing (whatever is injurious to the idea of the hexagram), in which case there will be good fortune, and confidence in him will be shown even by the small men. The fifth line, divided, shows parties adding to (the stores of) its subject ten pairs of tortoise shells, and accepting no refusal. There will be great good fortune. removing all that is contrary to the peace and good order of the kingdom. It will be his duty to remove especially all the small men represented by the divided lines, which he can do with the help of his strong correlate in 2. Then even the small men will change their ways, and repair to him.\n\n##### Symbol: ‘He struggles with the greatest difficulties, while friends are coming (to help him):’—he is in the central position, and possesses the requisite virtue.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The topmost line, divided, shows its subject going forward, (only to increase) the difficulties, with him, and head of some branch of the descendants of the royal house. It is as easy for 5, so supported, to deal with the disunion of the time, as to bite through a picce of skin. In the sixth line, divided, we see a feudal prince (with his bow) shooting at a falcon on the top of a high wall, and hitting it. (The effect of his action) will be in every way advantageous. XL. Xiehis the symbol of loosing,—untying a knot or unravelling a complication; and as the name of this hexagram, it denotes a condition in which the obstruction and difficulty indicated by the preceding Kien have been removed. The object of the author is to show, as if from the lines of the figure, how this new and better state of the kingdom is to be dealt with. See what is said on the The topmost line, undivided, shows its subject giving increase to others without taking from himself. There will be no error. With firm correctness there will be good fortune. There will be advantage in every movement that shall be made. He will find ministers more than can be counted by their clans. XLI. The interpretation of this hexagram is encompassed with great difficulties. Sun is the symbol for the idea of diminishing or diminution; and what is said in Appendix I has made it to be accepted as teaching the duty of the subject to take of what is his and contribute to his ruler, or the expenses of the government under which he lives; in other words, readily and cheerfully to pay his taxes. P. Regis says, ‘Sun seu (vectigalis causa) minuere.... est valde utile ;’ and Canon McClatchie in translating\n\n##### Symbol: ‘To advance will (only) increase the difficulties, while his remaining stationary will (be productive of) great (merit):’—his aim is to assist the (subject of the line) inside of him.\n\n/6&"},"010100":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/040.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Relief and ease with Jie are sure to come; hard toil and danger have in Jian their home.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Jie denotes relaxation and ease. In a state of relaxation and ease there are sure to be losses; and hence Jie is followed by Sun.**","text.tab3":"&0&\n**Deliverance (Xie): In (the state indicated by) Xiè advantage will be found in the south-west. If no (further) operations be called for, there will be good fortune in coming back (to the old conditions). If some operations be called for, there will be good fortune in the early conducting of them.**\n**Great Symbol: (The trigram representing) thunder and that for rain, with these phenomena in a state of manifestation, form Kieh. The superior man, in accordance with this, forgives errors, and deals gently with crimes.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Xieh we have (the trigram expressive of) peril going on to that expressive of movement, By movement there is an escape from the peril :— (this is the meaning of) Kieh. 2. ‘In (the state indicated by) Kieh, advantage will be found in the south-west :'—the movement (thus) intimated will win all. That ‘there will be good fortune in coming back (to the old conditions)’ shows that such action is that of the due medium. That ‘if some operations be necessary, there will be good fortune in the early conducting of them’ shows that such operations will be successful. 3. When heaven and earth are freed (from the grasp of winter), we have thunder and rain. When these come, the buds of the plants and trees that produce the various fruits begin to burst. Great\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: The strong (fourth) line and the weak line here are in correlation:—we judge rightly in saying that ‘its subject will commit no error.’\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘The good fortune springing from the firm correctness of the second line, undivided, is due to its subject holding the due mean.\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: For ‘a porter with his burden to be riding in a carriage’ is a thing to be ashamed of. ‘It is he himself that tempts the robbers to come:’—on whom besides can we lay the blame? (See Appendix III, i, 48.)\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘Remove your toes:’—the places (of this line\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: When ‘the superior man executes his function of removing (whatever is injurious to the idea of the hexagram),’ small men will of themselves retire.\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘A prince with his bow shoots a falcon :’— thus he removes (the promoters of) rebellion.\n\n/6&"},"110001":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/041.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): In Sun and Yi are seen how fulness and decay their course begin.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): But when Sun (or diminution) is going on without end, increase is sure to come. Sun therefore is followed by Yi.**","text.tab3":"&0&\n**Decrease (Sun): In (what is denoted by) Sǔn, if there be sincerity (in him who employs it), there will be great good fortune:--freedom from error; firmness and correctness that can be maintained; and advantage in every movement that shall be made. In what shall this (sincerity in the exercise of Sǔn) be employed? (Even) in sacrifice two baskets of grain, (though there be nothing else), may be presented.**\n**Great Symbol: (The trigram representing) a mountain and beneath it that for the waters of a marsh form Sun. The superior man, in accordance with this, restrains his wrath and represses his desires.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Sun (we see) the lower (trigram) diminished, and the upper added to. (But) the method (of action) implied in this operates also above (or, mounts upwards (also) and operates). 2. ‘If there be sincerity in this method of diminution, there will be great good fortune; freedom from error; firmness and correctness that can be maintained; and advantage in every movement that shall be made. In what shall this (sincerity in the exercise of Sun) be employed? (Even) in sacrifice, two baskets of grain, (though there be nothing else), may be presented :’—for these two baskets there ought to be the fitting time. There is a time when the strong should be diminished, and the weak should be strengthened. Diminution and increase, overflowing and emptiness :—these take place in harmony with the conditions of the time. _\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘He suspends his own affairs and hurries away\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘It will be advantageous for (the subject of) the second line, undivided, to maintain his firm correctness :'-—his central position gives its character to his aim.\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘One man, walking,’ (finds his friend) :—when three are together, doubts rise among them.\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘He diminishes the ailment under which he labours :’—this is matter for Joy.\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘The great good fortune attached to the fifth line, divided,’ is due to the blessing from above.\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘He gives increase to others without taking from what is his own:’—he obtains his wish on a grand scale.\n\n/6&"},"100011":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/042.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): In Sun and Yi are seen how fulness and decay their course begin.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): When increase goes on without end, there is sure to come a dispersing of it; and hence Yi is followed by Guai.**","text.tab3":"&0&\n**Increase (Yi(Increase)): Yi indicates that (in the state which it denotes) there will be advantage in every movement which shall be undertaken, that it will be advantageous (even) to cross the great stream.**\n**Great Symbol: (The trigram representing) wind and that for thunder form Yt. The superior man, in accordance with this, when he sees what is good, moves towards it; and when he sees his errors, he turns from them.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Yt we see the upper (trigram) diminished, and the lower added to. The satisfaction of the people (in consequence of this) is without limit. What descends from above reaches to all below, so great and brilliant is the course (of its operation). 2. That ‘there will be advantage in every movement which shall be undertaken’ appears from the central and correct (positions of the second and fifth lines), and the (general) blessing (the dispensing of which they imply).\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows that it will be advantageous for its subject in his position to make and that the third line, taken away and made to be the topmost line, or the third, in what was originally Khwa4n, three divided lines, was ‘the putting away of one man;’ and that then the change of place by 3 and 6, while they continued their proper correlation, was, one going away, and finding his friend. I cannot lay hold of any thread of reason in this.\n\n##### Symbol: ‘If the movement be greatly fortunate, no blame will be imputed to him :’—though it is not for\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows parties adding to the stores of its subject ten pairs of tortoise shells whose oracles cannot be opposed. Let him persevere in being firm and correct, and there will be good fortune. Let the king, (having the virtues thus distinguished), employ them in presenting his offerings to God, and there will be good fortune.\n\n##### Symbol: ‘Parties add to his stores :’—they come from beyond (his immediate circle) to do so.\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows increase given to its subject by means of what is evil, so that he shall (be led to good), and be without blame. Let him be sincere and pursue the path of the Mean, (so shall he secure the recognition of the ruler, like) an officer who announces himself to his prince by the symbol of his rank.\n\n##### Symbol: ‘Increase is given by means of what is evil and difficult :'—as he has in himself (the qualities called forth).\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows its subject pursuing the due course. His advice to his prince is followed. He can with advantage be relied on in such a movement as that of removing the capital.\n\n##### Symbol: ‘His advice to his prince is followed :’—his (only) object in it being the increase (of the general good).\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows its subject with sincere heart seeking to benefit (all below). There need be no question about it; the result will be great good fortune. (All below) will with sincere heart acknowledge his goodness.\n\n##### Symbol: ‘(The ruler) with sincere heart seeks to benefit (all below) :'—there need be no question (about the result). ‘(All below) with sincere heart acknowledge (his goodness) :'—he gets what he desires on a great scale.\n\n/5&\n\n&6&\n##### Top Line, Undivided: In the sixth line, undivided, we see one to whose increase none will contribute, while many will seek to assail him. He observes no regular rule in the ordering of his heart. There will be evil. XLII. Yi has the opposite meaning to Sun, and is the symbol of addition or increasing. What king W4n had in his mind, in connexion with the hexagram, was a ruler or a government operating\n\n##### Symbol: ‘To his increase none will contribute :'—this expresses but half the result. ‘Many will seek to assail him:’—they will come from beyond (his immediate circle) to do so.\n\n/6&"},"111110":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/043.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): The strong disperse the weak; Guai teaches so. Prospers the good man's way; to grief all small men go.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Guai denotes dispersion. But dispersion must be succeeded by a meeting (again). Hence Guai is followed by Gou.**","text.tab3":"&0&\n**Break-through (Guai): Kwai requires (in him who would fulfil its meaning) the exhibition (of the culprit’s guilt) in the royal court, and a sincere and earnest appeal (for symso as to dispense benefits to, and increase the resources of all the people. Two indications are evident in the lines ;—the strong line in the ruler’s seat, or the fifth line, and the weak line in the correlative place of 2. Whether there be other indications in the figure or its component trigrams will be considered in dealing with the Appendixes. The writer might well say, on general grounds, of the ruler whom he had in mind, that he would be successful in his enterprises and overcome the ‘greatest difficulties. Line 1 is strong, but its low position might seem to debar its subject from any great enterprise. Favoured as he is, however, according to the general idea of the hexagram, and specially responding to the proper correlate in 4, it is natural that he should make a movement ; and great success will make his rashness be forgotten. With paragraph 2 compare paragraph 5 of the preceding hexagram. Line 2 is weak, but in the centre, and is the correlate of 5. Friends give its subject the valuable gifts mentioned; ‘that is,’ says Kwo Yung (Sung dynasty), ‘men benefit him; the oracles of the divination are in his favour,—spirits, that is, benefit him; and finally, when the king sacrifices to God, He accepts. Heaven confers benefit from above.’ Line 3 is weak, neither central, nor in its correct position. It would seem therefore that its subject should have no increase given to him. But it is the time for giving increase, and the idea of his receiving it by means of evil things is put into the line. That such things serve for reproof and correction is well known to Chinese moralists. But the paragraph goes on also to caution and admonish. Line 4 is the place for a minister, near to that of the ruler. Its subject is weak, but his place is appropriate, and as he follows the pathy and support), with a consciousness of the peril (involved in cutting off the criminal). He should. (also) make announcement in his own city, and show that it will not be well to have recourse at once to arms. (In this way) there will be advantage in whatever he shall go forward to.**\n**Great Symbol: (The trigram representing) heaven and that for the waters of a marsh mounting above it form KwAi. The superior man, in accordance with this, bestows emolument on those below him, and dislikes allowing his gifts to accumulate (undispensed).**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Kwai is the symbol of displacing or removing. We see (in the figure) the strong (lines) displacing the weak. (We have in it the attributes of) strength and complacency. There is displacement, but harmony (continues). 2. ‘The exhibition (of the criminal’s guilt) in the royal courtyard’ is suggested by the (one) weak (line) mounted on the five strong lines. There ‘is an earnest and sincere appeal (for sympathy and support), and a consciousness of the peril (involved in the undertaking) :’—it is the realisation of this danger, which makes the method (of compassing the object) brilliant. ‘He should make an announcement in his own city, and show that it will not be well to have recourse at once to arms :’—(if he have recourse to arms), what he prefers will (soon) be exhausted. ‘There will be advantage in whatever he shall go forward to:'—when the growth of the strong (lines) has been completed, there will be an end (of the displacement). And ceaselessly it hastens on, Each season’s gifts quick to requite.’\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows its subject in (the pride of) strength advancing with his toes. He goes forward, but will not succeed. There will be ground for blame.\n\n##### Symbol: ‘Without (being able to) succeed, he goes forward :’'— this is an error.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, a T its subject full of apprehension and appealing (for sympathy and help). Late at night hostile measures may be (taken against him), but he need not be anxious about them.\n\n##### Symbol: ‘Though hostile measures be taken against him, he need not be anxious:’—he pursues the course of the due mean.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows its subject (about to advance) with strong (and determined) looks. There will be evil. (But) the superior man, bent on cutting off (the criminal), will walk alone and encounter the rain, (till he be hated by his proper associates) as if he were contaminated (by the others). (In the end) there will be no blame against him. due course, his ruler will listen to him, and he will be a support in the most critical movements. Changing the capital from place to place was frequent in the feudal times of China. That of Shang, which preceded Au, was changed five times.\n\n##### Symbol: ‘The superior man looks bent on cutting off the culprit :—there will in the end be no error.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows one from whose buttocks the skin has been stripped, and who walks slowly and with difficulty. (If he could act) like a sheep led (after its companions), occasion for repentance would disappear. But though he hear these words, he will not believe them.\n\n##### Symbol: ‘He walks slowly and with difficulty :'—he is not in the place appropriate to him.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows (the small men like) a bed of purslain, which ought to be uprooted with the utmost determination. (The subject of the line having such determination), his action, in harmony with his central position, will lead to no error or blame.\n\n##### Symbol: ‘If his action be in harmony with his central\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, divided, shows its subject without any (helpers) on whom to call. His end will be evil. XLIII. In Kwai we have the hexagram of the third month, when the last remnant, cold and dark, of winter, represented by the sixth line, is about to disappear before the advance of the warm and bright days of the approaching summer. In the yin line at the top king Wan saw the symbol of a small or bad man, a feudal prince or high minister, lending his power to maintain a corrupt government, or, it might be, a dynasty that was waxen old and ready to vanish away; and in the five undivided lines he saw the representatives of good order, or, it might be, the dynasty which was to supersede the other. This then is the subject of the hexagrami.—how bad men, statesmen corrupt and yet powerful, are to be put out of the way. And he who would accomplish the task must do so by the force of his character more than by force of arms, and by producing a general sympathy on his side. The Thwan says that he must openly denounce the criminal in the court, seek to awaken general sympathy, and at the same time go about his enterprise, conscious of its difficulty and danger.\n\n##### Symbol: ‘There is the misery of having none on whom to call:’—the end will be that he cannot continue any longer.\n\n/6&"},"011111":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/044.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Gou shows a meeting, where the many strong are met by one that's weak, yet struggles long.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Gou denotes such meeting. When things meet together, a collection is then formed. Hence Gou is followed by Cui.**","text.tab3":"&0&\n**Coming to Meet (Gou): KAu shows a female who is bold and strong. It will not be good to marry (such) a female. the enterprise is too early, and the preparation too small to make victory certain. Its subject had better not take the field. Line 2 is strong, and central, and its subject is possessed with the determination to do his part in the work of removal. But his eagerness is tempered by his occupancy of an even place; and he is cautious, and no attempts, however artful, to harm him will take effect. Line 3 is strong, and its subject displays his purpose too eagerly. Being beyond the central position, moreover, gives an indication of evil. Lines 3 and 6 are also proper correlates; and, as elsewhere in the Yi, the meeting of yin and yang lines is associated with falling rain. The subject of 3, therefore, communicates with 6, in a way that annoys his associates ; but nevertheless he commits no error, and, in the end, incurs no blame. Line 4 is not in the centre, nor in an odd place, appropriate to it as undivided. Its subject therefore will not be at rest, nor able to do anything to accomplish the idea of the hexagram. He is symbolised by a culprit, who, according to the ancient and modern custom of Chinese courts, has been bastinadoed till he presents the appearance in the Text. Alone he can do nothing; if he could follow others, like a sheep led along, he might accomplish something, but he will not listen to advice. Purslain grows in shady places, and hence we find it here in close contiguity to the topmost line, which is yin. As 5 is the ruler’s seat, evil may come to him from such contiguity, and strenuous efforts must be made to prevent such an evil. The subject of the line, the ruler in the central place, will commit no error. It must be allowed that the symbolism in this line is not easily managed. The subject of the 6th line, standing alone, may be easily disposed of.**\n**Great Symbol: (The trigram representing) wind and that for the sky above it form KAu. The sovereign, in accordance with this, delivers his charges, and promulgates his announcements throughout the four quarters (of the kingdom).**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Kau has the significance of unexpectedly coming on. (We see in it) the weak (line) coming unexpectedly on the strong ones. 2. ‘It will not be good to marry (such) a female :—one (so symbolised) should not be long associated with. 3. Heaven and earth meeting together (as here represented), all the variety of natural things become fully displayed. 4. When a strong (line) finds itself in the central and correct position, (good government) will greatly prevail all under the sky. 5. Great indeed is the significance of what has to be done at the time indicated by Kau!\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows how its subject should be kept (like a carriage) tied and fastened to a metal drag, in which case with firm correctness there will be good fortune. (But) if he move in any direction, evil will appear. He will be (like) a lean pig, which is sure to keep jumping about. The first line, divided, shows its subject with a sincere desire (for union), but unable to carry it out, so that disorder is brought into the sphere of his union. If he cry out (for help to his proper correlate), all at once (his tears) will give place subject ofline 1. It has come into the possession of the subject of 2, by virtue of the meaning of the name Ku, which I have pointed out. With his strength therefore he can repress the advance of 1. The first line, divided, shows its subject advancing upwards with the welcome (of those above him). There will be great good fortune.\n\n##### Symbol: ‘Tied and fastened to a metal drag :’—(this\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows its subject with a wallet of fish. There will be no error. But it will not be well to let (the subject of the first line) go forward to the guests. The second line, divided, shows its subject led forward (by his correlate). There will be good fortune, and freedom from error. There is entire sincerity, and in that case (even the small offerings of) the vernal sacrifice are acceptable. The second line, undivided, shows its subject with that sincerity which will make even the (small) offerings of the vernal sacrifice acceptable. There will be no error.\n\n##### Symbol: ‘He has a wallet of fish :'—it is right for him not to allow (the subject of the first line) to get to the guests.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows one from whose buttocks the skin has been stripped so that he walks with difficulty. The position is perilous, but there will be no great error. The third line, divided, shows its subject striving after union
