吉。"]},{"num":2,"name":"坤为地","sequence":"000000","symbol":"䷁","short_name":"坤","ci":["坤，元亨，利牝马之贞。君子有攸往，先迷后得主利。西南得朋，东北丧朋，安贞吉。","初六，履霜，坚冰至。","六二，直方大，不习，无不利。","六三，含章可贞，或从王事，无成有终。","六四，括囊，无咎无誉。","六五，黄裳，元吉。","上六，龙战于野，其血玄黄。","用六，利永贞。"]},{"num":3,"name":"水雷屯","sequence":"100010","symbol":"䷂","short_name":"屯","ci":["屯，元亨，利贞。勿用有攸往，利建侯。","初九，磐桓，利居贞，利建侯。","六二，屯如邅如，乘马班如。匪寇婚媾，女子贞不字，十年乃字。","六三，即鹿无虞，惟入于林中。君子几不如舍，往吝。","六四，乘马班如，求婚媾。往吉，无不利。","九五，屯其膏，小贞吉，大贞凶。","上六，乘马班如，泣血涟如。"]},{"num":4,"name":"山水蒙","sequence":"010001","symbol":"䷃","short_name":"蒙","ci":["蒙，亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告，利贞。","初六，发蒙。利用刑人，用说桎梏，以往吝。","九二，包蒙，吉。纳妇吉，子克家。","六三，勿用取女，见金夫，不有躬，无攸利。","六四，困蒙，吝。","六五，童蒙，吉。","上九，击蒙，不利为寇，利御寇。"]},{"num":5,"name":"水天需","sequence":"111010","symbol":"䷄","short_name":"需","ci":["需，有孚，光亨，贞吉，利涉大川。","初九，需于郊，利用恒，无咎。","九二，需于沙，小有言，终吉。","九三，需于泥，致寇至。","六四，需于血，出自穴。","九五，需于酒食，贞吉。","上六，入于穴，有不速之客三人来。敬之，终吉。"]},{"num":6,"name":"天水讼","sequence":"010111","symbol":"䷅","short_name":"讼","ci":["讼，有孚，窒惕，中吉，终凶。利见大人，不利涉大川。","初六，不永所事，小有言，终吉。","九二，不克讼，归而逋其邑，人三百户，无眚。","六三，食旧德，贞厉，终吉。或从王事，无成。","九四，不克讼，复即命渝，安贞吉。","九五，讼，元吉。","上九，或锡之鞶带，终朝三褫之。"]},{"num":7,"name":"地水师","sequence":"010000","symbol":"䷆","short_name":"师","ci":["师，贞，丈人吉，无咎。","初六，师出以律，否臧凶。","九二，在师中吉，无咎，王三锡命。","六三，师或舆尸，凶。","六四，师左次，无咎。","六五，田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。","上六，大君有命，开国承家，小人勿用。"]},{"num":8,"name":"水地比","sequence":"000010","symbol":"䷇","short_name":"比","ci":["比，吉。原筮元永贞，无咎。不宁方来，后夫凶。","初六，有孚比之，无咎。有孚盈缶，终来有它吉。","六二，比之自内，贞吉。","六三，比之匪人。","六四，外比之，贞吉。","九五，显比，王用三驱，失前禽。邑人不诫，吉。","上六，比之无首，凶。"]},{"num":9,"name":"风天小畜","sequence":"111011","symbol":"䷈","short_name":"小畜","ci":["小畜，亨。密云不雨，自我西郊。","初九，复自道，何其咎？吉。","九二，牵复，吉。","九三，舆说辐，夫妻反目。","六四，有孚，血去惕出，无咎。","九五，有孚挛如，富以其邻。","上九，既雨既处，尚德载，妇贞厉。月几望，君子征凶。"]},{"num":10,"name":"天泽履","sequence":"110111","symbol":"䷉","short_name":"履","ci":["履虎尾，不咥人，亨。","初九，素履，往，无咎。","九二，履道坦坦，幽人贞吉。","六三，眇能视，跛能履。履虎尾，咥人，凶。武人为于大君。","九四，履虎尾，愬愬，终吉。","九五，夬履，贞厉。","上九，视履，考祥其旋，元吉。"]},{"num":11,"name":"地天泰","sequence":"111000","symbol":"䷊","short_name":"泰","ci":["泰，小往大来，吉亨。","初九，拔茅茹，以其汇，征吉。","九二，包荒，用冯河，不遐遗，朋亡，得尚于中行。","九三，无平不陂，无往不复。艰贞，无咎。勿恤其孚，于食有福。","六四，翩翩，不富以其邻，不戒以孚。","六五，帝乙归妹，以祉元吉。","上六，城复于隍，勿用师。自邑告命，贞吝。"]},{"num":12,"name":"天地否","sequence":"000111","symbol":"䷋","short_name":"否","ci":["否之匪人，不利君子贞，大往小来。","初六，拔茅茹，以其汇，贞吉，亨。","六二，包承，小人吉，大人否亨。","六三，包羞。","九四，有命无咎，畴离祉。","九五，休否，大人吉。其亡其亡，系于苞桑。","上九，倾否，先否后喜。"]},{"num":13,"name":"天火同人","sequence":"101111","symbol":"䷌","short_name":"同人","ci":["同人于野，亨。利涉大川，利君子贞。","初九，同人于门，无咎。","六二，同人于宗，吝。","九三，伏戎于莽，升其高陵，三岁不兴。","九四，乘其墉，弗克攻，吉。","九五，同人，先号咷而后笑，大师克相遇。","上九，同人于郊，无悔。"]},{"num":14,"name":"火天大有","sequence":"111101","symbol":"䷍","short_name":"大有","ci":["大有，元亨。","初九，无交害，匪咎，艰则无咎。","九二，大车以载，有攸往，无咎。","九三，公用亨于天子，小人弗克。","九四，匪其彭，无咎。","六五，厥孚交如，威如，吉。","上九，自天祐之，吉，无不利。"]},{"num":15,"name":"地山谦","sequence":"001000","symbol":"䷎","short_name":"谦","ci":["谦，亨，君子有终。","初六，谦谦君子，用涉大川，吉。","六二，鸣谦，贞吉。","九三，劳谦，君子有终，吉。","六四，无不利，㧑谦。","六五，不富以其邻，利用侵伐，无不利。","上六，鸣谦，利用行师，征邑国。"]},{"num":16,"name":"雷地豫","sequence":"000100","symbol":"䷏","short_name":"豫","ci":["豫，利建侯、行师。","初六，鸣豫，凶。","六二，介于石，不终日，贞吉。","六三，盱豫，悔，迟有悔。","九四，由豫，大有得。勿疑，朋盍簪。","六五，贞疾，恒不死。","上六，冥豫，成有渝，无咎。"]},{"num":17,"name":"泽雷随","sequence":"100110","symbol":"䷐","short_name":"随","ci":["随，元亨利贞，无咎。","初九，官有渝，贞吉。出门交有功。","六二，系小子，失丈夫。","六三，系丈夫，失小子。随有求得，利居贞。","九四，随有获，贞凶。有孚在道以明，何咎？","九五，孚于嘉，吉。","上六，拘系之，乃从维之，王用亨于西山。"]},{"num":18,"name":"山风蛊","sequence":"011001","symbol":"䷑","short_name":"蛊","ci":["蛊，元亨，利涉大川。先甲三日，后甲三日。","初六，干父之蛊。有子，考无咎，厉，终吉。","九二，干母之蛊，不可贞。","九三，干父之蛊，小有悔，无大咎。","六四，裕父之蛊，往见吝。","六五，干父之蛊，用誉。","上九，不事王侯，高尚其事。"]},{"num":19,"name":"地泽临","sequence":"110000","symbol":"䷒","short_name":"临","ci":["临，元亨利贞，至于八月有凶。","初九，咸临，贞吉。","九二，咸临，吉，无不利。","六三，甘临，无攸利，既忧之，无咎。","六四，至临，无咎。","六五，知临，大君之宜，吉。","上六，敦临，吉，无咎。"]},{"num":20,"name":"风地观","sequence":"000011","symbol":"䷓","short_name":"观","ci":["观，盥而不荐，有孚颙若。","初六，童观，小人无咎，君子吝。","六二，窥观，利女贞。","六三，观我生，进退。","六四，观国之光，利用宾于王。","九五，观我生，君子无咎。","上九，观其生，君子无咎。"]},{"num":21,"name":"火雷噬嗑","sequence":"100101","symbol":"䷔","short_name":"噬嗑","ci":["噬嗑，亨，利用狱。","初九，屦校灭趾，无咎。","六二，噬肤灭鼻，无咎。","六三，噬腊肉，遇毒。小吝，无咎。","九四，噬干胏，得金矢。利艰贞，吉。","六五，噬干肉，得黄金。贞厉，无咎。","上九，何校灭耳，凶。"]},{"num":22,"name":"山火贲","sequence":"101001","symbol":"䷕","short_name":"贲","ci":["贲，亨，小利有攸往。","初九，贲其趾，舍车而徒。","六二，贲其须。","九三，贲如濡如，永贞吉。","六四，贲如皤如，白马翰如，匪寇婚媾。","六五，贲于丘园，束帛戋戋。吝，终吉。","上九，白贲，无咎。"]},{"num":23,"name":"山地剥","sequence":"000001","symbol":"䷖","short_name":"剥","ci":["剥，不利有攸往。","初六，剥床以足，蔑贞凶。","六二，剥床以辨，蔑贞凶。","六三，剥之无咎。","六四，剥床以肤，凶。","六五，贯鱼，以宫人宠，无不利。","上九，硕果不食，君子得舆，小人剥庐。"]},{"num":24,"name":"地雷复","sequence":"100000","symbol":"䷗","short_name":"复","ci":["复，亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。","初九，不远复，无祇悔，元吉。","六二，休复，吉。","六三，频复，厉，无咎。","六四，中行独复。","六五，敦复，无悔。","上六，迷复，凶，有灾眚。用行师，终有大败。以其国君，凶，至于十年不克征。"]},{"num":25,"name":"天雷无妄","sequence":"100111","symbol":"䷘","short_name":"无妄","ci":["无妄，元亨利贞。其匪正有眚，不利有攸往。","初九，无妄，往吉。","六二，不耕获，不菑畬，则利有攸往。","六三，无妄之灾，或系之牛。行人之得，邑人之灾。","九四，可贞，无咎。","九五，无妄之疾，勿药有喜。","上九，无妄，行有眚，无攸利。"]},{"num":26,"name":"山天大畜","sequence":"111001","symbol":"䷙","short_name":"大畜","ci":["大畜，利贞，不家食吉，利涉大川。","初九，有厉，利已。","九二，舆说輹。","九三，良马逐，利艰贞。曰闲舆卫，利有攸往。","六四，童牛之牿，元吉。","六五，豮豕之牙，吉。","上九，何天之衢，亨。"]},{"num":27,"name":"山雷颐","sequence":"100001","symbol":"䷚","short_name":"颐","ci":["颐贞吉，观颐，自求口实。","初九，舍尔灵龟，观我朵颐，凶。","六二，颠颐，拂经；于丘颐，征凶。","六三，拂颐，贞凶。十年勿用，无攸利。","六四，颠颐，吉。虎视眈眈，其欲逐逐，无咎。","六五，拂经，居贞吉，不可涉大川。","上九，由颐，厉吉，利涉大川。"]},{"num":28,"name":"泽风大过","sequence":"011110","symbol":"䷛","short_name":"大过","ci":["大过，栋桡。利有攸往，亨。","初六，藉用白茅，无咎。","九二，枯杨生稊，老夫得其女妻，无不利。","九三，栋桡，凶。","九四，栋隆，吉，有它吝。","九五，枯杨生华，老妇得其士夫，无咎无誉。","上六，过涉灭顶，凶，无咎。"]},{"num":29,"name":"坎为水","sequence":"010010","symbol":"䷜","short_name":"坎","ci":["习坎，有孚，维心亨，行有尚。","初六，习坎，入于坎窞，凶。","九二，坎有险，求小得。","六三，来之坎坎，险且枕。入于坎窞，勿用。","六四，樽酒，簋贰，用缶。纳约自牖，终无咎。","九五，坎不盈，祇既平，无咎。","上六，系用徽𬙊，寘于丛棘。三岁不得，凶。"]},{"num":30,"name":"离为火","sequence":"101101","symbol":"䷝","short_name":"离","ci":["离，利贞，亨，畜牝牛吉。","初九，履错然，敬之，无咎。","六二，黄离，元吉。","九三，日昃之离，不鼓缶而歌，则大耊之嗟，凶。","九四，突如其来如，焚如，死如，弃如。","六五，出涕沱若，戚嗟若，吉。","上九，王用出征，有嘉折首，获匪其丑，无咎。"]},{"num":31,"name":"泽山咸","sequence":"001110","symbol":"䷞","short_name":"咸","ci":["咸，亨利贞，取女吉。","初六，咸其拇。","六二，咸其腓，凶，居吉。","九三，咸其股，执其随，往吝。","九四，贞吉，悔亡。憧憧往来，朋从尔思。","九五，咸其脢，无悔。","上六，咸其辅颊舌。"]},{"num":32,"name":"雷风恒","sequence":"011100","symbol":"䷟","short_name":"恒","ci":["恒，亨，无咎，利贞，利有攸往。","初六，浚恒，贞凶，无攸利。","九二，悔亡。","九三，不恒其德，或承之羞，贞吝。","九四，田无禽。","六五，恒其德贞，妇人吉，夫子凶。","上六，振恒，凶。"]},{"num":33,"name":"天山遁","sequence":"001111","symbol":"䷠","short_name":"遁","ci":["遁亨，小利贞。","初六，遁尾厉，勿用有攸往。","六二，执之用黄牛之革，莫之胜说。","九三，系遁，有疾厉，畜臣妾吉。","九四，好遁，君子吉，小人否。","九五，嘉遁，贞吉。","上九，肥遁，无不利。"]},{"num":34,"name":"雷天大壮","sequence":"111100","symbol":"䷡","short_name":"大壮","ci":["大壮，利贞。","初九，壮于趾，征凶，有孚。","九二，贞吉。","九三，小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。","九四，贞吉，悔亡。藩决不羸，壮于大舆之輹。","六五，丧羊于易，无悔。","上六，羝羊触藩，不能退，不能遂。无攸利，艰则吉。"]},{"num":35,"name":"火地晋","sequence":"000101","symbol":"䷢","short_name":"晋","ci":["晋，康侯用锡马蕃庶，昼日三接。","初六，晋如摧如，贞吉。罔孚，裕无咎。","六二，晋如愁如，贞吉。受兹介福，于其王母。","六三，众允，悔亡。","九四，晋如鼫鼠，贞厉。","六五，悔亡，失得勿恤。往吉，无不利。","上九，晋其角，维用伐邑。厉吉无咎，贞吝。"]},{"num":36,"name":"地火明夷","sequence":"101000","symbol":"䷣","short_name":"明夷","ci":["明夷，利艰贞。","初九，明夷于飞，垂其翼，君子于行，三日不食。有攸往，主人有言。","六二，明夷，夷于左股，用拯马壮吉。","九三，明夷于南狩，得其大首，不可疾贞。","六四，入于左腹，获明夷之心，于出门庭。","六五，箕子之明夷，利贞。","上六，不明晦，初登于天，后入于地。"]},{"num":37,"name":"风火家人","sequence":"101011","symbol":"䷤","short_name":"家人","ci":["家人，利女贞。","初九，闲有家，悔亡。","六二，无攸遂，在中馈，贞吉。","九三，家人嗃嗃，悔厉吉。妇子嘻嘻，终吝。","六四，富家，大吉。","九五，王假有家，勿恤，吉。","上九，有孚威如，终吉。"]},{"num":38,"name":"火泽睽","sequence":"110101","symbol":"䷥","short_name":"睽","ci":["睽，小事吉。","初九，悔亡，丧马勿逐自复。见恶人，无咎。","九二，遇主于巷，无咎。","六三，见舆曳，其牛掣。其人天且劓，无初有终。","九四，睽孤，遇元夫。交孚，厉，无咎。","六五，悔亡。厥宗噬肤，往何咎？","上九，睽孤，见豕负涂，载鬼一车。先张之弧，后说之弧。匪寇婚媾。往，遇雨则吉。"]},{"num":39,"name":"水山蹇","sequence":"001010","symbol":"䷦","short_name":"蹇","ci":["蹇，利西南，不利东北。利见大人，贞吉。","初六，往蹇来誉。","六二，王臣蹇蹇，匪躬之故。","九三，往蹇来反。","六四，往蹇来连。","九五，大蹇朋来。","上六，往蹇来硕，吉，利见大人。"]},{"num":40,"name":"雷水解","sequence":"010100","symbol":"䷧","short_name":"解","ci":["解，利西南。无所往，其来复吉；有攸往，夙吉。","初六，无咎。","九二，田获三狐，得黄矢，贞吉。","六三，负且乘，致寇至，贞吝。","九四，解而拇，朋至斯孚。","六五，君子维有解，吉，有孚于小人。","上六，公用射隼于高墉之上，获之，无不利。"]},{"num":41,"name":"山泽损","sequence":"110001","symbol":"䷨","short_name":"损","ci":["损，有孚，元吉，无咎，可贞，利有攸往。曷之用？二簋可用享。","初九，已事遄往，无咎。酌损之。","九二，利贞，征凶。弗损，益之。","六三，三人行，则损一人；一人行，则得其友。","六四，损其疾，使遄有喜。无咎。","六五，或益之十朋之龟，弗克违，元吉。","上九，弗损，益之。无咎，贞吉，利有攸往。得臣无家。"]},{"num":42,"name":"风雷益","sequence":"100011","symbol":"䷩","short_name":"益","ci":["益，利有攸往，利涉大川。","初九，利用为大作，元吉，无咎。","六二，或益之十朋之龟，弗克违，永贞吉。王用享于帝，吉。","六三，益之用凶事，无咎。有孚中行，告公用圭。","六四，中行，告公从，利用为依迁国。","九五，有孚惠心，勿问，元吉。有孚惠我德。","上九，莫益之，或击之。立心勿恒，凶。"]},{"num":43,"name":"泽天夬","sequence":"111110","symbol":"䷪","short_name":"夬","ci":["夬，扬于王庭，孚号有厉。告自邑，不利即戎，利有攸往。","初九，壮于前趾，往不胜为咎。","九二，惕号，莫夜有戎，勿恤。","九三，壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。","九四，臀无肤，其行次且。牵羊悔亡，闻言不信。","九五，苋陆夬夬，中行无咎。","上六，无号，终有凶。"]},{"num":44,"name":"天风姤","sequence":"011111","symbol":"䷫","short_name":"姤","ci":["姤，女壮，勿用取女。","初六，系于金柅，贞吉。有攸往，见凶。羸豕孚蹢躅。","九二，包有鱼，无咎，不利宾。","九三，臀无肤，其行次且。厉，无大咎。","九四，包无鱼，起凶。","九五，以杞包瓜，含章，有陨自天。","上九，姤其角，吝，无咎。"]},{"num":45,"name":"泽地萃","sequence":"000110","symbol":"䷬","short_name":"萃","ci":["萃，亨。王假有庙，利见大人。亨利贞，用大牲吉，利有攸往。","初六，有孚不终，乃乱乃萃。若号，一握为笑，勿恤，往无咎。","六二，引吉无咎，孚乃利用禴。","六三，萃如嗟如，无攸利。往无咎，小吝。","九四，大吉无咎。","九五，萃有位，无咎。匪孚，元永贞，悔亡。","上六，赍咨涕洟，无咎。"]},{"num":46,"name":"地风升","sequence":"011000","symbol":"䷭","short_name":"升","ci":["升，元亨。用见大人，勿恤，南征吉。","初六，允升，大吉。","九二，孚乃利用禴，无咎。","九三，升虚邑。","六四，王用亨于岐山，吉，无咎。","六五，贞吉，升阶。","上六，冥升，利于不息之贞。"]},{"num":47,"name":"泽水困","sequence":"010110","symbol":"䷮","short_name":"困","ci":["困，亨，贞大人吉，无咎。有言不信。","初六，臀困于株木，入于幽谷，三岁不觌。","九二，困于酒食，朱绂方来，利用享祀，征凶，无咎。","六三，困于石，据于蒺蔾，入于其宫，不见其妻，凶。","九四，来徐徐，困于金车。吝，有终。","九五，劓刖，困于赤绂。乃徐有说，利用祭祀。","上六，困于葛藟，于臲卼，曰动悔有悔，征吉。"]},{"num":48,"name":"水风井","sequence":"011010","symbol":"䷯","short_name":"井","ci":["井，改邑不改井，无丧无得，往来井井。汔至，亦未繘井，羸其瓶，凶。","初六，井泥不食，旧井无禽。","九二，井谷射鲋，瓮敝漏。","九三，井渫不食，为我心恻。可用汲，王明并受其福。","六四，井甃无咎。","九五，井洌，寒泉食。","上六，井收勿幕，有孚元吉。"]},{"num":49,"name":"泽火革","sequence":"101110","symbol":"䷰","short_name":"革","ci":["革，已日乃孚，元亨利贞，悔亡。","初九，巩用黄牛之革。","六二，已日乃革之，征吉，无咎。","九三，征凶，贞厉。革言三就，有孚。","九四，悔亡，有孚改命吉。","九五，大人虎变，未占有孚。","上六，君子豹变，小人革面。征凶，居贞吉。"]},{"num":50,"name":"火风鼎","sequence":"011101","symbol":"䷱","short_name":"鼎","ci":["鼎，元吉亨。","初六，鼎顚趾，利出否，得妾以其子，无咎。","九二，鼎有实，我仇有疾，不我能即，吉。","九三，鼎耳革，其行塞，雉膏不食。方雨亏悔，终吉。","九四，鼎折足，覆公𫗧，其形渥，凶。","六五，鼎黄耳金铉，利贞。","上九，鼎玉铉，大吉，无不利。"]},{"num":51,"name":"震为雷","sequence":"100100","symbol":"䷲","short_name":"震","ci":["震亨，震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。","初九，震来虩虩，后笑言哑哑，吉。","六二，震来厉，亿丧贝，跻于九陵。勿逐，七日得。","六三，震苏苏，震行无眚。","九四，震遂泥。","六五，震往来厉，亿无丧有事。","上六，震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。"]},{"num":52,"name":"艮为山","sequence":"001001","symbol":"䷳","short_name":"艮","ci":["艮其背，不获其身。行其庭，不见其人，无咎。","初六，艮其趾，无咎，利永贞。","六二，艮其腓，不拯其随，其心不快。","九三，艮其限，列其夤，厉熏心。","六四，艮其身，无咎。","六五，艮其辅，言有序，悔亡。","上九，敦艮吉。"]},{"num":53,"name":"风山渐","sequence":"001011","symbol":"䷴","short_name":"渐","ci":["渐，女归吉，利贞。","初六，鸿渐于干，小子厉，有言，无咎。","六二，鸿渐于磐，饮食衎衎，吉。","九三，鸿渐于陆，夫征不复，妇孕不育，凶。利御寇。","六四，鸿渐于木，或得其桷，无咎。","九五，鸿渐于陵，妇三岁不孕。终莫之胜，吉。","上九，鸿渐于陆，其羽可用为仪，吉。"]},{"num":54,"name":"雷泽归妹","sequence":"110100","symbol":"䷵","short_name":"归妹","ci":["归妹，征凶，无攸利。","初九，归妹以娣，跛能履，征吉。","九二，眇能视 ，利幽人之贞。","六三，归妹以须，反归以娣。","九四，归妹愆期，迟归有时。","六五，帝乙归妹，其君之袂不如其娣之袂良。月几望，吉。","上六，女承筐无实，士刲羊无血，无攸利。"]},{"num":55,"name":"雷火丰","sequence":"101100","symbol":"䷶","short_name":"丰","ci":["丰，亨，王假之。勿忧，宜日中。","初九，遇其配主，虽旬无咎，往有尚。","六二，丰其蔀，日中见斗。往得疑疾，有孚发若，吉。","九三，丰其沛，日中见沬 。折其右肱，无咎。","九四，丰其蔀，日中见斗，遇其夷主，吉。","六五，来章，有庆誉，吉。","上六，丰其屋，蔀其家。窥其户，阒其无人 ，三岁不觌，凶。"]},{"num":56,"name":"火山旅","sequence":"001101","symbol":"䷷","short_name":"旅","ci":["旅，小亨，旅贞吉。","初六，旅琐琐，斯其所取灾。","六二，旅即次，怀其资，得童仆贞。","九三，旅焚其次，丧其童仆，贞厉。","九四，旅于处，得其资斧，我心不快。","六五，射雉，一矢亡，终以誉命。","上九，鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。"]},{"num":57,"name":"巽为风","sequence":"011011","symbol":"䷸","short_name":"巽","ci":["巽，小亨，利有攸往，利见大人。","初六，进退，利武人之贞。","九二，巽在床下，用史巫纷若，吉，无咎。","九三，频巽，吝。","六四，悔亡，田获三品。","九五，贞吉，悔亡，无不利。无初有终，先庚三日，后庚三日，吉。","上九，巽在床下，丧其资斧，贞凶。"]},{"num":58,"name":"兑为泽","sequence":"110110","symbol":"䷹","short_name":"兑","ci":["兑，亨利贞。","初九，和兑吉。","九二，孚兑吉，悔亡。","六三，来兑凶。","九四，商兑未宁，介疾有喜。","九五，孚于剥，有厉。","上六，引兑。"]},{"num":59,"name":"风水涣","sequence":"010011","symbol":"䷺","short_name":"涣","ci":["涣，亨。王假有庙，利涉大川，利贞。","初六，用拯马壮，吉。","九二，涣奔其机，悔亡。","六三，涣其躬，无悔。","六四，涣其群，元吉。涣有丘，匪夷所思。","九五，涣汗其大号，涣王居，无咎。","上九，涣其血去逖出，无咎。"]},{"num":60,"name":"水泽节","sequence":"110010","symbol":"䷻","short_name":"节","ci":["节，亨。苦节不可贞。","初九，不出户庭，无咎。","九二，不出门庭，凶。","六三，不节若，则嗟若，无咎。","六四，安节，亨。","九五，甘节，吉，往有尚。","上六，苦节，贞凶，悔亡。"]},{"num":61,"name":"风泽中孚","sequence":"110011","symbol":"䷼","short_name":"中孚","ci":["中孚，豚鱼吉。利涉大川，利贞。","初九，虞吉，有它不燕。","九二，鸣鹤在阴，其子和之。我有好爵，吾与尔靡之。","六三，得敌，或鼓或罢，或泣或歌。","六四，月几望，马匹亡，无咎。","九五，有孚挛如，无咎。","上九，翰音登于天，贞凶。"]},{"num":62,"name":"雷山小过","sequence":"001100","symbol":"䷽","short_name":"小过","ci":["小过，亨，利贞。可小事，不可大事。飞鸟遗之音，不宜上，宜下，大吉。","初六，飞鸟以凶。","六二，过其祖，遇其妣。不及其君，遇其臣，无咎。","九三，弗过防之，从或戕之，凶。","九四，无咎，弗过遇之，往厉必戒，勿用永贞。","六五，密云不雨，自我西郊，公弋取彼在穴。","上六，弗遇过之，飞鸟离之，凶，是谓灾眚。"]},{"num":63,"name":"水火既济","sequence":"101010","symbol":"䷾","short_name":"既济","ci":["既济，亨小，利贞，初吉终乱。","初九，曳其轮，濡其尾，无咎。","六二，妇丧其茀，勿逐，七日得。","九三，高宗伐鬼方，三年克之。小人勿用。","六四，𦈡有衣袽，终日戒。","九五，东邻杀牛，不如西邻之禴祭，实受其福。","上六，濡其首，厉。"]},{"num":64,"name":"火水未济","sequence":"010101","symbol":"䷿","short_name":"未济","ci":["未济，亨。小狐汔济，濡其尾，无攸利。","初六，濡其尾，吝。","九二，曳其轮，贞吉。","六三，未济，征凶，利涉大川。","九四，贞吉悔亡，震用伐鬼方，三年有赏于大国。","六五，贞吉无悔，君子之光，有孚，吉。","上九，有孚于饮酒，无咎。濡其首，有孚失是。"]}]};
const _EMBEDDED_HEX = {"111111":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/01.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：乾刚坤柔。**\n\n#### 序\n**序卦曰：有天地，然后万物生焉。**","text.tab3":"&0&\n**乾：元亨，利贞。**\n**象曰：天行健，君子以自强不息。**\n\n/0&\n#### 彖\n\n**彖曰：大哉乾元，万物资始，乃统天。云行雨施，品物流形。大明始终，六位时成，时乘六龙以御天。乾道变化，各正性命，保合大和，乃利贞。首出庶物，万国咸宁。**\n\n#### 爻\n\n&1&\n##### 初九：潜龙，勿用。\n\n##### 象曰：潜龙勿用，阳在下也。\n\n##### 文言曰：初九曰、“潜龙勿用”，何谓也？子曰：“龙、德而隐者也。不易乎世，不成乎名，遯世无闷，不见是而无闷。乐则行之，忧则违之，确乎其不可拔，潜龙也。”\n\n/1&\n\n&2&\n##### 九二：见龙在田，利见大人。\n\n##### 象曰：见龙在田，德施普也。\n\n##### 文言曰：九二曰：“见龙在田，利见大人”，何谓也？子曰：“龙德而正中者也。庸言之信，庸行之谨，闲邪存其诚，善世而不伐，德博而化。《 易 》曰：‘ 见龙在田，利见大人 ’，君德也。”\n\n/2&\n\n&3&\n##### 九三：君子终日乾乾，夕惕若，厉，无咎。\n\n##### 象曰：终日乾乾，反复道也。\n\n##### 文言曰：九三曰：“君子终日乾乾、夕惕若、厉、无咎”。何谓也？子曰：“君子进德修业，忠信，所以进德也，修辞立其诚，所以居业也。知至至之，可与几也，知终终之，可与存义也。是故居上位而不骄，在下位而不忧，故乾乾因其时而惕，虽危无咎矣。”\n\n/3&\n\n&4&\n##### 九四：或跃在渊，无咎。\n\n##### 象曰：或跃在渊，进无咎也。\n\n##### 文言曰：九四曰：“或跃在渊，无咎。”何谓也？子曰：“上下无常，非为邪也。进退无恒，非离群也。君子进德修业，欲及时也，故无咎。”\n\n/4&\n\n&5&\n##### 九五：飞龙在天，利见大人。\n\n##### 象曰：飞龙在天，大人造也。\n\n##### 文言曰：九五曰：“飞龙在天，利见大人”。何谓也？子曰：“同声相应，同气相求。水流湿，火就燥，云从龙，风从虎，圣人作而万物覩。本乎天者亲上，本乎地者亲下，则各从其类也。”\n\n/5&\n\n&6&\n##### 上九：亢龙有悔。\n\n##### 象曰：亢龙有悔，盈不可久也。\n\n##### 文言曰：上九曰：“亢龙有悔”，何谓也？子曰：“贵而无位，高而无民，贤人在下位而无辅，是以动而有悔也。”\n\n/6&\n\n&7&\n##### 用九：见群龙无首，吉。\n\n##### 象曰：用九，天德不可为首也。\n\n/7&\n\n#### 文言\n\n**文言曰：“元”者，善之长也；“亨”者，嘉之会也；“利”者，义之和也；“贞”者，事之干也。君子体仁足以长人，嘉会足以合礼，利物足以和义，贞固足以干事。君子行此四德者，故曰“乾、元、亨、利、贞”。**\n\n##### “潜龙勿用”，下也；“见龙在田”，时舍也；“终日乾乾”，行事也；“或跃在渊”，自试也；“飞龙在天”，上治也；“亢龙有悔”、穷之灾也。乾元“用九”，天下治也。\n\n##### “潜龙勿用”，阳气潜藏。“见龙在田”，天下文明。“终日乾乾”，与时偕行。“或跃在渊”，乾道乃革。“飞龙在天”，乃位乎天德。“亢龙有悔”，与时偕极。乾元“用九”，乃见天则。\n\n##### 《乾》“元”者，始而亨者也。“利贞”者，性情也。乾始能以美利利天下，不言所利，大矣哉！\n\n##### 大哉乾乎！刚健中正，纯粹精也。六爻发挥，旁通情也。“时乘六龙”、以“御天”也，“云行雨施”、天下平也。君子以成德为行，日可见之行也。“潜”之为言也，隐而未见，行而未成，是以君子“弗用”也。\n\n##### 君子学以聚之，问以辩之，宽以居之，仁以行之。《 易 》曰“ 见龙在田、利见大人 ”，君德也。\n\n##### 九三重刚而不中，上不在天，下不在田，故“乾乾”因其时而“惕”，虽危“无咎”矣。\n\n##### 九四重刚而不中，上不在天，下不在田，中不在人，故“或”之。“或”之者、疑之也，故“无咎”。\n\n##### 夫“大人”者、与天地合其德，与日月合其明，与四时合其序，与鬼神合其吉凶，先天而天弗违，后天而奉天时。天且弗违，而况于人乎？况于鬼神乎？\n\n##### “亢”之为言也，知进而不知退，知存而不知亡，知得而不知丧。其唯圣人乎！知进退存亡而不失其正者，其唯圣人乎！"},"000000":{"text.tab1":"#### 图\n![本地图片测试(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/002.jpg)\n\n文字格式测试\n\n普通文字\n{坤|kūn}：{元|yuán}、{亨|hēng}、{利|lì}{牝|pìn}{馬|mǎ}{之|zhī}{貞|zhēn}。\n\n粗體文字 (**)\n**{坤|kūn}：{元|yuán}、{亨|hēng}、{利|lì}{牝|pìn}{馬|mǎ}{之|zhī}{貞|zhēn}。**\n\n標題文字（####）\n#### {坤|kūn}：{元|yuán}、{亨|hēng}、{利|lì}{牝|pìn}{馬|mǎ}{之|zhī}{貞|zhēn}。\n\n標題文字（#####）\n##### {坤|kūn}：{元|yuán}、{亨|hēng}、{利|lì}{牝|pìn}{馬|mǎ}{之|zhī}{貞|zhēn}。\n\n條列文字（•）\n• 一、{坤|kūn}：\n• 1. {元|yuán}、{亨|hēng}、{利|lì}{牝|pìn}{馬|mǎ}{之|zhī}{貞|zhēn}。\n\n引用文字（>）\n> {坤|kūn}：{元|yuán}、{亨|hēng}、{利|lì}{牝|pìn}{馬|mǎ}{之|zhī}{貞|zhēn}。\n\n連結文字\n[https://example.com](https://example.com)\n\n![网路图片测试 https://picsum.photos/1200/300](https://picsum.photos/1200/300)","text.tab2":"#### 杂\n\n**杂卦曰：乾刚坤柔。**\n\n#### 序\n**序卦曰：有天地，然后万物生焉。**","text.tab3":"&0&\n**坤：元亨，利牝马之贞。君子有攸往，先迷后得主，利西南得朋，东北丧朋。安贞，吉。**\n**象曰：地势坤，君子以厚德载物。**\n\n/0&\n#### 彖\n\n**彖曰：至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆。含弘光大，品物咸亨。牝马地类，行地无疆，柔顺利贞。君子攸行，先迷失道，后顺得常。西南得朋，乃与类行；东北丧朋，乃终有庆。安贞之吉，应地无疆。**\n\n#### 爻\n\n&1&\n##### 初六：履霜，坚冰至。\n\n##### 象曰：履霜坚冰，阴始凝也。驯致其道，至坚冰也。\n\n/1&\n\n&2&\n##### 六二：直，方，大，不习无不利。\n\n##### 象曰：六二之动，直以方也。不习无不利，地道光也。\n\n/2&\n\n&3&\n##### 六三：含章可贞。或从王事，无成有终。\n\n##### 象曰：含章可贞；以时发也。或从王事，知光大也。\n\n/3&\n\n&4&\n##### 六四：括囊；无咎，无誉。\n\n##### 象曰：括囊无咎，慎不害也。\n\n/4&\n\n&5&\n##### 六五：黄裳，元吉。\n\n##### 象曰：黄裳元吉，文在中也。\n\n/5&\n\n&6&\n##### 上六：龙战于野，其血玄黄。\n\n##### 象曰：战龙于野，其道穷也。\n\n/6&\n\n&7&\n##### 用六：利永贞。\n\n##### 象曰：用六永贞，以大终也。\n\n/7&\n\n#### 文言\n\n**文言曰：《坤》至柔而动也刚，至静而德方，后得主而有常，含万物而化光。坤道其顺乎，承天而时行。**\n\n##### 积善之家，必有馀庆；积不善之家，必有馀殃。臣弑其君，子弑其父，非一朝一夕之故，其所由来者渐矣，由辩之不早辩也。《 易 》曰“ 履霜、坚冰至 ”，盖言顺也。\n\n##### “直”其正也，“方”其义也。君子敬以直内，义以方外，敬义立而德不孤。“直、方、大、不习无不利”，则不疑其所行也。\n\n##### 阴虽有美“含”之以从王事，弗敢成也。地道也，妻道也，臣道也。地道“无成”而代“有终”也。天地变化，草木蕃。天地闭，贤人隐。《 易 》曰“ 括囊、无咎无誉 ”，盖言谨也。\n\n##### 君子“黄”中通理，正位居体，美在其中而畅于四支，发于事业，美之至也。\n\n##### 阴疑于阳必“战”，为其嫌于无阳也，故称“龙”焉。犹未离其类也，故称“血”焉。夫“玄黄”者、天地之杂也。天玄而地黄。"},"100010":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/03.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：屯见而不失其居。**\n\n#### 序\n**序卦曰：盈天地之间者唯万物，故受之以《屯》。《屯》者，盈也。屯者，物之始生也。**","text.tab3":"&0&\n**屯：元亨，利贞，勿用有攸往，利建侯。**\n**象曰：云，雷，屯；君子以经纶。**\n\n/0&\n#### 彖\n\n**彖曰：屯，刚柔始交而难生，动乎险中，大亨贞。雷雨之动满盈，天造草昧，宜建侯而不宁。**\n\n#### 爻\n\n&1&\n##### 初九：磐桓；利居贞，利建侯。\n\n##### 象曰：虽磐桓，志行正也。以贵下贱，大得民也。\n\n/1&\n\n&2&\n##### 六二：屯如邅如，乘马班如。匪寇婚媾，女子贞不字，十年乃字。\n\n##### 象曰：六二之难，乘刚也。十年乃字，反常也。\n\n/2&\n\n&3&\n##### 六三：即鹿无虞，惟入于林中，君子几不如舍，往吝。\n\n##### 象曰：即鹿无虞，以纵禽也。君子舍之，往吝穷也。\n\n/3&\n\n&4&\n##### 六四：乘马班如，求婚媾，往吉，无不利。\n\n##### 象曰：求而往，明也。\n\n/4&\n\n&5&\n##### 九五：屯其膏，小贞吉，大贞凶。\n\n##### 象曰：屯其膏，施未光也。\n\n/5&\n\n&6&\n##### 上六：乘马班如，泣血涟如。\n\n##### 象曰：泣血涟如，何可长也。\n\n/6&"},"010001":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/04.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：蒙杂而著。**\n\n#### 序\n**序卦曰：物生必蒙，故受之以《蒙》。《蒙》者，蒙也，物之稺也。**","text.tab3":"&0&\n**蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。**\n**象曰：山下出泉，蒙；君子以果行育德。**\n\n/0&\n#### 彖\n\n**彖曰：蒙，山下有险，险而止，蒙。蒙亨，以亨行时中也。匪我求童蒙，童蒙求我，志应也。初噬告，以刚中也。再三渎，渎则不告，渎蒙也。蒙以养正，圣功也。**\n\n#### 爻\n\n&1&\n##### 初六：发蒙，利用刑人，用说桎梏，以往吝。\n\n##### 象曰：利用刑人，以正法也。\n\n/1&\n\n&2&\n##### 九二：包蒙吉；纳妇吉；子克家。\n\n##### 象曰：子克家，刚柔接也。\n\n/2&\n\n&3&\n##### 六三：勿用取女；见金夫，不有躬，无攸利。\n\n##### 象曰：勿用取女，行不顺也。\n\n/3&\n\n&4&\n##### 六四：困蒙，吝。\n\n##### 象曰：困蒙之吝，独远实也。\n\n/4&\n\n&5&\n##### 六五：童蒙，吉。\n\n##### 象曰：童蒙之吉，顺以巽也。\n\n/5&\n\n&6&\n##### 上九：击蒙；不利为寇，利御寇。\n\n##### 象曰：利用御寇，上下顺也。\n\n/6&"},"111010":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/05.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：需，不进也。**\n\n#### 序\n**序卦曰：物稺不可不养也，故受之以《需》。《需》者，饮食之道也。**","text.tab3":"&0&\n**需：有孚，光亨，贞吉。利涉大川。**\n**象曰：云上于天，需；君子以饮食宴乐。**\n\n/0&\n#### 彖\n\n**彖曰：需，须也；险在前也。刚健而不陷，其义不困穷矣。需有孚，光亨，贞吉。位乎天位，以正中也。利涉大川，往有功也。**\n\n#### 爻\n\n&1&\n##### 初九：需于郊。利用恒，无咎。\n\n##### 象曰：需于郊，不犯难行也。利用恒，无咎；未失常也。\n\n/1&\n\n&2&\n##### 九二：需于沙。小有言，终吉。\n\n##### 象曰：需于沙，衍在中也。虽小有言，以终吉也。\n\n/2&\n\n&3&\n##### 九三：需于泥，致寇至。\n\n##### 象曰：需于泥，灾在外也。自我致寇，敬慎不败也。\n\n/3&\n\n&4&\n##### 六四：需于血，出自穴。\n\n##### 象曰：需于血，顺以听也。\n\n/4&\n\n&5&\n##### 九五：需于酒食，贞吉。\n\n##### 象曰：酒食贞吉，以中正也。\n\n/5&\n\n&6&\n##### 上六：入于穴，有不速之客三人来，敬之终吉。\n\n##### 象曰：不速之客来，敬之终吉。虽不当位，未大失也。\n\n/6&"},"010111":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/06.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：讼，不亲也。**\n\n#### 序\n**序卦曰：饮食必有讼，故受之以《讼》。**","text.tab3":"&0&\n**讼：有孚，窒。惕中吉。终凶。利见大人，不利涉大川。**\n**象曰：天与水违行，讼；君子以作事谋始。**\n\n/0&\n#### 彖\n\n**彖曰：讼，上刚下险，险而健讼。讼有孚窒，惕中吉，刚来而得中也。终凶；讼不可成也。利见大人；尚中正也。不利涉大川；入于渊也。**\n\n#### 爻\n\n&1&\n##### 初六：不永所事，小有言，终吉。\n\n##### 象曰：不永所事，讼不可长也。虽有小言，其辩明也。\n\n/1&\n\n&2&\n##### 九二：不克讼，归而逋，其邑人三百户，无眚。\n\n##### 象曰：不克讼，归而逋也。自下讼上，患至掇也。\n\n/2&\n\n&3&\n##### 六三：食旧德，贞厉，终吉，或从王事，无成。\n\n##### 象曰：食旧德，从上吉也。\n\n/3&\n\n&4&\n##### 九四：不克讼，复即命渝，安贞吉。\n\n##### 象曰：复即命，渝安贞；不失也。\n\n/4&\n\n&5&\n##### 九五：讼元吉。\n\n##### 象曰：讼元吉，以中正也。\n\n/5&\n\n&6&\n##### 上九：或锡之鞶带，终朝三褫之。\n\n##### 象曰：以讼受服，亦不足敬也。\n\n/6&"},"010000":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/07.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：比乐师忧。**\n\n#### 序\n**序卦曰：讼必有众起，故受之以《师》。《师》者，众也。**","text.tab3":"&0&\n**师：贞，丈人，吉无咎。**\n**象曰：地中有水，师；君子以容民畜众。**\n\n/0&\n#### 彖\n\n**彖曰：师，众也，贞正也，能以众正，可以王矣。刚中而应，行险而顺，以此毒天下，而民从之，吉又何咎矣。**\n\n#### 爻\n\n&1&\n##### 初六：师出以律，否臧凶。\n\n##### 象曰：师出以律，失律凶也。\n\n/1&\n\n&2&\n##### 九二：在师中吉，无咎，王三锡命。\n\n##### 象曰：在师中吉，承天宠也。王三锡命，怀万邦也。\n\n/2&\n\n&3&\n##### 六三：师或舆尸，凶。\n\n##### 象曰：师或舆尸，大无功也。\n\n/3&\n\n&4&\n##### 六四：师左次，无咎。\n\n##### 象曰：左次无咎，未失常也。\n\n/4&\n\n&5&\n##### 六五：田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。\n\n##### 象曰：长子帅师，以中行也。弟子舆尸，使不当也。\n\n/5&\n\n&6&\n##### 上六：大君有命，开国承家，小人勿用。\n\n##### 象曰：大君有命，以正功也。小人勿用，必乱邦也。\n\n/6&"},"000010":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/08.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：比乐师忧。**\n\n#### 序\n**序卦曰：众必有所比，故受之以《比》。《比》者，比也。**","text.tab3":"&0&\n**比：吉。原筮元永贞，无咎。不宁方来，后夫凶。**\n**象曰：地上有水，比；先王以建万国，亲诸侯。**\n\n/0&\n#### 彖\n\n**彖曰：比，吉也，比，辅也，下顺从也。原筮元永贞，无咎，以刚中也。不宁方来，上下应也。后夫凶，其道穷也。**\n\n#### 爻\n\n&1&\n##### 初六：有孚，比之，无咎。有孚盈缶，终来有它吉。\n\n##### 象曰：比之初六，有他吉也。\n\n/1&\n\n&2&\n##### 六二：比之自内，贞吉。\n\n##### 象曰：比之自内，不自失也。\n\n/2&\n\n&3&\n##### 六三：比之匪人。\n\n##### 象曰：比之匪人，不亦伤乎！\n\n/3&\n\n&4&\n##### 六四：外比之，贞吉。\n\n##### 象曰：外比于贤，以从上也。\n\n/4&\n\n&5&\n##### 九五：显比，王用三驱，失前禽。邑人不诫，吉。\n\n##### 象曰：显比之吉，位正中也。舍逆取顺，失前禽也。邑人不诫，上使中也。\n\n/5&\n\n&6&\n##### 上六：比之无首，凶。\n\n##### 象曰：比之无首，无所终也。\n\n/6&"},"111011":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/09.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：小畜，寡也。**\n\n#### 序\n**序卦曰：比必有所畜，故受之以《小畜》。**","text.tab3":"&0&\n**小畜：亨。密云不雨，自我西郊。**\n**象曰：风行天上，小畜；君子以懿文德。**\n\n/0&\n#### 彖\n\n**彖曰：小畜，柔得位，而上下应之，曰小畜。健而巽，刚中而志行，乃亨。密云不雨，尚往也。自我西郊，施未行也。**\n\n#### 爻\n\n&1&\n##### 初九：复自道，何其咎，吉。\n\n##### 象曰：复自道，其义吉也。\n\n/1&\n\n&2&\n##### 九二：牵复，吉。\n\n##### 象曰：牵复在中，亦不自失也。\n\n/2&\n\n&3&\n##### 九三：舆说辐，夫妻反目。\n\n##### 象曰：夫妻反目，不能正室也。\n\n/3&\n\n&4&\n##### 六四：有孚，血去惕出，无咎。\n\n##### 象曰：有孚惕出，上合志也。\n\n/4&\n\n&5&\n##### 九五：有孚挛如，富以其邻。\n\n##### 象曰：有孚挛如，不独富也。\n\n/5&\n\n&6&\n##### 上九：既雨既处，尚德载，妇贞厉。月几望，君子征凶。\n\n##### 象曰：既雨既处，德积载也。君子征凶，有所疑也。\n\n/6&"},"110111":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/10.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：履，不处也。**\n\n#### 序\n**序卦曰：物畜然后有礼，故受之以《履》。**","text.tab3":"&0&\n**履虎尾，不咥人，亨。**\n**象曰：上天下泽，履；君子以辨上下，安民志。**\n\n/0&\n#### 彖\n\n**彖曰：履，柔履刚也。说而应乎乾，是以履虎尾，不咥人，亨。刚中正，履帝位而不疚，光明也。**\n\n#### 爻\n\n&1&\n##### 初九：素履，往无咎。\n\n##### 象曰：素履之往，独行愿也。\n\n/1&\n\n&2&\n##### 九二：履道坦坦，幽人贞吉。\n\n##### 象曰：幽人贞吉，中不自乱也。\n\n/2&\n\n&3&\n##### 六三：眇能视，跛能履，履虎尾，咥人，凶。武人为于大君。\n\n##### 象曰：眇能视；不足以有明也。跛能履；不足以与行也，咥人之凶；位不当也。武人为于大君；志刚也。\n\n/3&\n\n&4&\n##### 九四：履虎尾，诉诉，终吉。\n\n##### 象曰：诉诉终吉，志行也。\n\n/4&\n\n&5&\n##### 九五：夬履，贞厉。\n\n##### 象曰：夬履贞厉，位正当也。\n\n/5&\n\n&6&\n##### 上九：视履考祥，其旋元吉。\n\n##### 象曰：元吉在上，大有庆也。\n\n/6&"},"111000":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/11.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：否泰，反其类也。**\n\n#### 序\n**序卦曰：履而泰然后安，故受之以《泰》。《泰》者，通也。**","text.tab3":"&0&\n**泰：小往大来，吉亨。**\n**象曰：天地交泰，后以财成天地之道，辅相天地之宜，以左右民。**\n\n/0&\n#### 彖\n\n**彖曰：泰，小往大来，吉亨。则是天地交，而万物通也；上下交，而其志同也。内阳而外阴，内健而外顺，内君子而外小人，君子道长，小人道消也。**\n\n#### 爻\n\n&1&\n##### 初九：拔茅茹，以其汇，征吉。\n\n##### 象曰：拔茅征吉，志在外也。\n\n/1&\n\n&2&\n##### 九二：包荒，用冯河，不遐遗，朋亡，得尚于中行。\n\n##### 象曰：包荒，得尚于中行，以光大也。\n\n/2&\n\n&3&\n##### 九三：无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。\n\n##### 象曰：无往不复，天地际也。\n\n/3&\n\n&4&\n##### 六四：翩翩，不富，以其邻，不戒以孚。\n\n##### 象曰：翩翩不富，皆失实也。不戒以孚，中心愿也。\n\n/4&\n\n&5&\n##### 六五：帝乙归妹，以祉元吉。\n\n##### 象曰：以祉元吉，中以行愿也。\n\n/5&\n\n&6&\n##### 上六：城复于隍，勿用师。自邑告命，贞吝。\n\n##### 象曰：城复于隍，其命乱也。\n\n/6&"},"000111":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/12.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：否泰，反其类也。**\n\n#### 序\n**序卦曰：物不可以终通，故受之以《否》。**","text.tab3":"&0&\n**否之匪人，不利君子贞，大往小来。**\n**象曰：天地不交，否；君子以俭德辟难，不可荣以禄。**\n\n/0&\n#### 彖\n\n**彖曰：否之匪人，不利君子贞。大往小来，则是天地不交，而万物不通也；上下不交，而天下无邦也。内阴而外阳，内柔而外刚，内小人而外君子。小人道长，君子道消也。**\n\n#### 爻\n\n&1&\n##### 初六：拔茅茹，以其汇，贞吉亨。\n\n##### 象曰：拔茅贞吉，志在君也。\n\n/1&\n\n&2&\n##### 六二：包承。小人吉，大人否，亨。\n\n##### 象曰：大人否亨，不乱群也。\n\n/2&\n\n&3&\n##### 六三：包羞。\n\n##### 象曰：包羞，位不当也。\n\n/3&\n\n&4&\n##### 九四：有命，无咎，畴离祉。\n\n##### 象曰：有命无咎，志行也。\n\n/4&\n\n&5&\n##### 九五：休否，大人吉。其亡其亡，系于苞桑。\n\n##### 象曰：大人之吉，位正当也。\n\n/5&\n\n&6&\n##### 上九：倾否，先否后喜。\n\n##### 象曰：否终则倾，何可长也。\n\n/6&"},"101111":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/13.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：同人，亲也。**\n\n#### 序\n**序卦曰：物不可以终否，故受之以《同人》。**","text.tab3":"&0&\n**同人于野，亨。利涉大川，利君子贞。**\n**象曰：天与火，同人；君子以类族辨物。**\n\n/0&\n#### 彖\n\n**彖曰：同人，柔得位得中，而应乎乾，曰同人。同人曰，同人于野，亨。利涉大川，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。**\n\n#### 爻\n\n&1&\n##### 初九：同人于门，无咎。\n\n##### 象曰：出门同人，又谁咎也。\n\n/1&\n\n&2&\n##### 六二：同人于宗，吝。\n\n##### 象曰：同人于宗，吝道也。\n\n/2&\n\n&3&\n##### 九三：伏戎于莽，升其高陵，三岁不兴。\n\n##### 象曰：伏戎于莽，敌刚也。三岁不兴，安行也。\n\n/3&\n\n&4&\n##### 九四：乘其墉，弗克攻，吉。\n\n##### 象曰：乘其墉，义弗克也，其吉，则困而反则也。\n\n/4&\n\n&5&\n##### 九五：同人，先号啕而后笑。大师克相遇。\n\n##### 象曰：同人之先，以中直也。大师相遇，言相克也。\n\n/5&\n\n&6&\n##### 上九：同人于郊，无悔。\n\n##### 象曰：同人于郊，志未得也。\n\n/6&"},"111101":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/14.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：大有，众也。**\n\n#### 序\n**序卦曰：与人同者，物必归焉，故受之以《大有》。**","text.tab3":"&0&\n**大有：元亨。**\n**象曰：火在天上，大有；君子以遏恶扬善，顺天休命。**\n\n/0&\n#### 彖\n\n**彖曰：大有，柔得尊位，大中而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨。**\n\n#### 爻\n\n&1&\n##### 初九：无交害，匪咎，艰则无咎。\n\n##### 象曰：大有初九，无交害也。\n\n/1&\n\n&2&\n##### 九二：大车以载，有攸往，无咎。\n\n##### 象曰：大车以载，积中不败也。\n\n/2&\n\n&3&\n##### 九三：公用亨于天子，小人弗克。\n\n##### 象曰：公用亨于天子，小人害也。\n\n/3&\n\n&4&\n##### 九四：匪其彭，无咎。\n\n##### 象曰：匪其彭，无咎；明辨晰也。\n\n/4&\n\n&5&\n##### 六五：厥孚交如，威如；吉。\n\n##### 象曰：厥孚交如，信以发志也。威如之吉，易而无备也。\n\n/5&\n\n&6&\n##### 上九：自天佑之，吉无不利。\n\n##### 象曰：大有上吉，自天佑也。\n\n/6&"},"001000":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/15.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：谦轻而豫怠也。**\n\n#### 序\n**序卦曰：有大者不可以盈，故受之以《谦》。**","text.tab3":"&0&\n**谦：亨，君子有终。**\n**象曰：地中有山，谦；君子以裒多益寡，称物平施。**\n\n/0&\n#### 彖\n\n**彖曰：谦，亨，天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦尊而光，卑而不可逾，君子之终也。**\n\n#### 爻\n\n&1&\n##### 初六：谦谦君子，用涉大川，吉。\n\n##### 象曰：谦谦君子，卑以自牧也。\n\n/1&\n\n&2&\n##### 六二：鸣谦，贞吉。\n\n##### 象曰：鸣谦贞吉，中心得也。\n\n/2&\n\n&3&\n##### 九三：劳谦，君子有终，吉。\n\n##### 象曰：劳谦君子，万民服也。\n\n/3&\n\n&4&\n##### 六四：无不利，撝谦。\n\n##### 象曰：无不利，撝谦；不违则也。\n\n/4&\n\n&5&\n##### 六五：不富，以其邻，利用侵伐，无不利。\n\n##### 象曰：利用侵伐，征不服也。\n\n/5&\n\n&6&\n##### 上六：鸣谦，利用行师，征邑国。\n\n##### 象曰：鸣谦，志未得也。可用行师，征邑国也。\n\n/6&"},"000100":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/16.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：谦轻而豫怠也。**\n\n#### 序\n**序卦曰：有大而能谦必豫，故受之以《豫》。**","text.tab3":"&0&\n**豫：利建侯，行师。**\n**象曰：雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。**\n\n/0&\n#### 彖\n\n**彖曰：豫，刚应而志行，顺以动，豫。豫，顺以动，故天地如之，而况建侯行师乎？天地以顺动，故日月不过，而四时不忒；圣人以顺动，则刑罚清而民服。豫之时义大矣哉！**\n\n#### 爻\n\n&1&\n##### 初六：鸣豫，凶。\n\n##### 象曰：初六鸣豫，志穷凶也。\n\n/1&\n\n&2&\n##### 六二：介于石，不终日，贞吉。\n\n##### 象曰：不终日，贞吉；以中正也。\n\n/2&\n\n&3&\n##### 六三：盱豫，悔。迟有悔。\n\n##### 象曰：盱豫有悔，位不当也。\n\n/3&\n\n&4&\n##### 九四：由豫，大有得。勿疑。朋盍簪。\n\n##### 象曰：由豫，大有得；志大行也。\n\n/4&\n\n&5&\n##### 六五：贞疾，恒不死。\n\n##### 象曰：六五贞疾，乘刚也。恒不死，中未亡也。\n\n/5&\n\n&6&\n##### 上六：冥豫，成有渝，无咎。\n\n##### 象曰：冥豫在上，何可长也。\n\n/6&"},"100110":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/17.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：随，无故也。**\n\n#### 序\n**序卦曰：豫必有随，故受之以《随》。**","text.tab3":"&0&\n**随：元亨利贞，无咎。**\n**象曰：泽中有雷，随；君子以向晦入宴息。**\n\n/0&\n#### 彖\n\n**彖曰：随，刚来而下柔，动而说，随。大亨贞，无咎，而天下随时，随时之义大矣哉！**\n\n#### 爻\n\n&1&\n##### 初九：官有渝，贞吉。出门交有功。\n\n##### 象曰：官有渝，从正吉也。出门交有功，不失也。\n\n/1&\n\n&2&\n##### 六二：系小子，失丈夫。\n\n##### 象曰：系小子，弗兼与也。\n\n/2&\n\n&3&\n##### 六三：系丈夫，失小子。随有求得，利居贞。\n\n##### 象曰：系丈夫，志舍下也。\n\n/3&\n\n&4&\n##### 九四：随有获，贞凶。有孚在道，以明，何咎。\n\n##### 象曰：随有获，其义凶也。有孚在道，明功也。\n\n/4&\n\n&5&\n##### 九五：孚于嘉，吉。\n\n##### 象曰：孚于嘉，吉；位正中也。\n\n/5&\n\n&6&\n##### 上六：拘系之，乃从维之。王用亨于西山。\n\n##### 象曰：拘系之，上穷也。\n\n/6&"},"011001":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/18.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：蛊则饬也。**\n\n#### 序\n**序卦曰：以喜随人者必有事，故受之以《蛊》。《蛊》者，事也。**","text.tab3":"&0&\n**蛊：元亨，利涉大川。先甲三日，后甲三日。**\n**象曰：山下有风，蛊；君子以振民育德。**\n\n/0&\n#### 彖\n\n**彖曰：蛊，刚上而柔下，巽而止，蛊。蛊，元亨，而天下治也。利涉大川，往有事也。先甲三日，后甲三日，终则有始，天行也。**\n\n#### 爻\n\n&1&\n##### 初六：干父之蛊，有子，考无咎，厉终吉。\n\n##### 象曰：干父之蛊，意承考也。\n\n/1&\n\n&2&\n##### 九二：干母之蛊，不可贞。\n\n##### 象曰：干母之蛊，得中道也。\n\n/2&\n\n&3&\n##### 九三：干父之蛊，小有悔，无大咎。\n\n##### 象曰：干父之蛊，终无咎也。\n\n/3&\n\n&4&\n##### 六四：裕父之蛊，往见吝。\n\n##### 象曰：裕父之蛊，往未得也。\n\n/4&\n\n&5&\n##### 六五：干父之蛊，用誉。\n\n##### 象曰：干父之蛊；承以德也。\n\n/5&\n\n&6&\n##### 上九：不事王侯，高尚其事。\n\n##### 象曰：不事王侯，志可则也。\n\n/6&"},"110000":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/19.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：临观之义，或与或求。**\n\n#### 序\n**序卦曰：有事而后可大，故受之以《临》。《临》者，大也。**","text.tab3":"&0&\n**临：元，亨，利，贞。至于八月有凶。**\n**象曰：泽上有地，临；君子以教思无穷，容保民无疆。**\n\n/0&\n#### 彖\n\n**彖曰：临，刚浸而长。说而顺，刚中而应，大亨以正，天之道也。至于八月有凶，消不久也。**\n\n#### 爻\n\n&1&\n##### 初九：咸临，贞吉。\n\n##### 象曰：咸临贞吉，志行正也。\n\n/1&\n\n&2&\n##### 九二：咸临，吉无不利。\n\n##### 象曰：咸临，吉无不利；未顺命也。\n\n/2&\n\n&3&\n##### 六三：甘临，无攸利。既忧之，无咎。\n\n##### 象曰：甘临，位不当也。既忧之，咎不长也。\n\n/3&\n\n&4&\n##### 六四：至临，无咎。\n\n##### 象曰：至临无咎，位当也。\n\n/4&\n\n&5&\n##### 六五：知临，大君之宜，吉。\n\n##### 象曰：大君之宜，行中之谓也。\n\n/5&\n\n&6&\n##### 上六：敦临，吉无咎。\n\n##### 象曰：敦临之吉，志在内也。\n\n/6&"},"000011":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/20.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：临观之义，或与或求。**\n\n#### 序\n**序卦曰：物大然后可观，故受之以《观》。**","text.tab3":"&0&\n**观：盥而不荐，有孚顒若。**\n**象曰：风行地上，观；先王以省方，观民设教。**\n\n/0&\n#### 彖\n\n**彖曰：大观在上，顺而巽，中正以观天下。观，盥而不荐，有孚顒若，下观而化也。观天之神道，而四时不忒，圣人以神道设教，而天下服矣。**\n\n#### 爻\n\n&1&\n##### 初六：童观，小人无咎，君子吝。\n\n##### 象曰：初六童观，小人道也。\n\n/1&\n\n&2&\n##### 六二：闚观，利女贞。\n\n##### 象曰：窥观女贞，亦可丑也。\n\n/2&\n\n&3&\n##### 六三：观我生，进退。\n\n##### 象曰：观我生，进退；未失道也。\n\n/3&\n\n&4&\n##### 六四：观国之光，利用宾于王。\n\n##### 象曰：观国之光，尚宾也。\n\n/4&\n\n&5&\n##### 九五：观我生，君子无咎。\n\n##### 象曰：观我生，观民也。\n\n/5&\n\n&6&\n##### 上九：观其生，君子无咎。\n\n##### 象曰：观其生，志未平也。\n\n/6&"},"100101":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/21.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：噬嗑，食也。**\n\n#### 序\n**序卦曰：可观而后有所合，故受之以《噬嗑》。嗑者，合也。**","text.tab3":"&0&\n**噬嗑：亨。利用狱。**\n**象曰：雷电噬嗑；先王以明罚敕法。**\n\n/0&\n#### 彖\n\n**彖曰：颐中有物，曰噬嗑，噬嗑而亨。刚柔分，动而明，雷电合而章。柔得中而上行，虽不当位，利用狱也。**\n\n#### 爻\n\n&1&\n##### 初九：屦校灭趾，无咎。\n\n##### 象曰：屦校灭趾，不行也。\n\n/1&\n\n&2&\n##### 六二：噬肤灭鼻，无咎。\n\n##### 象曰：噬肤灭鼻，乘刚也。\n\n/2&\n\n&3&\n##### 六三：噬腊肉，遇毒；小吝，无咎。\n\n##### 象曰：遇毒，位不当也。\n\n/3&\n\n&4&\n##### 九四：噬乾胏，得金矢，利艰贞，吉。\n\n##### 象曰：利艰贞吉，未光也。\n\n/4&\n\n&5&\n##### 六五：噬乾肉，得黄金，贞厉，无咎。\n\n##### 象曰：贞厉无咎，得当也。\n\n/5&\n\n&6&\n##### 上九：何校灭耳，凶。\n\n##### 象曰：何校灭耳，聪不明也。\n\n/6&"},"101001":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/22.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：贲，无色也。**\n\n#### 序\n**序卦曰：物不可以苟合而已，故受之以《贲》。《贲》者，饰也。**","text.tab3":"&0&\n**贲：亨。小利有攸往。**\n**象曰：山下有火，贲；君子以明庶政，无敢折狱。**\n\n/0&\n#### 彖\n\n**彖曰：贲，亨；柔来而文刚，故亨。分刚上而文柔，故小利有攸往。天文也；文明以止，人文也。观乎天文，以察时变；观乎人文，以化成天下。**\n\n#### 爻\n\n&1&\n##### 初九：贲其趾，舍车而徒。\n\n##### 象曰：舍车而徒，义弗乘也。\n\n/1&\n\n&2&\n##### 六二：贲其须。\n\n##### 象曰：贲其须，与上兴也。\n\n/2&\n\n&3&\n##### 九三：贲如濡如，永贞吉。\n\n##### 象曰：永贞之吉，终莫之陵也。\n\n/3&\n\n&4&\n##### 六四：贲如皤如，白马翰如，匪寇婚媾。\n\n##### 象曰：六四，当位疑也。匪寇婚媾，终无尤也。\n\n/4&\n\n&5&\n##### 六五：贲于丘园，束帛戋戋，吝，终吉。\n\n##### 象曰：六五之吉，有喜也。\n\n/5&\n\n&6&\n##### 上九：白贲，无咎。\n\n##### 象曰：白贲无咎，上得志也。\n\n/6&"},"000001":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/23.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：剥，烂也。**\n\n#### 序\n**序卦曰：致饰然后亨则尽矣，故受之以《剥》。《剥》者，剥也。**","text.tab3":"&0&\n**剥：不利有攸往。**\n**象曰：山附地上，剥；上以厚下，安宅。**\n\n/0&\n#### 彖\n\n**彖曰：剥，剥也，柔变刚也。不利有攸往，小人长也。顺而止之，观象也。君子尚消息盈虚，天行也。**\n\n#### 爻\n\n&1&\n##### 初六：剥床以足，蔑贞凶。\n\n##### 象曰：剥床以足，以灭下也。\n\n/1&\n\n&2&\n##### 六二：剥床以辨，蔑贞凶。\n\n##### 象曰：剥床以辨，未有与也。\n\n/2&\n\n&3&\n##### 六三：剥之，无咎。\n\n##### 象曰：剥之无咎，失上下也。\n\n/3&\n\n&4&\n##### 六四：剥床以肤，凶。\n\n##### 象曰：剥床以肤，切近灾也。\n\n/4&\n\n&5&\n##### 六五：贯鱼，以宫人宠，无不利。\n\n##### 象曰：以宫人宠，终无尤也。\n\n/5&\n\n&6&\n##### 上九：硕果不食，君子得舆，小人剥庐。\n\n##### 象曰：君子得舆，民所载也。小人剥庐，终不可用也。\n\n/6&"},"100000":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/24.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：复，反也。**\n\n#### 序\n**序卦曰：物不可以终尽剥，穷上反下，故受之以《复》。**","text.tab3":"&0&\n**复：亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。**\n**象曰：雷在地中，复；先王以至日闭关，商旅不行，后不省方。**\n\n/0&\n#### 彖\n\n**彖曰：复亨；刚反，动而以顺行，是以出入无疾，朋来无咎。反复其道，七日来复，天行也。利有攸往，刚长也。复其见天地之心乎？**\n\n#### 爻\n\n&1&\n##### 初九：不远复，无祗悔，元吉。\n\n##### 象曰：不远之复，以修身也。\n\n/1&\n\n&2&\n##### 六二：休复，吉。\n\n##### 象曰：休复之吉，以下仁也。\n\n/2&\n\n&3&\n##### 六三：频复，厉无咎。\n\n##### 象曰：频复之厉，义无咎也。\n\n/3&\n\n&4&\n##### 六四：中行独复。\n\n##### 象曰：中行独复，以从道也。\n\n/4&\n\n&5&\n##### 六五：敦复，无悔。\n\n##### 象曰：敦复无悔，中以自考也。\n\n/5&\n\n&6&\n##### 上六：迷复，凶，有灾眚。用行师，终有大败，以其国君，凶；至于十年，不克征。\n\n##### 象曰：迷复之凶，反君道也。\n\n/6&"},"100111":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/25.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：无妄，灾也。**\n\n#### 序\n**序卦曰：复则不妄矣，故受之以《无妄》。**","text.tab3":"&0&\n**无妄：元亨，利贞。其匪正有眚，不利有攸往。**\n**象曰：天下雷行，物与无妄；先王以茂对时，育万物。**\n\n/0&\n#### 彖\n\n**彖曰：无妄，刚自外来，而为主于内。动而健，刚中而应，大亨以正，天之命也。其匪正有眚，不利有攸往。无妄之往，何之矣？天命不佑，行矣哉？**\n\n#### 爻\n\n&1&\n##### 初九：无妄，往吉。\n\n##### 象曰：无妄之往，得志也。\n\n/1&\n\n&2&\n##### 六二：不耕获，不灾畲，则利有攸往。\n\n##### 象曰：不耕获，未富也。\n\n/2&\n\n&3&\n##### 六三：无妄之灾，或系之牛，行人之得，邑人之灾。\n\n##### 象曰：行人得牛，邑人灾也。\n\n/3&\n\n&4&\n##### 九四：可贞，无咎。\n\n##### 象曰：可贞无咎，固有之也。\n\n/4&\n\n&5&\n##### 九五：无妄之疾，勿药有喜。\n\n##### 象曰：无妄之药，不可试也。\n\n/5&\n\n&6&\n##### 上九：无妄，行有眚，无攸利。\n\n##### 象曰：无妄之行，穷之灾也。\n\n/6&"},"111001":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/26.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：大畜，时也。**\n\n#### 序\n**序卦曰：有无妄，然后可畜，故受之以《大畜》。**","text.tab3":"&0&\n**大畜：利贞，不家食吉，利涉大川。**\n**象曰：天在山中，大畜；君子以多识前言往行，以畜其德。**\n\n/0&\n#### 彖\n\n**彖曰：大畜，刚健笃实辉光，日新其德，刚上而尚贤。能止健，大正也。不家食吉，养贤也。利涉大川，应乎天也。**\n\n#### 爻\n\n&1&\n##### 初九：有厉利已。\n\n##### 象曰：有厉利已，不犯灾也。\n\n/1&\n\n&2&\n##### 九二：舆说輹。\n\n##### 象曰：舆说輹，中无尤也。\n\n/2&\n\n&3&\n##### 九三：良马逐，利艰贞。曰闲舆卫，利有攸往。\n\n##### 象曰：利有攸往，上合志也。\n\n/3&\n\n&4&\n##### 六四：童牛之牿，元吉。\n\n##### 象曰：六四元吉，有喜也。\n\n/4&\n\n&5&\n##### 六五：豶豕之牙，吉。\n\n##### 象曰：六五之吉，有庆也。\n\n/5&\n\n&6&\n##### 上九：何天之衢，亨。\n\n##### 象曰：何天之衢，道大行也。\n\n/6&"},"100001":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/27.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：颐，养正也。**\n\n#### 序\n**序卦曰：物畜然后可养，故受之以《颐》。《颐》者，养也。**","text.tab3":"&0&\n**颐：贞吉。观颐，自求口实。**\n**象曰：山下有雷，颐；君子以慎言语，节饮食。**\n\n/0&\n#### 彖\n\n**彖曰：颐贞吉，养正则吉也。观颐，观其所养也；自求口实，观其自养也。天地养万物，圣人养贤，以及万民；颐之时大矣哉！**\n\n#### 爻\n\n&1&\n##### 初九：舍尔灵龟，观我朵颐，凶。\n\n##### 象曰：观我朵颐，亦不足贵也。\n\n/1&\n\n&2&\n##### 六二：颠颐，拂经，于丘颐，征凶。\n\n##### 象曰：六二征凶，行失类也。\n\n/2&\n\n&3&\n##### 六三：拂颐，贞凶，十年勿用，无攸利。\n\n##### 象曰：十年勿用，道大悖也。\n\n/3&\n\n&4&\n##### 六四：颠颐，吉，虎视眈眈，其欲逐逐，无咎。\n\n##### 象曰：颠颐之吉，上施光也。\n\n/4&\n\n&5&\n##### 六五：拂经，居贞吉，不可涉大川。\n\n##### 象曰：居贞之吉，顺以从上也。\n\n/5&\n\n&6&\n##### 上九：由颐，厉吉，利涉大川。\n\n##### 象曰：由颐厉吉，大有庆也。\n\n/6&"},"011110":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/28.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：大过，颠也。**\n\n#### 序\n**序卦曰：不养则不可动，故受之以《大过》。**","text.tab3":"&0&\n**大过：栋桡，利有攸往，亨。**\n**象曰：泽灭木，大过；君子以独立不惧，遯世无闷。**\n\n/0&\n#### 彖\n\n**彖曰：大过，大者过也。栋桡，本末弱也。刚过而中，巽而说行，利有攸往，乃亨。大过之时大矣哉！**\n\n#### 爻\n\n&1&\n##### 初六：藉用白茅，无咎。\n\n##### 象曰：藉用白茅，柔在下也。\n\n/1&\n\n&2&\n##### 九二：枯杨生稊，老夫得其女妻，无不利。\n\n##### 象曰：老夫女妻，过以相与也。\n\n/2&\n\n&3&\n##### 九三：栋桡，凶。\n\n##### 象曰：栋桡之凶，不可以有辅也。\n\n/3&\n\n&4&\n##### 九四：栋隆，吉；有它吝。\n\n##### 象曰：栋隆之吉，不桡乎下也。\n\n/4&\n\n&5&\n##### 九五：枯杨生华，老妇得士夫，无咎无誉。\n\n##### 象曰：枯杨生华，何可久也。老妇士夫，亦可丑也。\n\n/5&\n\n&6&\n##### 上六：过涉灭顶，凶，无咎。\n\n##### 象曰：过涉之凶，不可咎也。\n\n/6&"},"010010":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/29.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：离上而坎下也。**\n\n#### 序\n**序卦曰：物不可以终过，故受之以《坎》。《坎》者，陷也。**","text.tab3":"&0&\n**坎：习坎，有孚，维心亨，行有尚。**\n**象曰：水洊至，习坎；君子以常德行，习教事。**\n\n/0&\n#### 彖\n\n**彖曰：习坎，重险也。水流而不盈，行险而不失其信。维心亨，乃以刚中也。行有尚，往有功也。天险不可升也，地险山川丘陵也，王公设险以守其国，坎之时用大矣哉！**\n\n#### 爻\n\n&1&\n##### 初六：习坎，入于坎窞，凶。\n\n##### 象曰：习坎入坎，失道凶也。\n\n/1&\n\n&2&\n##### 九二：坎有险，求小得。\n\n##### 象曰：求小得，未出中也。\n\n/2&\n\n&3&\n##### 六三：来之坎坎，险且枕，入于坎窞，勿用。\n\n##### 象曰：来之坎坎，终无功也。\n\n/3&\n\n&4&\n##### 六四：樽酒簋贰，用缶，纳约自牖，终无咎。\n\n##### 象曰：樽酒簋贰，刚柔际也。\n\n/4&\n\n&5&\n##### 九五：坎不盈，祗既平，无咎。\n\n##### 象曰：坎不盈，中未大也。\n\n/5&\n\n&6&\n##### 上六：系用徽纆，置于丛棘，三岁不得，凶。\n\n##### 象曰：上六失道，凶三岁也。\n\n/6&"},"101101":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/30.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：离上而坎下也。**\n\n#### 序\n**序卦曰：陷必有所丽，故受之以《离》。《离》者，丽也。有天地然后有万物，有万物然后有男女，有男女然后有夫妇，有夫妇然后有父子，有父子然后有君臣，有君臣然后有上下，有上下然后礼义有所错。**","text.tab3":"&0&\n**离：利贞，亨。畜牝牛，吉。**\n**象曰：明两作离，大人以继明照于四方。**\n\n/0&\n#### 彖\n\n**彖曰：离，丽也；日月丽乎天，百谷草木丽乎土，重明以丽乎正，乃化成天下。柔丽乎中正，故亨；是以畜牝牛吉也。**\n\n#### 爻\n\n&1&\n##### 初九：履错然，敬之无咎。\n\n##### 象曰：履错之敬，以辟咎也。\n\n/1&\n\n&2&\n##### 六二：黄离，元吉。\n\n##### 象曰：黄离元吉，得中道也。\n\n/2&\n\n&3&\n##### 九三：日昃之离，不鼓缶而歌，则大耋之嗟，凶。\n\n##### 象曰：日昃之离，何可久也。\n\n/3&\n\n&4&\n##### 九四：突如其来如，焚如，死如，弃如。\n\n##### 象曰：突如其来如，无所容也。\n\n/4&\n\n&5&\n##### 六五：出涕沱若，戚嗟若，吉。\n\n##### 象曰：六五之吉，离王公也。\n\n/5&\n\n&6&\n##### 上九：王用出征，有嘉折首，获匪其丑，无咎。\n\n##### 象曰：王用出征，以正邦也。\n\n/6&"},"001110":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/31.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：咸，速也。**\n\n#### 序\n**序卦曰：有天地然后有万物，有万物然后有男女，有男女然后有夫妇，有夫妇然后有父子，有父子然后有君臣，有君臣然后有上下，有上下然后礼义有所错。**","text.tab3":"&0&\n**咸，亨，利贞，取女吉。**\n**象曰：山上有泽，咸，君子以虚受人。**\n\n/0&\n#### 彖\n\n**彖曰：咸，感也。柔上而刚下，二气感应以相与，止而说，男下女，是以亨利贞，取女吉也。天地感而万物化生，圣人感人心而天下和平，观其所感，而天地万物之情可见矣。**\n\n#### 爻\n\n&1&\n##### 初六，咸其拇。\n\n##### 象曰：咸其拇，志在外也。\n\n/1&\n\n&2&\n##### 六二，咸其腓，凶，居吉。\n\n##### 象曰：虽凶居吉，顺不害也。\n\n/2&\n\n&3&\n##### 九三，咸其股，执其随，往吝。\n\n##### 象曰：咸其股，亦不处也。志在随人，所执下也。\n\n/3&\n\n&4&\n##### 九四，贞吉，悔亡，憧憧往来，朋从尔思。\n\n##### 象曰：贞吉悔亡，未感害也。憧憧往来，未光大也。\n\n/4&\n\n&5&\n##### 九五，咸其脢，无悔。\n\n##### 象曰：咸其脢，志末也。\n\n/5&\n\n&6&\n##### 上六，咸其辅颊舌。\n\n##### 象曰：咸其辅颊舌，滕口说也。\n\n/6&"},"011100":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/32.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：恒，久也。**\n\n#### 序\n**序卦曰：夫妇之道不可以不久也，故受之以《恒》。《恒》者，久也。**","text.tab3":"&0&\n**恒：亨，无咎，利贞，利有攸往。**\n**象曰：雷风，恒；君子以立不易方。**\n\n/0&\n#### 彖\n\n**彖曰：恒，久也。刚上而柔下，雷风相与，巽而动，刚柔皆应，恒。恒亨无咎，利贞；久于其道也，天地之道，恒久而不已也。利有攸往，终则有始也。日月得天，而能久照，四时变化，而能久成，圣人久于其道，而天下化成；观其所恒，而天地万物之情可见矣！**\n\n#### 爻\n\n&1&\n##### 初六：浚恒，贞凶，无攸利。\n\n##### 象曰：浚恒之凶，始求深也。\n\n/1&\n\n&2&\n##### 九二：悔亡。\n\n##### 象曰：九二悔亡，能久中也。\n\n/2&\n\n&3&\n##### 九三：不恒其德，或承之羞，贞吝。\n\n##### 象曰：不恒其德，无所容也。\n\n/3&\n\n&4&\n##### 九四：田无禽。\n\n##### 象曰：久非其位，安得禽也。\n\n/4&\n\n&5&\n##### 六五：恒其德，贞，妇人吉，夫子凶。\n\n##### 象曰：妇人贞吉，从一而终也。夫子制义，从妇凶也。\n\n/5&\n\n&6&\n##### 上六：振恒，凶。\n\n##### 象曰：振恒在上，大无功也。\n\n/6&"},"001111":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/33.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：大壮则止，遯则退也。**\n\n#### 序\n**序卦曰：物不可以久居其所，故受之以《遯》。《遯》者，退也。**","text.tab3":"&0&\n**遯：亨，小利贞。**\n**象曰：天下有山，遯；君子以远小人，不恶而严。**\n\n/0&\n#### 彖\n\n**彖曰：遯亨，遯而亨也。刚当位而应，与时行也。小利贞，浸而长也。遯之时义大矣哉！**\n\n#### 爻\n\n&1&\n##### 初六：遯尾，厉，勿用有攸往。\n\n##### 象曰：遯尾之厉，不往何灾也。\n\n/1&\n\n&2&\n##### 六二：执之用黄牛之革，莫之胜说。\n\n##### 象曰：执用黄牛，固志也。\n\n/2&\n\n&3&\n##### 九三：系遯，有疾厉，畜臣妾吉。\n\n##### 象曰：系遯之厉，有疾惫也。畜臣妾吉，不可大事也。\n\n/3&\n\n&4&\n##### 九四：好遯，君子吉，小人否。\n\n##### 象曰：君子好遯，小人否也。\n\n/4&\n\n&5&\n##### 九五：嘉遯，贞吉。\n\n##### 象曰：嘉遯贞吉，以正志也。\n\n/5&\n\n&6&\n##### 上九：肥遯，无不利。\n\n##### 象曰：肥遯，无不利；无所疑也。\n\n/6&"},"111100":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/34.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：大壮则止，遯则退也。**\n\n#### 序\n**序卦曰：物不可以终遯，故受之以《大壮》。**","text.tab3":"&0&\n**大壮：利贞。**\n**象曰：雷在天上，大壮；君子以非礼勿履。**\n\n/0&\n#### 彖\n\n**彖曰：大壮，大者壮也。刚以动，故壮。大壮利贞；大者正也。正大而天地之情可见矣！**\n\n#### 爻\n\n&1&\n##### 初九：壮于趾，征凶，有孚。\n\n##### 象曰：壮于趾，其孚穷也。\n\n/1&\n\n&2&\n##### 九二：贞吉。\n\n##### 象曰：九二贞吉，以中也。\n\n/2&\n\n&3&\n##### 九三：小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。\n\n##### 象曰：小人用壮，君子罔也。\n\n/3&\n\n&4&\n##### 九四：贞吉悔亡，藩决不羸，壮于大舆之輹。\n\n##### 象曰：藩决不羸，尚往也。\n\n/4&\n\n&5&\n##### 六五：丧羊于易，无悔。\n\n##### 象曰：丧羊于易，位不当也。\n\n/5&\n\n&6&\n##### 上六：羝羊触藩，不能退，不能遂，无攸利，艰则吉。\n\n##### 象曰：不能退，不能遂，不祥也。艰则吉，咎不长也。\n\n/6&"},"000101":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/35.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：晋，昼也。**\n\n#### 序\n**序卦曰：物不可以终壮，故受之以《晋》。《晋》者，进也。**","text.tab3":"&0&\n**晋：康侯用锡马蕃庶，昼日三接。**\n**象曰：明出地上，晋；君子以自昭明德。**\n\n/0&\n#### 彖\n\n**彖曰：晋，进也。明出地上，顺而丽乎大明，柔进而上行。是以康侯用锡马蕃庶，昼日三接也。**\n\n#### 爻\n\n&1&\n##### 初六：晋如，摧如，贞吉。罔孚，裕无咎。\n\n##### 象曰：晋如，摧如；独行正也。裕无咎；未受命也。\n\n/1&\n\n&2&\n##### 六二：晋如，愁如，贞吉。受兹介福，于其王母。\n\n##### 象曰：受兹介福，以中正也。\n\n/2&\n\n&3&\n##### 六三：众允，悔亡。\n\n##### 象曰：众允之，志上行也。\n\n/3&\n\n&4&\n##### 九四：晋如硕鼠，贞厉。\n\n##### 象曰：硕鼠贞厉，位不当也。\n\n/4&\n\n&5&\n##### 六五：悔亡，失得勿恤，往吉，无不利。\n\n##### 象曰：失得勿恤，往有庆也。\n\n/5&\n\n&6&\n##### 上九：晋其角，维用伐邑，厉吉无咎，贞吝。\n\n##### 象曰：维用伐邑，道未光也。\n\n/6&"},"101000":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/36.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：明夷，诛也。**\n\n#### 序\n**序卦曰：进必有所伤，故受之以《明夷》。夷者，伤也。**","text.tab3":"&0&\n**明夷：利艰贞。**\n**象曰：明入地中，明夷；君子以莅众，用晦而明。**\n\n/0&\n#### 彖\n\n**彖曰：明入地中，明夷。内文明而外柔顺，以蒙大难，文王以之。利艰贞，晦其明也，内难而能正其志，箕子以之。**\n\n#### 爻\n\n&1&\n##### 初九：明夷于飞，垂其翼。君子于行，三日不食，有攸往，主人有言。\n\n##### 象曰：君子于行，义不食也。\n\n/1&\n\n&2&\n##### 六二：明夷，夷于左股，用拯马壮，吉。\n\n##### 象曰：六二之吉，顺以则也。\n\n/2&\n\n&3&\n##### 九三：明夷于南狩，得其大首，不可疾贞。\n\n##### 象曰：南狩之志，乃大得也。\n\n/3&\n\n&4&\n##### 六四：入于左腹，获明夷之心，出于门庭。\n\n##### 象曰：入于左腹，获心意也。\n\n/4&\n\n&5&\n##### 六五：箕子之明夷，利贞。\n\n##### 象曰：箕子之贞，明不可息也。\n\n/5&\n\n&6&\n##### 上六：不明晦，初登于天，后入于地。\n\n##### 象曰：初登于天，照四国也。后入于地，失则也。\n\n/6&"},"101011":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/37.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：家人，内也。**\n\n#### 序\n**序卦曰：伤于外者必反于家，故受之以《家人》。**","text.tab3":"&0&\n**家人：利女贞。**\n**象曰：风自火出，家人；君子以言有物，而行有恒。**\n\n/0&\n#### 彖\n\n**彖曰：家人，女正位乎内，男正位乎外，男女正，天地之大义也。家人有严君焉，父母之谓也。父父，子子，兄兄，弟弟，夫夫，妇妇，而家道正；正家而天下定矣。**\n\n#### 爻\n\n&1&\n##### 初九：闲有家，悔亡。\n\n##### 象曰：闲有家，志未变也。\n\n/1&\n\n&2&\n##### 六二：无攸遂，在中馈，贞吉。\n\n##### 象曰：六二之吉，顺以巽也。\n\n/2&\n\n&3&\n##### 九三：家人嗃嗃，悔厉吉；妇子嘻嘻，终吝。\n\n##### 象曰：家人嗃嗃，未失也；妇子嘻嘻，失家节也。\n\n/3&\n\n&4&\n##### 六四：富家，大吉。\n\n##### 象曰：富家大吉，顺在位也。\n\n/4&\n\n&5&\n##### 九五：王假有家，勿恤，往吉。\n\n##### 象曰：王假有家，交相爱也。\n\n/5&\n\n&6&\n##### 上九：有孚威如，终吉。\n\n##### 象曰：威如之吉，反身之谓也。\n\n/6&"},"110101":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/38.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：睽，外也。**\n\n#### 序\n**序卦曰：家道穷必乖，故受之以《睽》。《睽》者，乖也。**","text.tab3":"&0&\n**睽：小事吉。**\n**象曰：上火下泽，睽；君子以同而异。**\n\n/0&\n#### 彖\n\n**彖曰：睽，火动而上，泽动而下；二女同居，其志不同行；说而丽乎明，柔进而上行，得中而应乎刚；是以小事吉。天地睽，而其事同也；男女睽，而其志通也；万物睽，而其事类也；睽之时用大矣哉！**\n\n#### 爻\n\n&1&\n##### 初九：悔亡，丧马勿逐，自复；见恶人无咎。\n\n##### 象曰：见恶人，以辟咎也。\n\n/1&\n\n&2&\n##### 九二：遇主于巷，无咎。\n\n##### 象曰：遇主于巷，未失道也。\n\n/2&\n\n&3&\n##### 六三：见舆曳，其牛掣，其人天且劓，无初有终。\n\n##### 象曰：见舆曳，位不当也。无初有终，遇刚也。\n\n/3&\n\n&4&\n##### 九四：睽孤，遇元夫，交孚，厉无咎。\n\n##### 象曰：交孚无咎，志行也。\n\n/4&\n\n&5&\n##### 六五：悔亡，厥宗噬肤，往何咎。\n\n##### 象曰：厥宗噬肤，往有庆也。\n\n/5&\n\n&6&\n##### 上九：睽孤，见豕负涂，载鬼一车，先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。\n\n##### 象曰：遇雨之吉，群疑亡也。\n\n/6&"},"001010":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/39.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：蹇，难也。**\n\n#### 序\n**序卦曰：乖必有难，故受之以《蹇》。《蹇》者，难也。**","text.tab3":"&0&\n**蹇：利西南，不利东北；利见大人，贞吉。**\n**象曰：山上有水，蹇；君子以反身修德。**\n\n/0&\n#### 彖\n\n**彖曰：蹇，难也，险在前也。见险而能止，知矣哉！蹇利西南，往得中也；不利东北，其道穷也。利见大人，往有功也。当位贞吉，以正邦也。蹇之时用大矣哉！**\n\n#### 爻\n\n&1&\n##### 初六：往蹇，来誉。\n\n##### 象曰：往蹇来誉，宜待也。\n\n/1&\n\n&2&\n##### 六二：王臣蹇蹇，匪躬之故。\n\n##### 象曰：王臣蹇蹇，终无尤也。\n\n/2&\n\n&3&\n##### 九三：往蹇来反。\n\n##### 象曰：往蹇来反，内喜之也。\n\n/3&\n\n&4&\n##### 六四：往蹇来连。\n\n##### 象曰：往蹇来连，当位实也。\n\n/4&\n\n&5&\n##### 九五：大蹇朋来。\n\n##### 象曰：大蹇朋来，以中节也。\n\n/5&\n\n&6&\n##### 上六：往蹇来硕，吉；利见大人。\n\n##### 象曰：往蹇来硕，志在内也。利见大人，以从贵也。\n\n/6&"},"010100":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/40.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：解，缓也。**\n\n#### 序\n**序卦曰：物不可以终难，故受之以《解》。《解》者，缓也。**","text.tab3":"&0&\n**解：利西南，无所往，其来复吉。有攸往，夙吉。**\n**象曰：雷雨作，解；君子以赦过宥罪。**\n\n/0&\n#### 彖\n\n**彖曰：解，险以动，动而免乎险，解。解利西南，往得众也。其来复吉，乃得中也。有攸往夙吉，往有功也。天地解，而雷雨作，雷雨作，而百果草木皆甲坼，解之时大矣哉！**\n\n#### 爻\n\n&1&\n##### 初六：无咎。\n\n##### 象曰：刚柔之际，义无咎也。\n\n/1&\n\n&2&\n##### 九二：田获三狐，得黄矢，贞吉。\n\n##### 象曰：九二贞吉，得中道也。\n\n/2&\n\n&3&\n##### 六三：负且乘，致寇至，贞吝。\n\n##### 象曰：负且乘，亦可丑也，自我致戎，又谁咎也。\n\n/3&\n\n&4&\n##### 九四：解而拇，朋至斯孚。\n\n##### 象曰：解而拇，未当位也。\n\n/4&\n\n&5&\n##### 六五：君子维有解，吉；有孚于小人。\n\n##### 象曰：君子有解，小人退也。\n\n/5&\n\n&6&\n##### 上六：公用射隼于高墉之上，获之，无不利。\n\n##### 象曰：公用射隼，以解悖也。\n\n/6&"},"110001":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/41.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：损益，盛衰之始也。**\n\n#### 序\n**序卦曰：缓必有所失，故受之以《损》。**","text.tab3":"&0&\n**损：有孚，元吉，无咎，可贞，利有攸往。曷之用，二簋可用享。**\n**象曰：山下有泽，损；君子以惩忿窒欲。**\n\n/0&\n#### 彖\n\n**彖曰：损，损下益上，其道上行。损而有孚，元吉，无咎，可贞，利有攸往。曷之用？二簋可用享；二簋应有时。损刚益柔有时，损益盈虚，与时偕行。**\n\n#### 爻\n\n&1&\n##### 初九：巳事遄往，无咎，酌损之。\n\n##### 象曰：巳事遄往，尚合志也。\n\n/1&\n\n&2&\n##### 九二：利贞，征凶，弗损，益之。\n\n##### 象曰：九二利贞，中以为志也。\n\n/2&\n\n&3&\n##### 六三：三人行，则损一人；一人行，则得其友。\n\n##### 象曰：一人行，三则疑也。\n\n/3&\n\n&4&\n##### 六四：损其疾，使遄有喜，无咎。\n\n##### 象曰：损其疾，亦可喜也。\n\n/4&\n\n&5&\n##### 六五：或益之，十朋之龟弗克违，元吉。\n\n##### 象曰：六五元吉，自上佑也。\n\n/5&\n\n&6&\n##### 上九：弗损益之，无咎，贞吉，有攸往，得臣无家。\n\n##### 象曰：弗损益之，大得志也。\n\n/6&"},"100011":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/42.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：损益，盛衰之始也。**\n\n#### 序\n**序卦曰：损而不已必益，故受之以《益》。**","text.tab3":"&0&\n**益：利有攸往，利涉大川。**\n**象曰：风雷，益；君子以见善则迁，有过则改。**\n\n/0&\n#### 彖\n\n**彖曰：益，损上益下，民说无疆，自上下下，其道大光。利有攸往，中正有庆。利涉大川，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。**\n\n#### 爻\n\n&1&\n##### 初九：利用为大作，元吉，无咎。\n\n##### 象曰：元吉无咎，下不厚事也。\n\n/1&\n\n&2&\n##### 六二：或益之，十朋之龟弗克违，永贞吉。王用享于帝，吉。\n\n##### 象曰：或益之，自外来也。\n\n/2&\n\n&3&\n##### 六三：益之用凶事，无咎。有孚中行，告公用圭。\n\n##### 象曰：益用凶事，固有之也。\n\n/3&\n\n&4&\n##### 六四：中行，告公从。利用为依迁国。\n\n##### 象曰：告公从，以益志也。\n\n/4&\n\n&5&\n##### 九五：有孚惠心，勿问元吉。有孚惠我德。\n\n##### 象曰：有孚惠心，勿问之矣。惠我德，大得志也。\n\n/5&\n\n&6&\n##### 上九：莫益之，或击之，立心勿恒，凶。\n\n##### 象曰：莫益之，偏辞也。或击之，自外来也。\n\n/6&"},"111110":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/43.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：夬，决也，刚决柔也。**\n\n#### 序\n**序卦曰：益而不已必决，故受之以《夬》。《夬》者，决也。**","text.tab3":"&0&\n**夬：扬于王庭，孚号，有厉，告自邑，不利即戎，利有攸往。**\n**象曰：泽上于天，夬；君子以施禄及下，居德则忌。**\n\n/0&\n#### 彖\n\n**彖曰：夬，决也，刚决柔也。健而说，决而和，扬于王庭，柔乘五刚也。孚号有厉，其危乃光也。告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也。**\n\n#### 爻\n\n&1&\n##### 初九：壮于前趾，往不胜为咎。\n\n##### 象曰：不胜而往，咎也。\n\n/1&\n\n&2&\n##### 九二：惕号，莫夜有戎，勿恤。\n\n##### 象曰：莫夜有戎，得中道也。\n\n/2&\n\n&3&\n##### 九三：壮于頄，有凶。君子夬夬，独行，遇雨，若濡，有愠，无咎。\n\n##### 象曰：君子夬夬，终无咎也。\n\n/3&\n\n&4&\n##### 九四：臀无肤，其行次且。牵羊悔亡，闻言不信。\n\n##### 象曰：其行次且，位不当也。闻言不信，聪不明也。\n\n/4&\n\n&5&\n##### 九五：苋陆夬夬，中行无咎。\n\n##### 象曰：中行无咎，中未光也。\n\n/5&\n\n&6&\n##### 上六：无号，终有凶。\n\n##### 象曰：无号之凶，终不可长也。\n\n/6&"},"011111":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/44.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：姤，遇也，柔遇刚也。**\n\n#### 序\n**序卦曰：决必有遇，故受之以《姤》。《姤》者，遇也。**","text.tab3":"&0&\n**姤：女壮，勿用取女。**\n**象曰：天下有风，姤；后以施命诰四方。**\n\n/0&\n#### 彖\n\n**彖曰：姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉！**\n\n#### 爻\n\n&1&\n##### 初六：系于金柅，贞吉，有攸往，见凶，羸豕孚蹢躅。\n\n##### 象曰：系于金柅，柔道牵也。\n\n/1&\n\n&2&\n##### 九二：包有鱼，无咎，不利宾。\n\n##### 象曰：包有鱼，义不及宾也。\n\n/2&\n\n&3&\n##### 九三：臀无肤，其行次且，厉，无大咎。\n\n##### 象曰：其行次且，行未牵也。\n\n/3&\n\n&4&\n##### 九四：包无鱼，起凶。\n\n##### 象曰：无鱼之凶，远民也。\n\n/4&\n\n&5&\n##### 九五：以杞包瓜，含章，有陨自天。\n\n##### 象曰：九五含章，中正也。有陨自天，志不舍命也。\n\n/5&\n\n&6&\n##### 上九：姤其角，吝，无咎。\n\n##### 象曰：姤其角，上穷吝也。\n\n/6&"},"000110":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/45.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：萃聚而升不来也。**\n\n#### 序\n**序卦曰：物相遇而后聚，故受之以《萃》。《萃》者，聚也。**","text.tab3":"&0&\n**萃：亨。王假有庙，利见大人，亨，利贞。用大牲吉，利有攸往。**\n**象曰：泽上于地，萃；君子以除戎器，戒不虞。**\n\n/0&\n#### 彖\n\n**彖曰：萃，聚也；顺以说，刚中而应，故聚也。王假有庙，致孝享也。利见大人亨，聚以正也。用大牲吉，利有攸往，顺天命也。观其所聚，而天地万物之情可见矣。**\n\n#### 爻\n\n&1&\n##### 初六：有孚不终，乃乱乃萃，若号一握为笑，勿恤，往无咎。\n\n##### 象曰：乃乱乃萃，其志乱也。\n\n/1&\n\n&2&\n##### 六二：引吉，无咎，孚乃利用禴。\n\n##### 象曰：引吉无咎，中未变也。\n\n/2&\n\n&3&\n##### 六三：萃如，嗟如，无攸利，往无咎，小吝。\n\n##### 象曰：往无咎，上巽也。\n\n/3&\n\n&4&\n##### 九四：大吉，无咎。\n\n##### 象曰：大吉无咎，位不当也。\n\n/4&\n\n&5&\n##### 九五：萃有位，无咎。匪孚，元永贞，悔亡。\n\n##### 象曰：萃有位，志未光也。\n\n/5&\n\n&6&\n##### 上六：赍咨涕洟，无咎。\n\n##### 象曰：赍咨涕洟，未安上也。\n\n/6&"},"011000":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/46.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：萃聚而升不来也。**\n\n#### 序\n**序卦曰：聚而上者谓之升，故受之以《升》。**","text.tab3":"&0&\n**升：元亨，用见大人，勿恤，南征吉。**\n**象曰：地中生木，升；君子以顺德，积小以高大。**\n\n/0&\n#### 彖\n\n**彖曰：柔以时升，巽而顺，刚中而应，是以大亨。用见大人，勿恤；有庆也。南征吉，志行也。**\n\n#### 爻\n\n&1&\n##### 初六：允升，大吉。\n\n##### 象曰：允升大吉，上合志也。\n\n/1&\n\n&2&\n##### 九二：孚乃利用禴，无咎。\n\n##### 象曰：九二之孚，有喜也。\n\n/2&\n\n&3&\n##### 九三：升虚邑。\n\n##### 象曰：升虚邑，无所疑也。\n\n/3&\n\n&4&\n##### 六四：王用亨于岐山，吉无咎。\n\n##### 象曰：王用亨于岐山，顺事也。\n\n/4&\n\n&5&\n##### 六五：贞吉，升阶。\n\n##### 象曰：贞吉升阶，大得志也。\n\n/5&\n\n&6&\n##### 上六：冥升，利于不息之贞。\n\n##### 象曰：冥升在上，消不富也。\n\n/6&"},"010110":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/47.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：井通而困相遇也。**\n\n#### 序\n**序卦曰：升而不已必困，故受之以《困》。**","text.tab3":"&0&\n**困：亨，贞，大人吉，无咎，有言不信。**\n**象曰：泽无水，困；君子以致命遂志。**\n\n/0&\n#### 彖\n\n**彖曰：困，刚掩也。险以说，困而不失其所，亨；其唯君子乎？贞大人吉，以刚中也。有言不信，尚口乃穷也。**\n\n#### 爻\n\n&1&\n##### 初六：臀困于株木，入于幽谷，三岁不觌。\n\n##### 象曰：入于幽谷，幽不明也。\n\n/1&\n\n&2&\n##### 九二：困于酒食，朱绂方来，利用享祀，征凶，无咎。\n\n##### 象曰：困于酒食，中有庆也。\n\n/2&\n\n&3&\n##### 六三：困于石，据于蒺蔾，入于其宫，不见其妻，凶。\n\n##### 象曰：据于蒺蔾，乘刚也。入于其宫，不见其妻，不祥也。\n\n/3&\n\n&4&\n##### 九四：来徐徐，困于金车，吝，有终。\n\n##### 象曰：来徐徐，志在下也。虽不当位，有与也。\n\n/4&\n\n&5&\n##### 九五：劓刖，困于赤绂，乃徐有说，利用祭祀。\n\n##### 象曰：劓刖，志未得也。乃徐有说，以中直也。利用祭祀，受福也。\n\n/5&\n\n&6&\n##### 上六：困于葛藟，于臲卼，曰动悔。有悔，征吉。\n\n##### 象曰：困于葛藟，未当也。动悔，有悔吉，行也。\n\n/6&"},"011010":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/48.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：井通而困相遇也。**\n\n#### 序\n**序卦曰：困乎上者必反下，故受之以《井》。**","text.tab3":"&0&\n**井：改邑不改井，无丧无得，往来井井。汔至，亦未繘井，羸其瓶，凶。**\n**象曰：木上有水，井；君子以劳民劝相。**\n\n/0&\n#### 彖\n\n**彖曰：巽乎水而上水，井；井养而不穷也。改邑不改井，乃以刚中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也。**\n\n#### 爻\n\n&1&\n##### 初六：井泥不食，旧井无禽。\n\n##### 象曰：井泥不食，下也。旧井无禽，时舍也。\n\n/1&\n\n&2&\n##### 九二：井谷射鲋，瓮敝漏。\n\n##### 象曰：井谷射鲋，无与也。\n\n/2&\n\n&3&\n##### 九三：井渫不食，为我心恻，可用汲，王明，并受其福。\n\n##### 象曰：井渫不食，行恻也。求王明，受福也。\n\n/3&\n\n&4&\n##### 六四：井甃，无咎。\n\n##### 象曰：井甃无咎，修井也。\n\n/4&\n\n&5&\n##### 九五：井冽，寒泉食。\n\n##### 象曰：寒泉之食，中正也。\n\n/5&\n\n&6&\n##### 上六：井收勿幕，有孚元吉。\n\n##### 象曰：元吉在上，大成也。\n\n/6&"},"101110":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/49.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：革，去故也。**\n\n#### 序\n**序卦曰：井道不可不革，故受之以《革》。**","text.tab3":"&0&\n**革：巳日乃孚，元亨利贞，悔亡。**\n**象曰：泽中有火，革；君子以治历明时。**\n\n/0&\n#### 彖\n\n**彖曰：革，水火相息，二女同居，其志不相得，曰革。巳日乃孚；革而信也。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成，汤武革命，顺乎天而应乎人，革之时大矣哉！**\n\n#### 爻\n\n&1&\n##### 初九：巩用黄牛之革。\n\n##### 象曰：巩用黄牛，不可以有为也。\n\n/1&\n\n&2&\n##### 六二：巳日乃革之，征吉，无咎。\n\n##### 象曰：巳日革之，行有嘉也。\n\n/2&\n\n&3&\n##### 九三：征凶，贞厉，革言三就，有孚。\n\n##### 象曰：革言三就，又何之矣。\n\n/3&\n\n&4&\n##### 九四：悔亡，有孚改命，吉。\n\n##### 象曰：改命之吉，信志也。\n\n/4&\n\n&5&\n##### 九五：大人虎变，未占有孚。\n\n##### 象曰：大人虎变，其文炳也。\n\n/5&\n\n&6&\n##### 上六：君子豹变，小人革面，征凶，居贞吉。\n\n##### 象曰：君子豹变，其文蔚也。小人革面，顺以从君也。\n\n/6&"},"011101":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/50.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：鼎，取新也。**\n\n#### 序\n**序卦曰：革物者莫若鼎，故受之以《鼎》。**","text.tab3":"&0&\n**鼎：元吉，亨。**\n**象曰：木上有火，鼎；君子以正位凝命。**\n\n/0&\n#### 彖\n\n**彖曰：鼎，象也。以木巽火，亨饪也。圣人亨以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨。**\n\n#### 爻\n\n&1&\n##### 初六：鼎颠趾，利出否，得妾以其子，无咎。\n\n##### 象曰：鼎颠趾，未悖也。利出否，以从贵也。\n\n/1&\n\n&2&\n##### 九二：鼎有实，我仇有疾，不我能即，吉。\n\n##### 象曰：鼎有实，慎所之也。我仇有疾，终无尤也。\n\n/2&\n\n&3&\n##### 九三：鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。\n\n##### 象曰：鼎耳革，失其义也。\n\n/3&\n\n&4&\n##### 九四：鼎折足，覆公餗，其形渥，凶。\n\n##### 象曰：覆公餗，信如何也。\n\n/4&\n\n&5&\n##### 六五：鼎黄耳，金铉，利贞。\n\n##### 象曰：鼎黄耳，中以为实也。\n\n/5&\n\n&6&\n##### 上九：鼎玉铉，大吉，无不利。\n\n##### 象曰：玉铉在上，刚柔节也。\n\n/6&"},"100100":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/51.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：震，起也。**\n\n#### 序\n**序卦曰：主器者莫若长子，故受之以《震》。《震》者，动也。**","text.tab3":"&0&\n**震：亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。**\n**象曰：洊雷，震；君子以恐惧修省。**\n\n/0&\n#### 彖\n\n**彖曰：震，亨。震来虩虩，恐致福也。笑言哑哑，后有则也。震惊百里，惊远而惧迩也。出可以守宗庙社稷，以为祭主也。**\n\n#### 爻\n\n&1&\n##### 初九：震来虩虩，后笑言哑哑，吉。\n\n##### 象曰：震来虩虩，恐致福也。笑言哑哑，后有则也。\n\n/1&\n\n&2&\n##### 六二：震来厉，亿丧贝，跻于九陵，勿逐，七日得。\n\n##### 象曰：震来厉，乘刚也。\n\n/2&\n\n&3&\n##### 六三：震苏苏，震行无眚。\n\n##### 象曰：震苏苏，位不当也。\n\n/3&\n\n&4&\n##### 九四：震遂泥。\n\n##### 象曰：震遂泥，未光也。\n\n/4&\n\n&5&\n##### 六五：震往来厉，亿无丧，有事。\n\n##### 象曰：震往来厉，危行也。其事在中，大无丧也。\n\n/5&\n\n&6&\n##### 上六：震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。\n\n##### 象曰：震索索，中未得也。虽凶无咎，畏邻戒也。\n\n/6&"},"001001":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/52.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：艮，止也。**\n\n#### 序\n**序卦曰：物不可以终动，止之，故受之以《艮》。《艮》者，止也。**","text.tab3":"&0&\n**艮：艮其背，不获其身，行其庭，不见其人，无咎。**\n**象曰：兼山，艮；君子以思不出其位。**\n\n/0&\n#### 彖\n\n**彖曰：艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。**\n\n#### 爻\n\n&1&\n##### 初六：艮其趾，无咎，利永贞。\n\n##### 象曰：艮其趾，未失正也。\n\n/1&\n\n&2&\n##### 六二：艮其腓，不拯其随，其心不快。\n\n##### 象曰：不拯其随，未退听也。\n\n/2&\n\n&3&\n##### 九三：艮其限，列其夤，厉薰心。\n\n##### 象曰：艮其限，危薰心也。\n\n/3&\n\n&4&\n##### 六四：艮其身，无咎。\n\n##### 象曰：艮其身，止诸躬也。\n\n/4&\n\n&5&\n##### 六五：艮其辅，言有序，悔亡。\n\n##### 象曰：艮其辅，以中正也。\n\n/5&\n\n&6&\n##### 上九：敦艮，吉。\n\n##### 象曰：敦艮之吉，以厚终也。\n\n/6&"},"001011":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/53.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：渐，女归待男行也。**\n\n#### 序\n**序卦曰：物不可以终止，故受之以《渐》。渐者，进也。**","text.tab3":"&0&\n**渐：女归吉，利贞。**\n**象曰：山上有木，渐；君子以居贤德，善俗。**\n\n/0&\n#### 彖\n\n**彖曰：渐之进也，女归吉也。进得位，往有功也。进以正，可以正邦也。其位刚，得中也。止而巽，动不穷也。**\n\n#### 爻\n\n&1&\n##### 初六：鸿渐于干，小子厉，有言，无咎。\n\n##### 象曰：小子之厉，义无咎也。\n\n/1&\n\n&2&\n##### 六二：鸿渐于磐，饮食衎衎，吉。\n\n##### 象曰：饮食衎衎，吉，不素饱也。\n\n/2&\n\n&3&\n##### 九三：鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。\n\n##### 象曰：夫征不复，离群丑也。妇孕不育，失其道也。利用御寇，顺相保也。\n\n/3&\n\n&4&\n##### 六四：鸿渐于木，或得其桷，无咎。\n\n##### 象曰：或得其桷，顺以巽也。\n\n/4&\n\n&5&\n##### 九五：鸿渐于陵，妇三岁不孕，终莫之胜，吉。\n\n##### 象曰：终莫之胜，吉；得所愿也。\n\n/5&\n\n&6&\n##### 上九：鸿渐于陆，其羽可用为仪，吉。\n\n##### 象曰：其羽可用为仪，吉；不可乱也。\n\n/6&"},"110100":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/54.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：归妹，女之终也。**\n\n#### 序\n**序卦曰：进必有所归，故受之以《归妹》。**","text.tab3":"&0&\n**归妹：征凶，无攸利。**\n**象曰：泽上有雷，归妹；君子以永终知敝。**\n\n/0&\n#### 彖\n\n**彖曰：归妹，天地之大义也。天地不交，而万物不兴，归妹人之终始也。说以动，所归妹也。征凶，位不当也。无攸利，柔乘刚也。**\n\n#### 爻\n\n&1&\n##### 初九：归妹以娣，跛能履，征吉。\n\n##### 象曰：归妹以娣，以恒也。跛能履吉，相承也。\n\n/1&\n\n&2&\n##### 九二：眇能视，利幽人之贞。\n\n##### 象曰：利幽人之贞，未变常也。\n\n/2&\n\n&3&\n##### 六三：归妹以须，反归以娣。\n\n##### 象曰：归妹以须，未当也。\n\n/3&\n\n&4&\n##### 九四：归妹愆期，迟归有时。\n\n##### 象曰：愆期之志，有待而行也。\n\n/4&\n\n&5&\n##### 六五：帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉。\n\n##### 象曰：帝乙归妹，不如其娣之袂良也。其位在中，以贵行也。\n\n/5&\n\n&6&\n##### 上六：女承筐无实，士刲羊无血，无攸利。\n\n##### 象曰：上六无实，承虚筐也。\n\n/6&"},"101100":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/55.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：丰，多故也。**\n\n#### 序\n**序卦曰：得其所归者必大，故受之以《丰》。《丰》者，大也。**","text.tab3":"&0&\n**丰：亨，王假之，勿忧，宜日中。**\n**象曰：雷电皆至，丰；君子以折狱致刑。**\n\n/0&\n#### 彖\n\n**彖曰：丰，大也。明以动，故丰。王假之，尚大也。勿忧宜日中，宜照天下也。日中则昃，月盈则食，天地盈虚，与时消息，而况人于人乎？况于鬼神乎？**\n\n#### 爻\n\n&1&\n##### 初九：遇其配主，虽旬无咎，往有尚。\n\n##### 象曰：虽旬无咎，过旬灾也。\n\n/1&\n\n&2&\n##### 六二：丰其蔀，日中见斗，往得疑疾，有孚发若，吉。\n\n##### 象曰：有孚发若，信以发志也。\n\n/2&\n\n&3&\n##### 九三：丰其沛，日中见沬，折其右肱，无咎。\n\n##### 象曰：丰其沛，不可大事也。折其右肱，终不可用也。\n\n/3&\n\n&4&\n##### 九四：丰其蔀，日中见斗，遇其夷主，吉。\n\n##### 象曰：丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主，吉；行也。\n\n/4&\n\n&5&\n##### 六五：来章，有庆誉，吉。\n\n##### 象曰：六五之吉，有庆也。\n\n/5&\n\n&6&\n##### 上六：丰其屋，蔀其家，闚其户，阒其无人，三岁不觌，凶。\n\n##### 象曰：丰其屋，天际翔也。闚其户，阒其无人，自藏也。\n\n/6&"},"001101":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/56.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：亲寡旅也。**\n\n#### 序\n**序卦曰：穷大者必失其居，故受之以《旅》。**","text.tab3":"&0&\n**旅：小亨，旅贞吉。**\n**象曰：山上有火，旅；君子以明慎用刑，而不留狱。**\n\n/0&\n#### 彖\n\n**彖曰：旅，小亨，柔得中乎外，而顺乎刚，止而丽乎明，是以小亨，旅贞吉也。旅之时义大矣哉！**\n\n#### 爻\n\n&1&\n##### 初六：旅琐琐，斯其所取灾。\n\n##### 象曰：旅琐琐，志穷灾也。\n\n/1&\n\n&2&\n##### 六二：旅即次，怀其资，得童仆贞。\n\n##### 象曰：得童仆贞，终无尤也。\n\n/2&\n\n&3&\n##### 九三：旅焚其次，丧其童仆，贞厉。\n\n##### 象曰：旅焚其次，亦以伤矣。以旅与下，其义丧也。\n\n/3&\n\n&4&\n##### 九四：旅于处，得其资斧，我心不快。\n\n##### 象曰：旅于处，未得位也。得其资斧，心未快也。\n\n/4&\n\n&5&\n##### 六五：射雉一矢亡，终以誉命。\n\n##### 象曰：终以誉命，上逮也。\n\n/5&\n\n&6&\n##### 上九：鸟焚其巢，旅人先笑后号啕。丧牛于易，凶。\n\n##### 象曰：以旅在上，其义焚也。丧牛于易，终莫之闻也。\n\n/6&"},"011011":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/57.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：兑见而巽伏也。**\n\n#### 序\n**序卦曰：旅而无所容，故受之以《巽》。《巽》者，入也。**","text.tab3":"&0&\n**巽：小亨，利攸往，利见大人。**\n**象曰：随风，巽；君子以申命行事。**\n\n/0&\n#### 彖\n\n**彖曰：重巽以申命，刚巽乎中正而志行。柔皆顺乎刚，是以小亨，利有攸往，利见大人。**\n\n#### 爻\n\n&1&\n##### 初六：进退，利武人之贞。\n\n##### 象曰：进退，志疑也。利武人之贞，志治也。\n\n/1&\n\n&2&\n##### 九二：巽在床下，用史巫纷若，吉，无咎。\n\n##### 象曰：纷若之吉，得中也。\n\n/2&\n\n&3&\n##### 九三：频巽，吝。\n\n##### 象曰：频巽之吝，志穷也。\n\n/3&\n\n&4&\n##### 六四：悔亡，田获三品。\n\n##### 象曰：田获三品，有功也。\n\n/4&\n\n&5&\n##### 九五：贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。\n\n##### 象曰：九五之吉，位正中也。\n\n/5&\n\n&6&\n##### 上九：巽在床下，丧其资斧，贞凶。\n\n##### 象曰：巽在床下，上穷也。丧其资斧，正乎凶也。\n\n/6&"},"110110":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/58.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：兑见而巽伏也。**\n\n#### 序\n**序卦曰：入而后说之，故受之以《兑》。《兑》者，说也。**","text.tab3":"&0&\n**兑：亨，利贞。**\n**象曰：丽泽，兑；君子以朋友讲习。**\n\n/0&\n#### 彖\n\n**彖曰：兑，说也。刚中而柔外，说以利贞，是以顺乎天，而应乎人。说以先民，民忘其劳；说以犯难，民忘其死；说之大，民劝矣哉！**\n\n#### 爻\n\n&1&\n##### 初九：和兑，吉。\n\n##### 象曰：和兑之吉，行未疑也。\n\n/1&\n\n&2&\n##### 九二：孚兑，吉，悔亡。\n\n##### 象曰：孚兑之吉，信志也。\n\n/2&\n\n&3&\n##### 六三：来兑，凶。\n\n##### 象曰：来兑之凶，位不当也。\n\n/3&\n\n&4&\n##### 九四：商兑，未宁，介疾有喜。\n\n##### 象曰：九四之喜，有庆也。\n\n/4&\n\n&5&\n##### 九五：孚于剥，有厉。\n\n##### 象曰：孚于剥，位正当也。\n\n/5&\n\n&6&\n##### 上六：引兑。\n\n##### 象曰：上六引兑，未光也。\n\n/6&"},"010011":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/59.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：涣，离也。**\n\n#### 序\n**序卦曰：说而后散之，故受之以《涣》。《涣》者，离也。**","text.tab3":"&0&\n**涣：亨。王假有庙，利涉大川，利贞。**\n**象曰：风行水上，涣；先王以享于帝立庙。**\n\n/0&\n#### 彖\n\n**彖曰：涣，亨。刚来而不穷，柔得位乎外而上同。王假有庙，王乃在中也。利涉大川，乘木有功也。**\n\n#### 爻\n\n&1&\n##### 初六：用拯马壮，吉。\n\n##### 象曰：初六之吉，顺也。\n\n/1&\n\n&2&\n##### 九二：涣奔其机，悔亡。\n\n##### 象曰：涣奔其机，得愿也。\n\n/2&\n\n&3&\n##### 六三：涣其躬，无悔。\n\n##### 象曰：涣其躬，志在外也。\n\n/3&\n\n&4&\n##### 六四：涣其群，元吉。涣有丘，匪夷所思。\n\n##### 象曰：涣其群，元吉；光大也。\n\n/4&\n\n&5&\n##### 九五：涣汗其大号，涣王居，无咎。\n\n##### 象曰：王居无咎，正位也。\n\n/5&\n\n&6&\n##### 上九：涣其血，去逖出，无咎。\n\n##### 象曰：涣其血，远害也。\n\n/6&"},"110010":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/60.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：节，止也。**\n\n#### 序\n**序卦曰：物不可以终离，故受之以《节》。**","text.tab3":"&0&\n**节：亨。苦节，不可贞。**\n**象曰：泽上有水，节；君子以制数度，议德行。**\n\n/0&\n#### 彖\n\n**彖曰：节，亨，刚柔分，而刚得中。苦节不可贞，其道穷也。说以行险，当位以节，中正以通。天地节而四时成，节以制度，不伤财，不害民。**\n\n#### 爻\n\n&1&\n##### 初九：不出户庭，无咎。\n\n##### 象曰：不出户庭，知通塞也。\n\n/1&\n\n&2&\n##### 九二：不出门庭，凶。\n\n##### 象曰：不出门庭，失时极也。\n\n/2&\n\n&3&\n##### 六三：不节若，则嗟若，无咎。\n\n##### 象曰：不节之嗟，又谁咎也。\n\n/3&\n\n&4&\n##### 六四：安节，亨。\n\n##### 象曰：安节之亨，承上道也。\n\n/4&\n\n&5&\n##### 九五：甘节，吉；往有尚。\n\n##### 象曰：甘节之吉，居位中也。\n\n/5&\n\n&6&\n##### 上六：苦节，贞凶，悔亡。\n\n##### 象曰：苦节贞凶，其道穷也。\n\n/6&"},"110011":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/61.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：中孚，信也。**\n\n#### 序\n**序卦曰：节而信之，故受之以《中孚》。**","text.tab3":"&0&\n**中孚：豚鱼吉，利涉大川，利贞。**\n**象曰：泽上有风，中孚；君子以议狱缓死。**\n\n/0&\n#### 彖\n\n**彖曰：中孚，柔在内而刚得中。说而巽，孚，乃化邦也。豚鱼吉，信及豚鱼也。利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也。**\n\n#### 爻\n\n&1&\n##### 初九：虞吉，有它不燕。\n\n##### 象曰：初九虞吉，志未变也。\n\n/1&\n\n&2&\n##### 九二：鸣鹤在阴，其子和之，我有好爵，吾与尔靡之。\n\n##### 象曰：其子和之，中心愿也。\n\n/2&\n\n&3&\n##### 六三：得敌，或鼓或罢，或泣或歌。\n\n##### 象曰：可鼓或罢，位不当也。\n\n/3&\n\n&4&\n##### 六四：月几望，马匹亡，无咎。\n\n##### 象曰：马匹亡，绝类上也。\n\n/4&\n\n&5&\n##### 九五：有孚挛如，无咎。\n\n##### 象曰：有孚挛如，位正当也。\n\n/5&\n\n&6&\n##### 上九：翰音登于天，贞凶。\n\n##### 象曰：翰音登于天，何可长也。\n\n/6&"},"001100":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/62.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：小过，过也。**\n\n#### 序\n**序卦曰：有其信者必行之，故受之以《小过》。**","text.tab3":"&0&\n**小过：亨，利贞，可小事，不可大事。飞鸟遗之音，不宜上，宜下，大吉。**\n**象曰：山上有雷，小过；君子以行过乎恭，丧过乎哀，用过乎俭。**\n\n/0&\n#### 彖\n\n**彖曰：小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉，有飞鸟遗之音，不宜上宜下，大吉；上逆而下顺也。**\n\n#### 爻\n\n&1&\n##### 初六：飞鸟以凶。\n\n##### 象曰：飞鸟以凶，不可如何也。\n\n/1&\n\n&2&\n##### 六二：过其祖，遇其妣；不及其君，遇其臣；无咎。\n\n##### 象曰：不及其君，臣不可过也。\n\n/2&\n\n&3&\n##### 九三：弗过防之，从或戕之，凶。\n\n##### 象曰：从或戕之，凶如何也。\n\n/3&\n\n&4&\n##### 九四：无咎，弗过遇之。往厉必戒，勿用永贞。\n\n##### 象曰：弗过遇之，位不当也。往厉必戒，终不可长也。\n\n/4&\n\n&5&\n##### 六五：密云不雨，自我西郊，公弋取彼在穴。\n\n##### 象曰：密云不雨，已上也。\n\n/5&\n\n&6&\n##### 上六：弗遇过之，飞鸟离之，凶，是谓灾眚。\n\n##### 象曰：弗遇过之，已亢也。\n\n/6&"},"101010":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/63.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：既济，定也。**\n\n#### 序\n**序卦曰：有过物者必济，故受之以《既济》。**","text.tab3":"&0&\n**既济：亨，小利贞，初吉终乱。**\n**象曰：水在火上，既济；君子以思患而预防之。**\n\n/0&\n#### 彖\n\n**彖曰：既济，亨，小者亨也。利贞，刚柔正而位当也。初吉，柔得中也。终止则乱，其道穷也。**\n\n#### 爻\n\n&1&\n##### 初九：曳其轮，濡其尾，无咎。\n\n##### 象曰：曳其轮，义无咎也。\n\n/1&\n\n&2&\n##### 六二：妇丧其茀，勿逐，七日得。\n\n##### 象曰：七日得，以中道也。\n\n/2&\n\n&3&\n##### 九三：高宗伐鬼方，三年克之，小人勿用。\n\n##### 象曰：三年克之，惫也。\n\n/3&\n\n&4&\n##### 六四：繻有衣袽，终日戒。\n\n##### 象曰：终日戒，有所疑也。\n\n/4&\n\n&5&\n##### 九五：东邻杀牛，不如西邻之禴祭，实受其福。\n\n##### 象曰：东邻杀牛，不如西邻之时也；实受其福，吉大来也。\n\n/5&\n\n&6&\n##### 上六：濡其首，厉。\n\n##### 象曰：濡其首厉，何可久也。\n\n/6&"},"010101":{"text.tab1":"#### 图\n![(保存在국립중앙도서관的《断易天机》)](assets/guatu_pdf/64.jpg)","text.tab2":"#### 杂\n\n**杂卦曰：未济，男之穷也。**\n\n#### 序\n**序卦曰：物不可穷也，故受之以《未济》，终焉。**","text.tab3":"&0&\n**未济：亨，小狐汔济，濡其尾，无攸利。**\n**象曰：火在水上，未济；君子以慎辨物居方。**\n\n/0&\n#### 彖\n\n**彖曰：未济，亨；柔得中也。小狐汔济，未出中也。濡其尾，无攸利；不续终也。虽不当位，刚柔应也。**\n\n#### 爻\n\n&1&\n##### 初六：濡其尾，吝。\n\n##### 象曰：濡其尾，亦不知极也。\n\n/1&\n\n&2&\n##### 九二：曳其轮，贞吉。\n\n##### 象曰：九二贞吉，中以行正也。\n\n/2&\n\n&3&\n##### 六三：未济，征凶，利涉大川。\n\n##### 象曰：未济征凶，位不当也。\n\n/3&\n\n&4&\n##### 九四：贞吉，悔亡，震用伐鬼方，三年有赏于大国。\n\n##### 象曰：贞吉悔亡，志行也。\n\n/4&\n\n&5&\n##### 六五：贞吉，无悔，君子之光，有孚，吉。\n\n##### 象曰：君子之光，其晖吉也。\n\n/5&\n\n&6&\n##### 上九：有孚于饮酒，无咎，濡其首，有孚失是。\n\n##### 象曰：饮酒濡首，亦不知节也。\n\n/6&"}};
const _EMBEDDED_SAVES = [{"digits":[0,0,0,0,0,0],"time":"2026-06-09T17:37:17.521Z","favo":false},{"digits":[8,9,7,9,7,9],"time":"2026-06-16T18:45:37.402Z","shibo":"1:5:7:3","favo":true,"name":"この車はいいですか","note":"The hexagram indicated it's a new car, which was so true... \n\nThe future hexagram gave a clear warning and the moving lines revealed which components to blame."},{"digits":[8,7,8,7,8,8],"time":"2026-06-17T14:24:31.857Z","shibo":"1:5:7:3","favo":true,"name":"解：利西南，無所往，其來復吉，有攸往，夙","note":"제가 번역을 제대로 한 건가요?"},{"digits":[9,8,6,8,8,7],"time":"2026-06-17T22:59:19.784Z","shibo":"1:5:7:3","favo":true,"name":"How Is He?","note":"啊？\n有点意思。。。"},{"digits":[8,8,6,8,8,9],"time":"2026-06-27T22:02:27.028Z","shibo":"1:3:3:1","favo":false,"name":"display","note":"我请易经给一个可以拿来做例子展示在GitHub的卦，随便给什么啦！是什么我就展示什么。\nI asked iching what hexagrams to display on my Github page. I wished it could give a hexagram that contained water, fire, thunder or wind, since I like how blue, red and green look on the app."}];


/// standalone localStorage utilities ///
const _LS_SAVES = 'yc_saves', _LS_CFG = 'yc_config', _LS_HEX_OV = 'yc_hex_ov', _LS_LAST = 'yc_last';
function _lsLoadSaves(){
  const s = localStorage.getItem(_LS_SAVES);
  if(s !== null) return JSON.parse(s);
  const _def = _EMBEDDED_SAVES || [];
  localStorage.setItem(_LS_SAVES, JSON.stringify(_def));
  return JSON.parse(JSON.stringify(_def));
}
function _lsSave(entry){ const r=_lsLoadSaves(); r.push(entry); localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsFavo(time,favo){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){x.favo=favo;break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsDelete(time){ localStorage.setItem(_LS_SAVES,JSON.stringify(_lsLoadSaves().filter(r=>r.time!==time))); _srcSetClean('saves',false); }
function _lsSetName(time,name){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){x.name=name;break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsUpdateRecord(time,changes){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){Object.assign(x,changes);break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsGetConfig(){ const s=localStorage.getItem(_LS_CFG); if(s) return JSON.parse(s); const {hexagrams,...cfg}=_EMBEDDED_CONFIG; return JSON.parse(JSON.stringify(cfg)); }
function _lsSaveConfig(cfg){ localStorage.setItem(_LS_CFG,JSON.stringify(cfg)); }
function _lsGetHexOv(){ const s=localStorage.getItem(_LS_HEX_OV); return s?JSON.parse(s):{}; }
function _lsGetLast(){ const s=localStorage.getItem(_LS_LAST); return s?JSON.parse(s):null; }
function _lsSaveLast(){ if(currentData) localStorage.setItem(_LS_LAST, JSON.stringify({digits:state.slice(),tab:currentTab})); }
function _lsApplyHexOv(num,field,text){
  const val = field==='ci' ? text.split('\n') : text;
  const ov = _lsGetHexOv(); const k = String(num);
  if(!ov[k]) ov[k]={};
  ov[k][field] = val;
  localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
  _srcSetClean(['text.tab1','text.tab2','text.tab3'].includes(field)?'md':'cfg', false);
}
const _SRC_CANONICAL = {md:'text.md',cfg:'config.json',saves:'saves.json'};
function _esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function _validateCfg(cfg){
  if(typeof cfg !== 'object' || cfg === null || Array.isArray(cfg)) throw new Error('config.json must be a JSON object');
  const ti = cfg.trigrams;
  if(typeof ti !== 'object' || ti === null || Array.isArray(ti)) throw new Error('Missing "trigrams"');
  for(const k of ['000','001','010','011','100','101','110','111']){
    const t = ti[k];
    if(!t) throw new Error(`trigrams missing key "${k}"`);
    if(typeof t.name !== 'string') throw new Error(`trigrams["${k}"] missing "name"`);
    if(typeof t.sym  !== 'string') throw new Error(`trigrams["${k}"] missing "sym"`);
    if(typeof t.color!== 'string') throw new Error(`trigrams["${k}"] missing "color"`);
  }
  const tn = cfg.tab_names;
  if(typeof tn !== 'object' || tn === null || Array.isArray(tn)) throw new Error('Missing "tab_names"');
  for(const k of ['tab1','tab2','tab3']){ if(typeof tn[k] !== 'string') throw new Error(`tab_names missing "${k}"`); }
  const sp = cfg.shibo_probs;
  if(typeof sp !== 'object' || sp === null || Array.isArray(sp)) throw new Error('Missing "shibo_probs"');
  const bin = sp.binary;
  if(typeof bin !== 'object' || bin === null || Array.isArray(bin)) throw new Error('shibo_probs missing "binary"');
  for(const k of ['0','1']){ if(typeof bin[k] !== 'number') throw new Error(`shibo_probs.binary missing key "${k}"`); }
  const quat = sp.quaternary;
  if(typeof quat !== 'object' || quat === null || Array.isArray(quat)) throw new Error('shibo_probs missing "quaternary"');
  for(const k of ['6','7','8','9']){ if(typeof quat[k] !== 'number') throw new Error(`shibo_probs.quaternary missing key "${k}"`); }
}
function _srcStatus(){
  const def = {md:{clean:false,file:null},cfg:{clean:false,file:null},saves:{clean:false,file:null}};
  try{
    const raw = JSON.parse(localStorage.getItem('yc_src_status')||'{}');
    for(const t of ['md','cfg','saves']){
      if(raw[t]!=null) def[t] = typeof raw[t]==='boolean' ? {clean:raw[t],file:null} : Object.assign(def[t],raw[t]);
    }
  }catch(e){}
  return def;
}
function _srcSetClean(type,clean,file){
  const s=_srcStatus();
  if(clean){
    const d=new Date();
    const mm=String(d.getMonth()+1).padStart(2,'0');
    const dd=String(d.getDate()).padStart(2,'0');
    const hh=String(d.getHours()).padStart(2,'0');
    const mi=String(d.getMinutes()).padStart(2,'0');
    const yr=d.getFullYear();
    const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dateStr=LANG==='en'?`${hh}:${mi} ${dd}/${MON[d.getMonth()]}/${yr}`:`${yr}-${mm}-${dd} ${hh}:${mi}`;
    s[type]={clean,file:file||null,date:dateStr};
  } else {
    s[type]={clean,file:null,date:null};
  }
  localStorage.setItem('yc_src_status',JSON.stringify(s)); _srcRender();
}
function _srcRender(){
  const s=_srcStatus();
  ['md','cfg','saves'].forEach(t=>{
    document.querySelectorAll(`[data-src="${t}"]`).forEach(el=>{
      const st=s[t]; el.classList.toggle('source-label--loaded',!!st.clean);
      if(el.hasAttribute('data-i18n'))
        el.innerHTML=(st.clean&&st.file)?_SRC_CANONICAL[t]+':<br>'+(st.file.length>20?st.file.slice(0,20)+'…':st.file)+(st.date?'<br>'+st.date:''):T(el.dataset.i18n);
    });
  });
}

function applyNum(n){
  if(stateLocked){ setMsg(T('msg.locked_err'),'error'); return; }
  if(_shiboNameReady || (shiboBuffer.length > 0 && shiboBuffer.length < 6)){ setMsg(T('msg.shibo_busy',T('btn.shibo'),T('btn.settings_tip.busy')),'error'); document.getElementById('numDisplay').value = currentData ? currentData.num : 1; return; }
  if(_editMode) cancelTextEdit();
  document.querySelectorAll('.shibo-lit').forEach(el=>el.classList.remove('shibo-lit'));
  const d = _HEX_BY_NUM[n];
  if(!d){ setMsg(T('msg.query_fail', String(n)), 'error'); return; }
  for(let i=0;i<6;i++) state[i] = parseInt(d.sequence[i]);
  document.getElementById('numDisplay').value = n;
  currentData = d;
  currentData1 = null;
  hexViewMode = 'original';
  renderAll();
  renderHeader();
  fitRightHeader();
  renderContent(d);
  setMsg(T('msg.query_ok', d.name), 'success');
  updateEditBtn();
}
function stepNum(delta){
  const cur = parseInt(document.getElementById('numDisplay').value) || 1;
  applyNum(mod(cur -1 + delta, 64) + 1);
}

  } else if(done === 6){

  } else if(_shiboNameReady){

function _positionShiboBadge(){
  const badge = document.getElementById('shiboNameBadge');
  const btn = document.getElementById('btnShibo');
  const r = btn.getBoundingClientRect();
  const bw = badge.offsetWidth || 60, bh = badge.offsetHeight || 20;
  const GAP = 7, MARGIN = 4;
  const vp = window.visualViewport ? {w:window.visualViewport.width,h:window.visualViewport.height,ox:window.visualViewport.offsetLeft,oy:window.visualViewport.offsetTop} : {w:window.innerWidth,h:window.innerHeight,ox:0,oy:0};
  let x = r.left - vp.ox + r.width/2 - bw/2;
  x = Math.max(MARGIN, Math.min(vp.w - bw - MARGIN, x));
  let y = r.bottom - vp.oy + GAP;
  if(y + bh > vp.h - MARGIN) y = r.top - vp.oy - bh - GAP;
  badge.style.left = x + 'px';
  badge.style.top  = y + 'px';
}

  if(shiboBuffer.length >= 6) shiboBuffer.length = 0;
  const mode = bitRowMode === 'quaternary' ? 'quaternary' : 'binary';
  const weights = shiboProbWeights ? shiboProbWeights[mode]
                : (mode==='quaternary' ? {"6":1,"7":5,"8":7,"9":3} : {"0":1,"1":1});
  shiboBuffer.push(weightedRandom(weights));
  const done = shiboBuffer.length;
  updateSettingsBtn();
  renderShiboBtn();
  setMsg(T('msg.shibo_progress', done), 'success');
  if(done === 6){
    for(let i=0;i<6;i++) state[i] = shiboBuffer[i];
    if(bitRowMode === 'quaternary') deriveState01();
    renderAll();
    const _savedBits = [...shiboBuffer];
    doQuery().then(()=>{
      _lsSave({ digits: _savedBits, time: new Date().toISOString(), shibo: _shiboRatio(), favo: false, name: _shiboName||'', note: '' });
      flashBtn('btnSave');
      setMsg(T('msg.shibo_done', _savedBits.join(' ')), 'success');
    });
    const sb = document.getElementById('btnShibo');
    sb.classList.add('shibo-complete');
    sb.disabled = true;
    document.querySelectorAll('.yao-btn,.bit-toggle,#numDisplay').forEach(el=>el.classList.add('shibo-lit'));
    updateSettingsBtn();
    setTimeout(()=>{
      shiboBuffer.length = 0;
      sb.classList.remove('shibo-complete');
      sb.disabled = false;
      _clearShiboBadge();
      updateSettingsBtn();
    }, 3000);
  }
}

// binary → quaternary：將 {0,1} 映射為靜爻 {8,7}（陰靜=8 陽靜=7），再派生 state_0/state_1
// quaternary → binary：以 state_0（本卦）還原為 {0,1}
function setBitRowMode(m){
  bitRowMode = m;
  if(m === 'quaternary'){
    for(let i=0;i<6;i++) state[i] = state[i] ? 7 : 8;
    deriveState01();
  } else {
    for(let i=0;i<6;i++) state[i] = state_0[i];
    guaxiangSlots = null;
  }
}

(function(){
  const el = document.getElementById('msgBox');
  let fadeTimer = null, clearTimer = null;
  function cancelTimers(){ clearTimeout(fadeTimer); clearTimeout(clearTimer); fadeTimer = clearTimer = null; }
  function fitError(){
    el.style.fontSize = '';
    if(!el.textContent.trim()) return;
    let size = 0.85;
    while(el.scrollHeight > el.clientHeight && size > 0.45){
      size = Math.round((size - 0.05) * 100) / 100;
      el.style.fontSize = size + 'rem';
    }
  }
  new MutationObserver(function(){
    cancelTimers();
    el.style.transition = 'none';
    el.classList.remove('msg-fading');
    el.offsetHeight; // force reflow — snaps opacity to 1 instantly
    el.style.transition = '';
    fitError();
    if(!el.textContent.trim()) return;
    fadeTimer = setTimeout(function(){
      el.classList.add('msg-fading');
      clearTimer = setTimeout(function(){
        el.className = 'msg'; // 重置至初始（移除 msg--success/error 及 msg-fading）
        el.textContent = '';
      }, 10000);
    }, 3000);
  }).observe(el, {childList:true, characterData:true, subtree:true});
})();

// quaternary 值語意：6=老陰（陰變陽）8=陰靜  →  本卦(state_0)為陰
//               7=陽靜            9=老陽（陽變陰）→ 本卦為陽
// 之卦(state_1)：老陰/老陽翻轉，靜爻不變
function deriveState01(){
  for(let i=0;i<6;i++){
    state_0[i] = (state[i] === 6 || state[i] === 8) ? 0 : 1;
    state_1[i] = (state[i] === 8 || state[i] === 9) ? 0 : 1;
  }
}

/* ── Markdown 渲染（處理自定義子集：###/####/#####標題、**粗體**、倪曰注釋、漢字序號條目） ── */
function _nameHtml(s){ return String(s).replace(/\{([^|{}]+)\|([^|{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>'); }
function renderInline(s){
  return s
    .replace(/&&(.+?)\/&/g,'$1')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\{([^|{}]+)\|([^|{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function renderMD(text, statuses=null){
  if(!text) return '<p class="body-line" style="color:#5a4020;">'+T('content.empty')+'</p>';
  text = text.replace(/&&(.+?)\/&/g,'$1');
  let html = '';
  let inSub = false;
  let sectionOpen = false;
  function closeSub(){ if(inSub){ html += '</div></div>'; inSub=false; } }
  for(const raw of text.split('\n')){
    const line = raw.trim();
    if(!line){ html += '<br>'; continue; }
    if(line === '&N&'){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      if(statuses){
        html += '<div class="ci-section ci-section-dim">';
        sectionOpen = true;
      }
      continue;
    }
    const om = line.match(/^&(\d+)&$/);
    if(om){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      if(statuses){
        const st = statuses[parseInt(om[1])] || 'b';
        html += '<div class="ci-section ci-section-'+st+'">';
        sectionOpen = true;
      }
      continue;
    }
    if(line === '/N&' || /^\/\d+&$/.test(line)){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      continue;
    }
    if(line.startsWith('##### ')){
      html += '<div class="yao-heading">'+renderInline(line.slice(6))+'</div>';
    } else if(line.startsWith('#### ')){
      closeSub();
      const name = line.slice(5).trim();
      const jieAttr = name==='解' ? ' data-jie' : '';
      html += '<div class="sub-section" data-mode="full"'+jieAttr+'>';
      html += '<div class="sub-heading"><span>'+renderInline(name)+'</span>'
            + '<button class="section-toggle" onclick="toggleSection(this)">▼</button></div>';
      html += '<div class="sub-section-body">';
      inSub = true;
    } else if(line.startsWith('### ')){
      closeSub();
      html += '<div class="sec-heading">'+renderInline(line.slice(4))+'</div>';
    } else if(line.startsWith('**') && line.endsWith('**') && line.length > 4){
      html += '<div class="bold-title">'+renderInline(line.slice(2,-2))+'</div>';
    } else if(line.startsWith('> ') || line === '>'){
      const body = line.startsWith('> ') ? line.slice(2) : '';
      html += '<p class="annotation">'+(body.trim() ? renderInline(body) : '&nbsp;')+'</p>';
    } else if(line.startsWith('• ')){
      const rest = line.slice(2);
      const sep = rest.search(/[、.：:]/);
      if(sep !== -1){
        const label = rest.slice(0, sep + 1);
        const body  = rest.slice(sep + 1);
        html += '<div class="content-item"><span class="item-num">'+label+'</span>'+renderInline(body)+'</div>';
      } else {
        html += '<div class="content-item">'+renderInline(rest)+'</div>';
      }
    } else if(/^!\[([^\]]*)\]\(([^)]+)\)$/.test(line)){
      const im = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
      const alt = _esc(im[1]);
      const src = _esc(im[2]);
      const isPdf = /\.pdf(#|$)/i.test(im[2]);
      const media = isPdf
        ? '<p class="media-missing">'+src+'</p><iframe class="md-pdf" src="'+src+'" title="'+alt+'" onload="this.previousElementSibling.style.display=\'none\'"></iframe>'
        : '<img src="'+src+'" alt="'+alt+'" onerror="_mediaErr(this)">';
      html += '<figure class="md-image">'+media
            + (alt ? '<figcaption>'+alt+'</figcaption>' : '')
            + '</figure>';
    } else {
      html += '<p class="body-line">'+renderInline(line)+'</p>';
    }
  }
  closeSub();
  if(sectionOpen) html += '</div>';
  return html;
}



// 根據変爻數決定哪條爻辭為「斷（a）」哪條為「參考（b）」，其餘 dim
// s0/s1 各有 8 格：[0]=卦辭 [1~6]=初~上爻辭 [7]=用九/用六（乾坤專用）
// yi=変爻索引（升序），nfi=非変爻索引（升序）
// 決定規則（來自占卜筮数文件）：
//   0変 → a=本卦卦辭
//   1変 → a=本卦 該変爻辭
//   2変 → a=本卦 上変爻辭，b=本卦 下変爻辭
//   3変 → a=本卦卦辭，b=之卦卦辭
//   4変 → a=之卦 最低非変爻辭，b=之卦 次低非変爻辭
//   5変 → a=之卦 唯一非変爻辭
//   6変 → 乾/坤：a=本卦用九/用六；其他卦：a=之卦卦辭
function computeGuaxiangSlots(){
  const yi=[],nfi=[];
  for(let i=0;i<6;i++){
    if(state[i]===6||state[i]===9) yi.push(i);
    else nfi.push(i);
  }
  const n=yi.length;
  const s0=Array(8).fill('dim'),s1=Array(8).fill('dim');
  if(n===0){ s0[0]='a'; }
  else if(n===1){ s0[1+yi[n-1]]='a'; }
  else if(n===2){ s0[1+yi[n-1]]='a'; s0[1+yi[0]]='b'; }
  else if(n===3){ s0[0]='a'; s1[0]='b'; }
  else if(n===4){ s1[1+nfi[0]]='a'; s1[1+nfi[1]]='b'; }
  else if(n===5){ s1[1+nfi[0]]='a'; }
  else{
    // 乾（全陽）或坤（全陰）才有 ci[7]（用九/用六）
    const qk=state_0.every(v=>v===1)||state_0.every(v=>v===0);
    if(qk) s0[7]='a'; else s1[0]='a';
  }
  return {s0,s1,n};
}

function renderGuaxiang(){
  const el=document.getElementById('contentArea');
  if(!currentData){el.innerHTML='';return;}
  function col(jw,statuses){
    return jw.map((text,i)=>{
      if(!text.trim()) return '';
      const cls='guaxiang-jw-item guaxiang-jw-'+(statuses?statuses[i]:'b');

  if(!guaxiangSlots){ el.innerHTML='<div class="guaxiang-col guaxiang-col-single">'+col(currentData.ci,null)+'</div>'; return; }

      +'<div class="guaxiang-col">'+col(currentData.ci,s0)+'</div>'
      +'<div class="guaxiang-col">'+col(currentData1.ci,s1)+'</div>'
      +'</div>';

    el.innerHTML='<div class="guaxiang-col guaxiang-col-single">'+col(currentData.ci,s0)+'</div>';
  }

// entries: [[tab, enabled], ...]  —— 只更新傳入的頁面，其餘不變
// 若當前頁面被禁用，自動切換到最近可用的；全無則報錯清空內容
function applyTabAvailability(entries){
  for(const [m, enabled] of entries){
    enabled ? tabDisabled.delete(m) : tabDisabled.add(m);
    document.getElementById(TAB_BTN[m]).classList.toggle('tab-disabled', !enabled);
  }
  if(!tabDisabled.has(currentTab)) return;
  const idx = TABS.indexOf(currentTab);
  let fallback = null;
  for(let d = 1; d < TABS.length && !fallback; d++){
    if(idx + d < TABS.length && !tabDisabled.has(TABS[idx + d])) fallback = TABS[idx + d];
    else if(idx - d >= 0     && !tabDisabled.has(TABS[idx - d])) fallback = TABS[idx - d];
  }
  if(fallback){
    setTab(fallback);
  } else {
    setMsg(T('msg.no_tab'), 'error');
    document.getElementById('contentArea').innerHTML = '';
  }
}

// 查詢本卦（及 quaternary 模式下的之卦），更新 currentData/currentData1 並重繪右欄（同步）
function doQuery(){
  if(_editMode) cancelTextEdit();
  hexViewMode = 'original';
  const bits0 = (bitRowMode === 'quaternary' ? state_0 : state).join("");
  document.querySelectorAll('.shibo-lit').forEach(el=>el.classList.remove('shibo-lit'));
  setMsg('', '');
  const d = _HEX_BY_SEQ[bits0];
  if(!d){

    return Promise.resolve();
  }
  currentData = d;
  currentData1 = bitRowMode === 'quaternary' ? (_HEX_BY_SEQ[state_1.join("")] || null) : null;

  const numEl = document.getElementById("numDisplay");
  numEl.value = (bitRowMode === 'quaternary' && currentData1 && currentData1.num !== d.num)
    ? d.num + ' -> ' + currentData1.num
    : d.num;

    ? computeGuaxiangSlots()
    : null;

  updateEditBtn();

// 加權隨機：依 {值: 權重} 字典抽取一個值
function weightedRandom(weights){
  const entries = Object.entries(weights);
  let r = Math.random() * entries.reduce((s,[,w])=>s+w, 0);
  for(const [val,w] of entries){ r-=w; if(r<=0) return parseInt(val); }
  return parseInt(entries[entries.length-1][0]);
}
