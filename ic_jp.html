ろし。","二爻：其の腓に艮まる。其の随うを拯わず。其の心快からず。","三爻：其の限に艮まる。其の夤を列く。厲うくして心を薰す。","四爻：其の身に艮まる。咎なし。","五爻：其の輔に艮まる。言うこと序有り。悔い亡ぶ。","上爻：艮まるに敦し。吉。"]},{"num":53,"name":"{風山漸|ふうざんぜん}","sequence":"001011","symbol":"䷴","short_name":"漸","ci":["漸は、女帰ぐに吉。貞に利ろし。","初爻：鴻、于に漸む。小子厲うし。言有るも咎なし。","二爻：鴻、磐に漸む。飲食衎衎たり。吉。","三爻：鴻、陸に漸む。夫征きて復らず。婦孕みて育わず。凶なり。寇を禦ぐに利ろし。","四爻：鴻、木に漸む。或いは其の桷を得。咎なし。","五爻：鴻、陵に漸む。婦三歳孕まず。終に之に勝つこと莫し。吉。","上爻：鴻、逵に漸む。其の羽用て儀となすべし。吉。"]},{"num":54,"name":"{雷沢帰妹|らいたくきまい}","sequence":"110100","symbol":"䷵","short_name":"帰妹","ci":["帰妹。征けば凶。利ろしき攸なし。","初爻：帰妹娣を以てす。跛能く履む。征きて吉。","二爻：眇能く視る。幽人の貞に利ろし。","三爻：帰妹須を以てす。反り帰ぐに娣を以てす。","四爻：帰妹期を愆ぐ。帰ぐを遅ちて時有らん。","五爻：帝乙妹を帰がしむ。其の君の袂は、其の娣の袂の良きに如かず。月望に幾し。吉。","上爻：女筐を承けて実なし。士羊を刲きて血なし。利ろしき攸なし。"]},{"num":55,"name":"{雷火豊|らいかほう}","sequence":"101100","symbol":"䷶","short_name":"豊","ci":["豊は亨る。王之に假る。憂うる勿れ、日中に宜し。","初爻：其の配主に遇う。旬しと雖も咎なし。往きて尚ばるる有り。","二爻：其の蔀を豊いにす。日中斗を見る。往きて疑疾を得。孚有りて発若たれば吉。","三爻：其の沛を豊いにす。日中沫を見る。其の右肱を折る。咎なし。","四爻：其の蔀を豊いにす。日中斗を見る。其の夷主に遇う。吉。","五爻：章を来す。慶誉あり。吉。","上爻：其の屋を豊いにし、其の家を蔀う。其の戸を闚えば、闃として其れ人なし。三歳覿ず。凶。"]},{"num":56,"name":"{火山旅|かざんりょ}","sequence":"001101","symbol":"䷷","short_name":"旅","ci":["旅は、小しく亨る。旅は貞にして吉。","初爻：旅、瑣瑣たり。斯れ其の災いを取る所。","二爻：旅、次に即き、其の資を懐き、童僕の貞を得。","三爻：旅、其の次を焚く。其の童僕の貞を喪う。厲うし。","四爻：旅、于に處る。其の資斧を得。我が心快からず。","五爻：雉を射て一矢亡う。終に以て誉命あり。","上爻：鳥其の巣を焚く。旅人先には笑い、後には號き咷ぶ。牛を易に喪う。凶。"]},{"num":57,"name":"{巽為風|そんいふう}","sequence":"011011","symbol":"䷸","short_name":"巽","ci":["巽は、小しく亨る。往く攸有るに利ろし。大人を見るに利ろし。","初爻：進退す。武人の貞に利ろし。","二爻：巽いて牀下に在り。史巫を用う。紛若たるも吉にして咎なし。","三爻：頻りに巽う。吝。","四爻：悔い亡ぶ。田して三品を獲。","五爻：貞なれば吉、悔い亡ぶ。利ろしからざるなし。初めなくして終り有り。庚に先だつ三日、庚に後れること三日。吉。","上爻：巽いて牀下に在り、其の資斧を喪う。貞しけれども凶。"]},{"num":58,"name":"{兌為沢|だいいたく}","sequence":"110110","symbol":"䷹","short_name":"兌","ci":["兌は、亨る。貞に利ろし。","初爻：和して兌ぶ。吉。","二爻：孚にして兌ぶ。吉。悔い亡ぶ。","三爻：来りて兌ぶ。凶。","四爻：商りて兌ぶ。未だ寧からず。疾を介て喜び有り。","五爻：剥に孚す。厲うき有り。","上爻：引かれて兌ぶ。"]},{"num":59,"name":"{風水渙|ふうすいかん}","sequence":"010011","symbol":"䷺","short_name":"渙","ci":["渙は、亨る。王有廟に假る。大川を渉るに利ろし。貞に利ろし。","初爻：用て拯う。馬壮んなれば吉。","二爻：渙の時、其の机に奔る。悔い亡ぶ。","三爻：其の躬を渙らす。悔いなし。","四爻：其の羣を渙らす。元いに吉。渙らして丘る有り。夷の思う所に匪ず。","五爻：其の大號を汗にす。王居を渙らして咎なし。","上爻：其の血を渙らす。去りて逖く出づ。咎なし。"]},{"num":60,"name":"{水沢節|すいたくせつ}","sequence":"110010","symbol":"䷻","short_name":"節","ci":["節は、亨る。苦節は貞にすべからず。","初爻：戸庭を出でず。咎なし。","二爻：門庭を出でず。凶。","三爻：節若たらざれば、則ち嗟若たり。咎なし。","四爻：節に安んず。亨る。","五爻：節に甘んず。吉。往きて尚ばるる有り。","上爻：苦節は、貞なれば凶。悔い亡ぶ。"]},{"num":61,"name":"{風沢中孚|ふうたくちゅうふ}","sequence":"110011","symbol":"䷼","short_name":"中孚","ci":["中孚は、豚魚にして吉。大川を渉るに利ろし。貞に利ろし。","初爻：虞れば吉。它あれば燕からず。","二爻：鳴鶴陰に在り。其の子之に和す。我に好爵有り。吾爾と之を靡にせん。","三爻：敵を得て、或いは鼓し、或いは罷み、或いは泣き、或いは歌う。","四爻：月望に幾し。馬匹亡う。咎なし。","五爻：孚有りて攣如たり。咎なし。","上爻：翰音天に登る。貞なれば凶。"]},{"num":62,"name":"{雷山小過|らいざんしょうか}","sequence":"001100","symbol":"䷽","short_name":"小過","ci":["小過は、亨る。貞に利ろし。小事に可なるも、大事に可ならず。飛鳥之が音を遺す。上るに宜しからず、下るに宜しくして大いに吉なり。","初爻：飛鳥以て凶。","二爻：其の祖を過ぎ、其の妣に遇う。其の君に及ばず、其の臣に遇う。咎なし。","三爻：過ぎずして之を防ぐ、従わば或いは之を戕わん。凶。","四爻：咎なし。過ぎずして之に遇う。往けば厲うし。必ず戒めよ。永貞に用うる勿れ。","五爻：密雲雨ふらず。我が西郊よりす。公弋して彼の穴に在るを取る。","上爻：遇わずして之に過ぐ。飛鳥之に離る。凶。是を災眚と謂う。"]},{"num":63,"name":"{水火既済|すいかきせい}","sequence":"101010","symbol":"䷾","short_name":"既済","ci":["既済は、亨るもの小なり。貞に利ろし。初めは吉にして終りは乱る。","初爻：其の輪を曳く。其の尾を濡おす。咎なし。","二爻：婦其の茀を喪う。逐うこと勿れ。七日にして得ん。","三爻：高宗鬼方を伐つ。三年にして之に克つ。小人は用うる勿れ。","四爻：繻に衣袽あり。終日戒めよ。","五爻：東隣の牛を殺すは、西隣の禴祭して、実に其の福を受くるに如かず。","上爻：其の首を濡す。厲うし。"]},{"num":64,"name":"{火水未済|かすいびせい}","sequence":"010101","symbol":"䷿","short_name":"未済","ci":["未済は、亨る。小狐汔んど済らんとして、其の尾を濡す。利ろしき攸なし。","初爻：其の尾を濡す。吝。","二爻：其の輪を曳く。貞にして吉。","三爻：未済。征けば凶。大川を渉るに利ろし。","四爻：貞にして吉。悔い亡ぶ。震いて用て鬼方を伐つ。三年にして大國に賞有り。","五爻：貞にして吉。悔なし。君子の光。孚有りて吉。","上爻：飲酒に孚有り。咎なし。其の首を濡せば、孚有るも是を失う。"]}],"lit_mode":"zhuxi7"};
const _EMBEDDED_HEX = {"111111":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/001.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：乾は剛にして**\n\n#### 序\n**序卦伝：天地有りて、然る後に万物生ず。**","text.tab3":"&0&\n**乾は、元いに亨りて、貞に利ろし。**\n**象伝：天行は健なり。君子以て自らつとめて息まず。**\n\n/0&\n#### 彖\n\n**彖伝：大いなるかな乾元、万物資りて始む。乃ち天を統ぶ。雲行き雨施し、品物形を流く、大いに終始を明らかにし、六位時に成る。時に六龍に乗り、以て天を御す。乾道変化して、おのおの性命を正しくし、大和を保合す。乃ち貞しきに利ろし。庶物に首出して、万国ことごとく寧し。**\n\n#### 爻\n\n&1&\n##### 初爻：潜龍、用うる勿れ。\n\n##### 象伝：潜龍用うる勿れとは、陽下にある也。\n\n##### 文言：初九に曰く、「潜龍用うる勿れ」とは、何の謂いぞや。子曰く、龍徳ありて隠るる者なり。世に易えず、名を成さず、世を遯るれども、悶うることなく、是とせらざれども、悶うることなし。楽しめば則ち之を行ない、憂うれば之を違る。確乎として其れ抜く可からざるは、潜龍なり。\n\n/1&\n\n&2&\n##### 二爻：見龍田に在り、大人を見るに利ろし。\n\n##### 象伝：見龍田に在るは、徳の施し普きなり。\n\n##### 文言：九二に曰く、「見龍田に在り、大人を見るに利ろし」とは、何の謂うぞや。子曰く、龍徳ありて正中なる者なり。庸言を之れ信にし、庸行を之れ謹み、邪を閑ぎて其の誠を存し、世に善くすれども伐らず、徳博くして化す。易に曰く、「見龍田に在り、大人を見るに利ろし」とは、君徳なるなり。\n\n/2&\n\n&3&\n##### 三爻：君子終日乾乾。夕べに惕若たれば、厲うけれど咎なし。\n\n##### 象伝：終日乾乾は、反復の道なり。\n\n##### 文言：九三に曰く、「君子終日乾乾し、夕べに惕若たり、厲うけれども咎なし」とは、何の謂いぞや。子曰く、君子は徳に進み業を修む。忠信は徳に進む所以なり。辞を修め其の誠を立つるは、業に居る所以なり。至るを知りて之に至るは、與に幾を言う可きなり。終るを知りて之を終るは、與に義を存す可きなり。是の故に上位に居れども驕らず、下位に在れども憂えず。故に乾乾として其の時に因りて惕るれば、危うしと雖も咎なきなり。\n\n/3&\n\n&4&\n##### 四爻：或いは躍りて淵にあり。咎なし。\n\n##### 象伝：或いは躍りて淵にあるは、進みて咎なきなり。\n\n##### 文言：九四に曰く。あるいは躍りて淵に在り、咎なしとは、何の謂いぞや。子曰く、上下すること常なきも、邪をなすにはあらざるなり。進退すること恒なきも、群を離るるにはあらざるなり。君子徳に進み業を修むるは、時に及ばんことを欲するなり。故に咎なきなり。\n\n/4&\n\n&5&\n##### 五爻：飛龍天に在り。大人を見るに利ろし。\n\n##### 象伝：飛龍天に在るは、大人の造せるなり。\n\n##### 文言：九五に曰く、「飛龍天に在り、大人を見るに利ろし」とは、何の謂いぞや。子曰く、同声相応じ、同気相求む。水は湿えるに流れ、火は燥けるに就く。雲は龍に従い、風は虎に従う。聖人作りて万物観る。天に本づくものは上に親しみ、地に本づくものは下に親しむ。則ち各々其の類に従うなり。\n\n/5&\n\n&6&\n##### 上爻：亢龍悔い有り。\n\n##### 象伝：亢龍悔い有るは、盈ること久しかるべからざるなり。\n\n##### 文言：上九に曰く、「亢龍悔い有り」とは、何の謂いぞや。子曰く、貴くして位なく、高くして民なく、賢人下位に在りて輔くる无し。是を以て而ち悔い有るなり。\n\n/6&\n\n&7&\n##### 用九：羣龍を見るに首无し。吉。\n\n##### 象伝：用九、天徳は首為る可からざるなり。\n\n/7&\n\n#### 文言\n\n文言に曰く、元は善の長なり。亨は嘉の会なり。利は義の和なり。貞は事の幹なり。\n君子は仁を体すれば、以て人に長たるに足り、会を嘉すれば、以て礼に合するに足り、物を利すれば以て義を和するに足り、貞固なれば、以て事に幹たるに足る。\n君子は、この四徳を行なう者なり。故に曰く、乾は元亨利貞と。\n\n潜龍用うる勿れとは、下なればなり。見龍田に在りとは、時舎つるなり。終日乾乾すとは、事を行なうなり。或いは躍りて淵に在るとは、自ら試みるなり。飛龍天に在りとは、上にして治むるなり。亢龍悔い有りとは、窮まるの災いあるなり。乾元の用九は、天下治まるなり。\n\n潜龍用うる勿れとは、陽気潜み藏るるなり。見龍田に在りとは、天下文明なり。終日乾乾すとは、時と偕に行なうなり。或いは躍りて淵に在りとは、乾道乃ち革まればり。飛龍天に在りとは、乃ち天徳に位するなり。亢龍悔有りとは、時と偕に極まるなり。乾元の用九は、乃ち天の則を見るなり。\n\n乾元は、始まりて亨る者なり。利貞は、性情なり。乾始は能く美利を以てし、天下を利して利する所を言わず。大なるかな。\n大いなる哉乾や。剛健中正、純粋精なり。六爻発揮して、旁く情に通ずるなり。時に六龍に乗りて、以て天を御するなり。雲行き雨施して、天下平らかなり。\n\n君子は成徳を以て行ないを為す。日に之を行ないに見わす可きなり。潜の言為るや、隠れて未だ見われず、行ないて未だ成らざるなり。是を以て君子は用いざるなり。\n\n君子は学以て之を聚め、問以て之を辯じ、寛以て之に居り、仁以て之を行なう。易に曰く、「見龍田に在り。大人を見るに利ろし」とは、君徳あるなり。\n\n九三は、重剛にして中ならず。上は天に在らず。下は田に在らず。故に乾乾として其の時に因りて惕るる。危うしと雖も咎无きなり。\n\n九四は重剛にして中ならず。上は天に在らず。下は田に在らず。中は人に在らず。故に之を或いはとす。之を或いはとするは、之を疑うなり。故に咎无きなり。\n\n夫れ大人たる者は、天地と其の徳を合し、日月と其の明を合し、四時と其の序を合し、鬼神と其の吉凶を合す。天に先だちて天違わず、天に後れて天の時を奉ず。天すら且つ違わず。而るを況んや人に於いてや、況んや鬼神に於いてや。\n\n亢の言たるや、進むを知りて退くを知らず。存するを知りて亡ぶるを知らず。得るを知りて喪うを知らず。其れ唯聖人か。進退存亡を知りて其の正を失わざる者は、其れ唯聖人か。"},"000000":{"text.tab1":"#### 図\n![ローカル画像 表示 (韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/002.jpg)\n\nレンダリング確認テスト\n\n{坤|こん}は、{元|げん}にして{亨|こう}す、{牝馬|ひんば}の{貞|てい}に{利|よろ}し。\n\n (**)\n**{坤|こん}は、{元|げん}にして{亨|こう}す、{牝馬|ひんば}の{貞|てい}に{利|よろ}し。**\n\n（####）\n#### {坤|こん}は、{元|げん}にして{亨|こう}す、{牝馬|ひんば}の{貞|てい}に{利|よろ}し。\n\n（#####）\n##### {坤|こん}は、{元|げん}にして{亨|こう}す、{牝馬|ひんば}の{貞|てい}に{利|よろ}し。\n\n（•）\n• 一、{坤|こん}は、\n• 1. {元|げん}にして{亨|こう}す、{牝馬|ひんば}の{貞|てい}に{利|よろ}し。\n\n（>）\n> {坤|こん}は、{元|げん}にして{亨|こう}す、{牝馬|ひんば}の{貞|てい}に{利|よろ}し。\n\n連結文字\n[https://example.com](https://example.com)\n\n![オンライン画像 表示 https://picsum.photos/1200/300](https://picsum.photos/1200/300)","text.tab2":"#### 雑\n\n**雑卦伝：坤は柔なり**\n\n#### 序\n**序卦伝：天地有りて、然る後に万物生ず。**","text.tab3":"&0&\n**坤は元いに亨る。牝馬の貞に利ろし。君子往く攸あり。先んずれば迷い、後れれば主を得。西南朋を得るに利ろし、東北朋を喪うも、貞に安んずれば吉。**\n**象伝：地勢は坤。君子以て徳を厚くし物を載す。**\n\n/0&\n#### 彖\n\n**彖伝：大いなるかな坤元、万物資りて生ず。乃ち順いて天に承く。坤は厚くして物を載せ、徳は无彊に合す。含弘光大にして、品物ことごとく亨る。牝馬は地の類、地を行くこと疆りなし。柔順貞に利ろしは、君子の行なう攸なり。先んずれば迷いて道を失い、後るれば順いて常を得。西南に朋を得るは、乃ち類と行けばなり。東北に朋を喪うは、乃ち終には慶び有るなり。貞に安んずるの吉は、地の疆りなきに応ずる。**\n\n#### 爻\n\n&1&\n##### 初爻：霜を履みて、堅氷に至る。\n\n##### 象伝：霜を履みて堅氷に至るは、陰始めて凝るなり。其の道を馴致して、堅氷に至るなり。\n\n/1&\n\n&2&\n##### 二爻：直方大。習わずして利ろしからざるなし。\n\n##### 象伝：六二の動は、直にして以て方なり。習わずして利ろしからざる无きは、地道光いなればなり。\n\n/2&\n\n&3&\n##### 三爻：章を含む貞にすべし。或いは王事に従うも、成すこと无くして終わり有り。\n\n##### 象伝：章を含む貞にすべしとは、時を以て発するなり。或いは王事に従うは、知光大なり。\n\n/3&\n\n&4&\n##### 四爻：嚢を括る。咎なし、誉れなし。\n\n##### 象伝：嚢を括る咎なしとは、慎めば害あらざるなり。\n\n/4&\n\n&5&\n##### 五爻：黄裳元吉。\n\n##### 象伝：黄裳元吉は、文中に在るなり。\n\n/5&\n\n&6&\n##### 上爻：龍野に戦う。其の血玄黄。\n\n##### 象伝：龍野に戦うとは、其の道窮まればなり。\n\n/6&\n\n&7&\n##### 用六：永く貞しきに利ろし。\n\n##### 象伝：用六の永貞は、大を以て終わるなり。\n\n/7&\n\n#### 文言\n\n文言に曰く、坤は至柔にして動くや剛なり。至静にして徳方なり。後るれば主を得て常有り。萬物を含みて化光いなり。坤道は其れ順なるか。天を承けて時に行なう。\n\n善を積むの家には必ず余慶あり。不善を積むの家に、余殃あり。臣其の君を弑し、子其の父を弑するは、一朝一夕の故に非ず。其の由って来たるところの者漸なり。之を辨ずるに早く辨ぜざるに由るなり。易に曰く、「霜を履みて堅氷に至る」とは、蓋し順を言うなり。\n\n直は其れ正なり、方は其れ義なり。君子は敬以て内を直くし、義以て外を方にす。敬義立てば徳孤ならず。「直方大なり、習わざれば利ろしからざるなし」とは、則ち其の行なう所を疑わざるなり。\n\n陰は美ありと雖も、之を含みて以て王事に従い、敢えて成さざるなり。地の道なり。妻の道なり。臣の道なり。地の道は成すこと无くして、代わりて終わること有るなり。\n\n天地変化して、草木蕃し、天地閉りて、賢人隠る。易に曰く、「嚢を括る。咎も无く、誉れも无し」とは、蓋し謹むことを言うなり。\n\n君子は黄中にして理に通じ、位を正しくして体に居る。美其の中に在りて、四支に暢び、事業に発す。美の至りなり。\n\n陰、陽に疑わしければ必ず戦う。其の陽に嫌わしきがためなり。故に龍と称す。猶、未だ其の類を離れざるなり。故に血と称す。夫れ玄黄は、天地の雑りなり。天は玄にして地は黄なり。"},"100010":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/003.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：屯は見われて其の居を失わず**\n\n#### 序\n**序卦伝：天地の間に盈つる者は、唯万物なり。故に之を受くるに屯を以てす。**","text.tab3":"&0&\n**屯は、元いに亨る、貞しきに利ろし、往く攸あるに用うる勿れ。侯を建つるに利ろし。**\n**象伝：雲雷は屯。君子以て経綸す。**\n\n/0&\n#### 彖\n\n**彖伝：屯は剛柔始めて交りて難み生じ、険中に動く。大いに亨りて貞なるは、雷雨の動き満盈。天造草眛、侯を建つるに宜しく、而して寧からず。**\n\n#### 爻\n\n&1&\n##### 初爻：磐桓たり。貞に居るに利ろし。侯を建つるに利ろし。\n\n##### 象伝：磐桓たりと雖も、志正を行なうなり。貴きを以て賤しきに下る。大いに民を得るなり。\n\n/1&\n\n&2&\n##### 二爻：屯如、邅如、馬に乗りて班如。寇するに匪ず。婚媾せんとす。女子貞にして字せず。十年にして乃ち字す。\n\n##### 象伝：六二の難は、剛に乗るなり。十年にして乃ち字するとは、常に反るなり。\n\n/2&\n\n&3&\n##### 三爻：鹿に即きて虞なし。唯林中に入る。君子幾をみて舎るに如かず。往けば吝。\n\n##### 象伝：鹿に即きて虞なきとは、禽に従うを以てなり。君子これを舎る。往けば吝とは、窮まればなり。\n\n/3&\n\n&4&\n##### 四爻：馬に乗りて班如。婚媾を求む。往けば吉。利ろしからざるなし。\n\n##### 象伝：求めて往くは、明らかなるなり。\n\n/4&\n\n&5&\n##### 五爻：其の膏を屯す。小貞なれば吉。大貞なれば凶。\n\n##### 象伝：其の膏を屯すとは、施すこと未だ光ならざるなり。\n\n/5&\n\n&6&\n##### 上爻：馬に乗りて班如。泣血漣如たり。\n\n##### 象伝：泣血漣如たるは、何ぞ長かるべけんや。\n\n/6&"},"010001":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/004.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：蒙は雑にして著る**\n\n#### 序\n**序卦伝：屯とは、盈つるなり。屯とは、物の始めて生ずるなり。物生ずれば必ず蒙なり。故に之を受くるに蒙を以てす。**","text.tab3":"&0&\n**蒙は、亨る。我れ童蒙を求むるにあらず。童蒙我を求む。初筮は告ぐ。再三すれば瀆る。瀆るれば則ち告げず。貞に利ろし。**\n**象伝：山下に出づる泉は蒙。君子以て行ないを果たし德を育う。**\n\n/0&\n#### 彖\n\n**彖伝：蒙は山下に険あり。険にして止まるは蒙。蒙は亨るとは、亨るを以て行ない、時・中すればなり。我より童蒙を求むるにあらず、童蒙が我を求むとは、志応ずるなり。初筮は告ぐとは、剛中を以てなり。再三すれば瀆る、瀆るれば則ち告げずとは、蒙を瀆せばなり。蒙以て正を養うは、聖の功なり。**\n\n#### 爻\n\n&1&\n##### 初爻：蒙を發く。もって人を刑するに利ろし。もって桎梏を説く。以て往けば吝。\n\n##### 象伝：もって人を刑するに利ろしきとは、以て法を正すなり。\n\n/1&\n\n&2&\n##### 二爻：蒙を包ぬ吉。婦を納る吉。子家を克くす。\n\n##### 象伝：子家を克くするは、剛柔接ればなり。\n\n/2&\n\n&3&\n##### 三爻：女を取るに用うる勿れ。金夫を見て躬を有たず。利ろしき攸なし。\n\n##### 象伝：女を取るに用うる勿れとは、行ない順ならざるなり。\n\n/3&\n\n&4&\n##### 四爻：蒙に困しむ。吝。\n\n##### 象伝：蒙に困しむ吝は、独り実に遠ざかるなり。\n\n/4&\n\n&5&\n##### 五爻：童蒙、吉なり。\n\n##### 象伝：童蒙の吉は、順にして以て巽うなり。\n\n/5&\n\n&6&\n##### 上爻：蒙を撃つ。寇を為すに利ろしからず。寇を禦ぐに利ろし。\n\n##### 象伝：もって寇を禦ぐに利ろしきは、上下順しむなり。\n\n/6&"},"111010":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/005.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：需は進まざるなり**\n\n#### 序\n**序卦伝：蒙とは、蒙きなり。物の穉きなり。物穉ければ養わざる可からざるなり。故に之を受くるに需を以てす。**","text.tab3":"&0&\n**需は孚あり。光いに亨る。貞吉。大川を渉るに利ろし。**\n**象伝：雲天に上るは需。君子以て飲食宴楽す。**\n\n/0&\n#### 彖\n\n**彖伝：需は須つなり。険前に在るなり。剛健にして陥らず。其の義困窮せず。需は孚あり。光いに亨る。貞吉とは、天位に位して、正中なればなり。大川を渉るに利ろしきは、往きて功有るなり。**\n\n#### 爻\n\n&1&\n##### 初爻：郊に需つ。恒を用うるに利ろし。咎なし。\n\n##### 象伝：郊に需つは、難を犯して行かざるなり。恒を用うるに利ろし、咎なしとは、未だ常を失わざればなり。\n\n/1&\n\n&2&\n##### 二爻：沙に需つ。小しく言有れど終に吉。\n\n##### 象伝：沙に需つは、衍かにして中に在るなり。小しく言有りと雖も、吉を以て終るなり。\n\n/2&\n\n&3&\n##### 三爻：泥に需つ。寇の至るを致す。\n\n##### 象伝：泥に需つは、災い外に在るなり。我より寇を致す、敬慎めば敗れざるなり。\n\n/3&\n\n&4&\n##### 四爻：血に需つ。穴より出づ。\n\n##### 象伝：血に需つは、順にして以て聴くなり。\n\n/4&\n\n&5&\n##### 五爻：酒食に需つ。貞吉。\n\n##### 象伝：酒食貞吉は、中正以てなり。\n\n/5&\n\n&6&\n##### 上爻：穴に入る。速かざるの客三人来るあり。之を敬すれば終に吉。\n\n##### 象伝：速かざるの客来る。之を敬すれば終は吉なるは、位に当たらずと雖も未だ大いに失わざるなり。\n\n/6&"},"010111":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/006.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：訟は親しまざるなり**\n\n#### 序\n**序卦伝：需とは、飲食の道なり。飲食には必ず訟有り。故に之を受くるに訟を以てす。**","text.tab3":"&0&\n**訟は孚有りて窒がる。惕れて中すれば吉。終われば凶。大人を見るに利ろし。大川を渉るに利ろしからず。**\n**象伝：天と水と違いに行くは訟なり。君子以て事を作すに始めを謀る。**\n\n/0&\n#### 彖\n\n**彖伝：訟は、上剛にして下険なり。険にして健なるは訟。訟は孚有りて窒がる、惕れて中すれば吉とは、剛来りて中を得るなり。終れば凶とは、訟を成すべからざるなり。大人を見るに利ろしとは、中正を尚ぶなり。大川を渉るに利ろしからずとは、淵に入ればなり。**\n\n#### 爻\n\n&1&\n##### 初爻：事する所を永くせず。小しく言あるも、終に吉。\n\n##### 象伝：事するところを永くせざりは、訟は長くする可らざるなり。小しく言あるち雖も、其の辯明らかなり。\n\n/1&\n\n&2&\n##### 二爻：訟を克くせず、歸りて逋る。其の邑人三百戸、眚いなし。\n\n##### 象伝：訟を克くせず、歸りて逋るとは、竄るるなり。下より上を訟う。患いに至ることを掇るなり。\n\n/2&\n\n&3&\n##### 三爻：舊徳に食む。貞くすれば厲うきも終に吉。或るいは王事に従うも、成すこと无し。\n\n##### 象伝：舊徳に食むとは、上に従いて吉なり。\n\n/3&\n\n&4&\n##### 四爻：訟を克くせず、復りて命に卽き、渝て貞に安んずれば吉。\n\n##### 象伝：復りて命に卽き、渝て貞に安んずるは、失わざるなり。\n\n/4&\n\n&5&\n##### 五爻：訟、元吉。\n\n##### 象伝：訟、元吉は、中正を以てなり。\n\n/5&\n\n&6&\n##### 上爻：或るいは之に鞶帯を錫う。終朝三たび之を褫く。\n\n##### 象伝：訟をもって服を受く。亦、敬するに足らざるなり。\n\n/6&"},"010000":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/007.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：師は憂う**\n\n#### 序\n**序卦伝：訟えには必ず衆の起る有り。故に之を受くるに師を以てす。**","text.tab3":"&0&\n**師は貞し。丈人なれば吉。咎なし。**\n**象伝：地中に水あるは師。君子以て民を容れ衆を畜う。**\n\n/0&\n#### 彖\n\n**彖伝：師は衆なり。貞は正なり。能く衆を以いて正しければ、以て王たるべし。剛中にして応ず。険を行ないて而して順なり。これを以て天下を毒め、民之に従う。吉にしてまた何の咎かあらん。**\n\n#### 爻\n\n&1&\n##### 初爻：師は出づるに律を以てす。否らざれば臧きも凶。\n\n##### 象伝：師は出づるに律を以てすとは、律を失えば凶なり。\n\n/1&\n\n&2&\n##### 二爻：師、中に在り吉。咎なし。王三たび命を錫う。\n\n##### 象伝：師、中に在り吉は、天寵を承くればなり。王三たび命を錫うは、萬邦を懐んずればなり。\n\n/2&\n\n&3&\n##### 三爻：師、或いは尸を輿う。凶。\n\n##### 象伝：師、或いは尸を輿うは、大いに无きなり。\n\n/3&\n\n&4&\n##### 四爻：師、左次す。咎なし。\n\n##### 象伝：左次して咎なきは、未だ常を失わざるなり。\n\n/4&\n\n&5&\n##### 五爻：田して禽あり。執言に利ろし。咎なし。長子師を帥ゆ。弟子尸を輿う。貞しけれども凶。\n\n##### 象伝：長子師を帥ゆるは、中行を以てなり。弟子尸を輿うとは、使うこと当たらざろなり。\n\n/5&\n\n&6&\n##### 上爻：大君命有り。国を開き家を承く。小人用いる勿れ。\n\n##### 象伝：大君命有るは、以て功を正すなり。小人は用いる勿れとは、必ず邦を乱せばなり。\n\n/6&"},"000010":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/008.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：比は楽しみて**\n\n#### 序\n**序卦伝：師とは、衆なり。衆なれば必ず比む所有り。故に之を受くるに比を以てす。**","text.tab3":"&0&\n**比は吉。筮に原ね、元永貞にして咎なし。寧からざるもの方に来る。後夫は凶。**\n**象伝：地上に水有るは比。先王以て万国を建て諸侯に親しむ。**\n\n/0&\n#### 彖\n\n**彖伝：比は吉なり。比は輔けるなり。下順従するなり。筮に原ね、元永貞にして咎なしとは、剛中を以てなり。寧からざるもの方に来るとは、上下応ずるなり。後夫は凶とは、其の道窮まるなり。**\n\n#### 爻\n\n&1&\n##### 初爻：孚有りて之れに比す。咎なし。孚有りて缶に盈つれば、終いに来たりて他の吉あり。\n\n##### 象伝：比の初六は、他の吉あるなり。\n\n/1&\n\n&2&\n##### 二爻：之に比するに内よりす。貞吉。\n\n##### 象伝：之に比するに内よりすとは、自ら失わざるなり。\n\n/2&\n\n&3&\n##### 三爻：之に比するに人に匪ず。\n\n##### 象伝：之に比するに人に匪ずは、亦傷ましからずや。\n\n/3&\n\n&4&\n##### 四爻：外之に比す。貞吉。\n\n##### 象伝：外賢に比す。以て上に従うなり。\n\n/4&\n\n&5&\n##### 五爻：比を顕かにす。王、三駆を用いて前禽を失う。邑人誡めず。吉。\n\n##### 象伝：比を顕かにすの吉は、位正中なればなり。逆を舎て順を取るは、前禽を失うなり。邑人誡めざるは、上の使うこと中なればなり。\n\n/5&\n\n&6&\n##### 上爻：之に比するに首なし。凶。\n\n##### 象伝：之に比するに首なきは、終わる所无きなり。\n\n/6&"},"111011":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/009.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：小畜は寡きなり**\n\n#### 序\n**序卦伝：比は、比むなり。比めば必ず畜うる所有り。故に之を受くるに小畜を以てす。**","text.tab3":"&0&\n**小畜は亨る、密雲雨ふらず、我が西郊よりす。**\n**象伝：風天上を行くは小畜。君子以て文徳を懿す。**\n\n/0&\n#### 彖\n\n**彖伝：小畜は、柔位を得て而して上下これに応ずるを、小畜という。健にして巽い、剛中にして志行なわる。すなわち亨る。密雲雨ふらざるは、尚び往くなり。我が西郊よりすとは、施し未だ行なわれざるなり。**\n\n#### 爻\n\n&1&\n##### 初爻：復るに道よりす。何ぞ其れ咎あらん。吉。\n\n##### 象伝：復るに道よりするは、其の義吉なるなり。\n\n/1&\n\n&2&\n##### 二爻：牽かれて復る吉。\n\n##### 象伝：牽かれて復る中に在り。亦自ら失わざるなり。\n\n/2&\n\n&3&\n##### 三爻：輿、輻を説く。夫妻反目す。\n\n##### 象伝：夫妻反目すとは、室を正す能わざるなり。\n\n/3&\n\n&4&\n##### 四爻：孚有り。血去り惕れ出ず。咎なし。\n\n##### 象伝：孚有り惕れ出ずるは、上志を合わすればなり。\n\n/4&\n\n&5&\n##### 五爻：孚有り攣如。富、其の隣りを以てす。\n\n##### 象伝：孚ありて攣如とは、独り富まざるなり。\n\n/5&\n\n&6&\n##### 上爻：既に雨ふり既に處まる。徳を尚びて載す。婦貞けれども厲うし。月望に幾し。君子征けば凶。\n\n##### 象伝：既に雨ふり既に處まるは、徳を積んで載すなり。君子征けば凶とは、疑う所有るなり。\n\n/6&"},"110111":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/010.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：履は處らざるなり**\n\n#### 序\n**序卦伝：物畜えられて然る後、礼有り。故に之を受くるに履を以てす。**","text.tab3":"&0&\n**虎の尾を履む。人を咥わず。亨る。**\n**象伝：上天下澤は履。君子以て上下を辨じ、民の志を定む。**\n\n/0&\n#### 彖\n\n**彖伝：履は柔・剛を履むなり。説びて乾に応ず。是を以て虎の尾を履むも人を咥わず、亨る。剛にして中正、帝位を履みて疚しからず、光明なり。**\n\n#### 爻\n\n&1&\n##### 初爻：素履。往きて咎なし。\n\n##### 象伝：素履の往くは、独り願いを行なうなり。\n\n/1&\n\n&2&\n##### 二爻：道を履む坦坦たり。幽人貞吉。\n\n##### 象伝：幽人貞吉とは、中自ら乱れざるなり。\n\n/2&\n\n&3&\n##### 三爻：眇能く視るとし、跛能く履むとす。虎の尾を履めば、人を咥う、凶。武人大君たらんとす。\n\n##### 象伝：眇能く視るも、以て明有るに足らざるなり。跛能く履むも、以て與に行くに足らざるなり。人を咥う凶は、位当らざればなり。武人大君たらんとするは、志剛なるなり。\n\n/3&\n\n&4&\n##### 四爻：虎の尾を履む。愬愬たれば終に吉。\n\n##### 象伝：愬愬たれば終に吉は、志行なわるるなり。\n\n/4&\n\n&5&\n##### 五爻：履むことを夬む。貞けれども厲うし。\n\n##### 象伝：履むことを夬む。貞けれども厲うしとは、位正当なればなり。\n\n/5&\n\n&6&\n##### 上爻：履むことを視て祥を考う。其れ旋れば元吉。\n\n##### 象伝：元吉上に在り。大いに慶びあるなり。\n\n/6&"},"111000":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/011.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：泰はその類に反する**\n\n#### 序\n**序卦伝：履とは、礼なり。履みて泰らかなり。然る後安し。故に之を受くるに泰を以てす。**","text.tab3":"&0&\n**泰は、小往き大来る。吉にして亨る。**\n**象伝：天地交わるは泰。后以て天地の道を栽成し、天地の宜を輔相し、以て民を左右す。**\n\n/0&\n#### 彖\n\n**彖伝：泰は小往き大来る、吉にして亨るとは、則ち是天地交わりて万物通ずるなり。上下交わりて其の志同じきなり。内陽にして外陰、内健にして外順、内君子にして外小人。君子の道長じ、小人の道消するなり。**\n\n#### 爻\n\n&1&\n##### 初爻：茅を抜くに茹たり。其の彙を以てす。征けば吉。\n\n##### 象伝：茅を抜く征けば吉とは、志外に在るなり。\n\n/1&\n\n&2&\n##### 二爻：荒を包ぬ。馮河を用う。遐遺せず、朋亡ぶれば中行に尚うことを得。\n\n##### 象伝：荒を包ぬ中行に尚うことを得るは、光大なるを以てなり。\n\n/2&\n\n&3&\n##### 三爻：平にして陂かざる无く、往きて復らざる无し。艱貞なれば咎无し。恤うる勿れ、其れ孚ならば、食に于て福あり。\n\n##### 象伝：往きて復らざる无きは、天地際わればなり。\n\n/3&\n\n&4&\n##### 四爻：翩翩富まず。其の隣りを以てす。戒めずして以て孚あり。\n\n##### 象伝：翩翩富まざるは、皆実を失うなり。戒めずして以て孚あるは、中心願うなり。\n\n/4&\n\n&5&\n##### 五爻：帝乙妹を歸がしむ。以て祉あり元吉。\n\n##### 象伝：以て祉あり元吉とは、中以て願いを行なうなり。\n\n/5&\n\n&6&\n##### 上爻：城隍に復る。師を用うる勿れ。邑より命を告ぐ。貞なれば吝。\n\n##### 象伝：城隍に復るは、其の命乱れるなり。\n\n/6&"},"000111":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/012.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：否はその類に反する**\n\n#### 序\n**序卦伝：泰とは、通ずるなり。物以て通ずるに終る可からず。故に之を受くるに否を以てす。**","text.tab3":"&0&\n**否は之れ人に匪ず。君子の貞に利ろしからず。大往き小来たる。**\n**象伝：天地交わらざるは否。君子以て徳を倹ましくして難を辟く。栄するに禄を以てすべからず。**\n\n/0&\n#### 彖\n\n**彖伝：否は之人に匪ず、君子の貞に利ろしからず、大往き小来るとは、則ち是れ天地交わらずして万物通ぜざるなり。上下交わらずして天下に邦なきなり。内陰にして外陽、内柔にして外剛。内小人にして外君子。小人の道長じ、君子の道消するなり。**\n\n#### 爻\n\n&1&\n##### 初爻：茅を抜くに茹たり。其の彙と以す。貞吉にして亨る。\n\n##### 象伝：茅を抜く貞吉とは、志君に在るなり。\n\n/1&\n\n&2&\n##### 二爻：包承す。小人は吉。大人は否にして亨る。\n\n##### 象伝：大人は否にして亨るとは、群を乱れざるなり。\n\n/2&\n\n&3&\n##### 三爻：羞を包む。\n\n##### 象伝：羞を包むとは、位当らざればなり。\n\n/3&\n\n&4&\n##### 四爻：命有り咎无し。疇、祉いに離く。\n\n##### 象伝：命有り咎无きは、志行なわるるなり。\n\n/4&\n\n&5&\n##### 五爻：否を休す。大人は吉。其れ亡びん其れ亡びんとす。苞桑に繋ぐ。\n\n##### 象伝：大人の吉は、位正当なればなり。\n\n/5&\n\n&6&\n##### 上爻：否を傾く。先には否がり後には喜ぶ。\n\n##### 象伝：否終れば則ち傾く、何ぞ長かる可けんや。\n\n/6&"},"101111":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/013.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：同人は親しむなり**\n\n#### 序\n**序卦伝：物は以て否に終る可からず。故に之を受くるに同人を以てす。**","text.tab3":"&0&\n**同人野に于てす。亨る。大川を渉るに利ろし。君子の貞に利ろし。**\n**象伝：天と火とは同人。君子以て族を類し物を辯ず。**\n\n/0&\n#### 彖\n\n**彖伝：同人は、柔・位を得、中を得て、乾に応ずるを同人という。同人野に于てす、亨る、大川を渉るに利ろし、君子の貞に利ろしとは、乾の行いなり。文明にして以て健、中正にして応ずるは、君子の正なり。ただ君子のみ能く天下の志を通ずるを為す。**\n\n#### 爻\n\n&1&\n##### 初爻：同人門に于てす。咎なし。\n\n##### 象伝：門を出でて人に同じくするは、又誰か咎めん。\n\n/1&\n\n&2&\n##### 二爻：同人宗に于てす。吝。\n\n##### 象伝：同人、宗に于てするは、吝道なり。\n\n/2&\n\n&3&\n##### 三爻：戎を莽に伏せ、其の高陵に升る。三歳興らず。\n\n##### 象伝：戎を莽に伏するのは、敵剛なればなり。三歳興らずは、安んぞ行かん。\n\n/3&\n\n&4&\n##### 四爻：其の墉に乗るも、攻むる克わず。吉。\n\n##### 象伝：其の墉に乗るは、義克わざるなり。其の吉は、則ち困しみて則に反るなり。\n\n/4&\n\n&5&\n##### 五爻：同人、先には號咷し、後には笑う。大師克ちて相遇う。\n\n##### 象伝：同人の先は、中直を以てなり。大師相遇うは、相克つを言うなり。\n\n/5&\n\n&6&\n##### 上爻：同人郊に于てす。悔无し。\n\n##### 象伝：同人郊に于てするは、志、未だ得ざるなり。\n\n/6&"},"111101":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/014.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：大有は衆きなり**\n\n#### 序\n**序卦伝：人と同じくする者は、物必ず焉に帰す。故に之を受くるに大有を以てす。**","text.tab3":"&0&\n**大有は元いに亨る。**\n**象伝：火・天上に在るは大有。君子以て悪を遏め、善を揚げて、天の休命に順う。**\n\n/0&\n#### 彖\n\n**彖伝：大有は柔・尊位大中を得、而して上下これに応ずるを、大有という。其の徳剛健にして文明、天に応じて時に行なう。是れを以て元いに亨る。**\n\n#### 爻\n\n&1&\n##### 初爻：害に交わる无し。咎に匪ず。艱めば則ち咎なし。\n\n##### 象伝：大有の初九は、害に交わるなきなり。\n\n/1&\n\n&2&\n##### 二爻：大車以て載す。往く攸あり。咎无し。\n\n##### 象伝：大車もって載するは、中に積みて敗れざるなり。\n\n/2&\n\n&3&\n##### 三爻：公用って天子に享す。小人は克わず。\n\n##### 象伝：公用って天子に享すは、小人は害あり。\n\n/3&\n\n&4&\n##### 四爻：其の彭たるに匪ざれば、咎无し。\n\n##### 象伝：其の彭たるに匪ざれば咎无きは、明辯晢たるなり。\n\n/4&\n\n&5&\n##### 五爻：其の孚、交如、威如たれば、吉。\n\n##### 象伝：厥の孚、交如は、信以て志を發するなり。威如の吉は、易りて備え无きなり。\n\n/5&\n\n&6&\n##### 上爻：天より之を祐く。吉にして利ろしからざるなし。\n\n##### 象伝：大有の上の吉は、天より祐くるなり。\n\n/6&"},"001000":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/015.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：謙は軽くして**\n\n#### 序\n**序卦伝：有つこと大なる者は、以て盈つ可からず。故に之を受くるに謙を以てす。**","text.tab3":"&0&\n**謙は、亨る。君子終り有り。**\n**象伝：地中に山あるは謙。君子以て多きを裒め寡なきを益し、物を稱り施しを平らかにす。**\n\n/0&\n#### 彖\n\n**彖伝：謙は亨る。天道は下済して光明。地道は卑くして上行す。天道は盈つるを虧きて謙に益し、地道は盈つるを変じて謙に流き、鬼神は盈つるを害して謙に福いし、人道は盈つるを悪みて謙を好む。謙は尊くして光り、卑くして踰ゆべからず。君子の終りなり。**\n\n#### 爻\n\n&1&\n##### 初爻：謙謙。君子用て大川を渉る。吉。\n\n##### 象伝：謙謙たるは、君子卑くして以て自ら牧するなり。\n\n/1&\n\n&2&\n##### 二爻：鳴謙。貞吉。\n\n##### 象伝：鳴謙貞吉は、中心得るなり。\n\n/2&\n\n&3&\n##### 三爻：労謙。君子終り有り。吉。\n\n##### 象伝：労謙君子は、萬民服するなり。\n\n/3&\n\n&4&\n##### 四爻：利ろしからざるなし。謙を撝く。\n\n##### 象伝：利ろしからざるなし。謙を撝くは、則に違わざるなり。\n\n/4&\n\n&5&\n##### 五爻：富まず。其の隣を以ゆ。用いて侵伐するに利ろし。利ろしからざるなし。\n\n##### 象伝：用いて侵伐するに利ろしきは、服せざるを征するなり。\n\n/5&\n\n&6&\n##### 上爻：鳴謙。用いて師を行り邑国を征するに利ろし。\n\n##### 象伝：鳴謙は、志未だ得ざるなり。用いて師を行り邑国を征すべきなり。\n\n/6&"},"000100":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/016.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：豫は怠るなり**\n\n#### 序\n**序卦伝：有つこと大にして能く謙なれば、必ず予む。故に之を受くるに予を以てす。**","text.tab3":"&0&\n**予は侯を建て師を行るに利ろし。**\n**象伝：雷・地を出でて奮うは予。先王以て楽を作り徳を崇び、殷んに之を上帝に薦め、以て祖考を配す。**\n\n/0&\n#### 彖\n\n**彖伝：予は剛応じて志行なわる。順以て動くは予。予は順にして以て動く。故に天地之の如し。而かるに況んや侯を建て師を行るをや。\n天地順を以て動く、故に日月過らずして四時たがわず。聖人順を以て動く、即ち刑罰清くして民服す。予の時義大いなる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：鳴予。凶。\n\n##### 象伝：初六の鳴予は、志窮まりて凶なり。\n\n/1&\n\n&2&\n##### 二爻：石に介す。日を終えず。貞吉。\n\n##### 象伝：日を終えず、貞吉は、中正を以てなり。\n\n/2&\n\n&3&\n##### 三爻：盱て予しむ。悔ゆること遅ければ悔い有らん。\n\n##### 象伝：盱て予しむ悔いあるは、位当らざるなり。\n\n/3&\n\n&4&\n##### 四爻：由りて予しむ。大いに得るあり。疑う勿れ、朋盍簪る。\n\n##### 象伝：由りて予しむ大いに得るあるは、志大いに行なわるるなり。\n\n/4&\n\n&5&\n##### 五爻：貞疾。恒に死せず。\n\n##### 象伝：六五の貞疾は、剛に乗るなり。恒に死せざるは、中未だ亡びざるなり。\n\n/5&\n\n&6&\n##### 上爻：冥予。成れども渝り有れば咎なし。\n\n##### 象伝：冥予に上に在り。何ぞ長かるべけんや。\n\n/6&"},"100110":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/017.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：随は故なきなり**\n\n#### 序\n**序卦伝：予めば必ず随う有り。故に之を受くるに随を以てす。**","text.tab3":"&0&\n**随は、元いに亨る貞に利ろし。咎なし。**\n**象伝：澤中に雷有るは随。君子以て晦きに嚮い入りて宴息す。**\n\n/0&\n#### 彖\n\n**彖伝：随は、剛来りて而して柔に下る。動きて説ぶは随。大いに亨る貞にして咎なし、而して天下・時に随う。随時の義大なる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：官渝るあり。貞にして吉。門を出でて交われば功あり。\n\n##### 象伝：官渝るあるは、正に従えば吉なり。門を出でて交われば功あるは、失わざるなり。\n\n/1&\n\n&2&\n##### 二爻：小子に係わりて、丈夫を失う。\n\n##### 象伝：小子に係るは、兼・與にせざるなり。\n\n/2&\n\n&3&\n##### 三爻：丈夫に係わりて、小子を失う。隨いて求むるあれば得。貞に居るに利ろし。\n\n##### 象伝：丈夫に係わるは、志下を舎つるなり。\n\n/3&\n\n&4&\n##### 四爻：隨いて獲る有り。貞しけれども凶。孚有り道に在り。以て明らかならば何ぞ咎あらん。\n\n##### 象伝：隨いて獲るあり、その義、凶なり。孚あって道にあるは、明の功なり。\n\n/4&\n\n&5&\n##### 五爻：嘉きに孚あり。吉。\n\n##### 象伝：嘉きに孚あり吉は、位正中なればなり。\n\n/5&\n\n&6&\n##### 上爻：之拘係す。乃ち従いて之を維ぐ。王用て西山に享す。\n\n##### 象伝：之拘係するは、上窮まるなり。\n\n/6&"},"011001":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/018.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：蠱は即ち飭うるなり**\n\n#### 序\n**序卦伝：喜びを以て人に随う者は必ず事有り。故に之を受くるに蠱を以てす。**","text.tab3":"&0&\n**蠱は元いに亨る。大川を渉るに利ろし。甲に先だつこと三日。甲に後るること三日。**\n**象伝：山下に風有るは蠱。君子以て民を振るい徳を育う。**\n\n/0&\n#### 彖\n\n**彖伝：蠱は剛上りて柔下る。巽いて止まるは蠱。蠱は元いに亨りて天下治まるなり。大川を渉るに利ろしとは、往きて事あるなり。甲に先だつこと三日、甲に後るること三日とは、終れば則ち始まり有り、天行なり。**\n\n#### 爻\n\n&1&\n##### 初爻：父の蠱を幹す。子あれば考咎なし。厲けれども終に吉。\n\n##### 象伝：父の蠱を幹するは、意・考に承くるなり。\n\n/1&\n\n&2&\n##### 二爻：母の蠱を幹す。貞にすべからず。\n\n##### 象伝：母の蠱を幹するは、中道を得るなり。\n\n/2&\n\n&3&\n##### 三爻：父の蠱を幹す。小しく悔あるも、大なる咎なし。\n\n##### 象伝：父の蠱を幹するは、終に咎无きなり。\n\n/3&\n\n&4&\n##### 四爻：父の蠱を裕かにす。往けば吝を見る。\n\n##### 象伝：父の蠱を裕かにするは、往きて未だ得ざるなり。\n\n/4&\n\n&5&\n##### 五爻：父の蠱を幹す。用て誉れあり。\n\n##### 象伝：父の蠱を幹し用て誉れあるは、承くるに徳を以てすればなり。\n\n/5&\n\n&6&\n##### 上爻：王侯に事えず。其の事を高尚にす。\n\n##### 象伝：王侯に事えざるは、志則るべきなり。\n\n/6&"},"110000":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/019.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：臨は或いは与え**\n\n#### 序\n**序卦伝：蠱とは、事なり。事有りて、而る後に大なる可し。故に之を受くるに臨を以てす。**","text.tab3":"&0&\n**臨は、元いに亨る貞に利ろし。八月に至りて凶あらん。**\n**象伝：澤上に地あるは臨。君子以て教思すること窮まりなく、民を容保すること疆りなし。**\n\n/0&\n#### 彖\n\n**彖伝：臨は、剛浸みて長ずるなり。説びて順い、剛中にして応ず。大いに亨りて以て正しきは、天の道なり。八月に至りて凶あるとは、消すること久しからざるなり。**\n\n#### 爻\n\n&1&\n##### 初爻：咸じて臨む。貞にして吉。\n\n##### 象伝：咸臨貞吉は、志正しきを行なうなり。\n\n/1&\n\n&2&\n##### 二爻：咸じて臨む。吉。利ろしからざる无し。\n\n##### 象伝：咸じて臨む吉にして利ろしからざるなしとは、未だ命に順わざるなり。\n\n/2&\n\n&3&\n##### 三爻：甘く臨む。利ろしき攸无し。既に之を憂えれば咎なし。\n\n##### 象伝：甘く臨むとは、位当らざるなり。既に之を憂えれば、咎長からざるなり。\n\n/3&\n\n&4&\n##### 四爻：至りて臨む。咎无し。\n\n##### 象伝：至りて臨むの咎无きは、位当ればなり。\n\n/4&\n\n&5&\n##### 五爻：知りて臨む。大君の宜。吉。\n\n##### 象伝：大君の宜は、中を行なうを謂うなり。\n\n/5&\n\n&6&\n##### 上爻：敦く臨む。吉。咎なし。\n\n##### 象伝：敦く臨むの吉は、志内に在るなり。\n\n/6&"},"000011":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/020.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：観は或いは求む**\n\n#### 序\n**序卦伝：臨とは、大なるなり。物大にして然る後に観る可し。故に之を受くるに観を以てす。**","text.tab3":"&0&\n**観は盥いて薦めず。孚ありて顒若たり。**\n**象伝：風地上を行くは観。先王以て方を省み、民を観て教え設く。**\n\n/0&\n#### 彖\n\n**彖伝：大観上にあり、順にして巽、中正以て天下に観す。観は盥いて薦めず、孚ありて顒若たりとは、下観て化するなり。天の神道を観るに、四時たがわず。聖人神道を以て教えを設け、而して天下服す。**\n\n#### 爻\n\n&1&\n##### 初爻：童観。小人は咎なし。君子は吝。\n\n##### 象伝：初六の童観は、小人の道なり。\n\n/1&\n\n&2&\n##### 二爻：闚い観る。女の貞に利ろし。\n\n##### 象伝：闚い観る、女の貞は、亦醜ずべきなり。\n\n/2&\n\n&3&\n##### 三爻：我が生を観て進退す。\n\n##### 象伝：我が生を観て進退するは、未だ道を失わざるなり。\n\n/3&\n\n&4&\n##### 四爻：国の光を観る。用いて王の賓たるに利ろし。\n\n##### 象伝：国の光を観るは、賓を尚ぶなり。\n\n/4&\n\n&5&\n##### 五爻：我が生を観る。君子は咎なし。\n\n##### 象伝：我が生を観るは、民を観るなり。\n\n/5&\n\n&6&\n##### 上爻：其の生を観る。君子は咎なし。\n\n##### 象伝：其の生を観るは、志未だ平らかならざるなり。\n\n/6&"},"100101":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/021.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：噬嗑は食うなり**\n\n#### 序\n**序卦伝：観る可くして、而る後に合う所有り。故に之を受くるに噬嗑を以てす。**","text.tab3":"&0&\n**噬嗑は亨る。獄を用うるに利ろし。**\n**象伝：雷電は噬嗑。先王以て罰を明らかにして法を勅す。**\n\n/0&\n#### 彖\n\n**彖伝：頤中に物あるを噬嗑という。噬み合わせて亨る。剛柔分れ、動にして明、雷電合して章らかなり。柔・中を得て上行す。位当たらずといえども、獄を用うるに利ろしきなり。**\n\n#### 爻\n\n&1&\n##### 初爻：校を履きて趾を滅す。咎なし。\n\n##### 象伝：校を履きて趾を滅するは、行かざるなり。\n\n/1&\n\n&2&\n##### 二爻：膚を噬みて鼻を滅す。咎なし。\n\n##### 象伝：膚を噬みて鼻を滅するは、剛に乗るなり。\n\n/2&\n\n&3&\n##### 三爻：腊肉を噬みて毒に遇う。小しく吝なれども咎なし。\n\n##### 象伝：毒に遇うは、位当らざればなり。\n\n/3&\n\n&4&\n##### 四爻：乾胏を噬み金矢を得。艱貞に利ろし。吉。\n\n##### 象伝：艱貞に利ろしの吉は、未だ光ならざるなり。\n\n/4&\n\n&5&\n##### 五爻：乾肉を噬みて黄金を得。貞しけれども厲うし。咎なし。\n\n##### 象伝：貞しけれども厲うし咎なきは、当を得るなり。\n\n/5&\n\n&6&\n##### 上爻：校を何いて耳を滅す。凶。\n\n##### 象伝：校を何いて耳を滅するは、聡明ならざるなり。\n\n/6&"},"101001":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/022.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：賁は色なきなり**\n\n#### 序\n**序卦伝：嗑とは、合うなり。物もって苟も合いて已む可からず。故に之を受くるに賁を以てす。**","text.tab3":"&0&\n**賁は、亨る。小しく往く攸あるに利ろし。**\n**象伝：山下に火あるは賁。君子以て庶政を明らかにし、敢えて獄を折むるなし。**\n\n/0&\n#### 彖\n\n**彖伝：賁は亨るとは、柔来りて剛を文る。故に亨る。剛分ち上りて柔を文る。故に小しく往く攸あるに利ろしきなり。天文なり。文明以て止まるは人文なり。天文を観て時変を察し、人文を観て以て天下を化成す。**\n\n#### 爻\n\n&1&\n##### 初爻：其の趾を賁る。車を舎て徒す。\n\n##### 象伝：車を舎て徒するは、義乗らざるなり。\n\n/1&\n\n&2&\n##### 二爻：其の須を賁る。\n\n##### 象伝：其の須を賁るは、上と與に興るなり。\n\n/2&\n\n&3&\n##### 三爻：賁如。濡如。永貞にして吉。\n\n##### 象伝：永貞の吉は、終に之を陵ぐ莫きなり。\n\n/3&\n\n&4&\n##### 四爻：賁如。皤如。白馬翰如。寇するに匪ず婚媾せんとす。\n\n##### 象伝：六四は位に当るも疑うなり。寇するに匪ず婚媾せんとするは、終に尤なきなり。\n\n/4&\n\n&5&\n##### 五爻：丘園を賁る。束帛戔戔。吝なれども終に吉。\n\n##### 象伝：六五の吉は、喜び有るなり。\n\n/5&\n\n&6&\n##### 上爻：白く賁る。咎なし。\n\n##### 象伝：白く賁る咎なしは、上志を得るなり。\n\n/6&"},"000001":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/023.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：剥は爛なり**\n\n#### 序\n**序卦伝：賁とは、飾るなり。飾りを致して然る後に亨れば則ち盡く。故に之を受くるに剥を以てす。**","text.tab3":"&0&\n**剥は、往く攸あるに利ろしからず。**\n**象伝：山・地に附くは剥。上以て下を厚くし宅を安んず。**\n\n/0&\n#### 彖\n\n**彖伝：剥は剥ぐなり。柔・剛を変ずるなり。往く攸あるに利ろしからずとは、小人長ずればなり。順にして之に止まるは、象を観るなり。君子は消息盈虚を尚ぶ、天行なればなり。**\n\n#### 爻\n\n&1&\n##### 初爻：牀を剥すに足を以てす。貞を蔑す。凶。\n\n##### 象伝：牀を剥すに足を以てするは、以て下を滅するなり。\n\n/1&\n\n&2&\n##### 二爻：牀を剥すに辨を以てす。貞を蔑す。凶。\n\n##### 象伝：牀を剥すに辨を以てするは、未だ與する有らざるなり。\n\n/2&\n\n&3&\n##### 三爻：之を剥す。咎なし。\n\n##### 象伝：之を剥して咎なきは、上下を失えばなり。\n\n/3&\n\n&4&\n##### 四爻：牀を剥すに膚を以てす。凶。\n\n##### 象伝：牀を剥するに膚を以てするは、災いに切近するなり。\n\n/4&\n\n&5&\n##### 五爻：魚を貫く。宮人の寵を以てす。利ろしからざるなし。\n\n##### 象伝：宮人の寵を以てするは、終に尤なきなり。\n\n/5&\n\n&6&\n##### 上爻：碩果食われず。君子は輿を得、小人は盧を剥す。\n\n##### 象伝：君子の輿を得るは、民の載する所なり。小人盧を剥するは、終に用う可からざるなり。\n\n/6&"},"100000":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/024.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：復は反るなり**\n\n#### 序\n**序卦伝：剥とは、剥ぐなり。物以て剥に尽きて終る可からず。剥すること上に窮まれば下に反る。故に之を受くるに復を以てす。**","text.tab3":"&0&\n**復は亨る。出入疾い无く、朋来るに咎なし。反復の其の道、七日にして来復す。往く攸あるに利ろし。**\n**象伝：雷・地中に在るは復。先王以て至日に関を閉じ、商旅行かず、后は方を省みず。**\n\n/0&\n#### 彖\n\n**彖伝：復は亨るとは、剛反るなり。動きて以て順行す。是を以て出入疾い无く、朋来るに咎なし。\n反復の其の道、七日にして来復するは、天行なり。往く攸あるに利ろしとは、剛長ずるなり。復は其れ天地の心を見るか。**\n\n#### 爻\n\n&1&\n##### 初爻：遠からずして復る。悔いに祇る无し。元吉。\n\n##### 象伝：遠からざるの復は、以て身を修むるなり。\n\n/1&\n\n&2&\n##### 二爻：休く復る。吉。\n\n##### 象伝：休く復るの吉は、以て仁に下るなり。\n\n/2&\n\n&3&\n##### 三爻：頻りに復る。厲うけれども咎なし。\n\n##### 象伝：頻りに復るの厲うきは、義咎なきなり。\n\n/3&\n\n&4&\n##### 四爻：中行獨り復る。\n\n##### 象伝：中行獨り復るは、道に従うを以てなり。\n\n/4&\n\n&5&\n##### 五爻：復るに敦し。悔いなし。\n\n##### 象伝：復るに敦く悔いなきは、中を以て自らを考すなり。\n\n/5&\n\n&6&\n##### 上爻：復るに迷う。凶。災眚あり。用いて師を行れば終に大敗あり。其の國君を以てするも凶。十年に至るも征する克わず。\n\n##### 象伝：復るに迷うの凶は、君の道に反すればなり。\n\n/6&"},"100111":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/025.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：无妄は災いなり**\n\n#### 序\n**序卦伝：復れば則ち妄ならず。故に之を受くるに无妄を以てす。**","text.tab3":"&0&\n**无妄は、元いに亨りて貞に利ろし。其の正に匪ざれば眚いあり。往く攸あるに利ろしからず。**\n**象伝：天下に雷行くは、物みな无妄。先王以て茂んに時に対して万物を育う。**\n\n/0&\n#### 彖\n\n**彖伝：无妄は剛外より来りて内に主と為る。動にして健。剛中にして応ず。大いに亨りて以て正しきは、天命なり。其れ正にあらざれば眚いあり。往く攸あるに利ろしからずとは、无妄の往くは何くに之かん。天命祐けず、行かんや。**\n\n#### 爻\n\n&1&\n##### 初爻：无妄にして往けば吉。\n\n##### 象伝：无妄の往くは、志を得るなり。\n\n/1&\n\n&2&\n##### 二爻：穫るに耕さず。菑つくるに畬せず、則ち往く攸あるに利ろし。\n\n##### 象伝：穫るに耕さずとは、未だ富まざるなり。\n\n/2&\n\n&3&\n##### 三爻：无妄の災い。或いは牛を繋ぐ、行人の得るは、邑人の災い。\n\n##### 象伝：行人牛を得るは、邑人の災いなり。\n\n/3&\n\n&4&\n##### 四爻：貞にすべし。咎なし。\n\n##### 象伝：貞にすべし咎なしとは、固く之を有するなり。\n\n/4&\n\n&5&\n##### 五爻：无妄の疾い、薬なくして喜びあり。\n\n##### 象伝：无妄の薬、試る可からざるなり。\n\n/5&\n\n&6&\n##### 上爻：无妄行けば眚いあり。利ろしき攸なし。\n\n##### 象伝：无妄の行くは、窮まるの災いなり。\n\n/6&"},"111001":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/026.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：大畜は時なり**\n\n#### 序\n**序卦伝：无妄を有ちて、然る後に畜う可し。故に之を受くるに大畜を以てす。**","text.tab3":"&0&\n**大畜は、貞に利ろし。家食せずして吉。大川を渉るに利ろし。**\n**象伝：天・山中に在るは大畜。君子以て多く前言往行を識りて、以て其の徳を畜う。**\n\n/0&\n#### 彖\n\n**彖伝：大畜は剛健篤実にして輝光あり。日に其の徳を新たにす。剛上りて賢を尚び、能く健を止むるは、大正なり。家食せずして吉とは、賢を養えばなり。大川を渉るに利ろしとは、天に応ずればなり。**\n\n#### 爻\n\n&1&\n##### 初爻：厲うきあり。已むに利ろし。\n\n##### 象伝：厲うき有り已むに利ろしとは、災いを犯さざるなり。\n\n/1&\n\n&2&\n##### 二爻：輿・輹を説く。\n\n##### 象伝：輿・輹を説くは、中にして尤なきなり。\n\n/2&\n\n&3&\n##### 三爻：良馬逐う。艱貞に利ろし。日に輿衛を閑う。往く攸あるに利ろし。\n\n##### 象伝：往く攸あるに利ろしきは、上志を合すなり。\n\n/3&\n\n&4&\n##### 四爻：童牛の牿。元吉。\n\n##### 象伝：六四の元吉は、喜びあるなり。\n\n/4&\n\n&5&\n##### 五爻：豶豕の牙。吉。\n\n##### 象伝：六五の吉は、慶びあるなり。\n\n/5&\n\n&6&\n##### 上爻：何天の衢。亨る。\n\n##### 象伝：何天の衢、道大いに行なわるるなり。\n\n/6&"},"100001":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/027.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：頤は養うこと正しきなり**\n\n#### 序\n**序卦伝：物は畜えられて、然る後に養う可し。故に之を受くるに頤を以てす。**","text.tab3":"&0&\n**頤は貞しければ吉。頤を観て自ら口実を求む。**\n**象伝：山下に雷あるは頤。君子以て言語を慎み、飲食を節す。**\n\n/0&\n#### 彖\n\n**彖伝：頤は貞しければ吉とは、正を養えば則ち吉なり。頤を観るとは、其の養う所を観るなり。自ら口実を求むるとは、其の自らの養いを観るなり。\n天地は万物を養い、聖人は賢を養いて、以て万民に及ぼす。頤の時大いなる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：爾の霊亀を舎て、我を観て頤を朶る。凶。\n\n##### 象伝：我を観て頤を朶るは、また貴ぶに足らざるなり。\n\n/1&\n\n&2&\n##### 二爻：顚に頤う。経に拂る丘において頤う。征けば凶。\n\n##### 象伝：六二の征けば凶とは、行きて類を失うなり。\n\n/2&\n\n&3&\n##### 三爻：頤いに拂る。貞くすれば凶。十年用うる勿れ。利ろしき攸なし。\n\n##### 象伝：十年用うる勿れとは、道大いに悖ればなり。\n\n/3&\n\n&4&\n##### 四爻：顚に頤う。吉。虎視眈眈。其の欲逐逐。咎なし。\n\n##### 象伝：顚に頤うの吉は、上の施し光なるなり。\n\n/4&\n\n&5&\n##### 五爻：経に拂る。貞に居るに吉。大川を渉る可らず。\n\n##### 象伝：貞に居るの吉は、順以て上に従うなり。\n\n/5&\n\n&6&\n##### 上爻：由りて頤う。厲うけれども吉。大川を渉るに利ろし。\n\n##### 象伝：由りて頤う。厲うけれども吉とは、大いに慶びあるなり。\n\n/6&"},"011110":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/028.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：大過は顛るなり**\n\n#### 序\n**序卦伝：頤とは、養うなり。養わざれば則ち動く可からず。故に之を受くるに大過を以てす。**","text.tab3":"&0&\n**大過は棟橈む。往く攸あるに利ろし。亨る。**\n**象伝：澤・木を滅するは大過。君子以て独り立ちて懼れず、世を遯れて悶うるなし。**\n\n/0&\n#### 彖\n\n**彖伝：大過は、大いなる者の過ぎたるなり。棟橈むとは、本末弱きなり。剛過ぎたれども中、巽いて説び行く。往く攸あるに利ろしく、すなわち亨る。大過の時大なる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：藉くに白茅を用う。咎なし。\n\n##### 象伝：藉くに白茅を用うるは、柔・下に在るなり。\n\n/1&\n\n&2&\n##### 二爻：枯楊稊を生ず。老夫其の女妻を得。利ろしからざるなし。\n\n##### 象伝：老夫の女妻は、過ぎて以て相與にするなり。\n\n/2&\n\n&3&\n##### 三爻：棟橈む。凶。\n\n##### 象伝：棟橈むの凶は、以て輔け有る可らざるなり。\n\n/3&\n\n&4&\n##### 四爻：棟隆し。吉。它あれば吝。\n\n##### 象伝：棟隆きの吉は、下に橈まざるなり。\n\n/4&\n\n&5&\n##### 五爻：枯楊に華が生ず。老婦其の士夫を得。咎なく誉れなし。\n\n##### 象伝：枯楊に華を生ずるは、何ぞ久しかる可けんや。老婦の士夫は、また醜ず可きなり。\n\n/5&\n\n&6&\n##### 上爻：過ぎて渉る。頂きを滅す凶。咎なし。\n\n##### 象伝：過ぎて渉るの凶は、咎む可からざるなり。\n\n/6&"},"010010":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/029.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：坎は下るなり**\n\n#### 序\n**序卦伝：物は以て過ぐるに終る可からず。故に之を受くるに坎を以てす。**","text.tab3":"&0&\n**習坎、孚有り。維れ心亨る。行きて尚ばるるあり。**\n**象伝：水洊りに至るは習坎なり。君子以て徳行を常にして、教事を習う。**\n\n/0&\n#### 彖\n\n**彖伝：習坎は重険なり。水は流れて盈たず、険を行いて其の信を失わず。維れ心亨るとは、すなわち剛中を以てなり。行きて尚ばるるありとは、往きて功あるなり。\n天の険は升るべからざるなり。地の険は山川丘陵なり。王公は険を設けて、以て其の国を守る。険の時用大いなる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：習坎。坎萏に入る。凶。\n\n##### 象伝：習坎。坎に入るは、道を失いて凶なり。\n\n/1&\n\n&2&\n##### 二爻：坎に険あり。求めて小しく得。\n\n##### 象伝：求めて小しく得るは、未だ中を出でざるなり。\n\n/2&\n\n&3&\n##### 三爻：来るも之くも坎坎。険にして且つ枕す。坎萏に入る。用うる勿れ。\n\n##### 象伝：来るも之くも坎坎たるは、終に功なきなり。\n\n/3&\n\n&4&\n##### 四爻：樽酒簋貮。缶を用う。約を納るるに牖よりす。終に咎なし。\n\n##### 象伝：樽酒簋貮は、剛柔際ればなり。\n\n/4&\n\n&5&\n##### 五爻：坎盈たず。既に平かなるに祇る。咎なし。\n\n##### 象伝：坎盈たざるは、中未だ大いならざるなり。\n\n/5&\n\n&6&\n##### 上爻：係ぐに徽纆を用う、叢棘に寘く。三歳得ず。凶。\n\n##### 象伝：上六道を失う。凶なること三歳なり。\n\n/6&"},"101101":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/030.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：離は上りて**\n\n#### 序\n**序卦伝：坎とは、陥るなり。陥れば必ず麗く所有り。故に之を受くるに離を以てす。離とは、麗くなり。**","text.tab3":"&0&\n**離は貞に利ろし。亨る。牝牛を畜えば吉。**\n**象伝：明両つ作るは離。大人以て明を継ぎ、四方を照らす。**\n\n/0&\n#### 彖\n\n**彖伝：離は麗くなり。日月は天に麗き、百穀草木は土に麗く。\n重明以て正に麗き、すなわち天下を化成す。\n柔・中正に麗く。故に亨る。是を以て牝牛を畜えば吉なり。**\n\n#### 爻\n\n&1&\n##### 初爻：履むこと錯然たり。之を敬すれば咎なし。\n\n##### 象伝：履むこと錯たるの敬は、以て咎を辟くるなり。\n\n/1&\n\n&2&\n##### 二爻：黄離、元吉。\n\n##### 象伝：黄離の元吉は、中道を得ればなり。\n\n/2&\n\n&3&\n##### 三爻：日昃くの離。缶を鼓ちて歌わず。則ち大耋の嗟あり。凶。\n\n##### 象伝：日昃くの離は、何ぞ久しかるべけんや。\n\n/3&\n\n&4&\n##### 四爻：突如其れ来如。焚如。死如。棄如。\n\n##### 象伝：突如其れ来如たるは、容るる所なきなり。\n\n/4&\n\n&5&\n##### 五爻：涕を出して沱若たり。戚みて嗟若たり。吉。\n\n##### 象伝：六五の吉は、王公に離けばなり。\n\n/5&\n\n&6&\n##### 上爻：王用いて出て征す。嘉きあり。首を折る。獲るは其の醜に匪ず。咎なし。\n\n##### 象伝：王用いて出て征するは、以て邦を正すなり。\n\n/6&"},"001110":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/031.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：咸は速やかなり**\n\n#### 序\n**序卦伝：天地有りて、然る後に万物有り。万物有りて、然る後に男女有り。男女有りて、然る後に夫婦有り。夫婦有りて、然る後に父子有り。父子有りて、然る後に君臣有り。君臣有りて、然る後に上下有り。上下有りて、然る後に礼儀錯く所有り。**","text.tab3":"&0&\n**咸は亨る。貞に利ろし。女を取るに吉。**\n**象伝：山上に澤あるは咸。君子以て虚にして人を受く。**\n\n/0&\n#### 彖\n\n**彖伝：咸は感なり。柔上りて剛下り、二気感応して以て相與にす。止まりて説び、男は女に下る、是を以て亨る。貞に利ろし、女を取るに吉なるなり。\n天地感じて万物化生し、聖人・人心を感じて、天下和平す。\n其の感ずる所を観て、天地万物の情見るべし。**\n\n#### 爻\n\n&1&\n##### 初爻：其の拇に咸ず。\n\n##### 象伝：其の拇に咸ずるは、志外に在るなり。\n\n/1&\n\n&2&\n##### 二爻：其の腓に咸ず。凶。居れば吉。\n\n##### 象伝：凶と雖も居れば吉とは、順えば害あらざるなり。\n\n/2&\n\n&3&\n##### 三爻：其の股に咸ず。其の随うを執る。往けば吝。\n\n##### 象伝：其の股に咸ずるは、また處らざるなり。志人に随うに在り。執る所下なり。\n\n/3&\n\n&4&\n##### 四爻：貞吉。悔い亡ぶ。憧憧として往来すれば、朋爾の思いに従う。\n\n##### 象伝：貞吉悔い亡ぶつは、未だ感・害せられざるなり。憧憧として往来すれば、未だ光大ならざるなり。\n\n/4&\n\n&5&\n##### 五爻：其の脢に咸ずる。悔いなし。\n\n##### 象伝：其の脢に咸ずるは、志末なり。\n\n/5&\n\n&6&\n##### 上爻：其の輔頬舌に咸ず。\n\n##### 象伝：其の輔頬舌に咸ずるは、口説を滕ぐるなり。\n\n/6&"},"011100":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/032.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：恒は久しきなり**\n\n#### 序\n**序卦伝：夫婦の道は、以て久しからざる可からざるなり。故に之を受くるに恒を以てす。**","text.tab3":"&0&\n**恒は亨る。咎なし。貞に利ろし。往く攸あるに利ろし。**\n**象伝：雷風は恒。君子以て立てて方を易えず。**\n\n/0&\n#### 彖\n\n**彖伝：恒は久なり。剛上りて柔下る。雷風相與し、巽いて動き、剛柔皆応ずるは恒。恒は亨りて咎なし、貞に利ろしとは、其の道に久しうするなり。天地の道は恒久にして已まざるなり。往く攸あるに利ろしとは、終れば則ち始まり有るなり。日月天を得て能く久しく照らし、四時変化して能く久しく成す。聖人其の道に久しくして天下化成す。其の恒とする所を観て天地万物の情見るなり。**\n\n#### 爻\n\n&1&\n##### 初爻：恒を浚くする。貞しけれども凶。利ろしき攸なし。\n\n##### 象伝：恒を浚くするの凶は、始めに求むること深きなり。\n\n/1&\n\n&2&\n##### 二爻：悔い亡ぶ。\n\n##### 象伝：九二の悔い亡ぶるは、能く中に久しければなり。\n\n/2&\n\n&3&\n##### 三爻：其の徳を恒にせず、或いは之に羞を承く。貞吝。\n\n##### 象伝：其の徳を恒にせざるは、容るる所なきなり。\n\n/3&\n\n&4&\n##### 四爻：田して禽なし。\n\n##### 象伝：久しく其の位に非ず。安んぞ禽を得んや。\n\n/4&\n\n&5&\n##### 五爻：其の徳を恒にす。貞くするは婦人は吉。夫子は凶。\n\n##### 象伝：婦人貞吉は、一に従いて終るなり。夫子は義を制す。婦に従うは凶なり。\n\n/5&\n\n&6&\n##### 上爻：恒を振う。凶。\n\n##### 象伝：恒を振うて上に在り。大いに功なきなり。\n\n/6&"},"001111":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/033.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：遯は即ち退くなり**\n\n#### 序\n**序卦伝：恒とは、久しきなり。物以て久しく其の所に居る可からず。故に之を受くるに遯を以てす。**","text.tab3":"&0&\n**遯は亨る。小は貞に利ろし。**\n**象伝：天下に山あるは遯。君子以て小人を遠ざけ、悪まずして厳しくす。**\n\n/0&\n#### 彖\n\n**彖伝：遯は亨るとは、遯れて亨るなり。剛位に当たりて応じ、時とともに行なうなり。小は貞に利ろしとは、浸みて長ずるなり。遯の時義大いなる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：遯尾、厲うし。往く攸あるに用うる勿れ。\n\n##### 象伝：遯尾の厲うきは、往かざれば何の災いあらん。\n\n/1&\n\n&2&\n##### 二爻：之を執うるに黄牛の革を用う。之を勝げて説くなし。\n\n##### 象伝：執うるに黄牛の革を用うるは、志を固くするなり。\n\n/2&\n\n&3&\n##### 三爻：遯を係ぐ。疾ありて厲うし。臣妾を畜えば吉。\n\n##### 象伝：遯を係ぐの厲うきは、疾ありて憊れるなり。臣妾を畜えば吉なるは、大事に可ならざるなり。\n\n/3&\n\n&4&\n##### 四爻：好めども遯る。君子は吉。小人は否らず。\n\n##### 象伝：君子は好めども遯る。小人は否らざるなり。\n\n/4&\n\n&5&\n##### 五爻：嘉く遯る。貞吉。\n\n##### 象伝：嘉く遯れ貞吉は、以て志を正すなり。\n\n/5&\n\n&6&\n##### 上爻：肥かに遯る。利ろしからざるなし。\n\n##### 象伝：肥かに遯れ利ろしからざるなしとは、疑う所なきなり。\n\n/6&"},"111100":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/034.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：大壮は即ち止まり**\n\n#### 序\n**序卦伝：遯とは、退くなり。物以て遯るるに終わる可からず。故に之を受くるに大壮を以てす。**","text.tab3":"&0&\n**大壮は、貞に利ろし。**\n**象伝：雷・天上に在るは大壮。君子以て礼にあらざれば履まず。**\n\n/0&\n#### 彖\n\n**彖伝：大壮は大いなる者壮んなるなり。剛以って動く、故に壮ん。大壮は貞に利ろしとは、大いなる者正しきなり。正大にして天地の情見るべし。**\n\n#### 爻\n\n&1&\n##### 初爻：趾に壮なり。征けば凶。孚あり。\n\n##### 象伝：趾に壮なるは、其の孚窮するなり。\n\n/1&\n\n&2&\n##### 二爻：貞なれば吉。\n\n##### 象伝：九二の貞吉は、中を以てなり。\n\n/2&\n\n&3&\n##### 三爻：小人壮を用い、君子は罔を用う。貞なるも厲うし。羝羊藩に触れて其の角を羸しましむ。\n\n##### 象伝：小人は壮を用い、君子は罔なり。\n\n/3&\n\n&4&\n##### 四爻：貞吉。悔い亡ぶ。藩決けて羸しまず、大輿の輹に壮なり。\n\n##### 象伝：藩決けて羸まざるは、往くを尚ぶなり。\n\n/4&\n\n&5&\n##### 五爻：羊を易に喪う。悔なし。\n\n##### 象伝：羊を易に喪うは、位当たらざるなり。\n\n/5&\n\n&6&\n##### 上爻：羝羊藩に触れて、退く能わず。遂む能わず。利ろしき攸なし。艱めば則ち吉。\n\n##### 象伝：退く能わず遂む能わずは、詳らかならざるなり。艱めば即ち吉なるは、咎長からざるなり。\n\n/6&"},"000101":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/035.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：晋は昼なり**\n\n#### 序\n**序卦伝：物以て壮に終わる可からず。故に之を受くるに晋を以てす。**","text.tab3":"&0&\n**晋は、康侯用て馬を錫うこと蕃庶。晝日三たび接す。**\n**象伝：明地上に出づるは晋。君子以て自ら明徳を昭かにす。**\n\n/0&\n#### 彖\n\n**彖伝：晋は、進むなり。明地上に出で、順いて大明に麗き、柔進みて上行す。是を以て康侯用て馬を錫うこと蕃庶、晝日三たび接するなり。**\n\n#### 爻\n\n&1&\n##### 初爻：晋如。摧如。貞にして吉。孚とせらるるなきも、裕かにして咎なし。\n\n##### 象伝：晋如、摧如たるは、独り正を行なうなり。裕かにして咎なきは、未だ命を受けざるなり。\n\n/1&\n\n&2&\n##### 二爻：晋如。愁如。貞にして吉。茲の介福を其の王母より受く。\n\n##### 象伝：茲の介福を受くるは、中正を以てなり。\n\n/2&\n\n&3&\n##### 三爻：衆允とす。悔亡ぶ。\n\n##### 象伝：衆允とするは、志上行するなり。\n\n/3&\n\n&4&\n##### 四爻：晋如。鼫鼠。貞くすれば厲うし。\n\n##### 象伝：鼫鼠の貞くすれば厲うきは、位当たらざればなり。\n\n/4&\n\n&5&\n##### 五爻：悔亡ぶ。失得恤うる勿れ。往きて吉。利ろしからざるなし。\n\n##### 象伝：失得恤うる勿れとは、往きて慶あるなり。\n\n/5&\n\n&6&\n##### 上爻：其の角に晋む。維用て邑を伐つ。厲うけれども吉にして咎なし。貞くすれば吝。\n\n##### 象伝：維用て邑を伐つは、道未だ光いならざるなり。\n\n/6&"},"101000":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/036.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：明夷は誅なり**\n\n#### 序\n**序卦伝：晋とは、進なり。進めば必ず傷るる所あり。故に之を受くるに明夷を以てす。**","text.tab3":"&0&\n**明夷は、艱貞に利ろし。**\n**象伝：明・地中に入るは明夷。君子以て衆に莅み、晦きを用いて明らかなり。**\n\n/0&\n#### 彖\n\n**彖伝：明・地中に入るは明夷。内文明にして外柔順、以て大難を蒙る。文王之を以ゆ。艱貞に利ろしとは、其の明を晦ますなり。内難みて而して能く其の志を正しくす。箕子之を以ゆ。**\n\n#### 爻\n\n&1&\n##### 初爻：明夷。于き飛び其の翼を垂る。君子于き行きて、三日食わず。往く攸あれば、主人言あり。\n\n##### 象伝：君子于き行くは、義食らわざるなり。\n\n/1&\n\n&2&\n##### 二爻：明夷。左股を夷る。用て拯う。馬壮なれば吉。\n\n##### 象伝：六二の吉は、順にして以て則あるなり。\n\n/2&\n\n&3&\n##### 三爻：明夷。南に于いて狩りし、其の大首を得。疾く貞にすべからず。\n\n##### 象伝：南狩の志は、乃ち大いに得るなり。\n\n/3&\n\n&4&\n##### 四爻：左腹に入りて、明夷の心を獲。于きて門庭を出づ。\n\n##### 象伝：左腹に入るは、心意を獲るなり。\n\n/4&\n\n&5&\n##### 五爻：箕子の明夷。貞に利ろし。\n\n##### 象伝：箕子の貞は、明息むべからざるなり。\n\n/5&\n\n&6&\n##### 上爻：明かならずして晦し。初め天に登り、後に地に入る。\n\n##### 象伝：初め天に登るは、四国を照らすなり。後に地に入るは、則を失うなり。\n\n/6&"},"101011":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/037.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：家人は内なり**\n\n#### 序\n**序卦伝：夷とは、傷るるなり。外に傷るる者は、必ず家に反る。故に之を受くるに家人を以てす。**","text.tab3":"&0&\n**家人は、女の貞に利ろし。**\n**象伝：風・火より出づるは家人。君子以て言には物あり、行ないには恒あり。**\n\n/0&\n#### 彖\n\n**彖伝：家人は、女・位を内に正しく、男・位を外に正しくす。男女正しきは、天地の大義なり。家人に厳君ありとは、父母を謂うなり。父は父たり、子は子たり、兄は兄たり、弟は弟たり、夫は夫たり、婦は婦たり、而して家道正し。家を正しくして而して天下定まる。**\n\n#### 爻\n\n&1&\n##### 初爻：閑ぎて家を有つ。悔い亡ぶ。\n\n##### 象伝：閑ぎて家を有つは、志未だ変ぜざるなり。\n\n/1&\n\n&2&\n##### 二爻：遂ぐる攸なし。中饋に在り。貞吉。\n\n##### 象伝：六二の吉は、順みて以て巽うなり。\n\n/2&\n\n&3&\n##### 三爻：家人嗃嗃。悔い厲うきあれども吉。婦子嘻嘻たれば、終に吝。\n\n##### 象伝：家人嗃嗃たるは、未だ失わざるなり。婦子嘻嘻たるは、家節を失うなり。\n\n/3&\n\n&4&\n##### 四爻：家を富ます。大吉。\n\n##### 象伝：家を富ます大吉は、順みて位に在るなり。\n\n/4&\n\n&5&\n##### 五爻：王仮りて家を有つ。恤うる勿れ。吉。\n\n##### 象伝：王仮りて家を有つは、交相愛するなり。\n\n/5&\n\n&6&\n##### 上爻：孚ありて威如たれば、終に吉。\n\n##### 象伝：威如の吉は、身に反るの謂うなり。\n\n/6&"},"110101":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/038.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：睽は外なり**\n\n#### 序\n**序卦伝：家道窮まれば必ず乖く。故に之を受くるに睽を以てす。**","text.tab3":"&0&\n**睽は、小事に吉。**\n**象伝：火を上にし澤を下にするは睽。君子以て同じくして異なる。**\n\n/0&\n#### 彖\n\n**彖伝：睽は、火動きて上り、澤動きて下る。二女同居して其の志は行ないを同じくせず。\n説びて明に麗く、柔進みて上行し、中を得て剛に応ず。是を以て小事に吉なり。\n天地睽きて其の事同じきなり。男女睽きて其の志通ずるなり。万物睽きて其の事類するなり。睽の時用大いなる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：悔い亡ぶ。馬を喪う。逐うこと勿れ自ら復る。悪人を見る。咎なし。\n\n##### 象伝：悪人を見るは、以て咎を辟くるなり。\n\n/1&\n\n&2&\n##### 二爻：主に巷に遇う。咎なし。\n\n##### 象伝：主に巷にて遇うは、未だ道を失わざるなり。\n\n/2&\n\n&3&\n##### 三爻：輿の曳かるるを見る。其の牛は掣られ、その人天られ且つ劓きらる。初め无くして終り有り。\n\n##### 象伝：輿の曳かるるを見るは、位当たらざるなり。初め无くして終り有るは、剛に遇うなり。\n\n/3&\n\n&4&\n##### 四爻：睽きて孤なり。元夫に遇いて交孚す。厲うけれども咎なし。\n\n##### 象伝：交孚し咎なきは、志行なわるるなり。\n\n/4&\n\n&5&\n##### 五爻：悔い亡ぶ。厥の宗、膚を噬む。往けば何の咎あらん。\n\n##### 象伝：厥の宗、膚を噬むは、往きて慶あるなり。\n\n/5&\n\n&6&\n##### 上爻：睽きて孤なり。豕の塗を負うを見る。鬼を一車に載す。先には弧を張り、後には之が弧を説く。冦するに匪ず婚媾せんとす。往きて雨に遇えば則ち吉。\n\n##### 象伝：雨に遇うの吉は、羣疑亡ぶるなり。\n\n/6&"},"001010":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/039.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：蹇は難むなり**\n\n#### 序\n**序卦伝：睽とは、乖くなり。乖けば必ず難あり。故に之を受くるに蹇を以てす。**","text.tab3":"&0&\n**蹇は、西南に利ろしく、東北に利ろしからず。大人を見るに利ろし。貞しければ吉。**\n**象伝：山上に水有るは蹇。君子以て身に反りて徳を修む。**\n\n/0&\n#### 彖\n\n**彖伝：蹇は、難なり。険前に在るなり。険を見て能く止まるは、知なる哉。蹇は西南に利ろしとは、往きて中を得るなり。東北に利ろしからずとは、其の道窮まるなり。大人を見るに利ろしとは、往きて功あるなり。位に当たり貞しければ吉とは、以て邦を正すなり。蹇の時用大いなる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：往けば蹇み、來れば誉れあり。\n\n##### 象伝：往けば蹇み來れば誉れあるは、宜しく待つべきなり。\n\n/1&\n\n&2&\n##### 二爻：王臣蹇蹇。躬の故に匪ず。\n\n##### 象伝：王臣蹇蹇たるは、終に尤なきなり。\n\n/2&\n\n&3&\n##### 三爻：往けば蹇み、來れば反る。\n\n##### 象伝：往けば蹇み來れば反るは、内之を喜ぶなり。\n\n/3&\n\n&4&\n##### 四爻：往けば蹇み、來れば連なる。\n\n##### 象伝：往けば蹇み來れば連なるは、位に当たりて実なればなり。\n\n/4&\n\n&5&\n##### 五爻：大いに蹇み朋来る。\n\n##### 象伝：大いに蹇み朋來るは、中節を以てなり。\n\n/5&\n\n&6&\n##### 上爻：往けば蹇み來れば碩いなり。吉。大人を見るに利ろし。\n\n##### 象伝：往けば蹇み來れば碩いなるは、志内に在るなり。大人を見るに利ろしきは、以て貴に従うなり。\n\n/6&"},"010100":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/040.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：解は緩やかなるなり**\n\n#### 序\n**序卦伝：蹇とは、難なり。物以て難に終わる可からず。故に之を受くるに解を以てす。**","text.tab3":"&0&\n**解は、西南に利ろし。往く所なければ、其れ来り復りて吉。往く攸有れば、夙くして吉。**\n**象伝：雷雨作るは解。君子以て過ちを赦し罪を宥む。**\n\n/0&\n#### 彖\n\n**彖伝：解は険にして以て動く。動きて険を免るるは解。解は西南に利ろしとは、往きて衆を得るなり。其れ来り復りて吉とは、すなわち中を得るなり。往く攸あれば夙くして吉とは、往きて功あるなり。天地解けて雷雨作り、雷雨作りて百果草木みな甲柝す。解の時大いなる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：咎なし。\n\n##### 象伝：剛柔の際りは、義咎なきなり。\n\n/1&\n\n&2&\n##### 二爻：田して三狐を獲る。黄矢を得る。貞吉。\n\n##### 象伝：九二の貞吉は、中道を得るなり。\n\n/2&\n\n&3&\n##### 三爻：負い且つ乗る。寇の至るを致す。貞吝。\n\n##### 象伝：負い且つ乗るは、亦醜ずべきなり。我より戎を致す、又誰をか咎めん。\n\n/3&\n\n&4&\n##### 四爻：而の拇を解く。朋至りて斯れ孚す。\n\n##### 象伝：而の拇を解くは、未だ位に当たらざるなり。\n\n/4&\n\n&5&\n##### 五爻：君子維れ解くあり。吉。小人に孚あり。\n\n##### 象伝：君子解くあるは、小人退くなり。\n\n/5&\n\n&6&\n##### 上爻：公用て隼を高墉の上に射る。之を獲て利ろしからざるなし。\n\n##### 象伝：公用て隼を射るは、以て悖れるを解くなり。\n\n/6&"},"110001":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/041.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：損・益は盛衰の始めなり**\n\n#### 序\n**序卦伝：解とは、緩やかなるなり。緩やかなれば必ず失う所あり。故に之を受くるに損を以てす。**","text.tab3":"&0&\n**損は孚あり。元吉。咎なし。貞にすべし。往く攸あるに利ろし。曷をか之を用いん。二簋用て享すべし。**\n**象伝：山下に澤あるは損。君子以て忿りを懲らし欲を窒ぐ。**\n\n/0&\n#### 彖\n\n**彖伝：損は下を損して上に益し、其の道上行す。損して孚あり、元吉、咎なし、貞にすべし、往く攸あるに利ろし、曷をか之を用いん、二簋用て享すべしとは、二簋時あるに応ず。剛を損して柔を益するに時あり。損益盈虚は時と偕に行なう。**\n\n#### 爻\n\n&1&\n##### 初爻：事を已めて遄かに往く。咎なし。酌りて之を損す。\n\n##### 象伝：事を已めて遄かに往くは、尚志を合するなり。\n\n/1&\n\n&2&\n##### 二爻：貞に利ろし。征けば凶。損せずして之を益す。\n\n##### 象伝：九二の貞に利ろしきは、中以て志と為すなり。\n\n/2&\n\n&3&\n##### 三爻：三人行けば、則ち一人を損し、一人行けば即ち其の友を得。\n\n##### 象伝：一人なれば行き、三人なれば則ち疑うなり。\n\n/3&\n\n&4&\n##### 四爻：其の疾いを損する。遄かならしむれば喜び有り。咎なし。\n\n##### 象伝：其の疾いを損するは、亦喜ぶべきなり。\n\n/4&\n\n&5&\n##### 五爻：或いは之を益す。十朋の龜も違う克わず。元吉。\n\n##### 象伝：六五の元吉は、上より祐くるなり。\n\n/5&\n\n&6&\n##### 上爻：損せずして之を益す。咎なし。貞吉。往く攸あるに利ろし。臣を得て家なし。\n\n##### 象伝：損せずして之を益するは、大いに志を得るなり。\n\n/6&"},"100011":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/042.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：損・益は盛衰の始めなり**\n\n#### 序\n**序卦伝：損して已まざれば必ず益す。故に之を受くるに益を以てす。**","text.tab3":"&0&\n**益は、往く攸あるに利ろし。大川を渉るに利ろし。**\n**象伝：風雷は益。君子以て善を見れば則ち遷り、過ちがあれば則ち改む。**\n\n/0&\n#### 彖\n\n**彖伝：益は上を損し下を益す。民の説ぶこと疆りなし。上より下に下る、其の道大いに光る。往く攸あるに利ろしとは、中正にして慶あるなり。大川を渉るに利ろしとは、木道すなわち行なわるるなり。益は動きて巽い、日に進むこと疆りなし。\n天は施し地は生じ、其の益は方なし。およそ益の道は時と偕に行なう。**\n\n#### 爻\n\n&1&\n##### 初爻：用て大作を為すに利ろし。元吉。咎なし。\n\n##### 象伝：元吉にして咎なきは、下事を厚くせざるなり。\n\n/1&\n\n&2&\n##### 二爻：或いは之を益す。十朋の龜も違う克わず。永貞にして吉。王用て帝に享す。吉。\n\n##### 象伝：或いは之を益するは、外より来るなり。\n\n/2&\n\n&3&\n##### 三爻：之を益するに凶事を用う。咎なし。孚ありて中行。公に告げて圭を用う。\n\n##### 象伝：之を益するに凶事を用うるは、固く之を有するなり。\n\n/3&\n\n&4&\n##### 四爻：中行公に告げて従わる。依りて國を遷すことを為すに用うるに利ろし。\n\n##### 象伝：中行公に告げて従わるるは、以て志を益するなり。\n\n/4&\n\n&5&\n##### 五爻：孚ありて恵心。問うこと勿れ元いに吉。孚ありて我に徳を恵む。\n\n##### 象伝：孚ありて恵心は、之を問うこと勿れ。我が徳を恵むは、大いに志を得るなり。\n\n/5&\n\n&6&\n##### 上爻：之を益する莫し。或いは之を撃つ。心を立つること恒勿し。凶。\n\n##### 象伝：之を益するなきは、偏辞なり。或いは之を撃つは、外より来るなり。\n\n/6&"},"111110":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/043.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：夬は決するなり、剛・柔を決するなり。君子の道長じ、小人の道憂うるなり**\n\n#### 序\n**序卦伝：益して已まざれば必ず決す。故に之を受くるに夬を以てす。**","text.tab3":"&0&\n**夬は、王庭に揚ぐ。孚にて號う厲うき有り。告ぐに邑よりす。戎に即くに利ろしからず。往く攸有るに利ろし。**\n**象伝：澤・天に上るは夬。君子以て祿を施して下に及ぼす。徳に居れば則ち忌む。**\n\n/0&\n#### 彖\n\n**彖伝：夬は、決なり。剛・柔を決するなり。健にして説び、決して和す。王庭に揚ぐとは、柔五剛に乗るなり。孚にて號う厲うき有りとは、其の危うきはすなわち光いなり。告ぐるに邑よりす、戎に即くに利ろしからずとは、尚ぶ所すなわち窮まるなり。往く攸有るに利ろしとは、剛長じすなわち終わるなり。**\n\n#### 爻\n\n&1&\n##### 初爻：趾を前むるに壮んなり。往けば勝たず咎と為す。\n\n##### 象伝：勝たずして往くは咎なり。\n\n/1&\n\n&2&\n##### 二爻：惕れて號う。莫夜に戎あるも恤うる勿れ。\n\n##### 象伝：戎あるも恤うる勿れは、中道を得たるなり。\n\n/2&\n\n&3&\n##### 三爻：頄に壮んなり。凶有り。君子決し去るべきは決し去る。獨り行けば雨に遇う。濡るるが若く慍らるる有り。咎なし。\n\n##### 象伝：君子決し去るべきは決し去るとは、終に咎なきなり。\n\n/3&\n\n&4&\n##### 四爻：臀に膚なし。其の行くこと次且たり。羊に牽かれて悔い亡ぶ。言を聞きて信ぜず。\n\n##### 象伝：其の行くこと次且たりとは、位当たらざるなり。言を聞きて信ぜざるは、聡明ならざるなり。\n\n/4&\n\n&5&\n##### 五爻：莧陸夬夬。中行咎なし。\n\n##### 象伝：中行咎なきは、中未だ光いならざるなり。\n\n/5&\n\n&6&\n##### 上爻：號うなし。終に凶有り。\n\n##### 象伝：號うなきの凶は、終に長かる可からざるなり。\n\n/6&"},"011111":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/044.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：姤は遇うなり、柔・剛に遇うなり**\n\n#### 序\n**序卦伝：夬とは、決するなり。決すれば必ず遇う有り。故に之を受くるに姤を以てす。**","text.tab3":"&0&\n**姤は、女壮なり。女を取るに用うる勿れ。**\n**象伝：天下に風あるは姤。后以て命を施し、四方に誥ぐ。**\n\n/0&\n#### 彖\n\n**彖伝：姤は遇うなり。柔・剛に遇うなり。女を取るに用うる勿れとは、與に長ずるべからざるなり。\n天地相遇いて、品物咸く章かなり。剛中正に遇いて、天下大いに行なわるるなり。姤の時義大いなる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：金柅に繋ぐ。貞吉。往く攸有れば、凶を見る。羸豕孚するも蹢躅す。\n\n##### 象伝：金柅に繋ぐは、柔道牽けばなり。\n\n/1&\n\n&2&\n##### 二爻：包に魚有り。咎なし。賓に利ろしからず。\n\n##### 象伝：包に魚有るは、義・賓に及ばざるなり。\n\n/2&\n\n&3&\n##### 三爻：臀に膚なし。其の行くこと次且たり。厲うけれども大いなる咎なし。\n\n##### 象伝：其の行くこと次且たるは、行きて未だ牽かれざるなり。\n\n/3&\n\n&4&\n##### 四爻：包に魚なし。凶を起す。\n\n##### 象伝：魚なきの凶は、民に遠ざかるなり。\n\n/4&\n\n&5&\n##### 五爻：杞を以て瓜を包む。章を含む。天より隕つる有り。\n\n##### 象伝：九五の章を含むは、中正なればなり。天より隕つる有るとは、志命を舎てざるなり。\n\n/5&\n\n&6&\n##### 上爻：其の角に姤う。吝。咎なし。\n\n##### 象伝：其の角に姤うは、上窮まりて吝なり。\n\n/6&"},"000110":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/045.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：萃は聚まりて**\n\n#### 序\n**序卦伝：姤とは、遇うなり。物相遇いて而る後に聚る。故に之を受くるに萃を以てす。**","text.tab3":"&0&\n**萃は亨る。王有廟に仮る。大人を見るに利ろし。亨る。貞に利ろし。大牲を用いて吉。往く攸有るに利ろし。**\n**象伝：澤・地に上るは萃。君子以て戎器を除め、不虞を戒む。**\n\n/0&\n#### 彖\n\n**彖伝：萃は聚なり。順にして以て説び、剛中にして応ず、故に聚まるなり。王有廟に仮るとは、孝享を致すなり。大人を見るに利ろし、亨るとは、聚まるに正を以てするなり。大牲を用いて吉、往く攸有るに利ろしとは、天命に順うなり。其の聚まるところを観て、天地万物の情みるべし。**\n\n#### 爻\n\n&1&\n##### 初爻：孚有りて終えず。乃ち乱れ乃ち萃る。もし號えば一握笑いを為さん。恤うる勿れ。往けば咎なし。\n\n##### 象伝：乃ち乱れ、乃ち萃るは、其の志乱れるなり。\n\n/1&\n\n&2&\n##### 二爻：引かれて吉。咎なし。孚あれば乃ち禴を用いて利ろし。\n\n##### 象伝：引かれて吉咎なきは、中未だ変ぜざるなり。\n\n/2&\n\n&3&\n##### 三爻：萃如。嗟如。利ろしき攸なし。往けば咎なし。小なれば吝。\n\n##### 象伝：往けば咎なしは、上巽えばなり。\n\n/3&\n\n&4&\n##### 四爻：大なれば吉。咎なし。\n\n##### 象伝：大なれば吉にして咎なきは、位当たらざるなり。\n\n/4&\n\n&5&\n##### 五爻：有位に萃る。咎なし。孚に匪ず。元永貞なれば、悔い亡ぶ。\n\n##### 象伝：有位に萃るは、志未だ光ならざるなり。\n\n/5&\n\n&6&\n##### 上爻：齎咨涕洟。咎なし。\n\n##### 象伝：齎咨涕洟するは、未だ上に安んぜるなり。\n\n/6&"},"011000":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/046.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：升は来たらざるなり**\n\n#### 序\n**序卦伝：萃とは、聚るなり。聚りて上る者は、之を升と謂う。故に之を受くるに升を以てす。**","text.tab3":"&0&\n**升は、元いに亨る。用て大人を見る。恤うる勿れ。南征すれば吉。**\n**象伝：地中に木を生ずるは升。君子以て徳に順い、小を積み以て高大を成す。**\n\n/0&\n#### 彖\n\n**彖伝：柔、時を以て升り、巽にして順、剛中にして応ず、是を以て大いに亨る。用て大人を見る、恤うる勿れとは、慶びあるなり。南征すれば吉とは、志行なわるるなり。**\n\n#### 爻\n\n&1&\n##### 初爻：允に升る。大いに吉。\n\n##### 象伝：允に升る大いに吉は、上志を合わすなり。\n\n/1&\n\n&2&\n##### 二爻：孚あれば乃ち禴を用うるに利ろし。咎なし。\n\n##### 象伝：九二の孚は、喜び有るなり。\n\n/2&\n\n&3&\n##### 三爻：虚邑に升る。\n\n##### 象伝：虚邑に升るは、疑う所なきなり。\n\n/3&\n\n&4&\n##### 四爻：王用て岐山に亨す。吉。咎なし。\n\n##### 象伝：王用て岐山に亨するは、順事なり。\n\n/4&\n\n&5&\n##### 五爻：貞にして吉。階に升る。\n\n##### 象伝：貞吉階に升るは、大いに志を得るなり。\n\n/5&\n\n&6&\n##### 上爻：冥升。息まざるの貞に利ろし。\n\n##### 象伝：冥升上に在らば、消して富まざるなり。\n\n/6&"},"010110":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/047.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：困は相遇うなり**\n\n#### 序\n**序卦伝：升りて已まざれば必ず困しむ。故に之を受くるに困を以てす。**","text.tab3":"&0&\n**困は亨る。貞し。大人は吉にして咎なし。言あるも信ぜられず。**\n**象伝：澤に水なきは困。君子以て命を致し志を遂ぐ。**\n\n/0&\n#### 彖\n\n**彖伝：困は剛揜わるるなり。険にして以て説ぶ。困しみて其の亨る所を失わず、それ唯だ君子のみか。貞し、大人は吉なるは、剛中を以てなり。言あるも信ぜられずとは、口を尚べばすなわち窮するなり。**\n\n#### 爻\n\n&1&\n##### 初爻：臀、株木に困しむ。幽谷に入る。三歳観ず。\n\n##### 象伝：幽谷に入るは、幽にして明らかならざるなり。\n\n/1&\n\n&2&\n##### 二爻：酒食に困しむ。朱紱方に来らんとす。用て享祀するに利ろし。征けば凶。咎なし。\n\n##### 象伝：酒食に困しむは、中にして慶あるなり。\n\n/2&\n\n&3&\n##### 三爻：石に困しむ。蒺蔾に據る。其の宮に入り、其の妻を見ず。凶。\n\n##### 象伝：蒺藜に據るは、剛に乗るなり。其の宮に入り其の妻を見ざるは、不祥なり。\n\n/3&\n\n&4&\n##### 四爻：来ること徐徐たり。金車に困しむ。吝なれども終り有り。\n\n##### 象伝：来ること徐徐たるは、志下に在るなり。位に当たらずと雖も與する有るなり。\n\n/4&\n\n&5&\n##### 五爻：劓り刖る。赤紱に困しむ。乃ち徐くにして説び有り。用て祭祀するに利ろし。\n\n##### 象伝：劓り刖れるは、志、いまだ得ざるなり。すなわち徐ろに説びあるは、中直を以てなり。用て祭祀するに利ろしきは、福を受くるなり。\n\n/5&\n\n&6&\n##### 上爻：葛藟に困しむ。于に臲卼。曰く動けば悔ゆると。悔ゆる有って征けば吉。\n\n##### 象伝：葛藟に困しむは、未だ当たらざるなり。動けば悔ゆ。悔ゆる有れば、吉にして行くなり。\n\n/6&"},"011010":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/048.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：井は通じて**\n\n#### 序\n**序卦伝：上に困しむ者は、必ず下に反る。故に之を受くるに井を以てす。**","text.tab3":"&0&\n**井は、邑を改め井を改めず。喪うなく得るなし。往来井井たり。汔んど至らんとするも、また未だ井を繘せず。其の瓶を羸る。凶。**\n**象伝：木の上に水あるは井。君子以て民を労い勧め相く。**\n\n/0&\n#### 彖\n\n**彖伝：水に巽れて水を上ぐるは井。井は養いて窮まらざるなり。邑を改め井を改めずとは、すなわち剛中を以てなり。汔んど至らんとするも、また未だ井を繘せずとは、未だ功あらざるなり。其の瓶を羸る。是を以て凶なり。**\n\n#### 爻\n\n&1&\n##### 初爻：井泥して食われず。舊井に禽なし。\n\n##### 象伝：井泥して食われざるは、下なればなり。舊井に禽なきは、時舎つるなり。\n\n/1&\n\n&2&\n##### 二爻：井谷鮒に射ぐ。甕敝れて漏れる。\n\n##### 象伝：井谷鮒に射ぐは、與するなきなり。\n\n/2&\n\n&3&\n##### 三爻：井渫えども食われず。我が心惻みを爲す。用て汲む可し。王明らかなれば並びに其の福を受く。\n\n##### 象伝：井渫えども食われざるは、行ない惻むなり。王の明を求めて福を受くるなり。\n\n/3&\n\n&4&\n##### 四爻：井甃す。咎なし。\n\n##### 象伝：井甃し咎なきは、井を脩むるなり。\n\n/4&\n\n&5&\n##### 五爻：井洌くして、寒泉食わる。\n\n##### 象伝：寒泉の食わるは、中正なればなり。\n\n/5&\n\n&6&\n##### 上爻：井収みて幕う勿れ。孚有りて元吉。\n\n##### 象伝：元吉上に在り。大いに成るなり。\n\n/6&"},"101110":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/049.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：革は故きを去るなり**\n\n#### 序\n**序卦伝：井道は革めざる可からず。故に之を受くるに革を以てす。**","text.tab3":"&0&\n**革は、已る日にして乃ち孚とせらる。元いに亨る貞に利ろし。悔い亡ぶ。**\n**象伝：澤中に火あるは革。君子以て暦を治め時を明らかにす。**\n\n/0&\n#### 彖\n\n**彖伝：革は水火相い息む。\n二女同居して、其の志相い得ざるを革と曰う。已る日にして乃ち孚とせらるとは、革めて之を信ずるなり。文明にして以て説び、大いに亨りて以て正し。革めて当たれば、其の悔いすなわち亡ぶ。\n天地革まって四時成り、湯武命を革めて、天に順い人に応ず。革の時大いなる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：鞏むるに黄牛の革を用う。\n\n##### 象伝：鞏むるに黄牛の革を用うるは、以て為す有る可からざるなり。\n\n/1&\n\n&2&\n##### 二爻：已める日にして乃ち之を革む。征けば吉。咎なし。\n\n##### 象伝：已める日にして之を革むるは、行きて嘉び有るなり。\n\n/2&\n\n&3&\n##### 三爻：征けば凶。貞なれども厲うし。革言三たびにして就る。孚有り。\n\n##### 象伝：革言三たびにして就るは、又何くに之かん。\n\n/3&\n\n&4&\n##### 四爻：悔い亡ぶ。孚有りて命を改む。吉。\n\n##### 象伝：命を改めるの吉は、志を信ずるなり。\n\n/4&\n\n&5&\n##### 五爻：大人虎変す。未だ占わずして孚有り。\n\n##### 象伝：大人虎変するは、其の文炳たるなり。\n\n/5&\n\n&6&\n##### 上爻：君子豹変す。小人面を革む。征けば凶。貞に居れば吉。\n\n##### 象伝：君子豹変するは、其の文蔚たるなり。小人面を革むるは、順以て君に従うなり。\n\n/6&"},"011101":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/050.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：鼎は新しきを取るなり**\n\n#### 序\n**序卦伝：物を革むる者は、鼎に若くは莫し。故に之を受くるに鼎を以てす。**","text.tab3":"&0&\n**鼎は、元いに吉。亨る。**\n**象伝：木の上に火あるは鼎。君子以て位を正し命を凝む。**\n\n/0&\n#### 彖\n\n**彖伝：鼎は象なり。木を以て火に巽れて、亨飪するなり。聖人亨して以て上帝に享し、而して大いに亨りて以て聖賢を養う。巽にして耳目聡明。\n柔進みて上行し、中を得て剛に応ず。是を以て元いに亨る。**\n\n#### 爻\n\n&1&\n##### 初爻：鼎趾を顛さまにす。否を出すに利ろし。妾を得て以て其の子を以てす。咎なし。\n\n##### 象伝：鼎趾を顛さまにするは、未だ悖らざるなり。否を出すに利ろしきは、以て貴きに従うなり。\n\n/1&\n\n&2&\n##### 二爻：鼎に実あり。我が仇疾有り。我に即く能わず。吉。\n\n##### 象伝：鼎実有るは、之く所を慎むなり。我が仇疾有るは、終に尤なきなり。\n\n/2&\n\n&3&\n##### 三爻：鼎耳革まる。其の行塞がる。雉の膏食われず。方に雨ふれば悔いを虧く。終に吉。\n\n##### 象伝：鼎耳革まるは、其の義を失うなり。\n\n/3&\n\n&4&\n##### 四爻：鼎足を折る。公の餗を覆えす。其の形渥たり。凶。\n\n##### 象伝：公の餗を覆えすは、信に如何せん。\n\n/4&\n\n&5&\n##### 五爻：鼎、黄耳金鉉。貞に利ろし。\n\n##### 象伝：鼎黄耳は、中以て実と為すなり。\n\n/5&\n\n&6&\n##### 上爻：鼎、玉鉉。大吉にして、利ろしからざるなし。\n\n##### 象伝：玉鉉上に在り、剛柔節するなり。\n\n/6&"},"100100":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/051.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：震は起るなり**\n\n#### 序\n**序卦伝：器を主る者は、長子に若くは莫し。故に之を受くるに震を以てす。**","text.tab3":"&0&\n**震は、亨る。震來るに虩虩たり。笑言啞啞たり。震百里を驚かすも、匕鬯を喪わず。**\n**象伝：洊びなる雷は震。君子以て恐懼修省す。**\n\n/0&\n#### 彖\n\n**彖伝：震は亨る。震來るに虩虩たりとは、恐れて福を致すなり。笑言啞啞たりは、後に則あるなり。震百里を驚かすとは、遠きを驚かして邇きを懼れしむなり。出でて以て宗廟社稷を守り、以て祭主たるべきなり。**\n\n#### 爻\n\n&1&\n##### 初爻：震來たるに虩虩たり。後に笑言啞啞たり。吉。\n\n##### 象伝：震來るに虩虩たるは、恐れて福を致すなり。笑言啞啞たるは、後に則あるなり。\n\n/1&\n\n&2&\n##### 二爻：震來たるに厲うし。億いに貝を喪い、九陵に躋る。逐うこと勿れ。七日にして得。\n\n##### 象伝：震來るに厲うきは、剛に乗るなり。\n\n/2&\n\n&3&\n##### 三爻：震蘇蘇たり。震れて行けば眚いなし。\n\n##### 象伝：震蘇蘇たるは、位当たらざるなり。\n\n/3&\n\n&4&\n##### 四爻：震きて泥に逐つ。\n\n##### 象伝：震きて泥に逐つるは、未だ光いならざるなり。\n\n/4&\n\n&5&\n##### 五爻：震往來すること厲うし。億いに有事を喪うことなし。\n\n##### 象伝：震往來すること厲うきは、危行なり。其の事、中に在り。大いに喪うことなきなり。\n\n/5&\n\n&6&\n##### 上爻：震索索たり。視ること矍矍たり。征けば凶。震れること其の躬に于いてせず、其の隣りに于いてすれば咎なし。婚媾言あり。\n\n##### 象伝：震索索たるは、中未だ得ざるなり。凶と雖も咎なきは、隣を畏れて戒むるなり。\n\n/6&"},"001001":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/052.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：艮は止まるなり**\n\n#### 序\n**序卦伝：震とは、動くなり。物は以て動くに終る可からずして、之を止む。故に之を受くるに艮を以てす。**","text.tab3":"&0&\n**其の背に艮まり、其の身を獲ず。其の庭に行きて其の人を見ず。咎なし。**\n**象伝：兼山は艮。君子以て思うことは其の位を出でず。**\n\n/0&\n#### 彖\n\n**彖伝：艮は止まるなり。時止まれば則ち止まり、時行けば則ち行き、動静其の時を失わず、其の道光明。其の止まるに艮まるとは、其の所に止まるなり。上下敵応して相い與せざるなり。是を以て其の身を獲ず、其の庭に行きて其の人を見ず、咎なきなり。**\n\n#### 爻\n\n&1&\n##### 初爻：其の趾に艮まる。咎なし。永貞に利ろし。\n\n##### 象伝：其の趾に艮まるは、未だ正を失わざるなり。\n\n/1&\n\n&2&\n##### 二爻：其の腓に艮まる。其の随うを拯わず。其の心快からず。\n\n##### 象伝：其の随うを拯わざるは、未だ退き聴かざるなり。\n\n/2&\n\n&3&\n##### 三爻：其の限に艮まる。其の夤を列く。厲うくして心を薰す。\n\n##### 象伝：其の限に艮まるは、危うくして心を薰すなり。\n\n/3&\n\n&4&\n##### 四爻：其の身に艮まる。咎なし。\n\n##### 象伝：其の身に艮まるは、諸を躬に止めるなり。\n\n/4&\n\n&5&\n##### 五爻：其の輔に艮まる。言うこと序有り。悔い亡ぶ。\n\n##### 象伝：其の輔に艮まるは、中正を以てなり。\n\n/5&\n\n&6&\n##### 上爻：艮まるに敦し。吉。\n\n##### 象伝：艮まるに敦しの吉は、以て終りを厚くするなり。\n\n/6&"},"001011":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/053.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：漸は女の帰ぐに男を待ちて行くなり**\n\n#### 序\n**序卦伝：艮とは、止まるなり。物は以て止まるに終る可からず。故に之を受くるに漸を以てす。**","text.tab3":"&0&\n**漸は、女帰ぐに吉。貞に利ろし。**\n**象伝：山の上に木あるは漸。君子以て賢徳に居りて俗を善くす。**\n\n/0&\n#### 彖\n\n**彖伝：漸は之き進むなり。女の帰ぐに吉なり。進みて位を得、往きて功あるなり。進むに正を以てし、以て邦を正すべきなり。其の位剛にして中を得るなり。止まりて巽い、動きて窮まらざるなり。**\n\n#### 爻\n\n&1&\n##### 初爻：鴻、于に漸む。小子厲うし。言有るも咎なし。\n\n##### 象伝：小子厲うきは、義として咎なきなり。\n\n/1&\n\n&2&\n##### 二爻：鴻、磐に漸む。飲食衎衎たり。吉。\n\n##### 象伝：飲食衎衎たるは、素飽せざるなり。\n\n/2&\n\n&3&\n##### 三爻：鴻、陸に漸む。夫征きて復らず。婦孕みて育わず。凶なり。寇を禦ぐに利ろし。\n\n##### 象伝：夫征きて復らざるは、羣醜を離るるなり。婦孕みて育わざるは、其の道失うなり。用て寇を禦ぐに利ろしきは、順にして相い保つなり。\n\n/3&\n\n&4&\n##### 四爻：鴻、木に漸む。或いは其の桷を得。咎なし。\n\n##### 象伝：或いは其の桷を得るは、順みて以て巽うなり。\n\n/4&\n\n&5&\n##### 五爻：鴻、陵に漸む。婦三歳孕まず。終に之に勝つこと莫し。吉。\n\n##### 象伝：終に之に勝つこと莫き吉は、願う所を得るなり。\n\n/5&\n\n&6&\n##### 上爻：鴻、逵に漸む。其の羽用て儀となすべし。吉。\n\n##### 象伝：其の羽用て儀となすべき吉は、乱すべからざるなり。\n\n/6&"},"110100":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/054.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：帰妹は女の終わりなり**\n\n#### 序\n**序卦伝：漸とは、進むなり。進めば必ず帰する所あり。故に之を受くるに帰妹を以てす。**","text.tab3":"&0&\n**帰妹。征けば凶。利ろしき攸なし。**\n**象伝：澤の上に雷あるは帰妹。君子以て終りを永くし敝れを知る。**\n\n/0&\n#### 彖\n\n**彖伝：帰妹は、天地の大義なり。天地交らずして万物興らず。\n帰妹は人の終始なり。説びて以て動き、帰ぐ所のものは妹なり。征けば凶なるは、位当たらざるなり。利ろしき攸なしとは、柔・剛に乗ればなり。**\n\n#### 爻\n\n&1&\n##### 初爻：帰妹娣を以てす。跛能く履む。征きて吉。\n\n##### 象伝：帰妹娣を以てするは、以て恒あるなり。跛能く履むの吉は、相い承くるなり。\n\n/1&\n\n&2&\n##### 二爻：眇能く視る。幽人の貞に利ろし。\n\n##### 象伝：幽人の貞に利ろしきは、未だ常を変ぜざるなり。\n\n/2&\n\n&3&\n##### 三爻：帰妹須を以てす。反り帰ぐに娣を以てす。\n\n##### 象伝：帰妹須を以てするは、未だ当たらざるなり。\n\n/3&\n\n&4&\n##### 四爻：帰妹期を愆ぐ。帰ぐを遅ちて時有らん。\n\n##### 象伝：期を愆ぐるの志は、待つこと有りて行くなり。\n\n/4&\n\n&5&\n##### 五爻：帝乙妹を帰がしむ。其の君の袂は、其の娣の袂の良きに如かず。月望に幾し。吉。\n\n##### 象伝：帝乙妹を帰がしむ。其の娣の袂の良きに如かざるなりとは、其の位中に在り、貴きを以て行くなり。\n\n/5&\n\n&6&\n##### 上爻：女筐を承けて実なし。士羊を刲きて血なし。利ろしき攸なし。\n\n##### 象伝：上六の実なきは、虚筐を承くるなり。\n\n/6&"},"101100":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/055.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：豊は故多きなり**\n\n#### 序\n**序卦伝：其の帰する所を得る者は、必ず大なり。故に之を受くるに豊を以てす。**","text.tab3":"&0&\n**豊は亨る。王之に假る。憂うる勿れ、日中に宜し。**\n**象伝：雷電皆至るは豊。君子以て獄を折め刑を致す。**\n\n/0&\n#### 彖\n\n**彖伝：豊は、大なり。明にして以て動く、故に豊かなり。王之に假るとは、大を尚ぶなり。憂うる勿れ、日中に宜しとは、宜しく天下を照らすべきなり。日・中すれば則ち昃き、月盈つれば則ち食す。天地の盈虚は、時と與に消息す。而るを況んや人に於いてをや、況んや鬼神に於いてをや。**\n\n#### 爻\n\n&1&\n##### 初爻：其の配主に遇う。旬しと雖も咎なし。往きて尚ばるる有り。\n\n##### 象伝：旬と雖も咎なきは、旬きを過ぐれば災いなり。\n\n/1&\n\n&2&\n##### 二爻：其の蔀を豊いにす。日中斗を見る。往きて疑疾を得。孚有りて発若たれば吉。\n\n##### 象伝：孚有りて発若たるは、信以て志を発するなり。\n\n/2&\n\n&3&\n##### 三爻：其の沛を豊いにす。日中沫を見る。其の右肱を折る。咎なし。\n\n##### 象伝：其の沛を豊いにするは、大事に可ならざるなり。其の右肱を折るは、終に用うべからざるなり。\n\n/3&\n\n&4&\n##### 四爻：其の蔀を豊いにす。日中斗を見る。其の夷主に遇う。吉。\n\n##### 象伝：其の蔀を豊いにするは、位当らざればなり。日中斗を見るは、幽くして明らかならざるなり。其の夷主に遇う吉は、行けばなり。\n\n/4&\n\n&5&\n##### 五爻：章を来す。慶誉あり。吉。\n\n##### 象伝：六五の吉は、慶び有るなり。\n\n/5&\n\n&6&\n##### 上爻：其の屋を豊いにし、其の家を蔀う。其の戸を闚えば、闃として其れ人なし。三歳覿ず。凶。\n\n##### 象伝：其の屋を豊いにするは、天際翔けるなり。其の戸を闚えば闃として其れ人なきは、自ら蔵るるなり。\n\n/6&"},"001101":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/056.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：親しみ寡きは旅なり**\n\n#### 序\n**序卦伝：豊とは、大なり。大を窮むる者は、必ず其の居を失う。故に之を受くるに旅を以てす。**","text.tab3":"&0&\n**旅は、小しく亨る。旅は貞にして吉。**\n**象伝：山上に火あるは旅。君子以て明らかに慎みて刑を用い、獄を留めず。**\n\n/0&\n#### 彖\n\n**彖伝：旅は、小しく亨る。柔・中を外に得て、剛に順う。止まりて明に麗く。是を以て小しく亨る。旅は貞にして吉なり。旅の時義大いなる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：旅、瑣瑣たり。斯れ其の災いを取る所。\n\n##### 象伝：旅、瑣瑣たるは、志窮するの災いなり。\n\n/1&\n\n&2&\n##### 二爻：旅、次に即き、其の資を懐き、童僕の貞を得。\n\n##### 象伝：童僕の貞を得るは、終に尤なきなり。\n\n/2&\n\n&3&\n##### 三爻：旅、其の次を焚く。其の童僕の貞を喪う。厲うし。\n\n##### 象伝：旅、其の次を焚くは、亦傷まし。旅を以て下に與す、其の義喪うなり。\n\n/3&\n\n&4&\n##### 四爻：旅、于に處る。其の資斧を得。我が心快からず。\n\n##### 象伝：旅、于に處るは、未だ位を得ざるなり。其の資斧を得るも、心未だ快からざるなり。\n\n/4&\n\n&5&\n##### 五爻：雉を射て一矢亡う。終に以て誉命あり。\n\n##### 象伝：終に以て誉命あるは、上に逮ぶなり。\n\n/5&\n\n&6&\n##### 上爻：鳥其の巣を焚く。旅人先には笑い、後には號き咷ぶ。牛を易に喪う。凶。\n\n##### 象伝：旅を以て上に在り。其の義焚くなり。牛を易に喪うは、終に之を聞くこと莫きなり。\n\n/6&"},"011011":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/057.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：巽は伏するなり**\n\n#### 序\n**序卦伝：旅して容るる所无し。故に之を受くるに巽を以てす。**","text.tab3":"&0&\n**巽は、小しく亨る。往く攸有るに利ろし。大人を見るに利ろし。**\n**象伝：随風は巽。君子以て命を申ね事を行なう。**\n\n/0&\n#### 彖\n\n**彖伝：重巽以て命を申ねる。剛・中正に巽いて志行なわれ、柔皆剛に順う。是を以て小しく亨り、往く攸有るに利ろしく、大人を見るに利ろし。**\n\n#### 爻\n\n&1&\n##### 初爻：進退す。武人の貞に利ろし。\n\n##### 象伝：進退するは、志疑うなり。武人の貞に利ろしきは、志治まるなり。\n\n/1&\n\n&2&\n##### 二爻：巽いて牀下に在り。史巫を用う。紛若たるも吉にして咎なし。\n\n##### 象伝：紛若たるの吉は、中を得るなり。\n\n/2&\n\n&3&\n##### 三爻：頻りに巽う。吝。\n\n##### 象伝：頻りに巽うの吝は、志窮するなり。\n\n/3&\n\n&4&\n##### 四爻：悔い亡ぶ。田して三品を獲。\n\n##### 象伝：田して三品を獲るは、功有るなり。\n\n/4&\n\n&5&\n##### 五爻：貞なれば吉、悔い亡ぶ。利ろしからざるなし。初めなくして終り有り。庚に先だつ三日、庚に後れること三日。吉。\n\n##### 象伝：九五の吉は、位正中なればなり。\n\n/5&\n\n&6&\n##### 上爻：巽いて牀下に在り、其の資斧を喪う。貞しけれども凶。\n\n##### 象伝：巽いて牀下に在るは、上窮まるなり。其の資斧を喪うは正しきや、凶なり。\n\n/6&"},"110110":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/058.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：兌は見われて**\n\n#### 序\n**序卦伝：巽とは、入るなり。入りて而る後に之を説ぶ。故に之を受くるに兌を以てす。**","text.tab3":"&0&\n**兌は、亨る。貞に利ろし。**\n**象伝：麗澤は兌。君子以て朋友講習す。**\n\n/0&\n#### 彖\n\n**彖伝：兌は説なり。剛中にして柔外。説びて以て貞に利ろし。是を以て天に順い人に応ず。\n説びて以て民に先だてば、民其の労を忘れる。\n説びて以て難を犯せば、民其の死を忘れる。説びの大いなる、民勧むる哉。**\n\n#### 爻\n\n&1&\n##### 初爻：和して兌ぶ。吉。\n\n##### 象伝：和して兌ぶの吉は、行ないて未だ疑われざるなり。\n\n/1&\n\n&2&\n##### 二爻：孚にして兌ぶ。吉。悔い亡ぶ。\n\n##### 象伝：孚にして兌ぶの吉は、志を信にするなり。\n\n/2&\n\n&3&\n##### 三爻：来りて兌ぶ。凶。\n\n##### 象伝：来りて兌ぶの凶は、位当たらざるなり。\n\n/3&\n\n&4&\n##### 四爻：商りて兌ぶ。未だ寧からず。疾を介て喜び有り。\n\n##### 象伝：九四の喜びは、慶有るなり。\n\n/4&\n\n&5&\n##### 五爻：剥に孚す。厲うき有り。\n\n##### 象伝：剥に孚するは、位正しく当たればなり。\n\n/5&\n\n&6&\n##### 上爻：引かれて兌ぶ。\n\n##### 象伝：上六の引かれて兌ぶは、未だ光いならざるなり。\n\n/6&"},"010011":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/059.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：渙は離るるなり**\n\n#### 序\n**序卦伝：兌とは説ぶなり。説びて而る後に之を散らす。故に之を受くるに渙を以てす。**","text.tab3":"&0&\n**渙は、亨る。王有廟に假る。大川を渉るに利ろし。貞に利ろし。**\n**象伝：風・水上を行くは渙。先王以て帝を享し廟を立つ。**\n\n/0&\n#### 彖\n\n**彖伝：渙は亨るとは、剛来りて窮まらず、柔位を外に得て上同じくす。王有廟に假るとは、王すなわち中に在るなり。大川を渉るに利ろしとは、木に乗りて功あるなり。**\n\n#### 爻\n\n&1&\n##### 初爻：用て拯う。馬壮んなれば吉。\n\n##### 象伝：初六の吉は、順なればなり。\n\n/1&\n\n&2&\n##### 二爻：渙の時、其の机に奔る。悔い亡ぶ。\n\n##### 象伝：渙の時、其の机に奔るは、願いを得るなり。\n\n/2&\n\n&3&\n##### 三爻：其の躬を渙らす。悔いなし。\n\n##### 象伝：其の躬を渙らすは、志外に在るなり。\n\n/3&\n\n&4&\n##### 四爻：其の羣を渙らす。元いに吉。渙らして丘る有り。夷の思う所に匪ず。\n\n##### 象伝：其の羣を渙らして元いに吉は、光大なればなり。\n\n/4&\n\n&5&\n##### 五爻：其の大號を汗にす。王居を渙らして咎なし。\n\n##### 象伝：王居の咎なきは、正位なればなり。\n\n/5&\n\n&6&\n##### 上爻：其の血を渙らす。去りて逖く出づ。咎なし。\n\n##### 象伝：其の血を渙らすは、害に遠ざかるなり。\n\n/6&"},"110010":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/060.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：節は止まるなり**\n\n#### 序\n**序卦伝：渙とは、離るるなり。物は以て離るるに終わる可からず。故に之を受くるに節を以てす。**","text.tab3":"&0&\n**節は、亨る。苦節は貞にすべからず。**\n**象伝：澤の上に水あるは節。君子以て数度を制し、徳行を議す。**\n\n/0&\n#### 彖\n\n**彖伝：節は亨るとは、剛柔分れて剛中を得ればなり。苦節は貞にすべからずとは、其の道窮すればなり。\n説びて以て険を行ない、位に当たり以て節あり、中正にして以て通ず。天地は節ありて四時成る。節して以て度を制し、財を傷らず民を害せず。**\n\n#### 爻\n\n&1&\n##### 初爻：戸庭を出でず。咎なし。\n\n##### 象伝：戸庭を出でざるは、通塞を知ればなり。\n\n/1&\n\n&2&\n##### 二爻：門庭を出でず。凶。\n\n##### 象伝：門庭を出でず凶なるは、時を失う極なり。\n\n/2&\n\n&3&\n##### 三爻：節若たらざれば、則ち嗟若たり。咎なし。\n\n##### 象伝：節せざるの嗟きは、また誰をか咎めん。\n\n/3&\n\n&4&\n##### 四爻：節に安んず。亨る。\n\n##### 象伝：節に安んずるの亨るは、上道を承けるなり。\n\n/4&\n\n&5&\n##### 五爻：節に甘んず。吉。往きて尚ばるる有り。\n\n##### 象伝：節に甘んずるの吉は、位に居りて中なればなり。\n\n/5&\n\n&6&\n##### 上爻：苦節は、貞なれば凶。悔い亡ぶ。\n\n##### 象伝：苦節貞なれば凶とは、其の道窮すればなり。\n\n/6&"},"110011":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/061.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：中孚は信なり**\n\n#### 序\n**序卦伝：節ありて之を信ず。故に之を受くるに中孚を以てす。**","text.tab3":"&0&\n**中孚は、豚魚にして吉。大川を渉るに利ろし。貞に利ろし。**\n**象伝：澤の上に風あるは中孚。君子以て獄を議し死を緩くす。**\n\n/0&\n#### 彖\n\n**彖伝：中孚は柔・内に在り、而して剛・中を得。説びて巽う。孚はすなわち邦を化するなり。豚魚にして吉とは、信豚魚に及ぶなり。大川を渉るに利ろしとは、木に乗りて舟虚なればなり。貞に利ろしとは、すなわち天に応ずるなり。**\n\n#### 爻\n\n&1&\n##### 初爻：虞れば吉。它あれば燕からず。\n\n##### 象伝：初九の虞れば吉。志未だ変ぜざるなり。\n\n/1&\n\n&2&\n##### 二爻：鳴鶴陰に在り。其の子之に和す。我に好爵有り。吾爾と之を靡にせん。\n\n##### 象伝：其の子之に和するは、中心より願うなり。\n\n/2&\n\n&3&\n##### 三爻：敵を得て、或いは鼓し、或いは罷み、或いは泣き、或いは歌う。\n\n##### 象伝：或いは鼓し或いは罷むは、位当たらざればなり。\n\n/3&\n\n&4&\n##### 四爻：月望に幾し。馬匹亡う。咎なし。\n\n##### 象伝：馬匹亡うは、類を絶ちて上るなり。\n\n/4&\n\n&5&\n##### 五爻：孚有りて攣如たり。咎なし。\n\n##### 象伝：孚有りて攣如たるは、位正当なればなり。\n\n/5&\n\n&6&\n##### 上爻：翰音天に登る。貞なれば凶。\n\n##### 象伝：翰音天に登るは、何ぞ長かる可けんや。\n\n/6&"},"001100":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/062.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：小過は過ぐるなり**\n\n#### 序\n**序卦伝：其の信ある者は必ず之を行なう。故に之を受くるに小過を以てす。**","text.tab3":"&0&\n**小過は、亨る。貞に利ろし。小事に可なるも、大事に可ならず。飛鳥之が音を遺す。上るに宜しからず、下るに宜しくして大いに吉なり。**\n**象伝：山上に雷あるは小過。君子以て行ない恭に過ぎ、喪は哀に過ぎ、用は倹に過ぐ。**\n\n/0&\n#### 彖\n\n**彖伝：小過は、小なる者過ぎて亨るなり。過ぎて以て貞に利ろしは、時と與に行なうなり。柔中を得。是を以て小事に吉なり。剛・位失いて中ならず。是を以て大事に可ならざるなり。飛鳥の象あり。飛鳥之が音を遺す、上るに宜しからず、下るに宜しくして大いに吉なりとは、上るは逆にして下るは順なればなり。**\n\n#### 爻\n\n&1&\n##### 初爻：飛鳥以て凶。\n\n##### 象伝：飛鳥以て凶は、如何ともすべからざるなり。\n\n/1&\n\n&2&\n##### 二爻：其の祖を過ぎ、其の妣に遇う。其の君に及ばず、其の臣に遇う。咎なし。\n\n##### 象伝：其の君に及ばざるは、臣に過ぐべからざるなり。\n\n/2&\n\n&3&\n##### 三爻：過ぎずして之を防ぐ、従わば或いは之を戕わん。凶。\n\n##### 象伝：従わば或いは之を戕うは、凶如何にせんや。\n\n/3&\n\n&4&\n##### 四爻：咎なし。過ぎずして之に遇う。往けば厲うし。必ず戒めよ。永貞に用うる勿れ。\n\n##### 象伝：過ぎずして之に遇うは、位当たらざるなり。往けば厲うし必ず戒めよとは、終に長かるべからざるなり。\n\n/4&\n\n&5&\n##### 五爻：密雲雨ふらず。我が西郊よりす。公弋して彼の穴に在るを取る。\n\n##### 象伝：密雲雨ふらざるは、已だ上ればなり。\n\n/5&\n\n&6&\n##### 上爻：遇わずして之に過ぐ。飛鳥之に離る。凶。是を災眚と謂う。\n\n##### 象伝：遇わずして之に過ぎるは、己だ亢るなり。\n\n/6&"},"101010":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/063.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：既済は定まるなり**\n\n#### 序\n**序卦伝：物に過ぐること有る者は必ず済る。故に之を受くるに既済を以てす。**","text.tab3":"&0&\n**既済は、亨るもの小なり。貞に利ろし。初めは吉にして終りは乱る。**\n**象伝：水・火上に在るは既済。君子以て患いを思い予じめ之を防ぐ。**\n\n/0&\n#### 彖\n\n**彖伝：既済は亨るとは、小なる者亨るなり。貞に利ろしとは、剛柔正しくして位当たればなり。初めは吉とは、柔中を得るなり。終りに止まれば則ち乱る。其の道窮まるなり。**\n\n#### 爻\n\n&1&\n##### 初爻：其の輪を曳く。其の尾を濡おす。咎なし。\n\n##### 象伝：其の輪を曳くは、義咎なきなり。\n\n/1&\n\n&2&\n##### 二爻：婦其の茀を喪う。逐うこと勿れ。七日にして得ん。\n\n##### 象伝：七日にして得るは、中道を以てなり。\n\n/2&\n\n&3&\n##### 三爻：高宗鬼方を伐つ。三年にして之に克つ。小人は用うる勿れ。\n\n##### 象伝：三年にして之に克つは、憊るなり。\n\n/3&\n\n&4&\n##### 四爻：繻に衣袽あり。終日戒めよ。\n\n##### 象伝：終日戒むるは、疑う所あるなり。\n\n/4&\n\n&5&\n##### 五爻：東隣の牛を殺すは、西隣の禴祭して、実に其の福を受くるに如かず。\n\n##### 象伝：東隣の牛を殺すは、西隣の時に如かざるなり。実に其の福を受くるは、吉大いに来るなり。\n\n/5&\n\n&6&\n##### 上爻：其の首を濡す。厲うし。\n\n##### 象伝：其の首を濡し厲うきは、何ぞ久しかるべけんや。\n\n/6&"},"010101":{"text.tab1":"#### 図\n![(韓国（かんこく）の「クンニプ・チュンアン・ドソグァン」所蔵の『断易天機』)](assets/guatu_pdf/064.jpg)","text.tab2":"#### 雑\n\n**雑卦伝：未済は男の窮まるなり**\n\n#### 序\n**序卦伝：物は窮まる可からざるなり。故に之を受くるに未済を以てして終わる。**","text.tab3":"&0&\n**未済は、亨る。小狐汔んど済らんとして、其の尾を濡す。利ろしき攸なし。**\n**象伝：火・水上に在るは未済。君子以て慎みて物を辨じ方に居る。**\n\n/0&\n#### 彖\n\n**彖伝：未済は亨るとは、柔中を得るなり。小狐汔んど済らんとするも、未だ中を出でざるなり。其の尾を濡し、利ろしき攸なしとは、終り続かざるなり。位に当たらずといえども、剛柔応ずるなり。**\n\n#### 爻\n\n&1&\n##### 初爻：其の尾を濡す。吝。\n\n##### 象伝：其の尾を濡すは、亦極を知らざるなり。\n\n/1&\n\n&2&\n##### 二爻：其の輪を曳く。貞にして吉。\n\n##### 象伝：九二の貞吉は、中を以て正を行なうなり。\n\n/2&\n\n&3&\n##### 三爻：未済。征けば凶。大川を渉るに利ろし。\n\n##### 象伝：未済征けば凶とは、位当たらざるなり。\n\n/3&\n\n&4&\n##### 四爻：貞にして吉。悔い亡ぶ。震いて用て鬼方を伐つ。三年にして大國に賞有り。\n\n##### 象伝：貞吉悔い亡ぶるは、志行なわるるなり。\n\n/4&\n\n&5&\n##### 五爻：貞にして吉。悔なし。君子の光。孚有りて吉。\n\n##### 象伝：君子の光は、其れ暉きて吉なり。\n\n/5&\n\n&6&\n##### 上爻：飲酒に孚有り。咎なし。其の首を濡せば、孚有るも是を失う。\n\n##### 象伝：酒を飲みて首を濡すは、亦節を知らざるなり。\n\n/6&"}};
const _EMBEDDED_SAVES = [{"digits":[0,0,0,0,0,0],"time":"2026-06-09T17:37:17.521Z","favo":false},{"digits":[8,9,7,9,7,9],"time":"2026-06-16T18:45:37.402Z","shibo":"1:5:7:3","favo":true,"name":"この車はいいですか","note":"The hexagram indicated it's a new car, which was so true... \n\nThe future hexagram gave a clear warning and the moving lines revealed which components to blame."},{"digits":[8,7,8,7,8,8],"time":"2026-06-17T14:24:31.857Z","shibo":"1:5:7:3","favo":true,"name":"解：利西南，無所往，其來復吉，有攸往，夙","note":"제가 번역을 제대로 한 건가요?"},{"digits":[9,8,6,8,8,7],"time":"2026-06-17T22:59:19.784Z","shibo":"1:5:7:3","favo":true,"name":"How Is He?","note":"啊？\n有点意思。。。"},{"digits":[8,8,6,8,8,9],"time":"2026-06-27T22:02:27.028Z","shibo":"1:3:3:1","favo":false,"name":"display","note":"我请易经给一个可以拿来做例子展示在GitHub的卦，随便给什么啦！是什么我就展示什么。\nI asked iching what hexagrams to display on my Github page. I wished it could give a hexagram that contained water, fire, thunder or wind, since I like how blue, red and green look on the app."}];


/// standalone localStorage utilities ///
const _LS_SAVES = 'yc_saves', _LS_CFG = 'yc_config', _LS_HEX_OV = 'yc_hex_ov', _LS_LAST = 'yc_last';
// 防舊版殘留：所有 localStorage 讀取一律容錯 —— 壞 JSON / 型別不符 → 回傳預設值，不炸 boot
function _lsParse(s, def){ try { return s === null ? def : JSON.parse(s); } catch(e){ return def; } }
function _lsLoadSaves(){
  const s = localStorage.getItem(_LS_SAVES);
  if(s !== null){ const v = _lsParse(s, []); return Array.isArray(v) ? v : []; }
  const _def = _EMBEDDED_SAVES || [];
  localStorage.setItem(_LS_SAVES, JSON.stringify(_def));
  return JSON.parse(JSON.stringify(_def));
}
function _lsSave(entry){ const r=_lsLoadSaves(); r.push(entry); localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsFavo(time,favo){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){x.favo=favo;break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsDelete(time){ localStorage.setItem(_LS_SAVES,JSON.stringify(_lsLoadSaves().filter(r=>r.time!==time))); _srcSetClean('saves',false); }
function _lsSetName(time,name){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){x.name=name;break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsUpdateRecord(time,changes){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){Object.assign(x,changes);break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
// 內建回退設定（不含 hexagrams），深拷貝。_EMBEDDED_CONFIG 保證存在且為精簡回退形狀
function _cfgFallback(){ const {hexagrams,...fb}=_EMBEDDED_CONFIG; return JSON.parse(JSON.stringify(fb)); }
// 逐鍵合併：儲存的設定蓋在回退上 —— 舊版設定缺新鍵時由回退補齊，不炸 boot
function _lsGetConfig(){
  const stored = _lsParse(localStorage.getItem(_LS_CFG), null);
  const cfg = (stored && typeof stored==='object' && !Array.isArray(stored)) ? stored : {};

function _esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function _validateCfg(cfg){
  if(typeof cfg !== 'object' || cfg === null || Array.isArray(cfg)) throw new Error('config.json must be a JSON object');
  const ti = cfg.trigrams;
  if(typeof ti !== 'object' || ti === null || Array.isArray(ti)) throw new Error('Missing "trigrams"');
  for(const k of ['000','001','010','011','100','101','110','111']){
    const t = ti[k];
    if(!t) throw new Error(`trigrams missing key "${k}"`);
    if(typeof t.name !== 'string') throw new Error(`trigrams["${k}"] missing "name"`);
    if(t.sym !== undefined && typeof t.sym !== 'string') throw new Error(`trigrams["${k}"] "sym" must be a string`);   // sym 可省（精簡回退無 sym）
    if(typeof t.color!== 'string') throw new Error(`trigrams["${k}"] missing "color"`);
  }
  const tn = cfg.tab_names;
  if(typeof tn !== 'object' || tn === null || Array.isArray(tn)) throw new Error('Missing "tab_names"');
  for(const k of ['tab1','tab2','tab3']){ if(typeof tn[k] !== 'string') throw new Error(`tab_names missing "${k}"`); }
  const sp = cfg.shibo_probs;
  if(typeof sp !== 'object' || sp === null || Array.isArray(sp)) throw new Error('Missing "shibo_probs"');
  const bin = sp.binary;
  if(typeof bin !== 'object' || bin === null || Array.isArray(bin)) throw new Error('shibo_probs missing "binary"');
  for(const k of ['0','1']){ if(typeof bin[k] !== 'number') throw new Error(`shibo_probs.binary missing key "${k}"`); }
  const quat = sp.quaternary;
  if(typeof quat !== 'object' || quat === null || Array.isArray(quat)) throw new Error('shibo_probs missing "quaternary"');
  for(const k of ['6','7','8','9']){ if(typeof quat[k] !== 'number') throw new Error(`shibo_probs.quaternary missing key "${k}"`); }
  // `fallback` / `table` 皆可選；有才驗證（缺省回退 DEFAULT_HIGHLIGHT）
  if(cfg.lit_mode !== undefined && typeof cfg.lit_mode !== 'string')
    throw new Error('"lit_mode" must be a string');
  if(cfg.table !== undefined && (typeof cfg.table !== 'object' || cfg.table === null || Array.isArray(cfg.table)))
    throw new Error('"table" must be an object');
}
function _srcStatus(){
  const def = {md:{clean:false,file:null},cfg:{clean:false,file:null},saves:{clean:false,file:null}};
  try{
    const raw = JSON.parse(localStorage.getItem('yc_src_status')||'{}');
    for(const t of ['md','cfg','saves']){
      if(raw[t]!=null) def[t] = typeof raw[t]==='boolean' ? {clean:raw[t],file:null} : Object.assign(def[t],raw[t]);
    }
  }catch(e){}
  return def;
}
function _srcSetClean(type,clean,file){
  const s=_srcStatus();
  if(clean){
    const d=new Date();
    const mm=String(d.getMonth()+1).padStart(2,'0');
    const dd=String(d.getDate()).padStart(2,'0');
    const hh=String(d.getHours()).padStart(2,'0');
    const mi=String(d.getMinutes()).padStart(2,'0');
    const yr=d.getFullYear();
    const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dateStr=LANG==='en'?`${hh}:${mi} ${dd}/${MON[d.getMonth()]}/${yr}`:`${yr}-${mm}-${dd} ${hh}:${mi}`;
    s[type]={clean,file:file||null,date:dateStr};
  } else {
    s[type]={clean,file:null,date:null};
  }
  localStorage.setItem('yc_src_status',JSON.stringify(s)); _srcRender();
}
function _srcRender(){

    });
  });
}

// 歷史記錄 dropdown 操作
let _saveRecords = [];
/// 搜尋 dropdown（#saveDropdownUp）///

// 比對優先序：卦號 > 卦名 > 爻列 > 卦符 > 簡稱 > 卦爻辭 >> tab1 > tab2 > tab3
const _SR_FIELDS = ['num','name','sequence','symbol','short_name','ci','text.tab1','text.tab2','text.tab3'];
const _SR_MAX = 64;   // 最多顯示的建議數
const _SR_PAD = 18;   // 摘要中比對位置前後保留的字元數
let _srIndex = null;  // 延遲建立：只有真的搜尋時才掃描
let _srTblIndex = null;  // table.text 的獨立索引（見 _srTblBuild）
let _srResults = [];
let _srSel = -1;

// 去除 markdown 標記，讓摘要顯示為純文字
function _srStrip(s){
  return String(s)
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')          // 圖片
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')       // 連結
    .replace(/&&([\s\S]+?)\/&/g, '$1')             // && … /&
    .replace(/\{([^|{}]+)\|[^|{}]+\}/g, '$1')      // {底字|注音}
    .replace(/^[&/]\d+&\s*$/gm, '')                // &0& / /0& 爻段標記
    .replace(/^#{1,6}\s*/gm, '')                   // 標題
    .replace(/^>\s?/gm, '')                        // 引言
    .replace(/^•\s*/gm, '')                        // 條列
    .replace(/\*\*/g, '')                          // 粗體標記
    .replace(/\s+/g, ' ')
    .trim();
}

// 建立索引一次（~1ms）；欄位內容變動時以 _srInvalidate() 作廢
function _srBuild(){
  _srIndex = Object.values(_HEX_BY_NUM).map(d => {
    const raw = _SR_FIELDS.map(f => {
      if(f === 'num') return String(d.num);
      if(f === 'ci')  return (Array.isArray(d.ci) ? d.ci.join(' ') : (d.ci || '')).replace(/\s+/g, ' ').trim();
      if(f.startsWith('text.')) return _srStrip(d[f] || '');   // 先去標記，位移才對得上
      return d[f] || '';
    });
    return { d, raw, low: raw.map(s => s.toLowerCase()) };
  });
}
function _srInvalidate(){ _srIndex = null; _srTblIndex = null; }

// table.text 索引。與上面的索引不同，它以「四進制狀態」為單位而非以卦為單位：
// 同一本卦有 64 種狀態，各自可帶一段文字，所以一卦可命中多列。
// 由 HIGHLIGHT.table 取得（即當前 config 的 table），內容變動時同樣走 _srInvalidate()。
function _srTblBuild(){
  const t = (HIGHLIGHT && HIGHLIGHT.table) || null;
  _srTblIndex = [];
  if(!t) return;
  for(const key of Object.keys(t)){
    const txt = _srStrip((t[key] && t[key].text) || '');
    if(txt) _srTblIndex.push({ key, raw: txt, low: txt.toLowerCase() });
  }
}
// 狀態鍵 → 本卦爻列：7/9 為陽，6/8 為陰（索引 0 = 初爻，與 sequence 同序）
const _srBenSeq = key => [...key].map(c => (c === '7' || c === '9') ? '1' : '0').join('');

// 第一輪：每卦只取「最高優先」的一個命中。
// 第二輪：前面沒填滿 _SR_MAX 時，才補 table.text（優先序最低，見 srPick 的載入方式）。
function _srSearch(q){
  if(!q) return [];
  if(!_srIndex) _srBuild();
  const ql = q.toLowerCase();
  const out = [];
  for(const e of _srIndex){
    for(let r = 0; r < _SR_FIELDS.length; r++){
      const pos = e.low[r].indexOf(ql);
      if(pos >= 0){ out.push({ d: e.d, rank: r, pos, text: e.raw[r] }); break; }
    }
  }
  // 同欄位時，越靠前的命中越相關（如卦號 "1" 完全相符排在 "21" 之前）
  out.sort((a, b) => a.rank - b.rank || a.pos - b.pos || a.d.num - b.d.num);
  if(out.length >= _SR_MAX) return out.slice(0, _SR_MAX);
  if(!_srTblIndex) _srTblBuild();
  const tbl = [];
  for(const e of _srTblIndex){
    const pos = e.low.indexOf(ql);
    if(pos >= 0) tbl.push({ tbl: true, key: e.key, d: _HEX_BY_SEQ[_srBenSeq(e.key)] || null, pos, text: e.raw });
  }
  tbl.sort((a, b) => a.pos - b.pos || (a.key < b.key ? -1 : 1));
  return out.concat(tbl).slice(0, _SR_MAX);
}

// 命中位置前後開窗，並標示命中字串
function _srSnippet(text, pos, len){
  const s = Math.max(0, pos - _SR_PAD);
  const e = Math.min(text.length, pos + len + _SR_PAD);
  return (s > 0 ? '…' : '') + _esc(text.slice(s, pos))
       + '<span class="sr-hit">' + _esc(text.slice(pos, pos + len)) + '</span>'
       + _esc(text.slice(pos + len, e)) + (e < text.length ? '…' : '');
}

// 欄位標籤：tab 欄位沿用使用者在 config 自訂的頁籤名稱
function _srFieldLabel(field){
  if(field.startsWith('text.')) return TAB_NAMES[field.slice(5)] || field;
  return T('search.f.' + field);
}

function _srRowsHTML(q){
  if(!q) return `<div class="dd-hint">${_esc(T('search.hint'))}</div>`;
  if(!_srResults.length) return `<div class="sr-none">${_esc(T('search.none'))}</div>`;
  return _srResults.map((r, i) => {
    const field = r.tbl ? null : _SR_FIELDS[r.rank];
    // 卦號/卦名/卦符/簡稱已在標題行顯示，不再重複摘要；爻列、內文與查表才給摘要
    const showSnip = r.tbl || field === 'sequence' || field === 'ci' || field.startsWith('text.');
    const snip = showSnip
      ? `<span class="sr-snip">${_srSnippet(r.text, r.pos, q.length)}</span>` : '';
    // 查表列以狀態為單位，狀態鍵併進欄位標籤顯示（同一本卦可能出現多列）
    const label = r.tbl ? T('search.f.table') + ' ' + r.key : _srFieldLabel(field);
    return `<div class="sr-row${i === _srSel ? ' sel' : ''}" onclick="srPick(${i})">`
         + `<span class="sr-sym">${_esc(r.d ? (r.d.symbol || '') : '?')}</span>`
         + `<span class="sr-main"><span class="sr-head">`
         + `<span class="sr-num">${r.d ? String(r.d.num).padStart(2, '0') : '??'}</span>`
         + `<span class="sr-name">${_esc(r.d ? (r.d.name || '') : '?')}</span>`
         + `<span class="sr-field">${_esc(label)}</span>`
         + `</span>${snip}</span></div>`;
  }).join('');
}

// 重繪建議列表；保留輸入框本身，不動游標
function _srRenderResults(){
  const inp = document.getElementById('srInput');
  const body = document.querySelector('#saveDropdownUp .dd-body');
  if(!inp || !body) return;
  const q = inp.value.trim();
  _srResults = _srSearch(q);
  if(_srSel >= _srResults.length) _srSel = -1;
  body.innerHTML = _srRowsHTML(q);
}

function _srMove(delta){
  if(!_srResults.length) return;
  _srSel = mod(_srSel + delta, _srResults.length);
  const body = document.querySelector('#saveDropdownUp .dd-body');
  body.querySelectorAll('.sr-row').forEach((el, i) => el.classList.toggle('sel', i === _srSel));
  const sel = body.querySelector('.sr-row.sel');
  if(sel) sel.scrollIntoView({ block: 'nearest' });
}

// 載入所選卦：走 _applyDigits（會自行切換二進制/四進制）
function srPick(i){
  const r = _srResults[i];
  if(!r) return;
  closeSaveDropdown();
  if(stateLocked){ setMsg(T('msg.load_locked'), 'error'); return; }
  // 查表命中對應的是一個完整的四進制狀態，直接載入該狀態（含變爻），
  // 使用者才看得到搜到的那段文字；只載本卦是看不到的。
  // 查表文字顯示在卦象頁，所以載入後切過去。狀態鍵一定是 6/7/8/9，_applyDigits
  // 必然切到 quaternary，卦象頁必然可用，因此這裡放在最後（不必像下面那樣搶在前面）。
  if(r.tbl){ _applyDigits([...r.key].map(Number)); setTab('guaxiang'); flashBtn('btnSearch'); return; }
  const field = _SR_FIELDS[r.rank];
  // 命中在某頁籤的內文 → 先切到該頁籤，讓使用者直接看到搜到的那段文字。
  // 必須在 _applyDigits 之前：其後的 doQuery → applyTabAvailability 會依新卦的
  // 頁籤可用性自動修正（該頁若對新卦不可用，會回退到可用的頁籤）。
  if(field.startsWith('text.')) setTab(field.slice(5));
  _applyDigits([...r.d.sequence].map(Number));
  flashBtn('btnSearch');
}

function renderUpperDropdown(){
  const up = document.getElementById('saveDropdownUp');
  const prev = document.getElementById('srInput');
  const q = prev ? prev.value : '';   // 換語言時保留已輸入的關鍵字
  up.innerHTML = `<div class="dd-title">${_esc(T('dd.search_title'))}</div>`
    + `<div class="dd-search-bar"><input class="dd-up-input" id="srInput" type="text" autocomplete="off" placeholder="${_esc(T('search.placeholder'))}"></div>`
    + `<div class="dd-body"></div>`;
  const inp = document.getElementById('srInput');
  inp.value = q;
  inp.addEventListener('input', () => { _srSel = -1; _srRenderResults(); });
  inp.addEventListener('keydown', e => {
    if(e.key === 'ArrowDown'){ e.preventDefault(); _srMove(1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); _srMove(-1); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(_srResults.length) srPick(_srSel < 0 ? 0 : _srSel); }
    else if(e.key === 'Escape'){ closeSaveDropdown(); }
  });
  _srRenderResults();
}

// 八卦显示 及上下标识更新函数，基于当前 state 或 state_0（取决于 bitRowMode）
function updateTrigrams(){
  const src = bitRowMode==='quaternary' ? state_0 : state;
  const lower=src.slice(0,3).join(""), upper=src.slice(3,6).join("");
  [['upper',upper],['lower',lower]].forEach(([pfx,bits])=>{
    // 缺資料防護：短字串 → '?'，顏色 → var(--c-accent)
    const t = (TRIGRAM_INFO||{})[bits] || {};
    const color = t.color || 'var(--c-accent)';
    const charEl = document.getElementById(pfx+'Char');
    charEl.textContent = t.name ?? '?'; charEl.style.color = color;
    charEl.parentElement.style.setProperty('--tri-color', color);
    const fields = (TAB_FIELDS||{})[currentTab] || [];
    ['Num','Thing'].forEach((id,i)=>{
      const el = document.getElementById(pfx+id);
      el.textContent = t[fields[i]] ?? '?'; el.style.color = color;
    });
  });
}

// binary → quaternary：將 {0,1} 映射為靜爻 {8,7}（陰靜=8 陽靜=7），再派生 state_0/state_1
// quaternary → binary：以 state_0（本卦）還原為 {0,1}
function setBitRowMode(m){
  bitRowMode = m;
  if(m === 'quaternary'){
    for(let i=0;i<6;i++) state[i] = state[i] ? 7 : 8;
    deriveState01();
  } else {
    for(let i=0;i<6;i++) state[i] = state_0[i];
    guaxiangSlots = null;
  }
}

function setMsg(text, type){

  el.innerHTML = text ? '<span>'+text+'</span>' : '';
