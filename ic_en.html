 and seeming to sigh, yet nowhere finding any advantage. If he go forward, he will not err, though there may be some small cause for regret. The third line, undivided, shows its subject ascending upwards (as into) an empty city.\n\n##### Symbol: ‘He walks with difficulty:’—but his steps have not yet been drawn (into the course of the first line).\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows its subject with his wallet, but no fish in it. This will give rise to evil. The fourth line, undivided, shows its subject in such a state that, if he be greatly fortunate, he will receive no blame. The fourth line, divided, shows its subject employed by the king to present his offerings on mount Ai. There will be good fortune; there will be no mistake.\n\n##### Symbol: ‘The evil’ indicated by there being ‘no fish in the wallet’ is owing to (the subject of the line) keeping himself aloof from the people.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, (shows its subject as) a medlar tree overspreading the gourd (beneath it). If he keep his brilliant qualities concealed, (a good issue) will descend (as) from Heaven. The fifth line, undivided, shows the union (of all) under its subject in the place of dignity. There will be no error. If any do not have confidence in him, let him see to it that (his virtue) be great, longcontinued, and firmly correct, and all occasion for repentance will disappear. The fifth line, divided, shows its subject firmly correct, and therefore enjoying good fortune. He ascends the stairs (with all due ceremony).\n\n##### Symbol: ‘The subject of the fifth line, undivided, keeps his brilliant qualities concealed :’—as is indicated by his central and correct position.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, shows its subject receiving others on his horns. There will be occasion for regret, but there will be no error. XLIV. The single, divided, line at the top of Kwai, the hexagram of the third month, has been displaced, and Kien has ruled over the fourth month of the year. But the innings of the divided line commence again; and here we have in K4u the hexagram of the fifih month, when light and heat are supposed both to begin to be less. In that divided line Win saw the symbol of the small or unworthy man, beginning to insinuate himself into the government XLV. Tue 3H8u1 HEXAGRAM. In (the state denoted by) 3hui, the king will repair to his ancestral temple. It will be advanof the country. His influence, if unchecked, would go on to grow, and he would displace one good man after another, and fill the vacant seats with others like-minded with himself. The object of Wan in his Thwan, therefore, was to enjoin resistance to the encroachment of this bad man. K 4u is defined as giving the idea of suddenly and casually encountering or meeting with. So does the divided line appear all at once in the figure. And this significance of the name rules in the interpzetation of the lines, so as to set on one side the more common interpretation of them according to the correlation ; showing how the meaning of the figures was put into them from the minds of Wan and Tan in the first place. The sentiments of the The topmost line, divided, shows its subject sighing and weeping; but there will be no error. XLV. 3hui denotes collecting together, or things so collected ; and hence this hexagram concerns the state of the kingdom when a happy union prevails between the sovereign and his ministers, between high and low ; and replies in a vague way to the question how this state is to be preserved; by the influence of religion, and the great man, who is a sage upon the throne. The sixth line, divided, shows its subject advancing upwards blindly. Advantage will be found in a ceaseless maintenance of firm correctness. its subject there may be expected the full realisation of the idea of the hexagram.\n\n##### Symbol: ‘He receives others on his horns:’—he is exhausted at his greatest height, and there will be cause for regret.\n\n/6&"},"000110":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/045.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Good men in Cui collect; in Sheng they rise.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Cui denotes being collected. When (good men) are collected and mount to the highest places, there results what we call an upward advance; and hence Cui is followed by Sheng.**","text.tab3":"&0&\n**Gathering Together (Cui): In (the state denoted by) Cuì, the king will repair to his ancestral temple. It will be advantageous (also) to meet with the great man; and then there will be progress and success, though the advantage must come through firm correctness. The use of great victims will conduce to good fortune; and in whatever direction movement is made, it will be advantageous.**\n**Great Symbol: (The trigram representing the) earth and that for the waters of a marsh raised above it form 3hui. The superior man, in accordance with this, has his weapons of war put in good repair, to be prepared against unforeseen contingencies.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): 3hui indicates (the condition of union, or) being collected. We have in it (the symbol of) docile obedience going on to (what is expressed by that of) satisfaction. There is the strong line in the central place, and rightly responded to. Hence comes the (idea of) union. 2. ‘ The king will repair to his ancestral temple :’—\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘In consequence disorder is brought into the sphere of his union:’—his mind and aim are thrown into confusion.\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘ He is led forward ; there will be good fortune, and freedom from error:’—(the virtue proper to) his central place has not undergone any change.\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘If he go forward, he will not err:’—in the subject of the topmost line there is humility and condescension.\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘If he be grandly fortunate, he will receive no blame :’—(this condition is necessary, because) his position is not the one proper to him.\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘There is the union (of all) under him in the place of dignity :-—(but) his mind and aim have not yet been brilliantly displayed.\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘He sighs and weeps:’—he does not yet rest in his topmost position.\n\n/6&"},"011000":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/046.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Good men in Cui collect; in Sheng they rise.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): When such advance continues without stopping, there is sure to come distress; and hence Sheng is followed by Kun.**","text.tab3":"&0&\n**Pushing Upward (Sheng): Shēng indicates that (under its conditions) there will be great progress and success. Seeking by (the qualities implied in it) to meet with the great man, its subject need have no anxiety. Advance to the south will be fortunate.**\n**Great Symbol: (The trigram representing) wood and that for the earth with the wood growing in the midst of it form Shang. The superior man, in accordance with this, pays careful attention to his virtue, and accumulates the small developments of it till it is high and great.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): (We find) the weak (line), as it finds the opportunity, ascending upwards. 2. We have (the attribute) of flexibility and that of obedience; we have the strong line (below) and its proper correlate above:—these things indicate that there will be ‘great progress and success.’\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘He is welcomed in his advance upwards, and there will be great good fortune :’'—(the subjects of) the upper (trigram) are of the same mind with him.\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘The sincerity of the subject of the second line, undivided,’ affords occasion for joy.\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘He advances upwards (as into) an empty city :'— he has no doubt or hesitation.\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘The king employs him to prevent his offerings on mount /cAi :’—such a service (of spiritual Beings) is according to (their mind).\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘He is firmly correct, and will therefore enjoy good fortune. He ascends the stairs (with all due ceremony) :—he grandly succeeds in his aim.\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘He blindly advances upwards, and is in the highest place :—but there is decay in store for him, and he will not (preserve) his riches.\n\n/6&"},"010110":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/047.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Progress in Jing in Kun encounters blight.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): When distress is felt in the height (that has been gained), there is sure to be a return to the ground beneath; and hence Kun is followed by Jing.**","text.tab3":"&0&\n**Oppression (Kun(Oppression)): In (the condition denoted by) Khw&n there may (yet be) progress and success. For the firm and hexagram, it shows him to be possessed of modesty and force. Then the ruler’s seat, the fifth place, is occupied by a divided line, indicating that he will welcome the advance of 2. The officer therefore both has the qualities that fit him to advance, and a favourable opportunity to do so. The result of his advance will be fortunate. It is said that after he has met with the ruler, ‘the great man’ in 5, ‘advance to the south will be fortunate.’ AQ Hsi and other critics say that ‘advancing to the south’ is equivalent simply to ‘advancing forwards.’ The south is the region of brightness and warmth; advance towards it will be a joyful progress. As P. Regis explains the phrase, the traveller will proceed ‘ via recta simillima illi qua itur ad austrates felicesque plagas.’ Line 1 is weak, where it should be strong; its subject, that is, is humble and docile. Those above him, therefore, welcome his advance. Another interpretation of the line is suggested by Appendix I; which deserves consideration. As the first line of Sun, moreover, it may be supposed to concentrate in itself its attribute of docility, and be the lord of the trigram. See on the second line of 3hui. Line 2 is strong, and the weak 5 is its proper correlate. We have a strong officer serving a weak ruler ; he could not do so unless he were penetrated with a sincere and devoted loyalty. Paragraph 3 describes the boldness and fearlessness of the advance of the third line. According to the Khang-hsi editors, who, I think, are right, there is a shade of condemnation in the line. Its subject is too bold. Line 4 occupies the place of a great minister, in immediate contiguity to his ruler, who confides in him, and raises him to the highest distinction as a feudal prince. The mention of mount (16] - correct, the (really) great man, there will be good fortune. He will fall into no error. If he make speeches, his words cannot be made good.**\n**Great Symbol: (The trigram representing) a marsh, and (below it that for a defile, which has drained the other dry so that there is) no water in it, form Khwan. The superior man, in accordance with this, will sacrifice his life in order to carry out his purpose.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In KhwAn (we see) the strong (lines) covered and obscured (by the weak). 2. We have in it (the attribute of) perilousness going on to that of satisfaction. Who is it but the superior man that, though straitened, still does not fail in making progress to his proper end?\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows its subject with bare buttocks straitened under the stump of a tree. He enters a dark valley, and for three years has no prospect (of deliverance). The first line, divided, shows a well so muddy that men will not drink of it; or an old well to which neither birds (nor other creatures) resort.\n\n##### Symbol: ‘He enters a dark valley:’'—so benighted is he, and without clear vision.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows its subject straitened amidst his wine and viands. There come to him anon the red knee-covers (of ‘the ruler). It will be well for him (to maintain his sincerity as) in sacrificing. Active operations (on his part) will lead to evil, but he will be free from blame. The second line, undivided, shows a well from which by a hole the water escapes and flows away to the shrimps (and such small creatures among the grass), or one the water of which leaks away from a broken basket.\n\n##### Symbol: ‘He is straitened amidst his wine and viands :’'—(but) his position is central, and there will be ground for congratulation.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, divided, shows its subject straitened before a (frowning) rock. He lays hold of thorns. He enters his palace, and does not see his wife. There will be evil. The third line, undivided, shows a well, which has been cleared out, but is not used. Our hearts are sorry for this, for the water might be drawn out and used. If the king were (only) intelligent, both he and we might receive the benefit of it. common sympathy, the subject of 5 will have a measure of success. So the symbolism of this line has been explained,—not very satisfactorily. Line 5 is repressed by 6, and pressed on by 4. Above and below its subject is wounded. Especially is he straitened by the minister in 4, with his scarlet knee-covers. But the upper trigram is Tui, with the quality of complacent satisfaction. And this indicates, it is said, that the subject of 5 gets on notwithstanding his straits, especially by his sincerity. This explanation is not more satisfactory than the last.\n\n##### Symbol: ‘He lays hold of thorns :’—(this is suggeste by the position of the line) above the strong (line).\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows its subject proceeding very slowly (to help the subject of the first line), who is straitened by the carriage adorned with metal in front of him. There will be occasion for regret, but the end will be good. K/hi, at the foot of which was the capital of the lords of Kau, seems to take the paragraph out of the sphere of symbolism into that of history. ‘The king’ in it is the last sovereign of Shang; the feudal prince in it is Wan. The fourth line, divided, shows a well, the lining of which is well laid. There will be no error.\n\n##### Symbol: ‘He proceeds very slowly (to help the subject of the first line) :’'—his aim is directed to (help) that lower (line). Although he is not in his appropriate place, he and that other will (in the end) be together.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows its subject with his nose and feet cut off. He is straitened by (his ministers in their) scarlet aprons. He is leisurely in his movements, however, and is satisfied. It will be well for him to be (as sincere) as in sacrificing (to spiritual beings). The fifth line, undivided, shows a clear, limpid well, (the waters from) whose cold spring are (freely) drunk.\n\n##### Symbol: ‘His nose and feet are cut off:’'—his aim has not yet been gained.\n\n/5&\n\n&6&\n##### Top Line, Divided: The sixth line, divided, shows its subject straitened, as if bound with creepers; or in a high and dangerous position, and saying (to himself), ‘If | move, I shall repent it.’ If he do repent of former errors, there will be good fortune in his going forward. SNE XLVII. The character Khw4n presents us with the picture of a tree within an enclosure; ‘a plant,’ according to Williams, ‘ fading for want of room;’ ‘a tree,’ according to Tai Tung, ‘not allowed to spread its branches.’ However this be, the term conveys the idea of being straitened and distressed ; and this hexagram indicates a state of things in which the order and government that would conduce to the well-being of the country can hardly get the development, which, oy skilful management on the part of ‘the great man’ and others, is finally secured for them. Looking at the figure we see that the two central places are occupied by strong lines; but 2 is confined between 1 and 3, both of which are weak, and 5 (the ruler), as well as 4 (his minister), is covered by the weak 6; all which peculiarities are held to indicate the repression or straitening of good men by bad. For the way in which the same view is derived from the great symbolism, see Appendix II, in loc. The topmost line, divided, shows (the water from) the well brought to the top, which is not allowed to be covered. This suggests the idea of sincerity. There will be great good fortune. XLVIII. 3ing, which gives its name to this hexagram, is the symbol of a well. The character originally was pictorial (FF), intended to represent a portion of land, divided into nine parts, the central portion belonging to the government, and being cultivated by the joint labour of the eight families settled on the other divisions. In the centre of it, moreover, was a well, which was the joint property of all the occupants,\n\n##### Symbol: ‘He is straitened as if bound with creepers :’— (his spirit and action) are unsuitable.\n\n/6&"},"011010":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/048.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Progress in Jing in Kun encounters blight.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): What happens under Jing requires to be changed; and hence it is followed by Ge (denoting change).**","text.tab3":"&0&\n**The Well (Jing): (Looking at) Jǐng, (we think of) how (the site of) a town may be changed, while (the fashion of) its wells undergoes no change. (The water of a well) never disappears and never receives (any great) increase, and those who come and those who go can draw and enjoy the benefit. If (the drawing) have nearly been accomplished, but, before the rope has quite reached the water, the bucket is broken, this is evil.**\n**Great Symbol: (The trigram representing) wood and above it that for water form 3ing. The superior man, in accordance with this, comforts the people, and stimulates them to mutual helpfulness.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): (We have the symbol of) wood in the water and the raising of the water; which (gives us the idea of) a well. A well supplies nourishment and is not (itself) exhausted. 2. ‘The site of a town may be changed, while the fashion of its wells undergoes no change :'— this is indicated by the central position of the strong lines (in the second and fifth places).\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘A well so muddy that men will not drink of it: —this is indicated by the low position (of the line).\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘A well from which by a hole the water escapes, and flows away to the shrimps :’—(the subject of this second line has) none co-operating with him (above).\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘The well has been cleared out, but is not used :'— (even) passers-by would be sorry for this.\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘A well the lining of which is well laid. There will be no error:’—the well has been put in good repair.\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘The waters from the cold spring are (freely) drunk :’—this is indicated by the central and correct position (of the line).\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘The great good fortune’ at the topmost place\n\n/6&"},"101110":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/049.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): The old is left by Ge; Ding takes what's new.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): For changing the substance of things there is nothing equal to the caldron; and hence Ge is followed by Ding.**","text.tab3":"&0&\n**Revolution (Ge): (What takes place as indicated by) Ko is believed in only after it has been accomplished. There will be great progress and success. Advantage will come from being firm and correct. (In that case) occasion for repentance will disappear.**\n**Great Symbol: (The trigram representing the waters of) a marsh and that for fire in the midst of them form Ko. The superior man, in accordance with this, regulates his (astronomical) calculations, and makes clear the seasons and times.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Ko (we see) water and fire extinguishing each other; (we see also) two daughters dwelling together, but with their minds directed to remains master of himself, and pursues the proper end of principle settled in his mind. Why should the subject of Khwan make speeches, be fond of arguing or pleading,—as the characters say, if we could translate them literally, ‘setting a value on the mouth?’ The reply to this is found in the trigram denoting ‘satisfaction,’ or ‘ being pleased.’ The party in the extremity of Khw4n yet wishes and tries to make men pleased with him.\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows its subject (as if he were) bound with the skin of a yellow ox. The first line, divided, shows the caldron overthrown and its feet turned up. (But) there will be given as to the spirit and manner in which they should be brought about. For the way in which the notion of change is brought out of the trigrams of the figure, see Appendixes I and II. It is assumed in the Thwan that change is viewed by people generally with suspicion and dislike, and should not be made hastily. When made as a necessity, and its good effects appear, the issues will be great and good. A proved necessity for them beforehand; and a firm correctness in the conduct of them :—these are the conditions by which changes should be regulated. The first line, undivided, shows its subject, when the movement approaches, looking out and around with apprehension, and afterwards smiling and talking cheerfully. There will be good fortune.\n\n##### Symbol: ‘He is bound with (the skin of) a yellow ox:'—he should in his circumstances be taking action.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, divided, shows its subject making his changes after some time has passed. Action taken will be fortunate. There will be no error. The second line, undivided, shows the caldron with the things (to be cooked) in it. (If its subject can say), ‘My enemy dislikes me, but he cannot approach me,’ there will be good fortune. The second line, divided, shows its subject, when the movement approaches, in a position of peril. He judges it better to let go the articles (in his possession), and to ascend a very lofty height. There is no occasion for him to pursue after (the things he has let go); in seven days he will find them.\n\n##### Symbol: ‘He makes his changes when some time has passed :'—what he does will be matter of admiration.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows that action taken by its subject will be evil. Though he be firm and correct, his position is perilous. If the change (he contemplates) have been three times fully discussed, he will be believed in. The third line, undivided, shows the caldron with (the places of) its ears changed. The progress (of its subject) is (thus) stopped. The fat flesh of the pheasant (which is in the caldron) will not be eaten. But the (genial) rain will come, and the grounds for repentance will disappear. There will be good fortune in the end. The third line, divided, shows its subject distraught amid the startling movements going on. If those movements excite him to (right) action, there will be no mistake. himself for his work, and he has no sufficient help; and the result will be evil. ‘Paragraph 5,’ says the Daily Lecture, ‘ praises the ruler as condescending to the worthy with his humble virtue.’ ‘ Yellow’ has occurred repeatedly as ‘a correct colour;’ ard here ‘the yellow ears and strong rings of metal’ are intended to intensify our appreciation of the occupant of 5. As the line is divided, a caution is added about being firm and correct.\n\n##### Symbol: ‘The change (contemplated) has been three times fully discussed :’—to what else should attention (now) be directed ?\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows occasion for repentance disappearing (from its subject). Let him be believed in; and though he change (existing) ordinances, there will be good fortune. The fourth line, undivided, shows the caldron with its feet broken; and its contents, designed for the ruler’s use, overturned and spilt. Its subject will be made to blush for shame. There will be evil. will have a contrary effect; and if he have further secured general confidence, he may proceed to the greatest changes, even to change the dynasty,—‘ with good fortune.’ The conditions favourable to his action are said to be such as these :—The line has passed from the lower trigram into the upper; water and fire come in it into contact ; the fourth place is that of the minister immediately below the ruler’s seat. All these considerations demand action from the subject of 4 in harmony with the idea of the hexagram. The fourth line, undivided, shows its subject, amid the startling movements, supinely sinking (deeper) in the mud.\n\n##### Symbol: ‘The good fortune consequent on changing (existing) ordinances’ is due to the faith reposed in his aims.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows the great man (producing his changes) as the tiger (does when he) changes (his stripes). Before he divines (and proceeds to action), faith has been reposed in him. The fifth line, divided, shows the caldron with yellow ears and rings of metal in them. There will be advantage through being firm and correct. The fifth line, divided, shows its subject going and coming amidst the startling movements (of the time), and always in peril; but perhaps he will not incur loss, and find business (which he can accomplish).\n\n##### Symbol: ‘The great man produces his changes as the tiger does when he changes his stripes : —their beauty becomes more brilliant.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, divided, shows the superior man producing his changes as the leopard (does when he) changes (his spots), while small men change their faces (and show their obedience). To go forward (now) would lead to evil, but there will be good fortune in abiding firm and correct. a ts XLIX. The character called Ko or Keh is used here in the sense of changing. Originally used for the skin of an animal or bird, alive or dead, it received the significance of changing at a very early time. Its earliest appearance, indeed, in the first Book of the The sixth line, undivided, shows the caldron with rings of jade. There will be great good fortune, and all action taken will be in every way advantageous. L. Ting was originally a pictorial character, representing a caldron with three feet and two ears, used for cooking and preparing food for the table (the mat in old times) and the altar. The picture has disappeared from the character, but it is said that in the hexagram we have an outline from which fancy may construct the vessel. The lower line, divided, represents its feet; lines 2, 3, 4, all undivided, represent the body of it; line 5, divided, represents its two ears; and line 6, undivided, the handle by which it was carried, or suspended from a hook. Appendix VI makes Ting tollow Ko in the order of the hexagrams, because there is no changer of the appearance and character of things equal to the furnace and caldron! Ting and Zing (48) are the only two hexagrams named from things in ordinary use with men; and they are both descriptive of the government’s work of nourishing. There are three hexagrams of which that is the theme, I (27), under which we are told in Appendix I that ‘the sages nourished men of worth, by means of them to reach to the myriads of the people.’ 3ing treats of the nourishment of the people generally by the government through its agricultural and other methods; Ting treats of the nourishment of men of talents and virtue; and that being understood, it is said, without more ado, that it ‘intimates great progress and success.’ The topmost line, divided, shows its subject, amidst the startling movements (of the time), in breathless dismay and looking round him with trembling apprehension. If he take action, there will be evil. If, while the startling movements have not reached his own person and his neighbourhood, (he were to take precautions), there would be no error, though his relatives might (still) speak against him. ILI. Aan among the trigrams represents thunder, and, according to Wan’s arrangement and significance of them, ‘the oldest son.’\n\n##### Symbol: ‘The superior man produces his changes as the leopard does when he changes his spots :'—their beauty becomes more elegant.\n\n/6&"},"011101":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/050.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): The old is left by Ge; Ding takes what's new.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): For presiding over (that and all other) vessels, no one is equal to the eldest son; and hence Ding is followed by Zhen.**","text.tab3":"&0&\n**The Cauldron (Ding): Dǐng gives the intimation of great progress and success.**\n**Great Symbol: (The trigram representing) wood and above it that for fire form Ting. The superior man, in accordance with this, keeps his every position correct, and maintains secure the appointment (of Heaven).**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Ting we have (symbolically) the figure of a caldron. (We see) the (symbol of) wood entering into that of fire, which suggests the idea of cook-\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘ The caldron is overturned, and its feet turned upwards :'—but this is not (all) contrary (to what is right).\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘There is the caldron with the things (to be cooked) in it:’—let (the subject of the line) be careful where he goes.\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘There is the caldron with (the places for) its\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘The contents designed for the ruler’s use are overturned and spilt :'—how can (the subject of the line) be trusted ?\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘The caldron has yellow ears:’—the central position (of the line) is taken as (a proof of) the solid (virtue of its subject).\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘The rings of jade’ are at the very top :—the strong and the weak meet in their due proportions.\n\n/6&"},"100100":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/051.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Zhen starts; Gen stops.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Zhen conveys the idea of putting in motion. But things cannot be kept in motion forever. The motion is stopped; and hence Zhen is followed by Gen.**","text.tab3":"&0&\n**The Arousing (Zhen): Zhèn gives the intimation of ease and development. When (the time of) movement (which it indicates) comes, (the subject of The Judgment) will be found looking out with apprehension, and yet smiling and talking cheerfully. When the movement (like a crash of thunder) terrifies all within a hundred lî, he will be (like the sincere worshipper) who is not (startled into) letting go his ladle and (cup of) sacrificial spirits.**\n**Great Symbol: (The trigram representing) thunder, being repeated, forms Aan. The superior man, in accordance with this, is fearful and apprehensive, cultivates (his virtue), and examines (his faults).**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Kan (gives the intimation of) ease and development. 2. ‘When the (time of) movement (which it indicates) comes, (its subject) will be found looking out with apprehension :’—that.feeling of dread leads to happiness. ‘And yet smiling and talking cheerfully :'—the issue (of his dread) is that he adopts (proper) laws (for his course).\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘When the (time of) movement comes, he will be found looking out with apprehension :’— that feeling of dread leads to happiness.\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘He is distraught amid the startling movements going on:’—(the third line) is in a position unsuitable to it.\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘Amid the startling movements, he sinks supinely in the mud :’—the light in him has not yet been brilliantly developed.\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘He goes and comes amid the startling movements, and (always) in peril :’—full of risk are his doings.\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘Amid the startling movements he is in breathless dismay :’'—he has not found out (the course of) the due mean.\n\n/5&\n\n&6&\n##### Line 6: The topmost SIX, divided, shows its subject, amidst the startling movements (of the time), in breathless dismay and looking round him with trembling apprehension. If he take action, there will be evil. If, while the startling movements have not reached his own person and his neighbourhood, (he were to take precautions), there would be no error, though his relatives might (still) speak against him.\n\n##### Symbol: \"Amid the startling movements he is in breathless dismay:\"--he has not found out (the course of) the due mean. \"Though evil (threatens), he will not fall into error:\"--he is afraid of being warned by his neighbours.\n\n/6&"},"001001":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/052.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Zhen starts; Gen stops.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Gen gives the idea of arresting or stopping. Things cannot be kept for ever in a state of repression; and hence Gen is followed by Jian.**","text.tab3":"&0&\n**Keeping Still (Gen): When one's resting is like that of the back, and he loses all consciousness of self; when he walks The next sentence shows him sensible of the danger of the occasion, but confident and self-possessed. The concluding sentence shows him rapt in his own important affairs, like a sincere worshipper, thinking only of the service in which he is engaged. Such a symbol is said to be suggested by WaAn’s significance of Kan as ‘the oldest son (page 33).’ It is his to succeed to his father, and the hexagram, as following Ting, shows him presiding over the sacrifices that have been prepared in the caldron. This is too fanciful. What is said on line 1 is little more than a repetition of the principal part of the Thwan. The line is undivided, and gives the auspice of good fortune. ‘The position of peril’ to the subject of line 2 is suggested, as Appendix II says, by its position, immediately above 1. But the rest of the symbolism is obscure, and Xd Hsi says he does not understand it. The common interpretation appears in the version. The subject of the line does what he can to get out of danger; and finally, as is signified by the central position of the line, the issue is better than could have been expected. On the specification of ‘seven days,’ see what is said in the treatise on the Thwan of hexagram 24. On its use here KAang-3ze says :—‘ The places of a diagram amount to 6. The number 7 is the first of another. When the movement symbolised by K4n is gone by, things will be as they were before.’ Line 3 is divided, and where an undivided line should be ; but if its subject move on to the fourth place, which would be right for him, the issue will not be bad. The 4th line, however, has a bad auspice of its own. It is undivided in an even place, and it is pressed by the divided line on in his courtyard, and does not see any (of the persons) in it,—there will be no error.**\n**Great Symbol: (Two trigrams representing) a mountain, one over the other, form Kan. The superior man, in**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Kan denotes stopping or resting ;— resting when it is the time to rest, and acting when it is the time to act. When one’s movements and restings all take place at the proper time for them, his way (of proceeding) is brilliant and intelligent. 2. Resting in one’s resting-point is resting in one’s proper place. The upper and lower (lines of the hexagram) exactly correspond tq each other, but are without any interaction; hence it is said that ‘(the subject of the hexagram) has no consciousness of self; that when he walks in his courtyard, he does not see (any of) the persons in it; and that there will be no error.’\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, divided, shows its subject keeping his toes at rest. There will be no error; but it will be advantageous for him to be persistently firm and correct. The first line, divided, shows the wild geese gradually approaching the shore. A young officer (in similar circumstances) will be in a position of danger, and be spoken against; but there will be no error. follows 3, and should help it; but is unable to do so; and there results dissatisfaction. The first line, undivided, shows the younger sister married off in a position ancillary to the real wife. (It suggests the idea of) a person lame on a a ee SS ee eee preliminary steps, continued from its initiation to its consummation. The first line, undivided, shows its subject meeting with his mate. Though they are both of the same character, there will be no error. Advance will call forth approval.\n\n##### Symbol: ‘He keeps his toes at rest :'—he does not fail in what is correct (according to the idea of the figure).\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, divided, shows its subject keeping the calves of his legs at rest. He cannot help (the subject of the line above) whom he follows, and is dissatished in his mind. The second line, divided, shows the geese gradually approaching the large rocks, where they eat and drink joyfully and at ease. There will be good fortune. The second line, undivided, shows her blind of one eye, and yet able to see. There will be advantage in her maintaining the firm correttness of a solitary widow. The second line, divided, shows its subject surrounded by screens so large and thick that at midday he can see from them the constellation of the Bushel. If he go (and try to enlighten his ruler who is thus emblemed), he will make himself to be viewed with suspicion and dislike. Let him cherish his feeling of sincere devotion that he may thereby move (his ruler’s mind), and there will be good fortune.\n\n##### Symbol: ‘He cannot help him whom he follows :’ — (he whom he follows) will not retreat to listen to him.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows its subject keeping his loins at rest, and separating the ribs (from the body below). The situation is perilous, and the heart glows with suppressed excitement. The third line, undivided,.shows them gradually advanced to the dry plains. (It suggests also the idea of) a husband who goes on an expedition from which he does not return, and of a wife who is pregnant, but will not nourish her child. There will be evil. (The case symbolised) might be advantageous in resisting plunderers. The third line, divided, shows the younger sister who was to be married off in a mean position. She returns and accepts an ancillary position. The third line, undivided, shows its subject with an (additional) screen of a large and thick banner, through which at midday he can see (the small) Mei star. (In the darkness) he breaks his right arm; but there will be no error. 4The fourth line, undivided, shows its subject in a tent so large and thick that at midday he can see from it the constellation of the Bushel. But he meets with the subject of the (first) line, undivided like himself. There will be good fortune.\n\n##### Symbol: ‘He keeps the loins at rest:’—the danger (from his doing so) produces a glowing heat in the heart.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, divided, shows its subject keeping his trunk at rest. There will be no error. caeeune fifth line: divided, shows its subject keeping his jawbones at rest, so that his words are (all) orderly. Occasion for repentance will disappear. The fourth line, divided, shows the geese gradually advanced to the trees. They may light on the flat branches. There will be no error. The fourth line, undivided, shows the younger sister who is to be married off protracting the time. She may be late in being married, but the time will come.\n\n##### Symbol: ‘He keeps the trunk of his body at rest :’'—he keeps himself free (from agitation).\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows the geese gradually advanced to the high mound. (It suggests the idea of) a wife who for three years does not become pregnant; but in the end the natural issue cannot be prevented. There will be good fortune. The fifth line, divided, reminds us of the marrying of the younger sister of (king) Ti-yi, when the sleeves of her the princess were not equal to those of the (still) younger sister who accompanied her in an inferior capacity. (The case suggests the thought of) the moon almost full. There will be good fortune. The fifth line, divided, shows its subject bringing around him the men of brilliant ability. There will be occasion for congratulation and praise. There will be good fortune.\n\n##### Symbol: ‘He keeps his cheek bones at rest :'-—in harmony with his central position he acts correctly.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, shows its subject either side, hence its subject is represented as supinely sinking in the mud. The sixth line, undivided, shows the geese gradually advanced to the large heights (beyond). Their feathers can be used as ornaments. There will be good fortune. LIII. Kien is ordinarily used in the sense of gradually; but there is connected with that the idea also of progress or advance. The sixth line, divided, shows the young lady bearing the basket, but without anything in it, and the gentleman slaughtering the sheep, but without blood flowing from it. There will be no advantage in any way. LIV. Mei Kwei is a common way of saying that a young lady is married, or, literally, ‘is going home.’ If the order of the characters be reversed, the verb kwei will be transitive, and the phrase will signify ‘the marrying away of a daughter,’ or ‘the giving the young lady in marriage.’ In the name of this hexagram, K wei is used with this transitive force. But Mei means ‘a younger sister, and not merely a young lady or a daughter. Kwei Mei might be equivalent to our ‘giving in marriage ;’ but we shall find LV. Tue FAinc HExacrRaM. F ang intimates progress and development. When a king has reached the point (which the name denotes) that the special term has a special appropriateness. The Thwan makes the hexagram give a bad auspice concerning its subject ; and for this the following reasons are given :—According to Wan’s symbolism of the trigrams, Tui, the lower trigram here, denotes the youngest daughter, and An, the upper trigram, the oldest son. And as the action of the hexagram begins with that of the lower trigram, we have in the figure two violations of propriety. The topmost line, divided, shows its subject parties mentioned in the paragraph appear engaged in the temple, offering or sacrificing to the spirits of their ancestors. But the woman’s basket which should contain her offerings (The Shih, I, ii, ode 4) is empty, and the man attempts to perform his part in slaying the victim (The Shih, II, vi, ode 6. 5) without effect. with his house made large, but only serving as a screen to his household. When he looks at his door, it is still, and there is nobody about it. For three years no one is to be seen. There will be evil. LV. The character Fang is the symbol of being large and abundant, and, as the name of this hexagram, denotes a condition of abundant prosperity. In the changes of human affairs a condition of prosperity has often given place to one of an opposite character. The lesson of the hexagram is to show to rulers how they may preserve the prosperity of their state and people. The component trigrams have the attributes of intelligence and of motive force, and the second is under the direction of the first. A ruler with these attributes is not likely to fail in maintaining his crown and prosperity, and it may well be said that the figure intimates progress and development. The king is told not to be anxious, but to study how he may always be like the sun in his meridian height, cheering and enlightening all.\n\n##### Symbol: ‘There is good fortune through his devotedly maintaining his restfulness :'—to the end he shows himself generous and good.\n\n/6&"},"001011":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/053.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): In Jian we see a bride who will delay to move until the bridegroom takes his way.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Jian gives the idea of (gradually) advancing. With advance there must be a certain point that is arrived at; and hence Jian is succeeded by Gui Mei.**","text.tab3":"&0&\n**Development (Jian(Dev)): Kien suggests to us the marriage of a young lady, and the good fortune (attending it). There will be advantage in being firm and correct.**\n**Great Symbol: (The trigram representing) a mountain and above it that for a tree form Kien. The superior man, in accordance with this, attains to and maintains his extraordinary virtue, and makes the manners of the people good.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): The advance indicated by Xien is (like) the marrying of a young lady which is attended by good fortune. 2. (The lines) as they advance get into their correct places :—this indicates the achievements of a successful progress.\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘The danger of a small officer (as represented in the first line)’ is owing to no fault of his in the matter of what is right.\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘They eat and drink joyfully and at ease :’— but not without having earned their food.\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘A husband goes and does not return :—he separates himself from his comrades.\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘They may light on the flat branches : —there is docility (in the line) going on to flexible penetration.\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘In the end the natural issue cannot be prevented. There will be good fortune :’—(the subject of the line) will get what he desires.\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘Their feathers can be used as ornaments. There will be good fortune:’—(the object and character of the subject of the line) cannot be disturbed.\n\n/6&"},"110100":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/054.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Gui Mei reveals how ends the virgin life; Wei Ji how fails the youth (to get a wife).**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): When things thus find the proper point to which to come, they are sure to become great. Hence Gui Mei is succeeded by Feng.**","text.tab3":"&0&\n**The Marrying Maiden (Gui Mei): Guī Mèi indicates that (under the conditions which it denotes) action will be evil, and in no wise advantageous.**\n**Great Symbol: (The trigram representing the waters of) a marsh and over it that for thunder form Kwei Mei. The superior man, in accordance with this; having regard to the far-distant end, knows the mischief (that may be done at the beginning).**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): By Kwei Mei (the marrying away of a younger sister) the great and righteous relation between heaven and earth (is suggested to us). If heaven and earth were to have no intercommunication, things would not grow and flourish as they do. The marriage of a younger sister is the end (of her maidenhood) and the beginning (of her motherhood). 2. We have (in the hexagram the desire of)\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘The younger sister is married off in a position ancillary to that of the real wife:’—it is the constant practice (for such a case).\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘There will be advantage in maintaining the firm correctness of a solitary widow:’—(the subject of\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘ The younger sister who was to be married off is in a mean position :—this is shown by the improprieties (indicated in the line).\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: (The purpose in) ‘ protracting the time’ is that, after waiting, the thing may be done (all the better).\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘The sleeves of the younger sister of (king) Ti-yi, when she was married away, were not equal to those of her (half-) sister, who accompanied her ;— such was her noble character, indicated by the central position of the line.\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘(What is said in) the sixth line, divided, about there being nothing in the basket’ shows that the subject of it is carrying an empty basket.\n\n/6&"},"101100":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/055.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Feng tells of trouble; Lu can boast few friends.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Feng conveys the idea of being great. He whose greatness reaches the utmost possibility is sure to lose his dwelling; and hence Feng is succeeded by Lu (denoting travellers or strangers).**","text.tab3":"&0&\n**Abundance (Feng): Fēng intimates progress and development. When a king has reached the point (which the name denotes) there is no occasion to be anxious (through fear of a change). Let him be as the sun at noon.**\n**Great Symbol: (The trigrams representing) thunder and lightning combine to form Fang. The superior man, in accordance with this, decides cases of litigation, and apportions punishments with exactness.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Fang has the signification of being great. It is made up of the trigrams (representing)\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘Though they are both of the same character, there will be no error:’—if the subject of this\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘Let him cherish his feeling of sincere devotion, that it shall appear being put forth:’—it is by sincerity that the mind is affected.\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘There is an (additional) screen of a large and thick banner :’—great things should not be attempted (in such circumstances).\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘He is surrounded by a screen large and thick :'-—the position of the line is inappropriate.\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘The good fortune indicated by the fifth line, divided,’ is the congratulation (that is sure to arise).\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘He has made his house large :'—he soars (in his pride) to the heavens.\n\n/6&"},"001101":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/056.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Feng tells of trouble; Lu can boast few friends.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): We have in it the idea of strangers who have no place to receive them; and hence Lu is followed by Xun.**","text.tab3":"&0&\n**The Wanderer (Lü(Wanderer)): Liu intimates that (in the condition which it denotes) there may be some little attainment and progress. If the stranger or traveller be firm and correct as he ought to be, there will be good fortune.**\n**Great Symbol: (The trigram representing) a mountain and above it that for fire form Li. The Superior man, in accordance with this, exerts his wisdom and caution in the use of punishments and not allowing litigations to continue.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): ‘Lii indicates that there may be some small attainment and progress:'—the weak (line) occupies the central place in the outer (trigram), and is obedient to the strong (lines on either side of it). (We have also the attributes of quiet) resting closely attached to intelligence (in the com-\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows the stranger mean and meanly occupied. It is thus that he brings on himself (further) calamity.\n\n##### Symbol: ‘The stranger is mean and meanly occu-\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows the stranger, occupying his lodging-house, carrying with him his means of livelihood, and provided with good and trusty servants.\n\n##### Symbol: ‘He is provided with good and trusty servants :'—he will in the end have nothing of which to complain.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows the stranger, burning his lodging-house, and having lost his servants. However firm and correct he (try to) be, he will be in peril.\n\n##### Symbol: ‘ The stranger burns his lodging-house :’— and he himself also suffers hurt thereby. When, as a Stranger, he treats those below him (as the line\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows the traveller in a resting-place, having (also) the means of livelihood and the axe, (but still saying),‘I am not at ease in my mind,’\n\n##### Symbol: ‘The stranger is in a resting-place :'—but he has not got. his proper position.\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows its subject shooting a pheasant. He will lose his arrow, but in the end he will obtain praise and a (high) charge.\n\n##### Symbol: ‘Considering that the stranger is here at the very height (of distinction),’ with the spirit that possesses him, it is right he (should be emblemed by a bird) burning (its nest).\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, suggests the idea of a bird burning its nest. The stranger, (thus represented), first laughs and then cries out. He has lost his ox(-like docility) too readily and easily. There will be evil. LVI. The name Lii denotes people travelling abroad, and is often translated by ‘strangers.’ As early as the time of king W4n, there was a class of men who went about from one state to another, pursuing their business as pedlars or travelling merchants; but in\n\n##### Symbol: \"Considering that the stranger is here at the very height (of distinction),\" with the spirit that possesses him, it is right he (should be emblemed by a bird) burning (its nest). \"He loses his ox(-like docility) too readily and easily:\"--to the end he would not listen to (the truth about the course to be pursued).\n\n/6&"},"011011":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/057.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Dui shows its scope, but Xun's we do not see.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Xun gives the idea of (penetrating and) entering. One enters (on the pursuit of his object), and afterwards has pleasure in it; hence Xun is followed by Dui.**","text.tab3":"&0&\n**The Gentle Wind (Xun): Sun intimates that (under the conditions which it denotes) there will be some little attainment and progress. There will be advantage in movement to give the idea that is in Lii, see Appendix II. In Appendix I there is an endeavour to explain the Thwan by means of the lines and their relation to one another. Line 1 is weak, in an odd place, and at the very bottom or commencement of the hexagram, These conditions are supposed to account for the unfavourable symbolism and auspice. Line 2 is weak, but in its proper place. That place, moreover, is the central. Hence the traveller—and he might here very well be a travelling merchant—is represented in the symbolism as provided with everything he can require; and though the auspice is not mentioned, we must understand it as being good. Line 3 is strong, and in an even place. But it occupies the topmost place in the lower trigram; and its strength may be expected to appear as violence. So it does in the symbolism, and extraordinary violence as well. It seems unreasonable to suppose, as in the conclusion, that one so described could be in any way correct. The Khang-hsi editors remark that the subjects of 2 and 3 are represented as having ‘lodging-houses,’ and not any of those of the other lines, because these are the only two lines in the places proper to them! Line 4 is strong, but in an even place. Hence its subject has not ‘a lodging-house ;’ but has found a situation where he has shelter, though he is exposed to perils. Hence he is represented as having an axe, which may be available for defence. Still he is not at peace in his mind. The Khang-hsi editors observe well that the mention of an axe makes us think of caution as a quality desirable in a traveller. Line 5, though weak, is in the centre of the upper trigram, which onward in whatever direction. It will be advantageous (also) to see the great man.**\n**Great Symbol: (Two trigrams representing) wind, following each other, form Sun. The superior man, in accordance with this, reiterates his orders, and secures the practice of his affairs.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): The double Sun shows how, in accordance with it, (governmental) orders are reiterated. 2. (We see that) the strong (fifth line) has penetrated into the central and correct place, and the will (of its subject) is being carried into effect; (we see also) the weak (first and fourth lines) both obedient to the strong lines (above them). It is hence said, ‘There will be some little attainment and progress. There will be advantage in movement onward in whatever direction. It will be advantageous also to see the great man.’\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows its subject (now) advancing, (now) receding. It would be advantageous for him to have the firm correctness of a brave soldier.\n\n##### Symbol: ‘(Now) he advances, (now) he recedes :'—his mind is perplexed. |\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows the representative of Sun beneath a couch, and employing diviners and exorcists in a way bordering on confusion. There will be good fortune and no error.\n\n##### Symbol: ‘The good fortune springing from what borders on confusion’ is due to the position (of the line) in the centre.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows its subject penetrating (only) by violent and repeated efforts. There will be occasion for regret.\n\n##### Symbol: ‘The regret arising from the violent and repeated efforts to penetrate’ shows the exhaustion of the will.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows all occasion for repentance (in its subject) passed away. He takes game for its threefold use in his hunting.\n\n##### Symbol: ‘Hetakes game in his hunting, enough for the threefold use of it :: —he achieves merit.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows that with firm correctness there will be good fortune (to its has the quality of brightness and elegance. It is held to be the lord of the trigram Li; and lines 4 and 6 are on either side in loyal duty to defend and help. Then the shooting a pheasant is supposed to be suggested ; an elegant bird,—by the trigram of elegance. When an officer was travelling abroad in ancient times, his gift of introduction at any feudal court was a pheasant. The traveller here emblemed is praised by his attached friends, and exalted to a place of dignity by the ruler to whom he is acceptable. It will be seen how the idea of the fifth line being the ruler’s seat is dropt here as being alien from the idea of the hexagram, so arbitrary is the interpretation of the symbolism.\n\n##### Symbol: ‘ The good fortune of (the subject of) the fifth line, undivided,’ is owing to its correct position and its being in the centre.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, shows the representative of penetration beneath a couch, and having lost the axe with which he executed his decisions. However firm and correct he may (try to) be, there will be evil. LVII. With Sun as the fifth of the Fd-hsi trigrams we have become familiar. It symbolises both wind and wood; and has the attributes of flexibility (nearly allied to docility) and penetration. In this hexagram we are to think of it as representing wind with its penetrating power, finding its way into every corner and cranny.\n\n##### Symbol: ‘The representative of penetration is beneath a couch :'—though occupying the topmost place, his powers are exhausted.\n\n/6&"},"110110":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/058.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Dui shows its scope, but Xun's we do not see.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Dui denotes pleasure and satisfaction. This pleasure and satisfaction (begins) afterwards to be dissipated; and hence Dui is followed by Huan.**","text.tab3":"&0&\n**The Joyous (Dui): Tui intimates that (under its conditions) there will be progress and attainment. (But) it will be advantageous to be firm and correct. correct and improve. Such as it is, however, it requires the operation of the strong and virtuous,‘ the great man.’ Even all this criticism is not entirely satisfactory. Line 1 is weak, where it should be strong. The movements of its subject are expressive of perplexity. He wants vigour and decision. Line 2 is strong, and in the right place, and has a good auspice. Things are placed or hidden beneath a couch or bed; and the subject of the line appears as searching for them. He calls in divination to assist his judgment, and exorcists to expel for him what is bad. The work is great and difficult, so that he appears almost distracted by it; but the issue is good. For this successful explanation of the line, I am indebted to the Khang-hsi? editors. The writer of the Text believed of course in divination and exorcism ; which was his misfortune rather than his fault or folly. Line 3 is in the right place for a strong line. But its position at the top of the lower trigram is supposed to indicate the restlessness, and here the vehemence, of its subject. And 6 is no proper correlate. All the striving is ineffective, and there is occasion for regret. Line 4 is weak, as is its correlate in 1. But 4 is a proper place for a weak line, and it rests under the shadow of the strong and central 5. Hence the omens of evil are counteracted; anda good auspice is obtained. The game caught in hunting was divided into three portions :—the first for use in sacrifices ; the second for the entertainment of visitors ; and the third for the kitchen generally. A hunt which yielded enongh for all these purposes was deemed very successful. On line 5 AAang-3ze says:—‘It is the seat of honour, and the SS ssessseuesesdnecmessessnsensesesunntsatsnunnniensnsnieeseees**\n**Great Symbol: (Two symbols representing) the waters of a marsh, one over the other, form Tui. The superior man, in accordance with this, (encourages) the conversation of friends and (the stimulus of) their (common) practice.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Tui has the meaning of pleased satisfaction. 2. (We have) the strong (lines) in the centre, and the weak (lines) on the outer edge (of the two trigrams), (indicating that) in pleasure what is most advantageous is the maintenance of firm correctness. Through this there will be found an accordance with (the will of) heaven, and a correspondence with (the feelings of) men. When (such) pleasure goes before the people, (and leads them on), they forget their toils; when it animates them in encountering difficulties, they forget (the risk of) death. How great is (the power of) this pleased satisfaction, stimulating in such a way the people!\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows the pleasure of (inward) harmony. There will be. good fortune, The first line, divided, shows its subject engaged in rescuing (from the impending evil) and having (the assistance of) a strong horse. There will be good fortune. The first line, undivided, shows its subject not the hexagram might be feared; but he discards that regard, and will do nothing to be repented of. There is a change of style in the Chinese text at this point. As Wang Shan-3ze (Yiian dynasty) says :—‘ Here and henceforth the scattering is of what should be scattered, that what should not be scattered may be collected.’\n\n##### Symbol: ‘The good fortune attached to the pleasure of (inward) harmony’ arises from there being nothing in the conduct (of the subject of the line) to awaken doubt.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows the pleasure arising from (inward) sincerity. There will be good fortune. Occasion for repentance will disappear. The second line, undivided, shows its subject, amid the dispersion, hurrying to his contrivance (for security). All occasion for repentance will disappear. The second line, undivided, shows its subject not quitting the courtyard inside his gate. There will be evil.\n\n##### Symbol: ‘The good fortune attached to the pleasure arising from (inward sincerity)’ is due to the confidence felt in the object (of the subject of the line).\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows its subject bringing round himself whatever can give pleasure. There will be evil. The third line, divided, shows its subject discarding any regard to his own person. There will be no occasion for repentance. The third line, divided, shows its subject with no appearance of observing the (proper) regulations, in which case we shall see him lamenting. But there will be no one to blame (but himself).\n\n##### Symbol: ‘The evil predicated of one’s bringing around himself whatever can give pleasure’ is shown by the inappropriateness of the place (of the line).\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows its subject deliberating about what to seek his pleasure in, and not at rest. He borders on what would be injurious, but there will be cause for joy. The fourth line, divided, shows its subject scattering the (different) parties (in the state); which leads to great good fortune. From the dispersion (he collects again good men standing out, a crowd) like a mound, which is what ordinary men would not have thought of. The fourth line, divided, shows its subject quietly and naturally (attentive to all) regulations. There will be progress and success.\n\n##### Symbol: ‘The joy in connexion with (the subject of) the fourth line, undivided,’ is due to the happiness (which he will produce).\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows its subject trusting in one who would injure him. The situation is perilous. The fifth line, undivided, shows its subject amidst the dispersion issuing his great announcements as the perspiration (flows from his body). an injurious effect; but the subject of 4 reflects and deliberates before he will yield to the seduction of pleasure, and there is cause for joy. The fifth line, undivided, shows its subject sweetly and acceptably enacting his regulations. There will be good fortune. The onward progress with them will afford ground for admiration.\n\n##### Symbol: ‘He trusts in one who would injure him :’— his place is that which is correct and appropriate.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The topmost line, divided, shows the pleasure of its subject in leading and attracting others. place for the lord of Sun, from whom there issue all charges and commands. It is central and correct; we must find in its subject the qualities denoted by Sun in their greatest excellence. But those qualities are docility and accordance with what is right; and the advantage of firm correctness is insisted on. With this all will be right.’ With the concluding sentence compare the conclusion of the Thwan of hexagram 18. The topmost line, undivided, shows its subject disposing of (what may be called) its bloody wounds, and going and separating himself from its anxious fears. There will be no error. LIX. Hwé4n, the name of this hexagram, denotes a state of dissipation or dispersion. It is descriptive primarily of men’s minds alienated from what is right and good. This alienation is sure to go on to disorder in the commonwealth; and an attempt is made to show how it should be dealt with and remedied. The topmost line, divided, shows its subject enacting regulations severe and difficult. Even with firmness and correctness there will be evil. But though there will be cause for repentance, it will (by and by) disappear. LX. The primary application of the character Xieh was to denote the joints of the bamboo; it is used also for the joints of the human frame; and for the solar and other terms of the year. Whatever makes regular division may be denominated a Xieh; there enter into it the ideas of regulating and restraining; and the subject of this hexagram is the regulations of government enacted for the guidance and control of the people. How the constituent trigrams are supposed to suggest or indicate this meaning will be seen in Appendix II. A‘ Hsi anticipates that symbolism in trying to account for the statement that the figure gives the promise of success and attainment; but the ground of this is generally made out by referring to the equal division of the undivided and divided lines and our having in 2 and 5, the central places, two undivided lines. An\n\n##### Symbol: ‘The topmost line, divided, shows the pleasure (of its subject) in leading and attracting others :'— his (virtue) is not yet brilliant.\n\n/6&"},"010011":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/059.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Huan scatters; but Jie its code of rules uprears.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Huan denotes separation and division. A state of division cannot continue for ever; and therefore Huan is followed by Jie.**","text.tab3":"&0&\n**Dispersion (Huan): Huàn intimates that (under its conditions) there will be progress and success. The king goes to his ancestral temple; and it will be advantageous to cross the great stream. It will be advantageous to be firm and correct.**\n**Great Symbol: (The trigram representing) water and that for wind moving above the water form Hwan. The ancient kings, in accordance with this, presented offerings to God and established the ancestral temple.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): ‘Hwan intimates that there will be progress and success :'—(we see) the strong line (in the second place) of the lower trigram, and not suffering any extinction there; and (also) the weak line occupying its place in the outer trigram, and uniting (its action) with that of the line above. 2. ‘The king goes to his ancestral temple :'—the king's (mind) is without any deflection. 3. ‘It will be advantageous to cross the great stream :’—(the subject of the hexagram) rides in\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘The good fortune attached to the first line, divided,’ is due to the natural course (pursued by its subject).\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘Amidst the prevailing dispersion, he hurries\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘He has no regard to his own person :’—his aim is directed to what is external to himself.\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘He scatters the (different) parties (in the state), and there is great good fortune :’'— brilliant and great (are his virtue and service).\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘The accumulations of the royal (granaries) are dispersed, and there is no error:’—this is due to the correctness of the position.\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘His bloody wounds are gone:’—he is far removed from the danger of injury.\n\n/6&"},"110010":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/060.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Huan scatters; but Jie its code of rules uprears.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Jie (or the system of regulations) having been established, men believe in it; and hence it is followed by Zhong Fu.**","text.tab3":"&0&\n**Limitation (Jie): Jié intimates that (under its conditions) there will be progress and attainment. (But) if the regulations (which it prescribes) be severe and difficult, they cannot be permanent.**\n**Great Symbol: (The trigram representing) a lake, and above it that for water, form Aieh. The superior man, in accordance with this, constructs his (methods of) numbering and measurement, and discusses (points of) virtue and conduct.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): ‘Xieh intimates progress and attainment:’—the strong and weak (lines) are equally divided, and the strong lines occupy the central places. 2. ‘If the regulations (which Aieh prescribes) be severe and difficult, they cannot be permanent :’—its course (of action) will in that case come to an end. 3. (We have the feeling of) pleasure and satisfaction directing the course amidst peril. (We have) all regulations controlled (by authority) in its proper place. (We have) free action proceeding from the central and correct position. 4. Heaven and earth observe their regular terms, and we have the four seasons complete. (If rulers) frame their measures according to (the due) regulations, the resources (of the state) suffer no injury, and the people receive no hurt.\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘He does not quit the courtyard outside his door :'-—he knows when he has free course and when he is obstructed.\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘He does not quit the courtyard inside his gate. There will be evil :’'—he loses the time (for action) to an extreme degree.\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: In ‘the lamentation for not observing the (proper) regulations,’ who should there be to blame?\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘The progress and success of the quiet and natural (attention) to all regulations’ is due to the deference which accepts the ways of (the ruler) above.\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘The good fortune arising from the regulations enacted sweetly and acceptably’ is due to (the line)\n\n/5&\n\n&6&\n##### Line 6:\n\n##### Symbol: ‘The regulations are severe and difficult. Even with firm correctness there will be evil :’—the\n\n/6&"},"110011":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/061.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Xiao Guo exceeds; sincere is Zhong Fu.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): When men have the belief which Zhong Fu implies, they are sure to carry it into practice; and hence it is succeeded by Xiao Guo.**","text.tab3":"&0&\n**Inner Truth (Zhong Fu): Kung Fd (moves even) pigs and fish, and leads to good fortune. There will be advantage in crossimportant point concerning ‘ regulations’ is brought out in the conclusion of the Thwan,—that they must be adapted to circumstances, and not made too strict and severe. Line 1 is strong, and in its correct place. Its subject therefore would not be wanting in power to make his way. But he is supposed to be kept in check by the strong 2, and the correlate 4 is the first line in the trigram of peril. The course of wisdom therefore is to keep still. The character here rendered door is that belonging to the inner apartments, leading from the hall into which entrance is found by the outer gate, mentioned under line 2. The courtyard outside the door and that inside the gate is one and the same. ‘The ‘Daily Lecture’ says that the paragraph tells an officer not to take office rashly, but to exercise a cautious judgment in his measures. 2 Line 2 is strong, in the wrong place; nor has it a proper correlate. Its subject keeps still, when he ought to be up and doing. There will be evil. Line 3 should be strong, but it is weak. It is neither central nor correct. It has no proper correlate, and it is the topmost line in the trigram of complacent satisfaction. Its subject will not receive the yoke of regulations; and he will find out his mistake, when it is too late. Line 4 is weak, as it ought to be, and its subject has respect to the authority of the strong ruler in 5. Hence its good symbolism and auspice. Line 5 is strong, and in its correct place. Its subject regulates himself, having no correlate; but he is lord of the hexagram, and his influence is everywhere beneficially felt. ing the great stream. There will be advantage in being firm and correct.**\n**Great Symbol: (The trigram representing the waters of) a marsh and that for wind above it form Kung F 0. The superior man, in accordance with this, deliberates about cases of litigation and delays (the infliction of) death.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): The structure of the lineal figure which is here insisted on has been pointed out in explaining the Thwan. On what is further said as to the attributes of the trigrams and their effect, Khang-3ze observes:—‘ We have in the sincerity shown in the upper trigram superiors condescending to those below them in accordance with their peculiarities, and we have in that of the lower those below delighted to follow their superiors. The combination of these two things leads to the transformation of the country and state.’ Paragraph 2. The two divided lines in the middle of the figure are supposed to give the semblance of an empty boat, and an 2 a eee\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows its subject resting (in himself). There will be good fortune. If he sought to any other, he would not find rest.\n\n##### Symbol: ‘The first line, undivided, shows its subject resting (in himself). There will be good fortune :’— no change has yet come over his purpose.\n\n/1&\n\n&2&\n##### Line 2, Und
