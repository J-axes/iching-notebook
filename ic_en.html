ivided: The second line, undivided, shows its subject (like) the crane crying out in her hidden retirement, and her young ones responding to her. (It is as if it were said), ‘I have a cup of good spirits,’ (and the response were), ‘I will partake of it with you.’\n\n##### Symbol: ‘Her young ones respond to her :’'—from the (common) wish of the inmost heart.\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows its subject having met with his mate. Now he beats his drum, and now he leaves off. Now he weeps, and now he sings.\n\n##### Symbol: ‘Now he beats his drum, and now he leaves off :'—the position (of the line) is the appropriate one for it.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows its subject (like) the moon nearly full, and (like) a horse (in a chariot) whose fellow disappears. There will be no error.\n\n##### Symbol: ‘A horse the fellow of which disappears :— he breaks from his (former) companions, and mounts upwards.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows its subject perfectly sincere, and linking (others) to him in closest union. There will be no error.\n\n##### Symbol: ‘Chanticleer (tries to) mount to heaven :’—but how can (such an effort) continue long ?\n\n/5&\n\n&6&\n##### Top Line, Undivided: The topmost line, undivided, shows its subject in chanticleer (trying to) mount to heaven. Even with firm correctness there will be evil. Line 6 is weak, in its proper place. The subject of the topmost line must be supposed to possess an exaggerated desire for enacting regulations. They will be too severe, and the effect will be evil. But as Confucius (Analects 3. 3) says, that is not so great a fault as to be easy and remiss. It may be remedied, and cause for repentance will disappear. LXI. Kung F4, the name of this hexagram, may be represented in English by ‘Inmost Sincerity.’ It denotes the highest quality of man, and gives its possessor power so that he prevails with spiritual beings, with other men, and with the lower creatures. It is the\n\n##### Symbol: \"Chanticleer (tries to) mount to heaven:\"--but how can (such an effort) continue long?\n\n/6&"},"001100":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/062.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Xiao Guo exceeds; sincere is Zhong Fu.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): He that surpasses others is sure to remedy (evils that exist); and therefore Xiao Guo is succeeded by Ji Ji.**","text.tab3":"&0&\n**Small Preponderance (Xiao Guo): Hsiao Kwo indicates that (in the circumstances which it implies) there will be progress and attainsubject of the ‘Doctrine of the Mean’ from the 21st chapter onwards, where Remusat rendered it by ‘la perfection,’ ‘la perfection morale,’ and Intorcetta and his coadjutors by ‘vera solidaque perfectio.’ The lineal figure has suggested to the Chinese commentators, from the author of the first Appendix, two ideas in it which deserve to be pointed out. There are two divided lines in the centre and two undivided below them and above them. The divided lines in the centre are held to represent the heart or mind free from all pre-occupation, without any consciousness of self; and the undivided lines, on each side of it, in the centre. of the constituent trigrams are held to denote the solidity of the virtue of one so free from selfishness. There is no unreality in it, not a single flaw. The ‘ Daily Lecture’ at the conclusion of its paraphrase of the Thwan refers to the history of the ancient Shun, and the wonderful achievements of his virtue. The authors give no instance of the affecting of ‘pigs and fishes’ by sincerity, and say that these names are symbolical of men, the rudest and most unsusceptible of being acted on. The Text says that the man thus gifted with sincerity will succeed in the most difficult enterprises. Remarkable is the concluding sentence that he must be firm and correct. Here, as elsewhere throughout the Yi, there comes out the practical character which has distinguished the Chinese people and their best teaching all along the line of history. The translation of paragraph 1 is according to the view approved by the Khang-hsi editors. The ordinary view makes the other to whom the subject of line 1 looks or might look to be the subject of 4; but they contend that, excepting in the case of 3 and 6, the force of correiation should be discarded from the study of this ment. But it will be advantageous to be firm and correct. (What the name denotes) may be done in small affairs, but not in great affairs. (It is like) the notes that come down from a bird on the wing ;—to descend is better than to ascend. There will (in this way) be great good fortune.**\n**Great Symbol: (The trigram representing) a hill and that for thunder above it form Hsiao Kwo. The superior man, in accordance with this, in his conduct exceeds in humility, in mourning exceeds in sorrow, and in his expenditure exceeds in economy.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Hsido Kwo (we see) the small (lines) exceeding the others, and (giving the intimation of) progress and attainment. 2. Such ‘exceeding, in order to its being advantageous, must be associated with firmness and correctness :'—that is, it must take place (only) according to (the requirements of) the time. 3. The weak (lines) are in the central places, and hence (it is said that what the name denotes) may be done in small affairs, and there will be good fortune. 4. Of the strong (lines one) is not in its proper place, and (the other) is not central, hence it is said that (what the name denotes) ‘should not be done in great affairs.’ 5. (In the hexagram) we have ‘the symbol of a bird on the wing, and of the notes that come down from such a bird, for which it is better to descend than to ascend, thereby leading to great good fortune :'-—to ascend is contrary to what is reasonable in the case, while to descend is natural and right.\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, suggests (the idea of) a bird flying, (and ascending) till the issue is evil.\n\n##### Symbol: ‘There is a bird flying (and ascending) till the result is evil:'—nothing can be done to avoid this issue. ‘No change has come over the purpose :’—the sincerity, that is, perfect in itself and of itself, continues.\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows its subject passing by his grandfather, and meeting with his hexagram; for the virtue of sincerity is all centred in itself, thence derived and thereby powerful. For paragraph 2, see Appendix III, Section i, 42. It is in rhyme, and I have there rendered it in rhyme. The ‘young ones of the crane’ are represented by line 1. In the third and fourth sentences we have the symbolism of two men brought together by their sympathy in virtue. The subject of the paragraph is the effect of sincerity.\n\n##### Symbol: ‘He does not attempt to reach his ruler :'— One bond of loving regard unites the mother bird and her young ; so answers the heart of man to man.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows its subject taking no extraordinary precautions against danger; and some in consequence finding opportunity to assail and injure him. There will be evil.\n\n##### Symbol: \"Some in consequence find opportunity to assail and injure him. There will be evil:\"--how great will it be!\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows its subject falling into no error, but meeting (the exigency of his situation), without exceeding (in his natural course). If he go forward, there will be peril, and he must be cautious. There is no occasion to be using firmness perpetually.\n\n##### Symbol: \"He meets the exigency (of his situation), without exceeding (the proper course):\"—(he does so), the position being inappropriate (for a strong line).\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, (suggests the idea) of dense clouds, but no rain, coming from our borders in the west. It also (shows) the prince shooting his arrow, and taking the bird in a cave.\n\n##### Symbol: \"There are dense clouds, but no rain:\"—(the line) is in too high a place.\n\n/5&\n\n&6&\n##### Top Line, Divided: The topmost line, divided, shows its subject not meeting (the exigency of his situation), and exceeding (his proper course). (It suggests the idea of) a bird flying far aloft. There will be evil. The case is what is called one of calamity and self-produced injury.\n\n##### Symbol: \"He does not meet the exigency (of his situation), and exceeds (his proper course):\"—(the position indicates) the habit of domineering.\n\n/6&"},"101010":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/063.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): All things are well established in Ji Ji.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): But the succession of events cannot come to an end; and therefore Ji Ji is succeeded by Wei Ji, with which (the hexagrams) come to a close.**","text.tab3":"&0&\n**After Completion (Ji Ji): Ki 31 intimates progress and success in small matters. There will be advantage in being firm had in his mind our distinction of essentials and non-essentials. Is it ever good to deviate from what is recognised as the established course of procedure? The reply is—never in the matter of right ; but in what is conventional and ceremonial—in what is nonessential—the deviation may be made, and will be productive of good. The form may be given up, but not the substance. But the thing must be done very carefully—humbly and reverently, and in small matters. The symbolism of the bird is rather obscure. The whole of it is intended to teach humility. It is better for the bird to descend, keeping near to where it can perch and rest, than to hold on ascending into the homeless regions of the air. Line 1 is weak, in an odd place, and possessed by the ‘idea of exceeding,’ which belongs to the hexagram. Its correlate is the strong 4, belonging to the trigram X4n, the attribute of which is movement. There is nothing to repress the tendency of 1; rather it is stimulated ; and hence the symbolism. Line 2 is weak, but in its proper place, and in the centre. Its correlate is 5, which is also a weak line. The lines 3 and 4 between them are both strong; and are supposed to represent the father and grandfather of the subject of 2; but he or she goes past them, and meets with the grandmother in5. Again, 5 isthe ruler’s seat. The subject of 2 moves on to him, but not as an enemy; but humbly and loyally, as his minister according to the attributes of a weak line in the central place. It must be allowed that this view of the symbolism and its interpretation is obscure and strained. The subject of line 3 is too confident in his own strength, and too defiant of the weak and small enemies that seek his hurt. RRR or OR eed 8 RSLS ld and correct. There has been good fortune in the beginning; there may be disorder in the end.**\n**Great Symbol: (The trigram representing) fire and that for water above it form At 3i. The superior**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): ‘Ai 3% intimates progress and success :'—in small matters, that is, there will be that progress and success. 2. ‘There will be advantage in being firm and correct :—the strong and weak (lines) are correctly arranged, each in its appropriate place. 3. ‘There has been good fortune in the beginning :'—the weak (second line) is in the centre. 4. ‘In the end’ there is a cessation (of effort), and ‘disorder arises :'\\—the course (that led to rule and order) is (now) exhausted.\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, (shows its subject as a driver) who drags back his wheel, (or as a fox) which has wet his tail. There will be no error. The first line, divided, shows its subject (like a fox) whose tail gets immersed. There will be occasion for regret.\n\n##### Symbol: ‘In seven days she will find it:'—for the course pursued is that indicated by the central position (of the line).\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, divided, (shows its subject as) a wife who has lost her (carriage-)screen. There is no occasion to go in pursuit of it. In seven days she will find it. The second line, undivided, shows its subject dragging back his (carriage-)wheel. With firmness and correctness there will be good fortune.\n\n##### Symbol: ‘He was three years in subduing it: —enough to make him weary. 7\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, (suggests the case of) Kao 3ung who attacked the Demon region, but was three years in subduing it. Small men should not be employed (in such enterprises). The third line, divided, shows its subject, with (the state of things) not yet remedied, advancing on; which will lead to evil. But there will be advantage in (trying to) cross the great stream.\n\n##### Symbol: ‘He is on his guard all the day:’—he is in doubt about something.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, divided, shows its subject with rags provided against any leak (in his boat), and on his guard all day long. The fourth line, undivided, shows its subject by firm correctness obtaining good fortune, so that all occasion for repentance disappears. Let him stir himself up, as if he were invading the Demon region, where for three years rewards will come to him (and his troops) from the great kingdom.\n\n##### Symbol: ‘The slaughtering of an ox by the neighbour in the east is not equal to (the small sacrifice of) the neighbour in the west:’—because the time (in the latter case is more important and fit).\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows its subject (as) the neighbour in the east who slaughters an ox (for his sacrifice); but this is not equal to the (small) spring sacrifice of the neighbour in the west, whose sincerity receives the blessing. The fifth line, divided, shows its subject by firm correctness obtaining good fortune, and having no occasion for repentance. (We see in him) the brightness of a superior man, and the possession of sincerity. There will be good fortune.\n\n##### Symbol: ‘His head is immersed; the position is perilous: —how could such a state continue long?\n\n/5&\n\n&6&\n##### Top Line, Undivided: The topmost line, divided, shows its subject with (even) his head immersed. The position is perilous. LXIII. The character called A? is used as a symbol of being pastorcompleted. 37 denotes primarily crossing a stream, and has the secondary meaning of helping and completing. The topmost line, undivided, shows its subject second excels in sincerity, and his small offering is the more acceptable. The topmost line is weak, and on the outmost edge of Kh4n, the trigram of peril. His action is violent and perilous, like that one attempting to cross a ford, and being plunged overhead into the water. LXIV. Wei 31 is the reverse of Xf 3%. The name tells us that the successful accomplishment of whatever the writer had in his mind had not yet been realised.}} The vessel of the state has not been brought across the great and dangerous stream. Some have wished that the Yi might have concluded with Af 33, and the last hexagram have left us with the picture of human affairs all brought to good order. But this would not have been in harmony with the full of confidence and therefore feasting (quietly). There will be no error. (If he) cherish this conidea of the Yi, as the book of change. Again and again it has been pointed out that we find in it no idea of a perfect and abiding state. Just as the seasons of the year change and pursue an everrecurring round, so is it with the phases of society. The reign of order has been, and has terminated ; and this hexagram calls us to see the struggle for its realisation recommenced. It treats of how those engaged in that struggle should conduct themselves with a view to secure the happy consummation.\n\n##### Symbol: \"His head is immersed; the position is perilous:\"--how could such a state continue long?\n\n/6&"},"010101":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/064.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Gui Mei reveals how ends the virgin life; Wei Ji how fails the youth (to get a wife).**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): But the succession of events cannot come to an end; and therefore Ji Ji is succeeded by Wei Ji, with which (the hexagrams) come to a close.**","text.tab3":"&0&\n**Before Completion (Wei Ji): Wèi Jì intimates progress and success (in the circumstances which it implies). (We see) a young fox that has nearly crossed (the stream), when its tail gets immersed. There will be no advantage in any way.**\n**Great Symbol: (The trigram representing) water and that for fire above it form Wei 3i. The superior man, in accordance with this, carefully discriminates among (the qualities of) things, and the (different) positions they (naturally) occupy.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): ‘Wei 3i intimates progress and success (in the circumstances which it implies):’—the weak (fifth) line is in the centre. 2. ‘The young fox has nearly crossed the stream :'—but he has not yet escaped from the midst (of the danger and calamity).\n\n#### Lines\n\n&1&\n##### Line 1:\n\n##### Symbol: ‘His tail gets immersed:’—this is the very height of ignorance.\n\n/1&\n\n&2&\n##### Line 2:\n\n##### Symbol: ‘The second line, undivided, shows good fortune arising from being firm and correct :’—it is in the central place, and the action of its subject thereby becomes correct.\n\n/2&\n\n&3&\n##### Line 3:\n\n##### Symbol: ‘By firm correctness there is good fortune, and cause for repentance disappears:’—the aim (of the subject of the line) is carried into effect.\n\n/3&\n\n&4&\n##### Line 4:\n\n##### Symbol: ‘(We see) the brightness of a superior man:’— the diffusion of that brightness tends to good fortune.\n\n/4&\n\n&5&\n##### Line 5:\n\n##### Symbol: ‘He drinks and gets his head immersed :’— he does not know how to submit to the (proper) regulations.\n\n/5&\n\n&6&\n##### Line 6: The topmost NINE, undivided, shows its subject full of confidence and therefore feasting (quietly). There will be no error. (If he) cherish this confidence, till he (is like the fox who) gets his head immersed, it will fail of what is right.\n\n##### Symbol: \"He drinks and gets his head immersed:\"\"--he does not know how to submit to the (proper) regulations.\n\n/6&"}};

/// standalone localStorage utilities ///
const _LS_SAVES = 'yc_saves', _LS_CFG = 'yc_config', _LS_HEX_OV = 'yc_hex_ov', _LS_LAST = 'yc_last';
function _lsLoadSaves(){
  const s = localStorage.getItem(_LS_SAVES);
  if(s !== null) return JSON.parse(s);
  const _def = _EMBEDDED_SAVES || [];
  localStorage.setItem(_LS_SAVES, JSON.stringify(_def));
  return JSON.parse(JSON.stringify(_def));
}
function _lsSave(entry){ const r=_lsLoadSaves(); r.push(entry); localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsFavo(time,favo){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){x.favo=favo;break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsDelete(time){ localStorage.setItem(_LS_SAVES,JSON.stringify(_lsLoadSaves().filter(r=>r.time!==time))); _srcSetClean('saves',false); }
function _lsSetName(time,name){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){x.name=name;break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsUpdateRecord(time,changes){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){Object.assign(x,changes);break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsGetConfig(){ const s=localStorage.getItem(_LS_CFG); if(s) return JSON.parse(s); const {hexagrams,...cfg}=_EMBEDDED_CONFIG; return JSON.parse(JSON.stringify(cfg)); }
function _lsSaveConfig(cfg){ localStorage.setItem(_LS_CFG,JSON.stringify(cfg)); }
function _lsGetHexOv(){ const s=localStorage.getItem(_LS_HEX_OV); return s?JSON.parse(s):{}; }
function _lsGetLast(){ const s=localStorage.getItem(_LS_LAST); return s?JSON.parse(s):null; }
function _lsSaveLast(){ if(currentData) localStorage.setItem(_LS_LAST, JSON.stringify({digits:state.slice(),tab:currentTab})); }
function _lsApplyHexOv(num,field,text){
  const val = field==='ci' ? text.split('\n') : text;
  const ov = _lsGetHexOv(); const k = String(num);
  if(!ov[k]) ov[k]={};
  ov[k][field] = val;
  localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
  _srcSetClean(['text.tab1','text.tab2','text.tab3'].includes(field)?'md':'cfg', false);
}
const _SRC_CANONICAL = {md:'text.md',cfg:'config.json',saves:'saves.json'};
function _esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function _validateCfg(cfg){
  if(typeof cfg !== 'object' || cfg === null || Array.isArray(cfg)) throw new Error('config.json must be a JSON object');
  const ti = cfg.trigrams;
  if(typeof ti !== 'object' || ti === null || Array.isArray(ti)) throw new Error('Missing "trigrams"');
  for(const k of ['000','001','010','011','100','101','110','111']){
    const t = ti[k];
    if(!t) throw new Error(`trigrams missing key "${k}"`);
    if(typeof t.name !== 'string') throw new Error(`trigrams["${k}"] missing "name"`);
    if(typeof t.sym  !== 'string') throw new Error(`trigrams["${k}"] missing "sym"`);
    if(typeof t.color!== 'string') throw new Error(`trigrams["${k}"] missing "color"`);
  }
  const tn = cfg.tab_names;
  if(typeof tn !== 'object' || tn === null || Array.isArray(tn)) throw new Error('Missing "tab_names"');
  for(const k of ['tab1','tab2','tab3']){ if(typeof tn[k] !== 'string') throw new Error(`tab_names missing "${k}"`); }
  const sp = cfg.shibo_probs;
  if(typeof sp !== 'object' || sp === null || Array.isArray(sp)) throw new Error('Missing "shibo_probs"');
  const bin = sp.binary;
  if(typeof bin !== 'object' || bin === null || Array.isArray(bin)) throw new Error('shibo_probs missing "binary"');
  for(const k of ['0','1']){ if(typeof bin[k] !== 'number') throw new Error(`shibo_probs.binary missing key "${k}"`); }
  const quat = sp.quaternary;
  if(typeof quat !== 'object' || quat === null || Array.isArray(quat)) throw new Error('shibo_probs missing "quaternary"');
  for(const k of ['6','7','8','9']){ if(typeof quat[k] !== 'number') throw new Error(`shibo_probs.quaternary missing key "${k}"`); }
}
function _srcStatus(){
  const def = {md:{clean:false,file:null},cfg:{clean:false,file:null},saves:{clean:false,file:null}};
  try{
    const raw = JSON.parse(localStorage.getItem('yc_src_status')||'{}');
    for(const t of ['md','cfg','saves']){
      if(raw[t]!=null) def[t] = typeof raw[t]==='boolean' ? {clean:raw[t],file:null} : Object.assign(def[t],raw[t]);
    }
  }catch(e){}
  return def;
}
function _srcSetClean(type,clean,file){
  const s=_srcStatus();
  if(clean){
    const d=new Date();
    const mm=String(d.getMonth()+1).padStart(2,'0');
    const dd=String(d.getDate()).padStart(2,'0');
    const hh=String(d.getHours()).padStart(2,'0');
    const mi=String(d.getMinutes()).padStart(2,'0');
    const yr=d.getFullYear();
    const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dateStr=LANG==='en'?`${hh}:${mi} ${dd}/${MON[d.getMonth()]}/${yr}`:`${yr}-${mm}-${dd} ${hh}:${mi}`;
    s[type]={clean,file:file||null,date:dateStr};
  } else {
    s[type]={clean,file:null,date:null};
  }
  localStorage.setItem('yc_src_status',JSON.stringify(s)); _srcRender();
}
function _srcRender(){
  const s=_srcStatus();
  ['md','cfg','saves'].forEach(t=>{
    document.querySelectorAll(`[data-src="${t}"]`).forEach(el=>{
      const st=s[t]; el.classList.toggle('source-label--loaded',!!st.clean);
      if(el.hasAttribute('data-i18n'))
        el.innerHTML=(st.clean&&st.file)?_SRC_CANONICAL[t]+':<br>'+(st.file.length>20?st.file.slice(0,20)+'…':st.file)+(st.date?'<br>'+st.date:''):T(el.dataset.i18n);
    });
  });
}

const SUPPORTED_LANGS = ['tc','sc','en','ja','ko'];
const DEFAULT_LANG = 'en';
function _detectLang(){
  const stored = localStorage.getItem('yc_lang');
  if(stored && SUPPORTED_LANGS.includes(stored)) return stored;
  return DEFAULT_LANG;
}
let LANG = _detectLang();
document.documentElement.lang = LANG;
let STR = {};
function T(key,...args){
  let s = STR[key]??key;
  args.forEach((a,i)=>{ s=s.replaceAll(`{${i}}`,String(a)); });
  return s;
}
function langSwitchClick(){
  document.getElementById('langDropdown').classList.toggle('open');
}
function setLang(lang){
  localStorage.setItem('yc_lang', lang);
  LANG = lang;
  document.documentElement.lang = lang;
  document.getElementById('langDropdown').classList.remove('open');

      renderAll();
      if(_hadGlow) document.querySelectorAll('.yao-btn,.bit-toggle,#numDisplay').forEach(el=>el.classList.add('shibo-lit'));
      if(currentData){ renderHeader(); renderContent(currentData); }
      if(document.getElementById('settingsOverlay').classList.contains('open')){
        settingsRender();
      }
      if(document.getElementById('saveDropdown').classList.contains('open')){
        renderSaveDropdown([..._saveRecords].reverse());
      }
      if(document.getElementById('configOverlay').classList.contains('open')){
        const _prevBaseline = _cfgBaseline;
        try { configRender(configReadForm()); } catch(e){ configRender(_lsLoadConfig()); }
        _cfgBaseline = _prevBaseline;
        _cfgCheckDirty();
      }
      if(document.getElementById('editRecordOverlay').classList.contains('open') && _editRecordIdx >= 0){
        editRecord(_editRecordIdx, {stopPropagation:()=>{}});
      }
      const _snp = document.getElementById('shiboNamePop');
      if(_snp.style.display !== 'none'){
        const _si = document.getElementById('shiboNameInput');
        if(_si) _si.placeholder = T('name.placeholder');
        const _sb = document.getElementById('shiboNameConfirmBtn');
        if(_sb) _sb.textContent = T('btn.save_action');

        const _vb = document.getElementById('saveNameConfirmBtn');
        if(_vb) _vb.textContent = T('btn.save_action');
      }
      fitLeftPanel(); fitRightHeader(); fitBodyText(); fitLayout(); fitBtnText();
      updateEditBtn();
      _srcRender();
    });
}

// 卦序號输入及加減 -- 切換卦象（同步）
function applyNum(n){
  if(stateLocked){ setMsg(T('msg.locked_err'),'error'); return; }
  if(_shiboNameReady || (shiboBuffer.length > 0 && shiboBuffer.length < 6)){ setMsg(T('msg.shibo_busy',T('btn.shibo'),T('btn.settings_tip.busy')),'error'); document.getElementById('numDisplay').value = currentData ? currentData.num : 1; return; }
  if(_editMode) cancelTextEdit();
  document.querySelectorAll('.shibo-lit').forEach(el=>el.classList.remove('shibo-lit'));
  const d = _HEX_BY_NUM[n];
  if(!d){ setMsg(T('msg.query_fail', String(n)), 'error'); return; }
  for(let i=0;i<6;i++) state[i] = parseInt(d.sequence[i]);
  document.getElementById('numDisplay').value = n;
  currentData = d;
  currentData1 = null;
  hexViewMode = 'original';
  renderAll();
  renderHeader();
  fitRightHeader();
  renderContent(d);
  setMsg(T('msg.query_ok', d.name), 'success');
  updateEditBtn();
}
function stepNum(delta){
  const cur = parseInt(document.getElementById('numDisplay').value) || 1;
  applyNum(mod(cur -1 + delta, 64) + 1);
}

  updateEditBtn();
  _lsSaveLast();

    const idx = _HEX_VIEW_BINARY.indexOf(hexViewMode);
    hexViewMode = _HEX_VIEW_BINARY[(idx + 1) % _HEX_VIEW_BINARY.length];
    currentData1 = _relModeData(currentData, hexViewMode);

    renderContent(currentData);
    return;
  }
  if(hexViewMode === 'original' && currentData && (!currentData1 || currentData.num === currentData1.num)){
    const tip = document.getElementById('hexTip');
    if(tip){
      clearTimeout(hexTipTimer);
      tip.textContent = T('header.same_hex');
      hexTipTimer = setTimeout(()=>{ tip.textContent = ''; }, 5000);

    return;
  }
  if(_editMode) cancelTextEdit();
  hexViewMode = hexViewMode === 'original' ? 'zhi' : 'original';
  setMsg(hexViewMode === 'zhi' ? T('msg.show_zhi') : T('msg.show_ben'), 'success');
  renderHeader();
  if(currentData) renderContent(currentData);
}

function toggleYao(i){
  if(stateLocked){ setMsg(T('msg.locked_err'),'error'); return; }
  if(_shiboNameReady || (shiboBuffer.length > 0 && shiboBuffer.length < 6)){ setMsg(T('msg.shibo_busy',T('btn.shibo'),T('btn.settings_tip.busy')),'error'); return; }
  if(bitRowMode === 'quaternary'){
    state[i] = state[i] >= 9 ? 6 : state[i] + 1;

  renderAll(); doQuery();

function openShiboNamePop(){
  const pop = document.getElementById('shiboNamePop');
  pop.innerHTML = `<input class="name-pop-input" id="shiboNameInput" maxlength="20" placeholder="${_esc(T('name.placeholder'))}"><button class="name-pop-confirm" id="shiboNameConfirmBtn" disabled onclick="confirmShiboName()">${_esc(T('btn.save_action'))}</button>`;
  pop.style.display = 'flex';
  _openOverlay(cancelShiboName);
  const inp = document.getElementById('shiboNameInput');
  inp.focus();
  inp.addEventListener('input', () => {
    document.getElementById('shiboNameConfirmBtn').disabled = inp.value.trim().length === 0;
  });
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter' && inp.value.trim()) confirmShiboName();
    if(e.key === 'Escape') cancelShiboName();
  });
}
function renderShiboBtn(){
  const done = shiboBuffer.length;
  const btn = document.getElementById('btnShibo');
  if(done > 0 && done < 6){
    btn.textContent = T('symbol.done').repeat(done)+T('symbol.empty').repeat(6-done);
  } else if(done === 6){
    btn.textContent = T('btn.shibo_done');
  } else if(_shiboNameReady){
    btn.textContent = T('btn.shibo_ready');
  } else {
    btn.textContent = T('btn.shibo');
  }
}
function _positionShiboBadge(){
  const badge = document.getElementById('shiboNameBadge');
  const btn = document.getElementById('btnShibo');
  const r = btn.getBoundingClientRect();
  const bw = badge.offsetWidth || 60, bh = badge.offsetHeight || 20;
  const GAP = 7, MARGIN = 4;
  const vp = window.visualViewport ? {w:window.visualViewport.width,h:window.visualViewport.height,ox:window.visualViewport.offsetLeft,oy:window.visualViewport.offsetTop} : {w:window.innerWidth,h:window.innerHeight,ox:0,oy:0};
  let x = r.left - vp.ox + r.width/2 - bw/2;
  x = Math.max(MARGIN, Math.min(vp.w - bw - MARGIN, x));
  let y = r.bottom - vp.oy + GAP;
  if(y + bh > vp.h - MARGIN) y = r.top - vp.oy - bh - GAP;
  badge.style.left = x + 'px';
  badge.style.top  = y + 'px';
}
function confirmShiboName(){
  const inp = document.getElementById('shiboNameInput');
  _shiboName = inp.value.trim();
  _shiboNameReady = true;
  closeShiboNamePop();
  const badge = document.getElementById('shiboNameBadge');
  badge.textContent = _shiboName;
  badge.style.display = 'block';
  _positionShiboBadge();
  window.addEventListener('resize', _positionShiboBadge);
  renderShiboBtn();
  updateSettingsBtn();
  setMsg(T('msg.shibo_named', _shiboName), 'success');
}
function cancelShiboName(){
  _shiboName = '';
  _shiboNameReady = false;
  closeShiboNamePop();
}
function closeShiboNamePop(){
  document.getElementById('shiboNamePop').style.display = 'none';
  _closeOverlay();
}
function _clearShiboBadge(){
  _shiboName = '';
  _shiboNameReady = false;
  window.removeEventListener('resize', _positionShiboBadge);
  document.getElementById('shiboNameBadge').style.display = 'none';
  renderShiboBtn();
}

function _shiboRatio(){
  const w = (shiboProbWeights || shiboProbDefaults)[bitRowMode];
  return Object.values(w).join(':');
}

function shiboClick(){
  if(stateLocked){ setMsg(T('msg.shibo_locked'),'error'); return; }
  if(shiboBuffer.length === 0 && !_shiboNameReady){ openShiboNamePop(); return; }
  if(shiboBuffer.length >= 6) shiboBuffer.length = 0;
  const mode = bitRowMode === 'quaternary' ? 'quaternary' : 'binary';
  const weights = shiboProbWeights ? shiboProbWeights[mode]
                : (mode==='quaternary' ? {"6":1,"7":5,"8":7,"9":3} : {"0":1,"1":1});
  shiboBuffer.push(weightedRandom(weights));
  const done = shiboBuffer.length;
  updateSettingsBtn();
  renderShiboBtn();
  setMsg(T('msg.shibo_progress', done), 'success');
  if(done === 6){
    for(let i=0;i<6;i++) state[i] = shiboBuffer[i];
    if(bitRowMode === 'quaternary') deriveState01();
    renderAll();
    const _savedBits = [...shiboBuffer];
    doQuery().then(()=>{
      _lsSave({ digits: _savedBits, time: new Date().toISOString(), shibo: _shiboRatio(), favo: false, name: _shiboName||'', note: '' });
      flashBtn('btnSave');
      setMsg(T('msg.shibo_done', _savedBits.join(' ')), 'success');
    });
    const sb = document.getElementById('btnShibo');
    sb.classList.add('shibo-complete');
    sb.disabled = true;
    document.querySelectorAll('.yao-btn,.bit-toggle,#numDisplay').forEach(el=>el.classList.add('shibo-lit'));
    updateSettingsBtn();
    setTimeout(()=>{
      shiboBuffer.length = 0;
      sb.classList.remove('shibo-complete');
      sb.disabled = false;
      _clearShiboBadge();
      updateSettingsBtn();
    }, 3000);
  }
}

// 八卦显示 及上下标识更新函数，基于当前 state 或 state_0（取决于 bitRowMode）
function updateTrigrams(){
  const src = bitRowMode==='quaternary' ? state_0 : state;
  const lower=src.slice(0,3).join(""), upper=src.slice(3,6).join("");
  [['upper',upper],['lower',lower]].forEach(([pfx,bits])=>{
    const t = TRIGRAM_INFO[bits];
    const charEl = document.getElementById(pfx+'Char');
    charEl.textContent = t.name; charEl.style.color = t.color;
    charEl.parentElement.style.setProperty('--tri-color', t.color);
    ['Num','Thing'].forEach((id,i)=>{
      const el = document.getElementById(pfx+id);
      el.textContent = t[TAB_FIELDS[currentTab][i]]; el.style.color = t.color;
    });
  });
}

// binary → quaternary：將 {0,1} 映射為靜爻 {8,7}（陰靜=8 陽靜=7），再派生 state_0/state_1
// quaternary → binary：以 state_0（本卦）還原為 {0,1}
function setBitRowMode(m){
  bitRowMode = m;
  if(m === 'quaternary'){
    for(let i=0;i<6;i++) state[i] = state[i] ? 7 : 8;
    deriveState01();
  } else {
    for(let i=0;i<6;i++) state[i] = state_0[i];
    guaxiangSlots = null;
  }
}

// 統一訊息欄：type 'success'（白色）| 'error'（紅色）| ''（清空）
function setMsg(text, type){
  const el = document.getElementById('msgBox');

  el.innerHTML = text ? '<span>'+text+'</span>' : '';
}

(function(){
  const el = document.getElementById('msgBox');
  let fadeTimer = null, clearTimer = null;
  function cancelTimers(){ clearTimeout(fadeTimer); clearTimeout(clearTimer); fadeTimer = clearTimer = null; }
  function fitError(){
    el.style.fontSize = '';
    if(!el.textContent.trim()) return;
    let size = 0.85;
    while(el.scrollHeight > el.clientHeight && size > 0.45){
      size = Math.round((size - 0.05) * 100) / 100;
      el.style.fontSize = size + 'rem';
    }
  }
  new MutationObserver(function(){
    cancelTimers();
    el.style.transition = 'none';
    el.classList.remove('msg-fading');
    el.offsetHeight; // force reflow — snaps opacity to 1 instantly
    el.style.transition = '';
    fitError();
    if(!el.textContent.trim()) return;
    fadeTimer = setTimeout(function(){
      el.classList.add('msg-fading');
      clearTimer = setTimeout(function(){
        el.className = 'msg'; // 重置至初始（移除 msg--success/error 及 msg-fading）
        el.textContent = '';
      }, 10000);
    }, 3000);
  }).observe(el, {childList:true, characterData:true, subtree:true});
})();

// quaternary 值語意：6=老陰（陰變陽）8=陰靜  →  本卦(state_0)為陰
//               7=陽靜            9=老陽（陽變陰）→ 本卦為陽
// 之卦(state_1)：老陰/老陽翻轉，靜爻不變
function deriveState01(){
  for(let i=0;i<6;i++){
    state_0[i] = (state[i] === 6 || state[i] === 8) ? 0 : 1;
    state_1[i] = (state[i] === 8 || state[i] === 9) ? 0 : 1;
  }
}

/* ── Markdown 渲染（處理自定義子集：###/####/#####標題、**粗體**、倪曰注釋、漢字序號條目） ── */
function _nameHtml(s){ return String(s).replace(/\{([^|{}]+)\|([^|{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>'); }
function renderInline(s){
  return s
    .replace(/&&(.+?)\/&/g,'$1')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\{([^|{}]+)\|([^|{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function renderMD(text, statuses=null){
  if(!text) return '<p class="body-line" style="color:#5a4020;">'+T('content.empty')+'</p>';
  text = text.replace(/&&(.+?)\/&/g,'$1');
  let html = '';
  let inSub = false;
  let sectionOpen = false;
  function closeSub(){ if(inSub){ html += '</div></div>'; inSub=false; } }
  for(const raw of text.split('\n')){
    const line = raw.trim();
    if(!line){ html += '<br>'; continue; }
    if(line === '&N&'){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      if(statuses){
        html += '<div class="ci-section ci-section-dim">';
        sectionOpen = true;
      }
      continue;
    }
    const om = line.match(/^&(\d+)&$/);
    if(om){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      if(statuses){
        const st = statuses[parseInt(om[1])] || 'b';
        html += '<div class="ci-section ci-section-'+st+'">';
        sectionOpen = true;
      }
      continue;
    }
    if(line === '/N&' || /^\/\d+&$/.test(line)){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      continue;
    }
    if(line.startsWith('##### ')){
      html += '<div class="yao-heading">'+renderInline(line.slice(6))+'</div>';
    } else if(line.startsWith('#### ')){
      closeSub();
      const name = line.slice(5).trim();
      const jieAttr = name==='解' ? ' data-jie' : '';
      html += '<div class="sub-section" data-mode="full"'+jieAttr+'>';
      html += '<div class="sub-heading"><span>'+renderInline(name)+'</span>'
            + '<button class="section-toggle" onclick="toggleSection(this)">▼</button></div>';
      html += '<div class="sub-section-body">';
      inSub = true;
    } else if(line.startsWith('### ')){
      closeSub();
      html += '<div class="sec-heading">'+renderInline(line.slice(4))+'</div>';
    } else if(line.startsWith('**') && line.endsWith('**') && line.length > 4){
      html += '<div class="bold-title">'+renderInline(line.slice(2,-2))+'</div>';
    } else if(line.startsWith('> ') || line === '>'){
      const body = line.startsWith('> ') ? line.slice(2) : '';
      html += '<p class="annotation">'+(body.trim() ? renderInline(body) : '&nbsp;')+'</p>';
    } else if(line.startsWith('• ')){
      const rest = line.slice(2);
      const sep = rest.search(/[、.：:]/);
      if(sep !== -1){
        const label = rest.slice(0, sep + 1);
        const body  = rest.slice(sep + 1);
        html += '<div class="content-item"><span class="item-num">'+label+'</span>'+renderInline(body)+'</div>';
      } else {
        html += '<div class="content-item">'+renderInline(rest)+'</div>';
      }
    } else if(/^!\[([^\]]*)\]\(([^)]+)\)$/.test(line)){
      const im = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
      const alt = _esc(im[1]);
      const src = _esc(im[2]);
      const isPdf = /\.pdf(#|$)/i.test(im[2]);
      const media = isPdf
        ? '<p class="media-missing">'+src+'</p><iframe class="md-pdf" src="'+src+'" title="'+alt+'" onload="this.previousElementSibling.style.display=\'none\'"></iframe>'
        : '<img src="'+src+'" alt="'+alt+'" onerror="_mediaErr(this)">';
      html += '<figure class="md-image">'+media
            + (alt ? '<figcaption>'+alt+'</figcaption>' : '')
            + '</figure>';
    } else {
      html += '<p class="body-line">'+renderInline(line)+'</p>';
    }
  }
  closeSub();
  if(sectionOpen) html += '</div>';
  return html;
}



// 根據変爻數決定哪條爻辭為「斷（a）」哪條為「參考（b）」，其餘 dim
// s0/s1 各有 8 格：[0]=卦辭 [1~6]=初~上爻辭 [7]=用九/用六（乾坤專用）
// yi=変爻索引（升序），nfi=非変爻索引（升序）
// 決定規則（來自占卜筮数文件）：
//   0変 → a=本卦卦辭
//   1変 → a=本卦 該変爻辭
//   2変 → a=本卦 上変爻辭，b=本卦 下変爻辭
//   3変 → a=本卦卦辭，b=之卦卦辭
//   4変 → a=之卦 最低非変爻辭，b=之卦 次低非変爻辭
//   5変 → a=之卦 唯一非変爻辭
//   6変 → 乾/坤：a=本卦用九/用六；其他卦：a=之卦卦辭
function computeGuaxiangSlots(){
  const yi=[],nfi=[];
  for(let i=0;i<6;i++){
    if(state[i]===6||state[i]===9) yi.push(i);
    else nfi.push(i);
  }
  const n=yi.length;
  const s0=Array(8).fill('dim'),s1=Array(8).fill('dim');
  if(n===0){ s0[0]='a'; }
  else if(n===1){ s0[1+yi[n-1]]='a'; }
  else if(n===2){ s0[1+yi[n-1]]='a'; s0[1+yi[0]]='b'; }
  else if(n===3){ s0[0]='a'; s1[0]='b'; }
  else if(n===4){ s1[1+nfi[0]]='a'; s1[1+nfi[1]]='b'; }
  else if(n===5){ s1[1+nfi[0]]='a'; }
  else{
    // 乾（全陽）或坤（全陰）才有 ci[7]（用九/用六）
    const qk=state_0.every(v=>v===1)||state_0.every(v=>v===0);
    if(qk) s0[7]='a'; else s1[0]='a';
  }
  return {s0,s1,n};
}

  if(!guaxiangSlots){ el.innerHTML='<div class="guaxiang-col guaxiang-col-single">'+col(currentData.ci,null)+'</div>'; return; }

// entries: [[tab, enabled], ...]  —— 只更新傳入的頁面，其餘不變
// 若當前頁面被禁用，自動切換到最近可用的；全無則報錯清空內容
function applyTabAvailability(entries){
  for(const [m, enabled] of entries){
    enabled ? tabDisabled.delete(m) : tabDisabled.add(m);
    document.getElementById(TAB_BTN[m]).classList.toggle('tab-disabled', !enabled);
  }
  if(!tabDisabled.has(currentTab)) return;
  const idx = TABS.indexOf(currentTab);
  let fallback = null;
  for(let d = 1; d < TABS.length && !fallback; d++){
    if(idx + d < TABS.length && !tabDisabled.has(TABS[idx + d])) fallback = TABS[idx + d];
    else if(idx - d >= 0     && !tabDisabled.has(TABS[idx - d])) fallback = TABS[idx - d];
  }
  if(fallback){
    setTab(fallback);
  } else {
    setMsg(T('msg.no_tab'), 'error');
    document.getElementById('contentArea').innerHTML = '';
  }
}

// 加權隨機：依 {值: 權重} 字典抽取一個值
function weightedRandom(weights){
  const entries = Object.entries(weights);
  let r = Math.random() * entries.reduce((s,[,w])=>s+w, 0);
  for(const [val,w] of entries){ r-=w; if(r<=0) return parseInt(val); }
  return parseInt(entries[entries.length-1][0]);
}

function fmtPct(v, total){
  if(total <= 0) return '—';
  const pct = v / total * 100;
  const p4 = Number(pct.toPrecision(4));
  return (p4 === pct ? String(pct) : pct.toPrecision(4)) + '%';
}
function pctColor(mode, k){
  return PROB_COLORS[mode][k] || '#c9a84c';
}

function settingsRender(){
  const w = shiboProbWeights || shiboProbDefaults;
  let html = '';
  for(const mode of ['binary','quaternary']){
    const entries = Object.entries(w[mode]);
    const total = entries.reduce((s,[,v])=>s+Number(v), 0);
    html += `<div class="prob-section-label" style="display:flex;justify-content:space-between;align-items:center;">
      <span>${mode === 'binary' ? T('settings.mode.binary') : T('settings.mode.quaternary')}</span>
    </div>`;
    for(const [k, v] of entries){
      const rawLabel = PROB_LABELS[mode][k] || k;
      const sym  = rawLabel.slice(-1);
      const name = rawLabel.slice(0, -1).trimEnd();
      const color = pctColor(mode, k);
      const pct = fmtPct(Number(v), total);
      html += `<div class="prob-row">
        <span class="prob-name"><span class="prob-name-key">(${k})</span><span class="prob-name-lbl"> ${_esc(sym)} ${_esc(name)}</span></span>
        <span class="prob-pct-wrap"><span class="prob-pct${mode==='quaternary'?' prob-pct--glint':''}" id="pct_${mode}_${k}" style="color:${color};${mode==='quaternary'?'animation-delay:'+PROB_GLINT_DELAY[k]:''}">${pct}</span></span>

  const p = shiboProbPresets[idx];

  settingsRender();
  setMsg(T('msg.preset_applied', p.name), 'success');
}

function renderSaveDropdown(records){
  _saveRecords = [...records].reverse();
  const dd = document.getElementById('saveDropdown');
  if(!_saveRecords.length){
    dd.innerHTML = `<div class="save-dropdown-empty">${T('history.empty')}</div>`;
    return;
  }
  dd.innerHTML = _saveRecords.map((rec, i) => {
    const bits = rec.digits;
    const isYarrow = bits.some(b => b > 1);
    const bitsStr = bits.map(b => {
      const c = isYarrow ? (PROB_COLORS.quaternary[String(b)] || '#c9a84c') : (PROB_COLORS.binary[String(b)] || '#c9a84c');
      return `<span style="color:${c}">${b}</span>`;
    }).join('');
    const ts = _relTime(rec.time);
    const favoClass = 'save-favo' + (rec.favo ? ' active' : '');
    return `<div class="save-record${rec.shibo ? ' shibo-lit' : ''}"><span class="save-record-icons"><span class="save-del" onclick="deleteRecord(${i},event)">✖</span><span class="save-edit" onclick="editRecord(${i},event)">✎</span><span class="${favoClass}" onclick="toggleFavo(${i},event)">${rec.favo ? '★' : '☆'}</span></span><span class="save-record-name" onclick="loadSaveRecord(${i})"><span class="save-record-name-inner">${_esc(rec.name||'')}</span></span><span class="save-record-bits" onclick="loadSaveRecord(${i})"><span class="save-record-bits-inner">${bitsStr}</span></span><span class="save-record-time" onclick="loadSaveRecord(${i})">${ts}</span></div>`;
  }).join('');
}

function _relTime(isoStr){
  const s = Math.floor((Date.now() - new Date(isoStr)) / 1000);
  if(s >= 86400 * 365) return T('time.years_ago', Math.floor(s / (86400 * 365)));
  if(s >= 86400)       return T('time.days_ago',  Math.floor(s / 86400));
  if(s >= 3600)        return T('time.hours_ago', Math.floor(s / 3600));
  return T('time.secs_ago', Math.max(0, s));
}

function _recordPreviewHTML(rec){
  const bits = rec.digits;
  const isYarrow = bits.some(b => b > 1);
  const bitsStr = bits.map(b => {
    const c = isYarrow ? (PROB_COLORS.quaternary[String(b)] || '#c9a84c') : (PROB_COLORS.binary[String(b)] || '#c9a84c');
    return `<span style="color:${c}">${b}</span>`;
  }).join(' ');
  const ts = _relTime(rec.time);
  const favoClass = 'save-favo'+(rec.favo?' active':'');
  return `<div class="save-record save-dd-confirm-preview${rec.shibo?' shibo-lit':''}"><span class="save-record-icons"><span class="${favoClass}">${rec.favo?'★':'☆'}</span></span><span class="save-record-name"><span class="save-record-name-inner">${_esc(rec.name||'')}</span></span><span class="save-record-bits"><span class="save-record-bits-inner">${bitsStr}</span></span><span class="save-record-time">${ts}</span></div>`;
}

function applyPanelScale(s) {
  const root = document.documentElement;
  for (const [k, base] of Object.entries(PANEL_SIZES)) {
    const v = PANEL_FS_KEYS.has(k) ? Math.max(base * s, BTN_FS_MIN) : base * s;
    root.style.setProperty(k, v + 'px');
  }
}

function fitLeftPanel() {
  const panel   = document.querySelector('.left-panel');
  const stacked = document.querySelector('.page-layout').classList.contains('stacked');
  panel.style.height = '';
  applyPanelScale(1);
  const rect  = panel.getBoundingClientRect();
  const avail = window.innerHeight - rect.top - PANEL_BOTTOM_MARGIN;
  let s = 1;
  if (stacked) {
    const scaleW = (window.innerWidth - 2 * PANEL_STACKED_H_MARGIN) / BASE_PANEL_W;
    const scaleH = avail / rect.height;
    s = Math.min(scaleW, scaleH);
  } else {
    if (rect.height > avail) s = avail / rect.height;
  }
  if (s !== 1) applyPanelScale(s);
  panel.style.height = avail + 'px';
  fitSourceOverlay();
}

function fitSourceOverlay() {
  const ov = document.getElementById('sourceOverlay');
  for (const k of Object.keys(PANEL_SIZES)) ov.style.removeProperty(k);
  if (!ov.classList.contains('open')) return;
  const avail    = document.querySelector('.left-panel').getBoundingClientRect().height;
  const body     = ov.querySelector('.source-body');
  const overflow = body.scrollHeight - body.offsetHeight;
  if (overflow <= 0) return;
  const s  = avail / (avail + overflow);
  const cs = getComputedStyle(document.documentElement);
  for (const k of Object.keys(PANEL_SIZES)) {
    const v = parseFloat(cs.getPropertyValue(k));
    if (!isNaN(v)) ov.style.setProperty(k, (v * s) + 'px');
  }
}

function _hdrVal(k, v) { return HDR_FS_KEYS.has(k) ? Math.max(v, BTN_FS_MIN) : v; }

function fitRightHeader() {
  const root = document.documentElement;

  // ── 第一步：寬度 scale ──
  const panelW = document.querySelector('.right-panel').getBoundingClientRect().width;
  const s_w = Math.min(1, panelW / HDR_BASELINE_WIDTH);
  for (const [k, base] of Object.entries(HDR_SIZES))
    root.style.setProperty(k, _hdrVal(k, base * s_w) + 'px');

  // ── 第二步：高度 scale（header 底部不可超過視窗 1/2）──
  // getBoundingClientRect() 強制 style flush，確保第一步已套用
  const rect = document.getElementById('hexHeader').getBoundingClientRect();
  const budget = window.innerHeight / 2;
  if (rect.bottom > budget && rect.height > 0) {
    // header.top 不受 scale 影響；height 與 s 成正比
    // 目標：rect.top + rect.height × (s_final / s_w) = budget
    const s_final = s_w * (budget - rect.top) / rect.height;
    for (const [k, base] of Object.entries(HDR_SIZES))
      root.style.setProperty(k, _hdrVal(k, base * s_final) + 'px');
  }
}

// 同步 #panelToggle / #panelBack 的 display 和位置
function updateToggle() {
  const layout    = document.querySelector('.page-layout');
  const stacked   = layout.classList.contains('stacked');
  const showRight = layout.classList.contains('show-right');
  const toggle    = document.getElementById('panelToggle');
  const back      = document.getElementById('panelBack');

  toggle.style.display = (stacked && !showRight) ? 'flex' : 'none';
  back.style.display = (stacked && showRight) ? 'flex' : 'none';
  document.body.classList.toggle('stacked-right', stacked && showRight);
  document.body.classList.toggle('stacked-left',  stacked && !showRight);
}

// 根據右欄寬度決定是否啓用 stacked 模式，並更新 toggle 顯示狀態

  const layout = document.querySelector('.page-layout');
  layout.classList.remove('stacked', 'show-right');
  const w = document.querySelector('.right-panel').getBoundingClientRect().width;
  if (w < 200) layout.classList.add('stacked');
  // 在無 transform 狀態下量測並快取左欄右邊界
  _leftPanelRight = document.querySelector('.left-panel').getBoundingClientRect().right;

function fitBtnText(root) {
  (root || document).querySelectorAll('button:not(:has(svg)):not(.no-fit)').forEach(btn => {
    if (!btn.textContent.trim()) return;
    btn.style.fontSize = '';
    btn.style.whiteSpace = '';
    const w = btn.offsetWidth;
    if (!w) return;
    let fs = parseFloat(getComputedStyle(btn).fontSize);
    while (btn.scrollWidth > w + 0.5 && fs > BTN_FS_MIN) {
      fs -= 0.5;
      btn.style.fontSize = fs + 'px';
    }
    if (btn.scrollWidth > w + 0.5 && fs <= BTN_FS_MIN) btn.style.whiteSpace = 'normal';
  });
  (root || document).querySelectorAll('.prob-name').forEach(el => {
    el.style.fontSize = '';
    const row = el.closest('.prob-row');
    if (!row) return;
    let fs = parseFloat(getComputedStyle(el).fontSize);
    const nameW = el.offsetWidth; // fixed 50% of row
    while (el.scrollWidth > nameW + 0.5 && fs > BTN_FS_MIN) {
      fs -= 0.5;
      el.style.fontSize = fs + 'px';
    }
    // beyond font floor, CSS text-overflow:ellipsis on .prob-name-lbl handles the rest
  });
}

function _applyConfig(cfg){
  TRIGRAM_INFO    = cfg.trigrams;
  TAB_FIELDS      = cfg.tab_fields;
  TAB_NAMES       = {...cfg.tab_names};
  TAB_NAMES.guaxiang = T('tab.guaxiang');

let _cfgBaseline = null;
let _cfgHexBaseline = null;
let _cfgHexNum = null;
let _cfgHexEdits = {};
function _cfgCheckDirty(){
  const btn = document.getElementById('cfgSaveBtn');
  if(!btn || _cfgBaseline === null) return;
  let dirty = false;
  try { dirty = JSON.stringify(configReadForm()) !== _cfgBaseline; } catch(e){ dirty = true; }
  if(!dirty && _cfgHexBaseline){
    const orig = _HEX_BY_NUM[_cfgHexBaseline.num] || {};
    const nameEl = document.getElementById('cfg-hex-name');
    const shortEl = document.getElementById('cfg-hex-short');
    if(nameEl && (nameEl.value !== (orig.name||'') || shortEl.value !== (orig.short_name||'')))
      dirty = true;
    if(!dirty){
      const curN = _cfgHexBaseline.num;
      for(const [k, edit] of Object.entries(_cfgHexEdits)){
        if(parseInt(k) === curN) continue;
        const d = _HEX_BY_NUM[parseInt(k)] || {};
        if(edit.name !== (d.name||'') || edit.short_name !== (d.short_name||'')){ dirty = true; break; }
      }
    }
  }
  btn.disabled = !dirty;
  btn.classList.toggle('primary', dirty);
}
function configSave(){
  let cfg;
  try { cfg = configReadForm(); _validateCfg(cfg); }
  catch(e){ setMsg(e.message, 'error'); return; }
  const _cfgFormDirty = JSON.stringify(cfg) !== _cfgBaseline;
  if(_cfgFormDirty){
    _lsSaveConfig(cfg);
    _srcSetClean('cfg', false);
    _applyConfig(cfg);
    _cfgBaseline = JSON.stringify(cfg);
  }
  _cfgStashCurrentHexEdits();
  for(const [numStr, edit] of Object.entries(_cfgHexEdits)){
    const n = parseInt(numStr);
    const d = _HEX_BY_NUM[n];
    if(!d) continue;
    if(edit.name !== (d.name||'')){
      _lsApplyHexOv(n, 'name', edit.name);
      d.name = edit.name;
      if(d.sequence) _HEX_BY_SEQ[d.sequence].name = edit.name;
    }
    if(edit.short_name !== (d.short_name||'')){
      _lsApplyHexOv(n, 'short_name', edit.short_name);
      d.short_name = edit.short_name;
      if(d.sequence) _HEX_BY_SEQ[d.sequence].short_name = edit.short_name;
    }
  }
  _cfgHexEdits = {};
  if(currentData) renderHeader();
  setMsg(T('msg.config_saved'), 'success');
  const btn = document.getElementById('cfgSaveBtn');
  btn.disabled = true; btn.classList.remove('primary');
}

function _secInner(i18nKey, varName=''){
  return varName
    ? `<div>${T(i18nKey)}</div><div class="config-subsec" style="margin-top:2px">${varName}</div>`
    : T(i18nKey);
}
function _secTitle(i18nKey, varName='', btn=''){
  return `<div class="config-section-title"><div>${_secInner(i18nKey, varName)}</div>${btn}</div>`;
}

function _cfgStashCurrentHexEdits(){
  if(!_cfgHexBaseline) return;
  const n = _cfgHexBaseline.num;
  const nameEl = document.getElementById('cfg-hex-name');
  const shortEl = document.getElementById('cfg-hex-short');
  if(!nameEl) return;
  const orig = _HEX_BY_NUM[n] || {};
  if(nameEl.value !== (orig.name||'') || shortEl.value !== (orig.short_name||'')){
    _cfgHexEdits[n] = { name: nameEl.value, short_name: shortEl ? shortEl.value : '' };
  } else {
    delete _cfgHexEdits[n];
  }
}

function configHexNumChange(val){
  _cfgStashCurrentHexEdits();
  const n = Math.max(1, Math.min(64, parseInt(val) || 1));
  _cfgHexNum = n;
  const d = _HEX_BY_NUM[n] || {};
  _cfgHexBaseline = { num: n, name: d.name || '', short_name: d.short_name || '' };
  const nameEl = document.getElementById('cfg-hex-name');
  const shortEl = document.getElementById('cfg-hex-short');
  const edit = _cfgHexEdits[n];
  if(nameEl) nameEl.value = edit ? edit.name : (d.name || '');
  if(shortEl) shortEl.value = edit ? edit.short_name : (d.short_name || '');
}
function configHexStep(delta){
  const el = document.getElementById('cfg-hex-num');
  const n = Math.max(1, Math.min(64, (parseInt(el.value)||1) + delta));
  el.value = n;
  configHexNumChange(n);
}

  cfg.tab_names = {};
  for(const t of ['tab1','tab2','tab3'])

    const vals = [document.getElementById(`cfg-tf-${t}-0`).value.trim(), document.getElementById(`cfg-tf-${t}-1`).value.trim()].filter(Boolean);
    cfg.tab_fields[t] = vals;
  }
  const extraKeys = [...document.querySelectorAll('#cfg-tri-table thead th[data-key]')].map(th => th.dataset.key);
  cfg.trigrams = {};
  for(const bits of _CFG_TRIGRAMS){
    const t = {
      name:  document.getElementById(`cfg-tri-${bits}-name`).value,
      color: document.getElementById(`cfg-tri-${bits}-color`).value,

    for(const k of extraKeys){
      const el = document.getElementById(`cfg-tri-${bits}-${k}`);
      if(el) t[k] = el.value;
    }
    cfg.trigrams[bits] = t;
  }
  cfg.shibo_probs = {
    binary:     {'0':+document.getElementById('cfg-prob-bin-0').value, '1':+document.getElementById('cfg-prob-bin-1').value},
    quaternary: {'6':+document.getElementById('cfg-prob-quat-6').value,'7':+document.getElementById('cfg-prob-quat-7').value,'8':+document.getElementById('cfg-prob-quat-8').value,'9':+document.getElementById('cfg-prob-quat-9').value},
  };
  cfg.shibo_presets = [];
  document.querySelectorAll('.cfg-preset-row').forEach(card => {
    const mode = card.querySelector('.cfg-preset-mode').value;
    const probs = {};
    card.querySelectorAll('.cfg-preset-prob').forEach(inp => { probs[inp.dataset.key] = +inp.value; });
    cfg.shibo_presets.push({ name: card.querySelector('.cfg-preset-name').value, mode, probs });
  });
  return cfg;
}

function sourceLoadFile(type, inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      if(type === 'md'){
        const secs = _parseMdSections(e.target.result);
        if(Object.keys(secs).length === 0) throw new Error('No hexagram sections (## NN.) found');
        const ov = _lsGetHexOv();
        for(const [numStr, fields] of Object.entries(secs)){
          const n = parseInt(numStr);
          if(!ov[numStr]) ov[numStr] = {};
          Object.assign(ov[numStr], fields);
          const h = _HEX_BY_NUM[n]; if(!h) continue;
          Object.assign(h, fields);
          if(_HEX_BY_SEQ[h.sequence]) Object.assign(_HEX_BY_SEQ[h.sequence], fields);
        }
        localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
        if(currentData){ renderContent(currentData); }
        _srcSetClean('md', true, file.name);
      } else if(type === 'cfg'){
        const cfg = JSON.parse(e.target.result);
        _validateCfg(cfg);
        const {hexagrams, overrides, ...cfgOnly} = cfg;
        _lsSaveConfig(cfgOnly); _applyConfig(cfgOnly);
        if(Array.isArray(hexagrams) && hexagrams.length > 0){
          for(const h of hexagrams){
            if(typeof h.num !== 'number') throw new Error(`Hexagram entry missing "num"`);
            if(typeof h.sequence !== 'string' || !/^[01]{6}$/.test(h.sequence)) throw new Error(`Hexagram ${h.num}: invalid "sequence" (expected 6 binary digits)`);
          }
          const IC_FIELDS = ['name','short_name','ci','symbol'];
          const ov = _lsGetHexOv();
          for(const h of hexagrams){
            const k = String(h.num); if(!_HEX_BY_NUM[h.num]) continue;
            if(!ov[k]) ov[k] = {};
            for(const f of IC_FIELDS) if(f in h){
              ov[k][f] = h[f]; _HEX_BY_NUM[h.num][f] = h[f];
              if(_HEX_BY_SEQ[h.sequence]) _HEX_BY_SEQ[h.sequence][f] = h[f];
            }
          }
          for(const [numStr, fields] of Object.entries(overrides || {})){
            const n = parseInt(numStr); if(!_HEX_BY_NUM[n]) continue;
            const h = _HEX_BY_NUM[n]; const k = String(n);
            if(!ov[k]) ov[k] = {};
            for(const f of IC_FIELDS) if(f in fields){
              ov[k][f] = fields[f]; h[f] = fields[f];
              if(_HEX_BY_SEQ[h.sequence]) _HEX_BY_SEQ[h.sequence][f] = fields[f];
            }
          }
          localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
          if(currentData){ currentData = _HEX_BY_NUM[currentData.num] || currentData; renderContent(currentData); renderHeader(); }
        }
        _srcSetClean('cfg', true, file.name);
      } else if(type === 'saves'){
        const records = JSON.parse(e.target.result);
        if(!Array.isArray(records)) throw new Error('saves.json must be a JSON array');
        localStorage.setItem(_LS_SAVES, JSON.stringify(records));
        _srcSetClean('saves', true, file.name);
      }
    } catch(err){ sourceErrOpen(err.message); }
    inputEl.value = '';
  };
  reader.readAsText(file);
}
function sourceDownload(type){
  let data, filename, mime = 'application/json';
  if(type === 'saves'){ data = JSON.stringify(_lsLoadSaves(), null, 2); filename = 'saves.json'; }
  else if(type === 'cfg'){
    data = JSON.stringify({..._lsGetConfig(), hexagrams: _reconstructIching()}, null, 2);
    filename = 'config.json';
  }
  else if(type === 'md'){ data = _reconstructMd(); filename = 'text.md'; mime = 'text/markdown'; }
  else return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type: mime}));
  a.download = filename; a.click(); URL.revokeObjectURL(a.href);
}
function _reconstructMd(){
  return Object.values(_HEX_BY_NUM)
    .sort((a,b) => a.num - b.num)
    .map(h => `## ${String(h.num).padStart(2,'0')}.\n### _\n${h['text.tab1']||''}\n### _\n${h['text.tab2']||''}\n### _\n${h['text.tab3']||''}`)
    .join('\n\n');
}
function _reconstructIching(){
  return Object.values(_HEX_BY_NUM)
    .sort((a,b) => a.num - b.num)
    .map(({num,sequence,name,short_name,symbol,ci}) => ({num,sequence,name,short_name,symbol,ci}));
}
function _parseMdSections(text){
  const SEC = ['text.tab1','text.tab2','text.tab3'];
  const result = {};
  let curNum = null, sections = [], curLines = null;
  for(const raw of text.split('\n')){
    const s = raw.trimEnd();
    const m = s.match(/^## (\d{2})\./);
    if(m){
      if(curNum !== null){
        if(curLines !== null) sections.push(curLines);
        result[String(curNum)] = Object.fromEntries(
          SEC.slice(0, sections.length).map((f,i) => [f, sections[i].join('\n').trim()])
        );
      }
      curNum = parseInt(m[1]); sections = []; curLines = null; continue;
    }
    if(curNum === null) continue;
    if(s.startsWith('### ')){ if(curLines !== null) sections.push(curLines); curLines = []; continue; }
    if(curLines !== null) curLines.push(s);
  }
  if(curNum !== null){
    if(curLines !== null) sections.push(curLines);
    result[String(curNum)] = Object.fromEntries(
      SEC.slice(0, sections.length).map((f,i) => [f, sections[i].join('\n').trim()])
    );
  }
  return result;
}

let _editOrigText = '', _editOrigText0 = '', _editOrigText1 = '';

function _seqOpposite(seq){ return seq.split('').map(c=>c==='1'?'0':'1').join(''); }
function _seqInverse(seq){ return seq.split('').reverse().join(''); }
function _seqSwap(seq){ return seq[3]+seq[4]+seq[5]+seq[0]+seq[1]+seq[2]; }
function _seqNuclear(seq){ return seq[1]+seq[2]+seq[3]+seq[2]+seq[3]+seq[4]; }
function _relModeData(data, mode){
  if(!data || mode==='original' || mode==='zhi') return null;
  const seq = data.sequence;
  let rseq;
  if(mode==='opposite')      rseq = _seqOpposite(seq);
  else if(mode==='inverse')  rseq = _seqInverse(seq);
  else if(mode==='swap')     rseq = _seqSwap(seq);
  else if(mode==='nuclear')  rseq = _seqNuclear(seq);
  return rseq ? (_HEX_BY_SEQ[rseq] || null) : null;
}

function _activeHex(){

function _teCheckDirty(){
  const btn = document.getElementById('teditSaveBtn');

    const a0 = document.getElementById('textEditorArea0');
    const a1 = document.getElementById('textEditorArea1');

    if(!dirty && a1 && a1.value !== _editOrigText1) dirty = true;
  } else {
    const a = document.getElementById('textEditorArea');
    if(a && a.value !== _editOrigText) dirty = true;
  }
  btn.disabled = !dirty;
  btn.classList.toggle('primary', dirty);
}

function enterEditMode(){
  if(stateLocked || !currentData) return;
  _editField = _editFieldForTab();
  if(!_editField) return;
  _editMode = true;
  _editDual = _editField === 'ci' && _isDualGuaxiang();

      +'<textarea id="textEditorArea1" class="text-editor-area" spellcheck="false"></textarea></div>';

    _editOrigText1 = (currentData1.ci || []).join('\n');
    document.getElementById('textEditorArea0').value = _editOrigText0;

    document.getElementById('textEditorArea0').addEventListener('input', _teCheckDirty);
    document.getElementById('textEditorArea1').addEventListener('input', _teCheckDirty);
    document.getElementById('textEditorArea0').focus();
  } else {
    const d = _activeHex();
    body.innerHTML = '<textarea id="textEditorArea" class="text-editor-area" spellcheck="false"></textarea>';
    _editOrigText = _editField === 'ci' ? (d.ci || []).join('\n') : (d[_editField] || '');
    document.getElementById('textEditorArea').value = _editOrigText;
    document.getElementById('textEditorArea').addEventListener('input', _teCheckDirty);
    document.getElementById('textEditorArea').focus();
  }

  _teCheckDirty();
  updateEditBtn();
}

function cancelTextEdit(){
  _editMode = false; _editField = null; _editDual = false;
  document.getElementById('textEditorBody').innerHTML =
    '<textarea id="textEditorArea" class="text-editor-area" spellcheck="false"></textarea>';
  document.getElementById('textEditorWrap').classList.remove('open');
  document.getElementById('contentArea').style.display = '';
  renderHeader();
  updateEditBtn();
}

function _hasH3(text){ return /^#{2,3}(?!#)/m.test(text); }

async function saveTextEdit(){
  if(!_editMode || !currentData) return;
  try{
    // block ### (section-level heading) — only #### and deeper are allowed
    const textsToCheck = _editDual
      ? [document.getElementById('textEditorArea0').value,
         document.getElementById('textEditorArea1').value]
      : [document.getElementById('textEditorArea').value];
    if(textsToCheck.some(_hasH3)){ setMsg(T('msg.edit_has_h3'), 'error'); return; }

    const upd = (num, field, text) => {
      _lsApplyHexOv(num, field, text);
      return Promise.resolve({ok: true});
    };

    // ── content ──────────────────────────────────────────────────────
    const contentJobs = [];
    if(_editDual){
      const t0 = document.getElementById('textEditorArea0').value;
      const t1 = document.getElementById('textEditorArea1').value;
      const jobs = [];
      if(t0 !== _editOrigText0) jobs.push(upd(currentData.num,'ci',t0).then(r=>{ if(!r.ok) throw new Error(); _HEX_BY_SEQ[currentData.sequence].ci=t0.split('\n'); _HEX_BY_NUM[currentData.num].ci=t0.split('\n'); }));
      if(t1 !== _editOrigText1) jobs.push(upd(currentData1.num,'ci',t1).then(r=>{ if(!r.ok) throw new Error(); _HEX_BY_SEQ[currentData1.sequence].ci=t1.split('\n'); _HEX_BY_NUM[currentData1.num].ci=t1.split('\n'); }));
      await Promise.all(jobs);
    } else {
      const d = _activeHex();
      const text = document.getElementById('textEditorArea').value;
      if(text !== _editOrigText){
        const r = await upd(d.num, _editField, text);
        if(!r.ok){ setMsg(T('msg.save_fail'),'error'); return; }
        const val = _editField === 'ci' ? text.split('\n') : text;
        _HEX_BY_SEQ[d.sequence][_editField] = val;
        _HEX_BY_NUM[d.num][_editField] = val;
      }
    }

    cancelTextEdit(); renderContent(currentData); renderHeader();
  } catch(e){ setMsg(T('msg.save_fail'), 'error'); }
}

(function(){
  let _t = null, _el = null;
  function _clear(el){ el.style.removeProperty('--sb-c'); el.style.removeProperty('--sb-c-hover'); }
  function _off(){ if(_el){ _clear(_el); _el = null; } }
  function _on(e){
    const el = e.target;
    if(el === document || el === document.documentElement) return;
    if(_el && _el !== el){ _clear(_el); }
    _el = el;
    el.style.setProperty('--sb-c','var(--c-gold)');
    el.style.setProperty('--sb-c-hover','var(--c-gold)');
    clearTimeout(_t);
    _t = setTimeout(_off, 400);
  }
  document.addEventListener('scroll', _on, true);
  document.addEventListener('mouseup', function(){ clearTimeout(_t); _off(); });
})();
(function(){
  const ov = document.getElementById('tip-overlay') || (() => { const d = document.createElement('div'); d.id = 'tip-overlay'; document.body.appendChild(d); return d; })();
  const GAP = 7, MARGIN = 4;
  function _vp(){ const vp = window.visualViewport; return vp ? {w:vp.width,h:vp.height,ox:vp.offsetLeft,oy:vp.offsetTop} : {w:window.innerWidth,h:window.innerHeight,ox:0,oy:0}; }
  function show(el){
    const text = el.dataset.tip;
    if(!text) return;
    ov.classList.remove('visible');
    ov.textContent = text;
    const ow = ov.offsetWidth, oh = ov.offsetHeight;
    const r = el.getBoundingClientRect();
    const vp = _vp();
    const below = el.classList.contains('tip-below');
    let x = r.left - vp.ox + r.width/2 - ow/2;
    x = Math.max(MARGIN, Math.min(vp.w - ow - MARGIN, x));
    let y = below ? r.bottom - vp.oy + GAP : r.top - vp.oy - oh - GAP;
    if( below && y + oh > vp.h - MARGIN) y = r.top - vp.oy - oh - GAP;
    if(!below && y < MARGIN)             y = r.bottom - vp.oy + GAP;
    y = Math.max(MARGIN, Math.min(vp.h - oh - MARGIN, y));
    ov.style.left = x + 'px';
    ov.style.top  = y + 'px';
    ov.classList.add('visible');
  }
  function hide(){ ov.classList.remove('visible'); }
  document.addEventListener('pointerover', function(e){
    const el = e.target.closest('[data-tip]');
    if(el) show(el);
  });
  document.addEventListener('pointerout', function(e){
    const el = e.target.closest('[data-tip]');
    if(el && !el.contains(e.relatedTarget)) hide();
  });
})();
