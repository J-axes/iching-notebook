<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易</title>
<style>
:root{
  /* ── 左欄佈局 ── */
  --panel-w:  240px; /* .yao-btn / .shibo-row / .msg / .tab-bar 的 width；.settings-panel 的 width */
  --yao-h:     44px; /* .yao-btn（六個爻位按鈕）的 height */
  --ctrl-h:    36px; /* .num-arrow / .num-input / .lock-btn / .search-btn / .settings-btn 的 height；也作 .msg min-height */
  --bit-sz:    32px; /* .bit-toggle（六個數位格）的 width 和 height（正方形） */
  --arrow-w:   24px; /* .num-arrow（序列號 ◀▶ 按鈕）的 width */
  --input-w:   88px; /* .num-input（序列號輸入框）的 width */
  --col-gap:    5px; /* .yao-col 的 gap，控制六個爻位按鈕與 bit-row 之間的垂直間距 */
  --row-gap:  7.5px; /* .bit-row 和 .num-ctrl 的 margin-top，距上方爻位列的距離 */
  --tab-gap:   10px; /* .tab-bar 的 margin-top 和 gap，控制頁籤列與上方元素距離及頁籤間距 */
  --shibo-gap:  8px; /* .shibo-row 的 gap，筮卜按鈕、設置按鈕、保存按鈕之間的水平間距 */
  --shibo-mt:   2px; /* .yao-bian-btn 和 .shibo-row 的 margin-top */
  --sep-m:      4px; /* .hex-sep（上下卦虛線分隔）的 margin-top 和 margin-bottom */
  --tab-pad:    6px; /* .tab-btn（圖占/地理/爻辭/卦象）的 padding-top 和 padding-bottom */
  /* ── 左欄結構 ── */
  --yao-pad:   18px; /* .yao-btn 的 padding-left 和 padding-right */
  --yao-gap:   14px; /* .yao-btn 內部 flex gap，分隔 .yao-lbl 標籤與 .line-wrap 爻線區域 */
  --lbl-w:     28px; /* .yao-lbl（初爻/二爻…上爻 文字標籤）的固定 width */
  --char-sz:   94px; /* .tri-bg-char（背景半透明卦名大字，如「坤」）的 font-size */
  --char-small:11px; /* .tri-bg-num（卦序號）和 .tri-bg-thing（物象，如「地」）的 font-size */
  --char-off:  55px; /* .tri-bg-num 和 .tri-bg-thing 距 .tri-bg-char 中心的垂直偏移（top calc） */
  --icon-sz:   20px; /* .search-btn / .lock-btn / .settings-btn 內部 SVG 圖示的大小 */
  /* ── 左欄字型 ── */
  --fs-ctrl: 14.4px; /* .yao-bian-btn / .shibo-btn / .tab-btn 的 font-size */
  --fs-msg:  13.6px; /* .msg（訊息欄）的 font-size */
  --fs-lbl:    12px; /* .yao-lbl（初爻…上爻）的 font-size */
  --fs-mono:   16px; /* .num-input（序列號）和 .bit-toggle（數位格數字）的 font-size */
  --fs-tip: 11.52px; /* [data-tip]::after（tooltip 浮層）的 font-size */
  --fs-rec:    20px; /* .save-record 整列的基準 font-size（收藏星號繼承此值） */
  --fs-time:   10px; /* .save-record-time（日期時間戳）的 font-size */
  /* ── 右欄標題（.hex-header）── */
  --hdr-symbol-sz:60.8px; /* .hex-symbol（卦象符號 ☰☷☵…）的 font-size */
  --hdr-name-sz:  25.6px; /* .hex-name（卦名，如「坤」）的 font-size */
  --hdr-meta-sz:  13.6px; /* .hex-meta（卦序號、爻位數 meta 資訊）的 font-size */
  --hdr-btn-sz:   12.8px; /* .show-hex-btn（展示本卦／之卦切換按鈕）的 font-size */
  --hdr-arrow-sz:   64px; /* .hex-arrow（本卦→之卦的「→」符號）的 font-size */
  --hdr-lbl-sz:     16px; /* .hex-arrow-label（「本卦」「之卦」標籤）的 font-size */
  --hdr-title-sz:   32px; /* .guaxiang-title（卦象頁大標題）的 font-size */
  --hdr-gap:        16px; /* .hex-header 的 gap，分隔符號、卦名、meta、按鈕 */
  --hdr-mb:         16px; /* .hex-header 的 margin-bottom */
  --hdr-pb:         16px; /* .hex-header 的 padding-bottom（底部分隔線上方空間） */
  --hdr-btn-pv:      6px; /* .show-hex-btn 的 padding-top 和 padding-bottom */
  --hdr-btn-ph:     10px; /* .show-hex-btn 的 padding-left 和 padding-right */
  --hdr-dual-gap:   20px; /* .hex-header-dual（本卦/之卦雙欄 grid）的 gap */
  --hdr-unit-gap:    4px; /* .hex-unit（單卦符號+卦名縱向排列）的 gap */
  --hdr-title-mb:   12px; /* .guaxiang-title 的 margin-bottom */
  /* ── 右欄正文字型 ── */
  --body-sec-sz:  16px;    /* .sec-heading（一級段落標題，帶底線）的 font-size */
  --body-sub-sz:  14.88px; /* .sub-heading（二級子標題，帶虛線底線）的 font-size */
  --body-yao-sz:  14.08px; /* .yao-heading（爻辭左邊框標題）的 font-size */
  --body-item-sz: 14.72px; /* .content-item（帶左邊框的內容塊）和 .body-line 的 font-size */
  --body-jw-sz:   14.4px;  /* .guaxiang-jw-item（卦象頁吉凶判斷條目）的 font-size */
  --body-ann-sz:  10.56px; /* .annotation（注釋斜體文字塊）的 font-size */
  --body-tog-sz:  12px;    /* .section-toggle（折疊／展開切換按鈕）的 font-size */
  /* ── 設置／重置彈窗（.settings-panel）── */
  --sp-top:      90px;  /* .settings-panel 的 top（距視口頂部距離） */
  --sp-pad-v:    20px;  /* .settings-panel 的 padding-top */
  --sp-pad-h:    16px;  /* .settings-panel 的 padding-left / right / bottom */
  --sp-title-sz: 16px;  /* .settings-panel-title（「設置」「重置筮卜」標題）的 font-size */
  --sp-title-mb: 14px;  /* .settings-panel-title 的 margin-bottom */
  --sp-title-pb:  8px;  /* .settings-panel-title 的 padding-bottom（底線上方空間） */
  --sp-close-sz:17.6px; /* .settings-close（「×」關閉按鈕）的 font-size */
  --sp-close-t:  10px;  /* .settings-close 的 top 定位 */
  --sp-close-r:  12px;  /* .settings-close 的 right 定位 */
  --subsec-sz:   18px;  /* sub-section label font-size */
  --subsec-mt:   14px;  /* sub-section label margin-top */
  --subsec-mb:    6px;  /* sub-section label margin-bottom */
  --subsec-ls:    .2em;   /* sub-section label letter-spacing */
  --inp-fsz:      14px;  /* input field font-size（設置／設定面板通用） */
  --sp-row-pv:    3px;  /* .prob-row 的 padding-top 和 padding-bottom */
  --sp-pct-sz: 11.52px; /* .prob-pct（概率百分比數字）的 font-size */
  --sp-act-gap:   8px;  /* .settings-actions（取消／確認按鈕列）的 gap */
  --sp-act-mt:   14px;  /* .settings-actions 的 margin-top */
  --sp-act-pt:   10px;  /* .settings-actions 的 padding-top（頂部分隔線下方空間） */
  --sp-btn-pv:    5px;  /* .settings-btn-action 的 padding-top 和 padding-bottom */
  --sp-input-w:  40px;  /* .prob-input（概率輸入框）的 width */
  --sp-body-sz: 13.6px; /* .sp-body-text（重置確認說明文字）的 font-size */
  --sp-body-mb:  16px;  /* .sp-body-text 的 margin-bottom */
  --win-text-sz: 11px;  /* body text in all windows */
  --win-body-pt:  0px;  /* inner-container top padding in all windows */
  /* ── 保存記錄 dropdown（.save-dropdown）── */
  --dd-maxh: 272px; /* .save-dropdown 的 max-height（超出後出現滾動條） */
  --dd-pv:     3px; /* .save-record 的 padding-top 和 padding-bottom */
  --dd-ph:     3px; /* .save-record 的 padding-left 和 padding-right */
  --dd-gap:    6px; /* .save-record 內 flex gap，分隔收藏星、數列、時間戳 */
  --dd-ep:     3px; /* .save-dropdown-empty（無記錄提示）的 padding */
  --dd-cv-pv:  9px; /* .save-dd-confirm 的 padding-top 和 padding-bottom */
  --dd-cv-mt:  8px; /* .save-dd-confirm-actions 的 margin-top */
  --dd-cv-btn-pv: 4px; /* .save-dd-confirm-btn 的 padding-top 和 padding-bottom */
  /* ── 色板（高頻色值，全域共用）── */
  --c-main:       #d4b870; /* 主正文色：body content / 卦象判斷條目 / 概率分數顯示 */
  --c-accent:     #c9a84c; /* 強調色：.hex-name / .sec-heading；config 欄位標籤、段落代號、欄位表頭；hover 文字色；active 邊框色 */
  --c-border:     #3a2a10; /* 控件邊框：.yao-btn / .bit-toggle / .num-arrow 等預設 border */
  --c-default:    #1e170a; /* 控件背景：所有按鈕、輸入框 background（非 active 狀態） */
  --c-gold:       #f0c040; /* 金色高亮：所有輸入框文字色；binary 0 / active 文字色；.hex-symbol；筮卜完成特效 */
  --c-dim:        #5a4020; /* 非活動暗色：binary 1 / bit-toggle OFF；✖ / ✚ / ★ 等操作按鈕預設色；settings-btn */
  --font-empty:  italic; /* 空狀態提示文字（下拉列表無記錄、佔位符）的 font-style */
  --c-subsec:     #7a6030; /* 次級標籤色：source-section-label / config-section-title / prob-section-label */
  --c-active:     #261e08; /* hover／active 背景：按鈕 hover 或選中時的 background */
  --c-opt:        #2a200e; /* 選項下拉框背景：select / option-style input */
  --c-sep:        #2a2010; /* 細分隔線：.hex-header / .divider / .settings-actions 的 border 色 */
  --c-inset:      #100d07; /* 內嵌容器背景：比 c-page 更深，用於面板內的凹陷區塊 */
  --c-page:       #16110a; /* 頁面最深底色：body background；stacked 模式右欄 overlay background */
  --c-leftBorder: #6a3f0a; /* 左側邊框深棕色：.ci-section-b / guaxiang 條目 / save 條目 / 圖片邊框 */
  /* ── 蓍草爻位文字色（CSS 與 JS PROB_COLORS 共用，單一來源）── */
  --y6-tx: #a0d0ff; /* 老陰（變爻）：.bit-toggle.y6 color；PROB_COLORS.quaternary['6'] */
  --y7-tx: #90e8a0; /* 少陽（靜爻）：.bit-toggle.y7 color；PROB_COLORS.quaternary['7'] */
  --y8-tx: #ffe060; /* 少陰（靜爻）：.bit-toggle.y8 color；PROB_COLORS.quaternary['8'] */
  --y9-tx: #ff9060; /* 老陽（變爻）：.bit-toggle.y9 color；PROB_COLORS.quaternary['9'] */
  /* ── config / settings 輸入框（JS PANEL_SIZES 同步縮放） ── */
  --cfg-input-h: 28px;
  --cfg-body-gap: 14px;  --cfg-sec-gap: 6px;
  --cfg-label-w: 60px;
  --cfg-inp-pv: 3px;     --cfg-inp-ph: 6px;
  --cfg-color-w: 32px;
  --cfg-color-pv: 1px;   --cfg-color-ph: 2px;
  --cfg-num-w: 52px;
  --cfg-rm-fsz: 11px;
  --cfg-cell-pv: 2px;    --cfg-cell-ph: 4px;
  --cfg-preset-pv: 6px;  --cfg-preset-ph: 8px;  --cfg-preset-gap: 5px;
  --cfg-tri-inp-w: 52px;
  --cfg-tri-wrap-pb: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  background:var(--c-page);color:#e8d5a3;
  height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:flex-start;padding:36px 36px 0;
}

/* ── 兩欄佈局 ── */
.page-layout{
  display:flex;gap:48px;align-items:flex-start;
  width:100%;
  flex:1;min-height:0;
}
.left-panel{flex-shrink:0;display:flex;flex-direction:column;align-items:center;position:relative;}
.right-panel{
  flex:1;min-width:0;
  align-self:stretch;overflow:hidden;
  display:flex;flex-direction:column;
}
*{--sb-c:#7a6030;--sb-c-hover:var(--c-accent,#c9a84c);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--sb-c);border-radius:3px;transition:background .4s;}
::-webkit-scrollbar-thumb:hover{background:var(--sb-c-hover);}
#contentArea{flex:1;overflow-y:auto;padding-bottom:48px;}

/* ── 左欄：yao-col + tri-buttons ── */
.yao-col{display:flex;flex-direction:column;align-items:center;gap:var(--col-gap);flex:1}
.tri-buttons{position:relative;display:flex;flex-direction:column;gap:var(--col-gap);}
.tri-bg-char,.tri-bg-num,.tri-bg-thing{
  position:absolute;
  left:calc(var(--yao-pad) + var(--lbl-w) + var(--yao-gap) + (var(--panel-w) - var(--yao-pad) * 2 - var(--lbl-w) - var(--yao-gap)) / 2);
  opacity:.25;pointer-events:none;user-select:none;
}
.tri-bg-char{
  top:50%;transform:translate(-50%,-50%);
  font-size:var(--char-sz);line-height:1;letter-spacing:0;
}
.tri-bg-num,.tri-bg-thing{
  font-size:var(--char-small);line-height:1;font-family:monospace;font-weight:bold;
}
.tri-bg-num{top:calc(50% - var(--char-off));transform:translate(-50%,-100%);}
.tri-bg-thing{top:calc(50% + var(--char-off));transform:translateX(-50%);}

/* ── 爻位按鈕 ── */
.yao-btn{
  width:var(--panel-w);height:var(--yao-h);
  border:1px solid color-mix(in srgb,var(--tri-color,#6a3a10) 30%,var(--c-page));
  background:color-mix(in srgb,var(--tri-color,var(--c-default)) 7%,var(--c-default));
  cursor:pointer;border-radius:6px;
  display:flex;align-items:center;
  padding:0 var(--yao-pad);gap:var(--yao-gap);
  transition:border-color .15s,background .15s;
}
.yao-btn:hover{
  border-color:color-mix(in srgb,var(--tri-color,var(--c-accent)) 65%,var(--c-accent));
  background:color-mix(in srgb,var(--tri-color,var(--c-active)) 12%,var(--c-active));
}
.yao-btn.yang{
  border-color:color-mix(in srgb,var(--tri-color,var(--c-accent)) 55%,var(--c-accent));
  background:color-mix(in srgb,var(--tri-color,var(--c-active)) 15%,var(--c-active));
}
.yao-lbl{font-size:var(--fs-lbl);width:var(--lbl-w);flex-shrink:0;letter-spacing:.05em;text-align:right;}
.yao-lbl.odd{color:rgba(255,255,255,0.38);}
.yao-btn.yang .yao-lbl.odd{color:#ffffff;}
.yao-lbl.even{color:#000000;}
.line-wrap{flex:1;display:flex;align-items:center;padding:0 4px}
.yang-bar{height:5px;flex:1;background:color-mix(in srgb,var(--tri-color,var(--c-gold)) 45%,var(--c-gold));border-radius:3px;box-shadow:0 0 8px rgba(240,192,64,.45);}
.yin-wrap{display:flex;flex:1}
.yin-h{height:5px;flex:1;background:color-mix(in srgb,var(--tri-color,var(--c-border)) 45%,var(--c-page));border-radius:3px}
.yin-gap{flex:1}

/* ── 上下卦分隔線 ── */
.hex-sep{width:100%;border-top:1px dashed var(--c-border);margin:var(--sep-m) 0;}

/* ── 6格數位 ── */
.bit-row{display:flex;gap:var(--col-gap);margin-top:var(--row-gap);}
.bit-toggle{
  width:var(--bit-sz);height:var(--bit-sz);
  border:1px solid var(--c-border);background:var(--c-default);
  border-radius:5px;cursor:pointer;
  color:var(--c-dim);font-size:var(--fs-mono);font-family:monospace;
  transition:border-color .15s,background .15s,color .15s;
}
.bit-toggle.on{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}

/* ── 序列號控件，🔒，🔍── */
.num-ctrl{display:flex;align-items:center;gap:var(--shibo-gap);margin-top:var(--row-gap);}
.num-ctrl.disabled .num-arrow,.num-ctrl.disabled .num-input{opacity:.3;pointer-events:none;cursor:not-allowed;}
.num-arrow{
  width:var(--arrow-w);height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);
  color:var(--c-accent);font-size:var(--fs-mono);border-radius:5px;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.num-arrow:hover{border-color:var(--c-accent);background:var(--c-active);}
.num-input{
  width:var(--input-w);height:var(--ctrl-h);border:2.5px solid var(--c-border);background:var(--c-default);
  color:var(--c-gold);font-size:var(--fs-ctrl);font-family:monospace;
  text-align:center;border-radius:5px;
}
.num-input:focus{outline:none;border-color:var(--c-accent);}
.num-input::-webkit-inner-spin-button,
.num-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.num-input{appearance:textfield;}
.lock-btn{width:var(--ctrl-h);height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);color:var(--c-dim);border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s,color .15s;}
.lock-btn:hover{border-color:#6a4a20;color:var(--c-accent);}
.lock-btn.locked{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}
.btn-inverted{border-color:transparent!important;background:var(--c-accent)!important;color:var(--c-default)!important;}
.btn-inverted .show-hex-label{color:var(--c-page);}
.search-btn{width:var(--ctrl-h);height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);color:var(--c-dim);border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s,color .15s;}
.search-btn:hover{border-color:#6a4a20;color:var(--c-accent);}
.save-dropdown{position:absolute;width:var(--panel-w);left:50%;transform:translateX(-50%);max-height:var(--dd-maxh);overflow-y:auto;overflow-x:hidden;background:var(--c-default);border:1px solid #4a3010;border-radius:6px;z-index:300;display:none;box-shadow:0 4px 20px rgba(0,0,0,.65);}
.save-dropdown.open{display:block;}
.save-record{padding:var(--dd-pv) var(--dd-ph);cursor:default;border-bottom:1px solid #2a1e08;font-size:var(--fs-rec);display:flex;align-items:center;justify-content:flex-start;gap:var(--dd-gap);transition:background .1s;}
.save-record:last-child{border-bottom:none;}
.save-record:hover{background:var(--c-active);}
.save-record-bits{font-family:monospace;font-size:var(--fs-mono);white-space:nowrap;cursor:pointer;align-self:stretch;display:flex;align-items:center;gap:1ch;}
.save-record-time{color:#ffffff;font-size:var(--fs-time);font-family:monospace;text-align:right;margin-left:auto;}
.save-favo{cursor:pointer;color:var(--c-dim);transition:color .15s;flex-shrink:0;user-select:none;}
.save-favo:hover{color:var(--c-accent);}
.save-favo.active{color:var(--c-gold);}
.save-dropdown-empty{padding:var(--dd-ep);color:#4a3830;font-size:var(--fs-rec);text-align:center;letter-spacing:.06em;font-style:var(--font-empty);}
/* 图标按钮 tooltip */
#tip-overlay{position:fixed;z-index:9000;background:#2a1e08;color:var(--c-accent);border:1px solid #4a3010;border-radius:4px;padding:3px 8px;font-size:var(--fs-tip);font-family:"PingFang SC","Noto Serif TC",serif;white-space:nowrap;letter-spacing:.06em;pointer-events:none;opacity:0;transition:opacity .15s;}
#tip-overlay.visible{opacity:1;}

/* ── 爻變按鈕 ── */
.yao-bian-btn{
  width:var(--panel-w);height:var(--ctrl-h);margin-top:var(--shibo-mt);
  border:1px solid var(--c-border);background:var(--c-default);
  color:#7a6030;border-radius:6px;cursor:pointer;
  letter-spacing:.35em;font-size:var(--fs-ctrl);
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  transition:border-color .15s,background .15s,color .15s;
  position:relative;overflow:hidden;white-space:nowrap;
}
.yao-bian-btn:hover{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}
.yao-bian-btn.active{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}

/* ── 筮卜 + 設置按鈕行 ── */
.shibo-row{display:flex;gap:var(--shibo-gap);margin-top:var(--shibo-mt);width:var(--panel-w);}
.shibo-btn{flex:1;height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);color:#7a6030;border-radius:6px;cursor:pointer;letter-spacing:.35em;font-size:var(--fs-ctrl);font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;transition:border-color .15s,background .15s,color .15s;position:relative;overflow:hidden;white-space:nowrap;}
.shibo-btn:hover{border-color:#6a4a20;color:var(--c-accent);}
.settings-btn{width:var(--ctrl-h);height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);color:var(--c-dim);border-radius:6px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s,color .15s;}
.settings-btn:hover{border-color:#6a4a20;color:var(--c-accent);}

/* ── 訊息欄 ── */
.msg{font-size:var(--fs-msg);min-height:var(--ctrl-h);flex:1;overflow:hidden;margin-top:var(--row-gap);letter-spacing:.05em;text-align:center;width:var(--panel-w);box-sizing:border-box;border:.25px solid var(--c-sep);border-radius:5px;padding:2px 6px;transition:border-color .15s,background .15s,color .15s,opacity 10s;display:flex;align-items:center;justify-content:center;}
.msg.msg--error{color:#e06060;border-color:#7a2020;background:#1e0a0a;}
.msg.msg--success{color:#d4cbb8;border-color:#7a7060;background:#1a1810;}
.msg.msg-fading{opacity:0;}

/* ── 頁面切換 ── */
.tab-bar{display:flex;gap:var(--tab-gap);margin-top:var(--tab-gap);width:var(--panel-w);}
.tab-btn{
  flex:1;padding:var(--tab-pad) 0;border:1px solid var(--c-border);background:var(--c-default);
  color:#7a6030;border-radius:5px;cursor:pointer;
  letter-spacing:.2em;font-size:var(--fs-ctrl);
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  transition:border-color .15s,background .15s,color .15s,outline-color .15s;
  outline:1px solid var(--c-border);outline-offset:2px;
  overflow:hidden;white-space:nowrap;
}
.tab-btn.active{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);outline-color:var(--c-accent);}
.tab-btn:hover:not(.active):not(.tab-disabled){border-color:#6a4a20;color:var(--c-accent);outline-color:#6a4a20;}
.tab-btn.tab-disabled{opacity:.3;cursor:not-allowed;pointer-events:none;}



/* ── 右欄：結果標題 ── */
.hex-header{
  display:flex;align-items:center;gap:var(--hdr-gap);
  margin-bottom:var(--hdr-mb);padding-bottom:var(--hdr-pb);border-bottom:1px solid var(--c-sep);
}
.hex-header.guaxiang-layout{flex-direction:column;gap:var(--hdr-unit-gap);}
.hex-symbol{font-size:var(--hdr-symbol-sz);line-height:1;color:var(--c-gold);text-shadow:0 0 28px rgba(240,192,64,.3);flex-shrink:0;transition:color .3s,text-shadow .3s;}
.hex-name{font-size:var(--hdr-name-sz);letter-spacing:.35em;color:var(--c-accent);flex:1;text-align:center;transition:color .3s;}
.hex-name-input{font-size:inherit;color:inherit;text-align:center;background:transparent;border:none;border-bottom:1px solid currentColor;outline:none;width:90%;font-family:inherit;padding:0;letter-spacing:.35em;}
.hex-meta{font-size:var(--hdr-meta-sz);color:#7a6030;letter-spacing:.1em;flex-shrink:0;text-align:right;}
.show-hex-btn{background:var(--c-default);border:1px solid var(--c-border);border-radius:5px;color:#7a6030;cursor:default;opacity:.45;font-size:var(--hdr-btn-sz);letter-spacing:.2em;padding:var(--hdr-btn-pv) var(--hdr-btn-ph);font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;position:relative;overflow:hidden;transition:border-color .15s,background .15s,color .15s,opacity .15s;}
.show-hex-btn.show-hex-active{border-color:var(--c-border);background:var(--c-active);color:var(--c-gold);cursor:pointer;opacity:1;}
.show-hex-btn.show-hex-active:hover:not(.btn-inverted){border-color:#6a4a20;}
.show-hex-btn.btn-inverted{border-color:transparent;background:var(--c-accent);color:var(--c-default);}
.show-hex-btn.btn-inverted .show-hex-label{color:var(--c-page);}
.hex-header-dual{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--hdr-dual-gap);width:100%;}
.hex-unit{display:flex;flex-direction:column;align-items:center;gap:var(--hdr-unit-gap);min-width:0;}
.hex-arrow{font-size:var(--hdr-arrow-sz);font-weight:bold;color:var(--c-accent);}
.hex-arrow-label{font-size:var(--hdr-lbl-sz);color:var(--c-accent);letter-spacing:.1em;}
.hex-header-dual .hex-name{font-size:var(--hdr-name-sz);white-space:nowrap;}

/* ── 右欄：內容渲染 ── */
#contentArea{display:flex;flex-direction:column;gap:6px;}
.sec-heading{
  font-size:var(--body-sec-sz);color:var(--c-accent);letter-spacing:.35em;
  margin:20px 0 8px;padding-bottom:6px;
  border-bottom:1px solid var(--c-sep);
}
.sec-heading:first-child{margin-top:0;}
.sub-heading{
  font-size:var(--body-sub-sz);color:var(--c-accent);letter-spacing:.28em;
  margin:18px 0 6px;padding-bottom:4px;
  border-bottom:1px dashed var(--c-border);
}
.yao-heading{
  font-size:var(--body-yao-sz);color:var(--c-accent);letter-spacing:.18em;
  margin:12px 0 2px;padding-left:8px;
  border-left:2px solid var(--c-leftBorder);
}
.bold-title{
  font-size:var(--body-sec-sz);
  color:var(--c-gold);font-weight:bold;letter-spacing:.25em;
  text-align:center;padding:6px 0;
}
.content-item{
  background:var(--c-default);border-left:3px solid var(--c-leftBorder);
  padding:10px 14px;border-radius:0 6px 6px 0;
  font-size:var(--body-item-sz);line-height:1.75;color:var(--c-main);
}
.item-num{color:var(--c-accent);font-weight:bold;}
.body-line{
  font-size:var(--body-item-sz);line-height:1.85;color:var(--c-main);
}
.annotation{
  padding:3px 14px;
  border-left:3px solid var(--c-border);border-radius:0 6px 6px 0;
  font-size:var(--body-ann-sz);line-height:1.6;color:#8a7040;font-style:italic;
}
.annotation-label{color:#6a5030;font-style:normal;margin-right:4px;}
.sub-section-body a{color:inherit;text-decoration:underline;}
ruby{ruby-align:center;}
rt{font-size:0.55em;}
.sub-section .sub-heading{
  display:flex;align-items:center;justify-content:flex-start;
}
.section-toggle{
  flex-shrink:0;margin-left:8px;
  background:none;border:none;padding:0;
  color:var(--c-dim);font-size:var(--body-tog-sz);cursor:pointer;
  line-height:1;transition:color .15s;
  font-family:inherit;
}
.section-toggle:hover{color:var(--c-accent);}
.sub-section[data-mode="bold"]:not([data-jie]) .sub-section-body>:not(.bold-title):not(.yao-heading){display:none;}
.sub-section[data-mode="bold"][data-jie] .sub-section-body>.annotation{display:none;}
.sub-section[data-mode="hide"] .sub-section-body{display:none;}
.divider{border:none;border-top:1px solid var(--c-sep);margin:16px 0}
/* 查詢失敗時右欄所有非按鈕文字過渡到 disabled 色 */
.query-failed *:not(button):not(button *){color:#3a2e18 !important;text-shadow:none !important;transition:color .3s,text-shadow .3s;}
.guaxiang-title{font-size:var(--hdr-title-sz);font-weight:700;color:var(--c-gold);letter-spacing:.15em;text-align:center;margin-bottom:var(--hdr-title-mb);}
.guaxiang-dual-content{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
.guaxiang-col{display:flex;flex-direction:column;gap:8px;}
.guaxiang-col-single{max-width:480px;margin:0 auto;}
.guaxiang-jw-item{background:var(--c-default);border-left:3px solid var(--c-leftBorder);padding:10px 14px;border-radius:0 6px 6px 0;font-size:var(--body-jw-sz);line-height:1.75;color:var(--c-main);}
.guaxiang-jw-item.guaxiang-jw-a{border-left-color:var(--c-gold);color:var(--c-gold);box-shadow:0 0 14px rgba(240,192,64,.22),inset 0 0 8px rgba(240,192,64,.06);}
.guaxiang-jw-item.guaxiang-jw-dim{opacity:.22;}
.ci-section{border-left:3px solid transparent;padding-left:12px;margin-bottom:10px;}
.ci-section-a{border-left-color:var(--c-gold);box-shadow:0 0 14px rgba(240,192,64,.22),inset 0 0 8px rgba(240,192,64,.06);}
.ci-section-b{border-left-color:var(--c-leftBorder);}
.ci-section-dim{opacity:.22;}
.md-image{text-align:center;margin:10px 0;}
.md-image img{max-width:100%;border-radius:4px;border:2px solid var(--c-leftBorder);}
.md-image figcaption{font-size:.8em;color:#a07840;margin-top:4px;}
.md-pdf{width:100%;height:480px;border:1px solid var(--c-leftBorder);border-radius:4px;}
.media-missing{color:var(--c-dim);font-style:var(--font-empty);font-size:var(--body-item-sz);text-align:center;padding:8px 0;}

/* ── 響應式（由 JS 動態切換）──
   .stacked 由 fitLayout() 在 resize 時根據右欄實際渲染寬度動態加掛／移除，
   不使用 @media，因為左欄寬度會隨 scale 變動，無法用固定視口寬度計算臨界點。
   小螢幕保持 row 佈局：右欄以 position:fixed 藏於視口右側，#panelToggle 填滿空白區域；
   .show-right 時兩欄同時滑動換場。 */

/* 右欄退出至視口右側待機 */
.page-layout.stacked .right-panel{
  position:fixed;inset:36px;          /* 四邊各留 36px */
  background:var(--c-page);
  transform:translateX(100vw);        /* vw 確保完全退出，不受 inset 影響 */
  transition:transform .35s ease;
  z-index:50;
  overflow-y:auto;
  display:flex;flex-direction:column;
  border-radius:8px;
  border:1px solid var(--c-sep);
}
/* show-right：右欄滑入 */
.page-layout.stacked.show-right .right-panel{transform:translateX(0);}
/* 左欄平滑過渡 */
.page-layout.stacked .left-panel{transition:transform .35s ease;}
/* show-right：左欄向左滑出（自身寬 + body 左 padding 36px） */
.page-layout.stacked.show-right .left-panel{transform:translateX(calc(-100% - 36px));}

/* #panelToggle：fixed overlay，佔據左欄右側至右邊界的全部空白；left 由 JS 設置 */
#panelToggle{
  display:none;
  position:fixed;top:50%;right:0;transform:translateY(-50%);
  width:36px;height: 200px;
  /* left 動態注入 */
  align-items:center;justify-content:center;
  background:var(--c-default);border:none;border-left:1px solid var(--c-sep);
  cursor:pointer;z-index:10;writing-mode:vertical-rl;
  color:var(--c-dim);font-size:var(--body-sec-sz);letter-spacing:.15em;
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  transition:background .15s,color .15s;
}
#panelToggle:hover{background:var(--c-active);color:var(--c-accent);}
/* display 由 JS 的 updateToggle() 控制 */

/* #panelBack：fixed overlay，佔右欄左邊界至視口左側；right 由 JS 設置 */
#panelBack{
  display:none;
  position:fixed;top:50%;left:0;transform:translateY(-50%);
  width:36px;height:200px;
  align-items:center;justify-content:center;
  background:var(--c-default);border:none;border-right:1px solid var(--c-sep);
  cursor:pointer;z-index:10;
  color:var(--c-dim);font-size:var(--body-sec-sz);letter-spacing:.15em;
  writing-mode:vertical-rl;
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  transition:background .15s,color .15s;
}
#panelBack:hover{background:var(--c-active);color:var(--c-accent);}
/* display 由 JS 的 updateToggle() 控制 */

/* ── 設置彈窗 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;}
.modal-overlay.open{display:block;}
.settings-panel{
  position:fixed;
  top:var(--sp-top);
  left:36px;
  width:var(--panel-w);
  background:#1a1408;
  border:1px solid #4a3a18;
  border-radius:8px;
  padding:var(--sp-pad-v) var(--sp-pad-h) var(--sp-pad-h);
  z-index:101;
  box-shadow:0 4px 32px rgba(0,0,0,.65);
  color:#e8d5a3;
}
.settings-panel-title{font-size:var(--sp-title-sz);letter-spacing:.35em;color:var(--c-accent);margin-bottom:var(--sp-title-mb);padding-bottom:var(--sp-title-pb);border-bottom:1px solid var(--c-sep);}
.settings-close{position:absolute;top:var(--sp-close-t);right:var(--sp-close-r);background:none;border:none;color:var(--c-dim);font-size:var(--sp-close-sz);cursor:pointer;line-height:1;padding:2px 4px;transition:color .15s;font-family:inherit;}
.settings-close:hover{color:var(--c-accent);}
.prob-section-label{font-size:var(--subsec-sz);letter-spacing:var(--subsec-ls);color:var(--c-subsec);margin:var(--subsec-mt) 0 var(--subsec-mb);}
.prob-row{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-row-pv) 0;font-size:var(--inp-fsz);}
.prob-name{color:var(--c-accent);letter-spacing:.1em;white-space:nowrap;}
.prob-frac{color:var(--c-main);font-family:"Menlo","Monaco","Courier New",monospace;letter-spacing:.05em;}
.prob-pct{font-family:monospace;font-size:var(--sp-pct-sz);letter-spacing:.03em;}
.prob-pct--glint{animation:pct-glint 3s ease-in-out infinite;}
@keyframes pct-glint{
  0%,78%,100%{opacity:.7;filter:none;}
  86%{opacity:1;filter:brightness(2.2) drop-shadow(0 0 5px currentColor);}
  92%{opacity:.85;filter:brightness(1.3) drop-shadow(0 0 2px currentColor);}
}
.prob-input{width:var(--sp-input-w);background:var(--c-page);border:1px solid var(--c-border);border-radius:4px;color:var(--c-gold);font-family:monospace;font-size:var(--inp-fsz);text-align:center;padding:1px 4px;height:var(--cfg-input-h);box-sizing:border-box;}
.prob-input:focus{outline:none;border-color:var(--c-accent);}
.prob-denom{color:#7a6030;font-family:monospace;font-size:var(--inp-fsz);}
.settings-actions{display:flex;gap:var(--sp-act-gap);margin-top:var(--sp-act-mt);padding-top:var(--sp-act-pt);border-top:1px solid var(--c-sep);}
.settings-btn-action{flex:1;padding:var(--sp-btn-pv) 0;border:1px solid var(--c-border);background:var(--c-default);color:#7a6030;border-radius:5px;cursor:pointer;font-size:var(--inp-fsz);letter-spacing:.15em;font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;transition:border-color .15s,background .15s,color .15s;overflow:hidden;white-space:nowrap;}
.sp-body-text{font-size:var(--sp-body-sz);color:#d4cbb8;line-height:1.7;margin-bottom:var(--sp-body-mb);}
.settings-btn-action:hover{border-color:#6a4a20;color:var(--c-accent);}
.settings-btn-action.primary{border-color:var(--c-accent);color:var(--c-gold);background:var(--c-active);}
.settings-btn-action.primary:hover{border-color:var(--c-gold);}
.settings-btn-action:disabled{opacity:0.4;cursor:default;pointer-events:none;}
.settings-btn-action.danger{color:#c05050;border-color:#c05050;}
.settings-btn-action.danger:hover{background:#3a1818;color:#e07070;}
.source-merge-row{display:flex;justify-content:center;margin-top:8px;}

/* ══ 特效 ══ */

/* 筮卜完成：爻按鈕、數位格、序列輸入框持續點亮 */
.shibo-lit{box-shadow:0 0 10px rgba(240,192,64,.75);}
/* 筮卜記錄（于dropdown）：向內發光 + 背景提亮 */
.save-record.shibo-lit{background:rgba(240,192,64,.1);box-shadow:inset 0 0 5px rgba(240,192,64,.25);}
.save-record.shibo-lit:hover{background:rgba(240,192,64,.2);}
/* 刪除按鈕 */
.save-del{cursor:pointer;color:var(--c-dim);transition:color .15s;flex-shrink:0;user-select:none;margin-right:10px;}
.save-del:hover{color:#e06040;}
/* 刪除確認畫面 */
.save-dd-confirm{padding:var(--dd-cv-pv) var(--dd-ph);}
.save-dd-confirm-title{font-size:var(--fs-rec);color:var(--c-accent);letter-spacing:.08em;margin-bottom:var(--dd-gap);text-align:center;}
.save-dd-confirm-preview{pointer-events:none;border-bottom:none;cursor:default;}
.save-dd-confirm-preview:hover{background:transparent;}
.save-dd-confirm-actions{display:flex;gap:var(--dd-gap);margin-top:var(--dd-cv-mt);}
.save-dd-confirm-btn{flex:1;padding:var(--dd-cv-btn-pv) 0;border:1px solid var(--c-border);background:var(--c-default);color:#7a6030;border-radius:5px;cursor:pointer;font-size:var(--fs-rec);letter-spacing:.1em;font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;transition:border-color .15s,background .15s,color .15s;}
.save-dd-confirm-btn:hover{border-color:var(--c-accent);color:var(--c-accent);}
.save-dd-confirm-btn.danger{border-color:#6a2010;color:#c06040;}
.save-dd-confirm-btn.danger:hover{border-color:#e06040;background:#1e0a06;color:#e06040;}
/* 淡出動畫 *//* 筮卜完成發光 */
.shibo-btn.shibo-complete{border-color:var(--c-gold);background:var(--c-active);color:var(--c-gold);animation:shibo-glow 3s ease-out forwards;}
.btn-flash{animation:btn-flash 2s ease-out forwards;}
@keyframes btn-flash{
  0%  {box-shadow:0 0 0 rgba(240,192,64,0);background:var(--c-default);color:var(--c-dim);border-color:var(--c-border);}
  12% {box-shadow:0 0 18px rgba(240,192,64,.7),inset 0 0 10px rgba(240,192,64,.15);background:var(--c-accent);color:var(--c-default);border-color:transparent;}
  100%{box-shadow:0 0 0 rgba(240,192,64,0);background:var(--c-default);color:var(--c-dim);border-color:var(--c-border);}
}
@keyframes shibo-glow{
  0%  {box-shadow:0 0 0 rgba(240,192,64,0);background:var(--c-active);color:var(--c-gold);border-color:var(--c-gold);}
  12% {box-shadow:0 0 22px rgba(240,192,64,.7),inset 0 0 12px rgba(240,192,64,.15);background:var(--c-accent);color:var(--c-default);border-color:transparent;}
  100% {background:var(--c-active);color:var(--c-gold);border-color:var(--c-gold);}
  100%{box-shadow:0 0 0 rgba(240,192,64,0);background:var(--c-active);color:var(--c-gold);border-color:var(--c-gold);}
}

/* 通用斜線特效（爻變開啓、卦象按鈕、展示按鈕共用） */
.slash-fx{position:relative;overflow:hidden;}
.slash-fx::before,.yao-bian-btn.active::before,.show-hex-btn.show-hex-quat::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(45deg,transparent 0px,transparent 20px,currentColor 20px,currentColor 40px);background-size:57px 100%;animation:slash-scroll 2.5s linear infinite,slash-lum 5.0s ease-in-out infinite;}
@keyframes slash-scroll{
  from{background-position-x:0}
  to{background-position-x:57px}
}
@keyframes slash-lum{
  0%,100%{color:#000000;filter:drop-shadow(0 0 8px rgba(0,0,0,.90));}
  50%{color:#ffffff;filter:drop-shadow(0 0 8px rgba(255,255,255,.45));}
}

/* 爻位按鈕變爻特效 */
.yao-btn.y6{
  color:#ffffff;
  background-image:repeating-linear-gradient(
    45deg,transparent 0px,transparent 20px,currentColor 20px,currentColor 40px
  );
  background-size:57px 100%;
  animation:slash-scroll 2.5s linear infinite;
}
.yao-btn.y9{
  color:#000000;
  background-image:repeating-linear-gradient(
    45deg,transparent 0px,transparent 20px,currentColor 20px,currentColor 40px
  );
  background-size:57px 100%;
  animation:slash-scroll 2.5s linear infinite;
}

/* 數位按鈕變爻特效（y6=老陰 y7=陽靜 y8=陰靜 y9=老陽） */
.bit-toggle.y6{border-color:#5090e0;color:var(--y6-tx);background:#0a1428;position:relative;overflow:hidden;}
.bit-toggle.y7{border-color:#50b060;color:var(--y7-tx);background:#0a1e10;position:relative;overflow:hidden;}
.bit-toggle.y8{border-color:#e8c84c;color:var(--y8-tx);background:#2a1e04;position:relative;overflow:hidden;}
.bit-toggle.y9{border-color:#e87050;color:var(--y9-tx);background:#281008;position:relative;overflow:hidden;}
/* 靜爻（y7/y8）斜線慢速滾動，變爻（y6/y9）快速+色彩脈衝 */
.bit-toggle.y7::before,.bit-toggle.y8::before{
  content:'';
  position:absolute;inset:0;border-radius:4px;
  pointer-events:none;
  opacity:.50;
  background:repeating-linear-gradient(
    45deg,
    transparent 0px,transparent 20px,
    currentColor 20px,currentColor 40px
  );
  background-size:57px 100%;
  animation:slash-scroll 10.0s linear infinite;
}
.bit-toggle.y6::before,.bit-toggle.y9::before{
  content:'';
  position:absolute;inset:0;border-radius:4px;
  pointer-events:none;
  opacity:.50;
  background:repeating-linear-gradient(
    45deg,
    transparent 0px,transparent 20px,
    currentColor 20px,currentColor 40px
  );
  background-size:57px 100%;
}
.bit-toggle.y6::before{animation:slash-scroll 2.5s linear infinite,bit-lum-6 5.0s ease-in-out infinite;}
.bit-toggle.y9::before{animation:slash-scroll 2.5s linear infinite,bit-lum-9 5.0s ease-in-out infinite;}
@keyframes bit-lum-6{
  0%,100%{color:#80b8f8;filter:drop-shadow(0 0 4px rgba(128,184,248,.80));}
  50%    {color:#70d080;filter:drop-shadow(0 0 4px rgba(112,208,128,.80));}
}
@keyframes bit-lum-9{
  0%,100%{color:#f08050;filter:drop-shadow(0 0 4px rgba(240,128,80,.80));}
  50%    {color:var(--c-gold);filter:drop-shadow(0 0 4px rgba(240,192,64,.80));}
}

const _EMBEDDED_CONFIG  = {"trigram_info":{"100":{"name":"震","sym":"☳","color":"#3e9450","no":4,"ord":3,"obj":"雷","ele":"木","dir":"正東","mem":"長男","act":"動","char":"動"},"101":{"name":"離","sym":"☲","color":"#d86040","no":3,"ord":9,"obj":"火","ele":"火","dir":"正南","mem":"中女","act":"麗","char":"明"},"110":{"name":"兌","sym":"☱","color":"#ede3be","no":2,"ord":7,"obj":"澤","ele":"金","dir":"正西","mem":"少女","act":"說","char":"悅"},"111":{"name":"乾","sym":"☰","color":"#ffffff","no":1,"ord":6,"obj":"天","ele":"金","dir":"西北","mem":"父","act":"健","char":"剛"},"000":{"name":"坤","sym":"☷","color":"#533c1a","no":8,"ord":2,"obj":"地","ele":"土","dir":"西南","mem":"母","act":"順","char":"厚"},"001":{"name":"艮","sym":"☶","color":"#7a5a28","no":7,"ord":8,"obj":"山","ele":"土","dir":"東北","mem":"少男","act":"止","char":"大"},"010":{"name":"坎","sym":"☵","color":"#5090d0","no":6,"ord":1,"obj":"水","ele":"水","dir":"正北","mem":"中男","act":"陷","char":"險"},"011":{"name":"巽","sym":"☴","color":"#70c8a0","no":5,"ord":4,"obj":"風","ele":"木","dir":"東南","mem":"長女","act":"入","char":"顺"}},"tab_fields":{"tab1":["char","obj"],"tab2":["dir","mem"],"tab3":["act","obj"],"guaxiang":["char","obj"]},"tab_names":{"tab1":"圖占","tab2":"地理","tab3":"爻辭"},"shibo_probs":{"binary":{"0":1,"1":1},"quaternary":{"6":1,"7":5,"8":7,"9":3}},"shibo_presets":[{"name":"均等二進 (默認）","mode":"binary","probs":{"0":1,"1":1}},{"name":"大衍揲蓍 (默認）","mode":"quaternary","probs":{"6":1,"7":5,"8":7,"9":3}},{"name":"三錢起卦","mode":"quaternary","probs":{"6":1,"7":3,"8":3,"9":1}}],"hexagrams":[{"num":1,"name":"乾爲天","sequence":"111111","symbol":"䷀","short_name":"乾","ci":["乾：元、亨、利、貞。","初九：潛龍勿用。","九二：見龍在田，利見大人。","九三：君子終日乾乾，夕惕若厲，无咎。","九四：或躍在淵，无咎。","九五：飛龍在天，利見大人。","上九：亢龍有悔。","用九：見群龍無首，吉。"]},{"num":2,"name":"坤爲地2","sequence":"000000","symbol":"䷁","short_name":"坤","ci":["坤：元、亨、利牝馬之貞。","初六：履霜，堅冰至。","六二：直方大，不習，无不利。","六三：含章可貞，或從王事，无成有終。","六四：括囊，无咎，无譽。","六五：黄裳，元吉。","上六：龍戰於野，其血玄黃。","用六：利永貞。"]},{"num":3,"name":"水雷屯","sequence":"100010","symbol":"䷂","short_name":"屯","ci":["屯：元、亨、利、貞，勿用有攸往，利建侯。","初九：盤桓，利居貞，利建侯。","六二：屯如邅如，乘馬班如，匪寇，婚媾，女子貞不字，十年乃字。","六三：即鹿无虞，惟入于林中，君子幾，不如舍，往吝。","六四：乘馬班如，求婚媾，往吉，无不利。","九五：屯其膏，小貞吉，大貞凶。","上六：乘馬班如，泣血漣如。",""]},{"num":4,"name":"山水蒙","sequence":"010001","symbol":"䷃","short_name":"蒙","ci":["蒙：亨，匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告，利貞。","初六：發蒙，利用刑人，用説桎梏，以往吝。","九二：包蒙吉，納婦吉，子克家。","六三：勿用，取女見金夫，不有躬，无攸利。","六四：困蒙，吝。","六五：童蒙，吉。","上九：擊蒙，不利爲寇，利禦寇。",""]},{"num":5,"name":"水天需","sequence":"111010","symbol":"䷄","short_name":"需","ci":["需：有孚，光亨贞吉，利涉大川。","初九：需于郊，利用恆，无咎。","九二：需于沙，小有言，終吉。","九三：需于泥，致寇至。","六四：需于血，出自穴。","九五：需於酒食，貞吉。","上六：入于穴，有不速之客三人來，敬之終吉。",""]},{"num":6,"name":"天水讼","sequence":"010111","symbol":"䷅","short_name":"讼","ci":["訟：有孚，窒惕，中吉，終凶。","初六：不永所事，小有言，終吉。","九二：不克訟，歸而逋，其邑人三百户，无眚。","六三：食舊德，貞厲終吉。或從王事，无成。","九四：不克訟，復即命，渝安貞，吉。","九五：訟，元吉。","上九：或錫之鞶帶，終朝三褫之。",""]},{"num":7,"name":"地水師","sequence":"010000","symbol":"䷆","short_name":"師","ci":["師：貞，丈人吉，无咎。","初六：師出以律，否臧凶。","九二：在師中，吉，无咎，王三錫命。","六三：師或輿尸，凶。","六四：師左次，无咎。","六五：田有禽，利執言，无咎。長子帥師，弟子輿尸，貞凶。","上六：大君有命，開國成家，小人勿用。",""]},{"num":8,"name":"水地比","sequence":"000010","symbol":"䷇","short_name":"比","ci":["比：吉，原筮，元永貞，无咎。不寧方來，後夫凶。","初六：有孚，比之无咎。有孚盈缶，終來有它，吉。","六二：比之自内，貞吉。","六三：比之匪人。","六四：外比之，貞吉。","九五：顯比，王用三驅，失前禽，邑人不誡，吉。","上六：比之无首，凶。",""]},{"num":9,"name":"風天小畜","sequence":"111011","symbol":"䷈","short_name":"小畜","ci":["小畜，亨。密雲不雨，自我西郊。","初九：復自道，何其咎，吉。","九二：牽復，吉。","九三：輿説輻，夫妻反目。(説即脱)","六四：有孚，血去惕出，无咎。","九五：有孚攣如，富以其鄰。","上九：既雨既處，尚德載，婦貞厲。",""]},{"num":10,"name":"天澤履","sequence":"110111","symbol":"䷉","short_name":"履","ci":["履虎尾，不咥人，亨。","初九：素履往，无咎。","九二：履道坦坦，幽人貞吉。","六三：眇能視，跛能履，履虎尾，咥人凶，武人爲于大君。","九四：履虎尾，愬愬終吉。","九五：夬","上九：視履考祥，其旋元吉。",""]},{"num":11,"name":"地天泰","sequence":"111000","symbol":"䷊","short_name":"泰","ci":["泰，小往大來，吉亨。","初九：拔茅茹，以其彙，征吉。","九二：包荒，用馮河，不遐遺，朋亡，得尚于中行。","九三：无平不陂，无往不復，艱貞无咎，勿恤其孚，于食有福。","六四：翩翩不富，以其鄰，不戒以孚。","六五：帝乙歸妹，以祉元吉。","上六：城復于隍，勿用師，自邑告命，貞吝。",""]},{"num":12,"name":"天地否","sequence":"000111","symbol":"䷋","short_name":"否","ci":["否之匪人。不利君子貞，大往小來。","初六：拔茅如，以其彙，貞吉，亨。","六二：包承，小人吉，大人否，亨。","六三：包羞。","九四：有命，无咎，疇離祉。","九五：休否，大人吉，其亡，其亡，繋于苞桑。","上九：傾否，先否後喜。",""]},{"num":13,"name":"天火同人","sequence":"101111","symbol":"䷌","short_name":"同人","ci":["同人：于野，亨。利涉大川，利君子貞。","初九：同人于門，无咎。","六二：同人于宗，吝！","九三：伏戎于莽，升其高陵，三歲不興。","九四：乘其墉，弗克攻，吉。","九五：同人，先號咷而後笑，大師克相遇。","上九：同人于郊，无悔。",""]},{"num":14,"name":"火天大有","sequence":"111101","symbol":"䷍","short_name":"大有","ci":["大有：元亨。","初九：无交害，匪咎，艱則无咎。","九二：大車以載，有攸往，无咎。","九三：公用亨于天子，小人弗克。","九四：匪其彭，无咎。","六五：厥孚交如，威如，吉。","上九：自天祐之，吉，无不利。",""]},{"num":15,"name":"地山謙","sequence":"001000","symbol":"䷎","short_name":"謙","ci":["謙：亨，君子有終。","初六：謙謙君子，用涉大川，吉。","六三：嗚謙，貞吉。","九三：勞謙，君子有終，吉。","六四：无不利，撝謙。","六五：不富以其鄰，利用侵伐，无不利。","上六：鳴謙，利用行師，征邑國。",""]},{"num":16,"name":"雷地豫","sequence":"000100","symbol":"䷏","short_name":"豫","ci":["豫：利建侯，行師。","初六：鳴豫，凶。","六二：介于石，不終日，貞吉。","六三：盱豫，悔。遲有悔。","九四：由豫，大有得，勿疑，朋盍簪。","六五：貞疾，恆不死。","上六：冥豫，成有渝，无咎。",""]},{"num":17,"name":"澤雷隨","sequence":"100110","symbol":"䷐","short_name":"隨","ci":["隨：元，亨，利，貞，无咎。","初九：官有渝，貞吉，出門交有功。","六二：係小子，失丈夫。","六三：係丈夫，失小子，隨有求得，利居貞。","九四：隨有獲，貞凶，有孚在道以明，何咎？","九五：孚於嘉，吉。","上六：拘係之，乃從維之，王用亨于西山。",""]},{"num":18,"name":"山風蠱","sequence":"011001","symbol":"䷑","short_name":"蠱","ci":["蠱：元亨，利涉大川。","初六：幹父之盎，有子，考无咎，厲終吉。","九二：幹母之蠱，不可貞。","九三：幹父之蠱，小有悔，无大咎。","六四：裕父之蠱，往見吝。","六五：幹父之蠱，用譽。","上九：不事王侯，高尚其事。",""]},{"num":19,"name":"地澤臨","sequence":"110000","symbol":"䷒","short_name":"臨","ci":["臨：元，亨，利，貞。","初九：咸臨，貞吉。","九二：咸臨，吉无不利。","六三：甘臨，无攸利，既憂之，无咎。","六四：至臨，无咎。","六五：知臨，大君之宜，吉。","上六：敦臨，吉，无咎。",""]},{"num":20,"name":"風地觀","sequence":"000011","symbol":"䷓","short_name":"觀","ci":["觀：盥而不薦，有孚顒若。","初六：童觀，小人无咎，君子吝。","六二：闚觀，利女貞。","六三：觀我生，進退。","六四：觀國之光，利用賓于王。","九五：觀我生，君子无咎。","上九：觀其生，君子无咎。",""]},{"num":21,"name":"火雷噬嗑","sequence":"100101","symbol":"䷔","short_name":"噬嗑","ci":["噬嗑：亨，利用獄。","初九：屨校滅趾，无咎。","六二：噬膚滅鼻，无咎也。","六三：噬臘肉遇毒，小吝，无咎。","九四：噬乾胏，得金矢，利艱貞，吉。","六五：噬乾肉，得黃金，貞厲，无咎。","上九：何校滅耳，凶。",""]},{"num":22,"name":"山火賁","sequence":"101001","symbol":"䷕","short_name":"賁","ci":["賁：亨，小利有攸往。","初九：賁其趾，舍車而徒。","六二：賁其須。","九三：賁如濡如，永貞，吉。","六四：賁如皤如，白馬翰如，匪寇婚媾。","六五：賁于丘園，束帛戔戔，吝，終吉。","上九：白賁，无咎。",""]},{"num":23,"name":"山地剝","sequence":"000001","symbol":"䷖","short_name":"剝","ci":["剝：不利有攸往。","初六：剝床以足，蔑貞，凶。","六二：剝床以辨，蔑貞凶。","六三：剝之，无咎。","六四：剝床以膚，凶。","六五：貫魚，以宮人寵，无不利。","上九：碩果不食，君子得輿，小人剝廬。",""]},{"num":24,"name":"地雷復","sequence":"100000","symbol":"䷗","short_name":"復","ci":["復：亨，出入无疾，朋來无咎。","初九：不遠復，无祇悔，元吉。","六二：休復，吉。","六三：頻復，厲，无咎。","六四：中行獨復。","六五：敦復，无悔。","上六：迷復，凶，有災眚，用行師，終有大敗，以其國君凶，至于十年不克征。",""]},{"num":25,"name":"天雷無妄","sequence":"100111","symbol":"䷘","short_name":"無妄","ci":["无妄：元，亨，利，貞，其匪正有眚，不利有攸往。","初九：无妄，往吉。","六二：不耕穫，不菑畬，則利有攸往。","六三：无妄之災，或繫之牛，行人之得，邑人之災。","九四：可貞，无咎。","九五：无亡之疾，勿藥有喜。","上九：无妄，行有眚，无攸利。",""]},{"num":26,"name":"山天大畜","sequence":"111001","symbol":"䷙","short_name":"大畜","ci":["大畜：利貞，不家食，吉，利涉大川。","初九：有厲，利己。","九二：輿説輹。","九三：良馬逐，利艱貞，曰閑輿衛，利有攸往。","六四：童牛之牿，元吉。","六五：豶豕之牙，吉。","上九：何天之衢，亨。",""]},{"num":27,"name":"山雷頤","sequence":"100001","symbol":"䷚","short_name":"頤","ci":["頤：貞吉，觀頤，自求口實。","初九：舍爾靈龜，觀我朵頤，凶。","六二：顚頤，拂經，于丘頤，征凶。","六三：拂頤，貞凶，十年勿用，无攸利。","六四：顚頤，吉，虎視眈眈，其欲逐逐，无咎。","六五：拂經，居貞吉，不可涉大川。","上九：由頤，厲吉，利涉大川。",""]},{"num":28,"name":"澤風大過","sequence":"011110","symbol":"䷛","short_name":"大過","ci":["大過：棟橈，利有攸往，亨。","初六：藉用白茅，无咎。","九二：枯陽生稊，老夫得其女妻，无不利。","九三：棟橈，凶。","九四：棟隆，吉 ，有它吝。","九五：枯楊生華，老婦得其士夫，无咎无譽。","上六：過涉滅頂，凶，无咎。",""]},{"num":29,"name":"坎爲水","sequence":"010010","symbol":"䷜","short_name":"坎","ci":["習坎：有孚，維心亨，行有尚。","初六：習坎，入于坎窞","九二：坎有險，求小得。","六三：來之坎坎，險且枕，入于坎富，勿用。","六四：樽酒，簋貳，用缶，納約自牖，終无咎。","九五：坎不盈，衹。既平，无咎。","上六：係用徽纆，寘于叢棘，三歲不得，凶。",""]},{"num":30,"name":"離爲火","sequence":"101101","symbol":"䷝","short_name":"離","ci":["離：利貞，亨，畜牝牛，吉。","初九：履錯然，敬之，无咎。","六二：黃離，元吉。","九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。","九四：突如、其來如、焚如、死如、棄如。","六五：出涕沱若，戚嗟若，吉。","上九：王用出征，有嘉。折首，獲匪其醜，无咎。",""]},{"num":31,"name":"澤山咸","sequence":"001110","symbol":"䷞","short_name":"咸","ci":["咸：亨，利，貞，取女吉。","初六：咸其拇。","六二：咸其腓，凶，居吉。","九三：咸其股，執其隨，往吝。","九四：貞吉，悔亡，憧憧往來，朋從爾思。","九五：咸其脢，无悔。","上六：咸其輔，頰，舌。",""]},{"num":32,"name":"雷風恆","sequence":"011100","symbol":"䷟","short_name":"恆","ci":["恆：亨，无咎，利貞，利有攸往。","初六：浚恆，貞凶，无攸利。","九二：悔亡。","九三：不恆其德，或承之羞，貞吝。","九四：田无禽。","六五：恆其德，貞，婦人吉 ，夫子凶。","上六：振恆，凶。",""]},{"num":33,"name":"天山遯","sequence":"001111","symbol":"䷠","short_name":"遯","ci":["遞：亨，小利貞。","初六：遯","六二：執之用黃牛之革，莫之勝説。","九三：係遯，有疾厲，畜臣妾，吉。","九四：好遯，君子吉，小人否。","九五：嘉遯，貞吉。","上九：肥遯，无不利。",""]},{"num":34,"name":"雷天大壯","sequence":"111100","symbol":"䷡","short_name":"大壯","ci":["大壯：利，貞。","初九：壯於趾，征凶，有孚。","九二：貞吉。","九三：小人用壯，君子用罔。貞厲，羝羊觸藩，羸其角。","九四：貞吉，悔亡，藩決不羸，壯于大輿之複。","六五：喪羊于易，无悔。","上六：羝羊觸藩，不能退，不能遂，无攸利，艱則吉。",""]},{"num":35,"name":"火地晉","sequence":"000101","symbol":"䷢","short_name":"晉","ci":["晉：康侯用錫馬蕃庶，晝日三接。","初六：晉如摧如，貞吉，罔孚，裕无咎。","六二：晉如愁如，貞吉。受茲介福，于其王母。","六三：眾允，悔亡。","九四：晉如鼫鼠，貞厲。","六五：悔亡，失得勿恤，往吉，无不利。","上九：晉其角，維用伐邑，厲吉，无咎，貞咎。",""]},{"num":36,"name":"地火明夷","sequence":"101000","symbol":"䷣","short_name":"明夷","ci":["明夷：利艱貞。","初九：明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。","六二：明夷，夷于左股，用拯馬壯，吉。","九三：明夷於南狩，得其大首，不可疾貞。","六四：入于左腹，獲明夷之心，于出門庭。","六五：箕子之明夷，利貞。","上六：不明晦，初登于天，後入于地。",""]},{"num":37,"name":"風火家人","sequence":"101011","symbol":"䷤","short_name":"家人","ci":["家人：利女貞。","初九：閑有家，悔亡。","六二：无攸遂，在中饋，貞吉。","九三：家人嗃嗃，悔厲吉，婦子嘻嘻，終吝。","六四：富家，大吉。","九五：王假有家，勿恤，吉。","上九：有孚威如，終吉。",""]},{"num":38,"name":"火澤睽","sequence":"110101","symbol":"䷥","short_name":"睽","ci":["睽：小事吉。","初九：悔亡，喪馬勿逐，自復；見惡人，无咎。","九二：遇主于巷，無咎。","六三：見輿曳，其牛掣，其人天且劓，无初有終。","九四：睽孤，遇元夫，交孚，厲无咎。","六五：悔亡，厥宗噬膚，往何咎。","上九：暌孤，見豕負塗，載鬼一車，先張之弧，後説之弧，匪寇婚媾，往遇雨則吉。",""]},{"num":39,"name":"水山蹇","sequence":"001010","symbol":"䷦","short_name":"蹇","ci":["蹇：利西南，不利東北，利見大人，貞吉。","初六：往蹇，來譽。","六二：王臣蹇蹇，匪躬之故。","九三：往蹇，來反。","六四：往蹇，來連。","九五：大蹇，朋來。","上六：往蹇，來碩，吉，利見大人。",""]},{"num":40,"name":"雷水解","sequence":"010100","symbol":"䷧","short_name":"解","ci":["解：利西南，無所往，其來復吉，有攸往，夙吉。","初六：无咎。","九二：田獲三狐，得黃矢，貞吉。","六三：負且乘，致寇至，貞吝。","九四：解而姆，朋至斯孚。","六五：君子維有解，吉，有孚于小人。","上六：公用射隼于高墉之上，獲之无不利。",""]},{"num":41,"name":"山澤損","sequence":"110001","symbol":"䷨","short_name":"損","ci":["損：有孚，元吉，无咎，可貞，利有攸往。","初九：已事遄往，无咎，酌損之。","九二：利貞，征凶，弗損益之。","六三：三人行，則損一人。一人行，則得其友。","六四：換其疾，使遄有喜，无咎。","六五：或益之，十朋之龜，弗克違，元吉。","上九：弗損益之，无咎，貞吉，利有攸往，得臣无家。",""]},{"num":42,"name":"風雷益","sequence":"100011","symbol":"䷩","short_name":"益","ci":["益：利有攸往，利涉大川。","初九：利用爲大作，元吉，無咎。","六二：或益之，十朋之龜，弗克違，永貞吉，王用享于帝，吉。","六三：益之用凶事，无咎。有孚中行，告公用圭。","六四：中行，告公從，利用爲依遷國。","九五：有孚惠心，勿問元吉，有孚惠我德。","上九：莫益之，或擊之，立心勿恒，凶。",""]},{"num":43,"name":"澤天夬","sequence":"111110","symbol":"䷪","short_name":"夬","ci":["夬：揚于王庭，孚號，有厲。","初九：壯于前趾，往不勝爲咎。","九二：惕號，莫夜有戎，勿恤。","九三：壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎。","九四：臀无膚，其行次且，牽羊悔亡，聞言不信。","九五：莧陸夬夬，中行无咎。","上六：无號，終有凶。",""]},{"num":44,"name":"天風姤","sequence":"011111","symbol":"䷫","short_name":"姤","ci":["姤：女壯，勿用取女。","九二：包有魚，无咎，不利賓。","九三：臀无膚，其行次且，厲，无大咎。","九四：包无魚，起凶。","九五：以杞包瓜，含章，有損自天。","上九：姤其角，吝，无咎。","",""]},{"num":45,"name":"澤地萃","sequence":"000110","symbol":"䷬","short_name":"萃","ci":["萃：亨，王假有廟。利見大人，亨，利貞。用大牲吉，利有攸往。","初六：有孚不終，乃亂乃萃，若號，一握爲笑，勿恤，往无咎。","六二：引吉，无咎，孚乃利用禴。","六三：萃如磋如，无攸利，往无咎，小吝。","九四：大吉无咎。","九五：萃有位，无咎。匪孚，元永貞，悔亡。","上六：齎咨涕洟，无咎。",""]},{"num":46,"name":"地風升","sequence":"011000","symbol":"䷭","short_name":"升","ci":["升：元亨，用見大人，勿恤，南征吉。","初六：允升，大吉。","九二：孚乃利用禴","九三：升虛邑。","六四：王用享于岐山，吉 ，无咎。","六五：貞，吉，升階。","上六：冥升，利于不息之貞。",""]},{"num":47,"name":"澤水困","sequence":"010110","symbol":"䷮","short_name":"困","ci":["困：亨，貞，大人士口，无咎，有言口不信。","初六：臀困于株木，入于幽谷，三歲不覿。","九二：困于酒食，朱紱方來，利用享祀：征凶，无咎。","六三：困于石，據于蒺藜，入于其宮，不見其妻，凶。","九四：來徐徐，困于金車，吝，有終。","九五：劓刖，困于赤紱，乃徐有説，利用祭祀。","上六：困于葛藟，于臲卼，曰動悔。",""]},{"num":48,"name":"水風井","sequence":"011010","symbol":"䷯","short_name":"井","ci":["井：改邑不改井，无喪无得，往來井井。","初六：井泥不食，舊井无禽。","九二：井谷射鮒，甕敝漏。","九三：井渫不食，爲我心惻，可用汲，王明並受其福。","六四：井甃，无咎。","九五：井洌，寒泉食。","上六：井收勿幕，有孚元吉。",""]},{"num":49,"name":"澤火革","sequence":"101110","symbol":"䷰","short_name":"革","ci":["革：巳日乃孚，元亨利貞，悔亡。","初九：鞏用黃牛之革。","六二：巳日乃革之，征吉 ，无咎。","九三：征凶，貞厲。革言三就，有孚。","九四：悔亡，有孚，改命，吉。","九五：大人虎變，未占有孚。","上六：君子豹變，小人革面，征凶，居貞吉。",""]},{"num":50,"name":"火風鼎","sequence":"011101","symbol":"䷱","short_name":"鼎","ci":["鼎：元吉、亨。","初六：鼎顚趾，利出否。得妾以其子，无咎。","九二：鼎有實，我仇有疾，不我能即，吉。","九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。","九四：鼎折足，覆公餗，其形渥，凶。","六五：鼎黃耳，金鉉，利貞。","上九：鼎玉鉉，大吉，无不利。",""]},{"num":51,"name":"震爲雷","sequence":"100100","symbol":"䷲","short_name":"震","ci":["震：亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。","初九：居震之始，知震之來，能於始即知戒懼恐慎，不敢掉以輕心，終必安吉。","六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。","六三：震蘇蘇，震行无眚。","九四：震遂泥。","六五：震往來厲，億无喪有事。","上六：震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎，婚媾有言。",""]},{"num":52,"name":"艮爲山","sequence":"001001","symbol":"䷳","short_name":"艮","ci":["艮其背，不獲其身，行其庭，不見其人，无咎。","初六：艮其趾，无咎，利永貞。","六二：艮其腓，不拯其隨，其心不快。","九三：艮其限，列其夤，厲薰心。","六四：艮其身，无咎。","六五：艮其輔，言有序，悔亡。","上九：敦艮，吉。",""]},{"num":53,"name":"風山漸","sequence":"001011","symbol":"䷴","short_name":"漸","ci":["漸：女歸吉，利貞。","初六：鴻漸于干，小子厲，有言，无咎。","六二：鴻漸于磐，飲食衎衎，吉。","九三：鴻漸于陸，夫征不復，婦孕不育，凶，利禦寇。","六四：鴻漸于木，或得其桷，无咎。","九五：鴻漸于陵，婦三婦不孕，終莫之勝，吉。","上九：鴻漸于陸，其羽可用爲儀，吉。",""]},{"num":54,"name":"雷澤歸妹","sequence":"110100","symbol":"䷵","short_name":"歸妹","ci":["歸妹，征凶，无攸利。","初九：歸妹以娣，跛能履，征吉。","九二：眇能視，利幽人之貞。","六三：歸妹以須，反歸以娣。","九四：歸妹愆期，遲歸有時。","六五：帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉 。","上六：女承筐无實，士刲羊无血，无攸利。",""]},{"num":55,"name":"雷火豐","sequence":"101100","symbol":"䷶","short_name":"豐","ci":["豐：亨，王假之，勿憂，宣日中。","初九：遇其配主，雖旬无咎，往有尚。","六二：豐其蘚，日中見斗，往得疑疾，有孚發若，吉 。","九三：豐其沛，日中見沫，折其右肱，无咎。","九四：豐其薜，日中見斗，遇其夷主，吉。","六五：來章，有慶譽，吉。","上六：豐其屋，蔀其家，窺其户，闋其無人，三歲不覿，凶。",""]},{"num":56,"name":"火山旅","sequence":"001101","symbol":"䷷","short_name":"旅","ci":["旅：小亨、旅貞吉。","初六：旅瑣瑣，斯其所取災。","六二：旅即次，懷其資，得童僕貞。","九三：旅焚其次，喪其童僕，貞厲。","九四：旅于處，得其資斧，我心不快。","六五：射雉，一矢亡，終以譽命。","上九：鳥焚其巢，旅人先笑後號咷，喪牛于易，凶。",""]},{"num":57,"name":"巽爲風","sequence":"011011","symbol":"䷸","short_name":"巽","ci":["巽：小亨。利有攸往，利見大人。","初六：進退，利武人之貞。","九二：巽在床下，用史巫紛若，吉， 象曰：紛若之吉，得中也。","九三：頻巽，吝。","六四：悔亡，田獲三品。","九五：貞吉，悔亡无不利，无初有終，先庚三日，後庚三日，吉。 象曰：九五之吉，位正中也。","上九：巽在床下，喪其資斧，貞凶。",""]},{"num":58,"name":"兌爲澤","sequence":"110110","symbol":"䷹","short_name":"兌","ci":["兌：亨，利、貞。","初九：和兌，吉。","九二：孚兌，吉，悔亡。","六三：來兌，凶。","九四：商兌未寧，介疾有喜。","九五：孚于剝，有厲。","上六：引兌",""]},{"num":59,"name":"風水渙","sequence":"010011","symbol":"䷺","short_name":"渙","ci":["渙：亨。王假有廟，利涉大川，利貞。","初六：用拯馬壯，吉。","九二：渙奔其機，悔亡。","六三：渙其躬，无悔。","六四：渙其群，元吉。渙有丘，匪夷所思。","九五：渙汗其大號，渙王居，无咎。","上九：渙其血，去逖出，无咎。",""]},{"num":60,"name":"水澤節","sequence":"110010","symbol":"䷻","short_name":"節","ci":["節：亨，苦節，不可貞。","初九：不出户庭，无咎。","九二：不出門庭，凶。","六三：不節若，則嗟若，无咎。","六四：安節，亨。","九五：節，吉，往有尚。","上六：苦節，貞凶，悔亡。",""]},{"num":61,"name":"風澤中孚","sequence":"110011","symbol":"䷼","short_name":"中孚","ci":["中孚：豚魚吉，利涉大川，利貞。","初九：虞吉。有它，不燕。","九二：鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。","六三：得敵，或鼓或罷，或泣或歌。","六四：月幾望，馬匹亡，无咎。","九五：有孚孿如，无咎。","上九：翰音登于天，貞凶。",""]},{"num":62,"name":"雷山小過","sequence":"001100","symbol":"䷽","short_name":"小過","ci":["小過：亨，利，貞。","初六：飛鳥以凶。","六二：過其祖，遇其妣，不及其君，遇其臣，无咎。","九三：弗過防之，從或戕之，凶。","九四：无咎，弗過遇之，往厲必戒，勿用永貞。","六五：密雲不雨，自我西郊，公弋取彼在穴。","上六：弗遇過之，飛鳥離之，凶，是謂災眚。",""]},{"num":63,"name":"水火既濟","sequence":"101010","symbol":"䷾","short_name":"既濟","ci":["既濟：亨小，利貞，初吉，終亂。","初九：曳其輪，濡其尾，无咎。","六二：婦喪其茀，勿逐，七日得。","九三：高宗伐鬼方，三年克之，小人勿用。","六四：繻有衣袽，終日戒。","九五：柬鄰殺牛，不如西鄰之禴祭，實受其福。","上六：濡其首，厲。",""]},{"num":64,"name":"火水未濟","sequence":"010101","symbol":"䷿","short_name":"未濟","ci":["未濟：亨。小狐汔濟，濡其尾，无攸利。","初六：濡其尾，吝。","九二：曳其輪，貞吉。","六三：未濟，征凶，利涉大川。","九四：貞吉 ，悔亡，震用伐鬼方，三年有賞于大國。","六五：貞吉 ，无悔，君子之光，有孚，吉。","上九：有孚于飲酒，无咎，濡其首，有孚失是。",""]}]};
const _EMBEDDED_HEX     = {"111111":{"text.tab1":"此卦高祖與呂后走在芒碭山卜得之，餘人難壓也。\n\n#### 圖\n鹿在雲中，石上玉，有光明，人琢玉。\n月當空，官人登雲梯，望月。\n\n**六龍御天之課**\n\n**廣大包容之象**\n\n#### 雜\n\n**雜卦曰：乾剛坤柔**\n\n#### 序\n**序卦曰：有天地，然後萬物生焉。**\n萬物皆成於天地之間，故天之高，地之厚德，皆為吾人所效法。聖人觀天而知天之運行恆古不變，且永不止息，此天之道。乾為萬物之始，以象言其為天，為陽，為父，為君。\n\n#### 解\n• 一、官人在梯上：平步青雲象。\n• 二、鹿在雲中：作為行事心中不可求祿，則祿至矣。\n• 三、石上玉有光明：示人才如玉之含光，吉也。\n• 四、人磨玉：示人堅心不移，夕惕若厲，隨時戒之。\n• 五、工匠：有重立門户之象。\n• 六、梯上官人：棺也。卜疾厄凶也。\n• 七、官人望磨玉人：示人即平步青雲須戒盛，且望下看，念中無妄，則升遷平安，如爭位則旦夕而亡也。\n\n> 倪曰：。。。","text.tab2":"此卦出現，官人逢之舉步青雲，心想事成，發達時往往比平常快，且越級晉升。\n商人逢之，為做生意當老闆之人，財多祿豐，領導統御手段來自天生好手，能當機立斷，掌握時機，成就不可限量。\n對於家庭，有強烈之責任感，為一良好丈夫，賢能的父親，但須切記，必須正名之人，即其正式負責人居之，乃可成此卦。如為未婚人，不可能出現此卦。所以在陽宅之出現時機必在婚後，居此位且堅心到底，必有大成就，例如總統也是由公務員做起，其特性在其始終如一在此路上持之以恆，方可達到，今人常變工作，終日忙於找尋適合自己的工作，結果必終身無成就。所以吾人在知曉此一真理之後，向求教之人說服其能居乾為天之卦位，則其心念必能成為一堅持到底之人，舉凡世上有成就之人，其一生絕不輕易離開其位，堅守原則，認清自己的實力，知道自己要追尋什麼，生命的意義，能一目了然，擺脫了財富名利之慾，人能無欲則剛，乃天經地義之事，加之深謀遠慮，知所進退，當必有所成。\n吾人之定位，其目的在讓人能明瞭知所進退，存亡之機，讀易不過如此，許多人知道且發表言論來提示人們如何拿捏的準，表示已瞭解到其重要性，但往往人性在聽時煞有其事的似乎瞭解了，可是事情一來卻什麼都忘了，有的人天生好手，在後天培養之下，乃能做到，但並非每一人都可如此，所以我們利用陽宅來定位，就如同電腦鎖定之後，其自然演生之過程，造成其為天生好手在事機之來時一舉一動，都很適時的令自己不逾越已份，知所進退，其成就必能過於常人。\n我常苦口婆心的勸人居定位，有時甚而疾聲厲呼的要求，希望他好，但改位的動作，卻不一定都會去做，只好看個人的福份了。\n總不能每一位上門求教的人，我都把易經八卦重講一遍，使其瞭解到其重要性，可改變一生，使明天更美好，對不對？","text.tab3":"**&0&乾：元、亨、利、貞。/0&**\n元為萬物之始生，亨為萬物之成長，利為萬物之遂成，貞為萬物之堅心，此為乾之性，恒古不變，示人须有堅定不移之心志，萬事乃成於此。\n\n##### &1&初九：潛龍勿用。/1&\n\n##### &2&九二：見龍在田，利見大人。/2&\n\n初爻為陽位，且陽居此，因爻理本無形，聖人假借龍之物象來示人乾之初象如聖人始萌，如物之始端，若龍之潛隱，由於始生，未為可用之時機，當韜光養晦，以俟時之至。\n\n以個人而言，此時如舜之田漁，其德已著，乃時之至，故利見大德之君，以行其道。以君王言，此時亦利見大德之人臣，以共成其功。\n以天下百姓言，亦利見大德之人才，以受其恩澤。\n\n##### &3&九三：君子終日乾乾，夕惕若厲，无咎。/3&\n三爻位是在下卦之最上，雖為臣位，但未離下位，此時君子知朝夕不懈，隨時警惕，即處危地，但因戒惕而無災至。時今在下位之人，因德已顯彰，民心將至，天下將歸於他，試想 其危懼之程度，故聖人設戒於此時，此易之論時也。\n\n##### &4&九四：或躍在淵，无咎。/4&\n或乃進與不進之時，聖人示戒進之時機，如時機不對，亦可不進，或之意也，無災。\n\n##### &5&九五：飛龍在天，利見大人。/5&\n\n##### &6&上九：亢龍有悔。/6&\n\n此乃進乎天位君位之時，天下利見有大德之人，來共成天下之大事，聖人居此位，乃知時之至矣。廣納天下大德之人共成之。\n\n上九為位之極點，過此時太過也。聖人知此為時之極限，乃知進退存亡而終至無過,就不至於後悔也。\n\n##### &7&用九：見群龍無首，吉。/7&\n用九之道，即用鲍陽剛之道，須剛柔相濟方為中道，如過乎剛，以至剛為天下之優先，此凶之道也。\n\n#### 彖\n\n**彖曰：大哉乾元！萬物資始，乃統天。雲行雨施，品物流形。大明终始。**\n六位時成，時乘六龍以御天。乾道變化，各正性命，保合大和，乃利貞。首出庶務，萬國咸寧。\n彖為一卦之義，吾人觀讀彖，有助於對卦之了解。開始即讃乾道之浩大，萬物由此而生，乾道因統天，故即為天道，萬物生後，雲行雨施，品物流形，此物之長也。六爻之卦位，各因時而成，此為天之運行，因天道之剛健而自強不息的運作，生育出萬物，且各有分類，各有所性，各有所命。吾人言『天所賦為命，物所受為性。』自此常存此道，因天道生成之剛正，利於吾人堅心向道，果必吉。天之道首出萬物而皆亨吉，人君之道遵循天道，以致四海顺从。\n\n#### 象\n\n**象曰：天行健，君子以自彊不息。**\n象為解一卦之神，每卦皆有象，每爻皆有象，所有的卦皆以象為法則。此乾之卦象言，始終如一，永恆不變，人之行為能如此則至健，可以見天道也。吾人之自強不息，乃法天之則也。\n此為天紀。\n\n##### 潛龍勿用，陽在下也。\n\n##### 見龍在田，德施普也。\n\n陽居最下始生之位，猶植物之生於土中，未出頭，始萌之狀。故君子如處此時，乃應進德修業，未為可用之時機也。\n\n此時君子之德已普及各地，人民已感受其教化之力量也。\n\n##### 終日乾乾，反復道也。\n\n##### 或躍在淵，進无咎也。\n\n此時居下卦之最上，要再進前，但又未脱下位之關係，進退動靜，必依有道，且旦夕進修勵德，此時之法則也。\n\n或乃量可而進，待之以時，時至而動，動必以明，無災。\n\n##### 飛龍在天，大人造也。\n\n##### 亢龍有悔，盈不可久也。\n\n君子能進君位，而行其正道，天下大治矣。\n\n滿則溢，此天之道也，故易示人滿必不可持久，太過必生悔矣。\n\n##### 用九，天德不可爲首也。\n用九，意為用剛之道也，天道陽剛，又用剛而為先，此之過矣。\n\n#### 文言\n\n**文言曰：元者，善之長也；亨者，嘉之會也；利者，義之和也；貞者，事之幹也。**\n易中唯乾坤二卦有文言，此乃補強乾坤天地之道。元，萬物之始皆為善，天之生必有其用，此為造化之跡也。亨者，乃其成長之嘉且美也。利者，任何行為必合於義也。貞者，萬物之用，必以堅心不移方可成矣。\n\n君子體仁，足以長人。\n分均，仁也，此仁之道大矣，君子體之，以仁普及教化，以所以長人也。\n\n嘉會，足以合禮。\n不合理則為非禮，合於理之生長，為美之至嘉也。故萬般事物皆有一定之法則，吾人須體理之治，則發展合於天道自然。\n\n利物，足以合義。\n合於義，則能利於萬物之遂行。後出，義也。能斷後，則為義也。而今人類製造之物，無法完全回收，造成自然界之失衡，此不合於義之道也，不合於利物之理。\n\n貞固，足以幹事。\n因堅定不移之意志，則定以成事。\n\n君子行此四德者，故曰：乾，元，亨，利，貞。\n能行此四德，則合乎乾天之道。\n\n初九曰：潛龍勿用，何謂也？子曰：龍德而隱者也，不易乎世，不成乎名，遁世无悶，不見是而无悶，樂則行之，憂則違之，確乎其不可拔，潛龍也。\n\n九二曰：見龍在田，利見大人，何謂也？子曰：龍德而正中者也。庸言之信，庸行之谨，閑邪存其誠，善世而不伐，德博而化。易曰：見龍在田，利見大人，君德也。\n\n乾卦之用，即用九之道。初九為陽剛之微現，如龍之潛隱，聖人居之陋側，堅守其道不因世之變而改變，時不至，隱其行，不求為人知也，自信自樂，見可而動，知災而避，守正道之心堅而不移，此真潛龍也。\n\n因非為君位，但有中正之德，謹言慎行，但求處於無過之地，遇邪道，但求存誠，德施普及，但不伐其惡，以誠純一，雖不為君，但為君之德也。\n\n九三曰：君子終日乾乾，夕惕若厲，无咎，何謂也？子曰：君子進德脩業，忠信所以盡德也；脩辭立其誠，所以居業也。知至至之，可與幾也；\n知終終之，可與存義也。是故居上位而不驕，在下位而不憂,故乾乾因其時而惕，雖危无咎矣。\n\n九四曰：或躍在淵，无咎，何謂也？\n子曰：上下无常，非爲邪也；進退无恆，非離群也；君子進德脩業。\n欲及時也，故无咎。\n\n位居下卦之上者，已近君位，又因有君之德顯，為免招凶，故君子居此時，必求進德修業，終日謹慎言行，知進退之機，此義之道。\n不以居上位或處下位而驕傲或憂慮，不予人有野心之戒，故雖處危地但無災至也。\n\n或即進退須待時之意，時行時止，不可恆久不變。君子之順時而動，猶影之隨形，並非欲為邪吝之人，亦非欲離同類也。此位乃近君惻之人也。\n\n九五曰：飛龍在天，利見大人，何謂也？子曰：同聲相應，同氣相求,水流濕，火就燥，雲從龍，風從虎，聖人作而萬物睹。本乎天者親上，本乎地者親下，則各從其類也。\n此有中正之德的人，居於君王之位，天下人皆歸仰其德，上應於下，下從於上，故聖人做而萬人皆明，因同德相感，故賢人出，各有其類，本為君位之人則親和於君王，本為位低之賢，則近於下位之人，此乃自然之水流濕，火就燥，雲從龍，風從虎之義。故利見大人。\n\n上九曰：亢龍有悔，何謂也？子曰：貴而无位，高而无民，賢人在下位而无輔，是以動而有悔也。\n有陽剛之正德而居不適位，則動而必悔，因无民无輔，獨力難成也。\n\n##### 潛龍勿用,下也。\n\n##### 見龍在田，時舍也。\n\n居下位之時，即有中正之德，亦宜潛隱，不可就用也。\n\n因時而止，此利普施其德於一地，範圍有限。\n\n##### 終日乾乾，行事也。\n\n##### 或躍在淵，自試也。\n\n君子行事之法則，不居君位，則終日警惕，進德修業，不求有大功。\n\n處君側，可自試時機為何，動靜隨消息而進或止，不可躁進，求凶之道。\n\n##### 飛龍在天，上治也。\n\n##### 亢龍有悔，窮之災也。\n\n有君王之位人，又有中正之德者，如龍在天，乃上上之治，其意如此。\n\n因窮困之極，乃有太過之舉動，此災之至也。\n\n##### 乾元用九，天下治也。\n\n##### 潛龍勿用，陽氣潛藏。\n\n用九之道，因天與聖人同知且同用，天下因治。\n\n方陽衰而潛藏之時，君子效此，亦晦隱，不可用也。\n\n##### 見龍在田，天下文明。\n\n##### 終日乾乾，與時偕行。\n\n龍之陽剛德性，見於地上，如此天下則見其文明也。\n\n##### 或躍在淵，乾道乃革。\n\n##### 待時而動，不可分秒懈怠。\n\n##### 飛龍在天，乃位乎天德。\n\n因知進退之得宜，故能離下卦，而躍居上位，故曰上下之革。\n\n##### 亢龍有悔，與時偕極。\n\n##### 正於君位，天德乃現，如龍升天。\n\n##### 乾元者，始而亨者也。\n\n時之過，再居此時，則人與時皆過也。\n\n##### 用陽剛之天則，初始即可亨通也。\n\n##### 乾元用九，乃見天則。\n\n##### 利貞者，性情也。\n\n用九，乃天之則也，天之法則即為天道，聖人稟道而行，得失吉凶立知於事之初，此為天則。\n\n陽剛之性既亨通，須始終如一，則能生生不息。\n\n乾始能以美利利天下，不言所利，大矣哉。\n乾始之道，能使天下皆感其美，而天下因之而利，又不歌功頌德，將功歸己，此則大矣。\n\n大哉乾乎！剛健中正，純粹精也；六爻發揮，旁通情也；時乘六龍，以御天也；雲行雨施，天下平也。\n此言乾道之偉大，因純之剛健中正，按步就班，順時順位而行之，則可以統御天下，陰陽和暢，天下則進入和平之道也。\n\n君子以成德爲行，日可見之行也。潛之爲言也，隱而未見，行而未成，是以君子弗用也。\n君子以行為而示人其德性，隨時可見。初因方潛未為見用，故君子弗用也。\n\n君子學以聚之，問以辯之，寬以居之，仁以行之，易曰：見龍在田,利見大人，君德也。\n聖人居下位，德已顯，卻未得位時，必求進德修身，不怪時之不與，但求身體力行此雖不為君，卻是為君之德才。\n\n##### 九三：重剛而不中，上不在天，下不在田，故乾乾因其時而惕，雖危无咎矣。\n\n##### 九四：重剛而不中，上不在天，下不在田，中不在人，故或之；或之者，疑之也，故无咎。\n\n因九三位為過中而又居下卦之上，屬相位，上又未至君位，又為陽剛之性，故屬危懼之地，聖人知戒，競競惕惕以防危，故雖處此時而无咎也。\n\n九四為近君位，亦屬危地，或進或退，但求平安耳，故可无咎。君子能曲能伸。\n\n夫大人者，與天地合其德，與日月合其明，與四時合其序，與鬼神合其吉凶，先天而天弗爲，後天而奉天時，天且弗違，而況於人乎？况於鬼神乎？\n聖人先知於天故天與其同，後於天又順於天，此合乎天道，故人與鬼神皆不能違，天為至大，存天地之間，道也。鬼神，造化之跡也。\n\n亢之爲言也，知進而不知退，知存而不知亡，知得而不知喪，其唯聖人乎！知進退存亡，而不失其正者，其唯聖人乎！\n亢之義乃不知進退存亡之機也，聖人知亢而處此，凡事皆不失正道，故不為亢，唯聖人可為也。"},"000000":{"text.tab1":"此卦漢高袓與項羽交爭卜得之，乃知身霸天下。\n\n#### 圖\n十一箇口，一官人，坐看二串錢 。一官人立受命，一馬，金甲神人在台上乘雲下，綬文書與官，土堆上有四點。\n\n**生載萬物之課**\n\n**君倡臣和之象**\n\n#### 雜\n\n**雜卦曰：乾剛坤柔**\n\n#### 序\n**序卦曰：有天地，然後萬物生焉。**\n\n\n#### 解\n• 一、十一口：吉也，陳姓人也。\n• 二、一官人：倌人，丈夫也。公務員也。\n• 三、坐看二串錢：欲拿不得，憂心忡忡狀。\n• 四、一馬者：肖馬人；指官貴；指調動也。\n• 五、金甲神：示民心也。\n• 六、授文書與官：授官封侯。\n• 七、土堆上有四點：黑也，背有陰謀也。","text.tab2":"此格在陽宅上出現，就如易之言地厚能載物一樣，已婚女人才有，其包含寡居，且有子女同住，此局方現。\n代表意義為婚姻主破散，孤軍奮戰，肩負一家之重任，夫宮不得志造成此果，如以事業上論，則官家掌權，商人賺錢易如反掌，女中強人型，其志過丈夫，無人能及，但缺點為到老孤單無子女願居身側，因個性會趨於孤僻。\n婚破後，不再有婚，何時婚破須看命，運只有佔一半並非全部。即令有對象出現，不過只能同居，而於婚姻，將不再有第二次，這是肯定的。\n此卦禁忌在其出現後，公司行號必須正妻之名，即女人當家方有成就，很多人公司負責人為丈夫，惟乾卦可行，但卻居坤位，始成破格，終必敗的。故如有一女人家，只要事業，只要健康，對於婚姻因前次之失敗，已無興趣再婚者，此卦對其大利，終其一生成就很大，財祿無缺，到老平安，必無夫之牽掛，此時男人對她來說只是負擔，終無所助。老來近於宗教，行善之人。","text.tab3":"&0&\n**坤：元、亨、利牝馬之貞。**\n坤乃地之厚德，示人效地之性，如牝馬之柔順而健行也，貞示堅心，但與乾不同，乃堅心於柔順之念也。\n\n君子有攸往。\n君子因行柔順，且表裡一致，合乎坤地之德性。\n\n先迷後得，主利。\n陰從陽也，即不了解但知須從陽剛之中正，如不知而欲進，則迷錯，損失在己，須居於後，則利，如君臣之道，柔順乃臣之職也。\n\n西南得朋，東北喪朋，安貞吉。\n西南為陰位，東北為陽位，陰必從於陽，陽之正而陰亦正，由陽剛之中正，去蕪存菁，故能成化育之功也。\n/0&\n\n#### 彖\n\n**彖曰：至哉坤元！萬物資生，乃順承天，坤厚載物，德合无疆。**\n坤之道大也，萬物因乾而始，因坤而生，猶父母之道，坤之德厚，故能持載萬物。\n\n含弘光大，品物咸亨，牝馬地類，行地無彊，柔順利貞，君子攸行。\n含弘光大此四者，用来形容坤道，含，包容也，弘，寬裕也，光，昭明也，大，厚且博廣。\n聖人有此四德，故能成天之功，牝馬因柔順而能行，故健。\n\n先迷失道，後順得常。西南得朋，乃與類行；東北喪朋，乃終有慶，安貞之吉，應地无疆。\n因先迷而從陽剛之德，後必得理，西南為陰，同類而行，故得朋，東北陽方，離其類而喪朋，因離其類而從陽，故能成物之功也。終必吉，又因能安心堅守此道，則無所不可往矣。\n\n#### 象\n\n**象曰：地勢坤，君子以厚德載物。**\n坤地之道至大，聖人體之，君子以地之柔順且厚能載物之德處事。\n\n&1&\n##### 初六：履霜，堅冰至。\n\n##### 象曰：履霜堅冰，陰始凝也，馴致其道，至堅冰也。\n\n聖人於陰之始生，知其將長，此時戒之，猶人之履及霜，則知後必有堅冰，故小人始雖甚微，但絶不可使其長，長盛則凶也。\n\n陰始凝為霜，渐盛則至堅冰，故聖人戒小人於初，如任小人因循不阻止，則終至凶。故吾人須戒之於初，小人表面常有可憐，博人同情，示弱以求憫恤，實則內心有所圖，今人不知濟弱扶倾與姑息養奸乃一線之差，一昧以濟弱扶倾為自傲，殊不知其姑息養奸，而至今小人才盛。\n/1&\n\n&2&\n##### 六二：直方大，不習，无不利。\n\n##### 象曰：六二之動，直以方也，不習，无不利，地道光也。\n\n聖人以地之直、方、大三德以盡地之道。\n直者，直來直往，不迂迴作假。方者，原則不因局勢而改變，且正。大者，容載萬物之胸襟乃大也。不習，謂順其自然，則無往不利。亦可云，因又直且方，氣勢乃大也。\n\n地道之光顯，由其直且方大，人人順其自然，則奸人何所遁形，無往不利。\n/2&\n\n&3&\n##### 六三：含章可貞，或從王事，无成有終。\n\n##### 象曰：含章可貞，以時發也。\n\n六三居相位，為臣之道，如有含章之美，即不居其功，將善歸於君王，乃可因王無忌惡之心，終必吉。\n\n處臣下之道，不當有功，免招君忌，但義之當為時，須立行之，此因不有其功，不失其宜，皆因時也。今人含而不為，皆不忠之人。\n\n或從王事，知光大也。\n聖人知含章之光大，故能養晦，小人有善唯恐人不知，此君子小人之分野。\n/3&\n\n&4&\n##### 六四：括囊，无咎，无譽。\n\n##### 象曰：括囊无咎，慎不害也。\n\n六四為居近君之側位，藏口而不露，則平安無災，此沈默之功也。\n\n能隨時謹言，不妄言，此無害之因慎也。\n/4&\n\n&5&\n##### 六五：黄裳，元吉。\n\n##### 象曰：黃裳元吉 ，文在中也。\n\n坤本論為臣之道，今臣居尊位，或婦人居尊位，须有黄裳之戒，應守中而居下，不可揚溢無節制，否則必有非常之變。\n\n因黃裳之美，乃內積至美，執中不過，位高但謙居下，故吉。\n/5&\n\n&6&\n##### 上六：龍戰於野，其血玄黃。\n\n##### 象曰：龍戰于野，其道窮也。\n\n六爻為極盛之位，陰至極則陽至，故有抗爭，因六又再進不已，故必戰，戰必有傷，故血色現，天之血色為玄，地之血色為黃。\n\n道因陰至極而無道，故有龍戰於野之象現。\n/6&\n\n&7&\n##### 用六：利永貞。\n\n##### 象曰：用六永貞，以大終也。\n\n此為用陰之道，如乾有（用九）之道同。\n陰道柔而難常，有朝令夕改之憂。故利在常而堅固。\n\n聖人自此悟之，始終如一，堅心不變，必利，其終極必大。今人朝夕所思不同，自視甚重，角色不能認清，小人有太過之行為，常人從俗只見愚善，致小人極盛，積非成是，故積重難改。\n/7&\n\n#### 文言\n\n**文言曰：坤至柔而動也剛，至靜而德方。後得主而有常，含萬物而化光，坤道其順乎？承天而時行。**\n坤之道雖柔，但如動亦須剛，坤之體至靜，但其德也须方正。動而不違方正。再得同道之呼應，成萬物光大之功，故坤道之順大，皆因王時之至也。\n\n積善之家，必有餘慶，積不善之家，必有餘殃。臣弑其君，子弑其父，非一朝一夕之故；其所由來者漸矣，由辨之不早辨也。易曰：履霜堅冰至，蓋言順也。\n學者讀此段，必可自悟矣。故聖人戒小人於初，其道大也。\n\n直其正也，方其義也；君子敬以直内，義以方外，敬義立而德不孤，直方大，不習无不利，則不疑其所行也。\n君子外敬內直，堅守義以方其外，故內敬直，外義方，其德之盛，順其自然，不须裝飾，無人會疑其所行也。\n\n陰雖有美含之，以從王事，弗敢成也。地道也，妻道也，臣道也，地道无成，而代有終也。\n臣下之道，不表其功，含晦以為王行事，至終而不敢有其功，如地道代天終萬物，而成功又歸之於天，妻之道同此。今之妻如何，吾人試自問之？\n\n天地變化，草木蕃。天地閉，賢人隱。易曰：括囊，無咎無譽，蓋言謹也。\n天地相交，則能興發草木，天下因君臣相往而道亨。今天地隔絶，萬物不成，猶君臣無道，賢者隱退，此時易道為閉口含藏，雖無聲譽，但無災，皆因言論謹慎也。\n\n君子黃中通理，正位居體，美在其中，而暢於四支，發於事業，美之至也。\n君子知謙守下之道而通於事理，居君王位故美積其中，暢於四體，現於事業，此美之極也。\n此段乃示柔中有剛，乃至大至美，今人有柔善而無剛，或過剛而無仁，皆不足之美也。\n\n陰疑於陽必戰，爲其嫌於无陽也，故稱龍焉； 猶未離其類也，故稱血焉。夫玄黃者，天地之雜也，天玄而地黃。\n中醫之至道在此，陽大陰小，陰乃從陽，故經方派乃用陽藥，如人間亦然。如令陰到極盛，陽受陰盛而外走，此不相從必戰，傷而見血，天地之色變，亦言傷之大也。"},"100010":{"text.tab1":"此卦季布遇難，卜得之漢推其忠，乃赦其罪。\n\n#### 圖\n人在望竿頭立，車在泥中，犬頭上回字，人射文書，刀在牛上，一合子。\n\n#### 雜\n\n**雜卦曰：屯見而不失其居，蒙雜而著。**\n\n#### 序\n\n**序卦曰：盈天地之間者唯萬物，故受之以屯。屯者，盈也，屯者，物之始生也。**\n\n龍困淺水之課 萬物如生之象雲雷之興，陰陽始交，而未成澤，故為屯，如成澤則為解，此卦動於險中，乃屯之義，如陰陽不交則否，此時機乃天下屯難，未亨泰之時也。\n\n#### 解\n• 一、人在望竿頭上立：此不明局勢之屯難時也，不可妄動也。\n• 二、犬上回字：乃肖狗之人，狗年，狄姓之人，果為哭之象。\n• 三、車在泥中：進退兩難之象。刀在牛上：解也，牛為貴人象。\n• 四、人射文書：張姓，小人阻礙也。射：同音，色也，緋聞。\n• 五、牛不順道：背道而馳，反其道而為之，吉。\n• 六、人望：人亡也。\n• 七、人立：在位也。\n• 八、盒：先成後破。\n• 九、牛回頭視犬：計無所出，待也。\n卜得此卦：動於險中，先成後破也。","text.tab2":"此卦為次子卦，時機在長子未婚，且同居一處，方可論之，一旦長子或本人結婚，此局立消，切記。\n次子居此，則比長子早婚，比同時出生之人早二年結婚，但有禁忌，如肖狗或狄姓之人，主夭折，此卦大凶，又逢犬年加凶，肖牛人，必任妻擺佈，背離家庭，不顧父母。所以如其他人成此局，只不過早婚而已，對犬、牛人主凶，不利。\n屯卦有一運用，在家族事業，世代交替時，父必使次子繼位長子失寵，其運如此，吾人觀命時，必可發現，次子之事業必優於長子，才智能力超越長子多多，自然而然居此局，故吾人入宅如發現此局，反過來看，亦可得到很正確之結論，所以命運同參，方可瞭解同時生人之結果不同，即令同時生人都為次子，且長子屬肖也同，但卻不一定長兄生時皆亦同，差異即在此。\n次子越位，志過長兄局已定出，個性上亦同。","text.tab3":"&0&\n**屯：元、亨、利、貞，勿用有攸往，利建侯。**\n此義處屯之時必貞固（堅心），須明非獨力能成，必廣資助，此利見侯之義。不可往，唯利建侯。\n/0&\n\n#### 彖\n\n**彖曰：屯，剛柔始交而難生，動乎險中。**\n剛柔始交而未通暢，則難屯，難生，於此之時，如動即往，乃取險之道。\n\n大亨貞，雷雨之動滿盈。\n此言屯有大亨之道，得陰陽交而和洽，則成雷雨，充滿天地之間，此因貞固才能出屯。\n\n天造草昧，宜建侯而不寧。\n天時造出地上之草，亂而無序，此暗昧不明時，須建立輔助，可以有助矣，此聖人之戒。\n\n#### 象\n\n**象曰：雲雷，屯。君子以經綸。**\n水未能成雨為雲象，君子觀屯象，知須立法規範來經營此時。\n\n&1&\n##### 初九：盤桓，利居貞，利建侯。\n\n##### 象曰：雖盤桓，志行正也。\n\n初而陽爻居下，意乃剛明之才，當屯難之時，而居下位。此時未便往濟，故盤桓。如遽進，則犯險遇難。此即示人處屯難時，須守正方是，現今之人，鮮少人於屯難之時守正。聖人戒之於屯時。\n\n聖人處屯時，雖有濟屯之志，仍盤桓不動，因時未至也。此居下位之念。\n\n以貴下賤，大得民也。\n初陽之剛健，居陰之下，此易以貴下賤之象。即處屯之時，陰柔不能存，唯一陽剛之才，則眾所歸從也。更加此人能自處卑下，所以大得民心。\n/1&\n\n&2&\n##### 六二：屯如邅如，乘馬班如，匪寇，婚媾，女子貞不字，十年乃字。\n\n##### 象曰：六二之難，乘剛也。十年乃字，反常也。\n\n此陰爻之柔居屯世。受逼於初剛健之人，故柔處屯時，無法自濟，又受下之陽剛所逼，為難為也。非理而至者為寇，柔守中正不苟合於初剛之意，須十年久久乃通。\n此六二患難，因柔，又居屯時，又有下之陽剛所逼，此患難乃因柔而生，須十年，難久必過。如反其柔之常性，而與陽剛合，則省十年，十為數之終也。\n/2&\n\n&3&\n##### 六三：即鹿无虞，惟入于林中，君子幾，不如舍，往吝。\n\n此陰爻居三之陽位，此意柔居剛而不中正，則必妄動，貪於所求，必不足自濟，此不安之源。如入山林射鹿，又無嚮導，此不安也。\n君子見事於微，捨而勿逐，如往取，徒取其咎也。\n\n##### 象曰：即鹿无虞，以從禽也，君子舍之，往吝窮也。\n\n事因欲而妄動，此貪禽也。處屯之時，不可動而動，凶也。君子捨之不從，則無咎，如往必困窮也。\n/3&\n\n&4&\n##### 六四：乘馬班如，求婚媾，往吉，无不利。\n\n##### 象曰：求而往、明也。\n\n此以柔順居近於君位，此得之於上者，而才不足以濟屯時，須求賢自輔，則往而利矣。\n此即居公卿之位，己之才不足以濟屯難之時，若能求在下之賢人，親而用之，則必平安有利。\n\n知己才之不足，往而求賢，以濟己之不足、此乃真明也。\n/4&\n\n&5&\n##### 九五：屯其膏，小貞吉，大貞凶。\n\n##### 象曰：屯其膏，施未光也。\n\n五居尊位得正，當屯時，若有剛明之才為位，則利。如無，則屯其膏，此因無良臣，而施為有所不下於民，民未得其德澤，乃因威權不在己之故也。此屯因威權已去而妄想瞬間正回，此求凶之道。须以渐正之，方吉，如不為會因當屯時不改，以至於亡矣。\n\n膏澤不下及，此人君之屯也，乃因威權不在之象。\n/5&\n\n&6&\n##### 上六：乘馬班如，泣血漣如。\n\n##### 象曰：泣血漣如，何可長也。\n\n六此以陰柔居屯之終，此險之極而無援，居之不安，動無所向，此窮厄之極，若陽剛而有助，即屯至極，亦可平安互濟矣。\n\n如於屯難窮極，而莫知所為，則至泣血顛沛，則必不長久。\n/6&"},"010001":{"text.tab1":"此卦王莽篡漢社稷卜得知，乃知漢家必有中與之主。\n\n#### 圖\n一鹿一堆錢，一合子，李樹一枝子折，二人江中撑船，珍寳填塞。\n\n**人藏祿寶之課**\n\n**萬物发生之象**\n\n#### 雜\n\n**雜卦曰：屯見而不失其居，蒙雜而著。**\n\n#### 序\n\n**序卦曰：物生必蒙，故受之以蒙。蒙者，蒙也，物之穉也。**\n\n艮為山，為止，坎為水，為險。山下有險，遇險而止，莫知所之，蒙之象也。\n\n#### 解\n<u>蒙卦有示吾人去蒙之道。反觀之，如人以蒙蔽之法示人，勢必有所圖也。圖中：</u>\n• 一、滿船珍寳：暗示人圖財之象。\n• 二、船在水上：乃離國他去象。\n• 三、鹿在地上，示仍有小祿於內，鹿—祿也。\n• 四、兩串錢：乃憂心忡忡象，即意雖有祿，但仍令人憂心。\n• 五、圖中一碗：示此蒙蔽手段，必先成後破，因其乃不正之財，必不久遠也。\n• 六、李樹子折：示人李姓人氏，且有子夭折之象，則成格。","text.tab2":"陽宅上此局出現，必有三子居家中，且未婚，排行第三兒子，出此局其造成：\n• 一、以蒙蔽之法欺家人，惟利是圖。\n• 二、本身愚昧，不知進退。\n• 三、性剛不聽兄長之言，獨行獨斷。\n• 四、較次子早婚，較長子晚婚。\n• 五、比同時生人早七年婚。\n• 六、常喜賭博性之錢祿，故往往求財遇險之象。\n吾人入宅發現此局，當及早對其改局，惟有使他本人想通，方可助他，否則即令父母耳提面命，亦於事無補，成敗在一念之間耳。\n蒙之生，由已之念，俗言：二片葉子放在眼前，泰山也看不到了。可見一念之差，距離有如此遠，更遑論可能誤一世，待後悔後，已是百年身矣。抱持僥倖心理之人是最要不得的，你不會有第二次機會再來過的，切記！切記！","text.tab3":"&0&\n**蒙：亨，匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告，利貞。**\n兒童之蒙，其未發蒙，而志則專一，此為童蒙，因有童蒙，則告之。因其童蒙，故必至誠一意以求必中。而發蒙之道，必以貞正方吉。\n/0&\n\n#### 彖\n\n**彖曰：蒙，山下有險，險而止，蒙。蒙亨，以亨行，時中也。匪我求童蒙，童蒙求我，志應也。**\n此因剛賢之才居九二爻位，處於下位。六五之童蒙，處於君位。九二之賢臣，必以時中也。\n時之義，必待其至誠一心之童蒙求問，方以告之，乃中與。如賢能之人處下，而自求為進，主動告以君，則必無被信用之理。故如方法正確，非二求於王君位，實為五之志應於下二也。此為「時中」也。\n\n初筮告，以剛中也，再三瀆，漬則不告，瀆蒙也。\n此言，如誠一而來求決其蒙，當以剛中之道開發之，如煩數不能誠一，則乃瀆蒙，此時，不當告。因告之必不能信受，徒以煩瀆，無益矣。\n\n蒙以養正，聖功也。\n\n此申利貞之義，養蒙之法，必以正道，此時乃純一未發之童蒙時，故養正於蒙，乃學之至善也。現今人類皆「教而後禁」，故難以教勝，故時風日下。\n\n#### 象\n\n**象曰：山下出泉，蒙，君子以果行育德。**\n此蒙之象也，如人蒙蔽，未知所適從狀。君子此時，必以果決其行，使通行無阻。如始生而方法不對，則以養育其明德為教法。\n\n&1&\n##### 初六：發蒙，利用刑人，用説桎梏，以往吝。\n\n##### 象曰：利用刑人，以正法也。\n\n初六之爻屬最下位，此言，發下民之蒙，须明刑禁以示之，使之知懼，從而教之。是故為政之始，立法居先，治蒙之初，威以刑者，是以使民去其昏蒙之桎梏。不設法去其蒙之桎梏，即善教亦無法改變其蒙，故聖人使下民畏威以從，不敢任意其昏蒙之欲，然後才能漸知善道，此為移風易俗之唯一法門。但只有初爻之始可用之，如專用刑以為治，則蒙雖畏，終不能发。\n\n此即用立法制刑，以教人之意，萬不可不教而誅。後世之論刑者，不復知教化孕其中，只一昧的論刑。\n/1&\n\n&2&\n##### 九二：包蒙吉，納婦吉，子克家。\n\n##### 象曰：子克家，剛柔接也。\n\n九二有剛明之才，與六五之君相對應，其志又一同，當其時，必廣其包容，老人婦孺之見，皆包容，則能啓天下之蒙，功大矣。今人專持其明，漫用自任，致凶之道。是故古之堯舜，其聖功天下莫及，尚能請教下民，取合理之言，天下之民歸之，就如兒子能治其家一樣\n\n兒子之能治家，其因父之信任專一也。是故九二能成啓蒙之功，乃由五之信任專一也。\n此剛柔相接之義也。\n/2&\n\n&3&\n##### 六三：勿用，取女見金夫，不有躬，无攸利。\n\n##### 象曰：勿用取女，行不順也。\n\n三爻之位陰居之，此時機正應上位不能遠從近見，九二為群蒙所蔽，居此之時，無所往則利矣。猶女之嫁夫，當由正禮，如見人多金，悦而相從，不可取也。\n此女不可取，因行不順故也。\n/3&\n\n&4&\n##### 六四：困蒙，吝。\n\n##### 象曰：困蒙之吝，獨遠實也。\n\n因六四之陰爻，離剛賢最遠，無由來發其蒙，終困於昏蒙也，其永不足矣。\n\n此義昏蒙之人，不能親賢以致困，終不得明矣。實，陽剛也。\n/4&\n\n&5&\n##### 六五：童蒙，吉。\n\n##### 象曰：童蒙之吉，順以巽也。\n\n此示柔順之人居君位，下應於二，乃示柔中之德，任剛明之才，如此能治天下之蒙，吉也。\n為人君者，如至誠用賢，以成功惠於百姓，此功亦猶如己出一樣，何須顧忌手下，功高震主。\n\n從人之言，只要合理，都能接受，順也。\n降尊位下求，巽也。君能如此，天下治矣。\n/5&\n\n&6&\n##### 上九：擊蒙，不利爲寇，利禦寇。\n\n##### 象曰：利用禦寇，上下順也。\n\n陽剛居蒙之極，爻之終，示吾人知，人之愚蒙至極，而為宼為亂者，當擊伐之，故戒不利為寇。\n\n禦寇之限度，上不過暴，下得撃去其蒙，則上下皆得順矣。\n/6&"},"111010":{"text.tab1":"此卦蔡順遇赤眉贼，卜得知，乃知必脱大難也。\n\n#### 圖\n月當天，一門，一人攀龍尾，一僧接引，一墓。\n\n**雲靄中天之課**\n\n**密雲不雨之象**\n\n#### 雜\n\n**雜卦曰：需不進也，訟不親也。**\n\n#### 序\n\n**序卦曰：物穉不可不養也，故受之以需。需者，飲食之道也。**\n\n蒙之後須養，此需之時也，飲食之道也。雲之上於天有蒸潤之象，就如同飲食之於人一樣，此養之時，乃待也。乾之性健，必採進法，仍處坎險之下，故須待而後進，即外險內健，此卦之象，乃真養之義。\n\n#### 解\n• 一、月當天：陰人居上位象，無擔當也；清明無災。\n• 二、 一門：豪鬥也，官府也。\n• 三、一人攀龍尾：附於貴人，想進據其位也。\n• 四、一僧接引：光頭之人，柔而無慾之象。入空門可解。\n• 五、墓：藏棺之地，有官與財象；置之死地而後生之象。\n全意，即使如龍之力大，但動不以時，則有入墓之險，此動為求官與財。佛理亦同：『生死一線，無死焉大生』。","text.tab2":"此卦出現，代表其人智慧成長快速，勢必超越同年紀同時生人多多，且個性剛烈，不受建言，須注意，如長兄一旦結婚，此局立消，局自長兄婚之日始，立變為雷天大壯收局。\n需卦局所表現的意義如後：\n• 一、婚事延後七年，且單歲婚。\n• 二、如逢八字中，喜慶逢凶，必入宗教或不婚。\n• 三、婚時，妻必為改嫁之人。\n• 四、於事業上，必有大成，年少居權位，受重用，進退有據。","text.tab3":"&0&\n**需：有孚，光亨贞吉，利涉大川。**\n以二卦體而言，乾以剛健，如上進而遇險，此未可進也。需待之。以卦之爻言，五爻陽居陽位，乃陽剛中正之德人，居君位，而誠信充實於內（內卦為乾），則光明而可進，必亨，故利涉大川。\n/0&\n\n#### 彖\n\n**彖曰：需，須也，險在前也，剛健而不陷，其義不困窮矣。**\n因險在前，未可遽進，须待而進，以乾之剛健，能待而不輕動，則不陷險中，則必不至困窮。時下剛健之人頗多，其動必躁，如能待時而動，則為至善之道。\n\n需：有孚，光亨貞吉，位乎天位以正中也。\n孚，中實之義。五位因剛實居中，此孚之象，此居天位而能正中，光明而亨通，且須貞正（堅心），吉也。\n\n利涉大川，往有功也。\n因中實（內之學問、操守）而貞正（堅心向道），即涉險阻，亦可有功也。故需之道在以乾剛之性而知待之道，何所不利。\n\n#### 象\n\n**象曰：雲上於天，需，君子以飲食宴樂。**\n此自然之象，水上於天未成雨，為雲。猶君子積蓄其才德，而未施於用也，懷其大才，安以待時，飲食以養身體，宴樂和其心志也。\n\n&1&\n##### 初九：需于郊，利用恆，无咎。\n\n##### 象曰：需于郊，不犯難行也，利用恆，无咎，未失常也。\n\n初爻因最遠於險，故於郊（曠遠之地），故君子處於曠遠之地，仍安守其常，則無咎災也。如躁進犯難，則必災至矣。\n\n君子處下野，不冒犯險難而行，復宜安處，不失其常，保持恆靜心亦不動，如雖不進而志動，則不能安其常也。\n/1&\n\n&2&\n##### 九二：需于沙，小有言，終吉。\n\n##### 象曰：需于沙，衍在中也；雖小有言，以吉終也。\n\n坎為水，水近則有沙，此二爻之位近險，故需于沙。君子知渐近於險難，雖未至於害，已小有言矣。此示言語之傷，至小者也。二爻以陽爻居之，示人陽剛之才居陰柔位，守中正之德，雖小有言語之傷，而无大害，終也吉。\n\n此寓，二位雖近險，而如以寬裕居中，即小有言語之傷，及終得吉。\n/2&\n\n&3&\n##### 九三：需于泥，致寇至。\n\n##### 象曰：需于泥，災在外也。自我致寇，敬愼不敗也。\n\n泥，逼近於水也。因逼近於險，而致寇難之至，此居健體之上，有進動之象，苟非謹慎，終致喪敗也。\n\n三位居上險之最近，故云災在外。此寇致之因，實乃己之逼也。須敬慎小心，量宜而進，則无喪敗。義在相時機而動，戒之盛也。即盛時須戒之象。\n/3&\n\n&4&\n##### 六四：需于血，出自穴。\n\n##### 象曰：需于血，順以聽也。\n\n第四爻位以陰柔之質居於險，下又有三陽之進，必傷於險難。因傷於險難，必不可安居，而失其居所，故出自穴。此順時以從，不競於險難，則不至凶也。又無中正之德，只以剛競於險，此適足以致凶之道也。\n\n意為陰柔之性居近險之位，不能處，則退，以順從而聽於時，不至凶也。\n/4&\n\n&5&\n##### 九五：需於酒食，貞吉。\n\n##### 象曰：酒食貞吉，以中正也。\n\n此五君位，陽剛之人居中，只需宴安酒食以待之，所需必得也。堅心，必吉。\n\n陽剛中正居五之君位，只需酒食，即可盡其道也。\n/5&\n\n&6&\n##### 上六：入于穴，有不速之客三人來，敬之終吉。\n\n##### 象曰：不速之客來，敬之終吉；雖不當位，未大失也。\n\n陰柔於六位，乃需之極限，須安其處，此入於穴之義。安而止居，則下之三陽必來。不速，不促之而自來也。此時須以至誠盡敬之心以待之，雖再剛暴，必無欺凌之理也，此因六位陰位，非三陽乾體之人，志在必奪，故敬之則吉。\n\n此不當位，意為以险而在上也。聖人明示陰宜居下而今居上，此不當位也。但如能謹慎自處，則陽再剛亦不能欺，終得其吉。\n/6&"},"010111":{"text.tab1":"此卦漢高祖斬丁公，疑惑，卜得之後，果遭戮也。\n\n#### 圖\n口舌二字，山下有睡虎，文書在雲中，人立虎下，望口舌，柳樹在旁。\n\n**蒼鷹逐兔之課**\n\n**天水相違之象**\n\n#### 雜\n\n**雜卦曰：需不進也，訟不親也。**\n\n#### 序\n\n**序卦曰：飲食必有訟，故受之以訟。**\n\n人之所需飲食也，因有所須，爭訟之所由起。天陽上行，水性就下，其行相違，所以成訟也。卦義：外健內險之象，必有訟。\n\n#### 解\n• 一、口舌二字：官司，糾紛，災也。\n• 二、山下有睡虎：入危地而不知象。\n• 三、虎：王姓，肖虎之人。\n• 四、文書在雲中：心想事不成，幻想也。\n• 五、人立虎下：近險也，近險為脱險之道。\n• 六、柳樹：隨風而動，雖大風而不斷，此柳之性也。<u>〔韓信之辱，即柳性〕</u>","text.tab2":"此局令人官司不斷，訴訟纏身，或為好訟之徒。一旦離婚此局方破，否則你只好改變臥房位置，方可脫離此局之限。\n• 一、官人居此局，升官慢五年，諸事不順，即令不違法，亦受他人連累。\n• 二、商人居此局，財祿不進，必須興訟方可得財。\n• 三、夫妻婚姻主破，訴訟離婚，此須看命，如命中有，則必成格；如命中沒有，則不成格。\n• 四、專業人士如醫師，會計師等居此局，千萬須防訟事來臨，流年逢之，同時生人沒事，而你必生事端，運氣不好使然。","text.tab3":"&0&\n**訟：有孚，窒惕，中吉，終凶。**\n訟之道，必中實，如中無有實，乃誣妄，凶之道也。訟，乃與人爭辩，而待決於他人，雖有孚，仍會窒塞。故有得中實則吉，但終極其事則凶也。\n\n利見大人，不利涉大川。\n因訟者求辩曲直，故利見大人，如大人能以剛明中正決其訟，吉。因訟非吉事，須擇安地而居，不可陷於險難，故不利涉大川也。\n/0&\n\n#### 彖\n\n**彖曰：訟，上剛下險，險而健，訟。**\n此內險外健，訟之所起。若健而不險，不生訟也。險而不健，不能訟也。猶如一人，只重外飾，內無真實材料，此為訟之源也。\n\n訟，有孚，窒惕，中吉，剛來而得中也。\n訟之，有中實剛健，但處訟之時，雖有中實，仍有阻礙而須惕懼，則吉。\n\n終凶，訟不可成也。\n因訟本非善事，乃不得已也，終極其事，則凶矣。\n\n利見大人，尚中正也。不利涉大川，入于淵也。\n如見中正之大人，吉。與人訟必先居於平安之地，任意行險，則身陷。\n\n#### 象\n\n**象曰：天與水違行，訟，君子以作事謀始。**\n此因天上水下，二卦體相違，訟之由也。君子觀象，知人有爭訟之道，故行事必「慎始」，絶訟端於事之始，則訟不生矣。\n\n&1&\n##### 初六：不永所事，小有言，終吉。\n\n##### 象曰：不永所事，訟不可長也。雖小有言，其辯明也。\n\n此陰柔居下位，必不可終極其訟也。若不終極其訟，雖小有言傷，而終得吉。\n\n此即於訟之初，即戒訟，因柔弱而居下，不可長久。因既訟，必有小災，應辩理之明，終得其吉。\n/1&\n\n&2&\n##### 九二：不克訟，歸而逋，其邑人三百户，无眚。\n\n##### 象曰：不克訟，歸逋竄也。自下訟上，患至掇也。\n\n二爻與五爻為相應之地，九二乃將位，以剛處險，與五之君位為敵，知不可敵，歸而避之，儉樸自處，則無過矣。三百户，乃邑之至小者，如處強大，此競也，則必過也。\n\n因義不敵，故不能訟，須避去其所。自下訟上，義不正，且氣勢不足，此招禍患之至易也。\n/2&\n\n&3&\n##### 六三：食舊德，貞厲終吉。或從王事，无成。\n\n##### 象曰：食舊德，從上吉也。\n\n陰爻居三陽剛位，乃陰柔居二剛之間，须知雖處危地，能知危懼，終必獲吉。守原之本分而無所求，則不生訟矣。或從上而成，因從王事，故不在己也。訟乃剛健之事，故始則不永，三則從之，皆可使善也。\n\n守其本分，順從上之所為，非由己意，終也吉。\n/3&\n\n&4&\n##### 九四：不克訟，復即命，渝安貞，吉。\n\n##### 象曰：復即命，渝安貞，不失也。\n\n此陽剛居乾下，因不得中正，本必訟。故四爻剛位陽居之，雖剛健欲訟，而無與對敵，則訟無由而興。此即若能克制剛忿欲訟之心，就於命，革其心，平其氣，而變為安貞，吉矣。\n孟子云：「方命虐民，夫剛健而不中正，則躁動，故不安，處非中正，故不貞，不安貞，所以好訟也。」方，不順也。\n/4&\n\n&5&\n##### 九五：訟，元吉。\n\n##### 能如上，則無失，吉也。\n\n##### 象曰：訟元吉，以中正也。\n\n九五居尊位，治訟得中正，則大吉而盡善。\n\n##### 此云中正之道，施必吉也。\n/5&\n\n&6&\n##### 上九：或錫之鞶帶，終朝三褫之。\n\n##### 象曰：以訟受服，亦不足敬也。\n\n剛健之極，處訟之終極，人因其剛強，窮極於訟，取禍喪身，即使善訟能勝，即賞，亦來自與人仇爭所得，其能保乎。終一日而見三次褫奪也。\n\n窮極訟事，即有受命之寵，亦不足以敬，而可賤惡，禍患隨至也。\n/6&"},"010000":{"text.tab1":"此卦周亞夫將欲排陣，卜得之，果獲勝。\n\n#### 圖\n虎馬羊待命，將軍臺上立，一文一武綬印，人跪台上受印，棋盤在下。\n\n#### 雜\n\n**雜卦曰：比樂師憂**\n\n#### 序\n\n**序卦曰：訟必有衆起，故受之以師。師者，衆也。**\n\n天馬出群之課 以寡服眾之象師之興，因有爭議也。此卦本體上順下險之象，亦即地下有水，內外分即內險外順，有行險之道如何順行之義。水在地下必聚，如部隊之集結，如九五為一陽，餘為諸陰，則為天子之象，今九二為將位，統帥諸陰，則為將帥之象。此卦申明處師之時，內須戒慎警惕，不可掉以輕心，外須統一專權，命令如一，方能行順之義。\n\n#### 解\n• 一、肖虎、馬、羊之人三合：可戰。\n\n> 倪曰：這三種人卜到地水師，成格。\n\n• 二、文武二官綬印：得萬人服之帥。\n\n• 三、人立棋盤上：圍棋愈下愈多，但須有謀略方可成事。\n\n> 倪曰：（可指）东西越卖越多\n\n• 四、將軍臺上立：示有兵權也。生殺之專權也。武職大利。\n• 五、羊回首：回陽也，病危之人卜之，有自陰間回陽間之象。\n• 六、虎在馬後：為馬之靠山，馬因虎威而動。故馬回首視虎。\n\n> 倪曰：老虎是馬的貴人","text.tab2":"此局大異其趣，吾人常見潑婦罵街，女人性剛，甚而與人毆打，其局如此，生人如此，亦為妙矣。\n當你發現母親如此，兇暴，易與人起爭端，仇視外人，其皆由此局產生的，當須化解，方可平安。\n• 一、對婚事必凶，有妻毆夫之象。\n• 二、事業上，亦不得志，常生糾紛，男命女身。\n• 三、獨來獨往，膽大過人。\n• 四、從商主破婚，得財，尤利虎、馬、羊三人，其商機、官運亨通，但婚則凶，各有利弊。\n其與同時生之人或雙胞胎大異其趣，各方面皆不同。","text.tab3":"&0&\n**師：貞，丈人吉，无咎。**\n此言，師之道必有正名，因師之與，天下萬民必傷，如不以正，則民心不從，致凶之道。\n丈人，即尊貴有眾望之人，故出師必立帥將，此人必民所聽從順同，不能服眾人，安得民心。\n如此則無災。故興師必有二道：正名與主將。\n/0&\n\n#### 彖\n\n**彖曰：師，眾也；貞，正也，能以眾正，可以王矣。**\n師為帶眾之道，必以正，如能使眾人皆正，即可王天下。此用師之正道。\n\n剛中而應，行險而順。\n出師之將帥，須得君王之專信也。此王者之帥，民心從之，雖有險必順矣。\n\n以此毒天下，而民從之，吉又何咎矣。\n如從前面所論之師道下手，則雖因出師傷下之百姓，民仍從之，故吉而無災。\n\n#### 象\n\n**象曰：地中有水，師，君子以容民畜眾。**\n水在地下相聚，為眾聚之象，君子之人須以包容民眾，為使民順從之法。\n\n&1&\n##### 初六：師出以律，否臧凶。\n\n##### 象曰：師出以律，失律凶也。\n\n師之出，必以誅亂制暴而動，行師之道，须以律法，合於義理，如不按此法，即致勝亦凶。\n\n師出必有律法，失律法，致凶之道。\n/1&\n\n&2&\n##### 九二：在師中，吉，无咎，王三錫命。\n\n##### 象曰：在師中吉，承天寵也。王三錫命，懷萬邦也。\n\n此言九二之道，為為將之道，君之事為人臣絶無敢專權，但出師作戰之時，則將在外君命有所不從，君王須順從其命，以專信任之。\n\n人臣如無君之專寵，則不得專制之權，更何論成功。\n/2&\n\n&3&\n##### 六三：師或輿尸，凶。\n\n##### 象曰：師或輿尸，大无功也。\n\n輿尸，眾人為主也。此言師旅之事，任當專一，須以剛中之才居上為信，乃得成功。如不這樣，而以眾之意見為主，凶之道也。\n\n如倚二三人以上，必誤之時也，不但無功，凶禍至矣。\n/3&\n\n&4&\n##### 六四：師左次，无咎。\n\n##### 象曰：左次，无咎，未失常也。\n\n左次，乃知不可進而退。此言，師之常法，見可而進，知難而退，進退有據，平安無災。\n六四為陰爻，主陰柔，而師必以強勇，中有陰柔，即兵家之風、林、火、山同義。\n\n言師之道，退亦未必為失道，退須得宜，無災。\n/4&\n\n&5&\n##### 六五：田有禽，利執言，无咎。長子帥師，弟子輿尸，貞凶。\n\n##### 象曰：長子帥師，以中行也，弟子輿尸，使不當也\n\n五為君之位，此為興師之主，此君主興師任將之道。師之興，必以生民受災，蠻夷賊寇，此正名以誅之。如禽獸之入於田中，害五穀，於義宜獵取，則獵取之，如此之動，則吉。如無禽獸入田，則出不因禽，凶。此有禽之義。\n\n任將授師之道，必以長子帥師。此長子義，非定為真長子，而示意為任用可信任之如長子者，可以為帥，以其專任後之權必大，故必有信：方可。若以眾人主之，無主將帥之師，雖名正出師於義，亦凶道也。\n/5&\n\n&6&\n##### 上六：大君有命，開國成家，小人勿用。\n\n##### 象曰：大君有命，以正功也。小人勿用，必亂邦也。\n\n師之終極，言功之成也。此時君主以爵位財祿賞賜有功之人，並任用之。但於軍旅征戰中，查覺出之小人，不能因其有功而任用之，致凶之道。\n\n君王有持恩賞之權柄，来表揚軍旅之功，小人雖亦有賞，用之必亂邦，史上小人持功而亂邦，有太多案例了 。\n/6&"},"000010":{"text.tab1":"此卦陸賈將説蠻，卜得之，果勝蠻王歸也。\n\n#### 圖\n月圓當空，秀才望月飲酒，自酌自斟，藥爐在高處，枯樹開花。\n\n#### 雜\n\n**雜卦曰：比樂師憂**\n\n#### 序\n\n**序卦曰：衆必有所比，故受之以比。比者，比也。**\n\n眾星拱比之課 水行地上之象師之後，師者眾也，眾聚有相比親也。比，相親也，有眾則必有比，故次師也。物之相近莫如水與地，永遠相比附，故卦體為水在地上，地上有水象。水為險，地為順，故外險內順為比卦。險猶戰戰兢兢，恐得罪人象，內心又持順之地道，有坤厚之德性，此比之道也。\n\n#### 解\n• 一、月圓當空：政治清明象。\n• 二、三星拱照：得賢能剛直之人輔助。\n• 三、秀才望月飲酒：示才智之人無憂也。<u>(亦示：作秀之人，於政治清明時，無法出頭〕</u>\n• 四、自酌自斟：無慾則剛象，孤獨之象。\n• 五、藥爐在高處：無病無災，故不需用藥也。\n• 六、枯樹開花：晚發也。示心有誠，制度立，事必成。\n• 七、酒：忘憂之物。\n<u>全卦：上位清明，三台輔佐，人將無憂，即使枯樹亦能開花。</u>","text.tab2":"此卦出現，須長兄為未婚，一旦長兄婚，此局立變為豫卦，須注意變局將如何，則看長兄之命，何時有婚，知何時生變局，此即陽宅上可見未來之象。\n此卦有親比之意。\n• 一、性喜從母事，且任勞任怨，家事一手包辦，與母連心。\n• 二、適婚年齡到時，喜歡比自己年長於己之女人，如命中同時生人為二十八歲婚，但此局人婚必延後三年到三十一歲才婚，且娶年長於己之女人方合格，否則婚主破散，不出一年。\n• 三、如命中主破，婚事不成，再居此局，則終身不娶，且與有婚或離婚之女有來往，終無果也。\n• 四、事業上則居佐才之位，無法任職主管。\n• 五、商場上亦為人工作，不為老闆，同時生人有可能為很成功的老闆，但命只居三才之三分之一，運的局影響，使其終身不得志，且與同時生人有不同之結果。\n唯俟長子成婚後，局方可改變，如長兄居側，或認乾兄，此局勢必難變。","text.tab3":"&0&\n**比：吉，原筮，元永貞，无咎。不寧方來，後夫凶。**\n比為吉之道。人相親比，必有其道，須視可比而決定比之，不可比而比，凶。如果等到不能自保安寧之時，方開始求親比，幸運的得所親比，可得平安。但如仍獨立自持，求親比之想法不前反後，即使是丈夫之親人，亦招凶矣。\n是故君王亦懷柔天下，下位之人亦和親其上，未能獨立也，平日即須有此志，天地之間，沒有不相親比而能獨立生存的。\n相比之道，须兩志相求，如互不相求則為睽卦，故戰國策〈中山策〕有同慾相憎，同憂相親之理。所以好的制度，能使人有所依從，故能互相親和也。\n/0&\n\n#### 彖\n\n**彖曰：比，吉也。比，輔也，下順從也。**\n因相親比為吉之道，有相輔相成之意。但求比之道，須如臣下順從君上一樣，即使地位相同，或上下有別，決不可因持於己之高位，而忘順從之道，此乃真比之道。\n\n原筮，元永貞，无咎，以剛中也。\n\n元、永、貞為相比之道。元為君長之道，永為可以長久，貞謂得正道且堅其心志，人有此三德性，再以陽剛當君主之位，此為君之德也。如此之君主可以無災矣。\n\n不寧方來，上下應也。\n上位之念，應知君不能獨立，须保民以此為安。下民知己不能自保，須擁君以求寧，此上下相應之理。如以王之私而行為之，不求下民之附和，凶危立至矣。\n\n後夫凶，其道窮矣。\n若眾人之志相和親，則無有不遂，此天地之道，若人之和親不行，則雖夫亦凶矣。\n\n#### 象\n\n**象曰：地上有水，比。先王以建萬國，親諸侯。**\n天地之間，物相親比，莫如水在地上，聖人觀比之象，以此建萬國，近諸侯，親近人民，此比之極道。\n\n&1&\n##### 初六：有孚，比之无咎。有孚盈缶，終來有它，吉。\n\n##### 象曰：比之初六，有它吉也。\n\n此為比之始。孚為中信，故相比之道，以誠信為本，表裡不一致，人誰近之。誠信充實於內，如於缶中之滿，且外不加修飾（它，外也〕，至誠以待之，則無不信。\n\n此即比之道在乎始也。始即能中實誠信，終吉，始無誠信，終凶。\n/1&\n\n&2&\n##### 六二：比之自内，貞吉。\n\n##### 象曰：比之自内，不自失也。\n\n自內言主之在己也。得正道，而與君道相合，此吉也。即以中正之道，合於上位之所求，乃曰自內。今人汲汲以求比者，非君子自重之道，乃自失之道也。\n\n堅守己中正之道，以待上求，乃不自失也。\n此易之戒。故士人修己，方求上進之道。降志辱身此絶非自重之道。吾人救天下之心，並非不急切，乃因須待禮遇之至方出也。\n/2&\n\n&3&\n##### 六三：比之匪人。\n\n##### 象曰：比之匪人，不亦傷乎。\n\n相親比之人，如為不正當之人，即為匪人，招凶也。\n\n相親於匪人，必將得悔咎，傷之大矣，君子須深戒所親比之人。\n/3&\n\n&4&\n##### 六四：外比之，貞吉。\n\n##### 象曰：外比於賢，以從上也。\n\n六四之位，為近君之位。居此位之人，以柔性坤德向君主親比，且堅心順從，吉也。\n\n六四之位從於五君之位，為外比。因五位剛明之賢為中正，故附從之，此從上之道，絶不可盲從。\n/4&\n\n&5&\n##### 九五：顯比，王用三驅，失前禽，邑人不誡，吉。\n人君親比天下之道，须誠意以待物，恕已以及人，發政施仁，民之所好好之，民之所惡惡之，為民圖利，使天下蒙其澤，此盡善也。則天下亦盡親於上也。如表彰己之小功，展示自己的權力，違反道德人心，強力施為，致人心不信，社會浮華，人偷敗亡，如此而求天下親比是不可能的。就好比君王出獵，只圍三面開一面，禽獸前去者，免矣，此曰失前禽，只取來者，此王道也。邑者，居邑，誡，期約也。此意臣之效於君，竭盡忠誠，用盡才能，以彰顯親君之道，此為正道。至於用之與否，決定在君，萬不可阿諛奉承，妄求君之親比也。朋友亦然，須修身誠意待人，至於是否願意與己相親，在人而己，千萬不可巧言令色，曲從苟合，以求人之相比。『此顯比之道』。\n\n##### 象曰：顯比之吉，位正中也。舍逆取順，失前禽也。邑人不誡，上使中也。\n故顯比之所以吉，以其所在之位，得適中之法也。且比之道，须舍逆取順，孟子收徒之道：往者不追，來者不拒也。三面圍網，所失唯前禽，即言此來者撫之，去者不追之理。\n/5&\n\n&6&\n##### 上六：比之无首，凶。\n\n##### 象曰：比之无首，无所終也。\n\n上六乃比之終極處。凡比之首，其始善，終亦必善矣。多數人皆有其始，而無其終，但從未有人沒有開始，而有終善也。故此言，比之無首（首，始也〕，至終必凶矣。今天下之人，始親和比之時不以正道，至終必有隔閡，此類人居多數。\n\n此即始不以道，則至終必也凶矣。是故交友之道，你來我往，你不來，我何往。如我往，必有求，須以正，否則終將隔隙，互相仇視也。\n/6&"},"111011":{"text.tab1":"此卦韓信擊取散關不破，卜得之後，再撃之果破也。\n\n#### 圖\n兩重山，一人在山頂，舟横岸上，望竿在草中，羊馬過河。\n\n**匣藏寶劍之課**\n\n**密雲不雨之象**\n\n#### 雜\n\n**雜卦曰：小畜寡也，履不處也。**\n\n#### 序\n\n**序卦曰：比必有所畜，故受之以小畜。**\n\n比乃親和，親和之後必有所畜，因物相比親則附於一處，為畜，此畜者，聚之來源也。同相親和之人，其志必同畜。畜亦止也，止然後有聚。此體本乾為天，乃在上之體，今居風之下，示意吾人如要聚止剛健之人，唯有巽順為大，故世間再剛健之事與人，必為巽順所止也。本卦一陰居第四位，為五陽所包，此得位乃因柔巽之道也。卦象『外柔內剛』，乃能以小畜大。\n\n#### 解\n• 一、兩重山：知有險阻於前，不妄動之象。亦為出字象。\n• 二、一人山頂：孤立獨行象。已至顛峰，將走下坡之意。\n• 三、舟横岸上：準備出發，水未至而不行也。\n• 四、望竿在草裡：等待訊息象。草頭姓人為貴人。望，亡也。\n• 五、上有羊馬：馬引羊過河，馬為貴人，肖馬人，姓馬人也，馬亦為午時。\n<u>全卦：一人在頂顛，但有疑，前有二山所阻，只有等待消息，午年或午月、午日、午時或馬人引羊至，不由水路而來也。</u>","text.tab2":"此卦局，著重於事業，不重於婚姻，凡家有女兒皆易成此局，卦局之判讀，請參閱錄影教學帶，此處不言。\n• 一、女代父職，且能力強過男人，獨立自主，不依賴他人。\n• 二、事業企圖心旺盛，早年為老闆，事業有成。\n• 三、婚事方面，須與命同參，如同時生人為二十八歲婚，而此陽宅局之人會提前二年結婚。如同時生人婚姻不成主有婚必破，此局之人必終身不嫁，全心在事業上發展，成為一女強人。\n此局大利肖羊、馬之人，但即令有婚，夫亦無力助之，全靠一己之力獨撐大局。","text.tab3":"&0&\n**小畜，亨。密雲不雨，自我西郊。**\n此言雲之畜聚雖密，卻不能成雨，猶人雖聚，卻不能和之義。\n/0&\n\n#### 彖\n\n**彖曰：小畜，柔得位而上下應之，曰小畜。**\n小畜之卦，因第四爻陰，居近君主之位，以巽之柔順本性，使上下之陽剛相互溝通，但只能維繫，卻不能強固，故曰小畜。\n\n健而巽，剛中而志行，乃亨。\n以卦象而言，內剛健而外能柔順，雖為小畜，但能亨也。\n\n密雲不雨，尚往也。自我西郊，施未行也。\n此言密雲不能成雨，猶小畜無法成大也，其因下陽往上，上陽往下，二氣不和。\n\n#### 象\n\n**象曰：風行天上，小畜，君子以懿文德。**\n\n以乾之剛健，風仍能在上而行，故剛健之性，唯柔順能畜止之，君子以小則文章才藝，大則道德經綸之聖才，以此二道為所畜之才義。\n\n&1&\n##### 初九：復自道，何其咎，吉。\n\n##### 象曰：復自道，其義吉也。\n\n初入之地為初爻，以其剛健之性，又得上位之同性，進必上，何來災也。故初之陽剛，乃因上位之陽剛性同，故無災也。\n\n初爻與第四爻本為對應之位，故在畜時，陰在四，陽在初，陰陽相應，故吉。\n/1&\n\n&2&\n##### 九二：牽復，吉。\n\n##### 象曰：牽復在中，亦不自失也。\n\n九二居將位，因與第五爻陽爻相對應，同為剛健，雖中有四爻，但因同為陽剛，自古『同患相憂』〔同慾相憎〕，吉之道，此時為將時。\n\n初爻為陽剛，復二爻亦陽剛，其勢乃強，但因此時乃居中位，將位，故即強亦不會過剛，過剛乃失，此天道。故吾人須知居中而陽剛之美，因理正，故能強剛，君子持之以理，雖剛亦不為過矣。\n/2&\n\n&3&\n##### 九三：輿説輻，夫妻反目。(説即脱)\n\n##### 象曰：夫妻反目，不能正室也。\n\n九三為下卦之上爻，最親密於四爻陰位，故乃陰陽之情相處也。猶如夫妻。陰本受制於陽，今居四位居陽之上，即反制陽，如夫妻之反目，故如車輿脱去輪軸，不能行也。妻為夫所惑，反制於夫，乃因夫不正道。未有夫不失道，而妻能制之也。\n\n因陽剛位之夫，過剛而失自處之道，不能顧家室，以致夫妻反目。故為夫之道，須正室其家，方為正道。\n/3&\n\n&4&\n##### 六四：有孚，血去惕出，无咎。\n\n##### 象曰：有孚惕出，上合志也。\n\n六四乃處近君之位，其能畜君，使五位君之威嚴能因之而止其欲，皆因六四有孚信(孚，乃內有誠信也〕而受其感也。\n\n因四位有誠信且外柔，使五之君位信任之，乃合同志。五因四位之人能與之合，眾陽從之，故惕出則血去，不見兵禍矣。\n/4&\n\n&5&\n##### 九五：有孚攣如，富以其鄰。\n\n##### 象曰：有孚攣如，不獨富也。\n\n小畜之時，乃眾陽皆為其中一陰所畜之時。猶如一國之君，與臣下皆剛而不容（密雲不雨〕，但近君側之人，適得柔順之人，而此人為上下溝通之管道，此時乃即小畜之時也。\n九五為君位，如以中正居至尊之位，又內有誠信，則所有皆附應之。就好像富人出其財力與鄰共享之也。從此爻則知當君子為小人所困，正人為艰邪所逼，此時如無上下正陽之互援，則獨力難助於此時，須有互助方可去小人也。\n\n是故君子處之艱危，唯其至誠，能得眾力之助，則平安矣。（攣如即牽連使相從之。）\n/5&\n\n&6&\n##### 上九：既雨既處，尚德載，婦貞厲。\n月幾望，君子征凶。\n\n##### 象曰：既雨既處，德積載也；君子征凶，有所疑也。\n\n上九為此卦之終極，乃處畜之終。和而能止乃畜之道，陰柔之能畜剛，由累積而成，非朝夕可得，此戒之在平時，如專任以柔制剛，不知止，如婦之堅守此道則乃凶矣，天下無婦制其夫，臣制其君，尚能安穩者乎？月滿之時為月望，與日相敵狀。若君子待婦將成敵時，動之必凶，不須戒也，故须戒之於月未滿時。\n\n此小畜之道積滿而成，其象為陰將盛樣，君子動則有凶也。小人抗君子，必有害於君子，制陰極盛之道，則為君子有疑而知警惕，不妄動，求其所以制君子之因，則不至凶也。\n/6&"},"110111":{"text.tab1":"此卦子路出行，卜得之，遇虎拔其尾也。\n\n#### 圖\n笠子下一女，文書破，手中有傘，軍旗官人邊坐，堠上有千里字，地上兩點足印。\n\n#### 雜\n\n**雜卦曰：小畜寡也，履不處也。**\n\n#### 序\n\n**序卦曰：物畜然後有禮，故受之以履。**\n\n如履虎尾之課 安中防危之象天地間萬物由畜道而止之後，有禮生焉，履者，禮也，故畜之後為履。所有物之聚大小不同，高下不等，有美惡之分，是故物聚後必有禮。人到何處，必有禮也。卦體天在上，澤在下，上下區分，尊卑立見，此理所當然也。此以柔藉剛，謙卑而順，説禮之道也。澤有卑順之意，卦象『外健內卑』，禮之本也。\n\n#### 解\n• 一、女人在笠下：妾也。\n• 二、千里堠：遠離外出封侯象。\n• 三、文書破在地：憑證承諾無效象。\n• 四、傘下：有庇蔭也。\n• 五、軍旗下官人坐：主有官司、訴訟、牢獄之災象。\n• 六、二點在地：踐踏之足印也，示人處危之時，有禮之道，乃能行危而無殃也","text.tab2":"女人無履，唯男人有之，此局可見男女之本性不同，女人外似柔弱但一遇進退兩難之時，卻往往比男人果決，男人外似剛強，但遇險事卻往往躑躅不前，成履卦。\n• 一、事業上常有欲進不得，退之又凶，居進退兩難之局，其事勢如此，而其性亦如此，其解常靠女人決定之。\n• 二、官運不通，停滯不前。\n• 三、商機不利，運氣不佳，取捨之間，因時機已誤，喪失良好機會，徒於事懊惱而已，於事無補。\n• 四、婚事方面，妻能力過於己，故有在外娶妾之行為，以求恢復男人之自信心、自尊心，故於婚姻主凶。同時生人如命中婚姻不散則感情破裂，終而同床異夢，但如命中，主婚姻破裂，再加運上此局，則必主破散無救。此同時生人之不同處，流年不同之因也。","text.tab3":"&0&\n**履虎尾，不咥人，亨。**\n有禮之道即入險中，如踐虎尾，不見其反食人，乃因有禮也，所以亨也。故常言伸手不打笑臉人，同此。\n/0&\n\n#### 彖\n\n**彖曰：履，柔履剛也。説而應乎乾，是以履虎尾，不咥人，亨。**\n兌為澤，為悦，兌以柔順之藉乾剛，與乾剛相乎應，又有禮於下，故踐虎尾而不相害也。\n\n剛中正，履帝位而不疚，光明也。\n九五以陽剛又居君位，又得履道之善，此不病之因，乃得光明也。\n\n#### 象\n\n**象曰：上天下澤，履。君子以辯上下，定民志。**\n天在上，澤在下，尊卑有分，此天下之正理也。人之禮常如是，有禮乃行也。君子觀履象，以辨上下之區分，來立民志，民因上下區分明顯而志定，自此乃可言治。立法複雜，民無所從，治世將不再。是故人各安其位，此得其分內也，如佔位又不進德，除之，由君子進任，士人進修學識，到一定程度而君子求之。士農工商各行業之人，因所享有限，而能有定志，則天下一\n\n心也。今人自下至公卿，日所志為尊榮，農工商人，日思於富侈，億兆之心交相為利，天下皆如此，心如何一致？要它不亂也難矣！皆因上下無定其志也。君子觀履，分區上下，使各當其位，用此以定民心之向也。\n\n&1&\n##### 初九：素履往，无咎。\n\n##### 象曰：素履之往，獨行願也。\n\n初處於下，陽剛之才可以進，但外則表現其卑下之位的素養，無咎。\n\n安於有禮之往，因非為利也，乃各有其志也。如人有行道之心，又有名利之心，交戰於中，豈能安履。\n/1&\n\n&2&\n##### 九二：履道坦坦，幽人貞吉。\n\n##### 象曰：幽人貞吉，中不自亂也。\n\n二為陰位，陽居，即意其待人之禮坦蕩蕩，平易之道也。因為陽進，故須有防人嗤之禮數之誹，是以安幽清靜之心情處此時，則吉。\n\n履之道(禮之道)在於安靜，其因正，則所履安也，心中躁動，則不能安於禮道，此即有禮於人，必以心中安靜，如以利欲交爭於心中，必自亂。\n/2&\n\n&3&\n##### 六三：眇能視，跛能履，履虎尾，咥人凶，武人爲于大君。\n\n##### 象曰：眇能視，不足以明也，跛能履，不足以與行也。\n\n三為陽位，柔居之，乃志欲剛而體本柔，不能堅心為履道。就如盲人之視而不見，跛人行路而不遠，意乃才能不足，又處時之不順遂，則禮道非正，乃履於危地，因不善履道，入危地召凶，禍患立至，故咥人凶，就如武暴之人卻居人上，又任意為之，不知禮，乃凶之道。\n\n陰柔乃才不足之人，視不明，行又不遠，今又居剛之上，災難來矣。\n\n咥人之凶，位不當也，武人爲于大君，志剛也。\n此凶之致，乃因才不足，以武人為喻，其居陽剛之位，但才不足，又強出之，則所履不由本道，屬於志剛又妄動。\n/3&\n\n&4&\n##### 九四：履虎尾，愬愬終吉。\n\n##### 象曰：愬愬，終吉，志行也。\n\n在近君之側，
