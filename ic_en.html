indicates how, in the case which it supposes, with firmness and correctness, and (a leader of) age and experience, there will be good fortune and no error.**\n**Great Symbol: (The trigram representing) the earth and in the midst of it that representing water, form Sze. The superior man, in accordance with this, nourishes and educates the people, and collects (from among them) the multitudes (of the hosts).**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): (The name) Sze describes the multitude (of the host). The ‘firmness and correctness’ (which the hexagram indicates) refer to (moral) correctness (of aim). When (the mover) is able to use the multitude with such correctness, he may attain to the royal sway. - 2. There is (the symbol of) strength in the centre (of the trigram below), and it is responded to (by its proper correlate above). The action gives rise to perils, but is in accordance (with the best sentiments of men). (Its mover) may by such action distress all the country, but the people will follow him ;— there will be good fortune, and what error should there be?\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows the host going forth according to the rules (for such a movement). If these be not good, there will be evil.\n\n##### Symbol: ‘The host goes forth according to the rules (for) such a movement :’—if those rules be not observed, there will be evil.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows (the leader) in the midst of the host. There will be good fortune and no error. The king has thrice conveyed to him the orders (of his favour).\n\n##### Symbol: ‘The host with the possibility of its having many idle leaders:’—great will be its want of SUCCESS.\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows how the host may, possibly, have many inefficient leaders. There will be evil.\n\n##### Symbol: ‘The host is in retreat; but there is no error:’ —there has been no failure in the regular course.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows the host in retreat. There is no error.\n\n##### Symbol: ‘The oldest son leads the host :’—its movements are directed by him in accordance with his position in the centre. ‘Younger men idly occupy their positions:’—the employment of such men is improper.\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows birds in the fields, which it will be advantageous to seize (and destroy). In that case there will be no error. If the oldest son leads the host, and younger men (idly occupy offices assigned to them), however firm and correct he may be, there will be evil.\n\n##### Symbol: ‘The great ruler delivers his charges :’— thereby he rightly apportions merit. ‘Small men should not be employed:’—they are sure to throw the states into confusion.’\n\n/5&\n\n&6&\n##### Top Line, Divided: The topmost line, divided, shows the great ruler delivering his charges, (appointing some) to be rulers of states, and others to undertake the headship of clans; but small men should not be employed (in such positions).\n\n##### Symbol: \"The great ruler delivers his charges:\"--thereby he rightly apportions merit. \"Small men should not be employed:\"--they are sure to throw the states into confusion.\n\n/6&"},"000010":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/008.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Bi shows us joy, and Shi the anxious mind.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Bi denotes being attached to. (Multitudes in) union must be subjected to some restraint. Hence Bi is followed by Xiao Xu.**","text.tab3":"&0&\n**Holding Together (Bi): P î indicates that (under the conditions which it supposes) there is good fortune. But let (the principal party intended in it) re-examine himself, (as if) by divination, whether his virtue be great, unintermitting, and firm. If it be so, there will be no error. Those who have not rest will then come to him; and with those who are (too) late in coming it will be ill.**\n**Great Symbol: (The trigram representing) the earth, and over it (that representing) water, form Pi. The ancient kings, in accordance with this, established the various states and maintained an affectionate relation to their princes.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): ‘Pi indicates that there is good fortune :'—(the name) Pi denotes help; (and we see in the figure) inferiors docilely following (their superior). editors of the imperial Y7 allow this, and on the present passage discard the doctrine entirely, referring to the language of the Thwan on hexagrams 11 and 12 as fatal to it. See the notes there, and the Introduction, pp. 11-16. ‘A strong line has come’ is to be taken as equivalent simply to ‘a strong line is there.’ What ‘the great man sets a value on being the due mean and the correct place,’ his decision in any matter of contention is sure to be right.\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows its subject seeking by his sincerity to win the attachment of his object. There will be no error. Let (the breast) be full of sincerity as an earthenware vessel is of its contents, and it will in the end bring other advantages.\n\n##### Symbol: From ‘the seeking union with its object’ shown in the first line, divided, there will be other advantages.\n\n/1&\n\n&2&\n##### Line 2, Divided: In the second line, divided, we see the movement towards union and attachment proceeding from the inward (mind). With firm correctness there will be good fortune.\n\n##### Symbol: ‘The movement towards union and attachment proceeds from the inward (mind) :’—(the party concerned) does not fail in what is proper to himself.\n\n/2&\n\n&3&\n##### Line 3, Divided: In the third line, divided, we see its subject seeking for union with such as ought not to be associated with.\n\n##### Symbol: ‘Union is sought with such as ought not to be associated with:’—but will not injury be the result ?\n\n/3&\n\n&4&\n##### Line 4, Divided: In the fourth line, divided, we see its subject seeking for union with the one beyond himself. With firm correctness there will be good fortune.\n\n##### Symbol: ‘Union is sought (by the party intended here) with one beyond himself, and (in this case) with a worthy object:’—he is following (the ruler) above him.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, affords the most illustrious instance of seeking union and attachment. (We seem to see in it) the king urging his pursuit of the game (only) in three directions, and allowing the escape of all the animals before him, while the people of his towns do not warn one another (to prevent it). There will be good fortune.\n\n##### Symbol: ‘The good fortune belonging to the most illustrious instance of seeking union and attachment’ appears in the correct and central position (of the fifth line, undivided).\n\n/5&\n\n&6&\n##### Top Line, Divided: In the topmost line, divided, we see one seeking union and attachment without having taken the first step (to such an end). There will be evil.\n\n##### Symbol: ‘Heseeks union and attachment without taking the first (step to such an end) :’—there is no possibility of a (good) issue.\n\n/6&"},"111011":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/009.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Xiao Xu with few 'gainst many foes contends; movement in Li, unresting, never ends.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): When things are subjected to restraint, there come to be rites of ceremony; and hence Xiao Xu is followed by Li.**","text.tab3":"&0&\n**Small Taming Power (Xiao Chu): Hsiâo Kh û indicates that (under its conditions) there will be progress and success. (We see) dense clouds, but no rain coming from our borders in the west.**\n**Great Symbol: (The trigram representing) the sky, and that representing wind moving above it, form Hsiao Kh. The superior man, in accordance with this, adorns the outward manifestation of his virtue.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Hsiao AA the weak line occupies its (proper) position, and (the lines) above and below respond to it. Hence comes the name of Hsido Kh (Small Restraint). 2. (It presents the symbols of) strength and flexibility. Strong lines are in the central places, and the will (of their subjects) will have free course. Thus it indicates that there will be progress and success. 3. ‘Dense clouds but no rain’ indicate the movement (of the strong lines) still going forward. The\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows its subject returning and pursuing his own course. What mistake should he fall into? There will be good fortune.\n\n##### Symbol: ‘He returns and pursues his own path :’—it is right that there should be good fortune.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows its subject, by the attraction (of the former line), returning (to the proper course). There will be good fortune.\n\n##### Symbol: ‘ By the attraction (of the subject of the former line) he returns (to its own course), and is in the central place :—neither will he err in what is due from him.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, suggests the idea of a carriage, the strap beneath which has been removed, or of a husband and wife looking on each other with averted eyes.\n\n##### Symbol: ‘Husband and wife look on each other with averted eyes :’—(the subject of line three is like a\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows its subject possessed of sincerity. The danger of bloodshed is thereby averted, and his (ground for) apprehension dismissed. There will be no mistake.\n\n##### Symbol: ‘He is possessed of sincerity ; his (ground for) apprehension is dismissed :—(the subjects of the lines) above agree in aim with him.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows its subject possessed of sincerity, and drawing others to unite with him. Rich in resources, he employs his neighbours (in the same cause with himself).\n\n##### Symbol: ‘ He is possessed of sincerity, and draws others to unite with him :’—he does not use only his own rich resources.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The topmost line, undivided, shows how the rain has fallen, and the (onward progress) is stayed;—(so) must we value the full accumulation of the virtue (represented by the upper trigram). But a wife (exercising restraint), however firm and correct she may be, is in a position of peril, (and like) the moon approaching to the full. If the superior man prosecute his measures (in such circumstances), there will be evil.\n\n##### Symbol: ‘ The rain has fallen and (the onward progress) is stayed:’—the power (denoted in the figure) has accumulated to the full. ‘If the superior man prosecute his measures, there will be evil :’—he will find himself obstructed.\n\n/6&"},"110111":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/010.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Xiao Xu with few 'gainst many foes contends; movement in Li, unresting, never ends.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): The treading (on what is proper) leads to Tai, which issues in a state of freedom and repose; and hence Li is followed by Tai.**","text.tab3":"&0&\n**Treading (Lü): ( L î suggests the idea of) one treading on the tail of a tiger, which does not bite him. There will be progress and success.**\n**Great Symbol: (The trigram representing) the sky above, and below it (that representing the waters of) a marsh, form Li. The superior man, in accordance with this, discriminates between high and low, and gives settlement to the aims of the people.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Lt we have (the symbol of) weakness treading on (that of) strength. 2. (The lower trigram) indicates pleasure and satisfaction, and responds to (the upper) indicating strength. Hence (it is said), ‘He treads on the tail of a tiger, which does not bite him; there will be progress and success.’ | 3. (The fifth line is) strong, in the centre, and in\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows its subject treading his accustomed path. If he go forward, there will be no error.\n\n##### Symbol: ‘He treads his accustomed path and goes forward :’—singly and exclusively he carries out his (long-cherished) wishes.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows its subject treading the path that is level and easy;—a quiet and solitary man, to whom, if he be firm and correct, there will be good fortune.\n\n##### Symbol: ‘A quiet and solitary man, to whom, being firm and correct, there will be good fortune :'—holding the due mean, he will not allow himself to be thrown into disorder.\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows a one-eyed man (who thinks he) can see; a lame man (who thinks he) can walk well; one who treads on the tail of a tiger and is bitten. (All this indicates) ill fortune. We have a (mere) bravo acting the part of a great ruler.\n\n##### Symbol: ‘A one-eyed man (who thinks that he) can see: —he is not fit to see clearly. ‘A lame man (who thinks that he can) tread well :’—one cannot walk along with him. ‘The ill fortune of being bitten’ arises from the place not being the proper one for him. ‘A (mere) bravo acting the part of a great ruler:’—this is owing to his aims being (too) violent.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows its subject treading on the tail of a tiger. He becomes full of apprehensive caution, and in the end there will be good fortune.\n\n##### Symbol: ‘ He becomes full of apprehensive caution, and in the end there will be good fortune :’—his aim takes effect.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows the resolute tread of its subject. Though he be firm and correct, there will be peril.\n\n##### Symbol: ‘He treads resolutely; and though he be firm and correct, there is peril :’—this is due to his being in the position that is correct and appropriate to him.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, tells us to look at (the whole course) that is trodden, and examine the presage which that gives. If it be complete and without failure, there will be great good fortune.\n\n##### Symbol: ‘There will be great good fortune,’ and that in the occupancy of the topmost line :—this is great matter for congratulation.\n\n/6&"},"111000":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/011.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): While Pi and Tai their different scopes prefer.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Tai denotes things having free course. They cannot have that for ever; and hence it is followed by Pi (denoting being shut up and restricted).**","text.tab3":"&0&\n**Peace (Tai): In Thâ i (we see) the little gone and the great come. (It indicates that) there will be good fortune, with progress and success.**\n**Great Symbol: (The trigrams for) heaven and earth in communication together form Thai. The (sage) sovereign, in harmony with this, fashions and completes (his regulations) after the courses of heaven and earth, and assists the application of the adaptations furnished by them,—in order to benefit the people.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): ‘The little come and the great gone in ThAi, and its indication that there will be good fortune with progress and success’ show to us heaven and earth in communication with each other, and all things in consequence having free course, and (also) the high and the low, (superiors and inferiors), in communication with one another, and possessed by the same aim. The inner (trigram) is made up of the strong and undivided lines, and the outer of the weak and divided; the inner is (the symbol of) strength, and the outer of docility; the inner (represents) the superior man, and the outer the smal] man. (Thus) the way of\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, suggests the idea of grass pulled up, and bringing with it other stalks with whose roots it is connected. Advance (on the part of its subject) will be fortunate.\n\n##### Symbol: ‘The good fortune of advance, (as suggested by the emblem of) the grass pulled up,’ arises from the will (of the party intended) being set on what is external to himself.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows one who can bear with the uncultivated, will cross the Ho without a boat, does not forget the distant, and has no (selfish) friendships. Thus does he prove himself acting in accordance with the course of the due Mean.\n\n##### Symbol: ‘He bears with the uncultivated, and proves himself acting in accordance with the due mean :'— for (his intelligence is) bright and (his capacity is) great. |\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows that, while there is no state of peace that is not liable to be disturbed, and no departure (of evil men) so that they shall not return, yet when one is firm and correct, as he realises the distresses that may arise, he will commit no error. There is no occasion for sadness at the certainty (of such recurring changes); and in this mood the happiness (of the present) may be (long) enjoyed.\n\n##### Symbol: ‘There is no going away so that there shall not be a return’ refers to this as the point where the interaction of heaven and earth takes place.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows its subject fluttering (down);—not relying on his own rich resources, but calling in his neighbours. (They all come) not as having received warning, but in the sincerity (of their hearts).\n\n##### Symbol: ‘He comes fluttering (down), not relying on\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, reminds us of (king) Tî-yî 's (rule about the) marriage of his younger sister. By such a course there is happiness and there will be great good fortune.\n\n##### Symbol: ‘ By such a course there is happiness, and there will be great good fortune :'—(the subject of the line) employs the virtue proper to his central position to carry his wishes into effect.\n\n/5&\n\n&6&\n##### Top Line, Divided: The sixth line, divided, shows us the city wall returned into the moat. It is not the time to use the army. (The subject of the line) may, indeed, announce his orders to the people of his own city; but however correct and firm he may be, he will have cause for regret.\n\n##### Symbol: ‘The city wall returned back into the moat’ shows how the (governmental) orders have (long) been in disorder.\n\n/6&"},"000111":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/012.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): While Pi and Tai their different scopes prefer.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Things cannot for ever be shut up; and hence Pi is followed by Tong Ren.**","text.tab3":"&0&\n**Standstill (Pi): In Ph î there is the want of good understanding between the (different classes of) men, and its indication is unfavourable to the firm and correct course of the superior man. We see in it the great gone and the little come.**\n**Great Symbol: (The trigrams of) heaven and earth, not in intercommunication, form Phi. The superior man, in accordance with this, restrains (the manifestation) of) his virtue, and avoids the calamities (that threaten him). There is no opportunity of conferring on him the glory of emolument.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): ‘The want of good understanding between the (different classes of) men in Phi, and its indication as unfavourable to the firm and correct course of the superior man; with the intimation that the great are gone and the little come:’—all this springs from the fact that in it heaven and earth are not in communication with each other, and all things in consequence do not have free course ; and that the high and the low (superiors and inferiors) are not in communication with one another, and there are no (well-regulated) states under the sky. The inner (trigram) is made up of the weak and divided lines, and the outer of the strong and undivided: the inner is (the symbol of) weakness, and the outer of strength; the inner (represents) the small man, and the outer the superior man. Thus the way of the small man appears increasing, and that of the superior man decreasing.\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, suggests the idea of grass pulled up, and bringing with it other stalks with whose roots it is connected. With firm correctness (on the part of its subject), there will be good fortune and progress.\n\n##### Symbol: ‘The good fortune through firm goodness, (suggested by) the pulling up ef the grass,’ arises from the will (of the parties intended) being bent on (serving) the ruler.\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows its subject patient and obedient. To the small man (comporting himself so) there will be good fortune. If the great man (comport himself) as the distress and obstruction require, he will have success.\n\n##### Symbol: ‘The great man, comporting himself as the distress and obstruction require, will have success :’-— he daes not allow himself to be disordered by the herd (of small men).\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows its subject ashamed of the purpose folded (in his breast).\n\n##### Symbol: That ‘his shame is folded in his breast’ is owing to the inappropriateness of his position.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows its subject acting in accordance with the ordination (of Heaven), and committing no error. His companions will come and share in his happiness.\n\n##### Symbol: ‘ He acts in accordance with the ordination (of Heaven), and commits no error:’—the purpose of his mind can be carried into effect.\n\n/4&\n\n&5&\n##### Line 5, Undivided: In the fifth line, undivided, we see him who brings the distress and obstruction to a close,—the great man and fortunate. (But let him say), 'We may perish! We may perish!' (so shall the state of things become firm, as if) bound to a clump of bushy mulberry trees.\n\n##### Symbol: ‘The good fortune of the great man’ arises from the correctness of his position.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, shows the overthrow (and removal of) the condition of distress and obstruction. Before this there was that condition. Hereafter there will be joy.\n\n##### Symbol: ‘The distress and obstruction having reached its end, it is overthrown and removed :’—how could it be prolonged ?\n\n/6&"},"101111":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/013.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Da You adhering multitudes can show; Tong Ren reflects their warm affection's glow.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): To him who cultivates union with men, things must come to belong; and hence Tong Ren is followed by Da You.**","text.tab3":"&0&\n**Fellowship (Tong Ren): Thung Z ă n (or 'Union of men') appears here (as we find it) in the (remote districts of the) country, indicating progress and success. It will be advantageous to cross the great stream. It will be advantageous to maintain the firm correctness of the superior man.**\n**Great Symbol: (The trigrams for) heaven and fire form Thung Zan. The superior man, in accordance with this), distinguishes things according to their kinds and classes.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): rt. In Thung Z&n the weak (line) has the place (of influence), the central place, and responds to (the corresponding line in) Ahien (above) ; hence comes its name of Thung ZAn (or ‘Union of men’). 2. Thung Zan says :— 3. The language,‘Thung Zan appears here (as we find it) in (the remote districts of) the country, indicating progress and success, and that it will be advantageous to cross the great stream, is moulded by its containing the strength (symbolled) in X4Zien. (Then) we have (the trigram indicating) elegance and intelligence, supported by (that indicating) strength; with the line in the central, and its correct, position, and responding (to the corresponding line above) :—(all representing) the correct course of the superior man. It is only the superior\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, (shows the representative of) the union of men just issuing from his gate. There will be no error.\n\n##### Symbol: ‘(The representative of) the union of men is just issuing from his gate :'—who will blame him?\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, (shows the representative of) the union of men in relation with his kindred. There will be occasion for regret.\n\n##### Symbol: ‘(The representative of) the union of men appears in relation with his kindred :’—that is the path to regret.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, (shows its subject) with his arms hidden in the thick grass, and at the top of a high mound. (But) for three years he makes no demonstration.\n\n##### Symbol: ‘He hides his arms in the thick grass :’— because of the strength of his opponent. ‘ For three years he makes no demonstration :'—how can he do anything ?\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, (shows its subject) mounted on the city wall; but he does not proceed to make the attack (he contemplates). There will be good fortune.\n\n##### Symbol: ‘He is mounted on his city-wall ;’ but yielding to the right, ‘he does not proceed to make the attack (he contemplated).’ (Where it is said), ‘There will be good fortune,’ (that shows how) he feels the strait he is in, and returns to the rule of law.\n\n/4&\n\n&5&\n##### Line 5, Undivided: In the fifth line, undivided, (the representative of) the union of men first wails and cries out, and then laughs. His great host conquers, and he (and the subject of the second line) meet together.\n\n##### Symbol: The first action of (the representative of) the union of men (here described) arises from his central position and straightforward character. ‘ The meeting secured by his great host’ intimates that the opponents of it have been overcome.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The topmost line, undivided, (shows the representative of) the union of men in the suburbs. There will be no occasion for repentance.\n\n##### Symbol: ‘(The representative of) the union of men appears in the suburbs:’—his object has not yet been attained.\n\n/6&"},"111101":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/014.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Da You adhering multitudes can show; Tong Ren reflects their warm affection's glow.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Those who have what is great should not allow in themselves the feeling of being full; and hence Da You is followed by Qian.**","text.tab3":"&0&\n**Great Possession (Da You): Tâ Y û indicates that, (under the circumstances which it implies), there will be great progress and success.**\n**Great Symbol: (The trigram for) heaven and (that of) fire above: it form Ta YQ. The superior man, in accordance with this, represses what is evil and gives distinction to what is good, in sympathy with the excellent Heaven-conferred (nature).**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In T& YQ the weak (line) has the place of honour, is grandly central, and (the strong lines) above and below respond to it. Hence comes its name of Ta YQ (Having what is Great). but how can earth (symbolised by Khw4n) take the place of heaven (symbolised by Khien)? As in nature it is heaven that originates and not earth, so in a state the upper classes must take the initiative, and not the lower.\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: In the first line, undivided, there is no approach to what is injurious, and there is no error. Let there be a realisation of the difficulty (and danger of the position), and there will be no error (to the end).\n\n##### Symbol: This first line, undivided, of Ta YQ shows no approach to what is injurious.\n\n/1&\n\n&2&\n##### Line 2, Undivided: In the second line, undivided, we have a large waggon with its load. In whatever direction advance is made, there will be no error.\n\n##### Symbol: ‘A large waggon with its load’ refers to the (virtue) accumulated (in the subject of the line), so that he will suffer no loss (in the conduct of affairs).\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows us a feudal prince presenting his offerings to the Son of Heaven. A small man would be unequal (to such a duty).\n\n##### Symbol: ‘A feudal prince presents his offerings to the son of Heaven :’—a small man (in such a position) does (himself) harm.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows its subject keeping his great resources under restraint. There will be no error.\n\n##### Symbol: ‘Hekeeps his great resources under restraint :'-— his wisdom discriminates clearly (what he ought to do).\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows the sincerity of its subject reciprocated by that of all the others (represented in the hexagram). Let him display a proper majesty, and there will be good fortune.\n\n##### Symbol: ‘ His sincerity is reciprocated byall the others :’— his sincerity serves to stir and call out what is in their minds. ‘The good fortune springing from a display of proper majesty’ shows how they might (otherwise) feel too easy, and make no preparation (to serve him).\n\n/5&\n\n&6&\n##### Top Line, Undivided: The topmost line, undivided, shows its subject with help accorded to him from Heaven. There will be good fortune, advantage in every respect.\n\n##### Symbol: ‘The good fortune attached to the topmost line of TA Y0’ arises from the help of Heaven.\n\n/6&"},"001000":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/015.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Qian itself, Yu others doth despise.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): When great possessions are associated with humility, there is sure to be pleasure and satisfaction; and hence Qian is followed by Yu.**","text.tab3":"&0&\n**Modesty (Qian(Modesty)): Kh ie n indicates progress and success. The superior man, (being humble as it implies), will have a (good) issue (to his undertakings).**\n**Great Symbol: (The trigram for) the earth and (that of) a mountain in the midst of it form Khien. The superior man, in accordance with this, diminishes what is excessive (in himself), and increases where there is any defect, bringing about an equality, according to the nature of the case, in his treatment (of himself and others).**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Ahien indicates progress and success. It is the way of heaven to send down its beneficial influences below, where they are _ brilliantly displayed. It is the way of earth, lying low, to send its influences upwards and (there) to act. 2. It is the way of heaven to diminish the full and augment the humble. It is the way of earth to overthrow the full and replenish the humble. Spiritual Beings inflict calamity on the full and bless the humble. It is the way of men to hate the full and love the humble. Humility in a position of honour makes that still more brilliant; and in a low position men will not (seek to) pass beyond it. Thus it is that ‘the superior man will have a good) issue (to his undertakings).’\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows us the superior man who adds humility to humility. (Even) the great stream may be crossed with this, and there will be good fortune.\n\n##### Symbol: ‘The superior man who adds humility to humility’ is one who nourishes his (virtue) in lowliness.\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows us humility that has made itself recognised. With firm correctness there will be good fortune.\n\n##### Symbol: ‘The good fortune consequent on being firm and correct, where the humility has made itself recognised,’ is owing to the possessor’s having (the virtue) in the core of his heart.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows the superior man of (acknowledged) merit. He will maintain his success to the end, and have good fortune.\n\n##### Symbol: ‘The superior man of (acknowledged) merit, and yet humble :'—the myriads of the people will submit to him.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows one, whose action would be in every way advantageous, stirring up (the more) his humility.\n\n##### Symbol: ‘One, whose action would be in every way advantageous, stirs up his humility the more :'— (but in doing so) he does not act contrary to the (proper) rule.\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows one who, without being rich, is able to employ his neighbours. He may advantageously use the force of arms. All his movements will be advantageous.\n\n##### Symbol: ‘He may advantageously use the force of arms : —correcting, that is, those who do not submit.\n\n/5&\n\n&6&\n##### Top Line, Divided: The sixth line, divided, shows us humility that has made itself recognised. The subject of it will with advantage put his hosts in motion; but (he will only) punish his own towns and state.\n\n##### Symbol: ‘His humility has made itself recognised :’— (but) all his aims have not yet been attained. ‘He may employ the force of arms, (but only) in correcting (his own) towns and state.’\n\n/6&"},"000100":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/016.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Qian itself, Yu others doth despise.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Where such complacency is awakened, (he who causes it) is sure to have followers (Sui).**","text.tab3":"&0&\n**Enthusiasm (Yu): Y ü indicates that, (in the state which it implies), feudal princes may be set up, and the hosts put in motion, with advantage.**\n**Great Symbol: (The trigrams for) the earth and thunder issuing from it with its crashing noise form Yi. The ancient kings, in accordance with this, composed their music and did honour to virtue, presenting it especially and most grandly to God,**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Yii we see the strong (line) responded to by all the others, and the will (of him whom it represents) being carried out; and (also) docile obedience employing movement (for its purposes). (From these things comes) Yii (the Condition of harmony and satisfaction). 2. In this condition we have decile obedience employing movement (for its purposes), and therefore it is so as between heaven and earth;—how much more will it be so (among men) in ‘the setting up of feudal princes and putting the hosts in motion!’ 3. Heaven and earth show that docile obedience in connexion with movement, and hence the sun and moon make no error (in time), and the four seasons do not deviate (from their order). The sages show such docile obedience in connexion with their movements, and hence their punishments and penalties are entirely just, and the people acknowledge it by their submission. Great indeed are the time and significance indicated in Yii!\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows its subject proclaiming his pleasure and satisfaction. There will be evil.\n\n##### Symbol: ‘The (subject of the) first line proclaims his pleasure and satisfaction :'—there will be evil; his wishes have been satisfied to overflowing.\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows one who is firm as a rock. (He sees a thing) without waiting till it has come to pass; with his firm correctness there will be good fortune.\n\n##### Symbol: ‘(He sees a thing) without waiting till it has come to pass; with his firm correctness there will be good fortune :’'—this is shown by the central and correct position (of the line).\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows one looking up (for favours), while he indulges the feeling of pleasure and satisfaction. If he would understand!—If he be late in doing so, there will indeed be occasion for repentance.\n\n##### Symbol: ‘He looks up (for favours), while he indulges the feeling of satisfaction; there will be occasion for repentance :’—this is intimated by the position not being the appropriate one.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows him from whom the harmony and satisfaction come. Great is the success which he obtains. Let him not allow suspicions to enter his mind, and thus friends will gather around him.\n\n##### Symbol: ‘From him the harmony and satisfaction come; great is the success which he obtains :’—his aims take effect on a grand scale.\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows one with a chronic complaint, but who lives on without dying.\n\n##### Symbol: ‘(The subject of) the fifth line has a chronic complaint :'—this is shown by his being mounted on the strong (line). ‘He still lives on without dying :'— he is in the central position, (and its memories of the past) have not yet perished.\n\n/5&\n\n&6&\n##### Top Line, Divided: The topmost line, divided, shows its subject with darkened mind devoted to the pleasure and satisfaction (of the time); but if he change his course even when (it may be considered as) completed, there will be no error.\n\n##### Symbol: ‘With darkened mind devoted to the harmony and satisfaction (of the time), as shown in the topmost (line) :—how can one in such a condition continue long ?\n\n/6&"},"100110":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/017.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Sui quits the old; Gu makes a new decree.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): They who follow another are sure to have services (to perform); and hence Sui is followed by Gu.**","text.tab3":"&0&\n**Following (Sui): Su i indicates that (under its conditions) there will be great progress and success. But it will be advantageous to be firm and correct. There will (then) be no error.**\n**Great Symbol: (The trigram for the waters of) a marsh and (that for) thunder (hidden) in the midst of it form Sui. The superior man in accordance with this, when it is getting towards dark, enters (his house) and rests.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Sui we see the strong (trigram) come and place itself under the weak; we see (in the two) the attributes of movement and pleasure :— this gives (the idea of) Sul. 2. ‘There will be great progress and success ; and through firm correctness no error :'—all under heaven will be found following at such a time. 3. Great indeed are the time and significance indicated in Sui.\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows us one changing the object of his pursuit; but if he be firm and correct, there will he good fortune. Going beyond (his own) gate to find associates, he will achieve merit.\n\n##### Symbol: ‘He is changing the object of his pursuit :’— but if he follow what is correct, there will be good fortune. ‘He goes beyond (his own) gate to find associates :’—he will not fail (in the method he pursues).\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows us one who cleaves to the little boy, and lets go the man of age and experience.\n\n##### Symbol: ‘He cleaves to the little boy :'-—he cannot be with the two at the same time.\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows us one who cleaves to the man of age and experience, and lets go the little boy. Such following will get what it seeks; but it will be advantageous to adhere to what is firm and correct.\n\n##### Symbol: ‘He cleaves to the man of age and experience: —by the decision of his will, he abandons (the youth) below.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows us one followed and obtaining (adherents). Though he be firm and correct, there will be evil. If he be sincere (however) in his course, and make that evident, into what error will he fall?\n\n##### Symbol: ‘He is followed and obtains adherents :’— according to the idea (of the hexagram), this is evil. ‘He is sincere in his course :'—showing his intelligence, and leading to achievement.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows us (the ruler) sincere in (fostering all) that is excellent. There will be good fortune.\n\n##### Symbol: ‘ He is sincere in fostering what is excellent :’'— his position is correct and in the centre.\n\n/5&\n\n&6&\n##### Top Line, Divided: The topmost line, divided, shows us (that sincerity) firmly held and clung to, yea, and bound fast. (We see) the king with it presenting his offerings on the western mountain.\n\n##### Symbol: ‘The sincerity is firmly held and clung to, as shown in the topmost line :'—(the idea of the hexagram) has reached its extreme development.\n\n/6&"},"011001":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/018.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Sui quits the old; Gu makes a new decree.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Gu means (the performance of) services. He who performs such services may afterwards become great; and hence Gu is followed by Lin.**","text.tab3":"&0&\n**Work on the Decayed (Gu): K û indicates great progress and success (to him who deals properly with the condition represented by it). There will be advantage in (efforts like that of) crossing the great stream. (He should weigh well, however, the events of) three days before the turning point, and those (to be done) three days after it.**\n**Great Symbol: (The trigram for) a mountain, and below it that for wind, form Kf. The superior man, in accordance with this, (addresses himself to) help the people and nourish his own virtue.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Kd we have the strong (trigram) above, and the weak one below; we have (below) pliancy, and (above) stopping:—these give the idea of Kf (a Troublous Condition of affairs verging to ruin), 2. ‘Kd indicates great progress and success :'— (through the course shown in it), all under heaven, there will be good order. ‘There will be advantage in crossing the great stream:—he who advances will encounter the business to be done. ‘(He should\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows (a son) dealing with the troubles caused by his father. If he be an (able) son, the father will escape the blame of having erred. The position is perilous, but there will be good fortune in the end.\n\n##### Symbol: ‘He deals with the troubles caused by his father:’—he feels that he has entered into the work of his father.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows (a son) dealing with the troubles caused by his mother. He should not (carry) his firm correctness (to the utmost).\n\n##### Symbol: ‘He deals with the troubles caused by his mother : —he holds to the course of the due mean.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows (a son) dealing with the troubles caused by his father. There may be some small occasion for repentance, but there will not be any great error.\n\n##### Symbol: ‘He deals with the troubles caused by his father :’—in the end there will be no error.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows (a son) viewing indulgently the troubles caused by his father. If he go forward, he will find cause to regret it.\n\n##### Symbol: ‘He views indulgently the troubles caused by his father :'—if he go forward, he will not succeed.\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows (a son) dealing with the troubles caused by his father. He obtains the praise of using (the fit instrument for his work).\n\n##### Symbol: ‘He deals with the troubles caused by his father, and obtains praise :'—he is responded to (by the subject of line two) with all his virtue.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, shows us one who does not serve either king or feudal lord, but in a lofty spirit prefers (to attend to) his own affairs.\n\n##### Symbol: ‘ He does not serve either king or feudal lord :'— but his aim may be a model (to others).\n\n/6&"},"110000":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/019.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Lin gives, Guan seeks.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Lin means great. What is great draws forth contemplation; and hence Lin is followed by Guan.**","text.tab3":"&0&\n**Approach (Lin): Li n (indicates that under the conditions supposed in it) there will be great progress and success, while it will be advantageous to be firmly correct. In the eighth month there will be evil.**\n**Great Symbol: (The trigram for) the waters of a marsh and that for the earth above it form Lin. The superior man, in accordance with this, has his purposes of instruction that are inexhaustible, and nourishes and supports the people without limit.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Lin (we see) the strong (lines) gradually increasing and advancing. 2. (The lower trigram is the symbol of) being pleased, and (the upper of) being compliant. The strong (line) is in the central position, and is properly responded to. 3. ‘There is great progress and success, along with firm correctness :’'—this is the way of Heaven. 4. ‘In the eighth month there will be evil :'—(the advancing power) will decay after no long time.\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows its subject advancing in company (with the subject of the second line). Through his firm correctness there will be good fortune.\n\n##### Symbol: ‘The good fortune through the firm correctness of (the subject of the first line) advancing in company (with the subject of the second)’ is due to his will being set on doing what is right.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows its subject advancing in company (with the subject of the first line). There will be good fortune; (advancing) will be in every way advantageous.\n\n##### Symbol: ‘The good fortune and every possible advantage attending the advance (of the subject of the second line), in company (with the subject of the first),’ arises from the fact that those (to whom the advance is made) are not yet obedient to the ordinances (of Heaven).\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows one well pleased (indeed) to advance, (but whose action) will be in no way advantageous. If he become anxious about it (however), there will be no error.\n\n##### Symbol: ‘ He (shows himself) well pleased to advance :’— his position is not that appropriate to him. ‘If he become anxious, however, about his action,’ his error will not be continued.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows one advancing in the highest mode. There will be no error.\n\n##### Symbol: ‘The freedom from error consequent on the\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows the advance of wisdom, such as befits the great ruler. There will be good fortune.\n\n##### Symbol: ‘What befits the great ruler’ means the pursuing the course of the due mean.\n\n/5&\n\n&6&\n##### Top Line, Divided: The sixth line, divided, shows the advance of honesty and generosity. There will be good fortune, and no error.\n\n##### Symbol: ‘ The good fortune consequent on the advance of honesty and generosity’ is due to the will (of the subject of the line) being set on the subjects of (the first two lines of) the inner (trigram).\n\n/6&"},"000011":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/020.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Lin gives, Guan seeks.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): He who attracts contemplation will then bring about the union of others with himself; and hence Guan is followed by Shi He.**","text.tab3":"&0&\n**Contemplation (Guan): Kwâ n shows (how he whom it represents should be like) the worshipper who has washed his hands, but not (yet) presented his offerings;—with sincerity and an appearance of dignity (commanding reverent regard).**\n**Great Symbol: (The trigram representing) the earth, and that for wind moving above it, form Kwan. The ancient kings, in accordance with this, examined the (different) regions (of the kingdom), to see the (ways of the) people, and set forth their instructions.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): The great Manifester occupies an upper place (in the figure), which consists of (the trigrams\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows the looking of a lad;—not blamable in men of inferior rank, but matter for regret in superior men.\n\n##### Symbol: ‘ The looking of a lad shown by the first line, divided, indicates the way of the inferior people. ‘ His feet are in the stocks, and he is deprived of his toes :'—there is no walking (to do evil).\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows one peeping out from a door. It would be advantageous if it were (merely) the firm correctness of a female.\n\n##### Symbol: ‘The firm correctness of a woman, in peeping ‘He bites through the soft flesh, and (goes on)\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows one looking at (the course of) his own life, to advance or recede (accordingly).\n\n##### Symbol: ‘He looks at (the course of) his own life, to advance or recede (accordingly) :'—He will not err in the path (to be pursued). ‘He meets with what is disagreeable and hurtful :\\—his position is not the proper one for him.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows one contemplating the glory of the kingdom. It will be advantageous for him, being such as he is, (to seek) to be a guest of the king.\n\n##### Symbol: ‘He contemplates the glory of the kingdom :’— (thence) arises the wish to be a guest (at court). ‘It will be advantageous to him to realise the difficulty of his task and be firm, in which case there will be good fortune :'—his light has not yet been sufficiently displayed.\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows its subject contemplating his own life(-course). A superior man, he will (thus) fall into no error.\n\n##### Symbol: ‘He contemplates his own life(-course) :’—he should (for this purpose) contemplate (the condition of) the people. ‘Let him be firm and correct, realising the peril (of his position), and there will be no error :’—he will possess every quality appropriate (to his position and task).\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, shows its subject contemplating his character to see if it be indeed that of a superior man. He will not fall into error.\n\n##### Symbol: ‘He contemplates his own character :’—he cannot even yet let his mind be at rest. ‘He wears the cangue and is deprived of his ears : —he hears, but will not understand.\n\n/6&"},"100101":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/021.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Shi He takes eating for its theme; Bi takes what is plain, from ornament quite free.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Shi He means union. But things should not be united in a reckless or irregular way; and hence Shi He is followed by Bi.**","text.tab3":"&0&\n**Biting Through (Shi He): Shih H o indicates successful progress (in the condition of things which it supposes). It will be advantageous to use legal constraints.**\n**Great Symbol: Khang-jze says that thunder and lightning are always found together, and hence their trigrams go together to give the idea of union intended in Shih Ho. The one trigram symbolising majesty and the other brightness or intelligence, the application of the hexagram here is easier and more natural than in many other cases.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): The existence of something between the jaws gives rise to the name Shih Ho (Union by means of biting through the intervening article). 2. The Union by means of biting through the intervening article indicates ‘the successful progress (denoted by the hexagram).’\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows one with his feet in the stocks and deprived of his toes. There will be no error.\n\n##### Symbol: ‘There is no walking :’—that is, the subject of the line will not dare to offend any more. ‘He can discard a carriage and walk on foot :’—-\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows one biting through the soft flesh, and (going on to) bite off the nose. There will be no error.\n\n##### Symbol: ‘“ Being mounted on the strong first line” means,’ says Khang-3ze, ‘ punishing a strong and vehement man, when severity is required, as is denoted by the central position of the line.’ ‘He adorns his beard :’—he rouses himself to\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows one gnawing dried flesh, and meeting with what is disagreeable. There will be occasion for some small regret, but no (great) error.\n\n##### Symbol: ‘The good fortune consequent on his ever maintaining firm correctness’ is due to this,—that to the end no one will insult him.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows one gnawing the flesh dried on the bone, and getting the pledges of money and arrows. It will be advantageous to him to realise the difficulty of his task and be firm,—in which case there will be good fortune.\n\n##### Symbol: ‘His light has not been sufficiently displayed ;’ that is, there is still something for him to do :—he has to realise the difficulty of his position and be firm. ‘The place occupied by the fourth line, divided,’ affords ground for doubt (as to its subject); but ‘(as the subject of the third pursues) not as a robber, but as intent on a matrimonial alliance,’ he will in the end have no grudge against him.\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows one gnawing at dried flesh, and finding the yellow gold. Let him be firm and correct, realising the peril (of his position). There will be no error.\n\n##### Symbol: ‘The good fortune falling to the fifth line, divided,’ affords occasion for joy.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, shows one wearing the cangue, and deprived of his ears. There will be evil.\n\n##### Symbol: ‘ The freedom from error attached to (the subject of) the topmost line, with no ornament but the (simple white),’ shows how he has attained his aim.\n\n/6&"},"101001":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/022.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Shi He takes eating for its theme; Bi takes what is plain, from ornament quite free.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Bi denotes adorning. When ornamentation has been carried to the utmost, its progress comes to an end; and hence Bi is followed by Po.**","text.tab3":"&0&\n**Grace (Bi(Grace)): P î indicates that there should be free course (in what it denotes). There will be little advantage (however) if it be allowed to advance (and take the lead).**\n**Great Symbol: (The trigram representing) a mountain and that for fire under it form Pi. The superior man, in accordance with this, throws a brilliancy around his various processes of government, but does not dare (in a similar way) to decide cases of criminal litigation.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): (When it is said that) Pt indicates that there should be free course (in what it denotes) : — 2. (We see) the weak line coming and ornamenting the strong lines (of the lower trigram), and hence (it is said that ornament) ‘should have free course. On the other hand, the strong line above ornaments ‘the weak ones (of the upper trigram), and hence (it is said) that ‘there will be little advantage, if (ornament) be allowed to advance (and take the lead).’ (This is illustrated in the) appearances that ornament the sky. 3. Elegance and intelligence (denoted by the lower trigram) regulated by the arrest (denoted by the upper) suggest the observances that adorn human (society). 4. We look at the ornamental figures of the sky, and thereby ascertain the changes of the seasons. We look at the ornamental observances of society, and understand how thie processes of transformation are accomplished all under heaven.\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows one adorning (the way of) his feet. He can discard a carriage and walk on foot.\n\n##### Symbol: \"He can discard a carriage and walk on foot:\"--righteousness requires that he should not ride.\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows one adorning his beard.\n\n##### Symbol: \"He adorns his beard:\"--he rouses himself to action (only) along with the (subject of the) line above.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows its subject with the appearance of being adorned and bedewed (with rich favours). But let him ever maintain his firm correctness, and there will be good fortune.\n\n##### Symbol: \"The good fortune consequent on his ever maintaining firm correctness\" is due to this,--that to the end no one will insult him.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows one looking as if adorned, but only in white. As if (mounted on) a white horse, and furnished with wings, (he seeks union with the subject of the first line), while (the intervening third pursues), not as a robber, but intent on a matrimonial alliance.\n\n##### Symbol: \"The place occupied by the fourth SIX, (divided),\" affords ground for doubt (as to its subject); but \"\"(as the subject of the third pursues) not as a robber, but as intent on a matrimonial alliance,\" he will in the end have no grudge against him.\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows its subject adorned by (the occupants of) the heights and gardens. He bears his roll of silk, small and slight. He may appear stingy; but there will be good fortune in the end.\n\n##### Symbol: \"The good fortune falling to the fifth SIX, (divided); affords occasion for joy.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, shows one with white as his (only) ornament. There will be no error.\n\n##### Symbol: \"The freedom from error attached to (the subject of) the topmost line, with no ornament but the (simple white),\" shows how he has attained his aim.\n\n/6&"},"000001":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/023.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): We see in Po its subject worn away; and Fu shows its recovering from decay.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Po denotes decay and overthrow. Things cannot be done away for ever. When decadence and overthrow have completed their work at one end, reintegration commences at the other; and hence Po is followed by Fu.**","text.tab3":"&0&\n**Splitting Apart (Bo): P o indicates that (in the state which it symbolises) it will not be advantageous to make a movement in any direction whatever.**\n**Great Symbol: (The trigrams representing) the earth, and (above it) that for a mountain, which adheres to the earth, form Po. Superiors, in accordance with this, seek to strengthen those below them, to secure the peace and stability of their own position.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): Po denotes overthrowing or being overthrown. We see (in the figure) the weak lines (threatening to) change the (last) strong line (into one of themselves). 2. That ‘it will not be advantageous to make a movement in any direction whatever’ appears from the fact that the small men are (now) growing and increasing. The superior man acts according to (the exigency of the time), and stops all forward movement, looking at the (significance of the) symbolic figures (in the hexagram). He values the processes of decrease and increase, of fulness and decadence, (as seen) in the movements of the heavenly bodies.\n\n#### Lines\n\n&1&\n##### Line 1, Divided: The first line, divided, shows one overturning the couch by injuring its legs. (The injury will go on to) the destruction of (all) firm correctness, and there will be evil.\n\n##### Symbol: ‘He overthrows the couch by injuring its legs :’ —thus (he commences) his work of ruin with what is lowest (in the superior man).\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows one overthrowing the couch by injuring its frame. (The injury will go on to) the destruction of (all) firm correctness, and there will be evil.\n\n##### Symbol: ‘He destroys the couch by injuring its frame :'— (the superior man) has as yet no associates.\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows its subject among the overthrowers; but there will be no error.\n\n##### Symbol: That ‘there will be no error on the part of this one among the overthrowers’ arises from the difference between him and the others above and below.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows its subject having overthrown the couch, and (going to injure) the skin (of him who lies on it). There will be evil.\n\n##### Symbol: ‘He has overthrown the couch, and (proceeds to injure) the skin (of him who lies on it) :’\"—calamity is very near at hand.\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows (its subject leading on the others like) a string of fishes, and (obtaining for them) the favour that lights on the inmates of the palace. There will be advantage in every way.\n\n##### Symbol: ‘He obtains for them the favour that lights on the inmates of the palace :’—in the end there will be no grudge against him.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The topmost line, undivided, shows its subject (as) a great fruit which has not been eaten. The superior man finds (the people again) as a chariot carrying him. The small men (by their course) overthrow their own dwellings.\n\n##### Symbol: ‘The superior man finds himself in a carriage ;'—he is carried along by the people. ‘The small men (by their course) overthrow their own dwellings :’—they can never again be of use to them.\n\n/6&"},"100000":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/024.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): We see in Po its subject worn away; and Fu shows its recovering from decay.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): When the return (thus indicated) has taken place, we have not any rash disorder; and Fu is followed by Wu Wang.**","text.tab3":"&0&\n**Return (Fu): F û indicates that there will be free course and progress (in what it denotes). (The subject of it) finds no one to distress him in his exits and entrances; friends come to him, and no error is committed. He will return and repeat his (proper) course. In seven days comes his return. There will be advantage in whatever direction movement is made.**\n**Great Symbol: (The trigram representing) the earth and that for thunder in the midst of it form Fo. The ancient kings, in accordance with this, on the day of the (winter) solstice, shut the gates of the passes (from one state to another), so that the travelling merchants could not (then) pursue their journeys, nor the princes go on with the inspection of their states.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): ‘FQ indicates the free course and progress (of what it denotes):’—it is the coming back of what is intended by the undivided line. 2. (Its subject’s) actions show movement directed by accordance with natural order. Hence ‘he finds no one to distress him in his exits and entrances, and ‘friends come to him, and no error is committed.’ 3. ‘He will return and repeat his proper course ; in seven days comes his return :’—such is the movement of the heavenly (revolution). 4. ‘ There will be advantage in whatever direction movement is made:’'—the strong lines are growing and increasing. 5. Do we not see in Fd the mind of heaven and earth?\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows its subject returning (from an error) of no great extent, which would not proceed to anything requiring repentance. There will be great good fortune.\n\n##### Symbol: ‘ Returning (from an error) of no great extent’ is the prelude to the cultivation of the person.\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows the admirable return (of its subject). There will be good fortune.\n\n##### Symbol: ‘The good fortune attendant on the admirable return (of the subject of the second line)’ is due to his condescension to the virtuous (subject of the line) below.\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows one who has made repeated returns. The position is perilous, but there will be no error.\n\n##### Symbol: Notwithstanding ‘the perilous position of him\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows its subject moving right in the centre (among those represented by the other divided lines), and yet returning alone (to his proper path).\n\n##### Symbol: ‘He moves right in the centre (among those represented by the other divided lines), and yet returns alone :’'—his object is to pursue the (proper) path.\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows the noble return of its subject. There will be no ground for repentance.\n\n##### Symbol: ‘The noble return, giving no ground for repentance,’ is due to (the subject of the line) striving to perfect himself in accordance with his central position.\n\n/5&\n\n&6&\n##### Top Line, Divided: The topmost line, divided, shows its subject all astray on the subject of returning. There will be evil. There will be calamities and errors. If with his views he put the hosts in motion, the end will be a great defeat, whose issues will extend to the ruler of the state. Even in ten years he will not be able to repair the disaster.\n\n##### Symbol: ‘ The evil consequent on being all astray on the subject of returning’ is because the course pursued is contrary to the proper course for a ruler.\n\n/6&"},"100111":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/025.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Da Xu keeps still, and waits the proper time; Wu Wang sets forth how evil springs from crime.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Given the freedom from disorder and insincerity (which this name denotes), there may be the accumulation (of virtue); and Wu Wang is followed by Da Xu.**","text.tab3":"&0&\n**Innocence (Wu Wang): Wû Wan g indicates great progress and success, while there will be advantage in being firm and correct. If (its subject and his action) be not correct, he will fall into errors, and it will not be advantageous for him to move in any direction.**\n**Great Symbol: The thunder rolls all under the sky, and to (every)thing there is given (its nature), free from all insincerity. The ancient kings, in accordance with this; (made their regulations) in complete accordance with the seasons, thereby nourishing all things.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In Wi Wang we have the strong (first) line come from the outer (trigram), and become in the inner trigram lord (of the whole figure); we have (the attributes of) motive power and strength ; we have the strong line (of the fifth place) in the succeeded by day; the moon wanes, and then begins to wax again. So will it be in political life. As we read in the Hebrew prophet Isaiah, ‘In returning and rest shall ye be saved; in quietness and in confidence shall be your strength.’\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows its subject free from all insincerity. His advance will be accompanied with good fortune.\n\n##### Symbol: When ‘he who is free from insincerity makes any movement, he will get what he desires.\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows one who reaps without having ploughed (that he might reap), and gathers the produce of his third year's fields without having cultivated them the first year for that end. To such a one there will be advantage in whatever direction he may move.\n\n##### Symbol: ‘He reaps without having ploughed :'—(the thought of) riches to be got had not risen (in his mind).\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows calamity happening to one who is free from insincerity;—as in the case of an ox that has been tied up. A passer by finds it (and carries it off), while the people in the neighbourhood have the calamity (of being accused and apprehended).\n\n##### Symbol: ‘The passer-by gets the ox:’—this proves a calamity to the people of the neighbourhood.\n\n/3&\n\n&4&\n##### Line 4, Undivided: The fourth line, undivided, shows (a case) in which, if its subject can remain firm and correct, there will be no error.\n\n##### Symbol: ‘If he can remain firm and correct there will be no error :'—he firmly holds fast (his correctness).\n\n/4&\n\n&5&\n##### Line 5, Undivided: The fifth line, undivided, shows one who is free from insincerity, and yet has fallen ill. Let him not use medicine, and he will have occasion for joy (in his recovery).\n\n##### Symbol: ‘Medicine in the case of one who is free from insincerity !’—it should not be tried (at all).\n\n/5&\n\n&6&\n##### Top Line, Undivided: The topmost line, undivided, shows its subject free from insincerity, yet sure to fall into error, if he take action. (His action) will not be advantageous in any way.\n\n##### Symbol: ‘The action (in this case) of one who is free from insincerity’ will occasion the calamity arising from action (when the time for it is) exhausted.\n\n/6&"},"111001":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/026.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Da Xu keeps still, and waits the proper time; Wu Wang sets forth how evil springs from crime.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Such accumulation having taken place, there will follow the nourishment of it; and hence Da Xu is followed by Yi.**","text.tab3":"&0&\n**Great Taming Power (Da Chu): Under the conditions of Tâ Kh û it will be advantageous to be firm and correct. (If its subject do not seek to) enjoy his revenues in his own family (without taking service at court), there will be good fortune. It will be advantageous for him to cross the great stream.**\n**Great Symbol: (The trigram representing) a mountain, and in the midst of it that (representing) heaven, form TA KA. The superior man, in accordance with this, stores largely in his memory the words and deeds of former men, to subserve the accumulation of his virtue.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): In (the trigrams composing) Ta AAO we have (the attributes) of the greatest strength and of substantial solidity, which emit a brilliant light ; and iridicate a daily renewal of his virtue (by the subject of it). 2. The strong line is in the highest place, and suggests the value set on talents and virtue; there is power (in the upper trigram) to keep the strongest in restraint :—all this shows ‘the great correctness’ (required in the hexagram). 3. ‘The good fortune attached to the subject's not seeking to enjoy his revenues in his own family’ shows how talents and virtue are nourished.\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, shows its subject in a position of peril. It will be advantageous for him to stop his advance.\n\n##### Symbol: ‘He is in a position of peril; it will be advantageous for him to stop his advance :’—he should not rashly expose himself to calamity.\n\n/1&\n\n&2&\n##### Line 2, Undivided: The second line, undivided, shows a carriage with the strap under it removed.\n\n##### Symbol: ‘(He is as) a carriage from which the strap under it has been removed :’'—being in the central position, he will incur no blame.\n\n/2&\n\n&3&\n##### Line 3, Undivided: The third line, undivided, shows its subject urging his way with good horses. It will be advantageous for him to realise the difficulty (of his course), and to be firm and correct, exercising himself daily in his charioteering and methods of defence; then there will be advantage in whatever direction he may advance.\n\n##### Symbol: ‘ There will be advantage in whatever direction he may advance :'—(the subject of) the topmost line is of the same mind with him.\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows the young bull, (and yet) having the piece of wood over his horns. There will be great good fortune.\n\n##### Symbol: ‘The great good fortune indicated by the fourth line, divided, shows that there is occasion for joy.\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows the teeth of a castrated hog. There will be good fortune.\n\n##### Symbol: ‘The good fortune indicated by the fifth line, divided,’ shows that there is occasion for congratulation.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, shows its subject (as) in command of the firmament of heaven. There will be progress.\n\n##### Symbol: ‘In command of the firmament of heaven :’—the way is grandly open for movement.\n\n/6&"},"100001":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/027.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Body and mind are nourished right in Yi.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Yi denotes nourishing. Without nourishment there could be no movement; and hence Yi is followed by Da Guo.**","text.tab3":"&0&\n**Nourishment (Yi): Î indicates that with firm correctness there will be good fortune (in what is denoted by it). We must look at what we are seeking to nourish, and by the exercise of our thoughts seek for the proper aliment.**\n**Great Symbol: (The trigram representing) a mountain and under it that for thunder form {. The superior man, in accordance with this, (enjoins) watchfulness over our words, and the temperate regulation of our eating and drinking.**\n\n/0&\n#### Commentary\n\nCommentary (Tuan Zhuan): ‘lindicates that with firm correctness there will be good fortune :'—when the nourishing is correct, there will be good fortune. ‘We must look at what we are seeking to nourish :’'—we must look at those whom we wish to nourish. ‘We must by the exercise of our thoughts seek the proper aliment:’— we must look to our own nourishing of ourselves. 2. Heaven and earth nourish all things. The sages nourish men of talents and virtue, by them to reach to the myriads of the people. Great is (the work intended by this) nourishing in its time!\n\n#### Lines\n\n&1&\n##### Line 1, Undivided: The first line, undivided, (seems to be thus addressed), 'You leave your efficacious tortoise, and look at me till your lower jaw hangs down.' There will be evil.\n\n##### Symbol: ‘You look at me till your (lower) jaw hangs down :’—(the subject of the line) is thus shown unfit to be thought noble.\n\n/1&\n\n&2&\n##### Line 2, Divided: The second line, divided, shows one looking downwards for nourishment, which is contrary to what is proper; or seeking it from the height (above), advance towards which will lead to evil.\n\n##### Symbol: ‘The evil of advance by the subject of the second line, divided,’ is owing to his leaving in his movements his proper associates.\n\n/2&\n\n&3&\n##### Line 3, Divided: The third line, divided, shows one acting contrary to the method of nourishing. However firm he may be, there will be evil. For ten years let him not take any action, (for) it will not be in any way advantageous.\n\n##### Symbol: ‘For ten years let him not take any action :’— his course is greatly opposed (to what is right).\n\n/3&\n\n&4&\n##### Line 4, Divided: The fourth line, divided, shows one looking downwards for (the power to) nourish. There will be good fortune. Looking with a tiger's downward unwavering glare, and with his desire that impels him to spring after spring, he will fall into no error.\n\n##### Symbol: ‘The good fortune attached to looking downwards for (the power to) nourish,’ shows how brilliant will be the diffusion (of that power) from (the subject of the line’s) superior position.\n\n/4&\n\n&5&\n##### Line 5, Divided: The fifth line, divided, shows one acting contrary to what is regular and proper; but if he abide in firmness, there will be good fortune. He should not, (however, try to) cross the great stream.\n\n##### Symbol: ‘The good fortune from abiding in firmness’ is due to the docility (of the subject of the line) in following (the subject of the line) above.\n\n/5&\n\n&6&\n##### Top Line, Undivided: The sixth line, undivided, shows him from whom comes the nourishing. His position is perilous, but there will be good fortune. It will be advantageous to cross the great stream.\n\n##### Symbol: ‘The good fortune, notwithstanding the peril\n\n/6&"},"011110":{"text.tab1":"#### Image\n![(Danyi Tianji (断易天機), collection of the National Library of Korea (국립중앙도서관))](assets/guatu_pdf/028.jpg)","text.tab2":"#### Miscellaneous\n\n**Miscellaneous Notes (Tsa Kwa): Xu shows its subject making no advance; in Song we seek in vain a friendly glance; and Da Guo's overthrown with sad mischance.**\n\n#### Sequence\n**Sequence of Hexagrams (Hsu Kwa): Things cannot for ever be in a state of extraordinary (progress); and hence Da Guo is followed by Kan. Kan denotes fa
