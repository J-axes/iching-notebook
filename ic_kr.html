<!DOCTYPE html>
<html lang="tc">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IC Notebook</title>
<style>
:root{
  /* ── 左欄佈局 ── */
  --panel-w:  240px; /* .yao-btn / .shibo-row / .msg / .tab-bar 的 width；.settings-panel 的 width */
  --yao-h:     44px; /* .yao-btn（六個爻位按鈕）的 height */
  --ctrl-h:    36px; /* .num-arrow / .num-input / .lock-btn / .search-btn / .settings-btn 的 height；也作 .msg min-height */
  --bit-sz:    32px; /* .bit-toggle（六個數位格）的 width 和 height（正方形） */
  --arrow-w:   24px; /* .num-arrow（序列號 ◀▶ 按鈕）的 width */
  --input-w:   88px; /* .num-input（序列號輸入框）的 width */
  --col-gap:    5px; /* .yao-col 的 gap，控制六個爻位按鈕與 bit-row 之間的垂直間距 */
  --row-gap:  7.5px; /* .bit-row 和 .num-ctrl 的 margin-top，距上方爻位列的距離 */
  --tab-gap:   10px; /* .tab-bar 的 margin-top 和 gap，控制頁籤列與上方元素距離及頁籤間距 */
  --shibo-gap:  8px; /* .shibo-row 的 gap，筮卜按鈕、設置按鈕、保存按鈕之間的水平間距 */
  --shibo-mt:   2px; /* .yao-bian-btn 和 .shibo-row 的 margin-top */
  --sep-m:      4px; /* .hex-sep（上下卦虛線分隔）的 margin-top 和 margin-bottom */
  --tab-pad:    6px; /* .tab-btn（圖占/地理/爻辭/卦象）的 padding-top 和 padding-bottom */
  --tab-outline-offset: 2px; /* .tab-btn 雙框線的間距，隨面板縮放 */
  /* ── 左欄結構 ── */
  --yao-pad:   18px; /* .yao-btn 的 padding-left 和 padding-right */
  --yao-gap:   14px; /* .yao-btn 內部 flex gap，分隔 .yao-lbl 標籤與 .line-wrap 爻線區域 */
  --lbl-w:     28px; /* .yao-lbl（初爻/二爻…上爻 文字標籤）的固定 width */
  --char-sz:   94px; /* .tri-bg-char（背景半透明卦名大字，如「坤」）的 font-size */
  --char-small:11px; /* .tri-bg-num（卦序號）和 .tri-bg-thing（物象，如「地」）的 font-size */
  --char-off:  55px; /* .tri-bg-num 和 .tri-bg-thing 距 .tri-bg-char 中心的垂直偏移（top calc） */
  --icon-sz:   20px; /* .search-btn / .lock-btn / .settings-btn 內部 SVG 圖示的大小 */
  /* ── 左欄字型 ── */
  --fs-ctrl: 14.4px; /* .yao-bian-btn / .shibo-btn / .tab-btn 的 font-size */
  --fs-msg:  13.6px; /* .msg（訊息欄）的 font-size */
  --fs-lbl:    12px; /* .yao-lbl（初爻…上爻）的 font-size */
  --fs-mono:   14px; /* monospace UI elements: bit-toggle, num-input, save-record-bits, rec-prop-rows */
  --fs-bitToggle:    16px; /* 6-digit bit-toggle display */
  --fs-tip: 11.52px; /* [data-tip]::after（tooltip 浮層）的 font-size */
  --fs-rec:    20px; /* .save-record 整列的基準 font-size（收藏星號繼承此值） */
  --fs-time:   10px; /* .save-record-time（日期時間戳）的 font-size */
  /* ── 右欄標題（.hex-header）── */
  --hdr-symbol-sz:60.8px; /* .hex-symbol（卦象符號 ☰☷☵…）的 font-size */
  --hdr-name-sz:  25.6px; /* .hex-name（卦名，如「坤」）的 font-size */
  --hdr-meta-sz:  13.6px; /* .hex-meta（卦序號、爻位數 meta 資訊）的 font-size */
  --hdr-btn-sz:   12.8px; /* .show-hex-btn（展示本卦／之卦切換按鈕）的 font-size */
  --hdr-arrow-sz:   64px; /* .hex-arrow（本卦→之卦的「→」符號）的 font-size */
  --hdr-lbl-sz:     16px; /* .hex-arrow-label（「本卦」「之卦」標籤）的 font-size */
  --hdr-title-sz:   32px; /* .guaxiang-title（卦象頁大標題）的 font-size */
  --hdr-gap:        16px; /* .hex-header 的 gap，分隔符號、卦名、meta、按鈕 */
  --hdr-mb:         16px; /* .hex-header 的 margin-bottom */
  --hdr-pb:         16px; /* .hex-header 的 padding-bottom（底部分隔線上方空間） */
  --hdr-btn-pv:      6px; /* .show-hex-btn 的 padding-top 和 padding-bottom */
  --hdr-btn-ph:     10px; /* .show-hex-btn 的 padding-left 和 padding-right */
  --hdr-dual-gap:   20px; /* .hex-header-dual（本卦/之卦雙欄 grid）的 gap */
  --hdr-unit-gap:    4px; /* .hex-unit（單卦符號+卦名縱向排列）的 gap */
  --hdr-pair-gap:   10px; /* .hex-symbol-pair（標題左側 本卦+變換卦 雙符號）的 gap */
  --hdr-title-mb:   12px; /* .guaxiang-title 的 margin-bottom */
  /* ── 右欄正文字型 ── */
  --body-sec-sz:  16px;    /* .sec-heading（一級段落標題，帶底線）的 font-size */
  --body-sub-sz:  14.88px; /* .sub-heading（二級子標題，帶虛線底線）的 font-size */
  --body-yao-sz:  14.08px; /* .yao-heading（爻辭左邊框標題）的 font-size */
  --body-item-sz: 14.72px; /* .content-item（帶左邊框的內容塊）和 .body-line 的 font-size */
  --body-jw-sz:   14.4px;  /* .guaxiang-jw-item（卦象頁吉凶判斷條目）的 font-size */
  --body-ann-sz:  10.56px; /* .annotation（注釋斜體文字塊）的 font-size */
  --body-tog-sz:  12px;    /* .section-toggle（折疊／展開切換按鈕）的 font-size */
  /* ── 設置／重置彈窗（.settings-panel）── */
  --sp-top:      90px;  /* .settings-panel 的 top（距視口頂部距離） */
  --sp-pad-v:    20px;  /* .settings-panel 的 padding-top */
  --sp-pad-h:    16px;  /* .settings-panel 的 padding-left / right / bottom */
  --sp-title-sz: 16px;  /* .settings-panel-title（「設置」「重置筮卜」標題）的 font-size */
  --sp-title-mb: 14px;  /* .settings-panel-title 的 margin-bottom */
  --sp-title-pb:  8px;  /* .settings-panel-title 的 padding-bottom（底線上方空間） */
  --sp-close-sz:17.6px; /* .settings-close（「×」關閉按鈕）的 font-size */
  --sp-close-t:  10px;  /* .settings-close 的 top 定位 */
  --sp-close-r:  12px;  /* .settings-close 的 right 定位 */
  --subsec-sz:   18px;  /* sub-section label font-size */
  --subsec-mt:   14px;  /* sub-section label margin-top */
  --subsec-mb:    6px;  /* sub-section label margin-bottom */
  --subsec-ls:    .2em;   /* sub-section label letter-spacing */
  --inp-fsz:      14px;  /* input field font-size（設置／設定面板通用） */
  --sp-row-pv:    3px;  /* .prob-row 的 padding-top 和 padding-bottom */
  --sp-pct-sz: 11.52px; /* .prob-pct（概率百分比數字）的 font-size */
  --sp-act-gap:   8px;  /* .settings-actions（取消／確認按鈕列）的 gap */
  --sp-act-mt:   14px;  /* .settings-actions 的 margin-top */
  --sp-act-pt:   10px;  /* .settings-actions 的 padding-top（頂部分隔線下方空間） */
  --sp-btn-pv:    5px;  /* .settings-btn-action 的 padding-top 和 padding-bottom */
  --sp-input-w:  40px;  /* .prob-input（概率輸入框）的 width */
  --sp-body-sz: 13.6px; /* .sp-body-text（重置確認說明文字）的 font-size */
  --sp-body-mb:  16px;  /* .sp-body-text 的 margin-bottom */
  --win-text-sz: 11px;  /* body text in all windows */
  --win-body-pt:  0px;  /* inner-container top padding in all windows */
  /* ── app loader（整體載入指示）── */
  --loader-budget: 180ms; /* 時間預算：撐過這段時間才顯示 spinner */
  --loader-sz:      34px; /* .loader-spin 的直徑 */
  --loader-bw:       3px; /* .loader-spin 的 border-width */
  /* ── 保存記錄 dropdown（.save-dropdown）── */
  --dd-maxh: 272px; /* .save-dropdown 的 max-height（超出後出現滾動條） */
  --dd-pv:     3px; /* .save-record 的 padding-top 和 padding-bottom */
  --dd-ph:     3px; /* .save-record 的 padding-left 和 padding-right */
  --dd-gap:    6px; /* .save-record 內 flex gap，分隔收藏星、數列、時間戳 */
  --dd-ep:     3px; /* .save-dropdown-empty（無記錄提示）的 padding */
  --dd-cv-pv:  9px; /* .save-dd-confirm 的 padding-top 和 padding-bottom */
  --dd-cv-mt:  8px; /* .save-dd-confirm-actions 的 margin-top */
  --dd-cv-btn-pv: 4px; /* .save-dd-confirm-btn 的 padding-top 和 padding-bottom */
  --btn-ph:      10px; /* 通用有邊框按鈕的水平 padding */
  /* ── 搜尋 dropdown（#saveDropdownUp）── */
  --sr-bar-pv:  6px; /* .dd-search-bar 上下 padding */
  --sr-bar-ph:  6px; /* .dd-search-bar 左右 padding */
  --sr-pv:      6px; /* .sr-row / .dd-hint 上下 padding */
  --sr-ph:      6px; /* .sr-row / .dd-hint 左右 padding */
  --sr-gap:     6px; /* .sr-row 內 flex gap（卦符 ↔ 內容、卦號 ↔ 卦名 ↔ 欄位標籤） */
  --sr-row-gap: 2px; /* .sr-main 內上下 gap（標題行 ↔ 摘要行）；亦作 .sr-field 水平 padding */
  --fs-sr-sym:   22px; /* .sr-sym 卦符 font-size */
  --fs-sr-name:  14px; /* .sr-name 卦名 font-size */
  --fs-sr-field: 10px; /* .sr-field 欄位標籤 font-size */
  --fs-sr-snip:  11px; /* .sr-snip 摘要 / .dd-hint / .sr-none font-size */
  /* ── 命名 popup（#shiboNamePop / #saveNamePop）── */
  --pop-pv:  6px; /* popup 上下 padding */
  --pop-ph:  8px; /* popup 左右 padding */
  --pop-gap: 6px; /* input 與 confirm 按鈕之間的 gap */
  /* ── 色板（高頻色值，全域共用）── */
  --c-main:       #d4b870; /* 主正文色：body content / 卦象判斷條目 / 概率分數顯示 */
  --c-accent:     #c9a84c; /* 強調色：.hex-name / .sec-heading；config 欄位標籤、段落代號、欄位表頭；hover 文字色；active 邊框色 */
  --c-border:     #3a2a10; /* 控件邊框：.yao-btn / .bit-toggle / .num-arrow 等預設 border */
  --c-default:    #1e170a; /* 控件背景：所有按鈕、輸入框 background（非 active 狀態） */
  --c-gold:       #f0c040; /* 金色高亮：所有輸入框文字色；binary 0 / active 文字色；.hex-symbol；筮卜完成特效 */
  --c-dim:        #5a4020; /* 非活動暗色：binary 1 / bit-toggle OFF；✖ / ✚ / ★ 等操作按鈕預設色；settings-btn */
  --font-empty:  italic; /* 空狀態提示文字（下拉列表無記錄、佔位符）的 font-style */
  --c-subsec:     #7a6030; /* 次級標籤色：source-section-label / config-section-title / prob-section-label */
  --c-active:     #261e08; /* hover／active 背景：按鈕 hover 或選中時的 background */
  --c-opt:        #2a200e; /* 選項下拉框背景：select / option-style input */
  --c-sep:        #2a2010; /* 細分隔線：.hex-header / .divider / .settings-actions 的 border 色 */
  --c-inset:      #100d07; /* 內嵌容器背景：比 c-page 更深，用於面板內的凹陷區塊 */
  --c-page:       #16110a; /* 頁面最深底色：body background；stacked 模式右欄 overlay background */
  --c-leftBorder: #6a3f0a; /* 左側邊框深棕色：.ci-section-b / guaxiang 條目 / save 條目 / 圖片邊框 */
  /* ── 蓍草爻位文字色（CSS 與 JS PROB_COLORS 共用，單一來源）── */
  --y6-tx: #a0d0ff; /* 老陰（變爻）：.bit-toggle.y6 color；PROB_COLORS.quaternary['6'] */
  --y7-tx: #90e8a0; /* 少陽（靜爻）：.bit-toggle.y7 color；PROB_COLORS.quaternary['7'] */
  --y8-tx: #ffe060; /* 少陰（靜爻）：.bit-toggle.y8 color；PROB_COLORS.quaternary['8'] */
  --y9-tx: #ff9060; /* 老陽（變爻）：.bit-toggle.y9 color；PROB_COLORS.quaternary['9'] */
  /* ── config / settings 輸入框（JS PANEL_SIZES 同步縮放） ── */
  --cfg-input-h: 28px;
  --cfg-body-gap: 14px;  --cfg-sec-gap: 6px;
  --cfg-label-w: 60px;
  --cfg-inp-pv: 3px;     --cfg-inp-ph: 6px;
  --cfg-color-w: 32px;
  --cfg-color-pv: 1px;   --cfg-color-ph: 2px;
  --cfg-num-w: 52px;
  --cfg-rm-fsz: 11px;
  --cfg-cell-pv: 2px;    --cfg-cell-ph: 4px;
  --cfg-preset-pv: 6px;  --cfg-preset-ph: 8px;  --cfg-preset-gap: 5px;
  --cfg-tri-inp-w: 52px;
  --cfg-tri-wrap-pb: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  background:var(--c-page);color:#e8d5a3;
  height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:flex-start;padding:36px 36px 0;
}

/* ── 兩欄佈局 ── */
.page-layout{
  display:flex;gap:48px;align-items:flex-start;
  width:100%;
  flex:1;min-height:0;
}
.left-panel{flex-shrink:0;display:flex;flex-direction:column;align-items:center;position:relative;}
.right-panel{
  flex:1;min-width:0;
  align-self:stretch;overflow:hidden;
  display:flex;flex-direction:column;
}
*{--sb-c:#7a6030;--sb-c-hover:var(--c-accent,#c9a84c);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--sb-c);border-radius:3px;transition:background .4s;}
::-webkit-scrollbar-thumb:hover{background:var(--sb-c-hover);}
#contentArea{flex:1;overflow-y:auto;padding-bottom:48px;}

/* ── 左欄：yao-col + tri-buttons ── */
.yao-col{display:flex;flex-direction:column;align-items:center;gap:var(--col-gap);flex:1}
.tri-buttons{position:relative;display:flex;flex-direction:column;gap:var(--col-gap);}
.tri-bg-char,.tri-bg-num,.tri-bg-thing{
  position:absolute;
  left:calc(var(--yao-pad) + var(--lbl-w) + var(--yao-gap) + (var(--panel-w) - var(--yao-pad) * 2 - var(--lbl-w) - var(--yao-gap)) / 2);
  opacity:.25;pointer-events:none;user-select:none;
}
.tri-bg-char{
  top:50%;transform:translate(-50%,-50%);
  font-size:var(--char-sz);line-height:1;letter-spacing:0;
}
.tri-bg-num,.tri-bg-thing{
  font-size:var(--char-small);line-height:1;font-family:monospace;font-weight:bold;
}
.tri-bg-num{top:calc(50% - var(--char-off));transform:translate(-50%,-100%);}
.tri-bg-thing{top:calc(50% + var(--char-off));transform:translateX(-50%);}

/* ── 爻位按鈕 ── */
.yao-btn{
  width:var(--panel-w);height:var(--yao-h);
  border:1px solid color-mix(in srgb,var(--tri-color,#6a3a10) 30%,var(--c-page));
  background:color-mix(in srgb,var(--tri-color,var(--c-default)) 7%,var(--c-default));
  cursor:pointer;border-radius:6px;
  display:flex;align-items:center;
  padding:0 var(--yao-pad);gap:var(--yao-gap);
  transition:border-color .15s,background .15s;
}
.yao-btn:hover{
  border-color:color-mix(in srgb,var(--tri-color,var(--c-accent)) 65%,var(--c-accent));
  background:color-mix(in srgb,var(--tri-color,var(--c-active)) 12%,var(--c-active));
}
.yao-btn.yang{
  border-color:color-mix(in srgb,var(--tri-color,var(--c-accent)) 55%,var(--c-accent));
  background:color-mix(in srgb,var(--tri-color,var(--c-active)) 15%,var(--c-active));
}
.yao-lbl{font-size:var(--fs-lbl);width:var(--lbl-w);flex-shrink:0;letter-spacing:.05em;text-align:right;}
.yao-lbl.odd{color:rgba(255,255,255,0.38);}
.yao-btn.yang .yao-lbl.odd{color:#ffffff;}
.yao-lbl.even{color:#000000;}
.line-wrap{flex:1;display:flex;align-items:center;padding:0 4px}
.yang-bar{height:5px;flex:1;background:color-mix(in srgb,var(--tri-color,var(--c-gold)) 45%,var(--c-gold));border-radius:3px;box-shadow:0 0 8px rgba(240,192,64,.45);}
.yin-wrap{display:flex;flex:1}
.yin-h{height:5px;flex:1;background:color-mix(in srgb,var(--tri-color,var(--c-border)) 45%,var(--c-page));border-radius:3px}
.yin-gap{flex:1}

/* ── 上下卦分隔線 ── */
.hex-sep{width:100%;border-top:1px dashed var(--c-border);margin:var(--sep-m) 0;}

/* ── 6格數位 ── */
.bit-row{display:flex;gap:var(--col-gap);margin-top:var(--row-gap);}
.bit-toggle{
  width:var(--bit-sz);height:var(--bit-sz);
  border:1px solid var(--c-border);background:var(--c-default);
  border-radius:5px;cursor:pointer;
  color:var(--c-dim);font-size:var(--fs-bitToggle);font-family:monospace;
  transition:border-color .15s,background .15s,color .15s;
}
.bit-toggle.on{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}

/* ── 序列號控件，🔒，🔍── */
.num-ctrl{display:flex;align-items:center;gap:var(--shibo-gap);margin-top:var(--row-gap);}
.num-ctrl.disabled .num-arrow,.num-ctrl.disabled .num-input{opacity:.3;pointer-events:none;cursor:not-allowed;}
.num-arrow{
  width:var(--arrow-w);height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);
  color:var(--c-accent);font-size:var(--fs-mono);border-radius:5px;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.num-arrow:hover{border-color:var(--c-accent);background:var(--c-active);}
.num-input{
  width:var(--input-w);height:var(--ctrl-h);border:2.5px solid var(--c-border);background:var(--c-default);
  color:var(--c-gold);font-size:var(--fs-ctrl);font-family:monospace;
  text-align:center;border-radius:5px;
}
.num-input:focus{outline:none;border-color:var(--c-accent);}
.num-input::-webkit-inner-spin-button,
.num-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.num-input{appearance:textfield;}
.lock-btn{width:var(--ctrl-h);height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);color:var(--c-dim);border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s,color .15s;}
.lock-btn:hover{border-color:#6a4a20;color:var(--c-accent);}
.lock-btn.locked{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}
.btn-inverted{border-color:transparent!important;background:var(--c-accent)!important;color:var(--c-default)!important;}
.btn-inverted .show-hex-label{color:var(--c-page);}
.search-btn{width:var(--ctrl-h);height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);color:var(--c-dim);border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s,color .15s;}
.search-btn:hover{border-color:#6a4a20;color:var(--c-accent);}
.save-dropdown{position:absolute;width:var(--panel-w);left:50%;transform:translateX(-50%);max-height:var(--dd-maxh);overflow:hidden;background:var(--c-default);border:1px solid #4a3010;border-radius:6px;z-index:300;display:none;box-shadow:0 4px 20px rgba(0,0,0,.65);font-family:monospace;flex-direction:column;}
.save-dropdown.open{display:flex;}
.dd-title{flex-shrink:0;font-size:var(--sp-title-sz);letter-spacing:.35em;color:var(--c-accent);padding:var(--dd-pv) var(--dd-ph);border-bottom:1px solid var(--c-sep);font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;}
.dd-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}
.save-dropdown--up{box-shadow:0 -4px 20px rgba(0,0,0,.65);}
/* search bar — fixed row between .dd-title and the scrolling .dd-body */
.dd-search-bar{flex-shrink:0;padding:var(--sr-bar-pv) var(--sr-bar-ph);border-bottom:1px solid var(--c-border);}
.dd-up-input{display:block;width:100%;box-sizing:border-box;height:var(--ctrl-h);padding:0 var(--sr-ph);background:var(--c-inset);border:1px solid var(--c-border);border-radius:4px;color:var(--c-gold);font-size:var(--fs-ctrl);font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;outline:none;}
.dd-up-input:focus{border-color:var(--c-accent);}
.dd-up-input::placeholder{color:var(--c-dim);font-style:italic;}
/* empty-state hint / no-results line */
.dd-hint,.sr-none{padding:var(--sr-pv) var(--sr-ph);font-size:var(--fs-sr-snip);color:var(--c-dim);font-style:italic;line-height:1.5;}
.sr-none{text-align:center;}
/* suggestion row */
.sr-row{display:flex;align-items:flex-start;gap:var(--sr-gap);padding:var(--sr-pv) var(--sr-ph);border-bottom:1px solid #2a1e08;cursor:pointer;transition:background .1s;}
.sr-row:last-child{border-bottom:none;}
.sr-row:hover,.sr-row.sel{background:var(--c-active);}
.sr-sym{flex:0 0 auto;font-size:var(--fs-sr-sym);color:var(--c-gold);line-height:1;}
.sr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--sr-row-gap);}
.sr-head{display:flex;align-items:baseline;gap:var(--sr-gap);min-width:0;}
.sr-num{flex:0 0 auto;font-size:var(--fs-mono);color:var(--c-dim);font-family:monospace;}
.sr-name{flex:1;min-width:0;font-size:var(--fs-sr-name);color:var(--c-accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-field{flex:0 0 auto;font-size:var(--fs-sr-field);color:var(--c-subsec);border:1px solid var(--c-border);border-radius:3px;padding:0 var(--sr-row-gap);white-space:nowrap;}
.sr-snip{font-size:var(--fs-sr-snip);color:var(--c-main);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
.sr-hit{background:transparent;color:var(--c-gold);font-weight:bold;}
.save-record{padding:var(--dd-pv) var(--dd-ph);cursor:default;border-bottom:1px solid #2a1e08;font-size:var(--fs-rec);display:flex;align-items:stretch;justify-content:flex-start;transition:background .1s;}
.save-record:last-child{border-bottom:none;}
.save-record:hover{background:var(--c-active);}
.save-record-icons{display:flex;align-items:center;gap:0.75em;flex:0 0 31.25%;border-right:1px solid var(--c-border);}
.save-record-name{display:flex;align-items:center;justify-content:center;flex:0 0 25%;border-right:1px solid var(--c-border);cursor:pointer;}
.save-record-name-inner{font-size:var(--fs-time);color:var(--c-accent);display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;word-break:break-all;text-align:center;}/* Name capture popup (shibo: above shibo-row; save: below save btn) */
.save-record-bits{font-size:var(--fs-mono);display:flex;align-items:center;justify-content:center;flex:0 0 30%;border-right:1px solid var(--c-border);cursor:pointer;}
.save-record-bits-inner{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;text-align:center;}
.save-record-time{color:#ffffff;font-size:var(--fs-time);text-align:right;flex:0 0 13.75%;cursor:pointer;}
.save-favo{cursor:pointer;color:var(--c-dim);transition:color .15s;flex-shrink:0;user-select:none;position:relative;top:-0.15em;transform:scale(1.5);}
.save-favo:hover{color:var(--c-accent);}
.save-favo.active{color:var(--c-gold);}
.save-dropdown-empty{padding:var(--dd-ep);color:#4a3830;font-size:var(--fs-rec);text-align:center;letter-spacing:.06em;font-style:var(--font-empty);}
/* Name record in save rows */
#shiboNamePop{position:absolute;top:100%;left:0;width:100%;box-sizing:border-box;background:var(--c-default);border:1px solid #4a3010;border-radius:6px;z-index:350;box-shadow:0 4px 16px rgba(0,0,0,.55);flex-direction:column;}
#saveNamePop{position:absolute;width:var(--panel-w);left:50%;transform:translateX(-50%);background:var(--c-default);border:1px solid #4a3010;border-radius:6px;z-index:350;box-shadow:0 4px 20px rgba(0,0,0,.65);flex-direction:column;}
.pop-row{display:flex;align-items:center;gap:var(--pop-gap);padding:var(--pop-pv) var(--pop-ph);}
.name-pop-input{flex:1;min-width:0;height:var(--ctrl-h);background:var(--c-inset);border:1px solid var(--c-border);border-radius:4px;color:var(--c-gold);font-size:var(--fs-ctrl);font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;outline:none;padding:0 6px;box-sizing:border-box;}
.name-pop-input::placeholder{color:var(--c-dim);font-style:italic;}
.name-pop-confirm{flex-shrink:0;height:var(--ctrl-h);border:1px solid var(--c-border);border-radius:4px;background:var(--c-default);color:var(--c-dim);font-size:var(--fs-ctrl);cursor:default;padding:0 var(--btn-ph);white-space:nowrap;box-sizing:border-box;font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;transition:color .15s,border-color .15s;}
.name-pop-confirm:not(:disabled){border-color:var(--c-accent);color:var(--c-accent);cursor:pointer;}
.name-pop-confirm:not(:disabled):hover{background:var(--c-active);}
/* Cast-name badge shown below shibo-row while cast is in progress */
#shiboNameBadge{position:fixed;z-index:8999;background:#2a1e08;color:var(--c-accent);border:1px solid #4a3010;border-radius:4px;padding:3px 8px;font-size:var(--fs-tip);font-family:"PingFang SC","Noto Serif TC",serif;white-space:nowrap;letter-spacing:.06em;pointer-events:none;display:none;}
/* 图标按钮 tooltip */
#tip-overlay{position:fixed;z-index:9000;background:#2a1e08;color:var(--c-accent);border:1px solid #4a3010;border-radius:4px;padding:3px 8px;font-size:var(--fs-tip);font-family:"PingFang SC","Noto Serif TC",serif;white-space:nowrap;letter-spacing:.06em;pointer-events:none;opacity:0;transition:opacity .15s;}
#tip-overlay.visible{opacity:1;}

/* ── 爻變按鈕 ── */
.yao-bian-btn{
  width:var(--panel-w);height:var(--ctrl-h);margin-top:var(--shibo-mt);
  border:1px solid var(--c-border);background:var(--c-default);
  color:#7a6030;border-radius:6px;cursor:pointer;
  letter-spacing:.35em;font-size:var(--fs-ctrl);
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  transition:border-color .15s,background .15s,color .15s;
  position:relative;overflow:hidden;white-space:nowrap;
}
.yao-bian-btn:hover{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}
.yao-bian-btn.active{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}

/* ── 筮卜 + 設置按鈕行 ── */
.shibo-row{display:flex;gap:var(--shibo-gap);margin-top:var(--shibo-mt);width:var(--panel-w);position:relative;}
.shibo-btn{flex:1;height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);color:#7a6030;border-radius:6px;cursor:pointer;letter-spacing:.35em;font-size:var(--fs-ctrl);font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;transition:border-color .15s,background .15s,color .15s;position:relative;overflow:hidden;white-space:nowrap;}
.shibo-btn:hover{border-color:#6a4a20;color:var(--c-accent);}
.settings-btn{width:var(--ctrl-h);height:var(--ctrl-h);border:1px solid var(--c-border);background:var(--c-default);color:var(--c-dim);border-radius:6px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s,color .15s;}
.settings-btn:hover{border-color:#6a4a20;color:var(--c-accent);}

/* ── 訊息欄 ── */
.msg{font-size:var(--fs-msg);min-height:var(--ctrl-h);flex:1;overflow:hidden;margin-top:var(--row-gap);letter-spacing:.05em;text-align:center;width:var(--panel-w);box-sizing:border-box;border:.25px solid var(--c-sep);border-radius:5px;padding:2px 6px;transition:border-color .15s,background .15s,color .15s,opacity 10s;display:flex;align-items:center;justify-content:center;}
.msg.msg--error{color:#e06060;border-color:#7a2020;background:#1e0a0a;}
.msg.msg--success{color:#d4cbb8;border-color:#7a7060;background:#1a1810;}
.msg.msg-fading{opacity:0;}

/* ── 頁面切換 ── */
.tab-bar{display:flex;gap:var(--tab-gap);margin-top:var(--tab-gap);width:var(--panel-w);}
.tab-btn{
  flex:1;padding:var(--tab-pad) 0;border:0.25px solid var(--c-border);background:var(--c-default);
  color:#7a6030;border-radius:5px;cursor:pointer;
  letter-spacing:.2em;font-size:var(--fs-ctrl);
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  transition:border-color .15s,background .15s,color .15s,outline-color .15s;
  outline:1px solid var(--c-border);outline-offset:var(--tab-outline-offset);
  overflow:hidden;white-space:nowrap;
}
.tab-btn.active{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);outline-color:var(--c-accent);}
.tab-btn:hover:not(.active):not(.tab-disabled){border-color:#6a4a20;color:var(--c-accent);outline-color:#6a4a20;}
.tab-btn.tab-disabled{opacity:.3;cursor:not-allowed;pointer-events:none;}



/* ── 右欄：結果標題 ── */
.hex-header{
  display:flex;align-items:center;gap:var(--hdr-gap);
  margin-bottom:var(--hdr-mb);padding-bottom:var(--hdr-pb);border-bottom:1px solid var(--c-sep);
}
.hex-header.guaxiang-layout{flex-direction:column;gap:var(--hdr-unit-gap);}
.hex-symbol{font-size:var(--hdr-symbol-sz);line-height:1;color:var(--c-gold);text-shadow:0 0 28px rgba(240,192,64,.3);flex-shrink:0;transition:color .3s,text-shadow .3s;}
.hex-symbol-pair{display:flex;align-items:center;gap:var(--hdr-pair-gap);flex-shrink:0;}
.hex-sym-orig{color:var(--c-dim);text-shadow:none;}
.hex-sym-orig-off{display:none;}
.hex-name{font-size:var(--hdr-name-sz);letter-spacing:.35em;color:var(--c-accent);flex:1;text-align:center;transition:color .3s;}
.hex-name-input{font-size:inherit;color:inherit;text-align:center;background:transparent;border:none;border-bottom:1px solid currentColor;outline:none;width:90%;font-family:inherit;padding:0;letter-spacing:.35em;}
.hex-meta{font-size:var(--hdr-meta-sz);color:#7a6030;letter-spacing:.1em;flex-shrink:0;text-align:right;}
.show-hex-btn{background:var(--c-default);border:1px solid var(--c-border);border-radius:5px;color:#7a6030;cursor:default;opacity:.45;font-size:var(--hdr-btn-sz);letter-spacing:.2em;padding:var(--hdr-btn-pv) var(--hdr-btn-ph);font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;position:relative;overflow:hidden;transition:border-color .15s,background .15s,color .15s,opacity .15s;}
.show-hex-btn.show-hex-active{border-color:var(--c-border);background:var(--c-active);color:var(--c-gold);cursor:pointer;opacity:1;}
.show-hex-btn.show-hex-active:hover:not(.btn-inverted){border-color:#6a4a20;}
.show-hex-btn.btn-inverted{border-color:transparent;background:var(--c-accent);color:var(--c-default);}
.show-hex-btn.btn-inverted .show-hex-label{color:var(--c-page);}
.hex-header-dual{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--hdr-dual-gap);width:100%;}
.hex-unit{display:flex;flex-direction:column;align-items:center;gap:var(--hdr-unit-gap);min-width:0;}
.hex-arrow{font-size:var(--hdr-arrow-sz);font-weight:bold;color:var(--c-accent);}
.hex-arrow-label{font-size:var(--hdr-lbl-sz);color:var(--c-accent);letter-spacing:.1em;}
.hex-header-dual .hex-name{font-size:var(--hdr-name-sz);white-space:nowrap;}

/* ── 右欄：內容渲染 ── */
#contentArea{display:flex;flex-direction:column;gap:6px;}
.sec-heading{
  font-size:var(--body-sec-sz);color:var(--c-accent);letter-spacing:.35em;
  margin:20px 0 8px;padding-bottom:6px;
  border-bottom:1px solid var(--c-sep);
}
.sec-heading:first-child{margin-top:0;}
.sub-heading{
  font-size:var(--body-sub-sz);color:var(--c-accent);letter-spacing:.28em;
  margin:18px 0 6px;padding-bottom:4px;
  border-bottom:1px dashed var(--c-border);
}
.yao-heading{
  font-size:var(--body-yao-sz);color:var(--c-accent);letter-spacing:.18em;
  margin:12px 0 2px;padding-left:8px;
  border-left:2px solid var(--c-leftBorder);
}
.bold-title{
  font-size:var(--body-sec-sz);
  color:var(--c-gold);font-weight:bold;letter-spacing:.25em;
  text-align:center;padding:6px 0;
}
.content-item{
  background:var(--c-default);border-left:3px solid var(--c-leftBorder);
  padding:10px 14px;border-radius:0 6px 6px 0;
  font-size:var(--body-item-sz);line-height:1.75;color:var(--c-main);
}
.item-num{color:var(--c-accent);font-weight:bold;}
.body-line{
  font-size:var(--body-item-sz);line-height:1.85;color:var(--c-main);
}
.annotation{
  padding:3px 14px;
  border-left:3px solid var(--c-border);border-radius:0 6px 6px 0;
  font-size:var(--body-ann-sz);line-height:1.6;color:#8a7040;font-style:italic;
}
.annotation-label{color:#6a5030;font-style:normal;margin-right:4px;}
.sub-section-body a{color:inherit;text-decoration:underline;}
ruby{ruby-align:center;}
rt{font-size:0.55em;}
.sub-section .sub-heading{
  display:flex;align-items:center;justify-content:flex-start;
}
.section-toggle{
  flex-shrink:0;margin-left:8px;
  background:none;border:none;padding:0;
  color:var(--c-dim);font-size:var(--body-tog-sz);cursor:pointer;
  line-height:1;transition:color .15s;
  font-family:inherit;
}
.section-toggle:hover{color:var(--c-accent);}
.sub-section[data-mode="bold"]:not([data-jie]) .sub-section-body>:not(.bold-title):not(.yao-heading){display:none;}
.sub-section[data-mode="bold"][data-jie] .sub-section-body>.annotation{display:none;}
.sub-section[data-mode="hide"] .sub-section-body{display:none;}
.divider{border:none;border-top:1px solid var(--c-sep);margin:16px 0}
/* 查詢失敗時右欄所有非按鈕文字過渡到 disabled 色 */
.query-failed *:not(button):not(button *){color:#3a2e18 !important;text-shadow:none !important;transition:color .3s,text-shadow .3s;}
.guaxiang-title{font-size:var(--hdr-title-sz);font-weight:700;color:var(--c-gold);letter-spacing:.15em;text-align:center;margin-bottom:var(--hdr-title-mb);}
.guaxiang-dual-content{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
.guaxiang-col{display:flex;flex-direction:column;gap:8px;}
.guaxiang-col-single{max-width:480px;margin:0 auto;}
.guaxiang-jw-item{background:var(--c-default);border-left:3px solid var(--c-leftBorder);padding:10px 14px;border-radius:0 6px 6px 0;font-size:var(--body-jw-sz);line-height:1.75;color:var(--c-main);}
.guaxiang-jw-item.guaxiang-jw-a{border-left-color:var(--c-gold);color:var(--c-gold);box-shadow:0 0 14px rgba(240,192,64,.22),inset 0 0 8px rgba(240,192,64,.06);}
.guaxiang-jw-item.guaxiang-jw-dim{opacity:.22;}
.guaxiang-text{margin-top:16px;}
.ci-section{border-left:3px solid transparent;padding-left:12px;margin-bottom:10px;}
.ci-section-a{border-left-color:var(--c-gold);box-shadow:0 0 14px rgba(240,192,64,.22),inset 0 0 8px rgba(240,192,64,.06);}
.ci-section-b{border-left-color:var(--c-leftBorder);}
.ci-section-dim{opacity:.22;}
.md-image{text-align:center;margin:10px 0;}
.md-image img{max-width:100%;border-radius:4px;border:2px solid var(--c-leftBorder);}
.md-image figcaption{font-size:.8em;color:#a07840;margin-top:4px;}
.md-pdf{width:100%;height:480px;border:1px solid var(--c-leftBorder);border-radius:4px;}
.media-missing{color:var(--c-dim);font-style:var(--font-empty);font-size:var(--body-item-sz);text-align:center;padding:8px 0;}

/* ── 響應式（由 JS 動態切換）──
   .stacked 由 fitLayout() 在 resize 時根據右欄實際渲染寬度動態加掛／移除，
   不使用 @media，因為左欄寬度會隨 scale 變動，無法用固定視口寬度計算臨界點。
   小螢幕保持 row 佈局：右欄以 position:fixed 藏於視口右側，#panelToggle 填滿空白區域；
   .show-right 時兩欄同時滑動換場。 */

/* 右欄退出至視口右側待機 */
.page-layout.stacked .right-panel{
  position:fixed;inset:36px;          /* 四邊各留 36px */
  background:var(--c-page);
  transform:translateX(100vw);        /* vw 確保完全退出，不受 inset 影響 */
  transition:transform .35s ease;
  z-index:50;
  overflow-y:auto;
  display:flex;flex-direction:column;
  border-radius:8px;
  border:1px solid var(--c-sep);
}
/* show-right：右欄滑入 */
.page-layout.stacked.show-right .right-panel{transform:translateX(0);}
/* 左欄平滑過渡；stacked 時水平置中 */
.page-layout.stacked{justify-content:center;}
.page-layout.stacked .left-panel{transition:transform .35s ease,opacity .35s ease;}
/* show-right：左欄向左滑出並淡出 */
.page-layout.stacked.show-right .left-panel{transform:translateX(calc(-100% - 36px));opacity:0;pointer-events:none;}

/* #panelToggle：fixed overlay，佔據左欄右側至右邊界的全部空白；left 由 JS 設置 */
#panelToggle{
  display:none;
  position:fixed;top:50%;right:0;transform:translateY(-50%);
  width:36px;height: 200px;
  /* left 動態注入 */
  align-items:center;justify-content:center;
  background:var(--c-default);border:none;border-left:1px solid var(--c-sep);
  cursor:pointer;z-index:10;writing-mode:vertical-rl;
  color:var(--c-dim);font-size:var(--body-sec-sz);letter-spacing:.15em;
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  transition:background .15s,color .15s;
}
#panelToggle:hover{background:var(--c-active);color:var(--c-accent);}
/* display 由 JS 的 updateToggle() 控制 */

/* #panelBack：fixed overlay，佔右欄左邊界至視口左側；right 由 JS 設置 */
#panelBack{
  display:none;
  position:fixed;top:50%;left:0;transform:translateY(-50%);
  width:36px;height:200px;
  align-items:center;justify-content:center;
  background:var(--c-default);border:none;border-right:1px solid var(--c-sep);
  cursor:pointer;z-index:10;
  color:var(--c-dim);font-size:var(--body-sec-sz);letter-spacing:.15em;
  writing-mode:vertical-rl;
  font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;
  transition:background .15s,color .15s;
}
#panelBack:hover{background:var(--c-active);color:var(--c-accent);}
/* display 由 JS 的 updateToggle() 控制 */

/* ── 設置彈窗 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;}
.modal-overlay.open{display:block;}
.settings-panel{
  position:fixed;
  top:var(--sp-top);
  left:36px;
  width:var(--panel-w);
  background:#1a1408;
  border:1px solid #4a3a18;
  border-radius:8px;
  padding:var(--sp-pad-v) var(--sp-pad-h) var(--sp-pad-h);
  z-index:101;
  box-shadow:0 4px 32px rgba(0,0,0,.65);
  color:#e8d5a3;
}
.settings-panel-title{font-size:var(--sp-title-sz);letter-spacing:.35em;color:var(--c-accent);margin-bottom:var(--sp-title-mb);padding-bottom:var(--sp-title-pb);border-bottom:1px solid var(--c-sep);}
.settings-close{position:absolute;top:var(--sp-close-t);right:var(--sp-close-r);background:none;border:none;color:var(--c-dim);font-size:var(--sp-close-sz);cursor:pointer;line-height:1;padding:2px 4px;transition:color .15s;font-family:inherit;}
.settings-close:hover{color:var(--c-accent);}
.prob-section-label{font-size:var(--subsec-sz);letter-spacing:var(--subsec-ls);color:var(--c-subsec);margin:var(--subsec-mt) 0 var(--subsec-mb);}
.prob-row{display:flex;align-items:center;padding:var(--sp-row-pv) 0;font-size:var(--inp-fsz);}
.prob-name{flex:0 0 50%;display:flex;align-items:center;overflow:hidden;color:var(--c-accent);letter-spacing:.1em;}
.prob-name-key{flex-shrink:0;font-family:monospace;}
.prob-name-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prob-pct-wrap{flex:0 0 25%;text-align:center;}
.prob-frac{flex:0 0 25%;text-align:right;}
.prob-frac{color:var(--c-main);font-family:"Menlo","Monaco","Courier New",monospace;letter-spacing:.05em;}

.settings-btn-action.danger:hover{background:#3a1818;color:#e07070;}
.source-merge-row{display:flex;justify-content:center;margin-top:8px;}

/* ══ 特效 ══ */

/* 筮卜完成：爻按鈕、數位格、序列輸入框持續點亮 */
.shibo-lit{box-shadow:0 0 10px rgba(240,192,64,.75);}
/* 筮卜記錄（于dropdown）：向內發光 + 背景提亮 */
.save-record.shibo-lit{background:rgba(240,192,64,.1);box-shadow:inset 0 0 5px rgba(240,192,64,.25);}
.save-record.shibo-lit:hover{background:rgba(240,192,64,.2);}
/* 刪除按鈕 */
.save-del{cursor:pointer;color:var(--c-dim);transition:color .15s;flex-shrink:0;user-select:none;transform:scale(1.5);}
.save-del:hover{color:#e06040;}
.save-edit{cursor:pointer;color:var(--c-dim);flex-shrink:0;user-select:none;font-size:var(--fs-ctrl);transition:color .15s;transform:scale(1.5);}
.save-edit:hover{color:var(--c-accent);}
/* 刪除確認畫面 */
.save-dd-confirm{padding:var(--dd-cv-pv) var(--dd-ph);}
.save-dd-confirm-title{font-size:var(--fs-rec);color:var(--c-accent);letter-spacing:.08em;margin-bottom:var(--dd-gap);text-align:center;}
.save-dd-confirm-preview{pointer-events:none;border-bottom:none;cursor:default;}
.save-dd-confirm-preview:hover{background:transparent;}
.save-dd-confirm-actions{display:flex;gap:var(--dd-gap);margin-top:var(--dd-cv-mt);}
.save-dd-confirm-btn{flex:1;padding:var(--dd-cv-btn-pv) var(--btn-ph);border:1px solid var(--c-border);background:var(--c-default);color:#7a6030;border-radius:5px;cursor:pointer;font-size:var(--fs-ctrl);letter-spacing:.1em;font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;transition:border-color .15s,background .15s,color .15s;}
.save-dd-confirm-btn:hover{border-color:var(--c-accent);color:var(--c-accent);}
.save-dd-confirm-btn.danger{border-color:#6a2010;color:#c06040;}
.save-dd-confirm-btn.danger:hover{border-color:#e06040;background:#1e0a06;color:#e06040;}
.save-dd-edit-fields{display:flex;flex-direction:column;gap:var(--dd-gap);margin-bottom:var(--dd-cv-mt);}
.save-dd-edit-input{width:100%;box-sizing:border-box;height:var(--ctrl-h);background:var(--c-inset);border:1px solid var(--c-border);border-radius:4px;color:var(--c-gold);font-size:var(--fs-ctrl);font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;outline:none;padding:0 6px;}
.save-dd-edit-input::placeholder{color:var(--c-dim);font-style:italic;}
.save-dd-edit-note{width:100%;box-sizing:border-box;min-height:60px;background:var(--c-inset);border:1px solid var(--c-border);border-radius:4px;color:var(--c-gold);font-size:var(--fs-ctrl);font-family:"PingFang SC","Noto Serif TC","Microsoft YaHei",serif;outline:none;padding:6px;resize:none;}
.save-dd-edit-note::placeholder{color:var(--c-dim);font-style:italic;}
.save-dd-edit-info{display:flex;align-items:center;justify-content:space-between;padding:var(--dd-pv) 0;}
.save-dd-edit-info-bits{font-size:var(--fs-mono);font-family:monospace;letter-spacing:.05em;}
.save-dd-edit-info-time{font-size:var(--fs-time);color:#ffffff;}
.rec-prop-table{display:flex;flex-direction:column;gap:3px;padding:var(--dd-pv) 0;}
.rec-prop-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:var(--fs-mono);font-family:monospace;}
.rec-prop-key{color:var(--c-accent);flex-shrink:0;}
.rec-prop-val{text-align:right;min-width:0;}
.rec-prop-val--sm{font-size:var(--fs-time);}
.rec-prop-val--clamp{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;}
/* 淡出動畫 *//* 筮卜完成發光 */
.shibo-btn.shibo-complete{border-color:var(--c-gold);background:var(--c-active);color:var(--c-gold);animation:shibo-glow 3s ease-out forwards;}
.btn-flash{animation:btn-flash 2s ease-out forwards;}
@keyframes btn-flash{
  0%  {box-shadow:0 0 0 rgba(240,192,64,0);background:var(--c-default);color:var(--c-dim);border-color:var(--c-border);}
  12% {box-shadow:0 0 18px rgba(240,192,64,.7),inset 0 0 10px rgba(240,192,64,.15);background:var(--c-accent);color:var(--c-default);border-color:transparent;}
  100%{box-shadow:0 0 0 rgba(240,192,64,0);background:var(--c-default);color:var(--c-dim);border-color:var(--c-border);}
}
@keyframes shibo-glow{
  0%  {box-shadow:0 0 0 rgba(240,192,64,0);background:var(--c-active);color:var(--c-gold);border-color:var(--c-gold);}
  12% {box-shadow:0 0 22px rgba(240,192,64,.7),inset 0 0 12px rgba(240,192,64,.15);background:var(--c-accent);color:var(--c-default);border-color:transparent;}
  100% {background:var(--c-active);color:var(--c-gold);border-color:var(--c-gold);}
  100%{box-shadow:0 0 0 rgba(240,192,64,0);background:var(--c-active);color:var(--c-gold);border-color:var(--c-gold);}
}

/* 通用斜線特效（爻變開啓、卦象按鈕、展示按鈕共用） */
.slash-fx{position:relative;overflow:hidden;}
.slash-fx::before,.yao-bian-btn.active::before,.show-hex-btn.show-hex-quat::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(45deg,transparent 0px,transparent 20px,currentColor 20px,currentColor 40px);background-size:57px 100%;animation:slash-scroll 2.5s linear infinite,slash-lum 5.0s ease-in-out infinite;}
@keyframes slash-scroll{
  from{background-position-x:0}
  to{background-position-x:57px}
}
@keyframes slash-lum{
  0%,100%{color:#000000;filter:drop-shadow(0 0 8px rgba(0,0,0,.90));}
  50%{color:#ffffff;filter:drop-shadow(0 0 8px rgba(255,255,255,.45));}
}

/* 爻位按鈕變爻特效 */
.yao-btn.y6{
  color:#ffffff;
  background-image:repeating-linear-gradient(
    45deg,transparent 0px,transparent 20px,currentColor 20px,currentColor 40px
  );
  background-size:57px 100%;
  animation:slash-scroll 2.5s linear infinite;
}
.yao-btn.y9{
  color:#000000;
  background-image:repeating-linear-gradient(
    45deg,transparent 0px,transparent 20px,currentColor 20px,currentColor 40px
  );
  background-size:57px 100%;
  animation:slash-scroll 2.5s linear infinite;
}

/* 數位按鈕變爻特效（y6=老陰 y7=陽靜 y8=陰靜 y9=老陽） */
.bit-toggle.y6{border-color:#5090e0;color:var(--y6-tx);background:#0a1428;position:relative;overflow:hidden;}
.bit-toggle.y7{border-color:#50b060;color:var(--y7-tx);background:#0a1e10;position:relative;overflow:hidden;}
.bit-toggle.y8{border-color:#e8c84c;color:var(--y8-tx);background:#2a1e04;position:relative;overflow:hidden;}
.bit-toggle.y9{border-color:#e87050;color:var(--y9-tx);background:#281008;position:relative;overflow:hidden;}
/* 靜爻（y7/y8）斜線慢速滾動，變爻（y6/y9）快速+色彩脈衝 */
.bit-toggle.y7::before,.bit-toggle.y8::before{
  content:'';
  position:absolute;inset:0;border-radius:4px;
  pointer-events:none;
  opacity:.50;
  background:repeating-linear-gradient(
    45deg,
    transparent 0px,transparent 20px,
    currentColor 20px,currentColor 40px
  );
  background-size:57px 100%;
  animation:slash-scroll 10.0s linear infinite;
}
.bit-toggle.y6::before,.bit-toggle.y9::before{
  content:'';
  position:absolute;inset:0;border-radius:4px;
  pointer-events:none;
  opacity:.50;
  background:repeating-linear-gradient(
    45deg,
    transparent 0px,transparent 20px,
    currentColor 20px,currentColor 40px
  );
  background-size:57px 100%;
}
.bit-toggle.y6::before{animation:slash-scroll 2.5s linear infinite,bit-lum-6 5.0s ease-in-out infinite;}
.bit-toggle.y9::before{animation:slash-scroll 2.5s linear infinite,bit-lum-9 5.0s ease-in-out infinite;}
@keyframes bit-lum-6{
  0%,100%{color:#80b8f8;filter:drop-shadow(0 0 4px rgba(128,184,248,.80));}
  50%    {color:#70d080;filter:drop-shadow(0 0 4px rgba(112,208,128,.80));}
}
@keyframes bit-lum-9{
  0%,100%{color:#f08050;filter:drop-shadow(0 0 4px rgba(240,128,80,.80));}
  50%    {color:var(--c-gold);filter:drop-shadow(0 0 4px rgba(240,192,64,.80));}
}

/* ── app loader（整體載入指示）──────────────────────────────────────────────
   背景不透明，第一幀就蓋住尚未初始化的畫面；spinner 本身初始為 opacity:0，
   熬過 --loader-budget 才淡入 —— 載入夠快時使用者根本看不到它。
   時間預算用 CSS animation-delay 實作而非 JS timer：初始化是同步的，會卡住
   主執行緒，setTimeout 不可能在其間觸發；opacity/transform 動畫則在合成執行
   緒上跑，卡住期間照樣前進。初始化一結束就整個移除，不設最短顯示時間。    */
#appLoader{position:fixed;inset:0;z-index:10100;background:var(--c-page);display:flex;align-items:center;justify-content:center;}
#appLoader.done{display:none;}
.loader-spin{width:var(--loader-sz);height:var(--loader-sz);border:var(--loader-bw) solid var(--c-border);border-top-color:var(--c-gold);border-radius:50%;opacity:0;will-change:opacity,transform;animation:loaderFade .18s ease var(--loader-budget) forwards,loaderSpin .9s linear infinite;}
@keyframes loaderFade{to{opacity:1;}}
@keyframes loaderSpin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){
  .loader-spin{animation:loaderFade .18s ease var(--loader-budget) forwards;}
}

/* ── 語言切換 ── */
#btnLang{position:fixed;top:6px;left:6px;width:16px;height:16px;padding:0;font-size:16px;line-height:16px;text-align:center;background:none;border:none;cursor:pointer;z-index:10002;color:var(--c-dim);transition:color .15s;}
#btnLang:hover{color:var(--c-accent);}
#langDropdown{position:fixed;top:26px;left:4px;background:var(--c-default);border:1px solid var(--c-border);border-radius:5px;padding:4px 0;z-index:10002;display:none;min-width:72px;}
#langDropdown.open{display:block;}
#langDropdown button{display:block;width:100%;background:none;border:none;color:var(--c-dim);text-align:left;padding:3px 10px;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:.05em;}
#langDropdown button:hover{color:var(--c-accent);}
#langDropdown button.active{color:var(--c-gold);}
#btnEditText{position:fixed;top:6px;right:6px;width:16px;height:16px;padding:0;font-size:16px;line-height:16px;text-align:center;background:none;border:none;cursor:pointer;z-index:9999;color:var(--c-dim);transition:color .15s;}
#btnEditText:hover{color:var(--c-accent);}
#btnEditText.edit-active{color:var(--c-gold);}
#btnEditText:disabled{opacity:.3;cursor:default;pointer-events:none;}
#textEditorWrap{flex:1;display:none;flex-direction:column;padding-bottom:48px;min-height:0;}
#textEditorWrap.open{display:flex;}
#textEditorBody{flex:1;min-height:0;display:flex;gap:8px;}
.text-editor-area{flex:1;min-height:0;background:var(--c-page);color:var(--c-accent);border:1px solid var(--c-border);border-radius:5px;padding:8px;font-family:inherit;font-size:var(--body-yao-sz);resize:none;outline:none;line-height:1.6;}
.text-editor-area:focus{border-color:var(--c-accent);}
.text-editor-actions{display:flex;gap:8px;margin-top:6px;flex-shrink:0;}
#btnConfig{position:fixed;top:6px;left:38px;width:16px;height:16px;padding:0;font-size:16px;line-height:16px;text-align:center;background:none;border:none;cursor:pointer;z-index:9999;color:var(--c-dim);transition:color .15s;}

#btnSource{position:fixed;top:6px;left:70px;width:16px;height:16px;padding:0;font-size:16px;line-height:16px;text-align:center;background:none;border:none;cursor:pointer;z-index:9999;color:var(--c-dim);transition:color .15s;}
#btnSource:hover{color:var(--c-accent);}
body.stacked-right #btnLang,body.stacked-right #btnConfig,body.stacked-right #btnSource{display:none !important;}
body.stacked-left #btnEditText{display:none !important;}
.left-window{position:absolute;inset:0;background:var(--c-default);display:none;flex-direction:column;z-index:10001;overflow:hidden;}
.left-window.open{display:flex;}
.left-window .settings-panel-title{padding:var(--sp-pad-v) var(--sp-pad-h) var(--sp-pad-h);}
.left-window .settings-actions{margin:0;padding:var(--sp-act-pt) var(--sp-pad-h) var(--sp-pad-h);}
.source-body{flex:1;padding:var(--win-body-pt,0) var(--sp-pad-h) var(--win-body-pt,0);display:flex;flex-direction:column;gap:var(--src-body-gap,14px);overflow:auto;min-height:0;}
.source-row{display:flex;flex-direction:row;align-items:flex-start;justify-content:space-between;}
.source-label-col{display:flex;flex-direction:column;gap:var(--src-cap-gap);}
.source-caption{font-size:var(--src-cap-fsz);color:var(--c-dim);line-height:1.2;}
.source-label{font-size:var(--inp-fsz);color:var(--c-dim);font-family:monospace;letter-spacing:0;}
.source-label--loaded{color:var(--c-gold);transition:color .2s;}
.source-input{background:var(--c-page);color:var(--c-gold);border:1px solid var(--c-border);border-radius:4px;padding:6px 8px;font-family:monospace;font-size:var(--win-text-sz);outline:none;width:100%;box-sizing:border-box;}
.source-input:focus{border-color:var(--c-accent);}
.config-body{flex:1;overflow-y:auto;padding:0 var(--sp-pad-h,12px);display:flex;flex-direction:column;gap:var(--cfg-body-gap);min-height:0;}
.config-section{display:flex;flex-direction:column;gap:var(--cfg-sec-gap);}
.config-section--grow{flex:1;min-height:0;}
.config-section--grow textarea{flex:1;min-height:0;}
.config-section-title{font-size:var(--subsec-sz);letter-spacing:var(--subsec-ls);color:var(--c-subsec);padding-bottom:2px;border-bottom:1px solid var(--c-border);display:flex;align-items:flex-start;justify-content:space-between;}
.config-row{display:flex;align-items:center;gap:var(--cfg-sec-gap);}
.config-label{font-size:var(--inp-fsz);color:var(--c-accent);font-family:monospace;white-space:nowrap;min-width:var(--cfg-label-w);}
.config-input{background:var(--c-page);color:var(--c-gold);border:1px solid var(--c-border);border-radius:4px;padding:var(--cfg-inp-pv) var(--cfg-inp-ph);font-family:monospace;font-size:var(--inp-fsz);flex:1;min-width:0;height:var(--cfg-input-h);box-sizing:border-box;}
.config-input:focus{outline:none;border-color:var(--c-accent);}
#cfg-tri-newprop::placeholder,#cfg-custom-text::placeholder,.cfg-hex-ci::placeholder{color:var(--c-dim);font-style:var(--font-empty);}
.config-input--color{width:var(--cfg-color-w);padding:var(--cfg-color-pv) var(--cfg-color-ph);flex:0 0 var(--cfg-color-w);cursor:pointer;}
.config-input--num{width:var(--cfg-num-w);flex:0 0 var(--cfg-num-w);text-align:center;margin-left:auto;}
select.config-input{-webkit-appearance:none;appearance:none;cursor:pointer;background:var(--c-opt);direction:rtl;text-align:right;}
select.config-input option{direction:ltr;text-align:left;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{appearance:textfield;}
.config-input--sm{width:var(--cfg-tri-inp-w);min-width:0;box-sizing:border-box;text-align:center;}
.cfg-toggle{min-width:calc(var(--cfg-tri-inp-w) * 1.4);height:var(--cfg-input-h);border:1px solid var(--c-border);background:var(--c-default);color:var(--c-dim);border-radius:4px;font-size:var(--inp-fsz);font-family:monospace;cursor:pointer;box-sizing:border-box;transition:border-color .15s,background .15s,color .15s;}
.cfg-toggle::after{content:'OFF';}
.cfg-toggle.on{border-color:var(--c-accent);background:var(--c-active);color:var(--c-gold);}
.cfg-toggle.on::after{content:'ON';}
.cfg-toggle:disabled{opacity:.3;cursor:not-allowed;}
/* cfg-slot：三態各為獨立 class、四項視覺屬性全顯式（仿 .bit-toggle.y6-y9）；不依賴「無 class 回退」 */
.cfg-slot-row{display:flex;gap:var(--cfg-sec-gap);margin-top:4px;}
.cfg-slot{-webkit-appearance:none;appearance:none;flex:0 0 calc((100% - 5 * var(--cfg-sec-gap)) / 6);min-width:0;height:var(--cfg-input-h);border-radius:4px;font-size:var(--inp-fsz);font-family:monospace;cursor:pointer;box-sizing:border-box;}
.cfg-slot-row--half .cfg-slot{flex-basis:calc((100% - var(--cfg-sec-gap)) / 2);}
.cfg-slot-dim{background:transparent;border:1px solid var(--c-border);color:var(--c-dim);opacity:.4;}
/* primary＝標準 .btn-inverted；secondary＝btn-inverted 之調暗覆蓋（需 !important 蓋過 btn-inverted 的 !important） */
.cfg-slot-normal{background:#625124!important;color:var(--c-gold)!important;}/* = c-accent 40% + c-default 60% */

.add-btn--confirm:hover{color:var(--c-gold);}

.add-btn--area:hover{border-color:#40c060;}
.rm-btn{background:none;border:none;color:var(--c-dim);cursor:pointer;padding:0;line-height:1;user-select:none;transition:color .15s;font-size:var(--fs-rec);}
.rm-btn:hover{color:#e06040;}
.config-th-rm-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.config-table{width:100%;border-collapse:collapse;font-size:var(--inp-fsz);}
.config-th{color:var(--c-accent);font-family:monospace;font-weight:normal;padding:var(--cfg-cell-pv) var(--cfg-cell-ph);white-space:nowrap;text-align:left;}

.config-th--add,.config-td--add{width:var(--cfg-tri-inp-w);padding:0;}

.config-tri-wrap{overflow-x:auto;overflow-y:hidden;padding-bottom:var(--cfg-tri-wrap-pb);flex:1;min-width:0;background:var(--c-inset);border-radius:4px;}
.config-section--tri{background:var(--c-default);border-radius:4px;padding:6px 6px 6px 0;}
/* 選擇器驅動欄位的深色底卡（hexagrams / table）：僅背景，非獨立捲動容器；行距沿用 --cfg-sec-gap。
   底色同 .config-tri-wrap 的 --c-inset（視窗本身即 --c-default，用它會看不見） */
.config-card{background:var(--c-inset);border-radius:4px;padding:6px;display:flex;flex-direction:column;gap:var(--cfg-sec-gap);}
.config-tri-sym-col{width:auto;flex-shrink:0;}
.config-tri-sym-col td.config-td{white-space:nowrap;padding-right:0;}
.config-color-wrap{position:relative;display:inline-flex;width:var(--cfg-tri-inp-w);height:var(--cfg-input-h);flex-shrink:0;cursor:pointer;vertical-align:middle;}
.config-color-wrap input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0;border:none;}
.config-color-preview{position:absolute;inset:0;border-radius:4px;border:1px solid var(--c-border);pointer-events:none;box-sizing:border-box;}
.config-preset{background:var(--c-inset);border:1px solid var(--c-border);border-radius:4px;padding:var(--cfg-preset-pv) var(--cfg-preset-ph);display:flex;flex-direction:column;gap:var(--cfg-preset-gap);}
.config-subsec{font-size:var(--inp-fsz);color:var(--c-accent);font-family:monospace;letter-spacing:.05em;margin-top:4px;}
:lang(en), :lang(en) *{font-family:"EB Garamond","Garamond","Georgia",serif !important;letter-spacing:0 !important;}
.mono{font-family:monospace;}
:is(:lang(en),:lang(tc),:lang(sc)) code,:is(:lang(en),:lang(tc),:lang(sc)) .prob-frac,:is(:lang(en),:lang(tc),:lang(sc)) .prob-pct,:is(:lang(en),:lang(tc),:lang(sc)) .config-subsec,:is(:lang(en),:lang(tc),:lang(sc)) .bit-toggle,:is(:lang(en),:lang(tc),:lang(sc)) .num-input,:is(:lang(en),:lang(tc),:lang(sc)) .source-label,:is(:lang(en),:lang(tc),:lang(sc)) .mono,:is(:lang(en),:lang(tc),:lang(sc)) .preset-ratio,:is(:lang(en),:lang(tc),:lang(sc)) .preset-ratio *,:is(:lang(en),:lang(tc),:lang(sc)) .prob-name-key,:is(:lang(en),:lang(tc),:lang(sc)) .config-input--num,:is(:lang(en),:lang(tc),:lang(sc)) .config-mono,:is(:lang(en),:lang(tc),:lang(sc)) .config-mono *,:is(:lang(en),:lang(tc),:lang(sc)) .save-dropdown,:is(:lang(en),:lang(tc),:lang(sc)) .save-dropdown *:not(.dd-title,.dd-hint,.dd-up-input,.sr-name,.sr-field,.sr-snip,.sr-hit,.sr-none),:is(:lang(en),:lang(tc),:lang(sc)) .rec-prop-table,:is(:lang(en),:lang(tc),:lang(sc)) .rec-prop-table *{font-family:"Menlo","Monaco","Courier New",monospace !important;}

.source-section-label{font-size:var(--subsec-sz);color:var(--c-subsec);letter-spacing:var(--subsec-ls);padding-bottom:2px;border-bottom:1px solid var(--c-border);margin-top:var(--src-sec-mt,4px);margin-bottom:var(--src-sec-mb,4px);}
.source-file-label{display:flex;align-items:center;gap:var(--src-label-gap,6px);cursor:pointer;}
.source-file-label input[type=file]{display:none;}
.source-file-label span{display:flex;align-items:center;justify-content:center;color:var(--c-gold);border:1px solid var(--c-border);border-radius:4px;padding:var(--src-file-pv,4px);background:var(--c-default);transition:border-color .15s,color .15s;}
.source-file-label:hover span{border-color:var(--c-accent);color:var(--c-accent);}
.source-dl-btn{display:flex;align-items:center;justify-content:center;color:var(--c-gold);border:1px solid var(--c-border);border-radius:4px;padding:var(--src-file-pv,4px);background:var(--c-default);transition:border-color .15s,color .15s;cursor:pointer;}
.source-dl-btn:hover{border-color:var(--c-accent);color:var(--c-accent);}
</style>

<body>
<div id="appLoader"><div class="loader-spin"></div></div>
<button id="btnLang" onclick="langSwitchClick()" class="tip-below no-fit" data-tip="" data-i18n-tip="btn.lang_tip">🌐</button>
<div id="langDropdown">
  <button data-lang="tc" onclick="setLang('tc')">繁中</button>
  <button data-lang="sc" onclick="setLang('sc')">简中</button>
  <button data-lang="en"    onclick="setLang('en')">EN</button>
  <button data-lang="ja"    onclick="setLang('ja')">日本語</button>
  <button data-lang="ko"    onclick="setLang('ko')">한국어</button>
</div>
<button id="btnConfig" onclick="configOpen()" class="tip-below no-fit" data-tip="" data-i18n-tip="btn.config_tip">🛠️</button>
<button id="btnSource" onclick="sourceOpen()" class="tip-below no-fit" data-tip="" data-i18n-tip="btn.source_tip">📄</button>
<button id="btnEditText" onclick="toggleEditMode()" class="tip-below no-fit" data-tip="" data-i18n-tip="btn.edit_tip" style="display:none">📝</button>
<div class="page-layout">

  <!-- 左欄：輸入 -->
  <div class="left-panel">
    <div class="yao-col">
      <div class="tri-buttons">
        <div class="tri-bg-num"   id="upperNum">0</div>
        <div class="tri-bg-char"  id="upperChar">坤</div>
        <div class="tri-bg-thing" id="upperThing">地</div>
        <button class="yao-btn" id="btn5" type="button"></button>
        <button class="yao-btn" id="btn4" type="button"></button>
        <button class="yao-btn" id="btn3" type="button"></button>
      </div>
      <div class="hex-sep"></div>
      <div class="tri-buttons">
        <div class="tri-bg-num"   id="lowerNum">0</div>
        <div class="tri-bg-char"  id="lowerChar">坤</div>
        <div class="tri-bg-thing" id="lowerThing">地</div>
        <button class="yao-btn" id="btn2" type="button"></button>
        <button class="yao-btn" id="btn1" type="button"></button>
        <button class="yao-btn" id="btn0" type="button"></button>
      </div>
      <div class="bit-row" id="bitBoxes"></div>
      <div class="num-ctrl">
        <button class="search-btn" id="btnSearch" type="button" onclick="searchClick()" data-tip="" data-i18n-tip="btn.history_tip"></button>
        <button class="num-arrow" type="button" onclick="stepNum(-1)">◀</button>
        <input  class="num-input" id="numDisplay" type="text" value="2">
        <button class="num-arrow" type="button" onclick="stepNum(1)">▶</button>
        <button class="lock-btn" id="btnLock" type="button" onclick="toggleLock()"></button>
      </div>
      <button class="yao-bian-btn" id="btnYaoBian" type="button" onclick="yaoBian()" data-i18n="btn.yao_bian.off"></button>
      <div class="shibo-row">
        <button class="shibo-btn" id="btnShibo" type="button" onclick="shiboClick()" data-i18n="btn.shibo"></button>
        <button class="settings-btn" id="btnSettings" type="button" onclick="settingsClick()"></button>
        <button class="settings-btn" id="btnSave" type="button" onclick="saveClick()" data-tip="" data-i18n-tip="btn.save_tip"></button>
        <div id="shiboNamePop" style="display:none"></div>
      </div>
      <div id="shiboNameBadge" style="display:none"></div>
      <div id="saveNamePop" style="display:none"></div>
      <div class="save-dropdown save-dropdown--up" id="saveDropdownUp"></div>
      <div class="save-dropdown" id="saveDropdown"></div>
      <div class="msg" id="msgBox"></div>
      <div class="tab-bar" style="margin-top:6px;">
        <button class="tab-btn active" id="btnTab1" onclick="setTab('tab1')"></button>
        <button class="tab-btn"        id="btnTab2" onclick="setTab('tab2')"></button>
        <button class="tab-btn"        id="btnTab3" onclick="setTab('tab3')"></button>
        <button class="tab-btn"        id="btnGuaxiang" onclick="setTab('guaxiang')"></button>
      </div>
    </div>
    <div id="configOverlay" class="left-window">
      <button class="settings-close" onclick="configClose()">×</button>
      <div class="settings-panel-title"><span data-i18n="cfg.title"></span><br><span class="mono" style="font-size:var(--inp-fsz);color:var(--c-dim);letter-spacing:0;font-weight:normal">config.json</span></div>
      <div id="configBody" class="config-body"></div>
      <div class="settings-actions">
        <button class="settings-btn-action" onclick="configClose()" data-i18n="btn.cancel"></button>
        <button id="cfgSaveBtn" class="settings-btn-action" onclick="configSave()" disabled data-i18n="btn.save_action"></button>
      </div>
    </div>
    <div id="sourceOverlay" class="left-window">
      <button class="settings-close" onclick="sourceClose()">×</button>
      <div class="settings-panel-title" data-i18n="source.title"></div>
      <div class="source-body">
        <div class="source-section-label" data-sec-title="source.load_label"></div>
        <div class="source-row">
          <div class="source-label-col"><span class="source-label" data-i18n="source.path_label" data-src="md"></span><span class="source-caption" data-i18n="source.md_desc"></span></div>
          <label class="source-file-label"><input type="file" accept=".md,text/plain" onchange="sourceLoadFile('md',this)"><span></span></label>
        </div>
        <div class="source-row">
          <div class="source-label-col"><span class="source-label" data-i18n="source.cfg_label" data-src="cfg"></span><span class="source-caption" data-i18n="source.cfg_desc"></span></div>
          <label class="source-file-label"><input type="file" accept=".json" onchange="sourceLoadFile('cfg',this)"><span></span></label>
        </div>
        <div class="source-row">
          <div class="source-label-col"><span class="source-label" data-i18n="source.saves_label" data-src="saves"></span><span class="source-caption" data-i18n="source.saves_desc"></span></div>
          <label class="source-file-label"><input type="file" accept=".json" onchange="sourceLoadFile('saves',this)"><span></span></label>
        </div>
        <div class="source-section-label" data-sec-title="source.export_label"></div>
        <div class="source-row">
          <div class="source-label-col"><span class="source-label" data-src="md">text.md</span><span class="source-caption" data-i18n="source.md_desc"></span></div>
          <button class="source-dl-btn" onclick="sourceDownload('md')"></button>
        </div>
        <div class="source-row">
          <div class="source-label-col"><span class="source-label" data-src="cfg">config.json</span><span class="source-caption" data-i18n="source.cfg_desc"></span></div>
          <button class="source-dl-btn" onclick="sourceDownload('cfg')"></button>
        </div>
        <div class="source-row">
          <div class="source-label-col"><span class="source-label" data-src="saves">saves.json</span><span class="source-caption" data-i18n="source.saves_desc"></span></div>
          <button class="source-dl-btn" onclick="sourceDownload('saves')"></button>
        </div>
      </div>
      <div class="settings-actions">
        <button class="settings-btn-action primary" onclick="sourceClose()" data-i18n="btn.ok"></button>
      </div>
    </div>
    <div id="editRecordOverlay" class="left-window">
      <button class="settings-close" onclick="editRecordClose()">×</button>
      <div class="settings-panel-title"><span data-i18n="record.edit_title"></span><br><span class="mono" style="font-size:var(--inp-fsz);color:var(--c-dim);letter-spacing:0;font-weight:normal">saves.json</span></div>
      <div id="editRecordBody" class="config-body"></div>
      <div class="settings-actions">
        <button class="settings-btn-action" onclick="editRecordClose()" data-i18n="btn.cancel"></button>
        <button class="settings-btn-action" onclick="editRecordSave()" data-i18n="btn.save_action"></button>
      </div>
    </div>
  </div>

  <!-- 右欄：結果 -->
  <div class="right-panel">
    <div class="hex-header" id="hexHeader">
      <div class="hex-symbol" id="hexSymbol"></div>
      <div class="hex-name"   id="hexName"></div>
      <div class="hex-meta"   id="hexMeta"></div>
    </div>
    <div id="contentArea"></div>
    <div id="textEditorWrap">
      <div id="textEditorBody">
        <textarea id="textEditorArea" class="text-editor-area" spellcheck="false"></textarea>
      </div>
      <div class="text-editor-actions">
        <button id="teditSaveBtn" class="settings-btn-action" onclick="saveTextEdit()" data-i18n="btn.save_action"></button>
        <button class="settings-btn-action" onclick="cancelTextEdit()" data-i18n="btn.cancel"></button>
      </div>
    </div>
  </div>

</div>

<!-- 小螢幕切換按鈕（fixed overlay，位置由 JS 動態設置） -->
<button id="panelToggle" type="button" onclick="togglePanel()" data-i18n="nav.to_result"></button>
<button id="panelBack"   type="button" onclick="togglePanel()" data-i18n="nav.to_control"></button>

<!-- 設置彈窗 -->
<div class="modal-overlay" id="dimOverlay" style="z-index:10000"></div>
<div class="modal-overlay" id="saveOverlay"></div>

<div class="modal-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <button class="settings-close" type="button" onclick="settingsClose()">×</button>
    <div class="settings-panel-title" data-i18n="panel.settings.title"></div>
    <div id="settingsContent"></div>
  </div>
</div>

<div class="modal-overlay" id="mergeConfirmOverlay" style="z-index:1000">
  <div class="settings-panel">
    <button class="settings-close" type="button" onclick="mergeOverrideClose()">×</button>
    <div class="settings-panel-title" data-i18n="panel.merge.title"></div>
    <div class="sp-body-text" data-i18n="panel.merge.body"></div>
    <div class="settings-actions">
      <button class="settings-btn-action" onclick="mergeOverrideClose()" data-i18n="btn.cancel"></button>
      <button class="settings-btn-action danger" onclick="mergeOverrideConfirm()" data-i18n="btn.confirm_merge"></button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="confirmOverlay">
  <div class="settings-panel">
    <button class="settings-close" type="button" onclick="confirmClose()">×</button>
    <div class="settings-panel-title" data-i18n="panel.reset.title"></div>
    <div class="sp-body-text" data-i18n="panel.reset.body"></div>
    <div class="settings-actions">
      <button class="settings-btn-action" onclick="confirmClose()" data-i18n="btn.cancel"></button>
      <button class="settings-btn-action primary" onclick="confirmReset()" data-i18n="btn.confirm_reset"></button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="configErrorOverlay">
  <div class="settings-panel">
    <button class="settings-close" type="button" onclick="configErrorClose()">×</button>
    <div class="settings-panel-title" data-i18n="panel.error.title"></div>
    <div class="sp-body-text" data-i18n="panel.error.body"></div>
    <div class="settings-actions">
      <button class="settings-btn-action primary" onclick="configErrorClose()" data-i18n="btn.ok"></button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="sourceErrOverlay" style="z-index:1000">
  <div class="settings-panel">
    <button class="settings-close" type="button" onclick="sourceErrClose()">×</button>
    <div class="settings-panel-title" data-i18n="source.load_err"></div>
    <div class="sp-body-text" id="sourceErrBody"></div>
    <div class="settings-actions">
      <button class="settings-btn-action primary" onclick="sourceErrClose()" data-i18n="btn.ok"></button>
    </div>
  </div>
</div>

인(利見大人) 전(田)에 용이 드러난다.  대인을 뵈오니 이롭다.","九三: 군자종일건건 석척약려 무구(君子終日乾乾，夕惕若厲，无咎) 군자는 종일 힘쓴다， 힘씀에 끝마무리까지 염려한다. 허물이 없다.","九四: 혹약재연 무구(或躍在淵，无咎) 혹 도약하더라도 연(淵)못이니 허물이 없다.","九五: 비룡재천(飛龍在天) 이견대인(利見大人) 뜻하는바를 펼친다. 대인을 만나니 이롭다.","上九: 항룡유회(亢龍有悔) 항룡은 하늘과 더불어야하는 자신의 처지를 살피니 자신의 부족함을 뉘우친다.","용구(用九) 현군룡무수(見羣龍無首) 길(吉) 양효(陽爻) 구(九)를 씀에，용의 무리를 만나 서로가 도우니，길하다."]},{"num":2,"name":"곤위지(坤爲地)","sequence":"000000","symbol":"䷁","short_name":"곤(坤)","ci":["곤(坤)은 원형(元亨), 이빈마지정(利牝馬之貞) 군자유유왕(君子有攸往) 선미후득주리(先迷後得主利) 서남득붕(西南得朋) 동북상붕(東北喪朋) 안정길(安貞吉)","初六: 리상(履霜)，견빙지(堅冰至) 서리를 밟으나  얼음이 딱딱히 굳었다.","六二: 직방대(直方大)，불습무불리(不習無不利) 곧고 떳떳한 바가 크니，배움이 없어도 불리하지 않다.","六三: 함장가정(含章可貞) 혹종왕사(或從王事)，무성유종(無成有終) 절제하는 바로 바를 수 있다. 왕사를 쫓으나 이룸은 없고 끝은 있다.","六四: 괄낭(括囊)，무구무예(无咎无譽) 주머니를 동여메니 허물도 없고 명예도 없다.","六五: 황상(黃裳),원길(元吉) 노랑색 치마는 길함의 근원이다.","上六: 용전어야(龍戰于野)，기혈현황(其血玄黃) 용은 하늘에 거하고  그 다툼으로 피는 땅이 받는다.","용육(用六) ，이영정(利永貞) 음효(陰爻) 육(六)을 씀에 이로움은 꾸준히 절제하기 때문이다."]},{"num":3,"name":"수뢰둔(水雷屯)","sequence":"100010","symbol":"䷂","short_name":"둔(屯)","ci":["둔(屯)은  원형이정(元亨利貞) 물용유유왕(勿用有攸往) 이건후(利建侯)","初九: 반환(磐桓) 이거정(利居貞) 이건후(利建侯) 머뭇거린다. 조신하게 거함이 이롭다. 대립(代立)이 이로움이 있다.","六二: 준여전여(屯如邅如) 승마반이(乘馬班如) 비구혼구(匪寇婚媾) 여자정부자(女子貞不字)십년내자(十年乃字) 둔(屯)은 어려움같다.  머뭇거림같다. 말을 타고 서성거린다. 도적이 아니면 혼사로 화친한다. 여자가 정(貞)하여 정(定)하지 않다가 십년 내에 정혼하다.","六三: 즉록무여(即鹿無虞) 유입어임중(惟入于林中) 군자기불여석(君子幾不如舍) 왕린(往吝) 사슴이 염려함이 없음은  산속에 오직 들어가 있음이다. 군가가 자세히 살펴 벌여놓지 않는다. 가는 바를 아낀다.","六四: 승마반이(乘馬班如) 구혼구왕(求婚媾往) 길무불리(吉無不利) 말을 타고 돌아온다. 혼사를 구하러 간다. 길하고 불리함이 없다.","九五: 둔기고(屯其膏)소정길(小貞吉)대정흉(大貞凶) 둔은 장차 고약이다. 작은 것에서 길하고 큰 것에서 흉하다.","上六: 승마반이(乘馬班如) 읍혈련이(泣血漣如) 말을 타고 돌아온다. 피눈물을 흘린다."]},{"num":4,"name":"산수몽(山水蒙)","sequence":"010001","symbol":"䷃","short_name":"몽(蒙)","ci":["몽(蒙)은 형(亨)이다. 비아구동몽(匪我求童蒙) 동몽구아(童蒙求我)  초서고재삼독(初筮告再三瀆) 독즉불고(瀆則不告) 이정(利貞)","初六: 발몽(發蒙)  ，이용형인(利用刑人)，용탈질곡(用說桎梏) 이왕린(以往吝) 사람이 모범을 따르게함이 이로운바는 교화이다. 마땅이 갈바를 어여삐여김에 법을 베푼다.","九二: 포몽길납부길자극가(包蒙吉，納婦吉，子克家) 아이를 감싸니 길하다. 아내를 받아들이니 길하다. 사람이 집을 다스린다.","六三: 물용취녀현금부불유궁무유리(勿用取女，見金夫，不有躬，无攸利) 여자는 취하는것이 아니다. 귀한사람을 맞이하는것이다. 스스로 하는바가 없으면 이로운바가 없다.","六四: 곤몽린(困蒙，吝) 어리석어 곤란하다. 주저한다.","六五: 동몽길(童蒙，吉) 어린아이와 같다 길하다.","上九: 격몽불리위구이어구(擊蒙，不利為寇，利禦寇) (자신의)어리석은바를 맞딱뜨리다.  난리를 당하면 불리하나 제어하면 이롭다."]},{"num":5,"name":"수천수(水天需)","sequence":"111010","symbol":"䷄","short_name":"수(需)","ci":["수(需)는  유부광형정길(有孚，光亨，貞吉) 이섭대천(利涉大川)","初九: 수어교이용항무구(需于郊，利用恒，无咎) 공급은 경계에서 늘 이용되는바로 이롭다. 허물이없다.","九二: 수어사소유언종길(需于沙，小有言，終吉) 모래땅에서 주고받음은 말이 있으나 적고 끝은 길하다.","九三: 수우니치구지(需于泥，致寇至) 진흙에서 주고받음은  난리(亂離)에 이른다.","六四: 수어혈출자혈(需于血，出自穴) 다툼에서 주고받음은 스스로 안전한곳에서 나오는것이다.","九五: 수어주식정길(需于酒食，貞吉) 주식에서 주고받음은 바르고 길하다.","上六: 입어혈유불속지객심인래경지종길(入于穴，有不速之客三人來，敬之終吉) 구멍으로 들어간다. 서두르지않는 손님3명이 올바가있다. 끝이 길함을 존중한다."]},{"num":6,"name":"천수송(天水訟)","sequence":"010111","symbol":"䷅","short_name":"송(訟)","ci":["송(訟)은 유부질척중길종흉(有孚，窒，惕，中吉，終凶) 이현대인불리섭대천(利見大人，不利涉大川)","初六: 불영소사 소유언 종길(不永所事，小有言，終吉) 일은 길지 않다. 말은 적다. 끝은 길하다.","九二: 불극송 귀이포 기읍인삼백호무생(不克訟，歸而逋，其邑人三百戶无眚) 송사를 참고견디지 않는다. 돌아오나 잡힌다. 그 마을사람 삼백호 인심을 얻으면 잘못됨은 없다.","六三: 식구덕 정려 종길(食舊德，貞厲，終吉) 혹종왕사 무성(或從王事，无成) 음덕을 얻고 바름에 힘쓴다. 끝은 길하다. 혹 큰일을 쫓으려고하나 이루어지는것은 없다.","九四: 불극송 복즉명유 안정길(不克訟，復即命渝，安貞吉) 송사를 참고견디지 않는다  다시 복귀하여 운명을 바꿀수있다.  평안하고 바르게하면 길하다.","九五: 송 원길(訟，元吉) 송사가 바라는바는 근본은 길한것이다.","上九: 혹석지반대 종조삼치지(或錫之鞶帶，終朝三褫之) 혹 가죽주머니와 띠를 얻으면  여러번끝에 그것을 취한다."]},{"num":7,"name":"지수사(地水師)","sequence":"010000","symbol":"䷆","short_name":"사(師)","ci":["사(師)는 정장인길(貞丈人吉)，무구(无咎)","初六: 사출이율 부장 흉(師出以律，否臧，凶) 마땅한바를 갖추어 출사(出師)한다.  어짊이 아니면 흉하다.","九二: 재사중길 무구 왕삼석명(在師中吉，无咎,王三錫命) 사(師)가 길함중에 있으니 허물이없다.  왕이 신뢰함을 세번 보인다.","六三: 사역여시 흉(師或輿尸，凶) 사(師)에게 있어 혹여나 주검수레는 흉하다.","六四: 사좌차 무구(師左次，无咎) 사(師)가 좌(左)를 차(次)로 하는바를 안다. 허물이 없다.","六五: 전유금 이집언 무구(田有禽，利執言，无咎) 장자사사 제자여시 정흉(長子帥師，弟子輿尸，貞凶) 전(田)에있는 날짐승을 조심히 잡으니 이롭다. 장자는 군사를 거느리고 아우는 주검수레를 끄니 (이러한)바름은 흉하다(한다)","上六: 대군유명 개국승가 소인물용(大君有命，開國承家，小人勿用) 큰 임금은 (하늘의)명을  받아 나라를 열고 가업을 승계한다.  소인을 이러한 바를 쓸줄모른다."]},{"num":8,"name":"수지비(水地比)","sequence":"000010","symbol":"䷇","short_name":"비(比)","ci":["비(比)는  길(吉)하다.  원서원영정 무구(原筮元永貞，无咎) 불녕방래 후부흉(不寧方來，後夫凶)","初六: 유부 비지 무구(有孚，比之，无咎) 유부영관 종래유타 길(有孚盈缶，終來有它，吉) 비교하는바로 믿음을 둔다면 허물이 없다.  충만한 믿음이  종래에는 그것에서 길함이 있다.","六二: 비지자내 정길(比之自內，貞吉) 그것을 비교하여 스스로 추스리니 바르고 길하다.","六三: 비지비인(比之匪人) 견줌에는 인정이 없다.","六四: 외비지 정길(外比之，貞吉) (행실이) 드러남을 고르게하니 바르고 길하다.","九五: 현비 왕용삼구실전금읍인불성 길(顯比, 王用三驅 失前禽 邑人不誡，吉) 비교하여 분명히 하니  왕이 쓰는바요, 사방중에 세방향에서 몰아갈때 앞에서 날아오는 날짐승은 놓아주어도  마을 사람은 (의심하여)경계하지않으니 길하다.","上六: 비지무수 흉(比之无首，凶) 두서없이 그것을 비교하는것은 흉이다."]},{"num":9,"name":"풍천소축(風天小畜)","sequence":"111011","symbol":"䷈","short_name":"소축(小畜)","ci":["소축(小畜)은 형(亨)하다. 밀운불우 자아서교(密雲不雨，自我西郊)","初九: 복자도 하기구 길(復自道，何其咎，吉) 다시 제자리를 찾아가니 어찌 그것이 허물이겠는가? 길하다.","九二: 견복 길(牽復，吉) 다시 이끄니 길하다.","九三: 여탈폭 부처반목(輿說輻，夫妻反目) 수레가 바퀴를 벗으니 부부가 반목한다.","六四: 유부 혈거척출 무구(有孚，血去惕出，无咎) 믿음으로 피가 제거되고 두려움이 사라진다. 허물이없다.","九五: 유부거여 부이기린(有孚攣如，富以其鄰) 믿음이 매이다. 그 이웃으로써 가멸다.","上九: 이우기처 상덕재 부정려 월기망 군자정흉(既雨既處，尚德載，婦貞厲，月幾望，君子征凶) 이미 비가 곳곳에 내리니 덕을 기리기 시작하고 여자는 바름을 힘쓰며 몇달에 걸쳐 그 조짐을 살핀연후에 군자는 흉을 정벌한다."]},{"num":10,"name":"천택리(天澤履)","sequence":"110111","symbol":"䷉","short_name":"리(履)","ci":["리(履)는 호미 부질인 형(虎尾，不咥人，亨)","初九: 소리 왕무구(素履, 往无咎) 본디 밟는바는 가는바이니 허물은 없다.","九二: 이도탄탄 유인정길(履道坦坦，幽人貞吉) 밟는 길이 탄탄하다.  유인(幽人)인 바르고 길하다.","六三: 묘능시 파능이 이호미 질인 흉(眇能視，跛能履，履虎尾，咥人，凶) 무인위어대군(武人為于大君) 외눈이라도 볼수있고 다리를 절어도 밟을수있다. 호랑이 꼬리를 밟으니 사람을 문다. 흉하다.  무인이 대군이 된다.","九四: 이호미 색색종길(履虎尾，愬愬終吉) 호랑이 꼬리를 밟으나 두렵고두려우니 끝은 길하다.","九五: 쾌리 정려(夬履，貞厲) 터놓고 밟는다. 바름을 힘쓴다.","上九: 시리고상 기선원길(視履考祥，其旋元吉) 밟은바를 참고하고 조짐을 살핀다. 그 돌이키는바가  길하다."]},{"num":11,"name":"지천태(地天泰)","sequence":"111000","symbol":"䷊","short_name":"태(泰)","ci":["태(泰)는  소왕대래 길형(小往大來，吉亨)","初九: 발모여이기휘 정길(拔茅茹以其彙征,吉) 띠풀을 뜨으니 그들이  뭉쳐있는바로 취해진다. 길하다.","九二: 포황 용빙하 불하유붕망 득상우중행(包荒, 用馮河，不遐遺朋亡 得尚于中行) 거칢을 포용한다.  강을 건너는바가 있다.  머지않아 친구가 업신여김 당함을 따른다.  가운데에서 행함에 높임을 받는다.","九三: 무평불피 무왕불복 간정무구(无平不陂，无往不復，艱貞无咎) 물휼기부 우식유복(勿恤其孚，于食有福) 평평함이 없으면 기울일수가 없고 가지않으면 돌아올바가 없다. 어렵게 바르니 허물이 없다. 그 믿는바를 근심하지말라 먹음에 복이있다.","六四: 편편 불부이기린 불계이부(翩翩，不富以其鄰, 不戒以孚) 펄럭펄럭 나부낌은  그이웃으로 부유하지않음이니 믿음으로 경계하지않은바이다. 내심바란다.","六五: 제을귀매이사 원길(帝乙歸妹以祉，元吉) 제을은 하늘이 내리는 행복으로 누이를 시집보낸다.   본디 길하다.","上六: 성부우황 물용사 자읍고명 정린(城復于隍，勿用師，自邑告命，貞吝) 성은 해자로 겹겹이다. 군사를 쓰지않는다. 읍에 명을 고한다. 곧음이 인색하다."]},{"num":12,"name":"천지비(天地否)","sequence":"000111","symbol":"䷋","short_name":"비(否)","ci":["비(否)는  지비인 불리군자정 대왕소래(之匪人，不利君子貞，大往小來)","初六: 발모여이기휘 정길형(拔茅茹以其彙，貞吉亨) 모여서 뭉친 덩어리진 띠풀을 뽑는다. 바르니 길하고 형통하다.","六二: 포승 소인길 대인비형(包承，小人吉，大人否亨) 이어짐을 포용한다.  소인은 길하고 대인은 막히나 (장차) 형통한다.","六三: 포수(包羞) 부끄러움을 포용한다.","九四: 유명 무구 주리지(有命，无咎，疇離祉) 생명을 보존하니 허물은 없다.  무리가 그 복에 달라붙는다.","九五: 휴비 대인길 기망기망 계우포상(休否，大人吉。其亡其亡，繫于苞桑) 막힘도 쉬어간다. 대인이 길함이 어찌 망하겠는가 어찌망하겠는가.  뽕나무(잎)를 싸맨다.","上九: 경부 선부후희(傾否，先否後喜) 기울어짐이 그친다. 먼저가 막힘이고 나중이 즐거워짐이다."]},{"num":13,"name":"천화동인(天火同人)","sequence":"101111","symbol":"䷌","short_name":"동인(同人)","ci":["동인(同人) 우야 형 이섭대천 이군자정(于野，亨. 利涉大川，利君子貞)","初九：동인우문 무구(同人于門，無咎) 문을 나서 동인을 만나다. 허물이 없다.","六二：동인우종 린(同人于宗，吝) 유유상종하니 인색하다.","九三：복벌우장 승기고릉 삼세불여(伏戎于莽，升其高陵，三歲不興) 광활한 숲에 오랑캐가 숨어있으니  그 고지(高地)를 점한다. 여러해동안 일어남이없다.","九四：승기고 불극 공길(乘其墉，弗克，攻吉) 담장을 넘으려고하나 이김을 근심한다. 공격하면 길하다.","九五：동인 선호도이후소 대사극상우(同人，先號啕而后笑。大師克相遇) 동인이  시작은 울부짖으나 뒤에는 웃는다.  큰 군사가 서로만나 다툰다.","上九：동인우교 무회(同人于郊，無悔) 동인이 밖에서 만난다. 후회가 없다."]},{"num":14,"name":"화천대유(火天大有)","sequence":"111101","symbol":"䷍","short_name":"대유(大有)","ci":["대유(大有) 원형(元亨)","初九：무교해 비구 난즉무구(无交害，匪咎，艱則无咎) 서로 해가없다. 허물이 아니다. 어려워도 허물없다.","九二：대거이재 유유왕 무구(大車以載，有攸往，无咎) 큰수레에 적재한다. 갈바가있다. 허물이없다.","九三：공용형우천자 소인불극(公用亨于天子，小人弗克) 공용은 천자에게 통한다. 소인은 그러하지 않다.","九四：비기팽 무구(匪其彭，无咎) 그 팽팽함이 아니다. 허물이없다.","六五：궐부교여 위여 길(厥孚交如，威如,吉) 그믿음이 서로 사귐과 같다. 위엄이있다. 길하다.","上九：자천우지 길무불리(自天佑之，吉无不利) 하늘은 스스로 하는자를 돕는다.  길하고 이롭지않은바가없다."]},{"num":15,"name":"지산겸(地山謙)","sequence":"001000","symbol":"䷎","short_name":"겸(謙)","ci":["겸(謙) 형(亨) 군자유종(君子有終)","初六： 겸겸군자 용섭대천 길(謙謙君子，用涉大川，吉) 겸손하도다 군자여, 큰강을 건너니 길하다.","六二：명겸 정길(鳴謙，貞吉) 겸손함이 드러나니 바르고 길하다.","九三：노겸군자 유종길(勞謙君子，有終吉) 힘써 겸손한 군자는 끝이있고 길하다.","六四：무불리 위겸(无不利，撝謙) 이롭지않은바가없다. 겸손을 돕는바이다.","六五：불부 이기린 이용침벌 무불리(不富, 以其鄰 利用侵伐，无不利) 부유하지않다. 그 이웃과 더불어 침벌함이 이롭다. 이롭지않은바가없다.","上六：명겸 이용행사 정읍국(鳴謙，利用行師，征邑國) 겸손함이 울리니  군사를 행함이 이롭다. 고을과 나라를 정벌한다."]},{"num":16,"name":"뇌지예(雷地豫)","sequence":"000100","symbol":"䷏","short_name":"예(豫)","ci":["예(豫) 이건후행사(利建侯行師)","初六：명예 흉(鳴豫，凶) 미리 우니 흉하다는것이다.","六二：개우석 불종일 정길(介于石，不終日，貞吉) 돌사이에 끼니 하루가 끝나지 않는다. 바르면 길하다.","六三：우예 회 누유회(盱豫，悔。遲有悔) 처다보고나서 예상하니 후회한다. 늦음을 후회한다.","九四：유예 대유득 물의 붕개마(由豫，大有得。勿疑。朋盍簪) 연유로 예측하니 크게 얻는바가있다. 의심하지 말라 친구가 속히 덮는다.","六五：정질 항불사(貞疾，恆不死) 병에 곧으니  항시 죽지않는다.","上六：명예 성유유 무구(冥豫，成有渝，无咎) 어둠속에서 예측하니 변화하는것을 완성한다. 허물이없다."]},{"num":17,"name":"택뢰수(澤雷隨)","sequence":"100110","symbol":"䷐","short_name":"수(隨)","ci":["수(隨)  원형 이정 무구(元亨，利貞，无咎)","初九：관유유 정길 출문교이공(官有渝，貞吉。出門交有功) 기관은 변함이 있다. 바르면 길하다. 문을 나서 사귐에 공이있다.","六二：계소자 실장부(系小子，失丈夫) 소자를 이으나 장부를 잃는다.","六三：계장부 실소자 수유구득 이거정(系丈夫，失小子。隨有求得，利居貞) 장부를 이으나 소자를 잃는다. 수는 얻음을 구하는 바이다.  거함이 바르면 이롭다.","九四：수유획 정흉 유부재도 이명 하구(隨有獲，貞凶。有孚在道，以明，何咎) 수에 획득함이있다. 바르려고하나 근심이있다.  길이 밝으니 믿는바가있다. 어찌 허물이겠는가?","九五：부우가(孚于嘉，吉) 아름다운바를 믿는다 길하다.","上六：구게지 내종유지 왕용형우서산(拘系之，乃從維之。王用亨于西山) 그것을 매고 구속하니 이내 유지하고 따른다. 왕이 서산에서 형통하여 쓰는바이다."]},{"num":18,"name":"산풍고(山風蠱)","sequence":"011001","symbol":"䷑","short_name":"고(蠱)","ci":["고(蠱) 원형 이섭대천 선갑삼일 후갑삼일 (元亨，利涉大川。先甲三日，後甲三日)","初六：간부지고 유자고 무구 려종길(幹父之蠱，有子考，无咎，厲終吉) 아버지의 주된 일을 자식이 있어 살피니 허물이 없다. 힘써 끝이 길하다.","九二：간모지고 북가정(幹母之蠱，不可貞) 어머지의 주된 일은 바를수없다. (어렵다.)","九三：간부지고 소유회 무대구(幹父之蠱，小有悔，无大咎) 아버지의 주된 일은 작은 후회는 있으나 큰 허물은 없다.","六四：예부지고 왕견인(裕父之蠱，往見吝) 관대한 아버지의 일은 가보면 소중하다.","六五：간부지고 용예(幹父之蠱，用譽) 아버지의 주된일은 명예를 씀이다.","上九：불사왕후 고상기사(不事王侯，高尚其事) 왕후를 섬기지않는다. 그일이 높이어 높다."]},{"num":19,"name":"지택임(地澤臨)","sequence":"110000","symbol":"䷒","short_name":"임(臨)","ci":["임(臨) 원형 이정(元亨，利貞) 지우팔월유흉(至于八月有凶)","初九：함임 정길(咸臨，貞吉) 임을 온전케하니 바르고 길하다.","九二：함임 길무불리(咸臨，吉无不利) 임함에 다하니 길하다. 이롭지않는바가 없다.","六三：감임 무유리 기우지 무구(甘臨，无攸利。既憂之，无咎) 괜찮게 임하다. 이로운바는 없다. 이미 그것이 근심이다. 허물은 없다.","六四：지임 무구(至臨，无咎) 지극히 임하다. 허물은 없다.","六五：지임 대군지의 길(知臨，大君之宜，吉) 임함을 알다. 대군의 알맞은 바이다.  길하다.","上六：돈임 길무구(敦臨，吉无咎) 임함에 힘쓴다. 길하고 허물없다. 임함에 힘쓰니 길하다. 뜻이 안에 있다."]},{"num":20,"name":"풍지관(風地觀)","sequence":"000011","symbol":"䷓","short_name":"관(觀)","ci":["관(觀)  관이부천 유부옹야(盥而不荐，有孚顒若)","初六：동관 소인무구 군자린(童觀，小人无咎，君子吝) 어린아이가 본다. 소인은 허물이없다. 군자는 곤란하다.","六二：규친 이여정(窺觀，利女貞) 엿보다. 여자가 바르니 이롭다.","六三：관아생 진퇴(觀我生，進退) 내가 살아있음을 본다. 나아가고 물러난다.","六四：관국지광 이용빈우왕(觀國之光，利用賓于王) 나라의 빛을 본다. 왕에게 손님이 있으니 이롭다.","九五：관아생 군자무구(觀我生，君子无咎) 내가 살아있음을 본다. 군자가 허물이없다.","上九：관기생 군자무구(觀其生，君子无咎) 그것이 살아있음을 본다. 군자는 허물이 없다."]},{"num":21,"name":"화뢰서합(火雷噬嗑)","sequence":"100101","symbol":"䷔","short_name":"서합(噬嗑)","ci":["서합(噬嗑)은  형(亨)하다. 이용옥(利用獄)","初九：구교멸지(屨校滅趾) 무구(無咎) 구교멸지(屨校滅趾) 무구(無咎) :족쇄로 발을 묶는다. 허물이 없다.","六二：서부멸비(噬膚滅鼻) 무구(無咎) 살갗을 깨물어 코가 다한다. 허물은 없다.","六三：서랍육(噬臘肉) 우독소린(遇毒小吝) 무구(無咎) 납일(臘日)납육(臘肉)을 씹는다.  근심을 만나나 인색함은 적다. 허물은 없다.","九四：서건자득금시(噬乾胏得金矢) 이간정(利艱貞)  길(吉) (뼈가 붙은)마른고기를 씹다가 황금화살을 얻는다.  올바름에 힘쓰니 이롭다. 길(吉)하다.","六五：서건육득황금(噬乾肉得黃金) 정려무구(貞厲無咎) 마른 고기를 씹으니 황금을 얻는다. 올바름 , 곧음에 힘쓰니 허물은 없다.","上九：하교멸이(何校滅耳) 흉(凶) 차꼬에 메이니 귀가 다한다. 흉(凶)하다."]},{"num":22,"name":"산화비(山火賁)","sequence":"101001","symbol":"䷕","short_name":"비(賁)","ci":["분(賁)은 형(亨)  소리유유왕(小利有攸往)","初九：분기지 사거이도(賁其趾，舍車而徒) 그 발이 날래다.  수레를 버리고 보행한다.","六二：비기수(賁其須) 그 수염을 꾸민다.","九三：비여수여 영정길(賁如濡如，永貞吉) 꾸미니 온화하다. 바름이 길하고 오래간다.","六四：비여파여 백마간여 비구혼구(賁如皤如，白馬翰如，匪寇婚媾) 희게 꾸미니 흰말의 털같다. 비적이 아니면 혼사로 화친한다.","六五：비어구원 속면잔잔 린 종길(賁於丘園，束帛戔戔，吝，終吉) 무덤을 꾸민다. 비단묶음이 남는다. 인색하나 끝에는 길하다.","上九：백비 무구(白賁，无咎) 깨끗하게 꾸민다. 허물이 없다."]},{"num":23,"name":"산지박(山地剝)","sequence":"000001","symbol":"䷖","short_name":"박(剝)","ci":["박(剝)   불리유유왕(不利有攸往)","初六：박상이족 무정흉(剝牀以足衊 貞凶) 평상다리를 깍아 업신여김이다. 곧으나 흉하다.","六二：박상이변 멸정흉(剝牀以辨，衊貞凶) 평상을 바로잡으려 깍으니 업신여김이다. 곧으나 흉하다.","六三：박지 무구(剝之，无咎) 그것을 깍으나 허물이없다.","六四：박상이부 흉(剝牀以膚，凶) 평상을 깍으니 속살이다. 흉하다.","六五：관어 이궁인총 무불리(貫魚，以宮人寵，无不利) 물고기를 꿰다. 집사람들이 총애를 받는다. 불리함이없다.","上九：석과불식 군자득여 소인박려(碩果不食，君子得輿，小人剝廬) 큰열매를 먹지않는다. 군자가 가마를 얻었다. 소인이 그집을 깍는다."]},{"num":24,"name":"지뢰복(地雷復)","sequence":"100000","symbol":"䷗","short_name":"복(復)","ci":["복(復) 형 출입무질 붕래무구 번복기도 칠일래부 이유유왕(亨。出入无疾，朋來无咎。反復其道，七日來復，利有攸往)","初九：불복원 무지회 원길(不復遠，无只悔，元吉) 멀어서 돌아가지않는다. 다만 후회가 없다. 본디 길하다.","六二：휴복 길(休復，吉) 돌아가다 쉰다. 길하다.","六三：빈부 려무구(頻復，厲无咎) 급히 거듭한다. 힘쓰니 허물없다.","六四：중행 독복(中行 獨復) 가운데간다. 홀로 돌아간다.","六五：조복 무회(敦復，无悔) 돌아감을 아로새기니 후회없다.","上六：미복 흉 유재생 용행사 종유대패 이기국군 흉 지우십년 불극정(迷復，凶，有災眚。用行師，終有大敗，以其國君，凶,至于十年，不克征) 갈길을 헤매니 흉하다. 재앙이다. 행군을 하나 끝내 대패한다. 그나라임금때문에 흉하다. 십년이 다가도록 정복하지못한다."]},{"num":25,"name":"천뢰무망(天雷无妄)","sequence":"100111","symbol":"䷘","short_name":"무망(无妄)","ci":["무망(无妄)  원형 이정 기비정유구 불리유유왕 (元亨，利貞。其匪正有眚，不利有攸往)","初九：무망 왕길(无妄，往吉) 허망하지않다. 가는바가 길하다.","六二：불경획 불치여 즉이유유왕(不耕獲，不菑畬，則利有攸往) 경작을 제대로않했으나 얻는바가있다. 개간을 제대로하지않았는데 새밭인바가있다. 즉 가는바가있으면 이롭다는것이다.","六三：무망지재 혹계지우 행인지득 읍인지재(无妄之災，或系之牛，行人之得，邑人之災) 무망의 재앙은 혹 소가 매여 엮임과 같다. 행인이 얻는바가 될수있고 읍인의 재앙인바가될수있다.","九四：가정무구(可貞，无咎) 바를수있으면 허물이 없겠다.","九五：무망지질 물락유희(无妄之疾，勿藥有喜) 무망의 병은 기쁜바가 있으니 약하지않는다.","上九：무망 행유생 무유리(无妄，行有眚 无攸利) 무망은 행함에  잘못될수있다. 이로운바없다."]},{"num":26,"name":"산천대축(山天大畜)","sequence":"111001","symbol":"䷙","short_name":"대축(大畜)","ci":["대축(大畜)  이정 불가식길 이섭대천(利貞，不家食吉，利涉大川)","初九：유려이이(有厲利已) 벌써 이로움을 염려하는바가 있다.","九二：여탈복(輿說輹) 수레가 (차여와 차축의) 복토가 벗겨지다. (수레가 짐을 쌓아 실을수없으니 이를 나를수없다.)","九三：양마축 이간정 왈한여위 이유유왕(良馬逐，利艱貞。曰閑輿衛，利有攸往) 좋은말이 쫓는다 어렵게바르니 이롭다. 왈,한가히 수레를 지킨다. 가는바가있어 이롭다.","六四：동시지곡 원길(童牛之牿，元吉) 어린돼지를 기르다.  원래 길하다.","六五：분시지아 길(豶豕之牙，吉) 불깐돼지어금니 길하다.","上九：하천지구 형(何天之衢，亨) 잠시 하늘의 네거리이다. 형통하다."]},{"num":27,"name":"산뢰이(山雷頤)","sequence":"100001","symbol":"䷚","short_name":"이(頤)","ci":["이(頤)  정길 관이 자구구실 (貞吉。觀頤，自求口實)","初九：석이령구 관아염이 흉(舍爾靈龜，觀我朵頤，凶) 그 영묘한 거북이를 벌여놓고 내가 턱을 늘어트림을 본다. 흉하다.","六二：전이 불경 우구이 정흉(顛頤，拂經，于丘頤，征凶) 꺼꾸로 기르다. 언덕에서 기르니 도리를 거스른다. 멀리나가나 흉하다.","六三：불이 정흉 십년물용 무유리(拂頤，貞凶，十年勿用，无攸利) 기름을 거스르니 바르더라도 흉하다. 십년동안 쓰지말라 이로운바가 없다.","六四：전이길 호시탐탐 기욕축축 무구(顚頤吉，虎視眈眈，其欲逐逐，无咎) 꺼꾸로 기르나 이롭다. 호시탐탐 그것이 쫓을려고한다. 허물없다.","六五：불경 거정길 불가섭대천(拂經，居貞吉，不可涉大川) 경과하여 다다르니  거함에 바르면 길하다. 큰강을 건널수없다.","上九：요이 려길 이섭대천(由頤，厲吉，利涉大川) 웃는얼굴의 턱모양, 힘써노력하면 길하다. 큰강을 건너니 이롭다."]},{"num":28,"name":"택풍대과(澤風大過)","sequence":"011110","symbol":"䷛","short_name":"대과(大過)","ci":["대과(大過)  동요 이유유왕 형(棟橈，利有攸往，亨)","初六：자용백모 무구(藉用白茅，无咎) 하얀띠풀로 깔개에 쓴다. 허물없다.","九二：고양생제 노부득기여처 무불리(枯楊生稊，老夫得其女妻，无不利) 시든 버드나무 돌피를 자라게한다. 늙은이가 그여첩을 얻는다. 이롭지않음이없다.","九三：동요 흉(棟橈，凶) 지붕 용마루가 구분다. 흉하다.","九四：동륭 길 유타린(棟隆，吉。有它吝) 마룻대가 높다. 길하다. 다른 근심이 있다.","九五：고양생화 노부득사부 무구무예(枯楊生華，老婦得士夫，无咎无譽) 시든 버드나무에 꽃이핀다.  할머니가 사부(士夫)를 얻는다. 허물도없고 명예도없다.","上六：과섭멸정 흉 무구(過涉滅頂，凶，无咎) 머리가 잠겨 건너지난다.  흉하다. 허물없다."]},{"num":29,"name":"감위수(坎爲水)","sequence":"010010","symbol":"䷜","short_name":"감(坎)","ci":["감(坎)  습감 유부유심 형 행유상(習坎，有孚維心，亨。行有尚)","初六：습감 입우감담 흉(習坎，入于坎窞，凶) 고생에 익숙하다. 크고작은 구덩이에 들어간다. 흉하다.","九二：감유험 구소득(坎有險，求小得) 구덩이는 위험이 있다.  작은 얻음을 구한다.","六三：래지
