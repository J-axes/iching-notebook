let PROB_LABELS = { binary:{}, quaternary:{} };
const _gv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const PROB_COLORS = {
  binary: { '0':_gv('--c-dim'), '1':_gv('--c-gold') },
  quaternary: { '6':_gv('--y6-tx'), '7':_gv('--y7-tx'), '8':_gv('--y8-tx'), '9':_gv('--y9-tx') }
};
const PROB_GLINT_DELAY = { '6':'0s', '7':'1s', '8':'2s', '9':'3s' };
function _probLabel(mode, k){
  const raw = (PROB_LABELS[mode] || {})[k] || k;
  const sym = raw.slice(-1), name = raw.slice(0, -1).trimEnd();
  return `(${k}) ${sym} ${name}`;
}

function fmtPct(v, total){
  if(total <= 0) return '—';
  const pct = v / total * 100;
  const p4 = Number(pct.toPrecision(4));
  return (p4 === pct ? String(pct) : pct.toPrecision(4)) + '%';
}
function pctColor(mode, k){
  return PROB_COLORS[mode][k] || '#c9a84c';
}

function settingsRender(){
  const w = shiboProbWeights || shiboProbDefaults;
  let html = '';
  for(const mode of ['binary','quaternary']){
    const entries = Object.entries(w[mode]);
    const total = entries.reduce((s,[,v])=>s+Number(v), 0);
    html += `<div class="prob-section-label" style="display:flex;justify-content:space-between;align-items:center;">
      <span>${mode === 'binary' ? T('settings.mode.binary') : T('settings.mode.quaternary')}</span>
    </div>`;
    for(const [k, v] of entries){
      const rawLabel = PROB_LABELS[mode][k] || k;
      const sym  = rawLabel.slice(-1);
      const name = rawLabel.slice(0, -1).trimEnd();
      const color = pctColor(mode, k);
      const pct = fmtPct(Number(v), total);
      html += `<div class="prob-row">
        <span class="prob-name"><span class="prob-name-key">(${k})</span><span class="prob-name-lbl"> ${_esc(sym)} ${_esc(name)}</span></span>
        <span class="prob-pct-wrap"><span class="prob-pct${mode==='quaternary'?' prob-pct--glint':''}" id="pct_${mode}_${k}" style="color:${color};${mode==='quaternary'?'animation-delay:'+PROB_GLINT_DELAY[k]:''}">${pct}</span></span>
        <span class="prob-frac">${v}/${total}</span>
      </div>`;
    }
  }
  html += `<div class="settings-actions">
    <button class="settings-btn-action" onclick="settingsShowPresets()">${T('btn.preset')}</button>
    <button class="settings-btn-action primary" onclick="settingsClose()">${T('btn.ok')}</button>
  </div>`;
  const _sc = document.getElementById('settingsContent');
  _sc.innerHTML = html;
  fitBtnText(_sc);
}

function _presetRainbowName(name, mode) {
  const palette = mode === 'binary'
    ? [PROB_COLORS.binary['0'], PROB_COLORS.binary['1']]
    : [PROB_COLORS.quaternary['6'], PROB_COLORS.quaternary['7'], PROB_COLORS.quaternary['8'], PROB_COLORS.quaternary['9']];
  return [...name].map((ch, i) =>
    `<span style="color:${palette[i % palette.length]}">${ch}</span>`
  ).join('');
}

function settingsShowPresets() {
  let html = '';
  if (shiboProbPresets.length === 0) {
    html = `<div class="sp-body-text">${T('settings.no_presets')}</div>`;
  } else {
    for (let i = 0; i < shiboProbPresets.length; i++) {
      const p = shiboProbPresets[i];
      const coloredRatio = Object.entries(p.probs)
        .map(([k,v]) => `<span style="color:${pctColor(p.mode,k)}">${v}</span>`)
        .join('<span style="color:var(--c-dim)">:</span>');
      html += `<div class="prob-row" style="align-items:center;">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;">
          <span style="font-size:var(--inp-fsz);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${_esc(p.name)}</span>

        </span>
        <button class="settings-btn-action" style="flex:0 0 28%;min-width:0;" onclick="settingsSelectPreset(${i})">${T('btn.select')}</button>
      </div>`;

  html += `<div class="settings-actions">
    <button class="settings-btn-action" onclick="settingsRender()">${T('btn.return')}</button>
  </div>`;
  const _sc2 = document.getElementById('settingsContent');
  _sc2.innerHTML = html;

}

function settingsSelectPreset(idx) {
  const p = shiboProbPresets[idx];
  if (!p) return;
  const w = JSON.parse(JSON.stringify(shiboProbWeights || shiboProbDefaults));
  w[p.mode] = Object.fromEntries(Object.entries(p.probs).map(([k,v])=>[k, Number(v)]));
  shiboProbWeights = w;
  settingsRender();
  setMsg(T('msg.preset_applied', p.name), 'success');
}

function renderSaveDropdown(records){
  _saveRecords = [...records].reverse();
  const dd = document.getElementById('saveDropdown');
  if(!_saveRecords.length){
    dd.innerHTML = `<div class="save-dropdown-empty">${T('history.empty')}</div>`;
    return;
  }
  dd.innerHTML = _saveRecords.map((rec, i) => {
    const bits = rec.digits;
    const isYarrow = bits.some(b => b > 1);
    const bitsStr = bits.map(b => {
      const c = isYarrow ? (PROB_COLORS.quaternary[String(b)] || '#c9a84c') : (PROB_COLORS.binary[String(b)] || '#c9a84c');
      return `<span style="color:${c}">${b}</span>`;
    }).join('');
    const ts = _relTime(rec.time);
    const favoClass = 'save-favo' + (rec.favo ? ' active' : '');
    return `<div class="save-record${rec.shibo ? ' shibo-lit' : ''}"><span class="save-record-icons"><span class="save-del" onclick="deleteRecord(${i},event)">✖</span><span class="save-edit" onclick="editRecord(${i},event)">✎</span><span class="${favoClass}" onclick="toggleFavo(${i},event)">${rec.favo ? '★' : '☆'}</span></span><span class="save-record-name" onclick="loadSaveRecord(${i})"><span class="save-record-name-inner">${_esc(rec.name||'')}</span></span><span class="save-record-bits" onclick="loadSaveRecord(${i})"><span class="save-record-bits-inner">${bitsStr}</span></span><span class="save-record-time" onclick="loadSaveRecord(${i})">${ts}</span></div>`;
  }).join('');
}

function _relTime(isoStr){
  const s = Math.floor((Date.now() - new Date(isoStr)) / 1000);
  if(s >= 86400 * 365) return T('time.years_ago', Math.floor(s / (86400 * 365)));
  if(s >= 86400)       return T('time.days_ago',  Math.floor(s / 86400));
  if(s >= 3600)        return T('time.hours_ago', Math.floor(s / 3600));
  return T('time.secs_ago', Math.max(0, s));
}

function _recordPreviewHTML(rec){
  const bits = rec.digits;
  const isYarrow = bits.some(b => b > 1);
  const bitsStr = bits.map(b => {
    const c = isYarrow ? (PROB_COLORS.quaternary[String(b)] || '#c9a84c') : (PROB_COLORS.binary[String(b)] || '#c9a84c');
    return `<span style="color:${c}">${b}</span>`;
  }).join(' ');
  const ts = _relTime(rec.time);
  const favoClass = 'save-favo'+(rec.favo?' active':'');
  return `<div class="save-record save-dd-confirm-preview${rec.shibo?' shibo-lit':''}"><span class="save-record-icons"><span class="${favoClass}">${rec.favo?'★':'☆'}</span></span><span class="save-record-name"><span class="save-record-name-inner">${_esc(rec.name||'')}</span></span><span class="save-record-bits"><span class="save-record-bits-inner">${bitsStr}</span></span><span class="save-record-time">${ts}</span></div>`;
}

function applyPanelScale(s) {
  const root = document.documentElement;
  for (const [k, base] of Object.entries(PANEL_SIZES)) {
    const v = PANEL_FS_KEYS.has(k) ? Math.max(base * s, BTN_FS_MIN) : base * s;
    root.style.setProperty(k, v + 'px');
  }
}

function fitLeftPanel() {
  const panel   = document.querySelector('.left-panel');
  const stacked = document.querySelector('.page-layout').classList.contains('stacked');
  panel.style.height = '';
  applyPanelScale(1);
  const rect  = panel.getBoundingClientRect();
  const avail = window.innerHeight - rect.top - PANEL_BOTTOM_MARGIN;
  let s = 1;
  if (stacked) {
    const scaleW = (window.innerWidth - 2 * PANEL_STACKED_H_MARGIN) / BASE_PANEL_W;
    const scaleH = avail / rect.height;
    s = Math.min(scaleW, scaleH);
  } else {
    if (rect.height > avail) s = avail / rect.height;
  }
  if (s !== 1) applyPanelScale(s);
  panel.style.height = avail + 'px';
  fitSourceOverlay();
}

function fitSourceOverlay() {
  const ov = document.getElementById('sourceOverlay');
  for (const k of Object.keys(PANEL_SIZES)) ov.style.removeProperty(k);
  if (!ov.classList.contains('open')) return;
  const avail    = document.querySelector('.left-panel').getBoundingClientRect().height;
  const body     = ov.querySelector('.source-body');
  const overflow = body.scrollHeight - body.offsetHeight;
  if (overflow <= 0) return;
  const s  = avail / (avail + overflow);
  const cs = getComputedStyle(document.documentElement);
  for (const k of Object.keys(PANEL_SIZES)) {
    const v = parseFloat(cs.getPropertyValue(k));
    if (!isNaN(v)) ov.style.setProperty(k, (v * s) + 'px');
  }
}

  const s_w = Math.min(1, panelW / HDR_BASELINE_WIDTH);
  for (const [k, base] of Object.entries(HDR_SIZES))
    root.style.setProperty(k, _hdrVal(k, base * s_w) + 'px');

  // ── 第二步：高度 scale（header 底部不可超過視窗 1/2）──
  // getBoundingClientRect() 強制 style flush，確保第一步已套用
  const rect = document.getElementById('hexHeader').getBoundingClientRect();
  const budget = window.innerHeight / 2;
  if (rect.bottom > budget && rect.height > 0) {
    // header.top 不受 scale 影響；height 與 s 成正比
    // 目標：rect.top + rect.height × (s_final / s_w) = budget
    const s_final = s_w * (budget - rect.top) / rect.height;
    for (const [k, base] of Object.entries(HDR_SIZES))
      root.style.setProperty(k, _hdrVal(k, base * s_final) + 'px');
  }
}

// 快取左欄右邊界（在無 transform 狀態下量測，避免 transition 中途讀到錯誤值）
let _leftPanelRight = 0;

// 同步 #panelToggle / #panelBack 的 display 和位置
function updateToggle() {
  const layout    = document.querySelector('.page-layout');
  const stacked   = layout.classList.contains('stacked');
  const showRight = layout.classList.contains('show-right');
  const toggle    = document.getElementById('panelToggle');
  const back      = document.getElementById('panelBack');

  toggle.style.display = (stacked && !showRight) ? 'flex' : 'none';
  back.style.display = (stacked && showRight) ? 'flex' : 'none';
  document.body.classList.toggle('stacked-right', stacked && showRight);
  document.body.classList.toggle('stacked-left',  stacked && !showRight);
}

// 根據右欄寬度決定是否啓用 stacked 模式，並更新 toggle 顯示狀態
function fitLayout() {
  const layout = document.querySelector('.page-layout');
  layout.classList.remove('stacked', 'show-right');
  const w = document.querySelector('.right-panel').getBoundingClientRect().width;
  if (w < 200) layout.classList.add('stacked');
  // 在無 transform 狀態下量測並快取左欄右邊界
  _leftPanelRight = document.querySelector('.left-panel').getBoundingClientRect().right;
  updateToggle();
}

const BODY_SIZES = {
  '--body-sec-sz':  16,
  '--body-sub-sz':  15,
  '--body-yao-sz':  14,
  '--body-item-sz': 14.5,
  '--body-jw-sz':   14.5,
  '--body-ann-sz':  10.5,
  '--body-tog-sz':  12,
};
const BODY_IPAD_W   = 768;
const BODY_MOBILE_W = 375;
const BODY_MOBILE_S = 0.75;

function fitBodyText() {
  const w = window.innerWidth;
  const s = w >= BODY_IPAD_W ? 1
    : Math.max(BODY_MOBILE_S,
        BODY_MOBILE_S + (w - BODY_MOBILE_W) / (BODY_IPAD_W - BODY_MOBILE_W) * (1 - BODY_MOBILE_S));
  const root = document.documentElement;
  for (const [k, base] of Object.entries(BODY_SIZES))
    root.style.setProperty(k, (base * s) + 'px');
}



function fitBtnText(root) {
  (root || document).querySelectorAll('button:not(:has(svg)):not(.no-fit)').forEach(btn => {
    if (!btn.textContent.trim()) return;
    btn.style.fontSize = '';
    btn.style.whiteSpace = '';
    const w = btn.offsetWidth;
    if (!w) return;
    let fs = parseFloat(getComputedStyle(btn).fontSize);
    while (btn.scrollWidth > w + 0.5 && fs > BTN_FS_MIN) {
      fs -= 0.5;
      btn.style.fontSize = fs + 'px';
    }
    if (btn.scrollWidth > w + 0.5 && fs <= BTN_FS_MIN) btn.style.whiteSpace = 'normal';
  });
  (root || document).querySelectorAll('.prob-name').forEach(el => {
    el.style.fontSize = '';
    const row = el.closest('.prob-row');
    if (!row) return;
    let fs = parseFloat(getComputedStyle(el).fontSize);
    const nameW = el.offsetWidth; // fixed 50% of row
    while (el.scrollWidth > nameW + 0.5 && fs > BTN_FS_MIN) {
      fs -= 0.5;
      el.style.fontSize = fs + 'px';
    }
    // beyond font floor, CSS text-overflow:ellipsis on .prob-name-lbl handles the rest
  });
}

let _cfgBaseline = null;
let _cfgHexBaseline = null;
let _cfgHexNum = null;
let _cfgHexEdits = {};
function _cfgCheckDirty(){
  const btn = document.getElementById('cfgSaveBtn');
  if(!btn || _cfgBaseline === null) return;
  let dirty = false;
  try { dirty = JSON.stringify(configReadForm()) !== _cfgBaseline; } catch(e){ dirty = true; }
  if(!dirty && _cfgHexBaseline){
    const orig = _HEX_BY_NUM[_cfgHexBaseline.num] || {};
    const nameEl = document.getElementById('cfg-hex-name');
    const shortEl = document.getElementById('cfg-hex-short');
    if(nameEl && (nameEl.value !== (orig.name||'') || shortEl.value !== (orig.short_name||'')))
      dirty = true;
    if(!dirty){
      const curN = _cfgHexBaseline.num;
      for(const [k, edit] of Object.entries(_cfgHexEdits)){
        if(parseInt(k) === curN) continue;
        const d = _HEX_BY_NUM[parseInt(k)] || {};
        if(edit.name !== (d.name||'') || edit.short_name !== (d.short_name||'')){ dirty = true; break; }
      }
    }
  }
  btn.disabled = !dirty;
  btn.classList.toggle('primary', dirty);
}
function configSave(){
  let cfg;
  try { cfg = configReadForm(); _validateCfg(cfg); }
  catch(e){ setMsg(e.message, 'error'); return; }
  const _cfgFormDirty = JSON.stringify(cfg) !== _cfgBaseline;
  if(_cfgFormDirty){
    _lsSaveConfig(cfg);
    _srcSetClean('cfg', false);
    _applyConfig(cfg);
    _cfgBaseline = JSON.stringify(cfg);
  }
  _cfgStashCurrentHexEdits();
  for(const [numStr, edit] of Object.entries(_cfgHexEdits)){
    const n = parseInt(numStr);
    const d = _HEX_BY_NUM[n];
    if(!d) continue;
    if(edit.name !== (d.name||'')){
      _lsApplyHexOv(n, 'name', edit.name);
      d.name = edit.name;
      if(d.sequence) _HEX_BY_SEQ[d.sequence].name = edit.name;
    }
    if(edit.short_name !== (d.short_name||'')){
      _lsApplyHexOv(n, 'short_name', edit.short_name);
      d.short_name = edit.short_name;
      if(d.sequence) _HEX_BY_SEQ[d.sequence].short_name = edit.short_name;
    }
  }
  _cfgHexEdits = {};
  if(currentData) renderHeader();
  setMsg(T('msg.config_saved'), 'success');
  const btn = document.getElementById('cfgSaveBtn');
  btn.disabled = true; btn.classList.remove('primary');
}

function _secInner(i18nKey, varName=''){

    : T(i18nKey);
}
function _secTitle(i18nKey, varName='', btn=''){
  return `<div class="config-section-title"><div>${_secInner(i18nKey, varName)}</div>${btn}</div>`;
}

function _cfgStashCurrentHexEdits(){
  if(!_cfgHexBaseline) return;
  const n = _cfgHexBaseline.num;
  const nameEl = document.getElementById('cfg-hex-name');
  const shortEl = document.getElementById('cfg-hex-short');
  if(!nameEl) return;
  const orig = _HEX_BY_NUM[n] || {};
  if(nameEl.value !== (orig.name||'') || shortEl.value !== (orig.short_name||'')){
    _cfgHexEdits[n] = { name: nameEl.value, short_name: shortEl ? shortEl.value : '' };
  } else {
    delete _cfgHexEdits[n];
  }
}

function configHexNumChange(val){
  _cfgStashCurrentHexEdits();
  const n = Math.max(1, Math.min(64, parseInt(val) || 1));
  _cfgHexNum = n;
  const d = _HEX_BY_NUM[n] || {};
  _cfgHexBaseline = { num: n, name: d.name || '', short_name: d.short_name || '' };
  const nameEl = document.getElementById('cfg-hex-name');
  const shortEl = document.getElementById('cfg-hex-short');
  const edit = _cfgHexEdits[n];
  if(nameEl) nameEl.value = edit ? edit.name : (d.name || '');
  if(shortEl) shortEl.value = edit ? edit.short_name : (d.short_name || '');
}
function configHexStep(delta){
  const el = document.getElementById('cfg-hex-num');
  const n = Math.max(1, Math.min(64, (parseInt(el.value)||1) + delta));
  el.value = n;
  configHexNumChange(n);
}

function configTrigramConfirmAdd(){
  const inp = document.getElementById('cfg-tri-newprop');

  const table = document.getElementById('cfg-tri-table');
  const existing = new Set([...[...table.querySelectorAll('thead th[data-key]')].map(th=>th.dataset.key),'name','color']);

    };
    for(const k of extraKeys){
      const el = document.getElementById(`cfg-tri-${bits}-${k}`);
      if(el) t[k] = el.value;
    }
    cfg.trigrams[bits] = t;
  }
  cfg.shibo_probs = {
    binary:     {'0':+document.getElementById('cfg-prob-bin-0').value, '1':+document.getElementById('cfg-prob-bin-1').value},
    quaternary: {'6':+document.getElementById('cfg-prob-quat-6').value,'7':+document.getElementById('cfg-prob-quat-7').value,'8':+document.getElementById('cfg-prob-quat-8').value,'9':+document.getElementById('cfg-prob-quat-9').value},
  };
  cfg.shibo_presets = [];
  document.querySelectorAll('.cfg-preset-row').forEach(card => {
    const mode = card.querySelector('.cfg-preset-mode').value;
    const probs = {};
    card.querySelectorAll('.cfg-preset-prob').forEach(inp => { probs[inp.dataset.key] = +inp.value; });
    cfg.shibo_presets.push({ name: card.querySelector('.cfg-preset-name').value, mode, probs });
  });
  return cfg;
}

function sourceLoadFile(type, inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      if(type === 'md'){
        const secs = _parseMdSections(e.target.result);
        if(Object.keys(secs).length === 0) throw new Error('No hexagram sections (## NN.) found');
        const ov = _lsGetHexOv();
        for(const [numStr, fields] of Object.entries(secs)){
          const n = parseInt(numStr);
          if(!ov[numStr]) ov[numStr] = {};
          Object.assign(ov[numStr], fields);
          const h = _HEX_BY_NUM[n]; if(!h) continue;
          Object.assign(h, fields);
          if(_HEX_BY_SEQ[h.sequence]) Object.assign(_HEX_BY_SEQ[h.sequence], fields);
        }
        localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
        if(currentData){ renderContent(currentData); }
        _srcSetClean('md', true, file.name);
      } else if(type === 'cfg'){
        const cfg = JSON.parse(e.target.result);
        _validateCfg(cfg);
        const {hexagrams, overrides, ...cfgOnly} = cfg;
        _lsSaveConfig(cfgOnly); _applyConfig(cfgOnly);
        if(Array.isArray(hexagrams) && hexagrams.length > 0){
          for(const h of hexagrams){
            if(typeof h.num !== 'number') throw new Error(`Hexagram entry missing "num"`);
            if(typeof h.sequence !== 'string' || !/^[01]{6}$/.test(h.sequence)) throw new Error(`Hexagram ${h.num}: invalid "sequence" (expected 6 binary digits)`);
          }
          const IC_FIELDS = ['name','short_name','ci','symbol'];
          const ov = _lsGetHexOv();
          for(const h of hexagrams){
            const k = String(h.num); if(!_HEX_BY_NUM[h.num]) continue;
            if(!ov[k]) ov[k] = {};
            for(const f of IC_FIELDS) if(f in h){
              ov[k][f] = h[f]; _HEX_BY_NUM[h.num][f] = h[f];
              if(_HEX_BY_SEQ[h.sequence]) _HEX_BY_SEQ[h.sequence][f] = h[f];
            }
          }
          for(const [numStr, fields] of Object.entries(overrides || {})){
            const n = parseInt(numStr); if(!_HEX_BY_NUM[n]) continue;
            const h = _HEX_BY_NUM[n]; const k = String(n);
            if(!ov[k]) ov[k] = {};
            for(const f of IC_FIELDS) if(f in fields){
              ov[k][f] = fields[f]; h[f] = fields[f];
              if(_HEX_BY_SEQ[h.sequence]) _HEX_BY_SEQ[h.sequence][f] = fields[f];
            }
          }
          localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
          if(currentData){ currentData = _HEX_BY_NUM[currentData.num] || currentData; renderContent(currentData); renderHeader(); }
        }
        _srcSetClean('cfg', true, file.name);
      } else if(type === 'saves'){
        const records = JSON.parse(e.target.result);
        if(!Array.isArray(records)) throw new Error('saves.json must be a JSON array');
        localStorage.setItem(_LS_SAVES, JSON.stringify(records));
        _srcSetClean('saves', true, file.name);
      }
    } catch(err){ sourceErrOpen(err.message); }
    inputEl.value = '';
  };
  reader.readAsText(file);
}
function sourceDownload(type){
  let data, filename, mime = 'application/json';
  if(type === 'saves'){ data = JSON.stringify(_lsLoadSaves(), null, 2); filename = 'saves.json'; }
  else if(type === 'cfg'){
    data = JSON.stringify({..._lsGetConfig(), hexagrams: _reconstructIching()}, null, 2);
    filename = 'config.json';
  }
  else if(type === 'md'){ data = _reconstructMd(); filename = 'text.md'; mime = 'text/markdown'; }
  else return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type: mime}));
  a.download = filename; a.click(); URL.revokeObjectURL(a.href);
}
function _reconstructMd(){
  return Object.values(_HEX_BY_NUM)
    .sort((a,b) => a.num - b.num)
    .map(h => `## ${String(h.num).padStart(2,'0')}.\n### _\n${h['text.tab1']||''}\n### _\n${h['text.tab2']||''}\n### _\n${h['text.tab3']||''}`)
    .join('\n\n');
}
function _reconstructIching(){
  return Object.values(_HEX_BY_NUM)
    .sort((a,b) => a.num - b.num)
    .map(({num,sequence,name,short_name,symbol,ci}) => ({num,sequence,name,short_name,symbol,ci}));
}
function _parseMdSections(text){
  const SEC = ['text.tab1','text.tab2','text.tab3'];
  const result = {};
  let curNum = null, sections = [], curLines = null;
  for(const raw of text.split('\n')){
    const s = raw.trimEnd();
    const m = s.match(/^## (\d{2})\./);
    if(m){
      if(curNum !== null){
        if(curLines !== null) sections.push(curLines);
        result[String(curNum)] = Object.fromEntries(
          SEC.slice(0, sections.length).map((f,i) => [f, sections[i].join('\n').trim()])
        );
      }
      curNum = parseInt(m[1]); sections = []; curLines = null; continue;
    }
    if(curNum === null) continue;
    if(s.startsWith('### ')){ if(curLines !== null) sections.push(curLines); curLines = []; continue; }
    if(curLines !== null) curLines.push(s);
  }
  if(curNum !== null){
    if(curLines !== null) sections.push(curLines);
    result[String(curNum)] = Object.fromEntries(
      SEC.slice(0, sections.length).map((f,i) => [f, sections[i].join('\n').trim()])
    );
  }
  return result;
}

function _seqOpposite(seq){ return seq.split('').map(c=>c==='1'?'0':'1').join(''); }
function _seqInverse(seq){ return seq.split('').reverse().join(''); }
function _seqSwap(seq){ return seq[3]+seq[4]+seq[5]+seq[0]+seq[1]+seq[2]; }
function _seqNuclear(seq){ return seq[1]+seq[2]+seq[3]+seq[2]+seq[3]+seq[4]; }
function _relModeData(data, mode){
  if(!data || mode==='original' || mode==='zhi') return null;
  const seq = data.sequence;
  let rseq;
  if(mode==='opposite')      rseq = _seqOpposite(seq);
  else if(mode==='inverse')  rseq = _seqInverse(seq);
  else if(mode==='swap')     rseq = _seqSwap(seq);
  else if(mode==='nuclear')  rseq = _seqNuclear(seq);
  return rseq ? (_HEX_BY_SEQ[rseq] || null) : null;
}

function _hasH3(text){ return /^#{2,3}(?!#)/m.test(text); }

async function saveTextEdit(){
  if(!_editMode || !currentData) return;
  try{
    // block ### (section-level heading) — only #### and deeper are allowed
    const textsToCheck = _editDual
      ? [document.getElementById('textEditorArea0').value,
         document.getElementById('textEditorArea1').value]
      : [document.getElementById('textEditorArea').value];
    if(textsToCheck.some(_hasH3)){ setMsg(T('msg.edit_has_h3'), 'error'); return; }

    const upd = (num, field, text) => {
      _lsApplyHexOv(num, field, text);
      return Promise.resolve({ok: true});
    };

    // ── content ──────────────────────────────────────────────────────
    const contentJobs = [];
    if(_editDual){
      const t0 = document.getElementById('textEditorArea0').value;
      const t1 = document.getElementById('textEditorArea1').value;
      const jobs = [];
      if(t0 !== _editOrigText0) jobs.push(upd(currentData.num,'ci',t0).then(r=>{ if(!r.ok) throw new Error(); _HEX_BY_SEQ[currentData.sequence].ci=t0.split('\n'); _HEX_BY_NUM[currentData.num].ci=t0.split('\n'); }));
      if(t1 !== _editOrigText1) jobs.push(upd(currentData1.num,'ci',t1).then(r=>{ if(!r.ok) throw new Error(); _HEX_BY_SEQ[currentData1.sequence].ci=t1.split('\n'); _HEX_BY_NUM[currentData1.num].ci=t1.split('\n'); }));
      await Promise.all(jobs);
    } else {
      const d = _activeHex();
      const text = document.getElementById('textEditorArea').value;
      if(text !== _editOrigText){
        const r = await upd(d.num, _editField, text);
        if(!r.ok){ setMsg(T('msg.save_fail'),'error'); return; }
        const val = _editField === 'ci' ? text.split('\n') : text;
        _HEX_BY_SEQ[d.sequence][_editField] = val;
        _HEX_BY_NUM[d.num][_editField] = val;
      }
    }

    cancelTextEdit(); renderContent(currentData); renderHeader();
  } catch(e){ setMsg(T('msg.save_fail'), 'error'); }
}

(function(){
  let _t = null, _el = null;
  function _clear(el){ el.style.removeProperty('--sb-c'); el.style.removeProperty('--sb-c-hover'); }
  function _off(){ if(_el){ _clear(_el); _el = null; } }
  function _on(e){
    const el = e.target;
    if(el === document || el === document.documentElement) return;
    if(_el && _el !== el){ _clear(_el); }
    _el = el;
    el.style.setProperty('--sb-c','var(--c-gold)');
    el.style.setProperty('--sb-c-hover','var(--c-gold)');
    clearTimeout(_t);
    _t = setTimeout(_off, 400);
  }
  document.addEventListener('scroll', _on, true);
  document.addEventListener('mouseup', function(){ clearTimeout(_t); _off(); });
})();
(function(){
  const ov = document.getElementById('tip-overlay') || (() => { const d = document.createElement('div'); d.id = 'tip-overlay'; document.body.appendChild(d); return d; })();
  const GAP = 7, MARGIN = 4;
  function _vp(){ const vp = window.visualViewport; return vp ? {w:vp.width,h:vp.height,ox:vp.offsetLeft,oy:vp.offsetTop} : {w:window.innerWidth,h:window.innerHeight,ox:0,oy:0}; }
  function show(el){
    const text = el.dataset.tip;
    if(!text) return;
    ov.classList.remove('visible');
    ov.textContent = text;
    const ow = ov.offsetWidth, oh = ov.offsetHeight;
    const r = el.getBoundingClientRect();
    const vp = _vp();
    const below = el.classList.contains('tip-below');
    let x = r.left - vp.ox + r.width/2 - ow/2;
    x = Math.max(MARGIN, Math.min(vp.w - ow - MARGIN, x));
    let y = below ? r.bottom - vp.oy + GAP : r.top - vp.oy - oh - GAP;
    if( below && y + oh > vp.h - MARGIN) y = r.top - vp.oy - oh - GAP;
    if(!below && y < MARGIN)             y = r.bottom - vp.oy + GAP;
    y = Math.max(MARGIN, Math.min(vp.h - oh - MARGIN, y));
    ov.style.left = x + 'px';
    ov.style.top  = y + 'px';
    ov.classList.add('visible');
  }
  function hide(){ ov.classList.remove('visible'); }
  document.addEventListener('pointerover', function(e){
    const el = e.target.closest('[data-tip]');
    if(el) show(el);
  });
  document.addEventListener('pointerout', function(e){
    const el = e.target.closest('[data-tip]');
    if(el && !el.contains(e.relatedTarget)) hide();
  });
})();
