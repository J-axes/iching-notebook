","symbol":"䷁","short_name":"坤","ci":["坤：元、亨、利牝馬之貞。君子有攸往，先迷後得主利。西南得朋，東北喪朋，安貞吉。","初六：履霜，堅冰至。","六二：直方大，不習，无不利。","六三：含章可貞，或從王事，无成有終。","六四：括囊，无咎，无譽。","六五：黃裳，元吉。","上六：龍戰于野，其血玄黃。","用六：利永貞。"]},{"num":3,"name":"水雷屯","sequence":"100010","symbol":"䷂","short_name":"屯","ci":["屯：元、亨、利、貞，勿用有攸往，利建侯。","初九：磐桓，利居貞，利建侯。","六二：屯如邅如，乘馬班如，匪寇，婚媾，女子貞不字，十年乃字。","六三：即鹿无虞，惟入于林中，君子幾，不如舍，往吝。","六四：乘馬班如，求婚媾，往吉，无不利。","九五：屯其膏，小貞吉，大貞凶。","上六：乘馬班如，泣血漣如。"]},{"num":4,"name":"山水蒙","sequence":"010001","symbol":"䷃","short_name":"蒙","ci":["蒙：亨，匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告，利貞。","初六：發蒙，利用刑人，用説桎梏，以往吝。","九二：包蒙吉，納婦吉，子克家。","六三：勿用，取女見金夫，不有躬，无攸利。","六四：困蒙，吝。","六五：童蒙，吉。","上九：擊蒙，不利爲寇，利禦寇。"]},{"num":5,"name":"水天需","sequence":"111010","symbol":"䷄","short_name":"需","ci":["需：有孚，光亨貞吉，利涉大川。","初九：需于郊，利用恆，无咎。","九二：需于沙，小有言，終吉。","九三：需于泥，致寇至。","六四：需于血，出自穴。","九五：需于酒食，貞吉。","上六：入于穴，有不速之客三人來，敬之終吉。"]},{"num":6,"name":"天水讼","sequence":"010111","symbol":"䷅","short_name":"讼","ci":["訟：有孚，窒惕，中吉，終凶。利見大人，不利涉大川。","初六：不永所事，小有言，終吉。","九二：不克訟，歸而逋其邑，人三百戶，无眚。","六三：食舊德，貞厲終吉。或從王事，无成。","九四：不克訟，復即命，渝安貞，吉。","九五：訟，元吉。","上九：或錫之鞶帶，終朝三褫之。"]},{"num":7,"name":"地水師","sequence":"010000","symbol":"䷆","short_name":"師","ci":["師：貞，丈人吉，无咎。","初六：師出以律，否臧凶。","九二：在師中，吉，无咎，王三錫命。","六三：師或輿尸，凶。","六四：師左次，无咎。","六五：田有禽，利執言，无咎。長子帥師，弟子輿尸，貞凶。","上六：大君有命，開國承家，小人勿用。"]},{"num":8,"name":"水地比","sequence":"000010","symbol":"䷇","short_name":"比","ci":["比：吉，原筮，元永貞，无咎。不寧方來，後夫凶。","初六：有孚，比之无咎。有孚盈缶，終來有它，吉。","六二：比之自内，貞吉。","六三：比之匪人。","六四：外比之，貞吉。","九五：顯比，王用三驅，失前禽，邑人不誡，吉。","上六：比之无首，凶。"]},{"num":9,"name":"風天小畜","sequence":"111011","symbol":"䷈","short_name":"小畜","ci":["小畜，亨。密雲不雨，自我西郊。","初九：復自道，何其咎，吉。","九二：牽復，吉。","九三：輿說輻，夫妻反目。","六四：有孚，血去惕出，无咎。","九五：有孚攣如，富以其鄰。","上九：既雨既處，尚德載，婦貞厲。月幾望，君子征凶。"]},{"num":10,"name":"天澤履","sequence":"110111","symbol":"䷉","short_name":"履","ci":["履虎尾，不咥人，亨。","初九：素履往，无咎。","九二：履道坦坦，幽人貞吉。","六三：眇能視，跛能履，履虎尾，咥人凶，武人爲于大君。","九四：履虎尾，愬愬終吉。","九五：夬履，貞厲。","上九：視履考祥，其旋元吉。"]},{"num":11,"name":"地天泰","sequence":"111000","symbol":"䷊","short_name":"泰","ci":["泰，小往大來，吉亨。","初九：拔茅茹，以其彙，征吉。","九二：包荒，用馮河，不遐遺，朋亡，得尚于中行。","九三：无平不陂，无往不復，艱貞无咎，勿恤其孚，于食有福。","六四：翩翩不富，以其鄰，不戒以孚。","六五：帝乙歸妹，以祉元吉。","上六：城復于隍，勿用師，自邑告命，貞吝。"]},{"num":12,"name":"天地否","sequence":"000111","symbol":"䷋","short_name":"否","ci":["否之匪人。不利君子貞，大往小來。","初六：拔茅如，以其彙，貞吉，亨。","六二：包承，小人吉，大人否，亨。","六三：包羞。","九四：有命，无咎，疇離祉。","九五：休否，大人吉，其亡，其亡，繋于苞桑。","上九：傾否，先否後喜。"]},{"num":13,"name":"天火同人","sequence":"101111","symbol":"䷌","short_name":"同人","ci":["同人：于野，亨。利涉大川，利君子貞。","初九：同人于門，无咎。","六二：同人于宗，吝！","九三：伏戎于莽，升其高陵，三歲不興。","九四：乘其墉，弗克攻，吉。","九五：同人，先號咷而後笑，大師克相遇。","上九：同人于郊，无悔。"]},{"num":14,"name":"火天大有","sequence":"111101","symbol":"䷍","short_name":"大有","ci":["大有：元亨。","初九：无交害，匪咎，艱則无咎。","九二：大車以載，有攸往，无咎。","九三：公用亨于天子，小人弗克。","九四：匪其彭，无咎。","六五：厥孚交如，威如，吉。","上九：自天祐之，吉，无不利。"]},{"num":15,"name":"地山謙","sequence":"001000","symbol":"䷎","short_name":"謙","ci":["謙：亨，君子有終。","初六：謙謙君子，用涉大川，吉。","六二：鳴謙，貞吉。","九三：勞謙，君子有終，吉。","六四：无不利，撝謙。","六五：不富以其鄰，利用侵伐，无不利。","上六：鳴謙，利用行師，征邑國。"]},{"num":16,"name":"雷地豫","sequence":"000100","symbol":"䷏","short_name":"豫","ci":["豫：利建侯，行師。","初六：鳴豫，凶。","六二：介于石，不終日，貞吉。","六三：盱豫，悔。遲有悔。","九四：由豫，大有得，勿疑，朋盍簪。","六五：貞疾，恆不死。","上六：冥豫，成有渝，无咎。"]},{"num":17,"name":"澤雷隨","sequence":"100110","symbol":"䷐","short_name":"隨","ci":["隨：元，亨，利，貞，无咎。","初九：官有渝，貞吉，出門交有功。","六二：係小子，失丈夫。","六三：係丈夫，失小子，隨有求得，利居貞。","九四：隨有獲，貞凶，有孚在道以明，何咎？","九五：孚于嘉，吉。","上六：拘係之，乃從維之，王用亨于西山。"]},{"num":18,"name":"山風蠱","sequence":"011001","symbol":"䷑","short_name":"蠱","ci":["蠱：元亨，利涉大川。","初六：幹父之蠱，有子，考无咎，厲終吉。","九二：幹母之蠱，不可貞。","九三：幹父之蠱，小有悔，无大咎。","六四：裕父之蠱，往見吝。","六五：幹父之蠱，用譽。","上九：不事王侯，高尚其事。"]},{"num":19,"name":"地澤臨","sequence":"110000","symbol":"䷒","short_name":"臨","ci":["臨：元，亨，利，貞。至于八月有凶。","初九：咸臨，貞吉。","九二：咸臨，吉无不利。","六三：甘臨，无攸利，既憂之，无咎。","六四：至臨，无咎。","六五：知臨，大君之宜，吉。","上六：敦臨，吉，无咎。"]},{"num":20,"name":"風地觀","sequence":"000011","symbol":"䷓","short_name":"觀","ci":["觀：盥而不薦，有孚顒若。","初六：童觀，小人无咎，君子吝。","六二：闚觀，利女貞。","六三：觀我生，進退。","六四：觀國之光，利用賓于王。","九五：觀我生，君子无咎。","上九：觀其生，君子无咎。"]},{"num":21,"name":"火雷噬嗑","sequence":"100101","symbol":"䷔","short_name":"噬嗑","ci":["噬嗑：亨，利用獄。","初九：屨校滅趾，无咎。","六二：噬膚滅鼻，无咎。","六三：噬腊肉，遇毒，小吝，无咎。","九四：噬乾胏，得金矢，利艱貞，吉。","六五：噬乾肉，得黃金，貞厲，无咎。","上九：何校滅耳，凶。"]},{"num":22,"name":"山火賁","sequence":"101001","symbol":"䷕","short_name":"賁","ci":["賁：亨，小利有攸往。","初九：賁其趾，舍車而徒。","六二：賁其須。","九三：賁如濡如，永貞，吉。","六四：賁如皤如，白馬翰如，匪寇婚媾。","六五：賁于丘園，束帛戔戔，吝，終吉。","上九：白賁，无咎。"]},{"num":23,"name":"山地剝","sequence":"000001","symbol":"䷖","short_name":"剝","ci":["剝：不利有攸往。","初六：剝床以足，蔑貞，凶。","六二：剝床以辨，蔑貞凶。","六三：剝之，无咎。","六四：剝床以膚，凶。","六五：貫魚，以宮人寵，无不利。","上九：碩果不食，君子得輿，小人剝廬。"]},{"num":24,"name":"地雷復","sequence":"100000","symbol":"䷗","short_name":"復","ci":["復：亨，出入无疾，朋來无咎。反復其道，七日來復，利有攸往。","初九：不遠復，无祇悔，元吉。","六二：休復，吉。","六三：頻復，厲，无咎。","六四：中行獨復。","六五：敦復，无悔。","上六：迷復，凶，有災眚，用行師，終有大敗，以其國君凶，至于十年不克征。"]},{"num":25,"name":"天雷無妄","sequence":"100111","symbol":"䷘","short_name":"無妄","ci":["无妄：元，亨，利，貞，其匪正有眚，不利有攸往。","初九：无妄，往吉。","六二：不耕穫，不菑畬，則利有攸往。","六三：无妄之災，或繫之牛，行人之得，邑人之災。","九四：可貞，无咎。","九五：无妄之疾，勿藥有喜。","上九：无妄，行有眚，无攸利。"]},{"num":26,"name":"山天大畜","sequence":"111001","symbol":"䷙","short_name":"大畜","ci":["大畜：利貞，不家食，吉，利涉大川。","初九：有厲，利已。","九二：輿説輹。","九三：良馬逐，利艱貞，曰閑輿衛，利有攸往。","六四：童牛之牿，元吉。","六五：豶豕之牙，吉。","上九：何天之衢，亨。"]},{"num":27,"name":"山雷頤","sequence":"100001","symbol":"䷚","short_name":"頤","ci":["頤：貞吉，觀頤，自求口實。","初九：舍爾靈龜，觀我朵頤，凶。","六二：顚頤，拂經，于丘頤，征凶。","六三：拂頤，貞凶，十年勿用，无攸利。","六四：顚頤，吉，虎視眈眈，其欲逐逐，无咎。","六五：拂經，居貞吉，不可涉大川。","上九：由頤，厲吉，利涉大川。"]},{"num":28,"name":"澤風大過","sequence":"011110","symbol":"䷛","short_name":"大過","ci":["大過：棟橈，利有攸往，亨。","初六：藉用白茅，无咎。","九二：枯楊生稊，老夫得其女妻，无不利。","九三：棟橈，凶。","九四：棟隆，吉 ，有它吝。","九五：枯楊生華，老婦得其士夫，无咎无譽。","上六：過涉滅頂，凶，无咎。"]},{"num":29,"name":"坎爲水","sequence":"010010","symbol":"䷜","short_name":"坎","ci":["習坎：有孚，維心亨，行有尚。","初六：習坎，入于坎窞，凶。","九二：坎有險，求小得。","六三：來之坎坎，險且枕，入于坎窞，勿用。","六四：樽酒，簋貳，用缶，納約自牖，終无咎。","九五：坎不盈，祇既平，无咎。","上六：係用徽纆，寘于叢棘，三歲不得，凶。"]},{"num":30,"name":"離爲火","sequence":"101101","symbol":"䷝","short_name":"離","ci":["離：利貞，亨，畜牝牛，吉。","初九：履錯然，敬之，无咎。","六二：黃離，元吉。","九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。","九四：突如、其來如、焚如、死如、棄如。","六五：出涕沱若，戚嗟若，吉。","上九：王用出征，有嘉。折首，獲匪其醜，无咎。"]},{"num":31,"name":"澤山咸","sequence":"001110","symbol":"䷞","short_name":"咸","ci":["咸：亨，利，貞，取女吉。","初六：咸其拇。","六二：咸其腓，凶，居吉。","九三：咸其股，執其隨，往吝。","九四：貞吉，悔亡，憧憧往來，朋從爾思。","九五：咸其脢，无悔。","上六：咸其輔，頰，舌。"]},{"num":32,"name":"雷風恆","sequence":"011100","symbol":"䷟","short_name":"恆","ci":["恆：亨，无咎，利貞，利有攸往。","初六：浚恆，貞凶，无攸利。","九二：悔亡。","九三：不恆其德，或承之羞，貞吝。","九四：田无禽。","六五：恆其德，貞，婦人吉 ，夫子凶。","上六：振恆，凶。"]},{"num":33,"name":"天山遯","sequence":"001111","symbol":"䷠","short_name":"遯","ci":["遯：亨，小利貞。","初六：遯尾厲，勿用有攸往。","六二：執之用黃牛之革，莫之勝説。","九三：係遯，有疾厲，畜臣妾，吉。","九四：好遯，君子吉，小人否。","九五：嘉遯，貞吉。","上九：肥遯，无不利。"]},{"num":34,"name":"雷天大壯","sequence":"111100","symbol":"䷡","short_name":"大壯","ci":["大壯：利，貞。","初九：壯于趾，征凶，有孚。","九二：貞吉。","九三：小人用壯，君子用罔。貞厲，羝羊觸藩，羸其角。","九四：貞吉，悔亡，藩決不羸，壯于大輿之輹。","六五：喪羊于易，无悔。","上六：羝羊觸藩，不能退，不能遂，无攸利，艱則吉。"]},{"num":35,"name":"火地晉","sequence":"000101","symbol":"䷢","short_name":"晉","ci":["晉：康侯用錫馬蕃庶，晝日三接。","初六：晉如摧如，貞吉，罔孚，裕无咎。","六二：晉如愁如，貞吉。受茲介福，于其王母。","六三：眾允，悔亡。","九四：晉如鼫鼠，貞厲。","六五：悔亡，失得勿恤，往吉，无不利。","上九：晉其角，維用伐邑，厲吉无咎，貞吝。"]},{"num":36,"name":"地火明夷","sequence":"101000","symbol":"䷣","short_name":"明夷","ci":["明夷：利艱貞。","初九：明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。","六二：明夷，夷于左股，用拯馬壯，吉。","九三：明夷于南狩，得其大首，不可疾貞。","六四：入于左腹，獲明夷之心，于出門庭。","六五：箕子之明夷，利貞。","上六：不明晦，初登于天，後入于地。"]},{"num":37,"name":"風火家人","sequence":"101011","symbol":"䷤","short_name":"家人","ci":["家人：利女貞。","初九：閑有家，悔亡。","六二：无攸遂，在中饋，貞吉。","九三：家人嗃嗃，悔厲吉，婦子嘻嘻，終吝。","六四：富家，大吉。","九五：王假有家，勿恤，吉。","上九：有孚威如，終吉。"]},{"num":38,"name":"火澤睽","sequence":"110101","symbol":"䷥","short_name":"睽","ci":["睽：小事吉。","初九：悔亡，喪馬勿逐，自復；見惡人，无咎。","九二：遇主于巷，无咎。","六三：見輿曳，其牛掣，其人天且劓，无初有終。","九四：睽孤，遇元夫，交孚，厲无咎。","六五：悔亡，厥宗噬膚，往何咎。","上九：睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往，遇雨則吉。"]},{"num":39,"name":"水山蹇","sequence":"001010","symbol":"䷦","short_name":"蹇","ci":["蹇：利西南，不利東北，利見大人，貞吉。","初六：往蹇，來譽。","六二：王臣蹇蹇，匪躬之故。","九三：往蹇，來反。","六四：往蹇，來連。","九五：大蹇，朋來。","上六：往蹇，來碩，吉，利見大人。"]},{"num":40,"name":"雷水解","sequence":"010100","symbol":"䷧","short_name":"解","ci":["解：利西南，无所往，其來復吉，有攸往，夙吉。","初六：无咎。","九二：田獲三狐，得黃矢，貞吉。","六三：負且乘，致寇至，貞吝。","九四：解而拇，朋至斯孚。","六五：君子維有解，吉，有孚于小人。","上六：公用射隼于高墉之上，獲之无不利。"]},{"num":41,"name":"山澤損","sequence":"110001","symbol":"䷨","short_name":"損","ci":["損：有孚，元吉，无咎，可貞，利有攸往。曷之用？二簋可用享。","初九：已事遄往，无咎，酌損之。","九二：利貞，征凶，弗損益之。","六三：三人行，則損一人。一人行，則得其友。","六四：損其疾，使遄有喜，无咎。","六五：或益之，十朋之龜，弗克違，元吉。","上九：弗損益之，无咎，貞吉，利有攸往，得臣无家。"]},{"num":42,"name":"風雷益","sequence":"100011","symbol":"䷩","short_name":"益","ci":["益：利有攸往，利涉大川。","初九：利用爲大作，元吉，无咎。","六二：或益之，十朋之龜，弗克違，永貞吉，王用享于帝，吉。","六三：益之用凶事，无咎。有孚中行，告公用圭。","六四：中行，告公從，利用爲依遷國。","九五：有孚惠心，勿問元吉，有孚惠我德。","上九：莫益之，或擊之，立心勿恆，凶。"]},{"num":43,"name":"澤天夬","sequence":"111110","symbol":"䷪","short_name":"夬","ci":["夬：揚于王庭，孚號有厲。告自邑，不利即戎，利有攸往。","初九：壯于前趾，往不勝爲咎。","九二：惕號，莫夜有戎，勿恤。","九三：壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎。","九四：臀无膚，其行次且，牽羊悔亡，聞言不信。","九五：莧陸夬夬，中行无咎。","上六：无號，終有凶。"]},{"num":44,"name":"天風姤","sequence":"011111","symbol":"䷫","short_name":"姤","ci":["姤：女壯，勿用取女。","初六：繫于金柅，貞吉。有攸往，見凶。羸豕孚蹢躅。","九二：包有魚，无咎，不利賓。","九三：臀无膚，其行次且，厲，无大咎。","九四：包无魚，起凶。","九五：以杞包瓜，含章，有隕自天。","上九：姤其角，吝，无咎。"]},{"num":45,"name":"澤地萃","sequence":"000110","symbol":"䷬","short_name":"萃","ci":["萃：亨，王假有廟。利見大人，亨，利貞。用大牲吉，利有攸往。","初六：有孚不終，乃亂乃萃，若號，一握爲笑，勿恤，往无咎。","六二：引吉，无咎，孚乃利用禴。","六三：萃如嗟如，无攸利，往无咎，小吝。","九四：大吉无咎。","九五：萃有位，无咎。匪孚，元永貞，悔亡。","上六：齎咨涕洟，无咎。"]},{"num":46,"name":"地風升","sequence":"011000","symbol":"䷭","short_name":"升","ci":["升：元亨，用見大人，勿恤，南征吉。","初六：允升，大吉。","九二：孚乃利用禴，无咎。","九三：升虛邑。","六四：王用享于岐山，吉 ，无咎。","六五：貞，吉，升階。","上六：冥升，利于不息之貞。"]},{"num":47,"name":"澤水困","sequence":"010110","symbol":"䷮","short_name":"困","ci":["困：亨，貞，大人吉，无咎，有言不信。","初六：臀困于株木，入于幽谷，三歲不覿。","九二：困于酒食，朱紱方來，利用享祀：征凶，无咎。","六三：困于石，據于蒺藜，入于其宮，不見其妻，凶。","九四：來徐徐，困于金車，吝，有終。","九五：劓刖，困于赤紱，乃徐有説，利用祭祀。","上六：困于葛藟，于臲卼，曰動悔有悔，征吉。"]},{"num":48,"name":"水風井","sequence":"011010","symbol":"䷯","short_name":"井","ci":["井：改邑不改井，无喪无得，往來井井。汔至，亦未繘井，羸其瓶，凶。","初六：井泥不食，舊井无禽。","九二：井谷射鮒，甕敝漏。","九三：井渫不食，爲我心惻，可用汲，王明並受其福。","六四：井甃，无咎。","九五：井洌，寒泉食。","上六：井收勿幕，有孚元吉。"]},{"num":49,"name":"澤火革","sequence":"101110","symbol":"䷰","short_name":"革","ci":["革：已日乃孚，元亨利貞，悔亡。","初九：鞏用黃牛之革。","六二：已日乃革之，征吉，无咎。","九三：征凶，貞厲。革言三就，有孚。","九四：悔亡，有孚，改命，吉。","九五：大人虎變，未占有孚。","上六：君子豹變，小人革面，征凶，居貞吉。"]},{"num":50,"name":"火風鼎","sequence":"011101","symbol":"䷱","short_name":"鼎","ci":["鼎：元吉、亨。","初六：鼎顚趾，利出否。得妾以其子，无咎。","九二：鼎有實，我仇有疾，不我能即，吉。","九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。","九四：鼎折足，覆公餗，其形渥，凶。","六五：鼎黃耳，金鉉，利貞。","上九：鼎玉鉉，大吉，无不利。"]},{"num":51,"name":"震爲雷","sequence":"100100","symbol":"䷲","short_name":"震","ci":["震：亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。","初九：震來虩虩，後笑言啞啞，吉。","六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。","六三：震蘇蘇，震行无眚。","九四：震遂泥。","六五：震往來厲，億无喪有事。","上六：震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎，婚媾有言。"]},{"num":52,"name":"艮爲山","sequence":"001001","symbol":"䷳","short_name":"艮","ci":["艮其背，不獲其身，行其庭，不見其人，无咎。","初六：艮其趾，无咎，利永貞。","六二：艮其腓，不拯其隨，其心不快。","九三：艮其限，列其夤，厲薰心。","六四：艮其身，无咎。","六五：艮其輔，言有序，悔亡。","上九：敦艮，吉。"]},{"num":53,"name":"風山漸","sequence":"001011","symbol":"䷴","short_name":"漸","ci":["漸：女歸吉，利貞。","初六：鴻漸于干，小子厲，有言，无咎。","六二：鴻漸于磐，飲食衎衎，吉。","九三：鴻漸于陸，夫征不復，婦孕不育，凶，利禦寇。","六四：鴻漸于木，或得其桷，无咎。","九五：鴻漸于陵，婦三歲不孕，終莫之勝，吉。","上九：鴻漸于陸，其羽可用爲儀，吉。"]},{"num":54,"name":"雷澤歸妹","sequence":"110100","symbol":"䷵","short_name":"歸妹","ci":["歸妹，征凶，无攸利。","初九：歸妹以娣，跛能履，征吉。","九二：眇能視，利幽人之貞。","六三：歸妹以須，反歸以娣。","九四：歸妹愆期，遲歸有時。","六五：帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉 。","上六：女承筐无實，士刲羊无血，无攸利。"]},{"num":55,"name":"雷火豐","sequence":"101100","symbol":"䷶","short_name":"豐","ci":["豐：亨，王假之，勿憂，宜日中。","初九：遇其配主，雖旬无咎，往有尚。","六二：豐其蔀，日中見斗，往得疑疾，有孚發若，吉。","九三：豐其沛，日中見沬，折其右肱，无咎。","九四：豐其蔀，日中見斗，遇其夷主，吉。","六五：來章，有慶譽，吉。","上六：豐其屋，蔀其家，闚其戶，闃其无人，三歲不覿，凶。"]},{"num":56,"name":"火山旅","sequence":"001101","symbol":"䷷","short_name":"旅","ci":["旅：小亨、旅貞吉。","初六：旅瑣瑣，斯其所取災。","六二：旅即次，懷其資，得童僕貞。","九三：旅焚其次，喪其童僕，貞厲。","九四：旅于處，得其資斧，我心不快。","六五：射雉，一矢亡，終以譽命。","上九：鳥焚其巢，旅人先笑後號咷，喪牛于易，凶。"]},{"num":57,"name":"巽爲風","sequence":"011011","symbol":"䷸","short_name":"巽","ci":["巽：小亨。利有攸往，利見大人。","初六：進退，利武人之貞。","九二：巽在牀下，用史巫紛若，吉，无咎。","九三：頻巽，吝。","六四：悔亡，田獲三品。","九五：貞吉，悔亡，无不利，无初有終，先庚三日，後庚三日，吉。","上九：巽在床下，喪其資斧，貞凶。"]},{"num":58,"name":"兌爲澤","sequence":"110110","symbol":"䷹","short_name":"兌","ci":["兌：亨，利、貞。","初九：和兌，吉。","九二：孚兌，吉，悔亡。","六三：來兌，凶。","九四：商兌未寧，介疾有喜。","九五：孚于剝，有厲。","上六：引兌"]},{"num":59,"name":"風水渙","sequence":"010011","symbol":"䷺","short_name":"渙","ci":["渙：亨。王假有廟，利涉大川，利貞。","初六：用拯馬壯，吉。","九二：渙奔其機，悔亡。","六三：渙其躬，无悔。","六四：渙其群，元吉。渙有丘，匪夷所思。","九五：渙汗其大號，渙王居，无咎。","上九：渙其血，去逖出，无咎。"]},{"num":60,"name":"水澤節","sequence":"110010","symbol":"䷻","short_name":"節","ci":["節：亨，苦節，不可貞。","初九：不出户庭，无咎。","九二：不出門庭，凶。","六三：不節若，則嗟若，无咎。","六四：安節，亨。","九五：甘節，吉，往有尚。","上六：苦節，貞凶，悔亡。"]},{"num":61,"name":"風澤中孚","sequence":"110011","symbol":"䷼","short_name":"中孚","ci":["中孚：豚魚吉，利涉大川，利貞。","初九：虞吉。有它，不燕。","九二：鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。","六三：得敵，或鼓或罷，或泣或歌。","六四：月幾望，馬匹亡，无咎。","九五：有孚攣如，无咎。","上九：翰音登于天，貞凶。"]},{"num":62,"name":"雷山小過","sequence":"001100","symbol":"䷽","short_name":"小過","ci":["小過：亨，利，貞。","初六：飛鳥以凶。","六二：過其祖，遇其妣，不及其君，遇其臣，无咎。","九三：弗過防之，從或戕之，凶。","九四：无咎，弗過遇之，往厲必戒，勿用永貞。","六五：密雲不雨，自我西郊，公弋取彼在穴。","上六：弗遇過之，飛鳥離之，凶，是謂災眚。"]},{"num":63,"name":"水火既濟","sequence":"101010","symbol":"䷾","short_name":"既濟","ci":["既濟：亨小，利貞，初吉，終亂。","初九：曳其輪，濡其尾，无咎。","六二：婦喪其茀，勿逐，七日得。","九三：高宗伐鬼方，三年克之，小人勿用。","六四：繻有衣袽，終日戒。","九五：東鄰殺牛，不如西鄰之禴祭，實受其福。","上六：濡其首，厲。"]},{"num":64,"name":"火水未濟","sequence":"010101","symbol":"䷿","short_name":"未濟","ci":["未濟：亨。小狐汔濟，濡其尾，无攸利。","初六：濡其尾，吝。","九二：曳其輪，貞吉。","六三：未濟，征凶，利涉大川。","九四：貞吉 ，悔亡，震用伐鬼方，三年有賞于大國。","六五：貞吉无悔，君子之光，有孚，吉。","上九：有孚于飲酒，无咎，濡其首，有孚失是。"]}],"lit_mode":"zhuxi7"};
const _EMBEDDED_HEX = {"111111":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/001.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：乾剛坤柔**\n\n#### 序\n**序卦曰：有天地，然後萬物生焉。**","text.tab3":"&0&\n**乾：元、亨、利、貞。**\n**象曰：天行健，君子以自強不息。**\n/0&\n#### 彖\n\n**彖曰：大哉乾元，萬物資始，乃統天。雲行雨施，品物流形，大明終始，六位時成，時乘六龍以御天。乾道變化，各正性命，保合大和，乃利貞。首出庶物，萬國咸寧。**\n\n#### 爻\n\n&1&\n##### 初九：潛龍勿用。\n\n##### 象曰：潛龍勿用，陽在下也。\n\n##### 文言曰：初九曰：「潛龍勿用。」何謂也？子曰：「龍德而隱者也。不易乎世，不成乎名。遯世无悶，不見是而无悶。樂則行之，憂則違之，確乎其不可拔。潛龍也。」\n/1&\n\n&2&\n##### 九二：見龍在田，利見大人。\n\n##### 象曰：見龍在田，德施普也。\n\n##### 文言曰：九二曰：「見龍在田，利見大人。」何謂也？子曰：「龍德而正中者也。庸言之信，庸行之謹，閑邪存其誠，善世而不伐，德博而化。《易》曰：『見龍在田，利見大人。』君德也。」\n/2&\n\n&3&\n##### 九三：君子終日乾乾，夕惕若，厲，无咎。\n\n##### 象曰：終日乾乾，反復道也。\n\n##### 文言曰：九三曰：「君子終日乾乾，夕惕若，厲无咎。」何謂也？子曰：「君子進德脩業，忠信所以進德也。脩辭立其誠，所以居業也。知至至之，可與幾也；知終終之，可與存義也。是故居上位而不驕，在下位而不憂，故乾乾因其時而惕，雖危无咎矣。」\n/3&\n\n&4&\n##### 九四：或躍在淵，无咎。\n\n##### 象曰：或躍在淵，進无咎也。\n\n##### 文言曰：九四曰：「或躍在淵，无咎。」何謂也？子曰：「上下无常，非為邪也。進退无恆，非離羣也。君子進德脩業，欲及時也。故无咎。」\n/4&\n\n&5&\n##### 九五：飛龍在天，利見大人。\n\n##### 象曰：飛龍在天，大人造也。\n\n##### 文言曰：九五曰：「飛龍在天，利見大人。」何謂也？子曰：「同聲相應，同氣相求。水流濕，火就燥；雲從龍，風從虎，聖人作而萬物覩。本乎天者親上，本乎地者親下，則各從其類也。」\n/5&\n\n&6&\n##### 上九：亢龍有悔。\n\n##### 象曰：亢龍有悔，盈不可久也。\n\n##### 文言曰：上九曰：「亢龍有悔。」何謂也？子曰：「貴而无位，高而无民。賢人在下位而无輔，是以動而有悔也。」\n/6&\n\n&7&\n##### 用九：見群龍无首，吉。\n\n##### 象曰：用九，天德不可為首也。\n/7&\n\n#### 文言\n\n##### 文言曰：元者善之長也，亨者嘉之會也，利者義之和也，貞者事之幹也。君子體仁足以長人，嘉會足以合禮，利物足以和義，貞固足以幹事。君子行此四德者，故曰：「乾，元亨利貞。」\n##### 潛龍勿用，下也。見龍在田，時舍也。終日乾乾，行事也。或躍在淵，自試也。飛龍在天，上治也。亢龍有悔，窮之災也。乾元用九，天下治也。\n##### 潛龍勿用，陽氣潛藏。見龍在田，天下文明。終日乾乾，與時偕行。或躍在淵，乾道乃革。飛龍在天，乃位乎天德。亢龍有悔，與時偕極。乾元用九，乃見天則。\n##### 乾元者，始而亨者也。利貞者，性情也。乾始能以美利利天下，不言所利，大矣哉！大哉乾乎！剛健中正，純粹精也。六爻發揮，旁通情也。時乘六龍，以御天也。雲行雨施，天下平也。\n##### 君子以成德為行，日可見之行也。潛之為言也，隱而未見，行而未成，是以君子弗用也。\n##### 君子學以聚之，問以辯之，寬以居之，仁以行之。《易》曰：「見龍在田，利見大人。」君德也。\n##### 九三重剛而不中，上不在天，下不在田，故乾乾因其時而惕，雖危无咎矣。\n##### 九四重剛而不中，上不在天，下不在田，中不在人，故或之。或之者，疑之也，故无咎。\n##### 夫大人者，與天地合其德，與日月合其明，與四時合其序，與鬼神合其吉凶。先天而天弗違，後天而奉天時。天且弗違，而況於人乎？況於鬼神乎？\n##### 亢之為言也，知進而不知退，知存而不知亡，知得而不知喪。其唯聖人乎！知進退存亡而不失其正者，其唯聖人乎！"},"000000":{"text.tab1":"#### 圖\n![本地圖片測試(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/002.jpg)\n\n文字格式測試\n\n普通文字\n{坤|ㄎㄨㄣ}：{元|ㄩㄢˊ}、{亨|ㄏㄥ}、{利|ㄌㄧˋ}{牝|ㄆㄧㄣˋ}{馬|ㄇㄚˇ}{之|ㄓ}{貞|ㄓㄣ}。\n\n粗體文字 (**)\n**{坤|ㄎㄨㄣ}：{元|ㄩㄢˊ}、{亨|ㄏㄥ}、{利|ㄌㄧˋ}{牝|ㄆㄧㄣˋ}{馬|ㄇㄚˇ}{之|ㄓ}{貞|ㄓㄣ}。**\n\n標題文字（####）\n#### {坤|ㄎㄨㄣ}：{元|ㄩㄢˊ}、{亨|ㄏㄥ}、{利|ㄌㄧˋ}{牝|ㄆㄧㄣˋ}{馬|ㄇㄚˇ}{之|ㄓ}{貞|ㄓㄣ}。\n\n標題文字（#####）\n##### {坤|ㄎㄨㄣ}：{元|ㄩㄢˊ}、{亨|ㄏㄥ}、{利|ㄌㄧˋ}{牝|ㄆㄧㄣˋ}{馬|ㄇㄚˇ}{之|ㄓ}{貞|ㄓㄣ}。\n\n條列文字（•）\n• 一、{坤|ㄎㄨㄣ}：\n• 1. {元|ㄩㄢˊ}、{亨|ㄏㄥ}、{利|ㄌㄧˋ}{牝|ㄆㄧㄣˋ}{馬|ㄇㄚˇ}{之|ㄓ}{貞|ㄓㄣ}。\n\n引用文字（>）\n> {坤|ㄎㄨㄣ}：{元|ㄩㄢˊ}、{亨|ㄏㄥ}、{利|ㄌㄧˋ}{牝|ㄆㄧㄣˋ}{馬|ㄇㄚˇ}{之|ㄓ}{貞|ㄓㄣ}。\n\n連結文字\n[https://example.com](https://example.com)\n\n![線上圖片測試 https://picsum.photos/1200/300](https://picsum.photos/1200/300)","text.tab2":"#### 雜\n\n**雜卦曰：乾剛坤柔**\n\n#### 序\n**序卦曰：有天地，然後萬物生焉。**","text.tab3":"&0&\n**坤：元、亨、利牝馬之貞。**\n**象曰：地勢坤，君子以厚德載物。**\n\n/0&\n#### 彖\n\n**彖曰：至哉坤元，萬物資生，乃順承天。坤厚載物，德合无疆，含弘光大，品物咸亨。牝馬地類，行地无疆。柔順利貞，君子攸行，先迷失道，後順得常。西南得朋，乃與類行，東北喪朋，乃終有慶，安貞之吉，應地无疆。**\n\n#### 爻\n\n&1&\n##### 初六：履霜，堅冰至。\n\n##### 象曰：履霜堅冰，陰始凝也。馴致其道，至堅冰也。\n\n/1&\n\n&2&\n##### 六二：直方大，不習，无不利。\n\n##### 象曰：六二之動，直以方也。不習无不利，地道光也。\n\n/2&\n\n&3&\n##### 六三：含章可貞，或從王事，无成有終。\n\n##### 象曰：含章可貞，以時發也。或從王事，知光大也。\n\n/3&\n\n&4&\n##### 六四：括囊，无咎，无譽。\n\n##### 象曰：括囊无咎，慎不害也。\n\n/4&\n\n&5&\n##### 六五：黄裳，元吉。\n\n##### 象曰：黃裳元吉，文在中也。\n\n/5&\n\n&6&\n##### 上六：龍戰於野，其血玄黃。\n\n##### 象曰：龍戰于野，其道窮也。\n\n/6&\n\n&7&\n##### 用六：利永貞。\n\n##### 象曰：用六永貞，以大終也。\n\n/7&\n\n#### 文言\n\n##### 文言曰：坤至柔而動也剛，至靜而德方。後得主而有常，含萬物而化光，坤道其順乎？承天而時行。\n##### 積善之家，必有餘慶。積不善之家，必有餘殃。臣弑其君，子弑其父，非一朝一夕之故，其所由來者漸矣，由辯之不早辯也。《易》曰：「履霜堅冰至。」蓋言順也。\n##### 直其正也，方其義也。君子敬以直內，義以方外，敬義立而德不孤。直方大，不習无不利，則不疑其所行也。\n##### 陰雖有美，含之，以從王事，弗敢成也。地道也，妻道也，臣道也。地道无成而代有終也。\n##### 天地變化，草木蕃。天地閉，賢人隱。《易》曰：「括囊，无咎无譽。」蓋言謹也。\n##### 君子黃中通理，正位居體。美在其中而暢於四支，發於事業，美之至也。\n##### 陰疑於陽必戰，為其嫌於无陽也，故稱龍焉。猶未離其類也，故稱血焉。夫玄黃者，天地之雜也，天玄而地黃。"},"100010":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/003.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：屯見而不失其居，蒙雜而著。**\n\n#### 序\n**序卦曰：盈天地之間者唯萬物，故受之以屯。屯者，盈也，屯者，物之始生也。**","text.tab3":"&0&\n**屯：元、亨、利、貞，勿用有攸往，利建侯。**\n**象曰：雲雷，屯；君子以經綸。**\n/0&\n#### 彖\n\n**彖曰：屯，剛柔始交而難生，動乎險中，大亨，貞。雷雨之動，滿盈。天造草昧，宜建侯而不寧。**\n\n#### 爻\n\n&1&\n##### 初九：盤桓，利居貞，利建侯。\n\n##### 象曰：雖磐桓，志行正也。以貴下賤，大得民也。\n\n/1&\n\n&2&\n##### 六二：屯如邅如，乘馬班如，匪寇，婚媾，女子貞不字，十年乃字。\n\n##### 象曰：六二之難，乘剛也。十年乃字，反常也。\n\n/2&\n\n&3&\n##### 六三：即鹿无虞，惟入于林中，君子幾，不如舍，往吝。\n\n##### 象曰：即鹿无虞，以從禽也。君子舍之，往吝窮也。\n\n/3&\n\n&4&\n##### 六四：乘馬班如，求婚媾，往吉，无不利。\n\n##### 象曰：求而往，明也。\n\n/4&\n\n&5&\n##### 九五：屯其膏，小貞吉，大貞凶。\n\n##### 象曰：屯其膏，施未光也。\n\n/5&\n\n&6&\n##### 上六：乘馬班如，泣血漣如。\n\n##### 象曰：泣血漣如，何可長也。\n\n/6&"},"010001":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/004.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：屯見而不失其居，蒙雜而著。**\n\n#### 序\n**序卦曰：物生必蒙，故受之以蒙。蒙者，蒙也，物之穉也。**","text.tab3":"&0&\n**蒙：亨，匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告，利貞。**\n**象曰：山下出泉，蒙；君子以果行育德。**\n/0&\n#### 彖\n\n**彖曰：蒙，山下有險，險而止，蒙。蒙，亨，以亨行，時中也。匪我求童蒙，童蒙求我，志應也。初筮告，以剛中也。再三瀆，瀆則不告，瀆蒙也。蒙以養正，聖功也。**\n\n#### 爻\n\n&1&\n##### 初六：發蒙，利用刑人，用説桎梏，以往吝。\n\n##### 象曰：利用刑人，以正法也。\n\n/1&\n\n&2&\n##### 九二：包蒙吉，納婦吉，子克家。\n\n##### 象曰：子克家，剛柔接也。\n\n/2&\n\n&3&\n##### 六三：勿用，取女見金夫，不有躬，无攸利。\n\n##### 象曰：勿用取女，行不順也。\n\n/3&\n\n&4&\n##### 六四：困蒙，吝。\n\n##### 象曰：困蒙之吝，獨遠實也。\n\n/4&\n\n&5&\n##### 六五：童蒙，吉。\n\n##### 象曰：童蒙之吉，順以巽也。\n\n/5&\n\n&6&\n##### 上九：擊蒙，不利爲寇，利禦寇。\n\n##### 象曰：利禦寇，上下順也。\n\n/6&"},"111010":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/005.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：需不進也，訟不親也。**\n\n#### 序\n**序卦曰：物穉不可不養也，故受之以需。需者，飲食之道也。**","text.tab3":"&0&\n**需：有孚，光亨贞吉，利涉大川。**\n**象曰：雲上於天，需；君子以飲食宴樂。**\n/0&\n#### 彖\n\n**彖曰：需，須也，險在前也。剛健而不陷，其義不困窮矣。需，有孚，光亨，貞吉，位乎天位，以正中也。利涉大川，往有功也。**\n\n#### 爻\n\n&1&\n##### 初九：需于郊，利用恆，无咎。\n\n##### 象曰：需于郊，不犯難行也。利用恆，无咎，未失常也。\n\n/1&\n\n&2&\n##### 九二：需于沙，小有言，終吉。\n\n##### 象曰：需于沙，衍在中也。雖小有言，以終吉也。\n\n/2&\n\n&3&\n##### 九三：需于泥，致寇至。\n\n##### 象曰：需于泥，災在外也。自我致寇，敬慎不敗也。\n\n/3&\n\n&4&\n##### 六四：需于血，出自穴。\n\n##### 象曰：需于血，順以聽也。\n\n/4&\n\n&5&\n##### 九五：需於酒食，貞吉。\n\n##### 象曰：酒食，貞吉，以中正也。\n\n/5&\n\n&6&\n##### 上六：入于穴，有不速之客三人來，敬之終吉。\n\n##### 象曰：不速之客來，敬之終吉。雖不當位，未大失也。\n\n/6&"},"010111":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/006.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：需不進也，訟不親也。**\n\n#### 序\n**序卦曰：飲食必有訟，故受之以訟。**","text.tab3":"&0&\n**訟：有孚，窒惕，中吉，終凶。**\n**象曰：天與水違行，訟；君子以作事謀始。**\n/0&\n#### 彖\n\n**彖曰：訟，上剛下險，險而健。訟，訟有孚，窒惕，中吉，剛來而得中也。終凶，訟不可成也。利見大人，尚中正也。不利涉大川，入于淵也。**\n\n#### 爻\n\n&1&\n##### 初六：不永所事，小有言，終吉。\n\n##### 象曰：不永所事，訟不可長也。雖小有言，其辯明也。\n\n/1&\n\n&2&\n##### 九二：不克訟，歸而逋，其邑人三百户，无眚。\n\n##### 象曰：不克訟，歸逋竄也。自下訟上，患至掇也。\n\n/2&\n\n&3&\n##### 六三：食舊德，貞厲終吉。或從王事，无成。\n\n##### 象曰：食舊德，從上吉也。\n\n/3&\n\n&4&\n##### 九四：不克訟，復即命，渝安貞，吉。\n\n##### 象曰：復即命渝，安貞，不失也。\n\n/4&\n\n&5&\n##### 九五：訟，元吉。\n\n##### 象曰：訟，元吉，以中正也。\n\n/5&\n\n&6&\n##### 上九：或錫之鞶帶，終朝三褫之。\n\n##### 象曰：以訟受服，亦不足敬也。\n\n/6&"},"010000":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/007.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：比樂師憂**\n\n#### 序\n**序卦曰：訟必有衆起，故受之以師。師者，衆也。**","text.tab3":"&0&\n**師：貞，丈人吉，无咎。**\n**象曰：地中有水，師；君子以容民畜衆。**\n/0&\n#### 彖\n\n**彖曰：師，眾也，貞，正也，能以眾正，可以王矣。剛中而應，行險而順，以此毒天下，而民從之，吉又何咎矣。**\n\n#### 爻\n\n&1&\n##### 初六：師出以律，否臧凶。\n\n##### 象曰：師出以律；失律，凶也。\n\n/1&\n\n&2&\n##### 九二：在師中，吉，无咎，王三錫命。\n\n##### 象曰：在師中吉，承天寵也。王三錫命，懷萬邦也。\n\n/2&\n\n&3&\n##### 六三：師或輿尸，凶。\n\n##### 象曰：師或輿尸，大无功也。\n\n/3&\n\n&4&\n##### 六四：師左次，无咎。\n\n##### 象曰：左次无咎，未失常也。\n\n/4&\n\n&5&\n##### 六五：田有禽，利執言，无咎。長子帥師，弟子輿尸，貞凶。\n\n##### 象曰：長子帥師，以中行也。弟子輿尸，使不當也。\n\n/5&\n\n&6&\n##### 上六：大君有命，開國成家，小人勿用。\n\n##### 象曰：大君有命，以正功也。小人勿用，必亂邦也。\n\n/6&"},"000010":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/008.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：比樂師憂**\n\n#### 序\n**序卦曰：衆必有所比，故受之以比。比者，比也。**","text.tab3":"&0&\n**比：吉，原筮，元永貞，无咎。不寧方來，後夫凶。**\n**象曰：地上有水，比；先王以建萬國，親諸侯。**\n/0&\n#### 彖\n\n**彖曰：比，吉也。比，輔也，下順從也。原筮元永貞，无咎，以剛中也。不寧方來，上下應也。後夫凶，其道窮也。**\n\n#### 爻\n\n&1&\n##### 初六：有孚，比之无咎。有孚盈缶，終來有它，吉。\n\n##### 象曰：比之初六，有它吉也。\n\n/1&\n\n&2&\n##### 六二：比之自内，貞吉。\n\n##### 象曰：比之自內，不自失也。\n\n/2&\n\n&3&\n##### 六三：比之匪人。\n\n##### 象曰：比之匪人，不亦傷乎！\n\n/3&\n\n&4&\n##### 六四：外比之，貞吉。\n\n##### 象曰：外比於賢，以從上也。\n\n/4&\n\n&5&\n##### 九五：顯比，王用三驅，失前禽，邑人不誡，吉。\n\n##### 象曰：顯比之吉，位正中也。舍逆取順，失前禽也。邑人不誡，上使中也。\n\n/5&\n\n&6&\n##### 上六：比之无首，凶。\n\n##### 象曰：比之无首，无所終也。\n\n/6&"},"111011":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/009.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：小畜寡也，履不處也。**\n\n#### 序\n**序卦曰：比必有所畜，故受之以小畜。**","text.tab3":"&0&\n**小畜，亨。密雲不雨，自我西郊。**\n**象曰：風行天上，小畜，君子以懿文德。**\n/0&\n#### 彖\n\n**彖曰：小畜，柔得位而上下應之，曰小畜。健而巽，剛中而志行，乃亨。密雲不雨，尚往也；自我西郊，施未行也。**\n\n#### 爻\n\n&1&\n##### 初九：復自道，何其咎，吉。\n\n##### 象曰：復自道，其義吉也。\n\n/1&\n\n&2&\n##### 九二：牽復，吉。\n\n##### 象曰：牽復在中，亦不自失也。\n\n/2&\n\n&3&\n##### 九三：輿説輻，夫妻反目。(説即脱)\n\n##### 象曰：夫妻反目，不能正室也。\n\n/3&\n\n&4&\n##### 六四：有孚，血去惕出，无咎。\n\n##### 象曰：有孚。惕出。上合志也。\n\n/4&\n\n&5&\n##### 九五：有孚攣如，富以其鄰。\n\n##### 象曰：有孚攣如，不獨富也。\n\n/5&\n\n&6&\n##### 上九：既雨既處，尚德載，婦貞厲。\n\n##### 象曰：既雨既處，德積載也。君子征凶，有所疑也。\n\n/6&"},"110111":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/010.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：小畜寡也，履不處也。**\n\n#### 序\n**序卦曰：物畜然後有禮，故受之以履。**","text.tab3":"&0&\n**履虎尾，不咥人，亨。**\n**象曰：上天下澤，履；君子以辨上下，定民志。**\n/0&\n#### 彖\n\n**彖曰：履，柔履剛也。說而應乎乾，是以履虎尾，不咥人，亨。剛中正，履帝位而不疚，光明也。**\n\n#### 爻\n\n&1&\n##### 初九：素履往，无咎。\n\n##### 象曰：素履之往，獨行願也。\n\n/1&\n\n&2&\n##### 九二：履道坦坦，幽人貞吉。\n\n##### 象曰：幽人貞吉，中不自亂也。\n\n/2&\n\n&3&\n##### 六三：眇能視，跛能履，履虎尾，咥人凶，武人爲于大君。\n\n##### 象曰：眇能視，不足以有明也。跛能履，不足以與行也。咥人之凶，位不當也。武人為于大君，志剛也。\n\n/3&\n\n&4&\n##### 九四：履虎尾，愬愬終吉。\n\n##### 象曰：愬愬終吉，志行也。\n\n/4&\n\n&5&\n##### 九五：夬\n\n##### 象曰：夬履貞厲，位正當也。\n\n/5&\n\n&6&\n##### 上九：視履考祥，其旋元吉。\n\n##### 象曰：元吉在上，大有慶也。\n\n/6&"},"111000":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/011.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：否泰反其類也**\n\n#### 序\n**序卦曰：履而泰，然後安，故受之以泰。泰者，通也。**","text.tab3":"&0&\n**泰，小往大來，吉亨。**\n**象曰：天地交，泰；后以財成天地之道，輔相天地之宜，以左右民。**\n/0&\n#### 彖\n\n**彖曰：泰，小往大來，吉亨，則是天地交而萬物通也，上下交而其志同也。內陽而外陰，內健而外順，內君子而外小人。君子道長，小人道消也。**\n\n#### 爻\n\n&1&\n##### 初九：拔茅茹，以其彙，征吉。\n\n##### 象曰：拔茅征吉，志在外也。\n\n/1&\n\n&2&\n##### 九二：包荒，用馮河，不遐遺，朋亡，得尚于中行。\n\n##### 象曰：包荒，得尚于中行，以光大也。\n\n/2&\n\n&3&\n##### 九三：无平不陂，无往不復，艱貞无咎，勿恤其孚，于食有福。\n\n##### 象曰：无往不復，天地際也。\n\n/3&\n\n&4&\n##### 六四：翩翩不富，以其鄰，不戒以孚。\n\n##### 象曰：翩翩不富，皆失實也。不戒以孚，中心願也。\n\n/4&\n\n&5&\n##### 六五：帝乙歸妹，以祉元吉。\n\n##### 象曰：以祉，元吉。中以行願也。\n\n/5&\n\n&6&\n##### 上六：城復于隍，勿用師，自邑告命，貞吝。\n\n##### 象曰：城復于隍，其命亂也。\n\n/6&"},"000111":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/012.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：否泰反其類也**\n\n#### 序\n**序卦曰：物不可以終通，故受之以否。**","text.tab3":"&0&\n**否之匪人。不利君子貞，大往小來。**\n**象曰：天地不交，否；君子以儉德辟難，不可榮以祿。**\n/0&\n#### 彖\n\n**彖曰：否之匪人，不利君子貞，大往小來，則是天地不交而萬物不通也，上下不交而天下无邦也。內陰而外陽，內柔而外剛，內小人而外君子，小人道長，君子道消也。**\n\n#### 爻\n\n&1&\n##### 初六：拔茅如，以其彙，貞吉，亨。\n\n##### 象曰：拔茅貞吉，志在君也。\n\n/1&\n\n&2&\n##### 六二：包承，小人吉，大人否，亨。\n\n##### 象曰：大人否，亨。不亂羣也。\n\n/2&\n\n&3&\n##### 六三：包羞。\n\n##### 象曰：包羞，位不當也。\n\n/3&\n\n&4&\n##### 九四：有命，无咎，疇離祉。\n\n##### 象曰：有命无咎，志行也。\n\n/4&\n\n&5&\n##### 九五：休否，大人吉，其亡，其亡，繋于苞桑。\n\n##### 象曰：大人之吉，位正當也。\n\n/5&\n\n&6&\n##### 上九：傾否，先否後喜。\n\n##### 象曰：否終則傾，何可長也。\n\n/6&"},"101111":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/013.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：大有眾也，同人親也。**\n\n#### 序\n**序卦曰：物不可以終否，故受之以同人。**","text.tab3":"&0&\n**同人：于野，亨。利涉大川，利君子貞。**\n**象曰：天與火，同人；君子以類族辨物。**\n/0&\n#### 彖\n\n**彖曰：同人，柔得位得中而應乎乾，曰同人。同人曰，同人于野，亨，利涉大川，乾行也。文明以健，中正而應，君子正也，唯君子為能通天下之志。**\n\n#### 爻\n\n&1&\n##### 初九：同人于門，无咎。\n\n##### 象曰：出門同人，又誰咎也。\n\n/1&\n\n&2&\n##### 六二：同人于宗，吝！\n\n##### 象曰：同人于宗，吝道也。\n\n/2&\n\n&3&\n##### 九三：伏戎于莽，升其高陵，三歲不興。\n\n##### 象曰：伏戎于莽，敵剛也。三歲不興，安行也。\n\n/3&\n\n&4&\n##### 九四：乘其墉，弗克攻，吉。\n\n##### 象曰：乘其墉，義弗克也，其吉，則困而反則也。\n\n/4&\n\n&5&\n##### 九五：同人，先號咷而後笑，大師克相遇。\n\n##### 象曰：同人之先，以中直也。大師相遇，言相克也。\n\n/5&\n\n&6&\n##### 上九：同人于郊，无悔。\n\n##### 象曰：同人于郊，志未得也。\n\n/6&"},"111101":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/014.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：大有眾也，同人親也。**\n\n#### 序\n**序卦曰：與人同者，物必歸焉，故受之以大有。**","text.tab3":"&0&\n**大有：元亨。**\n**象曰：火在天上，大有；君子以遏惡揚善，順天休命。**\n/0&\n#### 彖\n\n**彖曰：大有，柔得尊位大中，而上下應之，曰大有。其德剛健而文明，應乎天而時行，是以元亨。**\n\n#### 爻\n\n&1&\n##### 初九：无交害，匪咎，艱則无咎。\n\n##### 象曰：大有初九，无交害也。\n\n/1&\n\n&2&\n##### 九二：大車以載，有攸往，无咎。\n\n##### 象曰：大車以載，積中不敗也。\n\n/2&\n\n&3&\n##### 九三：公用亨于天子，小人弗克。\n\n##### 象曰：公用亨于天子，小人害也。\n\n/3&\n\n&4&\n##### 九四：匪其彭，无咎。\n\n##### 象曰：匪其彭，无咎；明辨晰也。\n\n/4&\n\n&5&\n##### 六五：厥孚交如，威如，吉。\n\n##### 象曰：厥孚交如，信以發志也。威如之吉，易而无備也。\n\n/5&\n\n&6&\n##### 上九：自天祐之，吉，无不利。\n\n##### 象曰：大有上吉，自天佑也。\n\n/6&"},"001000":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/015.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：謙輕而豫怠也。**\n\n#### 序\n**序卦曰：有大者，不可以盈，故受之以謙。**","text.tab3":"&0&\n**謙：亨，君子有終。**\n**象曰：地中有山，謙；君子以裒多益寡，稱物平施。**\n/0&\n#### 彖\n\n**彖曰：謙亨，天道下濟而光明，地道卑而上行；天道虧盈而益謙，地道變盈而流謙；鬼神害盈而福謙，人道惡盈而好謙。謙尊而光，卑而不可踰，君子之終也。**\n\n#### 爻\n\n&1&\n##### 初六：謙謙君子，用涉大川，吉。\n\n##### 象曰：謙謙君子，卑以自牧也。\n\n/1&\n\n&2&\n##### 六三：嗚謙，貞吉。\n\n##### 象曰：鳴謙貞吉，中心得也。\n\n/2&\n\n&3&\n##### 九三：勞謙，君子有終，吉。\n\n##### 象曰：勞謙君子，萬民服也。\n\n/3&\n\n&4&\n##### 六四：无不利，撝謙。\n\n##### 象曰：无不利撝謙；不違則也。\n\n/4&\n\n&5&\n##### 六五：不富以其鄰，利用侵伐，无不利。\n\n##### 象曰：利用侵伐，征不服也。\n\n/5&\n\n&6&\n##### 上六：鳴謙，利用行師，征邑國。\n\n##### 象曰：鳴謙，志未得也。可用行師，征邑國也。\n\n/6&"},"000100":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/016.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：謙輕而豫怠也。**\n\n#### 序\n**序卦曰：有大而能謙，必豫，故受之以豫。**","text.tab3":"&0&\n**豫：利建侯，行師。**\n**象曰：雷出地奮，豫。先王以作樂崇德，殷薦之上帝，以配祖考。**\n/0&\n#### 彖\n\n**彖曰：豫，剛應而志行，順以動，豫。豫順以動，故天地如之，而況建侯行師乎？天地以順動，故日月不過，而四時不忒。聖人以順動，則刑罰清而民服。豫之時義大矣哉。**\n\n#### 爻\n\n&1&\n##### 初六：鳴豫，凶。\n\n##### 象曰：初六鳴豫，志窮凶也。\n\n/1&\n\n&2&\n##### 六二：介于石，不終日，貞吉。\n\n##### 象曰：不終日，貞吉；以中正也。\n\n/2&\n\n&3&\n##### 六三：盱豫，悔。遲有悔。\n\n##### 象曰：盱豫有悔，位不當也。\n\n/3&\n\n&4&\n##### 九四：由豫，大有得，勿疑，朋盍簪。\n\n##### 象曰：由豫，大有得；志大行也。\n\n/4&\n\n&5&\n##### 六五：貞疾，恆不死。\n\n##### 象曰：六五貞疾，乘剛也。恆不死，中未亡也。\n\n/5&\n\n&6&\n##### 上六：冥豫，成有渝，无咎。\n\n##### 象曰：冥豫在上，何可長也。\n\n/6&"},"100110":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/017.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：隨無故也，蠱則飭也。**\n\n#### 序\n**序卦曰：豫必有隨，故受之以隨。**","text.tab3":"&0&\n**隨：元，亨，利，貞，无咎。**\n**象曰：澤中有雷，隨；君子以嚮晦入宴息。**\n/0&\n#### 彖\n\n**彖曰：隨，剛來而下柔，動而說，隨。大亨，貞，无咎，而天下隨時，隨時之義大矣哉。**\n\n#### 爻\n\n&1&\n##### 初九：官有渝，貞吉，出門交有功。\n\n##### 象曰：官有渝，從正吉也。出門交有功，不失也。\n\n/1&\n\n&2&\n##### 六二：係小子，失丈夫。\n\n##### 象曰：系小子，弗兼與也。\n\n/2&\n\n&3&\n##### 六三：係丈夫，失小子，隨有求得，利居貞。\n\n##### 象曰：系丈夫，志舍下也。\n\n/3&\n\n&4&\n##### 九四：隨有獲，貞凶，有孚在道以明，何咎？\n\n##### 象曰：隨有獲，其義凶也。有孚在道，明功也。\n\n/4&\n\n&5&\n##### 九五：孚於嘉，吉。\n\n##### 象曰：孚于嘉，吉；位正中也。\n\n/5&\n\n&6&\n##### 上六：拘係之，乃從維之，王用亨于西山。\n\n##### 象曰：拘系之，上窮也。\n\n/6&"},"011001":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/018.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：隨無故也，蠱則飭也。**\n\n#### 序\n**序卦曰：以喜隨人者，必有事，故受之以蠱。蠱者，事也。**","text.tab3":"&0&\n**蠱：元亨，利涉大川。**\n**象曰：山下有風，蠱；君子以振民育德。**\n/0&\n#### 彖\n\n**彖曰：蠱，剛上而柔下，巽而止，蠱。蠱元亨，而天下治也；利涉大川，往有事也；先甲三日，後甲三日，終則有始，天行也。**\n\n#### 爻\n\n&1&\n##### 初六：幹父之盎，有子，考无咎，厲終吉。\n\n##### 象曰：幹父之蠱，意承考也。\n\n/1&\n\n&2&\n##### 九二：幹母之蠱，不可貞。\n\n##### 象曰：幹母之蠱，得中道也。\n\n/2&\n\n&3&\n##### 九三：幹父之蠱，小有悔，无大咎。\n\n##### 象曰：幹父之蠱，終无咎也。\n\n/3&\n\n&4&\n##### 六四：裕父之蠱，往見吝。\n\n##### 象曰：裕父之蠱，往未得也。\n\n/4&\n\n&5&\n##### 六五：幹父之蠱，用譽。\n\n##### 象曰：幹父用譽，承以德也。\n\n/5&\n\n&6&\n##### 上九：不事王侯，高尚其事。\n\n##### 象曰：不事王侯，志可則也。\n\n/6&"},"110000":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/019.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：臨觀之義，或與或求。**\n\n#### 序\n**序卦曰：有事而後可大，故受之以臨。臨者，大也。**","text.tab3":"&0&\n**臨：元，亨，利，貞。**\n**象曰：澤上有地，臨；君子以教思无窮，容保民无疆。**\n/0&\n#### 彖\n\n**彖曰：臨，剛浸而長，說而順，剛中而應，大亨以正，天之道也；至于八月有凶，消不久也。**\n\n#### 爻\n\n&1&\n##### 初九：咸臨，貞吉。\n\n##### 象曰：咸臨貞吉，志行正也。\n\n/1&\n\n&2&\n##### 九二：咸臨，吉无不利。\n\n##### 象曰：咸臨，吉无不利；未順命也。\n\n/2&\n\n&3&\n##### 六三：甘臨，无攸利，既憂之，无咎。\n\n##### 象曰：甘臨，位不當也。既憂之，咎不長也。\n\n/3&\n\n&4&\n##### 六四：至臨，无咎。\n\n##### 象曰：至臨无咎，位當也。\n\n/4&\n\n&5&\n##### 六五：知臨，大君之宜，吉。\n\n##### 象曰：大君之宜，行中之謂也。\n\n/5&\n\n&6&\n##### 上六：敦臨，吉，无咎。\n\n##### 象曰：敦臨之吉，志在內也。\n\n/6&"},"000011":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/020.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：臨觀之義，或與或求。**\n\n#### 序\n**序卦曰：物大然後可觀，故受之以觀。**","text.tab3":"&0&\n**觀：盥而不薦，有孚顒若。**\n**象曰：風行地上，觀；先王以省方，觀民設教。**\n/0&\n#### 彖\n\n**彖曰：大觀在上，順而巽，中正以觀天下。觀盥而不薦，有孚顒若，下觀而化也。觀天之神道，而四時不忒，聖人以神道設教，而天下服矣。**\n\n#### 爻\n\n&1&\n##### 初六：童觀，小人无咎，君子吝。\n\n##### 象曰：初六童觀，小人道也。\n\n/1&\n\n&2&\n##### 六二：闚觀，利女貞。\n\n##### 象曰：窺觀女貞，亦可丑也。\n\n/2&\n\n&3&\n##### 六三：觀我生，進退。\n\n##### 象曰：觀我生，進退；未失道也。\n\n/3&\n\n&4&\n##### 六四：觀國之光，利用賓于王。\n\n##### 象曰：觀國之光，尚賓也。\n\n/4&\n\n&5&\n##### 九五：觀我生，君子无咎。\n\n##### 象曰：觀我生，觀民也。\n\n/5&\n\n&6&\n##### 上九：觀其生，君子无咎。\n\n##### 象曰：觀其生，志未平也。\n\n/6&"},"100101":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/021.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：噬嗑食也，賁無色也。**\n\n#### 序\n**序卦曰：可觀而後有所合，故受之以噬嗑。嗑者，合也。**","text.tab3":"&0&\n**噬嗑：亨，利用獄。**\n**象曰：雷電噬嗑；先王以明罰敕法。**\n/0&\n#### 彖\n\n**彖曰：頤中有物，曰噬嗑。噬嗑而亨，剛柔分動而明，雷電合而章，柔得中而上行，雖不當位，利用獄也。**\n\n#### 爻\n\n&1&\n##### 初九：屨校滅趾，无咎。\n\n##### 象曰：屨校滅趾，不行也。\n\n/1&\n\n&2&\n##### 六二：噬膚滅鼻，无咎也。\n\n##### 象曰：噬膚滅鼻，乘剛也。\n\n/2&\n\n&3&\n##### 六三：噬臘肉遇毒，小吝，无咎。\n\n##### 象曰：遇毒，位不當也。\n\n/3&\n\n&4&\n##### 九四：噬乾胏，得金矢，利艱貞，吉。\n\n##### 象曰：利艱貞吉，未光也。\n\n/4&\n\n&5&\n##### 六五：噬乾肉，得黃金，貞厲，无咎。\n\n##### 象曰：貞厲无咎，得當也。\n\n/5&\n\n&6&\n##### 上九：何校滅耳，凶。\n\n##### 象曰：何校滅耳，聰不明也。\n\n/6&"},"101001":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/022.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：噬嗑食也，賁無色也。**\n\n#### 序\n**序卦曰：物不可以苟合而已，故受之以賁。賁者，飾也。**","text.tab3":"&0&\n**賁：亨，小利有攸往。**\n**象曰：山下有火，賁；君子以明庶政，无敢折獄。**\n/0&\n#### 彖\n\n**彖曰：賁亨。柔來而文剛，故亨。分剛上而文柔，故小利有攸往，天文也。文明以止，人文也。觀乎天文，以察時變，觀乎人文，以化成天下。**\n\n#### 爻\n\n&1&\n##### 初九：賁其趾，舍車而徒。\n\n##### 象曰：舍車而徒，義弗乘也。\n\n/1&\n\n&2&\n##### 六二：賁其須。\n\n##### 象曰：賁其須，與上興也。\n\n/2&\n\n&3&\n##### 九三：賁如濡如，永貞，吉。\n\n##### 象曰：永貞之吉，終莫之陵也。\n\n/3&\n\n&4&\n##### 六四：賁如皤如，白馬翰如，匪寇婚媾。\n\n##### 象曰：六四，當位疑也。匪寇婚媾，終无尤也。\n\n/4&\n\n&5&\n##### 六五：賁于丘園，束帛戔戔，吝，終吉。\n\n##### 象曰：六五之吉，有喜也。\n\n/5&\n\n&6&\n##### 上九：白賁，无咎。\n\n##### 象曰：白賁无咎，上得志也。\n\n/6&"},"000001":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/023.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：剝爛也，復反也。**\n\n#### 序\n**序卦曰：致飾(然/而)後亨則盡矣，故受之以剝。剝者，剝也。**","text.tab3":"&0&\n**剝：不利有攸往。**\n**象曰：山附地上，剝；上以厚下，安宅。**\n/0&\n#### 彖\n\n**彖曰：剝，剝也，柔變剛也。不利有攸往，小人長也。順而止之，觀象也。君子尚消息盈虛，天行也。**\n\n#### 爻\n\n&1&\n##### 初六：剝床以足，蔑貞，凶。\n\n##### 象曰：剝牀以足，以滅下也。\n\n/1&\n\n&2&\n##### 六二：剝床以辨，蔑貞凶。\n\n##### 象曰：剝牀以辨，未有與也。\n\n/2&\n\n&3&\n##### 六三：剝之，无咎。\n\n##### 象曰：剝之无咎，失上下也。\n\n/3&\n\n&4&\n##### 六四：剝床以膚，凶。\n\n##### 象曰：剝牀以膚，切近災也。\n\n/4&\n\n&5&\n##### 六五：貫魚，以宮人寵，无不利。\n\n##### 象曰：以宮人寵，終无尤也。\n\n/5&\n\n&6&\n##### 上九：碩果不食，君子得輿，小人剝廬。\n\n##### 象曰：君子得輿，民所載也。小人剝廬，終不可用也。\n\n/6&"},"100000":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/024.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：剝爛也，復反也。**\n\n#### 序\n**序卦曰：物不可以終盡剝，窮上反下，故受之以復。**","text.tab3":"&0&\n**復：亨，出入无疾，朋來无咎。**\n**象曰：雷在地中，復；先王以至日閉關，商旅不行，后不省方。**\n/0&\n#### 彖\n\n**彖曰：復，亨。剛反，動而以順行，是以出入无疾，朋來无咎，反復其道，七日來復，天行也。利有攸往，剛長也。復，其見天地之心乎。**\n\n#### 爻\n\n&1&\n##### 初九：不遠復，无祇悔，元吉。\n\n##### 象曰：不遠之復，以修身也。\n\n/1&\n\n&2&\n##### 六二：休復，吉。\n\n##### 象曰：休復之吉，以下仁也。\n\n/2&\n\n&3&\n##### 六三：頻復，厲，无咎。\n\n##### 象曰：頻復之厲，義无咎也。\n\n/3&\n\n&4&\n##### 六四：中行獨復。\n\n##### 象曰：中行獨復，以從道也。\n\n/4&\n\n&5&\n##### 六五：敦復，无悔。\n\n##### 象曰：敦復无悔，中以自考也。\n\n/5&\n\n&6&\n##### 上六：迷復，凶，有災眚，用行師，終有大敗，以其國君凶，至于十年不克征。\n\n##### 象曰：迷復之凶，反君道也。\n\n/6&"},"100111":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/025.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：大畜時也，無妄災也。**\n\n#### 序\n**序卦曰：復則不妄矣，故受之以無妄。**","text.tab3":"&0&\n**无妄：元，亨，利，貞，其匪正有眚，不利有攸往。**\n**象曰：天下雷行，物與无妄；先王以茂對時，育萬物。**\n/0&\n#### 彖\n\n**彖曰：无妄，剛自外來而為主於內，動而健，剛中而應，大亨以正，天之命也，其匪正有眚，不利有攸往。无妄之往，何之矣。天命不祐，行矣哉。**\n\n#### 爻\n\n&1&\n##### 初九：无妄，往吉。\n\n##### 象曰：无妄之往，得志也。\n\n/1&\n\n&2&\n##### 六二：不耕穫，不菑畬，則利有攸往。\n\n##### 象曰：不耕穫，未富也。\n\n/2&\n\n&3&\n##### 六三：无妄之災，或繫之牛，行人之得，邑人之災。\n\n##### 象曰：行人得牛，邑人災也。\n\n/3&\n\n&4&\n##### 九四：可貞，无咎。\n\n##### 象曰：可貞无咎，固有之也。\n\n/4&\n\n&5&\n##### 九五：无亡之疾，勿藥有喜。\n\n##### 象曰：无妄之藥，不可試也。\n\n/5&\n\n&6&\n##### 上九：无妄，行有眚，无攸利。\n\n##### 象曰：无妄之行，窮之災也。\n\n/6&"},"111001":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/026.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：大畜時也，無妄災也。**\n\n#### 序\n**序卦曰：有無妄然後可畜，故受之以大畜。**","text.tab3":"&0&\n**大畜：利貞，不家食，吉，利涉大川。**\n**象曰：天在山中，大畜；君子以多識前言往行，以畜其德。**\n/0&\n#### 彖\n\n**彖曰：大畜，剛健篤實，輝光日新其德，剛上而尚賢，能止健，大正也。不家食吉，養賢也；利涉大川，應乎天也。**\n\n#### 爻\n\n&1&\n##### 初九：有厲，利己。\n\n##### 象曰：有厲利已，不犯災也。\n\n/1&\n\n&2&\n##### 九二：輿説輹。\n\n##### 象曰：輿說輹，中无尤也。\n\n/2&\n\n&3&\n##### 九三：良馬逐，利艱貞，曰閑輿衛，利有攸往。\n\n##### 象曰：利有攸往，上合志也。\n\n/3&\n\n&4&\n##### 六四：童牛之牿，元吉。\n\n##### 象曰：六四元吉，有喜也。\n\n/4&\n\n&5&\n##### 六五：豶豕之牙，吉。\n\n##### 象曰：六五之吉，有慶也。\n\n/5&\n\n&6&\n##### 上九：何天之衢，亨。\n\n##### 象曰：何天之衢，道大行也。\n\n/6&"},"100001":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/027.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：頤養正也。**\n\n#### 序\n**序卦曰：物畜然後可養，故受之以頤。頤者，養也。**","text.tab3":"&0&\n**頤：貞吉，觀頤，自求口實。**\n**象曰：山下有雷，頤；君子以慎言語，節飲食。**\n/0&\n#### 彖\n\n**彖曰：頤，貞吉，養正則吉也。觀頤，觀其所養也；自求口實，觀其自養也。天地養萬物，聖人養賢以及萬民，頤之時大矣哉。**\n\n#### 爻\n\n&1&\n##### 初九：舍爾靈龜，觀我朵頤，凶。\n\n##### 象曰：觀我朵頤，亦不足貴也。\n\n/1&\n\n&2&\n##### 六二：顚頤，拂經，于丘頤，征凶。\n\n##### 象曰：六二征凶，行失類也。\n\n/2&\n\n&3&\n##### 六三：拂頤，貞凶，十年勿用，无攸利。\n\n##### 象曰：十年勿用，道大悖也。\n\n/3&\n\n&4&\n##### 六四：顚頤，吉，虎視眈眈，其欲逐逐，无咎。\n\n##### 象曰：顛頤之吉，上施光也。\n\n/4&\n\n&5&\n##### 六五：拂經，居貞吉，不可涉大川。\n\n##### 象曰：居貞之吉，順以從上也。\n\n/5&\n\n&6&\n##### 上九：由頤，厲吉，利涉大川。\n\n##### 象曰：由頤厲吉，大有慶也。\n\n/6&"},"011110":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/028.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：大過顛也，姤遇也，柔遇剛也。**\n\n#### 序\n**序卦曰：不養則不可動，故受之以大過。**","text.tab3":"&0&\n**大過：棟橈，利有攸往，亨。**\n**象曰：澤滅木，大過。君子以獨立不懼，遯世无悶。**\n/0&\n#### 彖\n\n**彖曰：大過，大者過也。棟橈，本末弱也。剛過而中，巽而說行，利有攸往，乃亨，大過之時大矣哉。**\n\n#### 爻\n\n&1&\n##### 初六：藉用白茅，无咎。\n\n##### 象曰：藉用白茅，柔在下也。\n\n/1&\n\n&2&\n##### 九二：枯陽生稊，老夫得其女妻，无不利。\n\n##### 象曰：老夫女妻，過以相與也。\n\n/2&\n\n&3&\n##### 九三：棟橈，凶。\n\n##### 象曰：棟橈之凶，不可以有輔也。\n\n/3&\n\n&4&\n##### 九四：棟隆，吉 ，有它吝。\n\n##### 象曰：棟隆之吉，不橈乎下也。\n\n/4&\n\n&5&\n##### 九五：枯楊生華，老婦得其士夫，无咎无譽。\n\n##### 象曰：枯楊生華，何可久也。老婦士夫，亦可丑也。\n\n/5&\n\n&6&\n##### 上六：過涉滅頂，凶，无咎。\n\n##### 象曰：過涉之凶，不可咎也。\n\n/6&"},"010010":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/029.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：離上而坎下也。**\n\n#### 序\n**序卦曰：物不可以終過，故受之以坎。坎者，陷也。**","text.tab3":"&0&\n**習坎：有孚，維心亨，行有尚。**\n**象曰：水洊至，習坎；君子以常德行，習教事。**\n/0&\n#### 彖\n\n**彖曰：習坎，重險也。水流而不盈，行險而不失其信。維心亨，乃以剛中也；行有尚，往有功也。天險不可升也，地險山川丘陵也，王公設險以守其國，險之時用大矣哉。**\n\n#### 爻\n\n&1&\n##### 初六：習坎，入于坎窞\n\n##### 象曰：習坎入坎，失道凶也。\n\n/1&\n\n&2&\n##### 九二：坎有險，求小得。\n\n##### 象曰：求小得，未出中也。\n\n/2&\n\n&3&\n##### 六三：來之坎坎，險且枕，入于坎富，勿用。\n\n##### 象曰：來之坎坎，終无功也。\n\n/3&\n\n&4&\n##### 六四：樽酒，簋貳，用缶，納約自牖，終无咎。\n\n##### 象曰：樽酒簋貳，剛柔济也。\n\n/4&\n\n&5&\n##### 九五：坎不盈，衹。既平，无咎。\n\n##### 象曰：坎不盈，中未大也。\n\n/5&\n\n&6&\n##### 上六：係用徽纆，寘于叢棘，三歲不得，凶。\n\n##### 象曰：上六失道，凶三歲也。\n\n/6&"},"101101":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/030.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：離上而坎下也。**\n\n#### 序\n**序卦曰：陷必有所麗，故受之以離。離者，麗也。**","text.tab3":"&0&\n**離：利貞，亨，畜牝牛，吉。**\n**象曰：明兩作離，大人以繼明照于四方。**\n/0&\n#### 彖\n\n**彖曰：離，麗也。日月麗乎天，百穀草木麗乎土，重明以麗乎正，乃化成天下。柔麗乎中正，故亨，是以畜牝牛吉也。**\n\n#### 爻\n\n&1&\n##### 初九：履錯然，敬之，无咎。\n\n##### 象曰：履錯之敬，以辟咎也。\n\n/1&\n\n&2&\n##### 六二：黃離，元吉。\n\n##### 象曰：黃離元吉，得中道也。\n\n/2&\n\n&3&\n##### 九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。\n\n##### 象曰：日昃之離，何可久也。\n\n/3&\n\n&4&\n##### 九四：突如、其來如、焚如、死如、棄如。\n\n##### 象曰：突如其來如，无所容也。\n\n/4&\n\n&5&\n##### 六五：出涕沱若，戚嗟若，吉。\n\n##### 象曰：六五之吉，離王公也。\n\n/5&\n\n&6&\n##### 上九：王用出征，有嘉。折首，獲匪其醜，无咎。\n\n##### 象曰：王用出征，以正邦也。\n\n/6&"},"001110":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/031.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：咸速也，恆久也。**\n\n#### 序\n**序卦曰：有天地，然後有萬物。有萬物，然後有男女。有男女，然後有夫婦。有夫婦，然後有父子。有父子，然後有君臣。有君臣，然後有上下。有上下，然後禮義有所錯。**","text.tab3":"&0&\n**咸：亨，利，貞，取女吉。**\n**象曰：山上有澤，咸；君子以虛受人。**\n/0&\n#### 彖\n\n**彖曰：咸，感也。柔上而剛下，二氣感應以相與，止而說，男下女，是以亨，利貞，取女吉也。天地感而萬物化生，聖人感人心而天下和平。觀其所感，而天地萬物之情可見矣。**\n\n#### 爻\n\n&1&\n##### 初六：咸其拇。\n\n##### 象曰：咸其拇，志在外也。\n\n/1&\n\n&2&\n##### 六二：咸其腓，凶，居吉。\n\n##### 象曰：雖凶，居吉，順不害也。\n\n/2&\n\n&3&\n##### 九三：咸其股，執其隨，往吝。\n\n##### 象曰：咸其股，亦不處也。志在隨人，所執下也。\n\n/3&\n\n&4&\n##### 九四：貞吉，悔亡，憧憧往來，朋從爾思。\n\n##### 象曰：貞吉悔亡，未感害也。憧憧往來，未光大也。\n\n/4&\n\n&5&\n##### 九五：咸其脢，无悔。\n\n##### 象曰：咸其脢，志末也。\n\n/5&\n\n&6&\n##### 上六：咸其輔，頰，舌。\n\n##### 象曰：咸其輔，頰，舌，滕口說也。\n\n/6&"},"011100":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/032.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：咸速也，恆久也。**\n\n#### 序\n**序卦曰：夫婦之道，不可以不久也，故受之以恆。恆者，久也。**","text.tab3":"&0&\n**恆：亨，无咎，利貞，利有攸往。**\n**象曰：雷風，恆；君子以立不易方。**\n/0&\n#### 彖\n\n**彖曰：恒，久也。剛上而柔下，雷風相與，巽而動，剛柔皆應，恒。恒，亨，无咎，利貞，久於其道也。天地之道，恒久而不已也，利有攸往，終則有始也，日月得天而能久照，四時變化而能久成，聖人久於其道而天下化成，觀其所恒而天地萬物之情可見矣。**\n\n#### 爻\n\n&1&\n##### 初六：浚恆，貞凶，无攸利。\n\n##### 象曰：浚恆之凶，始求深也。\n\n/1&\n\n&2&\n##### 九二：悔亡。\n\n##### 象曰：九二悔亡，能久中也。\n\n/2&\n\n&3&\n##### 九三：不恆其德，或承之羞，貞吝。\n\n##### 象曰：不恆其德，无所容也。\n\n/3&\n\n&4&\n##### 九四：田无禽。\n\n##### 象曰：久非其位，安得禽也。\n\n/4&\n\n&5&\n##### 六五：恆其德，貞，婦人吉 ，夫子凶。\n\n##### 象曰：婦人貞吉，從一而終也。夫子制義，從婦凶也。\n\n/5&\n\n&6&\n##### 上六：振恆，凶。\n\n##### 象曰：振恆在上，大无功也。\n\n/6&"},"001111":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/033.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：大壯則止，遯則退也。**\n\n#### 序\n**序卦曰：物不可以久居其所，故受之以遯。遯者，退也。**","text.tab3":"&0&\n**遞：亨，小利貞。**\n**象曰：天下有山，遯；君子以遠小人，不惡而嚴。**\n/0&\n#### 彖\n\n**彖曰：遯亨，遯而亨也。剛當位而應，與時行也。小利貞，浸而長也。遯之時義大矣哉。**\n\n#### 爻\n\n&1&\n##### 初六：遯\n\n##### 象曰：遯尾之厲，不往何災也。\n\n/1&\n\n&2&\n##### 六二：執之用黃牛之革，莫之勝説。\n\n##### 象曰：執用黃牛，固志也。\n\n/2&\n\n&3&\n##### 九三：係遯，有疾厲，畜臣妾，吉。\n\n##### 象曰：系遯之厲，有疾憊也。畜臣妾吉，不可大事也。\n\n/3&\n\n&4&\n##### 九四：好遯，君子吉，小人否。\n\n##### 象曰：君子好遯，小人否也。\n\n/4&\n\n&5&\n##### 九五：嘉遯，貞吉。\n\n##### 象曰：嘉遯貞吉，以正志也。\n\n/5&\n\n&6&\n##### 上九：肥遯，无不利。\n\n##### 象曰：肥遯，无不利；无所疑也。\n\n/6&"},"111100":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/034.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：大壯則止，遯則退也。**\n\n#### 序\n**序卦曰：物不可以終遯，故受之以大壯。**","text.tab3":"&0&\n**大壯：利，貞。**\n**象曰：雷在天上，大壯；君子以非禮弗履。**\n/0&\n#### 彖\n\n**彖曰：大壯，大者壯也，剛以動，故壯。大壯利貞，大者正也。正大而天地之情可見矣。**\n\n#### 爻\n\n&1&\n##### 初九：壯於趾，征凶，有孚。\n\n##### 象曰：壯于趾，其孚窮也。\n\n/1&\n\n&2&\n##### 九二：貞吉。\n\n##### 象曰：九二貞吉，以中也。\n\n/2&\n\n&3&\n##### 九三：小人用壯，君子用罔。貞厲，羝羊觸藩，羸其角。\n\n##### 象曰：小人用壯，君子罔也。\n\n/3&\n\n&4&\n##### 九四：貞吉，悔亡，藩決不羸，壯于大輿之複。\n\n##### 象曰：藩決不羸，尚往也。\n\n/4&\n\n&5&\n##### 六五：喪羊于易，无悔。\n\n##### 象曰：喪羊于易，位不當也。\n\n/5&\n\n&6&\n##### 上六：羝羊觸藩，不能退，不能遂，无攸利，艱則吉。\n\n##### 象曰：不能退，不能遂，不詳也。艱則吉，咎不長也。\n\n/6&"},"000101":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/035.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：晉晝也，明夷誅也。**\n\n#### 序\n**序卦曰：物不可以終壯，故受之以晉。晉者，進也。**","text.tab3":"&0&\n**晉：康侯用錫馬蕃庶，晝日三接。**\n**象曰：明出地上，晉；君子以自昭明德。**\n/0&\n#### 彖\n\n**彖曰：晉，進也。明出地上，順而麗乎大明，柔進而上行，是以康侯用錫馬蕃庶，晝日三接也。**\n\n#### 爻\n\n&1&\n##### 初六：晉如摧如，貞吉，罔孚，裕无咎。\n\n##### 象曰：晉如，摧如；獨行正也。裕无咎；未受命也。\n\n/1&\n\n&2&\n##### 六二：晉如愁如，貞吉。受茲介福，于其王母。\n\n##### 象曰：受茲介福，以中正也。\n\n/2&\n\n&3&\n##### 六三：眾允，悔亡。\n\n##### 象曰：眾允之志，上行也。\n\n/3&\n\n&4&\n##### 九四：晉如鼫鼠，貞厲。\n\n##### 象曰：鼫鼠貞厲，位不當也。\n\n/4&\n\n&5&\n##### 六五：悔亡，失得勿恤，往吉，无不利。\n\n##### 象曰：失得勿恤，往有慶也。\n\n/5&\n\n&6&\n##### 上九：晉其角，維用伐邑，厲吉，无咎，貞咎。\n\n##### 象曰：維用伐邑，道未光也。\n\n/6&"},"101000":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/036.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：晉晝也，明夷誅也。**\n\n#### 序\n**序卦曰：進必有所傷，故受之以明夷。夷者，傷也。**","text.tab3":"&0&\n**明夷：利艱貞。**\n**象曰：明入地中，明夷；君子以蒞眾，用晦而明。**\n/0&\n#### 彖\n\n**彖曰：明入地中，明夷。內文明而外柔順，以蒙大難，文王以之。利艱貞，晦其明也。內難而能正其志，箕子以之。**\n\n#### 爻\n\n&1&\n##### 初九：明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。\n\n##### 象曰：君子于行，義不食也。\n\n/1&\n\n&2&\n##### 六二：明夷，夷于左股，用拯馬壯，吉。\n\n##### 象曰：六二之吉，順以則也。\n\n/2&\n\n&3&\n##### 九三：明夷於南狩，得其大首，不可疾貞。\n\n##### 象曰：南狩之志，乃大得也。\n\n/3&\n\n&4&\n##### 六四：入于左腹，獲明夷之心，于出門庭。\n\n##### 象曰：入于左腹，獲心意也。\n\n/4&\n\n&5&\n##### 六五：箕子之明夷，利貞。\n\n##### 象曰：箕子之貞，明不可息也。\n\n/5&\n\n&6&\n##### 上六：不明晦，初登于天，後入于地。\n\n##### 象曰：初登于天，照四國也。后入于地，失則也。\n\n/6&"},"101011":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/037.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：睽外也，家人內也。**\n\n#### 序\n**序卦曰：傷於外者，必反(於/其)家，故受之以家人。**","text.tab3":"&0&\n**家人：利女貞。**\n**象曰：風自火出，家人；君子以言有物，而行有恆。**\n/0&\n#### 彖\n\n**彖曰：家人，女正位乎內，男正位乎外，男女正，天地之大義也。家人有嚴君焉，父母之謂也。父父，子子，兄兄，弟弟，夫夫，婦婦，而家道正。正家，而天下定矣。**\n\n#### 爻\n\n&1&\n##### 初九：閑有家，悔亡。\n\n##### 象曰：閑有家，志未變也。\n\n/1&\n\n&2&\n##### 六二：无攸遂，在中饋，貞吉。\n\n##### 象曰：六二之吉，順以巽也。\n\n/2&\n\n&3&\n##### 九三：家人嗃嗃，悔厲吉，婦子嘻嘻，終吝。\n\n##### 象曰：家人嗃嗃，未失也；婦子嘻嘻，失家節也。\n\n/3&\n\n&4&\n##### 六四：富家，大吉。\n\n##### 象曰：富家大吉，順在位也。\n\n/4&\n\n&5&\n##### 九五：王假有家，勿恤，吉。\n\n##### 象曰：王假有家，交相愛也。\n\n/5&\n\n&6&\n##### 上九：有孚威如，終吉。\n\n##### 象曰：威如之吉，反身之謂也。\n\n/6&"},"110101":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/038.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：睽外也，家人內也。**\n\n#### 序\n**序卦曰：家道窮，必乖，故受之以睽。睽者，乖也。**","text.tab3":"&0&\n**睽：小事吉。**\n**象曰：上火下澤，睽；君子以同而異。**\n/0&\n#### 彖\n\n**彖曰：睽，火動而上，澤動而下，二女同居，其志不同行。說而麗乎明，柔進而上行，得中而應乎剛，是以小事吉。天地睽而其事同也，男女睽而其志通也，萬物睽而其事類也，睽之時用大矣哉。**\n\n#### 爻\n\n&1&\n##### 初九：悔亡，喪馬勿逐，自復；見惡人，无咎。\n\n##### 象曰：見惡人，以辟咎也。\n\n/1&\n\n&2&\n##### 九二：遇主于巷，無咎。\n\n##### 象曰：遇主于巷，未失道也。\n\n/2&\n\n&3&\n##### 六三：見輿曳，其牛掣，其人天且劓，无初有終。\n\n##### 象曰：見輿曳，位不當也。无初有終，遇剛也。\n\n/3&\n\n&4&\n##### 九四：睽孤，遇元夫，交孚，厲无咎。\n\n##### 象曰：交孚无咎，志行也。\n\n/4&\n\n&5&\n##### 六五：悔亡，厥宗噬膚，往何咎。\n\n##### 象曰：厥宗噬膚，往有慶也。\n\n/5&\n\n&6&\n##### 上九：暌孤，見豕負塗，載鬼一車，先張之弧，後説之弧，匪寇婚媾，往遇雨則吉。\n\n##### 象曰：遇雨之吉，群疑亡也。\n\n/6&"},"001010":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/039.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：解緩也，蹇難也。**\n\n#### 序\n**序卦曰：乖必有難，故受之以蹇。蹇者，難也。**","text.tab3":"&0&\n**蹇：利西南，不利東北，利見大人，貞吉。**\n**象曰：山上有水，蹇；君子以反身修德。**\n/0&\n#### 彖\n\n**彖曰：蹇，難也，險在前也。見險而能止，知矣哉。蹇，利西南，往得中也；不利東北，其道窮也。利見大人，往有功也；當位貞吉，以正邦也。蹇之時用大矣哉。**\n\n#### 爻\n\n&1&\n##### 初六：往蹇，來譽。\n\n##### 象曰：往蹇來譽，宜待也。\n\n/1&\n\n&2&\n##### 六二：王臣蹇蹇，匪躬之故。\n\n##### 象曰：王臣蹇蹇，終无尤也。\n\n/2&\n\n&3&\n##### 九三：往蹇，來反。\n\n##### 象曰：往蹇來反，內喜之也。\n\n/3&\n\n&4&\n##### 六四：往蹇，來連。\n\n##### 象曰：往蹇來連，當位實也。\n\n/4&\n\n&5&\n##### 九五：大蹇，朋來。\n\n##### 象曰：大蹇朋來，以中節也。\n\n/5&\n\n&6&\n##### 上六：往蹇，來碩，吉，利見大人。\n\n##### 象曰：往蹇來碩，志在內也。利見大人，以從貴也。\n\n/6&"},"010100":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/040.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：解緩也，蹇難也。**\n\n#### 序\n**序卦曰：物不可以終難，故受之以解。解者，緩也。**","text.tab3":"&0&\n**解：利西南，無所往，其來復吉，有攸往，夙吉。**\n**象曰：雷雨作，解；君子以赦過宥罪。**\n/0&\n#### 彖\n\n**彖曰：解，險以動，動而免乎險，解。解，利西南，往得眾也；其來復吉，乃得中也；有攸往夙吉，往有功也。天地解而雷雨作，雷雨作而百果草木皆甲坼，解之時大矣哉。**\n\n#### 爻\n\n&1&\n##### 初六：无咎。\n\n##### 象曰：剛柔之際，義无咎也。\n\n/1&\n\n&2&\n##### 九二：田獲三狐，得黃矢，貞吉。\n\n##### 象曰：九二貞吉，得中道也。\n\n/2&\n\n&3&\n##### 六三：負且乘，致寇至，貞吝。\n\n##### 象曰：負且乘，亦可丑也，自我致戎，又誰咎也。\n\n/3&\n\n&4&\n##### 九四：解而姆，朋至斯孚。\n\n##### 象曰：解而拇，未當位也。\n\n/4&\n\n&5&\n##### 六五：君子維有解，吉，有孚于小人。\n\n##### 象曰：君子有解，小人退也。\n\n/5&\n\n&6&\n##### 上六：公用射隼于高墉之上，獲之无不利。\n\n##### 象曰：公用射隼，以解悖也。\n\n/6&"},"110001":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/041.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：損益盛衰之始也。**\n\n#### 序\n**序卦曰：緩必有所失，故受之以損。**","text.tab3":"&0&\n**損：有孚，元吉，无咎，可貞，利有攸往。**\n**象曰：山下有澤，損；君子以懲忿窒欲。**\n/0&\n#### 彖\n\n**彖曰：損，損下益上，其道上行，損而有孚，元吉。无咎，可貞，利有攸往，曷之用，二簋可用享，二簋應有時，損剛益柔有時，損益盈虛，與時偕行。**\n\n#### 爻\n\n&1&\n##### 初九：已事遄往，无咎，酌損之。\n\n##### 象曰：已事遄往，尚合志也。\n\n/1&\n\n&2&\n##### 九二：利貞，征凶，弗損益之。\n\n##### 象曰：九二利貞，中以為志也。\n\n/2&\n\n&3&\n##### 六三：三人行，則損一人。一人行，則得其友。\n\n##### 象曰：一人行，三則疑也。\n\n/3&\n\n&4&\n##### 六四：換其疾，使遄有喜，无咎。\n\n##### 象曰：損其疾，亦可喜也。\n\n/4&\n\n&5&\n##### 六五：或益之，十朋之龜，弗克違，元吉。\n\n##### 象曰：六五元吉，自上佑也。\n\n/5&\n\n&6&\n##### 上九：弗損益之，无咎，貞吉，利有攸往，得臣无家。\n\n##### 象曰：弗損益之，大得志也。\n\n/6&"},"100011":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/042.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：損益盛衰之始也。**\n\n#### 序\n**序卦曰：損而不已，必益，故受之以益。**","text.tab3":"&0&\n**益：利有攸往，利涉大川。**\n**象曰：風雷，益；君子以見善則遷，有過則改。**\n/0&\n#### 彖\n\n**彖曰：益，損上益下，民說无疆，自上下下，其道大光。利有攸往，中正有慶；利涉大川，木道乃行。益動而巽，日進无疆，天施地生，其益无方，凡益之道，與時偕行。**\n\n#### 爻\n\n&1&\n##### 初九：利用爲大作，元吉，無咎。\n\n##### 象曰：元吉无咎，下不厚事也。\n\n/1&\n\n&2&\n##### 六二：或益之，十朋之龜，弗克違，永貞吉，王用享于帝，吉。\n\n##### 象曰：或益之，自外來也。\n\n/2&\n\n&3&\n##### 六三：益之用凶事，无咎。有孚中行，告公用圭。\n\n##### 象曰：益用凶事，固有之也。\n\n/3&\n\n&4&\n##### 六四：中行，告公從，利用爲依遷國。\n\n##### 象曰：告公從，以益志也。\n\n/4&\n\n&5&\n##### 九五：有孚惠心，勿問元吉，有孚惠我德。\n\n##### 象曰：有孚惠心，勿問之矣。惠我德，大得志也。\n\n/5&\n\n&6&\n##### 上九：莫益之，或擊之，立心勿恒，凶。\n\n##### 象曰：莫益之，偏辭也。或擊之，自外來也。\n\n/6&"},"111110":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/043.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：夬決也，剛決柔也，君子道長，小人道憂也。**\n\n#### 序\n**序卦曰：益而不已，必決，故受之以夬。夬者，決也。**","text.tab3":"&0&\n**夬：揚于王庭，孚號，有厲。**\n**象曰：澤上于天，夬；君子以施祿及下，居德則忌。**\n/0&\n#### 彖\n\n**彖曰：夬，決也，剛決柔也。健而說，決而和。揚于王庭，柔乘五剛也；孚號有厲，其危乃光也；告自邑，不利即戎，所尚乃窮也；利有攸往，剛長乃終也。**\n\n#### 爻\n\n&1&\n##### 初九：壯于前趾，往不勝爲咎。\n\n##### 象曰：不勝而往，咎也。\n\n/1&\n\n&2&\n##### 九二：惕號，莫夜有戎，勿恤。\n\n##### 象曰：莫夜有戎，得中道也。\n\n/2&\n\n&3&\n##### 九三：壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎。\n\n##### 象曰：君子夬夬，終无咎也。\n\n/3&\n\n&4&\n##### 九四：臀无膚，其行次且，牽羊悔亡，聞言不信。\n\n##### 象曰：其行次且，位不當也。聞言不信，聰不明也。\n\n/4&\n\n&5&\n##### 九五：莧陸夬夬，中行无咎。\n\n##### 象曰：中行无咎，中未光也。\n\n/5&\n\n&6&\n##### 上六：无號，終有凶。\n\n##### 象曰：无號之凶，終不可長也。\n\n/6&"},"011111":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/044.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：大過顛也，姤遇也，柔遇剛也。**\n\n#### 序\n**序卦曰：決必有遇，故受之以姤。姤者，遇也。**","text.tab3":"&0&\n**姤：女壯，勿用取女。**\n**象曰：天下有風，姤；后以施命誥四方。**\n/0&\n#### 彖\n\n**彖曰：姤，遇也，柔遇剛也。勿用取女，不可與長也。天地相遇，品物咸章也；剛遇中正，天下大行也，姤之時義大矣哉。**\n\n#### 爻\n\n##### 象曰：系于金柅，柔道牽也。\n\n&1&\n##### 九二：包有魚，无咎，不利賓。\n\n##### 象曰：系于金柅，柔道牽也。\n\n/1&\n\n&2&\n##### 九三：臀无膚，其行次且，厲，无大咎。\n\n##### 象曰：包有魚，義不及賓也。\n\n/2&\n\n&3&\n##### 九四：包无魚，起凶。\n\n##### 象曰：其行次且，行未牽也。\n\n/3&\n\n&4&\n##### 九五：以杞包瓜，含章，有損自天。\n\n##### 象曰：无魚之凶，遠民也。\n\n/4&\n\n&5&\n##### 上九：姤其角，吝，无咎。\n\n##### 象曰：姤其角，上窮吝也。\n\n/5&"},"000110":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/045.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：萃聚而升不來也**\n\n#### 序\n**序卦曰：物相遇而後聚，故受之以萃。萃者，聚也。**","text.tab3":"&0&\n**萃：亨，王假有廟。利見大人，亨，利貞。用大牲吉，利有攸往。**\n**象曰：澤上于地，萃；君子以除戎器，戒不虞。**\n/0&\n#### 彖\n\n**彖曰：萃，聚也。順以說，剛中而應，故聚也。王假有廟，致孝享也；利見大人，亨，聚以正也；用大牲，吉，利有攸往，順天命也。觀其所聚，而天地萬物之情可見矣。**\n\n#### 爻\n\n&1&\n##### 初六：有孚不終，乃亂乃萃，若號，一握爲笑，勿恤，往无咎。\n\n##### 象曰：乃亂乃萃，其志亂也。\n\n/1&\n\n&2&\n##### 六二：引吉，无咎，孚乃利用禴。\n\n##### 象曰：引吉无咎，中未變也。\n\n/2&\n\n&3&\n##### 六三：萃如磋如，无攸利，往无咎，小吝。\n\n##### 象曰：往无咎，上巽也。\n\n/3&\n\n&4&\n##### 九四：大吉无咎。\n\n##### 象曰：大吉无咎，位不當也。\n\n/4&\n\n&5&\n##### 九五：萃有位，无咎。匪孚，元永貞，悔亡。\n\n##### 象曰：萃有位，志未光也。\n\n/5&\n\n&6&\n##### 上六：齎咨涕洟，无咎。\n\n##### 象曰：齎咨涕洟，未安上也。\n\n/6&"},"011000":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/046.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：萃聚而升不來也**\n\n#### 序\n**序卦曰：聚而上者，謂之升，故受之以升。**","text.tab3":"&0&\n**升：元亨，用見大人，勿恤，南征吉。**\n**象曰：地中生木，升；君子以順德，積小以高大。**\n/0&\n#### 彖\n\n**彖曰：柔以時升，巽而順，剛中而應，是以大亨；用見大人，勿恤，有慶也；南征吉，志行也。**\n\n#### 爻\n\n&1&\n##### 初六：允升，大吉。\n\n##### 象曰：允升大吉，上合志也。\n\n/1&\n\n&2&\n##### 九二：孚乃利用禴\n\n##### 象曰：九二之孚，有喜也。\n\n/2&\n\n&3&\n##### 九三：升虛邑。\n\n##### 象曰：升虛邑，无所疑也。\n\n/3&\n\n&4&\n##### 六四：王用享于岐山，吉 ，无咎。\n\n##### 象曰：王用亨于岐山，順事也。\n\n/4&\n\n&5&\n##### 六五：貞，吉，升階。\n\n##### 象曰：貞吉升階，大得志也。\n\n/5&\n\n&6&\n##### 上六：冥升，利于不息之貞。\n\n##### 象曰：冥升在上，消不富也。\n\n/6&"},"010110":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/047.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：井通而困相遇也。**\n\n#### 序\n**序卦曰：升而不已，必困，故受之以困。**","text.tab3":"&0&\n**困：亨，貞，大人士口，无咎，有言口不信。**\n**象曰：澤无水，困；君子以致命遂志。**\n/0&\n#### 彖\n\n**彖曰：困，剛揜也。險以說，困而不失其所亨，其唯君子乎。貞大人吉，以剛中也；有言不信，尚口乃窮也。**\n\n#### 爻\n\n&1&\n##### 初六：臀困于株木，入于幽谷，三歲不覿。\n\n##### 象曰：入于幽谷，幽不明也。\n\n/1&\n\n&2&\n##### 九二：困于酒食，朱紱方來，利用享祀：征凶，无咎。\n\n##### 象曰：困于酒食，中有慶也。\n\n/2&\n\n&3&\n##### 六三：困于石，據于蒺藜，入于其宮，不見其妻，凶。\n\n##### 象曰：據于蒺藜，乘剛也。入于其宮，不見其妻，不祥也。\n\n/3&\n\n&4&\n##### 九四：來徐徐，困于金車，吝，有終。\n\n##### 象曰：來徐徐，志在下也。雖不當位，有與也。\n\n/4&\n\n&5&\n##### 九五：劓刖，困于赤紱，乃徐有説，利用祭祀。\n\n##### 象曰：劓刖，志未得也。乃徐有說，以中直也。利用祭祀，受福也。\n\n/5&\n\n&6&\n##### 上六：困于葛藟，于臲卼，曰動悔。\n\n##### 象曰：困于葛藟，未當也。動悔，有悔，吉行也。\n\n/6&"},"011010":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/048.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：井通而困相遇也。**\n\n#### 序\n**序卦曰：困乎上者，必反下，故受之以井。**","text.tab3":"&0&\n**井：改邑不改井，无喪无得，往來井井。**\n**象曰：木上有水，井；君子以勞民勸相。**\n/0&\n#### 彖\n\n**彖曰：巽乎水而上水，井，井養而不窮也。改邑不改井，乃以剛中也；汔至亦未繘井，未有功也；羸其瓶，是以凶也。**\n\n#### 爻\n\n&1&\n##### 初六：井泥不食，舊井无禽。\n\n##### 象曰：井泥不食，下也。舊井无禽，時舍也。\n\n/1&\n\n&2&\n##### 九二：井谷射鮒，甕敝漏。\n\n##### 象曰：井谷射鮒，无與也。\n\n/2&\n\n&3&\n##### 九三：井渫不食，爲我心惻，可用汲，王明並受其福。\n\n##### 象曰：井渫不食，行惻也。求王明，受福也。\n\n/3&\n\n&4&\n##### 六四：井甃，无咎。\n\n##### 象曰：井甃无咎，修井也。\n\n/4&\n\n&5&\n##### 九五：井洌，寒泉食。\n\n##### 象曰：寒泉之食，中正也。\n\n/5&\n\n&6&\n##### 上六：井收勿幕，有孚元吉。\n\n##### 象曰：元吉在上，大成也。\n\n/6&"},"101110":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/049.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：革去故也，鼎取新也。**\n\n#### 序\n**序卦曰：井道不可不革，故受之以革。**","text.tab3":"&0&\n**革：巳日乃孚，元亨利貞，悔亡。**\n**象曰：澤中有火，革；君子以治歷明時。**\n/0&\n#### 彖\n\n**彖曰：革，水火相息，二女同居，其志不相得，曰革。已日乃孚，革而信之，文明以說，大亨以正，革而當，其悔乃亡。天地革而四時成，湯武革命，順乎天而應乎人，革之時大矣哉。**\n\n#### 爻\n\n&1&\n##### 初九：鞏用黃牛之革。\n\n##### 象曰：鞏用黃牛，不可以有為也。\n\n/1&\n\n&2&\n##### 六二：巳日乃革之，征吉 ，无咎。\n\n##### 象曰：巳日革之，行有嘉也。\n\n/2&\n\n&3&\n##### 九三：征凶，貞厲。革言三就，有孚。\n\n##### 象曰：革言三就，又何之矣。\n\n/3&\n\n&4&\n##### 九四：悔亡，有孚，改命，吉。\n\n##### 象曰：改命之吉，信志也。\n\n/4&\n\n&5&\n##### 九五：大人虎變，未占有孚。\n\n##### 象曰：大人虎變，其文炳也。\n\n/5&\n\n&6&\n##### 上六：君子豹變，小人革面，征凶，居貞吉。\n\n##### 象曰：君子豹變，其文蔚也。小人革面，順以從君也。\n\n/6&"},"011101":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/050.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：革去故也，鼎取新也。**\n\n#### 序\n**序卦曰：革物者，莫若鼎，故受之以鼎。**","text.tab3":"&0&\n**鼎：元吉、亨。**\n**象曰：木上有火，鼎；君子以正位凝命。**\n/0&\n#### 彖\n\n**彖曰：鼎，象也。以木巽火，亨飪也。聖人亨以享上帝，而大亨以養聖賢。巽而耳目聰明，柔進而上行，得中而應乎剛，是以元亨。**\n\n#### 爻\n\n&1&\n##### 初六：鼎顚趾，利出否。得妾以其子，无咎。\n\n##### 象曰：鼎顛趾，未悖也。利出否，以從貴也。\n\n/1&\n\n&2&\n##### 九二：鼎有實，我仇有疾，不我能即，吉。\n\n##### 象曰：鼎有實，慎所之也。我仇有疾，終无尤也。\n\n/2&\n\n&3&\n##### 九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。\n\n##### 象曰：鼎耳革，失其義也。\n\n/3&\n\n&4&\n##### 九四：鼎折足，覆公餗，其形渥，凶。\n\n##### 象曰：覆公餗，信如何也。\n\n/4&\n\n&5&\n##### 六五：鼎黃耳，金鉉，利貞。\n\n##### 象曰：鼎黃耳，中以為實也。\n\n/5&\n\n&6&\n##### 上九：鼎玉鉉，大吉，无不利。\n\n##### 象曰：玉鉉在上，剛柔節也。\n\n/6&"},"100100":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/051.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：震起也，艮止也。**\n\n#### 序\n**序卦曰：主器者，莫若長子，故受之以震。震者，動也。**","text.tab3":"&0&\n**震：亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。**\n**象曰：洊雷，震；君子以恐懼修省。**\n/0&\n#### 彖\n\n**彖曰：震，亨。震來虩虩，恐致福也；笑言啞啞，後有則也；震驚百里，驚遠而懼邇也，出可以守宗廟社稷，以為祭主也。**\n\n#### 爻\n\n&1&\n##### 初九：震來虩虩，後笑言啞啞，吉。\n\n##### 象曰：震來虩虩，恐致福也。笑言啞啞，后有則也。\n\n/1&\n\n&2&\n##### 六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。\n\n##### 象曰：震來厲，乘剛也。\n\n/2&\n\n&3&\n##### 六三：震蘇蘇，震行无眚。\n\n##### 象曰：震蘇蘇，位不當也。\n\n/3&\n\n&4&\n##### 九四：震遂泥。\n\n##### 象曰：震遂泥，未光也。\n\n/4&\n\n&5&\n##### 六五：震往來厲，億无喪有事。\n\n##### 象曰：震往來厲，危行也。其事在中，大无喪也。\n\n/5&\n\n&6&\n##### 上六：震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎，婚媾有言。\n\n##### 象曰：震索索，中未得也。雖凶无咎，畏鄰戒也。\n\n/6&"},"001001":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/052.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：震起也，艮止也。**\n\n#### 序\n**序卦曰：物不可以終動，(動必/_)止之，故受之以艮。艮者，止也。**","text.tab3":"&0&\n**艮其背，不獲其身，行其庭，不見其人，无咎。**\n**象曰：兼山，艮；君子以思不出其位。**\n/0&\n#### 彖\n\n**彖曰：艮，止也，時止則止，時行則行，動靜不失其時，其道光明。艮其止，止其所也。上下敵應，不相與也，是以不獲其身。行其庭不見其人，无咎也。**\n\n#### 爻\n\n&1&\n##### 初六：艮其趾，无咎，利永貞。\n\n##### 象曰：艮其趾，未失正也。\n\n/1&\n\n&2&\n##### 六二：艮其腓，不拯其隨，其心不快。\n\n##### 象曰：不拯其隨，未退聽也。\n\n/2&\n\n&3&\n##### 九三：艮其限，列其夤，厲薰心。\n\n##### 象曰：艮其限，危薰心也。\n\n/3&\n\n&4&\n##### 六四：艮其身，无咎。\n\n##### 象曰：艮其身，止諸躬也。\n\n/4&\n\n&5&\n##### 六五：艮其輔，言有序，悔亡。\n\n##### 象曰：艮其輔，以中正也。\n\n/5&\n\n&6&\n##### 上九：敦艮，吉。\n\n##### 象曰：敦艮之吉，以厚終也。\n\n/6&"},"001011":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/053.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：漸女歸待男行也，歸妹女之終也。**\n\n#### 序\n**序卦曰：物不可以終止，故受之以漸。漸者，進也。**","text.tab3":"&0&\n**漸：女歸吉，利貞。**\n**象曰：山上有木，漸；君子以居賢德，善俗。**\n/0&\n#### 彖\n\n**彖曰：漸之進也，女歸吉也。進得位，往有功也，進以正，可以正邦也。其位剛得中也。止而巽，動不窮也。**\n\n#### 爻\n\n&1&\n##### 初六：鴻漸于干，小子厲，有言，无咎。\n\n##### 象曰：小子之厲，義无咎也。\n\n/1&\n\n&2&\n##### 六二：鴻漸于磐，飲食衎衎，吉。\n\n##### 象曰：飲食衎衎，不素飽也。\n\n/2&\n\n&3&\n##### 九三：鴻漸于陸，夫征不復，婦孕不育，凶，利禦寇。\n\n##### 象曰：夫征不復，離群丑也。婦孕不育，失其道也。利用禦寇，順相保也。\n\n/3&\n\n&4&\n##### 六四：鴻漸于木，或得其桷，无咎。\n\n##### 象曰：或得其桷，順以巽也。\n\n/4&\n\n&5&\n##### 九五：鴻漸于陵，婦三婦不孕，終莫之勝，吉。\n\n##### 象曰：終莫之勝，吉；得所愿也。\n\n/5&\n\n&6&\n##### 上九：鴻漸于陸，其羽可用爲儀，吉。\n\n##### 象曰：其羽可用為儀，吉；不可亂也。\n\n/6&"},"110100":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/054.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：漸女歸待男行也，歸妹女之終也。**\n\n#### 序\n**序卦曰：進必有所歸，故受之以歸妹。**","text.tab3":"&0&\n**歸妹，征凶，无攸利。**\n**象曰：澤上有雷，歸妹；君子以永終知敝。**\n/0&\n#### 彖\n\n**彖曰：歸妹，天地之大義也。天地不交，而萬物不興。歸妹，人之終始也，說以動，所歸妹也。征凶，位不當也；无攸利，柔乘剛也。**\n\n#### 爻\n\n&1&\n##### 初九：歸妹以娣，跛能履，征吉。\n\n##### 象曰：歸妹以娣，以恆也。跛能履吉，相承也。\n\n/1&\n\n&2&\n##### 九二：眇能視，利幽人之貞。\n\n##### 象曰：利幽人之貞，未變常也。\n\n/2&\n\n&3&\n##### 六三：歸妹以須，反歸以娣。\n\n##### 象曰：歸妹以須，未當也。\n\n/3&\n\n&4&\n##### 九四：歸妹愆期，遲歸有時。\n\n##### 象曰：愆期之志，有待而行也。\n\n/4&\n\n&5&\n##### 六五：帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉 。\n\n##### 象曰：帝乙歸妹，不如其娣之袂良也。其位在中，以貴行也。\n\n/5&\n\n&6&\n##### 上六：女承筐无實，士刲羊无血，无攸利。\n\n##### 象曰：上六无實，承虛筐也。\n\n/6&"},"101100":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/055.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：豐多故也，親寡旅也。**\n\n#### 序\n**序卦曰：得其所歸者，必大，故受之以豐。豐者，大也。**","text.tab3":"&0&\n**豐：亨，王假之，勿憂，宣日中。**\n**象曰：雷電皆至，豐；君子以折獄致刑。**\n/0&\n#### 彖\n\n**彖曰：豐，大也。明以動，故豐。王假之，尚大也；勿憂，宜日中，宜照天下也。日中則昃，月盈則食，天地盈虛，與時消息，而況於人乎？況於鬼神乎？**\n\n#### 爻\n\n&1&\n##### 初九：遇其配主，雖旬无咎，往有尚。\n\n##### 象曰：雖旬无咎，過旬災也。\n\n/1&\n\n&2&\n##### 六二：豐其蘚，日中見斗，往得疑疾，有孚發若，吉 。\n\n##### 象曰：有孚發若，信以發志也。\n\n/2&\n\n&3&\n##### 九三：豐其沛，日中見沫，折其右肱，无咎。\n\n##### 象曰：豐其沛，不可大事也。折其右肱，終不可用也。\n\n/3&\n\n&4&\n##### 九四：豐其薜，日中見斗，遇其夷主，吉。\n\n##### 象曰：豐其蔀，位不當也。日中見斗，幽不明也。遇其夷主，吉；行也。\n\n/4&\n\n&5&\n##### 六五：來章，有慶譽，吉。\n\n##### 象曰：六五之吉，有慶也。\n\n/5&\n\n&6&\n##### 上六：豐其屋，蔀其家，窺其户，闋其無人，三歲不覿，凶。\n\n##### 象曰：豐其屋，天際翔也。窺其戶，闃其无人，自藏也。\n\n/6&"},"001101":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/056.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：豐多故也，親寡旅也。**\n\n#### 序\n**序卦曰：窮大者，必失其居，故受之以旅。**","text.tab3":"&0&\n**旅：小亨、旅貞吉。**\n**象曰：山上有火，旅；君子以明慎用刑，而不留獄。**\n/0&\n#### 彖\n\n**彖曰：旅，小亨，柔得中乎外而順乎剛，止而麗乎明，是以小亨，旅貞吉也，旅之時義大矣哉。**\n\n#### 爻\n\n&1&\n##### 初六：旅瑣瑣，斯其所取災。\n\n##### 象曰：旅瑣瑣，志窮災也。\n\n/1&\n\n&2&\n##### 六二：旅即次，懷其資，得童僕貞。\n\n##### 象曰：得童僕貞，終无尤也。\n\n/2&\n\n&3&\n##### 九三：旅焚其次，喪其童僕，貞厲。\n\n##### 象曰：旅焚其次，亦以傷矣。以旅與下，其義喪也。\n\n/3&\n\n&4&\n##### 九四：旅于處，得其資斧，我心不快。\n\n##### 象曰：旅于處，未得位也。得其資斧，心未快也。\n\n/4&\n\n&5&\n##### 六五：射雉，一矢亡，終以譽命。\n\n##### 象曰：終以譽命，上逮也。\n\n/5&\n\n&6&\n##### 上九：鳥焚其巢，旅人先笑後號咷，喪牛于易，凶。\n\n##### 象曰：以旅在上，其義焚也。喪牛于易，終莫之聞也。\n\n/6&"},"011011":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/057.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：兌見而巽伏也。**\n\n#### 序\n**序卦曰：旅而無所容，故受之以巽。巽者，入也。**","text.tab3":"&0&\n**巽：小亨。利有攸往，利見大人。**\n**象曰：隨風，巽；君子以申命行事。**\n/0&\n#### 彖\n\n**彖曰：重巽以申命，剛巽乎中正而志行，柔皆順乎剛，是以小亨，利有攸往，利見大人。**\n\n#### 爻\n\n&1&\n##### 初六：進退，利武人之貞。\n\n##### 象曰：進退，志疑也。利武人之貞，志治也。\n\n/1&\n\n&2&\n##### 九二：巽在床下，用史巫紛若，吉，\n\n##### 象曰：紛若之吉，得中也。\n\n/2&\n\n&3&\n##### 九三：頻巽，吝。\n\n##### 象曰：頻巽之吝，志窮也。\n\n/3&\n\n&4&\n##### 六四：悔亡，田獲三品。\n\n##### 象曰：田獲三品，有功也。\n\n/4&\n\n&5&\n##### 九五：貞吉，悔亡无不利，无初有終，先庚三日，後庚三日，吉。\n\n##### 象曰：九五之吉，位正中也。\n\n/5&\n\n&6&\n##### 上九：巽在床下，喪其資斧，貞凶。\n\n##### 象曰：巽在牀下，上窮也。喪其資斧，正乎凶也。\n\n/6&"},"110110":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/058.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：兌見而巽伏也。**\n\n#### 序\n**序卦曰：入而後說之，故受之以兌。兌者，說也。**","text.tab3":"&0&\n**兌：亨，利、貞。**\n**象曰：麗澤，兌；君子以朋友講習。**\n/0&\n#### 彖\n\n**彖曰：兌，說也。剛中而柔外，說以利貞，是以順乎天而應乎人。說以先民，民忘其勞，說以犯難，民忘其死，說之大，民勸矣哉。**\n\n#### 爻\n\n&1&\n##### 初九：和兌，吉。\n\n##### 象曰：和兌之吉，行未疑也。\n\n/1&\n\n&2&\n##### 九二：孚兌，吉，悔亡。\n\n##### 象曰：孚兌之吉，信志也。\n\n/2&\n\n&3&\n##### 六三：來兌，凶。\n\n##### 象曰：來兌之凶，位不當也。\n\n/3&\n\n&4&\n##### 九四：商兌未寧，介疾有喜。\n\n##### 象曰：九四之喜，有慶也。\n\n/4&\n\n&5&\n##### 九五：孚于剝，有厲。\n\n##### 象曰：孚于剝，位正當也。\n\n/5&\n\n&6&\n##### 上六：引兌\n\n##### 象曰：上六引兌，未光也。\n\n/6&"},"010011":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/059.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：渙離也，節止也。**\n\n#### 序\n**序卦曰：說而後散之，故受之以渙。渙者，離也。**","text.tab3":"&0&\n**渙：亨。王假有廟，利涉大川，利貞。**\n**象曰：風行水上，渙；先王以享于帝立廟。**\n/0&\n#### 彖\n\n**彖曰：渙亨，剛來而不窮，柔得位乎外而上同。王假有廟，王乃在中也。利涉大川，乘木有功也。**\n\n#### 爻\n\n&1&\n##### 初六：用拯馬壯，吉。\n\n##### 象曰：初六之吉，順也。\n\n/1&\n\n&2&\n##### 九二：渙奔其機，悔亡。\n\n##### 象曰：渙奔其机，得愿也。\n\n/2&\n\n&3&\n##### 六三：渙其躬，无悔。\n\n##### 象曰：渙其躬，志在外也。\n\n/3&\n\n&4&\n##### 六四：渙其群，元吉。渙有丘，匪夷所思。\n\n##### 象曰：渙其群，元吉；光大也。\n\n/4&\n\n&5&\n##### 九五：渙汗其大號，渙王居，无咎。\n\n##### 象曰：王居无咎，正位也。\n\n/5&\n\n&6&\n##### 上九：渙其血，去逖出，无咎。\n\n##### 象曰：渙其血，遠害也。\n\n/6&"},"110010":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/060.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：渙離也，節止也。**\n\n#### 序\n**序卦曰：物不可以終離，故受之以節。**","text.tab3":"&0&\n**節：亨，苦節，不可貞。**\n**象曰：澤上有水，節；君子以制數度，議德行。**\n/0&\n#### 彖\n\n**彖曰：節亨，剛柔分而剛得中。苦節不可貞，其道窮也。說以行險，當位以節，中正以通。天地節而四時成，節以制度，不傷財，不害民。**\n\n#### 爻\n\n&1&\n##### 初九：不出户庭，无咎。\n\n##### 象曰：不出戶庭，知通塞也。\n\n/1&\n\n&2&\n##### 九二：不出門庭，凶。\n\n##### 象曰：不出門庭，失時極也。\n\n/2&\n\n&3&\n##### 六三：不節若，則嗟若，无咎。\n\n##### 象曰：不節之嗟，又誰咎也。\n\n/3&\n\n&4&\n##### 六四：安節，亨。\n\n##### 象曰：安節之亨，承上道也。\n\n/4&\n\n&5&\n##### 九五：節，吉，往有尚。\n\n##### 象曰：甘節之吉，居位中也。\n\n/5&\n\n&6&\n##### 上六：苦節，貞凶，悔亡。\n\n##### 象曰：苦節貞凶，其道窮也。\n\n/6&"},"110011":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/061.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：小過過也，中孚信也。**\n\n#### 序\n**序卦曰：節而信之，故受之以中孚。**","text.tab3":"&0&\n**中孚：豚魚吉，利涉大川，利貞。**\n**象曰：澤上有風，中孚；君子以議獄緩死。**\n/0&\n#### 彖\n\n**彖曰：中孚，柔在內而剛得中，說而巽，孚，乃化邦也。豚魚吉，信及豚魚也；利涉大川，乘木舟虛也；中孚以利貞，乃應乎天也。**\n\n#### 爻\n\n&1&\n##### 初九：虞吉。有它，不燕。\n\n##### 象曰：初九虞吉，志未變也。\n\n/1&\n\n&2&\n##### 九二：鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。\n\n##### 象曰：其子和之，中心愿也。\n\n/2&\n\n&3&\n##### 六三：得敵，或鼓或罷，或泣或歌。\n\n##### 象曰：可鼓或罷，位不當也。\n\n/3&\n\n&4&\n##### 六四：月幾望，馬匹亡，无咎。\n\n##### 象曰：馬匹亡，絕類上也。\n\n/4&\n\n&5&\n##### 九五：有孚孿如，无咎。\n\n##### 象曰：有孚攣如，位正當也。\n\n/5&\n\n&6&\n##### 上九：翰音登于天，貞凶。\n\n##### 象曰：翰音登于天，何可長也。\n\n/6&"},"001100":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/062.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：小過過也，中孚信也。**\n\n#### 序\n**序卦曰：有其信者，必行之，故受之以小過。**","text.tab3":"&0&\n**小過：亨，利，貞。**\n**象曰：山上有雷，小過；君子以行過乎恭，喪過乎哀，用過乎儉。**\n/0&\n#### 彖\n\n**彖曰：小過，小者過而亨也，過以利貞，與時行也。柔得中，是以小事吉也；剛失位而不中，是以不可大事也。有飛鳥之象焉，飛鳥遺之音，不宜上，宜下，大吉，上逆而下順也。**\n\n#### 爻\n\n&1&\n##### 初六：飛鳥以凶。\n\n##### 象曰：飛鳥以凶，不可如何也。\n\n/1&\n\n&2&\n##### 六二：過其祖，遇其妣，不及其君，遇其臣，无咎。\n\n##### 象曰：不及其君，臣不可過也。\n\n/2&\n\n&3&\n##### 九三：弗過防之，從或戕之，凶。\n\n##### 象曰：從或戕之，凶如何也。\n\n/3&\n\n&4&\n##### 九四：无咎，弗過遇之，往厲必戒，勿用永貞。\n\n##### 象曰：弗過遇之，位不當也。往厲必戒，終不可長也。\n\n/4&\n\n&5&\n##### 六五：密雲不雨，自我西郊，公弋取彼在穴。\n\n##### 象曰：密云不雨，已上也。\n\n/5&\n\n&6&\n##### 上六：弗遇過之，飛鳥離之，凶，是謂災眚。\n\n##### 象曰：弗遇過之，已亢也。\n\n/6&"},"101010":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/063.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：既濟定也，未濟男之窮也。**\n\n#### 序\n**序卦曰：有過物者，必濟，故受之以既濟。**","text.tab3":"&0&\n**既濟：亨小，利貞，初吉，終亂。**\n**象曰：水在火上，既濟；君子以思患而豫防之。**\n/0&\n#### 彖\n\n**彖曰：既濟亨，小者亨也。利貞，剛柔正而位當也。初吉，柔得中也，終止則亂，其道窮也。**\n\n#### 爻\n\n&1&\n##### 初九：曳其輪，濡其尾，无咎。\n\n##### 象曰：曳其輪，義无咎也。\n\n/1&\n\n&2&\n##### 六二：婦喪其茀，勿逐，七日得。\n\n##### 象曰：七日得，以中道也。\n\n/2&\n\n&3&\n##### 九三：高宗伐鬼方，三年克之，小人勿用。\n\n##### 象曰：三年克之，憊也。\n\n/3&\n\n&4&\n##### 六四：繻有衣袽，終日戒。\n\n##### 象曰：終日戒，有所疑也。\n\n/4&\n\n&5&\n##### 九五：柬鄰殺牛，不如西鄰之禴祭，實受其福。\n\n##### 象曰：東鄰殺牛，不如西鄰之時也；實受其福，吉大來也。\n\n/5&\n\n&6&\n##### 上六：濡其首，厲。\n\n##### 象曰：濡其首厲，何可久也。\n\n/6&"},"010101":{"text.tab1":"#### 圖\n![(存於국립중앙도서관之《斷易天機》)](assets/guatu_pdf/064.jpg)","text.tab2":"#### 雜\n\n**雜卦曰：既濟定也，未濟男之窮也。**\n\n#### 序\n**序卦曰：物不可窮也，故受之以未濟終焉。**","text.tab3":"&0&\n**未濟：亨。小狐汔濟，濡其尾，无攸利。**\n**象曰：火在水上，未濟；君子以慎辨物居方。**\n/0&\n#### 彖\n\n**彖曰：未濟亨，柔得中也；小狐汔濟，未出中也；濡其尾，无攸利，不續終也，雖不當位，剛柔應也。**\n\n#### 爻\n\n&1&\n##### 初六：濡其尾，吝。\n\n##### 象曰：濡其尾，亦不知極也。\n\n/1&\n\n&2&\n##### 九二：曳其輪，貞吉。\n\n##### 象曰：九二貞吉，中以行正也。\n\n/2&\n\n&3&\n##### 六三：未濟，征凶，利涉大川。\n\n##### 象曰：未濟征凶，位不當也。\n\n/3&\n\n&4&\n##### 九四：貞吉 ，悔亡，震用伐鬼方，三年有賞于大國。\n\n##### 象曰：貞吉悔亡，志行也。\n\n/4&\n\n&5&\n##### 六五：貞吉 ，无悔，君子之光，有孚，吉。\n\n##### 象曰：君子之光，其暉吉也。\n\n/5&\n\n&6&\n##### 上九：有孚于飲酒，无咎，濡其首，有孚失是。\n\n##### 象曰：飲酒濡首，亦不知節也。\n\n/6&"}};
const _EMBEDDED_SAVES = [{"digits":[0,0,0,0,0,0],"time":"2026-06-09T17:37:17.521Z","favo":false},{"digits":[8,9,7,9,7,9],"time":"2026-06-16T18:45:37.402Z","shibo":"1:5:7:3","favo":true,"name":"この車はいいですか","note":"The hexagram indicated it's a new car, which was so true... \n\nThe future hexagram gave a clear warning and the moving lines revealed which components to blame."},{"digits":[8,7,8,7,8,8],"time":"2026-06-17T14:24:31.857Z","shibo":"1:5:7:3","favo":true,"name":"解：利西南，無所往，其來復吉，有攸往，夙","note":"제가 번역을 제대로 한 건가요?"},{"digits":[9,8,6,8,8,7],"time":"2026-06-17T22:59:19.784Z","shibo":"1:5:7:3","favo":true,"name":"How Is He?","note":"啊？\n有点意思。。。"},{"digits":[8,8,6,8,8,9],"time":"2026-06-27T22:02:27.028Z","shibo":"1:3:3:1","favo":false,"name":"display","note":"我请易经给一个可以拿来做例子展示在GitHub的卦，随便给什么啦！是什么我就展示什么。\nI asked iching what hexagrams to display on my Github page. I wished it could give a hexagram that contained water, fire, thunder or wind, since I like how blue, red and green look on the app."}];


/// standalone localStorage utilities ///
const _LS_SAVES = 'yc_saves', _LS_CFG = 'yc_config', _LS_HEX_OV = 'yc_hex_ov', _LS_LAST = 'yc_last';
// 防舊版殘留：所有 localStorage 讀取一律容錯 —— 壞 JSON / 型別不符 → 回傳預設值，不炸 boot
function _lsParse(s, def){ try { return s === null ? def : JSON.parse(s); } catch(e){ return def; } }
function _lsLoadSaves(){
  const s = localStorage.getItem(_LS_SAVES);
  if(s !== null){ const v = _lsParse(s, []); return Array.isArray(v) ? v : []; }
  const _def = _EMBEDDED_SAVES || [];
  localStorage.setItem(_LS_SAVES, JSON.stringify(_def));
  return JSON.parse(JSON.stringify(_def));
}
function _lsSave(entry){ const r=_lsLoadSaves(); r.push(entry); localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsFavo(time,favo){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){x.favo=favo;break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsDelete(time){ localStorage.setItem(_LS_SAVES,JSON.stringify(_lsLoadSaves().filter(r=>r.time!==time))); _srcSetClean('saves',false); }
function _lsSetName(time,name){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){x.name=name;break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsUpdateRecord(time,changes){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){Object.assign(x,changes);break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
// 內建回退設定（不含 hexagrams），深拷貝。_EMBEDDED_CONFIG 保證存在且為精簡回退形狀
function _cfgFallback(){ const {hexagrams,...fb}=_EMBEDDED_CONFIG; return JSON.parse(JSON.stringify(fb)); }
// 逐鍵合併：儲存的設定蓋在回退上 —— 舊版設定缺新鍵時由回退補齊，不炸 boot
function _lsGetConfig(){
  const stored = _lsParse(localStorage.getItem(_LS_CFG), null);
  const cfg = (stored && typeof stored==='object' && !Array.isArray(stored)) ? stored : {};
  return { ..._cfgFallback(), ...JSON.parse(JSON.stringify(cfg)) };
}
function _lsSaveConfig(cfg){ localStorage.setItem(_LS_CFG,JSON.stringify(cfg)); }
function _lsGetHexOv(){ const v=_lsParse(localStorage.getItem(_LS_HEX_OV), {}); return (v && typeof v==='object' && !Array.isArray(v)) ? v : {}; }
function _lsGetLast(){ return _lsParse(localStorage.getItem(_LS_LAST), null); }
function _lsSaveLast(){ if(currentData) localStorage.setItem(_LS_LAST, JSON.stringify({digits:state.slice(),tab:currentTab})); }
function _lsApplyHexOv(num,field,text){
  const val = field==='ci' ? text.split('\n') : text;
  const ov = _lsGetHexOv(); const k = String(num);
  if(!ov[k]) ov[k]={};
  ov[k][field] = val;
  localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
  _srcSetClean(['text.tab1','text.tab2','text.tab3'].includes(field)?'md':'cfg', false);
  _srInvalidate();   // 卦的可搜尋欄位已變動，搜尋索引作廢
}
const _SRC_CANONICAL = {md:'text.md',cfg:'config.json',saves:'saves.json'};
function _esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function _validateCfg(cfg){
  if(typeof cfg !== 'object' || cfg === null || Array.isArray(cfg)) throw new Error('config.json must be a JSON object');
  const ti = cfg.trigrams;
  if(typeof ti !== 'object' || ti === null || Array.isArray(ti)) throw new Error('Missing "trigrams"');
  for(const k of ['000','001','010','011','100','101','110','111']){
    const t = ti[k];
    if(!t) throw new Error(`trigrams missing key "${k}"`);
    if(typeof t.name !== 'string') throw new Error(`trigrams["${k}"] missing "name"`);
    if(t.sym !== undefined && typeof t.sym !== 'string') throw new Error(`trigrams["${k}"] "sym" must be a string`);   // sym 可省（精簡回退無 sym）
    if(typeof t.color!== 'string') throw new Error(`trigrams["${k}"] missing "color"`);
  }
  const tn = cfg.tab_names;
  if(typeof tn !== 'object' || tn === null || Array.isArray(tn)) throw new Error('Missing "tab_names"');
  for(const k of ['tab1','tab2','tab3']){ if(typeof tn[k] !== 'string') throw new Error(`tab_names missing "${k}"`); }
  const sp = cfg.shibo_probs;
  if(typeof sp !== 'object' || sp === null || Array.isArray(sp)) throw new Error('Missing "shibo_probs"');
  const bin = sp.binary;
  if(typeof bin !== 'object' || bin === null || Array.isArray(bin)) throw new Error('shibo_probs missing "binary"');
  for(const k of ['0','1']){ if(typeof bin[k] !== 'number') throw new Error(`shibo_probs.binary missing key "${k}"`); }
  const quat = sp.quaternary;
  if(typeof quat !== 'object' || quat === null || Array.isArray(quat)) throw new Error('shibo_probs missing "quaternary"');
  for(const k of ['6','7','8','9']){ if(typeof quat[k] !== 'number') throw new Error(`shibo_probs.quaternary missing key "${k}"`); }
  // `fallback` / `table` 皆可選；有才驗證（缺省回退 DEFAULT_HIGHLIGHT）
  if(cfg.lit_mode !== undefined && typeof cfg.lit_mode !== 'string')
    throw new Error('"lit_mode" must be a string');
  if(cfg.table !== undefined && (typeof cfg.table !== 'object' || cfg.table === null || Array.isArray(cfg.table)))
    throw new Error('"table" must be an object');
}
function _srcStatus(){
  const def = {md:{clean:false,file:null},cfg:{clean:false,file:null},saves:{clean:false,file:null}};
  try{
    const raw = JSON.parse(localStorage.getItem('yc_src_status')||'{}');
    for(const t of ['md','cfg','saves']){
      if(raw[t]!=null) def[t] = typeof raw[t]==='boolean' ? {clean:raw[t],file:null} : Object.assign(def[t],raw[t]);
    }
  }catch(e){}

}
function _srcSetClean(type,clean,file){

    const dd=String(d.getDate()).padStart(2,'0');
    const hh=String(d.getHours()).padStart(2,'0');
    const mi=String(d.getMinutes()).padStart(2,'0');
    const yr=d.getFullYear();
    const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dateStr=LANG==='en'?`${hh}:${mi} ${dd}/${MON[d.getMonth()]}/${yr}`:`${yr}-${mm}-${dd} ${hh}:${mi}`;
    s[type]={clean,file:file||null,date:dateStr};

function _positionShiboBadge(){
  const badge = document.getElementById('shiboNameBadge');
  const btn = document.getElementById('btnShibo');
  const r = btn.getBoundingClientRect();
  const bw = badge.offsetWidth || 60, bh = badge.offsetHeight || 20;
  const GAP = 7, MARGIN = 4;
  const vp = window.visualViewport ? {w:window.visualViewport.width,h:window.visualViewport.height,ox:window.visualViewport.offsetLeft,oy:window.visualViewport.offsetTop} : {w:window.innerWidth,h:window.innerHeight,ox:0,oy:0};
  let x = r.left - vp.ox + r.width/2 - bw/2;
  x = Math.max(MARGIN, Math.min(vp.w - bw - MARGIN, x));
  let y = r.bottom - vp.oy + GAP;
  if(y + bh > vp.h - MARGIN) y = r.top - vp.oy - bh - GAP;
  badge.style.left = x + 'px';
  badge.style.top  = y + 'px';
}

// 歷史記錄 dropdown 操作
let _saveRecords = [];
/// 搜尋 dropdown（#saveDropdownUp）///

// 比對優先序：卦號 > 卦名 > 爻列 > 卦符 > 簡稱 > 卦爻辭 >> tab1 > tab2 > tab3
const _SR_FIELDS = ['num','name','sequence','symbol','short_name','ci','text.tab1','text.tab2','text.tab3'];
const _SR_MAX = 64;   // 最多顯示的建議數
const _SR_PAD = 18;   // 摘要中比對位置前後保留的字元數
let _srIndex = null;  // 延遲建立：只有真的搜尋時才掃描
let _srTblIndex = null;  // table.text 的獨立索引（見 _srTblBuild）
let _srResults = [];
let _srSel = -1;

// 去除 markdown 標記，讓摘要顯示為純文字
function _srStrip(s){
  return String(s)
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')          // 圖片
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')       // 連結
    .replace(/&&([\s\S]+?)\/&/g, '$1')             // && … /&
    .replace(/\{([^|{}]+)\|[^|{}]+\}/g, '$1')      // {底字|注音}
    .replace(/^[&/]\d+&\s*$/gm, '')                // &0& / /0& 爻段標記
    .replace(/^#{1,6}\s*/gm, '')                   // 標題
    .replace(/^>\s?/gm, '')                        // 引言
    .replace(/^•\s*/gm, '')                        // 條列
    .replace(/\*\*/g, '')                          // 粗體標記
    .replace(/\s+/g, ' ')
    .trim();
}

// 建立索引一次（~1ms）；欄位內容變動時以 _srInvalidate() 作廢
function _srBuild(){
  _srIndex = Object.values(_HEX_BY_NUM).map(d => {
    const raw = _SR_FIELDS.map(f => {
      if(f === 'num') return String(d.num);
      if(f === 'ci')  return (Array.isArray(d.ci) ? d.ci.join(' ') : (d.ci || '')).replace(/\s+/g, ' ').trim();
      if(f.startsWith('text.')) return _srStrip(d[f] || '');   // 先去標記，位移才對得上
      return d[f] || '';
    });
    return { d, raw, low: raw.map(s => s.toLowerCase()) };
  });
}
function _srInvalidate(){ _srIndex = null; _srTblIndex = null; }

// table.text 索引。與上面的索引不同，它以「四進制狀態」為單位而非以卦為單位：
// 同一本卦有 64 種狀態，各自可帶一段文字，所以一卦可命中多列。
// 由 HIGHLIGHT.table 取得（即當前 config 的 table），內容變動時同樣走 _srInvalidate()。
function _srTblBuild(){
  const t = (HIGHLIGHT && HIGHLIGHT.table) || null;
  _srTblIndex = [];
  if(!t) return;
  for(const key of Object.keys(t)){
    const txt = _srStrip((t[key] && t[key].text) || '');
    if(txt) _srTblIndex.push({ key, raw: txt, low: txt.toLowerCase() });
  }
}
// 狀態鍵 → 本卦爻列：7/9 為陽，6/8 為陰（索引 0 = 初爻，與 sequence 同序）
const _srBenSeq = key => [...key].map(c => (c === '7' || c === '9') ? '1' : '0').join('');

// 第一輪：每卦只取「最高優先」的一個命中。
// 第二輪：前面沒填滿 _SR_MAX 時，才補 table.text（優先序最低，見 srPick 的載入方式）。
function _srSearch(q){
  if(!q) return [];
  if(!_srIndex) _srBuild();
  const ql = q.toLowerCase();
  const out = [];
  for(const e of _srIndex){
    for(let r = 0; r < _SR_FIELDS.length; r++){
      const pos = e.low[r].indexOf(ql);
      if(pos >= 0){ out.push({ d: e.d, rank: r, pos, text: e.raw[r] }); break; }
    }
  }
  // 同欄位時，越靠前的命中越相關（如卦號 "1" 完全相符排在 "21" 之前）
  out.sort((a, b) => a.rank - b.rank || a.pos - b.pos || a.d.num - b.d.num);
  if(out.length >= _SR_MAX) return out.slice(0, _SR_MAX);
  if(!_srTblIndex) _srTblBuild();
  const tbl = [];
  for(const e of _srTblIndex){
    const pos = e.low.indexOf(ql);
    if(pos >= 0) tbl.push({ tbl: true, key: e.key, d: _HEX_BY_SEQ[_srBenSeq(e.key)] || null, pos, text: e.raw });
  }
  tbl.sort((a, b) => a.pos - b.pos || (a.key < b.key ? -1 : 1));
  return out.concat(tbl).slice(0, _SR_MAX);
}

// 命中位置前後開窗，並標示命中字串
function _srSnippet(text, pos, len){
  const s = Math.max(0, pos - _SR_PAD);
  const e = Math.min(text.length, pos + len + _SR_PAD);
  return (s > 0 ? '…' : '') + _esc(text.slice(s, pos))
       + '<span class="sr-hit">' + _esc(text.slice(pos, pos + len)) + '</span>'
       + _esc(text.slice(pos + len, e)) + (e < text.length ? '…' : '');
}

// 欄位標籤：tab 欄位沿用使用者在 config 自訂的頁籤名稱
function _srFieldLabel(field){
  if(field.startsWith('text.')) return TAB_NAMES[field.slice(5)] || field;
  return T('search.f.' + field);
}

function _srRowsHTML(q){
  if(!q) return `<div class="dd-hint">${_esc(T('search.hint'))}</div>`;
  if(!_srResults.length) return `<div class="sr-none">${_esc(T('search.none'))}</div>`;
  return _srResults.map((r, i) => {
    const field = r.tbl ? null : _SR_FIELDS[r.rank];
    // 卦號/卦名/卦符/簡稱已在標題行顯示，不再重複摘要；爻列、內文與查表才給摘要
    const showSnip = r.tbl || field === 'sequence' || field === 'ci' || field.startsWith('text.');
    const snip = showSnip
      ? `<span class="sr-snip">${_srSnippet(r.text, r.pos, q.length)}</span>` : '';
    // 查表列以狀態為單位，狀態鍵併進欄位標籤顯示（同一本卦可能出現多列）
    const label = r.tbl ? T('search.f.table') + ' ' + r.key : _srFieldLabel(field);
    return `<div class="sr-row${i === _srSel ? ' sel' : ''}" onclick="srPick(${i})">`
         + `<span class="sr-sym">${_esc(r.d ? (r.d.symbol || '') : '?')}</span>`
         + `<span class="sr-main"><span class="sr-head">`
         + `<span class="sr-num">${r.d ? String(r.d.num).padStart(2, '0') : '??'}</span>`
         + `<span class="sr-name">${_esc(r.d ? (r.d.name || '') : '?')}</span>`
         + `<span class="sr-field">${_esc(label)}</span>`
         + `</span>${snip}</span></div>`;
  }).join('');
}

// 重繪建議列表；保留輸入框本身，不動游標
function _srRenderResults(){
  const inp = document.getElementById('srInput');
  const body = document.querySelector('#saveDropdownUp .dd-body');
  if(!inp || !body) return;
  const q = inp.value.trim();
  _srResults = _srSearch(q);
  if(_srSel >= _srResults.length) _srSel = -1;
  body.innerHTML = _srRowsHTML(q);
}

function _srMove(delta){
  if(!_srResults.length) return;
  _srSel = mod(_srSel + delta, _srResults.length);
  const body = document.querySelector('#saveDropdownUp .dd-body');
  body.querySelectorAll('.sr-row').forEach((el, i) => el.classList.toggle('sel', i === _srSel));
  const sel = body.querySelector('.sr-row.sel');
  if(sel) sel.scrollIntoView({ block: 'nearest' });
}

// 載入所選卦：走 _applyDigits（會自行切換二進制/四進制）
function srPick(i){
  const r = _srResults[i];
  if(!r) return;
  closeSaveDropdown();
  if(stateLocked){ setMsg(T('msg.load_locked'), 'error'); return; }
  // 查表命中對應的是一個完整的四進制狀態，直接載入該狀態（含變爻），
  // 使用者才看得到搜到的那段文字；只載本卦是看不到的。
  // 查表文字顯示在卦象頁，所以載入後切過去。狀態鍵一定是 6/7/8/9，_applyDigits
  // 必然切到 quaternary，卦象頁必然可用，因此這裡放在最後（不必像下面那樣搶在前面）。
  if(r.tbl){ _applyDigits([...r.key].map(Number)); setTab('guaxiang'); flashBtn('btnSearch'); return; }
  const field = _SR_FIELDS[r.rank];
  // 命中在某頁籤的內文 → 先切到該頁籤，讓使用者直接看到搜到的那段文字。
  // 必須在 _applyDigits 之前：其後的 doQuery → applyTabAvailability 會依新卦的
  // 頁籤可用性自動修正（該頁若對新卦不可用，會回退到可用的頁籤）。
  if(field.startsWith('text.')) setTab(field.slice(5));
  _applyDigits([...r.d.sequence].map(Number));
  flashBtn('btnSearch');
}

function renderUpperDropdown(){
  const up = document.getElementById('saveDropdownUp');
  const prev = document.getElementById('srInput');
  const q = prev ? prev.value : '';   // 換語言時保留已輸入的關鍵字
  up.innerHTML = `<div class="dd-title">${_esc(T('dd.search_title'))}</div>`
    + `<div class="dd-search-bar"><input class="dd-up-input" id="srInput" type="text" autocomplete="off" placeholder="${_esc(T('search.placeholder'))}"></div>`
    + `<div class="dd-body"></div>`;
  const inp = document.getElementById('srInput');
  inp.value = q;
  inp.addEventListener('input', () => { _srSel = -1; _srRenderResults(); });
  inp.addEventListener('keydown', e => {
    if(e.key === 'ArrowDown'){ e.preventDefault(); _srMove(1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); _srMove(-1); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(_srResults.length) srPick(_srSel < 0 ? 0 : _srSel); }
    else if(e.key === 'Escape'){ closeSaveDropdown(); }
  });
  _srRenderResults();
}

  if(_shiboNameReady || (shiboBuffer.length > 0 && shiboBuffer.length < 6)){
    setMsg(T('msg.load_shibo'), 'error');

  renderSaveDropdown(records);

  dd.classList.add('open');

// 兩個 dropdown 的定位／限高 — 開啟時與 resize 時都會呼叫
function _positionSaveDropdowns(){
  const dd = document.getElementById('saveDropdown');
  if(!dd.classList.contains('open')) return;
  const up = document.getElementById('saveDropdownUp');
  const btnRect   = document.getElementById('btnSearch').getBoundingClientRect();
  const panelRect = document.querySelector('.left-panel').getBoundingClientRect();
  const ddMax = parseFloat(_gv('--dd-maxh')) || 272;   // 隨 applyPanelScale 縮放

  dd.style.top = (btnRect.bottom - panelRect.top + 6) + 'px';

  up.style.bottom = (panelRect.bottom - btnRect.top + 6) + 'px';
  up.style.maxHeight = Math.min(ddMax, btnRect.top - 10) + 'px';
}

  _srSel = -1;

  const needYarrow = digits.some(b => b > 1);
  if(needYarrow !== (bitRowMode === 'quaternary')) yaoBian();
  for(let i=0;i<6;i++) state[i] = digits[i];
  if(needYarrow) deriveState01();
  renderAll();
  doQuery();
}

// 八卦显示 及上下标识更新函数，基于当前 state 或 state_0（取决于 bitRowMode）
function updateTrigrams(){
  const src = bitRowMode==='quaternary' ? state_0 : state;
  const lower=src.slice(0,3).join(""), upper=src.slice(3,6).join("");
  [['upper',upper],['lower',lower]].forEach(([pfx,bits])=>{
    // 缺資料防護：短字串 → '?'，顏色 → var(--c-accent)
    const t = (TRIGRAM_INFO||{})[bits] || {};
    const color = t.color || 'var(--c-accent)';
    const charEl = document.getElementById(pfx+'Char');
    charEl.textContent = t.name ?? '?'; charEl.style.color = color;
    charEl.parentElement.style.setProperty('--tri-color', color);
    const fields = (TAB_FIELDS||{})[currentTab] || [];
    ['Num','Thing'].forEach((id,i)=>{
      const el = document.getElementById(pfx+id);
      el.textContent = t[fields[i]] ?? '?'; el.style.color = color;
    });
  });
}

// binary → quaternary：將 {0,1} 映射為靜爻 {8,7}（陰靜=8 陽靜=7），再派生 state_0/state_1
// quaternary → binary：以 state_0（本卦）還原為 {0,1}
function setBitRowMode(m){
  bitRowMode = m;
  if(m === 'quaternary'){
    for(let i=0;i<6;i++) state[i] = state[i] ? 7 : 8;
    deriveState01();
  } else {
    for(let i=0;i<6;i++) state[i] = state_0[i];
    guaxiangSlots = null;
  }
}

  el.innerHTML = text ? '<span>'+text+'</span>' : '';

(function(){
  const el = document.getElementById('msgBox');
  let fadeTimer = null, clearTimer = null;
  function cancelTimers(){ clearTimeout(fadeTimer); clearTimeout(clearTimer); fadeTimer = clearTimer = null; }
  function fitError(){
    el.style.fontSize = '';
    if(!el.textContent.trim()) return;
    let size = 0.85;
    while(el.scrollHeight > el.clientHeight && size > 0.45){
      size = Math.round((size - 0.05) * 100) / 100;
      el.style.fontSize = size + 'rem';
    }
  }
  new MutationObserver(function(){
    cancelTimers();
    el.style.transition = 'none';
    el.classList.remove('msg-fading');
    el.offsetHeight; // force reflow — snaps opacity to 1 instantly
    el.style.transition = '';
    fitError();
    if(!el.textContent.trim()) return;
    fadeTimer = setTimeout(function(){
      el.classList.add('msg-fading');
      clearTimer = setTimeout(function(){
        el.className = 'msg'; // 重置至初始（移除 msg--success/error 及 msg-fading）
        el.textContent = '';
      }, 10000);
    }, 3000);
  }).observe(el, {childList:true, characterData:true, subtree:true});
})();

// quaternary 值語意：6=老陰（陰變陽）8=陰靜  →  本卦(state_0)為陰
//               7=陽靜            9=老陽（陽變陰）→ 本卦為陽
// 之卦(state_1)：老陰/老陽翻轉，靜爻不變
function deriveState01(){
  for(let i=0;i<6;i++){
    state_0[i] = (state[i] === 6 || state[i] === 8) ? 0 : 1;
    state_1[i] = (state[i] === 8 || state[i] === 9) ? 0 : 1;
  }
}
