知伴君如伴虎，愬愬，畏懼之貌，意如能畏懼，則終必吉。上位之陽剛，雖近處，能敬慎畏懼，即入危地終亦必吉也。\n\n畏懼之貌，入危而終吉，因本心在於能行己之志願，故須居此位，故為行其志，而示畏懼之態，終得吉，其志遂行。\n\n夬履貞厲。\n/4&\n\n&5&\n##### 九五：夬\n\n夬履，貞厲，位正當也。\n##### 象曰：夬\n\n夬乃剛決之意，九五雖示君位之人，居此位，任意剛決而行之，即得正，仍危厲也。古之聖人，居天下之尊，仍納眾言，明足以照，剛足以決，必以明而動，動則志剛，此之所以為聖也，若自以為剛明，決行不顧，即使行正，亦屬危道也。\n\n居正當之尊位，須戒剛決自任，否則招凶。\n/5&\n\n&6&\n##### 上九：視履考祥，其旋元吉。\n\n##### 象曰：元吉在上，大有慶也。\n\n人之禮，須視其終，若始終完備，善之至也。今人淺視人之表面禮遇，而不考證其始終，禮之至善，其『始終如一』方是。\n\n人之所以履善終能吉，貴乎有終，始終如一，禮之至極也。\n/6&"},"111000":{"text.tab1":"此卦堯帝將襌位，卜得之，乃得舜而遜位。\n\n#### 圖\n月中桂開，官人登梯，鹿銜書，小兒在雲中，羊回頭，地下亂點。\n\n**天地交泰之課**\n\n**小往大來之象**\n\n#### 雜\n\n**雜卦曰：否泰反其類也**\n\n#### 序\n\n**序卦曰：履而泰，然後安，故受之以泰。泰者，通也。**\n\n履之後（有禮而始終如一）則有泰，即履得其所，則舒泰而安也。故泰所以次履也，坤柔在上，乾陽居下，乃天地陰陽之氣相交合，萬物生成，故表通泰狀。卦象外柔內健，此為致泰之道。\n\n#### 解\n• 一、月中桂開：清明政治之時。\n• 二、官人登梯：升遷順遂之意，官人亦倌人，即丈夫也。\n• 三、鹿銜書：受天子恩賜祿位。\n• 四、小兒在雲中：少年得志象。得天官貴人助也。\n• 五、羊回頭：回陽間也。亦楊姓人，發肖羊人成格。","text.tab2":"此名為泰卦，有否極泰來，安泰舒適之象。每逢有已婚女向本人求教之時，我都以此卦教之，令改，促進夫妻和睦乃吾道中人之一大職責，此功德無量。\n此局大吉，無論於婚姻、事業、健康及教育子女上，都有卓越之表現，為一賢妻良母。\n• 一、於婚姻，主一世夫妻，白首到老。\n• 二、於事業，在家相夫教子亦為事業。在公事上，進退有據，受人重用，必不待言，其心想事成。\n• 三、於健康主平安到老，一生無大病痛，凡未經指點，能得此局之人，必屬大富大貴之人，福厚之人，一生無災，常見命格好之人，自然居之，真所謂「福地福人居」實不為過。實務上，吾人可見命薄之人，不但無法居此，即使你告訴她有如此好，而她亦會因外在環境上之束縛，而無法改變自己，不知人與天爭，即在此，禍福在一念之間耳。唯自求多福，但希望你真能自求而生多福，但須知世事常不盡人意，如能刻意成局之人乃屬有福之人，其剛柔動靜之間，必能掌握機先，事事快人一步，終必大成。","text.tab3":"&0&\n**泰，小往大來，吉亨。**\n陽氣下降，陰氣上升，陰陽和暢，萬物生焉，此天地之泰。人間之泰，大則居上，小則臣下，君王推誠任下，臣盡誠以事君，上下同志，朝廷之泰。君子，小人亦如是，君子處君位，小人居下位，天下之泰也。\n/0&\n\n#### 彖\n\n**彖曰：泰，小往大來，吉亨。則是天地交而萬物通也，上下交而其志同也。**\n陰往而陽來，天地氣相交，萬物通泰。人則上下之志相同，互相交通，人之泰也。「內陽而外陰，內健而外順，內君子而外小人，君子道長，小人道消也。」陽進陰退之時，故內健外順，君子之道也，君子在內，小人在外，此所以為泰。\n\n#### 象\n\n**象曰：天地交，泰。后以財成天地之道，輔相天地之宜，以左右民。**\n此示人君須體會交泰之道而為法制，使民用天時之宜，輔助教育人民之功，使民有財，輔助於民，民則必賴君上之法制，因法治之宜也，得其生養。\n\n&1&\n##### 初九：拔茅茹，以其彙，征吉。\n\n##### 象曰：拔茅征吉，志在外也。\n同類相聚，如拔茅之根相牽連，同欲上進。\n\n剛明之才，居於下位，遇泰之時，志而上進，遇同志而行同道，因同類而進，吉。凡君子小人都須賴同類以助，未有人能獨立而不須朋類之助。\n/1&\n\n&2&\n##### 九二：包荒，用馮河，不遐遺，朋亡，得尚于中行。\n\n##### 象曰：包荒，得尚於中行，以光大也。\n\n九二為將位，以剛明之才，五為柔順而得君位，上下之專信建立，此位乃治泰者，故治泰之道，主將位而能包荒，如人情放肆所為，則政令緩，法度廢弛，治此之道，必有包含荒穢之量，詳密施政，去其弊端，則人安之。處泰之道，人之常情習於久安，惰於因循，不敢變更，用馮河，乃奮發改革之意，雖至小至微之事亦不可遺漏，自古立法治事，牽於人情，卒不能行者多矣。如禁奢侈則害近戚，限田宅，則防礙貴族之家，此治泰之難。遇治泰，須稟持公正之態度，即中行意。\n\n有包含荒穢之量，又配合中行之德，其道則明顯光大。\n/2&\n\n&3&\n##### 九三：无平不陂，无往不復，艱貞无咎，勿恤其孚，于食有福。\n\n##### 象曰：无不復，天地際也。\n\n三居諸陽之上，乃泰之盛時。聖人為之戒，在下者必升，居上者必降，泰久而必否，故戒之。故當此時，不敢安逸，居安思危，則無災。\n故處泰之道須能堅貞，可常保泰。自古以來隆盛皆因內失道而喪敗下來。\n\n陽降於下，必復上，陰升於上，必復下，此示人明天地交泰之道不常存之理也，聖人戒之。\n/3&\n\n&4&\n##### 六四：翩翩不富，以其鄰，不戒以孚。\n\n##### 象曰：翩翩不富，皆失實也；不戒以孚，中心願也。\n\n翩翩，疾飛之貌，人富而從其類，為利也。\n不富而從其者；志同也。上三爻皆為陰，陰在上而失其中實之道，皆欲下從，故為不富而從，此誠意相合也。如至六四位方戒已晚，居三為適中，知戒可保，四位則已過，必生變化。\n\n因三陰在上，失其實才，欲行往下，不待其人富而鄰從，皆因失實故也。此已失乃方知戒之意，此時不待告誡而誠意相待，乃出於中心所願也。\n/4&\n\n&5&\n##### 六五：帝乙歸妹，以祉元吉。\n\n##### 象曰：以祉元吉，中以行願也。\n\n為居君位，古之帝女皆向下嫁，帝乙制禮法，须降其尊貴，以順從其夫也。今六五以陰柔居君位，對應之九二為陽剛，乃能信之，而任用其賢且順從之，猶帝女之下嫁亦然，此成治泰之功也。\n\n其能任用剛中之賢，乃因已有中道與之合，志同相交也。\n/5&\n\n&6&\n##### 上六：城復于隍，勿用師，自邑告命，貞吝。\n\n##### 象曰：城復於隍，其命亂也。\n\n此致泰之終也，小人處之，行必否矣。掘隍土累積成城，如治道累積以成泰，今城土頹圮，又復返於隍也。勿用師，夫用師之道，必得民心，今民心不從，用師必亂，此時即自有天命任之，亦逄羞而凶矣。\n\n此意城傾圮，又回歸隍土 ，即令命為正，但亂已不可止矣。\n/6&"},"000111":{"text.tab1":"此卦蘇秦將遊説六國，卜得之，果為相矣。\n\n#### 圖\n男人臥病，鏡破，人路上坐，張弓箭頭落地，人拍掌笑，口舌。\n\n#### 雜\n\n**雜卦曰：否泰反其類也**\n\n#### 序\n\n**序卦曰：物不可以終通，故受之以否。**\n\n天地不交之課 人口不實之象上泰之終，六爻以陰柔（小人）處之，則為否之初。天地相交，陰陽相通，則為泰，今天在上，地在下，是天地隔絶，不相往來，故成否卦。\n\n#### 解\n• 一、男子臥病：男子為陽，陽同佯，裝病之象也。\n• 二、镜破：不可赴也。破鏡難圓之象。\n• 三、人路上坐：小人阻路，不讓進也。\n• 四、張弓箭頭落地：鳥盡弓藏也。\n• 五、人拍掌笑：幸災樂禍之小人，做假攻訐兩人感情得逞狀，夫妻凶。\n• 六、舌：主口舌，官司，謡言生害。\n• 七、口上有四點：四點為黑，暗中誣陷之謡言，古人謂三口成虎，即意此。","text.tab2":"惟男人有之，此男女本性之不同，亦可於此卦局窺見之，男人之性過剛於女，自尊好強之心，又顯現無遺，往往天性上，有欲大力小之性而不自知，不知己之才能如何，妄度不知量進，乃終成否卦。\n常見個性如此之人居否局，而不自知，仍自以為是，故終其一生必無成就，每日只知怨天尤人，嘆時不利己，己不逢時而已。\n• 一、於婚事主大凶，夫妻反目成仇，加上命格中如婚破，又在運宅上居此局，則勢必無法挽回。\n• 二、官家之人，必主否塞不通，終致無成，不但不升官，反招凶禍，乃致退休。\n• 三、商家人，居此局，必生大耗，財耗家散，終致一敗塗地。\n• 四、健康上亦凶，主大病纏身，如加上命中流年逢羊刃，血光必現，在數中難逃此大限之局。","text.tab3":"&0&\n**否之匪人。不利君子貞，大往小來。**\n舉凡天地之間皆為人道，今天地不交，不生萬物，是無人道，故曰匪人。處此之時，君子不可堅心，因正道不行，小人道長之時。\n/0&\n\n#### 彖\n\n**彖曰：否之匪人，不利君子貞，大往小來，則是天地不交，而萬物不通也。上下不交，而天下无邦也。内陰而外陽，内柔而外剛，内小人而外君子，小人道長，君子道消也。**\n天地不交，萬物不生。上下不和，則天下無治國之道。治世乃上位施政來治民，人民擁戴君王而願從命，上下相交，此治國之道。今君子居於外野，小人處於朝內，故為小人道長，君子道消之時也。\n\n#### 象\n\n**象曰：天地不交，否。君子以儉德辟難，不可榮以祿。**\n君子觀否塞之象為外健內顺(柔)。處否之時，損儉自己，避開禍亂。千萬不可榮居祿位，戀棧不去。因小人得志之時，君子仍居顯位，則禍必及己身。反之，仍居顯位不放，乃真小人也。即內小人，外君子之意。\n\n&1&\n##### 初六：拔茅如，以其彙，貞吉，亨。\n##### 象曰：拔茅貞吉，志在君也。\n否之在最下者，為君子也。因否而不能進者，君子也。處否而能進者，小人也。因在下位，又貞固其節志，同類而聚，雖不進升，但亦吉矣。\n\n君子處否時而居下位，冀得同類而進，如遇小人，則堅守其節，但心仍在天下。\n/1&\n\n&2&\n##### 六二：包承，小人吉，大人否，亨。\n##### 象曰：大人否亨，不亂群也。\n六二本陰爻位，今陰柔居之，以小人而言，其心所包容的，皆承顺上位之意，以求本身之利，此小人之吉。大人處否，則以道之陽剛自勉，絶不枉屈正道，奉承上位，雖身處否，但道仍亨也。\n\n處否而守其正節，乃為大人，不與小人同亂為群體，形雖否，但其道吉，此道必大。\n/2&\n\n&3&\n##### 六三：包羞。\n\n##### 象曰：包羞，位不當也。\n\n不中不正之人居否之時，位居相位，不能守道安命，極盡小人之能事，每日謀慮邪事，無所不包，此羞恥之大也。\n\n居否時，所為邪吝，羞於公正，居此相位而不適，此不可以為正道。\n/3&\n\n&4&\n##### 九四：有命，无咎，疇離祉。\n\n##### 象曰：有命，无咎，志行也。\n\n居君側之人，最忌有居功招忌之事，因否時君道不正，即令有濟世之大才，亦不堪用。\n如能使事事出於君令，威柄皆歸於上，則無災而可實現大志。當君子道行，同類必同進同出為天下黎民福祉著想。小人亦同進退也。\n/4&\n\n&5&\n##### 九五：休否，大人吉，其亡，其亡，繋于苞桑。\n處否之時，惟有陽剛中正之人居君位，能去天下之否，即大人吉。如循環至泰，亦須戒盛警惕否之復来，此其亡，其亡之意。此戒须如同苞桑，桑為根深蒂固之物，苞乃叢生之物，其固更強，此為安固之道。此為聖人之深戒也。\n繫辭：『危者安其位者也，亡者保其存者也，亂者有其治者也。是故君子安而不忘危，存而不忘亡，治而不忘亂，是以身安而國家可保也。』\n\n凡事皆由君命而出，則無災，且大志得行。\n\n##### 象曰：大人之吉，位正當也。\n因有陽剛中正之德才，又居君子之位，能去天下之否，故吉也。\n/5&\n\n&6&\n##### 上九：傾否，先否後喜。\n\n##### 象曰：否終則傾，何可長也。\n\n物極必反，泰極則否，否極則泰，故否之極，即否道將覆，則泰矣，故曰後喜。\n\n否之終必傾危，絶無永否之理，但反危為安，易亂而治，必有陽剛之才，乃能做也，故否卦之上九能傾否，如屯之上六則不能去屯同意也。\n/6&"},"101111":{"text.tab1":"此卦劉文龍在外求官，卜得之，果衣錦還鄉。\n\n#### 圖\n人捧文書上有心字，人張弓，射山上，一鹿飲水，一溪。\n\n**游魚從水之課**\n\n**二人分金之象**\n\n#### 雜\n\n**雜卦曰：大有眾也，同人親也。**\n\n#### 序\n\n**序卦曰：物不可以終否，故受之以同人。**\n\n天地不交則否，上下相同則同。遇否之世，必與人同力方能渡過。故次否也。以象言，天之性在上，火之性炎上與天同，故為同人。以卦體言，五為君位乾主，二為離位，陰柔居二爻。\n上下相同之義，天性剛健，火性明耀，即外健內明之象，吾人外剛健，內明道，則成天火同人，此為大同之道。\n\n#### 解\n• 一、人捧文書上有心字：得民心之象，同心協力之象。寧姓。\n• 二、人張弓射山上：高中金榜。張姓人氏。\n• 三、一鹿飲水：财祿滾滾而來。亦在野之賢人。\n• 四、一溪：平和安靜狀。\n• 五、鹿之性，動則敏，靜則順，此剛健人之性，世間但聞虎食人，未聞鹿食人。","text.tab2":"此局在陽宅上亦妙不可言，學者切勿分辨錯誤，須仔細分詳，以免誤人而不自知。\n• 一、官家人逢之，必主人和，手下得力，祿命九重來，平步青雲。\n• 二、商人逢之，財祿豐盛，但須二人合夥，方可成事，一人獨資勢必不成大器。\n• 三、自由業、服務業居此局，必主名氣大，聲名遠播，財祿亨通。\n• 四、對妻不利，因此局出現，妻必成明夷卦，主妻有暗傷，血光難逃，故不如乾為天，地天泰吉，即在此，不利妻之處。\n吾人常見夫妻一對，夫之事業如日中天，而妻子卻病災不斷必為此局之陽宅也。","text.tab3":"&0&\n**同人：于野，亨。利涉大川，利君子貞。**\n野即遠與外之意，以天下大同之道，聖賢大公之心，使之無遠不同。常人之同，以私意所合，此暱親之情。故必于野，方可謂大同。天下皆同時，何險阻能阻礙？何艱困能致危？故利涉大川，君子須堅心於此。小人唯用私意，所親比者亦為小人，朋黨之始，其心不正也。\n/0&\n\n#### 彖\n\n**彖曰：同人，柔得位，得中而應乎乾，曰同人。**\n二爻以陰居陰位，此為正位，得中正之德，應乎乾上，五為君位，以剛健中正，二以柔順對應，上下同心同德，故曰：同人。\n\n同人于野，亨，利涉大川，乾行也。\n乾之行，必至誠無私，故可以涉險難，而吉。無私，天德也。\n\n文明以健，中正而應，君子正也。唯君子爲能通天下之志。\n下體為有文明之德，上卦為剛健之性，此君子之正道。天下之志萬殊且異，但理則一也。\n君子因明理，故能通天下之志。聖人視億萬人之心為一心，因只一理而已。文明能使人更明理，故能明大同之真義，剛健必能克已，則必能致大同之道。\n\n#### 象\n\n**象曰：天與火，同人，君子以類族辨物。**\n天在上，火之性炎上，此為同人，君子觀同人之象，以分類群族各以其性同來區分，如君子小人，善惡是非，物之外形固異，但事理皆同，君子能辨明。\n\n&1&\n##### 初九：同人于門，无咎。\n\n##### 象曰：出門同人，又誰咎也。\n\n初進為剛健，此因無所偏私，出門在外因無私，而無咎也。\n\n出門在外，因同人之道而無私，同此道之人又廣，無厚此薄彼之異，則無人歸咎也。\n/1&\n\n&2&\n##### 六二：同人于宗，吝！\n\n##### 象曰：同人于宗，吝道也。\n\n宗為宗黨也，同於所派系，此有所偏，故可吝。故只用宗黨之人則有偏私，此為鄙吝之人。\n\n同人之道用於宗親，乃有所私，因私比，非人君之道，故此為吝道。今人皆如是，莫若太宗之用人。\n/2&\n\n&3&\n##### 九三：伏戎于莽，升其高陵，三歲不興。\n\n##### 象曰：伏戎于莽，敵剛也；三歲不興，安行也。\n\n二以中正之道與君五位相同志，三以剛暴之人居二五之間，欲奪，然理不直，義不勝，不敢發動，故只能藏兵戎於莽林間，時升高陵顧望，至三年之久，仍無機可乘，此小人之情狀。\n\n因三爻乃剛暴之人，其五君位為剛且正，故畏忌而不敢與，即三年亦不與。\n/3&\n\n&4&\n##### 九四：乘其墉，弗克攻，吉。\n\n##### 象曰：乘其墉，義弗克也；其吉，則困而反則也。\n\n九四乃陰位，陽剛居之，故以剛居柔位，其近君位，知義不直而能復返正道，亦吉也。\n三以剛居剛，故終其強而不可能反。此示人畏義能改則終吉。\n\n因同人乃一陰，而眾陽所同欲也。今獨三四爻有爭奪之意，乃邪不勝義，其困窮乃因反於法則，故吉。\n/4&\n\n&5&\n##### 九五：同人，先號咷而後笑，大師克相遇。\n\n##### 象曰：同人之先，以中直也；大師相遇，言相克也。\n\n人君當與天下大同，如獨私一人，則非君道也。其同志為二爻，間隔有三四之剛，故未遇之前憤怒而號咷，即遇則大笑，故二人同心，其利斷金，中誠所同，無所不同，天下莫能離間，則無所不入，故聖人赞之曰：『同心之言，其臭如蘭』。\n\n同人之先以中誠理直，故同心之力大，雖敵剛強，如大師相遇，由其義直理勝，終能克之也。\n/5&\n\n&6&\n##### 上九：同人于郊，无悔。\n\n##### 象曰：同人于郊，志未得也。\n\n求大同之道，必相親相與，即在外又遠之地不同，但亦永無悔矣。\n\n此申明同人之道，在外及遠之地求同之志不成，即無悔，但非最善之道。\n/6&"},"111101":{"text.tab1":"此卦藺相如送趙壁往秦，卜得之，果還壁歸趙也。\n\n#### 圖\n婦人腹中一道氣，氣中二小兒，一藥王，藥有光，女人受藥，一犬。\n\n**金玉滿堂之課**\n\n**日麗中天之象**\n\n#### 雜\n\n**雜卦曰：大有眾也，同人親也。**\n\n#### 序\n\n**序卦曰：與人同者，物必歸焉，故受之以大有。**\n\n同人之序卦，與人同者，物必歸，此天紀也。故大有為同人之序，物歸之後，乃大有也此卦，火在天上，火之處高，其明及遠，能照萬物，此為大有之象，一柔居尊位，眾陽應和，此居尊執柔，物乃所歸，上下相應，為天子之道。\n\n#### 解\n• 一、婦人腹中一道氣：妊娠之事；事萌於內也。\n• 二、氣中二子：主雙喜臨鬥。伯仲之間象。\n• 三、一藥王：平安之象。得病有救，遇良醫也。\n• 四、藥有光：藥有名也，災中有救也。\n• 五、女人受藥：女人為陰，示表面不信，但暗中仍聽之。\n• 六、一犬：乃狗年，戌月，戌日，此論時機也；或狄姓人士。\n• 七、犬：哭笑皆有象。","text.tab2":"吾人常見有未婚之女，嬌美如花，事業上功成名就，但婚姻不好，即此局之人。\n• 一、性陽剛過人，倔強固執本性展現無遺。\n• 二、不重視婚姻，也不在乎婚姻，唯對子女獨有所鐘，有未婚生子之象，且不在乎人言，且主得二子。\n• 三、如遇命中婚姻順暢，則比同時生人要早三年成婚。\n• 四、命中事業旺，祖業大之人，再加上此局，勢必為女承父業之象，兄弟無力。\n肖犬之小姐居此局反之，必主大吉大利，智慧高，婚事吉，事業順利，婚後有二子雙生之象。","text.tab3":"&0&\n**大有：元亨。**\n此乃以卦才而言，不言元亨利貞四德，乃恐與乾坤二卦相混淆，只言元亨乃盡元之義，元乃物之始，萬物生成之初皆為大善，因必有功用。此為大善之初，易經唯四卦，大有、蠱、升、鼎有元亨。其不與乾坤同，在乾為首出萬物，元始之象，在此四卦唯至善為大而已。\n/0&\n\n#### 彖\n\n**彖曰：大有，柔得尊位，大中而上下應之，曰大有。其德剛健而文明，應乎天而時行，是以元亨。**\n此卦之所以為大有，乃因五以陰柔居尊位，又處以中庸大中之道，為諸陽所依歸，上下相應，此居尊執柔，有虛中之象，卦德內剛健而外明理，處事順乎天應乎人，此所以元亨。事於成後，方可見成敗，敗非先現於事前也。故有得後乃有所失，非得則何言有失乎？\n\n#### 象\n\n**象曰：火在天上，大有，君子以遏惡揚善，順天休命。**\n火因在天上，故能照見萬物，君子觀大有之象，故知治眾之道，唯遏惡揚善，此能順天命而安眾民心，天子之道即如是。\n\n&1&\n##### 初九：无交害，匪咎，艱則无咎。\n\n##### 象曰：大有初九，无交害也。\n\n以陽剛之性處卑下之位，因未至於盛，故不有驕盈之慮，因無交往，故無害。人之富有於財或才，鮮不有害，富有本無罪，但人卻皆因富有而招害，乃因處富有而不知思艱戒盛，則生驕侈之心，此所以生害也。\n\n此即在大有之初始，即生戒心，須時思念艱難之時，此居安思危之來源，故能如此，則交亦無害也。故與人交往，持富有而驕，必生害也。\n/1&\n\n&2&\n##### 九二：大車以載，有攸往，无咎。\n\n##### 象曰：大車以載，積中不敗也。\n\n此位以剛健之才，居於陰柔之位，而為六五君位所信任，故無災。就如大車之材，強壯能载重物，可以任重行遠，往而無災。\n\n大車能載重物，重物集中而不損敗，言九二才力之強，能勝大有之重任。\n/2&\n\n&3&\n##### 九三：公用亨于天子，小人弗克。\n\n##### 象曰：公用亨于天子，小人害也。\n\n九三居下卦之上位，為諸侯之位，諸侯雖享有土地之富，人民之眾，但仍屬天子所有，此人臣之義。但小人居此位則專其富有以為私，不知奉上以公之道。\n\n諸侯能守臣節，忠順奉上，慎養其眾，為王之徵用。若小人處此位，則不知奉上之道，以所有為私有，故小人居此位，則有大害也。\n/3&\n\n&4&\n##### 九四：匪其彭，无咎。\n\n##### 象曰：匪其彭，无咎，明辯皙也。\n\n九四陽剛居大有之時，因近君位，如處之太盛，則致凶，彭為盛大之義，須謙損，方為吉道。\n\n明智之人，處此大有盛大之時，戒在咎之將至，以謙損態度應之，不敢至於極滿招凶之道也。故無災。\n/4&\n\n&5&\n##### 六五：厥孚交如，威如，吉。\n\n##### 象曰：厥孚交如，信以發志也；威如之吉，易而无備也。\n\n人君之位，以陰柔守之，以誠信待於下，下亦誠信待上，上下相交，此人心易安，但若專以柔順，則必生悔慢之心，故以威信，故君子柔中有威，使下屬有畏，其吉可知也。\n\n上下相交以誠信，互相呼應，上位如無威嚴，則下屬易生毁謾，故君須戒無威。\n/5&\n\n&6&\n##### 上九：自天祐之，吉，无不利。\n\n##### 象曰：大有上吉，自天祐也。\n\n此位乃大有卦之終極，仍明之極意。人唯至明，故不居於已有，有極大之位，而不為已有，則無盈滿之災，君能至此，則合於天道，得天之祐，則無往不吉。大同之世來矣。\n\n大有至極處，本有變化，但由所為皆順天合道，此君子滿而不溢，故天祐之。尊尚賢人，崇尚信義，故為上吉。\n/6&"},"001000":{"text.tab1":"此卦唐玄宗因祿山之亂，卜得之，乃知干戈必息也。\n\n#### 圖\n月當天，一人騎鹿，三人腳下亂絲，貴人捧鏡，文字上有公字。\n\n**地中有山之課**\n\n**仰高就下之象**\n\n#### 雜\n\n**雜卦曰：謙輕而豫怠也。**\n\n#### 序\n\n**序卦曰：有大者，不可以盈，故受之以謙。**\n\n大有至終必不可盈滿，故聖人受之序卦為謙。天之道盈滿，則必損地道，此卦為亦謙之義，以自然界喻之，外卦為地，內卦為山，即山居地下，山乃至高大之物，而今居地下，此處卑乃謙之象，亦示人有崇高之至德，而處卑下，乃盡謙之義。\n\n#### 解\n• 一、月當天：清明之政，中秋時也。\n• 二、一人骑鹿：才祿俱備。\n• 三、三人腳下亂絲，隱於山後：小人不敢正面示人，惟隱山謙之後(即外飾謙為幌子)實則亂如麻，計無所出。\n• 四、貴人捧鏡：明鏡高懸，執法公正光大。\n• 五、文字上有公字：處事以公，得理也。\n<u>全卦：不知謙下自晦，果必招訟也。</u>","text.tab2":"謙卦九三爻位，勞謙，君子有終，有勞謙之美。史上如周公，為其代表。常見婦人，任勞任怨，居無所苦，謙以讓人，婦之賢德，表現無遺，且始終不變，即此卦局能成。\n• 一、必為賢妻良母之人無疑，但夫卦為遯，主夫妻不利，感情退化，所以常見有賢德之婦人，往往盡心盡力為家操心，結果卻無法挽回婚姻之善，但六十五歲以後不成此局。\n• 二、身體小病痛不斷，因勞成疾多有。\n• 三、官家人逢之，主遇事公平處之，一絲不茍之人。\n• 四、商家人得此局，必生財祿，但往往有股東不合，因分利不均而破壞。\n• 五、同時生人，則有官帶現，如命為公職人，但居謙卦局，有民選官之傾向，商家人亦有此傾向，會居國會殿堂之中。","text.tab3":"&0&\n**謙：亨，君子有終。**\n有德而不居，為謙，人能以謙遜自處，無往不利。君子之志在達理，樂天命而無競之心，但求內充，退讓而不衿持。能安於謙，終身不易。小人則有慾必競，此種人見有德之人必攻之，即令有人告之謙遜，但終不能宽行固守。故小人，必不能有終也。\n/0&\n\n#### 彖\n\n**彖曰：謙，亨，天道下濟而光明，地道卑而上行。**\n君子明謙之道而能亨。天之道因其氣能下濟，故能生育萬物，故道乃光明，故君子知謙而能使其道濟天下萬民，地之道亦同天，因自處卑地，故能上交於天，是故天地二者，皆因能卑降而終亨通也。\n\n天道虧盈而益謙。\n天之道有日月五星，其隨時盈晦，故能降氣於地，生養萬物。\n\n地道變盈而流謙。\n地勢如盈滿，則必倾變而下陷。\n\n鬼神害盈而福謙。\n天地之道乃形而上之學，吾人可推理求之。鬼神人道乃形而下之學，吾人可親而見之，世間萬物必有其用，凡盈滿者，必有禍害，能謙損者，必有福祐之，猶今之西醫，其但知能如何除瘤用毒，不知損害之大，故後遗症之多，而自不見之。\n\n人道惡盈而好謙。\n人情必惡人之盈滿，好人之謙損，故聖人戒盈而勸人為謙也。\n\n謙尊而光，卑而不可喻，君子之終也。\n君子之道因謙卑而光大，至誠之念如是而終。\n\n#### 象\n\n**象曰：地中有山，謙。君子以裒多益寡，稱物平施。**\n高大之山在地下，故示人外卑下，內實高大乃謙象。君子有過則損之，不足則益之，以之用於事，使萬物皆平衡也。\n\n&1&\n##### 初六：謙謙君子，用涉大川，吉。\n\n##### 象曰：謙謙君子，卑以自牧也。\n\n最卑下之位以柔態處之，又謙讓也。能如是，君子也。即涉險難，必無凶也。\n\n君子以謙卑之道，於初入世間而自處之。\n/1&\n\n&2&\n##### 六三：嗚謙，貞吉。\n\n##### 象曰：鳴謙貞吉，中心得也。\n\n二位以柔順居中，謙之德至此，則須明倡於外，見諸聲色，堅心如此，吉也。\n\n因中心能自得，山至大又能知謙，故吾人須有高厚實力，乃真謙非勉力為之也。\n/2&\n\n&3&\n##### 九三：勞謙，君子有終，吉。\n\n##### 象曰：勞謙君子，萬民服也。\n\n三為相位，以陽剛居之，上為君所任，下為民所從，能知勞而不居功，謙下待人，君子能行之至終，故吉。今上位掌權之人，盡皆示民其功勳為何，不知勞謙之美，此為小人之道長之時也。反之，能盡勞謙之道，必為君子。\n\n##### 此勞謙君子，能服萬民也。\n/3&\n\n&4&\n##### 六四：无不利，撝謙。\n\n##### 象曰：无不利，撝謙，不達則也。\n\n四體居近君主之位，此時因六五之君，以謙柔自處，九三之相位，又因大功德為上所用，此當恭畏侍君，卑謙以讓勞謙之臣，所有布施，均為謙也，切不可不利於謙。\n\n六四因近君之位，又居勞謙臣之上，絶不可不利謙道，此得宜之法也。\n/4&\n\n&5&\n##### 六五：不富以其鄰，利用侵伐，无不利。\n\n##### 象曰：利用侵伐，征不服也。\n\n富貴，眾人之所嚮往，以財來聚人。今五以居尊之君王，不以富而能得人親，皆因知謙順，乃能得天下。然須戒君道，切不可專尚謙順，必須威柔並濟，才能服天下，故易曰：「利用侵伐」。威德並重，方為君道。\n\n君王之道，須用征伐，其用謙德所不能服者，否則不能治天下，則為謙之過也。\n/5&\n\n&6&\n##### 上六：鳴謙，利用行師，征邑國。\n上六處謙之極也，因極謙反居高位，為太過於謙，為倡明其謙，只有用剛武之道，於已之私有地，征之。此因謙之太過而致如此。\n\n##### 象曰：鳴謙，志未得也。可用行師，征邑國也。\n因極謙又居上，其不適謙，故志不得伸，則鳴，唯宜以剛武自治其國內。\n/6&"},"000100":{"text.tab1":"此卦諸葛孔明討南蠻，卜得之，便知必勝。\n\n#### 圖\n兩重山，一官人，一祿一馬，金銀數錠，錢一堆者。\n\n**鳳凰生雛之課**\n\n**萬物發生之象**\n\n#### 雜\n\n**雜卦曰：謙輕而豫怠也。**\n\n#### 序\n\n**序卦曰：有大而能謙，必豫，故受之以豫。**\n\n人有大量而又能謙，必豫，豫者悦也，豫卦承大有及謙之序也。上動而下又順，以象言，陽之始，潛伏地下，及出於地，乃因動，即為雷，故雷出地上，有通暢和順象。\n\n#### 解\n• 一、兩重山：出象，千里阻隔也。\n• 二、官人在中：外出不任官象；丈夫外出從商。\n• 三、一祿一馬：從商之人，財祿豐盛。\n• 四、金銀數錠：紙錢錠，主喪服。\n• 五、錢一堆者：內有憂心忡忡象。\n<u>全卦：此卦內有憂，外有阻，乃順勢而動，祿馬來會，可去官從商矣。</u>","text.tab2":"成此卦局之男人，必有因祿遠行之象，大利肖馬之人。\n• 一、居家中為母助，家事瑣碎，巨細靡遺，有男人能做一手好菜即此局之人。\n• 二、事業財官雙美平步青雲，惟與六親遠離，母有先喪之象。\n• 三、婚姻延後，此同時出生之人晚五年婚。\n• 四、事業上為良佐之人，任何老闆或主管任用之後，都將得幸有此人相助。\n• 五、婚事有娶二婚妻之象，或年長於己之小姐。","text.tab3":"&0&\n**豫：利建侯，行師。**\n聖人體豫悦之道，知兵師之興，諸侯之封，必眾心和悦方成，故能君臨萬邦，能群聚大眾，唯和悦可也，此豫之時也。\n/0&\n\n#### 彖\n\n**彖曰：豫，剛應而志行，順以動，豫。**\n動之順理，眾順而回應，其志乃行，故豫乃動而眾順。\n\n豫順以動，故天地如之，而況建侯行師乎。\n順理而動，天地之道亦如是，更何況立建諸侯，興兵之師。\n\n天地以順動，故日月不爲過，而四時不忒；聖人以順動，則刑罰清，而民服。\n天地之順而動，吾人可視四季之行，日月運轉永不為過，聖人稟此，而知因正而民相爭於行善，刑清罰簡，萬民皆服。\n\n豫之時義大矣哉。\n\n聖人知豫而體用豫之道，故於時機之掌握大矣，此卦之下有十一卦，豫、遯、姤、旅，皆言時之義。坎、睽、蹇，皆言時之用。頤、大過、解、革，皆言時之大也。\n\n#### 象\n\n**象曰：雷出地奮，豫。先王以作樂崇德，殷薦之上帝，以配祖考。**\n雷動出於地而奮震，悦之象也。先王作聲樂以褒揚功德，歸之上帝、祖先，此言，豫之道，能知，能體，則盛而至大也。\n\n&1&\n##### 初六：鳴豫，凶。\n\n##### 象曰：初六鳴豫，志窮凶也。\n\n初六乃下位，陰柔處之，是意不中正之小人，處豫時，為上所寵，志得意滿，乃至於發聲，小人之輕淺如是，必至凶也。\n\n初六處下而驕鳴，雖外飾喜悦，實乃窮極而凶。\n/1&\n\n&2&\n##### 六二：介于石，不終日，貞吉。\n\n##### 象曰：不終日貞吉，以中正也。\n\n豫悦之道，易流放縱，過則失正道，乃不合於時。此六二本陰位，今陰爻居位，乃處中正，為自守之象，君子處豫之時，獨其能以中正自守，示出其節介如石之堅也，故吉。能見事於幾微者，謂之神妙。君子之人上交不諂，下交不瀆，因能知微，吉凶之始，可先見於此也。守堅如石，則能不惑而明。\n\n人能中正，且守堅，故能辨之於早，此君子處豫之道。\n/2&\n\n&3&\n##### 六三：盱豫，悔。遲有悔。\n\n##### 象曰：盱豫有悔，位不當也。\n\n六三乃以陰而居陽位，為不中不正之人居相位也。如此動則有悔，盱為上視也，其動竟上視君側之人，故不中不正，悔之始也。是故君子明處身不正，進退皆有悔矣。處已之道，在正本身而已，以禮制心，即處豫卻不失中正，則無悔矣。\n\n因自處不當，失卻中正，造成進退有悔，處不當位也。\n/3&\n\n&4&\n##### 九四：由豫，大有得，勿疑，朋盍簪。\n\n##### 象曰：由豫，大有得，志大行也。\n志得大行於天下，乃皆由聚所悦也。\n\n九四乃君側之位，動則眾陰悦順，此豫之義。豫悦之由，以陽剛而任此位，大行其志，而天下皆悦。人能盡誠則無疑，上下因至誠而信，合而聚之，簪，乃聚髪之物。\n/4&\n\n&5&\n##### 六五：貞疾，恆不死。\n六五為君位，當豫悦之時，陰柔有沉溺之象，故乃柔弱不能自立且耽於酒色之豫道，受制於專權之臣，因受制於下，故有疾苦，古今人君致危之道很多，但以縱情於樂居多，豈有不死乎？\n\n##### 象曰：六五貞疾，乘剛也；恆不死，中未亡也。\n君位有疾，乃因側位專權之人壓制也，如能不死，乃因側位之剛為中正，方不致於亡。\n/5&\n\n&6&\n##### 上六：冥豫，成有渝，无咎。\n\n##### 象曰：冥豫在上，何可長也。\n\n豫之極，而以陰柔居之，乃聖人示意，凡人之失，苟能自變，則亦可以无咎，此乃為君子。如昏迷不知反省，必招凶。\n\n昏冥於豫悦，乃至於終極，災難至矣，不可長久，君子當速變。\n/6&"},"100110":{"text.tab1":"此卦孫臏破秦，卜得之，便知必勝也。\n\n#### 圖\n雲中雁傳書，一堆錢，朱門內有人坐，一人在門外立，地上一堆珠。\n\n**良士琢玉之課**\n\n**如水推車之象**\n\n#### 雜\n\n**雜卦曰：隨無故也，蠱則飭也。**\n\n#### 序\n\n**序卦曰：豫必有隨，故受之以隨。**\n\n豫悦之道，人必皆隨之，故豫之後有隨。震為雷，兌為澤，雷震於澤中，澤隨雷而動，此隨之義。以陽而下陰，陰乃隨陽，此陰陽不易之理。『外悦內動象』『下動上悦象』。\n\n#### 解\n• 一、雲中雁傳書：飛來喜訊象。\n• 二、一堆錢：財聚也。\n• 三、朱門內有人坐：君王之象，必見君面也。\n• 四、一人在鬥外立地：乃士人求仕，受尊重之象。\n• 五、串錢在地：有用利不行之象。\n• 六、亂珠聚盆：先聚後散之象。","text.tab2":"此卦現代人最多見，吾人常見街上有女孩，女扮男裝或粗壯過一般女人之小姐，即此局之人。\n• 一、有女同性戀之傾向，其心念一直認為自己為男人，且不屑自己為男人，且不屑一顧周圍之男人，喜與女孩同出同入。\n• 二、全心於事業，為達目的不擇手段，有時位高且居天子或董事長之身側。\n• 三、如同時生人，命中婚姻吉祥，再加此局勢必嫁入富貴人家，且比同時生人，早婚四年，如對方不富有，終必散。\n故學者如此，必須天文地理合局，方可確知同時生人之不同在何處，同時亦知如何可解。比方遇此卦局之人，命中婚姻又凶，吾人事先探知，利用巽為風卦，即可解開此局生成之禍端。","text.tab3":"&0&\n**隨：元，亨，利，貞，无咎。**\n隨之道，可以致大亨通。君子之道，眾人所隨，又遇事擇所隨，隨能得道，必致大亨。今人君之從民意，臣下之從君意，人人隨從義，利在堅守隨義，隨因能正，其道必亨。小人群聚，此隨失正，豈不招凶乎。\n/0&\n\n#### 彖\n\n**彖曰：隨，剛來而下柔，動而説，隨。大亨，貞，无咎，而天下隨時。**\n雷為剛今居柔下，是以尊貴而對下隨，為隨之義。臣君關係，以上悦下動，以動可悦，為隨之道，如是則亨通而無災。\n\n隨時之義大矣哉。\n君子之道，隨時而變，因時制宜。今世昏蒙不明，凡事皆表明裡暗，是故民之所隨，未能適中，常受謡言、外飾所惑，隨而必枉，受奸人利用。\n\n#### 象\n\n**象曰：澤中有雷，隨，君子以嚮晦入宴息。**\n澤隨雷震而動，君子晝則自強不息，夜則入居內安其身，起居作息隨天時，乃宜也。禮云：君子晝不居內，夜不居外，此隨時之道。\n\n&1&\n##### 初九：官有渝，貞吉，出門交有功。\n官為守也，因所從隨為正，故吉。出門交往多所親愛者，因人心所從隨也。常人之情，愛之所見皆對，惡之所見皆非，小人皆以私情而隨從之，不合正理，君子出鬥交不以私，故所隨皆有功也。\n\n##### 象曰：官有渝，從正吉也。出門交有功，不失也。\n所隨從之道，須從正則吉。隨從不正，招悔咎也。因交非因本身之私，其交必正，故不失。\n/1&\n\n&2&\n##### 六二：係小子，失丈夫。\n\n##### 象曰：係小子，弗兼與也。\n\n六二為陰柔位，陰乃順從，柔順之意，但如順隨的對象為小人，則必失卻君子之人，此因不能固守，聖人戒之。\n\n人因所順隨為正道，邪惡必遠也，但須戒，人若從於正，須專一，不可兼與。\n/2&\n\n&3&\n##### 六三：係丈夫，失小子，隨有求得，利居貞。\n\n##### 象曰：係丈夫，志舍下也。\n\n六三居相位，所固守本身之正，求上之隨，有求必得，乃上上隨也。如背是求非，舍君子從小人，為下下之隨也。故君子之隨，首先固守本身之正。\n\n隨之至善即在此，舍小人而從君子，人人如此，小人無所遁也，常自省而人之性乃從善如流，故將無小人矣。\n/3&\n\n&4&\n##### 九四：隨有獲，貞凶，有孚在道以明，何咎？\n\n##### 象曰：隨有獲，其義凶也，有孚在道，明功也。\n\n因四位乃臣之極位，如隨而有獲，即正亦易招凶，皆因天下之心隨於己。為臣之道，應使恩威出於上，眾心能隨於君，如讓人心從己，致凶之道。故君子居此，唯誠正於心，所動皆合於道，則可無悔。小人位極，用君王權，遂行其志，得民心又不歸功於上，位極而逼上，勢強而專權，隨之過大矣。君子雖功大震主，但由於其正而心誠，故主隨從而信之，何有災？\n\n近君之位，因追隨而有得，雖有凶戒，但有中正之誠，則無災，明哲保身也。\n/4&\n\n&5&\n##### 九五：孚於嘉，吉。\n\n##### 象曰：孚于嘉，吉，位正中也。\n\n此君位之人，得中正而固守，動隨於善，大吉也。故此，從人君到平民，隨道之吉，唯隨善耳。\n\n處中正之位，又中誠所隨，必吉矣。\n/5&\n\n&6&\n##### 上六：拘係之，乃從維之，王用亨于西山。\n\n此柔順而居隨之極也，柔順之隨至極雖有過之失，但如人心皆隨，因有得民之隨，仍有王道王業之成也，故能得民心者，得天下也。\n\n##### 象曰：拘係之，上窮也。\n隨之道至此，乃窮盡也。\n/6&"},"011001":{"text.tab1":"此卦伯樂療馬，卜得知馬難治，見三蠱同器皿也。\n\n#### 圖\n孩兒在雲中，雁啣書，一鹿、一錢，男女相拜。\n\n**三蠱食血之課**\n\n**以惡害義之象**\n\n#### 雜\n\n**雜卦曰：隨無故也，蠱則飭也。**\n\n#### 序\n\n**序卦曰：以喜隨人者，必有事，故受之以蠱。蠱者，事也。**\n\n因喜而隨人者，必有事，無事何喜何隨？故蠱以次隨也。山下有風，風在山下，遇山而回，使物亂，是為蠱象，蠱者，壞亂也。長女下於少男，長幼無序也，其亂可知。此卦象言成蠱之因，卦才專言，治蠱之道。\n\n#### 解\n• 一、孩兒在雲中：有天官促成也。不求名利之人。\n• 二、雁啣書：有消息至。\n• 三、一鹿：有大利也。\n• 四、錢在空中：此心中圖利之象也。\n• 五、男女相拜：男女相合，此為利而結合，非正婚也。","text.tab2":"三蟲聚一盤中，互相爭食，此成蠱象，吾人常見幾位女性同居一桌，東家長西家短的議論他人，此雖生是非之地，但並非成蠱卦，此卦在陽宅上惟見之於男人，此又男女之不同，女人之蠱，吾人可以立見，男人之蠱在心中，表面上不易看到。\n• 一、此局男人圖利野心至大，為達目的，往往不擇手段。\n• 二、主發科甲，讀書考試成績必超人一等。\n• 三、有早婚之象，比同時生人提前四年婚，且二位兄長尚未娶妻，自己先娶。","text.tab3":"&0&\n**蠱：元亨，利涉大川。**\n蠱之大者，乃時之艱難險阻，能有治蠱之才，則必亨通。\n\n先甲三日，後甲三日。\n甲為十干之首，意言事之始也。先甲三日，乃言治蠱之道，應先思其事之原，再思其事之後，乃知救弊之道。亦強調慮之深，推之遠也。能善於救者，則前之弊可革，能善親備者，則後利長久。此聖人之治蠱道。今人不明聖人先甲後甲之誡，慮淺而事近，故勞於救亂，亂不革，功未及成，弊已生矣。\n/0&\n\n#### 彖\n\n**彖曰：蠱，剛上而柔下，巽而止，蠱。**\n以卦而言，男雖少但居上，女雖長而在下，尊卑得正，上下顺理，治蠱之道也，故以巽順之道治蠱，是以元亨。\n\n蠱，元亨，而天下治也。利涉大川，往有事也。\n自古治亂者，能使尊卑上下之義正，在下為巽順，在上有才能安定萬事，如此則天下大治。\n如正遇天下壞亂之時，持治蠱之道而往濟之，利也。\n\n先甲三日。後甲三日，終則有始，天行也。\n有始必有終，終之後必有始，此天道也。聖人體始終之道，故能於事之始而探究其所以然，能於事之終而備其將然，此先甲後甲之慮，故能治蠱而天下亨。\n\n#### 象\n\n**象曰：山下有風，蠱，君子以振民育德。**\n山下有風，風遇山而回，致物皆散亂，故為有事之象。君子觀有事之象，在己則養德，在天下則濟民，君子所事此二者為最大。\n\n&1&\n##### 初六：幹父之盎，有子，考无咎，厲終吉。\n庶民之道，即子幹父蠱之道。子能居其位而知正，則無災，不然，則為父之累，故必惕厲為戒，終吉。初六為最下之道，故言子與父之關係。\n/1&\n\n&2&\n##### 九二：幹母之蠱，不可貞。\n\n##### 象曰：幹父之蠱，意承考也。\n子幹父蠱之道，意在能承擔父事，常懷惕厲，只敬其事，盡誠於父，則終吉。\n\n##### 象曰：幹母之蠱，得中道也。\n\n婦人本陰柔，若子只顧強伸己陽剛之道，反逆之，則傷恩，所害大也，唯有屈下己意柔順將成，使之身正而事乃治，故曰不可貞。如同陽剛之道輔柔弱之君，須盡誠竭忠致使其於中道即可，不會有大做為的。\n\n居臣位，不過剛，乃得幹母蠱之道完整者。\n/2&\n\n&3&\n##### 九三：幹父之蠱，小有悔，无大咎。\n\n##### 象曰：幹父之蠱，終无咎也。\n\n九三乃以陽剛之才居相位，克盡所事，雖以剛過而小有悔，但終無大災，但如以事親之道，則並非善事親之人也。\n\n此因剛而明斷之才，雖剛因不失正，故終無災。\n/3&\n\n&4&\n##### 六四：裕父之蠱，往見吝。\n\n##### 象曰：裕父之蠱，往未得也。\n\n此柔順之才而以正道處事，只能自守其道而已，若遇非正之事，因柔順之本質，而無法矯正，故不能而招罷斥。\n\n柔順之才，守於寛裕之時可以，如要前行，則不可得也，再加其任務，必不能勝任之。聖人知柔順之才可以守成，但不可用於發展，委之重任，必不成也。\n/4&\n\n&5&\n##### 六五：幹父之蠱，用譽。\n\n##### 象曰：幹父用譽，承以德也。\n\n此君位之人但質柔，但下應九二陽剛之位，意其能用陽剛之才為臣，但因本實陰柔，故可為承其舊業，而不能為開創事業之才。自古創業之事，非剛明之才不足以成事。不能用剛賢之人，只可以守舊袓業而已。\n\n陰柔之君主，能承下陽剛之才，以在下位之賢而能用之，乃因此而聲譽顯。\n/5&\n\n&6&\n##### 上九：不事王侯，高尚其事。\n\n##### 象曰：不事王侯，志可則也。\n\n上九乃居蠱之終，乃無事之地，處事之外。\n此應賢人君子不遇於時，應高潔自守，不可曲道以遁時，此進退合於道者也。\n\n不臣事於王侯，因知無法施其志，此乃賢能之人，此可以為法則也。小人皆可曲道而順行，背己逆天，只圖權力名位，此不可法也。\n/6&"},"110000":{"text.tab1":"此卦蔡琰去和番，卜得知，必還故國也。\n\n#### 圖\n婦人乘風，一車上有使旗，人在山頂，虎在山下坐，一合子，人射弓。\n\n**鳳入雞群之課**\n\n**以上臨下之象**\n\n#### 雜\n\n**雜卦曰：臨觀之義，或與或求。**\n\n#### 序\n\n**序卦曰：有事而後可大，故受之以臨。臨者，大也。**\n\n有事之後乃有可大之心，臨者，大也，故序卦為臨。為卦澤上有地，乃岸也，因與水相近故曰臨，天下之事最近臨者，唯水與地，故地上有水，為此卦，澤上有地，為臨；臨，即臨民臨事，凡所面臨的，皆有臨之道。\n\n#### 解\n• 一、婦人乘風：外援為陰女，美人也。\n• 二、一車上有使旗：出使之象，以謀略可解災，謀之對象為女人也。連姓、車姓人。\n• 三、人在山頂頭：盛極將衰，招困也，即將下坡也。\n• 四、虎在山下坐：人受虎困之象。\n• 五、一合：先成後破象。\n• 六、人射弓：張姓人士，夷狄之人，以弓射獵，故外族入侵象。\n<u>故自古天下安治，未有久而不亂者，皆因不能戒盛而已。</u>","text.tab2":"母居此局，因對象之卦為履，故有難為之象出現。已婚婦人居此由於夫宮必無力，產生以下數種狀況：\n• 一、夫業受困，乃因妻之過剛，為求功心切，招致如此，請參考履卦。\n• 二、妻為委曲求全，而以力大居小，順從於夫可也。\n• 三、子女逢母如此，任何事皆有母來做主，以致母過煩憂，發展權限過大，終致子女反彈，背逆其意行事，其招致如此，乃因母親無安全感，全心寄託在子女身上而成此特殊之心理狀況。其結果大家痛苦，而無法解決。\n• 四、肖虎人居此局，婚事凶，主破，但於事業卻能力爭上游，成就非凡。","text.tab3":"&0&\n**臨：元，亨，利，貞。**\n言臨之道，可致大亨也。\n\n至于八月有凶。\n二陽才剛生於下，聖人戒之於方盛，方盛而慮衰，則可以防自滿，圖其永久，衰而後戒，無及也，此乃戒盛之道。今人富而多驕，為安樂而壞綱紀，忘禍亂而任小人奸邪，皆因不知戒盛。\n/0&\n\n#### 彖\n\n**彖曰：臨，剛浸而長，説而順，剛中而應，大亨以正，天之道也。**\n剛中得正道，而有應助，故能大亨。天道，能化育生萬物，皆因其剛正而和順而已。以此道來臨事，臨人，臨天下，莫不大亨通也。\n\n至於八月有凶，消不久也。\n此乃聖人知戒於盛時，不以自滿，則凶不至也。\n\n#### 象\n\n**象曰：澤上有地，臨。君子以敎思无窮，容保民无疆。**\n地與水之臨近為至近，君子以此知臨之道乃親民如此，才能教導人民。有寬容保民之心，才能廣大無窮的包容。\n\n&1&\n##### 初九：咸臨，貞吉。\n\n##### 象曰：咸臨貞吉，志行正也。\n\n初為卑下之位，而以正道與四位感應，為所信任而得行其志，故吉。\n\n##### 陽剛之志在於行正，志正也。\n/1&\n\n&2&\n##### 九二：咸臨，吉无不利。\n\n##### 象曰：咸臨，吉无不利，未順命也。\n\n九二居將位，能以陽剛之心臨人，臨事，不愧於人，吉無不利。\n\n九二乃應於五之尊位，因以剛德之長，又得中道，此至誠相感，而得吉，並非因順上之命而得吉也。\n/2&\n\n&3&\n##### 六三：甘臨，无攸利，既憂之，无咎。\n\n##### 象曰：甘臨，位不當也，既憂之，咎不長也。\n\n三居相位，柔陰居之，此居上位又不以中正臨下，此失德也，不利。如能憂於此而立改之，則無災也。\n\n陰柔之人，處臨人事不以中正，又居下之上，乃不適其位，如能知懼而憂之，則必自改其災不長也。\n/3&\n\n&4&\n##### 六四：至臨，无咎。\n\n##### 象曰：至臨无咎，位當也。\n\n此臨之至也，臨道乃由近而生，此位居上之下，又切臨於下，乃處近君之臣位，守正任賢，如親臨於下，則无咎。\n\n居近君之臣，陰柔對之，為得正道，與下之剛賢相應，故能無咎。\n/4&\n\n&5&\n##### 六五：知臨，大君之宜，吉。\n\n##### 象曰：大君之宜，行中之謂也。\n\n以一人之身，君臨天下之廣，若皆以自任，必不能周於萬事，如自認為皆知者，正明示其不知也。唯有能得天下之善，用天下之智者，則無所不周，這就是不以自認皆知，故其知乃可大。\n\n君臣合道，皆因同氣相求，君能倚任剛中之賢，則能成臨之功，此知臨之意。\n/5&\n\n&6&\n##### 上六：敦臨，吉，无咎。\n\n##### 象曰：敦臨之吉，志在内也。\n\n此位乃臨之極位，以坤順而居此位，乃意尊而應卑，高而從下，尊賢取善，此為敦厚之極也。皆因其能敦厚於順剛，是以吉而無災。\n\n內心敦厚篤實，志順於陽剛，其吉可知。\n/6&"},"000011":{"text.tab1":"此卦唐明皇與葉靜遊月宫，卜得之，雖有好事，必違也。\n\n#### 圖\n日月當天，官人香案邊立，鹿在山上，金甲人執印秤。\n\n**雲捲晴空之課**\n\n**春花競發之象**\n\n#### 雜\n\n**雜卦曰：臨觀之義，或與或求。**\n\n#### 序\n\n**序卦曰：物大然後可觀，故受之以觀。**\n\n臨者，大也，萬物之成大，乃有可觀，故觀所以次臨也。凡觀視於物，即為觀也。人君上觀天道，下觀民俗，為觀之道。風行地上，遍觸萬物，乃周觀之象。以陽剛在上，為群下所觀，故觀亦有仰之義。\n\n#### 解\n• 一、日月當天：政治清明，普照大地，父母雙全。\n• 二、官人香案邊立：倌人，丈夫也。蔡姓人士，神人共明之象。\n• 三、鹿在山上：得高祿之象。\n• 四、金甲人：君側之人也，護衛也。\n• 五、執印秤：提印信而來授權也。","text.tab2":"觀卦之精義在以靜觀可以洞悉周圍之事，黃帝之陰符經雲：「聾者善視。」即此意。但亦有缺失，豈不聞古言：「水至清則無魚，人至明則無徒」此卦唯長女可見，婚後局消。\n• 一、其明在過明，而產生以財富論定是否願意嫁人，造成如遇未有事業之男人，即使再愛也不願結婚，寧可做有錢人的偏房，不婚。\n• 二、如逢命格婚姻有凶，則有嫁二婚夫，且對方有子之人，但須比同時生人再加六年方成正式婚姻。\n• 三、未婚前，女兒代母職，掌理一家大小之事，有姊如母，即此局之人。\n• 四、如遇命中為僧道命之人，則主終身不嫁。","text.tab3":"&0&\n**觀：盥而不薦，有孚顒若。**\n人於祭祀之始，求神之時，心念最專精之時也。居上位者，正其儀表，以為下民之觀，當始與終，皆能令民之觀如初始之專精，則盡觀之道也。今人至君位後，禮數繁多，致令人心散，精一不如初始也。\n/0&\n\n#### 彖\n\n**彖曰：大觀在上，順而巽，中正以觀天下。**\n五居尊位之人，能以陽剛中正之德，始終如一，為下所觀見，則必能精一也。\n\n觀，盥而不薦，有孚顒若，下觀而化也。\n處觀之道須嚴守如始之精一，則下民必至誠瞻仰而從教化，不薦為不使誠意少散。\n\n觀天之神道，而四時不忒，聖人以神道設敎，而天下服矣。\n天之道至神，故曰神道。聖人觀天之運行四時，從無差錯，其神妙如此。聖人體神之道而以設教，故天下服也。\n\n#### 象\n\n**象曰：風行地上，觀。先王以省方、觀民、設敎。**\n風行地上，能觸萬物，聖人體之，知巡省四方，觀視民俗，設為政教，例如見奢則約之以儉，見奸則矯之以正，則民將觀之。\n\n&1&\n##### 初六：童觀，小人无咎，君子吝。\n\n##### 象曰：初六童觀，小人道也。\n\n處最下之位，又為陰柔之本質，離陽剛過遠，是故其觀淺如童稚，故曰童觀。小人觀陽剛之道，不識君子之道，於觀之初，反而無災，如見君子亦昏淺如是，則可羞也。\n\n此所觀不明如童稚，此實小人也，故言小人之道。\n/1&\n\n&2&\n##### 六二：闚觀，利女貞。\n觀，乃少見而無甚明也。二居將位，而不能明見陽剛中正之道，則如女子之道，即見之不甚明，又能順從者。將位之人，能如女子之順從，則不失其正，故利。\n\n##### 象曰：闚觀女貞，亦可醜也。\n此即君子之人不能觀見陽剛中正之大德，雖能順從，乃同女子也。亦可羞也。\n/2&\n\n&3&\n##### 六三：觀我生，進退。\n\n##### 象曰：觀我生進退，未失道也。\n\n柔質居相位，處觀之時，其進退之道，乃為己者，雖非正，.亦不為過也。\n\n觀己知生存之道，而以之進退，此未失道也。\n/3&\n\n&4&\n##### 六四：觀國之光，利用賓于王。\n\n##### 象曰：觀國之光，尚賓也。\n\n四雖陰柔居君側之位，能觀見國之光辉盛大，可見人君之道德也。此因九五君位為聖明之人，致令才德之士 ，皆願進朝廷輔佐，以濟天下。反之聖君因能用敬才德之人，則人才聚之。\n\n君子懷才自守，乃因無明主也。既觀見國之盛德光華，則志願登進王朝，以行其道。\n/4&\n\n&5&\n##### 九五：觀我生，君子无咎。\n\n##### 象曰：觀我生，觀民也。\n\n九五君位之人，體觀之道，其視天下之俗而知己，若天下之俗，不合乎君子之道，則是己之所為，政治必不佳，不可不怪自己。\n\n人君欲觀己之施政良否，當觀於民，民俗善，則政化必善。此意即王弼云『觀民以察己之道』。\n/5&\n\n&6&\n##### 上九：觀其生，君子无咎。\n\n##### 象曰：觀其生，志未平也。\n\n上九為不當位之人，以陽剛處之，如同賢人君子不在其位，而道德為天下所觀仰，能如此，皆君子也。\n\n吾人觀其生存之道，常不失於君子，雖不在位，則亦不失人所望之教化也。\n/6&"},"100101":{"text.tab1":"此卦蘇秦説六國，卜得之，後為六國丞相。\n\n#### 圖\n北斗星，婦人燒香拜，憂字不全，喜字全，一雁食稻，一錢財，一鹿。\n\n**日中爲喜之課**\n\n**順中有物之象**\n\n#### 雜\n\n**雜卦曰：噬嗑食也，賁無色也。**\n\n#### 序\n\n**序卦曰：可觀而後有所合，故受之以噬嗑。嗑者，合也。**\n\n觀之後而有來合者，所合者，噬嗑也。故為觀之序。卦才中有一剛居，意為口中有物隔其上下，不得嗑狀，必咬之則得嗑，故稱噬嗑，以此理推而天下事，如天下有強梗或讒邪阻隔其間，使天下事不得合，當用刑法。小則懲戒，大則誅戮以除去，使天下得治。古今萬物皆合而後遂成，如未合必有間阻，若君臣、父子、親人、朋友有怨隙者，因讒言在其間也，除之則合，是故間隔為天下之大害。聖人體噬嗑之道，知此為天下之大用，能去天下之阻間，唯刑與罰。\n此卦二體明照而威鎮，乃用刑之象。\n\n#### 解\n• 一、北斗星：君王也，夫君也，公職也。\n• 二、婦人燒香拜：妻於人事無助，乃求助於天。\n• 三、憂字不全喜字全：乃無又喜象。\n• 四、一雞食稻：果被食，無果也。\n• 五、一錢財、一鹿者：於財祿事憂心忡忡也。\n• 六、禽：字解為『離多會少』之象。","text.tab2":"成此之局法，請觀錄影帶說明，於此不累述。吾人常見有女孩小時即喜歡咬人，勸之不聽，乃生噬嗑之象。\n• 一、此女性剛，報復手段常用咬的，平日嘮叨不停。\n• 二、婚姻對象為陰柔之男人。\n• 三、本身想法動作一如男人，且主少年有成，故常見年輕之影劇圈出身小姐，名氣很大，少年得志，都屬此局。\n• 四、婚事延後六年，故同時生人如為二十六歲婚，則此局人加六年，成為三十二歲婚。\n• 五、事業非常順利，但如為肖雞之女性逢之，其果必坐吃山空，吾人常見的有未婚妾成此局，也有離婚之女成此局，但須與寡母同住一起，方成此局。為何如此，學者須看錄影帶說明。","text.tab3":"&0&\n**噬嗑：亨，利用獄。**\n此即天下之事不能亨通，乃因有間阻，非刑獄何以除之。\n/0&\n\n#### 彖\n\n**彖曰：頤中有物，曰噬嗑，噬嗑而亨。**\n如口中有物阻，必用力嗑之，乃能亨通象。用獄之道，所以察情偽，得其情，則知為間之道，而後可以設防與致刑。知噬嗑之道，乃知去間之道，而天下亨通。\n\n剛柔分，動而明，雷電合而章。\n此卦才有剛有柔，分而不雜，為明辨之象。察獄之本即明辨，以明而動，上震下離，其動因明也。照與威並行，為用獄之道。人能照，則無隱情，有威則無人不畏，故照與明並用也。\n\n柔得中而上行，雖不當位，利用獄也。\n此言治獄之道，如全剛則傷於嚴暴，過柔則失於宽縱。以仁而居剛得中正，則得用獄之道。\n\n#### 象\n\n**象曰：雷電，噬嗑，先王以明罰敕法。**\n\n雷威而電明，聖人觀雷電之象，效法其明與威，而立刑罰法令。法之精神乃在教明事理而設防也。\n\n&1&\n##### 初九：屨校滅趾，无咎。\n\n##### 象曰：履校滅趾，不行也。\n\n最下位，下民之象，為受刑之人，用刑之始，罪小刑輕，以木械傷其趾，則不敢進惡矣。\n此即因小懲而有大戒。小人之福，即在此。\n\n因小罪而小用木械傷其趾，則因懲而不再進為惡也。\n/1&\n\n&2&\n##### 六二：噬膚滅鼻，无咎也。\n\n##### 象曰：噬膚滅鼻，乘剛也。\n\n二居中而得正，是用刑得中正象。如此罪惡易服，然遇剛強之人，刑之必须深痛，故致滅鼻而无災。\n\n此用刑於剛強之人，不得不深痛，乃有戒也。\n/2&\n\n&3&\n##### 六三：噬臘肉遇毒，小吝，无咎。\n\n##### 象曰：遇毒，位不當也。\n\n本身不正又用刑於人，則人不服而怨對反駁，如食臘肉遇毒，反傷於口。此雖有小議，但無大災也。\n\n受刑之人難服，乃因其用刑之人位不當也。今之他國人在本國犯罪，即見之。\n/3&\n\n&4&\n##### 九四：噬乾胏，得金矢，利艱貞，吉。\n\n##### 象曰：利艱貞吉，未光也。\n\n九四乃居近君之位，乃意愈大，則用刑必重。至此得剛直之道，可克艱其事，又因貞固本身操守，且執意行之，則无咎。\n\n此時，乃有不足，故雖堅心，但仍未光大也。此貞亦艱也。\n/4&\n\n&5&\n##### 六五：噬乾肉，得黃金，貞厲，无咎。\n\n##### 象曰：貞厲无咎，得當也。\n當正位，以剛而能守正又慮危，故無災。\n\n因五乃居君位，至尊故勢大，以此刑下，較易如吃乾肉，故為君之道，時天下之間阻物大，須得中而剛，心懷危懼，持續下去，方吉。\n/5&\n\n&6&\n##### 上九：何校滅耳，凶。\n\n##### 象曰：何校滅耳，聰不明也。\n\n受刑之極，乃起因於惡之積也，其凶可知。\n小惡不懲，必成大惡。\n\n人之為惡不悟，積其惡以致極大，至此何教之？今之人聰而不明，不知止惡於初，教正以刑，乃至大惡。\n/6&"},"101001":{"text.tab1":"此卦管鮑卜得之，果獲全，彼此相遜，終顯名義也。\n\n#### 圖\n雨下，車行路，舟張帆江中，官人著公服登梯，仙女雲中執珪。\n\n**猛虎靠岩之課**\n\n**光明通泰之象**\n\n#### 雜\n\n**雜卦曰：噬嗑食也，賁無色也。**\n\n#### 序\n\n**序卦曰：物不可以苟合而已，故受之以賁。賁者，飾也。**\n\n物之合後則必立文，文乃飾之意。賁者，飾也，故為之序。人因合聚則有威儀上下，物之合聚則必有次序行列。此卦山下有火，草木百物聚於山處，下有火，則能照見草木百物，且增益其光彩，有賁飾之象。\n\n#### 解\n• 一、雨下：滿也，潤澤也，成也。\n• 二、車行路：前往任官象，行走四方也。\n• 三、舟張帆在江中：此行順風大利也。\n• 四、官人著公服登梯：升遷在外地象。任公職主官外調象。丈夫從公職升官也。\n• 五、仙女雲中執珪：受陰人提攜象","text.tab2":"賁卦為求外飾之道，其之於人事，惟男人居此局中成格。諸君試想一位堂堂男子漢，如果要外飾，其目的何在呢？因為有真內實之人，其心但求充實，必捨外飾之道，不會花心思刻意去修飾。君不見真正有錢，有高智慧之人，其外觀往往很零亂，甚至衣服反穿而不自知，其原因在他根本不想花心思在這方面，你有同感嗎？\n• 一、男身女態之象，性喜誇張矯作之服飾。\n• 二、個性好動，不耐靜守，又剛烈主見強，性易怒。\n• 三、婚姻延後，三十歲以後進退失據，吾人常見空服人員及影劇圈人士居此局中而不自知。\n• 四、此局以科甲，聲名，故利考試。同時生人會考試成績不同，有人名落孫山，地理之格局影響深遠矣。","text.tab3":"&0&\n**賁：亨，小利有攸往。**\n物有外飾而後有立，但须有內實而加外飾，則可以亨。因文飾之道可以增加光彩，故必利於小進。\n/0&\n\n#### 彖\n\n**彖曰：賁亨，柔來而文剛，故亨。分剛上而文柔，故小利有攸往，天文也；文明以止，人文也。**\n賁之道能亨，實由飾而來，飾之道，須來往以柔，求文飾以剛，名須正，故利小吉。賁飾之道，並非能增其內實，只外加文彩而已。今人但求外飾，不求內實，富侈表面，內無實才，比比皆是，上位者所用皆富有之人，此敗亡之初始象也。\n\n觀乎天文以察時變，觀乎人文以化成天下。\n天文，為日月星辰之錯列，四時寒暑之變化。人文為人理之倫序，觀人文以教化天下，此聖人用賁之道也。\n\n#### 象\n\n**象曰：山下有火，賁。君子以明庶政，无敢折獄。**\n山下有火，草木為其明照而有光彩，此賁飾也。聖人觀此明照之象，以修明庶政，成文明之治，無敢於用文飾，掩飾實情，枉法不顧，故君子以用明為戒。\n\n&1&\n##### 初九：賁其趾，舍車而徒。\n\n##### 象曰：舍車而徒，義弗乘也。\n\n初九乃君子有剛明之德，居於下也。因其無位，無法施濟天下，唯求賁飾自己而已。君子修飾之道，在正其所行，守節處義，凡不正則寧不與同行。\n\n##### 於義不可同行，寧舍車而步行。\n/1&\n\n&2&\n##### 六二：賁其須。\n\n##### 象曰：賁其須，與上興也。\n\n外飾於物，無法改變其本質，須因其本質如何加飾，乃賁之道。\n\n須賁之道，須與上隨，隨上而動，動靜歸依於所主。\n/2&\n\n&3&\n##### 九三：賁如濡如，永貞，吉。\n\n##### 象曰：永貞之吉，終莫之陵也。\n\n賁之盛，須戒永正，則吉，因永正之心及行，很難維持。\n\n如飾之變化多且非正，人所陵侮也，故戒之永正則吉。\n/3&\n\n&4&\n##### 六四：賁如皤如，白馬翰如，匪寇婚媾。\n\n##### 象曰：六四當位，疑也；匪寇婚媾，終无尤也。\n\n賁外飾為白色，白馬亦為白色，但志不同，由外飾同，而終有婚遂相應也。今人之求門當户對也。\n\n四與一為應爻，六四當位時，中離間隔二三位，故疑也，但因一與四為正應，理直義勝，終必無災也。\n/4&\n\n&5&\n##### 六五：賁于丘園，束帛戔戔，吝，終吉。\n\n##### 象曰：六五之吉，有喜也。\n君能從人以成賁之功，此吉有喜也。\n\n此雖君位，但本質陰柔，不足自守，但求外賁於設險守國，田園近城，山丘在外，據險而守，即令陰柔之質，受人裁制其外，雖君子吝之，但終平安。\n/5&\n\n&6&\n##### 上九：白賁，无咎。\n\n##### 象曰：白賁无咎，上得志也。\n\n賁飾之極，則失於外偽，唯能質白於賁，則無過飾之災。故尚質素，不失其本真，千萬不可外飾過於華美而失其本質，此戒賁也。\n\n處賁之極，則有過華偽失實之慮，故戒之，以質素則可無災，飾不可過也。\n/6&"},"000001":{"text.tab1":"此卦尉遲將軍與金牙鬥爭，卜得之，不利男子。\n\n#### 圖\n婦人床上坐，風中燭，葫蘆在地，山下官人坐，冠巾掛木上，一結亂絲。\n\n**去舊生新之課**\n\n**群陰剝盡之象**\n\n#### 雜\n\n**雜卦曰：剝爛也，復反也。**\n\n#### 序\n\n**序卦曰：致飾(然/而)後亨則盡矣，故受之以剝。剝者，剝也。**\n\n盡賁飾之道，而後可亨。但飾之終，不戒，則必剝，故為之序。卦體為五陰一陽，乃意陰始自下生，渐長至極盛，群陰皆受剝於陽也。天地之間，山乃高大，但仍附於地上，此為頹剝之象也。外止內順，招剝之象也。而順且止，為處剝之道。\n\n#### 解\n• 一、婦人床上坐：必有暗災，陰人得勢，陽道衰弱，小人為主官。\n• 二、燭在風中：險也。\n• 三、葫蘆：醫藥無救也；有暗計也。\n• 四、繅絲：事務繁冗。\n• 五、山下官人坐：有靠山，但陰人為禍。\n• 六、冠巾掛木上：求去之象；又有樂之象。","text.tab2":"剝有耗盡之象，有人家財萬貫，但出一子耗盡家財，所謂富不過三代，其因何在？有時見三老人，居老人院中，本是安養天年與世無爭，三人結拜兄弟後，長幼有序分列，此時如剝卦現，則其中一人必散盡三人之財務，終至引發自殺或仇殺事件，其因皆為財，世人但知為財殺，卻永遠無法深入瞭解，為何貪財如此？為何年至古稀，仍無法擺脫財利之惑？皆不知卦局之影響，乃能深入人心，使當事人蛻變而不自知，終致晚節不保，學者須戒之，一旦發現此局已成，必極盡人事破壞此局，免生大害，徒呼奈何？\n• 一、家有剝卦，主耗破家業，倫理喪失，傷風敗俗。\n• 二、性毒暗生，害人而人不知。\n• 三、婚事不成，同時生人即令流年紅鸞星動，亦無法成婚。\n• 四、科甲不順，考試必敗。\n• 五、身體災病多，折損陽壽。\n此局大凶，學者須能於事初即可判讀出，必可趨吉避凶，乃至大吉，功德無量，同道須知，助人於無形，受助人不自知，無法察覺到你的功勞，此其功德也，即陰德。今人捐募善款，為窮人洗衣、做飯、只是陽德，並非真功德。聖人治世，天下百姓，只知平安，無亂，無法感受到聖賢的功勞，庸才治世，天下大亂，其派人平亂後，人民見此，即認定其功勞很大，所以本書之出世，有警世教民之無知功效，同道共勉之。","text.tab3":"&0&\n**剝：不利有攸往。**\n剝乃群陰長盛，剝削陽時，同眾小人剝喪君子，故君子不利往。\n/0&\n\n#### 彖\n\n**彖曰：剝，剝也，柔變剛也。不利有攸往，小人長也。**\n剝，落也。柔盛而剛剝，陰盛陽必退，此陰陽之道，小人道長盛，君子消退也。\n\n順而止之，觀象也；君子尚消息盈虛，天行也。\n君子處剝之時，知不可往，順時而止，乃因能觀剝也。故此卦有順止之象，為處剝之道。\n君子之人見事於始，凡事之始皆有理，君子視其盈虧消息，而知處之道。順時則吉，逆時則凶，故君子事天。小人反之，不見事始之作為如何，不論事理之盈虧如何，一昧迎隨奉承，故小人事人。\n\n#### 象\n\n**象曰：山附於地，剝，上以厚下安宅。**\n山再高大仍依附於地，聖人體此，知人君與上位者，視剝而知厚固其下位之人，以安居也，下者為上之本，從未有基本固而能剝者也。故上如有剝，必自下。故安養人民以厚國本。書曰『民惟邦本，本固邦寧』\n。\n\n&1&\n##### 初六：剝床以足，蔑貞，凶。\n\n##### 象曰：剝床以足，以滅下也。\n\n因剝之始皆自下，故曰剝足，陰自下進，渐消亡正道，凶之至也。\n\n正道之侵滅，必由下而上渐進。用剝之道即在此。\n/1&\n\n&2&\n##### 六二：剝床以辨，蔑貞凶。\n\n##### 象曰：剝床以辨，未有與也。\n\n此陰漸進，為將者已受剝也，凶益甚也。\n\n小人之侵剝君子，若君子有對應，則小人不能為害，如無對應，則有被滅之凶。\n/2&\n\n&3&\n##### 六三：剝之，无咎。\n\n##### 象曰：剝之，无咎，失上下也。\n\n眾陰在下剝陽之時，三之相位獨剛應之，則可無災，但因勢孤弱，雖可無災，但未必能大亨。\n\n為相之人居剝之時，无災之因乃同類而相失，不與同道，故也。\n/3&\n\n&4&\n##### 六四：剝床以膚，凶。\n\n##### 象曰：剝床以膚，切近災也。\n\n剝之及身時也，其凶可知。乃因不知始剝於下，以致進盛至此。\n\n象為剝及皮膚，因四為君側之人，如君之膚，示災禍之近身也。\n/4&\n\n&5&\n##### 六五：貫魚，以宮人寵，无不利。\n\n##### 象曰：以宮人寵，終无尤也。\n\n剝本及於君，凶可知，但聖人於此，知人性之從善如流，以示寵方式，使群陰如魚之貫序，則可無所不利。此寵如對妻妾之同態也。\n\n於剝之及身時，能以寵妻妾之方式對待，則終無災。\n/5&\n\n&6&\n##### 上九：碩果不食，君子得輿，小人剝廬。\n\n##### 象曰：君子得輿，民所載也；小人剝盧，終不可用也。\n\n果之大者，如不食，則有復生之理。陰道盛極，天下大亂，但亂極則必思治，故眾人之心，必願載君子，故如得輿。此陰極生陽也。\n若為小人於此，則必無安身之地。\n\n因正道消剝至極，則人必思治，上九為陽剛之君子，為民所載也，小人處剝之極，終不可用也。\n/6&"},"100000":{"text.tab1":"此卦唐太宗歸天，卜得之，七日復還魂也。\n\n#### 圖\n官人乘車，上兩隻旗，堠上東字，一將持刀立，一兔一虎。\n\n**淘沙見金之課**\n\n**反復往來之象**\n\n#### 雜\n\n**雜卦曰：剝爛也，復反也。**\n\n#### 序\n\n**序卦曰：物不可以終盡剝，窮上反下，故受之以復。**\n\n萬物無剝盡之理，故剝極必復來。復為之序卦。此卦一陽生於五陰之下，有陰極生陽象，如同冬至極寒，則必生陽，亦同。雷在地下，有復生之象，外順內動，此為復之始。\n\n#### 解\n• 一、官人乘車：使節也；車姓、連姓也；軍隊也；官大也；調職也。\n• 二、上兩隻旗：鬥也；將、帥也；一方之主也。\n• 三、堠上東字：猴發木形人。東：有心約束，十八日至。十日來人封侯象。\n• 四、一將持刀立：武威之人，司法執行人。\n• 五、一兔：肖兔之人，劉姓之人。\n• 六、一虎：肖虎之人，王姓之人。\n<u>此卦云：君子之道，既消而復，始復必不能力勝小人，必待其朋類渐盛，協力致勝可也。</u>","text.tab2":"吾人常見已婚之婦人，婚事不佳，獨立支撐家運，允文允武，屬木蘭型之人，必為復卦之局。\n• 一、有女身男人性格之徵。\n• 二、此卦局尤利發武官，即軍、警、法、外交等工作之人。\n• 三、代夫出征，絲毫不讓鬚眉。\n• 四、此局發官人，不發商人，尤以肖虎、兔人大吉，更旺。\n• 五、與夫之對應局為無妄卦，故夫妻必不和，其因乃生於妻志過丈夫，丈夫無法與其匹配，屋漏偏逢連夜雨，加上夫有官司是非纏身，所以對婚姻來說是加凶。","text.tab3":"&0&\n**復：亨，出入无疾，朋來无咎。**\n萬物既復則必亨，如君子之道將復，雖微，但同類將渐進，故亨且盛矣。故復之時至，並無法立勝小人，必待其同朋相繼，則協力能勝也。\n\n反復其道，七日來復，利有攸往。\n此為消長之道，易之論數，以立準則，小有七日乃復，大有七年方復，此復之道也。\n/0&\n\n#### 彖\n\n**彖曰：復，亨。剛反，動而以順行，是以出入无疾，朋來无咎。**\n此以卦才來論，復之道，陽剛因消弱至極而反來，其法動而取順行法，是故出入皆無災，朋之來，亦因順而動來也。\n\n反復其道，七日來復，天行也。利有攸往，剛長也；復其見天地之心乎！\n復之返來，順天之運行，故言七日。因君子道長，故利前往，陽復生於下，乃是天地生物之心，以為動之始也，故外見動，而始生於內也。\n\n#### 象\n\n**象曰：雷在地中，復。先王以至日閉關，商旅不行，后不省方。**\n以卦象而言，如雷乃陰陽相搏而成聲，時陽之微，未能發也。如聖人順天之道，於日陽之\n\n始生，安靜養之以閉關，使商旅不得行，人君不視四方，此順天也，於人亦以此安養其陽為復原之道。\n\n&1&\n##### 初九：不遠復，无祇悔，元吉。\n\n##### 象曰：不遠之復，以脩身也。\n\n有失而後有復，此復之始時，因失之不遠，故復必不至於悔，故吉。\n\n此即知不善而速改，為君子修身之道。學問之道即在此，知不對立改，為君子也。\n/1&\n\n&2&\n##### 六二：休復，吉。\n\n##### 象曰：休復之吉，以下仁也。\n\n二為切近初陽之位，君子道始生於下，若二位志向於陽，今陽在下從之，故能下之道為仁。吉。\n\n仁者天下之公，善之本源，能體會而近於下之仁，乃休復之美。\n/2&\n\n&3&\n##### 六三：頻復，厲，无咎。\n\n##### 象曰：頻復之厲，義无咎也。\n\n從復之道，又頻復履失，致危之道也。故須厲，即戒此可无咎，頻失致危，其過乃在失而不復也。今人迷途不知返，比之皆是，又知返而不戒又入迷，凶也。\n\n戒之在屢復，復而又失，失之過，故堅心於復不失，無災殃也。\n/3&\n\n&4&\n##### 六四：中行獨復。\n\n##### 象曰：中行獨復，以從道也。\n\n四於眾陰之間，能自處於正，但因力弱，不足克濟，此言獨復，不一定無災。\n\n以獨復於小人間，如從陽剛，君子之道也。\n/4&\n\n&5&\n##### 六五：敦復，无悔。\n\n##### 象曰：敦復无悔，中以自考也。\n\n君王於復之道，能敦篤而行之，但臣下均陰柔之輩，因無助，但能無悔而不能無災，君子戒之。\n\n五以陰居尊位，能敦篤善道，以中道自成，此可無悔也。\n/5&\n\n&6&\n##### 上六：迷復，凶，有災眚，用行師，終有大敗，以其國君凶，至于十年不克征。\n\n##### 而終不可行也。\n\n陰柔居復之終，乃意終迷不復者，大凶。\n招凶，皆因己之迷而不返，動則必有過失，以之出師必大敗，以之為國君，大凶。迷於道，\n\n##### 象曰：迷復之凶，反君道也。\n人君居上而治天下，當從天下之善，如迷於復，反復無常，皆招凶也。\n/6&"},"100111":{"text.tab1":"此卦李廣，卜得之，後凡為事皆不利也。\n\n#### 圖\n官人射鹿，鹿啣文書，錢一堆在水中，一鼠一豬。\n\n**石中蘊玉之課**\n\n**守舊安常之象**\n\n#### 雜\n\n**雜卦曰：大畜時也，無妄災也。**\n\n#### 序\n\n**序卦曰：復則不妄矣，故受之以無妄。**\n\n因復於道，合於正理，則无妄，故復之後受以无妄。卦乾上震下，此言動以天則為无妄，如動以人慾則生妄矣。故无妄之義大也。\n\n#### 解\n• 一、官人射鹿：自亂陣腳。\n• 二、鹿啣文書：財訊至也。\n• 三、錢一堆在水中：得財遇險之象。險中求財，憂心忡忡也。\n• 四、一鼠一豬：遇子、亥年吉，肖鼠人陰謀，肖豬人黑心。\n<u>又可以子、亥為孩，亦即孩無子為亥，缺子象。又六字不全，亥月凶，無尾凶，不足六歲，為五歲凶死。\n天機象：犬、豬、牛、羊：叱之即去。雞、魚、鵝、鴨：欲用則不生。</u>","text.tab2":"此名無妄，猶無妄之災意，居此局之丈夫成此格，即令已離婚但有子女同住，只要象存在，其局不變。須注意此點。\n• 一、必須為從商較吉，但須防陰人暗客，有得財遇險之象，肖豬肖鼠人成格，主大財入，但皆有陰謀其中。\n• 二、如為公職人，則易流於利慾而挺身走險。\n• 三、求財招險事，住滿第二年，局再不動，必見之。\n• 四、性剛固執，不聽人言，故生小人，自亂陣腳。\n• 五、須防子災，故同時生人，有人無子，有人有子，但主夭折或叛逆，此其真因也。因強住長子位，致令長子無宮位，故生禍害。","text.tab3":"&0&\n**无妄：元，亨，利，貞，其匪正有眚，不利有攸往。**\n无妄即至誠也。至誠為天道。天能化育萬物，生生不息，且各正其性，此无妄也。人如能合於无妄之道，則能與天地合德，故大吉，君子行無妄之道，能致大吉，須戒在堅心，如失貞，則致災。今人本無邪心，但如不合正理，則妄亦邪心也。\n/0&\n\n#### 彖\n\n**彖曰：无妄，剛自外來而爲主於内。動而健，剛中而應，大亨以正，天之命也。**\n動以天則无妄，今人動以人慾。剛自外而入主於內，乃以正去妄之象。上健而下動，內動而外健，其動乃剛，理正氣壯，道乃大亨，此天道也。今人動之以慾，而無法示誠於外，不夠剛明，乃因內不實，此致妄矣。\n\n其匪正有眚，不利有攸往，无妄之往，何之矣。天命不祐，行矣哉？\n无妄，即正也，小失於正，乃妄。入於妄，不知復，乃更往，則必悖天理，為天道所不容，不可行也。\n\n#### 象\n\n**象曰：天下雷行，物與无妄，先王以茂對時育萬物。**\n雷行天下，陰陽和而成聲，生發萬物，各正性命，其發而无妄，先王觀此象，體天之道，養育人民，使各正性命，乃對時育物之道也。\n\n&1&\n##### 初九：无妄，往吉。\n\n##### 象曰：无妄之往，得志也。\n\n初進陽剛在內，以无妄之天理行之於外，故往吉。\n\n无妄乃誠也，人之至誠，物無不動，君子以之修身則身正，以之治事則得理，以之待人則人化，无往不利也。\n/1&\n\n&2&\n##### 六二：不耕穫，不菑畬，則利有攸往。\n\n##### 象曰：不耕穫，未富也。\n\n人之欲即妄，理之自然者，非妄，今以耕穫喻之，農耕後之穫，乃理之自然也。田一歲為『菑』\n，三歲曰『畬』\n，有耕而有穫，有菑而有畬，聖人順時而作，乃為聖也，讀易之人，能知時順勢，得易之道矣。\n/2&\n\n&3&\n##### 六三：无妄之災，或繫之牛，行人之得，邑人之災。\n\n心念於始耕菑之時，乃為求畬，此所以為富。心有欲而為，則妄。故易言人之行但求合於自然，不為人欲所動，故能勝己之欲為大勇也。\n\n##### 象曰：行人得牛，邑人災也。\n\n人之妄動，由己之欲也，妄動有得，亦必有失，陰柔居相位，動乃因妄，失之大在欲，故妄得之福，災亦隨之，妄得之得，失亦來之，皆非真得也。\n\n有得有失，不足言得。聖人之得，乃無欲而得，不言有失。\n/3&\n\n&4&\n##### 九四：可貞，无咎。\n\n##### 象曰：可貞无咎，固有之也。\n\n四位剛而居之，剛則必無私，永不生妄。\n\n堅心守无妄之道，剛而無欲，則无災。\n/4&\n\n&5&\n##### 九五：无亡之疾，勿藥有喜。\n\n##### 象曰：无妄之藥，不可試也。\n\n九五為尊位，以陽剛應之，下又以陽剛中正順應，則致善也。即令有小疵，不須去治而自癒，如持之以恆，則平安無災，戒之在動，一動生妄，故人君之无妄道即在此。\n\n人有妄必改，則致无妄，今反以藥治之，反成妄矣。故不可試。\n/5&\n\n&6&\n##### 上九：无妄，行有眚，无攸利。\n\n##### 象曰：无妄之行，窮之災也。\n\n此位為卦之極，无妄已至善，人至無妄，又復行，理必過也。過於理，則生妄。\n\n无妄已為極點，今又復加進，乃生妄矣，故窮極而生災也。\n/6&"},"111001":{"text.tab1":"此卦昔神堯，卜得之，果登天位也。\n\n#### 圖\n一鹿一馬，月下有文書，官人憑欄，盆內蒼發茂盛。\n\n**龍潛大壑之課**\n\n**積小成大之象**\n\n#### 雜\n\n**雜卦曰：大畜時也，無妄災也。**\n\n#### 序\n\n**序卦曰：有無妄然後可畜，故受之以大畜。**\n\n無妄則至善，可以積畜，故大畜為序卦。畜為止，又為聚，止而後聚，此卦天至大，而在山中，有所畜至大之象。外止內健為畜象，吾人視萬物外則無欲，即止也。內則運行不斷，必有大積畜於其中。\n\n#### 解\n• 一、一鹿一馬：祿馬交馳，大富之象。\n• 二、月下有文書：明而有往，中秋時節，文書在空中尚未到手。\n• 三、官人憑欄：無事狀，遥望所失之國度。又欄為木，人靠木，休也。棺也。\n• 四、花在盆中：有限也。","text.tab2":"君不見有子為家不顧一切的工作，處處為家著想，甚至放棄婚事亦在所不惜，固然此象不一定在三子身上發生，但大畜卦必現於三子身上。\n• 一、代父之職守，負擔一家之生計。\n• 二、節儉至矣，絕不招待花錢買奢侈品，故頗有積蓄。\n• 三、有婚也短暫，必不足三月而破，比同時生人提前二年結婚。\n• 四、此局不利公職發展，必困於工作，堆積公文如山。\n人言有積乃大，誠不欺人也，許多人在婚前極盡節儉，往往婚後無法忍受妻子之奢侈浪費，終致離婚，故積的觀念產生在自己身上而不自覺，乃致婚後，硬要加諸於對方身上，終於破裂，吾人當於始時，即已察覺知曉，方不愧為習易之人。","text.tab3":"&0&\n**大畜：利貞，不家食，吉，利涉大川。**\n大畜於人亦同，人之畜在學術道德充積於內，乃至大之畜，若為邪端異説畜又何用？今人重大畜於錢財，不重視學術修養，所畜何用？不為大畜。\n/0&\n\n#### 彖\n\n**彖曰：大畜剛健，篤實輝光，日新其德。**\n人须能剛健篤實，其畜乃大，又因充實而光辉，德必日新。\n\n剛上而尚賢，能止健，大正也。\n居尊位能剛明用賢，又能持之永恆，此大正之道。今之君王剛而不明，用人乃因私慾，而不以賢能為基準，故非大正之道。\n\n不家食吉，養賢也；利涉大川，應乎天也。\n大畜學術道德之人，施其所畜，利於天下，因而不在家食，乃吉。能涉大川而無險，乃應乎天地也。\n\n#### 象\n\n**象曰：天在山中，大畜，君子以多識前言往行，以畜其德。**\n君子觀天之至大而畜山中，故知人之能畜大，乃由學而大，學之道在多聞古聖賢之言行，取長為己用，察言以求其內心，乃大畜之真義。\n\n&1&\n##### 初九：有厲，利己。\n\n##### 象曰：有厲利己，不犯災也。\n\n初爻為陽剛，必上進不已，則有危厲，此時，利在己之畜而不進，待與上合志乃動。\n\n此即不度局勢而進，不利己，乃災至。戒不可犯危而行。\n/1&\n\n&2&\n##### 九二：輿説輹。\n\n##### 象曰：輿説輹，中无尤也。\n\n二為六五位所對應，雖陽剛但亦不可力進，進則如車輪脱軸，不得行也。\n\n至善為剛中，柔不可過柔，因位居下，仍不足以進。易之道，乃知所進退也。\n忌不可持才之健，而忘戒備與謹慎也。\n/2&\n\n&3&\n##### 九三：良馬逐，利艱貞，曰閑輿衛，利有攸往。\n\n##### 象曰：利有攸往，上合志也。\n因能與上合志，故往而利也。\n\n三為相位，以剛健之才，能與上位合志而同進，就如良馬之馳，速也。唯雖速，但須切\n/3&\n\n&4&\n##### 六四：童牛之牿，元吉。\n\n##### 象曰：六四元吉，有喜也。\n\n此言近君位之人，须上畜止人君之邪心，下畜止天下之惡。凡人之惡能止於初始，則易如童牛加桎梏。俟惡盛而後禁，必相隔而難勝。\n故聖人止惡於初。\n\n大畜之道在止惡於初，此大善而吉，必能不勞而易治。\n/4&\n\n&5&\n##### 六五：豶豕之牙，吉。\n\n##### 象曰：六五之吉，有慶也。\n\n豬之去勢，則雖有牙，而剛躁必自止。君子體之，知天下之惡，不可力制之，須査其根本，不靠刑法嚴峻而能止惡。聖人教修政教，使人人足用，知廉恥之心，方為至善。\n\n在上者止惡有道，乃天下福慶也。反用強力嚴刑與民為敵，傷又無功矣。\n/5&\n\n&6&\n##### 上九：何天之衢，亨。\n\n##### 象曰：何天之衢，道大行也。\n\n大畜之道，能如行空中，橫行無阻，必散之天下，吉也。\n\n道路空曠，而能大行，乃大畜之極也。\n/6&"},"100001":{"text.tab1":"此卦張騫尋黄河源，卜得之，乃知登天位也。\n\n#### 圖\n雨下，三小兒，日當天，香案，金紫官人引一人。\n\n#### 雜\n\n**雜卦曰：頤養正也。**\n\n#### 序\n\n**序卦曰：物畜然後可養，故受之以頤。頤者，養也。**\n\n龍隱清潭之課 遷善遠惡之象萬物畜聚之後，必有所養，無養不成，故頤者，養也，次大畜之序卦。上艮下震，乃上止而下動，外實中虛象，如人頷頤物於口中象。人之口所以飲食，乃能養人之身，此為頤。此論頤養之道，大至於天地養萬物，聖人養賢，人之養生，養形，養德，養人，養才，皆屬頤養之道。\n\n#### 解\n• 一、雨下：受恩澤也。\n• 二、三小兒：乃合心之象，有德之國也。\n• 三、日當天：君明之象。父全。\n• 四、香案：求取之象。\n• 五、金紫官人：天子身側之人。\n• 六、引一人：提攜，推薦也。","text.tab2":"頤有飲食養身之意，如何養人？如何養正？如何知養之正確與否？何時可養？這些零碎復雜的問題，如要一一解釋，不一定全部都能知道瞭解，八卦之入宅變局，就是取自然頤養之道，使萌生之始念，由己之所需要，人之性在其認為極需要之時，你提供所需方可真正受用，如果他本身不想要，即令是你的親人也無法改變他，只造成熱臉貼到冷屁股的結果。故吾人能參透易經，用陽宅方式，自然而然的大幅改變，其本人而不自知，相信是最有效的方法。此卦現則可見：\n• 一、少年得志，早來興發之象。\n• 二、身體健康平安，故同時生人如身體差，吾人可利用此局來化解，協助他吸取自然之精華，並能包含其情緒在內。\n• 三、婚姻當較同時生人提前五年，有早婚之傾向。\n• 四、如不經吾同道之人指點（屬易派象術宗），自然居此，有時甚至於為其他風水地理師所改，皆主同父異母之人，反觀之，為同父異母之人，卻居此局中，屢見不鮮。","text.tab3":"&0&\n**頤：貞吉，觀頤，自求口實。**\n頤之養人，君子觀之，自求口實之道，乃養君子。口不實又不知養，小人。\n/0&\n\n#### 彖\n\n**彖曰：頤，貞吉，養正則吉也，觀頤，觀其所養也，自求口實，觀其自養也。天地養萬物，聖人養賢以及萬民，頤之時大矣哉！**\n吾人所養之人及養生之道，皆不外自求口實，皆以正則吉。聖人養賢，使之為天位，使之食天祿，為求賢才施惠於天下。此養賢即養萬民也。\n\n#### 象\n\n**象曰：山下有雷，頤。君子以慎言語，節飲食。**\n以象言，雷震於山下，萬物根動而萌芽，此天地養之象。君子知口所以養身，故慎言語以養其德，節制飲食以養身。\n\n&1&\n##### 初九：舍爾靈龜，觀我朵頤，凶。\n\n##### 象曰：觀我朵頤，亦不足貴也。\n\n龜之性，能咽息不食，可以不求養於外，故為靈，即明智，而人口腹之慾既動，則必失所養，故凶。\n\n人之動為慾，即使有剛健之才，再明智，終亦必失，故不足貴也。\n/1&\n\n&2&\n##### 六二：顚頤，拂經，于丘頤，征凶。\n\n##### 象曰：六二征凶，行失類也。\n\n養之道正，在以上養下，天子養天下，養臣子，臣食君祿，皆以上養下。今女不能自處必從男，陰不能獨立必從於陽，此二爻不能自養反求下之陽剛，故為顛倒，拂違常理，故不可行。丘即上九，為在外而高之物，故往而必凶，此即意示人之才不足以自養，見在上位勢足養人，即非同類之君子，妄往求之，取辱必矣。\n\n征而從上，又非其類，故人求非同類，必得凶矣。\n/2&\n\n&3&\n##### 六三：拂頤，貞凶，十年勿用，无攸利。\n\n十為數之終，故終不可用，無所往而利。\n\n邪柔又動之不正，違反頤之正道，故凶。\n/3&\n\n&4&\n##### 六四：顚頤，吉，虎視眈眈，其欲逐逐，无咎。\n\n##### 象曰：十年勿用，道大悖也。\n此戒之終不可用，凡人邪而柔，又欲動，反正道大也，此戒之。\n至矣。\n\n##### 象曰：顚頤之吉，上施光也。\n\n陰柔居大臣之位，陰柔不足以自養，如何養天下？今如與初陽剛相應，而柔順於初陽之賢正，吉。故如己之才不足以養天下，但知求在下之賢而順從之，亦可吉也。但須養其威嚴，眈眈如虎視，以免因己才之陰柔不足養，而受人輕視，造成犯上。但亦須注意所須用者，必逐逐相繼而不缺，若唯取於人又不能繼，困窮\n\n吾人能顛倒求養而又吉者，皆得自陽剛以濟應其事，故能施光明于天下。\n/4&\n\n&5&\n##### 六五：拂經，居貞吉，不可涉大川。\n\n##### 象曰：居貞之吉，順以從上也。\n\n君位乃養人者，但其質如陰柔，即才不足以養天下，而能順從於陽剛（師）之賢，賴其以濟天下，必須有居安篤信之心，全般信賴，則可輔其身，德澤天下，故吉。但此種狀況可依賴賢能之人於平時，不可於有困艱生變故之時，否則招凶。\n\n居上位之吉處，乃因能篤信委任剛賢之人，來養天下。\n/5&\n\n&6&\n##### 上九：由頤，厲吉，利涉大川。\n\n##### 象曰：由頤厲吉，大有慶也。\n\n此以陽剛之德，任師之職，君位從而篤信，天下得養也，但須夕惕若厲，戒慎恐懼，方能濟天下之危，故利涉大川。\n\n若上九之大任能謹言慎行，安居已位，不妄圖權利，則必福慶至矣。\n/6&"},"011110":{"text.tab1":"此卦姜太公釣渭水，卜之，至八十方遇文王。\n\n#### 圖\n官人乘車上，插兩旗，旗上有喜字，入朱門，門外貴人立，文書在地，一合子。\n\n#### 雜\n\n**雜卦曰：大過顛也，姤遇也，柔遇剛也。**\n\n#### 序\n\n**序卦曰：不養則不可動，故受之以大過。**\n\n寒木生花之課 本末俱弱之象頤者，養也，萬物養而後能成，成而後動，動則有過，故大過次頤也。大過乃論過失之大與過人之大事也。舉凡世間事之大過於常者，皆是也，古聖人盡人道非過於理之正，如今之行過乎恭，喪過乎哀，用過乎儉，皆過之也。過人之大事，本不常見，故非常人能為之，如堯舜之襌讓，湯武之放伐，即立不世之功，乃過人之大事。\n\n#### 解\n• 一、官人乘車上插兩旗：車至官來，必有官司訴訟，軍人象。\n• 二、旗上有喜字且分開，乃喜有破損象，捨去婚姻象。\n• 三、入朱鬥：乃豪門世家相請，或朱姓人。\n• 四、門外貴人立：被棄於外象。\n• 五、文書在地：合約，契約，不成之象。\n• 六、一合子：先成後破之象。","text.tab2":"大過之卦，於人事上分二解，一為犯下大過，二為立下大過於常人之功。地脈道比較偏狹，往往見到小妹最早嫁人，也嫁的最好，必為此卦。至於何時為大過，如何用大過之道，其進退之機，讀者可參看人間道部份，此不詳述。\n• 一、比同時生人早婚三年，且嫁夫有長十歲以上之狀況。\n• 二、身進豪門世家，享盡榮華富貴。\n• 三、性過剛，任意而為，婚前婚後都一樣。\n• 四、如婚之對象，年紀相近，必主凶，易破。","text.tab3":"&0&\n**大過：棟橈，利有攸往，亨。**\n小過與大過之分，乃小過為陰過於上下，大過乃陽過於中，上下皆弱，故有棟橈之象。此卦四陽居中，乃棟象，能任重也。即君子盛而小人衰，故利有攸往可亨。\n/0&\n\n#### 彖\n\n**彖曰：大過，大者過也。**\n犯過之大與成大過於人之事。\n\n棟橈，本末弱也。\n本末為陰而中為重陽，故為楝橈。\n\n剛過而中，巽而説行，利有攸往，乃亨。\n雖因陽剛有過，但處不失中道，巽順和悦，無以私心，必利攸往，所以亨。\n\n大過之時大矣哉！\n人能立非常之大事，立不世之大功，乃真大過，處之時得宜乃大哉。\n\n#### 象\n\n**象曰：澤滅木，大過。君子以獨立不懼，遯世无悶。**\n澤本潤養於木，今至滅沒於木，此過之甚矣，為天地之象。君子（人才）觀大過之象，以立其大過於人之行，其所以能大過於人者，乃其能獨立不懼，天下誹之亦無動其心，舉世不見\n\n知而不悔，隱世而不憂悶，如此方能自守，此為其能大過於人也。\n\n&1&\n##### 初六：藉用白茅，无咎。\n\n##### 象曰：藉用白茅，柔在下也。\n\n此以陰柔而處卑下，易藉用茅為至薄之物，但用之亦很慎重，此為敬慎之至也，故可以無災。\n\n此示意陰柔而居卑下，過於敬慎之意，此至慎之道。\n/1&\n\n&2&\n##### 九二：枯陽生稊，老夫得其女妻，无不利。\n\n##### 亦能成生育之功。\n\n##### 象曰：老夫女妻，過以相與也。\n\n二為柔位，陽剛居柔，是過剛之人而能以中自處，與柔相濟，其功如老夫之得女妻，則\n\n老夫少妻之配，雖過於常份，但老夫能悦少女，而少女能順老夫，亦無災。\n/2&\n\n&3&\n##### 九三：棟橈，凶。\n\n##### 象曰：棟橈之凶，不可以有輔也。\n\n九三以太過之陽剛自居，又不得中道，此剛過之甚，其動必違和於中，拂逆眾心，故即以棟樑之才，而無人自輔，安能當大過之任乎？故凶。君子居大過之時，立大過之功，非剛柔適中，得人之輔，則不能也。\n\n此即剛強之過，必不能取於人，人亦無法輔之，此其凶也。\n/3&\n\n&4&\n##### 九四：棟隆，吉 ，有它吝。\n\n##### 象曰：棟隆之吉，不橈乎下也。\n\n此近君之位，又當大過之任，以剛處柔則能相濟，是吉也。但如有異志，則剛必失中，此加累於陽剛，雖不致有大害，但亦可吝也。\n\n##### 棟能隆起則吉，不可曲橈就下。\n/4&\n\n&5&\n##### 九五：枯楊生華，老婦得其士夫，无咎无譽。\n\n##### 象曰：枯楊生華，何可久也？老婦士夫，亦可醜也。\n\n君位處大過之時，下無助援，就如枯楊不生根而生外表，其表秀雖可見，但卻無益於枯也。猶如老婦之與士夫，此雖无咎，但非美也，其可醜乎。\n\n枯陽不生根而生華秀之外表，必不能長久。老婦得士夫，必不能成生育之功也。\n/5&\n\n&6&\n##### 上六：過涉滅頂，凶，无咎。\n\n##### 象曰：過涉之凶，不可咎也。\n\n此陰柔又處過之極者，乃小人過之極也，小人之大過，並非能做大過於人之事也，而是過越常理，不體恤危亡，犯險闖禍而已，如涉水而至滅頂，必凶。此自取其辱，无所怨尤。\n\n過涉水以至於溺水，皆咎由自取，無可抱怨也。\n/6&"},"010010":{"text.tab1":"此卦唐玄宗避祿山，卜得之，果身出九重也。\n\n#### 圖\n人在井中，人用繩引出，一牛一鼠，人身虎頭。\n\n**船涉重灘之課**\n\n**外虛中實之象**\n\n#### 雜\n\n**雜卦曰：離上而坎下也。**\n\n#### 序\n\n**序卦曰：物不可以終過，故受之以坎。坎者，陷也。**\n\n大過之後，過至極必陷，坎者，陷也。重坎即重險，險中有險，此卦專論處險之道，如何用險等。\n\n#### 解\n• 一、人在井中：官司，牢獄，陷入險地象。\n• 二、人用繩引出：責人出手相救狀。\n• 三、一牛：勞苦也，春夏凶，秋冬吉，亦肖牛人。\n• 四、一鼠：肖鼠人，陰謀暗害者，暗藏也。\n• 五、人身虎頭：有權威之人，貴人也。","text.tab2":"本坎卦有險之象，位居正北，羅經上是子位，吾人常見四合院宅式，皆坐北向南，入宅後以中心點為準，其正北宮常設祖先牌位，神明所在或大廳所在，不居人，其因就是此位有險，故以神明續之，今人不知，無意之間此局現，則成次子格，可以發現：\n• 一、兒子喜歡冒險，諸如賭博、毒品等舉凡驚險刺激都有興趣。\n• 二、唯肖虎，肖牛人住吉。\n• 三、如此子肖鼠，又成此局，則暗中生害，為禍家人，母親必首當其衝。\n• 四、婚姻較同時生人，延後二年。\n• 五、此格之人，常犯官司，牢獄之災。\n解此局惟水火既濟卦可成，可令其脫胎換骨。","text.tab3":"&0&\n**習坎：有孚，維心亨，行有尚。**\n陽實在中，乃中有孚信，惟心誠正一，則能亨通，俗謂：至誠可以通金石，入水火，有何險難不可亨？故出險之道在於誠一而行，否則常居險中也。\n/0&\n\n#### 彖\n\n**彖曰：習坎，重險也，水流而不盈，行險而不失其信。**\n習有重覆之意，上下皆坎，即險中有險，水流而不盈，即動於險中仍未出險之時，吾人行險须不失其信，乃可吉。\n\n維心亨，乃以剛中也。行有尚，往有功也。\n以剛中之道，抱持至誠之內實，天下何所不通，若止而不行，則常居險中也，故坎險以能行為功。\n\n天險不可升也，地險山川丘陵也，王公設險以守其國。險之時用大矣哉！\n天之險乃因高不可升，地之險為山川丘陵，諸王公觀坎之象，知險不可陵越，故設高牆深地為險，以守其國，保其人民，此用險之時也。人間亦然，凡知人之學，分尊卑，分貴賤，區分小人與君子，皆為用於杜絶災殃，限隔上下，此都是體悟了險之用也。\n\n#### 象\n\n**象曰：水洊至，習坎，君子以常德行，習敎事。**\n水勢就下，由小而大，歷久不變，君子觀坎水之象，取其有常，不變其德性為真。如人之德行常變，則偽也。政治上發令行教，必使民熟於聞，人人皆從之，故有謂三令五申，即此意。\n\n窞，凶。\n&1&\n##### 初六：習坎，入于坎窞\n\n##### 象曰：習坎入坎，失道凶也。\n\n初以陰柔居坎險之下，因無援，處不當，不能出險，唯益陷深而已，故凶。\n\n由險中而加陷入險，乃失正道，加凶。\n/1&\n\n&2&\n##### 九二：坎有險，求小得。\n\n##### 象曰：求小得，未出中也。\n\n二爻位，乃陽陷二陰之中，即至險而有險狀，但其本為剛中之才，故雖未出險，亦可自救，不至於愈險，故君子處艱險而能自得，皆因剛中而已。能剛則有才，能執中則動不失所宜。\n\n此即雖有小得，雖不致於陷險，然亦未能出險狀。\n/2&\n\n&3&\n##### 六三：來之坎坎，險且枕，入于坎富，勿用。\n\n##### 象曰：來之坎坎，終无功也。\n\n六三位在坎險之時，以陰柔居而處不正，走下則入險，向上則重險，故有進與退皆遇險，居又有險，枕乃處不安狀，此時唯戒勿用方是。\n\n以陰柔又處不正，動則唯益險，人出險须有道，如失道，但為能求去，只益增困窮而己。\n/3&\n\n&4&\n##### 六四：樽酒，簋貳，用缶，納約自牖，終无咎。\n\n##### 象曰：樽酒簋貳，剛柔際也。\n\n此言大臣當險難之時，唯有至誠於君，不可停交往，而又能打開使君能明之心，則可保无災。人欲求上之篤信，只有求質實而已，如多禮儀而尚服飾，反凶。一樽之酒，二簋之飯，以瓦缶為器，乃求質實之意。再處明之地以明君之心，如此方能入君心，即令艱險，亦可無咎。自古以來，只求剛直攻訐直言不諱之人，多忤逆君心，而屬温厚明辨者，反而能入君心，改變君主。\n\n但求實質，又剛中有柔，必平安。君臣之交能長久，不外乎誠實而已。\n/4&\n\n&5&\n##### 九五：坎不盈，衹。既平，无咎。\n\n##### 象曰：坎不盈，中未大也。\n\n此即九五之尊，有剛中之才，可以濟險，但下無助，獨依君之力無法濟天下之險，則有咎，必待盈平，方可無咎。\n\n剛中之才得居君位，時天下險難，但未至全險，其未能平險，乃因君臣無法協力相濟之故，故此君道未能救濟天下，乃因無臣，故曰不稱其位。\n/5&\n\n&6&\n##### 上六：係用徽纆，寘于叢棘，三歲不得，凶。\n\n##### 象曰：上六失道，凶三歲也。\n\n此意陰柔而深陷險中，聖人以牢獄比喻，縛以徽纏，囚置於叢棘之中，其不能出，至少三年不可免，其凶如此。\n\n上六以陰柔而處險地，乃因其失道而成。\n其災延三年不得免，意久也。\n/6&"},"101101":{"text.tab1":"此卦朱買臣被妻棄時，卜得之，知身必貴也。\n\n#### 圖\n人在虎背上立，官人執箭在岸上立，水中有船，二人分立兩岸。\n\n#### 雜\n\n**雜卦曰：離上而坎下也。**\n\n#### 序\n\n**序卦曰：陷必有所麗，故受之以離。離者，麗也。**\n\n飛禽在網之課 大明當天之象陷於險難之中，必有所附麗，理之自然，離者麗也。離為火，火體中虛而能明照，故能麗於物而明也。人之明，必經險難，大風大浪過後，其經驗之累積，而後能明，此猶可人。\n今人雖歷災險，但仍不能明，吾人教授易經，其目的即希望世人，不須付出血的代價，亦能明，此中虛之廣義。\n\n#### 解\n• 一、人在虎背上立：行危不懼；難下也。\n• 二、 一船在江心：口舌相爭，無所適從也。\n• 三、官人執箭岸上立：在位之人，欲殺之象。\n<u>此卦夫妻破散成仇，兄弟分家各自為王之課。</u>","text.tab2":"此局常見，離卦本示人中虛為明，今人但以為自己很明，其實一直都沒進步，屢錯不改，茫然不知，皆肇因於不明，易經提出之中虛為明，就是隨時把自己變成空杯子，那才可以真明。家中有女，天生好手，明事理，知進退，必為此局，讀者須注意要知利用此局方是，不知運用，空言易經，吾所不恥。\n• 一、此女必心在遷移外地，不喜在本地。\n• 二、命格上如二十八歲婚，則宅局如此，必然不出二十八歲婚。\n• 三、天生明理而不懼。\n• 四、不守財祿，不重利之人。\n• 五、科甲高中，往往都是第一志願。","text.tab3":"&0&\n**離：利貞，亨，畜牝牛，吉。**\n天下萬物莫不有所麗，其形即麗。人之所麗，必得貞正，得正可以亨通，人能附麗於正，必能順於正道，從善如流為人之性，如牝牛之吉，牛之順道，由養而成，人之順德亦同，既附麗於正道，當有養以成其德也。\n/0&\n\n#### 彖\n\n**彖曰：離，麗也。日月麗乎天，百穀草木麗乎土 。**\n附麗狀，如日月麗於天，百穀草木麗於土 ，天下萬物必有所麗，無麗之物，人必視何麗方正，則能亨通也。\n\n重明以麗乎正，乃化成天下。柔麗乎中正，故亨。是以畜牝牛吉也。\n上下皆離故曰重明，乃意君臣皆有明之能，又處事中正，故可以教化天下成文明之俗也。\n人又能柔順於中正之明德如牝牛之順吉，乃更能將明德發乎光大，襯托明德之麗。\n\n#### 象\n\n**象曰：明兩作離，大人以繼明照于四方。**\n此卦若云兩離，則只見明，而不知繼明之德。君子觀離明相繼之象，知本身之明德能濟天下，為使以明德中正永傳後世，則須有進一步繼明之能，能明於選擇何人能承繼，乃繼明之義。\n如堯之擇舜，漢之蕭規曹隨等即是繼明之用。\n\n&1&\n##### 初九：履錯然，敬之，无咎。\n\n##### 象曰：履錯之敬，以辟咎也。\n\n初爻陽居之，乃言初進有陽剛之才而進又躁動，卻因動之非宜，已失居下位之分而得咎，但因為人才，只須知守義而戒慎之，則不至於有咎。\n\n能知履動之躁進為錯而敬慎之，因居下位，但求避之可也，不致有災。吾人有陽剛之才，仍須有明之能，能剛不能明，則因妄動生災也。\n/1&\n\n&2&\n##### 六二：黃離，元吉。\n\n##### 象曰：黃離元吉，得中道也。\n\n以柔居中乃得正位，黃為中色，人能文明而中正，則美之至極也。又有六五文明之君以順其德，其能明如此，乃大善之吉也。\n\n能成文明乃由中之虛明，故元吉之因，是由其得中之道也。\n/2&\n\n&3&\n##### 九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。\n\n##### 象曰：日昃之離，何可久也。\n\n易有八純卦，唯離為火於人事之義陳述最細。今九三吾人居下卦之終乃意前明將盡，後明當繼之時，人之有始，必有其終，此常道也。\n智慮通達之人，以順理為樂且常持之，如不能如此，則有將盡之悲，而日夜恐於死亡，故君子樂天，小人終日恐懼，此處易論生死之道也。\n\n日已倾，不可久也，能明之人，能求人以繼其事，知退而修其身，則可長久。\n/3&\n\n&4&\n##### 九四：突如、其來如、焚如、死如、棄如。\n\n##### 象曰：突如其來如，无所容也。\n\n九四位，乃言繼明之初，承繼之意，但陽爻居之，有剛躁但不失中正之意，此非善繼者，能知善繼之人，始繼必有謙讓之誠，知順承前賢之道。今突如其來，已失善繼，又剛勢凌主，氣焰高張故焚如，必招禍害致死，故死如，以眾所棄之，故果為棄如。\n\n諸君試想，人之凌其君，而不順所承繼之前賢，必眾棄，天下不容也。\n/4&\n\n&5&\n##### 六五：出涕沱若，戚嗟若，吉。\n\n##### 象曰：六五之士，離王公也。\n\n出涕戚嗟，皆形容人憂懼至深。君位以陰柔之才居之，又受於陽剛之在左右，此居尊位之明，能知憂且畏，故能吉。今若自持己才之不足，全然不知懼，必不能得其吉也。\n\n居上位之吉，乃在明察事理，且以畏懼憂慮之心以持之，可以為吉也。\n/5&\n\n&6&\n##### 上九：王用出征，有嘉。折首，獲匪其醜，无咎。\n\n##### 象曰：王用出征，以正邦也。\n\n陽剛之才居離之終，有剛明至極之狀。此方式乃適用之於君王出征時，明則足以察邪惡，剛則能斷事，施以威行，如此則能去天下之邪惡，此有功也。世上事至刑不足以阻時，必用征伐方法解決，此之時也。去天下之邪惡，如明斷之極，則必無所宽宥，此時必取其魁首，始作俑者方是，趕盡誅滅，必有暴殘之後悔也。\n\n君王用此德，則能治其邦國，此剛明至上之道也。\n/6&"},"001110":{"text.tab1":"此卦漢王昭君，卜得之，知和番不回也。\n\n#### 圖\n空中有一拳，錢寶一堆，貴人在山頂，女人上山，一合子。\n\n**山澤通氣之課**\n\n**至誠感神之象**\n\n#### 雜\n\n**雜卦曰：咸速也，恆久也。**\n\n#### 序\n\n**序卦曰：有天地，然後有萬物。有萬物，然後有男女。有男女，然後有夫婦。有夫婦，然後有父子。有父子，然後有君臣。有君臣，然後有上下。有上下，然後禮義有所錯。**\n\n易經上經乃論天地萬物之本，有天地後有萬物，聖人觀其間象，以巨視之角度來體察出天道。咸卦之始，為易經下經，其論夫婦人倫之始，較重於人道。咸之為卦，兌上艮下，乃少女少男之意，表示世上男女相感之深，莫過於少男少女，童稚之間無隔閡，人人皆以平常心處之，男女相悦又無所求，互相以誠及悦相處對應，此時之感，即咸之深意。\n\n#### 解\n• 一、空中有一拳：貴人提拔，憑空而得。\n• 二、錢寶一堆：求財得財。\n• 三、貴人在山頂：孤立狀，即將下坡，退休狀。\n• 四、女人上山：夫妻吉，陰人卜之知走馬上任。\n• 五、合子：先成後破，因誠感方吉，物感必凶。","text.tab2":"此卦局過去常見，今人不多，但讀者亦明瞭，其變化如後：\n• 一、婚成於媒妁之言，並非自由戀愛。\n• 二、婚事先成後破，凶。\n• 三、對象必為豪門世家，比同時生人早一年婚，逢單歲婚。\n• 四、財祿事業順利，工作野心大，但科甲不興。","text.tab3":"&0&\n**咸：亨，利，貞，取女吉。**\n咸，感也，舉凡君臣上下，夫婦、父子等皆有感之道，人人能以少男少女之童悦相感以誠悦，即以平常心相待，則必有亨通之理。今人皆以媚説，上下之位處以邪僻，皆感之不正也。\n艮為止，澤為悦，乃外悦內止之意，以此之意近女，乃得正而吉也。\n/0&\n\n#### 彖\n\n**彖曰：咸，感也，柔上而剛下，二氣感應以相與，止而説，男下女，是以亨利貞，取女吉也。**\n陰陽相交，乃男女相感之義同，男女之交，男以篤實至誠之心，女以喜悦之心相應，此男女之感於正道，故能亨通得正。\n\n天地感而萬物化生，聖人感人心而天下和平，觀其所感，而天地萬物之情可見矣。\n感之道到極限時，聖人能以至誠之心感億兆人之心，使天下和平，其情之偉大可見，但須知感通之理，須以默而觀之，不可道破，此感方可久矣。\n\n#### 象\n\n**象曰：山上有澤，咸；君子以虛受人。**\n澤在山上有渐潤通澈狀，此感之道。君子觀山澤通氣知須虛其中方能受人，凡人之心能中虛必可受，實則不能入矣。\n\n&1&\n##### 初六：咸其拇。\n\n##### 象曰：咸其拇，志在外也。\n\n初與四相感，初之時感必未深，不能動人，如拇指之動，不可進也，須識勢而為。\n\n感應之志雖動，但未大，不足以進。初志之感與四相應，故曰在外。\n/1&\n\n&2&\n##### 六二：咸其腓，凶，居吉。\n\n##### 象曰：雖凶，居吉，順不害也。\n\n腓，足肚也，人之動，足必先行，足肚自動也。二位無法守道而妄求於上，故凶。進退之道乃安居其位，以待上求，此吉也。\n\n陰居二位，其得位中正，在咸之時，因質本柔，必戒以先動，求之必凶，守居不動吉。\n/2&\n\n&3&\n##### 九三：咸其股，執其隨，往吝。\n\n##### 象曰：咸其股，亦不處也，志在隨人，所執下也。\n\n股在身之下，足之上，不能自主，隨身而動。九三陽剛之才，感於所動而隨其動，如此已失其正道，其動必羞也。\n\n人有陽剛之質，卻又不能自主，反隨於人而動，此所執者必卑賤甚也。\n/3&\n\n&4&\n##### 九四：貞吉，悔亡，憧憧往來，朋從爾思。\n\n##### 所生處。\n\n人之所動皆因感也，九四在中，乃當心臓之位，為心感之主，感之正則吉，不正則凶。\n今人以私心感人，所感狹小也。天地萬物各有不同，事亦變化萬千，能殊途同歸，此感之極至，必以公正無私方可行。人之向往，必有屈求，人之來至，必因有信，此屈信相感，利之\n\n##### 象曰：貞吉悔亡，未感害也。憧憧往來，未光大也。\n人能正則必吉，事皆以私，則生害也，互相往來以私心相感，此感之道狹，必未光大也。\n/4&\n\n&5&\n##### 九五：咸其脢，无悔。\n\n##### 象曰：咸其脢，志未也。\n\n居尊位之人，必以至誠感於天下，脢，背肉也，其與心相背，目所不見狀，此意能背其私心，感於非所見而能悦者，以人君可以無悔。\n今人不知，皆感於所見而悦，所不見而仇視之，此感不正，招自凶亡也。\n\n人感於所不見而生戒，其必淺也，此私心之用也。\n/5&\n\n&6&\n##### 上六：咸其輔，頰，舌。\n\n##### 象曰：咸其輔頰舌，滕口説也。\n\n上為感之極位，陰柔居之，此即不能以至誠感物，唯求於口舌之間感人，乃小人女子之常態，必不能動於人，故云頰。\n\n世間唯至誠能感人，如靠口舌説話之才，感人必不能長久。\n/6&"},"011100":{"text.tab1":"此卦宋王奪韓朋妻，卜，得之也。\n\n#### 圖\n日在雲，鳳啣書，官人行路，道士手指門，鼠下兩口，牆擋路。\n\n**日月常明之課**\n\n**四時不沒之象**\n\n#### 雜\n\n**雜卦曰：咸速也，恆久也。**\n\n#### 序\n\n**序卦曰：夫婦之道，不可以不久也，故受之以恆。恆者，久也。**\n\n恆，乃論夫妻之道，終身不變者，前『咸』為少女少男之感，今『恆』乃長男長女之往，男尊在上，女卑在下，此夫婦居室之道，男動於外，女順於內，此人倫之常，此恆久之道。\n\n#### 解\n• 一、日在雲中：昏暗之象，君主不明象。\n• 二、鳳啣書：喜訊至，金榜题名也。\n• 三、官人行路：將至也，貴人至。官人，倌人，丈夫也，人傍為倌也。\n• 四、道士手指鬥：入空門也，閃也。\n• 五、鼠下兩口：陰謀在後之象；兩口，回也，呂姓也。\n• 六、時機：在春末，日為春之末尾也。\n<u>此即持之以恆，則有撥雲見日之喜也。</u>","text.tab2":"今人最常見此局，化解局式，如雷地豫卦等都吉。\n• 一、易從宗教信仰，但不是正道之宗教。\n• 二、比同時生人晚婚一年。\n• 三、智慧被壓抑，常不知取捨，失去堅持。\n• 四、肖鼠人有吉，陰謀不生。\n• 五、官運不佳，商場不順，惟科甲旺，利教職自由業人。","text.tab3":"&0&\n**恆：亨，无咎，利貞，利有攸往。**\n恆為常久之道，人能恆之於善，此道可恆，君子之道。小人之道，乃恆於惡，已失可恆之道，故恆之道能常久，乃因所恆為正，恆不正，招凶也。\n/0&\n\n#### 彖\n\n**彖曰：恆，久也。剛上而柔下，雷風相與，巽而動，剛柔皆應，恆。**\n恆久之道，在於上剛下柔，君剛臣柔，夫剛婦柔，雷震風興，風中有雷，相互交應，助長其勢，天地之間能恆久不已，乃因能知順動而已。\n恆，亨，无咎，利貞，久於其道也。\n恆之道，可以令亨通，且無災，但須注意所恆為正，吉也，所恆不正，則反招辱。\n\n天地之道，恆久而不已也。\n人如能恆持可恆之道，則合於天地之理。必可長久。\n\n利有攸往，終則有始也。\n萬物之動，必有始終，今動而能恆，其間變化必多，能知隨時變易其外，神在內不變，此得易之神也。\n\n日月得天而能久照，四時變化而能久成，聖人久於其道而天下化成，觀其所恆，而天地萬物之情可見矣。\n\n日月得天之道，能久照不已，四時往来生成萬物，也因得天，故常久不已，聖人用恆之道，行之不已，能化成天下，成其美俗。觀天地之恆常，得天下常久之理，此聖人之道所以能常久也。常人孰能知。\n\n#### 象\n\n**象曰：雷風，恆；君子以立不易方。**\n人才君子觀恆之象，以恆久之德性，持立於中道，永不易其立足之道。\n\n&1&\n##### 初六：浚恆，貞凶，无攸利。\n\n##### 象曰：浚恆之凶，始求深也。\n\n初六以柔暗之人初進，只知守常卻不度勢而為，但求上之眷顧，又堅守此向，致凶之道也。因其心志在求上眷顧，必不能安居其位，故凶也。\n\n但求上之眷顧，不知度勢而行，安居其位，失恆之道於始也。\n/1&\n\n&2&\n##### 九二：悔亡。\n\n##### 悔。人能知所輕重，易之義即此。\n\n恆能居其正位，常道也。今陽居陰位，處非其位，雖中正之才，不知輕重之勢，造成有\n\n##### 象曰：九二悔亡，能久中也。\n/2&\n\n&3&\n##### 九三：不恆其德，或承之羞，貞吝。\n\n##### 象曰：不恆其德，无所容也。\n\n人能知恆久於中道，知所輕重，必可常久。\n\n得位乃可久，但於須持久時不知持之以恆，朝令夕改，人無所適從，反招羞辱矣。\n/3&\n\n&4&\n##### 九四：田无禽。\n\n不知恆之道的人，終至無處容身也。\n\n##### 象曰：久非其位，安得禽也。\n\n田獵又無獲禽，徙勞無功也，九四陰位而陽居之，處非其所，恆又何益？人之動必有道，持之以恆則有功，不得道，即久亦無功也。\n\n處不適位，雖久何益，猶徙獵而無功。\n/4&\n\n&5&\n##### 六五：恆其德，貞，婦人吉 ，夫子凶。\n\n##### 象曰：婦人貞吉，從一而終也，夫子制義，從婦凶也。\n\n柔居剛位，又得九二之陽剛助應，此即居中正又有應乎中正，恆此以久，吉之道。婦人之道以順從為恆，此順從於婦人則吉，丈夫為剛陽，如以順從之道持恆，反致凶也。更何沉人君之道，君道切不以柔順為恆也。\n\n柔而順從於婦人則吉，乃從一而終也，君王之義，從婦人之順從，招凶。\n/5&\n\n&6&\n##### 上六：振恆，凶。\n\n##### 象曰：振恆在上，大无功也。\n\n此恆之極位，乃振恆，即守之不常也，居上而動無節宜，再以此為恆，凶至也。故吾人動之必以正理，不逾矩，動如失正，又不及復，反持恆下去，果致凶矣。\n\n居上之道，躁動不安，必無所成，此言持恆，知恆，用恆之重要性，人不知此即，令再大之勞亦無功也。\n/6&"},"001111":{"text.tab1":"此孟嘗君進白狐裘，夜渡函谷關，卜得知，果脱身也。\n\n#### 圖\n一山，一水，酒旗上文字，官人踏龜，月半雲中，幞頭上樹，樹下人獨酌。\n\n#### 雜\n\n**雜卦曰：大壯則止，遯則退也。**\n\n#### 序\n\n**序卦曰：物不可以久居其所，故受之以遯。遯者，退也。**\n\n豹隱南山之課 守道去惡之象恆者，久也，久不動則有去意，遯乃退也，故遯所以繼恆也，此卦天下有山，天陽向上，物雖上陵但止而不進，以陰陽之道論，二陰居下有上進之勢，陽將消退，故此時乃論小人渐盛，君子退避之時，此遯之義也。\n\n#### 解\n• 一、一山：阻也。\n• 二、一水：險也。\n• 三、酒旗上文字：酒為忘憂之物，文在旗上，受人提攜也。\n• 四、官人踏龜：歸，鬼也；玄武自來，水上求財。\n• 五、幞頭上樹：求去辭官也。\n• 六、月在雲中：主半清半濁象，事未明晰。\n• 七、人在水邊：等待平安狀，蒞臨也。\n• 八、樹下人獨酌：休也，無事也，萌生退意狀。","text.tab2":"吾人常見一家之主終日唉聲嘆氣，中年即無斡勁，且工作上付出勞力很多，卻往往功給他人，仕途原地踏步，毫無進展，必為此卦而所約束也。\n• 一、萌生退意，肇因於該升不升，有無力感\n• 二、夫妻感情退化，終致離婚。\n• 三、事事回歸原地，必須重新出發。\n• 四、身體亦有退化現象，中年即得老年病。","text.tab3":"&0&\n**遞：亨，小利貞。**\n遯，乃君子潛藏之時，君子退而伸其道，人退道不屈，則可亨，雖無大力，但仍有小吉，因知時避退，此善之道也。\n/0&\n\n#### 彖\n\n**彖曰：遯亨，遯而亨也。剛當位而應，與時行也。**\n君子處遯之道，知退生吉，退所以為伸道。故雖退之時，君子處之，未必真遯，當隨時消息，有可以致力，當不避之，以扶持其道，並非於遯時，藏而不為也。\n\n小利貞，浸而長也，遯之時義大矣哉！\n小人之道長時，不可求大功，但利於小功，君子之人能察於其微，始即深以戒之，退而伸道，不使道消，此處遯之時意義之大處也。\n\n#### 象\n\n**象曰：天下有山，遯；君子以遠小人，不惡而嚴。**\n山在天下，由下起而上止，天上進分之相違，此遯之象，因違和而須遯。君子遠小人之道，若以惡聲厲色，只增其怨忿而已，唯用莊嚴威色，使其敬畏，小人自然遠矣。\n\n遯尾，厲，勿用有攸往。\n&1&\n##### 初六：遯\n\n遯尾之厲，不往何災也。\n##### 象曰：遯\n\n因遯本即退去，故初爻為往退之初，反為其尾，此時以柔處遯，不可往，往則有災。\n\n退處之時，居於尾者，此危也，唯晦藏於下或末端，可得吉，因往有晦不若不往，故晦藏可免災也。\n/1&\n\n&2&\n##### 六二：執之用黃牛之革，莫之勝説。\n\n##### 象曰：執用黃牛，固志也。\n\n二與五位相應，居正而相親合，其交之堅，若牛革之繋，不可言語。\n\n二與五位用中正之道相結，且堅心其志，猶牛革之堅也。\n可無咎，古之前例多矣。\n/2&\n\n&3&\n##### 九三：係遯，有疾厲，畜臣妾，吉。\n遯退之道，其貴在速及遠，如有事累，則不速，於遯時則有危也。此爻即言，人之親，若以女子小人而言，其皆懷恩而不知義，親愛之則忠，犯錯而嚴厲時，則生暗害，此小人之道。然君子之道非如是，待之以正，即令有拖累亦不有災，如君王有危而不棄黎民，雖危亦\n\n##### 象曰：係遯之厲，有疾憊也，畜臣妾吉，不可大事也。\n/3&\n\n&4&\n##### 九四：好遯，君子吉，小人否。\n\n##### 象曰：君子好遯，小人否也。\n\n君子之人亦有所好，處退之時，必去而不疑，以道來制欲，故為吉，而小人反之，其不能以義處之，唯私慾之所好，即令身陷亦不能自制，故於小人則否。故君子必易出難進，小人則易進難出。\n\n君子知時而退不疑，小人則無法克制私慾，以至於凶也。\n/4&\n\n&5&\n##### 九五：嘉遯，貞吉。\n\n##### 象曰：嘉遯貞吉，以正志也。\n\n君王處得中道，動靜間必以時，故嘉美，終吉。今人卻動靜皆以私慾，表裡不一，不以中正之道處，知進不知退，此凶也。\n\n內心正則動必正，此退之美也，今人不以退為美，只動之以欲，因志不正也。\n/5&\n\n&6&\n##### 上九：肥遯，无不利。\n\n##### 象曰：肥遯无不利，无所疑也。\n\n此退之極致，退求遠且無累於他人，此退之有餘，無往不利矣。今人即令退，亦追求有所牽累他人，其動不正，唯自苦而已，小人自招之累也。\n\n退之求其遠，且無所拖累，此退之道至極，必無不利。且剛決而不疑，君子之遯道，雖退，因得道，卻能無往不利。\n\n係遯之道，於養臣妾親暱人時可吉，但不可以擔當大事，待人取中正之道，不以私心而生偏，取諸於公，則可行大事矣。\n/6&"},"111100":{"text.tab1":"此卦唐玄宗避安祿山亂，卜得之，乃知不久亨通也。\n\n#### 圖\n北斗星，天神執劍，一官人燒香拜，一猴，一兔，一犬。\n\n**羝羊觸藩之課**\n\n**先曲後順之象**\n\n#### 雜\n\n**雜卦曰：大壯則止，遯則退也。**\n\n#### 序\n\n**序卦曰：物不可以終遯，故受之以大壯。**\n\n君子之退而伸道，多數君子之退且聚合，而成大壯之勢，壯有進且盛義，陽剛而震動此以剛而動，乃大壯之象，猶雷威震在天上也。\n\n#### 解\n• 一、北斗星：帝君，老闆，主事之人。\n• 二、天神執劍：民意歸向，人心也。\n• 三、一官人燒香拜：拜求於天，而不求人，凶。\n• 四、一猴、一兔、一犬：侯，劉，狄姓，在野之人。\n• 五、猴回頭：回吼。\n• 六、兔回頭：回吐。\n• 七、羊回頭：回陽。\n<u>此卦示意過剛必招凶，而猴、羊、兔為三貴人，和中近易為處之道。</u>","text.tab2":"此卦局也常見不鮮，吾人須知何局為大壯局，如何利用大壯局，何時可用大壯為最利。何時須離開此局。\n• 一、性剛為一家之主，有越居父位之象。\n• 二、家庭責任感重。\n• 三、不婚，與同時生人不同。\n• 四、如有婚，必為猴，兔，犬三肖屬之人，但常不足三月婚破。\n• 五、事業獨立自主，自由業人可為一方之主，聲名遠播。","text.tab3":"&0&\n**大壯：利，貞。**\n大壯之道利在正，理正而勢正，如不得正而壯，只強猛無理而已，非君子之壯。\n/0&\n\n#### 彖\n\n**彖曰：大壯，大者壯也，剛以動，故壯。**\n大且壯為大壯，乾之至剛而動，外動內剛狀，名壯。\n\n大壯利貞，大者正也。正大而天地之情可見矣。\n天地之道可運行而長久，乃至大至正始然也，此道之至大能如是。\n\n#### 象\n\n**象曰：雷在天上，大壯，君子以非禮弗履。**\n君子觀雷震威在天，此之壯大，而行大壯之道，知唯克己復禮最大。能自勝之人為天地之最壯者，能赴湯蹈火，此唯武夫之勇也。君子能和而不流，大立而不倚。\n\n&1&\n##### 初九：壯於趾，征凶，有孚。\n\n##### 象曰：壯於趾，其孚窮也。\n\n初爻在下，而陽剛居之，乃初進而用壯，必凶，吾人居上用壯，猶須正方可行，初進而剛壯，必招凶辱。\n\n在下位而用壯，即令行可信，亦必招窮困阻滯也。\n/1&\n\n&2&\n##### 九二：貞吉。\n\n##### 象曰：九二貞吉，以中也。\n\n二位屬陰位，陽剛居之，乃示人剛柔得中也，人能識得時義之輕重，則必吉。\n\n能得中正，而堅持守之，也吉乎，此意中而不失正。今人中立而為己，已失正道，猶牆頭之草，可嘆也。\n/2&\n\n&3&\n##### 九三：小人用壯，君子用罔。貞厲，羝羊觸藩，羸其角。\n\n##### 象曰：小人用壯，君子罔也。\n\n小人尚力，只用其壯勇，而君子用罔，因其志剛，無視於非正之事，無所忌憚也。萬物莫不用其壯，猶羊之壯於首角，一遇藩籬，亦受困也，故用壯，不可強力進，須持之正道，無忌憚於邪吝，方為真罔。\n\n小人用其強壯之武力，終困，君子志氣剛強，無視邪惡，無所忌憚。\n/3&\n\n&4&\n##### 九四：貞吉，悔亡，藩決不羸，壯于大輿之複。\n\n##### 象曰：藩決不羸，尚往也。\n\n時方道之長盛時，如有小失，則必害進之勢，猶大車其輪軸必壯，乃利於行，如輪軸不強，以致大車之不行也，有如藩籬之決開而不復其困也。\n\n四位未至極，以當盛之陽，又用壯以進，無能阻之，即令藩籬隔而不困其力也。\n/4&\n\n&5&\n##### 六五：喪羊于易，无悔。\n\n##### 象曰：喪羊于易，位不當也。\n\n羊性喜群行又互觸其角，猶諸陽並行，如以力制，則必難勝有悔，唯其平和得之，則無所用其剛，使其壯失於和易之道，可以無悔。\n\n柔居尊位，位不當也，猶人君之勢不足，下又壯進，才有所謂『治壯之道』\n，治壯之道不可用剛，須以平易近人待之，可化壯也。\n/5&\n\n&6&\n##### 上六：羝羊觸藩，不能退，不能遂，无攸利，艱則吉。\n陰柔又處壯極，猶羊角之觸藩，進退不得，必無所往也，陰柔處壯時，一遇艱困，必不能守，往即凶也。吾人須居艱困時而處柔，必吉。\n此壯之極，須變義也。\n\n艱則吉，咎不長也。\n此因自處不詳不慎，以致進退不能也。以柔處艱時，即有咎，亦不長久。\n\n##### 象曰：不能退，不能遂，不詳也。\n/6&"},"000101":{"text.tab1":"此卦昔司馬進策，卜得之，後果為丞相。\n\n#### 圖\n文字破，官人掩面，毬在泥上，雞啣秤，枯木生花，鹿啣書，一堆金寶。\n\n#### 雜\n\n**雜卦曰：晉晝也，明夷誅也。**\n\n#### 序\n\n**序卦曰：物不可以終壯，故受之以晉。晉者，進也。**\n\n龍劍入匣之課 以臣遇君之象繼壯盛之後，則必進，晉，進也，明出於地，升而明，故晉，此論進之道，離，中虛為明，乃明出於地上也。\n\n#### 解\n• 一、文字破：官事不成，退位象。\n• 二、官人掩面：無顏見人，悲象。\n• 三、毬在泥上：所求必陷險也。\n• 四、雞啣秤：雞，酉也，肖雞人也，落日之象。秤：示公平，稱心也。\n• 五、枯木生花：晚發也。\n• 六、鹿啣書：祿與命到也。\n• 七、一堆金寶：財祿豐收之象，占疾厄，則有焚金紙之象。主喪服，二人去一也。\n• 八、人立水邊：恐泣之象，主喪服。\n• 九、三點在石上：心象，示人心在石上，不動念，堅心也。","text.tab2":"此局之現，讀者可以立判出。\n• 一、性柔有母愛之人。\n• 二、婚姻常晚，約四十歲以後。\n• 三、守財不花，性極節省之人。\n• 四、偏房之人，同時生人有婚為正房。\n• 五、婚嫁對象若肖雞，則大吉，但大年長多多。","text.tab3":"&0&\n**晉：康侯用錫馬蕃庶，晝日三接。**\n有能治安之諸侯，名康侯，其因能明，下體順附，承王之象，則見眾多之馬駕，有重賜，乃寵遇之至也，此上明下順，乃進盛之時。\n/0&\n\n#### 彖\n\n**彖曰：晉，進也。明出地上，順而麗乎大明，柔進而上行，是以康侯用錫馬蕃庶，晝日三接也。**\n晉乃明進而盛，此外明內順，故能包明至大明，如順德之良臣，附麗於明主也。柔居君位，能明而順，上附於君，下順於民，故為康侯，此為諸侯之道也。\n\n#### 象\n\n**象曰：明出地上，晉，君子以自昭明德。**\n君子觀明出地上，近明為晉，故知惟昭明德於已，求己之明且有德，為晉之道。\n\n&1&\n##### 初六：晉如摧如，貞吉，罔孚，裕无咎。\n\n##### 象曰：晉如摧如，獨行正也。裕无咎，未受命也。\n\n初爻乃晉之始時，始進而求快升，必不遂其意，因上位未能遽信，必當自守安位，寬裕不求，以待上位之信方可。小人始進而求上信，則必傷於義，皆招咎悔。此君子方知進退之道。\n\n進退之間，惟君子能獨行正道，唯義之所趨，方可出仕，未受命時，皆寬裕無求。若能信於上，忠職守，卻反失去職務，則君子一日不居，必退而遠之。\n/1&\n\n&2&\n##### 六二：晉如愁如，貞吉。受茲介福，于其王母。\n\n##### 象曰：受茲介福，以中正也。\n\n進退之間守正道，當吉，二爻之位雖無援，因能守正，日久彰顯，自得上六五君位之人相應，上位自當求之，因德同也。\n\n雖居下位之人，能永持中正之道，久必有亨。更加有明君在上，雖位遠，但必因同德受福。\n/2&\n\n&3&\n##### 六三：眾允，悔亡。\n\n##### 象曰：眾允之志，上行也。\n\n柔居剛位，又不中正，此乃居不適位時，必有悔咎，惟居此時，能明謀從眾，順應天心，吉。\n\n能順從眾志，居下位之上，又上從明君，合於眾志。\n/3&\n\n&4&\n##### 九四：晉如鼫鼠，貞厲。\n\n##### 象曰：鼫鼠貞厲，位不當也。\n\n陽剛居陰位，非適其位而居之，乃貪據其位，貪而畏人者，範鼠也，近君之位又不適，下位又求上進，居此時生畏忌之心，必生危矣。\n\n不正又居高位，時懷貪而懼失之心，堅守此不放，招危險也。\n/4&\n\n&5&\n##### 六五：悔亡，失得勿恤，往吉，无不利。\n\n##### 象曰：失得勿恤，往有慶也。\n\n柔居尊位，乃不正位，本凶。但用大明之德而上下皆附順，故反吉。因下之順附，必能盡誠委任眾人之才，以濟天下。明君不患其不能明照，患其用明之過於察察，有失委任之道，自任其明而以私意偏任，天下必無法為公。\n\n有明明之君，下又上附順，能推誠委任，必能成天下之大功，往必有福也。\n/5&\n\n&6&\n##### 上九：晉其角，維用伐邑，厲吉，无咎，貞咎。\n\n##### 象曰：維用伐邑，道未光也。\n\n陽剛又居最上，如角之象，此言進之極，過剛則易失於躁急，本剛又急於求進，必有失也。此惟有用於治內(伐邑〕可以無患。但如用其治外，反凶。觀人之自治，能剛之人守道必固，求進燥急之人必遷善益速，唯須合中正之道，可無咎。\n\n盡善之道，能安內攘外，今維用伐邑，能治內不能治外，其道未光大也。\n/6&"},"101000":{"text.tab1":"此卦是文王囚姜里，見子不至，卜得知，果子歿也。\n\n#### 圖\n婦人在井中，虎在井上，錢破，人逐鹿，堠上有工尺，珠聚。\n\n#### 雜\n\n**雜卦曰：晉晝也，明夷誅也。**\n\n#### 序\n\n**序卦曰：進必有所傷，故受之以明夷。夷者，傷也。**\n\n鳳凰重翼之課 出明入暗之象物進不已，必有所傷，故明夷為序卦，夷者，傷也，此卦坤上離下，乃明入地中之象，為晉之反卦，故義亦反，晉為明且盛，上明君下群賢並進之時。明夷乃暗君在上，明者見傷之時，日入於地中象。\n\n#### 解\n• 一、婦人在井中：女人招災，或頸部災，家內有災。\n• 二、虎在外：外人虎視眈眈。\n• 三、錢缺：財傷也。\n• 四、人逐鹿：財失也，爭相為祿，逐鹿中原。\n• 五、堠在人鹿中：猴作梗也。\n• 六、「：尺也，工匠獨有，匠，將也，武官人。\n• 七、堠：不動也，尊位也，姓侯，肖猴。\n• 八、鹿回頭：回祿也，火災。\n• 九、人手上木枝：休象。","text.tab2":"此卦很凶，宅局逢之，必主母先亡，且生前血光連年，希讀者遇之必力求其變局，功德無量，人不知其功，乃所謂陰德也。\n• 一、妻生隱疾不好告人。\n• 二、破財且諸事不順。\n• 三、易受小人言，招人暗害。\n• 四、一旦見血光，必終致凶。\n• 五、唯肖虎人，可平安渡過。","text.tab3":"&0&\n**明夷：利艱貞。**\n君子處明夷之時，須知時之艱難，必求不失正道，方為君子。小人則阿諛奉承，唯利是圖，順附勢而為，不顧正道。\n/0&\n\n#### 彖\n\n**彖曰：明入地中，明夷，内文明而外柔順，以蒙大難，文王以之。**\n君子處明夷之時，知明者必見傷，故求內明外順之態勢，應對大難之時，如此可內不失明，外又可遠禍患。易之妙即在此，卦之德本亦卦之解也。\n\n利艱貞，晦其明也，内難而能正其志.箕子以之。\n處艱難時，能知晦藏其明，不知藏晦，必生禍患，不能守正，必非賢人。\n\n#### 象\n\n**象曰：明入地中，明夷，君子以莅眾，用晦而明。**\n君子觀明入地中，明夷之道，乃知不極其明察而用晦之道，於莅眾之時，如此必能容物和眾，眾親而安，猶水至清則無魚，人至明則無徒亦然。\n\n&1&\n##### 初九：明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。\n\n##### 象曰：君子于行，義不食也。\n\n明夷之初，乃見傷之始，暗君在上，陽剛之人不得上進，猶鳥飛而傷翼，小人害君子皆害其所以行。君子之人能見事於微末，始見傷，則避之，即令困窮亦退避之，取適之位而往，絶不以世俗之見而遲疑所行也。常人無法見傷於始，不知退避，至傷於己時，已不能退也。\n\n義之所至，即令困窮，亦不所為不正，故君子能安之於苦悶。\n/1&\n\n&2&\n##### 六二：明夷，夷于左股，用拯馬壯，吉。\n\n##### 象曰：六二之吉，順以則也。\n\n六二乃陰居陰位，得中正之德，順時知處，乃至善也。但處明夷之時，亦不免有所損傷，但須如馬之壯，可獲免傷而吉，如自處之道不壯，則傷之深矣。\n\n順處且有原則，合於中正之道，故必能處明傷之時，而能保吉也。\n/2&\n\n&3&\n##### 九三：明夷於南狩，得其大首，不可疾貞。\n\n##### 象曰：南狩之志，乃大得也。\n\n因上卦暗極，而又正居明之極，明即將與暗衝突之時也。居此，君子必前進除害，以獲之魁首，為要務，至於舊疾敗俗，必不能立刻改變，須知渐進之道，教其渐改，如求劇革必令不安，非上策也。\n\n用下位之明，來除上位之暗，唯求目的在除害而已，如不然則為背亂之事也。\n/3&\n\n&4&\n##### 六四：入于左腹，獲明夷之心，于出門庭。\n\n##### 象曰：入于左腹，獲心意也。\n\n此爻意陰邪之小人，處近君之位，乃以柔順附於君主時，為保其固交，乃以柔邪之法，隱敝之交而結於上。而君本陰邪之人，必受蠱惑其心，而行之於外。故君必求明，守正道，而不為小人所煽動，所利用也，即此。\n\n此以邪惡之陰道惑於君心，而逞其私慾，君為小人，必始終不悟也。\n/4&\n\n&5&\n##### 六五：箕子之明夷，利貞。\n\n##### 象曰：箕子之貞，明不可息也。\n\n此爻言暗傷至極，乃謂明見傷之主，若於此時顯示其明，必見傷害。要如箕子之知晦藏，則可免於難，若不知晦藏其明，則害大矣。\n\n箕子知晦藏其明於暗傷之時，且能不失意志，同與陰暗之人合污，其明必能不滅，小人若受禍患所逼，必失其節守也。\n/5&\n\n&6&\n##### 上六：不明晦，初登于天，後入于地。\n\n##### 象曰：初登於天，照四國也，後入于地，失則也。\n\n明之至高而又傷於此時，本可遠照，今傷於明，必不明反昏悔，反失其道也。\n\n始登於天，能明照四方，今傷於昏暗，反失其道。\n/6&"},"101011":{"text.tab1":"此卦董永喪父賣身，卜之。後感得仙女為妻。\n\n#### 圖\n一人張弓，一帶在水邊，雲中文書，貴人拜綬，婦人攜手。三點。\n\n**入海求珠之課**\n\n**開花結子之象**\n\n#### 雜\n\n**雜卦曰：睽外也，家人內也。**\n\n#### 序\n\n**序卦曰：傷於外者，必反(於/其)家，故受之以家人。**\n\n人之傷於外而必後返於內，故家人次明夷為序卦，此卦專論家內之道，父子、夫婦、長幼尊卑之倫理與恩義的家人之道。外風內火，乃風自火出，火愈熾則風生，有自內而出之象，故處家之道，有內明外順象。聖人之謂人能立於家，則必能施於國，以至天下大治。故治天下猶治家也。\n\n#### 解\n• 一、一人張弓：暗算，破壞也。\n• 二、一帶在水邊：事滯也，棄官也。\n• 三、雲中文書：突而來之喜訊也。\n• 四、貴人拜受：綬命也。\n• 五、婦人攜手：家和之象，此卦卜婚姻大吉。","text.tab2":"今日常見之卦局，讀者可知如後：\n• 一、 從官職必無法升職。\n• 二、 科甲功名無慮。\n• 三、 婚延後五年與同時生人不同。\n• 四、 與家人相處和睦，且非常顧家。\n• 五、 多婦人病。","text.tab3":"&0&\n**家人：利女貞。**\n家人之道，利在女正且堅，女能正，則家道正矣。\n/0&\n\n#### 彖\n\n**彖曰：家人，女正位乎内，男正位乎外，男女正，天地之大義也。**\n家人之道，正位且堅心，男主外，女主內，其有尊卑有道，乃合乎天地陰陽之道。\n\n家人有嚴君焉，父母之謂也。\n父母為一家之君長，無尊嚴則無人孝，無大小，則倫理廢，故君嚴則家正。\n\n父父子子，兄兄弟弟，夫夫婦婦，而家道正，正家而天下定矣。\n父母兄弟夫妻各適其位，則家道正矣。能治家道，其道亦可推而治天下。\n\n#### 象\n\n**象曰：風自火出，家人。君子以言有物，而行有恆。**\n君子觀風自火出之象，知正身之道，皆由內出，故言必有物，行必有恆，身正而能治家。\n\n&1&\n##### 初九：閑有家，悔亡。\n\n##### 象曰：閑有家，志未變也。\n\n家人道之始為初九，须以陽剛立家道，如無法則度量，則終至人情流放，必悔。\n\n閑即預防之法則也，閑必於始初而立。在正志未流散之前，變動而法規之，因始立規之時，必不傷恩，不失義，如於志變後再思治，則多有傷，必有悔。\n/1&\n\n&2&\n##### 六二：无攸遂，在中饋，貞吉。\n\n##### 象曰：六二之吉，順以巽也。\n\n常人處家，唯骨肉親情，故常以情勝禮，以恩去義，偏私之人多矣。獨有能剛之人不以私愛而不顧理。今以陰柔之人治家，必無可為，唯婦人之道可以柔順，如能處正，居中協調，則必能吉。\n\n今以陰柔居中，能順從而動其心，此為婦人之正道。\n/2&\n\n&3&\n##### 九三：家人嗃嗃，悔厲吉，婦子嘻嘻，終吝。\n\n##### 象曰：家人嗃嗃，未失也；婦子嘻嘻，失家節也。\n\n嗃嗃乃嚴厲約束意，家人之道如約束過嚴，必有悔，然能令人心敬畏，也比讓婦人之放肆，喜樂無節，終至家敗而來得好。同理，人能剛立，必知忠義，喜愛玩樂必不能正倫理，知恩義也。\n\n雖過嚴厲傷恩，但猶未失家人之道。但令婦人喜節無度，失家之道，必亂矣。\n/3&\n\n&4&\n##### 六四：富家，大吉。\n\n##### 象曰：富家大吉，順在位也。\n\n能有其富，於家道大吉，保有富之人，而能保其家，此吉之大也。\n\n以巽順之道而能保其家富，此家之大吉也。\n/4&\n\n&5&\n##### 九五：王假有家，勿恤，吉。\n\n##### 象曰：王假有家，交相愛也。\n\n能剛又處君位，位尊而中正，又能順應內，此治家之至正至善。是故修身來齊家，家家能正，則天下大治，此不須憂勞而天下自治矣。\n\n尊位又能有家之道，不但能使其順從而已，必使其能從內心而化合。丈夫能愛內助，婦能愛其威治於家，此交相愛，為家之至道。\n/5&\n\n&6&\n##### 上九：有孚威如，終吉。\n\n##### 象曰：威如之吉，反身之謂也。\n\n此言治家之道，非至誠之心不能也。己能守其规如常則人自化，如己不能守，況於他人乎？家之患必在禮法不足，下犯上，上凌下。\n如能守正禮法，又有威嚴，則必能吉。\n\n此即言治家之道，以正身為本，當先嚴其身，後有威望於人，則人能服。此反身之意。\n/6&"},"110101":{"text.tab1":"此卦武則天聘尚賈至精魅成，卜此除之。\n\n#### 圖\n人執斧在手，文書半破，牛鼠，桃開鬥掩，雁飛鳴。\n\n**猛虎陷井之課**\n\n**二女同舟之象**\n\n#### 雜\n\n**雜卦曰：睽外也，家人內也。**\n\n#### 序\n\n**序卦曰：家道窮，必乖，故受之以睽。睽者，乖也。**\n\n家之道到窮途，則生乖違離散，故睽卦為之序。此卦上火下澤，二體相違，此睽之義，二女三女同居一室，但所歸各異，乃因志之不同也。\n\n#### 解\n• 一、人執斧在手：求快也，行刑之人，執法之人，有權柄也。\n• 二、文書半破：無望象，毁約也。\n• 三、牛鼠：秋冬吉，春夏凶。\n• 四、桃開：逃開也。\n• 五、門掩：牢獄之災，閉也，隔也。\n• 六、雁飛鳴：悲也，孤單也，報凶訊也。","text.tab2":"我們常見有小女孩，背離家人，自顧自私，使父母深為苦惱，而無法改變，只有任其任性而為，終致一生皆凶，坎坷，實因自內生。\n• 一、性剛僻倔強，任性胡鬧，以致家無法容。\n• 二、肖牛肖鼠人見之，更凶。\n• 三、科甲不興。\n• 四、婚姻不成。\n• 五、招凶事，官司，災禍連連。\n• 六、有同性戀傾向。","text.tab3":"&0&\n**睽：小事吉。**\n睽違之道於小之事，可言吉。如與不良之人乖離，與不正之事違背也。\n/0&\n\n#### 彖\n\n**象曰：睽，火動而上，澤動而下，二女同居，其志不同行。**\n睽，以卦才言火在上而動，澤在下位，此二物性反，其義猶二女三女其本志同而共處，及長所歸各異，其志不同也。\n\n説而麗乎明，柔進而上行，得中而應乎剛，是以小事吉。\n內悦順而又應乎外明，麗明居上，以柔求進，又能得中正之道相應，處睽之時雖無法去天下之睽，但於小處則吉矣。\n\n天地睽而其事同也，男女睽而其志通也，萬物睽而其事類也，睽之時用大矣哉！\n天上地下雖睽然天陽下降地陰上升而成萬物，其事本同也。男女之質不同，但互相求之志卻同也。天下萬物不同是暌，然皆稟天地之氣而成，則相同也。是故物雖異而其本同，聖人用睽之道，能令天下不同之群眾，合而為一，故其事大矣哉。\n\n#### 象\n\n**象曰：上火下澤，睽，君子以同而異。**\n火在上，澤在下，二物之性相違，為睽象，君子觀睽而知於世俗所同者，有時須獨異於世人，中庸曰和而不流，即義此也。\n\n&1&\n##### 初九：悔亡，喪馬勿逐，自復；見惡人，无咎。\n\n##### 象曰：見惡人，以辟咎也？\n\n卦之初，即睽之始時，於睽時又剛動於下，其悔可知，於此時因不能行而喪其馬如勿逐則馬自復回。因睽時小人必眾，若棄之，則必天下而仇己乎？就會喪失坤德之含弘功能，乃致凶地。不但無法使之化善，更遑論能合之，故有必見惡人之議，所以自古以來能化姦邪為善良，去仇敵而為臣民者，皆因不拒絶見之。\n\n於睽時人情乖違，為求和合，若因其惡人而避之，則生眾仇於君子，故見惡人乃為避免怨咎之悔也。\n/1&\n\n&2&\n##### 九二：遇主于巷，無咎。\n\n##### 象曰：遇主于巷，未失道也。\n\n睽違之時乃陰陽不合，且剛戾相對，即令為陽剛之中臣，當以委曲而婉轉之善道將就於主，期使之合，絶非求附君主而屈道相向也。\n\n此意即當以至誠以動君心，使明義理而能求相合，不可屈道迎逢，乃真未失道。今之小人明知不正，然於乖違，之時，只知迎合奉承，為求己利，枉顧正道，故因時局而戀志之人乃真小人也。\n應，待睽終極之時必合，方為善處之道。\n/2&\n\n&3&\n##### 六三：見輿曳，其牛掣，其人天且劓，无初有終。\n三爻位為下卦之上，本離下卦而求進於上，今逢四之剛為阻，而下二爻之陽剛於後，處此之時又逢乖違不和，猶牛車之行具，牛受掣阻於前，後有車輿在後，如以此狀況，又求力進，則必重傷於上，宜剛守中正之道與其對\n\n##### 象曰：見輿曳，位不當也，无初有終，遇剛也。\n見車牛之負掣後拖曳而行，知位所不當，聖人知理順行，知時而守，待遇剛而能合。\n/3&\n\n&4&\n##### 九四：睽孤，遇元夫，交孚，厲无咎。\n\n##### 象曰：交孚无咎，志行也。\n\n四爻近君位，君不與應，乃睽乖之時，故為孤，唯求與同德之人相合，且至誠相與交往，能如此，雖處危，但仍可無咎也。\n\n睽乖之時，上下至誠相交，不止無咎，且其志必可行，故救睽之道，唯君子以陽剛之才，至誠相輔，何所不能濟也。\n/4&\n\n&5&\n##### 六五：悔亡，厥宗噬膚，往何咎。\n\n##### 象曰：厥宗噬膚，往有慶也。\n\n陰柔又居尊位，於睽時，其危可知，然有九二陽剛之賢相輔，可以悔亡，且陽剛之賢又能成黨，且深入之，則往而有慶也，如劉襌之庸，有孔明之輔，乃成中興之態勢。\n\n人君之才不足，如知信任賢輔，使其道能深入於己，亦可為也。今人不知己之才不足，以為博士就是好的，不但不能成事，且造成乖違之勢愈烈，果必凶。\n/5&\n\n&6&\n##### 上九：暌孤，見豕負塗，載鬼一車，先張之弧，後説之弧，匪寇婚媾，往遇雨則吉。\n\n##### 象曰：遇雨之吉，群疑亡也。\n\n睽極之時，必反復正道，猶人見污濁之豕，且全身爛泥，又車載一群惡鬼，心厭惡之乃欲張弓射之，後思之如動必反，而弗射，化仇寇為婚媾，陰陽交合而成雨，故始因疑而睽，睽至極因不疑而合，猶天地陰陽上為雨，往而遇之，則吉也。\n\n雨之成，乃因陰陽之和，故所以合和能成，乃因疑慮盡消亡也。\n/6&"},"001010":{"text.tab1":"此卦鍾離末將收楚，卜得之，乃知身不王矣。\n\n#### 圖\n日當天，旗一面上有使字，鼓五面中有一鹿、堠上千里字。\n\n#### 雜\n\n**雜卦曰：解緩也，蹇難也。**\n\n#### 序\n\n**序卦曰：乖必有難，故受之以蹇。蹇者，難也。**\n\n飛雁啣草之課 背明向暗之象睽，乖違也，乖離必生難，蹇即難也，因時之乖違，必有蹇難，故蹇次睽為序卦。此卦坎上艮下，坎，險也，艮，止也，前有險而止不進，為蹇之意也。\n\n#### 解\n• 一、日當天：君明之象，吳姓。\n• 二、旗一面只有使字：出使，和平之象，使—二人一口，示單人也。\n• 三、鼓五面者：時為五更天，佔五面地，王為君王，一方之主，有多國或多島之象。\n• 四、中有一鹿：攜財福至，旅客帶財來狀，商人至也。\n• 五、堆子千里字：行西南，千里封候，候姓也。\n• 六、千里為重：有第二次方吉。","text.tab2":"此局利從武官之人，如軍人、員警、外交、司法人員等，也可以刻意佈出此局如果你想兒子從此類公職的話。\n• 一、求財亨通，且無功利之心。\n• 二、官調他鄉，與六親遠離。\n• 三、婚姻較同時生人延後七年。\n• 四、科甲吉，故考試資格必順心。\n• 五、獨自發展亦特立獨行也。","text.tab3":"&0&\n**蹇：利西南，不利東北，利見大人，貞吉。**\n西南為坤，坤体順，東北為艮，艮体險止，此言於蹇難之時，利處平易之地，不利止於危險，今人遇險而止，不知因險而止，乃更險也。\n/0&\n\n#### 彖\n\n**彖曰：蹇，難也，險在前也。見險而能止，知矣哉！**\n蹇有險阻之難也，因險在前，止而不進狀。處蹇之道，乃能見險而止，此知蹇難也，此止非真止也，乃不犯險而進之意。\n\n蹇：利西南，往得中也：不利東北，其道窮也。\n蹇之時，唯利處平易之地，乃得中正之位，東北為山，險阻在前，犯險而進，道必窮。\n\n利見大人，往有功也，當位貞吉，以正邦也。蹇之時用大矣哉！\n蹇難之時，唯聖賢能濟天下之蹇，故用賢人能往求而成功，在位之人堅心執意如此，必能正家邦，此即知蹇之時任用賢人，適時而動，量險而行，使至正之大道能濟天下之蹇。今之為政者，不知蹇之時難，乃因不知古聖先哲之智慧也。\n\n#### 象\n\n**象曰：山上有水，蹇；君子以反身修德。**\n山已為險阻，上又有水，故有上下險阻狀，為蹇，君子觀蹇象，知此時乃反求於己修身進德，故必省自身，以待時之至也。\n\n&1&\n##### 初六：往蹇，來譽。\n\n##### 象曰：往蹇來譽，宜待也。\n\n此蹇之初，以陰柔無助而求進，蹇之甚也，是知止而不進，乃因知進退而成譽也。\n\n於蹇之初，進必愈蹇，宜見幾而止，待時而進，不可燥進。\n其能忠而可嘉勉。\n/1&\n\n&2&\n##### 六二：王臣蹇蹇，匪躬之故。\n二爻為陰位，陰居之為正位，乃意為中正之臣，又與上五君同德而受信任，此即王臣，今處蹇難時，即令中正之人，以陰柔之質，不能勝任，故有蹇中之蹇狀，因為中正之人，其所為必忠於君，非為私己，故即令不勝，亦因\n\n##### 象曰：王臣蹇蹇，終无尤也。\n/2&\n\n&3&\n##### 九三：往蹇，來反。\n\n##### 象曰：往蹇來反，内喜之也。\n\n以剛居下卦之上，處蹇時，下位之人皆柔，依附於上狀。欲再上進，又逄陰柔，無法相濟，故有來反，即還歸也，反回其所。\n\n下之陰柔無法獨立，必附於九三之陽剛。\n故吾人知，於處蹇之時，必得下之心可以求安，此求內而喜之也。\n/3&\n\n&4&\n##### 六四：往蹇，來連。\n\n##### 象曰：往蹇來連，當位實也。\n\n蹇之時以陰柔而往入坎險之深處為往蹇，如能與同志之人，使合眾而附之，此即来連，乃真得處蹇之道也。\n\n處蹇，居於上位，能不與下往而眾來，乃得眾志也，能得眾志之人，必始之於誠實待下方可得也。\n/4&\n\n&5&\n##### 九五：大蹇，朋來。\n\n##### 象曰：大蹇朋來，以中節也。\n\n君處蹇難之時，必天下處難也，故名大蹇，此時如能得朋來助，且須為陽剛中正之才來相輔方有效。\n\n大蹇之時，須陽剛中正之才，如臣之才不足濟蹇，只守於節義，不能濟世也，今之政客，多屬此類，不知己之才不濟，而力進，徒顯其無能也。\n/5&\n\n&6&\n##### 上六：往蹇，來碩，吉，利見大人。\n\n##### 象曰：往蹇來碩，志在内也，利見大人，以從貴也。\n\n六以陰柔居蹇之極處，蹇之極有將離蹇之態，如以陰柔必不得出，須有陽剛之助，以寛裕之大量，見有德之人，方可為吉。\n\n六位陰柔又處蹇之極，能近陽剛中正之君，來求自濟，此以從貴之義，吉也。\n\n中正之臣所為必為其君，不為私，故於蹇難時，雖未成功，但終無過也。\n/6&"},"010100":{"text.tab1":"此卦項羽受困垓下，卜得之，後果士卒潰散也。\n\n#### 圖\n旗上提字，一刀插地，一兔走，貴人雲中，一雞在邊鳴，道士手指門，道人獻書，小堠在側。\n\n**雷行風止之課**\n\n**患難解散之象**\n\n#### 雜\n\n**雜卦曰：解緩也，蹇難也。**\n\n#### 序\n\n**序卦曰：物不可以終難，故受之以解。解者，緩也。**\n\n解者散也，萬物無終難之理，難至極而散，故解為蹇之序。此卦震上坎下，外動內險，即動於險外，有出險之象，故為患難解散之時也。\n\n#### 解\n• 一、旗上提字：指名提凶，不利。有遠走他鄉之象。\n• 二、一刀插地：求快也，劉姓之人也。\n• 三、一兔走：卯年，劉姓。\n• 四、一雞在邊鳴：有競爭象，酉年適逢貴人救。\n• 五、貴人雲中：不及救也。\n• 六、道士手指門：入空門也，逃亡方向，出家也。\n• 七、道人獻書：裝飾外表，示誠象。","text.tab2":"此卦局常見，也相當特殊：\n• 一、為性剛武勇之人。\n• 二、總是官司是非不斷。\n• 三、無婚。\n• 四、肖兔人，劉姓人，柳姓人，主凶。\n• 五、出家為唯一可解之人事手段。","text.tab3":"&0&\n**解：利西南，無所往，其來復吉，有攸往，夙吉。**\n西南即坤方，坤之体本含弘光大，於天下之難方解時，人始離困苦，當以宽大簡易之法待之，切不可使煩於苛政，人心必安，再求重修冶道，立綱紀，建法治，且宜早動，如俟難復則不及矣。\n/0&\n\n#### 彖\n\n**象曰：解，險以動，動而免乎險，解。**\n險則示難也，不險必不難，遇解時，如不動必不能出險，故此動是免於招險也。\n\n解利西南，往得眾也。\n此即解難之道，须廣大且平易之法以待民，則民心必歸。\n\n其來復吉，乃得中也。\n治世之道，必待解之時來臨方可往用，此為得宜。\n\n有攸往夙吉，往有功也。\n欲動而往，則必利速，愈早前往，功愈大，遲則害已生矣。\n\n天地解而雷雨作，雷雨作而百果草木皆甲坼，解之時大矣哉！\n天地之氣開而和暢生雷雨，雷雨生而萬物甲坼，故解能成天地之功，故聖人知解之時，大\n\n也。讀易須体時之義，方成得易之道。易之道與天地合而同德。\n\n#### 象\n\n**象曰：雷雨作，解;君子以赦過宥罪。**\n天地解散而生雷雨，君子觀雷雨之象，体會發育之功，而知施恩仁，行宽法也。\n\n&1&\n##### 初六：无咎。\n\n##### 象曰：剛柔之際，義无咎也。\n\n初解之時，柔居陽剛，乃柔而能剛象,知剛柔之合宜，使患難解散。\n/1&\n\n&2&\n##### 九二：田獲三狐，得黃矢，貞吉。\n\n剛柔相接又得其時宜，必無災也。\n狐為邪媚之獸，黄乃直中也。\n\n二與五陰位相應，此言陰柔之君在上，陽剛之臣在之時也，古來如君柔則小人易蔽，威必受損，又不果斷且易受小人之惑，小人一近則心動矣，處此時又逢災難初解，聖人必以能去小人來正君之心，行其剛中之道，方可吉，\n\n##### 象曰：九二貞吉，得中道也。\n/2&\n\n&3&\n##### 六三：負且乘，致寇至，貞吝。\n\n##### 象曰：負且乘，亦可醜也。自我致戎，又誰咎也。\n\n小人本非在上之物，今居下之上位，猶負重而乘車，乃招寇至，終必悔矣。\n\n能得中正之道，除去邪惡乃正且吉也。\n\n負重乘車，招寇致其之醜乃咎由自取，又可怪誰呢。小人不量力勉居君子之位處上，必終自招盜而奪之，自取其辱也。\n/3&\n\n&4&\n##### 九四：解而姆，朋至斯孚。\n\n##### 象曰：解而姆，未當位也。\n\n陽剛之人居陰柔君之側時，如居上位親近小人，必使賢士遠矣，須斥去小人則君子必進，能得人之信孚。\n\n如與君子至誠以交，則必無擋，故小人如能介乎中，則示人其交必不誠至也。\n/4&\n\n&5&\n##### 六五：君子維有解，吉，有孚于小人。\n\n##### 象曰：君子有解，小人退也。\n\n君主之人必去小人，則君子必進，正道乃行，如不去小人，則天下不治，此可反看，即天下不治，乃小人不去也。\n\n君子能解退小人，則君子之道方行，故能行君子之道，乃因能去小人也。\n/5&\n\n&6&\n##### 上六：公用射隼于高墉之上，獲之无不利。\n\n##### 反招凶。\n\n解之至極如仍未解，必有堅強之害也，故於此時可強用弓矢如射鷹隼於高處，時至而發，如無良器又動不以時，射未成，必反生害，故此言器之重要與動之時機，獲之必吉，不成\n\n##### 象曰：公用射隼以解悖也至解之終仍未解，必害之大且堅，故須強硬如射隼以解悖亂，天下可治也。\n/6&"},"110001":{"text.tab1":"此卦薛仁貴將收燕，卜得之，大破燕軍。\n\n#### 圖\n二人對酌，酒瓶倒案上，毬在地上，文書二策，有再告二字。\n\n**鑿石見玉之課**\n\n**握土爲山之象**\n\n#### 雜\n\n**雜卦曰：損益盛衰之始也。**\n\n#### 序\n\n**序卦曰：緩必有所失，故受之以損。**\n\n解，散也，斥去也，其後必有所失，故損為序。此卦「艮」上「兑」下，山體高在上而澤體深在下乃有損下益上之義。如損上而益下，為益卦，取下而求益上，則為損，故居人上而施恩澤於下則益，如取下而求自足，乃損。\n\n#### 解\n• 一、二人對酌：二人夾木，來也。\n• 二、酒瓶倒案之：目前無指望也。\n• 三、毬在地上：所求不成狀。\n• 四、文書二策有再告二字：再次求，方成。\n<u>居此之時唯求有益於人，乃得損之真道也，損其多餘，同志乃至。</u>","text.tab2":"損局在陽宅上造成兒子問題多多，父母總是煩心擔憂。\n• 一、與同時生人，婚事延後一年方成，對方同一人。\n• 二、官運不通，所求不成。\n• 三、性喜求樂，不求進步，須經二次大災，方能悟。\n• 四、對家庭態度，只會花錢，不會賺錢，無所事事。","text.tab3":"&0&\n**損：有孚，元吉，无咎，可貞，利有攸往。**\n損之道須持之正理，來自誠正，則損因順理而至大善，此可吉也。堅固常行必利有所往。\n常人之損，有過或不及或不常皆不合乎正理。\n\n曷之用？ 二簋可用享。\n人間祭祀之禮，文繁節褥，常人多備祭品，聖人以儉為禮之本，示以至誠之心敬天，如求祭物過多，乃求飾其誠，實示人偽矣。故知凡人之慾望若有過者，其始初皆起於奉養，常久以後則成宮樓峻牆，酒池肉林，聖人有見於此，故先制其本以儉，故損之精義在損滅人欲以近乎天理而已。\n/0&\n\n#### 彖\n\n**彖曰：損，損下益上，其道上行。**\n損之成，乃損下而益於上，故道乃上行。\n\n損而有孚，元吉，无咎，可貞，利有攸往。\n損之道在至誠，堅心如此，乃可盡損之道也。\n\n曷之用？二簋可用享，二簋應有時，損剛益柔有時。\n吾人應損去外在浮飾，使至誠見，萬事之始，必有長幼尊卑，然於事之末，往往已流於形式，損之時乃知何時須損剛益柔，此損之道必以時乃吉。\n\n損益盈虛，與時偕行。\n\n須損須益，求盈求虛，只隨時之一念而已，易之於時義於此可見。\n\n#### 象\n\n**象曰：山下有澤，損，君子以懲忿窒欲。**\n君子觀損之象，以損己為上，修己之道在忿與欲上，能知損己之忿與欲，乃得真損之時義。\n\n&1&\n##### 初九：已事遄往，无咎，酌損之。\n\n##### 象曰：已事遄往，尚合志也。\n\n損之道，在損剛益柔也。今居下之人為益上，當以功與之，不求己居，事畢則速去，不求居功，乃能無過。若求享其功之美，此離損下益上之道，不可也。\n\n事畢後退居不居功，能與上合志也。\n/1&\n\n&2&\n##### 九二：利貞，征凶，弗損益之。\n\n##### 象曰：九二利貞，中以爲志也。\n\n剛中之人與君位柔性相應，居損時，用柔悦態度求應於上，則有失剛中之德，其動必凶，乃因不知堅心於陽剛也。此適足以損也。\n\n九二陽剛之人能守中正之道，則何有不吉。志存乎中道，則必自正也。\n/2&\n\n&3&\n##### 六三：三人行，則損一人。一人行，則得其友。\n\n##### 象曰：一人行，三則疑也。\n\n天下沒有獨一之人，必有二者，如男女之往，由其精一，故能生也。一陰一陽，無法加入故三人因志不專一，必生損一人，一人獨行，由其志為專，故必有一友能同其志，故天地之間損義之明且大哉，莫過於此。\n\n一人行而能得友，三人行則易生疑，於此時須明損之道，損去一人，乃損多餘。\n/3&\n\n&4&\n##### 六四：換其疾，使遄有喜，无咎。\n\n##### 象曰：損其疾，亦可喜也。\n\n陰柔之人居損時，須自損以從陽剛中正之道，即損不善而從善，必有喜而無災。人之損過失，唯患不速，如速則此過必不至深，為可喜也。\n\n知損之道，得損之時，速去其不善，此可喜也。\n/4&\n\n&5&\n##### 六五：或益之，十朋之龜，弗克違，元吉。\n\n##### 象曰：六五元吉，自上祐也。\n\n君王能柔順居尊位，處損之時，知虛中自損，順從在下陽剛之賢人，人君能如此，則天下人必從其德，咸以損己為美，故有眾民之公論助之，因合正理，即龜筮亦不相違，可謂大善之吉也。古云：「謀能從眾，則合天心。」\n\n人君能盡眾人之見，合於天地之理，天必降福祐也。\n/5&\n\n&6&\n##### 上九：弗損益之，无咎，貞吉，利有攸往，得臣无家。\n\n##### 象曰：弗損益之，大得志也。\n\n損道之終極，能居上而不損其下又益增在下之人，則天下莫不服從，人心歸順，無遠近內外之區限。\n\n居上而不損下，又能增益之，君子必能遂行其志，故簡言之，君子之志，唯在如何益於人而已。\n/6&"},"100011":{"text.tab1":"此卦冉伯牛有疾，卜得之，乃知謾師之過也。\n\n#### 圖\n官人抱合子，一人推車，一鹿一錢。\n\n#### 雜\n\n**雜卦曰：損益盛衰之始也。**\n\n#### 序\n\n**序卦曰：損而不已，必益，故受之以益。**\n\n鴻鵠遇風之課 河水溢出之象損而不己必生益，自古盛，衰，損，益，天理循環，損至極生益，所以繼損也。此卦巽上震下，風雷二物互相增益，雷受風則迅，風受雷激則烈，互相助威，所以成益象。損上益下，故為益，前卦乃損下益上故損，以其義而推，吾人可知，民厚則國安。\n\n#### 解\n• 一、官人抱合子：倌人，丈夫也，事必先成後破。\n• 二、一人推車：因時而動之象，空坐相請。\n• 三、一鹿一錢：才祿俱備，有回祿之災，財有破損，憂心忡忡。\n• 四、不為財货，不畏時尚之變，明知先成後破，仍走馬上任，以損上益下之道，天下或事業亦能平治。","text.tab2":"• 一、長女之婚事不成，或成後又破。\n• 二、財祿足，有祖業，工作則又過於男性。\n• 三、女身男性，貴人為男人，小人為女子。\n• 四、從官運則吉，切不可貪祿，主兇。","text.tab3":"&0&\n**益：利有攸往，利涉大川。**\n益，乃有益於天下之道，故可濟險難，利涉大川。\n/0&\n\n#### 彖\n\n**彖曰：益，損上益下，民説无疆，自上下下，其道大光。**\n益之本義，其道在損於上而益於下，民必悦之且無盡無窮，從上而降，下之下亦受之，益道乃光顯而大也。\n\n利有攸往，中正有慶。利涉大川，木道乃行。\n以中正之道助益天下，天下受福，故往吉。萬物中唯木助益人類最大，舉凡葯材，車船，築室等皆不離木，木於平時尚未顯其要，但於艱危困頓時，則助益乃大，益道亦如是。\n\n益動而巽，日進无疆。天施地生，其益無方。凡益之道，與時偕行。\n益道之動乃在乎順，動不順乎理，必不成益。天道滋始，地道成物，而化育萬物，各正性命，使益之道廣大無邊。聖人體天地之道，知能利乎天下之道，必須順乎時應乎理，因時制宜，乃益之大道。\n\n#### 象\n\n**象曰：風雷，益，君子以見善則遷，有過則改。**\n風與雷二物相互助益，君子觀其象，而知益於己之道，乃在見善則遷，則可盡天下之善，有過能改，則無過矣。\n\n&1&\n##### 初九：利用爲大作，元吉，無咎。\n\n##### 象曰：元吉无咎，下不厚事也。\n\n初九為陽剛之賢，如遇六四上位之順時，亦即居下位而有能力之賢才，能得上位之順從支持，必做大益於天下之事，此為大作，如不能持此原則，不但悔咎來臨，且又累上位，此是上位之過也。如益眾人，則必無過。今人多志得意滿，狐假虎威，欺上瞞下，唯圖利自己而已。\n\n下位之人，本就不可擔重大之事，今得上位信賴而出任大事，必须能濟世助人，方可使上位有知人善任之譽，如只會壞事，民怨四起，則上下皆有過失也。\n/1&\n\n&2&\n##### 六二：或益之，十朋之龜，弗克違，永貞吉，王用享于帝，吉。\n\n##### 象曰：或益之，自外來也。\n\n人能處於中正之道，又知中虛來求益，且能順從無私，天下何不能受？必不相違，日久更吉。如此則必能通上位，獲吉，人皆相從矣。\n/2&\n\n&3&\n##### 六三：益之用凶事，无咎。有孚中行，告公用圭。\n六三乃相位，居下民之上統管民事，如能居民上而剛決，其果為益民而決，即令是凶事，亦可無咎。但仍須以誠意通於上，使上能信任，如所為不合中道，即令上信亦不可為也。\n\n能知益天下之道，且堅守此道，必令眾人自外而來歸矣。\n\n##### 象曰：益用凶事，固有之也。\n居下凡事當稟明於上，乃得誠信。但如遇危難救災之事，可立以剛決，必能無咎，此其大義也。\n/3&\n\n&4&\n##### 六四：中行，告公從，利用爲依遷國。\n\n##### 象曰：告公從，以益志也。\n\n居君側，以柔順從君，對下又順應於初陽之剛賢，如此則能令民順而從行。\n\n其動之志在益天下，上必信從，因其為公不為私，故古人不患上之不從，患己之不正。\n/4&\n\n&5&\n##### 九五：有孚惠心，勿問元吉，有孚惠我德。\n\n##### 象曰：有孚惠心，勿問之矣，惠我德，大得志也。\n\n陽剛君王，居尊心中又誠正，必能益於天下，不問可知，天下之人必至誠愛戴，因君之能施恩德也。\n\n人君有至誠增益天下之心，不须問，天下之民，必懷德承恩，益道大行，人君志必行。\n/5&\n\n&6&\n##### 上九：莫益之，或擊之，立心勿恒，凶。\n\n##### 象曰：莫益之，偏辭也，或擊之，自外來也。\n\n以剛處益之極，此專欲利己，不與眾同欲，必招怨，或受攻撃，聖人戒之在人欲，堅心不可有私欲，否則招凶。有則須速改。\n\n若以私利增益自己，人必與爭之，必不肯之。或言辭偏，或攻擊之，皆自外來。起因皆因己心不合正理，私欲專利而成。\n/6&"},"111110":{"text.tab1":"此卦漢高祖欲拜韓信為將，卜得之，知有王佐才也。\n\n#### 圖\n二人同行，前水後火，虎蛇當道，一人斬蛇，竿上有文字，竿下有錢。\n\n#### 雜\n\n**雜卦曰：夬決也，剛決柔也，君子道長，小人道憂也。**\n\n#### 序\n\n**序卦曰：益而不已，必決，故受之以夬。夬者，決也。**\n\n神劍斬蛟之課 先損後益之象益之至極，猶水之滿溢，必決出之，夬者，決也，必決而後止。以卦体而言，兌上乾下，有水之聚高至頂，則潰決也。如以爻而言，五陽在下，陽之長而陰將退，有眾陽決去一陰之象，故於人間道，則此為君子道長，小人道消之時也。\n\n#### 解\n• 一、二人同行：相輔相成，可成事也。\n• 二、前水後火：前險而後明，宜進取象，土生金象。\n\n> 倪曰：停止不動遇險\n\n• 三、虎蛇當道：虎，有權威之人。蛇，險奸之小人阻道。\n\n> 倪曰：有小人阻道，也有權威的人幫助\n\n• 四、一人斬蛇：勇士也，得名將也。\n• 五、竿上有文字：揚竿而起，正名出師。\n• 六、竿下有錢：行動有利也。\n• 七、錢下有火：燒錢狀，主喪服。\n\n> 倪曰：如卜健康，喪事","text.tab2":"• 一、婚事延宕不成。\n• 二、性剛從武，性柔從宗教，吾人可從八字中看出。\n• 三、事業先主兇後吉，主自行發展。\n• 四、科甲不興。\n• 五、身體健康差，不長壽，三十歲前有兇險。","text.tab3":"&0&\n**夬：揚于王庭，孚號，有厲。**\n夬之道，在小人式微，君子道長，必顯於公堂，使人明善惡，故揚于王庭。於此時敬戒之以至誠以命下民，使民戒之，居安思危，隨時生戒懼之心，必無後患。\n\n告自邑，不利即戎，利有攸往。\n夬之道能於至善，必不尚武力，從修已開始，齊家後能治國，以道服眾，如此則可進而往。\n/0&\n\n#### 彖\n\n**彖曰：夬，決也，剛決柔也。健而説，決而和。**\n五陽去一陰，下健而上悦，乃因健而能悦，能和，此決道之至善。\n\n揚于王庭，柔乘五剛也。孚號有厲，其危乃光也。\n陰居陽上，此不正也，君子去之，當揚其罪於公堂，使民眾知善惡也。以衷心至誠帶領民眾，使知戒懼，防危之至，君子之道方可顯其力大。\n\n告自邑，不利即戎，所尚乃窮也。利有攸往，剛長乃終也。\n夬之時，不可崇武以力取，必須從修治本身之地起，方可有利前進光大君子陽剛之道，待正道至剛時，決不可留一邪吝之道，此剛進至終可吉也。\n\n#### 象\n\n**象曰：澤上於天，夬，君子以施祿及下，居德則忌。**\n\n水之聚而上於天，為夬象，其終必決於上，而灌溉於下，君子觀象法天，故知必施祿於天下，則民皆向之，於安處之時，知須防禁，則無潰散之虞。\n\n&1&\n##### 初九：壯于前趾，往不勝爲咎。\n\n##### 象曰：不勝而往，咎也。\n\n在下位剛健之人，於決之時，必強進執行，如執行中受阻而失敗，必決之過，故凡事欲動之前，必戒之在燥，做最壞之打算，方可行進。\n\n君子之行，必度量而進，知不可而力求，必招咎也。小人無此之戒，不量力而進，其果自取其辱。\n/1&\n\n&2&\n##### 九二：惕號，莫夜有戎，勿恤。\n\n##### 象曰：有戎勿恤，得中道也。\n\n君子去小人之時，必思懷戒備，不鬆懈一時，如此即令夜有兵戎，亦不驚也。\n\n衣有兵戎，不驚憂，乃因自處之善，能行中道，知所戒懼也，故學易之人必知時識勢，不知如此，惶論精易。\n/2&\n\n&3&\n##### 九三：壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎。\n\n##### 象曰：君子夬夬，終无咎也。\n\n九三居相位，上有君王，卻剛於果決，此決乃自任之決，必非合君意，果必招凶。故君子居夬之時，知己道之長，小人之道將消，必不獨與小人合，且面現愠色，必可無咎。今人皆自以為重要，見人之招凶，不論其因為何，一律給予支持，此愚善之表現，徒令小人得逞，不知反悔，反更盛其勢，此禍之端，乃肇因於人之愚善。\n\n決必合於正理，君子於當決之時果決之，終不至咎。常人须戒，在不明狀況之前，不做決定就是良策，切不可憑己之所好而蒙決，必害及他人。\n/3&\n\n&4&\n##### 九四：臀无膚，其行次且，牽羊悔亡，聞言不信。\n\n如是之人，必剛明者方可做到。陽居陰位，乃示剛決不足之人所犯之過，陽剛正理已明極時，如己之果決不足，必招居不安，行進又難之狀，若能法羊群之群行特性，可無悔，但剛決不足之人，令其以柔進，必不能也，故即令告之，本性如此，必不能信用。自古以來，知過能改，知善能用，克己之欲能\n\n##### 象曰：其行次且，位不當也；聞言不信，聰不明也。\n此行為受阻，受難，乃居位之人不適其職位。正理之言不信，因其聰聽不明也。\n/4&\n\n&5&\n##### 九五：莧陸夬夬，中行无咎。\n\n##### 象曰：中行无咎，中未光也。\n\n君為決定之主，居夬之時，必立決，以去小人之道，稟持中正之道，必無災。\n\n人能中心至誠，必決之無過也，但人心皆有私慾，一旦涉及私欲，必不能光大中道。\n/5&\n\n&6&\n##### 上六：无號，終有凶。\n\n##### 象曰：无號之凶，終不可長也。\n\n此陰將盡之時，君子道顯，小人道必消之際，惟比附於君子之道方吉，否則即令不號咷畏懼，亦終獲凶。\n\n如示人號咷畏懼，仍招凶，此道必不久也，故君子思去小人之道，非斬盡小人也。\n/6&"},"011111":{"text.tab1":"此卦漢呂后擬立呂氏謀漢社稷，卜得之果不利也。\n\n#### 圖\n官人射鹿，文書有喜字，二人執索，綠衣人指路。\n\n#### 雜\n\n**雜卦曰：大過顛也，姤遇也，柔遇剛也。**\n\n#### 序\n\n**序卦曰：決必有遇，故受之以姤。姤者，遇也。**\n\n風雲相濟之課 或聚或散之象夬，決也，潰決之後，必有遇，姤，遇也，故次夬卦。此卦，乾上巽下，即風行天下，風行時必觸及萬物，故為遇之象。\n\n#### 解\n• 一、官人射鹿：丈夫也，取祿狀，野外之財，射，發也。\n• 二、文書上有喜字：摇摇欲墜，根只一線，夫妻凶。\n• 三、二人執索：互相牽累。\n• 四、綠衣人指路：掌生死簿之人，信差（今日）。\n• 五、二重山：重阻也。出也。","text.tab2":"吾人常見丈夫在外風流多事，桃花運不斷，就是此局生成。\n• 一、 商人財祿豐盛，只旺六年，須注意假像。\n• 二、 官司受牽連，同時生人可能沒事。\n• 三、 外有妾及多位女友。\n• 四、 夫妻失和，如命中屬二婚命，則必破。\n• 五、 官家人亦吉前六年，第七年以後必兇。","text.tab3":"&0&\n**姤：女壯，勿用取女。**\n姤之道在戒陰壯之始，娶女本欲其柔且順從，但初進為陰，而渐進長盛，且有壯於陽者，古来女壯必失男女之道，家道必敗。戒之在初始。\n/0&\n\n#### 彖\n\n**彖曰：姤，遇也，柔遇剛也。勿用取女，不可與長也。**\n姤，乃柔之遇剛，小人之道始遇君子之陽剛，須戒之在始，勿取如是之女，不可使小人之道長。\n\n天地相遇，品物咸章也。剛遇中正，天下大行也。姤之時義大矣哉。\n萬物之生始於天陽地陰之交遇，不遇則不生。但须剛遇中正之道，猶人君之遇賢臣，剛與中正合德，其道必及於天下，姤之道即在遇之始，遇之正則吉，遇之不正須始戒。\n\n#### 象\n\n**象曰：天下有風，姤，后以施命誥四方。**\n君之道，能如風之及於萬物，方可施政令而及於四方，故遇之道能行，天下必因中正之遇，上下配合，而政令能如風之遍及萬物。\n\n柅，貞吉，有攸往，#### 初六：繫于金柅見凶，羸豕孚蹢躅。\n\n柅，柔道牽也。\n##### 象曰：繫于金柅\n\n柅，止車之物，金，堅固意，因姤乃陰始於初而將長盛之卦，小人之道，於始初即應如止車之柅，且繫之，使不進也。此吉。如令其渐盛，不知始戒，有凶，猶羸弱之豕其雖不強，然為陰物，故知其能跳躍之時，必消之，故小人之道於始即消除，則必不能成大，而無有作為矣。\n\n陰柔小人之道，始進則如車之受金柅而止，不使其進，正道必存，吉也。\n\n&1&\n##### 九二：包有魚，无咎，不利賓。\n\n##### 柔之人志易變，必不能專。\n\n姤相遇之道在於專一，陽剛將位之人與五君位應，其志必專一，遇則無災，如又遇於旁人，變其志，則有悔，其不利在不能專一。陰\n/1&\n\n&2&\n##### 九三：臀无膚，其行次且，厲，无大咎。\n\n##### 象曰：包有魚，義不及賓也。\n二位乃初遇志同之時，因不事二主，當如苞苴之魚，只能及於主人，無法及於客賓一樣。\n動，可無咎也。\n\n##### 象曰：其行次且，行未牽也。\n\n時義乃謂初進之人與上位相遇而恰合，此時居上位之人同志於初始進之人，如為求其助，而親密於下，此凶，乃行且困難，必令居不安也，如臀之無膚狀，居此時如懷危懼不妄\n\n相位之人求姤遇於初進之人，中有將位阻隔，故行次且困頓，知危立改，必可未至大殃也。\n/2&\n\n&3&\n##### 九四：包无魚，起凶。\n\n##### 象曰：无魚之凶，遠民也。\n\n君側之人始遇初進同志之相應，但因其已先遇九二位之人，此遇已失，此意味臣位之人不中正，必失其民，故凶。故遇之道，必下不離散，今如下位之人散，上必失道也。\n\n下民遠離，乃起因於已之不中正，或已中正，而下民不相應也。\n/3&\n\n&4&\n##### 九五：以杞包瓜，含章，有損自天。\n\n##### 象曰：九五含章，中正也。有隕自天，志不合，命也。\n\n九五乃至尊之位，上位下求賢才，瓜乃美實但居於下，今上位之人能屈而求下，此乃包含之美德，人君能如此，則必有遇所求之人才，故能屈尊求下內心至誠，如有隕石自天而下，此遇之善道也。\n\n九五至尊，能含有中正之德，求賢而屈下，此存志乃合於天理，必如隕石般，天助而得良才，遇之大道。\n/4&\n\n&5&\n##### 上九：姤其角，吝，无咎。\n\n##### 象曰：姤其角，上窮吝也。\n\n至剛而居上，莫過於角，人之遇，必由降屈相求，巽順相應，此合之由來，如居高而剛極，持才自傲，人何將與之，此人之遠離，乃肇因於己之過亢，非他人之罪也。\n\n遇之如角之亢極，以剛而遇，必致窮極末路，人必散之。\n/5&"},"000110":{"text.tab1":"此卦韓信被呂后疑惑，卜得知，果被其戮也。\n\n#### 圖\n貴人磨玉，一僧指小兒山路，一人救火，一魚在火上，一鳳啣書。\n\n#### 雜\n\n**雜卦曰：萃聚而升不來也**\n\n#### 序\n\n**序卦曰：物相遇而後聚，故受之以萃。萃者，聚也。**\n\n魚龍會聚之課 如水就下之象物相遇而後，同氣相求，則生聚象，萃，聚也。物相聚成群，為萃，故次姤卦之後也此卦，澤上地下，水之聚象，水之在地上，乃方聚之時也。\n\n#### 解\n• 一、貴人磨玉：進修也，專心一致也，免破損也。\n• 二、一僧指：指引也，局外人也，光頭人也，曾姓人也。\n• 三、小兒山路：退引山林，以退為進象，示上坡也。倪姓。\n• 四、一人救火：救災禍也；猶行醫濟世救人之道也。\n• 五、一魚在火上：得救狀，或餐飲業。\n• 六、一鳳啣書：喜訊至也。","text.tab2":"較不多見，但亦有之。\n• 一、女兒不想成婚，對異性沒興趣。\n• 二、終日進德修業。\n• 三、退居家內，代母行職，為良母型之人。\n• 四、如從事餐飲業則大利，為唯一帶喜之路。","text.tab3":"&0&\n**萃：亨，王假有廟。利見大人，亨，利貞。用大牲吉，利有攸往。**\n人之至誠專一莫過於宗廟祭祀之時，王者能令天下之人其心專一，莫過於利用宗廟，故聖人制祭祀之禮以養民之德。此聚之義大也。民聚之時，能得賢才，則必聚而正，如不正，治之不以正理，則亂之生亦由人之聚，故聚必以道，非正之道，即令有聚，亦不能安處也。於聚時祭禮用大牲厚禮，乃示慎重且富是天下必同之，今人聚而人不能亨其豐盛，則必散也。是故古今皆然，凡能與大功立大業之人，第一必得其時，第二必聚而後能用，此動必吉，天理莫及此也。\n/0&\n\n#### 彖\n\n**彖曰：萃，聚也，順以説，剛中而應，故聚也。**\n萃卦，乃上悦下順之象，上位以中道用民，合於民心，下又能順從於上之政令且又剛陽相應，堅心赤誠如此，必能聚天下之人才。\n\n王假有廟，致孝享也。\n王者要有聚民心之道，必立宗廟以示孝順之至誠，能順天下之人心，必以孝方成。\n\n利見大人亨，聚以正也。\n聚之以正道，必能得人才治之，乃因其正也。\n\n用大牲吉，利有攸往，順天命也。\n祭祀時用厚禮祭天，必可有為，此順天命也。\n\n視其所聚，而天地萬物之情可見矣。\n天地萬物間皆有聚，有動，有散等，聖人觀象，可見萬物之情性也。\n\n#### 象\n\n**象曰：澤上於地，萃，君子以除戎器，戒不虞。**\n澤上於地，為集聚之象，君子知始戒之慎，故眾民相聚之初，就也生戒，因眾聚必有爭，私心所成，故先除兵械，乃能戒而無虞。\n\n&1&\n##### 初六：有孚不終，乃亂乃萃，若號，一握爲笑，勿恤，往无咎。\n\n##### 象曰：乃亂乃萃，其志亂也。\n\n聚之始，柔居之，陰柔之人，必無法堅守正節，為求與人同而捨其正道，但為求同，此不終之戒。人心必亂，同氣相求而生聚，或哀號作苦以求相應，其果必為眾人之笑柄，若能堅心往從陽剛正道，必無過咎，否則成小人矣。\n\n若人之心志受人惑而亂，必不能固守節志，乃失其正道也。\n/1&\n\n&2&\n##### 六二：引吉，无咎，孚乃利用禴。\n\n##### 象曰：引吉无咎，中未變也。\n\n二之位與五相對應，位雖有差距，此時乃當聚而未及合之時，如能相引聚則可無咎，此因其中正之德未變，如德變，則必不相吸引。\n故於群小人聚時能獨立其間，且與上位之德同，必能合，此其意也。即令不重外飾，專以至誠，則終必合矣。\n\n萃之時，以能聚為吉，同志相求，平安，其位有差距，因中正誠心同德必能無咎。\n/2&\n\n&3&\n##### 六三：萃如磋如，无攸利，往无咎，小吝。\n\n##### 象曰：往无咎，上巽也。\n上六居柔之極，故能往而無災。\n\n不正之人，求能與人聚合，但人皆不應，為人棄絶，上下皆不應，唯退求事外之賢與之相應，如此則可無咎。人之動有求，即令得之，亦可羞也。\n/3&\n\n&4&\n##### 九四：大吉无咎。\n\n##### 象曰：大吉无咎，位不當也。\n\n九四之位，能以陽剛，與君位對應，得君臣之萃，下又得群陰之聚，此上下能因其陽剛而聚，此至善也。\n\n能有吉且無災之果，即令位不當，因上下與已合德，故也。\n/4&\n\n&5&\n##### 九五：萃有位，无咎。匪孚，元永貞，悔亡。\n\n##### 象曰：萃有位，志未光也。\n\n九五居天下之尊，有萃聚天下之力，則無災，此時必自修其德，正其位，處不以私，為得其位也。如有人不信而未能歸從，當自省是否不正，堅固中正不變之德性，則無不歸矣。\n\n為王者，必以誠信以示天下，如此方有感於民，則人莫不歸矣。如仍有不從，乃已之志未能光顯也\n/5&\n\n&6&\n##### 上六：齎咨涕洟，无咎。\n小人居高位，求人與其聚，而人皆不與，此可嘆也，人之棄絶，實出於已，怎可歸咎他人如再不知自省，反嗟嘆而致涕泣，此小人狀也。\n\n齎咨涕洟洟，未安上也。\n##### 象曰：齎小人之對人皆因貪而失所宜，以致终窮困，此起因於不能安居其位也\n/6&"},"011000":{"text.tab1":"此卦房玄齡去蓬萊採葯未回，卜得知，主不在也。\n\n#### 圖\n雲中雨點下，木匠下墨解木，一人磨鏡，一架子有鏡\n\n**高山植木之課**\n\n**積小成大之象**\n\n#### 雜\n\n**雜卦曰：萃聚而升不來也**\n\n#### 序\n\n**序卦曰：聚而上者，謂之升，故受之以升。**\n\n萃者聚也，聚之後能上，即升也，萬物咸因能聚方可升高，故升次萃也。此卦坤上巽下 ，乃木在地下生於地中，長而愈高此升之象也。\n\n#### 解\n• 一、雲中雨點下：沾衣恩澤之象，昏暗之時將過也。\n• 二、木匠下墨解木：有尺度法則，有依據之象。匠—將也。以武力去災也有改朝換代之象也。\n• 三、一人磨鏡：可成始得之象。\n• 四、一架子負大木：有不小之財也。\n• 五、有鏡：指明鏡高懸，於商事指有競爭也。\n• 六、藍：難也，百廢待與之象。","text.tab2":"其為姤卦之對應卦，在地脈道之屢見不鮮，學者當已嫻熟於卦局之變化，立可知曉。\n• 一、官職大利，平步青雲。\n• 二、事業財祿豐盛。\n• 三、能承繼祖業，更新門面。\n• 四、夫妻有競爭，不和之象。\n• 五、此局不變，婚姻進入第七年必有兇，同時生人不一定會發生，故陽宅影響一人至大，而人們卻茫然不知。","text.tab3":"&0&\n**升：元亨，用見大人，勿恤，南征吉。**\n升之道，在於亨通，用此道来見大人，不靠体恤而能進，必吉。\n/0&\n\n#### 彖\n\n**彖曰：柔以時升，巽而順，剛中而應，是以大亨。**\n柔即順也，順時而升，以柔而進，此升之得時矣，二剛陽之位，得五柔順之君應則能大亨也。\n\n用見大人，勿恤，有慶也。南征吉，志行也。\n用巽順剛陽中正之道來見大人，必遂心志得升，從不去憂升之不遂，此吉慶也，前進則必升，必能遂行其志也。\n\n#### 象\n\n**象曰：地中生木，升；君子以順德，積小以高大。**\n地中生木，木長而高，此升也。君子觀升象，乃知修身之德，由積累微小，乃至高大，故積不善，則不足以成名，凡學問道德之高，皆由累積而成，升之義也。\n\n&1&\n##### 初六：允升，大吉。\n\n##### 象曰：允升大吉，上合志也。\n\n初進時柔順於九二之剛，因得信而升，此升吉也。\n\n與上位之志合，得信而升，此因信於剛中之賢而能大吉也。\n\n禴，无咎。\n/1&\n\n&2&\n##### 九二：孚乃利用禴\n\n##### 象曰：九二之孚，有喜也。\n\n九二陽剛之臣，處升之時，因上位君柔，絶不可矯求外飾，必求以中心之至誠來感通於上，如此則可無咎。\n\n君臣之道，臣之事君能中心至誠，不但為臣無禍，又可遂行其大志，此可喜也。\n/2&\n\n&3&\n##### 九三：升虛邑。\n\n##### 象曰：升虛邑，无所疑也。\n\n九三陽剛之相，能正而順上，如此而升，就如入無人之巿，無人抵禦。\n\n升而如入無人之邑，則此進，必無可疑慮也。\n皆是，升之道，如出私欲，必令國致窮困矣。\n/3&\n\n&4&\n##### 六四：王用享于岐山，吉 ，无咎。\n居諸候之位，能上柔順於君王，下又順天下之賢，舉之升進，於已則柔順謙恭，不求離本位，有德如是，必吉，且無災矣。人之戒，切記在不可無事而升，升又必量力而進，方合君子之道。今人已不復如此，無功而升，比比\n\n##### 象曰：王用享于岐山，順事也。\n/4&\n\n&5&\n##### 六五：貞，吉，升階。\n\n##### 象曰：貞吉升階，大得志也。\n\n君位之人性柔，必得貞正且固守之德，則人皆信而賢至，能知人善用，必因用賢而能再升，澤及天下也。\n\n君能任用賢才，如此可致天下大治，故君王升之道在能用賢耳，必遂其志。\n/5&\n\n&6&\n##### 上六：冥升，利于不息之貞。\n\n##### 象曰：冥升在上，消不富也。\n\n升之極乃致昏昧於升，只知進不知止，此為不明，君子之人終日乾乾，無時不警惕自己，知所進退。小人貪求私慾之心盛，乃生不知進退之行為，凶也。\n\n昏昧之人已至極上，猶求升之不已，其果唯消亡而已，無復增益也。\n\n居君側之人，因知順時順事，能順處之，得坤之性，可以無咎也。\n/6&"},"010110":{"text.tab1":"此卦李德裕罷相時，卜得之，乃知身命無氣也。\n\n#### 圖\n一輪獨在地上，一人臥病，葯爐，貴人倾水救旱池魚，池中青草。\n\n#### 雜\n\n**雜卦曰：井通而困相遇也。**\n\n#### 序\n\n**序卦曰：升而不已，必困，故受之以困。**\n\n河中無水之課 守己待時之象升至極，不知進退，私欲使然，終必至困，故困次升也。此卦「兌」上「坎」下，水在澤上乃有水也，今水在澤下乃枯涸無水之象，此示人之困乏象，本卦論人紀中，君子受小人掩蔽，居窮困之時也。\n\n#### 解\n• 一、一輪獨在地下：獨行也無依也，方向不明也。\n• 二、一人臥病，招危難也。\n• 三、藥爐：有人來救，待時緩進也。\n• 四、貴人傾水救旱池魚：旱池，無財也，有貴人資援。\n• 五、池中青草：仍有生氣狀。","text.tab2":"困之於人大矣，吾道人士能為眾生解開此局，亦無量功德也。\n• 一、體弱多病，限不過三十歲。\n• 二、性剛烈，獨行獨斷。\n• 三、婚事不成，多有阻滯。\n• 四、財祿不守，只有一線生機，故從商必兇。\n解之唯大過可也。","text.tab3":"&0&\n**困：亨，貞，大人士口，无咎，有言口不信。**\n困之時，如何用困之道，乃易之精神，大人居困時，以樂天安命，隨時善處，自得其樂，必吉。有愚頑之人，居困而力求言，人必不信也。\n/0&\n\n#### 彖\n\n**彖曰：困，剛揜也。險以説，困而不失其所亨，其唯君子乎？**\n困之生乃因剛為柔所掩蔽，專言君子之道為小人所掩蔽，而困窮之時君子知困之道，外悦內險，處困而能以悦之度量居之，不失正道，則其道必自然亨通，能如此之人，必為君子貞，大人吉，以剛中也。有言不信，尚口乃窮也。\n處困時，君子能吉，乃因堅守剛中之道，不變節。於困之時，所言人必不信，如反求己之口才以脱困，必更致困，此即為尚口之戒。\n\n#### 象\n\n**象曰：澤无水，困。君子以致命遂志。**\n澤中無水，困之象。居此時君子以力盡防患之法，如仍難免，則歸之於命，泰然處之，絶不因困窮而變其志節。小人遇困，志節必變，但求附於他人，以求脱困，其終必凶。\n\n&1&\n##### 初六：臀困于株木，入于幽谷，三歲不覿。\n\n##### 象曰：入于幽谷，幽不明也。\n\n陰柔之人位居卑下，又無上位救助，猶如無葉之木，無法蔭庇下物，因無庇蔭，故不能安居於此，如進入幽暗之谷，無法自出，有三年的時間無法入亨。\n\n##### 自陷於深谷，乃出自己之不明也。\n/1&\n\n&2&\n##### 九二：困于酒食，朱紱方來，利用享祀：征凶，无咎。\n常人無不為酒食所困，不知酒食之施，乃生於人有所欲，常言：宴無好宴。君子之飲與小人不同，能困君子的，必是其剛正之道不足以濟天下之困，此其困擾也。居此時君子必求至誠以守，等待時機，可利用祭祀以示至誠，俟貴人至，求之方吉。若不安居困，自往求之，\n\n##### 其招凶皆自取也。\n\n##### 象曰：困于酒食，中有慶也。\n居困時，雖未能施惠於人，如能守其剛中之德，必能亨。而有吉慶也。\n/2&\n\n&3&\n##### 六三：困于石，據于蒺藜，入于其宮，不見其妻，凶。\n\n##### 象曰：據于蒺藜，乘剛也。入于其宮，不見其妻，不祥也。\n\n處困可羞之時，卻用外剛來飾內險，益增自困，必堅重如石，而不安之情如手握蒺藜之物，因刺多而不能握，進退不得狀，必失所居，凶。\n\n此言內之不安，欲求外剛來飾，乃用剛之不正，必終失所安，果必不祥也\n/3&\n\n&4&\n##### 九四：來徐徐，困于金車，吝，有終。\n\n##### 象曰：來徐徐，志在下也，雖不當位，有與也。\n\n居君側之人，不以中正之道處困時，而才能又不足濟困，其來動必遲遲，困於金車之內，必不見容於世，可羞也，如知濟困得中正之道，乃有歸也。\n\n居不適位，志在求下，其雖徐徐而來，即令未善，但因與正相應，必有果矣。\n/4&\n\n&5&\n##### 九五：劓刖，困于赤紱，乃徐有説，利用祭祀。\n\n##### 象曰：劓刖，志未得也，乃徐有説，以中直也，利用祭祀，受福也。\n\n劓，乃上有傷，刖，乃下有傷，人君之困，乃上下無應，天下之民不來也，必起用剛正之賢才，以至誠待之，並利用祭祀，示道之至誠於天，則民必徐來。\n\n上下不應，君王之困，其志不遂，於此必用祭祀以至誠，求得天下之賢，必能濟天下之困，終享其福慶也。\n/5&\n\n&6&\n##### 上六：困于葛藟，于臲卼，曰動悔。\n有悔，征吉。\n\n##### 象曰：困于葛藟，未當也，動悔有悔，吉行也。\n\n困至極，必生變，如物之纏束於身，動則有悔，無所不困，即動靜皆困，必求進，方有吉處。\n\n為困纏身，無法求變，乃未知困之道，知動有悔，求悔而去，必可出困，其行必吉矣。\n/6&"},"011010":{"text.tab1":"此卦楊貴妃，私與安祿山為事，卜得之，反受其害也。\n\n#### 圖\n金甲神執符，女子抱合，錢寶有光起，人落井中，官人用繩引出。\n\n**珠藏深淵之課**\n\n**守靜安常之象**\n\n#### 雜\n\n**雜卦曰：井通而困相遇也。**\n\n#### 序\n\n**序卦曰：困乎上者，必反下，故受之以井。**\n\n困之後，如至極，則纏身動彈不得，猶陷井中，故困之後為井。物之居下者，莫如井，此卦坎上巽下，坎為水，巽為木，木在水下，必上乎水，故有汲井之象。\n\n#### 解\n• 一、金甲神執符：貴人在空中，祥瑞之兆也。\n• 二、女子抱合：好也，但先成後破。\n• 三、錢寶有光起：財不失，不露之象，不久有喪也。\n• 四、人落井中：病重象，官司沈陷象，招陷害也。\n• 五、官人用繩引出：貴人為官人，欲相救也。\n• 六、符：符乃策略有傍人作對。","text.tab2":"• 一、婚事娶二婚妻，且妻長。\n• 二、心志不堅，受外在誘惑，無法自拔。\n• 三、從商吉，有祖業更吉。\n• 四、從官招陷，是非不斷，升遷受阻。","text.tab3":"&0&\n**井：改邑不改井，无喪无得，往來井井。**\n井，為不常改之處，常見都巿已改，但井無法遷動，井之性，汲之不竭，存之不盈，故曰無喪無得，凡人至井側，皆受其用，此不變之常德也，此為井之道。\n\n繘井，贏其瓶，凶。\n汔至，亦未繘井之道在乎供人用為善，如人至而未用井，仍飲泉，則有亦若無。君子之道，以有成為貴，如道即令正，但不為所用，亦等於無也。徒自招凶。\n/0&\n\n#### 彖\n\n**彖曰：巽乎水而上水，井，井養而不窮也，改邑不改井，乃以剛中也。**\n木入水中，而又上於水，此井也，井能養物，不盡不竭，此井德之常也。城巿可改，而井不能遷，猶君子剛中之德，即令再艱險，卻永不改變其志。\n\n汔至亦未繘井，未有功也，羸其瓶，是以凶也。\n井以供人使用為功，今人至井側，而不用井，則有井亦同於無井，無法發揮井之功用。瓶須盛水，今破壞，是以無用而致凶也。\n\n#### 象\n\n**象曰：木上有水，井，君子以勞民勸相。**\n君子觀井象，效法井之性，為助民而任勞，且教其互助之功，此效法井之佈施無私也。\n\n&1&\n##### 初六：井泥不食，舊井无禽。\n\n##### 患，莫過於為師，即有舊井之戒。\n\n井之道，始為井之時，仍不適用也，井內初無水，其底為泥，不可食，井之德能養人，乃其有水也。今若為廢棄之舊井，其無水，故必無禽至，猶人之無才無法濟物，必為時代淘汰。今之師即須有舊井之戒，故孟子曰：人之\n\n初為陰柔，而居井之底，乃泥象，無水之泥，人必不食，無水之井亦無禽聚，此必為時所捨之也。\n\n##### 象曰：井泥不食，下也，舊井无禽，時舍也。\n/1&\n\n&2&\n##### 九二：井谷射鮒，甕敝漏。\n\n##### 象曰：井谷射鮒，无與也。\n\n陽剛居將位，居井之時，上不對應，因而趨下，失井之道，降下而趨泥，而成微不足道之物，如破漏之甕也，終必無功。\n\n井，能出水助人為功用，故以能出為成功，今陽剛之才，本可濟用於世，因上不用故成無用。\n/2&\n\n&3&\n##### 九三：井渫不食，爲我心惻，可用汲，王明並受其福。\n\n##### 象
