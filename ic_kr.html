병이 덜해지니 빠르게 기뻐진다. 허물이없다.\n\n##### 상왈: 그 질병을 감소시킨다. 허락한다.\n\n/4&\n\n&5&\n##### 六五：혹익지 십붕지구불극위 원길(或益之，十朋之龜弗克違，元吉) 혹 그것을 더하면 열 무리의 거북이 균열함을 이기지못하니 본디 길하다.\n\n##### 상왈: 원형이정(元吉). 위에서 순종한다.\n\n/5&\n\n&6&\n##### 上九：불손익지 무구 정길 이유유왕 득신무가(弗損益之，无咎，貞吉，利有攸往，得臣无家) 그것을 덜지도 더하지도 않는다. 허물이없다. 바르니 길하다. 갈바가있어 이롭다. 집이 없는 신하를 얻다.\n\n##### 상왈: 감소하지 않고 증가한다. 큰 뜻을 얻는다.\n\n/6&"},"100011":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/042.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 손익(損益)은 흥망성쇠의 단초들이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 더하는것은 부득이 반드시 결단한다. 고로 그것을 쾌(夬)로 받는다. 쾌는 결정하는것이다.**","text.tab3":"&0&\n**풍뢰익(風雷益): 익(益) 이유유왕 이섭대천(利有攸往，利涉大川)**\n**대상 (大象): 바람과 천둥이다. 益이다. 군자는 선을 보면 따라가고 과실을 보면 고친다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 益은 위를 덜어 아래를 더한다. 백성이 기뻐하여 끝이 없다. 위로부터 아래로 내려온다. 그 도가 크게 빛난다. 가는 것이 이롭다. 중앙과 바름에 경사가 있다. 큰 강을 건너는 것이 이롭다. 나무의 도가 이에 행한다. 益이 움직이고 유순하다. 날로 나아가 끝이 없다. 하늘이 베풀고 땅이 낳는다. 그 더함이 방향이 없다. 무릇 益의 도는 때와 함께 행한다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：이용위대작 원길 무구(利用為大作，元吉，无咎) 큰일을 하게함이 이롭다. 본디 길하고 허물이 없다.\n\n##### 상왈: 대형을 건너면 이롭다. 큰 뜻을 얻는다.\n\n/1&\n\n&2&\n##### 六二：혹익지 십붕지구불극위 영정길 왕용형우제 길(或益之，十朋之龜弗克違，永貞吉。王用享于帝，吉) 혹 그것을 더하면 열마리의 거북이(등껍데기)가 균열을 이기지못한다. 길고바르니 길하다. 왕이 천제(天帝)에 형통하여 쓰니 길하다.\n\n##### 상왈: 혹은 십(十)의 거북을 받는다. 위에서 순종한다.\n\n/2&\n\n&3&\n##### 六三：익지용흉사 무구 유부중행 고공용규(益之用凶事，无咎。有孚中行，告公用圭) 그것을 더하여 쓰니 일이 흉하다. 허물은없다. 가운데로 가니 믿는바가있다. 공이 저울눈을 사용함을 고하다.\n\n##### 상왈: 증가로 재앙을 만난다. 뜻이 행해진다.\n\n/3&\n\n&4&\n##### 六四：중행 고공종 이용위의천국(中行，告公從。利用爲依遷國) 가운데로 가다. 공이 쫓음을 고하다. 그나라를 의지해 옮기니 이롭다.\n\n##### 상왈: 중정(中正)으로 공(公)에게 보고한다. 뜻이 행해진다.\n\n/4&\n\n&5&\n##### 九五：유부혜심 물문원길 유부혜아덕(有孚惠心，勿問元吉。有孚惠我德) 은혜를 믿는바가있다. 본디 길함을 묻지말라 내가베푼은혜를 믿는바가있다.\n\n##### 상왈: 믿음이 있으면 자비롭게 묻는다. 물어보지 않아도 길하다. 덕을 받는다.\n\n/5&\n\n&6&\n##### 上九：막익지 혹격지 입심물항흉(莫益之，或擊之，立心勿恒凶) 그 더함이 없다. 혹 그것을 친다. 마음을 세우고 항상 근심하지 말라.\n\n##### 상왈: 증가하지 않는다. 편향된다. 재앙이 있다.\n\n/6&"},"111110":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/043.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 쾌(夬)는 결(決)이어서，강함(剛)은 유(柔)함을 결(決)한다. 군자의 길은 장구하고 소인의 길은 근심이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 쾌는 반드시 만나는바가있으니 이런까닭에 구(姤)로써 그것을 이어받는다. 구는 만나는바이다.**","text.tab3":"&0&\n**택천쾌(澤天夬): 쾌(夬)  양우왕정 부호 유려 고자압 불리즉융 이유유왕(揚于王庭，孚號，有厲，告自邑，不利即戎，利有攸往)**\n**대상 (大象): 호수가 하늘 위에 있다. 夬이다. 군자는 아래에 복을 베풀고 덕에 거처하면 꺼린다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 夬는 결단이다. 강건함이 유순함을 결단한다. 강건하고 기쁘다. 결단하되 화합한다. 왕의 조정에 드날린다. 유순함이 다섯 강건함을 탄다. 신의로 호소하되 위태로움이 있다. 그 위태로움이 빛난다. 고을로부터 알린다. 군사를 쓰는 것이 이롭지 않다. 숭상하는 바가 궁하기 때문이다. 가는 것이 이롭다. 강건함이 길어져 마침내 끝난다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：장우전지 왕불승위구(壯于前趾，往不勝爲咎) 앞터에서 씩씩하다. 이따금 허물이되 훌륭하지못하다.\n\n##### 상왈: 발가락에 강함이 있다. 가면 이기지 못한다. 허물이 있다.\n\n/1&\n\n&2&\n##### 九二：척호 막야유융 물휼(惕號，莫夜有戎，勿恤) 부름을 두려워하다. 조용한 밤에 오랑캐가 있다. 불쌍히 여기지말라.\n\n##### 상왈: 경계하고 외친다. 밤에 군대가 있으면 걱정하지 말라. 중정(中正)이다.\n\n/2&\n\n&3&\n##### 九三：장우규 유흉 군자쾌쾌 독행우우 약유유온 무구(壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎) 광대뼈가 씩씩하다.  홀로 가다 비를 만난다. 젖었으나 따뜻함이 있다. 허물이 없다.\n\n##### 상왈: 뺨에 강함이 있다. 흉하다. 군자가 결단한다. 끝에는 허물이 없다.\n\n/3&\n\n&4&\n##### 九四：둔무부 기행차차 견양회망 문언불신(臀无膚，其行次且。牽羊悔亡，聞言不信)\n\n##### 상왈: 엉덩이에 살이 없다. 걷기 어렵다. 위치가 부적절하다. 말을 듣지 않는다. 듣지 않는다.\n\n/4&\n\n&5&\n##### 九五：현륙쾌쾌 중행무구(莧陸夬夬，中行无咎) 상륙(商陸)은 그 성질이 쾌히 하는바이다. 가운데를 가니 허물이없다.\n\n##### 상왈: 중정(中正)으로 행한다. 중정(中正)이다.\n\n/5&\n\n&6&\n##### 上六：무호 종유흉(无號，終有凶) 부름이없다. 끝에 근심이 있다.\n\n##### 상왈: 외치지 않는다. 끝에는 재앙이 있다. 어떻게 오래 갈 수 있겠는가.\n\n/6&"},"011111":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/044.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 구(姤)는 짝하는것(遇)이니 유(柔)가 강(剛)을 맞이하는것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 서로 만나는 연후에 취합하는것이다. 고로 그것을 췌(萃)로 받는다. 췌는 취합인것이다.**","text.tab3":"&0&\n**천풍구(天風姤): 구(姤)  여장(女壯) 물용취녀(勿用取女)**\n**대상 (大象): 하늘 아래에 바람이 있다. 姤이다. 후(后)가 명령을 베풀어 사방에 고한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 姤는 만남이다. 유순함이 강건함을 만난다. 여자를 취하는 데 쓰지 말라. 오래 함께할 수 없다. 하늘과 땅이 서로 만난다. 만물이 모두 드러난다. 강건함이 중앙과 바름을 만난다. 천하가 크게 행한다. 姤의 시의가 크도다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：계우금니 정길 유유왕 견흉 리시지촉(系于金柅，貞吉，有攸往，見凶，羸豕踟躅) 수레바퀴 고동쇠에 매어놓다. 바르니길하다.  갈바가있으면 흉함을 본다. 파리한 돼지가 머뭇머뭇거린다.\n\n##### 상왈: 금속 제동에 묶인다. 부드럽다. 순종한다.\n\n/1&\n\n&2&\n##### 九二：포유어 무구 불리빈(包有魚，无咎，不利賓) 물고기가 있어 포장한다. 허물이 없으나 물가는 이롭지 않다.\n\n##### 상왈: 포(包)에 물고기가 있다. 손님에게 이롭지 않다. 아래에서 순종하지 않는다.\n\n/2&\n\n&3&\n##### 九三：둔무부 기행차저 려 무대구(臀无膚，其行次且，厲，无大咎) 볼기에 살이 없다. 그 행함에 또 머뭇거린다. 힘쓴다면 크게허물은 없다.\n\n##### 상왈: 엉덩이에 살이 없다. 걷기 어렵다. 행동이 순종하지 않는다.\n\n/3&\n\n&4&\n##### 九四：포무어 기흉(包无魚，起凶) 포장한 물고기가 없다. 흉이 일어난다.\n\n##### 상왈: 포(包)에 물고기가 없다. 멀리 떨어져 있다.\n\n/4&\n\n&5&\n##### 九五：이기포과 함장 유운자천(以杞包瓜，含章，有隕自天) 쟁기로 오이를 얻음는 본보기를 머금은바이다. 하늘에서 떨어진것이다.\n\n##### 상왈: 포(包)에 버드나무가 있다. 중정(中正)이다. 하늘에서 떨어진다.\n\n/5&\n\n&6&\n##### 上九：후기각 린무구(姤其角，吝无咎) 부딪쳐 만나니 인색하나 허물은 없다.\n\n##### 상왈: 그 뿔에 만난다. 위에 있어서 궁(窮)하다.\n\n/6&"},"000110":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/045.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 췌(萃)는 모으려고 나아가나 오지않음이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 취합하여 위에 있는것은 소위 승(升)한것이다. 이런까닭에 승(升)으로써 그것을 이어받는다.**","text.tab3":"&0&\n**택지췌(澤地萃): 췌(萃)는 형(亨) 왕하유묘 이견대인 형 이정 용대생길 이유유왕(王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往)**\n**대상 (大象): 호수가 땅 위에 있다. 萃이다. 군자는 무기를 제거하고 예기치 않은 일에 경계한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 萃는 모임이다. 순하여 기쁘다. 강건함이 중앙에 있고 응한다. 그러므로 모인다. 왕이 묘당에 이른다. 효성스럽게 향사를 이른다. 대인을 만남이 이롭고 형통한다. 바름으로 모이기 때문이다. 큰 희생을 쓰면 길하다. 가는 것이 이롭다. 하늘의 명을 순종하기 때문이다. 그 모이는 바를 관찰하면 하늘과 땅과 만물의 정을 볼 수 있다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：유부부종 내란내췌 약호일악위소 물휼왕무구(有孚不終，乃亂乃萃，若號一握為笑，勿恤，往无咎) 끝이아님을 믿는바가있다. 난리여도 모인다. 하나가 작다고 일컬어지고 웃겠으나  근심하지말라 갈바가 있음은 허물이 없겠다.\n\n##### 상왈: 혼란스럽게 왕래한다. 뜻이 행해지지 않는다.\n\n/1&\n\n&2&\n##### 六二：인길무구 부내이용약(引吉，无咎，孚乃利用禴) 이끄니 길하고 허물이 없다. 약소를 알고 이로움을 믿는다.\n\n##### 상왈: 인도한다. 길하다. 허물이 없다. 중정(中正)으로 뜻이 행해지지 않는다.\n\n/2&\n\n&3&\n##### 六三：췌여차여 무유리 왕무구 소린(萃如，嗟如，无攸利，往无咎，小吝) 갑작스럽게 이르러 이로운바가없다. 갈바가있으니 허물은 없다. 약간은 인색하다.\n\n##### 상왈: 모임에 슬프다. 위에 순종하지 않는다.\n\n/3&\n\n&4&\n##### 九四：대길무구(大吉，无咎) 대길하고 무구하다.\n\n##### 상왈: 큰 길함이다. 뜻이 행해지지 않는다.\n\n/4&\n\n&5&\n##### 九五：췌유위무구 비부원영정회망(萃有位，无咎。匪孚，元永貞，悔亡) 모이니 차례가있다. 허물없다. 믿지않는다. 본디 길고 바르다. 잊음을 후회한다.\n\n##### 상왈: 모임에 위치한다. 뜻이 행해지지 않는다.\n\n/5&\n\n&6&\n##### 上六：재자체이 무구(齎咨涕洟，无咎) 탄식하고탄식한다. 눈물 콧물이 흘른다. 허물이없다.\n\n##### 상왈: 한숨을 쉬고 눈물을 흘린다. 안에 있어도 궁(窮)하지 않다.\n\n/6&"},"011000":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/046.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 췌(萃)는 모으려고 나아가나 오지않음이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 승은 부득이 반드시 곤한다. 고로 그것을 곤(困)으로 받는다.**","text.tab3":"&0&\n**지풍승(地風升): 승(升) 원형(元亨)，용견대인(用見大人)，물휼(勿恤)，남정길(南征吉)**\n**대상 (大象): 땅 가운데 나무가 자란다. 升이다. 군자는 순종하는 덕으로 작은 것에서 큰 것으로 쌓는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 유순함이 때에 올라간다. 유순하고 순하다. 강건함이 중앙에 있고 응한다. 이에 크게 형통한다. 대인을 만남을 쓴다. 걱정하지 말라. 경사가 있다. 남쪽으로 정벌하면 길하다. 뜻이 행하기 때문이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：윤승 대길(允升，大吉) 진실로 올라가는바는 크게 길하다.\n\n##### 상왈: 상승에 허락한다. 큰 길함이다. 위에서 순종한다.\n\n/1&\n\n&2&\n##### 九二：부내이용약 무구(孚乃利用禴，无咎) 믿는바 약소함을 씀이 이롭다. 허물없다.\n\n##### 상왈: 믿음이 있으면 제사에 이롭다. 허물이 없다. 중정(中正)으로 뜻이 행해진다.\n\n/2&\n\n&3&\n##### 九三：승허읍(升虛邑) 허한 읍에 나아가다.\n\n##### 상왈: 빈 성에 상승한다. 의심하지 않는다.\n\n/3&\n\n&4&\n##### 六四：왕용형우기산 길 무구(王用亨于岐山，吉 无咎) 왕이 갈림길에 형통하여 쓴다. 길하고 허물없다.\n\n##### 상왈: 왕이 기산(岐山)에서 제사한다. 순종한다.\n\n/4&\n\n&5&\n##### 六五：정길 승계(貞吉，升階) 바르고 길하다. 돌계단을 오른다.\n\n##### 상왈: 정직하면 길하다. 큰 뜻을 얻는다.\n\n/5&\n\n&6&\n##### 上六：명승 이우불식지정(冥升，利于不息之貞) 날이 저물어도 오른다. 쉬지않는 곧음에서 이롭다.\n\n##### 상왈: 어둠 속에 상승한다. 부(富)하지 않다.\n\n/6&"},"010110":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/047.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 곤(困)은 서로 만남이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 곤은 위의 것이 반드시 반대로 아래에 처하는것이다. 이런까닭에 정(井)으로써 그것을 이어받는다.**","text.tab3":"&0&\n**택수곤(澤水困): 곤(困)  형(亨)，정대인길 무구 유언불신(貞大人吉，无咎，有言不信)**\n**대상 (大象): 호수에 물이 없다. 困이다. 군자는 목숨을 바쳐 뜻을 이루려 한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 困은 강건함이 가려진다. 위험으로 기쁘다. 困하되 그 형통한 바를 잃지 않는다. 오직 군자만이 그러하다. 바름에 대인이 길하다. 강건함이 중앙에 있기 때문이다. 말이 있어도 믿지 않는다. 말을 숭상하면 궁하기 때문이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：둔곤우주목 입우유곡 삼세불견(臀困于株木，入于幽谷，三歲不見) 엉덩이가 나무그루터기에 곤하다.  깊은 골짜기에 들어가 수년을 보지않는다.\n\n##### 상왈: 엉덩이가 나무에 묶여 있다. 깊은 골짜기에 들어간다. 어둡다.\n\n/1&\n\n&2&\n##### 九二：곤우주식 주불방래 이용형사 정흉 무구(困于酒食，朱紱方來，利用亨祀，征凶，无咎) 주식에 곤란하다. 주불(붉은색 제복)은 사방에서 찾아온다. 제사를 형통케 씀이 이롭다. 나아가면 흉하고 허물은없다.\n\n##### 상왈: 압박에 음식과 술이 있다. 중정(中正)으로 뜻이 행해진다.\n\n/2&\n\n&3&\n##### 六三：곤우석 거우질려 입우기궁 불견기처 흉(困于石，據于蒺藜，入于其宮，不見其妻，凶) 돌에 곤하다. 질려에 거한다. 그 집에 들어가 그 처를 만나지않는다. 흉이다.\n\n##### 상왈: 돌에 압박당한다. 가시에 의지한다. 집에 들어가면 아내를 보지 못한다. 집에 돌아가지 않는다.\n\n/3&\n\n&4&\n##### 九四：래서서 곤우금거 린 유종(來徐徐，困于金車，吝，有終) 서서히 오니  쇠수레에 곤하다. 인색하나 끝이 있다.\n\n##### 상왈: 느리게 온다. 금 수레에 압박당한다. 위치가 부적절하다. 뜻이 행해진다.\n\n/4&\n\n&5&\n##### 九五：의월 곤우적불 내서유설 이용제사(劓刖，困于赤紱，乃徐有說，利用祭祀) 코를 베고 발꿈치를 베는 형벌은 적불(붉은색 제복)에서 곤하다. 서서히 제사하니 제사를 쓰는 이로움있다.\n\n##### 상왈: 코와 발이 잘린다. 중정(中正)으로 뜻이 행해진다.\n\n/5&\n\n&6&\n##### 上六：곤우갈류 우얼계 왈동회 유회 정길(困于葛藟，于臲甈，曰動悔。有悔，征吉) 칡덩쿨에서 곤하다. 위태하다. 왈, 움직임을 후회한다.  뉘우침이 있어  나아가면 길하다.\n\n##### 상왈: 가시에 압박당한다. 위에 있어서 궁(窮)하다. 후회한다. 후회하면 가면 길하다. 뜻이 행해진다.\n\n/6&"},"011010":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/048.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 정(井)은 통(通)하고 곤(困)은 서로 만남이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 우물의 도(道)는 혁(革)하지않을수없다. 고로 그것을 혁(革)으로 받는다.**","text.tab3":"&0&\n**수풍정(水風井): 정(井)   개읍불개정 무상무득 왕래정 정흘 지역미상 유영기병 흉(改邑不改井，无喪无得，往來井。井汔，至亦未繘。井羸其瓶，凶)**\n**대상 (大象): 나무 위에 물이 있다. 井이다. 군자는 백성을 수고롭게 하고 서로 권면한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 물에 유순하여 물을 위로 올린다. 井이다. 井이 기르되 궁하지 않는다. 고을을 바꾸어도 우물은 바꾸지 않는다. 강건함이 중앙에 있기 때문이다. 거의 이르렀으나 아직 우물을 끌어올리지 못했다. 공이 없다. 그 두레박을 상한다. 이에 흉하다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：정니불식 구정무금(井泥不食，舊井无禽) 우물에 진흙이 있어 먹지않는다. 오래된 우물이 날짐승이 없다.\n\n##### 상왈: 우물에 진흙이 있다. 먹지 않는다. 아래에 떨어진다.\n\n/1&\n\n&2&\n##### 九二：정곡사부 옹폐루( 井谷射鮒，瓮敝漏) 우물계곡에서 붕어를 쏜다. 항아리가 깨져 물이 샌다.\n\n##### 상왈: 물병이 부서진다. 자조(自助)한다.\n\n/2&\n\n&3&\n##### 九三：정설불식 위아별측 가용급 왕명 병수기복(井渫不食，為我民惻，可用汲，王明，并受其福) 먹지않는 우물을 준설한다. 내가 백성을 측은히여김이니 (이제) 물을 길을수있다. 왕이 밝으면  우물이 그 복을 받는다.\n\n##### 상왈: 우물이 깨끗하지 않다. 마시지 않는다. 행동이 순종한다. 왕이 밝다. 모두 복을 받는다.\n\n/3&\n\n&4&\n##### 六四：정추 무구(井甃，无咎) 우물을 수리하니 허물이없다.\n\n##### 상왈: 우물이 벽돌로 되어 있다. 수정한다.\n\n/4&\n\n&5&\n##### 九五：정렬 한천식(井冽，寒泉食) 우물물이 맑으니 서늘한샘물을 먹는다.\n\n##### 상왈: 찬 샘물을 마신다. 중정(中正)이다.\n\n/5&\n\n&6&\n##### 上六：정수물막 유부무길(井收勿幕，有孚无吉) 물을 길으니 막지말라 믿음은 있으나 길함은 없다.\n\n##### 상왈: 원형이정(元吉). 위에 있어서 큰 공이 있다.\n\n/6&"},"101110":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/049.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 혁(革)은 이유를 제거함이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물을 새로이 취하는것은 솥같음만한것이없다. 이런까닭에 정(鼎)으로써 그것을 이어받는다.**","text.tab3":"&0&\n**택화혁(澤火革): 혁(革)  이일내부 원형 이정 회망(己日乃孚，元亨，利貞，悔亡)**\n**대상 (大象): 호수 가운데에 불이 있다. 革이다. 군자는 역법을 제정하여 때를 밝힌다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 革은 물과 불이 서로 쉰다. 두 여자가 함께 살되 그 뜻이 서로 얻지 못한다. 革이라 한다. 이미 된 날에 믿는다. 혁하고 그것을 믿는다. 문명하고 기쁘다. 크게 형통하여 바르다. 혁하되 마땅하다. 그 뉘우침이 이에 없어진다. 하늘과 땅이 혁하여 사시가 이루어진다. 탕왕과 무왕이 혁명을 하였다. 하늘을 순종하고 사람에게 응한다. 革의 시기가 크도다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：공용황우지혁(鞏用黃牛之革) 단단한 황소의 가죽을 사용한다.\n\n##### 상왈: 황소 가죽으로 묶는다. 행할 수 없다.\n\n/1&\n\n&2&\n##### 六二：이일내혁지 정길 무구(已日乃革之，征吉，无咎) 그후얼마되지아니한 날에 그것을 고친다. 먼길로 나아가나 길하다. 허물없다.\n\n##### 상왈: 자신의 날에 혁명을 한다. 뜻이 행해진다.\n\n/2&\n\n&3&\n##### 九三：정흉 정려 혁언삼취 유부(征凶，貞厲，革言三就，有孚) 먼길로 나아가니 흉하다. 바름에 힘쓴다.  말을 고쳐 세번 취하니 믿는바가있다.\n\n##### 상왈: 혁명의 말을 세 번 말한다. 또 어디로 가겠는가?\n\n/3&\n\n&4&\n##### 九四：회망 유부개명 길(悔亡，有孚改命，吉) 실망을 후회한다. 고친명령을 믿는바가있다. 길하다.\n\n##### 상왈: 믿음이 있으면 명령을 바꾼다. 뜻이 행해진다.\n\n/4&\n\n&5&\n##### 九五：대인호변 미점유부(大人虎變，未占有孚) 대인은 호랑이로 변한다. 아직 점하지않다 믿는바가 있다.\n\n##### 상왈: 대인은 호랑이처럼 변한다. 문(文)이 밝다.\n\n/5&\n\n&6&\n##### 上六：군자표변 소인혁면 정흉 거정길(君子豹變，小人革面，征凶，居貞吉) 군자는 표범으로 변한다. 소인은 낯을 고친다. 먼길로 나아가니 흉하다. 거하고 바르니 길하다.\n\n##### 상왈: 군자는 표범처럼 변한다. 문(文)이 밝다. 소인은 얼굴을 바꾼다. 순종한다.\n\n/6&"},"011101":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/050.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 정(鼎)은 새로운것을 취(取)함이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): (솥은)주된 그릇으로써 이는 장자같은것이니 고로 그것을 진(震)으로 받는다. 진은 움직이는바이다.**","text.tab3":"&0&\n**화풍정(火風鼎): 정(鼎)  원길 형(元吉，亨)**\n**대상 (大象): 나무 위에 불이 있다. 鼎이다. 군자는 자리를 바르게 하여 명령을 굳힌다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 鼎은 형상이다. 나무로 불에 유순하여 요리를 한다. 성인이 요리하여 상제에게 향사한다. 그리고 크게 요리하여 성현을 기른다. 유순하고 귀와 눈이 총명하다. 유순함이 나아가 위로 행한다. 중앙을 얻고 강건함에 응한다. 이에 크게 형통한다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：정전지 이출부 득첩 이기자무구(鼎顛趾，利出否，得妾, 以其子无咎) 뒤집힌 솥발이다. 나가지않음이 이롭다. 첩을 얻으니 그아이로써 허물이없다.\n\n##### 상왈: 솥이 발이 뒤집혔다. 이롭지 않다. 순종한다.\n\n/1&\n\n&2&\n##### 九二：정유실 아구유질 불아능즉 길(鼎有實，我仇有疾，不我能即，吉) 솥이 실하다. 내짝은 지병이다. 내가할수있는바가 없는 즉 길하다.\n\n##### 상왈: 솥에 음식이 있다. 조심한다.\n\n/2&\n\n&3&\n##### 九三：정이혁 기행색 치고불식 방우휴회 종길(鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉) 솥귀를 고치다. 그 행함이 막히다. 꿩이 기름지니 먹지않는다. 사방에서 비가오고 후회가 일그러진다. 끝이길하다.\n\n##### 상왈: 솥의 귀가 제거된다. 잃는다.\n\n/3&\n\n&4&\n##### 九四：정절족 부공속 기형악 흉(鼎折足，覆公餗，其形渥，凶) 솥의발을 부러뜨리다. 다시 공이 죽을 쑤니 그형태가 두텁다 흉하다.\n\n##### 상왈: 공(公)의 식사가 엎어진다. 신뢰하지 않는다.\n\n/4&\n\n&5&\n##### 六五：정화이금현 이정(鼎黃耳金鉉，利貞) 솥의 귀와현이 황금이다. 바르니 이롭다.\n\n##### 상왈: 황금 손잡이가 있다. 중정(中正)이다.\n\n/5&\n\n&6&\n##### 上九：정옥현 대길 무불리(鼎玉鉉，大吉，无不利) 솥의 현이 옥이다. 크게길하다. 불리함이 없다.\n\n##### 상왈: 옥 손잡이가 있다. 강과 유(柔)가 접촉한다.\n\n/6&"},"100100":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/051.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 진(震)은 일어나는것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 끝내는 움직일수없으니 그것이 그친다. 이런까닭에 간(艮)으로써 그것을 이어받는다. 간은 멈춤이다.**","text.tab3":"&0&\n**진위뢰(震爲雷): 진(震)   형 진래색색 소은액액 진경백리 불상비창(亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯)**\n**대상 (大象): 거듭된 천둥이다. 震이다. 군자는 두려움과 떨림으로 자신을 닦고 반성한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 震이 형통한다. 震이 와서 두려워한다. 두려워하여 복을 이른다. 웃음과 말이 크도다. 뒤에 법칙이 있다. 震이 백리를 놀라게 한다. 먼 것을 놀라게 하고 가까운 것을 두렵게 한다. 나가서 종묘사직을 지킬 수 있다. 제주로 삼는다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：진래색색 후소은액액 길(震來虩虩，后笑言啞啞，吉) 천둥이 치니 놀라고 두려워한다. 왕후의웃음은 화기애애 웃는다. 길하다.\n\n##### 상왈: 천둥이 와서 웃는다. 길하다. 두려워한다.\n\n/1&\n\n&2&\n##### 六二：진래려 억상패 제우구릉 물축 칠일득(震來厲，億喪貝，躋于九陵，勿逐，七日得) 벼락이 빠르게온다.  아주 많이 재화를 잃는다. 구릉에 오르다. 쫓지말라 칠일후에야 얻는다.\n\n##### 상왈: 천둥이 와서 위험하다. 승(乘)이 강하다.\n\n/2&\n\n&3&\n##### 六三：진소소 진행무생(震蘇蘇，震行无眚) 위세가 되살아난다. 우레가 행하니 흐림이없다.\n\n##### 상왈: 천둥이 와서 소심하다. 위치가 부적절하다.\n\n/3&\n\n&4&\n##### 九四：진수니(震遂泥) 우레는 진흙이 생장한다.\n\n##### 상왈: 천둥이 진흙에 빠진다. 밝지 않다.\n\n/4&\n\n&5&\n##### 六五：진왕래려 억무상 유사(震往來厲，億无喪，有事) 우레가 빠르게 오고간다. 많은것을 잃음이 없다. 일이 있다.\n\n##### 상왈: 천둥이 왔다 갔다 한다. 위험하다. 중정(中正)으로 행한다. 큰 일이 있다.\n\n/5&\n\n&6&\n##### 上六：진색삭 시확확 정흉 진불우기궁 우기린 무구 혼구유언(震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎。婚媾有言) 진은 찾음이다. 쓸쓸함이다. 시는 두리번거림이다. 다급해하는모양이다. 먼길을 가는것은 흉하다. 진은 그몸이 크지않다. 그이웃이 광대하다. 허물없다. 혼구는 맹세의 말이 있다.\n\n##### 상왈: 천둥이 와서 떨고 두려워한다. 위에 있어서 궁(窮)하다. 재앙이 있다. 혼인에 말이 있다. 이웃에 있다.\n\n/6&"},"001001":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/052.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 간(艮)은 멈춤(止)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 끝내는 멈출수없으니 고로 그것을 점(漸)으로 받는다. 점은 나아가는바이다.**","text.tab3":"&0&\n**간위산(艮爲山): 간(艮)은 간기배 불획기신 행기정 불견기인 무구(艮其背，不獲其身，行其庭，不見其人，无咎)**\n**대상 (大象): 겹친 산이다. 艮이다. 군자는 생각이 자신의 지위를 넘어가지 않는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 艮은 머무름이다. 때에 멈추면 멈추고 때에 행하면 행한다. 동정이 그 때를 잃지 않는다. 그 도가 광명하다. 艮이 그 멈춤이다. 그 소에 멈춘다. 위와 아래가 적대하여 응한다. 서로 주고받지 않는다. 이에 그 몸을 얻지 못한다. 그 뜰을 행하되 그 사람을 보지 못한다. 허물이 없다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：간기지 무구 이영정(艮其趾，无咎，利永貞) 그 발이 견고하다. 허물없다. 길고 바르니 이롭다.\n\n##### 상왈: 발에 멈춘다. 뜻이 행해지지 않는다.\n\n/1&\n\n&2&\n##### 六二：간기비 불증기수 기심불쾌(艮其腓，不拯其隨，其心不快) 그 장딴지가  어긋난다.  그 발꿈치를 돕지못한다. 그 마음이 불쾌하다.\n\n##### 상왈: 구원하지 않는다. 순종하지 않는다.\n\n/2&\n\n&3&\n##### 九三：간기한 렬기인 려훈심(艮其限，列其夤，厲薰心) 그 끝을 한정한다.  그 잇닿은바를 즐짓다. 향기로운 마음을 힘쓰다.\n\n##### 상왈: 허리에 멈춘다. 위험하다. 마음이 타오른다.\n\n/3&\n\n&4&\n##### 六四：간기신 무구(艮其身，无咎) 그 자신을 견고히하니 허물없다.\n\n##### 상왈: 몸에 멈춘다. 몸에 멈춘다.\n\n/4&\n\n&5&\n##### 六五：간기보 언유서 회망(艮其輔，言有序，悔亡) 간은 그 돕는바이다.  말이 차례가 있다. 잃음이 없다.\n\n##### 상왈: 뺨에 멈춘다. 중정(中正)이다.\n\n/5&\n\n&6&\n##### 上九：조은 길(敦艮，吉) 아로새긴 은이다. 길하다.\n\n##### 상왈: 고상하게 멈춘다. 길하다. 두껍다.\n\n/6&"},"001011":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/053.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 점(漸)은 여자가 남자를 기다려 시집을 가는것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 나아가는것은 반드시 되돌아온다. 이런까닭에 귀매(歸妹)로써 그것을 이어받는다.**","text.tab3":"&0&\n**풍산점(風山漸): 점(漸)  여귀길 이정 (女歸吉，利貞)**\n**대상 (大象): 산 위에 나무가 있다. 漸이다. 군자는 현인의 덕에 거처하여 풍속을 선하게 한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 漸은 나아감이다. 여자가 시집가는 것이 길하다. 나아가 자리를 얻는다. 가면 공이 있다. 바름으로 나아간다. 나라를 바르게 할 수 있다. 그 자리에 강건함이 중앙을 얻는다. 멈추고 유순하다. 움직이되 궁하지 않는다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：홍점우간 소자려 유은 무구(鴻漸于干，小子厲，有言，无咎) 근본에서 점점 성하다. 어린이가 힘쓰니 화기애애하다.\n\n##### 상왈: 작은 아이에게 위험이 있다. 순종한다.\n\n/1&\n\n&2&\n##### 六二：홍점우반 음식간간 길(鴻漸于磐，飲食衎衎，吉) 너럭바위에서 점점 성한다. 음식이 즐겁다. 길하다.\n\n##### 상왈: 음식과 술을 먹고 즐긴다. 불만이 없다.\n\n/2&\n\n&3&\n##### 九三：홍점우륙 부정불복 귀잉불육 흉 이어구(鴻漸于陸，夫征不復，婦孕不育，凶,利御寇) 뭍에서 점점 넓어진다. 대저 먼길을 가니 돌아오지않는다. 여자가 분만하나 기르지못한다. 흉하다. 난리를 제어함이 이롭다.\n\n##### 상왈: 남편이 정벌에 나가 돌아오지 않는다. 떠난다. 아내가 임신하지만 기르지 않는다. 순종하지 않는다. 도적을 방어하는 데는 이롭다. 서로 보호한다.\n\n/3&\n\n&4&\n##### 六四：홍점우목 혹득기각 무구(鴻漸于木，或得其桷，无咎) 나무가 점점 크다. 혹 그 서까래를 얻는다. 허물없다.\n\n##### 상왈: 때로는 그 평평한 가지에 도달한다. 순종한다.\n\n/4&\n\n&5&\n##### 九五：홍점우륙 부삼세불잉 종막지승 길(鴻漸于陵，婦三歲不孕，終莫之勝，吉) 뭍에서 점점 성한다. 여자가 삼년동안 잉태하지 않는다. 끝이없으니 이김에 도달한다. 길하다.\n\n##### 상왈: 끝에는 아무도 이기지 못한다. 뜻이 행해진다.\n\n/5&\n\n&6&\n##### 上九：홍점우규 기우가용위의 길(鴻漸于逵，其羽可用爲儀，吉) 길거리가 점점 넓어진다.  그 깃털이 의전에 쓰일수있다. 길하다.\n\n##### 상왈: 그 깃털을 의식에 사용할 수 있다. 길하다. 바꿀 수 없다.\n\n/6&"},"110100":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/054.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 귀매(歸妹)는 여자의 마무리이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 돌아가는바로써 그것보다 큰일이 없으니 고로 그것을 풍(豐)으로 받는다. 풍은 큰바이다.**","text.tab3":"&0&\n**뇌택귀매(雷澤歸妹): 귀매 정흉 무유리(歸妹   征凶，无攸利)**\n**대상 (大象): 호수 위에 천둥이 있다. 歸妹이다. 군자는 영원한 끝을 알아 실패를 본다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 歸妹는 하늘과 땅의 큰 뜻이다. 하늘과 땅이 교감하지 않으면 만물이 흥하지 않는다. 歸妹는 사람의 끝과 시작이다. 기쁨으로 움직인다. 歸妹하는 바이다. 정벌하면 흉하다. 자리가 마땅하지 않기 때문이다. 이로운 바가 없다. 유순함이 강건함을 타기 때문이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：귀매이제 파능리 정길(歸妹以娣，跛能履，征吉) 손아래누이가 여자로 시집한다. 절룩거림을 겪을수있다. 가니 길하다.\n\n##### 상왈: 절뚝거리는 여자가 절뚝거리며 간다. 뜻이 행해진다.\n\n/1&\n\n&2&\n##### 九二：묘능시 이유인지정(眇能視，利幽人之貞) 보는 눈이 희미할수있다. 사람의 바름이 깊으니 이롭다.\n\n##### 상왈: 정직하면 길하다. 중정(中正)으로 뜻이 행해진다.\n\n/2&\n\n&3&\n##### 六三：귀매이수 반귀이제(歸妹以須，反歸以娣) 시집간 여자가 결국 손아래누이로서 되돌아온다.\n\n##### 상왈: 대신 돌아온다. 위치가 부적절하다.\n\n/3&\n\n&4&\n##### 九四：귀매건기 지귀유시(歸妹愆期，遲歸有時) 귀매기약이 어그러지다. (귀매를) 지체하나 시간은 있다.\n\n##### 상왈: 늦게 시집간다. 뜻이 행해지지 않는다.\n\n/4&\n\n&5&\n##### 六五：제을귀매 기군지몌 불여기제지몌량 월궤망 길(帝乙歸妹，其君之袂，不如其娣之袂良，月几,望，吉) 제을이 누이를 돌려보낸다. 그 임금의 소매가 손아래누이의 소매가 좋은만 같지않다. 달의 왕성하니 바란다. 길하다.\n\n##### 상왈: 그 소매가 그 여동생의 소매보다 아름답지 않다. 중정(中正)이다.\n\n/5&\n\n&6&\n##### 上六：여승광무실 사규양무혈 무유리(女承筐无實，士刲羊无血，无攸利) 광주리에 열매가 없음을 여자가 잇는다. 남자가 흰양을 찌르나 붉은피가 없다. 이로운바가 없다.\n\n##### 상왈: 과일이 없다. 바구니를 들고 있다.\n\n/6&"},"101100":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/055.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 풍(豐)은 많은 연고이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 큰것이 궁하면 반드시 그 거하는바를 잃으니 이런까닭에 여(旅)로써 그것을 이어받는다. 여는 처하는바가없는것이다.**","text.tab3":"&0&\n**뇌화풍(雷火豐): 풍(豐) 형 왕격지 물우 의일중 (亨。王假之，勿憂，宜日中)**\n**대상 (大象): 천둥과 번개가 모두 이른다. 豐이다. 군자는 재판을 명확히 하고 형벌을 신중하게 사용한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 豐은 크다. 밝음으로 움직인다. 그러므로 豐이다. 왕이 이른다. 큰 것을 숭상하기 때문이다. 걱정하지 말라. 마땅히 해가 중천이다. 마땅히 천하를 비춘다. 해가 중천이면 기운다. 달이 가득 차면 이지러진다. 하늘과 땅이 차고 비운다. 때와 함께 소식한다. 하물며 사람이겠는가. 하물며 귀신이겠는가.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：우기배주 수순무구 왕유상(遇其配主，雖旬无咎，往有尚) 그 걸맞은 주인을 만나니 비록 균일함이 허물이 없으나 가는것이 높임이있다.\n\n##### 상왈: 비슷하다. 가면 허물이 없다. 넘어간다.\n\n/1&\n\n&2&\n##### 六二：풍기부 일중견두 왕득의질 유부발약 길(豐其蔀，日中見斗，往得疑疾，有孚發若，吉) 그 덮개가 성하니 대낮에 북두칠성을 본다. 가는것이 괴로울까 의심을 얻는다. 믿는바가 이와같이 발한다. 길하다.\n\n##### 상왈: 의심을 받는다. 뜻이 행해지지 않는다.\n\n/2&\n\n&3&\n##### 九三：풍기패 일중견매 절기우굉 무구(豐其沛，日中見昧，折其右肱，无咎) 만약 비가솓아짐이 성하면 대낮의 어두움을 본다. 그 오른팔뚝을 꺽는다. 허물없다.\n\n##### 상왈: 팔꿈치를 부러뜨린다. 큰 일을 할 수 없다.\n\n/3&\n\n&4&\n##### 九四：풍기부 일중견두 우기이주 길(豐其蔀，日中見斗，遇其夷主，吉) 그 덮게가 성하니 대낮에 북두칠성을 본다. 그 온화한 주인을 만난다. 길하다.\n\n##### 상왈: 정오에 북두칠성을 본다. 위치가 부적절하다. 주인을 만난다. 길하다. 뜻이 행해진다.\n\n/4&\n\n&5&\n##### 六五：래장 유경예 길(來章，有慶譽，吉) 드러나 온다. 경사로운 명예가 있다. 길하다.\n\n##### 상왈: 오는 사람들이 있다. 중정(中正)이다.\n\n/5&\n\n&6&\n##### 上六：풍기악 부기가 규기호 격기무인 삼세불견 흉(豐其屋，蔀其家，窺其戶，闃其无人，三歲不見，凶) 그 휘장이 성하다. 그 집을 덮는다.   그 출입구를 엿본다.  그 사람이 없어 고요하다. 삼년을 보지않는다. 흉하다.\n\n##### 상왈: 그 집을 덮는다. 하늘에 날아간다. 그 문을 엿본다. 조용하다. 스스로 숨는다.\n\n/6&"},"001101":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/056.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 친하여 무리를 돌본다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 고로 그것을 손(巽)으로 받는다. 손은 들어가는것이다.**","text.tab3":"&0&\n**화산려(火山旅): 여 소형 여정길(旅  小亨，旅貞吉)**\n**대상 (大象): 산 위에 불이 있다. 旅이다. 군자는 형벌을 명확하고 신중하게 사용하고 옥에 머물지 않는다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 旅에 작은 것이 형통한다. 유순함이 밖에서 중앙을 얻고 강건함에 순한다. 멈추고 밝음에 아름답다. 이에 작은 것이 형통하고 旅에 바름이 길하다. 旅의 시의가 크도다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：여쇄쇄 사기소취재(旅瑣瑣，斯其所取災) 무리가 자질구레하고 세분하다. 잠시 이미 재앙을 취하는 바이다.\n\n##### 상왈: 여행이 사소하고 비열하다. 뜻이 재앙을 받는다.\n\n/1&\n\n&2&\n##### 六二：여즉차 회기자 득동복정(旅即次，懷其資，得童僕貞) 나그네는 머뭇거림이다. 그 도움을 따른다. 어린벗이 바름을 얻는다.\n\n##### 상왈: 소년을 얻는다. 정직하면 길하다. 끝에는 재앙이 없다.\n\n/2&\n\n&3&\n##### 九三：려분기차 상기동복 정려(旅焚其次，喪其童僕，貞厲) 그 머무름을 불사르고  여행한다. 그 어린벗을 잃는다. 바르나 근심한다.\n\n##### 상왈: 여행자가 여관을 태운다. 또한 슬프다. 소년을 잃는다. 또한 위험하다.\n\n/3&\n\n&4&\n##### 九四：려우처 득기자부 아심불쾌(旅于處，得其資斧，我心不快) 나그네가 처하니 그 돕는 도끼를 얻는다. 내마음이 불쾌하다.\n\n##### 상왈: 여행자가 쉬는 곳에 있다. 재산을 얻는다. 내 마음이 기쁘지 않다. 위치가 부적절하다.\n\n/4&\n\n&5&\n##### 六五：사치일시망 종이예명(射雉一矢亡，終以譽命) 꿩을 쏘니 화살한개를 잃는다. 명예로써 명이 끝난다.\n\n##### 상왈: 결국 명예와 명령을 받는다. 위에서 순종한다.\n\n/5&\n\n&6&\n##### 上九：오분기소 려인선소후호도 상우우역 흉(鳥焚其巢，旅人先笑后號啕。喪牛于易，凶) 까마귀가 그 새집을 넘어뜨린다. 여인(旅人)이 먼저 웃고 뒤에 수다스럽게 떠든다. 바뀜에서 소를 잃는다. 흉하다.\n\n##### 상왈: 새의 둥지가 불에 탄다. 위에 있어서 궁(窮)하다. 소를 잃는다. 어떻게 오래 갈 수 있겠는가.\n\n/6&"},"011011":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/057.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 손(巽)은 엎드림(伏)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 들어간 연후에 그것이 기뻐하니 이런까닭에 태(兌)로써 그것을 이어받는다. 태는 말하는것이다.**","text.tab3":"&0&\n**손위풍(巽爲風): 손 소형 이유왕 이견대인(巽  小亨，利攸往，利見大人)**\n**대상 (大象): 바람을 따르는 것이다. 巽이다. 군자는 명령을 신중히 하여 일을 시행한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 거듭된 巽으로 명을 펼친다. 강건함이 중앙과 바름에 유순하다. 이에 뜻이 행한다. 유순함이 모두 강건함에 순한다. 이에 작은 것이 형통한다. 가는 것이 이롭다. 대인을 만남이 이롭다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：진퇴 이무인지정(進退，利,武人之貞) 진퇴는 이롭다. 무인의 바름이다.\n\n##### 상왈: 진입과 퇴각에 결정을 내린다. 뜻이 행해지지 않는다.\n\n/1&\n\n&2&\n##### 九二：손재상하 용사무분약 길무구(巽在牀下，用史巫紛若，吉无咎) 손은 평상의아래에 있다. 무인이 역사를 행함은 번거로움같다. 길하고 허물이없다.\n\n##### 상왈: 침상 아래에서 진입한다. 중정(中正)이다.\n\n/2&\n\n&3&\n##### 九三：빈손 린(頻巽，吝) 급히 공순하다. 인색하다.\n\n##### 상왈: 반복적으로 진입한다. 뜻이 궁(窮)하다.\n\n/3&\n\n&4&\n##### 六四：회무 전획삼품(悔亡，田獲三品) 후회가 없다. 전에서 삼품을 얻는다.\n\n##### 상왈: 후회가 사라진다. 뜻이 행해진다.\n\n/4&\n\n&5&\n##### 九五：정길회무 무불리 무초유종 선경삼일 후경삼일 길(貞吉悔亡，无不利。无初有終，先庚三日，后庚三日，吉) 바르고 길하다. 후회가 없다. 이롭지않은바가 없다. 처음은없고 끝은 있다. 삼일 먼저 바뀌고 삼일 뒤에 바뀐다. 길하다.\n\n##### 상왈: 정직하면 길하다. 중정(中正)으로 뜻이 행해진다.\n\n/5&\n\n&6&\n##### 上九：손재상하 상기자부 정흉(巽在牀下，喪其資斧，貞凶) 평상아래에서 공순하다. 그 취한 도끼를 잃는다. 바르나 흉하다.\n\n##### 상왈: 침상 아래에서 진입한다. 위에 있어서 궁(窮)하다. 재산을 잃는다. 정직하면 흉하다. 정(正)을 잃는다.\n\n/6&"},"110110":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/058.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 태(兌)는 보이는것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 말하는것은 연후에 그것이 흩어지는바이니 고로 그것을 환(渙)으로 받는다. 환은 떠나는것이다.**","text.tab3":"&0&\n**태위택(兌爲澤): 태   형 이정(兌   亨，利貞)**\n**대상 (大象): 아름다운 호수이다. 兌이다. 군자는 벗과 함께 배우고 토론한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 兌는 기쁨이다. 강건함이 중앙에 있고 유순함이 밖에 있다. 기쁨으로 바름이 이롭다. 이에 하늘에 순하고 사람에게 응한다. 기쁨으로 백성을 앞선다. 백성이 그 수고를 잊는다. 기쁨으로 어려움을 범한다. 백성이 그 죽음을 잊는다. 기쁨의 큼이여. 백성이 권면하도다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：화태 길(和兌，吉) 어울려 기쁘니 길하다.\n\n##### 상왈: 조화로운 기쁨. 길하다. 행동이 의심스럽지 않다.\n\n/1&\n\n&2&\n##### 九二：부태 길 회무(孚兌，吉，悔亡) 통함을 믿는다. 길하다. 후회가 없다.\n\n##### 상왈: 믿음이 있는 기쁨. 길하다. 뜻이 행해진다.\n\n/2&\n\n&3&\n##### 六三：래태 흉(來兌，凶) 오니 기쁘다. 흉하다.\n\n##### 상왈: 들어오는 기쁨. 흉하다. 위치가 부적절하다.\n\n/3&\n\n&4&\n##### 九四：상태 미녕 개질유희(商兌，未寧，介疾有喜) 헤아리니 기쁘다. 아직 편안하지못하다. 빨리 사이에 드니 즐거움이 있다.\n\n##### 상왈: 기쁨에 대해 상담한다. 큰 복을 받는다.\n\n/4&\n\n&5&\n##### 九五：부우박 유려(孚于剝，有厲) 벗김에서 믿는다. 힘씀이 있다.\n\n##### 상왈: 믿음이 있는 사람을 찢는다. 위치가 중정(中正)이다.\n\n/5&\n\n&6&\n##### 上六：인태(引兌) 기쁨을 이끈다.\n\n##### 상왈: 기쁨을 끌어들인다. 위에 있어서 밝지 않다.\n\n/6&"},"010011":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/059.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 환(渙)은 먼(離)것이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 끝내는 떠나 헤어질수밖에없으니 이런까닭에 절(節)로써 그것을 이어받는다. 절은 그것을 믿는것이다.**","text.tab3":"&0&\n**풍수환(風水渙): 환(渙)   형 왕가유묘 이섭대천 이정(亨。王假有廟，利涉大川，利貞)**\n**대상 (大象): 바람이 물 위에 행한다. 渙이다. 선왕이 하느님에게 제사하여 사당을 세운다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 渙이 형통한다. 강건함이 와서 궁하지 않다. 유순함이 밖에서 자리를 얻고 위와 같다. 왕이 묘당에 이른다. 왕이 이에 중앙에 있다. 큰 강을 건너는 것이 이롭다. 나무를 타면 공이 있다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：용증마장 길(用拯馬壯，吉) 건장한 말을 취함을 쓴다. 길하다.\n\n##### 상왈: 구원에 말을 사용한다. 순종한다.\n\n/1&\n\n&2&\n##### 九二：환분기궤 회망(渙奔其机，悔亡) 그 책상을 급히 흐트린다. 잃음을 후회한다.\n\n##### 상왈: 분산이 벤치로 달려간다. 뜻이 행해진다.\n\n/2&\n\n&3&\n##### 六三：환기궁 무회(渙其躬，无悔) 그 몸을 흐트리니 후회가 없다.\n\n##### 상왈: 분산이 그 몸에 달려간다. 뜻이 밖에 있다.\n\n/3&\n\n&4&\n##### 六四：환기군 원길 환유구 비이소아(渙其群，元吉。渙有丘，匪夷所思) 그 무리를 흐트리니 원래 길하다.  언던이있어 흩어진다. 비적이 생각하는바가있다.\n\n##### 상왈: 분산이 그 무리로 달려간다. 원형이정(元吉). 큰 공이 있다.\n\n/4&\n\n&5&\n##### 九五：환한기대호 환왕거 무구(渙汗其大號，渙王居，无咎) 그 큰 부르짖음에 땀을 흘린다. 왕이 거함을 흐트린다. 허물없다.\n\n##### 상왈: 왕의 거처로 달려간다. 중정(中正)이다.\n\n/5&\n\n&6&\n##### 上九：환기혈 거적출 무구(渙其血，去逖出，无咎) 그 피를 흘린다. 멀리 떠나가니 허물이 없다.\n\n##### 상왈: 분산이 그 피로 달려간다. 멀리 떠난다. 재앙을 피한다.\n\n/6&"},"110010":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/060.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 절(節) 지(止)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 고로 그것을 중부(中孚)로 받는다.**","text.tab3":"&0&\n**수택절(水澤節): 절(節) 형 고절부가정(亨。苦節不可貞)**\n**대상 (大象): 호수 위에 물이 있다. 節이다. 군자는 수와 도를 제정하고 덕행을 논의한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 節이 형통한다. 강건함과 유순함이 나뉘고 강건함이 중앙을 얻는다. 苦節은 바를 수 없다. 그 도가 궁하기 때문이다. 기쁨으로 위험을 행한다. 자리에 마땅하여 절도로 한다. 중앙과 바름으로 통한다. 하늘과 땅이 절도가 있어 사시가 이루어진다. 절도로 제도를 만든다. 재물을 해치지 않는다. 백성을 해치지 않는다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：불출호정 무구(不出戶庭，无咎) 집뜰로 나아가지않는다. 허물없다.\n\n##### 상왈: 문 밖에서 절제하지 않는다. 뜻이 행해지지 않는다.\n\n/1&\n\n&2&\n##### 九二：불출문정 흉(不出門庭，凶) 문뜰로 나아가지않는다. 흉하다.\n\n##### 상왈: 문 안에서 절제하지 않는다. 흉하다. 때를 잃는다.\n\n/2&\n\n&3&\n##### 六三：불절약 즉수약 무구(不節若，則嗟若，无咎) 절제하지않음같다. 즉 부끄러움같다. 허물없다.\n\n##### 상왈: 절제하지 않으면 한숨을 쉰다. 누가 허물이 있겠는가?\n\n/3&\n\n&4&\n##### 六四：안절 형(安節，亨) 평안함을 절제한다. 형통하다.\n\n##### 상왈: 편안히 절제한다. 중정(中正)으로 순종한다.\n\n/4&\n\n&5&\n##### 九五：감절 길 왕유상(甘節，吉,往有尚) 만족함을 절제한다. 길하다. 가는바가 높다.\n\n##### 상왈: 달콤하게 절제한다. 길하다. 중정(中正)으로 행한다.\n\n/5&\n\n&6&\n##### 上六：고절 정흉 회망(苦節，貞凶，悔亡) 괴로움을 절제한다. 바르나 흉하다. 잃음을 후회한다.\n\n##### 상왈: 쓰게 절제한다. 정직하면 흉하다. 도가 궁(窮)하다.\n\n/6&"},"110011":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/061.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 중부(中孚)는 신(信)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 그 믿는바가있다는것은 반드시 그 행함이 있다. 이런까닭에 소과(小過)로써 그것을 이어받는다.**","text.tab3":"&0&\n**풍택중부(風澤中孚): 중부(中孚)   돈어길 이섭대천 이정(豚魚吉，利涉大川，利貞)**\n**대상 (大象): 호수 위에 바람이 있다. 中孚이다. 군자는 옥사를 논의하고 형벌을 늦춘다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 中孚는 유순함이 안에 있고 강건함이 중앙을 얻는다. 기쁘고 유순하다. 신의이다. 이에 나라를 감화한다. 돼지와 물고기에게 길하다. 신의가 돼지와 물고기에게 미친다. 큰 강을 건너는 것이 이롭다. 나무 배가 비어 있기 때문이다. 中孚로 바름이 이롭다. 이에 하늘에 응한다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：우길 유타 불연(虞吉，有他, 不燕) 길함을 염려하다. 타인이있다. 편안하지않다.\n\n##### 상왈: 안정을 기다린다. 길하다. 뜻이 행해지지 않는다.\n\n/1&\n\n&2&\n##### 九二：명학재음 기자화지 아유호작 오여이미지(鳴鶴在陰，其子和之，我有好爵，吾與爾靡之) 우는학이 그늘에 있다. 그 아이가 서로 응하여 간다. 내가 지위를 좋아함이 있다. 우리가 너와 더불어 가는것을 금지한다.\n\n##### 상왈: 그 새끼가 응답한다. 중심이 기뻐한다.\n\n/2&\n\n&3&\n##### 六三：득적 혹고혹파 혹읍혹가(得敵，或鼓或罷，或泣或歌) 적을 얻는다. 혹 휘두르고 혹 내치고 혹 울고 혹 노래부른다.\n\n##### 상왈: 때로는 북을 치고 때로는 그만둔다. 위치가 부적절하다.\n\n/3&\n\n&4&\n##### 六四：월궤망 마필망 무구(月几望，馬匹亡，无咎) 달이 왕성하니 바란다. 말의 짝이 없다. 허물이없다.\n\n##### 상왈: 말이 떨어지고. 위에서 순종한다.\n\n/4&\n\n&5&\n##### 九五：유부련여 무구(有孚攣如，无咎) 걸림같이 믿는바가있다. 허물없다.\n\n##### 상왈: 믿음이 있는 사람을 묶는다. 중정(中正)으로 뜻이 행해진다.\n\n/5&\n\n&6&\n##### 上九：한음등우천 정흉(翰音登于天，貞凶) 깨끗하고 높은 소리가 하늘에 오른다. 바르나 흉하다.\n\n##### 상왈: 닭이 하늘에 날아오른다. 어떻게 오래 갈 수 있겠는가.\n\n/6&"},"001100":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/062.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 소과(小過)는 과(過)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 지나침이 있으면 반드시 그치는바가 있다. 고로 그것을 기제(既濟)로 받는다.**","text.tab3":"&0&\n**뇌산소과(雷山小過): 소과(小過) 형 이정 가소사 불가대사 비조유지음 부의 상의하 대길 (亨，利貞，可小事，不可大事。飛鳥遺之音，不宜上宜下，大吉)**\n**대상 (大象): 산 위에 천둥이 있다. 小過이다. 군자는 행동에서 공손함을 지나치게 하고, 장례에서 슬픔을 지나치게 하며, 소비에서 검소함을 지나치게 한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 小過는 작은 것이 지나쳐 형통한다. 지나침으로 바름이 이롭다. 때와 함께 행한다. 유순함이 중앙을 얻는다. 이에 작은 일이 길하다. 강건함이 자리를 잃고 중앙에 있지 않다. 이에 큰일을 할 수 없다. 나는 새의 상이 있다. 나는 새가 남긴 소리이다. 위가 마땅하지 않고 아래가 마땅하다. 크게 길하다. 위가 거스르고 아래가 순하기 때문이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：비조이흉(飛鳥以凶) 새가 날아가니 흉하다.\n\n##### 상왈: 새가 날아가서 흉하다. 어떻게 할 수 있겠는가?\n\n/1&\n\n&2&\n##### 六二：과기조 우기비 불급기군 우기신 무구(過其祖，遇其妣,不及其君，遇其臣,无咎) 지나는길에 할아버지를 들르니 우연히 그 할머니를 만난다. 그 임금과 함께하지않으니 그신하와 조우한다. 허물이없다.\n\n##### 상왈: 그 할아버지에게 만난다. 중정(中正)으로 행할 수 없다.\n\n/2&\n\n&3&\n##### 九三：불과방지 종혹장지 흉(弗過防之，從或戕之，凶) 가서 필적하니 지나치지않다. 좇으니 촉 가서 죽인다. 흉하다.\n\n##### 상왈: 그를 지나치지 않으면 경계한다. 어떻게 오래 갈 수 있겠는가?\n\n/3&\n\n&4&\n##### 九四：무구 불과우지 왕려필계 물용영정(无咎，弗過遇之。往厲必戒，勿用永貞) 허물이없다. 가서만나니 지나치지않다. 가서 힘쓰니 반드시 경계한다. 길게바르니 쓰지말라\n\n##### 상왈: 지나치지 않고 만난다. 위치가 부적절하다. 가면 위험하다. 경계해야 한다. 끝에는 재앙이 있다.\n\n/4&\n\n&5&\n##### 六五：밀운불우 자아서교 공익취피재혈(密雲不雨，自我西郊，公弋取彼在穴) 구름이 밀집하나 비가 내리지않는다. 스스로내가 서쪽 들로간다. 공이 구멍에있는 상대를 빼앗아 취한다.\n\n##### 상왈: 구름이 있지만 비가 없다. 위에 있어서 멈춘다.\n\n/5&\n\n&6&\n##### 上六：불우과지 비조이지 흉 시위재생(弗遇過之，飛鳥離之，凶，是謂災眚) 지나쳐가니 만나지 못한다. 새가날아서 가니 헤어진다. 흉하다. 이것이 소위 재앙이다.\n\n##### 상왈: 지나치지 않고 만난다. 위에 있어서 궁(窮)하다. 재앙이다.\n\n/6&"},"101010":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/063.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 기제(既濟)는 정(定)하고**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 궁하지못한것이다. 이런까닭에 아직 끝나지않음(未濟)으로써 그 끝을 받는것이다.**","text.tab3":"&0&\n**수화기제(水火旣濟): 기제(既濟)  형 소이정 초길종난(亨，小利貞，初吉終亂)**\n**대상 (大象): 물이 불 위에 있다. 既濟이다. 군자는 재난을 생각하고 미리 방비한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 既濟가 형통한다. 작은 것이 형통한다. 바름이 이롭다. 강건함과 유순함이 바르고 자리가 마땅하다. 처음이 길하다. 유순함이 중앙을 얻기 때문이다. 끝에 멈추면 어지럽다. 그 도가 궁하기 때문이다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初九：예기륜 유기미 무구(曳其輪，濡其尾，无咎) 그 바퀴를 끌어당기니 그꼬리가 젖는다. 허물없다\n\n##### 상왈: 그 강을 건넌다. 허물이 없다. 뜻이 행해지지 않는다.\n\n/1&\n\n&2&\n##### 六二：부상기불 물축 칠일득(婦喪其茀，勿逐，七日得) 부인이 그 머리꾸미개를 잃다. 쫓지마라. 칠일에 얻는다.\n\n##### 상왈: 7일 안에 얻는다. 중정(中正)으로 뜻이 행해진다.\n\n/2&\n\n&3&\n##### 九三：고종벌귀방 삼년극지 소인물용(高宗伐鬼方，三年克之，小人勿用) 제사를 높이니 귀신을 사방에서 물리친다. 이김이 삼년간다. 소인은 쓰지마라\n\n##### 상왈: 3년 만에 이긴다. 피곤하다.\n\n/3&\n\n&4&\n##### 六四：수유의녀 종일계(繻有衣袽，終日戒) 명주옷이 해진다. 종일 경계한다.\n\n##### 상왈: 하루 종일 경계한다. 의심한다.\n\n/4&\n\n&5&\n##### 九五：동린살우 불여서린지약제 실수기복(東鄰殺牛，不如西鄰之禴祭，實受其福) 동쪽이웃이 소를 죽이낟. 서쪽이웃의 봄제사같지않다. 실하니 그복을 받는다.\n\n##### 상왈: 동쪽 이웃이 소를 잡는다. 서쪽 이웃의 제사만큼 좋지 않다. 실제로 복을 받는다. 큰 복을 받는다.\n\n/5&\n\n&6&\n##### 上六：유기수 려(濡其首，厲) 그머리를 감으니 염려한다.\n\n##### 상왈: 머리가 젖는다. 어떻게 오래 갈 수 있겠는가.\n\n/6&"},"010101":{"text.tab1":"#### 그림\n![(국립중앙도서관 소장의 《斷易天機》（육효고전 단역천기）)](assets/guatu_pdf/064.jpg)","text.tab2":"#### 잡괘 (雜卦)\n\n**잡괘전 (雜卦傳): 미제(未濟)는 남자의 궁함(窮)이다.**\n\n#### 서괘 (序卦)\n**서괘전 (序卦傳): 사물이 궁하지못한것이다. 이런까닭에 아직 끝나지않음(未濟)으로써 그 끝을 받는것이다.**","text.tab3":"&0&\n**화수미제(火水未濟): 미제(未濟)  형 소호흘제 유기미 무유리( 亨。小狐汔濟，濡其尾，无攸利)**\n**대상 (大象): 불이 물 위에 있다. 未濟이다. 군자는 신중하게 사물을 구분하여 각각의 자리를 정한다.**\n\n/0&\n#### 단전 (彖傳)\n\n**단전 (彖傳): 未濟가 형통한다. 유순함이 중앙을 얻는다. 작은 여우가 거의 건넜다. 아직 중앙을 벗어나지 못했다. 그 꼬리가 젖는다. 이로운 바가 없다. 끝을 계속하지 못하기 때문이다. 비록 자리가 마땅하지 않으나 강건함과 유순함이 응한다.**\n\n#### 효사 (爻辭)\n\n&1&\n##### 初六：유기미 린(濡其尾，吝) 그 꼬리가 젖는다. 곤란하다.\n\n##### 상왈: 그 꼬리를 젖게 한다. 또한 순종하지 않는다.\n\n/1&\n\n&2&\n##### 九二：예기륜 정길(曳其輪，貞吉) 그 바퀴를 끄니 바르고 길하다.\n\n##### 상왈: 정직하면 길하다. 중정(中正)으로 뜻이 행해진다.\n\n/2&\n\n&3&\n##### 六三：미제 정흉 이섭대천(未濟，征凶，利涉大川) 아직 건너니 멀리 나가니 흉하다. 큰강을 건넘이 이롭다.\n\n##### 상왈: 건너지 못한다. 위치가 부적절하다.\n\n/3&\n\n&4&\n##### 九四：정길 회망 진용벌귀방 삼년유상우대국(貞吉，悔亡，震用伐鬼方，三年有賞于大國) 바르니 길하다. 잊음을 후회한다. 위엄을 써서 사방의 귀신을 벌한다. 삼년있어야 대국에서 상준다.\n\n##### 상왈: 정직하면 길하다. 뜻이 행해진다.\n\n/4&\n\n&5&\n##### 六五：정길 무회 군자지광 유부 길(貞吉，无悔，君子之光，有孚，吉) 바르니길하다. 후회없다. 군자의 빛은 믿음에있다. 길하다.\n\n##### 상왈: 군자의 빛이다. 그 빛이 밝다.\n\n/5&\n\n&6&\n##### 上九：유부우음주 무구 유기수 유부실시(有孚于飲酒，无咎，濡其首，有孚失是) 음주에 믿음이있다. 허물없다. 그머리를 감으니 이것을 잃으나 믿음은 있다.\n\n##### 상왈: 믿음이 있는 기쁨. 그 꼬리를 젖게 하지 않는다. 또한 순종한다. 그 머리를 젖게 한다. 어떻게 오래 갈 수 있겠는가.\n\n/6&"}};

/// standalone localStorage utilities ///
const _LS_SAVES = 'yc_saves', _LS_CFG = 'yc_config', _LS_HEX_OV = 'yc_hex_ov', _LS_LAST = 'yc_last';
// 防舊版殘留：所有 localStorage 讀取一律容錯 —— 壞 JSON / 型別不符 → 回傳預設值，不炸 boot
function _lsParse(s, def){ try { return s === null ? def : JSON.parse(s); } catch(e){ return def; } }
function _lsLoadSaves(){
  const s = localStorage.getItem(_LS_SAVES);
  if(s !== null){ const v = _lsParse(s, []); return Array.isArray(v) ? v : []; }
  const _def = _EMBEDDED_SAVES || [];
  localStorage.setItem(_LS_SAVES, JSON.stringify(_def));
  return JSON.parse(JSON.stringify(_def));
}
function _lsSave(entry){ const r=_lsLoadSaves(); r.push(entry); localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsFavo(time,favo){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){x.favo=favo;break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsDelete(time){ localStorage.setItem(_LS_SAVES,JSON.stringify(_lsLoadSaves().filter(r=>r.time!==time))); _srcSetClean('saves',false); }
function _lsSetName(time,name){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){x.name=name;break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
function _lsUpdateRecord(time,changes){ const r=_lsLoadSaves(); for(const x of r) if(x.time===time){Object.assign(x,changes);break;} localStorage.setItem(_LS_SAVES,JSON.stringify(r)); _srcSetClean('saves',false); }
// 內建回退設定（不含 hexagrams），深拷貝。_EMBEDDED_CONFIG 保證存在且為精簡回退形狀
function _cfgFallback(){ const {hexagrams,...fb}=_EMBEDDED_CONFIG; return JSON.parse(JSON.stringify(fb)); }
// 逐鍵合併：儲存的設定蓋在回退上 —— 舊版設定缺新鍵時由回退補齊，不炸 boot
function _lsGetConfig(){
  const stored = _lsParse(localStorage.getItem(_LS_CFG), null);
  const cfg = (stored && typeof stored==='object' && !Array.isArray(stored)) ? stored : {};
  return { ..._cfgFallback(), ...JSON.parse(JSON.stringify(cfg)) };
}
function _lsSaveConfig(cfg){ localStorage.setItem(_LS_CFG,JSON.stringify(cfg)); }
function _lsGetHexOv(){ const v=_lsParse(localStorage.getItem(_LS_HEX_OV), {}); return (v && typeof v==='object' && !Array.isArray(v)) ? v : {}; }
function _lsGetLast(){ return _lsParse(localStorage.getItem(_LS_LAST), null); }
function _lsSaveLast(){ if(currentData) localStorage.setItem(_LS_LAST, JSON.stringify({digits:state.slice(),tab:currentTab})); }
function _lsApplyHexOv(num,field,text){
  const val = field==='ci' ? text.split('\n') : text;
  const ov = _lsGetHexOv(); const k = String(num);
  if(!ov[k]) ov[k]={};
  ov[k][field] = val;
  localStorage.setItem(_LS_HEX_OV, JSON.stringify(ov));
  _srcSetClean(['text.tab1','text.tab2','text.tab3'].includes(field)?'md':'cfg', false);
  _srInvalidate();   // 卦的可搜尋欄位已變動，搜尋索引作廢
}
const _SRC_CANONICAL = {md:'text.md',cfg:'config.json',saves:'saves.json'};
function _esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function _validateCfg(cfg){
  if(typeof cfg !== 'object' || cfg === null || Array.isArray(cfg)) throw new Error('config.json must be a JSON object');
  const ti = cfg.trigrams;
  if(typeof ti !== 'object' || ti === null || Array.isArray(ti)) throw new Error('Missing "trigrams"');
  for(const k of ['000','001','010','011','100','101','110','111']){
    const t = ti[k];
    if(!t) throw new Error(`trigrams missing key "${k}"`);
    if(typeof t.name !== 'string') throw new Error(`trigrams["${k}"] missing "name"`);
    if(t.sym !== undefined && typeof t.sym !== 'string') throw new Error(`trigrams["${k}"] "sym" must be a string`);   // sym 可省（精簡回退無 sym）
    if(typeof t.color!== 'string') throw new Error(`trigrams["${k}"] missing "color"`);
  }
  const tn = cfg.tab_names;
  if(typeof tn !== 'object' || tn === null || Array.isArray(tn)) throw new Error('Missing "tab_names"');
  for(const k of ['tab1','tab2','tab3']){ if(typeof tn[k] !== 'string') throw new Error(`tab_names missing "${k}"`); }
  const sp = cfg.shibo_probs;
  if(typeof sp !== 'object' || sp === null || Array.isArray(sp)) throw new Error('Missing "shibo_probs"');
  const bin = sp.binary;
  if(typeof bin !== 'object' || bin === null || Array.isArray(bin)) throw new Error('shibo_probs missing "binary"');
  for(const k of ['0','1']){ if(typeof bin[k] !== 'number') throw new Error(`shibo_probs.binary missing key "${k}"`); }
  const quat = sp.quaternary;
  if(typeof quat !== 'object' || quat === null || Array.isArray(quat)) throw new Error('shibo_probs missing "quaternary"');
  for(const k of ['6','7','8','9']){ if(typeof quat[k] !== 'number') throw new Error(`shibo_probs.quaternary missing key "${k}"`); }
  // `fallback` / `table` 皆可選；有才驗證（缺省回退 DEFAULT_HIGHLIGHT）
  if(cfg.lit_mode !== undefined && typeof cfg.lit_mode !== 'string')
    throw new Error('"lit_mode" must be a string');
  if(cfg.table !== undefined && (typeof cfg.table !== 'object' || cfg.table === null || Array.isArray(cfg.table)))
    throw new Error('"table" must be an object');
}
function _srcStatus(){
  const def = {md:{clean:false,file:null},cfg:{clean:false,file:null},saves:{clean:false,file:null}};
  try{
    const raw = JSON.parse(localStorage.getItem('yc_src_status')||'{}');
    for(const t of ['md','cfg','saves']){
      if(raw[t]!=null) def[t] = typeof raw[t]==='boolean' ? {clean:raw[t],file:null} : Object.assign(def[t],raw[t]);
    }
  }catch(e){}
  return def;
}
function _srcSetClean(type,clean,file){
  const s=_srcStatus();
  if(clean){
    const d=new Date();
    const mm=String(d.getMonth()+1).padStart(2,'0');
    const dd=String(d.getDate()).padStart(2,'0');
    const hh=String(d.getHours()).padStart(2,'0');
    const mi=String(d.getMinutes()).padStart(2,'0');
    const yr=d.getFullYear();
    const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dateStr=LANG==='en'?`${hh}:${mi} ${dd}/${MON[d.getMonth()]}/${yr}`:`${yr}-${mm}-${dd} ${hh}:${mi}`;
    s[type]={clean,file:file||null,date:dateStr};
  } else {
    s[type]={clean,file:null,date:null};
  }
  localStorage.setItem('yc_src_status',JSON.stringify(s)); _srcRender();
}
function _srcRender(){
  const s=_srcStatus();
  ['md','cfg','saves'].forEach(t=>{
    document.querySelectorAll(`[data-src="${t}"]`).forEach(el=>{
      const st=s[t]; el.classList.toggle('source-label--loaded',!!st.clean);
      if(el.hasAttribute('data-i18n'))
        el.innerHTML=(st.clean&&st.file)?_SRC_CANONICAL[t]+':<br>'+(st.file.length>20?st.file.slice(0,20)+'…':st.file)+(st.date?'<br>'+st.date:''):T(el.dataset.i18n);
    });
  });
}

function _positionShiboBadge(){
  const badge = document.getElementById('shiboNameBadge');
  const btn = document.getElementById('btnShibo');
  const r = btn.getBoundingClientRect();
  const bw = badge.offsetWidth || 60, bh = badge.offsetHeight || 20;
  const GAP = 7, MARGIN = 4;
  const vp = window.visualViewport ? {w:window.visualViewport.width,h:window.visualViewport.height,ox:window.visualViewport.offsetLeft,oy:window.visualViewport.offsetTop} : {w:window.innerWidth,h:window.innerHeight,ox:0,oy:0};
  let x = r.left - vp.ox + r.width/2 - bw/2;
  x = Math.max(MARGIN, Math.min(vp.w - bw - MARGIN, x));
  let y = r.bottom - vp.oy + GAP;
  if(y + bh > vp.h - MARGIN) y = r.top - vp.oy - bh - GAP;
  badge.style.left = x + 'px';
  badge.style.top  = y + 'px';
}

// 歷史記錄 dropdown 操作
let _saveRecords = [];
/// 搜尋 dropdown（#saveDropdownUp）///

// 比對優先序：卦號 > 卦名 > 爻列 > 卦符 > 簡稱 > 卦爻辭 >> tab1 > tab2 > tab3
const _SR_FIELDS = ['num','name','sequence','symbol','short_name','ci','text.tab1','text.tab2','text.tab3'];
const _SR_MAX = 64;   // 最多顯示的建議數
const _SR_PAD = 18;   // 摘要中比對位置前後保留的字元數
let _srIndex = null;  // 延遲建立：只有真的搜尋時才掃描
let _srTblIndex = null;  // table.text 的獨立索引（見 _srTblBuild）
let _srResults = [];
let _srSel = -1;

// 去除 markdown 標記，讓摘要顯示為純文字
function _srStrip(s){
  return String(s)
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')          // 圖片
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')       // 連結
    .replace(/&&([\s\S]+?)\/&/g, '$1')             // && … /&
    .replace(/\{([^|{}]+)\|[^|{}]+\}/g, '$1')      // {底字|注音}
    .replace(/^[&/]\d+&\s*$/gm, '')                // &0& / /0& 爻段標記
    .replace(/^#{1,6}\s*/gm, '')                   // 標題
    .replace(/^>\s?/gm, '')                        // 引言
    .replace(/^•\s*/gm, '')                        // 條列
    .replace(/\*\*/g, '')                          // 粗體標記
    .replace(/\s+/g, ' ')
    .trim();
}

// 建立索引一次（~1ms）；欄位內容變動時以 _srInvalidate() 作廢
function _srBuild(){
  _srIndex = Object.values(_HEX_BY_NUM).map(d => {
    const raw = _SR_FIELDS.map(f => {
      if(f === 'num') return String(d.num);
      if(f === 'ci')  return (Array.isArray(d.ci) ? d.ci.join(' ') : (d.ci || '')).replace(/\s+/g, ' ').trim();
      if(f.startsWith('text.')) return _srStrip(d[f] || '');   // 先去標記，位移才對得上
      return d[f] || '';
    });
    return { d, raw, low: raw.map(s => s.toLowerCase()) };
  });
}
function _srInvalidate(){ _srIndex = null; _srTblIndex = null; }

// table.text 索引。與上面的索引不同，它以「四進制狀態」為單位而非以卦為單位：
// 同一本卦有 64 種狀態，各自可帶一段文字，所以一卦可命中多列。
// 由 HIGHLIGHT.table 取得（即當前 config 的 table），內容變動時同樣走 _srInvalidate()。
function _srTblBuild(){
  const t = (HIGHLIGHT && HIGHLIGHT.table) || null;
  _srTblIndex = [];
  if(!t) return;
  for(const key of Object.keys(t)){
    const txt = _srStrip((t[key] && t[key].text) || '');
    if(txt) _srTblIndex.push({ key, raw: txt, low: txt.toLowerCase() });
  }
}
// 狀態鍵 → 本卦爻列：7/9 為陽，6/8 為陰（索引 0 = 初爻，與 sequence 同序）
const _srBenSeq = key => [...key].map(c => (c === '7' || c === '9') ? '1' : '0').join('');

// 第一輪：每卦只取「最高優先」的一個命中。
// 第二輪：前面沒填滿 _SR_MAX 時，才補 table.text（優先序最低，見 srPick 的載入方式）。
function _srSearch(q){
  if(!q) return [];
  if(!_srIndex) _srBuild();
  const ql = q.toLowerCase();
  const out = [];
  for(const e of _srIndex){
    for(let r = 0; r < _SR_FIELDS.length; r++){
      const pos = e.low[r].indexOf(ql);
      if(pos >= 0){ out.push({ d: e.d, rank: r, pos, text: e.raw[r] }); break; }
    }
  }
  // 同欄位時，越靠前的命中越相關（如卦號 "1" 完全相符排在 "21" 之前）
  out.sort((a, b) => a.rank - b.rank || a.pos - b.pos || a.d.num - b.d.num);
  if(out.length >= _SR_MAX) return out.slice(0, _SR_MAX);
  if(!_srTblIndex) _srTblBuild();
  const tbl = [];
  for(const e of _srTblIndex){
    const pos = e.low.indexOf(ql);
    if(pos >= 0) tbl.push({ tbl: true, key: e.key, d: _HEX_BY_SEQ[_srBenSeq(e.key)] || null, pos, text: e.raw });
  }
  tbl.sort((a, b) => a.pos - b.pos || (a.key < b.key ? -1 : 1));
  return out.concat(tbl).slice(0, _SR_MAX);
}

// 命中位置前後開窗，並標示命中字串
function _srSnippet(text, pos, len){
  const s = Math.max(0, pos - _SR_PAD);
  const e = Math.min(text.length, pos + len + _SR_PAD);
  return (s > 0 ? '…' : '') + _esc(text.slice(s, pos))
       + '<span class="sr-hit">' + _esc(text.slice(pos, pos + len)) + '</span>'
       + _esc(text.slice(pos + len, e)) + (e < text.length ? '…' : '');
}

// 欄位標籤：tab 欄位沿用使用者在 config 自訂的頁籤名稱
function _srFieldLabel(field){
  if(field.startsWith('text.')) return TAB_NAMES[field.slice(5)] || field;
  return T('search.f.' + field);
}

function _srRowsHTML(q){
  if(!q) return `<div class="dd-hint">${_esc(T('search.hint'))}</div>`;
  if(!_srResults.length) return `<div class="sr-none">${_esc(T('search.none'))}</div>`;
  return _srResults.map((r, i) => {
    const field = r.tbl ? null : _SR_FIELDS[r.rank];
    // 卦號/卦名/卦符/簡稱已在標題行顯示，不再重複摘要；爻列、內文與查表才給摘要
    const showSnip = r.tbl || field === 'sequence' || field === 'ci' || field.startsWith('text.');
    const snip = showSnip
      ? `<span class="sr-snip">${_srSnippet(r.text, r.pos, q.length)}</span>` : '';
    // 查表列以狀態為單位，狀態鍵併進欄位標籤顯示（同一本卦可能出現多列）
    const label = r.tbl ? T('search.f.table') + ' ' + r.key : _srFieldLabel(field);
    return `<div class="sr-row${i === _srSel ? ' sel' : ''}" onclick="srPick(${i})">`
         + `<span class="sr-sym">${_esc(r.d ? (r.d.symbol || '') : '?')}</span>`
         + `<span class="sr-main"><span class="sr-head">`
         + `<span class="sr-num">${r.d ? String(r.d.num).padStart(2, '0') : '??'}</span>`
         + `<span class="sr-name">${_esc(r.d ? (r.d.name || '') : '?')}</span>`
         + `<span class="sr-field">${_esc(label)}</span>`
         + `</span>${snip}</span></div>`;
  }).join('');
}

// 重繪建議列表；保留輸入框本身，不動游標
function _srRenderResults(){
  const inp = document.getElementById('srInput');
  const body = document.querySelector('#saveDropdownUp .dd-body');
  if(!inp || !body) return;
  const q = inp.value.trim();
  _srResults = _srSearch(q);
  if(_srSel >= _srResults.length) _srSel = -1;
  body.innerHTML = _srRowsHTML(q);
}

function _srMove(delta){
  if(!_srResults.length) return;
  _srSel = mod(_srSel + delta, _srResults.length);
  const body = document.querySelector('#saveDropdownUp .dd-body');
  body.querySelectorAll('.sr-row').forEach((el, i) => el.classList.toggle('sel', i === _srSel));
  const sel = body.querySelector('.sr-row.sel');
  if(sel) sel.scrollIntoView({ block: 'nearest' });
}

// 載入所選卦：走 _applyDigits（會自行切換二進制/四進制）
function srPick(i){
  const r = _srResults[i];
  if(!r) return;
  closeSaveDropdown();
  if(stateLocked){ setMsg(T('msg.load_locked'), 'error'); return; }
  // 查表命中對應的是一個完整的四進制狀態，直接載入該狀態（含變爻），
  // 使用者才看得到搜到的那段文字；只載本卦是看不到的。
  // 查表文字顯示在卦象頁，所以載入後切過去。狀態鍵一定是 6/7/8/9，_applyDigits
  // 必然切到 quaternary，卦象頁必然可用，因此這裡放在最後（不必像下面那樣搶在前面）。
  if(r.tbl){ _applyDigits([...r.key].map(Number)); setTab('guaxiang'); flashBtn('btnSearch'); return; }
  const field = _SR_FIELDS[r.rank];
  // 命中在某頁籤的內文 → 先切到該頁籤，讓使用者直接看到搜到的那段文字。
  // 必須在 _applyDigits 之前：其後的 doQuery → applyTabAvailability 會依新卦的
  // 頁籤可用性自動修正（該頁若對新卦不可用，會回退到可用的頁籤）。
  if(field.startsWith('text.')) setTab(field.slice(5));
  _applyDigits([...r.d.sequence].map(Number));
  flashBtn('btnSearch');
}

function renderUpperDropdown(){
  const up = document.getElementById('saveDropdownUp');
  const prev = document.getElementById('srInput');
  const q = prev ? prev.value : '';   // 換語言時保留已輸入的關鍵字
  up.innerHTML = `<div class="dd-title">${_esc(T('dd.search_title'))}</div>`
    + `<div class="dd-search-bar"><input class="dd-up-input" id="srInput" type="text" autocomplete="off" placeholder="${_esc(T('search.placeholder'))}"></div>`
    + `<div class="dd-body"></div>`;
  const inp = document.getElementById('srInput');
  inp.value = q;
  inp.addEventListener('input', () => { _srSel = -1; _srRenderResults(); });
  inp.addEventListener('keydown', e => {
    if(e.key === 'ArrowDown'){ e.preventDefault(); _srMove(1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); _srMove(-1); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(_srResults.length) srPick(_srSel < 0 ? 0 : _srSel); }
    else if(e.key === 'Escape'){ closeSaveDropdown(); }
  });
  _srRenderResults();
}

// 八卦显示 及上下标识更新函数，基于当前 state 或 state_0（取决于 bitRowMode）
function updateTrigrams(){
  const src = bitRowMode==='quaternary' ? state_0 : state;
  const lower=src.slice(0,3).join(""), upper=src.slice(3,6).join("");
  [['upper',upper],['lower',lower]].forEach(([pfx,bits])=>{
    // 缺資料防護：短字串 → '?'，顏色 → var(--c-accent)
    const t = (TRIGRAM_INFO||{})[bits] || {};
    const color = t.color || 'var(--c-accent)';
    const charEl = document.getElementById(pfx+'Char');
    charEl.textContent = t.name ?? '?'; charEl.style.color = color;
    charEl.parentElement.style.setProperty('--tri-color', color);
    const fields = (TAB_FIELDS||{})[currentTab] || [];
    ['Num','Thing'].forEach((id,i)=>{
      const el = document.getElementById(pfx+id);
      el.textContent = t[fields[i]] ?? '?'; el.style.color = color;
    });
  });
}

// binary → quaternary：將 {0,1} 映射為靜爻 {8,7}（陰靜=8 陽靜=7），再派生 state_0/state_1
// quaternary → binary：以 state_0（本卦）還原為 {0,1}
function setBitRowMode(m){
  bitRowMode = m;
  if(m === 'quaternary'){
    for(let i=0;i<6;i++) state[i] = state[i] ? 7 : 8;
    deriveState01();
  } else {
    for(let i=0;i<6;i++) state[i] = state_0[i];
    guaxiangSlots = null;
  }
}

// 統一訊息欄：type 'success'（白色）| 'error'（紅色）| ''（清空）
function setMsg(text, type){

  el.innerHTML = text ? '<span>'+text+'</span>' : '';
}

(function(){
  const el = document.getElementById('msgBox');
  let fadeTimer = null, clearTimer = null;
  function cancelTimers(){ clearTimeout(fadeTimer); clearTimeout(clearTimer); fadeTimer = clearTimer = null; }
  function fitError(){
    el.style.fontSize = '';
    if(!el.textContent.trim()) return;
    let size = 0.85;
    while(el.scrollHeight > el.clientHeight && size > 0.45){
      size = Math.round((size - 0.05) * 100) / 100;
      el.style.fontSize = size + 'rem';
    }
  }
  new MutationObserver(function(){
    cancelTimers();
    el.style.transition = 'none';
    el.classList.remove('msg-fading');
    el.offsetHeight; // force reflow — snaps opacity to 1 instantly
    el.style.transition = '';
    fitError();
    if(!el.textContent.trim()) return;
    fadeTimer = setTimeout(function(){
      el.classList.add('msg-fading');
      clearTimer = setTimeout(function(){
        el.className = 'msg'; // 重置至初始（移除 msg--success/error 及 msg-fading）
        el.textContent = '';
      }, 10000);
    }, 3000);
  }).observe(el, {childList:true, characterData:true, subtree:true});
})();

}

/* ── Markdown 渲染（處理自定義子集：###/####/#####標題、**粗體**、倪曰注釋、漢字序號條目） ── */
function _nameHtml(s){ return String(s ?? '?').replace(/\{([^|{}]+)\|([^|{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>'); }
function renderInline(s){
  return s
    .replace(/&&(.+?)\/&/g,'$1')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\{([^|{}]+)\|([^|{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function renderMD(text, statuses=null){
  if(!text) return '<p class="body-line" style="color:#5a4020;">'+T('content.empty')+'</p>';
  text = text.replace(/&&(.+?)\/&/g,'$1');
  let html = '';
  let inSub = false;
  let sectionOpen = false;
  function closeSub(){ if(inSub){ html += '</div></div>'; inSub=false; } }
  for(const raw of text.split('\n')){
    const line = raw.trim();
    if(!line){ html += '<br>'; continue; }
    if(line === '&N&'){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      if(statuses){
        html += '<div class="ci-section ci-section-dim">';
        sectionOpen = true;
      }
      continue;
    }
    const om = line.match(/^&(\d+)&$/);
    if(om){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      if(statuses){
        const st = statuses[parseInt(om[1])] || 'b';
        html += '<div class="ci-section ci-section-'+st+'">';
        sectionOpen = true;
      }
      continue;
    }
    if(line === '/N&' || /^\/\d+&$/.test(line)){
      if(sectionOpen){ html += '</div>'; sectionOpen = false; }
      continue;
    }
    if(line.startsWith('##### ')){
      html += '<div class="yao-heading">'+renderInline(line.slice(6))+'</div>';
    } else if(line.startsWith('#### ')){
      closeSub();
      const name = line.slice(5).trim();
      const jieAttr = name==='解' ? ' data-jie' : '';
      html += '<div class="sub-section" data-mode="full"'+jieAttr+'>';
      html += '<div class="sub-heading"><span>'+renderInline(name)+'</span>'
            + '<button class="section-toggle" onclick="toggleSection(this)">▼</button></div>';
      html += '<div class="sub-section-body">';
      inSub = true;
    } else if(line.startsWith('### ')){
      closeSub();
      html += '<div class="sec-heading">'+renderInline(line.slice(4))+'</div>';
    } else if(line.startsWith('**') && line.endsWith('**') && line.length > 4){
      html += '<div class="bold-title">'+renderInline(line.slice(2,-2))+'</div>';
    } else if(line.startsWith('> ') || line === '>'){
      const body = line.startsWith('> ') ? line.slice(2) : '';
      html += '<p class="annotation">'+(body.trim() ? renderInline(body) : '&nbsp;')+'</p>';
    } else if(line.startsWith('• ')){
      const rest = line.slice(2);
      const sep = rest.search(/[、.：:]/);
      if(sep !== -1){
        const label = rest.slice(0, sep + 1);
        const body  = rest.slice(sep + 1);
        html += '<div class="content-item"><span class="item-num">'+label+'</span>'+renderInline(body)+'</div>';
      } else {
        html += '<div class="content-item">'+renderInline(rest)+'</div>';
      }
    } else if(/^!\[([^\]]*)\]\(([^)]+)\)$/.test(line)){
      const im = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
      const alt = _esc(im[1]);
      const src = _esc(im[2]);
      const isPdf = /\.pdf(#|$)/i.test(im[2]);
      const media = isPdf
        ? '<p class="media-missing">'+src+'</p><iframe class="md-pdf" src="'+src+'" title="'+alt+'" onload="this.previousElementSibling.style.display=\'none\'"></iframe>'
        : '<img src="'+src+'" alt="'+alt+'" onerror="_mediaErr(this)">';
      html += '<figure class="md-image">'+media
            + (alt ? '<figcaption>'+alt+'</figcaption>' : '')
            + '</figure>';
    } else {
      html += '<p class="body-line">'+renderInline(line)+'</p>';
    }
  }
  closeSub();
  if(sectionOpen) html += '</div>';
  return html;
}



// 計算判定爻點亮：回傳 {s0,s1,n}。s0/s1 各 8 格：[0]=卦辭 [1~6]=初~上爻辭 [7]=用九/用六（乾坤專用）。
// yi=変爻索引（升序），nfi=非変爻索引（升序），n=変爻數。
// 點亮邏輯由 config 決定（見全域 HIGHLIGHT，由 cfg.lit_mode + cfg.table 組成）：
//   每個新 6 位四進位 state → 以其為鍵查 `table` → 命中且帶 primary/secondary（任一，空陣列亦算）
//   → 逐格套用 primary(a)/secondary(b)；否則（含無表、查無、命中但無規則）退回 `lit_mode`
//   指定的預設（'zhuxi7' 朱熹七則（預設）｜'readall' 純讀變爻·全變並重，見 HIGHLIGHT_PRESETS）。
//   `text` 獨立於規則：只要命中表就取用。
// 乾坤全變的 用九/用六 由 _presetWithTail 統一補上（命中表規則時例外：完全由表指定）。
function computeGuaxiangSlots(){
  const yi=[],nfi=[];
  for(let i=0;i<6;i++){
    if(state[i]===6||state[i]===9) yi.push(i);
    else nfi.push(i);
  }
  const n=yi.length;
  let s0, s1, text=null;
  const row = HIGHLIGHT && HIGHLIGHT.table && HIGHLIGHT.table[state.join('')];
  const hasRules = row && (Array.isArray(row.primary) || Array.isArray(row.secondary));
  if(hasRules){
    s0=Array(8).fill('dim'); s1=Array(8).fill('dim');
    (row.primary||[]).forEach(k=>{ if(k>=0&&k<8) s0[k]='a'; });
    (row.secondary||[]).forEach(k=>{ if(k>=0&&k<8) s0[k]='b'; });
  } else {
    ({s0,s1}=_presetWithTail((HIGHLIGHT&&HIGHLIGHT.fallback)||'zhuxi7', yi, nfi, n));   // 無規則（含無表、不在表中）→ 退回 fallback
  }
  text=(row && (row.text||'').trim())||null;   // 正文獨立於規則：於卦象頁 ci 下方以正文格式顯示
  return {s0,s1,n,text};
}

// 內置點亮預設（判定爻規則）。各回傳 {s0,s1}，8 格同上。
// 乾坤全變的第八辭（用九/用六）由 _presetWithTail 統一處理，預設本身不管。
const HIGHLIGHT_PRESETS = {
  // 朱熹七則（大衍變占）：與原邏輯一致，唯 6 變之乾坤特例移至尾巴
  zhuxi7(yi,nfi,n){
    const s0=Array(8).fill('dim'),s1=Array(8).fill('dim');
    if(n===0){ s0[0]='a'; }
    else if(n===1){ s0[1+yi[n-1]]='a'; }
    else if(n===2){ s0[1+yi[n-1]]='a'; s0[1+yi[0]]='b'; }
    else if(n===3){ s0[0]='a'; s1[0]='b'; }
    else if(n===4){ s1[1+nfi[0]]='a'; s1[1+nfi[1]]='b'; }
    else if(n===5){ s1[1+nfi[0]]='a'; }
    else{ s1[0]='a'; }   // 6 變非乾坤 → 之卦卦辭；乾坤由尾巴改為用九/用六
    return {s0,s1};
  },
  // 純讀變爻·全變並重（黃克孫式）：變幾爻點亮幾條本卦爻辭，皆 primary
  readall(yi,nfi,n){
    const s0=Array(8).fill('dim'),s1=Array(8).fill('dim');
    if(n===0){ s0[0]='a'; }
    else if(n>=1&&n<=5){ yi.forEach(i=>{ s0[1+i]='a'; }); }
    else{ s1[0]='a'; }   // 6 變 → 之卦卦辭；乾坤由尾巴改為用九/用六
    return {s0,s1};
  },
};

// 跑預設，再統一補乾坤全變的用九/用六：僅 currentData 有 ci[7] 且六爻全變時，改為只亮 slot 7。
function _presetWithTail(mode, yi, nfi, n){
  const fn = HIGHLIGHT_PRESETS[mode] || HIGHLIGHT_PRESETS.zhuxi7;
  let {s0,s1} = fn(yi,nfi,n);
  if(n===6 && currentData && currentData.ci && currentData.ci[7] && currentData.ci[7].trim()){
    s0=Array(8).fill('dim'); s1=Array(8).fill('dim'); s0[7]='a';
  }
  return {s0,s1};
}

function renderGuaxiang(){
  const el=document.getElementById('contentArea');
  if(!currentData){el.innerHTML='';return;}
  function col(jw,statuses){
    return jw.map((text,i)=>{

      const cls='guaxiang-jw-item guaxiang-jw-'+(statuses?statuses[i]:'b');
      return '<div class="'+cls+'">'+text+'</div>';
    }).join('');
  }
  // 缺 ci 資料 → 與 renderMD 相同的（無内容）行
  const _empty = '<p class="body-line" style="color:#5a4020;">'+T('content.empty')+'</p>';
  function colOrEmpty(jw, statuses){ const s = col(jw||[], statuses); return s || _empty; }
  if(!guaxiangSlots){ el.innerHTML='<div class="guaxiang-col guaxiang-col-single">'+colOrEmpty(currentData.ci,null)+'</div>'; return; }
  const {s0,s1,n,text}=guaxiangSlots;

    ? '<div class="guaxiang-dual-content">'
      +'<div class="guaxiang-col">'+colOrEmpty(currentData.ci,s0)+'</div>'
      +'<div class="guaxiang-col">'+colOrEmpty(currentData1.ci,s1)+'</div>'
      +'</div>'

  // 自定義正文（custom 模式）以與其他頁籤相同的正文格式（renderMD → .body-line），置於 ci 下方，單欄不分割
  const extra = text ? '<div class="guaxiang-text">'+renderMD(text)+'</div>' : '';
  el.innerHTML = ciHtml + extra;
}

// entries: [[tab, enabled], ...]  —— 只更新傳入的頁面，其餘不變
// 若當前頁面被禁用，自動切換到最近可用的；全無則報錯清空內容
function applyTabAvailability(entries){
  for(const [m, enabled] of entries){
    enabled ? tabDisabled.delete(m) : tabDisabled.add(m);
    document.getElementById(TAB_BTN[m]).classList.toggle('tab-disabled', !enabled);
  }
  if(!tabDisabled.has(currentTab)) return;
  const idx = TABS.indexOf(currentTab);
  let fallback = null;
  for(let d = 1; d < TABS.length && !fallback; d++){
    if(idx + d < TABS.length && !tabDisabled.has(TABS[idx + d])) fallback = TABS[idx + d];
    else if(idx - d >= 0     && !tabDisabled.has(TABS[idx - d])) fallback = TABS[idx - d];
  }
  if(fallback){
    setTab(fallback);
  } else {
    setMsg(T('msg.no_tab'), 'error');
    document.getElementById('contentArea').innerHTML = '';
  }
}

// 查詢本卦（及 quaternary 模式下的之卦），更新 currentData/currentData1 並重繪右欄（同步）
function doQuery(){
  if(_editMode) cancelTextEdit();
  hexViewMode = 'original';
  const bits0 = (bitRowMode === 'quaternary' ? state_0 : state).join("");
  document.querySelectorAll('.shibo-lit').forEach(el=>el.classList.remove('shibo-lit'));
  setMsg('', '');
  const d = _HEX_BY_SEQ[bits0];
  if(!d){
    setMsg(T('msg.query_fail', bits0), 'error');
    document.getElementById("hexHeader").closest(".right-panel").classList.add("query-failed");
    return Promise.resolve();
  }
  currentData = d;
  currentData1 = bitRowMode === 'quaternary' ? (_HEX_BY_SEQ[state_1.join("")] || null) : null;

  const numEl = document.getElementById("numDisplay");
  numEl.value = (bitRowMode === 'quaternary' && currentData1 && currentData1.num !== d.num)
    ? d.num + ' -> ' + currentData1.num
    : d.num;

  guaxiangSlots = (bitRowMode === 'quaternary' && currentData)
    ? computeGuaxiangSlots()
    : null;

  document.getElementById("hexHeader").closest(".right-panel").classList.remove("query-failed");
  renderHeader();
  renderContent(d);
  const _qname = d.name + ((currentData1 !== null && currentData1.name && currentData1.name !== d.name) ? ' & ' + currentData1.name : '');
  setMsg(T('msg.query_ok', _qname), 'success');
  updateEditBtn();
  return Promise.resolve();
}

// 加權隨機：依 {值: 權重} 字典抽取一個值
function weightedRandom(weights){
  const entries = Object.entries(weights);
  let r = Math.random() * entries.reduce((s,[,w])=>s+w, 0);
  for(const [val,w] of entries){ r-=w; if(r<=0) return parseInt(val); }
  return parseInt(entries[entries.length-1][0]);
}

let PROB_LABELS = { binary:{}, quaternary:{} };
const _gv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const PROB_COLORS = {
  binary: { '0':_gv('--c-dim'), '1':_gv('--c-gold') },
  quaternary: { '6':_gv('--y6-tx'), '7':_gv('--y7-tx'), '8':_gv('--y8-tx'), '9':_gv('--y9-tx') }
};
const PROB_GLINT_DELAY = { '6':'0s', '7':'1s', '8':'2s', '9':'3s' };
function _probLabel(mode, k){
  const raw = (PROB_LABELS[mode] || {})[k] || k;
  const sym = raw.slice(-1), name = raw.slice(0, -1).trimEnd();
  return `(${k}) ${sym} ${name}`;
}

function fmtPct(v, total){
  if(total <= 0) return '—';
  const pct = v / total * 100;
  const p4 = Number(pct.toPrecision(4));
  return (p4 === pct ? String(pct) : pct.toPrecision(4)) + '%';
}
function pctColor(mode, k){
  return PROB_COLORS[mode][k] || '#c9a84c';
}

function settingsRender(){
  const w = shiboProbWeights || shiboProbDefaults;
  let html = '';
  for(const mode of ['binary','quaternary']){
    const entries = Object.entries((w && typeof w==='object' && w[mode]) || _SHIBO_DEFAULT_PROBS[mode]);
    const total = entries.reduce((s,[,v])=>s+Number(v), 0);
    html += `<div class="prob-section-label" style="display:flex;justify-content:space-between;align-items:center;">
      <span>${mode === 'binary' ? T('settings.mode.binary') : T('settings.mode.quaternary')}</span>
    </div>`;
    for(const [k, v] of entries){
      const rawLabel = PROB_LABELS[mode][k] || k;
      const sym  = rawLabel.slice(-1);
      const name = rawLabel.slice(0, -1).trimEnd();
      const color = pctColor(mode, k);
      const pct = fmtPct(Number(v), total);
      html += `<div class="prob-row">
        <span class="prob-name"><span class="prob-name-key">(${k})</span><span class="prob-name-lbl"> ${_esc(sym)} ${_esc(name)}</span></span>
        <span class="prob-pct-wrap"><span class="prob-pct${mode==='quaternary'?' prob-pct--glint':''}" id="pct_${mode}_${k}" style="color:${color};${mode==='quaternary'?'animation-delay:'+PROB_GLINT_DELAY[k]:''}">${pct}</span></span>
        <span class="prob-frac">${v}/${total}</span>
      </div>`;
    }
  }
  html += `<div class="settings-actions">
    <button class="settings-btn-action" onclick="settingsShowPresets()">${T('btn.preset')}</button>
    <button class="settings-btn-action primary" onclick="settingsClose()">${T('btn.ok')}</button>
  </div>`;
  const _sc = document.getElementById('settingsContent');
  _sc.innerHTML = html;
  fitBtnText(_sc);
}

function _presetRainbowName(name, mode) {
  const palette = mode === 'binary'
    ? [PROB_COLORS.binary['0'], PROB_COLORS.binary['1']]
    : [PROB_COLORS.quaternary['6'], PROB_COLORS.quaternary['7'], PROB_COLORS.quaternary['8'], PROB_COLORS.quaternary['9']];
  return [...name].map((ch, i) =>
    `<span style="color:${palette[i % palette.length]}">${ch}</span>`
  ).join('');
}

function settingsShowPresets() {
  let html = '';
  if (shiboProbPresets.length === 0) {
    html = `<div class="sp-body-text">${T('settings.no_presets')}</div>`;
  } else {
    for (let i = 0; i < shiboProbPresets.length; i++) {
      const p = shiboProbPresets[i];
      const coloredRatio = Object.entries(p.probs)
        .map(([k,v]) => `<span style="color:${pctColor(p.mode,k)}">${v}</span>`)
        .join('<span style="color:var(--c-dim)">:</span>');
      html += `<div class="prob-row" style="align-items:center;">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;">
          <span style="font-size:var(--inp-fsz);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${_esc(p.name)}</span>
          <span class="preset-ratio" style="font-family:monospace;font-size:var(--fs-mono);">${coloredRatio}</span>
        </span>
        <button class="settings-btn-action" style="flex:0 0 28%;min-width:0;" onclick="settingsSelectPreset(${i})">${T('btn.select')}</button>
      </div>`;
    }
  }
  html += `<div class="settings-actions">
    <button class="settings-btn-action" onclick="settingsRender()">${T('btn.return')}</button>
  </div>`;
  const _sc2 = document.getElementById('settingsContent');
  _sc2.innerHTML = html;
  fitBtnText(_sc2);
}

function settingsSelectPreset(idx) {
  const p = shiboProbPresets[idx];
  if (!p) return;
  const w = JSON.parse(JSON.stringify(shiboProbWeights || shiboProbDefaults));
  w[p.mode] = Object.fromEntries(Object.entries(p.probs).map(([k,v])=>[k, Number(v)]));
  shiboProbWeights = w;
  settingsRender();
  setMsg(T('msg.preset_applied', p.name), 'success');
}

function renderSaveDropdown(records){
  _saveRecords = [...records].reverse();
  const dd = document.getElementById('saveDropdown');
  dd.innerHTML = `<div class="dd-title">${_esc(T('dd.history_title'))}</div><div class="dd-body"></div>`;
  const body = dd.querySelector('.dd-body');
  if(!_saveRecords.length){
    body.innerHTML = `<div class="save-dropdown-empty">${T('history.empty')}</div>`;
    return;
  }
  body.innerHTML = _saveRecords.map((rec, i) => {
    const bits = rec.digits;
    const isYarrow = bits.some(b => b > 1);
    const bitsStr = bits.map(b => {
      const c = isYarrow ? (PROB_COLORS.quaternary[String(b)] || '#c9a84c') : (PROB_COLORS.binary[String(b)] || '#c9a84c');
      return `<span style="color:${c}">${b}</span>`;
    }).join('');
    const ts = _relTime(rec.time);
    const favoClass = 'save-favo' + (rec.favo ? ' active' : '');
    return `<div class="save-record${rec.shibo ? ' shibo-lit' : ''}"><span class="save-record-icons"><span class="save-del" onclick="deleteRecord(${i},event)">✖</span><span class="save-edit" onclick="editRecord(${i},event)">✎</span><span class="${favoClass}" onclick="toggleFavo(${i},event)">${rec.favo ? '★' : '☆'}</span></span><span class="save-record-name" onclick="loadSaveRecord(${i})"><span class="save-record-name-inner">${_esc(rec.name||'')}</span></span><span class="save-record-bits" onclick="loadSaveRecord(${i})"><span class="save-record-bits-inner">${bitsStr}</span></span><span class="save-record-time" onclick="loadSaveRecord(${i})">${ts}</span></div>`;
  }).join('');
}

function _relTime(isoStr){
  const s = Math.floor((Date.now() - new Date(isoStr)) / 1000);
  if(s >= 86400 * 365) return T('time.years_ago', Math.floor(s / (86400 * 365)));
  if(s >= 86400)       return T('time.days_ago',  Math.floor(s / 86400));
  if(s >= 3600)        return T('time.hours_ago', Math.floor(s / 3600));
  return T('time.secs_ago', Math.max(0, s));
}

function _recordPreviewHTML(rec){
  const bits = rec.digits;
  const isYarrow = bits.some(b => b > 1);
  const bitsStr = bits.map(b => {
    const c = isYarrow ? (PROB_COLORS.quaternary[String(b)] || '#c9a84c') : (PROB_COLORS.binary[String(b)] || '#c9a84c');
    return `<span style="color:${c}">${b}</span>`;
  }).join(' ');
  const ts = _relTime(rec.time);
  const favoClass = 'save-favo'+(rec.favo?' active':'');
  return `<div class="save-record save-dd-confirm-preview${rec.shibo?' shibo-lit':''}"><span class="save-record-icons"><span class="${favoClass}">${rec.favo?'★':'☆'}</span></span><span class="save-record-name"><span class="save-record-name-inner">${_esc(rec.name||'')}</span></span><span class="save-record-bits"><span class="save-record-bits-inner">${bitsStr}</span></span><span class="save-record-time">${ts}</span></div>`;
}

const PANEL_BOTTOM_MARGIN = 36;
const PANEL_STACKED_H_MARGIN = 20;

const BTN_FS_MIN = 8;
const PANEL_FS_KEYS = new Set(['--fs-ctrl','--fs-msg','--fs-lbl','--fs-mono','--fs-bitToggle','--fs-rec','--fs-time','--char-small','--fs-tip','--inp-fsz','--src-cap-fsz','--sp-pct-sz']);

function applyPanelScale(s) {
  const root = document.documentElement;
  for (const [k, base] of Object.entries(PANEL_SIZES)) {
    const v = PANEL_FS_KEYS.has(k) ? Math.max(base * s, BTN_FS_MIN) : base * s;
    root.style.setProperty(k, v + 'px');
  }
}

function fitLeftPanel() {
  const panel   = document.querySelector('.left-panel');
  const stacked = document.querySelector('.page-layout').classList.contains('stacked');
  panel.style.height = '';
  applyPanelScale(1);
  const rect  = panel.getBoundingClientRect();
  const avail = window.innerHeight - rect.top - PANEL_BOTTOM_MARGIN;
  let s = 1;
  if (stacked) {
    const scaleW = (window.innerWidth - 2 * PANEL_STACKED_H_MARGIN) / BASE_PANEL_W;
    const scaleH = avail / rect.height;
    s = Math.min(scaleW, scaleH);
  } else {
    if (rect.height > avail) s = avail / rect.height;
  }
  if (s !== 1) applyPanelScale(s);
  panel.style.height = avail + 'px';
  fitSourceOverlay();
}

function fitSourceOverlay() {
  const ov = document.getElementById('sourceOverlay');
  for (const k of Object.keys(PANEL_SIZES)) ov.style.removeProperty(k);
  if (!ov.classList.contains('open')) return;
  const avail    = document.querySelector('.left-panel').getBoundingClientRect().height;
  const body     = ov.querySelector('.source-body');
  const overflow = body.scrollHeight - body.offsetHeight;
  if (overflow <= 0) return;
  const s  = avail / (avail + overflow);
  const cs = getComputedStyle(document.documentElement);
  for (const k of Object.keys(PANEL_SIZES)) {
    const v = parseFloat(cs.getPropertyValue(k));
    if (!isNaN(v)) ov.style.setProperty(k, (v * s) + 'px');
  }
}

};

function _hdrVal(k, v) { return HDR_FS_KEYS.has(k) ? Math.max(v, BTN_FS_MIN) : v; }

function fitRightHeader() {
  const root = document.documentElement;

  // ── 第一步：寬度 scale ──
  const panelW = document.querySelector('.right-panel').getBoundingClientRect().width;
  const s_w = Math.min(1, panelW / HDR_BASELINE_WIDTH);
  for (const [k, base] of Object.entries(HDR_SIZES))
    root.style.setProperty(k, _hdrVal(k, base * s_w) + 'px');

  // ── 第二步：高度 scale（header 底部不可超過視窗 1/2）──
  // getBoundingClientRect() 強制 style flush，確保第一步已套用
  const rect = document.getElementById('hexHeader').getBoundingClientRect();
  const budget = window.innerHeight / 2;
  if (rect.bottom > budget && rect.height > 0) {
    // header.top 不受 scale 影響；height 與 s 成正比
    // 目標：rect.top + rect.height × (s_final / s_w) = budget
    const s_final = s_w * (budget - rect.top) / rect.height;
    for (const [k, base] of Object.entries(HDR_SIZES))
      root.style.setProperty(k, _hdrVal(k, base * s_final) + 'px');
  }
}

// 快取左欄右邊界（在無 transform 狀態下量測，避免 transition 中途讀到錯誤值）
let _leftPanelRight = 0;

// 同步 #panelToggle / #panelBack 的 display 和位置
function updateToggle() {
  const layout    = document.querySelector('.page-layout');
  const stacked   = layout.classList.contains('stacked');
  const showRight = layout.classList.contains('show-right');
  const toggle    = document.getElementById('panelToggle');
  const back      = document.getElementById('panelBack');

  toggle.style.display = (stacked && !showRight) ? 'flex' : 'none';
  back.style.display = (stacked && showRight) ? 'flex' : 'none';
  document.body.classList.toggle('stacked-right', stacked && showRight);
  document.body.classList.toggle('stacked-left',  stacked && !showRight);
}

// 根據右欄寬度決定是否啓用 stacked 模式，並更新 toggle 顯示狀態
function fitLayout() {
  const layout = document.querySelector('.page-layout');
  layout.classList.remove('stacked', 'show-right');
  const w = document.querySelector('.right-panel').getBoundingClientRect().width;
  if (w < 200) layout.classList.add('stacked');
  // 在無 transform 狀態下量測並快取左欄右邊界
  _leftPanelRight = document.querySelector('.left-panel').getBoundingClientRect().right;
  updateToggle();
}

const BODY_MOBILE_S = 0.75;

function fitBodyText() {
  const w = window.innerWidth;
  const s = w >= BODY_IPAD_W ? 1
    : Math.max(BODY_MOBILE_S,
        BODY_MOBILE_S + (w - BODY_MOBILE_W) / (BODY_IPAD_W - BODY_MOBILE_W) * (1 - BODY_MOBILE_S));
  const root = document.documentElement;
  for (const [k, base] of Object.entries(BODY_SIZES))
    root.style.setProperty(k, (base * s) + 'px');
}



function fitBtnText(root) {
  (root || document).querySelectorAll('button:not(:has(svg)):not(.no-fit)').forEach(btn => {
    if (!btn.textContent.trim()) return;
    btn.style.fontSize = '';
    btn.style.whiteSpace = '';
    const w = btn.offsetWidth;
    if (!w) return;
    let fs = parseFloat(getComputedStyle(btn).fontSize);
    while (btn.scrollWidth > w + 0.5 && fs > BTN_FS_MIN) {
      fs -= 0.5;
      btn.style.fontSize = fs + 'px';
    }
    if (btn.scrollWidth > w + 0.5 && fs <= BTN_FS_MIN) btn.style.whiteSpace = 'normal';
  });
  (root || document).querySelectorAll('.prob-name').forEach(el => {
    el.style.fontSize = '';
    const row = el.closest('.prob-row');
    if (!row) return;
    let fs = parseFloat(getComputedStyle(el).fontSize);
    const nameW = el.offsetWidth; // fixed 50% of row
    while (el.scrollWidth > nameW + 0.5 && fs > BTN_FS_MIN) {
      fs -= 0.5;
      el.style.fontSize = fs + 'px';
    }
    // beyond font floor, CSS text-overflow:ellipsis on .prob-name-lbl handles the rest
  });
}
